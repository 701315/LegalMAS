  - id: leasing_usage_and_sublease
    name: "Ограничения использования предмета лизинга и условия сублизинга"
    description: >
      Фактографическая проверка наличия в тексте ковенантов по эксплуатации:
      территориальные ограничения, запрет перемещения, целевое использование,
      а также условия сублизинга и необходимость согласия лизингодателя.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "место нахождения"
        - "место эксплуатации"
        - "запрет перемещения"
        - "без согласия лизингодателя"
        - "целевое использование"
        - "только для"
        - "запрещается использовать"
        - "территория эксплуатации"
        - "сублизинг"
        - "с письменного согласия лизингодателя"
        - "запрет сублизинга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)без.*согласия.*лизингодател.*(перемещ|перевоз|вывоз)"
        - "(?i)(место|территория)\\s+эксплуатац"
        - "(?i)сублизинг"
        - "(?i)с\\s+письменн(ого|ым)\\s+согласия\\s+лизингодател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: ограничения использования предмета
        лизинга и условия сублизинга.

        Нормативный ориентир:
        - ст. 8 ФЗ-164 — сублизинг возможен только с письменного согласия лизингодателя
        - ст. 421 ГК РФ — договорные ковенанты по эксплуатации и ограничения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на место / территорию эксплуатации предмета лизинга.
        2. Есть ли запрет перемещения или вывоза предмета из зоны эксплуатации (или за пределы РФ) без согласия Лизингодателя.
        3. Есть ли ограничение по целевому использованию предмета.
        4. Как урегулирован сублизинг (запрет, разрешён с согласия Лизингодателя или без).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай географические зоны, запреты перемещения, цели или условия сублизинга, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status и sublease_regime возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия об использовании (например, в одном пункте
           разрешено свободное перемещение по РФ, а в другом — запрещён выезд за пределы конкретной области),
           используй формулировки из раздела о порядке использования и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга эксплуатируется только на территории г. Москвы.
        Перемещение в другой регион допускается исключительно с письменного
        согласия Лизингодателя. Целевое использование — производство
        металлоконструкций. Сублизинг запрещён."

        Ответ:
        {
          "location_restriction_status": "defined",
          "location_restriction_details": "только на территории г. Москвы",
          "relocation_prohibition_status": "defined",
          "relocation_prohibition_details": "перемещение в другой регион допускается исключительно с письменного согласия Лизингодателя",
          "target_use_status": "defined",
          "target_use_details": "производство металлоконструкций",
          "sublease_status": "defined",
          "sublease_regime": "prohibited",
          "sublease_details": "сублизинг запрещён",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Предмет лизинга эксплуатируется только на территории г. Москвы. Сублизинг запрещён."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель использует предмет лизинга в своей деятельности."

        Ответ:
        {
          "location_restriction_status": "not_defined",
          "location_restriction_details": "Данные не определены",
          "relocation_prohibition_status": "not_defined",
          "relocation_prohibition_details": "Данные не определены",
          "target_use_status": "not_defined",
          "target_use_details": "Данные не определены",
          "sublease_status": "not_defined",
          "sublease_regime": "not_defined",
          "sublease_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о месте / территории эксплуатации предмета лизинга.
        2. Найди прямую цитату о запрете вывоза/перемещения без согласия.
        3. Найди прямую цитату о целевом назначении (использовании).
        4. Найди прямую цитату о сублизинге.
        5. Если прямой цитаты нет — верни "not_defined" в status/regime и "Данные не определены" в details.
           Не подменяй текст общими нормами ФЗ-164.
        6. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "location_restriction_status": "<defined / not_defined>",
          "location_restriction_details": "<текст или 'Данные не определены'>",
          "relocation_prohibition_status": "<defined / not_defined>",
          "relocation_prohibition_details": "<текст или 'Данные не определены'>",
          "target_use_status": "<defined / not_defined>",
          "target_use_details": "<текст или 'Данные не определены'>",
          "sublease_status": "<defined / not_defined>",
          "sublease_regime": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "sublease_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "место нахождения место эксплуатации запрет перемещения без согласия лизингодателя целевое использование только для запрещается использовать территория эксплуатации сублизинг с письменного согласия"
      retrieval_profile: "subletting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "leasing_usage_and_sublease_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга ограничения
        использования предмета: территория, запрет перемещения, целевое
        использование и условия сублизинга.
        Не анализируй график регулярных лизинговых платежей, страхование, ремонт или возврат имущества.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_usage_and_sublease_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (location_restriction_status, relocation_prohibition_status,
              target_use_status, sublease_status, sublease_regime)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - sublease_regime = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. location_restriction_status — "defined" если место / территория
           эксплуатации прямо указаны в договоре, иначе "not_defined".
        2. location_restriction_details — формулировка о территории (месте) эксплуатации.
        3. relocation_prohibition_status — "defined" если запрет перемещения
           или вывоза предмета лизинга без согласия прямо указан, иначе "not_defined".
        4. relocation_prohibition_details — формулировка о запрете перемещения / вывоза.
        5. target_use_status — "defined" если целевое использование прямо указано,
           иначе "not_defined".
        6. target_use_details — формулировка о целевом использовании предмета лизинга.
        7. sublease_status — "defined" если сублизинг прямо урегулирован в тексте,
           иначе "not_defined".
        8. sublease_regime — "prohibited" / "allowed_with_consent" / "allowed" / "not_defined".
        9. sublease_details — формулировка об условиях сублизинга (передачи третьим лицам).

        Разграничение значений для отсутствующих данных:
        - для полей *_status и sublease_regime возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_usage_and_sublease_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", sublease_regime = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай географические зоны, запреты перемещения, цели или условия сублизинга, которых нет в тексте.
        - Не выводи режим сублизинга из ст. 8 ФЗ-164 по умолчанию — фиксируй только то, что прямо написано в договоре.
        - sublease_regime: "prohibited" — сублизинг прямо запрещён в договоре; "allowed_with_consent" — сублизинг допускается исключительно с согласия лизингодателя; "allowed" — сублизинг допускается без дополнительного согласия; "not_defined" — сублизинг прямо не урегулирован в договоре.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые положения о перемещении или сублизинге, используй формулировки из специального раздела об использовании предмета лизинга и приводи оба фрагмента в evidence.
        - Различай: территория, запрет перемещения, целевое использование, сублизинг — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни территории эксплуатации, ни запрета перемещения,
           ни целевого использования, ни условий сублизинга.
           → presence = "missing";
             все *_status = "not_defined";
             sublease_regime = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только территория или только цель.
           Часть темы раскрыта, остальные ковенанты отсутствуют.
           → presence = "present";
             раскрытые *_status = "defined";
             нераскрытые *_status = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте разрешено свободное перемещение по РФ,
           в другом — запрещён выезд за пределы области;
           или разные условия сублизинга.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Сублизинг прямо запрещён или допускается только с согласия.
           В тексте есть однозначная формулировка о режиме сублизинга.
           → presence = "present";
             sublease_status = "defined";
             sublease_regime = "prohibited" / "allowed_with_consent" / "allowed" — по смыслу формулировки;
             sublease_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_usage_and_sublease_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для sublease_regime используй только: "prohibited", "allowed_with_consent", "allowed", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_usage_and_sublease_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по использованию предмета и сублизингу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "location_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус территориального ограничения."
          required: true
          display_in_grid: false
        - name: "location_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Территория эксплуатации"
          description: "Формулировка о месте / территории эксплуатации предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "relocation_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета перемещения."
          required: true
          display_in_grid: false
        - name: "relocation_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет перемещения"
          description: "Формулировка о запрете перемещения или вывоза предмета лизинга без предварительного письменного согласия."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "target_use_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус целевого использования."
          required: true
          display_in_grid: false
        - name: "target_use_details"
          type: "string"
          presentation: "fact"
          label: "Целевое использование"
          description: "Формулировка о целевом назначении использования предмета лизинга."
          required: false
          display_in_grid: false
        - name: "sublease_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования сублизинга."
          required: true
          display_in_grid: false
        - name: "sublease_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          description: "Режим сублизинга."
          required: true
          display_in_grid: false
        - name: "sublease_details"
          type: "string"
          presentation: "fact"
          label: "Сублизинг"
          description: "Формулировка об условиях сублизинга и передаче предмета лизинга во временное пользование третьим лицам (ст. 8 ФЗ-164)."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: leasing_liability_and_penalties
    name: "Ответственность сторон, неустойки и ограничение ответственности в договоре лизинга"
    description: >
      Фактографическая проверка наличия в тексте договора лизинга неустоек
      за просрочку лизинговых платежей, штрафов за нарушения лизингополучателя,
      ответственности лизингодателя и ограничения ответственности сторон.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность сторон"
        - "неустойка"
        - "штраф"
        - "пеня"
        - "возмещение убытков"
        - "ограничение ответственности"
        - "просрочка платежа"
        - "нарушение обязательств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*\\d+.*%"
        - "(?i)ответственност.*сторон"
        - "(?i)возмещен.*убытк"
        - "(?i)пен(и|я).*\\d"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: ответственность сторон и неустойки.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка (пени, штраф)
        - ст. 393, 15 ГК РФ — убытки и их возмещение
        - ст. 400 ГК РФ — ограничение ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка (пени) за просрочку лизинговых платежей.
        2. Есть ли штрафы за иные нарушения лизингополучателя (нецелевое использование,
           непредоставление отчётности, недопуск к осмотру и т.п.).
        3. Есть ли ответственность лизингодателя перед лизингополучателем.
        4. Есть ли ограничение ответственности сторон (лимиты, исключение упущенной выгоды).
        5. Есть ли порядок возмещения убытков.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай проценты неустойки, суммы штрафов или ограничения ответственности, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия об ответственности (например, в одном пункте
           ответственность лизингодателя исключена, а в другом — ограничена суммой аванса),
           используй формулировки из раздела об ответственности сторон и укажи оба фрагмента в evidence.
        7. Различай неустойку за просрочку платежей (пени за каждый день просрочки)
           и штрафы за иные нарушения лизингополучателя (фиксированные суммы за конкретные нарушения).
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку лизинговых платежей — пени 0,1% в день от суммы просроченного
        платежа. За нецелевое использование предмета лизинга — штраф 100 000 рублей.
        Ответственность Лизингодателя ограничена суммой аванса."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,1% в день от суммы просроченного платежа",
          "lessee_breach_penalty_status": "defined",
          "lessee_breach_penalty_details": "штраф 100 000 рублей за нецелевое использование",
          "lessor_liability_status": "not_defined",
          "lessor_liability_details": "Данные не определены",
          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Лизингодателя ограничена суммой аванса",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "За просрочку лизинговых платежей — пени 0,1% в день от суммы просроченного платежа."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Ответственность сторон регулируется применимым законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "lessee_breach_penalty_status": "not_defined",
          "lessee_breach_penalty_details": "Данные не определены",
          "lessor_liability_status": "not_defined",
          "lessor_liability_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке (пенях) за просрочку лизинговых платежей.
        2. Найди прямую цитату о штрафах за иные нарушения лизингополучателя.
        3. Найди прямую цитату об ответственности лизингодателя перед лизингополучателем.
        4. Найди прямую цитату об ограничении ответственности (лимиты, исключение убытков).
        5. Найди прямую цитату о порядке возмещения убытков.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не подменяй текст общими нормами ГК РФ.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "lessee_breach_penalty_status": "<defined / not_defined>",
          "lessee_breach_penalty_details": "<текст или 'Данные не определены'>",
          "lessor_liability_status": "<defined / not_defined>",
          "lessor_liability_details": "<текст или 'Данные не определены'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "damages_procedure_status": "<defined / not_defined>",
          "damages_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность сторон неустойка штраф пени возмещение убытков ограничение ответственности просрочка платежа нарушение обязательств"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
      negative_keywords:
        - "лизинговые платежи как график"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "leasing_liability_and_penalties_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга неустойки,
        штрафы, ответственность лизингодателя, ограничение ответственности
        и порядок возмещения убытков.
        Не анализируй график лизинговых платежей, страхование, ремонт или возврат предмета.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_liability_and_penalties_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (late_payment_penalty_status, lessee_breach_penalty_status,
              lessor_liability_status, liability_cap_status,
              damages_procedure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. late_payment_penalty_status — "defined" если неустойка (пени) за просрочку
           лизинговых платежей прямо указана в тексте, иначе "not_defined".
        2. late_payment_penalty_details — формулировка о неустойке за просрочку платежей
           (процент, период начисления, база расчёта).
        3. lessee_breach_penalty_status — "defined" если штрафы за иные нарушения
           лизингополучателя прямо указаны (нецелевое использование, непредоставление
           отчётности, недопуск к осмотру и т.п.), иначе "not_defined".
        4. lessee_breach_penalty_details — формулировка о штрафах за нарушения лизингополучателя.
        5. lessor_liability_status — "defined" если ответственность лизингодателя
           перед лизингополучателем прямо описана, иначе "not_defined".
        6. lessor_liability_details — формулировка об ответственности лизингодателя.
        7. liability_cap_status — "defined" если ограничение ответственности сторон
           (лимиты, исключение упущенной выгоды, косвенных убытков) прямо указано, иначе "not_defined".
        8. liability_cap_details — формулировка об ограничении ответственности.
        9. damages_procedure_status — "defined" если порядок возмещения убытков
           прямо описан, иначе "not_defined".
        10. damages_procedure_details — формулировка о порядке возмещения убытков.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_liability_and_penalties_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай проценты неустойки, суммы штрафов или ограничения ответственности, которых нет в тексте.
        - Не смешивай неустойку за просрочку платежей с иными штрафами за нарушения лизингополучателя.
        - Не используй null, None, пустые строки ни в одном поле.
        - liability_cap_status = "defined" только если в договоре прямо указано ограничение ответственности (например, «ответственность Лизингодателя ограничена суммой аванса», «стороны не несут ответственности за упущенную выгоду» и т.п.).
        - Если в тексте есть противоречивые условия об ответственности, используй формулировки из специального раздела об ответственности сторон и приводи оба фрагмента в evidence.
        - Различай: неустойка за просрочку платежа, штрафы за иные нарушения, ответственность лизингодателя, ограничение ответственности, порядок убытков — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустойки, ни штрафов, ни ответственности лизингодателя,
           ни ограничения ответственности, ни порядка убытков.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только неустойка за просрочку платежей.
           Есть пени, но нет штрафов за иные нарушения, ответственности лизингодателя,
           ограничения ответственности и порядка убытков.
           → presence = "present";
             late_payment_penalty_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте ответственность лизингодателя исключена,
           в другом — ограничена суммой аванса; или разные проценты неустойки.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Общая ссылка на закон без конкретики.
           В тексте есть фраза «ответственность сторон — по законодательству РФ»
           без конкретных неустоек и штрафов.
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             соответствующие *_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_liability_and_penalties_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_liability_and_penalties_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности и неустойкам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за просрочку платежей."
          required: true
          display_in_grid: false
        - name: "late_payment_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку"
          description: "Формулировка о неустойке (пенях) за просрочку лизинговых платежей."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "lessee_breach_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафов за нарушения лизингополучателя."
          required: true
          display_in_grid: false
        - name: "lessee_breach_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штрафы лизингополучателя"
          description: "Формулировка о штрафах за нарушения лизингополучателя (нецелевое использование, отчётность и т.п.)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "lessor_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности лизингодателя."
          required: true
          display_in_grid: false
        - name: "lessor_liability_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность лизингодателя"
          description: "Формулировка об ответственности лизингодателя перед лизингополучателем."
          required: false
          display_in_grid: false
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничения ответственности."
          required: true
          display_in_grid: false
        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение ответственности"
          description: >
            Формулировка об ограничении ответственности сторон (лимиты, исключение
            упущенной выгоды, косвенных убытков). В лизинге РФ лизингодатели часто
            ограничивают свою ответственность суммой аванса или комиссии.
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "damages_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возмещения убытков."
          required: true
          display_in_grid: false
        - name: "damages_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Возмещение убытков"
          description: "Формулировка о порядке возмещения убытков сторонами."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_early_buyout
    name: "Досрочный выкуп предмета лизинга: условия, уведомление, расчёт выкупной цены"
    description: >
      Фактографическая проверка наличия в тексте договора условий о досрочном
      выкупе предмета лизинга: право на досрочный выкуп, срок уведомления,
      методика расчёта выкупной цены при досрочном выкупе, штрафы за досрочный выкуп.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досрочный выкуп"
        - "выкуп до окончания срока"
        - "уведомление о выкупе"
        - "выкупная цена при досрочном выкупе"
        - "штраф за досрочный выкуп"
        - "право на досрочный выкуп"
        - "ст. 19 ФЗ-164"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн.*выкуп"
        - "(?i)выкуп.*до\\s+окончания"
        - "(?i)уведомлен.*за\\s+\\d+\\s+дн"
        - "(?i)штраф.*досрочн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: условия досрочного выкупа предмета лизинга.

        Нормативный ориентир:
        - ст. 19 ФЗ-164 — право лизингополучателя на досрочный выкуп
        - ст. 624 ГК РФ — выкуп арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое право на досрочный выкуп предмета лизинга.
        2. Какой срок уведомления о досрочном выкупе требуется.
        3. Как рассчитывается выкупная цена при досрочном выкупе.
        4. Есть ли штраф или комиссия за досрочный выкуп.
        5. Есть ли иные условия досрочного выкупа (погашение всей задолженности и т.п.).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай сроки уведомления, формулы расчёта цены, штрафы или комиссии, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия о досрочном выкупе (например, в одном пункте
           выкуп разрешён без штрафа, а в другом — предусмотрена комиссия), используй формулировки
           из специального раздела о выкупе и укажи оба фрагмента в evidence.
        7. Ст. 19 ФЗ-164 даёт право на досрочный выкуп, но договор может устанавливать
           дополнительные условия. Фиксируй только то, что прямо написано в договоре.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель вправе выкупить предмет лизинга досрочно, уведомив
        Лизингодателя за 30 календарных дней. Выкупная цена при досрочном выкупе
        рассчитывается как сумма всех оставшихся платежей. Штраф за досрочный выкуп — 5%
        от выкупной цены."

        Ответ:
        {
          "early_buyout_right_status": "defined",
          "early_buyout_right_details": "Лизингополучатель вправе выкупить предмет лизинга досрочно",
          "notice_period_status": "defined",
          "notice_period_details": "за 30 календарных дней",
          "buyout_price_calculation_status": "defined",
          "buyout_price_calculation_details": "сумма всех оставшихся платежей",
          "early_buyout_penalty_status": "defined",
          "early_buyout_penalty_details": "штраф 5% от выкупной цены",
          "other_conditions_status": "not_defined",
          "other_conditions_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Лизингополучатель вправе выкупить предмет лизинга досрочно, уведомив Лизингодателя за 30 календарных дней."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Выкуп предмета лизинга осуществляется по окончании срока договора."

        Ответ:
        {
          "early_buyout_right_status": "not_defined",
          "early_buyout_right_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "buyout_price_calculation_status": "not_defined",
          "buyout_price_calculation_details": "Данные не определены",
          "early_buyout_penalty_status": "not_defined",
          "early_buyout_penalty_details": "Данные не определены",
          "other_conditions_status": "not_defined",
          "other_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на досрочный выкуп.
        2. Найди прямую цитату о сроке уведомления.
        3. Найди прямую цитату о методике расчёта выкупной цены.
        4. Найди прямую цитату о штрафе / комиссии за досрочный выкуп.
        5. Найди прямую цитату об иных условиях досрочного выкупа.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не подменяй текст нормами ст. 19 ФЗ-164.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "early_buyout_right_status": "<defined / not_defined>",
          "early_buyout_right_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "buyout_price_calculation_status": "<defined / not_defined>",
          "buyout_price_calculation_details": "<текст или 'Данные не определены'>",
          "early_buyout_penalty_status": "<defined / not_defined>",
          "early_buyout_penalty_details": "<текст или 'Данные не определены'>",
          "other_conditions_status": "<defined / not_defined>",
          "other_conditions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досрочный выкуп выкуп до окончания срока уведомление о выкупе выкупная цена при досрочном выкупе штраф за досрочный выкуп право на досрочный выкуп ст. 19 ФЗ-164"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "лизинговые платежи как график"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "leasing_early_buyout_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        досрочного выкупа предмета: право на выкуп, срок уведомления, расчёт
        выкупной цены, штрафы / комиссии и иные условия.
        Не анализируй график регулярных лизинговых платежей, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_early_buyout_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (early_buyout_right_status, notice_period_status,
              buyout_price_calculation_status, early_buyout_penalty_status,
              other_conditions_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. early_buyout_right_status — "defined" если право на досрочный выкуп
           прямо предусмотрено в договоре, иначе "not_defined".
        2. early_buyout_right_details — формулировка о праве на досрочный выкуп.
        3. notice_period_status — "defined" если срок уведомления о досрочном выкупе
           прямо указан, иначе "not_defined".
        4. notice_period_details — формулировка о сроке уведомления (например, за 30 дней).
        5. buyout_price_calculation_status — "defined" если методика расчёта выкупной цены
           при досрочном выкупе прямо описана, иначе "not_defined".
        6. buyout_price_calculation_details — формулировка о расчёте выкупной цены.
        7. early_buyout_penalty_status — "defined" если штраф / комиссия за досрочный
           выкуп прямо указаны, иначе "not_defined".
        8. early_buyout_penalty_details — формулировка о штрафе / комиссии.
        9. other_conditions_status — "defined" если иные условия досрочного выкупа
           прямо описаны (погашение всей задолженности, отсутствие просрочек и т.п.),
           иначе "not_defined".
        10. other_conditions_details — формулировка об иных условиях.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_early_buyout_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай сроки уведомления, формулы расчёта цены, штрафы или комиссии, которых нет в тексте.
        - Ст. 19 ФЗ-164 даёт право на досрочный выкуп, но фиксируй только то, что прямо написано в договоре.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые условия о досрочном выкупе, используй формулировки из специального раздела о выкупе и приводи оба фрагмента в evidence.
        - Различай: право выкупа, срок уведомления, расчёт цены, штраф и иные условия — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на досрочный выкуп, ни срока уведомления,
           ни расчёта цены, ни штрафов, ни иных условий.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указано только право на досрочный выкуп без деталей.
           Есть общая фраза о праве выкупить досрочно, но без срока уведомления,
           формулы цены и штрафов.
           → presence = "present";
             early_buyout_right_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте выкуп разрешён без штрафа, в другом — предусмотрена комиссия;
           или разные сроки уведомления.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Прямое указание на выкуп только в конце срока.
           В тексте указано, что выкуп возможен только по окончании срока договора,
           без упоминания досрочного выкупа.
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             early_buyout_right_status = "not_defined";
             early_buyout_right_details = "Данные не определены";
             остальные соответствующие *_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_early_buyout_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_early_buyout_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по досрочному выкупу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "early_buyout_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на досрочный выкуп."
          required: true
          display_in_grid: false
        - name: "early_buyout_right_details"
          type: "string"
          presentation: "fact"
          label: "Право на досрочный выкуп"
          description: "Формулировка о праве лизингополучателя на досрочный выкуп предмета лизинга (ст. 19 ФЗ-164)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока уведомления о досрочном выкупе."
          required: true
          display_in_grid: false
        - name: "notice_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления о выкупе"
          description: "Срок уведомления лизингодателя о досрочном выкупе (например, за 30 дней)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "buyout_price_calculation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус методики расчёта выкупной цены."
          required: true
          display_in_grid: false
        - name: "buyout_price_calculation_details"
          type: "string"
          presentation: "fact"
          label: "Расчёт выкупной цены"
          description: "Методика расчёта выкупной цены при досрочном выкупе (сумма оставшихся платежей, формула и т.п.)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "early_buyout_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафа / комиссии за досрочный выкуп."
          required: true
          display_in_grid: false
        - name: "early_buyout_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штраф за досрочный выкуп"
          description: "Формулировка о штрафе / комиссии за досрочный выкуп предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "other_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус иных условий досрочного выкупа."
          required: true
          display_in_grid: false
        - name: "other_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Иные условия выкупа"
          description: "Иные условия досрочного выкупа (погашение всей задолженности, отсутствие просрочек и т.п.)."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_payment_modification
    name: "Изменение размера лизинговых платежей: индексация, одностороннее изменение, курсовые разницы"
    description: >
      Фактографическая проверка наличия в тексте договора условий об изменении
      размера лизинговых платежей: право лизингодателя на одностороннее изменение,
      индексация по ИПЦ / иным индексам, изменение при изменении ставки ЦБ,
      курса валюты, налогов и сборов.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение размера платежей"
        - "одностороннее изменение"
        - "индексация лизинговых платежей"
        - "ИПЦ"
        - "индекс потребительских цен"
        - "ставка ЦБ"
        - "ключевая ставка"
        - "курс валюты"
        - "изменение налогов"
        - "НДС"
        - "пересмотр платежей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)односторонн.*измен.*платеж"
        - "(?i)индексаци"
        - "(?i)ИПЦ|индекс\\s+потребительск"
        - "(?i)ставка\\s+ЦБ|ключевая\\s+ставка"
        - "(?i)курс\\s+валют"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: условия изменения размера лизинговых платежей.

        Нормативный ориентир:
        - ст. 28 ФЗ-164 — размер лизинговых платежей
        - ст. 450 ГК РФ — изменение договора
        - ст. 424 ГК РФ — исполнение договора, связанного с предпринимательской деятельностью

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право лизингодателя на одностороннее изменение размера платежей.
        2. Есть ли индексация по ИПЦ или иным индексам.
        3. Есть ли изменение платежей при изменении ставки ЦБ / ключевой ставки.
        4. Есть ли изменение платежей при изменении курса валюты.
        5. Есть ли изменение платежей при изменении налогов и сборов (НДС, налог на имущество).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай проценты индексации, условия изменения или основания, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия об изменении платежей (например, в одном пункте
           индексация предусмотрена, а в другом — платежи фиксированы), используй формулировки
           из раздела о лизинговых платежах и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингодатель вправе в одностороннем порядке изменить размер лизинговых
        платежей при изменении ключевой ставки ЦБ РФ более чем на 2% годовых.
        Индексация платежей по ИПЦ производится ежегодно с коэффициентом 1,05."

        Ответ:
        {
          "unilateral_change_status": "defined",
          "unilateral_change_details": "Лизингодатель вправе в одностороннем порядке изменить размер лизинговых платежей",
          "cpi_indexation_status": "defined",
          "cpi_indexation_details": "индексация по ИПЦ ежегодно с коэффициентом 1,05",
          "central_bank_rate_status": "defined",
          "central_bank_rate_details": "при изменении ключевой ставки ЦБ РФ более чем на 2% годовых",
          "currency_rate_status": "not_defined",
          "currency_rate_details": "Данные не определены",
          "tax_change_status": "not_defined",
          "tax_change_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Лизингодатель вправе в одностороннем порядке изменить размер лизинговых платежей при изменении ключевой ставки ЦБ РФ более чем на 2% годовых."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Размер лизинговых платежей является фиксированным и изменению не подлежит."

        Ответ:
        {
          "unilateral_change_status": "not_defined",
          "unilateral_change_details": "Данные не определены",
          "cpi_indexation_status": "not_defined",
          "cpi_indexation_details": "Данные не определены",
          "central_bank_rate_status": "not_defined",
          "central_bank_rate_details": "Данные не определены",
          "currency_rate_status": "not_defined",
          "currency_rate_details": "Данные не определены",
          "tax_change_status": "not_defined",
          "tax_change_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на одностороннее изменение платежей.
        2. Найди прямую цитату об индексации по ИПЦ.
        3. Найди прямую цитату об изменении при изменении ставки ЦБ.
        4. Найди прямую цитату об изменении при изменении курса валюты.
        5. Найди прямую цитату об изменении при изменении налогов.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не подменяй текст общими нормами ГК РФ.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "unilateral_change_status": "<defined / not_defined>",
          "unilateral_change_details": "<текст или 'Данные не определены'>",
          "cpi_indexation_status": "<defined / not_defined>",
          "cpi_indexation_details": "<текст или 'Данные не определены'>",
          "central_bank_rate_status": "<defined / not_defined>",
          "central_bank_rate_details": "<текст или 'Данные не определены'>",
          "currency_rate_status": "<defined / not_defined>",
          "currency_rate_details": "<текст или 'Данные не определены'>",
          "tax_change_status": "<defined / not_defined>",
          "tax_change_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение размера платежей одностороннее изменение индексация лизинговых платежей ИПЦ индекс потребительских цен ставка ЦБ ключевая ставка курс валюты изменение налогов НДС пересмотр платежей"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "график платежей как таблица"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "leasing_payment_modification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        изменения размера лизинговых платежей: одностороннее изменение, индексация,
        ставка ЦБ, курс валюты, изменение налогов.
        Не анализируй график регулярных платежей, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_payment_modification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (unilateral_change_status, cpi_indexation_status,
              central_bank_rate_status, currency_rate_status,
              tax_change_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. unilateral_change_status — "defined" если право лизингодателя на одностороннее
           изменение размера платежей прямо предусмотрено, иначе "not_defined".
        2. unilateral_change_details — формулировка об одностороннем изменении.
        3. cpi_indexation_status — "defined" если индексация по ИПЦ или иным индексам
           прямо предусмотрена, иначе "not_defined".
        4. cpi_indexation_details — формулировка об индексации (коэффициент, периодичность).
        5. central_bank_rate_status — "defined" если изменение платежей при изменении
           ставки ЦБ / ключевой ставки прямо предусмотрено, иначе "not_defined".
        6. central_bank_rate_details — формулировка об изменении при изменении ставки ЦБ.
        7. currency_rate_status — "defined" если изменение платежей при изменении
           курса валюты прямо предусмотрено, иначе "not_defined".
        8. currency_rate_details — формулировка об изменении при изменении курса валюты.
        9. tax_change_status — "defined" если изменение платежей при изменении налогов
           и сборов (НДС, налог на имущество) прямо предусмотрено, иначе "not_defined".
        10. tax_change_details — формулировка об изменении при изменении налогов.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_payment_modification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай проценты индексации, условия изменения или основания, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые условия об изменении платежей (например, платежи фиксированы vs индексация предусмотрена), используй формулировки из раздела о лизинговых платежах и приводи оба фрагмента в evidence.
        - Различай: одностороннее изменение, индексация, ставка ЦБ, курс валюты, налоги — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одностороннего изменения, ни индексации, ни триггеров
           по ставке ЦБ, курсу валюты или налогам.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указан только один триггер изменения.
           Например, есть индексация по ИПЦ, но нет одностороннего изменения,
           ставки ЦБ, курса валюты и налогов.
           → presence = "present";
             соответствующий *_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте предусмотрена индексация, в другом — платежи фиксированы;
           или разные триггеры пересмотра.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Прямая фиксация размера платежей.
           В договоре прямо указано, что размер платежей фиксирован и изменению
           не подлежит (без оговорок об индексации и пересмотре).
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             все *_status = "not_defined" (триггеры пересмотра не раскрыты);
             все *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_payment_modification_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_payment_modification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изменению размера платежей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "unilateral_change_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на одностороннее изменение платежей."
          required: true
          display_in_grid: false
        - name: "unilateral_change_details"
          type: "string"
          presentation: "fact"
          label: "Одностороннее изменение платежей"
          description: "Формулировка о праве лизингодателя на одностороннее изменение размера лизинговых платежей."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "cpi_indexation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус индексации по ИПЦ."
          required: true
          display_in_grid: false
        - name: "cpi_indexation_details"
          type: "string"
          presentation: "fact"
          label: "Индексация по ИПЦ"
          description: "Формулировка об индексации лизинговых платежей по индексу потребительских цен."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "central_bank_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус изменения при изменении ставки ЦБ."
          required: true
          display_in_grid: false
        - name: "central_bank_rate_details"
          type: "string"
          presentation: "fact"
          label: "Изменение при ставке ЦБ"
          description: "Формулировка об изменении платежей при изменении ключевой ставки ЦБ РФ."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "currency_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус изменения при изменении курса валюты."
          required: true
          display_in_grid: false
        - name: "currency_rate_details"
          type: "string"
          presentation: "fact"
          label: "Изменение при курсе валюты"
          description: "Формулировка об изменении платежей при изменении курса валюты."
          required: false
          display_in_grid: false
        - name: "tax_change_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус изменения при изменении налогов."
          required: true
          display_in_grid: false
        - name: "tax_change_details"
          type: "string"
          presentation: "fact"
          label: "Изменение при изменении налогов"
          description: "Формулировка об изменении платежей при изменении налогов и сборов (НДС, налог на имущество)."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_reporting_and_audit
    name: "Отчётность лизингополучателя и право лизингодателя на аудит / проверки"
    description: >
      Фактографическая проверка наличия в тексте договора условий об отчётности
      лизингополучателя: финансовая отчётность, отчётность о местонахождении предмета,
      отчётность о страховке, право лизингодателя на внеплановые проверки и аудит.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отчётность лизингополучателя"
        - "финансовая отчётность"
        - "ежемесячная отчётность"
        - "местонахождение предмета"
        - "проверка лизингополучателя"
        - "аудит"
        - "внеплановая проверка"
        - "доступ к помещениям"
        - "уведомление о проверке"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отчётн.*лизингополучател"
        - "(?i)финансов.*отчёт"
        - "(?i)проверк.*лизингодател"
        - "(?i)аудит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: отчётность лизингополучателя и право
        лизингодателя на проверки / аудит.

        Нормативный ориентир:
        - ст. 17 ФЗ-164 — обязанности лизингополучателя по содержанию предмета
        - ст. 421 ГК РФ — договорные условия об отчётности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность предоставлять финансовую отчётность.
        2. Есть ли обязанность предоставлять отчётность о местонахождении предмета.
        3. Есть ли обязанность предоставлять отчётность о страховке.
        4. Есть ли право лизингодателя на внеплановые проверки.
        5. Есть ли условия уведомления о проверке.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай виды отчётности, сроки предоставления или условия проверок, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия об отчётности (например, в одном пункте
           отчётность ежемесячная, а в другом — квартальная), используй формулировки
           из раздела об обязанностях лизингополучателя и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель ежемесячно предоставляет финансовую отчётность
        (бухгалтерский баланс, отчёт о прибылях и убытках). Отчётность о
        местонахождении предмета — по запросу Лизингодателя. Лизингодатель
        вправе проводить внеплановые проверки с уведомлением за 3 рабочих дня."

        Ответ:
        {
          "financial_reporting_status": "defined",
          "financial_reporting_details": "ежемесячно предоставляет финансовую отчётность (бухгалтерский баланс, отчёт о прибылях и убытках)",
          "location_reporting_status": "defined",
          "location_reporting_details": "по запросу Лизингодателя",
          "insurance_reporting_status": "not_defined",
          "insurance_reporting_details": "Данные не определены",
          "unscheduled_audit_status": "defined",
          "unscheduled_audit_details": "вправе проводить внеплановые проверки",
          "audit_notice_status": "defined",
          "audit_notice_details": "с уведомлением за 3 рабочих дня",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Лизингополучатель ежемесячно предоставляет финансовую отчётность (бухгалтерский баланс, отчёт о прибылях и убытках)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель использует предмет лизинга в своей деятельности."

        Ответ:
        {
          "financial_reporting_status": "not_defined",
          "financial_reporting_details": "Данные не определены",
          "location_reporting_status": "not_defined",
          "location_reporting_details": "Данные не определены",
          "insurance_reporting_status": "not_defined",
          "insurance_reporting_details": "Данные не определены",
          "unscheduled_audit_status": "not_defined",
          "unscheduled_audit_details": "Данные не определены",
          "audit_notice_status": "not_defined",
          "audit_notice_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности финансовой отчётности.
        2. Найди прямую цитату об отчётности о местонахождении предмета.
        3. Найди прямую цитату об отчётности о страховке.
        4. Найди прямую цитату о праве на внеплановые проверки.
        5. Найди прямую цитату об условиях уведомления о проверке.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не подменяй текст общими нормами ФЗ-164.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "financial_reporting_status": "<defined / not_defined>",
          "financial_reporting_details": "<текст или 'Данные не определены'>",
          "location_reporting_status": "<defined / not_defined>",
          "location_reporting_details": "<текст или 'Данные не определены'>",
          "insurance_reporting_status": "<defined / not_defined>",
          "insurance_reporting_details": "<текст или 'Данные не определены'>",
          "unscheduled_audit_status": "<defined / not_defined>",
          "unscheduled_audit_details": "<текст или 'Данные не определены'>",
          "audit_notice_status": "<defined / not_defined>",
          "audit_notice_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчётность лизингополучателя финансовая отчётность ежемесячная отчётность местонахождение предмета проверка лизингополучателя аудит внеплановая проверка доступ к помещениям уведомление о проверке"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "лизинговые платежи как график"
        - "выкупная цена"
        - "страхование как обязанность"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "leasing_reporting_and_audit_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        об отчётности лизингополучателя и праве лизингодателя на проверки / аудит.
        Не анализируй график лизинговых платежей, страхование как обязанность, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_reporting_and_audit_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (financial_reporting_status, location_reporting_status,
              insurance_reporting_status, unscheduled_audit_status,
              audit_notice_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. financial_reporting_status — "defined" если обязанность предоставлять
           финансовую отчётность прямо предусмотрена, иначе "not_defined".
        2. financial_reporting_details — формулировка о финансовой отчётности.
        3. location_reporting_status — "defined" если обязанность предоставлять
           отчётность о местонахождении предмета прямо предусмотрена, иначе "not_defined".
        4. location_reporting_details — формулировка об отчётности о местонахождении.
        5. insurance_reporting_status — "defined" если обязанность предоставлять
           отчётность о страховке прямо предусмотрена, иначе "not_defined".
        6. insurance_reporting_details — формулировка об отчётности о страховке.
        7. unscheduled_audit_status — "defined" если право лизингодателя на внеплановые
           проверки прямо предусмотрено, иначе "not_defined".
        8. unscheduled_audit_details — формулировка о внеплановых проверках.
        9. audit_notice_status — "defined" если условия уведомления о проверке
           прямо указаны (срок, порядок), иначе "not_defined".
        10. audit_notice_details — формулировка об уведомлении о проверке.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_reporting_and_audit_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай виды отчётности, сроки предоставления или условия проверок, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые условия об отчётности (например, отчётность ежемесячная vs квартальная), используй формулировки из раздела об обязанностях лизингополучателя и приводи оба фрагмента в evidence.
        - Различай: финансовая отчётность, отчётность о местонахождении, отчётность о страховке, право проверки и уведомление о проверке — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанностей по отчётности, ни права на проверки,
           ни условий уведомления.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только часть видов отчётности.
           Например, есть обязанность финансовой отчётности, но нет отчётности
           о местонахождении, страховке и права на внеплановые проверки.
           → presence = "present";
             раскрытые *_status = "defined";
             нераскрытые *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указана разная периодичность отчётности
           (ежемесячная vs квартальная) или разные условия проверок.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Указано только право на проверки без условий уведомления.
           В тексте есть право лизингодателя проводить проверки,
           но не указан срок / порядок уведомления лизингополучателя.
           → presence = "present";
             unscheduled_audit_status = "defined";
             audit_notice_status = "not_defined";
             audit_notice_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_reporting_and_audit_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_reporting_and_audit_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по отчётности и аудиту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "financial_reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности финансовой отчётности."
          required: true
          display_in_grid: false
        - name: "financial_reporting_details"
          type: "string"
          presentation: "fact"
          label: "Финансовая отчётность"
          description: "Формулировка об обязанности лизингополучателя предоставлять финансовую отчётность."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "location_reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отчётности о местонахождении предмета."
          required: true
          display_in_grid: false
        - name: "location_reporting_details"
          type: "string"
          presentation: "fact"
          label: "Отчётность о местонахождении"
          description: "Формулировка об отчётности о местонахождении предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "insurance_reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отчётности о страховке."
          required: true
          display_in_grid: false
        - name: "insurance_reporting_details"
          type: "string"
          presentation: "fact"
          label: "Отчётность о страховке"
          description: "Формулировка об отчётности о страховании предмета лизинга."
          required: false
          display_in_grid: false
        - name: "unscheduled_audit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на внеплановые проверки."
          required: true
          display_in_grid: false
        - name: "unscheduled_audit_details"
          type: "string"
          presentation: "fact"
          label: "Внеплановые проверки"
          description: "Формулировка о праве лизингодателя на внеплановые проверки лизингополучателя."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "audit_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус уведомления о проверке."
          required: true
          display_in_grid: false
        - name: "audit_notice_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление о проверке"
          description: "Формулировка об условиях уведомления лизингополучателя о проверке (срок, порядок)."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_bankruptcy
    name: "Банкротство сторон и продавца: расторжение, возврат предмета, сальдо"
    description: >
      Фактографическая проверка наличия в тексте договора условий о последствиях
      банкротства лизингодателя, лизингополучателя и продавца: право на расторжение,
      возврат предмета, расчёт сальдо при банкротстве, распределение риска
      банкротства продавца.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "наблюдение"
        - "конкурсное производство"
        - "внешнее управление"
        - "расторжение при банкротстве"
        - "отказ от исполнения договора"
        - "ФЗ-127"
        - "ст. 102"
        - "банкротство продавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банкротств|несостоятельност"
        - "(?i)конкурсн(ое|ого)\\s+производств"
        - "(?i)наблюдени|внешн(ее|его)\\s+управлени"
        - "(?i)ст(?:атья|\\.)?\\s*102"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: последствия банкротства сторон
        и продавца для договора лизинга.

        Нормативный ориентир:
        - ст. 102 ФЗ-127 — отказ от исполнения договора в банкротстве
        - п. 35 Обзора судебной практики ВС РФ от 27.10.2021 — изъятие предмета
          при банкротстве лизингополучателя
        - ст. 22 ФЗ-164 — распределение риска неисполнения продавцом

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условия о последствиях банкротства лизингополучателя.
        2. Есть ли условия о последствиях банкротства лизингодателя.
        3. Есть ли право расторгнуть договор при введении процедур банкротства.
        4. Есть ли условия о возврате предмета лизинга при банкротстве.
        5. Есть ли условия о расчёте сальдо в процедуре банкротства.
        6. Есть ли условие о распределении риска банкротства продавца.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай процедуры банкротства, ссылки на статьи или условия расторжения, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия о банкротстве, используй формулировки
           из специального раздела о расторжении / банкротстве и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "При введении в отношении Лизингополучателя процедуры наблюдения или
        конкурсного производства Лизингодатель вправе отказаться от исполнения
        договора и изъять предмет лизинга. При расторжении рассчитывается сальдо
        встречных обязательств с учётом платежей, отнесённых к текущим."

        Ответ:
        {
          "lessee_bankruptcy_status": "defined",
          "lessee_bankruptcy_details": "при введении процедуры наблюдения или конкурсного производства в отношении Лизингополучателя",
          "lessor_bankruptcy_status": "not_defined",
          "lessor_bankruptcy_details": "Данные не определены",
          "termination_right_status": "defined",
          "termination_right_details": "Лизингодатель вправе отказаться от исполнения договора и изъять предмет лизинга",
          "asset_return_status": "defined",
          "asset_return_details": "изъятие предмета лизинга при банкротстве",
          "saldo_bankruptcy_status": "defined",
          "saldo_bankruptcy_details": "расчёт сальдо с учётом платежей, отнесённых к текущим",
          "vendor_bankruptcy_risk_status": "not_defined",
          "vendor_bankruptcy_risk_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "При введении в отношении Лизингополучателя процедуры наблюдения или конкурсного производства Лизингодатель вправе отказаться от исполнения договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор действует до полного исполнения сторонами своих обязательств."

        Ответ:
        {
          "lessee_bankruptcy_status": "not_defined",
          "lessee_bankruptcy_details": "Данные не определены",
          "lessor_bankruptcy_status": "not_defined",
          "lessor_bankruptcy_details": "Данные не определены",
          "termination_right_status": "not_defined",
          "termination_right_details": "Данные не определены",
          "asset_return_status": "not_defined",
          "asset_return_details": "Данные не определены",
          "saldo_bankruptcy_status": "not_defined",
          "saldo_bankruptcy_details": "Данные не определены",
          "vendor_bankruptcy_risk_status": "not_defined",
          "vendor_bankruptcy_risk_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о банкротстве лизингополучателя.
        2. Найди прямую цитату о банкротстве лизингодателя.
        3. Найди прямую цитату о праве расторжения при банкротстве.
        4. Найди прямую цитату о возврате предмета при банкротстве.
        5. Найди прямую цитату о сальдо при банкротстве.
        6. Найди прямую цитату о риске банкротства продавца.
        7. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        8. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "lessee_bankruptcy_status": "<defined / not_defined>",
          "lessee_bankruptcy_details": "<текст или 'Данные не определены'>",
          "lessor_bankruptcy_status": "<defined / not_defined>",
          "lessor_bankruptcy_details": "<текст или 'Данные не определены'>",
          "termination_right_status": "<defined / not_defined>",
          "termination_right_details": "<текст или 'Данные не определены'>",
          "asset_return_status": "<defined / not_defined>",
          "asset_return_details": "<текст или 'Данные не определены'>",
          "saldo_bankruptcy_status": "<defined / not_defined>",
          "saldo_bankruptcy_details": "<текст или 'Данные не определены'>",
          "vendor_bankruptcy_risk_status": "<defined / not_defined>",
          "vendor_bankruptcy_risk_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "банкротство несостоятельность наблюдение конкурсное производство внешнее управление расторжение при банкротстве отказ от исполнения договора ФЗ-127 ст. 102 банкротство продавца"
      retrieval_profile: "event_of_default_check"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - limitations
      negative_keywords:
        - "график платежей как таблица"
        - "предмет лизинга"
        - "страхование"
        - "ремонт"
        - "приёмка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "leasing_bankruptcy_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        о последствиях банкротства сторон и продавца: банкротство лизингополучателя,
        банкротство лизингодателя, право расторжения, возврат предмета, сальдо
        при банкротстве, риск банкротства продавца.
        Не анализируй общие основания расторжения (не связанные с банкротством), страхование, ремонт или приёмку.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_bankruptcy_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lessee_bankruptcy_status, lessor_bankruptcy_status,
              termination_right_status, asset_return_status,
              saldo_bankruptcy_status, vendor_bankruptcy_risk_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. lessee_bankruptcy_status — "defined" если последствия банкротства
           лизингополучателя прямо урегулированы, иначе "not_defined".
        2. lessee_bankruptcy_details — формулировка о банкротстве лизингополучателя.
        3. lessor_bankruptcy_status — "defined" если последствия банкротства
           лизингодателя прямо урегулированы, иначе "not_defined".
        4. lessor_bankruptcy_details — формулировка о банкротстве лизингодателя.
        5. termination_right_status — "defined" если право расторгнуть договор
           при введении процедур банкротства прямо предусмотрено, иначе "not_defined".
        6. termination_right_details — формулировка о праве расторжения.
        7. asset_return_status — "defined" если возврат / изъятие предмета
           при банкротстве прямо предусмотрено, иначе "not_defined".
        8. asset_return_details — формулировка о возврате предмета.
        9. saldo_bankruptcy_status — "defined" если методика расчёта сальдо
           в процедуре банкротства прямо описана, иначе "not_defined".
        10. saldo_bankruptcy_details — формулировка о расчёте сальдо при банкротстве.
        11. vendor_bankruptcy_risk_status — "defined" если распределение риска
            банкротства продавца прямо указано, иначе "not_defined".
        12. vendor_bankruptcy_risk_details — формулировка о риске банкротства продавца.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_bankruptcy_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай процедуры банкротства, ссылки на статьи или условия расторжения, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые условия о банкротстве, используй формулировки из специального раздела о расторжении / банкротстве и приводи оба фрагмента в evidence.
        - Различай: банкротство лизингополучателя, банкротство лизингодателя, право расторжения, возврат предмета, расчёт сальдо, риск банкротства продавца — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий о банкротстве сторон, ни права расторжения,
           ни возврата предмета, ни расчёта сальдо, ни распределения риска
           банкротства продавца.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указано только одно последствие банкротства.
           Например, есть только право расторжения при банкротстве
           лизингополучателя без банкротства лизингодателя, возврата, сальдо
           и риска продавца.
           → presence = "present";
             раскрытый *_status = "defined";
             нераскрытые *_status = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные последствия банкротства сторон
           или разные условия расторжения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Прямое исключение ссылок на банкротство или ограничение расторжения.
           В тексте прямо указано, что введение процедур банкротства
           не является основанием для расторжения, либо стороны
           прямо исключают ссылки на ст. 102 ФЗ-127.
           → presence = "present";
             termination_right_status = "defined";
             termination_right_details содержит дословную формулировку об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_bankruptcy_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_bankruptcy_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования последствий банкротства. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lessee_bankruptcy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования банкротства лизингополучателя."
          required: true
          display_in_grid: false
        - name: "lessee_bankruptcy_details"
          type: "string"
          presentation: "fact"
          label: "Банкротство лизингополучателя"
          description: "Формулировка о последствиях банкротства лизингополучателя."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "lessor_bankruptcy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования банкротства лизингодателя."
          required: true
          display_in_grid: false
        - name: "lessor_bankruptcy_details"
          type: "string"
          presentation: "fact"
          label: "Банкротство лизингодателя"
          description: "Формулировка о последствиях банкротства лизингодателя."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "termination_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на расторжение при банкротстве."
          required: true
          display_in_grid: false
        - name: "termination_right_details"
          type: "string"
          presentation: "fact"
          label: "Расторжение при банкротстве"
