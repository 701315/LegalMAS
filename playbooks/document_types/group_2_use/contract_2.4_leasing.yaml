    description: >
      Фактографическая проверка наличия в тексте условий о государственной
      регистрации предмета лизинга: орган регистрации, ответственная сторона,
      срок регистрации, расходы, указание на обременение в пользу лизингодателя.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "регистрация в ГИБДД"
        - "временный учет"
        - "ПТС"
        - "Росреестр"
        - "ЕГРН"
        - "обременение"
        - "расходы на регистрацию"
        - "госпошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ГИБДД|ПТС|СТС"
        - "(?i)Росреестр|ЕГРН"
        - "(?i)обременени"
        - "(?i)госпошлин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: регистрация предмета лизинга
        в уполномоченном органе.

        Нормативный ориентир:
        - ФЗ-218 (Росреестр) — регистрация прав на недвижимость
        - Регламент МВД — регистрация транспортных средств в ГИБДД
        - ФЗ-164 — обременение предмета лизинга

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о регистрации предмета лизинга.
        2. В каком органе регистрируется (ГИБДД / Росреестр / иной).
        3. Кто обязан обеспечить регистрацию.
        4. Есть ли срок регистрации.
        5. Кто несёт расходы на регистрацию и госпошлину.
        6. Есть ли указание на обременение в пользу лизингодателя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Транспортное средство регистрируется в ГИБДД на Лизингополучателя
        с отметкой об обременении в пользу Лизингодателя. Регистрацию
        обеспечивает Лизингополучатель в течение 10 рабочих дней.
        Расходы на регистрацию и госпошлину несёт Лизингополучатель."

        Ответ:
        {
          "registration_required_status": "defined",
          "registration_authority_code": "gibdd",
          "registration_authority_details": "ГИБДД",
          "who_registers_status": "defined",
          "who_registers_details": "Лизингополучатель в течение 10 рабочих дней",
          "registration_deadline_status": "defined",
          "registration_deadline_details": "в течение 10 рабочих дней",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы на регистрацию и госпошлину несёт Лизингополучатель",
          "encumbrance_status": "defined",
          "encumbrance_details": "с отметкой об обременении в пользу Лизингодателя",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Транспортное средство регистрируется в ГИБДД на Лизингополучателя с отметкой об обременении в пользу Лизингодателя."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство."

        Ответ:
        {
          "registration_required_status": "not_defined",
          "registration_authority_code": "not_defined",
          "registration_authority_details": "Данные не определены",
          "who_registers_status": "not_defined",
          "who_registers_details": "Данные не определены",
          "registration_deadline_status": "not_defined",
          "registration_deadline_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "encumbrance_status": "not_defined",
          "encumbrance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности регистрации.
        2. Найди прямую цитату об органе регистрации.
        3. Найди прямую цитату о том, кто регистрирует.
        4. Найди прямую цитату о сроке регистрации.
        5. Найди прямую цитату о расходах на регистрацию.
        6. Найди прямую цитату об обременении.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

