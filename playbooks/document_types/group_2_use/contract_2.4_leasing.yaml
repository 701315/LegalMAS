        severity: hard
        weight: -1.0
        description: "Договор проката — потребительский режим, не финансовая аренда (contract_2.2_rental)"

      - pattern: "(?i)лизинг\\s+для\\s+бытов[ыо]х\\s+нужд"
        severity: hard
        weight: -1.0
        description: "Лизинг для бытовых нужд гражданина ближе к consumer-прокату, не типичный B2B лизинг"

      - pattern: "(?i)безвозмездн[оа]е\\s+пользовани[ея]"
        severity: hard
        weight: -1.0
        description: "Безвозмездное пользование (ссуда) исключает финансовую природу лизинга (contract_2.6_gratuitous_use)"

