        - pattern: "(?i)предмет\\s+лизинг[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Формула 'предмет лизинга' — типоспецифичный маркер"

        - pattern: "(?i)договор\\s+лизинг[ауы]\\s+оборудован[ияи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Лизинг оборудования"

        - pattern: "(?i)договор\\s+автолизинг[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Автолизинг — лизинг транспортных средств"

        - pattern: "(?i)договор\\s+лизинг[ауы]\\s+спецтехник[иуы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Лизинг спецтехники"

        - pattern: "(?i)договор\\s+лизинг[ауы]\\s+недвижимост[иью]"
          weight: 0.95
          distinctiveness: high
