          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Лизингодателя ограничена суммой аванса",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "За просрочку лизинговых платежей — пени 0,1% в день от суммы просроченного платежа."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Ответственность сторон регулируется применимым законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "lessee_breach_penalty_status": "not_defined",
          "lessee_breach_penalty_details": "Данные не определены",
          "lessor_liability_status": "not_defined",
          "lessor_liability_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку платежей.
        2. Найди прямую цитату о штрафах за иные нарушения лизингополучателя.
        3. Найди прямую цитату об ответственности лизингодателя.
        4. Найди прямую цитату об ограничении ответственности.
        5. Найди прямую цитату о порядке возмещения убытков.
        6. Если прямой цитаты нет — верни "not_defined". Не выводи из закона.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "lessee_breach_penalty_status": "<defined / not_defined>",
          "lessee_breach_penalty_details": "<текст или 'Данные не определены'>",
          "lessor_liability_status": "<defined / not_defined>",
