        {
          "registration_required_status": "<defined / not_defined>",
          "registration_authority_code": "<gibdd / rosreestr / other / not_defined>",
          "registration_authority_details": "<текст или 'Данные не определены'>",
          "who_registers_status": "<defined / not_defined>",
          "who_registers_details": "<текст или 'Данные не определены'>",
