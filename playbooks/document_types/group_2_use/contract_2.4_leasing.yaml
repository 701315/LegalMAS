          required: false
          display_in_grid: false
        - name: "saldo_bankruptcy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус расчёта сальдо при банкротстве."
          required: true
          display_in_grid: false
        - name: "saldo_bankruptcy_details"
          type: "string"
          presentation: "fact"
          label: "Сальдо при банкротстве"
          description: "Методика расчёта сальдо при банкротстве (текущие vs реестровые платежи)."
          required: false
          display_in_grid: false
        - name: "vendor_bankruptcy_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения риска банкротства продавца."
          required: true
          display_in_grid: false
        - name: "vendor_bankruptcy_risk_details"
          type: "string"
          presentation: "fact"
          label: "Риск банкротства продавца"
          description: "Формулировка о распределении риска банкротства продавца (ст. 22 ФЗ-164)."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_improvements
    name: "Неотделимые улучшения предмета лизинга: согласие, возмещение, учёт при выкупе и возврате"
    description: >
      Фактографическая проверка наличия в тексте договора условий о судьбе
      неотделимых улучшений предмета лизинга: требуется ли письменное согласие
      лизингодателя, возмещаются ли улучшения лизингополучателю, как разграничены
      отделимые и неотделимые улучшения, как учитывается стоимость улучшений
      при выкупе и возврате.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неотделимые улучшения"
        - "отделимые улучшения"
        - "улучшения предмета лизинга"
        - "с письменного согласия лизингодателя"
        - "возмещение стоимости улучшений"
        - "капитальные вложения"
        - "модернизация"
        - "реконструкция"
        - "улучшения без согласия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неотделим.*улучшени"
        - "(?i)отделим.*улучшени"
        - "(?i)улучшени.*предмет.*лизинг"
        - "(?i)возмещен.*стоимост.*улучшени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: судьба неотделимых улучшений
        предмета лизинга.

        Нормативный ориентир:
        - ст. 18 ФЗ-164 — право лизингополучателя на возмещение стоимости
          неотделимых улучшений с письменного согласия лизингодателя,
          если иное не предусмотрено договором
        - ст. 623 ГК РФ (субсидиарно) — улучшения арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли письменное согласие лизингодателя на производство улучшений.
        2. Возмещаются ли неотделимые улучшения лизингополучателю.
        3. Есть ли разграничение отделимых и неотделимых улучшений.
        4. Учитывается ли стоимость улучшений при выкупе предмета.
        5. Учитывается ли стоимость улучшений при возврате предмета.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай условия о согласии, возмещении или учёте улучшений, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия об улучшениях (например, в одном пункте
           улучшения возмещаются, а в другом — невозмещаемы), используй формулировки
           из специального раздела об улучшениях и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель вправе производить неотделимые улучшения предмета
        лизинга только с письменного согласия Лизингодателя. Стоимость неотделимых
        улучшений, произведённых с согласия Лизингодателя, возмещается
        Лизингополучателю при выкупе предмета лизинга. Отделимые улучшения
        остаются собственностью Лизингополучателя."

        Ответ:
        {
          "consent_required_status": "defined",
          "consent_required_details": "только с письменного согласия Лизингодателя",
          "compensation_status": "defined",
          "compensation_details": "стоимость неотделимых улучшений, произведённых с согласия Лизингодателя, возмещается при выкупе",
          "inseparable_rule_status": "defined",
          "inseparable_rule_details": "отделимые улучшения остаются собственностью Лизингополучателя",
          "buyout_accounting_status": "defined",
          "buyout_accounting_details": "возмещается при выкупе предмета лизинга",
          "return_accounting_status": "not_defined",
          "return_accounting_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Лизингополучатель вправе производить неотделимые улучшения предмета лизинга только с письменного согласия Лизингодателя."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель использует предмет лизинга в своей деятельности."

        Ответ:
        {
          "consent_required_status": "not_defined",
          "consent_required_details": "Данные не определены",
          "compensation_status": "not_defined",
          "compensation_details": "Данные не определены",
          "inseparable_rule_status": "not_defined",
          "inseparable_rule_details": "Данные не определены",
          "buyout_accounting_status": "not_defined",
          "buyout_accounting_details": "Данные не определены",
          "return_accounting_status": "not_defined",
          "return_accounting_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о согласии на улучшения.
        2. Найди прямую цитату о возмещении стоимости неотделимых улучшений.
        3. Найди прямую цитату о разграничении отделимых и неотделимых улучшений.
        4. Найди прямую цитату об учёте улучшений при выкупе.
        5. Найди прямую цитату об учёте улучшений при возврате.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "consent_required_status": "<defined / not_defined>",
          "consent_required_details": "<текст или 'Данные не определены'>",
          "compensation_status": "<defined / not_defined>",
          "compensation_details": "<текст или 'Данные не определены'>",
          "inseparable_rule_status": "<defined / not_defined>",
          "inseparable_rule_details": "<текст или 'Данные не определены'>",
          "buyout_accounting_status": "<defined / not_defined>",
          "buyout_accounting_details": "<текст или 'Данные не определены'>",
          "return_accounting_status": "<defined / not_defined>",
          "return_accounting_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неотделимые улучшения отделимые улучшения улучшения предмета лизинга письменное согласие лизингодателя возмещение стоимости улучшений капитальные вложения модернизация реконструкция"
      retrieval_profile: "repair_maintenance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "график платежей как таблица"
        - "выкупная цена как сумма"
        - "страхование"
        - "возврат предмета как процедура"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "leasing_improvements_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        о неотделимых улучшениях предмета: согласие на улучшения, возмещение,
        разграничение с отделимыми, учёт при выкупе и при возврате.
        Не анализируй общий ремонт и техобслуживание, страхование, приёмку или возврат предмета как процедуру.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_improvements_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (consent_required_status, compensation_status,
              inseparable_rule_status, buyout_accounting_status,
              return_accounting_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. consent_required_status — "defined" если требование письменного согласия
           на улучшения прямо указано, иначе "not_defined".
        2. consent_required_details — формулировка о согласии на улучшения.
        3. compensation_status — "defined" если условие о возмещении / невозмещении
           неотделимых улучшений прямо указано, иначе "not_defined".
        4. compensation_details — формулировка о возмещении улучшений.
        5. inseparable_rule_status — "defined" если разграничение отделимых
           и неотделимых улучшений прямо описано, иначе "not_defined".
        6. inseparable_rule_details — формулировка о разграничении.
        7. buyout_accounting_status — "defined" если учёт стоимости улучшений
           при выкупе предмета прямо описан, иначе "not_defined".
        8. buyout_accounting_details — формулировка об учёте при выкупе.
        9. return_accounting_status — "defined" если учёт стоимости улучшений
           при возврате предмета прямо описан, иначе "not_defined".
        10. return_accounting_details — формулировка об учёте при возврате.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_improvements_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай условия о согласии, возмещении или учёте улучшений, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые условия об улучшениях (например, в одном пункте улучшения возмещаются, а в другом — невозмещаемы), используй формулировки из специального раздела об улучшениях и приводи оба фрагмента в evidence.
        - Различай: согласие, возмещение, разграничение отделимых/неотделимых, учёт при выкупе, учёт при возврате — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий о согласии на улучшения, ни о возмещении,
           ни о разграничении, ни об учёте улучшений при выкупе или возврате.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указано только требование согласия без судьбы улучшений.
           Есть обязанность получать согласие лизингодателя на улучшения,
           но не раскрыто, возмещаются ли они, и не разграничены отделимые/неотделимые.
           → presence = "present";
             consent_required_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте улучшения возмещаются, в другом — невозмещаемы;
           или разные правила для отделимых / неотделимых.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Прямой запрет на улучшения или невозмещаемость.
           В договоре прямо указано, что неотделимые улучшения не возмещаются
           (типовая конструкция для лизинга).
           → presence = "present";
             compensation_status = "defined";
             compensation_details содержит дословную формулировку о невозмещаемости.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_improvements_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_improvements_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования неотделимых улучшений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "consent_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования согласия на улучшения."
          required: true
          display_in_grid: false
        - name: "consent_required_details"
          type: "string"
          presentation: "fact"
          label: "Согласие на улучшения"
          description: "Формулировка о необходимости письменного согласия лизингодателя на улучшения."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус возмещения неотделимых улучшений."
          required: true
          display_in_grid: false
        - name: "compensation_details"
          type: "string"
          presentation: "fact"
          label: "Возмещение улучшений"
          description: "Условие о возмещении или невозмещении стоимости неотделимых улучшений (ст. 18 ФЗ-164)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "inseparable_rule_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус разграничения отделимых и неотделимых улучшений."
          required: true
          display_in_grid: false
        - name: "inseparable_rule_details"
          type: "string"
          presentation: "fact"
          label: "Разграничение улучшений"
          description: "Формулировка о разграничении отделимых и неотделимых улучшений."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "buyout_accounting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус учёта улучшений при выкупе."
          required: true
          display_in_grid: false
        - name: "buyout_accounting_details"
          type: "string"
          presentation: "fact"
          label: "Учёт улучшений при выкупе"
          description: "Формулировка об учёте стоимости улучшений при выкупе предмета лизинга."
          required: false
          display_in_grid: false
        - name: "return_accounting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус учёта улучшений при возврате."
          required: true
          display_in_grid: false
        - name: "return_accounting_details"
          type: "string"
          presentation: "fact"
          label: "Учёт улучшений при возврате"
          description: "Формулировка об учёте стоимости улучшений при возврате предмета лизинга."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_representations
    name: "Заверения об обстоятельствах (ст. 431.2 ГК РФ): финансовое состояние, банкротство, litigation, ответственность за недостоверность"
    description: >
      Фактографическая проверка наличия в тексте договора заверений
      об обстоятельствах (ст. 431.2 ГК РФ): финансовое состояние, отсутствие
      банкротства, отсутствие litigation, compliance / разрешения,
      а также ответственности за недостоверность заверений и механизма защиты.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "заверяет"
        - "гарантирует достоверность"
        - "финансовое состояние"
        - "отсутствие признаков банкротства"
        - "отсутствие судебных споров"
        - "litigation"
        - "достоверность предоставленных данных"
        - "ст. 431.2"
        - "ответственность за недостоверные заверения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заверени(я|е)\\s+об\\s+обстоятельств"
        - "(?i)заверяет|гарантиру(ет|ю)\\s+достоверност"
        - "(?i)финансов(ое|ого)\\s+состояни"
        - "(?i)ст(?:атья|\\.)?\\s*431\\.?2"
        - "(?i)отсутств(ие|ия)\\s+(признаков\\s+)?банкротств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: наличие в договоре заверений
        об обстоятельствах и ответственности за их недостоверность (ст. 431.2 ГК РФ).

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах и ответственность
          за их недостоверность
        - ст. 309, 310 ГК РФ — надлежащее исполнение обязательств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли заверения о финансовом состоянии стороны.
        2. Есть ли заверения об отсутствии признаков банкротства.
        3. Есть ли заверения об отсутствии судебных споров / litigation.
        4. Есть ли заверения о соблюдении законодательства / наличии разрешений.
        5. Есть ли условие об ответственности за недостоверность заверений.
        6. Есть ли механизм защиты при нарушении заверений (отказ от договора, расторжение).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай заверения, ссылки на статью или механизмы защиты, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые заверения, используй формулировки
           из специального раздела о заверениях и гарантиях и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель заверяет, что его финансовое состояние устойчиво,
        признаки банкротства отсутствуют, судебных споров на сумму более
        1 000 000 рублей нет. За недостоверность заверений Лизингополучатель
        несёт ответственность в соответствии со ст. 431.2 ГК РФ. При нарушении
        заверений Лизингодатель вправе отказаться от договора."

        Ответ:
        {
          "financial_rep_status": "defined",
          "financial_rep_details": "финансовое состояние устойчиво",
          "no_bankruptcy_rep_status": "defined",
          "no_bankruptcy_rep_details": "признаки банкротства отсутствуют",
          "litigation_rep_status": "defined",
          "litigation_rep_details": "судебных споров на сумму более 1 000 000 рублей нет",
          "compliance_rep_status": "not_defined",
          "compliance_rep_details": "Данные не определены",
          "liability_misrep_status": "defined",
          "liability_misrep_details": "ответственность по ст. 431.2 ГК РФ за недостоверность заверений",
          "remedy_status": "defined",
          "remedy_details": "Лизингодатель вправе отказаться от договора при нарушении заверений",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Лизингополучатель заверяет, что его финансовое состояние устойчиво, признаки банкротства отсутствуют."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга на условиях, определённых в настоящем документе."

        Ответ:
        {
          "financial_rep_status": "not_defined",
          "financial_rep_details": "Данные не определены",
          "no_bankruptcy_rep_status": "not_defined",
          "no_bankruptcy_rep_details": "Данные не определены",
          "litigation_rep_status": "not_defined",
          "litigation_rep_details": "Данные не определены",
          "compliance_rep_status": "not_defined",
          "compliance_rep_details": "Данные не определены",
          "liability_misrep_status": "not_defined",
          "liability_misrep_details": "Данные не определены",
          "remedy_status": "not_defined",
          "remedy_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о заверениях о финансовом состоянии.
        2. Найди прямую цитату о заверениях об отсутствии банкротства.
        3. Найди прямую цитату о заверениях об отсутствии litigation.
        4. Найди прямую цитату о заверениях о соблюдении законодательства.
        5. Найди прямую цитату об ответственности за недостоверность.
        6. Найди прямую цитату о механизме защиты при нарушении заверений.
        7. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        8. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "financial_rep_status": "<defined / not_defined>",
          "financial_rep_details": "<текст или 'Данные не определены'>",
          "no_bankruptcy_rep_status": "<defined / not_defined>",
          "no_bankruptcy_rep_details": "<текст или 'Данные не определены'>",
          "litigation_rep_status": "<defined / not_defined>",
          "litigation_rep_details": "<текст или 'Данные не определены'>",
          "compliance_rep_status": "<defined / not_defined>",
          "compliance_rep_details": "<текст или 'Данные не определены'>",
          "liability_misrep_status": "<defined / not_defined>",
          "liability_misrep_details": "<текст или 'Данные не определены'>",
          "remedy_status": "<defined / not_defined>",
          "remedy_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверения об обстоятельствах заверяет гарантирует достоверность финансовое состояние отсутствие признаков банкротства отсутствие судебных споров litigation достоверность предоставленных данных ст. 431.2 ответственность за недостоверные заверения"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - warranties
        - remedies
      negative_keywords:
        - "график платежей как таблица"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "приёмка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "warranties"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "leasing_representations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга заверения
        об обстоятельствах и условия об ответственности за их недостоверность:
        финансовое состояние, отсутствие банкротства, отсутствие litigation,
        compliance, ответственность по ст. 431.2 ГК РФ, механизм защиты.
        Не анализируй график платежей, страхование, ремонт или приёмку.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_representations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (financial_rep_status, no_bankruptcy_rep_status,
              litigation_rep_status, compliance_rep_status,
              liability_misrep_status, remedy_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. financial_rep_status — "defined" если заверение о финансовом состоянии
           прямо указано, иначе "not_defined".
        2. financial_rep_details — формулировка заверения о финансовом состоянии.
        3. no_bankruptcy_rep_status — "defined" если заверение об отсутствии
           признаков банкротства прямо указано, иначе "not_defined".
        4. no_bankruptcy_rep_details — формулировка заверения об отсутствии банкротства.
        5. litigation_rep_status — "defined" если заверение об отсутствии
           судебных споров прямо указано, иначе "not_defined".
        6. litigation_rep_details — формулировка заверения об отсутствии litigation.
        7. compliance_rep_status — "defined" если заверение о соблюдении
           законодательства или наличии разрешений прямо указано, иначе "not_defined".
        8. compliance_rep_details — формулировка заверения о compliance.
        9. liability_misrep_status — "defined" если ответственность за недостоверность
           заверений прямо указана, иначе "not_defined".
        10. liability_misrep_details — формулировка об ответственности за недостоверность.
        11. remedy_status — "defined" если механизм защиты при нарушении заверений
            прямо указан (отказ от договора, расторжение, возмещение убытков), иначе "not_defined".
        12. remedy_details — формулировка о механизме защиты.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_representations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай заверения, ссылки на статью или механизмы защиты, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые заверения, используй формулировки из специального раздела о заверениях и гарантиях и приводи оба фрагмента в evidence.
        - Различай: заверения о финансовом состоянии, о банкротстве, о litigation, о compliance, ответственность за недостоверность, механизм защиты — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений об обстоятельствах, ни ответственности
           за их недостоверность, ни механизма защиты.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указаны отдельные заверения без ответственности.
           Есть одно или несколько заверений (например, о финансовом состоянии),
           но нет условия об ответственности за недостоверность
           и механизма защиты.
           → presence = "present";
             раскрытые *_status = "defined";
             liability_misrep_status / remedy_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны противоречащие заверения
           (например, о наличии и отсутствии litigation).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Общая фраза о добросовестности без конкретных заверений.
           В тексте есть общая фраза «стороны действуют добросовестно»
           без конкретных заверений о финансовом состоянии, банкротстве,
           litigation или compliance.
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             соответствующие *_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_representations_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_representations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования заверений об обстоятельствах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "financial_rep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения о финансовом состоянии."
          required: true
          display_in_grid: false
        - name: "financial_rep_details"
          type: "string"
          presentation: "fact"
          label: "Финансовое состояние"
          description: "Формулировка заверения о финансовом состоянии стороны."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "no_bankruptcy_rep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии банкротства."
          required: true
          display_in_grid: false
        - name: "no_bankruptcy_rep_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие банкротства"
          description: "Формулировка заверения об отсутствии признаков банкротства."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "litigation_rep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии litigation."
          required: true
          display_in_grid: false
        - name: "litigation_rep_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие споров"
          description: "Формулировка заверения об отсутствии судебных споров (litigation)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "compliance_rep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения о compliance / разрешениях."
          required: true
          display_in_grid: false
        - name: "compliance_rep_details"
          type: "string"
          presentation: "fact"
          label: "Compliance / разрешения"
          description: "Формулировка заверения о соблюдении законодательства или наличии разрешений."
          required: false
          display_in_grid: false
        - name: "liability_misrep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за недостоверность заверений."
          required: true
          display_in_grid: false
        - name: "liability_misrep_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность за недостоверность"
          description: "Формулировка об ответственности за недостоверность заверений (ст. 431.2 ГК РФ)."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "remedy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма защиты при нарушении заверений."
          required: true
          display_in_grid: false
        - name: "remedy_details"
          type: "string"
          presentation: "fact"
          label: "Механизм защиты"
          description: "Формулировка о механизме защиты при нарушении заверений (отказ от договора, расторжение, убытки)."
          required: false
          display_in_grid: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_vendor_specification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты лизингодателя,
      лизингополучателя и продавца, а также кто именно выбирает продавца
      и предмет лизинга.
    addressee: "Обе стороны / Юридический советник"

  leasing_structure_extraction:
    text: >
      Просим предоставить по {doc_names}: структуру сделки, описание purchase leg,
      lease leg, выбор продавца, предмета лизинга и наличие выкупной модели.
    addressee: "Лизингодатель / Юридический советник"

  vendor_selection_allocation:
    text: >
      Просим уточнить в {doc_names}: кем выбран продавец и кто несет риск
      его выбора, включая последствия по качеству и поставке предмета лизинга.
    addressee: "Юридический советник"

  leasing_subject_and_illegal_object_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание предмета лизинга,
      его технические характеристики, идентификаторы, а также подтверждение,
      что предмет не относится к недопустимым объектам лизинга.
    addressee: "Продавец / Лизингодатель"

  leasing_subject_detailed:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный номер/VIN,
      кадастровые данные (если применимо), стоимость и комплектность предмета лизинга.
    addressee: "Продавец / Лизингодатель"

  illegal_subject_check:
    text: >
      Внимание: по {doc_names} требуется подтвердить, что предмет лизинга
      не является земельным участком или иным природным объектом.
    addressee: "Юридический советник"

  payments_and_buyout_check:
    text: >
      Просим уточнить в {doc_names}: график лизинговых платежей, общую сумму,
      авансовый платеж, выкупную цену, остаточную стоимость и tax logic выкупной модели.
    addressee: "Финансовый советник / Юридический советник"

  leasing_payments_structure:
    text: >
      Просим предоставить по {doc_names}: график платежей, формулу расчета
      лизинговых платежей, размер аванса, валюту и порядок уплаты просроченной задолженности.
    addressee: "Лизингодатель"

  purchase_option_clear_terms:
    text: >
      Просим уточнить в {doc_names}: есть ли выкуп, какова выкупная цена,
      включена ли она в платежи, как реализуется переход права собственности.
    addressee: "Юридический советник"

  risk_transfer_and_insurance_check:
    text: >
      Просим уточнить в {doc_names}: момент перехода риска случайной гибели,
      обязанность страхования, страховую сумму, выгодоприобретателя и последствия total loss.
    addressee: "Лизингодатель / Страховой консультант"

  risk_transfer_moment:
    text: >
      Просим включить/уточнить в {doc_names}: момент перехода риска
      случайной гибели на лизингополучателя и влияние гибели предмета
      на обязательство по уплате лизинговых платежей.
    addressee: "Юридический советник"

  insurance_requirement_detailed:
    text: >
      Просим предоставить по {doc_names}: условия страхования предмета лизинга,
      форму полиса, страховую сумму, франшизу, выгодоприобретателя и сроки страхования.
    addressee: "Страховой консультант / Лизингодатель"

  default_remedies_and_recovery_check:
    text: >
      Просим уточнить в {doc_names}: default triggers, бесспорное списание,
      исполнительную надпись, repossession, acceleration и порядок одностороннего расторжения.
    addressee: "Юридический советник"

  uncontested_recovery_right:
    text: >
      Просим уточнить в {doc_names}: условия безакцептного списания,
      нотариальной исполнительной надписи, изъятия предмета лизинга и документирования default.
    addressee: "Юридический советник лизингодателя"

  balance_tax_and_amortization_check:
    text: >
      Просим уточнить в {doc_names}: кто является балансодержателем,
      применяется ли ускоренная амортизация, как урегулированы НДС,
      расходы и бухгалтерский учет предмета лизинга.
    addressee: "Налоговый консультант / Бухгалтер"

  balance_holder_specification:
    text: >
      Просим уточнить в {doc_names}: на чьем балансе учитывается предмет лизинга
      и какие последствия это имеет для амортизации и налога на имущество.
    addressee: "Бухгалтер / Налоговый консультант"

  tax_and_depreciation_clarity:
    text: >
      Просим предоставить по {doc_names}: налоговый memo по НДС, амортизации,
      расходам по лизинговым платежам, выкупной модели и риску переквалификации.
    addressee: "Налоговый консультант"

  registration_and_asset_specifics_check:
    text: >
      Просим уточнить в {doc_names}: кто регистрирует предмет лизинга,
      на кого оформляется учет в ГИБДД/Росреестре и кто несет регистрационные расходы.
    addressee: "Юридический советник / Лизингодатель"

  registration_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок регистрации ТС/недвижимости,
      распределение расходов, комплект регистрационных документов и ответственность
      за несвоевременную регистрацию.
    addressee: "Юридический советник"

  subleasing_clause:
    text: >
      Просим уточнить в {doc_names}: допускается ли сублизинг,
      требуется ли согласие лизингодателя и в каком порядке оно оформляется.
    addressee: "Юридический советник"

  bankruptcy_protection_mechanisms:
    text: >
      Просим предоставить по {doc_names}: последствия банкротства сторон,
      режим конкурсной массы, право на изъятие предмета и защиту выкупных прав.
    addressee: "Юридический советник / Insolvency counsel"

  cross_border_leasing_protection:
    text: >
      Просим предоставить по {doc_names}: применимое право, forum/arbitration clause,
      валютные условия, sanctions/AML memo и risk allocation по трансграничной структуре.
    addressee: "Cross-border counsel / Compliance"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, арбитражную оговорку,
      претензионный порядок и язык/место разрешения споров.
    addressee: "Юридический советник"

  illegal_lizing_subject_land_or_nature:
    text: >
      Внимание: {doc_names} содержит признаки недопустимого предмета лизинга
      (земля/природные объекты). Просим пересмотреть структуру сделки
      и дать правовое заключение по допустимости предмета.
    addressee: "Юридический советник"

  reclassification_to_general_lease_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить наличие purchase leg.
      При его отсутствии сделка может быть переквалифицирована в обычную аренду
      или иную конструкцию.
    addressee: "Юридический советник"

  cross_border_sanctions_and_currency_risk:
    text: >
      Внимание: {doc_names} содержит трансграничный элемент.
      Просим предоставить sanctions / currency / AML analysis,
      UBO information и conflict-of-laws memo.
    addressee: "Compliance / Cross-border counsel"

  vendor_direct_claims_670:
    text: >
      Просим уточнить в {doc_names}: как урегулировано право лизингополучателя
      на прямые требования к продавцу (ст. 670 ГК РФ); предусмотрена ли
      солидарная ответственность при выборе продавца лизингодателем;
      порядок рекламации и срок уведомления о недостатках.
    addressee: "Юридический советник"

  saldo_methodology_on_termination:
    text: >
      Просим предоставить по {doc_names}: методику расчёта сальдо встречных
      обязательств при досрочном расторжении (Постановление Пленума ВАС №17
      от 14.03.2014). В частности: как определяется стоимость возвращённого
      предмета (рыночная / балансовая / формула), раскрыта ли плата за
      финансирование, предусмотрен ли возврат разницы лизингополучателю.
    addressee: "Юридический советник / Финансовый советник"

  delivery_acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок приёмки предмета лизинга
      от продавца, кто участвует в приёмке, форма акта, порядок фиксации
      недостатков (протокол), сроки рекламации, место передачи.
    addressee: "Лизингодатель / Продавец"

  maintenance_repair_allocation:
    text: >
      Просим уточнить в {doc_names}: кто несёт расходы на текущее содержание
      и ремонт предмета лизинга, предусмотрено ли техобслуживание за счёт
      лизингодателя (full-service), порядок согласования капитального ремонта.
    addressee: "Обе стороны"

  leasing_term_required:
    text: >
      В {doc_names} не указан или нечётко указан срок лизинга. Это существенное
      условие (ст. 15 ФЗ-164). Просим указать: дату начала, дату окончания
      или способ их определения.
    addressee: "Обе стороны"

  lessee_direct_claim_right:
    text: >
      Просим включить в {doc_names}: порядок предъявления лизингополучателем
      требований к продавцу по качеству и комплектности (ст. 670 ГК РФ),
      условия солидарной ответственности, порядок рекламации.
    addressee: "Юридический советник"

  delivery_timeline_and_delay:
    text: >
      Просим уточнить в {doc_names}: срок поставки предмета лизинга,
      санкции за просрочку, право лизингополучателя на расторжение
      при непоставке (ст. 668 ГК РФ).
    addressee: "Продавец / Лизингодатель"

  improvements_and_modifications:
    text: >
      Просим уточнить в {doc_names}: порядок внесения улучшений и модификаций
      предмета лизинга, требуется ли согласие лизингодателя, судьба
      неотделимых улучшений при возврате предмета.
    addressee: "Юридический советник"

  liability_and_indemnification:
    text: >
      Просим уточнить в {doc_names}: размер неустоек, ограничение
      ответственности сторон, порядок возмещения убытков,
      наличие индемнити и его scope.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для обязательств сторон
      (приостановка платежей, продление срока лизинга).
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names}: раздел о конфиденциальности —
      перечень конфиденциальных сведений, срок неразглашения,
      исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  sale_leaseback_requalification_risk:
    text: >
      Внимание: {doc_names} содержит признаки возвратного лизинга.
      Просим предоставить: обоснование деловой цели конструкции,
      независимую оценку предмета лизинга, правовое заключение
      по рискам переквалификации в заём / притворную сделку
      (ст. 170 ГК РФ), особенно в контексте банкротства.
    addressee: "Юридический советник / Оценщик"

  asset_return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета лизинга
      по окончании срока (при отсутствии выкупа): допустимое состояние,
      метод оценки износа (совместный осмотр / независимый оценщик),
      место и сроки возврата, кто несёт расходы на транспортировку/демонтаж,
      штрафные санкции за невозврат или просрочку.
    addressee: "Обе стороны / Юридический советник"

  asset_return_conditions:
    text: >
      В {doc_names} не урегулированы или нечётко описаны условия возврата
      предмета лизинга. Просим включить: стандарт допустимого состояния
      (нормальный износ vs повреждения), порядок фиксации состояния,
      сроки, место и расходы по возврату, санкции за просрочку.
    addressee: "Юридический советник"

  lessor_title_warranty:
    text: >
      Просим включить в {doc_names} заверения лизингодателя: (а) предмет
      лизинга будет свободен от прав третьих лиц и обременений на момент
      передачи; (б) отсутствуют аресты, залоги и запреты; (в) лизингодатель
      обладает необходимыми полномочиями для заключения договора.
    addressee: "Юридический советник лизингодателя"

  use_and_location_restrictions:
    text: >
      Просим уточнить в {doc_names}: территорию и условия эксплуатации
      предмета лизинга, требуется ли согласие лизингодателя на перемещение,
      целевое назначение использования, запрет на определённые виды
      эксплуатации (если применимо).
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
