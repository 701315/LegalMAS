          required: false
        - name: "beneficiary_details"
          type: "string"
          presentation: "fact"
          label: "Выгодоприобретатель"
          description: "Выгодоприобретатель по полису."
          required: false
          display_in_grid: false
        - name: "total_loss_payment_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
