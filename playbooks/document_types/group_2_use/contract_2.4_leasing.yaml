  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: ОГРАНИЧЕНИЯ ИСПОЛЬЗОВАНИЯ И СУБЛИЗИНГ
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_usage_and_sublease
    name: "Ограничения использования предмета лизинга и условия сублизинга"
    description: >
      Фактографическая проверка наличия в тексте ковенантов по эксплуатации:
      территориальные ограничения, запрет перемещения, целевое использование,
      а также условия сублизинга и необходимость согласия лизингодателя.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "место нахождения"
        - "место эксплуатации"
        - "запрет перемещения"
        - "без согласия лизингодателя"
        - "целевое использование"
        - "только для"
        - "запрещается использовать"
        - "территория эксплуатации"
        - "сублизинг"
        - "с письменного согласия лизингодателя"
        - "запрет сублизинга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)без.*согласия.*лизингодател.*(перемещ|перевоз|вывоз)"
        - "(?i)(место|территория)\\s+эксплуатац"
        - "(?i)сублизинг"
        - "(?i)с\\s+письменн(ого|ым)\\s+согласия\\s+лизингодател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: ограничения использования предмета
        лизинга и условия сублизинга.

        Нормативный ориентир:
        - ФЗ-164 — сублизинг возможен только с согласия лизингодателя
        - ст. 421 ГК РФ — договорные ковенанты по эксплуатации

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на место / территорию эксплуатации предмета.
        2. Есть ли запрет перемещения или вывоза предмета без согласия.
        3. Есть ли ограничение по целевому использованию.
        4. Как урегулирован сублизинг (запрет / разрешён с согласия).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга эксплуатируется только на территории г. Москвы.
        Перемещение в другой регион допускается исключительно с письменного
        согласия Лизингодателя. Целевое использование — производство
        металлоконструкций. Сублизинг запрещён."

        Ответ:
        {
          "location_restriction_status": "defined",
          "location_restriction_details": "только на территории г. Москвы",
          "relocation_prohibition_status": "defined",
          "relocation_prohibition_details": "с письменного согласия Лизингодателя",
          "target_use_status": "defined",
          "target_use_details": "производство металлоконструкций",
          "sublease_status": "defined",
          "sublease_regime": "prohibited",
          "sublease_details": "сублизинг запрещён",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Предмет лизинга эксплуатируется только на территории г. Москвы. Сублизинг запрещён."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель использует предмет лизинга в своей деятельности."

        Ответ:
        {
          "location_restriction_status": "not_defined",
          "location_restriction_details": "Данные не определены",
          "relocation_prohibition_status": "not_defined",
          "relocation_prohibition_details": "Данные не определены",
          "target_use_status": "not_defined",
          "target_use_details": "Данные не определены",
          "sublease_status": "not_defined",
          "sublease_regime": "not_defined",
          "sublease_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о месте / территории эксплуатации.
        2. Найди прямую цитату о запрете перемещения.
        3. Найди прямую цитату о целевом использовании.
        4. Найди прямую цитату о сублизинге.
        5. Если прямой цитаты нет — верни "not_defined". Не выводи из закона.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "location_restriction_status": "<defined / not_defined>",
          "location_restriction_details": "<текст или 'Данные не определены'>",
          "relocation_prohibition_status": "<defined / not_defined>",
          "relocation_prohibition_details": "<текст или 'Данные не определены'>",
          "target_use_status": "<defined / not_defined>",
          "target_use_details": "<текст или 'Данные не определены'>",
          "sublease_status": "<defined / not_defined>",
          "sublease_regime": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "sublease_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "место нахождения место эксплуатации запрет перемещения без согласия лизингодателя целевое использование только для запрещается использовать территория эксплуатации сублизинг с письменного согласия"
      retrieval_profile: "subletting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга ограничения
        использования предмета: территория, запрет перемещения, целевое
        использование и условия сублизинга.
        Не анализируй лизинговые платежи, страхование, ремонт или возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. location_restriction_status — "defined" если место / территория
           эксплуатации прямо указаны, иначе "not_defined".
        2. location_restriction_details — формулировка о территории эксплуатации.
        3. relocation_prohibition_status — "defined" если запрет перемещения
           без согласия прямо указан, иначе "not_defined".
        4. relocation_prohibition_details — формулировка о запрете перемещения.
        5. target_use_status — "defined" если целевое использование прямо указано,
           иначе "not_defined".
        6. target_use_details — формулировка о целевом использовании.
        7. sublease_status — "defined" если сублизинг прямо урегулирован,
           иначе "not_defined".
        8. sublease_regime — "prohibited" / "allowed_with_consent" / "allowed" /
           "not_defined".
        9. sublease_details — формулировка о сублизинге.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - sublease_regime:
            - "prohibited" — сублизинг прямо запрещён.
            - "allowed_with_consent" — сублизинг допускается с согласия лизингодателя.
            - "allowed" — сублизинг допускается без дополнительного согласия.
            - "not_defined" — сублизинг прямо не урегулирован.
        - Не выводи режим сублизинга из норм ФЗ-164.
        - Верни только JSON.
        </rules>
      fields:
        - name: "location_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус территориального ограничения."
          required: false
        - name: "location_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Территория эксплуатации"
          description: "Формулировка о месте / территории эксплуатации."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "relocation_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета перемещения."
          required: false
        - name: "relocation_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет перемещения"
          description: "Формулировка о запрете перемещения без согласия."
          required: false
          display_in_grid: false
        - name: "target_use_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус целевого использования."
          required: false
        - name: "target_use_details"
          type: "string"
          presentation: "fact"
          label: "Целевое использование"
          description: "Формулировка о целевом использовании предмета."
          required: false
          display_in_grid: false
        - name: "sublease_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования сублизинга."
          required: false
        - name: "sublease_regime"
          type: "string"
          presentation: "signal"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          description: "Режим сублизинга."
          required: false
        - name: "sublease_details"
          type: "string"
          presentation: "fact"
          label: "Сублизинг"
          description: "Формулировка об условиях сублизинга."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: ОТВЕТСТВЕННОСТЬ СТОРОН И НЕУСТОЙКИ
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_liability_and_penalties
    name: "Ответственность сторон, неустойки и ограничение ответственности в договоре лизинга"
    description: >
      Фактографическая проверка наличия в тексте договора лизинга неустоек
      за просрочку лизинговых платежей, штрафов за нарушения лизингополучателя,
      ответственности лизингодателя и ограничения ответственности сторон.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность сторон"
        - "неустойка"
        - "штраф"
        - "пеня"
        - "возмещение убытков"
        - "ограничение ответственности"
        - "просрочка платежа"
        - "нарушение обязательств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*\\d+.*%"
        - "(?i)ответственност.*сторон"
        - "(?i)возмещен.*убытк"
        - "(?i)пен(и|я).*\\d"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: ответственность сторон и неустойки.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку лизинговых платежей.
        2. Есть ли штрафы за иные нарушения лизингополучателя.
        3. Есть ли ответственность лизингодателя перед лизингополучателем.
        4. Есть ли ограничение ответственности.
        5. Есть ли порядок возмещения убытков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку лизинговых платежей — пени 0,1% в день от суммы просроченного
        платежа. За нецелевое использование предмета лизинга — штраф 100 000 рублей.
        Ответственность Лизингодателя ограничена суммой аванса."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,1% в день от суммы просроченного платежа",
          "lessee_breach_penalty_status": "defined",
          "lessee_breach_penalty_details": "штраф 100 000 рублей за нецелевое использование",
          "lessor_liability_status": "not_defined",
