          description: "Основание полномочий подписанта Лизингополучателя."
          required: true
          display_in_grid: false
        - name: "vendor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
