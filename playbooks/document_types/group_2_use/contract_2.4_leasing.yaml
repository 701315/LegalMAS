          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Приёмка предмета лизинга
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_delivery_and_acceptance
    name: "Приёмка предмета лизинга от продавца: акт, недостатки, сроки"
    description: >
      Фактографическая проверка порядка приёмки предмета лизинга:
      кто принимает, акт приёма-передачи, порядок фиксации недостатков,
      срок рекламации, место и срок поставки.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "приёмка"
        - "акт приема-передачи"
        - "передача предмета лизинга"
        - "протокол недостатков"
        - "рекламация"
        - "осмотр"
        - "проверка комплектности"
        - "дата передачи"
        - "срок поставки"
        - "просрочка поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*(прием|приём).*передач.*предмет.*лизинг"
        - "(?i)протокол\\s+недостатк"
        - "(?i)срок\\s+поставк"
        - "(?i)просрочк.*поставк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок приёмки предмета лизинга
        от продавца, фиксация недостатков и сроки поставки.

        Нормативный ориентир:
        - ст. 668 ГК РФ — передача предмета лизинга лизингополучателю

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт приёма-передачи.
        2. Кто принимает предмет лизинга.
        3. Есть ли порядок фиксации недостатков.
        4. Есть ли срок рекламации.
        5. Указан ли срок поставки.
        6. Есть ли последствия просрочки поставки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
