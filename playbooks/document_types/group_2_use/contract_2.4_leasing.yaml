  - id: leasing_delivery_and_acceptance
    name: "Приёмка предмета лизинга от продавца: акт, недостатки, сроки"
    description: >
      Фактографическая проверка порядка приёмки предмета лизинга:
      кто принимает, акт приёма-передачи, порядок фиксации недостатков,
      срок рекламации, место и срок поставки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "приёмка"
        - "акт приема-передачи"
        - "передача предмета лизинга"
        - "протокол недостатков"
        - "рекламация"
        - "осмотр"
        - "проверка комплектности"
        - "дата передачи"
        - "срок поставки"
        - "просрочка поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*(прием|приём).*передач.*предмет.*лизинг"
        - "(?i)протокол\\s+недостатк"
        - "(?i)срок\\s+поставк"
        - "(?i)просрочк.*поставк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок приёмки предмета лизинга
        от продавца, фиксация недостатков и сроки поставки.

        Нормативный ориентир:
        - ст. 668 ГК РФ — передача предмета лизинга лизингополучателю

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт приёма-передачи предмета лизинга.
        2. Кто принимает предмет лизинга (Лизингополучатель, Лизингодатель или совместно).
        3. Есть ли порядок фиксации недостатков при приёмке (протокол, акт рекламации).
        4. Есть ли срок заявления претензий/рекламаций по качеству и комплектности.
        5. Указан ли срок поставки (или порядок его определения).
        6. Есть ли последствия просрочки поставки Продавцом.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай даты, сроки рекламаций, штрафы или процедуры, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если срок поставки или порядок приёмки прямо отсылает к отдельному документу
           (например, "согласно Спецификации № 1" или "в течение 20 дней с даты оплаты аванса"),
           это НЕ считается отсутствием данных. В таком случае:
           - соответствующий статус устанавливай как "defined";
           - соответствующее поле *_details заполняй как "Определяется согласно [название приложения/условия]".
        7. Если в тексте есть противоречивые положения о порядке приёмки, используй условия
           из раздела о поставке/приёмке и укажи оба фрагмента в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга принимается Лизингополучателем по акту приёма-передачи.
        При обнаружении недостатков составляется протокол. Рекламация — 5 рабочих
        дней. Срок поставки — не позднее 01.06.2024."

        Ответ:
        {
          "acceptance_act_status": "defined",
          "acceptance_act_details": "по акту приёма-передачи",
          "who_accepts_status": "defined",
          "who_accepts_details": "Лизингополучатель",
          "defect_protocol_status": "defined",
          "defect_protocol_details": "при обнаружении недостатков составляется протокол",
          "claim_deadline_status": "defined",
          "claim_deadline_details": "5 рабочих дней",
          "delivery_deadline_status": "defined",
          "delivery_deadline_details": "не позднее 01.06.2024",
          "delivery_delay_consequences_status": "not_defined",
          "delivery_delay_consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Предмет лизинга принимается Лизингополучателем по акту приёма-передачи."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец передаёт предмет."

        Ответ:
        {
          "acceptance_act_status": "not_defined",
          "acceptance_act_details": "Данные не определены",
          "who_accepts_status": "not_defined",
          "who_accepts_details": "Данные не определены",
          "defect_protocol_status": "not_defined",
          "defect_protocol_details": "Данные не определены",
          "claim_deadline_status": "not_defined",
          "claim_deadline_details": "Данные не определены",
          "delivery_deadline_status": "not_defined",
          "delivery_deadline_details": "Данные не определены",
          "delivery_delay_consequences_status": "not_defined",
          "delivery_delay_consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об акте приёмки.
        2. Найди прямую цитату о том, кто принимает имущество.
        3. Найди прямую цитату о фиксации недостатков (дефектов).
        4. Найди прямую цитату о сроке рекламации.
        5. Найди прямую цитату о сроке поставки.
        6. Найди прямую цитату о последствиях просрочки поставки.
        7. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        8. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "acceptance_act_status": "<defined / not_defined>",
          "acceptance_act_details": "<текст или 'Данные не определены'>",
          "who_accepts_status": "<defined / not_defined>",
          "who_accepts_details": "<текст или 'Данные не определены'>",
          "defect_protocol_status": "<defined / not_defined>",
          "defect_protocol_details": "<текст или 'Данные не определены'>",
          "claim_deadline_status": "<defined / not_defined>",
          "claim_deadline_details": "<текст или 'Данные не определены'>",
          "delivery_deadline_status": "<defined / not_defined>",
          "delivery_deadline_details": "<текст или 'Данные не определены'>",
          "delivery_delay_consequences_status": "<defined / not_defined>",
          "delivery_delay_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "приёмка акт приёма-передачи передача предмета лизинга протокол недостатков рекламация осмотр комплектность дата передачи срок поставки просрочка поставки"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_delivery_and_acceptance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга порядок приёмки:
        акт, кто принимает, недостатки, рекламация, срок поставки и просрочка.
        Не анализируй лизинговые платежи, страхование, текущий ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_delivery_and_acceptance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (acceptance_act_status, who_accepts_status, defect_protocol_status,
              claim_deadline_status, delivery_deadline_status,
              delivery_delay_consequences_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. acceptance_act_status — "defined" если акт приёма-передачи прямо
           предусмотрен, иначе "not_defined".
        2. acceptance_act_details — формулировка об акте приёма-передачи.
        3. who_accepts_status — "defined" если указано, кто именно принимает предмет
           (Лизингополучатель, Лизингодатель или совместно), иначе "not_defined".
        4. who_accepts_details — формулировка о том, кто принимает предмет лизинга.
        5. defect_protocol_status — "defined" если порядок фиксации недостатков
           прямо описан (протокол разногласий, акт дефектов и т.п.), иначе "not_defined".
        6. defect_protocol_details — формулировка о фиксации недостатков.
        7. claim_deadline_status — "defined" если срок рекламации/претензий по недостаткам
           прямо указан, иначе "not_defined".
        8. claim_deadline_details — срок рекламации (выявления недостатков).
        9. delivery_deadline_status — "defined" если срок поставки прямо указан
           или определён через ссылку на приложение/событие, иначе "not_defined".
        10. delivery_deadline_details — срок поставки предмета лизинга.
        11. delivery_delay_consequences_status — "defined" если последствия просрочки
            поставки прямо описаны, иначе "not_defined".
        12. delivery_delay_consequences_details — формулировка о последствиях просрочки поставки.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_delivery_and_acceptance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай даты, сроки рекламаций, штрафы или процедуры, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если срок поставки или условия приёмки определяются согласно Спецификации, Графику или иному Приложению, ставь статус "defined", а в деталях пиши "Определяется согласно [название приложения]".
        - Если в тексте есть противоречивые положения о порядке приёмки, приоритет отдавай разделу "Порядок передачи и приёмки" и приводи оба фрагмента в evidence.
        - Не смешивай процедуру приёмки, срок рекламации и срок поставки — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни акта приёмки, ни порядка фиксации недостатков,
           ни срока поставки, ни последствий просрочки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано только, что «Продавец передаёт предмет лизинга»,
           без акта, порядка приёмки и сроков.
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             нераскрытые *_status = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные сроки поставки, разные сроки рекламации
           или разные лица, принимающие предмет.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Отсылка на внешний документ / отсутствие последствий просрочки.
           Срок поставки и порядок приёмки определяются Спецификацией или иным
           Приложением; либо срок поставки указан, но последствия просрочки не раскрыты.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "Определяется согласно [название приложения]";
             delivery_delay_consequences_status = "not_defined" (если последствий нет).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_delivery_and_acceptance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
