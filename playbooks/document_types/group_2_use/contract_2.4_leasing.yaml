          description: "Статус штрафа за невозврат / просрочку."
          required: true
          display_in_grid: false
        - name: "late_return_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штраф за невозврат"
          description: "Формулировка и размер штрафа / пени за просрочку возврата предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: leasing_balance_and_tax
    name: "Балансодержатель, ускоренная амортизация и налоговые последствия лизинга"
    description: >
      Фактографическая проверка наличия в тексте договора условий о балансовом
      учёте предмета лизинга, ускоренной амортизации, НДС-оговорки
      и налоговых последствий лизинговых платежей.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "балансодержатель"
        - "на балансе лизингополучателя"
        - "на балансе лизингодателя"
        - "ускоренная амортизация"
        - "коэффициент ускорения"
        - "НДС"
        - "вычет НДС"
        - "лизинговые платежи относятся на расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)балансодержател"
        - "(?i)ускоренн(ая|ой)\\s+амортизац"
        - "(?i)\\bНДС\\b"
        - "(?i)коэффициент\\s+ускорен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: балансовый учёт предмета лизинга,
        ускоренная амортизация и налоговые оговорки.

        Нормативный ориентир:
        - ст. 31 ФЗ-164 — балансодержатель по соглашению сторон
        - пп. 1 п. 2 ст. 259.3 НК РФ — ускоренная амортизация с коэффициентом до 3
        - гл. 21 НК РФ — НДС в лизинговых платежах
        - пп. 10 п. 1 ст. 264 НК РФ — лизинговые платежи в расходах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан балансодержателем предмета лизинга.
        2. Есть ли условие об ускоренной амортизации.
        3. Указан ли конкретный коэффициент ускорения амортизации.
        4. Есть ли НДС-оговорка в лизинговых платежах (ставка, порядок включения).
        5. Есть ли указание на налоговый режим лизинговых платежей.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай балансодержателя, коэффициенты амортизации, ставки НДС или налоговые режимы, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status и balance_holder_code возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые налоговые условия (например, в одном пункте
           предмет на балансе лизингополучателя, а в другом — лизингодателя), используй
           формулировки из специального раздела о балансовом учёте и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга учитывается на балансе Лизингополучателя. Амортизация
        начисляется Лизингополучателем с применением коэффициента ускорения 3.
        В состав лизинговых платежей включён НДС по ставке 20%."

        Ответ:
        {
          "balance_holder_status": "defined",
          "balance_holder_code": "lessee",
          "balance_holder_details": "предмет лизинга учитывается на балансе Лизингополучателя",
          "accelerated_depreciation_status": "defined",
          "accelerated_depreciation_details": "с применением коэффициента ускорения 3",
          "acceleration_coefficient_status": "defined",
          "acceleration_coefficient_details": "коэффициент ускорения 3",
          "vat_clause_status": "defined",
          "vat_clause_details": "НДС по ставке 20% включён в состав лизинговых платежей",
          "tax_regime_status": "not_defined",
          "tax_regime_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.7",
              "quote": "Предмет лизинга учитывается на балансе Лизингополучателя. Амортизация начисляется Лизингополучателем с применением коэффициента ускорения 3."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились об условиях лизинга."

        Ответ:
        {
          "balance_holder_status": "not_defined",
          "balance_holder_code": "not_defined",
          "balance_holder_details": "Данные не определены",
          "accelerated_depreciation_status": "not_defined",
          "accelerated_depreciation_details": "Данные не определены",
          "acceleration_coefficient_status": "not_defined",
          "acceleration_coefficient_details": "Данные не определены",
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Данные не определены",
          "tax_regime_status": "not_defined",
          "tax_regime_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о балансодержателе.
        2. Найди прямую цитату об ускоренной амортизации.
        3. Найди прямую цитату о коэффициенте ускорения.
        4. Найди прямую цитату о НДС (ставка, порядок).
        5. Найди прямую цитату о налоговом режиме платежей.
        6. Если прямой цитаты нет — верни "not_defined" в status/code и "Данные не определены" в details.
           Не подставляй нормы закона.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "balance_holder_status": "<defined / not_defined>",
          "balance_holder_code": "<lessee / lessor / not_defined>",
          "balance_holder_details": "<текст или 'Данные не определены'>",
          "accelerated_depreciation_status": "<defined / not_defined>",
          "accelerated_depreciation_details": "<текст или 'Данные не определены'>",
          "acceleration_coefficient_status": "<defined / not_defined>",
          "acceleration_coefficient_details": "<текст или 'Данные не определены'>",
          "vat_clause_status": "<defined / not_defined>",
          "vat_clause_details": "<текст или 'Данные не определены'>",
          "tax_regime_status": "<defined / not_defined>",
          "tax_regime_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "балансодержатель на балансе лизингополучателя на балансе лизингодателя ускоренная амортизация коэффициент ускорения НДС вычет НДС лизинговые платежи относятся на расходы налоговый режим"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "лизинговые платежи как график"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "leasing_balance_and_tax_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        о балансовом учёте, ускоренной амортизации и налоговых оговорках.
        Не анализируй график лизинговых платежей, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_balance_and_tax_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (balance_holder_status, balance_holder_code,
              accelerated_depreciation_status, acceleration_coefficient_status,
              vat_clause_status, tax_regime_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - balance_holder_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. balance_holder_status — "defined" если балансодержатель прямо указан,
           иначе "not_defined".
        2. balance_holder_code — "lessee" / "lessor" / "not_defined".
        3. balance_holder_details — формулировка о балансодержателе.
        4. accelerated_depreciation_status — "defined" если ускоренная амортизация
           прямо предусмотрена, иначе "not_defined".
        5. accelerated_depreciation_details — формулировка об ускоренной амортизации.
        6. acceleration_coefficient_status — "defined" если конкретный коэффициент
           ускорения прямо указан (например, 2 или 3), иначе "not_defined".
        7. acceleration_coefficient_details — значение коэффициента ускорения.
        8. vat_clause_status — "defined" если НДС-оговорка прямо присутствует
           (включая указание, что платежи без НДС), иначе "not_defined".
        9. vat_clause_details — формулировка о НДС (ставка, порядок включения).
        10. tax_regime_status — "defined" если налоговый режим лизинговых платежей
            прямо описан (например, отнесение на расходы по пп. 10 п. 1 ст. 264 НК РФ),
            иначе "not_defined".
        11. tax_regime_details — формулировка о налоговом режиме.

        Разграничение значений для отсутствующих данных:
        - для полей *_status и balance_holder_code возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_balance_and_tax_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", balance_holder_code = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай балансодержателя, коэффициенты амортизации, ставки НДС или налоговые режимы, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - balance_holder_code: "lessee" — предмет учитывается на балансе лизингополучателя; "lessor" — предмет учитывается на балансе лизингодателя; "not_defined" — балансодержатель прямо не указан в тексте.
        - vat_clause_status = "defined" как при наличии НДС в платежах (с указанием ставки), так и при прямом указании, что платежи без НДС (например, лизингодатель на УСН).
        - Если в тексте есть противоречивые налоговые условия, используй формулировки из специального раздела о балансовом учёте и налогах и приводи оба фрагмента в evidence.
        - Различай: балансодержатель, ускоренная амортизация, коэффициент, НДС и налоговый режим — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни балансодержателя, ни ускоренной амортизации,
           ни НДС-оговорки, ни налогового режима.
           → presence = "missing";
             все *_status = "not_defined";
             balance_holder_code = "not_defined";
             все *_details = "Данные не определены".

        2. Указан только балансодержатель без налоговых деталей.
           Есть условие о балансовом учёте, но нет ускоренной амортизации,
           коэффициента, НДС-оговорки и налогового режима.
           → presence = "present";
             balance_holder_status = "defined";
             balance_holder_code заполнен;
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные балансодержатели или разные ставки НДС.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Налоговая оговорка с оговоркой «без НДС».
           В тексте прямо указано, что лизинговые платежи без НДС
           (например, лизингодатель применяет УСН).
           → presence = "present";
             vat_clause_status = "defined";
             vat_clause_details содержит дословную формулировку об отсутствии НДС.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_balance_and_tax_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для balance_holder_code используй только: "lessee", "lessor", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_balance_and_tax_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по балансовому учёту и налогам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "balance_holder_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания балансодержателя."
          required: true
          display_in_grid: false
        - name: "balance_holder_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["lessee", "lessor", "not_defined"]
          description: "Балансодержатель предмета лизинга."
          required: true
