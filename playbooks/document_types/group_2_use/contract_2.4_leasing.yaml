  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: ТИТУЛ ЛИЗИНГОДАТЕЛЯ И ОБРЕМЕНЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_title_and_encumbrances
    name: "Гарантия чистоты титула лизингодателя и отсутствие обременений на предмет лизинга"
    description: >
      Фактографическая проверка наличия в тексте подтверждения права
      собственности лизингодателя на предмет лизинга, заверений
      об отсутствии залога, ареста и прав третьих лиц.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантирует отсутствие обременений"
        - "свободен от прав третьих лиц"
        - "не заложен"
        - "не находится под арестом"
        - "право собственности лизингодателя"
        - "чистота права"
        - "принадлежит на праве собственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лизингодател.*гарантирует.*отсутствие"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)не\\s+заложен|не\\s+под\\s+арестом"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: подтверждение титула лизингодателя
        на предмет лизинга и отсутствие обременений.

        Нормативный ориентир:
        - ст. 665, 667 ГК РФ — право лизингодателя на передачу в лизинг
        - ст. 608 ГК РФ — право сдачи имущества в аренду принадлежит собственнику

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности лизингодателя.
        2. Есть ли заверение об отсутствии залога на предмет.
        3. Есть ли заверение об отсутствии ареста.
        4. Есть ли заверение об отсутствии прав третьих лиц.
        5. Есть ли иные заверения о чистоте титула.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингодатель гарантирует, что предмет лизинга принадлежит ему
        на праве собственности, свободен от залога, ареста и прав третьих лиц.
        Чистота титула подтверждена выпиской из реестра от 01.03.2024."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "предмет лизинга принадлежит на праве собственности",
          "no_pledge_status": "defined",
          "no_pledge_details": "свободен от залога",
          "no_arrest_status": "defined",
          "no_arrest_details": "свободен от ареста",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "свободен от прав третьих лиц",
          "title_documentation_status": "defined",
          "title_documentation_details": "выписка из реестра от 01.03.2024",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Лизингодатель гарантирует, что предмет лизинга принадлежит ему на праве собственности, свободен от залога, ареста и прав третьих лиц."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Данные не определены",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Данные не определены",
          "title_documentation_status": "not_defined",
          "title_documentation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности лизингодателя.
        2. Найди прямую цитату об отсутствии залога.
        3. Найди прямую цитату об отсутствии ареста.
        4. Найди прямую цитату об отсутствии прав третьих лиц.
        5. Найди прямую цитату о документе, подтверждающем титул.
        6. Если прямой цитаты нет — верни "not_defined". Не выводи из закона.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Данные не определены'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Данные не определены'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Данные не определены'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Данные не определены'>",
          "title_documentation_status": "<defined / not_defined>",
          "title_documentation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

