      medium:
        - pattern: "(?i)\\bпродав[её]ц\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Продавец предмета — важен для лизинга, но термин общий"

        - pattern: "(?i)авансов[ыо]й\\s+плат[её]ж"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Авансовый платёж по договору лизинга"

        - pattern: "(?i)\\bбалансодержател[ья]\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Балансодержатель предмета — важен для налогового режима лизинга"

        - pattern: "(?i)ускоренн[а-яё]+\\s+амортизаци[яи]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Ускоренная амортизация предмета лизинга"

        - pattern: "(?i)страховани[ея]\\s+предмет[аа]\\s+лизинг[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Страхование предмета лизинга"

        - pattern: "(?i)\\bсублизинг\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Сублизинг — специальный механизм передачи предмета"

        - pattern: "(?i)исполнительн[а-яё]+\\s+надпис[ьи]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Исполнительная надпись нотариуса для взыскания лизинговых платежей"

        - pattern: "(?i)бесспорн[оа]е\\s+списани[ея]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Бесспорное списание (direct debit) по лизинговым платежам"

        - pattern: "(?i)возвратн[ыо]й\\s+лизинг"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Возвратный лизинг (sale-leaseback)"

        - pattern: "(?i)обратн[ыо]й\\s+лизинг"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Обратный лизинг (sale-leaseback)"

        - pattern: "(?i)\\bsale-leaseback\\b"
          weight: 0.7
          distinctiveness: medium
