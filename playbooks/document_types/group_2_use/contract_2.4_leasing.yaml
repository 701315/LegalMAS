      store_payload: true

  - id: leasing_subject_and_identification
    name: "Предмет лизинга: описание, идентификация, тип и допустимость объекта"
    description: >
      Фактографическая проверка описания предмета лизинга, его типа,
      индивидуализирующих признаков и отсутствия недопустимых объектов
      (земельные участки, природные объекты).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предмет лизинга"
        - "оборудование"
        - "автомобиль"
        - "недвижимость"
        - "земельный участок"
        - "серийный номер"
        - "VIN"
        - "кадастровый номер"
        - "марка"
        - "модель"
        - "стоимость предмета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)серийн(ый|ого)\\s+номер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: предмет лизинга, его идентификация
        и допустимость.

        Нормативный ориентир:
        - ст. 666 ГК РФ — предмет лизинга
        - ст. 3 ФЗ-164 — не могут быть предметом: земельные участки
          и природные объекты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как описан предмет лизинга.
        2. Какой тип предмета.
        3. Есть ли индивидуализирующие признаки (VIN, серийный номер, кадастр).
        4. Указана ли стоимость предмета.
        5. Есть ли указание на земельный участок или природный объект.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай VIN, серийные номера, кадастровые номера, марки, модели,
           наименования, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status и subject_type возвращай технический код "not_defined";
           - для текстовых полей *_value и *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые сведения о предмете (например,
           в основном тексте и в приложении), используй данные из основного текста
           и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга — станок токарный ЧПУ модель XYZ-500, серийный номер
        SN2024001, стоимость 5 000 000 рублей."

        Ответ:
        {
          "subject_description_status": "defined",
          "subject_description_value": "станок токарный ЧПУ модель XYZ-500",
          "subject_type": "equipment",
          "identifying_features_status": "defined",
          "identifying_features_value": "серийный номер SN2024001",
          "subject_value_status": "defined",
          "subject_value_value": "5 000 000 рублей",
          "prohibited_subject_status": "not_defined",
          "prohibited_subject_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет лизинга — станок токарный ЧПУ модель XYZ-500, серийный номер SN2024001."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "subject_description_status": "not_defined",
          "subject_description_value": "Данные не определены",
          "subject_type": "not_defined",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Данные не определены",
          "subject_value_status": "not_defined",
          "subject_value_value": "Данные не определены",
          "prohibited_subject_status": "not_defined",
          "prohibited_subject_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием предмета.
        2. Найди прямую цитату с идентификаторами (VIN, серийный номер, кадастр).
        3. Найди прямую цитату о стоимости предмета.
        4. Найди указание на земельный участок или природный объект.
        5. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в value.
        6. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "subject_description_status": "<defined / not_defined>",
          "subject_description_value": "<текст или 'Данные не определены'>",
          "subject_type": "<equipment / vehicle / real_estate / other / not_defined>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<текст или 'Данные не определены'>",
          "subject_value_status": "<defined / not_defined>",
          "subject_value_value": "<текст или 'Данные не определены'>",
          "prohibited_subject_status": "<defined / not_defined>",
          "prohibited_subject_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет лизинга оборудование автомобиль недвижимость земельный участок серийный номер VIN кадастровый номер марка модель стоимость предмета"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "leasing_subject_and_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга описание
        предмета, тип, идентификаторы, стоимость и наличие недопустимых объектов.
        Не анализируй платежи, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_subject_and_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subject_description_status, subject_type,
              identifying_features_status, subject_value_status,
              prohibited_subject_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - subject_type = "not_defined";
           - все *_value / *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subject_description_status — "defined" если предмет лизинга прямо описан
           (указана марка, модель, наименование или иное описание), иначе "not_defined".
        2. subject_description_value — описание предмета лизинга из текста договора.
        3. subject_type — "equipment" / "vehicle" / "real_estate" / "other" /
           "not_defined".
        4. identifying_features_status — "defined" если индивидуализирующие признаки
           прямо указаны (VIN, серийный номер, кадастровый номер), иначе "not_defined".
        5. identifying_features_value — VIN, серийный номер, кадастровый номер
           из текста договора.
        6. subject_value_status — "defined" если стоимость предмета лизинга прямо
           указана, иначе "not_defined".
        7. subject_value_value — стоимость предмета лизинга из текста договора.
        8. prohibited_subject_status — "defined" если в тексте есть прямое указание
           на земельный участок или природный объект как предмет лизинга,
           иначе "not_defined".
        9. prohibited_subject_details — дословная формулировка из текста договора
           об указании на запрещённый предмет (земельный участок, природный объект).

        Разграничение значений для отсутствующих данных:
        - для полей *_status и subject_type возвращай "not_defined";
        - для текстовых полей *_value и *_details возвращай "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_subject_and_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", subject_type = "not_defined", все *_value / *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай VIN, серийные номера, кадастровые номера, марки, модели,
          наименования, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - subject_type: "equipment" — оборудование, станки, техника, производственные линии; "vehicle" — транспортное средство (автомобиль, спецтехника, прицеп); "real_estate" — здание, помещение, сооружение (кроме земельного участка); "other" — иной объект; "not_defined" — тип не определён из текста.
        - prohibited_subject_status = "defined" только если земельный участок или природный объект прямо указаны как предмет лизинга в тексте договора. Отсутствие упоминания земли не означает "defined".
        - Если в тексте есть противоречивые сведения о предмете (например, в основном тексте и в приложении), используй данные из основного текста и приведи оба фрагмента в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания предмета лизинга, ни его типа,
           ни идентификаторов, ни стоимости.
           → presence = "missing";
             все *_status = "not_defined";
             subject_type = "not_defined";
             все *_value / *_details = "Данные не определены".

        2. Указан только общий тип предмета.
           «Предметом лизинга является оборудование» без марки, модели и идентификаторов.
           → presence = "present";
             subject_description_status = "defined";
             identifying_features_status = "not_defined";
             identifying_features_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В основном тексте и в спецификации указаны разные модели или серийные номера.
           → presence = "unclear";
             subject_description_status / identifying_features_status = "not_defined";
             соответствующие *_value = "Не удалось определить".

        4. Прямое указание на недопустимый предмет.
           В договоре прямо указан земельный участок или природный объект
           как предмет лизинга.
           → presence = "present";
             prohibited_subject_status = "defined";
             prohibited_subject_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_subject_and_identification_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для subject_type используй только: "equipment", "vehicle", "real_estate", "other", "not_defined".
        - Fallback при отсутствии данных: все *_value / *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_value / *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_subject_and_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие описания предмета лизинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subject_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания предмета лизинга."
          required: true
          display_in_grid: false
        - name: "subject_description_value"
          type: "string"
          presentation: "fact"
          label: "Предмет лизинга"
          description: "Описание предмета лизинга."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "subject_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["equipment", "vehicle", "real_estate", "other", "not_defined"]
          description: "Тип предмета лизинга."
          required: true
          display_in_grid: false
        - name: "identifying_features_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентифицирующих признаков."
          required: true
          display_in_grid: false
        - name: "identifying_features_value"
          type: "string"
          presentation: "fact"
          label: "Идентификаторы"
          description: "VIN, серийный номер, кадастровый номер."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "subject_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус стоимости предмета."
          required: true
          display_in_grid: false
        - name: "subject_value_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость предмета"
          description: "Стоимость предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "prohibited_subject_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия недопустимого предмета."
          required: true
          display_in_grid: false
        - name: "prohibited_subject_details"
          type: "string"
          presentation: "fact"
          label: "Недопустимый предмет"
          description: >
            Указание на земельный участок или природный объект как предмет лизинга.
            Если defined — сделка под угрозой ничтожности по ст. 3 ФЗ-164.
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: leasing_payments_and_buyout
    name: "Лизинговые платежи, аванс, выкупная модель и срок лизинга"
    description: >
      Фактографическая проверка графика лизинговых платежей, аванса,
      выкупной цены, модели выкупа и срока лизинга.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "график лизинговых платежей"
        - "лизинговые платежи"
        - "авансовый платеж"
        - "выкупная цена"
        - "остаточная стоимость"
        - "ежемесячный платеж"
        - "срок лизинга"
        - "период лизинга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)график\\s+лизинговых\\s+платеж"
        - "(?i)авансов(ый|ого)\\s+платеж"
        - "(?i)выкупн(ая|ой)\\s+цен"
        - "(?i)остаточн(ая|ой)\\s+стоимост"
        - "(?i)срок\\s+(лизинга|действия)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: лизинговые платежи, аванс, выкупная модель
        и срок лизинга.

        Нормативный ориентир:
        - ст. 28 ФЗ-164 — лизинговые платежи
        - ст. 19 ФЗ-164 — выкуп предмета лизинга
        - ст. 15 ФЗ-164 — срок как существенное условие лизинга

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли график лизинговых платежей.
        2. Есть ли авансовый платёж и его размер.
        3. Есть ли выкупная цена и как она определена.
        4. Какая модель выкупа (включена в платежи / отдельная цена).
        5. Какой срок лизинга.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай даты, сроки, проценты, валюту, суммы, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status и *_code возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если договор прямо указывает, что параметры (график платежей, аванс, выкупная цена)
           определяются в отдельном Приложении (например, Спецификации или Графике платежей),
           а в самом тексте договора детальные цифры не приведены, — это НЕ считается отсутствием регулирования.
           В таком случае:
           - соответствующий статус устанавливай как "defined";
           - соответствующее поле *_details заполняй как "Определяется согласно [название приложения]"
             с указанием точного названия приложения из договора.
        7. Срок лизинга в РФ часто исчисляется с момента передачи имущества по акту (например,
           "36 месяцев с даты подписания Акта приема-передачи"). Извлекай такие формулировки полностью.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизинговые платежи уплачиваются согласно Графику (Приложение № 1).
        Авансовый платёж — 20% от стоимости предмета. Выкупная цена — 1 000 рублей,
        уплачивается отдельно по окончании срока лизинга. Срок лизинга составляет 36 месяцев
        с момента подписания Акта приема-передачи предмета лизинга."

        Ответ:
        {
          "payment_schedule_status": "defined",
          "payment_schedule_details": "согласно Графику (Приложение № 1)",
          "advance_payment_status": "defined",
          "advance_payment_details": "20% от стоимости предмета",
          "buyout_price_status": "defined",
          "buyout_price_details": "1 000 рублей",
          "buyout_model_status": "defined",
          "buyout_model_code": "separate_price",
          "buyout_model_details": "уплачивается отдельно по окончании срока лизинга",
          "lease_term_status": "defined",
          "lease_term_details": "36 месяцев с момента подписания Акта приема-передачи предмета лизинга",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Лизинговые платежи уплачиваются согласно Графику (Приложение № 1)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны согласовали условия лизинга."

        Ответ:
        {
          "payment_schedule_status": "not_defined",
          "payment_schedule_details": "Данные не определены",
          "advance_payment_status": "not_defined",
          "advance_payment_details": "Данные не определены",
          "buyout_price_status": "not_defined",
          "buyout_price_details": "Данные не определены",
          "buyout_model_status": "not_defined",
          "buyout_model_code": "not_defined",
          "buyout_model_details": "Данные не определены",
          "lease_term_status": "not_defined",
          "lease_term_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о графике платежей (или ссылке на него).
        2. Найди прямую цитату об авансе (или ссылке на него).
        3. Найди прямую цитату о выкупной цене.
        4. Найди прямую цитату о модели выкупа (переходе права собственности).
        5. Найди прямую цитату о сроке лизинга.
        6. Если прямой цитаты нет — верни "not_defined" в status/code и "Данные не определены" в details.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "payment_schedule_status": "<defined / not_defined>",
          "payment_schedule_details": "<текст или 'Данные не определены'>",
          "advance_payment_status": "<defined / not_defined>",
          "advance_payment_details": "<текст или 'Данные не определены'>",
          "buyout_price_status": "<defined / not_defined>",
          "buyout_price_details": "<текст или 'Данные не определены'>",
          "buyout_model_status": "<defined / not_defined>",
          "buyout_model_code": "<included_in_payments / separate_price / not_defined>",
          "buyout_model_details": "<текст или 'Данные не определены'>",
          "lease_term_status": "<defined / not_defined>",
          "lease_term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "график лизинговых платежей лизинговые платежи авансовый платёж выкупная цена остаточная стоимость срок лизинга период лизинга переход права собственности выкуп предмета лизинга"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "предмет лизинга"
        - "VIN"
        - "серийный номер"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_payments_and_buyout_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга платежи,
        аванс, выкупную модель и срок.
        Не анализируй предмет лизинга, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_payments_and_buyout_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (payment_schedule_status, advance_payment_status, buyout_price_status,
              buyout_model_status, buyout_model_code, lease_term_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - buyout_model_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. payment_schedule_status — "defined" если график лизинговых платежей прямо
           предусмотрен (ссылка на приложение, таблица или описание), иначе "not_defined".
        2. payment_schedule_details — формулировка о графике платежей.
        3. advance_payment_status — "defined" если авансовый платёж прямо предусмотрен,
           иначе "not_defined".
        4. advance_payment_details — размер и условия авансового платежа.
        5. buyout_price_status — "defined" если выкупная цена прямо указана,
           иначе "not_defined".
        6. buyout_price_details — формулировка о выкупной цене.
        7. buyout_model_status — "defined" если модель выкупа прямо определена,
           иначе "not_defined".
        8. buyout_model_code — "included_in_payments" / "separate_price" / "not_defined".
        9. buyout_model_details — формулировка о модели выкупа (механике перехода права собственности).
        10. lease_term_status — "defined" если срок лизинга прямо указан,
            иначе "not_defined".
        11. lease_term_details — срок лизинга.

        Разграничение значений для отсутствующих данных:
        - для полей *_status и *_code возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_payments_and_buyout_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", buyout_model_code = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай даты, сроки, проценты, валюту, суммы, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - buyout_model_code: "included_in_payments" — выкупная стоимость входит в состав лизинговых платежей; "separate_price" — выкупная стоимость уплачивается отдельно (в конце срока); "not_defined" — модель прямо не определена в тексте.
        - Если график платежей, аванс или выкупная цена определяются согласно Спецификации, Графику или иному Приложению, ставь соответствующий статус "defined", а в поле *_details пиши "Определяется согласно [название приложения]".
        - Срок лизинга извлекай со всеми сопутствующими условиями исчисления (например, "с даты подписания Акта приема-передачи").
        - Если в тексте есть противоречивые финансовые условия, приоритет отдавай разделу "Лизинговые платежи" или "Порядок расчетов" и приводи оба фрагмента в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни графика платежей, ни аванса, ни выкупной цены, ни срока лизинга.
           → presence = "missing";
             все *_status = "not_defined";
             buyout_model_code = "not_defined";
             все *_details = "Данные не определены".

        2. Указан только график платежей или только срок без выкупной модели.
           Часть темы раскрыта, часть — нет.
           → presence = "present";
             раскрытые *_status = "defined";
             нераскрытые *_status / *_code = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные суммы аванса, разные сроки или разные выкупные цены.
           → presence = "unclear";
             соответствующий *_status / *_code = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Отсылка на внешнее Приложение.
           График / аванс / выкупная цена определяются согласно Спецификации, Графику или Приложению.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "Определяется согласно [название приложения]".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_payments_and_buyout_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для buyout_model_code используй только: "included_in_payments", "separate_price", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_payments_and_buyout_presence"
