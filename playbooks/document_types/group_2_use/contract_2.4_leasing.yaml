  - id: leasing_maintenance_check
    name: "Содержание предмета лизинга: ремонт, техобслуживание и расходы"
    description: >
      Фактографическая проверка наличия в тексте договора лизинга условий
      о содержании предмета лизинга: текущий и капитальный ремонт,
      техническое обслуживание, распределение эксплуатационных расходов.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "техническое обслуживание"
        - "текущий ремонт"
        - "капитальный ремонт"
        - "содержание предмета лизинга"
        - "расходы на эксплуатацию"
        - "ТО"
        - "сервисное обслуживание"
        - "поддерживать в исправном состоянии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ(ое|ого)\\s+обслуживан"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)содержан.*предмет.*лизинг"
        - "(?i)капитальн(ый|ого)\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: распределение обязанностей по содержанию,
        ремонту и техническому обслуживанию предмета лизинга.

        Нормативный ориентир:
        - ст. 17 ФЗ-164 — содержание предмета лизинга (по умолчанию на лизингополучателе)
        - ст. 616 ГК РФ (субсидиарно) — ремонт арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На кого возложено текущее техническое обслуживание.
        2. На кого возложен текущий ремонт.
        3. На кого возложен капитальный ремонт.
        4. Есть ли указание на распределение эксплуатационных расходов.
        5. Предусмотрено ли full-service обслуживание лизингодателем.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не делай вывод о распределении обязанностей по умолчанию из ст. 17 ФЗ-164 или ст. 616 ГК РФ —
           фиксируй только то, что прямо написано в договоре.
        3. Не выдумывай условия обслуживания, ремонта или расходов, которых нет в тексте.
        4. Разграничение значений для отсутствующих данных:
           - для полей *_status и *_allocation возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        5. Не используй "None", "null", пустые строки ни в одном поле.
        6. В evidence включай только текст договора.
        7. Если в тексте есть противоречивые условия о распределении обязанностей,
           используй формулировки из раздела о содержании предмета лизинга
           и укажи оба фрагмента в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель обязан за свой счёт осуществлять техническое обслуживание
        и текущий ремонт предмета лизинга. Капитальный ремонт — обязанность
        Лизингодателя. Расходы на эксплуатацию несёт Лизингополучатель."

        Ответ:
        {
          "maintenance_status": "defined",
          "maintenance_allocation": "lessee",
          "maintenance_details": "техническое обслуживание за счёт Лизингополучателя",
          "current_repair_status": "defined",
          "current_repair_allocation": "lessee",
          "current_repair_details": "текущий ремонт — обязанность Лизингополучателя",
          "capital_repair_status": "defined",
          "capital_repair_allocation": "lessor",
          "capital_repair_details": "капитальный ремонт — обязанность Лизингодателя",
          "operational_costs_status": "defined",
          "operational_costs_details": "расходы на эксплуатацию несёт Лизингополучатель",
          "full_service_status": "not_defined",
          "full_service_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лизингополучатель обязан за свой счёт осуществлять техническое обслуживание и текущий ремонт предмета лизинга."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны используют предмет лизинга в соответствии с его назначением."

        Ответ:
        {
          "maintenance_status": "not_defined",
          "maintenance_allocation": "not_defined",
          "maintenance_details": "Данные не определены",
          "current_repair_status": "not_defined",
          "current_repair_allocation": "not_defined",
          "current_repair_details": "Данные не определены",
          "capital_repair_status": "not_defined",
          "capital_repair_allocation": "not_defined",
          "capital_repair_details": "Данные не определены",
          "operational_costs_status": "not_defined",
          "operational_costs_details": "Данные не определены",
          "full_service_status": "not_defined",
          "full_service_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о техобслуживании и ответственной стороне.
        2. Найди прямую цитату о текущем ремонте.
        3. Найди прямую цитату о капитальном ремонте.
        4. Найди прямую цитату об эксплуатационных расходах.
        5. Найди прямую цитату о full-service обслуживании.
        6. Если прямой цитаты нет — верни "not_defined" в status/allocation и "Данные не определены" в details.
           Не выводи обязанность из закона.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "maintenance_status": "<defined / not_defined>",
          "maintenance_allocation": "<lessee / lessor / shared / not_defined>",
          "maintenance_details": "<текст или 'Данные не определены'>",
          "current_repair_status": "<defined / not_defined>",
          "current_repair_allocation": "<lessee / lessor / shared / not_defined>",
          "current_repair_details": "<текст или 'Данные не определены'>",
          "capital_repair_status": "<defined / not_defined>",
          "capital_repair_allocation": "<lessee / lessor / shared / not_defined>",
          "capital_repair_details": "<текст или 'Данные не определены'>",
          "operational_costs_status": "<defined / not_defined>",
          "operational_costs_details": "<текст или 'Данные не определены'>",
          "full_service_status": "<defined / not_defined>",
          "full_service_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "техническое обслуживание текущий ремонт капитальный ремонт содержание предмета лизинга расходы на эксплуатацию ТО сервисное обслуживание поддерживать в исправном состоянии"
      retrieval_profile: "repair_maintenance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "возврат предмета"
        - "сальдо"
        - "изъятие"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_maintenance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        о содержании предмета лизинга: техобслуживание, текущий ремонт,
        капитальный ремонт, эксплуатационные расходы и full-service модель.
        Не анализируй лизинговые платежи, страхование, приёмку или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_maintenance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (maintenance_status, maintenance_allocation,
              current_repair_status, current_repair_allocation,
              capital_repair_status, capital_repair_allocation,
              operational_costs_status, full_service_status)
             ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_allocation = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. maintenance_status — "defined" если обязанность по техобслуживанию
           прямо распределена, иначе "not_defined".
        2. maintenance_allocation — "lessee" / "lessor" / "shared" / "not_defined".
        3. maintenance_details — формулировка об обязанности по техобслуживанию.
        4. current_repair_status — "defined" если обязанность по текущему ремонту
           прямо распределена, иначе "not_defined".
        5. current_repair_allocation — "lessee" / "lessor" / "shared" / "not_defined".
        6. current_repair_details — формулировка о текущем ремонте.
        7. capital_repair_status — "defined" если обязанность по капремонту
           прямо распределена, иначе "not_defined".
        8. capital_repair_allocation — "lessee" / "lessor" / "shared" / "not_defined".
        9. capital_repair_details — формулировка о капитальном ремонте.
        10. operational_costs_status — "defined" если эксплуатационные расходы
            прямо распределены, иначе "not_defined".
        11. operational_costs_details — формулировка об эксплуатационных расходах.
        12. full_service_status — "defined" если full-service обслуживание лизингодателем
            прямо предусмотрено, иначе "not_defined".
        13. full_service_details — формулировка о full-service.

        Разграничение значений для отсутствующих данных:
        - для полей *_status и *_allocation возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_maintenance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_allocation = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Даже если договор молчит о распределении обязанностей, не подставляй диспозитивные нормы ст. 17 ФЗ-164 или ст. 616 ГК РФ. Фиксируй только то, что прямо написано в тексте.
        - Не выдумывай условия обслуживания, ремонта или расходов, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Значения полей *_allocation: "lessee" — обязанность возложена на лизингополучателя; "lessor" — обязанность возложена на лизингодателя; "shared" — обязанность распределена между сторонами; "not_defined" — прямо не определено в тексте.
        - Если в тексте есть противоречивые условия о распределении обязанностей, используй формулировки из раздела о содержании предмета лизинга и приводи оба фрагмента в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности по ТО, ни текущего/капитального ремонта,
           ни распределения эксплуатационных расходов, ни full-service.
           → presence = "missing";
             все *_status = "not_defined";
             все *_allocation = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только часть обязанностей.
           Например, распределён текущий ремонт, но не раскрыт капитальный.
           → presence = "present";
             раскрытые *_status = "defined" со своим *_allocation;
             нераскрытые *_status = "not_defined", *_allocation = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах разные стороны отвечают за ремонт одного типа,
           или разные модели распределения обязанностей.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_allocation = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Указание на full-service модель или на обслуживание лизингодателем.
           В договоре прямо предусмотрено, что лизингодатель обеспечивает
           техобслуживание и/или ремонт предмета лизинга (full-service).
           → presence = "present";
             full_service_status = "defined";
             full_service_details содержит дословную формулировку;
             maintenance_allocation / current_repair_allocation = "lessor".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_maintenance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для *_allocation используй только: "lessee", "lessor", "shared", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_maintenance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по содержанию предмета лизинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "maintenance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
