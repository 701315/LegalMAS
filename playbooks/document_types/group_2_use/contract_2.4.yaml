type: contract_2.4
name: "Договор лизинга (финансовой аренды)"

description: |
  Специальный вид аренды, при котором лизингодатель обязуется приобрести в собственность
  указанное лизингополучателем имущество у определенного продавца и предоставить это имущество
  лизингополучателю за плату во временное владение и пользование, как правило,
  для предпринимательских целей. Лизинговая конструкция сочетает арендный, финансовый
  и купле-продажный элементы, включает vendor leg и lease leg, а нередко — опцию/обязанность
  выкупа по окончании срока.
  Существенными практическими вопросами являются: кто выбирает продавца и предмет,
  как распределяются риски по качеству и случайной гибели, как устроен график лизинговых платежей,
  есть ли выкупная стоимость, кто страхует предмет, кто является балансодержателем,
  как урегулированы default remedies, регистрация, налоговый и амортизационный режим.
  Регулируется § 6 Главы 34 ГК РФ и Федеральным законом № 164-ФЗ «О финансовой аренде (лизинге)».

version: 4.0
parent: class_2_transfer_for_use

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 6 Главы 34 ГК РФ (ст. 665-670), ФЗ № 164-ФЗ «О финансовой аренде (лизинге)»"
  doc_types_supported:
    - "договор лизинга"
    - "договор финансовой аренды"
    - "лизинговый договор"
    - "договор лизинга оборудования"
    - "договор автолизинга"
    - "договор лизинга спецтехники"
    - "договор лизинга недвижимости"
    - "международный договор лизинга"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

