  - id: saldo_methodology_on_termination
    name: "Сальдо встречных обязательств при досрочном расторжении"
    description: >
      Ключевая проверка: как рассчитываются взаимные обязательства при
      досрочном расторжении. По Постановлению Пленума ВАС от 14.03.2014 №17
      (позиция воспринята ВС РФ) при расторжении рассчитывается сальдо:
      что получил лизингодатель vs что причитается лизингодателю.
      Отсутствие методики = высокий риск споров.
    triggers:
      any: ["saldo_methodology_present", "default_and_enforcement"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сальдо встречных обязательств"
        - "расчёт сальдо"
        - "завершающая обязанность"
        - "возврат разницы"
        - "стоимость возвращённого предмета"
        - "рыночная стоимость"
        - "при расторжении"
        - "методика расчёта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сальдо\\s+встречн"
        - "(?i)завершающ(ая|ей)\\s+обязанност"
        - "(?i)стоимост.*возвращ(ённого|енного)\\s+предмет"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Проверь, как урегулирован расчёт взаимных обязательств при досрочном расторжении.

        По Постановлению Пленума ВАС РФ от 14.03.2014 №17 (принято ВС РФ):
        - При расторжении стороны рассчитывают «сальдо встречных обязательств»
        - Лизингодатель вправе получить: сумму лизинговых платежей + плату за финансирование
          + убытки + неустойки — всё, что уже получил (платежи + стоимость возвращённого имущества)
        - Разница определяет, кто кому должен
        - Если договор не содержит методики — применяется судебная практика, но это
          создаёт неопределённость и споры

        Ответь строго в JSON:
        {
          "saldo_methodology_present": "<yes / partial / no>",
          "valuation_method_for_returned_asset": "<market / book / formula / not_specified / not_found>",
          "financing_cost_disclosed": "<yes / no / not_found>",
          "excess_return_to_lessee": "<yes / no / unclear / not_found>",
          "compliance_with_plenum_17": "<aligned / deviates / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "сальдо"
        - "расторжение"
        - "завершающая обязанность"
        - "возврат предмета"
        - "рыночная стоимость"
        - "плата за финансирование"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "saldo_methodology_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Есть ли методика расчёта сальдо"
        - name: "valuation_method_for_returned_asset"
          type: "string"
          allowed_values: ["market", "book", "formula", "not_specified", "not_found"]
          description: "Метод оценки возвращённого предмета"
        - name: "compliance_with_plenum_17"
          type: "string"
          allowed_values: ["aligned", "deviates", "not_found"]
          description: "Соответствие позиции Пленума ВАС №17"
      store_payload: true

