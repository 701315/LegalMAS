        - "протокол недостатков"
        - "рекламация"
        - "осмотр"
        - "проверка комплектности"
        - "дата передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*прием.*передач.*предмет.*лизинг"
        - "(?i)протокол\\s+недостатк"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Проверь порядок приёмки предмета лизинга от продавца.

        Ответь строго в JSON:
        {
          "acceptance_procedure_present": "<yes / partial / no>",
          "who_accepts": "<lessee / lessor / both / not_specified>",
          "defect_protocol_required": "<yes / no / not_found>",
          "claim_deadline_days": "<срок рекламации в днях или not_found>",
          "delivery_location": "<описание или not_found>",
          "delivery_deadline": "<срок поставки или not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "приёмка"
        - "передача предмета лизинга"
        - "акт"
        - "недостатки"
        - "рекламация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "acceptance_procedure_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Урегулирован ли порядок приёмки"
        - name: "who_accepts"
          type: "string"
          allowed_values: ["lessee", "lessor", "both", "not_specified"]
          description: "Кто принимает предмет лизинга"
      store_payload: true

  - id: maintenance_repair_allocation
    name: "Содержание, текущий ремонт и техобслуживание предмета лизинга"
    description: >
      Проверяет распределение обязанностей по содержанию и ремонту предмета лизинга.
      По ФЗ-164 и общим нормам аренды расходы по содержанию несёт лизингополучатель,
      но в full-service лизинге обязанности могут перераспределяться.
    triggers:
      any: ["maintenance_included", "movable_high_value_asset", "vehicle_leasing"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "техническое обслуживание"
        - "текущий ремонт"
        - "капитальный ремонт"
        - "содержание предмета лизинга"
        - "расходы на эксплуатацию"
        - "ТО"
        - "сервисное обслуживание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ(ое|ого)\\s+обслуживан"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)содержан.*предмет.*лизинг"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Проверь распределение обязанностей по содержанию и ремонту.

        По общему правилу:
        - Текущий ремонт и содержание — обязанность лизингополучателя
        - Капитальный ремонт — зависит от условий договора
        - В full-service лизинге — часть обслуживания берёт лизингодатель

        Ответь строго в JSON:
        {
          "current_maintenance_party": "<lessee / lessor / shared / not_specified / not_found>",
          "capital_repair_party": "<lessee / lessor / shared / not_specified / not_found>",
          "technical_service_included": "<yes / no / partial / not_found>",
          "cost_allocation_described": "<yes / no / partial>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "техническое обслуживание"
        - "текущий ремонт"
        - "содержание"
        - "эксплуатация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "current_maintenance_party"
          type: "string"
          allowed_values: ["lessee", "lessor", "shared", "not_specified", "not_found"]
          description: "На ком текущее содержание"
        - name: "technical_service_included"
          type: "string"
          allowed_values: ["yes", "no", "partial", "not_found"]
          description: "Включено ли техобслуживание"
      store_payload: true

  - id: asset_return_procedure
    name: "Возврат предмета лизинга по окончании срока"
    description: >
      Проверяет порядок и условия возврата предмета лизинга при отсутствии выкупа
      или при расторжении. Топовый источник споров: какое состояние считается
      допустимым, кто оплачивает транспортировку, сроки и штрафы за невозврат,
      определение нормального износа vs повреждений.
    triggers:
      any: ["asset_return_scenario", "default_and_enforcement"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат предмета лизинга"
        - "возвратить предмет"
        - "акт возврата"
        - "состояние предмета"
        - "нормальный износ"
        - "естественный износ"
        - "транспортировка"
        - "демонтаж"
        - "штраф за невозврат"
        - "удержание за просрочку"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+предмет.*лизинг"
        - "(?i)акт\\s+возврат"
        - "(?i)нормальн(ый|ого)\\s+износ"
        - "(?i)штраф.*невозврат"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Проверь условия возврата предмета лизинга по окончании срока (или при расторжении).

        Это один из главных источников споров в лизинговых сделках.
        Ключевые вопросы:
        - В каком состоянии должен быть возвращён предмет
        - Как определяется «нормальный износ» vs «повреждения»
        - Кто оплачивает транспортировку/демонтаж
        - Сроки возврата и санкции за просрочку
        - Место и порядок передачи (акт, осмотр, оценщик)

        Ответь строго в JSON:
        {
          "return_procedure_present": "<yes / partial / no>",
          "condition_standard": "<normal_wear / original / specific_criteria / not_specified / not_found>",
          "wear_assessment_method": "<independent_appraiser / joint_inspection / lessor_discretion / not_specified / not_found>",
          "return_deadline_days": "<срок возврата в днях или not_found>",
          "return_location": "<описание места возврата или not_found>",
          "transport_cost_party": "<lessee / lessor / shared / not_specified / not_found>",
          "penalty_for_late_return": "<yes / no / not_found>",
          "penalty_amount_or_formula": "<формула/сумма или not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "возврат предмета"
        - "акт возврата"
        - "состояние"
        - "нормальный износ"
        - "штраф за невозврат"
        - "транспортировка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "return_procedure_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Урегулирован ли порядок возврата"
        - name: "condition_standard"
          type: "string"
          allowed_values: ["normal_wear", "original", "specific_criteria", "not_specified", "not_found"]
          description: "Стандарт состояния при возврате"
        - name: "transport_cost_party"
          type: "string"
          allowed_values: ["lessee", "lessor", "shared", "not_specified", "not_found"]
          description: "Кто несёт расходы на транспортировку"
        - name: "penalty_for_late_return"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли штраф за невозврат/просрочку"
      store_payload: true

