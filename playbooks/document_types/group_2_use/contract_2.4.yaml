shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "illegal_lizing_subject_land_or_nature"
    name: "Недопустимый предмет лизинга: земля и природные объекты"
    description: >
      Земельные участки и иные природные объекты не могут быть предметом лизинга.
      Выявление таких объектов в предмете создает критический риск недействительности
      или неверной квалификации конструкции.
    legal_base: "ст. 666 ГК РФ, ФЗ № 164-ФЗ"
    required_triggers: ["illegal_subject_land_or_nature"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "земельный участок"
        - "земля"
        - "лесной участок"
        - "водный объект"
        - "природный объект"
        - "недра"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "земельный участок"
        - "природный объект"
        - "ст. 666 ГК РФ"
      rerank: true

  - id: "reclassification_to_general_lease_risk"
    name: "Риск переквалификации: отсутствует обязательство приобрести предмет у продавца"
    description: >
      Если договор не содержит purchase leg — обязанности лизингодателя приобрести
      имущество у определенного продавца — конструкция может быть переквалифицирована
      в обычную аренду с правом выкупа или иную модель.
    legal_base: "ст. 665 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "приобрести в собственность"
        - "у определенного продавца"
        - "лизингодатель обязуется приобрести"
        - "продавец"
      keyword_mode: "any"
      negative_keywords:
        - "обычная аренда"
        - "арендодатель уже является собственником предмета"
    retrieval:
      context_k: 5
      boost_keywords:
        - "приобрести в собственность"
        - "определенный продавец"
        - "ст. 665 ГК РФ"
      rerank: true

  - id: "cross_border_sanctions_and_currency_risk"
    name: "Трансграничный лизинг: санкционные, валютные и jurisdictional риски"
    description: >
      Для международного лизинга требуется дополнительная проработка санкционного режима,
      валютных платежей, применимого права, юрисдикции, tax gross-up и compliance.
    legal_base: "Раздел VI ГК РФ, валютное и санкционное регулирование, ФЗ № 115-ФЗ"
    required_triggers: ["cross_border_indicators"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "иностранная валюта"
        - "нерезидент"
        - "международный лизинг"
        - "санкции"
        - "арбитраж"
        - "применимое право"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "международный лизинг"
        - "санкции"
        - "применимое право"
        - "валютные риски"
      rerank: true

  - id: "sale_leaseback_requalification_risk"
    name: "Возвратный лизинг: риск переквалификации в заём / притворную сделку"
    description: >
      Если продавец и лизингополучатель — одно лицо (sale-leaseback), конструкция
      может быть переквалифицирована в притворную сделку, прикрывающую заём под залог
      имущества. Особенно высок риск при отсутствии деловой цели, завышенной оценке
      предмета, или при банкротстве лизингополучателя (оспаривание по ст. 61.2 ФЗ-127).
      Практика: Определение ВС РФ от 23.03.2017 № 307-ЭС16-3765, Обзор ВС РФ от 27.11.2013.
    legal_base: "ст. 170 ГК РФ, ст. 10 ГК РФ, ст. 61.2 ФЗ-127, практика ВС РФ"
    required_triggers: ["sale_leaseback"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "возвратный лизинг"
        - "обратный лизинг"
        - "sale-leaseback"
        - "продавец и лизингополучатель совпадают"
        - "продавец одновременно является лизингополучателем"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "возвратный лизинг"
        - "продавец и лизингополучатель"
        - "деловая цель"
        - "притворная сделка"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: leasing_structure_extraction
    name: "Лизинг: извлечение структуры сделки и ключевых ролей"
    description: >
      Извлекает предмет лизинга, продавца, лизингодателя, лизингополучателя,
      purchase leg, lease leg и наличие выкупной модели.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "лизингодатель"
        - "лизингополучатель"
        - "продавец"
        - "предмет лизинга"
        - "приобрести в собственность"
        - "выкупная цена"
        - "лизинговые платежи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лизингодател"
        - "(?i)лизингополучател"
        - "(?i)приобрести\\s+в\\s+собственность"
        - "(?i)выкупн(ая|ой)\\s+цен"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Извлеки базовую структуру сделки.

        Ответь строго в JSON:
        {
          "purchase_leg_present": "<yes / no / unclear>",
          "vendor_identified": "<yes / no / partial>",
          "who_selected_vendor": "<lessee / lessor / unclear / not_found>",
          "asset_type": "<equipment / vehicle / real_estate / other / mixed / not_found>",
          "purchase_option_present": "<yes / no / not_found>",
          "parties_complete": "<yes / no / partial>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "лизингодатель"
        - "лизингополучатель"
        - "продавец"
        - "приобрести в собственность"
        - "выкупная цена"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "purchase_leg_present"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Есть ли обязательство приобрести предмет"
        - name: "who_selected_vendor"
          type: "string"
          allowed_values: ["lessee", "lessor", "unclear", "not_found"]
          description: "Кто выбрал продавца"
        - name: "asset_type"
          type: "string"
          allowed_values: ["equipment", "vehicle", "real_estate", "other", "mixed", "not_found"]
          description: "Тип предмета лизинга"
      store_payload: true

  - id: leasing_subject_and_illegal_object_check
    name: "Предмет лизинга и допустимость объекта"
    description: >
      Проверяет описание предмета лизинга, индивидуализацию и отсутствие
      запрещенных объектов (земли/природных объектов).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет лизинга"
        - "оборудование"
        - "автомобиль"
        - "недвижимость"
        - "земельный участок"
        - "серийный номер"
        - "VIN"
        - "кадастровый номер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)серийн(ый|ого)\\s+номер"
    llm:
      prompt_template: |
