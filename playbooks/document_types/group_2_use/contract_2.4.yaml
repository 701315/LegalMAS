    name: "Международный лизинг: применимое право, валюта, арбитраж"
    description: "Проверяет cross-border clauses при иностранном элементе"
    legal_base: "Раздел VI ГК РФ, ФЗ № 164-ФЗ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["cross_border_indicators"]
    rules:
      keywords:
        - "применимое право"
        - "арбитражная оговорка"
        - "иностранная валюта"
        - "международный лизинг"
        - "юрисдикция"
        - "нерезидент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав"
        - "(?i)арбитражн(ая|ой)\\s+оговорк"
        - "(?i)нерезидент|иностранн(ая|ого)"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет court/arbitration/forum и претензионный порядок"
    legal_base: "АПК РФ, Закон об арбитраже"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "арбитражный суд"
        - "третейский суд"
        - "подсудность"
        - "претензионный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)третейск(ий|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "leasing_term_required"
    name: "Срок договора лизинга"
    description: "Срок — существенное условие договора лизинга. Без него договор незаключён."
    legal_base: "ст. 15 ФЗ № 164-ФЗ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок лизинга"
        - "срок действия"
        - "заключен на срок"
        - "период лизинга"
        - "с даты"
        - "по дату"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+(лизинга|действия|договора)\\s+составляет"
        - "(?i)с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}.*по\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"

  - id: "lessee_direct_claim_right"
    name: "Право лизингополучателя на прямые требования к продавцу (ст. 670 ГК РФ)"
    description: "Проверяет наличие/ограничение права прямого иска к продавцу"
    legal_base: "ст. 670 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "требования к продавцу"
        - "претензии к продавцу"
        - "солидарная ответственность"
        - "качество предмета"
        - "недостатки"
        - "рекламация"
        - "ст. 670"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)требовани(я|й).*к.*продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"

  - id: "delivery_timeline_and_delay"
    name: "Срок поставки предмета лизинга и последствия просрочки"
    description: "Проверяет наличие сроков поставки и санкций за просрочку"
    legal_base: "ст. 668 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок поставки"
        - "дата передачи"
        - "просрочка поставки"
        - "задержка поставки"
        - "неустойка за просрочку"
        - "расторжение при непоставке"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+поставк"
        - "(?i)просрочк.*поставк"
        - "(?i)передач.*не\\s+позднее"

  - id: "improvements_and_modifications"
    name: "Улучшения и модификации предмета лизинга"
    description: "Проверяет порядок внесения улучшений и их судьбу по окончании лизинга"
    legal_base: "ст. 623 ГК РФ (субсидиарно), ФЗ № 164-ФЗ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "улучшения"
        - "модификация"
        - "дооснащение"
        - "модернизация"
        - "неотделимые улучшения"
        - "отделимые улучшения"
        - "без согласия лизингодателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(неотделим|отделим)(ые|ых)\\s+улучшен"
        - "(?i)модификац|модернизац|дооснащен"

  - id: "liability_and_indemnification"
    name: "Ответственность сторон и возмещение убытков"
    description: "Проверяет наличие условий об ответственности, неустойках и индемнити"
    legal_base: "ГК РФ (общие положения)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственность сторон"
        - "неустойка"
        - "штраф"
        - "пеня"
        - "возмещение убытков"
        - "ограничение ответственности"
        - "индемнити"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*\\d+.*%"
        - "(?i)ответственност.*сторон"
        - "(?i)возмещен.*убытк"

  - id: "force_majeure_clause"
    name: "Форс-мажор и обстоятельства непреодолимой силы"
    description: "Проверяет наличие оговорки о форс-мажоре"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "обстоятельства непреодолимой силы"
        - "освобождение от ответственности"
        - "чрезвычайные обстоятельства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"

  - id: "confidentiality_clause"
    name: "Конфиденциальность и неразглашение условий сделки"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не раскрывать третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "asset_return_conditions"
    name: "Условия и порядок возврата предмета лизинга"
    description: "Проверяет наличие условий возврата, допустимого состояния и санкций за невозврат"
    legal_base: "ФЗ № 164-ФЗ, общие положения об аренде (ст. 622 ГК РФ)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["asset_return_scenario"]
    rules:
      keywords:
        - "возврат предмета"
        - "акт возврата"
        - "надлежащее состояние"
        - "нормальный износ"
        - "транспортировка"
        - "демонтаж"
        - "место возврата"
        - "штраф за невозврат"
        - "удержание за просрочку возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+предмет"
        - "(?i)нормальн(ый|ого)\\s+износ"
        - "(?i)штраф.*невозврат"

  - id: "lessor_title_warranty"
    name: "Гарантия чистоты титула лизингодателя"
    description: "Проверяет наличие заверений лизингодателя об отсутствии обременений и прав третьих лиц на предмет лизинга"
    legal_base: "ст. 665, 667 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "гарантирует отсутствие обременений"
        - "свободен от прав третьих лиц"
        - "не заложен"
        - "не находится под арестом"
        - "титул"
        - "право собственности лизингодателя"
        - "чистота права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лизингодател.*гарантирует.*отсутствие"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"

  - id: "use_and_location_restrictions"
    name: "Ограничения по использованию и перемещению предмета лизинга"
    description: "Проверяет наличие ковенантов по эксплуатации, перемещению и целевому использованию предмета"
    legal_base: "ФЗ № 164-ФЗ, свобода договора (ст. 421 ГК РФ)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "место нахождения"
        - "место эксплуатации"
        - "запрет перемещения"
        - "без согласия лизингодателя"
        - "целевое использование"
        - "только для"
        - "запрещается использовать"
        - "территория эксплуатации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)без.*согласия.*лизингодател.*(перемещ|перевоз|вывоз)"
        - "(?i)(место|территория)\\s+эксплуатац"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_vendor_specification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты лизингодателя,
      лизингополучателя и продавца, а также кто именно выбирает продавца
      и предмет лизинга.
    addressee: "Обе стороны / Юридический советник"

  leasing_structure_extraction:
    text: >
      Просим предоставить по {doc_names}: структуру сделки, описание purchase leg,
      lease leg, выбор продавца, предмета лизинга и наличие выкупной модели.
    addressee: "Лизингодатель / Юридический советник"

  vendor_selection_allocation:
    text: >
      Просим уточнить в {doc_names}: кем выбран продавец и кто несет риск
      его выбора, включая последствия по качеству и поставке предмета лизинга.
    addressee: "Юридический советник"

  leasing_subject_and_illegal_object_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание предмета лизинга,
      его технические характеристики, идентификаторы, а также подтверждение,
      что предмет не относится к недопустимым объектам лизинга.
    addressee: "Продавец / Лизингодатель"

  leasing_subject_detailed:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный номер/VIN,
      кадастровые данные (если применимо), стоимость и комплектность предмета лизинга.
    addressee: "Продавец / Лизингодатель"

  illegal_subject_check:
    text: >
      Внимание: по {doc_names} требуется подтвердить, что предмет лизинга
      не является земельным участком или иным природным объектом.
    addressee: "Юридический советник"

  payments_and_buyout_check:
    text: >
      Просим уточнить в {doc_names}: график лизинговых платежей, общую сумму,
      авансовый платеж, выкупную цену, остаточную стоимость и tax logic выкупной модели.
    addressee: "Финансовый советник / Юридический советник"

  leasing_payments_structure:
    text: >
      Просим предоставить по {doc_names}: график платежей, формулу расчета
      лизинговых платежей, размер аванса, валюту и порядок уплаты просроченной задолженности.
    addressee: "Лизингодатель"

  purchase_option_clear_terms:
    text: >
      Просим уточнить в {doc_names}: есть ли выкуп, какова выкупная цена,
      включена ли она в платежи, как реализуется переход права собственности.
    addressee: "Юридический советник"

  risk_transfer_and_insurance_check:
    text: >
      Просим уточнить в {doc_names}: момент перехода риска случайной гибели,
      обязанность страхования, страховую сумму, выгодоприобретателя и последствия total loss.
    addressee: "Лизингодатель / Страховой консультант"

  risk_transfer_moment:
    text: >
      Просим включить/уточнить в {doc_names}: момент перехода риска
      случайной гибели на лизингополучателя и влияние гибели предмета
      на обязательство по уплате лизинговых платежей.
    addressee: "Юридический советник"

  insurance_requirement_detailed:
    text: >
      Просим предоставить по {doc_names}: условия страхования предмета лизинга,
      форму полиса, страховую сумму, франшизу, выгодоприобретателя и сроки страхования.
    addressee: "Страховой консультант / Лизингодатель"

  default_remedies_and_recovery_check:
    text: >
      Просим уточнить в {doc_names}: default triggers, бесспорное списание,
      исполнительную надпись, repossession, acceleration и порядок одностороннего расторжения.
    addressee: "Юридический советник"

  uncontested_recovery_right:
    text: >
      Просим уточнить в {doc_names}: условия безакцептного списания,
      нотариальной исполнительной надписи, изъятия предмета лизинга и документирования default.
    addressee: "Юридический советник лизингодателя"

  balance_tax_and_amortization_check:
    text: >
      Просим уточнить в {doc_names}: кто является балансодержателем,
      применяется ли ускоренная амортизация, как урегулированы НДС,
      расходы и бухгалтерский учет предмета лизинга.
    addressee: "Налоговый консультант / Бухгалтер"

  balance_holder_specification:
    text: >
      Просим уточнить в {doc_names}: на чьем балансе учитывается предмет лизинга
      и какие последствия это имеет для амортизации и налога на имущество.
    addressee: "Бухгалтер / Налоговый консультант"

  tax_and_depreciation_clarity:
    text: >
      Просим предоставить по {doc_names}: налоговый memo по НДС, амортизации,
      расходам по лизинговым платежам, выкупной модели и риску переквалификации.
    addressee: "Налоговый консультант"

  registration_and_asset_specifics_check:
    text: >
      Просим уточнить в {doc_names}: кто регистрирует предмет лизинга,
      на кого оформляется учет в ГИБДД/Росреестре и кто несет регистрационные расходы.
    addressee: "Юридический советник / Лизингодатель"

  registration_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок регистрации ТС/недвижимости,
      распределение расходов, комплект регистрационных документов и ответственность
      за несвоевременную регистрацию.
    addressee: "Юридический советник"

  subleasing_clause:
    text: >
      Просим уточнить в {doc_names}: допускается ли сублизинг,
      требуется ли согласие лизингодателя и в каком порядке оно оформляется.
    addressee: "Юридический советник"

  bankruptcy_protection_mechanisms:
    text: >
      Просим предоставить по {doc_names}: последствия банкротства сторон,
      режим конкурсной массы, право на изъятие предмета и защиту выкупных прав.
    addressee: "Юридический советник / Insolvency counsel"

  cross_border_leasing_protection:
    text: >
      Просим предоставить по {doc_names}: применимое право, forum/arbitration clause,
      валютные условия, sanctions/AML memo и risk allocation по трансграничной структуре.
    addressee: "Cross-border counsel / Compliance"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, арбитражную оговорку,
      претензионный порядок и язык/место разрешения споров.
    addressee: "Юридический советник"

  illegal_lizing_subject_land_or_nature:
    text: >
      Внимание: {doc_names} содержит признаки недопустимого предмета лизинга
      (земля/природные объекты). Просим пересмотреть структуру сделки
      и дать правовое заключение по допустимости предмета.
    addressee: "Юридический советник"

  reclassification_to_general_lease_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить наличие purchase leg.
      При его отсутствии сделка может быть переквалифицирована в обычную аренду
      или иную конструкцию.
    addressee: "Юридический советник"

  cross_border_sanctions_and_currency_risk:
    text: >
      Внимание: {doc_names} содержит трансграничный элемент.
      Просим предоставить sanctions / currency / AML analysis,
      UBO information и conflict-of-laws memo.
    addressee: "Compliance / Cross-border counsel"

  vendor_direct_claims_670:
    text: >
      Просим уточнить в {doc_names}: как урегулировано право лизингополучателя
      на прямые требования к продавцу (ст. 670 ГК РФ); предусмотрена ли
      солидарная ответственность при выборе продавца лизингодателем;
      порядок рекламации и срок уведомления о недостатках.
    addressee: "Юридический советник"

  saldo_methodology_on_termination:
    text: >
      Просим предоставить по {doc_names}: методику расчёта сальдо встречных
      обязательств при досрочном расторжении (Постановление Пленума ВАС №17
      от 14.03.2014). В частности: как определяется стоимость возвращённого
      предмета (рыночная / балансовая / формула), раскрыта ли плата за
      финансирование, предусмотрен ли возврат разницы лизингополучателю.
    addressee: "Юридический советник / Финансовый советник"

  delivery_acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок приёмки предмета лизинга
      от продавца, кто участвует в приёмке, форма акта, порядок фиксации
      недостатков (протокол), сроки рекламации, место передачи.
    addressee: "Лизингодатель / Продавец"

  maintenance_repair_allocation:
    text: >
      Просим уточнить в {doc_names}: кто несёт расходы на текущее содержание
      и ремонт предмета лизинга, предусмотрено ли техобслуживание за счёт
      лизингодателя (full-service), порядок согласования капитального ремонта.
    addressee: "Обе стороны"

  leasing_term_required:
    text: >
      В {doc_names} не указан или нечётко указан срок лизинга. Это существенное
      условие (ст. 15 ФЗ-164). Просим указать: дату начала, дату окончания
      или способ их определения.
    addressee: "Обе стороны"

  lessee_direct_claim_right:
    text: >
      Просим включить в {doc_names}: порядок предъявления лизингополучателем
      требований к продавцу по качеству и комплектности (ст. 670 ГК РФ),
      условия солидарной ответственности, порядок рекламации.
    addressee: "Юридический советник"

  delivery_timeline_and_delay:
    text: >
      Просим уточнить в {doc_names}: срок поставки предмета лизинга,
      санкции за просрочку, право лизингополучателя на расторжение
      при непоставке (ст. 668 ГК РФ).
    addressee: "Продавец / Лизингодатель"

  improvements_and_modifications:
    text: >
      Просим уточнить в {doc_names}: порядок внесения улучшений и модификаций
      предмета лизинга, требуется ли согласие лизингодателя, судьба
      неотделимых улучшений при возврате предмета.
    addressee: "Юридический советник"

  liability_and_indemnification:
    text: >
      Просим уточнить в {doc_names}: размер неустоек, ограничение
      ответственности сторон, порядок возмещения убытков,
      наличие индемнити и его scope.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для обязательств сторон
      (приостановка платежей, продление срока лизинга).
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names}: раздел о конфиденциальности —
      перечень конфиденциальных сведений, срок неразглашения,
      исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  sale_leaseback_requalification_risk:
    text: >
      Внимание: {doc_names} содержит признаки возвратного лизинга.
      Просим предоставить: обоснование деловой цели конструкции,
      независимую оценку предмета лизинга, правовое заключение
      по рискам переквалификации в заём / притворную сделку
      (ст. 170 ГК РФ), особенно в контексте банкротства.
    addressee: "Юридический советник / Оценщик"

  asset_return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета лизинга
      по окончании срока (при отсутствии выкупа): допустимое состояние,
      метод оценки износа (совместный осмотр / независимый оценщик),
      место и сроки возврата, кто несёт расходы на транспортировку/демонтаж,
      штрафные санкции за невозврат или просрочку.
    addressee: "Обе стороны / Юридический советник"

  asset_return_conditions:
    text: >
      В {doc_names} не урегулированы или нечётко описаны условия возврата
      предмета лизинга. Просим включить: стандарт допустимого состояния
      (нормальный износ vs повреждения), порядок фиксации состояния,
      сроки, место и расходы по возврату, санкции за просрочку.
    addressee: "Юридический советник"

  lessor_title_warranty:
    text: >
      Просим включить в {doc_names} заверения лизингодателя: (а) предмет
      лизинга будет свободен от прав третьих лиц и обременений на момент
      передачи; (б) отсутствуют аресты, залоги и запреты; (в) лизингодатель
      обладает необходимыми полномочиями для заключения договора.
    addressee: "Юридический советник лизингодателя"

  use_and_location_restrictions:
    text: >
      Просим уточнить в {doc_names}: территорию и условия эксплуатации
      предмета лизинга, требуется ли согласие лизингодателя на перемещение,
      целевое назначение использования, запрет на определённые виды
      эксплуатации (если применимо).
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    