        - "(?i)договор\\s+финансов[ойой\\s]*аренд[ыыу]"
        - "(?i)лизингов[ыйое]\\s+договор"
        - "(?i)договор\\s+лизинг[ауы]\\s+оборудован[ияи]"
        - "(?i)договор\\s+автолизинг[ауы]"
        - "(?i)договор\\s+лизинг[ауы]\\s+спецтехник[иуы]"
        - "(?i)договор\\s+лизинг[ауы]\\s+недвижимост[иью]"
        - "(?i)международн[ыйое]\\s+договор\\s+лизинг[ауы]"
        - "(?i)финансов[аяое]\\s+аренд[ауы]"
        - "(?i)лизингодател[ьяеи]"
        - "(?i)лизингополучател[ьяеи]"
        - "(?i)предмет\\s+лизинг[ауы]"
        - "(?i)выкупн[аяое]\\s+цен[ауы]"
        - "(?i)выбор\\s+продавц[ауы]"
        - "(?i)лизингов[ыеых]\\s+платеж[ией]"
        - "(?i)график\\s+лизингов[ыхых]\\s+платеж[ейи]"

      medium:
        - "продавец"
        - "авансовый платеж"
        - "балансодержатель"
        - "ускоренная амортизация"
        - "остаточная стоимость"
        - "страхование предмета лизинга"
        - "сублизинг"
        - "исполнительная надпись"
        - "бесспорное списание"
        - "возвратный лизинг"
        - "обратный лизинг"
        - "sale-leaseback"
        - "техническое обслуживание"
        - "парк ТС"
