      непосредственно продавцу (о качестве, комплектности, сроках поставки).
      По ст. 670 ГК РФ лизингополучатель вправе предъявлять требования продавцу
      как если бы он был стороной договора купли-продажи (за исключением оплаты).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "требования к продавцу"
        - "претензии к продавцу"
        - "право предъявлять требования"
        - "солидарная ответственность"
        - "качество предмета"
        - "недостатки предмета лизинга"
        - "ст. 670"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)требовани(я|й).*к.*продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор лизинга.
        Проверь, как урегулировано право лизингополучателя на прямые требования к продавцу.

        По ст. 670 ГК РФ:
        - Лизингополучатель вправе предъявлять требования к продавцу по качеству,
          комплектности, срокам — как если бы был стороной договора купли-продажи
        - Если продавца выбрал лизингодатель — лизингодатель и продавец отвечают
          СОЛИДАРНО перед лизингополучателем
        - Лизингополучатель не может расторгнуть договор купли-продажи
          без согласия лизингодателя

        Ответь строго в JSON:
        {
          "direct_claim_right_mentioned": "<yes / no / not_found>",
          "solidarity_when_lessor_selected_vendor": "<yes / no / not_applicable / not_found>",
