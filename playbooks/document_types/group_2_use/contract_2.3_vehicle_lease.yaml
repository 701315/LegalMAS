  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Ограничения использования
  # ──────────────────────────────────────────────────────────────────────────
  - id: vehicle_usage_restrictions_check
    name: "Ограничения использования ТС: водители, территория, запрет передачи"
    description: >
      Фактографическая проверка требований к допущенным водителям,
      территориальных ограничений, запрета передачи управления третьим
      лицам и субаренды.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "водительское удостоверение"
        - "категория"
        - "стаж вождения"
        - "допущенные водители"
        - "запрет на передачу управления"
        - "территория эксплуатации"
        - "выезд за пределы"
        - "субаренда"
        - "без права передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)водительск(ое|ого)\\s+удостоверен"
        - "(?i)стаж\\s+вожден"
        - "(?i)территори(я|и)\\s+эксплуатац"
        - "(?i)выезд\\s+за\\s+пределы"
        - "(?i)субаренд"
        - "(?i)без\\s+права\\s+передач"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: ограничения использования ТС.

        Нормативный ориентир:
        - ст. 615 ГК РФ — использование арендованного имущества
        - страховая практика — допущенные водители

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли требования к водителям (стаж, категория, возраст).
        2. Есть ли перечень допущенных водителей.
        3. Есть ли запрет передачи управления третьим лицам.
        4. Есть ли территориальные ограничения.
        5. Есть ли запрет выезда за пределы РФ.
        6. Есть ли запрет субаренды.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ограничения указаны:
        Фрагмент:
        "Управление ТС допускается только лицами, указанными в Приложении № 2,
        со стажем вождения не менее 3 лет и категорией «B». Передача управления
        третьим лицам запрещена. ТС эксплуатируется только на территории г. Москвы
        и Московской области. Субаренда запрещена."

        Ответ:
        {
          "driver_requirements_status": "defined",
          "driver_requirements_details": "стаж не менее 3 лет, категория «B»",
          "allowed_drivers_list_status": "defined",
