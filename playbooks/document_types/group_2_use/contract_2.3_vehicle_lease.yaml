        Не анализируй плату, страхование, ДТП или возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. handover_act_status — "defined" если акт прямо предусмотрен, иначе "not_defined".
        2. handover_act_details — формулировка.
        3. condition_recorded_status — "defined" если состояние фиксируется, иначе "not_defined".
        4. condition_recorded_details — формулировка.
        5. mileage_recorded_status — "defined" если пробег фиксируется, иначе "not_defined".
