          display_priority: 3
        - name: "fines_summary_display"
          type: "string"
          presentation: "fact"
          label: "Компенсация штрафов"
          description: "Сводная информация о механизме возмещения штрафов (ГИБДД, МАДИ, Платон, весогабарит, сроки, удержание из депозита)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_usage_restrictions_check
    name: "Ограничения использования ТС: водители, территория, запрет передачи и субаренды"
    description: >
      Фактографическая проверка квалификационных требований к допущенным водителям
      (возраст, стаж вождения, категория прав), списка уполномоченных лиц,
      запрета передачи управления третьим лицам, территориальных ограничений
      (субъекты РФ, запрет выезда за рубеж), запрета субаренды и ограничений
      по целевому использованию (запрет такси, гонок, буксировки, бездорожья)
      по ст. 615, 631, 647 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "водительское удостоверение"
        - "категория"
        - "стаж вождения"
        - "возраст водителя"
        - "допущенные водители"
        - "список водителей"
        - "запрет на передачу управления"
        - "без права передачи"
        - "территория эксплуатации"
        - "выезд за пределы"
        - "за пределы РФ"
        - "субаренда"
        - "такси"
        - "перевозка пассажиров"
        - "буксировка"
        - "соревнования"
        - "гонки"
        - "бездорожье"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)водительск[а-я]*\\s+удостоверен[а-я]*"
        - "(?i)стаж[а-я]*\\s+вожден[а-я]*"
        - "(?i)территори[а-я]*\\s+эксплуатац[а-я]*"
        - "(?i)выезд[а-я]*\\s+за\\s+предел[а-я]*"
        - "(?i)субаренд[а-я]*"
        - "(?i)без\\s+права\\s+передач[а-я]*"
        - "(?i)(?:в\\s+качестве\\s+)?такси|буксировк[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются ограничения и правила целевой эксплуатации ТС (требования к водителям,
        передача третьим лицам, территория использования, запрет выезда за границу, субаренда, запрет такси/гонок).

        Нормативный ориентир:
        - ст. 615 ГК РФ — пользование арендованным имуществом в соответствии с условиями договора и его назначением.
        - ст. 631 ГК РФ — субаренда при аренде ТС с экипажем (допускается без согласия арендодателя, если иное не установлено договором).
        - ст. 647 ГК РФ — субаренда при аренде ТС без экипажа (допускается только с согласия арендодателя).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требования к водителям (минимальный возраст, стаж вождения, категория водительского удостоверения).
        2. Список/перечень допущенных водителей (поименный список, сотрудники арендатора или отсылка к приложению).
        3. Запрет передачи управления ТС третьим лицам без согласия Арендодателя.
        4. Территориальные ограничения эксплуатации ТС (разрешенные регионы, субъекты РФ, город/область).
        5. Запрет выезда за пределы Российской Федерации (за рубеж).
        6. Запрет сдачи ТС в субаренду (субфрахтование) и запрет коммерческого использования (такси, обучение вождению, буксировка, гонки).
        7. Сформируй сводное читаемое поле usage_restrictions_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — строгие ограничения по водителям, территории и целевому назначению:
        Фрагмент:
        "4.1. К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей
        (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет.
        Передача управления любым третьим лицам категорически запрещена.
        4.2. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области.
        Выезд за пределы указанной территории, а также выезд за пределы территории РФ запрещён.
        4.3. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси,
        для буксировки других ТС, а также для участия в спортивных соревнованиях."

        Ответ:
        {
          "driver_requirements_status": "defined",
          "driver_requirements_details": "штатные водители, возраст от 23 лет, стаж вождения категории «B» от 3 лет",
          "allowed_drivers_list_status": "defined",
          "allowed_drivers_list_details": "лица, указанные в Списке водителей (Приложение № 2)",
          "transfer_prohibition_status": "defined",
          "transfer_prohibition_details": "передача управления любым третьим лицам категорически запрещена",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория г. Москвы и Московской области",
          "cross_border_restriction_status": "defined",
          "cross_border_restriction_details": "выезд за пределы территории РФ запрещён",
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "субаренда запрещена; запрещено использовать как такси, для буксировки и соревнований",
          "usage_restrictions_summary_display": "Водители: возраст 23+, стаж 3 г. (Приложение №2) | Территория: Москва и МО (выезд за рубеж запрещён) | Субаренда, такси и буксировка запрещены",
          "evidence": [
            {
              "clause_ref": "п. 4.1–4.3",
              "quote": "К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет. Передача управления любым третьим лицам категорически запрещена. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области. Выезд за пределы территории РФ запрещён. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси..."
            }
          ]
        }

        Пример 2 — только базовая территория без ограничений водителей:
        Фрагмент:
        "3.4. Автомобиль используется для служебных поездок по территории Северо-Западного федерального округа."

        Ответ:
        {
          "driver_requirements_status": "not_defined",
          "driver_requirements_details": "Не установлено",
          "allowed_drivers_list_status": "not_defined",
          "allowed_drivers_list_details": "Не установлено",
          "transfer_prohibition_status": "not_defined",
          "transfer_prohibition_details": "Не установлено",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория Северо-Западного федерального округа",
