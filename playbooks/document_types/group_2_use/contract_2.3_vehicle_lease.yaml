          label: "Плановое ТО и расходники"
          description: "Распределение обязанностей по плановому ТО и расходным материалам."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "seasonal_tires_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сезонных шин."
          required: true
          display_in_grid: false
        - name: "seasonal_tires_details"
          type: "string"
          presentation: "fact"
          label: "Сезонные шины"
          description: "Сезонная замена шин и хранение резины."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "maintenance_summary_display"
          type: "string"
          presentation: "fact"
          label: "ТО и сезонное обслуживание"
          description: "Сводка обязанностей по ТО, расходникам и сезонным шинам."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_driver_medical_check
    name: "Медицинский осмотр водителей (предрейсовый / послерейсовый)"
    description: >
      Фактографическая проверка наличия обязанности по организации
      предрейсовых и послерейсовых медицинских осмотров водителей
      (для коммерческого транспорта, автобусов, такси, грузовых перевозок)
      и распределения ответственности за допуск водителя без медосмотра
      или в состоянии опьянения (ФЗ № 196-ФЗ, Приказ Минздрава № 835н).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "медицинский осмотр"
        - "предрейсовый"
        - "послерейсовый"
        - "медосмотр"
        - "допуск водителя"
        - "путевой лист"
        - "состояние опьянения"
        - "алкогольное опьянение"
        - "наркологический"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)медицинск[а-я]*\\s+осмотр"
        - "(?i)предрейсов[а-я]*|послерейсов[а-я]*"
        - "(?i)медосмотр"
        - "(?i)путев[а-я]*\\s+лист"
        - "(?i)опьянен[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется наличие обязанности по организации медицинских осмотров водителей
        (предрейсовых / послерейсовых) и ответственность за допуск водителя без осмотра.

        Нормативный ориентир:
        - ФЗ № 196-ФЗ «О безопасности дорожного движения» (ст. 20, 23) — обязательность
          предрейсовых и послерейсовых медосмотров для юрлиц и ИП, эксплуатирующих транспорт.
        - Приказ Минздрава России от 15.12.2014 № 835н — порядок проведения
          предрейсовых и послерейсовых медицинских осмотров.
        - ст. 12.32 КоАП РФ — штраф за допуск водителя без медосмотра (на юрлицо до 130 000 руб.).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли обязанность по предрейсовым и/или послерейсовым медосмотрам водителей.
        2. На какой стороне лежит обязанность организации и оплаты медосмотров (Арендодатель / Арендатор).
        3. Распределена ли ответственность за допуск водителя без медосмотра или в состоянии
           алкогольного/наркотического опьянения.
        4. Сформируй сводное поле medical_check_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — медосмотр урегулирован (коммерческие грузоперевозки):
        Фрагмент:
        "4.5. Арендатор обязан обеспечить прохождение всеми водителями предрейсовых
        и послерейсовых медицинских осмотров в соответствии с требованиями ФЗ № 196-ФЗ
        и Приказа Минздрава № 835н. Расходы на организацию медосмотров несёт Арендатор.
        4.6. Категорически запрещается допуск к управлению ТС водителя, не прошедшего
        предрейсовый медосмотр или находящегося в состоянии алкогольного или наркотического
        опьянения. Вся ответственность за нарушение данного требования, включая штрафы
        по ст. 12.32 КоАП РФ, возлагается на Арендатора."

        Ответ:
        {
          "medical_check_obligation_status": "defined",
          "medical_check_obligation_details": "Арендатор обеспечивает предрейсовые и послерейсовые медосмотры по ФЗ № 196-ФЗ и Приказу № 835н за свой счёт",
          "medical_check_responsibility_status": "defined",
          "medical_check_responsibility_details": "запрет допуска без медосмотра или в состоянии опьянения; штрафы по ст. 12.32 КоАП на Арендаторе",
          "medical_check_summary_display": "Медосмотры (предрейс/послерейс): на Арендаторе | Допуск без осмотра или в опьянении запрещён (штрафы на Арендаторе)",
          "evidence": [
            {
              "clause_ref": "п. 4.5–4.6",
              "quote": "Арендатор обязан обеспечить прохождение всеми водителями предрейсовых и послерейсовых медицинских осмотров в соответствии с требованиями ФЗ № 196-ФЗ. Категорически запрещается допуск к управлению ТС водителя, не прошедшего предрейсовый медосмотр или находящегося в состоянии алкогольного или наркотического опьянения."
            }
          ]
        }

        Пример 2 — только общий запрет без деталей:
        Фрагмент:
        "3.2. Арендатор не вправе допускать к управлению ТС лиц в состоянии опьянения."

        Ответ:
        {
          "medical_check_obligation_status": "not_defined",
          "medical_check_obligation_details": "Не установлено",
          "medical_check_responsibility_status": "defined",
          "medical_check_responsibility_details": "запрет допуска к управлению в состоянии опьянения",
          "medical_check_summary_display": "Запрет управления в опьянении | Организация медосмотров не урегулирована",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Арендатор не вправе допускать к управлению ТС лиц в состоянии опьянения."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует ТС для грузоперевозок по территории РФ."

        Ответ:
        {
          "medical_check_obligation_status": "not_defined",
          "medical_check_obligation_details": "Не установлено",
          "medical_check_responsibility_status": "not_defined",
          "medical_check_responsibility_details": "Не установлено",
          "medical_check_summary_display": "Медицинские осмотры водителей не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о медосмотрах, предрейсовых/послерейсовых осмотрах или путевых листах.
        2. Проверь, на какой стороне лежит обязанность организации.
        3. Проверь наличие запрета допуска без осмотра / в опьянении и распределение штрафов.
        4. Сформируй сводку medical_check_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "medical_check_obligation_status": "<defined / not_defined>",
          "medical_check_obligation_details": "<текст или 'Не установлено'>",
          "medical_check_responsibility_status": "<defined / not_defined>",
          "medical_check_responsibility_details": "<текст или 'Не установлено'>",
          "medical_check_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "медицинский осмотр предрейсовый послерейсовый медосмотр допуск водителя путевой лист состояние опьянения алкогольное опьянение наркологический"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_driver_medical_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС условия
        по медицинским осмотрам водителей: предрейсовые/послерейсовые осмотры,
        обязанность организации и ответственность за допуск без осмотра или в опьянении.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_driver_medical_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (medical_check_obligation_status, medical_check_responsibility_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - medical_check_obligation_status = "not_defined";
           - medical_check_responsibility_status = "not_defined";
           - все *_details = "Не установлено";
           - medical_check_summary_display = "Медицинские осмотры водителей не урегулированы";
           - не выполняй остальные шаги.

        1. medical_check_obligation_status:
           - "defined" — если обязанность по медосмотрам (предрейсовым/
             послерейсовым) прямо установлена;
           - "not_defined" — если не установлена.

        2. medical_check_obligation_details:
           Кто организует и оплачивает медосмотры, ссылка на ФЗ № 196-ФЗ /
           Приказ № 835н (если есть в тексте).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. medical_check_responsibility_status:
           - "defined" — если ответственность за допуск водителя без
             медосмотра или в состоянии опьянения прямо распределена;
           - "not_defined" — если не распределена.

        4. medical_check_responsibility_details:
           Формулировка о запрете допуска и распределении штрафов /
           ответственности.
           Если данных нет — "Не установлено".

        5. medical_check_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: медосмотры (кто, за чей счёт), допуск (запреты, штрафы).
            Строится на основе других полей — не добавляй данные, которых
            нет в них.
            Если presence = "missing" — "Медицинские осмотры водителей
            не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_driver_medical_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", medical_check_summary_display = "Медицинские осмотры водителей не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - medical_check_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указан только общий запрет "не допускать в состоянии опьянения" без медосмотров — medical_check_obligation_status = "not_defined", medical_check_responsibility_status = "defined".
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни медосмотров, ни запрета допуска,
           ни ответственности за опьянение.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             medical_check_summary_display = "Медицинские осмотры водителей не урегулированы".

        2. Только запрет опьянения без медосмотров.
           Указан запрет допуска к управлению в состоянии опьянения,
           но предрейсовые/послерейсовые медосмотры не упомянуты.
           → presence = "present";
             medical_check_obligation_status = "not_defined";
             medical_check_responsibility_status = "defined";
             medical_check_summary_display отражает только запрет опьянения.

        3. Противоречие в распределении ответственности.
           В одном пункте "ответственность за допуск на Арендаторе",
           в другом — "Арендодатель контролирует допуск водителей".
           → presence = "unclear";
             medical_check_responsibility_status = "not_defined";
             medical_check_responsibility_details = "Не удалось определить".

        4. Аренда с экипажем (медосмотры на Арендодателе).
           Арендодатель предоставляет экипаж и организует медосмотры
           своих водителей.
           → presence = "present";
             medical_check_obligation_status = "defined";
             medical_check_obligation_details отражает, что осмотры
             на Арендодателе;
             medical_check_responsibility_status определяется отдельно.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_driver_medical_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * medical_check_summary_display → "Медицинские осмотры водителей не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * medical_check_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_driver_medical_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования медосмотров водителей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "medical_check_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности по медосмотрам."
          required: true
          display_in_grid: false
        - name: "medical_check_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Медосмотры водителей"
          description: "Обязанность по организации предрейсовых/послерейсовых медосмотров (кто, за чей счёт)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "medical_check_responsibility_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за допуск без осмотра."
          required: true
          display_in_grid: false
        - name: "medical_check_responsibility_details"
          type: "string"
          presentation: "fact"
          label: "Допуск без осмотра / опьянение"
          description: "Запрет допуска водителя без медосмотра или в состоянии опьянения и распределение штрафов."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "medical_check_summary_display"
          type: "string"
          presentation: "fact"
          label: "Медосмотры и допуск водителей"
          description: "Сводка условий по медосмотрам водителей и ответственности за допуск без осмотра."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_usage_restrictions_check
    name: "Ограничения использования ТС: водители, территория, запрет передачи, субаренды и модификации"
    description: >
      Фактографическая проверка квалификационных требований к допущенным водителям
      (возраст, стаж вождения, категория прав), списка уполномоченных лиц,
      запрета передачи управления третьим лицам, территориальных ограничений
      (субъекты РФ, запрет выезда за рубеж), запрета субаренды и ограничений
      по целевому использованию (запрет такси, гонок, буксировки, бездорожья),
      а также запрета модификации ТС (ГБО, тонировка, допоборудование,
      изменение конструкции) по ст. 615, 631, 647 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "водительское удостоверение"
        - "категория"
        - "стаж вождения"
        - "возраст водителя"
        - "допущенные водители"
        - "список водителей"
        - "запрет на передачу управления"
        - "без права передачи"
        - "территория эксплуатации"
        - "выезд за пределы"
        - "за пределы РФ"
        - "субаренда"
        - "такси"
        - "перевозка пассажиров"
        - "буксировка"
        - "соревнования"
        - "гонки"
        - "бездорожье"
        - "модификация"
        - "ГБО"
        - "газобаллонное оборудование"
        - "тонировка"
        - "дополнительное оборудование"
        - "изменение конструкции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)водительск[а-я]*\\s+удостоверен[а-я]*"
        - "(?i)стаж[а-я]*\\s+вожден[а-я]*"
        - "(?i)территори[а-я]*\\s+эксплуатац[а-я]*"
        - "(?i)выезд[а-я]*\\s+за\\s+предел[а-я]*"
        - "(?i)субаренд[а-я]*"
        - "(?i)без\\s+права\\s+передач[а-я]*"
        - "(?i)(?:в\\s+качестве\\s+)?такси|буксировк[а-я]*"
        - "(?i)модификац[а-я]*|ГБО|газобаллонн|тонировк[а-я]*|дополнительн[а-я]*\\s+оборудован"
        - "(?i)изменен[а-я]*\\s+конструкц[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются ограничения и правила целевой эксплуатации ТС (требования к водителям,
        передача третьим лицам, территория использования, запрет выезда за границу, субаренда,
        запрет такси/гонок, запрет модификации ТС).

        Нормативный ориентир:
        - ст. 615 ГК РФ — пользование арендованным имуществом в соответствии с условиями договора и его назначением.
        - ст. 631 ГК РФ — субаренда при аренде ТС с экипажем (допускается без согласия арендодателя, если иное не установлено договором).
        - ст. 647 ГК РФ — субаренда при аренде ТС без экипажа (допускается только с согласия арендодателя).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требования к водителям (минимальный возраст, стаж вождения, категория водительского удостоверения).
        2. Список/перечень допущенных водителей (поименный список, сотрудники арендатора или отсылка к приложению).
        3. Запрет передачи управления ТС третьим лицам без согласия Арендодателя.
        4. Территориальные ограничения эксплуатации ТС (разрешенные регионы, субъекты РФ, город/область).
        5. Запрет выезда за пределы Российской Федерации (за рубеж).
        6. Запрет сдачи ТС в субаренду (субфрахтование) и запрет коммерческого использования (такси, обучение вождению, буксировка, гонки).
        7. Запрет модификации ТС (установка ГБО, тонировка, дополнительное оборудование, изменение конструкции).
        8. Сформируй сводное читаемое поле usage_restrictions_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — строгие ограничения по водителям, территории, назначению и модификации:
        Фрагмент:
        "4.1. К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей
        (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет.
        Передача управления любым третьим лицам категорически запрещена.
        4.2. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области.
        Выезд за пределы указанной территории, а также выезд за пределы территории РФ запрещён.
        4.3. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси,
        для буксировки других ТС, а также для участия в спортивных соревнованиях.
        4.4. Арендатору запрещается производить любые модификации ТС, включая установку
        газобаллонного оборудования (ГБО), тонировку стёкол сверх допустимых норм,
        установку дополнительного оборудования и изменение конструкции ТС без письменного
        согласия Арендодателя."

        Ответ:
        {
          "driver_requirements_status": "defined",
          "driver_requirements_details": "штатные водители, возраст от 23 лет, стаж вождения категории «B» от 3 лет",
          "allowed_drivers_list_status": "defined",
          "allowed_drivers_list_details": "лица, указанные в Списке водителей (Приложение № 2)",
          "transfer_prohibition_status": "defined",
          "transfer_prohibition_details": "передача управления любым третьим лицам категорически запрещена",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория г. Москвы и Московской области",
          "cross_border_restriction_status": "defined",
          "cross_border_restriction_details": "выезд за пределы территории РФ запрещён",
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "субаренда запрещена; запрещено использовать как такси, для буксировки и соревнований",
          "modification_prohibition_status": "defined",
          "modification_prohibition_details": "запрещены любые модификации: ГБО, тонировка сверх нормы, допоборудование, изменение конструкции без согласия Арендодателя",
          "usage_restrictions_summary_display": "Водители: 23+, стаж 3 г. (Прил. №2) | Территория: Москва и МО | Субаренда, такси, буксировка запрещены | Модификации (ГБО, тонировка) запрещены",
          "evidence": [
            {
              "clause_ref": "п. 4.1–4.4",
              "quote": "К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет. Передача управления любым третьим лицам категорически запрещена. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области. Выезд за пределы территории РФ запрещён. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси, для буксировки других ТС, а также для участия в спортивных соревнованиях. Арендатору запрещается производить любые модификации ТС, включая установку газобаллонного оборудования (ГБО), тонировку стёкол сверх допустимых норм."
            }
          ]
        }

        Пример 2 — только базовая территория без ограничений водителей:
        Фрагмент:
        "3.4. Автомобиль используется для служебных поездок по территории Северо-Западного федерального округа."

        Ответ:
        {
          "driver_requirements_status": "not_defined",
          "driver_requirements_details": "Не установлено",
          "allowed_drivers_list_status": "not_defined",
          "allowed_drivers_list_details": "Не установлено",
          "transfer_prohibition_status": "not_defined",
          "transfer_prohibition_details": "Не установлено",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория Северо-Западного федерального округа",
          "cross_border_restriction_status": "not_defined",
          "cross_border_restriction_details": "Не установлено",
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Не установлено",
          "modification_prohibition_status": "not_defined",
          "modification_prohibition_details": "Не установлено",
          "usage_restrictions_summary_display": "Территория: СЗФО | Требования к водителям, запрет передачи, субаренды и модификации не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Автомобиль используется для служебных поездок по территории Северо-Западного федерального округа."
            }
          ]
        }

        Пример 3 — ограничения отсутствуют:
        Фрагмент:
        "Арендатор использует автомобиль по своему усмотрению."

        Ответ:
        {
          "driver_requirements_status": "not_defined",
          "driver_requirements_details": "Не установлено",
          "allowed_drivers_list_status": "not_defined",
          "allowed_drivers_list_details": "Не установлено",
          "transfer_prohibition_status": "not_defined",
          "transfer_prohibition_details": "Не установлено",
          "territorial_limits_status": "not_defined",
          "territorial_limits_details": "Не установлено",
          "cross_border_restriction_status": "not_defined",
          "cross_border_restriction_details": "Не установлено",
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Не установлено",
          "modification_prohibition_status": "not_defined",
          "modification_prohibition_details": "Не установлено",
          "usage_restrictions_summary_display": "Ограничения эксплуатации ТС не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора о требованиях к стажу, возрасту водителей и правам.
        2. Проверь наличие списка/круга допущенных водителей.
        3. Проверь наличие запрета передачи ТС третьим лицам.
        4. Найди пункт о географических границах (территории) использования ТС и выезде за границу.
        5. Проверь наличие запретов субаренды, использования в такси, для буксировки и гонок.
        6. Проверь наличие запрета модификации ТС (ГБО, тонировка, допоборудование).
        7. Сформируй сводку usage_restrictions_summary_display.
        8. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "driver_requirements_status": "<defined / not_defined>",
          "driver_requirements_details": "<текст или 'Не установлено'>",
          "allowed_drivers_list_status": "<defined / not_defined>",
          "allowed_drivers_list_details": "<текст или 'Не установлено'>",
          "transfer_prohibition_status": "<defined / not_defined>",
          "transfer_prohibition_details": "<текст или 'Не установлено'>",
          "territorial_limits_status": "<defined / not_defined>",
          "territorial_limits_details": "<текст или 'Не установлено'>",
          "cross_border_restriction_status": "<defined / not_defined>",
          "cross_border_restriction_details": "<текст или 'Не установлено'>",
          "sublease_prohibition_status": "<defined / not_defined>",
          "sublease_prohibition_details": "<текст или 'Не установлено'>",
          "modification_prohibition_status": "<defined / not_defined>",
          "modification_prohibition_details": "<текст или 'Не установлено'>",
          "usage_restrictions_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "subletting_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "водительское удостоверение категория стаж вождения возраст допущенные водители список водителей запрет передачи управления территория эксплуатации регион использования выезд за пределы РФ субаренда такси буксировка без права передачи модификация ГБО тонировка дополнительное оборудование изменение конструкции"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "штрафы"
        - "ДТП"
        - "ремонт"
        - "возврат"
        - "депозит"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_usage_restrictions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства ограничения использования: требования к водителям (стаж, возраст, категория),
        круг допущенных лиц, запрет передачи управления третьим лицам, территорию эксплуатации,
        запрет выезда за рубеж, запрет субаренды и коммерческого использования (такси, буксировка, гонки),
        а также запрет модификации ТС (ГБО, тонировка, допоборудование, изменение конструкции).
        Не анализируй арендную плату, условия страхования КАСКО/ОСАГО, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_usage_restrictions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (driver_requirements_status, allowed_drivers_list_status,
              transfer_prohibition_status, territorial_limits_status,
              cross_border_restriction_status, sublease_prohibition_status,
              modification_prohibition_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все семь *_status = "not_defined";
           - все *_details = "Не установлено";
           - usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены";
           - не выполняй остальные шаги.

        1. driver_requirements_status:
           - "defined" — если требования к водителям (стаж, возраст, категория)
             прямо указаны;
           - "not_defined" — если не указаны.

        2. driver_requirements_details:
           Формулировка о требованиях к водителям.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. allowed_drivers_list_status:
           - "defined" — если перечень допущенных водителей прямо оговорен
             (поименный список, отсылка к приложению, "штатные водители");
           - "not_defined" — если не оговорен.

        4. allowed_drivers_list_details:
           Круг/список допущенных водителей (или отсылка к приложению).
           Если данных нет — "Не установлено".

        5. transfer_prohibition_status:
           - "defined" — если запрет передачи управления третьим лицам
             прямо установлен;
           - "not_defined" — если не установлен.

        6. transfer_prohibition_details:
           Формулировка о запрете передачи управления.
           Если данных нет — "Не установлено".

        7. territorial_limits_status:
           - "defined" — если территория использования ТС прямо ограничена;
           - "not_defined" — если не ограничена.

        8. territorial_limits_details:
           Формулировка о территориальных ограничениях (регион, область, город).
           Если данных нет — "Не установлено".

        9. cross_border_restriction_status:
           - "defined" — если запрет выезда за пределы РФ прямо указан;
           - "not_defined" — если не указан.

        10. cross_border_restriction_details:
            Формулировка о запрете выезда за границу.
            Если данных нет — "Не установлено".

        11. sublease_prohibition_status:
            - "defined" — если субаренда прямо запрещена или ограничена;
            - "not_defined" — если не запрещена и не ограничена.

        12. sublease_prohibition_details:
            Формулировка о запрете субаренды и иных целевых ограничениях
            (такси, буксировка, гонки, бездорожье).
            Если данных нет — "Не установлено".

        13. modification_prohibition_status:
            - "defined" — если запрет модификации ТС прямо установлен
              (ГБО, тонировка, допоборудование, изменение конструкции);
            - "not_defined" — если не установлен.

        14. modification_prohibition_details:
            Формулировка о запрете модификации ТС. Включает: установку ГБО,
            тонировку стёкол сверх допустимых норм, установку дополнительного
            оборудования, изменение конструкции.
            Если данных нет — "Не установлено".
            Если данные противоречивы — "Не удалось определить".

        15. usage_restrictions_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: требования к водителям, территория, выезд за рубеж,
            запрет передачи, субаренда, такси, модификации. Строится на
            основе других полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Ограничения эксплуатации ТС не установлены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_usage_restrictions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - usage_restrictions_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указана только общая фраза "Арендатор использует ТС по назначению" без конкретных ограничений — все *_status = "not_defined".
        - Если список водителей вынесен в приложение и это прямо видно из текста — allowed_drivers_list_status = "defined", details содержит отсылку.
        - modification_prohibition_status = "defined" только при прямом запрете модификации (ГБО, тонировка, допоборудование, изменение конструкции). Общая фраза "Арендатор не вправе изменять ТС" без конкретизации — тоже "defined".
        - Если в разных фрагментах указаны противоречивые ограничения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни требований к водителям, ни запретов передачи,
           ни территориальных ограничений, ни субаренды, ни модификации.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены".

        2. Только территория без остальных ограничений.
           Указана территория эксплуатации, но нет требований к водителям,
           запретов передачи, субаренды и модификации.
           → presence = "present";
             territorial_limits_status = "defined";
             остальные *_status = "not_defined";
             usage_restrictions_summary_display отражает только территорию.

        3. Противоречие в условиях субаренды.
           В одном пункте "субаренда допускается с согласия Арендодателя",
           в другом — "субаренда категорически запрещена".
           → presence = "unclear";
             sublease_prohibition_status = "not_defined";
             sublease_prohibition_details = "Не удалось определить".

        4. Модификация с согласия Арендодателя.
           "Модификация ТС (установка ГБО, допоборудования) допускается
           только с письменного согласия Арендодателя."
           → presence = "present";
             modification_prohibition_status = "defined";
             modification_prohibition_details = "модификация допускается только с письменного согласия Арендодателя".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_usage_restrictions_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * usage_restrictions_summary_display → "Ограничения эксплуатации ТС не установлены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * usage_restrictions_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_usage_restrictions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие ограничений эксплуатации ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "driver_requirements_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требований к водителям."
          required: true
          display_in_grid: false
        - name: "driver_requirements_details"
          type: "string"
          presentation: "fact"
          label: "Требования к водителям"
          description: "Требования к возрасту, стажу вождения и категории водительского удостоверения."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "allowed_drivers_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня допущенных водителей."
          required: true
          display_in_grid: false
        - name: "allowed_drivers_list_details"
          label: "Список разрешенных водителей"
          type: "string"
          presentation: "fact"
          description: "Круг или поименный список допущенных к управлению водителей (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "transfer_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета передачи управления."
          required: true
          display_in_grid: false
        - name: "transfer_prohibition_details"
          label: "Запрет передачи третьим лицам"
          type: "string"
          presentation: "fact"
          description: "Запрет передачи управления транспортным средством третьим лицам (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "territorial_limits_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус территориальных ограничений."
          required: true
          display_in_grid: false
        - name: "territorial_limits_details"
          type: "string"
          presentation: "fact"
          label: "Территория использования"
          description: "Географические пределы и регионы разрешенной эксплуатации ТС."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "cross_border_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета выезда за пределы РФ."
          required: true
          display_in_grid: false
        - name: "cross_border_restriction_details"
          label: "Ограничение на выезд за границу"
          type: "string"
          presentation: "fact"
          description: "Запрет выезда на ТС за пределы Российской Федерации (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "sublease_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета субаренды."
          required: true
          display_in_grid: false
        - name: "sublease_prohibition_details"
          label: "Запрет субаренды"
          type: "string"
          presentation: "fact"
          description: "Запрет сдачи в субаренду, использования в такси, для буксировки и гонок (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "modification_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета модификации ТС."
          required: true
          display_in_grid: false
        - name: "modification_prohibition_details"
          label: "Запрет модификации ТС"
          type: "string"
          presentation: "fact"
          description: "Запрет установки ГБО, тонировки, допоборудования и изменения конструкции ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "usage_restrictions_summary_display"
          type: "string"
          presentation: "fact"
          label: "Ограничения эксплуатации ТС"
          description: "Сводная информация об ограничениях (стаж водителей, территория, выезд за рубеж, запрет передачи, субаренды, такси и модификации)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_payment_terms_check
    name: "Порядок оплаты, неустойка за просрочку и индексация арендной платы"
    description: >
      Фактографическая проверка порядка и сроков оплаты арендной платы
      (модель расчётов, график платежей, валюта, НДС), неустойки за просрочку
      оплаты (пени, проценты по ст. 395 ГК РФ), индексации арендной платы
      и права арендодателя приостановить оказание услуг при неоплате
      (ст. 614, 330, 395 ГК РФ).
      Размер арендной платы извлекается в vehicle_lease_type_and_subject
      (поле rent_amount_value); данный check покрывает процедурные аспекты оплаты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "оплата"
        - "порядок оплаты"
        - "срок оплаты"
        - "график платежей"
        - "предоплата"
        - "аванс"
        - "постоплата"
        - "ежемесячно"
        - "посуточно"
        - "неустойка"
        - "пеня"
        - "пени"
        - "просрочка оплаты"
        - "проценты"
        - "статья 395"
        - "индексация"
        - "повышение арендной платы"
        - "приостановка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат[аы]\\s.{0,30}(?:в\\s+течение|до\\s+|не\\s+позднее|ежемесячн|посуточн)"
        - "(?i)неустойк[аи]|пен[яи]|пен[еёй]"
        - "(?i)просрочк[аи]\\s+оплат"
        - "(?i)индексац[а-я]*|повышен[а-я]*\\s+арендн"
        - "(?i)график[а-я]*\\s+платеж"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется порядок оплаты арендной платы: сроки, модель расчётов,
        неустойка за просрочку, индексация.
        Размер арендной платы НЕ извлекай — это покрывается отдельной проверкой.

        Нормативный ориентир:
        - ст. 614 ГК РФ — арендная плата (порядок, условия и сроки).
        - ст. 330 ГК РФ — неустойка (штраф, пеня).
        - ст. 395 ГК РФ — проценты за пользование чужими денежными средствами.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Размер арендной платы НЕ извлекай — это покрывается отдельной проверкой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок и сроки оплаты (ежемесячно, посуточно, до какого числа, аванс/постоплата).
        2. Модель расчётов (предоплата, постоплата, смешанная) и график платежей.
        3. Неустойка за просрочку оплаты (размер пени, проценты по ст. 395 ГК РФ).
        4. Индексация арендной платы (порядок и периодичность повышения).
        5. Сформируй сводное поле payment_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок оплаты с неустойкой:
        Фрагмент:
        "3.2. Арендная плата уплачивается Арендатором ежемесячно авансовым платежом
        не позднее 5-го числа каждого месяца на расчётный счёт Арендодателя.
        3.3. За каждый день просрочки оплаты Арендатор уплачивает Арендодателю
        неустойку в размере 0,1% от суммы задолженности.
        3.5. Арендодатель вправе в одностороннем порядке индексировать арендную плату
        не чаще одного раза в год на величину индекса потребительских цен (ИПЦ)
        по данным Росстата, уведомив Арендатора не менее чем за 30 дней."

        Ответ:
        {
          "payment_schedule_status": "defined",
          "payment_schedule_details": "ежемесячно авансом не позднее 5-го числа на расчётный счёт Арендодателя",
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "неустойка 0,1% в день от суммы задолженности",
          "indexation_status": "defined",
          "indexation_details": "не чаще 1 раза в год на величину ИПЦ (Росстат), уведомление за 30 дней",
          "payment_summary_display": "Оплата: ежемесячно авансом до 5-го числа | Неустойка: 0,1%/день | Индексация: 1 раз/год по ИПЦ",
          "evidence": [
            {
              "clause_ref": "п. 3.2–3.5",
              "quote": "Арендная плата уплачивается Арендатором ежемесячно авансовым платежом не позднее 5-го числа каждого месяца. За каждый день просрочки оплаты Арендатор уплачивает неустойку в размере 0,1% от суммы задолженности."
            }
          ]
        }

        Пример 2 — только базовый порядок без неустойки:
        Фрагмент:
        "3.1. Арендатор оплачивает аренду ежемесячно в течение 10 банковских дней
        с момента выставления счёта Арендодателем."

        Ответ:
        {
          "payment_schedule_status": "defined",
          "payment_schedule_details": "ежемесячно в течение 10 банковских дней с момента выставления счёта",
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлено",
          "indexation_status": "not_defined",
          "indexation_details": "Не установлено",
          "payment_summary_display": "Оплата: ежемесячно в течение 10 банк. дней по счёту | Неустойка и индексация не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Арендатор оплачивает аренду ежемесячно в течение 10 банковских дней с момента выставления счёта Арендодателем."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендатор уплачивает арендную плату в порядке, согласованном сторонами."

        Ответ:
        {
          "payment_schedule_status": "not_defined",
          "payment_schedule_details": "Не установлено",
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлено",
          "indexation_status": "not_defined",
          "indexation_details": "Не установлено",
          "payment_summary_display": "Порядок оплаты, неустойка и индексация не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о порядке и сроках оплаты (ежемесячно, посуточно, до какого числа).
        2. Найди пункт о неустойке за просрочку (пени, проценты).
        3. Найди пункт об индексации или повышении арендной платы.
        4. Сформируй сводку payment_summary_display.
        5. Не извлекай размер арендной платы — это другая проверка.
        6. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "payment_schedule_status": "<defined / not_defined>",
          "payment_schedule_details": "<текст или 'Не установлено'>",
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Не установлено'>",
          "indexation_status": "<defined / not_defined>",
          "indexation_details": "<текст или 'Не установлено'>",
          "payment_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата порядок оплаты срок оплаты график платежей предоплата аванс постоплата ежемесячно посуточно неустойка пеня пени просрочка оплаты проценты индексация повышение арендной платы"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "возврат ТС"
        - "штрафы ГИБДД"
        - "означает"
        - "в целях настоящего"
        - "качество"
        - "приемка"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.14
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_payment_terms_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС порядок и сроки
        оплаты арендной платы, неустойку за просрочку оплаты и условия индексации.
        Не извлекай размер арендной платы — это покрывается отдельной проверкой.
        Не анализируй страхование, ДТП, возврат ТС или штрафы ГИБДД.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_payment_terms_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (payment_schedule_status, late_payment_penalty_status,
              indexation_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_schedule_status = "not_defined";
           - late_payment_penalty_status = "not_defined";
           - indexation_status = "not_defined";
           - все *_details = "Не установлено";
           - payment_summary_display = "Порядок оплаты, неустойка и индексация не урегулированы";
           - не выполняй остальные шаги.

        1. payment_schedule_status:
           - "defined" — если порядок и сроки оплаты прямо указаны
             (периодичность, конкретная дата, модель расчётов, график);
           - "not_defined" — если не указаны.

        2. payment_schedule_details:
           Порядок и сроки оплаты: периодичность (ежемесячно, посуточно),
           модель (аванс/постоплата), конкретный срок (до 5-го числа,
           в течение 10 дней), отсылка к графику платежей.
           Не включай размер арендной платы — только процедурные аспекты.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. late_payment_penalty_status:
           - "defined" — если неустойка за просрочку оплаты прямо предусмотрена
             (пени, проценты, фиксированный штраф);
           - "not_defined" — если не предусмотрена.

        4. late_payment_penalty_details:
           Размер и порядок начисления неустойки (например, "0,1% в день
           от суммы задолженности", "проценты по ст. 395 ГК РФ").
           Если данных нет — "Не установлено".

        5. indexation_status:
           - "defined" — если индексация или порядок повышения арендной платы
             прямо указаны;
           - "not_defined" — если не указаны.

        6. indexation_details:
           Порядок и периодичность индексации (например, "1 раз в год на
           величину ИПЦ", "не чаще 1 раза в год с уведомлением за 30 дней").
           Если данных нет — "Не установлено".

        7. payment_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: порядок оплаты (сроки, модель), неустойка, индексация.
            Строится на основе других полей — не добавляй данные, которых
            нет в них.
            Если presence = "missing" — "Порядок оплаты, неустойка и
            индексация не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_payment_terms_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", payment_summary_display = "Порядок оплаты, неустойка и индексация не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - payment_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Не извлекай размер арендной платы — это покрывается vehicle_lease_type_and_subject.
        - Если в договоре указана только общая фраза "оплата в порядке, согласованном сторонами" без конкретики — payment_schedule_status = "not_defined".
        - Если неустойка не указана прямо, но есть отсылка к ст. 395 ГК РФ — late_payment_penalty_status = "defined", details отражает отсылку.
        - Если в разных фрагментах указаны противоречивые сроки или размеры неустойки — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка оплаты, ни неустойки, ни индексации
           (только размер арендной платы в другом разделе).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             payment_summary_display = "Порядок оплаты, неустойка и индексация не урегулированы".

        2. Только порядок оплаты без неустойки.
           Указан срок и модель оплаты, но неустойка за просрочку
           и индексация не предусмотрены.
           → presence = "present";
             payment_schedule_status = "defined";
             late_payment_penalty_status = "not_defined";
             indexation_status = "not_defined";
             payment_summary_display отражает только порядок оплаты.

        3. Противоречие в сроках оплаты.
           В одном пункте "оплата до 5-го числа", в другом —
           "в течение 15 дней с момента выставления счёта".
           → presence = "unclear";
             payment_schedule_status = "not_defined";
             payment_schedule_details = "Не удалось определить".

        4. Неустойка по ст. 395 ГК РФ без конкретного размера.
           "За просрочку оплаты начисляются проценты в соответствии
           со ст. 395 ГК РФ" без указания конкретной ставки.
           → presence = "present";
             late_payment_penalty_status = "defined";
             late_payment_penalty_details = "проценты по ст. 395 ГК РФ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_payment_terms_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * payment_summary_display → "Порядок оплаты, неустойка и индексация не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * payment_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_payment_terms_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка оплаты и неустойки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payment_schedule_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка и сроков оплаты."
          required: true
          display_in_grid: false
        - name: "payment_schedule_details"
          type: "string"
          presentation: "fact"
          label: "Порядок оплаты"
          description: "Периодичность, модель (аванс/постоплата), конкретные сроки оплаты, отсылка к графику платежей."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за просрочку оплаты."
          required: true
          display_in_grid: false
        - name: "late_payment_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку оплаты"
          description: "Размер и порядок начисления неустойки (пени, проценты по ст. 395 ГК РФ)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус индексации арендной платы."
          required: true
          display_in_grid: false
        - name: "indexation_details"
          type: "string"
          presentation: "fact"
          label: "Индексация арендной платы"
          description: "Порядок и периодичность индексации (ИПЦ, уведомление, ограничения)."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "payment_summary_display"
          type: "string"
          presentation: "fact"
          label: "Порядок оплаты и неустойка"
          description: "Сводка условий оплаты (сроки, модель, неустойка за просрочку, индексация)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты арендодателя и арендатора,
      а также, если применимо, статус фрахтовщика/фрахтователя и состав экипажа.
    addressee: "Обе стороны"

  vehicle_lease_type_extraction:
    text: >
      Просим предоставить по {doc_names}: вид аренды (с экипажем / без),
      описание ТС, VIN/регистрационные данные, срок аренды и базовую модель эксплуатации.
    addressee: "Арендодатель"

  vehicle_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, VIN, госномер,
      ПТС/СТС, год выпуска, пробег и иные идентификаторы ТС.
    addressee: "Арендодатель"

  crew_status_declaration:
    text: >
      Просим однозначно зафиксировать в {doc_names}, что аренда осуществляется
      либо с экипажем, либо без экипажа, и исключить смешанные/противоречивые формулировки.
    addressee: "Юридический советник"

  vehicle_identification_and_condition_check:
    text: >
      Просим предоставить по {doc_names}: акт приема-передачи, пробег,
      фотофиксацию состояния, перечень документов на ТС, сведения о существующих повреждениях.
    addressee: "Арендодатель"

  detailed_handover_protocol:
    text: >
      Просим согласовать по {doc_names}: детализированный акт приема-передачи ТС
      с фиксацией пробега, состояния кузова/салона, комплектности, топлива и документации.
    addressee: "Обе стороны"

  liability_allocation_by_crew_type_check:
    text: >
      Просим уточнить в {doc_names}: кто несет ответственность перед третьими лицами,
      кто является владельцем источника повышенной опасности и кто отвечает за ремонт/эксплуатацию
      в зависимости от модели с экипажем / без экипажа.
    addressee: "Юридический советник"

  insurance_and_accident_procedure_check:
    text: >
      Просим предоставить по {doc_names}: страховой пакет (ОСАГО/КАСКО),
      порядок действий при ДТП, перечень нестраховых случаев, сроки уведомления
      и порядок ремонта после происшествия.
    addressee: "Арендодатель / Страховой консультант"

  insurance_requirements:
    text: >
      Просим уточнить в {doc_names}: кто оформляет ОСАГО/КАСКО, кто выгодоприобретатель,
      какова страховая сумма, франшиза и порядок продления полиса.
    addressee: "Страховой консультант / Юридический советник"

  accident_procedure_clear:
    text: >
      Просим уточнить в {doc_names}: действия при ДТП, порядок уведомления,
      вызов ГИБДД/оформление европротокола и запрет ремонта без согласия.
    addressee: "Юридический советник"

  fines_and_regress_check:
    text: >
      Просим уточнить в {doc_names}: как компенсируются штрафы с камер,
      кто платит административные штрафы, как работает регресс и в какие сроки
      арендатор обязан возместить суммы.
    addressee: "Юридический советник"

  traffic_fines_reimbursement:
    text: >
      Просим включить/уточнить в {doc_names}: безусловную компенсацию арендатором
      штрафов и иных административных взысканий, полученных собственником в период аренды.
    addressee: "Юридический советник арендодателя"

  usage_restrictions_and_driver_control_check:
    text: >
      Просим уточнить в {doc_names}: допущенных водителей, требования к стажу и категориям прав,
      запрет передачи управления и территориальные ограничения эксплуатации ТС.
    addressee: "Юридический советник"

  usage_territory_limits:
    text: >
      Просим уточнить в {doc_names}: допустимую территорию использования ТС,
      порядок выезда в другие регионы/за границу и последствия нарушения этих ограничений.
    addressee: "Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита/обеспечительного платежа,
      основания удержания, сроки возврата и порядок подтверждения повреждений/убытков.
    addressee: "Юридический советник"

  vehicle_fitness_warranty:
    text: >
      Просим предоставить по {doc_names}: заверения арендодателя о технической исправности,
      прохождении техосмотра, отсутствии арестов/залога/ограничений и иных дефектов титула.
    addressee: "Арендодатель"

  maintenance_duty_tenant:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: что именно относится
      к текущему и капитальному ремонту, а также какие расходы несет арендатор.
    addressee: "Юридический советник"

  liability_for_third_party_damage_tenant:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: что арендатор несет
      ответственность перед третьими лицами как владелец источника повышенной опасности.
    addressee: "Юридический советник"

  liability_for_accidents_lessor:
    text: >
      Для аренды с экипажем просим уточнить в {doc_names}: что ответственность
      за действия экипажа и вред третьим лицам несет арендодатель.
    addressee: "Юридический советник"

  crew_qualification_guarantee:
    text: >
      Для аренды с экипажем просим предоставить по {doc_names}: документы
      о квалификации экипажа/водителей, наличии необходимых прав и их статусе
      в отношениях с арендодателем.
    addressee: "Арендодатель"

  driver_verification_protection:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: требования к водителям,
      перечень допущенных лиц, стаж, возрастные ограничения и последствия передачи управления
      неуполномоченному лицу.
    addressee: "Юридический советник"

  sublease_and_transfer_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли субаренда, передача ТС
      или управления третьим лицам, и если да — на каких условиях.
    addressee: "Юридический советник"

  rent_payment_terms:
    text: >
      Просим уточнить в {doc_names}: размер арендной платы/фрахта,
      периодичность платежей, порядок оплаты, валюту и последствия просрочки.
    addressee: "Обе стороны"

  term_of_lease:
    text: >
      Просим уточнить в {doc_names}: срок аренды, даты начала и окончания,
      а также порядок продления/досрочного прекращения.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и механизм разрешения споров.
    addressee: "Юридический советник"

  consumer_short_term_reclassification_to_rental:
    text: >
      Внимание: {doc_names} содержит признаки краткосрочной consumer-модели.
      Просим проверить, не следует ли квалифицировать документ как прокат/consumer rental.
    addressee: "Юридический советник"

  purchase_option_reclassification_to_leasing:
    text: >
      Внимание: {doc_names} содержит признаки выкупной модели.
      Просим проверить, не должен ли документ квалифицироваться как лизинг,
      а не как обычная аренда ТС.
    addressee: "Юридический советник"

  mandatory_vehicle_insurance_context:
    text: >
      Внимание: по {doc_names} необходимо подтвердить наличие надлежащего
      страхового и регистрационного контура (ОСАГО/КАСКО, ПТС/СТС, учет в ГИБДД).
    addressee: "Арендодатель / Страховой консультант"

  vehicle_return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок возврата ТС по окончании аренды —
      допустимое состояние (нормальный износ vs повреждения), порядок фиксации
      состояния (акт, фото, независимый оценщик), уровень топлива при возврате,
      контроль пробега, место и сроки возврата, штрафы за просрочку/невозврат.
    addressee: "Обе стороны / Юридический советник"

  vehicle_return_conditions:
    text: >
      В {doc_names} не урегулированы или нечётко описаны условия возврата ТС.
      Просим включить: стандарт допустимого состояния, акт возврата с фиксацией
      пробега/топлива/повреждений, место возврата, сроки, санкции за невозврат.
    addressee: "Юридический советник"

  fuel_mileage_and_operating_costs_check:
    text: >
      Просим уточнить в {doc_names}: кто оплачивает ГСМ, есть ли топливная карта,
      установлен ли лимит пробега/моточасов, какова плата за превышение,
      кто несёт расходы на расходные материалы (шины, масла и т.п.).
    addressee: "Обе стороны"

  mileage_limit_and_excess:
    text: >
      Просим уточнить в {doc_names}: лимит пробега/моточасов,
      ставку за сверхнормативный пробег, порядок контроля и расчёта.
    addressee: "Юридический советник"

  termination_and_early_exit:
    text: >
      Просим уточнить в {doc_names}: основания досрочного расторжения
      для каждой стороны, сроки уведомления, последствия (возврат ТС,
      перерасчёт платы, неустойка, возврат депозита), порядок возврата ТС
      при досрочном прекращении.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для обязательств сторон,
      распределение расходов на хранение ТС в период форс-мажора.
    addressee: "Юридический советник"

  vessel_aircraft_special_regime:
    text: >
      Внимание: {doc_names} предусматривает аренду судна/воздушного судна.
      Просим подтвердить соблюдение специального режима: регистрация в реестре
      (РМРС/РИВС/государственный реестр ВС), свидетельства годности,
      лицензии, специальное страхование (P&I / hull / авиационное),
      квалификация экипажа и применимые транспортные кодексы (КТМ/КВВТ/ВзК).
    addressee: "Юридический советник / Транспортный консультант"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
