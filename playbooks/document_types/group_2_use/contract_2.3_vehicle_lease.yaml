  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Штрафы
  # ──────────────────────────────────────────────────────────────────────────
  - id: vehicle_fines_and_regress_check
    name: "Штрафы ГИБДД, административные взыскания и регресс к арендатору"
    description: >
      Фактографическая проверка наличия в тексте механизма компенсации
      штрафов с камер, административных взысканий, порядка уведомления
      арендатора и регрессного механизма.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штрафы ГИБДД"
        - "письма счастья"
        - "административные штрафы"
        - "обязан возместить"
        - "срок возмещения"
        - "штрафы с камер"
        - "регресс"
        - "компенсация штрафов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф(ы|ов)\\s+ГИБДД"
        - "(?i)письм(а|о)\\s+счаст"
        - "(?i)возместит.*штраф"
        - "(?i)регресс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: механизм компенсации штрафов ГИБДД
        и административных взысканий.

        Нормативный ориентир:
        - КоАП РФ — штрафы с камер приходят собственнику ТС
        - ст. 1081 ГК РФ — право регресса

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность арендатора компенсировать штрафы.
        2. Есть ли порядок уведомления арендатора о штрафах.
        3. Есть ли срок компенсации / возмещения.
        4. Есть ли регрессный механизм.
        5. Есть ли удержание штрафов из депозита.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — механизм описан:
        Фрагмент:
        "Арендатор обязан компенсировать Арендодателю все штрафы ГИБДД,
        зафиксированные камерами в период аренды, в течение 5 рабочих дней
        с момента получения уведомления. Арендодатель уведомляет Арендатора
        о штрафе в течение 3 дней. При неоплате штраф удерживается из депозита."

        Ответ:
        {
          "fines_reimbursement_status": "defined",
          "fines_reimbursement_details": "Арендатор обязан компенсировать все штрафы ГИБДД в течение 5 рабочих дней",
          "notification_procedure_status": "defined",
          "notification_procedure_details": "Арендодатель уведомляет в течение 3 дней",
          "reimbursement_deadline_status": "defined",
          "reimbursement_deadline_details": "5 рабочих дней с момента получения уведомления",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Данные не определены",
          "deposit_retention_for_fines_status": "defined",
          "deposit_retention_for_fines_details": "при неоплате штраф удерживается из депозита",
          "evidence": [
            {
              "clause_ref": "п. 6.5",
              "quote": "Арендатор обязан компенсировать Арендодателю все штрафы ГИБДД, зафиксированные камерами в период аренды, в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязан соблюдать ПДД."

        Ответ:
        {
          "fines_reimbursement_status": "not_defined",
          "fines_reimbursement_details": "Данные не определены",
          "notification_procedure_status": "not_defined",
          "notification_procedure_details": "Данные не определены",
          "reimbursement_deadline_status": "not_defined",
          "reimbursement_deadline_details": "Данные не определены",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Данные не определены",
          "deposit_retention_for_fines_status": "not_defined",
          "deposit_retention_for_fines_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности компенсировать штрафы.
        2. Найди прямую цитату о порядке уведомления.
        3. Найди прямую цитату о сроке компенсации.
        4. Найди прямую цитату о регрессе.
        5. Найди прямую цитату об удержании из депозита.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "fines_reimbursement_status": "<defined / not_defined>",
          "fines_reimbursement_details": "<текст или 'Данные не определены'>",
          "notification_procedure_status": "<defined / not_defined>",
          "notification_procedure_details": "<текст или 'Данные не определены'>",
          "reimbursement_deadline_status": "<defined / not_defined>",
          "reimbursement_deadline_details": "<текст или 'Данные не определены'>",
          "regress_mechanism_status": "<defined / not_defined>",
          "regress_mechanism_details": "<текст или 'Данные не определены'>",
          "deposit_retention_for_fines_status": "<defined / not_defined>",
          "deposit_retention_for_fines_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "штрафы ГИБДД письма счастья административные штрафы обязан возместить срок возмещения штрафы с камер регресс компенсация штрафов удержание из депозита"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - procedures
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1100


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС механизм
        компенсации штрафов ГИБДД: обязанность, уведомление, сроки, регресс
        и удержание из депозита.
        Не анализируй плату, страхование, ДТП или возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. fines_reimbursement_status — "defined" если обязанность компенсировать
           штрафы прямо указана, иначе "not_defined".
        2. fines_reimbursement_details — формулировка.
        3. notification_procedure_status — "defined" если порядок уведомления
           прямо описан, иначе "not_defined".
        4. notification_procedure_details — формулировка.
        5. reimbursement_deadline_status — "defined" если срок компенсации
           прямо указан, иначе "not_defined".
        6. reimbursement_deadline_details — формулировка.
        7. regress_mechanism_status — "defined" если регрессный механизм
           прямо предусмотрен, иначе "not_defined".
        8. regress_mechanism_details — формулировка.
        9. deposit_retention_for_fines_status — "defined" если удержание штрафов
           из депозита прямо предусмотрено, иначе "not_defined".
        10. deposit_retention_for_fines_details — формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "fines_reimbursement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности компенсировать штрафы."
          required: true
        - name: "fines_reimbursement_details"
          type: "string"
          presentation: "fact"
          label: "Компенсация штрафов"
          description: "Формулировка об обязанности компенсировать штрафы."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notification_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
