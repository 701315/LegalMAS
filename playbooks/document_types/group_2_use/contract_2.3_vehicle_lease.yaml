        - "арендатор"
        - "фрахтовщик"
        - "фрахтователь"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор|фрахтовщик|фрахтователь).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

  - id: "vehicle_identification"
    name: "Индивидуализация транспортного средства"
    description: "Проверяет VIN, госномер, марку, модель и иные идентификаторы"
