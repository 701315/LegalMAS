          required: false
          display_in_grid: false
        - name: "warranty_summary_display"
          type: "string"
          presentation: "fact"
          label: "Гарантия и скрытые недостатки"
          description: "Сводка гарантийных обязательств и условий по скрытым дефектам ТС."
          required: false
