          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения титула на ТС."
          required: true
          display_in_grid: false
        - name: "title_confirmation_details"
          type: "string"
          presentation: "fact"
          label: "Титул арендодателя"
          description: "Право собственности, лизинг или субаренда с согласием собственника."
