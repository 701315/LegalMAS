          description: "Формулировка об исправности ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "no_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога."
          required: true
