        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ТС возвращается по акту возврата с уровнем топлива не ниже ½ бака.
        Нормальный износ не является основанием для удержания. За просрочку
