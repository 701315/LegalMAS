        - "вред третьим лицам"
        - "источник повышенной опасности"
        - "с экипажем"
        - "без экипажа"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "third_party_liability_holder"
          type: "string"
          allowed_values: ["lessor", "lessee", "unclear", "not_found"]
          description: "Кто несет ответственность перед третьими лицами"
        - name: "risk_allocation_consistent"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Соответствует ли логика ответственности виду аренды"
      store_payload: true

  - id: insurance_and_accident_procedure_check
    name: "Страхование, ДТП и нестраховые случаи"
    description: >
      Проверяет ОСАГО/КАСКО, порядок действий при ДТП, страховые исключения,
