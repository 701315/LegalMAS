  - id: vehicle_liability_allocation_check
    name: "Ответственность перед третьими лицами и обязанности по ремонту ТС"
    description: >
      Фактографическая проверка распределения деликтной ответственности за вред
      третьим лицам (источник повышенной опасности, действия экипажа) и обязанностей
      по текущему и капитальному ремонту ТС в зависимости от правовой модели
      аренды (ст. 634, 635, 640 ГК РФ — с экипажем; ст. 644, 648, 1079 ГК РФ — без экипажа).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность за вред третьим лицам"
        - "источник повышенной опасности"
        - "несет арендатор"
        - "несет арендодатель"
        - "экипаж"
        - "действия экипажа"
        - "текущий ремонт"
        - "капитальный ремонт"
        - "техническое обслуживание"
        - "содержание ТС"
        - "регресс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вред[а-я]*.*третьим\\s+лицам"
        - "(?i)источник[а-я]*\\s+повышенн(ой|ого|ую)\\s+опасност"
        - "(?i)нес[её]т\\s+(?:арендатор|арендодатель|фрахтовщик|фрахтователь)"
        - "(?i)действи(я|й|ям)\\s+экипаж"
        - "(?i)(?:текущ|капитальн)[а-я]*\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется распределение ответственности за вред перед третьими лицами (ИПО, экипаж)
        и обязанностей по ремонту и техническому обслуживанию ТС.

        Нормативный ориентир:
        - Аренда ТС с экипажем:
            - ст. 634 ГК РФ — обязанность по текущему и капитальному ремонту лежит на Арендодателе;
            - ст. 635 ГК РФ — члены экипажа являются работниками Арендодателя;
            - ст. 640 ГК РФ — ответственность за вред третьим лицам несёт Арендодатель (с правом регресса при вине Арендатора).
        - Аренда ТС без экипажа:
            - ст. 644 ГК РФ — обязанность по текущему и капитальному ремонту лежит на Арендаторе;
            - ст. 648 ГК РФ, ст. 1079 ГК РФ — ответственность за вред третьим лицам несёт Арендатор как владелец ИПО.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На кого возложена ответственность за вред, причинённый третьим лицам (Арендодатель / Арендатор).
        2. Есть ли прямое указание на ответственность владельца источника повышенной опасности (ИПО).
        3. Указана ли ответственность за действия / вину экипажа (водителя) и условия регресса.
        4. Как распределены обязанности по текущему и капитальному ремонту и ТО автомобиля.
        5. Сформируй сводное читаемое поле liability_allocation_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — аренда без экипажа (ответственность и ремонт на Арендаторе):
        Фрагмент:
        "3.2. Арендатор своими силами и за свой счет осуществляет регулярное техническое обслуживание,
        текущий и капитальный ремонт ТС.
        7.1. Ответственность за вред, причинённый третьим лицам транспортным средством как источником
        повышенной опасности, в полном объёме несёт Арендатор в соответствии со ст. 648 и 1079 ГК РФ."

        Ответ:
        {
          "third_party_liability_holder_status": "defined",
          "third_party_liability_holder_code": "tenant",
          "third_party_liability_details": "Ответственность за вред третьим лицам несёт Арендатор (ст. 648, 1079 ГК РФ)",
          "hazardous_source_reference_status": "defined",
          "hazardous_source_reference_details": "ТС как источник повышенной опасности",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Не установлено",
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "Арендатор за свой счет осуществляет ТО, текущий и капитальный ремонт",
          "liability_allocation_summary_display": "Вред третьим лицам (ИПО): Арендатор | Ремонт и ТО: за счет Арендатора (текущий и капитальный)",
          "evidence": [
            {
              "clause_ref": "п. 3.2, 7.1",
              "quote": "Арендатор своими силами и за свой счет осуществляет регулярное техническое обслуживание, текущий и капитальный ремонт ТС. Ответственность за вред, причинённый третьим лицам транспортным средством как источником повышенной опасности, в полном объёме несёт Арендатор."
            }
          ]
        }

        Пример 2 — аренда с экипажем / фрахтование на время (ответственность на Арендодателе):
        Фрагмент:
        "2.4. Фрахтовщик обязан поддерживать надлежащее техническое состояние ТС, включая осуществление
        текущего и капитального ремонта, и предоставлять квалифицированный экипаж.
        6.2. Ответственность за вред, причиненный жизни, здоровью или имуществу третьих лиц при эксплуатации ТС,
        несет Фрахтовщик. Фрахтовщик вправе предъявить регрессное требование к Фрахтователю,
        если докажет, что вред возник по вине последнего."

        Ответ:
        {
          "third_party_liability_holder_status": "defined",
          "third_party_liability_holder_code": "landlord",
          "third_party_liability_details": "Несет Фрахтовщик (Арендодатель) с правом регресса при доказанной вине Фрахтователя",
          "hazardous_source_reference_status": "not_defined",
          "hazardous_source_reference_details": "Не установлено",
          "crew_liability_status": "defined",
          "crew_liability_details": "Фрахтовщик предоставляет экипаж и отвечает за его действия",
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "Фрахтовщик обязан поддерживать состояние ТС, осуществлять текущий и капитальный ремонт",
          "liability_allocation_summary_display": "Вред третьим лицам: Арендодатель (с регрессом по вине Арендатора) | Ремонт и ТО: Арендодатель",
          "evidence": [
            {
              "clause_ref": "п. 2.4, 6.2",
              "quote": "Фрахтовщик обязан поддерживать надлежащее техническое состояние ТС, включая осуществление текущего и капитального ремонта. Ответственность за вред, причиненный жизни, здоровью или имуществу третьих лиц при эксплуатации ТС, несет Фрахтовщик."
            }
          ]
        }

        Пример 3 — условия отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством РФ."

        Ответ:
        {
          "third_party_liability_holder_status": "not_defined",
          "third_party_liability_holder_code": "not_defined",
          "third_party_liability_details": "Не установлено",
          "hazardous_source_reference_status": "not_defined",
          "hazardous_source_reference_details": "Не установлено",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Не установлено",
          "maintenance_allocation_status": "not_defined",
          "maintenance_allocation_details": "Не установлено",
          "liability_allocation_summary_display": "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об ответственности за вред третьим лицам и причинение ущерба.
        2. Найди пункт об обязанностях по текущему/капитальному ремонту и техобслуживанию.
        3. Проверь наличие условий об экипаже (при аренде с экипажем) или ИПО (без экипажа).
        4. Сформируй сводное поле liability_allocation_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "third_party_liability_holder_status": "<defined / not_defined>",
          "third_party_liability_holder_code": "<landlord / tenant / not_defined>",
          "third_party_liability_details": "<текст или 'Не установлено'>",
          "hazardous_source_reference_status": "<defined / not_defined>",
          "hazardous_source_reference_details": "<текст или 'Не установлено'>",
          "crew_liability_status": "<defined / not_defined>",
          "crew_liability_details": "<текст или 'Не установлено'>",
          "maintenance_allocation_status": "<defined / not_defined>",
          "maintenance_allocation_details": "<текст или 'Не установлено'>",
          "liability_allocation_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за вред третьим лицам источник повышенной опасности вред здоровью имуществу несёт арендатор несёт арендодатель фрахтовщик действия экипажа текущий капитальный ремонт техническое обслуживание содержание ТС регресс"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "ДТП порядок"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_liability_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства условия о распределении ответственности за вред перед третьими лицами,
        ссылку на источник повышенной опасности (ИПО), ответственность за экипаж и обязанности
        сторон по текущему, капитальному ремонту и техобслуживанию ТС.
        Не анализируй размер арендной платы, штрафы ГИБДД или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_liability_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (third_party_liability_holder_status, hazardous_source_reference_status,
              crew_liability_status, maintenance_allocation_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - third_party_liability_holder_status = "not_defined";
           - third_party_liability_holder_code = "not_defined";
           - hazardous_source_reference_status = "not_defined";
           - crew_liability_status = "not_defined";
           - maintenance_allocation_status = "not_defined";
           - все *_details = "Не установлено";
           - liability_allocation_summary_display = "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)";
           - не выполняй остальные шаги.

        1. third_party_liability_holder_status:
           - "defined" — если ответственность за вред перед третьими лицами
             прямо распределена между сторонами;
           - "not_defined" — если прямо не распределена.

        2. third_party_liability_holder_code:
           - "landlord" — ответственность возложена на Арендодателя / Фрахтовщика;
           - "tenant" — ответственность возложена на Арендатора / Фрахтователя;
           - "not_defined" — прямо в тексте не определено.

        3. third_party_liability_details:
           Формулировка об ответственности за вред перед третьими лицами
           (включая регресс, если указан).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. hazardous_source_reference_status:
           - "defined" — если источник повышенной опасности (ИПО) прямо упомянут;
           - "not_defined" — если не упомянут.

        5. hazardous_source_reference_details:
           Формулировка со ссылкой на ИПО.
           Если данных нет — "Не установлено".

        6. crew_liability_status:
           - "defined" — если ответственность за действия экипажа прямо оговорена;
           - "not_defined" — если не оговорена.

        7. crew_liability_details:
           Формулировка об ответственности за экипаж/водителя.
           Если данных нет — "Не установлено".

        8. maintenance_allocation_status:
           - "defined" — если обязанности по ремонту и ТО распределены;
           - "not_defined" — если не распределены.

        9. maintenance_allocation_details:
            Формулировка о распределении обязанностей по текущему, капитальному
            ремонту и ТО ТС.
            Если данных нет — "Не установлено".

        10. liability_allocation_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: кто отвечает за вред третьим лицам (ИПО, регресс) и кто
            несёт расходы на текущий/капитальный ремонт.
            Строится на основе других полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Ответственность перед третьими лицами
            и ремонт не урегулированы (по закону)".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_liability_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", third_party_liability_holder_code = "not_defined", все *_details = "Не установлено", liability_allocation_summary_display = "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - liability_allocation_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Общая фраза "Стороны несут ответственность в соответствии с законодательством РФ" без конкретизации субъекта — все *_status = "not_defined" (это не распределение, а отсылка к диспозитивным нормам).
        - Если ответственность за вред возложена на одну сторону, а ремонт — на другую, это валидный исход (например, аренда с экипажем: вред — Арендодатель, ремонт — Арендодатель; или смешанная модель).
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни распределения ответственности за вред, ни ИПО,
           ни экипажа, ни ремонта (только общая фраза об ответственности по закону).
           → presence = "missing";
             все *_status = "not_defined";
             third_party_liability_holder_code = "not_defined";
             все *_details = "Не установлено";
             liability_allocation_summary_display = "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)".

        2. Общая ссылка на закон без конкретизации.
           "Стороны несут ответственность в соответствии с действующим
           законодательством РФ" — без указания, кто именно отвечает.
           → presence = "present";
             third_party_liability_holder_status = "not_defined";
             third_party_liability_holder_code = "not_defined";
             maintenance_allocation_status = "not_defined";
             liability_allocation_summary_display = "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)".

        3. Противоречие в распределении.
           В одном пункте "ответственность за вред несёт Арендатор",
           в другом — "Арендодатель отвечает за все убытки".
           → presence = "unclear";
             third_party_liability_holder_status = "not_defined";
             third_party_liability_holder_code = "not_defined";
             third_party_liability_details = "Не удалось определить".

        4. Аренда с экипажем: специфическое распределение.
           Ответственность за вред — на Арендодателе (ст. 640 ГК),
           ремонт — на Арендодателе (ст. 634 ГК), экипаж — работники
           Арендодателя. Возможно право регресса при вине Арендатора.
           → presence = "present";
             third_party_liability_holder_code = "landlord";
             crew_liability_status = "defined";
             maintenance_allocation_status = "defined";
             liability_allocation_summary_display отражает специфику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_liability_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для third_party_liability_holder_code используй только: "landlord", "tenant", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * liability_allocation_summary_display → "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * liability_allocation_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_liability_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие распределения ответственности и ремонта. Внутреннее агрегатное signal-поле."
