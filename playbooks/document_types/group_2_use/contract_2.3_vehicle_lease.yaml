          description: "Формулировка об отсутствии ареста (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "tech_inspection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус техосмотра / диагностической карты."
          required: true
          display_in_grid: false
        - name: "tech_inspection_details"
          label: "Сведения о техосмотре"
          type: "string"
          presentation: "fact"
          description: "Формулировка о техосмотре / диагностической карте (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "encumbrances_display"
          type: "string"
          presentation: "fact"
          label: "Обременения (залог / арест)"
          description: "Наличие залогов, арестов, запретов ГИБДД или прав третьих лиц на ТС."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "technical_fitness_display"
          type: "string"
          presentation: "fact"
          label: "Исправность и ТО"
          description: "Сводные заверения о технической исправности ТС и прохождении техосмотра."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: vehicle_insurance_check
    name: "Страхование ТС: ОСАГО, КАСКО, распределение обязанностей и выгодоприобретатель"
    description: >
      Фактографическая проверка условий обязательного (ОСАГО) и добровольного (КАСКО)
      страхования ТС, распределения расходов на страховые премии, ограничений
      по допущенным водителям, наличия франшизы и определения выгодоприобретателя
      (ст. 637, 646 ГК РФ, ФЗ № 40-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ОСАГО"
        - "КАСКО"
        - "страховой полис"
        - "страхование гражданской ответственности"
        - "выгодоприобретатель"
        - "страховой случай"
        - "страховая премия"
        - "франшиза"
        - "неограниченный круг водителей"
        - "мультидрайв"
        - "допущенные к управлению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ОСАГО|КАСКО"
        - "(?i)страхов(ой|ого|ания)\\s+полис"
        - "(?i)выгодоприобретател"
        - "(?i)франшиз"
        - "(?i)страхов(ая|ой)\\s+преми"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: условия страхования ТС (ОСАГО, КАСКО, плательщик,
        круг допущенных водителей, франшиза, выгодоприобретатель).

        Нормативный ориентир:
        - ст. 637 ГК РФ — при аренде с экипажем обязанность страхования ответственности
          лежит на Арендодателе (если иное не предусмотрено договором).
        - ст. 646 ГК РФ — при аренде без экипажа расходы на страхование несёт Арендатор
          (если иное не предусмотрено договором).
        - ФЗ № 40-ФЗ «Об ОСАГО» — обязательность полиса и условия о круге допущенных водителей.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия ОСАГО: кто оформляет и оплачивает полис, передаётся ли полис Арендатору,
           установлены ли ограничения по допущенным водителям (поименный список / без ограничений).
        2. Условия КАСКО: предусмотрено ли (ущерб/хищение/тоталь), кто оформляет и оплачивает,
           установлена ли безусловная/условная франшиза и кто её покрывает при ДТП.
        3. Кто несёт фактические расходы на страхование (страховые премии).
        4. Кто указан выгодоприобретателем по договору страхования.
        5. Сформируй сводное читаемое поле insurance_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ОСАГО за Арендодателем, КАСКО за Арендатором:
        Фрагмент:
        "5.1. Арендодатель передает ТС с действующим полисом ОСАГО (без ограничений по числу водителей),
        расходы на оформление ОСАГО включены в арендную плату.
        5.2. Арендатор обязуется за свой счет застраховать ТС по КАСКО (риски «Ущерб» и «Хищение»)
        с лимитом ответственности не менее действительной стоимости ТС. Франшиза — 30 000 руб.
        (покрывается Арендатором). Выгодоприобретателем по рискам «Хищение» и «Полная гибель»
        является Арендодатель, по риску «Ущерб» — Арендатор."

        Ответ:
        {
          "osago_status": "defined",
          "osago_details": "Оформляет Арендодатель (мультидрайв/без ограничений), расходы включены в аренду",
          "casco_status": "defined",
          "casco_details": "Оформляет Арендатор (риски Ущерб + Хищение), франшиза 30 000 руб. за счет Арендатора. Выгодоприобретатель: Арендодатель (хищение/тоталь), Арендатор (ущерб)",
          "insurance_cost_allocation_status": "defined",
          "insurance_cost_allocation_details": "ОСАГО — Арендодатель; КАСКО — Арендатор",
          "beneficiary_status": "defined",
          "beneficiary_details": "Арендодатель (хищение/полная гибель), Арендатор (ущерб)",
          "insurance_summary_display": "ОСАГО: Арендодатель (без ограничений) | КАСКО: Арендатор (франшиза 30 000 руб., выгодоприобретатель — Арендодатель)",
          "evidence": [
            {
              "clause_ref": "п. 5.1–5.2",
              "quote": "Арендодатель передает ТС с действующим полисом ОСАГО (без ограничений по числу водителей), расходы на оформление ОСАГО включены в арендную плату. Арендатор обязуется за свой счет застраховать ТС по КАСКО (риски «Ущерб» и «Хищение») с лимитом ответственности не менее действительной стоимости ТС."
            }
          ]
        }

        Пример 2 — только ОСАГО, КАСКО не предусмотрено:
        Фрагмент:
        "4.3. Арендатор обязан самостоятельно застраховать гражданскую ответственность владельца ТС (ОСАГО)
        до начала эксплуатации."

        Ответ:
        {
          "osago_status": "defined",
          "osago_details": "Оформляет и оплачивает Арендатор до начала эксплуатации",
          "casco_status": "not_defined",
          "casco_details": "Не установлено",
          "insurance_cost_allocation_status": "defined",
          "insurance_cost_allocation_details": "ОСАГО за счет Арендатора",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Не установлено",
          "insurance_summary_display": "ОСАГО: за счет Арендатора | КАСКО: не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Арендатор обязан самостоятельно застраховать гражданскую ответственность владельца ТС (ОСАГО) до начала эксплуатации."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт автомобиль в аренду."

        Ответ:
        {
          "osago_status": "not_defined",
          "osago_details": "Не установлено",
          "casco_status": "not_defined",
          "casco_details": "Не установлено",
          "insurance_cost_allocation_status": "not_defined",
          "insurance_cost_allocation_details": "Не установлено",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Не установлено",
          "insurance_summary_display": "Условия страхования не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора об ОСАГО (кто оформляет, платит, ограничения водителей).
        2. Найди пункт о КАСКО (кто оформляет, риски, франшиза).
        3. Проверь наличие условия о выгодоприобретателе.
        4. Сформируй сводку insurance_summary_display.
        5. Если условия отсутствуют — верни "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "osago_status": "<defined / not_defined>",
          "osago_details": "<текст или 'Не установлено'>",
          "casco_status": "<defined / not_defined>",
          "casco_details": "<текст или 'Не установлено'>",
          "insurance_cost_allocation_status": "<defined / not_defined>",
          "insurance_cost_allocation_details": "<текст или 'Не установлено'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_details": "<текст или 'Не установлено'>",
          "insurance_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ОСАГО КАСКО страховой полис страхование гражданской ответственности выгодоприобретатель страховой случай расходы на страхование страховая премия франшиза круг водителей"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "госномер"
        - "штрафы"
        - "ремонт"
        - "возврат"
        - "ДТП"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_insurance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства условия страхования: ОСАГО, КАСКО, распределение расходов,
        ограничения по водителям, франшизу и выгодоприобретателя.
        Не анализируй размер арендной платы, ремонт, штрафы ГИБДД или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_insurance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (osago_status, casco_status, insurance_cost_allocation_status,
              beneficiary_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - osago_status = "not_defined";
           - casco_status = "not_defined";
           - insurance_cost_allocation_status = "not_defined";
           - beneficiary_status = "not_defined";
           - все *_details = "Не установлено";
           - insurance_summary_display = "Условия страхования не урегулированы";
           - не выполняй остальные шаги.

        1. osago_status:
           - "defined" — если ОСАГО прямо упомянуто (кто оформляет, платит,
             круг допущенных водителей);
           - "not_defined" — если ОСАГО не упомянуто.

        2. osago_details:
           Формулировка об ОСАГО: кто оформляет, плательщик, круг допущенных
           водителей (поименный список / без ограничений / мультидрайв).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. casco_status:
           - "defined" — если КАСКО прямо упомянуто (риски, плательщик, франшиза);
           - "not_defined" — если КАСКО не упомянуто.

        4. casco_details:
           Формулировка о КАСКО: кто оформляет/платит, риски (ущерб/хищение/тоталь),
           размер франшизы, кто покрывает франшизу.
           Если данных нет — "Не установлено".

        5. insurance_cost_allocation_status:
           - "defined" — если распределение расходов на страхование прямо указано;
           - "not_defined" — если не указано.

        6. insurance_cost_allocation_details:
           Формулировка о распределении расходов (например, "ОСАГО — Арендодатель;
           КАСКО — Арендатор", "ОСАГО включено в арендную плату").
           Если данных нет — "Не установлено".

        7. beneficiary_status:
           - "defined" — если выгодоприобретатель прямо назван;
           - "not_defined" — если не назван.

        8. beneficiary_details:
           Наименование/роль выгодоприобретателя (например, "Арендодатель
           (хищение/тоталь), Арендатор (ущерб)").
           Если данных нет — "Не установлено".

        9. insurance_summary_display:
            Краткая сводная строка для таблицы DD Grid.
            Отрази: ОСАГО (кто, условия), КАСКО (кто, риски, франшиза),
            выгодоприобретатель.
            Если presence = "missing" — "Условия страхования не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_insurance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", insurance_summary_display = "Условия страхования не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - insurance_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указано только "ОСАГО включено в арендную плату" без детализации — osago_status = "defined", osago_details отражает эту формулировку.
        - Если в разных фрагментах указаны противоречивые условия (например, разные плательщики) — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ОСАГО, ни КАСКО, ни расходов на страхование,
           ни выгодоприобретателя.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             insurance_summary_display = "Условия страхования не урегулированы".

        2. Только ОСАГО, КАСКО не предусмотрено.
           Указан только полис ОСАГО (кто оформляет/платит), о КАСКО
           и выгодоприобретателе ничего не сказано.
           → presence = "present";
             osago_status = "defined";
             casco_status = "not_defined";
             beneficiary_status = "not_defined";
             insurance_summary_display отражает только ОСАГО.

        3. Противоречие в распределении расходов.
           В одном пункте "ОСАГО за счёт Арендодателя", в другом —
           "все страховые расходы несёт Арендатор".
           → presence = "unclear";
             insurance_cost_allocation_status = "not_defined";
             insurance_cost_allocation_details = "Не удалось определить".

        4. ОСАГО включено в арендную плату без детализации.
           "Расходы на ОСАГО включены в арендную плату" — без указания
           круга водителей, франшизы и т.д.
           → presence = "present";
             osago_status = "defined";
             osago_details = "ОСАГО включено в арендную плату";
             casco_status = "not_defined" (если не упомянуто).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_insurance_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * insurance_summary_display → "Условия страхования не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * insurance_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_insurance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования страхования ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "osago_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ОСАГО."
          required: true
          display_in_grid: false
        - name: "osago_details"
          type: "string"
          presentation: "fact"
          label: "ОСАГО"
          description: "Условия ОСАГО: кто оформляет, плательщик, круг допущенных водителей."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "casco_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус КАСКО."
          required: true
          display_in_grid: false
        - name: "casco_details"
          type: "string"
          presentation: "fact"
          label: "КАСКО и выгодоприобретатель"
          description: "Условия КАСКО: риски, плательщик, франшиза, выгодоприобретатель."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "insurance_cost_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на страхование."
          required: true
          display_in_grid: false
        - name: "insurance_cost_allocation_details"
          label: "Распределение расходов на страховку"
          type: "string"
          presentation: "fact"
          description: "Формулировка о распределении расходов на страхование (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "beneficiary_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания выгодоприобретателя."
          required: true
          display_in_grid: false
        - name: "beneficiary_details"
          label: "Выгодоприобретатель по страхованию"
          type: "string"
          presentation: "fact"
          description: "Выгодоприобретатель по полису (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "insurance_summary_display"
          type: "string"
          presentation: "fact"
          label: "Страхование ТС"
          description: "Сводная информация о страховании (ОСАГО, КАСКО, плательщик, франшиза, выгодоприобретатель)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_accident_procedure_check
    name: "Порядок действий при ДТП и уведомление арендодателя"
    description: >
      Фактографическая проверка наличия регламента действий при ДТП:
      сроки и порядок уведомления арендодателя, вызов сотрудников ГИБДД
      или оформление европротокола, сбор и передача процессуальных документов,
      запрет признания вины и запрет самостоятельного ремонта ТС без согласия
      (ст. 615, 1079 ГК РФ, ФЗ № 40-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "действия при ДТП"
        - "дорожно-транспортное происшествие"
        - "уведомление арендодателя"
        - "уведомить арендодателя"
        - "европротокол"
        - "вызов ГИБДД"
        - "сотрудники полиции"
        - "ремонт без согласия"
        - "справка о ДТП"
        - "протокол"
        - "постановление"
        - "незамедлительно"
        - "не перемещать ТС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(?:в\\s+случае|при)\\s+ДТП"
        - "(?i)уведомить\\s+арендодател[а-я]*"
        - "(?i)европротокол"
        - "(?i)вызов[а-я]*\\s+(?:сотрудников\\s+)?(?:ГИБДД|полици[а-я]*|ГАИ)"
        - "(?i)ремонт[а-я]*.*без\\s+(?:письменного\\s+)?соглас[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок действий арендатора / водителя при ДТП
        (уведомление арендодателя, сроки, фиксация через ГИБДД/европротокол, запрет несогласованного ремонта).

        Нормативный ориентир:
        - ст. 615, 616 ГК РФ — пользование арендованным имуществом и поддержание в исправном состоянии
        - ст. 1079 ГК РФ — ответственность за вред, причиненный деятельностью, создающей повышенную опасность
        - ФЗ № 40-ФЗ «Об ОСАГО» — порядок фиксации страхового случая и европротокол

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли регламент действий Арендатора при наступлении ДТП / аварии.
        2. Установлена ли обязанность и срок уведомления Арендодателя (например: незамедлительно / в течение 2 часов / в течение суток).
        3. Предусмотрен ли вызов сотрудников ГИБДД / оформление европротокола и сбор документов (протоколы, постановления).
        4. Установлен ли запрет самостоятельного ремонта ТС / запрет признания вины без согласия Арендодателя.
        5. Сформируй сводное читаемое поле accident_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный регламент при ДТП с четкими сроками:
        Фрагмент:
        "6.1. При наступлении ДТП Арендатор обязан немедленно вызвать сотрудников ГИБДД,
        не перемещать ТС с места аварии и уведомить Арендодателя по телефону в течение 2 часов.
        6.2. В течение 24 часов Арендатор обязан передать Арендодателю копии протокола и постановления ГИБДД.
        6.3. Арендатору категорически запрещается признавать вину без согласования с Арендодателем
        и производить восстановительный ремонт без письменного согласия Арендодателя."

        Ответ:
        {
          "accident_procedure_status": "defined",
          "accident_procedure_details": "Вызов ГИБДД, запрет перемещения ТС, передача процессуальных документов в течение 24 часов",
          "landlord_notification_status": "defined",
          "landlord_notification_details": "Уведомление по телефону в течение 2 часов с момента ДТП",
          "police_europrotocol_status": "defined",
          "police_europrotocol_details": "Обязательный вызов сотрудников ГИБДД",
          "repair_consent_required_status": "defined",
          "repair_consent_required_details": "Запрет ремонта без письменного согласия Арендодателя; запрет признания вины",
          "accident_summary_display": "Уведомление в течение 2 ч; вызов ГИБДД; передача документов за 24 ч; ремонт без согласия запрещён",
          "evidence": [
            {
              "clause_ref": "п. 6.1–6.3",
              "quote": "При наступлении ДТП Арендатор обязан немедленно вызвать сотрудников ГИБДД, не перемещать ТС с места аварии и уведомить Арендодателя по телефону в течение 2 часов. В течение 24 часов Арендатор обязан передать Арендодателю копии протокола и постановления ГИБДД. Арендатору категорически запрещается производить восстановительный ремонт без письменного согласия Арендодателя."
            }
          ]
        }

        Пример 2 — только краткое уведомление без деталей:
        Фрагмент:
        "4.2. В случае аварии Арендатор обязан известить Арендодателя в разумный срок."

        Ответ:
        {
          "accident_procedure_status": "defined",
          "accident_procedure_details": "Известить Арендодателя в разумный срок",
          "landlord_notification_status": "defined",
          "landlord_notification_details": "В разумный срок",
          "police_europrotocol_status": "not_defined",
          "police_europrotocol_details": "Не установлено",
          "repair_consent_required_status": "not_defined",
          "repair_consent_required_details": "Не установлено",
          "accident_summary_display": "Извещение Арендодателя в разумный срок | Вызов ГИБДД и запрет ремонта не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "В случае аварии Арендатор обязан известить Арендодателя в разумный срок."
            }
          ]
        }

        Пример 3 — условия отсутствуют:
        Фрагмент:
        "Арендатор обязуется бережно эксплуатировать транспортное средство."

        Ответ:
        {
          "accident_procedure_status": "not_defined",
          "accident_procedure_details": "Не установлено",
          "landlord_notification_status": "not_defined",
          "landlord_notification_details": "Не установлено",
          "police_europrotocol_status": "not_defined",
          "police_europrotocol_details": "Не установлено",
          "repair_consent_required_status": "not_defined",
          "repair_consent_required_details": "Не установлено",
          "accident_summary_display": "Порядок действий при ДТП не урегулирован",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора о действиях при аварии/ДТП.
        2. Проверь наличие срока уведомления Арендодателя.
        3. Проверь наличие требования о вызове ГИБДД / европротоколе.
        4. Проверь наличие запрета ремонта без согласия.
        5. Сформируй сводку accident_summary_display.
        6. Если условия отсутствуют — верни "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "accident_procedure_status": "<defined / not_defined>",
          "accident_procedure_details": "<текст или 'Не установлено'>",
          "landlord_notification_status": "<defined / not_defined>",
          "landlord_notification_details": "<текст или 'Не установлено'>",
          "police_europrotocol_status": "<defined / not_defined>",
          "police_europrotocol_details": "<текст или 'Не установлено'>",
          "repair_consent_required_status": "<defined / not_defined>",
          "repair_consent_required_details": "<текст или 'Не установлено'>",
          "accident_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "в случае ДТП дорожно-транспортное происшествие уведомить арендодателя срок извещения вызвать ГИБДД европротокол оформление аварии ремонт без согласия запрещён передача документов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_accident_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства порядок действий при ДТП: регламент, сроки уведомления Арендодателя,
        вызов сотрудников ГИБДД / оформление европротокола и запрет ремонта без согласия.
        Не анализируй размер арендной платы, штрафы ГИБДД за превышение скорости или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_accident_procedure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (accident_procedure_status, landlord_notification_status,
              police_europrotocol_status, repair_consent_required_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - accident_procedure_status = "not_defined";
           - landlord_notification_status = "not_defined";
           - police_europrotocol_status = "not_defined";
           - repair_consent_required_status = "not_defined";
           - все *_details = "Не установлено";
           - accident_summary_display = "Порядок действий при ДТП не урегулирован";
           - не выполняй остальные шаги.

        1. accident_procedure_status:
           - "defined" — если порядок действий при ДТП прямо описан;
           - "not_defined" — если не описан.

        2. accident_procedure_details:
           Формулировка общего порядка действий при ДТП и оформления аварии.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. landlord_notification_status:
           - "defined" — если обязанность и срок уведомления Арендодателя прямо указаны;
           - "not_defined" — если не указаны.

        4. landlord_notification_details:
           Срок и способ уведомления Арендодателя о ДТП (например, "по телефону
           в течение 2 часов", "в разумный срок", "незамедлительно").
           Если данных нет — "Не установлено".

        5. police_europrotocol_status:
           - "defined" — если вызов сотрудников ГИБДД / составление европротокола
             прямо предусмотрены;
           - "not_defined" — если не предусмотрены.

        6. police_europrotocol_details:
           Формулировка о вызове ГИБДД или составлении европротокола.
           Если данных нет — "Не установлено".

        7. repair_consent_required_status:
           - "defined" — если запрет ремонта без согласия / запрет признания вины
             прямо установлены;
           - "not_defined" — если не установлены.

        8. repair_consent_required_details:
           Формулировка о запрете несогласованного ремонта или признания вины.
           Если данных нет — "Не установлено".

        9. accident_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: уведомление (срок), ГИБДД/европротокол, запрет ремонта.
            Строится на основе других полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Порядок действий при ДТП не урегулирован".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_accident_procedure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", accident_summary_display = "Порядок действий при ДТП не урегулирован".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - accident_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указана только общая фраза "Арендатор обязан соблюдать ПДД" без конкретного регламента при ДТП — все *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые сроки или процедуры — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни регламента при ДТП, ни уведомления, ни ГИБДД,
           ни запрета ремонта (только общая обязанность бережной эксплуатации).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             accident_summary_display = "Порядок действий при ДТП не урегулирован".

        2. Только уведомление без деталей.
           Указана обязанность уведомить Арендодателя, но без конкретного срока,
           способа и без регламента оформления ДТП.
           → presence = "present";
             landlord_notification_status = "defined";
             accident_procedure_status = "defined" (если есть хотя бы общая формулировка);
             police_europrotocol_status = "not_defined";
             repair_consent_required_status = "not_defined";
             accident_summary_display отражает только уведомление.

        3. Противоречие в сроках.
           В одном пункте "уведомить в течение 2 часов", в другом —
           "в течение 24 часов".
           → presence = "unclear";
             landlord_notification_status = "not_defined";
             landlord_notification_details = "Не удалось определить".

        4. Общая ссылка на закон вместо конкретного регламента.
           "В случае ДТП стороны действуют в соответствии с действующим
           законодательством РФ" без конкретных сроков и процедур.
           → presence = "present";
             accident_procedure_status = "not_defined" (конкретного регламента нет);
             landlord_notification_status = "not_defined";
             accident_summary_display = "Ссылка на законодательство без конкретного регламента".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_accident_procedure_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * accident_summary_display → "Порядок действий при ДТП не урегулирован".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * accident_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

