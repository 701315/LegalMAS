type: contract_2.3_vehicle_lease
name: "Договор аренды транспортного средства"
version: 6.0
parent: class_2_transfer_for_use
description: |
  Специальный вид договора аренды, предметом которого является транспортное средство:
  автомобиль, спецтехника, судно, воздушное судно и иные транспортные средства,
  допускающие самостоятельную эксплуатацию по правилам специального транспортного режима.
  Существует в двух различных правовых моделях:
  1) аренда транспортного средства с экипажем (фрахтование на время), при которой
     арендодатель предоставляет услуги по управлению и технической эксплуатации;
  2) аренда транспортного средства без экипажа, при которой арендатор самостоятельно
     осуществляет управление и эксплуатацию.
  Правильная квалификация вида аренды критична, поскольку от нее зависит распределение
  расходов, ремонтных обязанностей, страхования, риска случайной гибели, ответственности
  за вред третьим лицам и статуса арендатора как владельца источника повышенной опасности.
metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 3 Главы 34 ГК РФ (ст. 632-641)"
  doc_types_supported:
    - "договор аренды транспортного средства"
    - "договор аренды автомобиля"
    - "договор аренды ТС с экипажем"
    - "договор аренды ТС без экипажа"
    - "договор аренды спецтехники"
    - "фрахтование на время"
    - "тайм-чартер"
    - "договор аренды судна"
    - "договор аренды воздушного судна"
    - "договор аренды ТС"
    - "договор аренды машины"
    - "договор аренды транспортного средства с экипажем"
    - "договор аренды транспортного средства без экипажа"
    - "договор аренды грузового автомобиля"
    - "договор аренды коммерческого транспорта"
    - "договор аренды автобуса"
    - "договор аренды строительной техники"
    - "договор аренды морского судна"
    - "договор фрахтования"
    - "бербоут-чартер"

    - "vehicle lease agreement"
    - "vehicle rental agreement"
    - "car lease agreement"
