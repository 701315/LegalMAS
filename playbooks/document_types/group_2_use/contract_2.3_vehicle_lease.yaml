      - "(?i)лимит\\s+моточас[оа]в"

  fuel_consumables_allocation:
    # Распределение расходов на ГСМ и расходные материалы
    any_keywords:
      - "(?i)\\bГСМ\\b"
      - "(?i)горюче-?смазочн[ыо]е\\s+материал[ыо]"
      - "(?i)\\bтоплив[оа]\\b"
      - "(?i)\\bбензин\\b"
      - "(?i)дизельн[оа]е\\s+топлив[оа]"
      - "(?i)топливн[а-яё]+\\s+карт[аы]"
      - "(?i)расходн[ыо]е\\s+материал[ыо]"
      - "(?i)\\bшин[ыа]\\b"

  gps_telemetry_present:
    # GPS-трекер, телематика, мониторинг ТС
    any_keywords:
      - "(?i)\\bGPS\\b"
      - "(?i)\\bГЛОНАСС\\b"
      - "(?i)\\bтелематик[аи]\\b"
      - "(?i)\\bтрекер\\b"
      - "(?i)\\bмониторинг\\b"
      - "(?i)\\bгеолокаци[яи]\\b"
      - "(?i)удал[её]нн[а-яё]+\\s+блокировк[аи]"
      - "(?i)систем[аы]\\s+слежени[яя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  plate_number: "(?i)[А-ЯA-Z]\\d{3}[А-ЯA-Z]{2}\\d{2,3}"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "consumer_short_term_reclassification_to_rental"
    name: "Риск переквалификации в прокат"
    description: >
      Если аренда ТС носит краткосрочный потребительский характер и оформляется
      как сервис для гражданина для личных нужд, документ может требовать анализа
      в логике проката/consumer-rental, а не общей коммерческой аренды ТС.
    legal_base: "§ 2 и § 3 Главы 34 ГК РФ"
    required_triggers: ["consumer_short_term_hint"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "бытовые нужды"
        - "гражданин"
        - "посуточная аренда"
        - "почасовая аренда"
        - "каршеринг"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "бытовые нужды"
        - "каршеринг"
        - "посуточная аренда"
      rerank: true

  - id: "purchase_option_reclassification_to_leasing"
    name: "Риск переквалификации в лизинг"
    description: >
      Если договор аренды ТС содержит investment-like purchase option и purchase leg,
      он может требовать анализа в логике лизинга, а не обычной аренды ТС.
    legal_base: "§ 3 и § 6 Главы 34 ГК РФ"
    required_triggers: ["purchase_option_present"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "выкуп"
        - "выкупная цена"
        - "остаточная стоимость"
        - "переход права собственности"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "выкупная цена"
        - "остаточная стоимость"
        - "переход права собственности"
      rerank: true

  - id: "mandatory_vehicle_insurance_context"
    name: "ТС: обязательный учет страхового и регистрационного контура"
    description: >
      Эксплуатация ТС без надлежащего страхового и регистрационного оформления
      создает критические operational и liability risks.
    legal_base: "ФЗ № 40-ФЗ «Об ОСАГО», регистрационные акты МВД, ст. 1079 ГК РФ"
    required_triggers: ["road_vehicle"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ОСАГО"
        - "ПТС"
        - "СТС"
        - "регистрация в ГИБДД"
        - "страхование"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ОСАГО"
        - "ГИБДД"
        - "ПТС"
        - "СТС"
      rerank: true

  - id: "vessel_aircraft_special_regime"
    name: "Суда и ВС: специальный регистрационный и разрешительный режим"
    description: >
      Аренда морских/речных судов и воздушных судов подчиняется специальным
      транспортным кодексам (КТМ, КВВТ, ВзК РФ), требует регистрации в соответствующих
      реестрах, наличия свидетельств годности, лицензий на эксплуатацию и специфического
      страхования (P&I, Hull). Применение только § 3 Гл. 34 ГК РФ недостаточно.
    legal_base: "КТМ РФ (Гл. X), КВВТ РФ (Гл. X), Воздушный кодекс РФ (Гл. IX), ФЗ-261"
    required_triggers: ["vessel_or_aircraft"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "судно"
        - "морское судно"
        - "речное судно"
        - "воздушное судно"
        - "тайм-чартер"
        - "авиационный"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "тайм-чартер"
        - "судовой реестр"
        - "свидетельство о годности"
        - "воздушное судно"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: vehicle_lease_type_extraction
    name: "Аренда ТС: извлечение типа договора и предмета"
    description: >
      Извлекает вид аренды (с экипажем / без экипажа), тип ТС,
      идентификаторы, срок и базовые условия пользования.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транспортное средство"
        - "аренда автомобиля"
        - "с экипажем"
        - "без экипажа"
        - "VIN"
        - "госномер"
        - "арендная плата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)[А-ЯA-Z]\\d{3}[А-ЯA-Z]{2}\\d{2,3}"
        - "(?i)с\\s+экипажем|без\\s+экипажа"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды транспортного средства.
        Извлеки ключевые параметры договора.

        Ответь строго в JSON:
        {
          "lease_type": "<with_crew / without_crew / unclear / not_found>",
          "vehicle_type": "<road_vehicle / vessel / aircraft / other / mixed / not_found>",
          "vehicle_description": "<описание ТС или not_found>",
          "vin_or_identifier": "<VIN/идентификатор или not_found>",
          "state_number": "<госномер или not_found>",
          "lease_term": "<срок аренды или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 430
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "с экипажем"
        - "без экипажа"
        - "VIN"
        - "госномер"
        - "транспортное средство"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lease_type"
          type: "string"
          allowed_values: ["with_crew", "without_crew", "unclear", "not_found"]
          description: "Вид аренды ТС"
        - name: "vehicle_type"
          type: "string"
          allowed_values: ["road_vehicle", "vessel", "aircraft", "other", "mixed", "not_found"]
          description: "Тип ТС"
        - name: "lease_term"
          type: "string"
          description: "Срок аренды"
      store_payload: true

  - id: vehicle_identification_and_condition_check
    name: "Идентификация ТС и состояние на момент передачи"
    description: >
      Проверяет VIN/регистрационные данные, документы на ТС,
      состояние, пробег, фотофиксацию и акт приема-передачи.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "VIN"
        - "госномер"
        - "ПТС"
        - "СТС"
        - "пробег"
        - "акт приема-передачи"
        - "техническое состояние"
        - "фотофиксация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)[А-ЯA-Z]\\d{3}[А-ЯA-Z]{2}\\d{2,3}"
        - "(?i)ПТС|СТС"
