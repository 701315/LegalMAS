    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства условия о распределении ответственности за вред перед третьими лицами,
        ссылку на источник повышенной опасности (ИПО), ответственность за экипаж и обязанности
        сторон по текущему, капитальному ремонту и техобслуживанию ТС.
        Не анализируй размер арендной платы, штрафы ГИБДД или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. third_party_liability_holder_status — "defined" если ответственность за вред перед третьими лицами
           прямо распределена, иначе "not_defined".
        2. third_party_liability_holder_code — "landlord" (арендодатель/фрахтовщик) / "tenant" (арендатор/фрахтователь) / "not_defined".
        3. third_party_liability_details — формулировка об ответственности за вред перед третьими лицами (включая регресс).
        4. hazardous_source_reference_status — "defined" если источник повышенной опасности (ИПО) прямо упомянут, иначе "not_defined".
        5. hazardous_source_reference_details — формулировка со ссылкой на ИПО.
        6. crew_liability_status — "defined" если ответственность за действия экипажа прямо оговорена, иначе "not_defined".
        7. crew_liability_details — формулировка об ответственности за экипаж/водителя.
        8. maintenance_allocation_status — "defined" если обязанности по ремонту и ТО распределены, иначе "not_defined".
        9. maintenance_allocation_details — формулировка о распределении обязанностей по текущему, капитальному ремонту и ТО ТС.
        10. liability_allocation_summary_display — читаемая краткая сводка для юриста в таблице DD Grid
            (кто отвечает за вред третьим лицам и кто несёт расходы на текущий/капитальный ремонт).

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Код (*_code): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - liability_allocation_summary_display: "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - third_party_liability_holder_code:
        - "landlord" — ответственность возложена на Арендодателя / Фрахтовщика.
        - "tenant" — ответственность возложена на Арендатора / Фрахтователя.
        - "not_defined" — прямо в тексте не определено.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "third_party_liability_holder_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения ответственности перед третьими лицами."
          required: true
          display_in_grid: false
        - name: "third_party_liability_holder_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["landlord", "tenant", "not_defined"]
          description: "Субъект ответственности перед третьими лицами (raw enum)."
          required: true
          display_in_grid: false
        - name: "third_party_liability_details"
          type: "string"
          presentation: "fact"
          label: "Вред третьим лицам (ИПО)"
          description: "Распределение ответственности за вред третьим лицам и правила регресса."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "hazardous_source_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ИПО."
          required: true
          display_in_grid: false
        - name: "hazardous_source_reference_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об источнике повышенной опасности (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "crew_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за действия экипажа."
          required: true
          display_in_grid: false
        - name: "crew_liability_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об ответственности за действия экипажа (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "maintenance_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения обязанностей по ремонту."
          required: true
          display_in_grid: false
        - name: "maintenance_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Текущий и кап. ремонт"
          description: "Распределение обязанностей по текущему, капитальному ремонту и ТО ТС."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "liability_allocation_summary_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность и ремонт ТС"
          description: "Сводная информация об ответственности перед третьими лицами и распределении ремонта/ТО."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_return_and_termination_check
    name: "Возврат ТС, досрочное расторжение и штрафы за невозврат"
    description: >
      Фактографическая проверка порядка возврата ТС по окончании аренды: оформление
      акта возврата, место возврата, требования к состоянию ТС (нормальный износ,
      чистота/мойка), уровень топлива в баке, штрафные санкции за просрочку возврата.
      Условия досрочного расторжения договора извлекаются в фоновом режиме (поля скрыты в DD Grid,
      так как полностью покрываются глобальными проверками termination_grounds и term_and_renewal).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат ТС"
        - "возврат транспортного средства"
        - "акт возврата"
        - "акт приема-передачи возврата"
        - "нормальный износ"
        - "естественный износ"
        - "чистом виде"
        - "чистым"
        - "после мойки"
        - "уровень топлива"
        - "полный бак"
        - "место возврата"
        - "адрес возврата"
        - "стоянка арендодателя"
        - "штраф за невозврат"
        - "просрочка возврата"
        - "двукратный размер"
        - "досрочное расторжение"
        - "отказ от договора"
        - "уведомление о расторжении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить|щении)\\s+(?:ТС|транспортн[а-я]*|автомобил[а-я]*)"
        - "(?i)(?:нормальн|естественн)[а-я]*\\s+износ"
        - "(?i)чист[а-я]*\\s+(?:виде|состоянии)|мыть|мойк[а-я]*"
        - "(?i)просрочк[а-я]*\\s+возврат[а-я]*|штраф[а-я]*\\s+за\\s+несвоевремен[а-я]*"
        - "(?i)досрочн[а-я]*\\s+расторж[а-я]*"
        - "(?i)отказ[а-я]*\\s+от\\s+(?:исполнения\\s+)?договор[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется порядок завершения аренды и возврата ТС Арендодателю (оформление акта,
        место возврата, состояние ТС, чистота, уровень топлива, штрафы за просрочку),
        а также условия досрочного расторжения договора.

        Нормативный ориентир:
        - ст. 622 ГК РФ — при прекращении договора аренды арендатор обязан вернуть арендодателю
          имущество в том состоянии, в котором он его получил, с учетом нормального износа
          или в состоянии, обусловленном договором. Если арендатор не возвратил имущество,
          арендодатель вправе потребовать внесения арендной платы за все время просрочки
          и возмещения убытков / уплаты штрафа.
        - ст. 316 ГК РФ — место исполнения обязательства по возврату движимого имущества.
        - ст. 619, 620 ГК РФ — досрочное расторжение договора по требованию сторон.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок возврата ТС (оформление двустороннего акта возврата, место/адрес возврата).
        2. Допустимое состояние ТС при возврате (нормальный износ, требования к чистоте, отсутствие повреждений).
        3. Требования к уровню топлива в баке при возврате ТС.
        4. Размер и порядок начисления штрафа / пени за просрочку возврата ТС (например: фиксированный штраф, посуточная плата, двукратный размер аренды).
        5. Основания досрочного расторжения договора по инициативе Арендодателя или Арендатора.
        6. Срок письменного уведомления другой стороны о намерении досрочно расторгнуть договор.
        7. Сформируй сводное читаемое поле return_summary_display для DD Grid, содержащее ключевые условия возврата ТС.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальный регламент возврата ТС:
        Фрагмент:
        "8.1. По окончании срока аренды Арендатор обязан вернуть ТС Арендодателю по адресу: г. Москва, ул. Ленина, д. 10,
        в чистом виде (после прохождения мойки за счет Арендатора) и с тем же уровнем топлива в баке, с которым ТС
        было получено (согласно Акту приема-передачи). Передача ТС оформляется двусторонним Актом возврата ТС.
        8.2. ТС должно быть возвращено в исправном техническом состоянии с учетом нормального естественного износа.
        8.3. За задержку возврата ТС Арендатор уплачивает Арендодателю неустойку в размере 5 000 рублей за каждый день просрочки.
        10.2. Договор может быть расторгнут досрочно по соглашению сторон либо в одностороннем порядке с письменным
        уведомлением другой стороны не менее чем за 30 календарных дней до даты расторжения."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "возвращается по двустороннему Акту возврата ТС по адресу: г. Москва, ул. Ленина, д. 10",
          "return_condition_status": "defined",
          "return_condition_details": "в исправном техническом состоянии с учетом нормального естественного износа, в чистом виде (после мойки за счет Арендатора)",
          "fuel_level_status": "defined",
          "fuel_level_details": "с тем же уровнем топлива в баке, с которым ТС было получено",
          "late_return_penalty_status": "defined",
          "late_return_penalty_details": "неустойка в размере 5 000 рублей за каждый день просрочки возврата",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "досрочно по соглашению сторон либо в одностороннем внесудебном порядке",
          "termination_notice_status": "defined",
          "termination_notice_details": "письменное уведомление не менее чем за 30 календарных дней",
          "return_summary_display": "По акту на склад Арендодателя (г. Москва); ТС чистое, бак как при получении, износ нормальный; штраф 5000 руб./сутки",
          "evidence": [
            {
              "clause_ref": "п. 8.1–8.3, 10.2",
              "quote": "По окончании срока аренды Арендатор обязан вернуть ТС Арендодателю по адресу: г. Москва, ул. Ленина, д. 10, в чистом виде (после прохождения мойки за счет Арендатора) и с тем же уровнем топлива в баке, с которым ТС было получено... Передача ТС оформляется двусторонним Актом возврата ТС. ТС должно быть возвращено в исправном техническом состоянии с учетом нормального естественного износа. За задержку возврата ТС Арендатор уплачивает Арендодателю неустойку в размере 5 000 рублей за каждый день просрочки."
            }
          ]
        }

        Пример 2 — только факт возврата без спецификации деталей:
        Фрагмент:
        "4.5. Арендатор обязуется своевременно вернуть автомобиль по окончании срока аренды в исправном состоянии.
        11.1. Досрочное расторжение договора допускается по основаниям, предусмотренным ГК РФ."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "своевременно вернуть автомобиль по окончании срока аренды",
          "return_condition_status": "defined",
          "return_condition_details": "в исправном состоянии",
          "fuel_level_status": "not_defined",
          "fuel_level_details": "Не установлено",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Не установлено",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "по основаниям, предусмотренным ГК РФ",
          "termination_notice_status": "not_defined",
          "termination_notice_details": "Не установлено",
          "return_summary_display": "Возврат ТС в исправном состоянии | Место возврата, чистота, топливо и штрафы не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Арендатор обязуется своевременно вернуть автомобиль по окончании срока аренды в исправном состоянии."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор аренды автомобиля вступает в силу с момента подписания."

        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Не установлено",
          "return_condition_status": "not_defined",
          "return_condition_details": "Не установлено",
          "fuel_level_status": "not_defined",
          "fuel_level_details": "Не установлено",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Не установлено",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Не установлено",
          "termination_notice_status": "not_defined",
          "termination_notice_details": "Не установлено",
          "return_summary_display": "Порядок возврата ТС не урегулирован",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора об оформлении акта возврата и месте возврата.
        2. Проверь наличие требований к износу, мойке/чистоте ТС.
        3. Найди упоминания уровня топлива при сдаче ТС.
        4. Проверь наличие штрафов/неустоек за несвоевременный возврат ТС.
        5. Проверь наличие условий о досрочном расторжении договора и сроке извещения.
        6. Сформируй сводное поле return_summary_display на основе извлеченных фактов о возврате ТС.
        7. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Не установлено'>",
          "return_condition_status": "<defined / not_defined>",
          "return_condition_details": "<текст или 'Не установлено'>",
          "fuel_level_status": "<defined / not_defined>",
          "fuel_level_details": "<текст или 'Не установлено'>",
          "late_return_penalty_status": "<defined / not_defined>",
          "late_return_penalty_details": "<текст или 'Не установлено'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Не установлено'>",
          "termination_notice_status": "<defined / not_defined>",
          "termination_notice_details": "<текст или 'Не установлено'>",
          "return_summary_display": "<сводка для таблицы DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат ТС возврат транспортного средства акт возврата нормальный износ чистом виде чистым после мойки уровень топлива полный бак место возврата адрес возврата штраф за невозврат просрочка возврата досрочное расторжение отказ от договора уведомление о расторжении"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - obligations
      negative_keywords:
