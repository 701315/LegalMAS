# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: vehicle_lease_parties_and_authority
    name: "Стороны договора аренды ТС: арендодатель, арендатор, полномочия"
    description: >
      Фактографическая проверка идентификации сторон договора аренды
      транспортного средства: арендодатель (фрахтовщик), арендатор
      (фрахтователь), реквизиты, подписанты и основания полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "фрахтовщик"
        - "фрахтователь"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор|фрахтовщик|фрахтователь).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ
        (ст. 632–649).
        Проверяется только один вопрос: идентификация арендодателя (фрахтовщика)
        и арендатора (фрахтователя), полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 182–185 ГК РФ — полномочия представителя

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Арендодатель / Фрахтовщик (наименование/ФИО, ИНН, ОГРН).
        2. Кто указан как Арендатор / Фрахтователь (наименование/ФИО, ИНН, ОГРН).
        3. Кто подписывает договор от каждой стороны и на каком основании.
        4. Сформируй краткое отображение подписанта + основания полномочий
           для каждой стороны (например, "директор Иванов И.И. (Устав)").

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если данные не указаны прямо — возвращай статус "not_defined"
           и текстовое значение "Данные не определены".
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Данные не определены" (для текстовых полей).
        4. Если сторона идентифицирована через приложение или протокол —
           укажи это в value (например, "Согласно Приложению №1 к договору").
        5. В evidence включай только текст договора.
        6. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стороны определены:
        Фрагмент:
        "ООО «АвтоПрокат» (ИНН 7700000001, ОГРН 1027700000001), именуемое
        «Арендодатель», в лице директора Иванова И.И., действующего на основании
        Устава, и Петров П.П. (паспорт серия 4500 № 123456), именуемый «Арендатор»."

        Ответ:
        {
          "landlord_details_status": "defined",
          "landlord_details_value": "ООО «АвтоПрокат», ИНН 7700000001, ОГРН 1027700000001",
          "landlord_type": "legal_entity",
          "landlord_signatory_status": "defined",
          "landlord_signatory_value": "директор Иванов И.И.",
          "landlord_signatory_basis": "charter",
          "landlord_signatory_display": "директор Иванов И.И. (Устав)",
          "tenant_details_status": "defined",
          "tenant_details_value": "Петров П.П., паспорт серия 4500 № 123456",
          "tenant_type": "individual",
          "tenant_signatory_status": "defined",
          "tenant_signatory_value": "Петров П.П.",
          "tenant_signatory_basis": "not_defined",
          "tenant_signatory_display": "Петров П.П.",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «АвтоПрокат» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Арендодатель», в лице директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор аренды ТС."

        Ответ:
        {
          "landlord_details_status": "not_defined",
          "landlord_details_value": "Данные не определены",
          "landlord_type": "not_defined",
          "landlord_signatory_status": "not_defined",
          "landlord_signatory_value": "Данные не определены",
          "landlord_signatory_basis": "not_defined",
          "landlord_signatory_display": "Данные не определены",
          "tenant_details_status": "not_defined",
          "tenant_details_value": "Данные не определены",
          "tenant_type": "not_defined",
          "tenant_signatory_status": "not_defined",
          "tenant_signatory_value": "Данные не определены",
          "tenant_signatory_basis": "not_defined",
          "tenant_signatory_display": "Данные не определены",
          "evidence": []
        }

        Пример 3 — подписант по доверенности:
        Фрагмент:
        "ООО «ТрансЛогистик» (ИНН 5000000123, ОГРН 1155000000123), именуемое
        «Фрахтовщик», в лице заместителя генерального директора Смирнова А.В.,
        действующего на основании доверенности № 15 от 10.01.2024, и
        АО «Грузоперевозчик» (ИНН 7712345678, ОГРН 1027712345678), именуемое
        «Фрахтователь», в лице генерального директора Козлова В.В., действующего
        на основании Устава."

        Ответ:
        {
          "landlord_details_status": "defined",
          "landlord_details_value": "ООО «ТрансЛогистик», ИНН 5000000123, ОГРН 1155000000123",
          "landlord_type": "legal_entity",
          "landlord_signatory_status": "defined",
          "landlord_signatory_value": "заместитель генерального директора Смирнов А.В.",
          "landlord_signatory_basis": "poa",
          "landlord_signatory_display": "зам. ген. директора Смирнов А.В. (доверенность № 15 от 10.01.2024)",
          "tenant_details_status": "defined",
          "tenant_details_value": "АО «Грузоперевозчик», ИНН 7712345678, ОГРН 1027712345678",
          "tenant_type": "legal_entity",
          "tenant_signatory_status": "defined",
          "tenant_signatory_value": "генеральный директор Козлов В.В.",
          "tenant_signatory_basis": "charter",
          "tenant_signatory_display": "ген. директор Козлов В.В. (Устав)",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ТрансЛогистик» (ИНН 5000000123, ОГРН 1155000000123), именуемое «Фрахтовщик», в лице заместителя генерального директора Смирнова А.В., действующего на основании доверенности № 15 от 10.01.2024."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Арендодателя.
        2. Найди прямую цитату с идентификацией Арендатора.
        3. Найди прямую цитату о подписантах и полномочиях.
        4. Проверь, что *_signatory_display содержит и подписанта, и основание,
           если основание указано в договоре.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "landlord_details_status": "<defined / not_defined>",
          "landlord_details_value": "<текст или 'Данные не определены'>",
          "landlord_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "landlord_signatory_status": "<defined / not_defined>",
          "landlord_signatory_value": "<текст или 'Данные не определены'>",
          "landlord_signatory_basis": "<charter / poa / order / other / not_defined>",
          "landlord_signatory_display": "<подписант + основание или 'Данные не определены'>",
          "tenant_details_status": "<defined / not_defined>",
          "tenant_details_value": "<текст или 'Данные не определены'>",
          "tenant_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "tenant_signatory_status": "<defined / not_defined>",
          "tenant_signatory_value": "<текст или 'Данные не определены'>",
          "tenant_signatory_basis": "<charter / poa / order / other / not_defined>",
          "tenant_signatory_display": "<подписант + основание или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендодатель арендатор фрахтовщик фрахтователь в лице действующего на основании ИНН ОГРН ОГРНИП реквизиты паспорт"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "VIN"
        - "госномер"
        - "ОСАГО"
        - "КАСКО"
        - "арендная плата"
        - "ремонт"
        - "штрафы"
        - "ДТП"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства сведения об Арендодателе (Фрахтовщике), Арендаторе (Фрахтователе),
        подписантах и основаниях их полномочий.
        Не анализируй предмет аренды, арендную плату, страхование, ремонт или ДТП.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. landlord_details_status — "defined" если Арендодатель прямо идентифицирован,
           иначе "not_defined".
        2. landlord_details_value — наименование/ФИО и реквизиты Арендодателя
           (ИНН, ОГРН/ОГРНИП, паспортные данные — то, что указано).
        3. landlord_type — "legal_entity" / "individual" / "individual_entrepreneur" /
           "not_defined".
        4. landlord_signatory_status — "defined" если подписант прямо указан,
           иначе "not_defined".
        5. landlord_signatory_value — ФИО и должность подписанта Арендодателя.
        6. landlord_signatory_basis — "charter" / "poa" / "order" / "other" /
           "not_defined".
        7. landlord_signatory_display — краткое отображение "должность ФИО (основание)"
           для показа юристу. Основание — в человеческой форме:
           "Устав", "доверенность № X от ДД.ММ.ГГГГ", "приказ № X".
        8. tenant_details_status — "defined" если Арендатор прямо идентифицирован,
           иначе "not_defined".
        9. tenant_details_value — наименование/ФИО и реквизиты Арендатора.
        10. tenant_type — "legal_entity" / "individual" / "individual_entrepreneur" /
            "not_defined".
        11. tenant_signatory_status — "defined" если подписант прямо указан,
            иначе "not_defined".
        12. tenant_signatory_value — ФИО и должность подписанта Арендатора.
        13. tenant_signatory_basis — "charter" / "poa" / "order" / "other" /
            "not_defined".
        14. tenant_signatory_display — краткое отображение "должность ФИО (основание)"
            для показа юристу.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Enum-поля (*_type, *_basis): "not_defined".
        - Текстовые поля (*_value, *_display): "Данные не определены".

        Если сторона идентифицирована отсылкой к приложению или протоколу —
        отрази это прямо в value (например, "Согласно Приложению №1 к договору").
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные
        из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - landlord_type / tenant_type:
        - "legal_entity" — ООО, АО, ПАО и иные юрлица.
        - "individual" — физическое лицо (не ИП).
        - "individual_entrepreneur" — индивидуальный предприниматель.
        - "not_defined" — не указано.
        - landlord_signatory_basis / tenant_signatory_basis:
        - "charter" — устав.
        - "poa" — доверенность.
        - "order" — приказ.
        - "other" — иное основание.
        - "not_defined" — не указано.
        - *_signatory_display формируется по шаблону:
        - если основание указано: "должность ФИО (основание в читаемой форме)".
        - если основание не указано: только "должность ФИО" или "ФИО".
        - если подписант не указан: "Данные не определены".
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

