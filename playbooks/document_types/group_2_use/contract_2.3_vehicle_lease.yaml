    - "wet lease agreement"
    - "dry lease agreement"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.79
    strong_signal_threshold: 0.87
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*транспортн[а-я]*[\\s_.-]*средств[а-я]*\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование договора аренды транспортного средства

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:тс|тс\\b)"
        kind: specific_subject
        weight: 0.94
        # Аббревиатура ТС как объект аренды

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:транспортн[а-я]*[\\s_.-]*средств[а-я]*[\\s_.-]*)?с[\\s_.-]*экипажем\\b"
        kind: specific_subject
        weight: 0.96
        # Аренда ТС с экипажем — одна из двух ключевых правовых моделей

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:транспортн[а-я]*[\\s_.-]*средств[а-я]*[\\s_.-]*)?без[\\s_.-]*экипажа\\b"
        kind: specific_subject
        weight: 0.96
        # Аренда ТС без экипажа — вторая ключевая правовая модель

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*автомобил[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Аренда автомобиля — из supported types

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:грузов[а-я]*[\\s_.-]*автомобил[а-я]*|коммерческ[а-я]*[\\s_.-]*транспорт[а-я]*|автобус[а-я]*)\\b"
        kind: specific_subject
        weight: 0.92
        # Аренда грузового авто / коммерческого транспорта / автобуса

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*спецтехник[а-я]*\\b|\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*строительн[а-я]*[\\s_.-]*техник[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Аренда спецтехники / строительной техники

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:морск[а-я]*[\\s_.-]*)?судн[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Аренда судна / морского судна

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*воздушн[а-я]*[\\s_.-]*судн[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Аренда воздушного судна

      - pattern: "(?i)\\bфрахтовани[ея][\\s_.-]*на[\\s_.-]*время\\b"
        kind: specific_subject
        weight: 0.96
        # Фрахтование на время — специальное юридическое наименование

      - pattern: "(?i)\\bтайм[\\s_.-]*чартер\\b"
        kind: specific_subject
        weight: 0.96
        # Тайм-чартер — прямой поддерживаемый subtype

      - pattern: "(?i)\\bбербоут[\\s_.-]*чартер\\b"
        kind: specific_subject
        weight: 0.96
        # Бербоут-чартер — из supported types, точный правовой термин

      - pattern: "(?i)\\bдоговор[\\s_.-]*фрахтовани[а-я]*\\b"
        kind: specific_subject
        weight: 0.90
        # Договор фрахтования из supported types

      - pattern: "(?i)\\bvehicle[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.94
        # Прямой англоязычный маркер vehicle lease

      - pattern: "(?i)\\bcar[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.90
        # Car lease — из supported types; lease (а не rental) указывает на аренду, а не прокат

      - pattern: "(?i)\\bcommercial[\\s_.-]*vehicle[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.92
        # Commercial vehicle lease — из supported types

      - pattern: "(?i)\\baircraft[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.92
        # Aircraft lease — из supported types

      - pattern: "(?i)\\b(?:wet|dry)[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.90
        # Wet/dry lease — авиационные формы аренды из supported types

      - pattern: "(?i)\\b(?:time[\\s_.-]*charter|тайм[\\s_.-]*чартер)(?:[\\s_.-]*(?:agreement|party))?\\b"
        kind: specific_subject
        weight: 0.94
        # Time charter — точный юридический термин, высокий вес

      - pattern: "(?i)\\b(?:bareboat|demise)[\\s_.-]*charter(?:[\\s_.-]*(?:agreement|party))?\\b"
        kind: specific_subject
        weight: 0.94
        # Bareboat / demise charter — из supported types, точные термины

      - pattern: "(?i)\\bvessel[\\s_.-]*charter(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.88
        # Vessel charter agreement — из supported types

      - pattern: "(?i)\\b(?:аренд[а-я]*[\\s_.-]*)?(?:машин[а-я]*|авто)\\b"
        kind: specific_subject
        weight: 0.72
        # Машина / авто как объект аренды; ниже, чем автомобиль — более разговорный маркер

      - pattern: "(?i)\\bvehicle[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.56
        # Vehicle rental без lease-квалификатора: возможен конфликт с contract_2.2_rental (прокат)

      - pattern: "(?i)\\bcar[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.50
        # Car rental — часто прокат, а не коммерческая аренда ТС

      - pattern: "(?i)\\bfleet[\\s_.-]*lease(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.58
        # Fleet lease — из supported types; умеренный вес: fleet может относиться к разным типам

      - pattern: "(?i)\\bequipment[\\s_.-]*and[\\s_.-]*vehicle[\\s_.-]*lease\\b"
        kind: generic_form
        weight: 0.52
        # Equipment and vehicle lease — из supported types, но смешанный предмет

      - pattern: "(?i)\\bфрахтовани[ея]\\b"
        kind: generic_form
        weight: 0.62
        # Фрахтование без уточнения на время / договор — шире vehicle lease

      - pattern: "(?i)\\bcharter\\b"
        kind: context
        weight: 0.22
        # Charter сам по себе слишком широк: party charter, political charter и т.д.

      - pattern: "(?i)\\btransport(?:ation)?[\\s_.-]*(?:agreement|contract)?\\b"
        kind: context
        weight: 0.20
        # Transportation agreement — ближе к перевозке, чем к аренде ТС

      - pattern: "(?i)\\bvehicle\\b"
        kind: context
        weight: 0.18
        # Vehicle без lease/rental/аренда слишком широкий маркер

    folder_patterns:
      - pattern: "(?i)аренд[а-я]*[_\\s-]*(?:тс|транспортн[а-я]*[_\\s-]*средств|автомобил|спецтехник|судн|воздушн)"
        kind: specific_subject
        weight: 0.84
        # Папки по аренде конкретных видов ТС

      - pattern: "(?i)vehicle[_\\s-]*lease|car[_\\s-]*lease|aircraft[_\\s-]*lease|commercial[_\\s-]*vehicle[_\\s-]*lease"
        kind: specific_subject
        weight: 0.82
        # Англоязычные lease-taxonomy папки по видам ТС

      - pattern: "(?i)(?:time|bareboat|demise)[_\\s-]*charter|тайм[_\\s-]*чартер|бербоут[_\\s-]*чартер"
        kind: specific_subject
        weight: 0.84
        # Charter-taxonomy папки — точные правовые формы

      - pattern: "(?i)(?:wet|dry)[_\\s-]*lease|vessel[_\\s-]*charter"
        kind: specific_subject
        weight: 0.80
        # Авиационные и судовые аренды в taxonomy

      - pattern: "(?i)фрахтован"
        kind: specific_subject
        weight: 0.76
        # Фрахтование в taxonomy папок

      - pattern: "(?i)fleet[_\\s-]*lease|fleet[_\\s-]*management"
        kind: generic_form
        weight: 0.50
        # Fleet folder полезен, но шире аренды ТС

      - pattern: "(?i)vehicle[_\\s-]*rental|car[_\\s-]*rental"
        kind: generic_form
        weight: 0.40
        # Rental-taxonomy конфликтует с прокатом

      - pattern: "(?i)transport(?:ation)?|транспорт"
        kind: context
        weight: 0.24
        # Слишком широкий transport-контекст

      - pattern: "(?i)vehicle|fleet"
        kind: context
        weight: 0.20
        # Общие fleet/vehicle маркеры без аренда/lease уточнения

      - pattern: "(?i)charter"
        kind: context
        weight: 0.18
        # Charter без уточнения типа слишком широк

    keywords:

      high:
        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+транспортн[огоого\\s]*средств[ао]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Прямое название договора аренды транспортного средства"

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+автомобил[яея]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Аренда автомобиля как транспортного средства"

        - pattern: "(?i)аренд[ауы]\\s+автомобил[яея]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Аренда автомобиля — объектом является транспортное средство"

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+спецтехник[иуы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда спецтехники — экскаватор, погрузчик и т.п."

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+судн[ао]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда судна — морского или речного"

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+воздушн[огоое\\s]*судн[ао]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда воздушного судна"

        - pattern: "(?i)транспортн[оеые]\\s+средств[оа]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Явное указание на транспортное средство как объект аренды"

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+тс\\s+с\\s+экипаж[ема]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Аренда ТС с экипажем — фрахтование на время по ст. 632-641 ГК РФ"

        - pattern: "(?i)договор\\s+аренд[ыыу]\\s+тс\\s+без\\s+экипаж[аы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Аренда ТС без экипажа — самостоятельная эксплуатация арендатором"

        - pattern: "(?i)с\\s+экипаж[ема]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Признак модели аренды с экипажем (фрахтование на время)"

        - pattern: "(?i)без\\s+экипаж[аы]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Признак модели аренды без экипажа"

        - pattern: "(?i)фрахтовани[ея]\\s+на\\s+время"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Фрахтование на время — разновидность аренды транспортного средства"

        - pattern: "(?i)тайм[-\\s]?чартер"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Тайм-чартер — форма аренды судна / воздушного судна"

        - pattern: "(?i)vin[-\\s]*номер"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "VIN-номер — уникальный идентификатор транспортного средства"

        - pattern: "(?i)госн[оа]мер"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Государственный регистрационный номер транспортного средства"

      medium:
        - pattern: "(?i)аренд[аы]\\s+ТС"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Сокращенная форма 'аренда ТС' — подтверждает vehicle-контекст"

        - pattern: "(?i)\\bсудн[оа]\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Общий термин судна — важен в сочетании с арендной терминологией"

        - pattern: "(?i)воздушн[оа]е\\s+судн[оа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Воздушное судно — самолёт, вертолёт, иное ВС"

        - pattern: "(?i)техническ[оа]е\\s+обслуживани[ея]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "ТО ТС — связано с эксплуатацией транспортного средства"

        - pattern: "(?i)полис\\s+ОСАГО"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "ОСАГО — обязательное страхование автогражданской ответственности"

        - pattern: "(?i)\\bКАСКО\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "КАСКО — добровольное страхование ТС"

        - pattern: "(?i)\\bГСМ\\b"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "ГСМ — расходы на эксплуатацию ТС"

        - pattern: "(?i)путев[оа]й\\s+лист"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Путевой лист — документ учета использования ТС"

        - pattern: "(?i)эксплуатаци[яи]\\s+ТС"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Эксплуатация ТС — характерна для аренды/лизинга транспортных средств"

        - pattern: "(?i)\\bПТС\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Паспорт транспортного средства"

        - pattern: "(?i)\\bСТС\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Свидетельство о регистрации ТС"

      low:
        - pattern: "(?i)\\bводител[ьяи]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Водитель — типичный участник vehicle lease, но термин общий"

        - pattern: "(?i)штраф[ыа]\\s+ГИБДД"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Штрафы ГИБДД — косвенный признак аренды/использования ТС"

        - pattern: "(?i)\\bпробег\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Пробег ТС — встречается в аренде, лизинге, прокате"

        - pattern: "(?i)диагностическ[а-яё]+\\s+карт[аы]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Диагностическая карта — часть регламентных требований к ТС"

        - pattern: "(?i)\\bтехосмотр\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Техосмотр — эксплуатационный контекст ТС"

        - pattern: "(?i)страхов[оа]й\\s+случа[йя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Страховой случай — общий страховой термин"

        - pattern: "(?i)источник\\s+повышенн[оа]й\\s+опасност[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Статус владельца источника повышенной опасности по ст. 1079 ГК РФ"

    exclusions:
      - pattern: "(?i)аренд[аы]\\s+недвижимост[ии]"
        severity: hard
        weight: -1.0
        description: "Аренда недвижимости — иной объект (contract_1.6_real_estate, contract_2.1_lease)"

      - pattern: "(?i)договор\\s+прокат[аыу]"
        severity: hard
        weight: -1.0
        description: "Договор проката — consumer-режим, не специализированная аренда ТС (contract_2.2_rental)"

      - pattern: "(?i)договор\\s+бытов[огоый]\\s+прокат[аыу]"
        severity: hard
        weight: -1.0
        description: "Бытовой прокат ТС — должен обрабатываться как прокат/sharing (contract_2.2_rental)"

      - pattern: "(?i)финансов[а-яё]+\\s+аренд[аы]"
        severity: hard
        weight: -1.0
        description: "Финансовая аренда (лизинг) — отдельный тип (contract_2.4_leasing)"

      - pattern: "(?i)безвозмездн[оа]е\\s+пользовани[ея]"
        severity: hard
        weight: -1.0
        description: "Безвозмездное пользование — ссуда, не аренда (contract_2.6_gratuitous_use)"

      - pattern: "(?i)жил[оа]й\\s+на[её]м"
        severity: hard
        weight: -1.0
        description: "Найм жилого помещения — жилищный найм, не аренда ТС (contract_2.5_residential_lease)"

      - pattern: "(?i)договор\\s+на[йеё]м[ауы]\\s+жил[оа]го\\s+помещени[яя]"
        severity: hard
        weight: -1.0
        description: "Договор найма жилого помещения — не аренда транспортного средства"

      # ── Soft exclusions

      - pattern: "(?i)перевозк[аы]\\s+груз[аа]"
        severity: soft
        weight: -0.35
        description: "Договор перевозки груза — отдельный тип, хотя может использоваться терминология ТС"

      - pattern: "(?i)договор\\s+перевозк[ии]"
        severity: soft
        weight: -0.35
        description: "Договор перевозки — не аренда транспортного средства"

      - pattern: "(?i)\\bлизинг\\b"
        severity: soft
        weight: -0.4
        description: "Упоминание лизинга рядом с арендой ТС снижает уверенность — возможен лизинговый кейс (contract_2.4_leasing)"

      - pattern: "(?i)\\bпрокат\\b"
        severity: soft
        weight: -0.3
        description: "Общее упоминание проката без чёткой арендной терминологии тянет к consumer-прокату (contract_2.2_rental)"

      - pattern: "(?i)\\bссуд[аы]\\b"
        severity: soft
        weight: -0.3
        description: "Ссуда (безвозмездное пользование) может упоминаться в оговорках (contract_2.6_gratuitous_use)"

