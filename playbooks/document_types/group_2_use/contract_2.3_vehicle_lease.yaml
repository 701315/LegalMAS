        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. downtime_compensation_status — "defined" если условия простоя ТС прямо описаны, иначе "not_defined".
        2. downtime_compensation_details — кто несёт расходы за период простоя.
        3. replacement_vehicle_status — "defined" если обязанность предоставить подменное ТС прямо указана, иначе "not_defined".
        4. replacement_vehicle_details — сроки, класс и условия подменного ТС.
        5. payment_suspension_status — "defined" если право приостановки оплаты прямо предусмотрено, иначе "not_defined".
        6. payment_suspension_details — условия приостановки или пересчёта оплаты аренды.
        7. downtime_summary_display — сводка для DD Grid.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - downtime_summary_display: "Условия простоя и подменного ТС не урегулированы".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
