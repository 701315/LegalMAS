      - "(?i)страхов[оа]й\\s+случа[йя]"
      - "(?i)выгодоприобретател[ьяи]"
      - "(?i)страхов[а-яё]+\\s+компани[яи]"

  fines_and_traffic_risk:
    any_keywords:
      - "(?i)штраф[ыа]\\s+ГИБДД"
