  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Передача ТС
  # ──────────────────────────────────────────────────────────────────────────
  - id: vehicle_handover_check
    name: "Передача ТС: акт, состояние, пробег, фотофиксация, документы"
    description: >
      Фактографическая проверка порядка передачи ТС: акт приёма-передачи,
      техническое состояние, пробег, фотофиксация, комплект документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт приема-передачи"
        - "техническое состояние"
        - "пробег"
        - "фотофиксация"
        - "существующие повреждения"
        - "комплект документов"
        - "ключи"
        - "уровень топлива"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)пробег"
        - "(?i)фотофиксац"
        - "(?i)уровень\\s+топлив"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок передачи ТС арендатору.

        Нормативный ориентир:
        - ст. 611 ГК РФ — передача имущества
        - судебная практика по фиксации состояния ТС

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт приёма-передачи.
        2. Фиксируется ли техническое состояние при передаче.
        3. Фиксируется ли пробег при передаче.
        4. Предусмотрена ли фотофиксация.
        5. Фиксируются ли существующие повреждения.
        6. Указан ли комплект передаваемых документов и ключей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — передача урегулирована:
        Фрагмент:
        "ТС передаётся по двустороннему акту приёма-передачи с указанием
        технического состояния, пробега (одометр) и перечня существующих
        повреждений. Стороны фиксируют состояние фотографиями. Арендатору
        передаются: ПТС, СТС, полис ОСАГО, 2 комплекта ключей."

        Ответ:
        {
          "handover_act_status": "defined",
          "handover_act_details": "двусторонний акт приёма-передачи",
          "condition_recorded_status": "defined",
          "condition_recorded_details": "с указанием технического состояния",
          "mileage_recorded_status": "defined",
          "mileage_recorded_details": "пробег (одометр)",
          "photo_fixation_status": "defined",
          "photo_fixation_details": "фиксируют состояние фотографиями",
          "existing_damage_status": "defined",
          "existing_damage_details": "перечень существующих повреждений",
          "document_pack_status": "defined",
          "document_pack_details": "ПТС, СТС, полис ОСАГО, 2 комплекта ключей",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "ТС передаётся по двустороннему акту приёма-передачи с указанием технического состояния, пробега (одометр) и перечня существующих повреждений."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт ТС Арендатору."

        Ответ:
        {
          "handover_act_status": "not_defined",
          "handover_act_details": "Данные не определены",
          "condition_recorded_status": "not_defined",
          "condition_recorded_details": "Данные не определены",
          "mileage_recorded_status": "not_defined",
          "mileage_recorded_details": "Данные не определены",
          "photo_fixation_status": "not_defined",
          "photo_fixation_details": "Данные не определены",
          "existing_damage_status": "not_defined",
          "existing_damage_details": "Данные не определены",
          "document_pack_status": "not_defined",
          "document_pack_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об акте приёма-передачи.
        2. Найди прямую цитату о фиксации состояния.
        3. Найди прямую цитату о пробеге.
        4. Найди прямую цитату о фотофиксации.
        5. Найди прямую цитату о существующих повреждениях.
        6. Найди прямую цитату о документах и ключах.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "handover_act_status": "<defined / not_defined>",
          "handover_act_details": "<текст или 'Данные не определены'>",
          "condition_recorded_status": "<defined / not_defined>",
          "condition_recorded_details": "<текст или 'Данные не определены'>",
          "mileage_recorded_status": "<defined / not_defined>",
          "mileage_recorded_details": "<текст или 'Данные не определены'>",
          "photo_fixation_status": "<defined / not_defined>",
          "photo_fixation_details": "<текст или 'Данные не определены'>",
          "existing_damage_status": "<defined / not_defined>",
          "existing_damage_details": "<текст или 'Данные не определены'>",
          "document_pack_status": "<defined / not_defined>",
          "document_pack_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи техническое состояние пробег фотофиксация существующие повреждения комплект документов ключи уровень топлива"
