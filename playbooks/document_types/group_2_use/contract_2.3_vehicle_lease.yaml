          "return_condition_status": "not_defined",
          "return_condition_details": "Данные не определены",
          "fuel_level_status": "not_defined",
          "fuel_level_details": "Данные не определены",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "termination_notice_status": "not_defined",
          "termination_notice_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1–6. Найди прямые цитаты по каждому пункту задачи.
        7. Если прямой цитаты нет — верни "not_defined".

