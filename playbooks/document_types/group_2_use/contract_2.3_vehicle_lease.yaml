        - name: "allowed_drivers_list_details"
          type: "string"
          presentation: "fact"
          description: "Круг или поименный список допущенных к управлению водителей (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "transfer_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета передачи управления."
          required: true
          display_in_grid: false
        - name: "transfer_prohibition_details"
          type: "string"
          presentation: "fact"
          description: "Запрет передачи управления транспортным средством третьим лицам (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "territorial_limits_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус территориальных ограничений."
          required: true
          display_in_grid: false
        - name: "territorial_limits_details"
          type: "string"
