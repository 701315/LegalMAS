        - "управление ТС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вред.*третьим\\s+лицам"
        - "(?i)источник\\s+повышенн(ой|ого)\\s+опасност"
        - "(?i)несет\\s+арендатор|несет\\s+арендодатель"
