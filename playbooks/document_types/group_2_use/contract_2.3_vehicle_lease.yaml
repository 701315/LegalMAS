      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства порядок возврата ТС, требования к состоянию и чистоте, уровень топлива,
        штрафы за просрочку возврата, а также основания и сроки досрочного расторжения договора.
        Не анализируй размер текущей арендной платы, страхование КАСКО/ОСАГО, ДТП или ремонт ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. return_procedure_status — "defined" если порядок возврата ТС прямо предусмотрен,
           иначе "not_defined".
        2. return_procedure_details — формулировка о порядке и месте (адресе) возврата ТС.
        3. return_condition_status — "defined" если состояние ТС при возврате (износ, чистота) прямо описано,
           иначе "not_defined".
        4. return_condition_details — формулировка о допустимом состоянии ТС при возврате (нормальный износ, чистота/мойка).
        5. fuel_level_status — "defined" если требования к уровню топлива при возврате прямо установлены,
           иначе "not_defined".
        6. fuel_level_details — формулировка о количестве топлива при возврате ТС.
        7. late_return_penalty_status — "defined" если неустойка/штраф за просрочку возврата прямо предусмотрены,
           иначе "not_defined".
        8. late_return_penalty_details — размер и порядок начисления штрафа за несвоевременный возврат ТС.
        9. termination_grounds_status — "defined" если основания досрочного расторжения указаны,
           иначе "not_defined".
        10. termination_grounds_details — формулировка об основаниях расторжения договора.
        11. termination_notice_status — "defined" если срок письменного уведомления о расторжении прямо указан,
            иначе "not_defined".
        12. termination_notice_details — срок и порядок предупреждения о расторжении договора.
        13. return_summary_display — читаемая краткая сводка для юриста в таблице DD Grid
            (как возвращается ТС, место возврата, требования к баку/чистоте и штраф за задержку ТС).

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - return_summary_display: "Порядок возврата ТС не урегулирован".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата ТС."
          required: true
          display_in_grid: false
        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке и месте возврата ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "return_condition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус допустимого состояния при возврате."
          required: true
          display_in_grid: false
        - name: "return_condition_details"
          type: "string"
          presentation: "fact"
          label: "Состояние и топливо при возврате"
          description: "Требования к техническому состоянию, чистоте (мойке) ТС и уровню топлива при возврате."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "fuel_level_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об уровне топлива."
          required: true
          display_in_grid: false
        - name: "fuel_level_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об уровне топлива при возврате ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "late_return_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафа за просрочку возврата."
          required: true
          display_in_grid: false
        - name: "late_return_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штраф за просрочку возврата"
          description: "Неустойка, пени или штрафные санкции за несвоевременный возврат транспортного средства."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований досрочного расторжения."
          required: true
          display_in_grid: false
        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          description: "Основания досрочного расторжения договора (внутреннее поле, дублирует global layer)."
          required: false
          display_in_grid: false
        - name: "termination_notice_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока уведомления о расторжении."
          required: true
          display_in_grid: false
        - name: "termination_notice_details"
          type: "string"
          presentation: "fact"
          description: "Срок предупреждения о расторжении (внутреннее поле, дублирует global layer)."
          required: false
          display_in_grid: false
        - name: "return_summary_display"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата ТС"
          description: "Сводная информация о процедуре возврата автомобиля (акт, место, топливо, чистота ТС, штрафы за просрочку)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_fines_and_regress_check
    name: "Штрафы ГИБДД, административные взыскания и регресс к арендатору"
    description: >
      Фактографическая проверка наличия механизма компенсации Арендатором
      административных штрафов, зафиксированных камерами автоматической фиксации
      (штрафы ГИБДД, неоплата парковки МАДИ/АМПП, система «Платон»,
      весогабаритный контроль), сроков возмещения, права удержания сумм из депозита
      (обеспечительного платежа) и регрессных требований (ст. 2.6.1 КоАП РФ, ст. 1081 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штрафы ГИБДД"
        - "административные штрафы"
        - "письма счастья"
        - "штрафы с камер"
        - "видеофиксация"
        - "фотовидеофиксация"
        - "компенсация штрафов"
        - "возместить штраф"
        - "срок возмещения"
        - "Платон"
        - "весогабаритный контроль"
        - "МАДИ"
        - "АМПП"
        - "платная парковка"
        - "газон"
        - "депозит"
        - "обеспечительный платеж"
        - "удержание из депозита"
        - "регресс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф[а-я]*\\s+(?:ГИБДД|полици[а-я]*|ГАИ|МАДИ|АМПП|Платон)"
        - "(?i)(?:возместит|компенсироват)[а-я]*.*штраф"
        - "(?i)фотовидеофиксац|камер[а-я]*\\s+фиксац"
        - "(?i)удержан[а-я]*.*(?:депозит|обеспечительн)"
        - "(?i)регрессн[а-я]*\\s+требован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется механизм компенсации Арендатором административных штрафов
        (штрафы ГИБДД с камер фотовидеофиксации, парковка МАДИ/АМПП, Платон, весогабаритный контроль),
        порядок и сроки извещения, право удержания штрафов из обеспечительного платежа/депозита и регресс.

        Нормативный ориентир:
        - ст. 2.6.1 КоАП РФ — к административной ответственности за правонарушения в области дорожного движения,
          зафиксированные камерами, привлекаются собственники (владельцы) транспортных средств.
        - ст. 32.2 КоАП РФ — сроки уплаты штрафов (включая льготный период 20 дней со скидкой 50%).
        - ст. 1081 ГК РФ — право обратного требования (регресса) лица, возместившего вред.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли обязанность Арендатора компенсировать/оплачивать штрафы за нарушения ПДД,
           правил парковки, системы «Платон», весогабаритного контроля и иные административные санкции.
        2. Предусмотрен ли порядок и срок уведомления Арендатора о поступивших штрафах.
        3. Установлен ли конкретный срок возмещения/компенсации сумм штрафов Арендатором.
        4. Предусмотрен ли регрессный механизм или обязанность возместить судебные/представительские расходы на обжалование.
        5. Предусмотрено ли право Арендодателя удержать сумму штрафов из депозита (обеспечительного платежа).
        6. Сформируй сводное читаемое поле fines_summary_display для таблицы DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный механизм с удержанием из депозита:
        Фрагмент:
        "7.4. Арендатор обязуется в полном объеме компенсировать Арендодателю любые административные штрафы
        (включая штрафы ГИБДД, МАДИ, АМПП, системы «Платон» и за нарушение правил весогабаритного контроля),
        зафиксированные в период владения и пользования ТС Арендатором.
        7.5. Арендодатель направляет Арендатору копию постановления по электронной почте в течение 3 рабочих дней.
        Арендатор обязан возместить сумму штрафа в течение 5 календарных дней с момента получения уведомления.
        7.6. В случае неоплаты штрафа в установленный срок Арендодатель вправе в безакцептном порядке удержать
        соответствующую сумму из внесенного Арендатором обеспечительного платежа (депозита)."

        Ответ:
        {
          "fines_reimbursement_status": "defined",
          "fines_reimbursement_details": "Арендатор в полном объеме компенсирует любые административные штрафы (ГИБДД, МАДИ, АМПП, Платон, весогабаритный контроль)",
          "notification_procedure_status": "defined",
          "notification_procedure_details": "Копия постановления по электронной почте в течение 3 рабочих дней",
          "reimbursement_deadline_status": "defined",
          "reimbursement_deadline_details": "в течение 5 календарных дней с момента получения уведомления",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Не установлено",
          "deposit_retention_for_fines_status": "defined",
          "deposit_retention_for_fines_details": "Безакцептное удержание суммы штрафа из обеспечительного платежа (депозита)",
          "fines_summary_display": "Арендатор возмещает штрафы (ГИБДД, МАДИ, Платон, весогабарит) за 5 дней; удержание из депозита предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 7.4–7.6",
              "quote": "Арендатор обязуется в полном объеме компенсировать Арендодателю любые административные штрафы (включая штрафы ГИБДД, МАДИ, АМПП, системы «Платон» и за нарушение правил весогабаритного контроля)... Арендатор обязан возместить сумму штрафа в течение 5 календарных дней с момента получения уведомления. В случае неоплаты штрафа в установленный срок Арендодатель вправе в безакцептном порядке удержать соответствующую сумму из внесенного Арендатором обеспечительного платежа (депозита)."
            }
          ]
        }

        Пример 2 — базовая обязанность без депозита:
        Фрагмент:
        "5.3. Все штрафы за нарушение Правил дорожного движения, совершенные в период аренды, подлежат оплате Арендатором."

        Ответ:
        {
          "fines_reimbursement_status": "defined",
          "fines_reimbursement_details": "Все штрафы за нарушение ПДД подлежат оплате Арендатором",
          "notification_procedure_status": "not_defined",
          "notification_procedure_details": "Не установлено",
          "reimbursement_deadline_status": "not_defined",
