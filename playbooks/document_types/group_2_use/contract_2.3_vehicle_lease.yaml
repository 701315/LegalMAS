    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за вред третьим лицам источник повышенной опасности вред здоровью имуществу несёт арендатор несёт арендодатель фрахтовщик действия экипажа текущий капитальный ремонт техническое обслуживание содержание ТС регресс"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "ДТП порядок"
        - "возврат ТС"
        - "означает"
