doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора и статус фрахтовщика/фрахтователя"
    description: "Проверяет идентификацию арендодателя и арендатора"
    legal_base: "ст. 432, 632, 636 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
