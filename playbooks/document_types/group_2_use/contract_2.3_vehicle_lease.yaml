        - "штрафы"
        - "ДТП"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

