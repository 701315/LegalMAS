          "termination_notice_status": "defined",
          "termination_notice_details": "уведомив за 14 дней",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "ТС возвращается по акту возврата с уровнем топлива не ниже ½ бака."
            }
          ]
        }

        Пример 2:
