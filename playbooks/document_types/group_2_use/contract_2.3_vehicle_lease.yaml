      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства механизм компенсации административных штрафов: обязанность возмещения
        (штрафы ГИБДД, парковка МАДИ/АМПП, система «Платон», весогабаритный контроль),
        порядок и сроки уведомления, срок компенсации, регрессные требования и удержание из депозита.
        Не анализируй размер арендной платы, условия страхования КАСКО, ДТП или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. fines_reimbursement_status — "defined" если обязанность компенсировать штрафы прямо указана,
           иначе "not_defined".
        2. fines_reimbursement_details — формулировка об обязанности возмещения штрафов (включая виды нарушений).
        3. notification_procedure_status — "defined" если порядок и сроки уведомления Арендатора о штрафах прямо описаны,
           иначе "not_defined".
        4. notification_procedure_details — порядок уведомления Арендатора.
        5. reimbursement_deadline_status — "defined" если срок компенсации/возмещения штрафов прямо установлен,
           иначе "not_defined".
        6. reimbursement_deadline_details — срок компенсации штрафов Арендатором.
        7. regress_mechanism_status — "defined" если регрессные требования/возмещение судебных расходов прямо оговорены,
           иначе "not_defined".
        8. regress_mechanism_details — формулировка о регрессе или компенсации расходов на обжалование.
        9. deposit_retention_for_fines_status — "defined" если удержание сумм штрафов из обеспечительного платежа (депозита) прямо предусмотрено,
           иначе "not_defined".
        10. deposit_retention_for_fines_details — формулировка об удержании штрафов из депозита / обеспечительного платежа.
        11. fines_summary_display — читаемая краткая сводка для юриста в таблице DD Grid
            (кто компенсирует штрафы, виды нарушений, срок возмещения и право списания из депозита).

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - fines_summary_display: "Компенсация административных штрафов не урегулирована".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "fines_reimbursement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности компенсировать штрафы."
          required: true
          display_in_grid: false
        - name: "fines_reimbursement_details"
