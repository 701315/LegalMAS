    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства порядок действий при ДТП: регламент, сроки уведомления Арендодателя,
        вызов сотрудников ГИБДД / оформление европротокола и запрет ремонта без согласия.
        Не анализируй размер арендной платы, штрафы ГИБДД за превышение скорости или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. accident_procedure_status — "defined" если порядок действий при ДТП прямо описан,
           иначе "not_defined".
        2. accident_procedure_details — формулировка общего порядка действий при ДТП и оформления аварии.
        3. landlord_notification_status — "defined" если обязанность и срок уведомления Арендодателя прямо указаны,
           иначе "not_defined".
        4. landlord_notification_details — срок и способ уведомления Арендодателя о ДТП.
        5. police_europrotocol_status — "defined" если вызов сотрудников ГИБДД / составление европротокола прямо предусмотрены,
           иначе "not_defined".
        6. police_europrotocol_details — формулировка о вызове ГИБДД или составлении европротокола.
        7. repair_consent_required_status — "defined" если запрет ремонта без согласия / запрет признания вины прямо установлены,
           иначе "not_defined".
        8. repair_consent_required_details — формулировка о запрете несогласованного ремонта или признания вины.
        9. accident_summary_display — читаемая краткая сводка для юриста в таблице DD Grid.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - accident_summary_display: "Порядок действий при ДТП не урегулирован".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "accident_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регламента действий при ДТП."
          required: true
          display_in_grid: false
        - name: "accident_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок действий и оформление"
          description: "Общий порядок действий при ДТП и оформление документов."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "landlord_notification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус уведомления арендодателя."
          required: true
          display_in_grid: false
        - name: "landlord_notification_details"
          type: "string"
          presentation: "fact"
          description: "Срок и порядок уведомления арендодателя о ДТП (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "police_europrotocol_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус вызова ГИБДД / европротокола."
          required: true
          display_in_grid: false
        - name: "police_europrotocol_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о вызове ГИБДД или европротоколе (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "repair_consent_required_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета ремонта без согласия."
          required: true
          display_in_grid: false
        - name: "repair_consent_required_details"
          type: "string"
          presentation: "fact"
          label: "Запрет ремонта без согласия"
          description: "Запрет самостоятельного восстановительного ремонта ТС без согласия арендодателя."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "accident_summary_display"
          type: "string"
          presentation: "fact"
          label: "Регламент при ДТП"
          description: "Сводная информация о действиях при аварии (уведомление арендодателя, вызов ГИБДД, документы, запрет ремонта)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_liability_allocation_check
    name: "Ответственность перед третьими лицами и обязанности по ремонту ТС"
    description: >
      Фактографическая проверка распределения деликтной ответственности за вред
      третьим лицам (источник повышенной опасности, действия экипажа) и обязанностей
      по текущему и капитальному ремонту ТС в зависимости от правовой модели
      аренды (ст. 634, 635, 640 ГК РФ — с экипажем; ст. 644, 648, 1079 ГК РФ — без экипажа).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность за вред третьим лицам"
        - "источник повышенной опасности"
        - "несет арендатор"
        - "несет арендодатель"
        - "экипаж"
        - "действия экипажа"
        - "текущий ремонт"
        - "капитальный ремонт"
        - "техническое обслуживание"
        - "содержание ТС"
        - "регресс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вред[а-я]*.*третьим\\s+лицам"
        - "(?i)источник[а-я]*\\s+повышенн(ой|ого|ую)\\s+опасност"
        - "(?i)нес[её]т\\s+(?:арендатор|арендодатель|фрахтовщик|фрахтователь)"
        - "(?i)действи(я|й|ям)\\s+экипаж"
        - "(?i)(?:текущ|капитальн)[а-я]*\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется распределение ответственности за вред перед третьими лицами (ИПО, экипаж)
        и обязанностей по ремонту и техническому обслуживанию ТС.

        Нормативный ориентир:
        - Аренда ТС с экипажем:
            - ст. 634 ГК РФ — обязанность по текущему и капитальному ремонту лежит на Арендодателе;
            - ст. 635 ГК РФ — члены экипажа являются работниками Арендодателя;
            - ст. 640 ГК РФ — ответственность за вред третьим лицам несёт Арендодатель (с правом регресса при вине Арендатора).
        - Аренда ТС без экипажа:
            - ст. 644 ГК РФ — обязанность по текущему и капитальному ремонту лежит на Арендаторе;
            - ст. 648 ГК РФ, ст. 1079 ГК РФ — ответственность за вред третьим лицам несёт Арендатор как владелец ИПО.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На кого возложена ответственность за вред, причинённый третьим лицам (Арендодатель / Арендатор).
        2. Есть ли прямое указание на ответственность владельца источника повышенной опасности (ИПО).
        3. Указана ли ответственность за действия / вину экипажа (водителя) и условия регресса.
        4. Как распределены обязанности по текущему и капитальному ремонту и ТО автомобиля.
        5. Сформируй сводное читаемое поле liability_allocation_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — аренда без экипажа (ответственность и ремонт на Арендаторе):
        Фрагмент:
        "3.2. Арендатор своими силами и за свой счет осуществляет регулярное техническое обслуживание,
        текущий и капитальный ремонт ТС.
        7.1. Ответственность за вред, причинённый третьим лицам транспортным средством как источником
        повышенной опасности, в полном объёме несёт Арендатор в соответствии со ст. 648 и 1079 ГК РФ."

        Ответ:
        {
          "third_party_liability_holder_status": "defined",
          "third_party_liability_holder_code": "tenant",
          "third_party_liability_details": "Ответственность за вред третьим лицам несёт Арендатор (ст. 648, 1079 ГК РФ)",
          "hazardous_source_reference_status": "defined",
          "hazardous_source_reference_details": "ТС как источник повышенной опасности",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Не установлено",
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "Арендатор за свой счет осуществляет ТО, текущий и капитальный ремонт",
          "liability_allocation_summary_display": "Вред третьим лицам (ИПО): Арендатор | Ремонт и ТО: за счет Арендатора (текущий и капитальный)",
          "evidence": [
            {
              "clause_ref": "п. 3.2, 7.1",
              "quote": "Арендатор своими силами и за свой счет осуществляет регулярное техническое обслуживание, текущий и капитальный ремонт ТС. Ответственность за вред, причинённый третьим лицам транспортным средством как источником повышенной опасности, в полном объёме несёт Арендатор."
            }
          ]
        }

        Пример 2 — аренда с экипажем / фрахтование на время (ответственность на Арендодателе):
        Фрагмент:
        "2.4. Фрахтовщик обязан поддерживать надлежащее техническое состояние ТС, включая осуществление
        текущего и капитального ремонта, и предоставлять квалифицированный экипаж.
        6.2. Ответственность за вред, причиненный жизни, здоровью или имуществу третьих лиц при эксплуатации ТС,
        несет Фрахтовщик. Фрахтовщик вправе предъявить регрессное требование к Фрахтователю,
        если докажет, что вред возник по вине последнего."

        Ответ:
        {
          "third_party_liability_holder_status": "defined",
          "third_party_liability_holder_code": "landlord",
          "third_party_liability_details": "Несет Фрахтовщик (Арендодатель) с правом регресса при доказанной вине Фрахтователя",
          "hazardous_source_reference_status": "not_defined",
          "hazardous_source_reference_details": "Не установлено",
          "crew_liability_status": "defined",
          "crew_liability_details": "Фрахтовщик предоставляет экипаж и отвечает за его действия",
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "Фрахтовщик обязан поддерживать состояние ТС, осуществлять текущий и капитальный ремонт",
          "liability_allocation_summary_display": "Вред третьим лицам: Арендодатель (с регрессом по вине Арендатора) | Ремонт и ТО: Арендодатель",
          "evidence": [
            {
              "clause_ref": "п. 2.4, 6.2",
              "quote": "Фрахтовщик обязан поддерживать надлежащее техническое состояние ТС, включая осуществление текущего и капитального ремонта. Ответственность за вред, причиненный жизни, здоровью или имуществу третьих лиц при эксплуатации ТС, несет Фрахтовщик."
            }
          ]
        }

        Пример 3 — условия отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством РФ."

        Ответ:
        {
          "third_party_liability_holder_status": "not_defined",
          "third_party_liability_holder_code": "not_defined",
          "third_party_liability_details": "Не установлено",
          "hazardous_source_reference_status": "not_defined",
          "hazardous_source_reference_details": "Не установлено",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Не установлено",
          "maintenance_allocation_status": "not_defined",
          "maintenance_allocation_details": "Не установлено",
          "liability_allocation_summary_display": "Ответственность перед третьими лицами и ремонт не урегулированы (по закону)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об ответственности за вред третьим лицам и причинение ущерба.
        2. Найди пункт об обязанностях по текущему/капитальному ремонту и техобслуживанию.
        3. Проверь наличие условий об экипаже (при аренде с экипажем) или ИПО (без экипажа).
        4. Сформируй сводное поле liability_allocation_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "third_party_liability_holder_status": "<defined / not_defined>",
          "third_party_liability_holder_code": "<landlord / tenant / not_defined>",
          "third_party_liability_details": "<текст или 'Не установлено'>",
          "hazardous_source_reference_status": "<defined / not_defined>",
          "hazardous_source_reference_details": "<текст или 'Не установлено'>",
          "crew_liability_status": "<defined / not_defined>",
          "crew_liability_details": "<текст или 'Не установлено'>",
          "maintenance_allocation_status": "<defined / not_defined>",
          "maintenance_allocation_details": "<текст или 'Не установлено'>",
          "liability_allocation_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
