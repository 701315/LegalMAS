      - "(?i)штраф[ыа]\\s+с\\s+камер"
      - "(?i)административн[ыо]е\\s+штраф[ыа]"
      - "(?i)нарушени[ея]\\s+ПДД"

  driver_restrictions:
    any_keywords:
      - "(?i)водительск[оа]е\\s+удостоверени[ея]"
      - "(?i)\\bкатегори[яи]\\b"
      - "(?i)стаж\\s+вождени[яя]"
      - "(?i)допущенн[ыо]е\\s+водител[ии]"
      - "(?i)запрет\\s+передач[ии]\\s+управлени[яя]"
      - "(?i)трезв[ыо]й\\s+водител[ьяи]"

  territory_limits:
    any_keywords:
      - "(?i)территори[яи]\\s+эксплуатаци[ии]"
      - "(?i)выезд\\s+за\\s+предел[ыы]"
      - "(?i)за\\s+предел[ыы]\\s+РФ"
      - "(?i)\\bгеозон[аы]\\b"
      - "(?i)географическ[иоя]+\\s+ограничени[яя]"
      - "(?i)разрешенн[ыо]й\\s+регион"

  security_deposit_related:
    any_keywords:
      - "(?i)\\bзалог\\b"
      - "(?i)\\bдепозит\\b"
      - "(?i)обеспечительн[ыо]й\\s+плат[её]ж"
      - "(?i)страхов[оа]й\\s+депозит"
      - "(?i)удержани[ея]\\s+депозит[аа]"

  consumer_short_term_hint:
    any_keywords:
      - "(?i)бытов[ыо]е\\s+нужд[ыа]"
      - "(?i)\\bгражданин\\b"
      - "(?i)краткосрочн[а-яё]+\\s+аренд[аы]"
      - "(?i)почасов[а-яё]+\\s+аренд[аы]"
      - "(?i)посуточн[а-яё]+\\s+аренд[аы]"
