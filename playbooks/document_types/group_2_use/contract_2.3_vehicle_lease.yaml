    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "штрафы ГИБДД административные штрафы письма счастья штрафы с камер фотовидеофиксация обязан возместить срок возмещения компенсация штрафов Платон весогабаритный контроль МАДИ АМПП парковка удержание из депозита обеспечительный платеж регресс"
