    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства ограничения использования: требования к водителям (стаж, возраст, категория),
        круг допущенных лиц, запрет передачи управления третьим лицам, территорию эксплуатации,
        запрет выезда за рубеж, запрет субаренды и коммерческого использования (такси, буксировка, гонки).
        Не анализируй арендную плату, условия страхования КАСКО/ОСАГО, ДТП или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. driver_requirements_status — "defined" если требования к водителям (стаж, возраст, категория) прямо указаны,
           иначе "not_defined".
        2. driver_requirements_details — формулировка о требованиях к водителям.
        3. allowed_drivers_list_status — "defined" если перечень допущенных водителей прямо оговорен,
           иначе "not_defined".
        4. allowed_drivers_list_details — круг/список допущенных водителей (или отсылка к приложению).
        5. transfer_prohibition_status — "defined" если запрет передачи управления третьим лицам прямо установлен,
           иначе "not_defined".
        6. transfer_prohibition_details — формулировка о запрете передачи управления.
        7. territorial_limits_status — "defined" если территория использования ТС прямо ограничена,
           иначе "not_defined".
        8. territorial_limits_details — формулировка о территориальных ограничениях (регион, область, город).
        9. cross_border_restriction_status — "defined" если запрет выезда за пределы РФ прямо указан,
           иначе "not_defined".
        10. cross_border_restriction_details — формулировка о запрете выезда за границу.
        11. sublease_prohibition_status — "defined" если субаренда прямо запрещена или ограничена,
            иначе "not_defined".
        12. sublease_prohibition_details — формулировка о запрете субаренды и иных целевых ограничениях (такси, буксировка, гонки).
        13. usage_restrictions_summary_display — читаемая краткая сводка для юриста в таблице DD Grid
            (требования к водителям, территория эксплуатации, выезд за рубеж, запрет передачи, субаренды и такси).

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - usage_restrictions_summary_display: "Ограничения эксплуатации ТС не установлены".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "driver_requirements_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требований к водителям."
          required: true
          display_in_grid: false
        - name: "driver_requirements_details"
          type: "string"
          presentation: "fact"
          label: "Требования к водителям"
          description: "Требования к возрасту, стажу вождения и категории водительского удостоверения."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "allowed_drivers_list_status"
