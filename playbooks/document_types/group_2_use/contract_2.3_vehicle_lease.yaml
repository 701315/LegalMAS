        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора о действиях при аварии/ДТП.
        2. Проверь наличие срока уведомления Арендодателя.
        3. Проверь наличие требования о вызове ГИБДД / европротоколе.
        4. Проверь наличие запрета ремонта без согласия.
        5. Сформируй сводку accident_summary_display.
        6. Если условия отсутствуют — верни "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "accident_procedure_status": "<defined / not_defined>",
          "accident_procedure_details": "<текст или 'Не установлено'>",
          "landlord_notification_status": "<defined / not_defined>",
          "landlord_notification_details": "<текст или 'Не установлено'>",
          "police_europrotocol_status": "<defined / not_defined>",
          "police_europrotocol_details": "<текст или 'Не установлено'>",
          "repair_consent_required_status": "<defined / not_defined>",
          "repair_consent_required_details": "<текст или 'Не установлено'>",
          "accident_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
