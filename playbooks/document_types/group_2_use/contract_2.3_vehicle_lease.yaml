          description: "Сводная информация о страховании (ОСАГО, КАСКО, плательщик, франшиза, выгодоприобретатель)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_accident_procedure_check
    name: "Порядок действий при ДТП и уведомление арендодателя"
    description: >
      Фактографическая проверка наличия регламента действий при ДТП:
      сроки и порядок уведомления арендодателя, вызов сотрудников ГИБДД
      или оформление европротокола, сбор и передача процессуальных документов,
      запрет признания вины и запрет самостоятельного ремонта ТС без согласия
      (ст. 615, 1079 ГК РФ, ФЗ № 40-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "действия при ДТП"
        - "дорожно-транспортное происшествие"
        - "уведомление арендодателя"
        - "уведомить арендодателя"
        - "европротокол"
        - "вызов ГИБДД"
        - "сотрудники полиции"
        - "ремонт без согласия"
        - "справка о ДТП"
        - "протокол"
        - "постановление"
        - "незамедлительно"
        - "не перемещать ТС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(?:в\\s+случае|при)\\s+ДТП"
        - "(?i)уведомить\\s+арендодател[а-я]*"
        - "(?i)европротокол"
        - "(?i)вызов[а-я]*\\s+(?:сотрудников\\s+)?(?:ГИБДД|полици[а-я]*|ГАИ)"
        - "(?i)ремонт[а-я]*.*без\\s+(?:письменного\\s+)?соглас[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок действий арендатора / водителя при ДТП
        (уведомление арендодателя, сроки, фиксация через ГИБДД/европротокол, запрет несогласованного ремонта).

        Нормативный ориентир:
        - ст. 615, 616 ГК РФ — пользование арендованным имуществом и поддержание в исправном состоянии
        - ст. 1079 ГК РФ — ответственность за вред, причиненный деятельностью, создающей повышенную опасность
        - ФЗ № 40-ФЗ «Об ОСАГО» — порядок фиксации страхового случая и европротокол

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли регламент действий Арендатора при наступлении ДТП / аварии.
        2. Установлена ли обязанность и срок уведомления Арендодателя (например: незамедлительно / в течение 2 часов / в течение суток).
        3. Предусмотрен ли вызов сотрудников ГИБДД / оформление европротокола и сбор документов (протоколы, постановления).
        4. Установлен ли запрет самостоятельного ремонта ТС / запрет признания вины без согласия Арендодателя.
        5. Сформируй сводное читаемое поле accident_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный регламент при ДТП с четкими сроками:
        Фрагмент:
        "6.1. При наступлении ДТП Арендатор обязан немедленно вызвать сотрудников ГИБДД,
        не перемещать ТС с места аварии и уведомить Арендодателя по телефону в течение 2 часов.
        6.2. В течение 24 часов Арендатор обязан передать Арендодателю копии протокола и постановления ГИБДД.
        6.3. Арендатору категорически запрещается признавать вину без согласования с Арендодателем
        и производить восстановительный ремонт без письменного согласия Арендодателя."

        Ответ:
        {
          "accident_procedure_status": "defined",
          "accident_procedure_details": "Вызов ГИБДД, запрет перемещения ТС, передача процессуальных документов в течение 24 часов",
