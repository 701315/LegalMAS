           третьими лицами прямо распределена, иначе "not_defined".
        2. third_party_liability_holder_code — "landlord" / "tenant" / "not_defined".
        3. third_party_liability_details — формулировка.
        4. hazardous_source_reference_status — "defined" если ИПО прямо упомянут.
        5. hazardous_source_reference_details — формулировка.
        6. crew_liability_status — "defined" если ответственность за экипаж прямо указана.
