    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_maintenance_and_seasonal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС распределение
        обязанностей по плановому ТО, сезонной замене шин и расходным материалам.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_maintenance_and_seasonal_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (maintenance_allocation_status, seasonal_tires_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - maintenance_allocation_status = "not_defined";
           - seasonal_tires_status = "not_defined";
           - все *_details = "Не установлено";
           - maintenance_summary_display = "ТО, расходники и сезонные шины не урегулированы (по закону)";
           - не выполняй остальные шаги.

        1. maintenance_allocation_status:
           - "defined" — если распределение ТО и расходников прямо указано;
           - "not_defined" — если не указано.

        2. maintenance_allocation_details:
           Кто осуществляет и оплачивает ТО и расходники (масло, фильтры,
           тормозные колодки).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. seasonal_tires_status:
           - "defined" — если сезонная замена шин прямо урегулирована;
           - "not_defined" — если не урегулирована.

        4. seasonal_tires_details:
           Кто обеспечивает замену и хранение сезонных шин.
           Если данных нет — "Не установлено".

        5. maintenance_summary_display:
            Сводка для DD Grid. Отрази: ТО (кто, за чей счёт), сезонные шины
            (замена, хранение). Строится на основе других полей — не добавляй
            данные, которых нет в них.
            Если presence = "missing" — "ТО, расходники и сезонные шины
            не урегулированы (по закону)".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_maintenance_and_seasonal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", maintenance_summary_display = "ТО, расходники и сезонные шины не урегулированы (по закону)".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - maintenance_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Общая фраза "Арендатор поддерживает ТС в исправном состоянии" без конкретных условий о ТО, расходниках и шинах — все *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ТО, ни сезонных шин, ни расходных материалов
           (только общая фраза о поддержании исправности).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             maintenance_summary_display = "ТО, расходники и сезонные шины не урегулированы (по закону)".

        2. Только ТО без сезонных шин.
           Распределение планового ТО и расходников указано, но сезонная
           замена шин не урегулирована.
           → presence = "present";
             maintenance_allocation_status = "defined";
             seasonal_tires_status = "not_defined";
             maintenance_summary_display отражает только ТО.

        3. Противоречие в распределении.
           В одном пункте "ТО за счёт Арендатора", в другом —
           "капитальное ТО за счёт Арендодателя" без разграничения.
           → presence = "unclear";
             maintenance_allocation_status = "not_defined";
             maintenance_allocation_details = "Не удалось определить".

        4. Разделение по модели аренды.
           Договор различает аренду с экипажем (ТО на Арендодателе)
           и без экипажа (ТО на Арендаторе).
           → presence = "present";
             maintenance_allocation_status = "defined";
             maintenance_allocation_details отражает разделение;
             seasonal_tires_status определяется отдельно.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_maintenance_and_seasonal_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * maintenance_summary_display → "ТО, расходники и сезонные шины не урегулированы (по закону)".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * maintenance_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_maintenance_and_seasonal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования ТО и сезонного обслуживания. Внутреннее агрегатное signal-поле."
          required: true

        - name: "maintenance_allocation_status"
