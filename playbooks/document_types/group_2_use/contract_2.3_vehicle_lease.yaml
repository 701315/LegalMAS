        описание ТС, срок и арендная плата.

        Нормативный ориентир:
        - ст. 632 ГК РФ — аренда с экипажем
        - ст. 642 ГК РФ — аренда без экипажа
        - ст. 607, 610, 614 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли вид аренды (с экипажем / без экипажа).
        2. Какой тип ТС указан.
        3. Как описано транспортное средство.
        4. Какой срок аренды.
        5. Какой размер арендной платы / фрахта.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Арендодатель предоставляет Арендатору во временное владение и пользование
        без экипажа легковой автомобиль Toyota Camry. Срок аренды — 6 месяцев.
        Арендная плата — 50 000 рублей в месяц."

        Ответ:
        {
          "lease_type_status": "defined",
          "lease_type_code": "without_crew",
          "lease_type_details": "без экипажа",
          "vehicle_type": "road_vehicle",
          "vehicle_description_status": "defined",
          "vehicle_description_value": "легковой автомобиль Toyota Camry",
          "lease_term_status": "defined",
          "lease_term_value": "6 месяцев",
          "rent_amount_status": "defined",
          "rent_amount_value": "50 000 рублей в месяц",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель предоставляет Арендатору во временное владение и пользование без экипажа легковой автомобиль Toyota Camry."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор аренды транспортного средства."

        Ответ:
        {
          "lease_type_status": "not_defined",
          "lease_type_code": "not_defined",
          "lease_type_details": "Данные не определены",
          "vehicle_type": "not_defined",
          "vehicle_description_status": "not_defined",
          "vehicle_description_value": "Данные не определены",
          "lease_term_status": "not_defined",
          "lease_term_value": "Данные не определены",
          "rent_amount_status": "not_defined",
          "rent_amount_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о виде аренды.
        2. Найди прямую цитату с описанием ТС.
        3. Найди прямую цитату о сроке.
        4. Найди прямую цитату о плате.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "lease_type_status": "<defined / not_defined>",
          "lease_type_code": "<with_crew / without_crew / not_defined>",
          "lease_type_details": "<текст или 'Данные не определены'>",
          "vehicle_type": "<road_vehicle / vessel / aircraft / other / not_defined>",
          "vehicle_description_status": "<defined / not_defined>",
          "vehicle_description_value": "<текст или 'Данные не определены'>",
          "lease_term_status": "<defined / not_defined>",
          "lease_term_value": "<текст или 'Данные не определены'>",
          "rent_amount_status": "<defined / not_defined>",
          "rent_amount_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
