      store_payload: true

  - id: vehicle_evacuation_and_impound_check
    name: "Эвакуация ТС на штрафстоянку и расходы"
    description: >
      Фактографическая проверка распределения расходов на эвакуацию ТС
      на штрафстоянку, хранение и возврат ТС после эвакуации (ст. 2.6.1 КоАП РФ,
      ст. 615, 616 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "эвакуация"
        - "штрафстоянка"
        - "задержание ТС"
        - "хранение на стоянке"
        - "расходы на эвакуацию"
        - "возврат со штрафстоянки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)эвакуац[а-я]*"
        - "(?i)штрафстоянк[а-я]*|штрафн[а-я]*\\s+стоянк"
        - "(?i)задержан[а-я]*\\s+ТС"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются условия на случай эвакуации ТС на штрафстоянку.

        Нормативный ориентир:
        - ст. 27.13 КоАП РФ — задержание транспортного средства.
        - ст. 615, 616 ГК РФ — обязанности арендатора по содержанию имущества.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Распределены ли расходы на эвакуацию ТС.
        2. Распределены ли расходы на хранение ТС на штрафстоянке.
        3. Установлена ли обязанность Арендатора по возврату ТС со штрафстоянки.
        4. Сформируй сводное поле evacuation_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — эвакуация урегулирована:
        Фрагмент:
        "4.8. Все расходы, связанные с эвакуацией ТС на штрафстоянку, хранением на штрафстоянке
        и возвратом ТС, несёт Арендатор. Арендатор обязан возвратить ТС со штрафстоянки
        в течение 24 часов с момента уведомления Арендодателем."

        Ответ:
        {
          "evacuation_cost_status": "defined",
          "evacuation_cost_details": "все расходы на эвакуацию и хранение на штрафстоянке несёт Арендатор",
          "impound_return_status": "defined",
          "impound_return_details": "Арендатор обязан возвратить ТС со штрафстоянки в течение 24 часов",
          "evacuation_summary_display": "Эвакуация и штрафстоянка: все расходы на Арендаторе; возврат ТС за 24 ч",
          "evidence": [
            {
              "clause_ref": "п. 4.8",
              "quote": "Все расходы, связанные с эвакуацией ТС на штрафстоянку, хранением на штрафстоянке и возвратом ТС, несёт Арендатор."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор соблюдает правила парковки."

        Ответ:
        {
          "evacuation_cost_status": "not_defined",
          "evacuation_cost_details": "Не установлено",
          "impound_return_status": "not_defined",
          "impound_return_details": "Не установлено",
          "evacuation_summary_display": "Расходы на эвакуацию и штрафстоянку не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об эвакуации или штрафстоянке.
        2. Проверь распределение расходов.
        3. Проверь обязанность возврата ТС.
        4. Сформируй сводку evacuation_summary_display.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "evacuation_cost_status": "<defined / not_defined>",
          "evacuation_cost_details": "<текст или 'Не установлено'>",
          "impound_return_status": "<defined / not_defined>",
          "impound_return_details": "<текст или 'Не установлено'>",
          "evacuation_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "эвакуация штрафстоянка задержание ТС хранение на стоянке расходы на эвакуацию возврат со штрафстоянки"
      preferred_unit_types:
        - obligation
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_evacuation_and_impound_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС условия
        на случай эвакуации на штрафстоянку: расходы, хранение и возврат ТС.
        Не анализируй базовую арендную плату, страхование, ДТП или штрафы ГИБДД.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_evacuation_and_impound_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (evacuation_cost_status, impound_return_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - evacuation_cost_status = "not_defined";
           - impound_return_status = "not_defined";
           - все *_details = "Не установлено";
           - evacuation_summary_display = "Расходы на эвакуацию и штрафстоянку не урегулированы";
           - не выполняй остальные шаги.

        1. evacuation_cost_status:
           - "defined" — если расходы на эвакуацию и хранение прямо распределены;
           - "not_defined" — если не распределены.

        2. evacuation_cost_details:
           Кто несёт расходы на эвакуацию и штрафстоянку (эвакуация, хранение,
           возврат).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. impound_return_status:
           - "defined" — если обязанность возврата ТС со штрафстоянки
             прямо установлена;
           - "not_defined" — если не установлена.

        4. impound_return_details:
           Сроки и порядок возврата ТС (например, "в течение 24 часов
           с момента уведомления").
           Если данных нет — "Не установлено".

        5. evacuation_summary_display:
            Сводка для DD Grid. Отрази: расходы (кто платит), возврат
            (сроки). Строится на основе других полей — не добавляй
            данные, которых нет в них.
            Если presence = "missing" — "Расходы на эвакуацию и штрафстоянку
            не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_evacuation_and_impound_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", evacuation_summary_display = "Расходы на эвакуацию и штрафстоянку не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - evacuation_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Общая фраза "Арендатор соблюдает правила парковки" без конкретных условий об эвакуации — все *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни эвакуации, ни штрафстоянки, ни расходов,
           ни возврата ТС (только общая фраза о соблюдении ПДД).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             evacuation_summary_display = "Расходы на эвакуацию и штрафстоянку не урегулированы".

        2. Только расходы без порядка возврата.
           Указано, что расходы на эвакуацию несёт Арендатор, но срок
           и порядок возврата ТС со штрафстоянки не описаны.
           → presence = "present";
             evacuation_cost_status = "defined";
             impound_return_status = "not_defined";
             evacuation_summary_display отражает только расходы.

        3. Противоречие в распределении расходов.
           В одном пункте "расходы на эвакуации несёт Арендатор",
           в другом — "расходы распределяются поровну".
           → presence = "unclear";
             evacuation_cost_status = "not_defined";
             evacuation_cost_details = "Не удалось определить".

        4. Эвакуация по вине Арендодателя.
           Договор разделяет эвакуацию по вине Арендатора (расходы
           на Арендаторе) и эвакуацию из-за неисправности ТС
           (расходы на Арендодателе).
           → presence = "present";
             evacuation_cost_status = "defined";
             evacuation_cost_details отражает разделение по вине;
             impound_return_status определяется отдельно.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_evacuation_and_impound_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * evacuation_summary_display → "Расходы на эвакуацию и штрафстоянку не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * evacuation_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_evacuation_and_impound_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования эвакуации и штрафстоянки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "evacuation_cost_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на эвакуацию."
          required: true
          display_in_grid: false
        - name: "evacuation_cost_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на эвакуацию"
          description: "Распределение расходов на эвакуацию и хранение ТС на штрафстоянке."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "impound_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус возврата ТС со штрафстоянки."
          required: true
          display_in_grid: false
        - name: "impound_return_details"
          label: "Порядок возврата со спецстоянки"
          type: "string"
          presentation: "fact"
          description: "Сроки и порядок возврата ТС со штрафстоянки (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "evacuation_summary_display"
          type: "string"
          presentation: "fact"
          label: "Эвакуация и штрафстоянка"
          description: "Сводка условий эвакуации ТС (расходы, хранение, возврат)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_maintenance_and_seasonal_check
    name: "ТО, сезонная замена шин и расходные материалы"
    description: >
      Фактографическая проверка распределения обязанностей по плановому
      техническому обслуживанию (ТО), сезонной замене шин, хранению резины
      и замене расходных материалов (масло, фильтры, тормозные колодки)
      (ст. 634, 644 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "техническое обслуживание"
        - "плановое ТО"
        - "сезонная замена шин"
        - "зимние шины"
        - "летние шины"
        - "хранение шин"
        - "расходные материалы"
        - "замена масла"
        - "тормозные колодки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ[а-я]*\\s+обслуживан"
        - "(?i)планов[а-я]*\\s+ТО"
        - "(?i)сезонн[а-я]*\\s+замен[а-я]*\\s+шин"
        - "(?i)зимн[а-я]*|летн[а-я]*\\s+шин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется распределение обязанностей по ТО, сезонной замене шин и расходным материалам.

        Нормативный ориентир:
        - ст. 634 ГК РФ — при аренде с экипажем ТО на Арендодателе.
        - ст. 644 ГК РФ — при аренде без экипажа ТО на Арендаторе (если иное не предусмотрено).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто осуществляет и оплачивает плановое ТО.
        2. Кто обеспечивает и оплачивает сезонную замену шин и хранение резины.
        3. Кто оплачивает расходные материалы (масло, фильтры, колодки).
        4. Сформируй сводное поле maintenance_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ТО и шины на Арендаторе:
        Фрагмент:
        "3.6. Арендатор за свой счёт обеспечивает прохождение планового ТО согласно регламенту
        производителя, сезонную замену шин (зимних/летних) и замену расходных материалов
        (масло, фильтры, тормозные колодки). Хранение сезонного комплекта шин — на Арендаторе."

        Ответ:
        {
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "плановое ТО и расходные материалы за счёт Арендатора",
          "seasonal_tires_status": "defined",
          "seasonal_tires_details": "сезонная замена шин и хранение за счёт Арендатора",
          "maintenance_summary_display": "ТО и расходники: за счёт Арендатора | Сезонные шины: замена и хранение на Арендаторе",
          "evidence": [
            {
              "clause_ref": "п. 3.6",
              "quote": "Арендатор за свой счёт обеспечивает прохождение планового ТО согласно регламенту производителя, сезонную замену шин (зимних/летних) и замену расходных материалов."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор поддерживает ТС в исправном состоянии."

        Ответ:
        {
          "maintenance_allocation_status": "not_defined",
          "maintenance_allocation_details": "Не установлено",
          "seasonal_tires_status": "not_defined",
          "seasonal_tires_details": "Не установлено",
          "maintenance_summary_display": "ТО, расходники и сезонные шины не урегулированы (по закону)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о плановом ТО или техобслуживании.
        2. Проверь наличие условий о сезонных шинах.
        3. Проверь распределение расходов на расходники.
        4. Сформируй сводку maintenance_summary_display.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "maintenance_allocation_status": "<defined / not_defined>",
          "maintenance_allocation_details": "<текст или 'Не установлено'>",
          "seasonal_tires_status": "<defined / not_defined>",
          "seasonal_tires_details": "<текст или 'Не установлено'>",
          "maintenance_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "repair_maintenance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "техническое обслуживание плановое ТО сезонная замена шин зимние шины летние шины хранение шин расходные материалы замена масла тормозные колодки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
