      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "vehicle_identified"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Достаточно ли индивидуализировано ТС"
        - name: "handover_act"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли акт передачи"
        - name: "document_pack"
          type: "string"
          allowed_values: ["complete", "partial", "not_found"]
