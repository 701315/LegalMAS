  - id: vehicle_maintenance_and_seasonal_check
    name: "ТО, сезонная замена шин и расходные материалы"
    description: >
      Фактографическая проверка распределения обязанностей по плановому
      техническому обслуживанию (ТО), сезонной замене шин, хранению резины
      и замене расходных материалов (масло, фильтры, тормозные колодки)
      (ст. 634, 644 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "техническое обслуживание"
        - "плановое ТО"
        - "сезонная замена шин"
        - "зимние шины"
        - "летние шины"
        - "хранение шин"
        - "расходные материалы"
        - "замена масла"
        - "тормозные колодки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ[а-я]*\\s+обслуживан"
        - "(?i)планов[а-я]*\\s+ТО"
        - "(?i)сезонн[а-я]*\\s+замен[а-я]*\\s+шин"
        - "(?i)зимн[а-я]*|летн[а-я]*\\s+шин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется распределение обязанностей по ТО, сезонной замене шин и расходным материалам.

        Нормативный ориентир:
        - ст. 634 ГК РФ — при аренде с экипажем ТО на Арендодателе.
        - ст. 644 ГК РФ — при аренде без экипажа ТО на Арендаторе (если иное не предусмотрено).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто осуществляет и оплачивает плановое ТО.
        2. Кто обеспечивает и оплачивает сезонную замену шин и хранение резины.
        3. Кто оплачивает расходные материалы (масло, фильтры, колодки).
        4. Сформируй сводное поле maintenance_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ТО и шины на Арендаторе:
        Фрагмент:
        "3.6. Арендатор за свой счёт обеспечивает прохождение планового ТО согласно регламенту
        производителя, сезонную замену шин (зимних/летних) и замену расходных материалов
        (масло, фильтры, тормозные колодки). Хранение сезонного комплекта шин — на Арендаторе."

        Ответ:
        {
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "плановое ТО и расходные материалы за счёт Арендатора",
          "seasonal_tires_status": "defined",
          "seasonal_tires_details": "сезонная замена шин и хранение за счёт Арендатора",
          "maintenance_summary_display": "ТО и расходники: за счёт Арендатора | Сезонные шины: замена и хранение на Арендаторе",
          "evidence": [
            {
              "clause_ref": "п. 3.6",
              "quote": "Арендатор за свой счёт обеспечивает прохождение планового ТО согласно регламенту производителя, сезонную замену шин (зимних/летних) и замену расходных материалов."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор поддерживает ТС в исправном состоянии."

        Ответ:
        {
          "maintenance_allocation_status": "not_defined",
          "maintenance_allocation_details": "Не установлено",
          "seasonal_tires_status": "not_defined",
          "seasonal_tires_details": "Не установлено",
          "maintenance_summary_display": "ТО, расходники и сезонные шины не урегулированы (по закону)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о плановом ТО или техобслуживании.
        2. Проверь наличие условий о сезонных шинах.
        3. Проверь распределение расходов на расходники.
        4. Сформируй сводку maintenance_summary_display.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "maintenance_allocation_status": "<defined / not_defined>",
          "maintenance_allocation_details": "<текст или 'Не установлено'>",
          "seasonal_tires_status": "<defined / not_defined>",
          "seasonal_tires_details": "<текст или 'Не установлено'>",
          "maintenance_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "repair_maintenance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "техническое обслуживание плановое ТО сезонная замена шин зимние шины летние шины хранение шин расходные материалы замена масла тормозные колодки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС распределение
        обязанностей по плановому ТО, сезонной замене шин и расходным материалам.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. maintenance_allocation_status — "defined" если распределение ТО и расходников прямо указано, иначе "not_defined".
        2. maintenance_allocation_details — кто осуществляет и оплачивает ТО и расходники.
        3. seasonal_tires_status — "defined" если сезонная замена шин прямо урегулирована, иначе "not_defined".
        4. seasonal_tires_details — кто обеспечивает замену и хранение сезонных шин.
        5. maintenance_summary_display — сводка для DD Grid.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - maintenance_summary_display: "ТО, расходники и сезонные шины не урегулированы (по закону)".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "maintenance_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения ТО."
          required: true
          display_in_grid: false
        - name: "maintenance_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Плановое ТО и расходники"
          description: "Распределение обязанностей по плановому ТО и расходным материалам."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "seasonal_tires_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сезонных шин."
          required: true
          display_in_grid: false
        - name: "seasonal_tires_details"
          type: "string"
          presentation: "fact"
          label: "Сезонные шины"
          description: "Сезонная замена шин и хранение резины."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "maintenance_summary_display"
          type: "string"
          presentation: "fact"
          label: "ТО и сезонное обслуживание"
          description: "Сводка обязанностей по ТО, расходникам и сезонным шинам."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_driver_medical_check
    name: "Медицинский осмотр водителей (предрейсовый / послерейсовый)"
    description: >
      Фактографическая проверка наличия обязанности по организации
      предрейсовых и послерейсовых медицинских осмотров водителей
      (для коммерческого транспорта, автобусов, такси, грузовых перевозок)
      и распределения ответственности за допуск водителя без медосмотра
      или в состоянии опьянения (ФЗ № 196-ФЗ, Приказ Минздрава № 835н).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "медицинский осмотр"
        - "предрейсовый"
        - "послерейсовый"
        - "медосмотр"
        - "допуск водителя"
        - "путевой лист"
        - "состояние опьянения"
        - "алкогольное опьянение"
        - "наркологический"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)медицинск[а-я]*\\s+осмотр"
        - "(?i)предрейсов[а-я]*|послерейсов[а-я]*"
        - "(?i)медосмотр"
        - "(?i)путев[а-я]*\\s+лист"
        - "(?i)опьянен[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется наличие обязанности по организации медицинских осмотров водителей
        (предрейсовых / послерейсовых) и ответственность за допуск водителя без осмотра.

        Нормативный ориентир:
        - ФЗ № 196-ФЗ «О безопасности дорожного движения» (ст. 20, 23) — обязательность
          предрейсовых и послерейсовых медосмотров для юрлиц и ИП, эксплуатирующих транспорт.
        - Приказ Минздрава России от 15.12.2014 № 835н — порядок проведения
          предрейсовых и послерейсовых медицинских осмотров.
        - ст. 12.32 КоАП РФ — штраф за допуск водителя без медосмотра (на юрлицо до 130 000 руб.).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли обязанность по предрейсовым и/или послерейсовым медосмотрам водителей.
        2. На какой стороне лежит обязанность организации и оплаты медосмотров (Арендодатель / Арендатор).
        3. Распределена ли ответственность за допуск водителя без медосмотра или в состоянии
           алкогольного/наркотического опьянения.
        4. Сформируй сводное поле medical_check_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — медосмотр урегулирован (коммерческие грузоперевозки):
        Фрагмент:
        "4.5. Арендатор обязан обеспечить прохождение всеми водителями предрейсовых
        и послерейсовых медицинских осмотров в соответствии с требованиями ФЗ № 196-ФЗ
        и Приказа Минздрава № 835н. Расходы на организацию медосмотров несёт Арендатор.
        4.6. Категорически запрещается допуск к управлению ТС водителя, не прошедшего
        предрейсовый медосмотр или находящегося в состоянии алкогольного или наркотического
        опьянения. Вся ответственность за нарушение данного требования, включая штрафы
        по ст. 12.32 КоАП РФ, возлагается на Арендатора."

        Ответ:
        {
          "medical_check_obligation_status": "defined",
          "medical_check_obligation_details": "Арендатор обеспечивает предрейсовые и послерейсовые медосмотры по ФЗ № 196-ФЗ и Приказу № 835н за свой счёт",
          "medical_check_responsibility_status": "defined",
          "medical_check_responsibility_details": "запрет допуска без медосмотра или в состоянии опьянения; штрафы по ст. 12.32 КоАП на Арендаторе",
          "medical_check_summary_display": "Медосмотры (предрейс/послерейс): на Арендаторе | Допуск без осмотра или в опьянении запрещён (штрафы на Арендаторе)",
          "evidence": [
            {
              "clause_ref": "п. 4.5–4.6",
              "quote": "Арендатор обязан обеспечить прохождение всеми водителями предрейсовых и послерейсовых медицинских осмотров в соответствии с требованиями ФЗ № 196-ФЗ. Категорически запрещается допуск к управлению ТС водителя, не прошедшего предрейсовый медосмотр или находящегося в состоянии алкогольного или наркотического опьянения."
            }
          ]
        }

        Пример 2 — только общий запрет без деталей:
        Фрагмент:
        "3.2. Арендатор не вправе допускать к управлению ТС лиц в состоянии опьянения."

        Ответ:
        {
          "medical_check_obligation_status": "not_defined",
          "medical_check_obligation_details": "Не установлено",
          "medical_check_responsibility_status": "defined",
          "medical_check_responsibility_details": "запрет допуска к управлению в состоянии опьянения",
          "medical_check_summary_display": "Запрет управления в опьянении | Организация медосмотров не урегулирована",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Арендатор не вправе допускать к управлению ТС лиц в состоянии опьянения."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует ТС для грузоперевозок по территории РФ."

        Ответ:
        {
          "medical_check_obligation_status": "not_defined",
          "medical_check_obligation_details": "Не установлено",
          "medical_check_responsibility_status": "not_defined",
          "medical_check_responsibility_details": "Не установлено",
          "medical_check_summary_display": "Медицинские осмотры водителей не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о медосмотрах, предрейсовых/послерейсовых осмотрах или путевых листах.
        2. Проверь, на какой стороне лежит обязанность организации.
        3. Проверь наличие запрета допуска без осмотра / в опьянении и распределение штрафов.
        4. Сформируй сводку medical_check_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "medical_check_obligation_status": "<defined / not_defined>",
          "medical_check_obligation_details": "<текст или 'Не установлено'>",
          "medical_check_responsibility_status": "<defined / not_defined>",
          "medical_check_responsibility_details": "<текст или 'Не установлено'>",
          "medical_check_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "медицинский осмотр предрейсовый послерейсовый медосмотр допуск водителя путевой лист состояние опьянения алкогольное опьянение наркологический"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС условия
        по медицинским осмотрам водителей: предрейсовые/послерейсовые осмотры,
        обязанность организации и ответственность за допуск без осмотра или в опьянении.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. medical_check_obligation_status — "defined" если обязанность по медосмотрам
           (предрейсовым/послерейсовым) прямо установлена, иначе "not_defined".
        2. medical_check_obligation_details — кто организует и оплачивает медосмотры,
           ссылка на ФЗ № 196-ФЗ / Приказ № 835н (если есть).
        3. medical_check_responsibility_status — "defined" если ответственность за допуск
           водителя без медосмотра или в состоянии опьянения прямо распределена, иначе "not_defined".
        4. medical_check_responsibility_details — формулировка о запрете допуска и распределении
           штрафов / ответственности.
        5. medical_check_summary_display — читаемая краткая сводка для юриста в таблице DD Grid.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - medical_check_summary_display: "Медицинские осмотры водителей не урегулированы".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "medical_check_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности по медосмотрам."
          required: true
          display_in_grid: false
        - name: "medical_check_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Медосмотры водителей"
          description: "Обязанность по организации предрейсовых/послерейсовых медосмотров (кто, за чей счёт)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "medical_check_responsibility_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за допуск без осмотра."
          required: true
          display_in_grid: false
        - name: "medical_check_responsibility_details"
          type: "string"
          presentation: "fact"
          label: "Допуск без осмотра / опьянение"
          description: "Запрет допуска водителя без медосмотра или в состоянии опьянения и распределение штрафов."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "medical_check_summary_display"
          type: "string"
          presentation: "fact"
          label: "Медосмотры и допуск водителей"
          description: "Сводка условий по медосмотрам водителей и ответственности за допуск без осмотра."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты арендодателя и арендатора,
      а также, если применимо, статус фрахтовщика/фрахтователя и состав экипажа.
    addressee: "Обе стороны"

  vehicle_lease_type_extraction:
    text: >
      Просим предоставить по {doc_names}: вид аренды (с экипажем / без),
      описание ТС, VIN/регистрационные данные, срок аренды и базовую модель эксплуатации.
    addressee: "Арендодатель"

  vehicle_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, VIN, госномер,
      ПТС/СТС, год выпуска, пробег и иные идентификаторы ТС.
    addressee: "Арендодатель"

  crew_status_declaration:
    text: >
      Просим однозначно зафиксировать в {doc_names}, что аренда осуществляется
      либо с экипажем, либо без экипажа, и исключить смешанные/противоречивые формулировки.
    addressee: "Юридический советник"

  vehicle_identification_and_condition_check:
    text: >
      Просим предоставить по {doc_names}: акт приема-передачи, пробег,
      фотофиксацию состояния, перечень документов на ТС, сведения о существующих повреждениях.
    addressee: "Арендодатель"

  detailed_handover_protocol:
    text: >
      Просим согласовать по {doc_names}: детализированный акт приема-передачи ТС
      с фиксацией пробега, состояния кузова/салона, комплектности, топлива и документации.
    addressee: "Обе стороны"

  liability_allocation_by_crew_type_check:
    text: >
      Просим уточнить в {doc_names}: кто несет ответственность перед третьими лицами,
      кто является владельцем источника повышенной опасности и кто отвечает за ремонт/эксплуатацию
      в зависимости от модели с экипажем / без экипажа.
    addressee: "Юридический советник"

  insurance_and_accident_procedure_check:
    text: >
      Просим предоставить по {doc_names}: страховой пакет (ОСАГО/КАСКО),
      порядок действий при ДТП, перечень нестраховых случаев, сроки уведомления
      и порядок ремонта после происшествия.
    addressee: "Арендодатель / Страховой консультант"

  insurance_requirements:
    text: >
      Просим уточнить в {doc_names}: кто оформляет ОСАГО/КАСКО, кто выгодоприобретатель,
      какова страховая сумма, франшиза и порядок продления полиса.
    addressee: "Страховой консультант / Юридический советник"

  accident_procedure_clear:
    text: >
      Просим уточнить в {doc_names}: действия при ДТП, порядок уведомления,
      вызов ГИБДД/оформление европротокола и запрет ремонта без согласия.
    addressee: "Юридический советник"

  fines_and_regress_check:
    text: >
      Просим уточнить в {doc_names}: как компенсируются штрафы с камер,
      кто платит административные штрафы, как работает регресс и в какие сроки
      арендатор обязан возместить суммы.
    addressee: "Юридический советник"

  traffic_fines_reimbursement:
    text: >
      Просим включить/уточнить в {doc_names}: безусловную компенсацию арендатором
      штрафов и иных административных взысканий, полученных собственником в период аренды.
    addressee: "Юридический советник арендодателя"

  usage_restrictions_and_driver_control_check:
    text: >
      Просим уточнить в {doc_names}: допущенных водителей, требования к стажу и категориям прав,
      запрет передачи управления и территориальные ограничения эксплуатации ТС.
    addressee: "Юридический советник"

  usage_territory_limits:
    text: >
      Просим уточнить в {doc_names}: допустимую территорию использования ТС,
      порядок выезда в другие регионы/за границу и последствия нарушения этих ограничений.
    addressee: "Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита/обеспечительного платежа,
      основания удержания, сроки возврата и порядок подтверждения повреждений/убытков.
    addressee: "Юридический советник"

  vehicle_fitness_warranty:
    text: >
      Просим предоставить по {doc_names}: заверения арендодателя о технической исправности,
      прохождении техосмотра, отсутствии арестов/залога/ограничений и иных дефектов титула.
    addressee: "Арендодатель"

  maintenance_duty_tenant:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: что именно относится
      к текущему и капитальному ремонту, а также какие расходы несет арендатор.
    addressee: "Юридический советник"

  liability_for_third_party_damage_tenant:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: что арендатор несет
      ответственность перед третьими лицами как владелец источника повышенной опасности.
    addressee: "Юридический советник"

  liability_for_accidents_lessor:
    text: >
      Для аренды с экипажем просим уточнить в {doc_names}: что ответственность
      за действия экипажа и вред третьим лицам несет арендодатель.
    addressee: "Юридический советник"

  crew_qualification_guarantee:
    text: >
      Для аренды с экипажем просим предоставить по {doc_names}: документы
      о квалификации экипажа/водителей, наличии необходимых прав и их статусе
      в отношениях с арендодателем.
    addressee: "Арендодатель"

  driver_verification_protection:
    text: >
      Для аренды без экипажа просим уточнить в {doc_names}: требования к водителям,
      перечень допущенных лиц, стаж, возрастные ограничения и последствия передачи управления
      неуполномоченному лицу.
    addressee: "Юридический советник"

  sublease_and_transfer_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли субаренда, передача ТС
      или управления третьим лицам, и если да — на каких условиях.
    addressee: "Юридический советник"

  rent_payment_terms:
    text: >
      Просим уточнить в {doc_names}: размер арендной платы/фрахта,
      периодичность платежей, порядок оплаты, валюту и последствия просрочки.
    addressee: "Обе стороны"

  term_of_lease:
    text: >
      Просим уточнить в {doc_names}: срок аренды, даты начала и окончания,
      а также порядок продления/досрочного прекращения.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и механизм разрешения споров.
    addressee: "Юридический советник"

  consumer_short_term_reclassification_to_rental:
    text: >
      Внимание: {doc_names} содержит признаки краткосрочной consumer-модели.
      Просим проверить, не следует ли квалифицировать документ как прокат/consumer rental.
    addressee: "Юридический советник"

  purchase_option_reclassification_to_leasing:
    text: >
      Внимание: {doc_names} содержит признаки выкупной модели.
      Просим проверить, не должен ли документ квалифицироваться как лизинг,
      а не как обычная аренда ТС.
    addressee: "Юридический советник"

  mandatory_vehicle_insurance_context:
    text: >
      Внимание: по {doc_names} необходимо подтвердить наличие надлежащего
      страхового и регистрационного контура (ОСАГО/КАСКО, ПТС/СТС, учет в ГИБДД).
    addressee: "Арендодатель / Страховой консультант"

  vehicle_return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок возврата ТС по окончании аренды —
      допустимое состояние (нормальный износ vs повреждения), порядок фиксации
      состояния (акт, фото, независимый оценщик), уровень топлива при возврате,
      контроль пробега, место и сроки возврата, штрафы за просрочку/невозврат.
    addressee: "Обе стороны / Юридический советник"

  vehicle_return_conditions:
    text: >
      В {doc_names} не урегулированы или нечётко описаны условия возврата ТС.
      Просим включить: стандарт допустимого состояния, акт возврата с фиксацией
      пробега/топлива/повреждений, место возврата, сроки, санкции за невозврат.
    addressee: "Юридический советник"

  fuel_mileage_and_operating_costs_check:
    text: >
      Просим уточнить в {doc_names}: кто оплачивает ГСМ, есть ли топливная карта,
      установлен ли лимит пробега/моточасов, какова плата за превышение,
      кто несёт расходы на расходные материалы (шины, масла и т.п.).
    addressee: "Обе стороны"

  mileage_limit_and_excess:
    text: >
      Просим уточнить в {doc_names}: лимит пробега/моточасов,
      ставку за сверхнормативный пробег, порядок контроля и расчёта.
    addressee: "Юридический советник"

  termination_and_early_exit:
    text: >
      Просим уточнить в {doc_names}: основания досрочного расторжения
      для каждой стороны, сроки уведомления, последствия (возврат ТС,
      перерасчёт платы, неустойка, возврат депозита), порядок возврата ТС
      при досрочном прекращении.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для обязательств сторон,
      распределение расходов на хранение ТС в период форс-мажора.
    addressee: "Юридический советник"

  vessel_aircraft_special_regime:
    text: >
      Внимание: {doc_names} предусматривает аренду судна/воздушного судна.
      Просим подтвердить соблюдение специального режима: регистрация в реестре
      (РМРС/РИВС/государственный реестр ВС), свидетельства годности,
      лицензии, специальное страхование (P&I / hull / авиационное),
      квалификация экипажа и применимые транспортные кодексы (КТМ/КВВТ/ВзК).
    addressee: "Юридический советник / Транспортный консультант"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
