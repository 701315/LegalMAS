    retrieval:
      retrieval_profile: "subletting_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "водительское удостоверение категория стаж вождения возраст допущенные водители список водителей запрет передачи управления территория эксплуатации регион использования выезд за пределы РФ субаренда такси буксировка без права передачи"
