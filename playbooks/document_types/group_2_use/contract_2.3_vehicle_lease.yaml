          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ИПО."
          required: true
          display_in_grid: false
        - name: "hazardous_source_reference_details"
          label: "Упоминание источника повышенной опасности"
          type: "string"
