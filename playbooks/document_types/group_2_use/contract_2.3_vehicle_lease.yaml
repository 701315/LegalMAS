  - id: vehicle_return_and_termination_check
    name: "Возврат ТС, досрочное расторжение и штрафы за невозврат"
    description: >
      Фактографическая проверка порядка возврата ТС по окончании аренды: оформление
      акта возврата, место возврата, требования к состоянию ТС (нормальный износ,
      чистота/мойка), уровень топлива в баке, штрафные санкции за просрочку возврата.
      Условия досрочного расторжения договора извлекаются в фоновом режиме (поля скрыты в DD Grid,
      так как полностью покрываются глобальными проверками termination_grounds и term_and_renewal).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат ТС"
        - "возврат транспортного средства"
        - "акт возврата"
        - "акт приема-передачи возврата"
        - "нормальный износ"
        - "естественный износ"
        - "чистом виде"
        - "чистым"
        - "после мойки"
        - "уровень топлива"
        - "полный бак"
        - "место возврата"
        - "адрес возврата"
        - "стоянка арендодателя"
        - "штраф за невозврат"
        - "просрочка возврата"
        - "двукратный размер"
        - "досрочное расторжение"
        - "отказ от договора"
        - "уведомление о расторжении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить|щении)\\s+(?:ТС|транспортн[а-я]*|автомобил[а-я]*)"
        - "(?i)(?:нормальн|естественн)[а-я]*\\s+износ"
        - "(?i)чист[а-я]*\\s+(?:виде|состоянии)|мыть|мойк[а-я]*"
        - "(?i)просрочк[а-я]*\\s+возврат[а-я]*|штраф[а-я]*\\s+за\\s+несвоевремен[а-я]*"
        - "(?i)досрочн[а-я]*\\s+расторж[а-я]*"
        - "(?i)отказ[а-я]*\\s+от\\s+(?:исполнения\\s+)?договор[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется порядок завершения аренды и возврата ТС Арендодателю (оформление акта,
        место возврата, состояние ТС, чистота, уровень топлива, штрафы за просрочку),
        а также условия досрочного расторжения договора.

        Нормативный ориентир:
        - ст. 622 ГК РФ — при прекращении договора аренды арендатор обязан вернуть арендодателю
          имущество в том состоянии, в котором он его получил, с учетом нормального износа
          или в состоянии, обусловленном договором. Если арендатор не возвратил имущество,
          арендодатель вправе потребовать внесения арендной платы за все время просрочки
          и возмещения убытков / уплаты штрафа.
        - ст. 316 ГК РФ — место исполнения обязательства по возврату движимого имущества.
        - ст. 619, 620 ГК РФ — досрочное расторжение договора по требованию сторон.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок возврата ТС (оформление двустороннего акта возврата, место/адрес возврата).
        2. Допустимое состояние ТС при возврате (нормальный износ, требования к чистоте, отсутствие повреждений).
        3. Требования к уровню топлива в баке при возврате ТС.
        4. Размер и порядок начисления штрафа / пени за просрочку возврата ТС (например: фиксированный штраф, посуточная плата, двукратный размер аренды).
        5. Основания досрочного расторжения договора по инициативе Арендодателя или Арендатора.
        6. Срок письменного уведомления другой стороны о намерении досрочно расторгнуть договор.
        7. Сформируй сводное читаемое поле return_summary_display для DD Grid, содержащее ключевые условия возврата ТС.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальный регламент возврата ТС:
        Фрагмент:
        "8.1. По окончании срока аренды Арендатор обязан вернуть ТС Арендодателю по адресу: г. Москва, ул. Ленина, д. 10,
        в чистом виде (после прохождения мойки за счет Арендатора) и с тем же уровнем топлива в баке, с которым ТС
        было получено (согласно Акту приема-передачи). Передача ТС оформляется двусторонним Актом возврата ТС.
        8.2. ТС должно быть возвращено в исправном техническом состоянии с учетом нормального естественного износа.
        8.3. За задержку возврата ТС Арендатор уплачивает Арендодателю неустойку в размере 5 000 рублей за каждый день просрочки.
        10.2. Договор может быть расторгнут досрочно по соглашению сторон либо в одностороннем порядке с письменным
        уведомлением другой стороны не менее чем за 30 календарных дней до даты расторжения."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "возвращается по двустороннему Акту возврата ТС по адресу: г. Москва, ул. Ленина, д. 10",
          "return_condition_status": "defined",
          "return_condition_details": "в исправном техническом состоянии с учетом нормального естественного износа, в чистом виде (после мойки за счет Арендатора)",
          "fuel_level_status": "defined",
          "fuel_level_details": "с тем же уровнем топлива в баке, с которым ТС было получено",
          "late_return_penalty_status": "defined",
          "late_return_penalty_details": "неустойка в размере 5 000 рублей за каждый день просрочки возврата",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "досрочно по соглашению сторон либо в одностороннем внесудебном порядке",
          "termination_notice_status": "defined",
          "termination_notice_details": "письменное уведомление не менее чем за 30 календарных дней",
          "return_summary_display": "По акту на склад Арендодателя (г. Москва); ТС чистое, бак как при получении, износ нормальный; штраф 5000 руб./сутки",
          "evidence": [
            {
              "clause_ref": "п. 8.1–8.3, 10.2",
              "quote": "По окончании срока аренды Арендатор обязан вернуть ТС Арендодателю по адресу: г. Москва, ул. Ленина, д. 10, в чистом виде (после прохождения мойки за счет Арендатора) и с тем же уровнем топлива в баке, с которым ТС было получено... Передача ТС оформляется двусторонним Актом возврата ТС. ТС должно быть возвращено в исправном техническом состоянии с учетом нормального естественного износа. За задержку возврата ТС Арендатор уплачивает Арендодателю неустойку в размере 5 000 рублей за каждый день просрочки."
            }
          ]
        }

        Пример 2 — только факт возврата без спецификации деталей:
        Фрагмент:
        "4.5. Арендатор обязуется своевременно вернуть автомобиль по окончании срока аренды в исправном состоянии.
        11.1. Досрочное расторжение договора допускается по основаниям, предусмотренным ГК РФ."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "своевременно вернуть автомобиль по окончании срока аренды",
          "return_condition_status": "defined",
          "return_condition_details": "в исправном состоянии",
          "fuel_level_status": "not_defined",
          "fuel_level_details": "Не установлено",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Не установлено",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "по основаниям, предусмотренным ГК РФ",
          "termination_notice_status": "not_defined",
          "termination_notice_details": "Не установлено",
          "return_summary_display": "Возврат ТС в исправном состоянии | Место возврата, чистота, топливо и штрафы не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Арендатор обязуется своевременно вернуть автомобиль по окончании срока аренды в исправном состоянии."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор аренды автомобиля вступает в силу с момента подписания."

        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Не установлено",
          "return_condition_status": "not_defined",
          "return_condition_details": "Не установлено",
          "fuel_level_status": "not_defined",
          "fuel_level_details": "Не установлено",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Не установлено",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Не установлено",
          "termination_notice_status": "not_defined",
          "termination_notice_details": "Не установлено",
          "return_summary_display": "Порядок возврата ТС не урегулирован",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора об оформлении акта возврата и месте возврата.
        2. Проверь наличие требований к износу, мойке/чистоте ТС.
        3. Найди упоминания уровня топлива при сдаче ТС.
        4. Проверь наличие штрафов/неустоек за несвоевременный возврат ТС.
        5. Проверь наличие условий о досрочном расторжении договора и сроке извещения.
        6. Сформируй сводное поле return_summary_display на основе извлеченных фактов о возврате ТС.
        7. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Не установлено'>",
          "return_condition_status": "<defined / not_defined>",
          "return_condition_details": "<текст или 'Не установлено'>",
          "fuel_level_status": "<defined / not_defined>",
          "fuel_level_details": "<текст или 'Не установлено'>",
          "late_return_penalty_status": "<defined / not_defined>",
          "late_return_penalty_details": "<текст или 'Не установлено'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Не установлено'>",
          "termination_notice_status": "<defined / not_defined>",
          "termination_notice_details": "<текст или 'Не установлено'>",
          "return_summary_display": "<сводка для таблицы DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат ТС возврат транспортного средства акт возврата нормальный износ чистом виде чистым после мойки уровень топлива полный бак место возврата адрес возврата штраф за невозврат просрочка возврата досрочное расторжение отказ от договора уведомление о расторжении"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "ДТП"
        - "ремонт и содержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_return_and_termination_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства порядок возврата ТС, требования к состоянию и чистоте, уровень топлива,
        штрафы за просрочку возврата, а также основания и сроки досрочного расторжения договора.
        Не анализируй размер текущей арендной платы, страхование КАСКО/ОСАГО, ДТП или ремонт ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_return_and_termination_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (return_procedure_status, return_condition_status,
              fuel_level_status, late_return_penalty_status,
              termination_grounds_status, termination_notice_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - return_procedure_status = "not_defined";
           - return_condition_status = "not_defined";
           - fuel_level_status = "not_defined";
           - late_return_penalty_status = "not_defined";
           - termination_grounds_status = "not_defined";
           - termination_notice_status = "not_defined";
           - все *_details = "Не установлено";
           - return_summary_display = "Порядок возврата ТС не урегулирован";
           - не выполняй остальные шаги.

        1. return_procedure_status:
           - "defined" — если порядок возврата ТС прямо предусмотрен
             (акт возврата, место/адрес);
           - "not_defined" — если не предусмотрен.

        2. return_procedure_details:
           Формулировка о порядке и месте (адресе) возврата ТС.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. return_condition_status:
           - "defined" — если состояние ТС при возврате (износ, чистота) прямо описано;
           - "not_defined" — если не описано.

        4. return_condition_details:
           Формулировка о допустимом состоянии ТС при возврате (нормальный износ,
           чистота/мойка).
           Если данных нет — "Не установлено".

        5. fuel_level_status:
           - "defined" — если требования к уровню топлива при возврате прямо установлены;
           - "not_defined" — если не установлены.

        6. fuel_level_details:
           Формулировка о количестве топлива при возврате ТС.
           Если данных нет — "Не установлено".

        7. late_return_penalty_status:
           - "defined" — если неустойка/штраф за просрочку возврата прямо предусмотрены;
           - "not_defined" — если не предусмотрены.

        8. late_return_penalty_details:
           Размер и порядок начисления штрафа за несвоевременный возврат ТС.
           Если данных нет — "Не установлено".

        9. termination_grounds_status:
           - "defined" — если основания досрочного расторжения указаны;
           - "not_defined" — если не указаны.

        10. termination_grounds_details:
            Формулировка об основаниях расторжения договора.
            Если данных нет — "Не установлено".

        11. termination_notice_status:
            - "defined" — если срок письменного уведомления о расторжении прямо указан;
            - "not_defined" — если не указан.

        12. termination_notice_details:
            Срок и порядок предупреждения о расторжении договора.
            Если данных нет — "Не установлено".

        13. return_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: как возвращается ТС, место, требования к баку/чистоте,
            штраф за задержку. Строится на основе других полей — не добавляй
            данные, которых нет в них.
            Если presence = "missing" — "Порядок возврата ТС не урегулирован".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_return_and_termination_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", return_summary_display = "Порядок возврата ТС не урегулирован".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - return_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указано только "Арендатор обязан вернуть ТС по окончании срока" без конкретизации места, состояния, топлива и штрафов — return_procedure_status = "defined" (общая формулировка), остальные *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия возврата — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка возврата, ни требований к состоянию,
           ни штрафов, ни условий расторжения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             return_summary_display = "Порядок возврата ТС не урегулирован".

        2. Только обязательство вернуть без деталей.
           "Арендатор обязуется своевременно вернуть ТС в исправном состоянии"
           без конкретизации места, чистоты, топлива и штрафов.
           → presence = "present";
             return_procedure_status = "defined";
             return_condition_status = "defined";
             fuel_level_status = "not_defined";
             late_return_penalty_status = "not_defined";
             return_summary_display отражает только общие условия.

        3. Противоречие в условиях возврата.
           В одном пункте "возврат с полным баком", в другом —
           "уровень топлива не имеет значения".
           → presence = "unclear";
             fuel_level_status = "not_defined";
             fuel_level_details = "Не удалось определить".

        4. Досрочное расторжение по ГК без конкретизации.
           "Досрочное расторжение допускается по основаниям, предусмотренным ГК РФ"
           без конкретных сроков и процедур.
           → presence = "present";
             termination_grounds_status = "defined";
             termination_grounds_details = "по основаниям, предусмотренным ГК РФ";
             termination_notice_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_return_and_termination_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * return_summary_display → "Порядок возврата ТС не урегулирован".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * return_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_return_and_termination_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования возврата ТС и расторжения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата ТС."
          required: true
          display_in_grid: false
        - name: "return_procedure_details"
          label: "Порядок возврата имущества"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке и месте возврата ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "return_condition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус допустимого состояния при возврате."
          required: true
          display_in_grid: false
        - name: "return_condition_details"
          type: "string"
          presentation: "fact"
          label: "Состояние и топливо при возврате"
          description: "Требования к техническому состоянию, чистоте (мойке) ТС и уровню топлива при возврате."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "fuel_level_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об уровне топлива."
          required: true
          display_in_grid: false
        - name: "fuel_level_details"
          label: "Фиксация уровня топлива"
          type: "string"
          presentation: "fact"
          description: "Формулировка об уровне топлива при возврате ТС (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "late_return_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафа за просрочку возврата."
          required: true
          display_in_grid: false
        - name: "late_return_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штраф за просрочку возврата"
          description: "Неустойка, пени или штрафные санкции за несвоевременный возврат транспортного средства."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований досрочного расторжения."
          required: true
          display_in_grid: false
        - name: "termination_grounds_details"
          label: "Основания расторжения"
          type: "string"
          presentation: "fact"
          description: "Основания досрочного расторжения договора (внутреннее поле, дублирует global layer)."
          required: false
          display_in_grid: false
        - name: "termination_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока уведомления о расторжении."
          required: true
          display_in_grid: false
        - name: "termination_notice_details"
          label: "Срок уведомления о расторжении"
          type: "string"
          presentation: "fact"
          description: "Срок предупреждения о расторжении (внутреннее поле, дублирует global layer)."
          required: false
          display_in_grid: false
        - name: "return_summary_display"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата ТС"
          description: "Сводная информация о процедуре возврата автомобиля (акт, место, топливо, чистота ТС, штрафы за просрочку)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_fines_and_regress_check
    name: "Штрафы ГИБДД, административные взыскания и регресс к арендатору"
    description: >
      Фактографическая проверка наличия механизма компенсации Арендатором
      административных штрафов, зафиксированных камерами автоматической фиксации
      (штрафы ГИБДД, неоплата парковки МАДИ/АМПП, система «Платон»,
      весогабаритный контроль), сроков возмещения, права удержания сумм из депозита
      (обеспечительного платежа) и регрессных требований (ст. 2.6.1 КоАП РФ, ст. 1081 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штрафы ГИБДД"
        - "административные штрафы"
        - "письма счастья"
        - "штрафы с камер"
        - "видеофиксация"
        - "фотовидеофиксация"
        - "компенсация штрафов"
        - "возместить штраф"
        - "срок возмещения"
        - "Платон"
        - "весогабаритный контроль"
        - "МАДИ"
        - "АМПП"
        - "платная парковка"
        - "газон"
        - "депозит"
        - "обеспечительный платеж"
        - "удержание из депозита"
        - "регресс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф[а-я]*\\s+(?:ГИБДД|полици[а-я]*|ГАИ|МАДИ|АМПП|Платон)"
        - "(?i)(?:возместит|компенсироват)[а-я]*.*штраф"
        - "(?i)фотовидеофиксац|камер[а-я]*\\s+фиксац"
        - "(?i)удержан[а-я]*.*(?:депозит|обеспечительн)"
        - "(?i)регрессн[а-я]*\\s+требован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется механизм компенсации Арендатором административных штрафов
        (штрафы ГИБДД с камер фотовидеофиксации, парковка МАДИ/АМПП, Платон, весогабаритный контроль),
        порядок и сроки извещения, право удержания штрафов из обеспечительного платежа/депозита и регресс.

        Нормативный ориентир:
        - ст. 2.6.1 КоАП РФ — к административной ответственности за правонарушения в области дорожного движения,
          зафиксированные камерами, привлекаются собственники (владельцы) транспортных средств.
        - ст. 32.2 КоАП РФ — сроки уплаты штрафов (включая льготный период 20 дней со скидкой 50%).
        - ст. 1081 ГК РФ — право обратного требования (регресса) лица, возместившего вред.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли обязанность Арендатора компенсировать/оплачивать штрафы за нарушения ПДД,
           правил парковки, системы «Платон», весогабаритного контроля и иные административные санкции.
        2. Предусмотрен ли порядок и срок уведомления Арендатора о поступивших штрафах.
        3. Установлен ли конкретный срок возмещения/компенсации сумм штрафов Арендатором.
        4. Предусмотрен ли регрессный механизм или обязанность возместить судебные/представительские расходы на обжалование.
        5. Предусмотрено ли право Арендодателя удержать сумму штрафов из депозита (обеспечительного платежа).
        6. Сформируй сводное читаемое поле fines_summary_display для таблицы DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный механизм с удержанием из депозита:
        Фрагмент:
        "7.4. Арендатор обязуется в полном объеме компенсировать Арендодателю любые административные штрафы
        (включая штрафы ГИБДД, МАДИ, АМПП, системы «Платон» и за нарушение правил весогабаритного контроля),
        зафиксированные в период владения и пользования ТС Арендатором.
        7.5. Арендодатель направляет Арендатору копию постановления по электронной почте в течение 3 рабочих дней.
        Арендатор обязан возместить сумму штрафа в течение 5 календарных дней с момента получения уведомления.
        7.6. В случае неоплаты штрафа в установленный срок Арендодатель вправе в безакцептном порядке удержать
        соответствующую сумму из внесенного Арендатором обеспечительного платежа (депозита)."

        Ответ:
        {
          "fines_reimbursement_status": "defined",
          "fines_reimbursement_details": "Арендатор в полном объеме компенсирует любые административные штрафы (ГИБДД, МАДИ, АМПП, Платон, весогабаритный контроль)",
          "notification_procedure_status": "defined",
          "notification_procedure_details": "Копия постановления по электронной почте в течение 3 рабочих дней",
          "reimbursement_deadline_status": "defined",
          "reimbursement_deadline_details": "в течение 5 календарных дней с момента получения уведомления",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Не установлено",
          "deposit_retention_for_fines_status": "defined",
          "deposit_retention_for_fines_details": "Безакцептное удержание суммы штрафа из обеспечительного платежа (депозита)",
          "fines_summary_display": "Арендатор возмещает штрафы (ГИБДД, МАДИ, Платон, весогабарит) за 5 дней; удержание из депозита предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 7.4–7.6",
              "quote": "Арендатор обязуется в полном объеме компенсировать Арендодателю любые административные штрафы (включая штрафы ГИБДД, МАДИ, АМПП, системы «Платон» и за нарушение правил весогабаритного контроля)... Арендатор обязан возместить сумму штрафа в течение 5 календарных дней с момента получения уведомления. В случае неоплаты штрафа в установленный срок Арендодатель вправе в безакцептном порядке удержать соответствующую сумму из внесенного Арендатором обеспечительного платежа (депозита)."
            }
          ]
        }

        Пример 2 — базовая обязанность без депозита:
        Фрагмент:
        "5.3. Все штрафы за нарушение Правил дорожного движения, совершенные в период аренды, подлежат оплате Арендатором."

        Ответ:
        {
          "fines_reimbursement_status": "defined",
          "fines_reimbursement_details": "Все штрафы за нарушение ПДД подлежат оплате Арендатором",
          "notification_procedure_status": "not_defined",
          "notification_procedure_details": "Не установлено",
          "reimbursement_deadline_status": "not_defined",
          "reimbursement_deadline_details": "Не установлено",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Не установлено",
          "deposit_retention_for_fines_status": "not_defined",
          "deposit_retention_for_fines_details": "Не установлено",
          "fines_summary_display": "Штрафы ПДД оплачивает Арендатор | Срок возмещения и удержание из депозита не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Все штрафы за нарушение Правил дорожного движения, совершенные в период аренды, подлежат оплате Арендатором."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязуется эксплуатировать автомобиль бережно."

        Ответ:
        {
          "fines_reimbursement_status": "not_defined",
          "fines_reimbursement_details": "Не установлено",
          "notification_procedure_status": "not_defined",
          "notification_procedure_details": "Не установлено",
          "reimbursement_deadline_status": "not_defined",
          "reimbursement_deadline_details": "Не установлено",
          "regress_mechanism_status": "not_defined",
          "regress_mechanism_details": "Не установлено",
          "deposit_retention_for_fines_status": "not_defined",
          "deposit_retention_for_fines_details": "Не установлено",
          "fines_summary_display": "Компенсация административных штрафов не урегулирована",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об обязанности компенсации штрафов (ГИБДД, камеры, парковка, Платон, весогабарит).
        2. Проверь наличие срока и порядка извещения Арендатора.
        3. Найди срок возмещения штрафов Арендатором.
        4. Проверь наличие права удержания штрафов из обеспечительного платежа/депозита.
        5. Сформируй сводку fines_summary_display.
        6. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "fines_reimbursement_status": "<defined / not_defined>",
          "fines_reimbursement_details": "<текст или 'Не установлено'>",
          "notification_procedure_status": "<defined / not_defined>",
          "notification_procedure_details": "<текст или 'Не установлено'>",
          "reimbursement_deadline_status": "<defined / not_defined>",
          "reimbursement_deadline_details": "<текст или 'Не установлено'>",
          "regress_mechanism_status": "<defined / not_defined>",
          "regress_mechanism_details": "<текст или 'Не установлено'>",
          "deposit_retention_for_fines_status": "<defined / not_defined>",
          "deposit_retention_for_fines_details": "<текст или 'Не установлено'>",
          "fines_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "штрафы ГИБДД административные штрафы письма счастья штрафы с камер фотовидеофиксация обязан возместить срок возмещения компенсация штрафов Платон весогабаритный контроль МАДИ АМПП парковка удержание из депозита обеспечительный платеж регресс"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - procedures
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_fines_and_regress_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства механизм компенсации административных штрафов: обязанность возмещения
        (штрафы ГИБДД, парковка МАДИ/АМПП, система «Платон», весогабаритный контроль),
        порядок и сроки уведомления, срок компенсации, регрессные требования и удержание из депозита.
        Не анализируй размер арендной платы, условия страхования КАСКО, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_fines_and_regress_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (fines_reimbursement_status, notification_procedure_status,
              reimbursement_deadline_status, regress_mechanism_status,
              deposit_retention_for_fines_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - fines_reimbursement_status = "not_defined";
           - notification_procedure_status = "not_defined";
           - reimbursement_deadline_status = "not_defined";
           - regress_mechanism_status = "not_defined";
           - deposit_retention_for_fines_status = "not_defined";
           - все *_details = "Не установлено";
           - fines_summary_display = "Компенсация административных штрафов не урегулирована";
           - не выполняй остальные шаги.

        1. fines_reimbursement_status:
           - "defined" — если обязанность компенсировать штрафы прямо указана;
           - "not_defined" — если не указана.

        2. fines_reimbursement_details:
           Формулировка об обязанности возмещения штрафов (включая виды нарушений:
           ГИБДД, МАДИ, АМПП, Платон, весогабаритный контроль).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. notification_procedure_status:
           - "defined" — если порядок и сроки уведомления Арендатора о штрафах
             прямо описаны;
           - "not_defined" — если не описаны.

        4. notification_procedure_details:
           Порядок уведомления Арендатора (способ, срок).
           Если данных нет — "Не установлено".

        5. reimbursement_deadline_status:
           - "defined" — если срок компенсации/возмещения штрафов прямо установлен;
           - "not_defined" — если не установлен.

        6. reimbursement_deadline_details:
           Срок компенсации штрафов Арендатором (например, "в течение 5 календарных
           дней с момента получения уведомления").
           Если данных нет — "Не установлено".

        7. regress_mechanism_status:
           - "defined" — если регрессные требования/возмещение судебных расходов
             прямо оговорены;
           - "not_defined" — если не оговорены.

        8. regress_mechanism_details:
           Формулировка о регрессе или компенсации расходов на обжалование.
           Если данных нет — "Не установлено".

        9. deposit_retention_for_fines_status:
           - "defined" — если удержание сумм штрафов из обеспечительного платежа
             (депозита) прямо предусмотрено;
           - "not_defined" — если не предусмотрено.

        10. deposit_retention_for_fines_details:
            Формулировка об удержании штрафов из депозита / обеспечительного платежа.
            Если данных нет — "Не установлено".

        11. fines_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: кто компенсирует штрафы, виды нарушений, срок возмещения,
            право списания из депозита. Строится на основе других полей —
            не добавляй данные, которых нет в них.
            Если presence = "missing" — "Компенсация административных штрафов
            не урегулирована".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_fines_and_regress_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", fines_summary_display = "Компенсация административных штрафов не урегулирована".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - fines_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указана только общая фраза "Арендатор несёт ответственность за все штрафы" без конкретизации видов, сроков и механизмов — fines_reimbursement_status = "defined", остальные *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые сроки или механизмы — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности компенсации штрафов, ни уведомления,
           ни сроков, ни регресса, ни удержания из депозита.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             fines_summary_display = "Компенсация административных штрафов не урегулирована".

        2. Только общая обязанность без деталей.
           "Все штрафы за нарушение ПДД подлежат оплате Арендатором"
           без указания сроков, порядка уведомления и механизмов.
           → presence = "present";
             fines_reimbursement_status = "defined";
             остальные *_status = "not_defined";
             fines_summary_display отражает только общую обязанность.

        3. Противоречие в сроках возмещения.
           В одном пункте "в течение 5 дней", в другом —
           "в течение 10 рабочих дней".
           → presence = "unclear";
             reimbursement_deadline_status = "not_defined";
             reimbursement_deadline_details = "Не удалось определить".

        4. Удержание из депозита без конкретизации.
           "Арендодатель вправе удержать суммы штрафов из обеспечительного
           платежа" без описания порядка и сроков.
           → presence = "present";
             deposit_retention_for_fines_status = "defined";
             deposit_retention_for_fines_details содержит формулировку;
             fines_reimbursement_status определяется отдельно.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_fines_and_regress_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * fines_summary_display → "Компенсация административных штрафов не урегулирована".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * fines_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_fines_and_regress_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие механизма компенсации штрафов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "fines_reimbursement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности компенсировать штрафы."
          required: true
          display_in_grid: false
        - name: "fines_reimbursement_details"
          label: "Возмещение штрафов ПДД"
          type: "string"
          presentation: "fact"
          description: "Формулировка об обязанности компенсировать административные штрафы (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "notification_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка уведомления о штрафах."
          required: true
          display_in_grid: false
        - name: "notification_procedure_details"
          label: "Порядок уведомления арендодателя"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке извещения Арендатора о штрафах (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "reimbursement_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока компенсации."
          required: true
          display_in_grid: false
        - name: "reimbursement_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок возмещения штрафов"
          description: "Срок компенсации сумм штрафов Арендатором с момента получения уведомления."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "regress_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регрессного механизма."
          required: true
          display_in_grid: false
        - name: "regress_mechanism_details"
          label: "Механизм регрессного требования"
          type: "string"
          presentation: "fact"
          description: "Формулировка о регрессном механизме и расходах на обжалование (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "deposit_retention_for_fines_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус удержания штрафов из депозита."
          required: true
          display_in_grid: false
        - name: "deposit_retention_for_fines_details"
          type: "string"
          presentation: "fact"
          label: "Удержание из депозита"
          description: "Право Арендодателя удержать сумму неоплаченных штрафов из обеспечительного платежа (депозита)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "fines_summary_display"
          type: "string"
          presentation: "fact"
          label: "Компенсация штрафов"
          description: "Сводная информация о механизме возмещения штрафов (ГИБДД, МАДИ, Платон, весогабарит, сроки, удержание из депозита)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_usage_restrictions_check
    name: "Ограничения использования ТС: водители, территория, запрет передачи и субаренды"
    description: >
      Фактографическая проверка квалификационных требований к допущенным водителям
      (возраст, стаж вождения, категория прав), списка уполномоченных лиц,
      запрета передачи управления третьим лицам, территориальных ограничений
      (субъекты РФ, запрет выезда за рубеж), запрета субаренды и ограничений
      по целевому использованию (запрет такси, гонок, буксировки, бездорожья)
      по ст. 615, 631, 647 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "водительское удостоверение"
        - "категория"
        - "стаж вождения"
        - "возраст водителя"
        - "допущенные водители"
        - "список водителей"
        - "запрет на передачу управления"
        - "без права передачи"
        - "территория эксплуатации"
        - "выезд за пределы"
        - "за пределы РФ"
        - "субаренда"
        - "такси"
        - "перевозка пассажиров"
        - "буксировка"
        - "соревнования"
        - "гонки"
        - "бездорожье"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)водительск[а-я]*\\s+удостоверен[а-я]*"
        - "(?i)стаж[а-я]*\\s+вожден[а-я]*"
        - "(?i)территори[а-я]*\\s+эксплуатац[а-я]*"
        - "(?i)выезд[а-я]*\\s+за\\s+предел[а-я]*"
        - "(?i)субаренд[а-я]*"
        - "(?i)без\\s+права\\s+передач[а-я]*"
        - "(?i)(?:в\\s+качестве\\s+)?такси|буксировк[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются ограничения и правила целевой эксплуатации ТС (требования к водителям,
        передача третьим лицам, территория использования, запрет выезда за границу, субаренда, запрет такси/гонок).

        Нормативный ориентир:
        - ст. 615 ГК РФ — пользование арендованным имуществом в соответствии с условиями договора и его назначением.
        - ст. 631 ГК РФ — субаренда при аренде ТС с экипажем (допускается без согласия арендодателя, если иное не установлено договором).
        - ст. 647 ГК РФ — субаренда при аренде ТС без экипажа (допускается только с согласия арендодателя).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требования к водителям (минимальный возраст, стаж вождения, категория водительского удостоверения).
        2. Список/перечень допущенных водителей (поименный список, сотрудники арендатора или отсылка к приложению).
        3. Запрет передачи управления ТС третьим лицам без согласия Арендодателя.
        4. Территориальные ограничения эксплуатации ТС (разрешенные регионы, субъекты РФ, город/область).
        5. Запрет выезда за пределы Российской Федерации (за рубеж).
        6. Запрет сдачи ТС в субаренду (субфрахтование) и запрет коммерческого использования (такси, обучение вождению, буксировка, гонки).
        7. Сформируй сводное читаемое поле usage_restrictions_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — строгие ограничения по водителям, территории и целевому назначению:
        Фрагмент:
        "4.1. К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей
        (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет.
        Передача управления любым третьим лицам категорически запрещена.
        4.2. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области.
        Выезд за пределы указанной территории, а также выезд за пределы территории РФ запрещён.
        4.3. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси,
        для буксировки других ТС, а также для участия в спортивных соревнованиях."

        Ответ:
        {
          "driver_requirements_status": "defined",
          "driver_requirements_details": "штатные водители, возраст от 23 лет, стаж вождения категории «B» от 3 лет",
          "allowed_drivers_list_status": "defined",
          "allowed_drivers_list_details": "лица, указанные в Списке водителей (Приложение № 2)",
          "transfer_prohibition_status": "defined",
          "transfer_prohibition_details": "передача управления любым третьим лицам категорически запрещена",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория г. Москвы и Московской области",
          "cross_border_restriction_status": "defined",
          "cross_border_restriction_details": "выезд за пределы территории РФ запрещён",
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "субаренда запрещена; запрещено использовать как такси, для буксировки и соревнований",
          "usage_restrictions_summary_display": "Водители: возраст 23+, стаж 3 г. (Приложение №2) | Территория: Москва и МО (выезд за рубеж запрещён) | Субаренда, такси и буксировка запрещены",
          "evidence": [
            {
              "clause_ref": "п. 4.1–4.3",
              "quote": "К управлению ТС допускаются только штатные водители Арендатора, указанные в Списке водителей (Приложение № 2), имеющие возраст не менее 23 лет, стаж вождения категории «B» не менее 3 лет. Передача управления любым третьим лицам категорически запрещена. Территория эксплуатации ТС ограничена территорией г. Москвы и Московской области. Выезд за пределы территории РФ запрещён. Арендатору запрещается сдавать ТС в субаренду, использовать ТС в качестве такси..."
            }
          ]
        }

        Пример 2 — только базовая территория без ограничений водителей:
        Фрагмент:
        "3.4. Автомобиль используется для служебных поездок по территории Северо-Западного федерального округа."

        Ответ:
        {
          "driver_requirements_status": "not_defined",
          "driver_requirements_details": "Не установлено",
          "allowed_drivers_list_status": "not_defined",
          "allowed_drivers_list_details": "Не установлено",
          "transfer_prohibition_status": "not_defined",
          "transfer_prohibition_details": "Не установлено",
          "territorial_limits_status": "defined",
          "territorial_limits_details": "территория Северо-Западного федерального округа",
          "cross_border_restriction_status": "not_defined",
          "cross_border_restriction_details": "Не установлено",
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Не установлено",
          "usage_restrictions_summary_display": "Территория: СЗФО | Требования к водителям, запрет передачи и субаренды не урегулированы",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Автомобиль используется для служебных поездок по территории Северо-Западного федерального округа."
            }
          ]
        }

        Пример 3 — ограничения отсутствуют:
        Фрагмент:
        "Арендатор использует автомобиль по своему усмотрению."

        Ответ:
        {
          "driver_requirements_status": "not_defined",
          "driver_requirements_details": "Не установлено",
          "allowed_drivers_list_status": "not_defined",
          "allowed_drivers_list_details": "Не установлено",
          "transfer_prohibition_status": "not_defined",
          "transfer_prohibition_details": "Не установлено",
          "territorial_limits_status": "not_defined",
          "territorial_limits_details": "Не установлено",
          "cross_border_restriction_status": "not_defined",
          "cross_border_restriction_details": "Не установлено",
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Не установлено",
          "usage_restrictions_summary_display": "Ограничения эксплуатации ТС не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора о требованиях к стажу, возрасту водителей и правам.
        2. Проверь наличие списка/круга допущенных водителей.
        3. Проверь наличие запрета передачи ТС третьим лицам.
        4. Найди пункт о географических границах (территории) использования ТС и выезде за границу.
        5. Проверь наличие запретов субаренды, использования в такси, для буксировки и гонок.
        6. Сформируй сводку usage_restrictions_summary_display.
        7. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "driver_requirements_status": "<defined / not_defined>",
          "driver_requirements_details": "<текст или 'Не установлено'>",
          "allowed_drivers_list_status": "<defined / not_defined>",
          "allowed_drivers_list_details": "<текст или 'Не установлено'>",
          "transfer_prohibition_status": "<defined / not_defined>",
          "transfer_prohibition_details": "<текст или 'Не установлено'>",
          "territorial_limits_status": "<defined / not_defined>",
          "territorial_limits_details": "<текст или 'Не установлено'>",
          "cross_border_restriction_status": "<defined / not_defined>",
          "cross_border_restriction_details": "<текст или 'Не установлено'>",
          "sublease_prohibition_status": "<defined / not_defined>",
          "sublease_prohibition_details": "<текст или 'Не установлено'>",
          "usage_restrictions_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "subletting_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "водительское удостоверение категория стаж вождения возраст допущенные водители список водителей запрет передачи управления территория эксплуатации регион использования выезд за пределы РФ субаренда такси буксировка без права передачи"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "штрафы"
        - "ДТП"
        - "ремонт"
        - "возврат"
        - "депозит"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_usage_restrictions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства ограничения использования: требования к водителям (стаж, возраст, категория),
        круг допущенных лиц, запрет передачи управления третьим лицам, территорию эксплуатации,
        запрет выезда за рубеж, запрет субаренды и коммерческого использования (такси, буксировка, гонки).
        Не анализируй арендную плату, условия страхования КАСКО/ОСАГО, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_usage_restrictions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (driver_requirements_status, allowed_drivers_list_status,
              transfer_prohibition_status, territorial_limits_status,
              cross_border_restriction_status, sublease_prohibition_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Не установлено";
           - usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены";
           - не выполняй остальные шаги.

        1. driver_requirements_status:
           - "defined" — если требования к водителям (стаж, возраст, категория)
             прямо указаны;
           - "not_defined" — если не указаны.

        2. driver_requirements_details:
           Формулировка о требованиях к водителям.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. allowed_drivers_list_status:
           - "defined" — если перечень допущенных водителей прямо оговорен
             (поименный список, отсылка к приложению, "штатные водители");
           - "not_defined" — если не оговорен.

        4. allowed_drivers_list_details:
           Круг/список допущенных водителей (или отсылка к приложению).
           Если данных нет — "Не установлено".

        5. transfer_prohibition_status:
           - "defined" — если запрет передачи управления третьим лицам
             прямо установлен;
           - "not_defined" — если не установлен.

        6. transfer_prohibition_details:
           Формулировка о запрете передачи управления.
           Если данных нет — "Не установлено".

        7. territorial_limits_status:
           - "defined" — если территория использования ТС прямо ограничена;
           - "not_defined" — если не ограничена.

        8. territorial_limits_details:
           Формулировка о территориальных ограничениях (регион, область, город).
           Если данных нет — "Не установлено".

        9. cross_border_restriction_status:
           - "defined" — если запрет выезда за пределы РФ прямо указан;
           - "not_defined" — если не указан.

        10. cross_border_restriction_details:
            Формулировка о запрете выезда за границу.
            Если данных нет — "Не установлено".

        11. sublease_prohibition_status:
            - "defined" — если субаренда прямо запрещена или ограничена;
            - "not_defined" — если не запрещена и не ограничена.

        12. sublease_prohibition_details:
            Формулировка о запрете субаренды и иных целевых ограничениях
            (такси, буксировка, гонки, бездорожье).
            Если данных нет — "Не установлено".

        13. usage_restrictions_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: требования к водителям, территория, выезд за рубеж,
            запрет передачи, субаренда и такси. Строится на основе других
            полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Ограничения эксплуатации ТС не установлены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_usage_restrictions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - usage_restrictions_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указана только общая фраза "Арендатор использует ТС по назначению" без конкретных ограничений — все *_status = "not_defined".
        - Если список водителей вынесен в приложение и это прямо видно из текста — allowed_drivers_list_status = "defined", details содержит отсылку.
        - Если в разных фрагментах указаны противоречивые ограничения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни требований к водителям, ни запретов передачи,
           ни территориальных ограничений, ни субаренды.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             usage_restrictions_summary_display = "Ограничения эксплуатации ТС не установлены".

        2. Только территория без остальных ограничений.
           Указана территория эксплуатации, но нет требований к водителям,
           запретов передачи и субаренды.
           → presence = "present";
             territorial_limits_status = "defined";
             остальные *_status = "not_defined";
             usage_restrictions_summary_display отражает только территорию.

        3. Противоречие в условиях субаренды.
           В одном пункте "субаренда допускается с согласия Арендодателя",
           в другом — "субаренда категорически запрещена".
           → presence = "unclear";
             sublease_prohibition_status = "not_defined";
             sublease_prohibition_details = "Не удалось определить".

        4. Отсылка на приложение (список водителей).
           "К управлению допускаются лица из Списка водителей (Приложение №2)"
           без перечисления конкретных лиц в основном тексте.
           → presence = "present";
             allowed_drivers_list_status = "defined";
             allowed_drivers_list_details = "лица, указанные в Списке водителей (Приложение №2)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_usage_restrictions_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * usage_restrictions_summary_display → "Ограничения эксплуатации ТС не установлены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * usage_restrictions_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_usage_restrictions_check_presence"
          type: "string"
