  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Ответственность перед третьими лицами
  # ──────────────────────────────────────────────────────────────────────────
  - id: vehicle_liability_allocation_check
    name: "Ответственность перед третьими лицами по модели аренды ТС"
    description: >
      Фактографическая проверка распределения ответственности за вред
      третьим лицам с учётом вида аренды: с экипажем (арендодатель)
      или без экипажа (арендатор).
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность за вред третьим лицам"
        - "источник повышенной опасности"
        - "несет арендатор"
        - "несет арендодатель"
        - "экипаж"
        - "ответственность за действия экипажа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вред.*третьим\\s+лицам"
        - "(?i)источник\\s+повышенн(ой|ого)\\s+опасност"
        - "(?i)несет\\s+арендатор|несет\\s+арендодатель"
        - "(?i)действи(я|е)\\s+экипаж"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: распределение ответственности за вред
        третьим лицам с учётом вида аренды.

        Нормативный ориентир:
        - ст. 640 ГК РФ — ответственность при аренде без экипажа (арендатор)
        - ст. 634–635 ГК РФ — ответственность при аренде с экипажем (арендодатель)
        - ст. 1079 ГК РФ — ответственность владельца ИПО

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт ответственность за вред третьим лицам.
        2. Есть ли ссылка на источник повышенной опасности.
        3. Есть ли указание на ответственность за действия экипажа.
        4. Есть ли условие о ремонте и содержании по модели аренды.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Ответственность за вред, причинённый третьим лицам транспортным средством
        как источником повышенной опасности, несёт Арендатор. Арендатор обязан
        поддерживать ТС в исправном состоянии, осуществлять текущий и капитальный ремонт."

        Ответ:
        {
          "third_party_liability_holder_status": "defined",
          "third_party_liability_holder_code": "tenant",
          "third_party_liability_details": "ответственность за вред третьим лицам несёт Арендатор",
          "hazardous_source_reference_status": "defined",
          "hazardous_source_reference_details": "транспортным средством как источником повышенной опасности",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Данные не определены",
          "maintenance_allocation_status": "defined",
          "maintenance_allocation_details": "Арендатор обязан осуществлять текущий и капитальный ремонт",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Ответственность за вред, причинённый третьим лицам транспортным средством как источником повышенной опасности, несёт Арендатор."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность по закону."

        Ответ:
        {
          "third_party_liability_holder_status": "not_defined",
          "third_party_liability_holder_code": "not_defined",
          "third_party_liability_details": "Данные не определены",
          "hazardous_source_reference_status": "not_defined",
          "hazardous_source_reference_details": "Данные не определены",
          "crew_liability_status": "not_defined",
          "crew_liability_details": "Данные не определены",
          "maintenance_allocation_status": "not_defined",
          "maintenance_allocation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об ответственности перед третьими лицами.
        2. Найди прямую цитату об ИПО.
        3. Найди прямую цитату об ответственности за действия экипажа.
        4. Найди прямую цитату о ремонте и содержании.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "third_party_liability_holder_status": "<defined / not_defined>",
          "third_party_liability_holder_code": "<landlord / tenant / not_defined>",
          "third_party_liability_details": "<текст или 'Данные не определены'>",
          "hazardous_source_reference_status": "<defined / not_defined>",
          "hazardous_source_reference_details": "<текст или 'Данные не определены'>",
          "crew_liability_status": "<defined / not_defined>",
          "crew_liability_details": "<текст или 'Данные не определены'>",
          "maintenance_allocation_status": "<defined / not_defined>",
          "maintenance_allocation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за вред третьим лицам источник повышенной опасности несёт арендатор несёт арендодатель экипаж действия экипажа текущий и капитальный ремонт содержание ТС"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "ДТП порядок"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1000


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС распределение
        ответственности за вред третьим лицам, ссылку на ИПО, ответственность
        за действия экипажа и обязанности по ремонту.
        Не анализируй плату, страхование, штрафы или возврат.
        </role>

        <context>
