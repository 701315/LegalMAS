  - id: vehicle_deposit_and_mileage_check
    name: "Залог / депозит, лимит пробега и плата за превышение"
    description: >
      Фактографическая проверка наличия и размера обеспечительного платежа
      (депозита / гарантийного взноса), условий и сроков его возврата
      (включая удержание под штрафы ГИБДД), критериев удержания,
      лимита пробега / моточасов и размера платы за сверхнормативный пробег
      или сверхурочную работу техники (ст. 381.1, 421 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "депозит"
        - "обеспечительный платеж"
        - "гарантийный депозит"
        - "обеспечительный взнос"
        - "возврат залога"
        - "удержание"
        - "лимит пробега"
        - "ограничение пробега"
        - "сверхнормативный пробег"
        - "перепробег"
        - "плата за превышение"
        - "моточасы"
        - "мото-часы"
        - "смена"
        - "переработка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(?:залог|депозит|обеспечительн[а-я]*\\s+плат[а-я]*|гарантийн[а-я]*\\s+взнос)"
        - "(?i)лимит[а-я]*.*(?:пробег|моточас|смен)"
        - "(?i)(?:сверхнормативн|перепробег)[а-я]*"
        - "(?i)\\d+\\s*(?:км|километр[а-я]*|моточас[а-я]*)\\s*(?:в\\s+(?:сутки|месяц|смену)|ежемесячн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются коммерческие условия договора: обеспечительный платёж (депозит/залог),
        порядок и сроки его возврата (в т.ч. удержание под штрафы), лимит пробега (или моточасов)
        и плата за превышение лимита (перепробег).

        Нормативный ориентир:
        - ст. 381.1 ГК РФ — обеспечительный платёж (внесение денежной суммы в обеспечение исполнения обязательств,
          зачет в счет требований арендодателя, возврат при ненаступлении обстоятельств).
        - ст. 421 ГК РФ — свобода договора (установление лимитов пробега ТС и тарифов за перепробег).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли залог / депозит / обеспечительный платёж и каков его точный размер.
        2. Условия и сроки возврата депозита (включая поэтапный возврат или задержку возврата части суммы для проверки штрафов).
        3. Критерии и основания удержания сумм из депозита (ущерб, повреждения, мойка, штрафы ГИБДД, задолженность по аренде).
        4. Установлен ли лимит пробега (в км за сутки/месяц) или лимит моточасов работы спецтехники.
        5. Установлена ли плата за сверхнормативный пробег (тариф за 1 км перепробега или 1 моточас переработки).
        6. Сформируй сводное читаемое поле deposit_display для таблицы DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — легковой автомобиль, обеспечительный платеж и перепробег:
        Фрагмент:
        "3.4. При подписании договора Арендатор вносит обеспечительный платеж в размере 50 000 рублей.
        Обеспечительный платеж возвращается в течение 10 рабочих дней после подписания Акта возврата ТС
        за вычетом 10 000 рублей, которые удерживаются Арендодателем на срок 30 календарных дней
        для покрытия возможных штрафов за нарушение ПДД.
        3.5. Арендатору устанавливается лимит пробега 4 500 км в месяц. В случае превышения лимита
        Арендатор уплачивает 15 рублей за каждый километр перепробега."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "Обеспечительный платеж 50 000 рублей",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "40 000 руб. возвращается в течение 10 рабочих дней после возврата ТС, 10 000 руб. удерживаются на 30 дней для проверки штрафов",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "удержание под возможные штрафы ГИБДД, повреждения и долги",
          "mileage_limit_status": "defined",
          "mileage_limit_details": "4 500 км в месяц",
          "excess_mileage_fee_status": "defined",
          "excess_mileage_fee_details": "15 рублей за каждый километр перепробега",
          "deposit_display": "Депозит: 50 000 руб. (возврат 10 раб. дней, 10 000 руб. резерв под штрафы на 30 дней)",
          "evidence": [
            {
              "clause_ref": "п. 3.4–3.5",
              "quote": "При подписании договора Арендатор вносит обеспечительный платеж в размере 50 000 рублей. Обеспечительный платеж возвращается в течение 10 рабочих дней после подписания Акта возврата ТС за вычетом 10 000 рублей... Лимит пробега 4 500 км в месяц. В случае превышения лимита Арендатор уплачивает 15 рублей за каждый километр перепробега."
            }
          ]
        }

        Пример 2 — спецтехника, лимит моточасов:
        Фрагмент:
        "2.6. Гарантийный депозит составляет 100 000 руб., возвращается в полном объеме в течение 5 банковских дней
        после возврата техники при отсутствии повреждений и задолженности.
        4.2. Норма работы экскаватора — не более 8 моточасов в смену (200 моточасов в месяц).
        Сверхнормативная работа оплачивается по тарифу 2 500 руб. за каждый дополнительный моточас."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "Гарантийный депозит 100 000 рублей",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "в течение 5 банковских дней после возврата техники",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "при наличии повреждений техники или задолженности по оплате",
          "mileage_limit_status": "defined",
          "mileage_limit_details": "8 моточасов в смену (200 моточасов в месяц)",
          "excess_mileage_fee_status": "defined",
          "excess_mileage_fee_details": "2 500 руб. за каждый дополнительный моточас сверх нормы",
          "deposit_display": "Депозит: 100 000 руб. (возврат 5 банк. дней при отсутствии долга/повреждений)",
          "evidence": [
            {
              "clause_ref": "п. 2.6, 4.2",
              "quote": "Гарантийный депозит составляет 100 000 руб., возвращается в полном объеме в течение 5 банковских дней после возврата техники... Норма работы экскаватора — не более 8 моточасов в смену (200 моточасов в месяц). Сверхнормативная работа оплачивается по тарифу 2 500 руб. за каждый дополнительный моточас."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендатор уплачивает фиксированную арендную плату ежемесячно."

        Ответ:
        {
          "deposit_status": "not_defined",
          "deposit_details": "Не установлено",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Не установлено",
          "retention_criteria_status": "not_defined",
          "retention_criteria_details": "Не установлено",
          "mileage_limit_status": "not_defined",
          "mileage_limit_details": "Не установлено",
          "excess_mileage_fee_status": "not_defined",
          "excess_mileage_fee_details": "Не установлено",
          "deposit_display": "Депозит и лимит пробега не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об обеспечительном платеже, залоге или гарантийном взносе.
        2. Проверь условия и сроки возврата депозита.
        3. Найди пункт о лимите пробега (км/сутки, км/месяц) или лимите моточасов.
        4. Проверь наличие тарифа за перепробег / переработку моточасов.
        5. Сформируй сводку deposit_display.
        6. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "deposit_status": "<defined / not_defined>",
          "deposit_details": "<текст или 'Не установлено'>",
          "deposit_refund_status": "<defined / not_defined>",
          "deposit_refund_details": "<текст или 'Не установлено'>",
          "retention_criteria_status": "<defined / not_defined>",
          "retention_criteria_details": "<текст или 'Не установлено'>",
          "mileage_limit_status": "<defined / not_defined>",
          "mileage_limit_details": "<текст или 'Не установлено'>",
          "excess_mileage_fee_status": "<defined / not_defined>",
          "excess_mileage_fee_details": "<текст или 'Не установлено'>",
          "deposit_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "rent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "залог депозит обеспечительный платёж гарантийный взнос возврат депозита удержание лимит пробега ограничение пробега перепробег плата за превышение моточасы смена переработка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "штрафы ГИБДД"
        - "ДТП"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_deposit_and_mileage_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства условия об обеспечительном платеже (депозите/залоге), порядке и сроках
        его возврата, основаниях удержания, лимите пробега (км) или моточасов работы техники,
        а также тарифе за сверхнормативный пробег / переработку.
        Не анализируй размер базовой арендной платы, условия страхования КАСКО, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_deposit_and_mileage_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (deposit_status, deposit_refund_status, retention_criteria_status,
              mileage_limit_status, excess_mileage_fee_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - deposit_status = "not_defined";
           - deposit_refund_status = "not_defined";
           - retention_criteria_status = "not_defined";
           - mileage_limit_status = "not_defined";
           - excess_mileage_fee_status = "not_defined";
           - все *_details = "Не установлено";
           - deposit_display = "Депозит и лимит пробега не установлены";
           - не выполняй остальные шаги.

        1. deposit_status:
           - "defined" — если обеспечительный платеж / депозит / залог
             прямо предусмотрен с указанием размера;
           - "not_defined" — если не предусмотрен.

        2. deposit_details:
           Размер и условия внесения депозита.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. deposit_refund_status:
           - "defined" — если порядок и сроки возврата депозита прямо описаны;
           - "not_defined" — если не описаны.

        4. deposit_refund_details:
           Формулировка о сроках и условиях возврата депозита (включая задержку
           на проверку штрафов, поэтапный возврат).
           Если данных нет — "Не установлено".

        5. retention_criteria_status:
           - "defined" — если основания/критерии удержания из депозита
             прямо оговорены;
           - "not_defined" — если не оговорены.

        6. retention_criteria_details:
           Формулировка об основаниях удержания (ущерб, штрафы, долги, мойка).
           Если данных нет — "Не установлено".

        7. mileage_limit_status:
           - "defined" — если лимит пробега или лимит моточасов прямо установлен;
           - "not_defined" — если не установлен.

        8. mileage_limit_details:
           Лимит пробега (км в сутки/месяц) или норма моточасов (в смену/месяц).
           Если данных нет — "Не установлено".

        9. excess_mileage_fee_status:
           - "defined" — если плата за перепробег или сверхурочные моточасы
             прямо предусмотрена;
           - "not_defined" — если не предусмотрена.

        10. excess_mileage_fee_details:
            Размер платы / тариф за каждый километр перепробега или
            дополнительный моточас.
            Если данных нет — "Не установлено".

        11. deposit_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази: размер депозита, условия возврата и удержания.
            Строится на основе других полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Депозит и лимит пробега не установлены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_deposit_and_mileage_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", deposit_display = "Депозит и лимит пробега не установлены".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - deposit_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в договоре указан только депозит без лимита пробега (или наоборот) — presence = "present", определённые поля заполняются, остальные = "not_defined".
        - Если в разных фрагментах указаны противоречивые суммы депозита или тарифы — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни депозита, ни лимита пробега, ни платы за перепробег.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             deposit_display = "Депозит и лимит пробега не установлены".

        2. Только депозит без лимита пробега.
           Указан обеспечительный платеж и порядок его возврата, но лимит
           пробега и плата за перепробег не установлены.
           → presence = "present";
             deposit_status = "defined";
             deposit_refund_status = "defined";
             mileage_limit_status = "not_defined";
             excess_mileage_fee_status = "not_defined";
             deposit_display отражает только депозит.

        3. Противоречие в размере депозита/тарифа.
           В одном пункте "депозит 50 000 руб.", в другом —
           "обеспечительный платеж 30 000 руб.".
           → presence = "unclear";
             deposit_status = "not_defined";
             deposit_details = "Не удалось определить".

        4. Депозит с поэтапным возвратом.
           Часть депозита возвращается сразу, часть удерживается на 30 дней
           для проверки штрафов ГИБДД.
           → presence = "present";
             deposit_status = "defined";
             deposit_refund_status = "defined";
             retention_criteria_status = "defined";
             deposit_refund_details отражает поэтапность;
             retention_criteria_details отражает удержание под штрафы.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_deposit_and_mileage_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * deposit_display → "Депозит и лимит пробега не установлены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * deposit_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_deposit_and_mileage_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие депозита и лимитов пробега. Внутреннее агрегатное signal-поле."
          required: true

        - name: "deposit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия депозита."
          required: true
          display_in_grid: false
        - name: "deposit_details"
          label: "Сведения об обеспечительном платеже"
          type: "string"
          presentation: "fact"
          description: "Размер и условия депозита (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "deposit_refund_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата депозита."
          required: true
          display_in_grid: false
        - name: "deposit_refund_details"
          label: "Порядок возврата депозита"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке и сроках возврата депозита (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "retention_criteria_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус критериев удержания."
          required: true
          display_in_grid: false
        - name: "retention_criteria_details"
          label: "Критерии удержания депозита"
          type: "string"
          presentation: "fact"
          description: "Формулировка об основаниях удержания из депозита (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "mileage_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус лимита пробега / моточасов."
          required: true
          display_in_grid: false
        - name: "mileage_limit_details"
          type: "string"
          presentation: "fact"
          label: "Лимит пробега / моточасов"
          description: "Установленное ограничение пробега (км/сутки, км/месяц) или лимит моточасов работы спецтехники."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "excess_mileage_fee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус платы за сверхнормативный пробег / переработку."
          required: true
          display_in_grid: false
        - name: "excess_mileage_fee_details"
          type: "string"
          presentation: "fact"
          label: "Плата за перепробег"
          description: "Тариф за каждый километр перепробега или дополнительный моточас работы сверх лимита."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "deposit_display"
          type: "string"
          presentation: "fact"
          label: "Обеспечительный платеж (депозит)"
          description: "Сводная информация об обеспечительном платеже (размер, порядок возврата и основания удержания)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_downtime_and_replacement_check
    name: "Простой ТС, подменное транспортное средство и приостановка оплаты"
    description: >
      Фактографическая проверка условий простоя ТС в период ремонта или поломки:
      кто оплачивает простой, обязанность Арендодателя предоставить подменное ТС,
      сроки замены, класс подменного автомобиля и право Арендатора приостановить
      оплату аренды или расторгнуть договор при длительном простое (ст. 612, 613, 620 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "простой"
        - "подменное транспортное средство"
        - "подменный автомобиль"
        - "замена ТС"
        - "приостановка оплаты"
        - "время ремонта"
        - "неисправность"
        - "поломка"
        - "не по вине арендатора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)простой[а-я]*\\s+(?:ТС|транспортн|автомобил)"
        - "(?i)подменн[а-я]*\\s+(?:ТС|транспортн|автомобил)"
        - "(?i)приостанов[а-я]*.*оплат"
        - "(?i)замен[а-я]*\\s+(?:ТС|транспортн|автомобил)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются условия простоя ТС (ремонт, поломка, неисправность): распределение расходов,
        подменное транспортное средство и право приостановки оплаты аренды.

        Нормативный ориентир:
        - ст. 612 ГК РФ — ответственность арендодателя за недостатки сданного имущества.
        - ст. 613 ГК РФ — права третьих лиц на арендуемое имущество.
        - ст. 620 ГК РФ — досрочное расторжение по требованию арендатора, если имущество
          в силу обстоятельств, за которые арендатор не отвечает, оказывается в состоянии,
          не пригодном для использования.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрены ли условия простоя ТС в период ремонта или поломки.
        2. Кто несёт расходы за период простоя (оплата аренды сохраняется / приостанавливается / пересчитывается).
        3. Обязан ли Арендодатель предоставить подменное ТС, в какой срок и какого класса.
        4. Имеет ли Арендатор право приостановить оплату аренды при простое.
        5. Сформируй сводное поле downtime_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — подменное ТС и приостановка оплаты:
        Фрагмент:
        "5.6. В случае выхода ТС из строя не по вине Арендатора Арендодатель обязуется
        в течение 24 часов предоставить подменное транспортное средство аналогичного класса.
        На период простоя оплата аренды приостанавливается. Если подменное ТС не предоставлено
        в течение 48 часов, Арендатор вправе расторгнуть договор в одностороннем порядке."

        Ответ:
        {
          "downtime_compensation_status": "defined",
          "downtime_compensation_details": "оплата аренды приостанавливается на период простоя не по вине Арендатора",
          "replacement_vehicle_status": "defined",
          "replacement_vehicle_details": "Арендодатель предоставляет подменное ТС аналогичного класса в течение 24 часов",
          "payment_suspension_status": "defined",
          "payment_suspension_details": "приостановка оплаты на период простоя; расторжение при непредоставлении подменного ТС в течение 48 часов",
          "downtime_summary_display": "Простой не по вине Арендатора: оплата приостанавливается; подменное ТС за 24 ч (аналогичный класс); расторжение при задержке >48 ч",
          "evidence": [
            {
              "clause_ref": "п. 5.6",
              "quote": "В случае выхода ТС из строя не по вине Арендатора Арендодатель обязуется в течение 24 часов предоставить подменное транспортное средство аналогичного класса. На период простоя оплата аренды приостанавливается."
            }
          ]
        }

        Пример 2 — простой не урегулирован:
        Фрагмент:
        "Арендатор обязуется бережно эксплуатировать ТС."

        Ответ:
        {
          "downtime_compensation_status": "not_defined",
          "downtime_compensation_details": "Не установлено",
          "replacement_vehicle_status": "not_defined",
          "replacement_vehicle_details": "Не установлено",
          "payment_suspension_status": "not_defined",
          "payment_suspension_details": "Не установлено",
          "downtime_summary_display": "Условия простоя и подменного ТС не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о простое ТС, ремонте или неисправности.
        2. Проверь наличие условия о подменном ТС и сроках его предоставления.
        3. Проверь наличие приостановки или пересчёта оплаты.
        4. Сформируй сводку downtime_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "downtime_compensation_status": "<defined / not_defined>",
          "downtime_compensation_details": "<текст или 'Не установлено'>",
          "replacement_vehicle_status": "<defined / not_defined>",
          "replacement_vehicle_details": "<текст или 'Не установлено'>",
          "payment_suspension_status": "<defined / not_defined>",
          "payment_suspension_details": "<текст или 'Не установлено'>",
          "downtime_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "простой ТС подменное транспортное средство подменный автомобиль замена ТС приостановка оплаты время ремонта неисправность поломка не по вине арендатора"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы ГИБДД"
        - "ДТП порядок"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_downtime_and_replacement_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС условия простоя
        транспортного средства: распределение расходов, подменное ТС и приостановку оплаты.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_downtime_and_replacement_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (downtime_compensation_status, replacement_vehicle_status,
              payment_suspension_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - downtime_compensation_status = "not_defined";
           - replacement_vehicle_status = "not_defined";
           - payment_suspension_status = "not_defined";
           - все *_details = "Не установлено";
           - downtime_summary_display = "Условия простоя и подменного ТС не урегулированы";
           - не выполняй остальные шаги.

        1. downtime_compensation_status:
           - "defined" — если условия простоя ТС прямо описаны
             (кто несёт расходы, сохраняется ли оплата);
           - "not_defined" — если не описаны.

        2. downtime_compensation_details:
           Кто несёт расходы за период простоя (оплата сохраняется,
           приостанавливается, пересчитывается).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. replacement_vehicle_status:
           - "defined" — если обязанность предоставить подменное ТС прямо указана;
           - "not_defined" — если не указана.

        4. replacement_vehicle_details:
           Сроки, класс и условия подменного ТС.
           Если данных нет — "Не установлено".

        5. payment_suspension_status:
           - "defined" — если право приостановки оплаты прямо предусмотрено;
           - "not_defined" — если не предусмотрено.

        6. payment_suspension_details:
           Условия приостановки или пересчёта оплаты аренды.
           Если данных нет — "Не установлено".

        7. downtime_summary_display:
            Сводка для DD Grid. Отрази: простой (кто платит), подменное ТС
            (срок, класс), приостановка оплаты. Строится на основе других
            полей — не добавляй данные, которых нет в них.
            Если presence = "missing" — "Условия простоя и подменного ТС не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_downtime_and_replacement_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", downtime_summary_display = "Условия простоя и подменного ТС не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - downtime_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если простой урегулирован только для случая "не по вине Арендатора", а по вине Арендатора — нет, это валидный исход: *_status = "defined", details отражает условие.
        - Если в разных фрагментах указаны противоречивые сроки или условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий простоя, ни подменного ТС,
           ни приостановки оплаты.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             downtime_summary_display = "Условия простоя и подменного ТС не урегулированы".

        2. Только подменное ТС без приостановки оплаты.
           Арендодатель обязуется предоставить подменное ТС, но о приостановке
           или пересчёте оплаты ничего не сказано.
           → presence = "present";
             replacement_vehicle_status = "defined";
             downtime_compensation_status = "not_defined";
             payment_suspension_status = "not_defined";
             downtime_summary_display отражает только подменное ТС.

        3. Противоречие в сроках предоставления.
           В одном пункте "подменное ТС в течение 24 часов",
           в другом — "в течение 3 рабочих дней".
           → presence = "unclear";
             replacement_vehicle_status = "not_defined";
             replacement_vehicle_details = "Не удалось определить".

        4. Простой по вине арендатора.
           Договор разделяет простой по вине Арендодателя (оплата
           приостанавливается) и по вине Арендатора (оплата сохраняется).
           → presence = "present";
             downtime_compensation_status = "defined";
             downtime_compensation_details отражает разделение;
             payment_suspension_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_downtime_and_replacement_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * downtime_summary_display → "Условия простоя и подменного ТС не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * downtime_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_downtime_and_replacement_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования простоя и подменного ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "downtime_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий простоя ТС."
          required: true
          display_in_grid: false
        - name: "downtime_compensation_details"
          type: "string"
          presentation: "fact"
          label: "Оплата при простое ТС"
          description: "Распределение расходов и оплаты аренды в период простоя ТС."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "replacement_vehicle_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подменного ТС."
          required: true
          display_in_grid: false
        - name: "replacement_vehicle_details"
          type: "string"
          presentation: "fact"
          label: "Подменное ТС"
          description: "Обязанность, сроки и класс подменного транспортного средства."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "payment_suspension_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус приостановки оплаты."
          required: true
          display_in_grid: false
        - name: "payment_suspension_details"
          label: "Приостановка арендной платы при простое"
          type: "string"
          presentation: "fact"
          description: "Условия приостановки или пересчёта оплаты аренды (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "downtime_summary_display"
          type: "string"
          presentation: "fact"
          label: "Простой и подменное ТС"
          description: "Сводка условий простоя ТС, подменного автомобиля и приостановки оплаты."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_theft_and_hijacking_check
    name: "Угон / хищение ТС: порядок действий и распределение убытков"
    description: >
      Фактографическая проверка условий на случай угона или хищения ТС:
      порядок действий Арендатора (уведомление полиции, Арендодателя, страховой),
      распределение убытков, освобождение от оплаты аренды с момента угона
      и ответственность за халатность (ст. 614, 616, 640, 648 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "угон"
        - "хищение"
        - "похищение"
        - "кража"
        - "независимое завладение"
        - "противоугонная система"
        - "сигнализация"
        - "освобождение от оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)угон[а-я]*|хищен[а-я]*|похищен[а-я]*"
        - "(?i)противоугонн[а-я]*\\s+систем|сигнализац"
        - "(?i)незаконн[а-я]*\\s+завладе"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются условия на случай угона или хищения ТС.

        Нормативный ориентир:
        - ст. 614, 616 ГК РФ — обязанность арендатора по содержанию имущества.
        - ст. 640 ГК РФ — при аренде с экипажем риск случайной гибели на арендодателе.
        - ст. 648 ГК РФ — при аренде без экипажа риск случайной гибели на арендаторе.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли порядок действий при угоне / хищении ТС (уведомление полиции, Арендодателя, страховой).
        2. Распределены ли убытки в случае угона (кто возмещает стоимость ТС, франшизу КАСКО).
        3. Освобождается ли Арендатор от оплаты аренды с момента угона.
        4. Установлена ли ответственность Арендатора за халатность (оставление ключей, отключение сигнализации).
        5. Сформируй сводное поле theft_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — угон урегулирован:
        Фрагмент:
        "7.8. В случае угона или хищения ТС Арендатор обязан незамедлительно сообщить в полицию,
        уведомить Арендодателя и страховую компанию в течение 2 часов.
        7.9. С момента подтверждения факта угона органами полиции Арендатор освобождается
        от оплаты аренды. Убытки, не покрытые страховым возмещением по КАСКО (включая франшизу),
        возмещаются Арендатором, если угон произошёл по его халатности (оставление ключей в замке зажигания,
        отключение противоугонной системы)."

        Ответ:
        {
          "theft_procedure_status": "defined",
          "theft_procedure_details": "сообщить в полицию, уведомить Арендодателя и страховую в течение 2 часов",
          "theft_liability_status": "defined",
          "theft_liability_details": "убытки не покрытые КАСКО (включая франшизу) возмещает Арендатор при халатности",
          "rent_suspension_on_theft_status": "defined",
          "rent_suspension_on_theft_details": "освобождение от оплаты с момента подтверждения угона полицией",
          "negligence_liability_status": "defined",
          "negligence_liability_details": "ответственность Арендатора при оставлении ключей или отключении сигнализации",
          "theft_summary_display": "Угон: уведомление за 2 ч; аренда не начисляется с подтверждения полицией; убытки сверх КАСКО — на Арендаторе при халатности",
          "evidence": [
            {
              "clause_ref": "п. 7.8–7.9",
              "quote": "В случае угона или хищения ТС Арендатор обязан незамедлительно сообщить в полицию, уведомить Арендодателя и страховую компанию в течение 2 часов. С момента подтверждения факта угона органами полиции Арендатор освобождается от оплаты аренды."
            }
          ]
        }

        Пример 2 — угон не урегулирован:
        Фрагмент:
        "Арендатор несёт риск случайной гибели ТС."

        Ответ:
        {
          "theft_procedure_status": "not_defined",
          "theft_procedure_details": "Не установлено",
          "theft_liability_status": "not_defined",
          "theft_liability_details": "Не установлено",
          "rent_suspension_on_theft_status": "not_defined",
          "rent_suspension_on_theft_details": "Не установлено",
          "negligence_liability_status": "not_defined",
          "negligence_liability_details": "Не установлено",
          "theft_summary_display": "Порядок действий и распределение убытков при угоне не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об угоне, хищении или краже ТС.
        2. Проверь наличие порядка уведомления.
        3. Проверь распределение убытков и франшизы.
        4. Проверь освобождение от оплаты аренды.
        5. Сформируй сводку theft_summary_display.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "theft_procedure_status": "<defined / not_defined>",
          "theft_procedure_details": "<текст или 'Не установлено'>",
          "theft_liability_status": "<defined / not_defined>",
          "theft_liability_details": "<текст или 'Не установлено'>",
          "rent_suspension_on_theft_status": "<defined / not_defined>",
          "rent_suspension_on_theft_details": "<текст или 'Не установлено'>",
          "negligence_liability_status": "<defined / not_defined>",
          "negligence_liability_details": "<текст или 'Не установлено'>",
          "theft_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "угон хищение похищение кража ТС незаконное завладение противоугонная система сигнализация освобождение от оплаты аренда халатность"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "ДТП порядок"
        - "ремонт"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_theft_and_hijacking_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС условия на случай
        угона или хищения: порядок действий, распределение убытков, освобождение от оплаты
        и ответственность за халатность.
        Не анализируй базовую арендную плату, условия КАСКО, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_theft_and_hijacking_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (theft_procedure_status, theft_liability_status,
              rent_suspension_on_theft_status, negligence_liability_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - theft_procedure_status = "not_defined";
           - theft_liability_status = "not_defined";
           - rent_suspension_on_theft_status = "not_defined";
           - negligence_liability_status = "not_defined";
           - все *_details = "Не установлено";
           - theft_summary_display = "Порядок действий и распределение убытков при угоне не урегулированы";
           - не выполняй остальные шаги.

        1. theft_procedure_status:
           - "defined" — если порядок действий при угоне прямо описан
             (уведомление полиции, Арендодателя, страховой);
           - "not_defined" — если не описан.

        2. theft_procedure_details:
           Порядок уведомления полиции, Арендодателя и страховой
           (сроки, способ).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. theft_liability_status:
           - "defined" — если распределение убытков при угоне прямо указано;
           - "not_defined" — если не указано.

        4. theft_liability_details:
           Кто возмещает убытки, не покрытые КАСКО (франшиза, стоимость ТС).
           Если данных нет — "Не установлено".

        5. rent_suspension_on_theft_status:
           - "defined" — если освобождение от оплаты аренды при угоне
             прямо предусмотрено;
           - "not_defined" — если не предусмотрено.

        6. rent_suspension_on_theft_details:
           Условия и момент освобождения от оплаты (например, "с момента
           подтверждения угона полицией").
           Если данных нет — "Не установлено".

        7. negligence_liability_status:
           - "defined" — если ответственность за халатность прямо установлена;
           - "not_defined" — если не установлена.

        8. negligence_liability_details:
           Формулировка об ответственности при халатности (оставление ключей,
           отключение сигнализации).
           Если данных нет — "Не установлено".

        9. theft_summary_display:
            Сводка для DD Grid. Отрази: порядок действий, убытки, оплата,
            халатность. Строится на основе других полей — не добавляй
            данные, которых нет в них.
            Если presence = "missing" — "Порядок действий и распределение
            убытков при угоне не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_theft_and_hijacking_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", theft_summary_display = "Порядок действий и распределение убытков при угоне не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - theft_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Общая фраза "Арендатор несёт риск случайной гибели ТС" без конкретизации порядка действий, убытков и оплаты — все *_status = "not_defined" (это отсылка к диспозитивным нормам, а не договорное регулирование).
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка действий при угоне, ни распределения
           убытков, ни освобождения от оплаты, ни халатности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             theft_summary_display = "Порядок действий и распределение убытков при угоне не урегулированы".

        2. Только порядок действий без распределения убытков.
           Указана обязанность уведомить полицию и Арендодателя, но не
           распределены убытки и не предусмотрено освобождение от оплаты.
           → presence = "present";
             theft_procedure_status = "defined";
             theft_liability_status = "not_defined";
             rent_suspension_on_theft_status = "not_defined";
             theft_summary_display отражает только порядок уведомления.

        3. Противоречие в распределении убытков.
           В одном пункте "убытки возмещает Арендодатель", в другом —
           "Арендатор несёт все расходы, не покрытые КАСКО".
           → presence = "unclear";
             theft_liability_status = "not_defined";
             theft_liability_details = "Не удалось определить".

        4. Угон по халатности арендатора.
           Договор разделяет угон без вины Арендатора (освобождение от
           оплаты, убытки на Арендодателе) и угон по халатности (Арендатор
           возмещает франшизу и стоимость ТС).
           → presence = "present";
             negligence_liability_status = "defined";
             theft_liability_status = "defined";
             rent_suspension_on_theft_status = "defined";
             *_details отражают разделение по вине.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_theft_and_hijacking_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * theft_summary_display → "Порядок действий и распределение убытков при угоне не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * theft_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_theft_and_hijacking_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования угона/хищения ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "theft_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка действий при угоне."
          required: true
          display_in_grid: false
        - name: "theft_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок действий при угоне"
          description: "Уведомление полиции, Арендодателя и страховой при угоне / хищении ТС."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "theft_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения убытков при угоне."
          required: true
          display_in_grid: false
        - name: "theft_liability_details"
          type: "string"
          presentation: "fact"
          label: "Убытки при угоне"
          description: "Распределение убытков, не покрытых КАСКО (франшиза, стоимость ТС)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "rent_suspension_on_theft_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус освобождения от оплаты при угоне."
          required: true
          display_in_grid: false
        - name: "rent_suspension_on_theft_details"
          label: "Приостановка аренды при угоне"
          type: "string"
          presentation: "fact"
          description: "Условия освобождения от оплаты аренды с момента угона (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "negligence_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за халатность."
          required: true
          display_in_grid: false
        - name: "negligence_liability_details"
          label: "Ответственность при грубой неосторожности"
          type: "string"
          presentation: "fact"
          description: "Ответственность Арендатора при халатности (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "theft_summary_display"
          type: "string"
          presentation: "fact"
          label: "Угон / хищение ТС"
          description: "Сводка условий при угоне (порядок действий, убытки, оплата, халатность)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_warranty_and_hidden_defects_check
    name: "Гарантия на ТС и скрытые недостатки"
    description: >
      Фактографическая проверка заверений Арендодателя об отсутствии скрытых
      недостатков ТС, срока для заявления о недостатках, порядка и сроков
      их устранения и ответственности за неустранение (ст. 475, 612 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "скрытые недостатки"
        - "гарантия"
        - "гарантийный срок"
        - "исправное состояние"
        - "дефекты"
        - "недостатки ТС"
        - "устранение недостатков"
        - "уменьшение арендной платы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)скрыт[а-я]*\\s+недостатк"
        - "(?i)гарантийн[а-я]*\\s+срок"
        - "(?i)устранен[а-я]*\\s+недостатк"
        - "(?i)дефект[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяются гарантийные обязательства Арендодателя и условия по скрытым недостаткам ТС.

        Нормативный ориентир:
        - ст. 612 ГК РФ — арендодатель отвечает за недостатки сданного имущества, полностью или
          частично препятствующие пользованию им, даже если во время заключения договора он
          не знал об этих недостатках.
        - ст. 475 ГК РФ — последствия передачи товара ненадлежащего качества (применяется по аналогии).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Даёт ли Арендодатель заверение об отсутствии скрытых недостатков ТС.
        2. Установлен ли срок для заявления Арендатором о выявленных недостатках.
        3. Определён ли порядок и сроки устранения недостатков Арендодателем.
        4. Предусмотрены ли последствия неустранения (уменьшение платы, расторжение, возмещение расходов).
        5. Сформируй сводное поле warranty_summary_display для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и текстовое значение "Не установлено".
        3. Не используй "None", "null" или пустые строки в JSON.
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — гарантия и скрытые недостатки урегулированы:
        Фрагмент:
        "1.6. Арендодатель гарантирует, что на момент передачи ТС не имеет скрытых недостатков,
        препятствующих его нормальной эксплуатации.
        1.7. Арендатор обязан уведомить Арендодателя о выявленных скрытых недостатках в течение
        5 рабочих дней с момента обнаружения. Арендодатель устраняет недостатки за свой счёт
        в течение 3 рабочих дней. При неустранении Арендатор вправе потребовать уменьшения
        арендной платы или возмещения расходов на самостоятельное устранение."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "Арендодатель гарантирует отсутствие скрытых недостатков на момент передачи",
          "defect_notification_status": "defined",
          "defect_notification_details": "уведомление в течение 5 рабочих дней с момента обнаружения",
          "remediation_status": "defined",
          "remediation_details": "устранение за счёт Арендодателя в течение 3 рабочих дней",
          "remediation_consequences_status": "defined",
          "remediation_consequences_details": "уменьшение арендной платы или возмещение расходов на самостоятельное устранение",
          "warranty_summary_display": "Гарантия: без скрытых дефектов | Заявление за 5 дней | Устранение за 3 дня за счёт Арендодателя",
          "evidence": [
            {
              "clause_ref": "п. 1.6–1.7",
              "quote": "Арендодатель гарантирует, что на момент передачи ТС не имеет скрытых недостатков. Арендатор обязан уведомить Арендодателя о выявленных скрытых недостатках в течение 5 рабочих дней с момента обнаружения. Арендодатель устраняет недостатки за свой счёт в течение 3 рабочих дней."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "ТС передаётся в состоянии, соответствующем его возрасту и пробегу."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Не установлено",
          "defect_notification_status": "not_defined",
          "defect_notification_details": "Не установлено",
          "remediation_status": "not_defined",
          "remediation_details": "Не установлено",
          "remediation_consequences_status": "not_defined",
          "remediation_consequences_details": "Не установлено",
          "warranty_summary_display": "Гарантийные обязательства и скрытые недостатки не урегулированы",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт о гарантии или заверении об отсутствии дефектов.
        2. Проверь наличие срока для заявления о недостатках.
        3. Проверь порядок и сроки устранения.
        4. Сформируй сводку warranty_summary_display.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<текст или 'Не установлено'>",
          "defect_notification_status": "<defined / not_defined>",
          "defect_notification_details": "<текст или 'Не установлено'>",
          "remediation_status": "<defined / not_defined>",
          "remediation_details": "<текст или 'Не установлено'>",
          "remediation_consequences_status": "<defined / not_defined>",
          "remediation_consequences_details": "<текст или 'Не установлено'>",
          "warranty_summary_display": "<сводка для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "скрытые недостатки гарантия гарантийный срок исправное состояние дефекты устранение недостатков уменьшение арендной платы"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "ОСАГО"
        - "КАСКО"
        - "ДТП"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.40]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_warranty_and_hidden_defects_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС гарантийные обязательства
        Арендодателя и условия по скрытым недостаткам: заверения, сроки заявления, порядок устранения.
        Не анализируй базовую арендную плату, страхование, ДТП или возврат ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_warranty_and_hidden_defects_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (warranty_status, defect_notification_status,
              remediation_status, remediation_consequences_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - warranty_status = "not_defined";
           - defect_notification_status = "not_defined";
           - remediation_status = "not_defined";
           - remediation_consequences_status = "not_defined";
           - все *_details = "Не установлено";
           - warranty_summary_display = "Гарантийные обязательства и скрытые недостатки не урегулированы";
           - не выполняй остальные шаги.

        1. warranty_status:
           - "defined" — если заверение об отсутствии скрытых недостатков
             прямо дано Арендодателем;
           - "not_defined" — если не дано.

        2. warranty_details:
           Формулировка заверения (например, "гарантирует отсутствие скрытых
           недостатков на момент передачи").
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. defect_notification_status:
           - "defined" — если срок заявления о недостатках прямо установлен;
           - "not_defined" — если не установлен.

        4. defect_notification_details:
           Срок и порядок уведомления (например, "в течение 5 рабочих дней
           с момента обнаружения").
           Если данных нет — "Не установлено".

        5. remediation_status:
           - "defined" — если порядок и сроки устранения прямо описаны;
           - "not_defined" — если не описаны.

        6. remediation_details:
           Сроки, за чей счёт, кто устраняет.
           Если данных нет — "Не установлено".

        7. remediation_consequences_status:
           - "defined" — если последствия неустранения прямо указаны;
           - "not_defined" — если не указаны.

        8. remediation_consequences_details:
           Уменьшение платы, расторжение, возмещение расходов.
           Если данных нет — "Не установлено".

        9. warranty_summary_display:
            Сводка для DD Grid. Отрази: гарантия, срок заявления, устранение,
            последствия. Строится на основе других полей — не добавляй
            данные, которых нет в них.
            Если presence = "missing" — "Гарантийные обязательства и скрытые
            недостатки не урегулированы".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_warranty_and_hidden_defects_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", warranty_summary_display = "Гарантийные обязательства и скрытые недостатки не урегулированы".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - warranty_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Общая фраза "ТС передаётся в исправном состоянии" без конкретных гарантийных обязательств и сроков — warranty_status = "not_defined" (это описание факта, а не заверение).
        - Если в разных фрагментах указаны противоречивые сроки — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантийных заверений, ни сроков заявления,
           ни порядка устранения, ни последствий.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             warranty_summary_display = "Гарантийные обязательства и скрытые недостатки не урегулированы".

        2. Только гарантия без сроков устранения.
           Арендодатель гарантирует отсутствие скрытых недостатков,
           но порядок и сроки устранения не описаны.
           → presence = "present";
             warranty_status = "defined";
             remediation_status = "not_defined";
             remediation_consequences_status = "not_defined";
             warranty_summary_display отражает только гарантию.

        3. Противоречие в сроках.
           В одном пункте "устранение в течение 3 рабочих дней",
           в другом — "в течение 10 календарных дней".
           → presence = "unclear";
             remediation_status = "not_defined";
             remediation_details = "Не удалось определить".

        4. Отсылка к диспозитивным нормам ГК РФ.
           "Ответственность за недостатки ТС определяется в соответствии
           со ст. 612 ГК РФ" без конкретных договорных условий.
           → presence = "present";
             warranty_status = "not_defined" (конкретного заверения нет);
             remediation_status = "not_defined";
             warranty_summary_display = "Ссылка на ст. 612 ГК РФ без конкретных договорных условий".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_warranty_and_hidden_defects_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * warranty_summary_display → "Гарантийные обязательства и скрытые недостатки не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * warranty_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_warranty_and_hidden_defects_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие гарантийных обязательств по скрытым недостаткам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантийных заверений."
          required: true
          display_in_grid: false
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия на ТС"
          description: "Заверение Арендодателя об отсутствии скрытых недостатков."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "defect_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока заявления о недостатках."
          required: true
          display_in_grid: false
        - name: "defect_notification_details"
          label: "Порядок уведомления о дефектах"
          type: "string"
          presentation: "fact"
          description: "Срок и порядок заявления о скрытых недостатках (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "remediation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка устранения."
          required: true
          display_in_grid: false
        - name: "remediation_details"
          type: "string"
          presentation: "fact"
          label: "Устранение недостатков"
          description: "Порядок и сроки устранения недостатков Арендодателем."
          required: false
