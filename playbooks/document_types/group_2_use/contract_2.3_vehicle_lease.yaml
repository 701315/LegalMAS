      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства условия страхования: ОСАГО, КАСКО, распределение расходов,
        ограничения по водителям, франшизу и выгодоприобретателя.
        Не анализируй размер арендной платы, ремонт, штрафы ГИБДД или возврат ТС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. osago_status — "defined" если ОСАГО прямо упомянуто, иначе "not_defined".
        2. osago_details — формулировка об ОСАГО (кто оформляет, платит, круг допущенных водителей).
        3. casco_status — "defined" если КАСКО прямо упомянуто, иначе "not_defined".
        4. casco_details — формулировка о КАСКО (кто оформляет/платит, риски, размер франшизы, выгодоприобретатель).
        5. insurance_cost_allocation_status — "defined" если распределение расходов прямо указано, иначе "not_defined".
        6. insurance_cost_allocation_details — формулировка о распределении расходов на страхование.
        7. beneficiary_status — "defined" если выгодоприобретатель прямо назван, иначе "not_defined".
        8. beneficiary_details — наименование/роль выгодоприобретателя.
        9. insurance_summary_display — краткая сводная строка для таблицы DD Grid.

        Правила заполнения для отсутствующих данных:
        - Статус (*_status): "not_defined".
        - Текстовые детали (*_details): "Не установлено".
        - insurance_summary_display: "Условия страхования не урегулированы".
        </task>

        <context_rules>
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не используй "None", "null" или пустые строки в JSON.
        - Верни строго один JSON-объект. Никакого текста до или после JSON.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

      fields:
        - name: "osago_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ОСАГО."
          required: true
          display_in_grid: false
        - name: "osago_details"
          type: "string"
          presentation: "fact"
          label: "ОСАГО"
          description: "Условия ОСАГО: кто оформляет, плательщик, круг допущенных водителей."
          required: false
          display_in_grid: true
