  - id: vehicle_lease_type_and_subject
    name: "Тип аренды ТС (с экипажем / без экипажа), предмет и арендная плата"
    description: >
      Фактографическая проверка вида аренды ТС (с экипажем / без экипажа),
      описания транспортного средства, типа ТС и размера арендной платы / фрахта.
      Срок аренды извлекается глобальной проверкой term_and_renewal.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "с экипажем"
        - "без экипажа"
        - "фрахтование на время"
        - "транспортное средство"
        - "автомобиль"
        - "арендная плата"
        - "фрахт"
        - "VIN"
        - "государственный регистрационный знак"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)с\\s+экипажем|без\\s+экипажа"
        - "(?i)фрахтовани(е|я)\\s+на\\s+время"
        - "(?i)арендн[а-я]+\\s+плат"
        - "(?i)\\bVIN\\b\\s*[A-HJ-NPR-Z0-9]{17}"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется: вид аренды (с экипажем / без экипажа), описание ТС,
        тип ТС и размер арендной платы / фрахта.

        Нормативный ориентир:
        - ст. 632 ГК РФ — аренда ТС с экипажем (фрахтование на время)
        - ст. 642 ГК РФ — аренда ТС без экипажа
        - ст. 607 ГК РФ — объект аренды
        - ст. 614 ГК РФ — арендная плата

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Срок аренды НЕ извлекай — это покрывается отдельной проверкой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли вид аренды (с экипажем / без экипажа / фрахтование на время).
        2. Какой тип ТС (автомобиль, судно, воздушное судно, спецтехника, иное).
        3. Как описано транспортное средство (марка, модель, год, VIN, госномер
           и иные идентификаторы — то, что указано).
        4. Какой размер арендной платы / фрахта (сумма, период, валюта, НДС).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если данные не указаны прямо — возвращай статус "not_defined"
           и текстовое значение "Данные не определены".
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов/enum)
           и "Данные не определены" (для текстовых полей).
        4. Если арендная плата определяется отсылкой к приложению, графику
           платежей, спецификации или прайс-листу — укажи это в value
           (например, "Согласно Графику платежей (Приложение №2)").
        5. Если ТС описано в приложении или акте приёма-передачи — укажи это
           в vehicle_description_value (например, "Согласно Акту приёма-передачи
           (Приложение №1)").
        6. В evidence включай только текст договора.
        7. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — коммерческая аренда ТС без экипажа, данные определены:
        Фрагмент:
        "1.1. Арендодатель передаёт, а Арендатор принимает во временное
        владение и пользование без экипажа следующее транспортное средство:
        автомобиль грузовой, марка/модель — КАМАЗ-65115, год выпуска — 2021,
        VIN — XTC651150M0123456, государственный регистрационный знак —
        А 123 ВС 77, цвет — белый, категория — C.
        3.1. Арендная плата составляет 185 000 (сто восемьдесят пять тысяч)
        рублей в месяц, в том числе НДС 20% — 30 833 рубля 33 копейки."

        Ответ:
        {
          "lease_type_status": "defined",
          "lease_type_code": "without_crew",
          "lease_type_details": "без экипажа",
          "vehicle_type": "road_vehicle",
          "vehicle_description_status": "defined",
          "vehicle_description_value": "грузовой автомобиль КАМАЗ-65115, 2021 г.в., VIN XTC651150M0123456, гос. знак А 123 ВС 77",
          "rent_amount_status": "defined",
          "rent_amount_value": "185 000 руб./мес. (в т.ч. НДС 20%)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт, а Арендатор принимает во временное владение и пользование без экипажа следующее транспортное средство: автомобиль грузовой, марка/модель — КАМАЗ-65115, год выпуска — 2021, VIN — XTC651150M0123456."
            },
            {
              "clause_ref": "п. 3.1",
              "quote": "Арендная плата составляет 185 000 (сто восемьдесят пять тысяч) рублей в месяц, в том числе НДС 20% — 30 833 рубля 33 копейки."
            }
          ]
        }

        Пример 2 — аренда с экипажем, плата по графику:
        Фрагмент:
        "1.1. Фрахтовщик обязуется предоставить Фрахтователю во временное
        владение и пользование с экипажем автобус Mercedes-Benz Sprinter
        для перевозки сотрудников.
        4.1. Размер фрахта и порядок расчётов определяются согласно
        Графику платежей (Приложение №2 к настоящему договору)."

        Ответ:
        {
          "lease_type_status": "defined",
          "lease_type_code": "with_crew",
          "lease_type_details": "с экипажем (фрахтование на время)",
          "vehicle_type": "road_vehicle",
          "vehicle_description_status": "defined",
          "vehicle_description_value": "автобус Mercedes-Benz Sprinter",
          "rent_amount_status": "defined",
          "rent_amount_value": "Согласно Графику платежей (Приложение №2)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Фрахтовщик обязуется предоставить Фрахтователю во временное владение и пользование с экипажем автобус Mercedes-Benz Sprinter."
            },
            {
              "clause_ref": "п. 4.1",
              "quote": "Размер фрахта и порядок расчётов определяются согласно Графику платежей (Приложение №2 к настоящему договору)."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор аренды транспортного средства."

        Ответ:
        {
          "lease_type_status": "not_defined",
          "lease_type_code": "not_defined",
          "lease_type_details": "Данные не определены",
          "vehicle_type": "not_defined",
          "vehicle_description_status": "not_defined",
          "vehicle_description_value": "Данные не определены",
          "rent_amount_status": "not_defined",
          "rent_amount_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о виде аренды (с экипажем / без экипажа).
        2. Найди прямую цитату с описанием ТС (марка, модель, VIN, госномер).
        3. Найди прямую цитату о размере арендной платы / фрахта.
        4. Если плата определена отсылкой — проверь, что отсылка отражена в value.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "lease_type_status": "<defined / not_defined>",
          "lease_type_code": "<with_crew / without_crew / not_defined>",
          "lease_type_details": "<текст или 'Данные не определены'>",
          "vehicle_type": "<road_vehicle / vessel / aircraft / other / not_defined>",
          "vehicle_description_status": "<defined / not_defined>",
          "vehicle_description_value": "<текст или 'Данные не определены'>",
          "rent_amount_status": "<defined / not_defined>",
          "rent_amount_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "rent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "с экипажем без экипажа фрахтование на время транспортное средство автомобиль арендная плата фрахт размер плата месяц VIN описание предмет"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "ОСАГО"
        - "КАСКО"
        - "штрафы"
        - "ДТП"
        - "ремонт"
        - "возврат"
        - "означает"
        - "в целях настоящего"
        - "страхование"
        - "ответственность"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_lease_type_and_subject_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства: вид аренды, описание ТС, тип ТС и размер арендной платы / фрахта.
        Не извлекай срок аренды — это покрывается отдельной проверкой.
        Не анализируй страхование, ДТП, штрафы, ремонт или ответственность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_lease_type_and_subject_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lease_type_status, vehicle_description_status, rent_amount_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lease_type_status = "not_defined";
           - vehicle_description_status = "not_defined";
           - rent_amount_status = "not_defined";
           - lease_type_code = "not_defined";
           - vehicle_type = "not_defined";
           - lease_type_details = "Данные не определены";
           - vehicle_description_value = "Данные не определены";
           - rent_amount_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. lease_type_status:
           - "defined" — если вид аренды прямо указан (с экипажем, без экипажа,
             фрахтование на время);
           - "not_defined" — если вид аренды прямо не указан.

        2. lease_type_code:
           - "with_crew" — аренда с экипажем / фрахтование на время /
             с услугами по управлению и технической эксплуатации;
           - "without_crew" — аренда без экипажа / арендатор управляет
             самостоятельно;
           - "not_defined" — вид не определён.

        3. lease_type_details:
           Формулировка из договора: "без экипажа", "с экипажем (фрахтование
           на время)" и т.п.
           Если данных нет — "Данные не определены".

        4. vehicle_type:
           - "road_vehicle" — автомобиль, грузовик, автобус, спецтехника,
             прицеп, полуприцеп;
           - "vessel" — морское или речное судно;
           - "aircraft" — воздушное судно;
           - "other" — иное ТС;
           - "not_defined" — не определено.

        5. vehicle_description_status:
           - "defined" — если ТС прямо описано (марка, модель, VIN, госномер
             или отсылка к приложению/акту);
           - "not_defined" — если ТС не описано.

        6. vehicle_description_value:
           Описание ТС: марка, модель, год выпуска, VIN, гос. регистрационный
           знак, категория, цвет — то, что указано.
           Если ТС описано в приложении или акте — укажи отсылку
           (например, "Согласно Акту приёма-передачи (Приложение №1)").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. rent_amount_status:
           - "defined" — если плата прямо указана суммой или определена
             отсылкой к приложению/графику/прайс-листу;
           - "not_defined" — если плата не указана.

        8. rent_amount_value:
           Размер арендной платы / фрахта с указанием периода, валюты и НДС
           (если есть). Если определяется отсылкой — укажи отсылку
           (например, "Согласно Графику платежей (Приложение №2)").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_lease_type_and_subject_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_code/*_type = "not_defined", все *_details/*_value = "Данные не определены".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Не извлекай срок аренды — это покрывается отдельной проверкой.
        - Не извлекай страхование, ДТП, штрафы, ремонт, ответственность.
        - lease_type_code: "with_crew" только при прямом указании на экипаж / фрахтование на время / услуги по управлению. "without_crew" — при прямом указании на отсутствие экипажа или самостоятельное управление арендатором.
        - rent_amount_value: если в договоре указана только отсылка (график, приложение, прайс-лист) без конкретной суммы — это валидный исход, отрази отсылку в value.
        - Если ТС описано в приложении или акте приёма-передачи и это прямо видно из текста — vehicle_description_status = "defined", value содержит отсылку.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида аренды, ни описания ТС, ни арендной платы.
           → presence = "missing";
             все *_status = "not_defined";
             все *_code/*_type = "not_defined";
             все *_details/*_value = "Данные не определены".

        2. Неполное раскрытие темы.
           Вид аренды не указан, но ТС описано и плата установлена
           (или наоборот — вид указан, но ТС не описано).
           → presence = "present";
             соответствующий *_status = "not_defined" для нераскрытой части;
             определённые поля заполняются нормально.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы арендной платы
           или разные описания ТС.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           ТС описано в акте приёма-передачи, плата — в графике платежей,
           вид аренды не указан явно, но следует из структуры договора.
           → presence = "present";
             vehicle_description_status = "defined" (отсылка в value);
             rent_amount_status = "defined" (отсылка в value);
             lease_type_status = "not_defined" если вид прямо не назван.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_lease_type_and_subject_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для lease_type_code используй только: "with_crew", "without_crew", "not_defined".
        - Для vehicle_type используй только: "road_vehicle", "vessel", "aircraft", "other", "not_defined".
        - Fallback при отсутствии данных:
          * lease_type_details → "Данные не определены";
          * vehicle_description_value → "Данные не определены";
          * rent_amount_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_lease_type_and_subject_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по виду аренды / предмету / плате. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lease_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида аренды."
          required: true
          display_in_grid: false
        - name: "lease_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["with_crew", "without_crew", "not_defined"]
          description: "Вид аренды ТС (с экипажем / без экипажа)."
          required: true
          display_in_grid: false
        - name: "lease_type_details"
          type: "string"
          presentation: "fact"
          label: "Вид аренды"
          description: "Формулировка о виде аренды из договора."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "vehicle_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["road_vehicle", "vessel", "aircraft", "other", "not_defined"]
          description: "Тип транспортного средства."
          required: true
          display_in_grid: false
        - name: "vehicle_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания ТС."
          required: true
          display_in_grid: false
        - name: "vehicle_description_value"
          type: "string"
          presentation: "fact"
          label: "Транспортное средство"
          description: "Описание ТС: марка, модель, год, VIN, госномер и иные идентификаторы."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "rent_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания арендной платы."
          required: true
          display_in_grid: false
        - name: "rent_amount_value"
          type: "string"
          presentation: "fact"
          label: "Арендная плата"
          description: "Размер арендной платы / фрахта (сумма, период, валюта, НДС)."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: vehicle_identification_check
    name: "Идентификация ТС: VIN, госномер, ПТС/ЭПТС, СТС, марка, модель"
    description: >
      Фактографическая проверка достаточности идентификации транспортного
      средства: VIN, государственный регистрационный номер, марка, модель,
      год выпуска, ПТС/ЭПТС, СТС. Детализация предмета аренды по ст. 607 ГК РФ.
      Общее описание ТС также извлекается в vehicle_lease_type_and_subject
      (поле vehicle_description_value); данный check даёт разбивку по
      отдельным идентификаторам для проверки полноты индивидуализации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "VIN"
        - "госномер"
        - "государственный регистрационный номер"
        - "государственный регистрационный знак"
        - "марка"
        - "модель"
        - "год выпуска"
        - "ПТС"
        - "ЭПТС"
        - "СТС"
        - "цвет"
        - "номер кузова"
        - "номер шасси"
        - "номер двигателя"
        - "электронный паспорт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)[А-ЯA-Z]\\d{3}[А-ЯA-Z]{2}\\d{2,3}"
        - "(?i)(?:ПТС|ЭПТС|СТС)"
        - "(?i)электронн[а-я]+\\s+паспорт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: достаточность идентификации ТС
        по ключевым признакам (ст. 607 ГК РФ — определённость предмета аренды).

        Нормативный ориентир:
        - ст. 607 ГК РФ — объект аренды должен быть индивидуализирован
        - С 01.11.2020 в РФ выдаются электронные ПТС (ЭПТС); бумажные ПТС
          действуют, если выданы ранее.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора (включая приложения и акты приёма-передачи):
        1. VIN (17-значный код).
        2. Государственный регистрационный номер (госномер / гос. знак).
        3. Марка и модель ТС.
        4. Год выпуска.
        5. Реквизиты ПТС, ЭПТС или СТС (серия, номер, дата выдачи, кем выдан —
           то, что указано).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если данные не указаны прямо — возвращай статус "not_defined"
           и текстовое значение "Данные не определены".
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Данные не определены" (для текстовых полей).
        4. Если ТС идентифицировано в приложении, акте приёма-передачи или
           спецификации — укажи отсылку в соответствующем поле
           (например, "Согласно Акту приёма-передачи (Приложение №1)").
        5. ЭПТС и ПТС — равнозначные варианты; если указан ЭПТС, отрази это
           в pts_sts_details.
        6. Для спецтехники и прицепов VIN может отсутствовать — вместо него
           может быть указан номер кузова, номер шасси или номер двигателя.
           В таком случае vin_status = "not_defined", а фактический номер
           отрази в pts_sts_details с пометкой.
        7. В evidence включай только текст договора.
        8. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ТС полностью идентифицировано (бумажный ПТС):
        Фрагмент:
        "1.2. Характеристики транспортного средства:
        Марка, модель — Toyota Camry, 2.5 AT;
        Год выпуска — 2022;
        VIN — XW7BF4FK70S012345;
        Государственный регистрационный знак — А 123 БВ 777;
        Цвет — белый;
        ПТС: серия 77 УТ, № 123456, выдан 15.03.2022 ГИБДД г. Москвы."

        Ответ:
        {
          "vin_status": "defined",
          "vin_details": "XW7BF4FK70S012345",
          "state_number_status": "defined",
          "state_number_details": "А 123 БВ 777",
          "make_model_status": "defined",
          "make_model_details": "Toyota Camry, 2.5 AT",
          "year_status": "defined",
          "year_details": "2022",
          "pts_sts_status": "defined",
          "pts_sts_details": "ПТС: серия 77 УТ, № 123456, выдан 15.03.2022 ГИБДД г. Москвы",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Марка, модель — Toyota Camry, 2.5 AT; Год выпуска — 2022; VIN — XW7BF4FK70S012345; Государственный регистрационный знак — А 123 БВ 777; ПТС: серия 77 УТ, № 123456, выдан 15.03.2022 ГИБДД г. Москвы."
            }
          ]
        }

        Пример 2 — ЭПТС, данные в акте приёма-передачи:
        Фрагмент:
        "1.1. Арендодатель передаёт Арендатору транспортное средство,
        подробные характеристики которого указаны в Акте приёма-передачи
        (Приложение №1).
        Приложение №1. Акт приёма-передачи.
        Марка/модель: КАМАЗ-65115. Год выпуска: 2021.
        VIN: XTC651150M0123456. Гос. знак: Е 456 КХ 750.
        ЭПТС № 150000123456789 от 20.06.2021."

        Ответ:
        {
          "vin_status": "defined",
          "vin_details": "XTC651150M0123456",
          "state_number_status": "defined",
          "state_number_details": "Е 456 КХ 750",
          "make_model_status": "defined",
          "make_model_details": "КАМАЗ-65115",
          "year_status": "defined",
          "year_details": "2021",
          "pts_sts_status": "defined",
          "pts_sts_details": "ЭПТС № 150000123456789 от 20.06.2021 (согласно Акту приёма-передачи, Приложение №1)",
          "evidence": [
            {
              "clause_ref": "п. 1.1, Приложение №1",
              "quote": "Марка/модель: КАМАЗ-65115. Год выпуска: 2021. VIN: XTC651150M0123456. Гос. знак: Е 456 КХ 750. ЭПТС № 150000123456789 от 20.06.2021."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт Арендатору автомобиль во временное пользование."

        Ответ:
        {
          "vin_status": "not_defined",
          "vin_details": "Данные не определены",
          "state_number_status": "not_defined",
          "state_number_details": "Данные не определены",
          "make_model_status": "not_defined",
          "make_model_details": "Данные не определены",
          "year_status": "not_defined",
          "year_details": "Данные не определены",
          "pts_sts_status": "not_defined",
          "pts_sts_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с VIN (17 символов).
        2. Найди прямую цитату с госномером.
        3. Найди прямую цитату с маркой и моделью.
        4. Найди прямую цитату с годом выпуска.
        5. Найди прямую цитату с ПТС / ЭПТС / СТС.
        6. Если данные в приложении — проверь, что отсылка отражена.
        7. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "vin_status": "<defined / not_defined>",
          "vin_details": "<VIN или 'Данные не определены'>",
          "state_number_status": "<defined / not_defined>",
          "state_number_details": "<госномер или 'Данные не определены'>",
          "make_model_status": "<defined / not_defined>",
          "make_model_details": "<марка и модель или 'Данные не определены'>",
          "year_status": "<defined / not_defined>",
          "year_details": "<год или 'Данные не определены'>",
          "pts_sts_status": "<defined / not_defined>",
          "pts_sts_details": "<ПТС/ЭПТС/СТС или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "VIN госномер государственный регистрационный номер государственный регистрационный знак марка модель год выпуска ПТС ЭПТС СТС номер кузова номер шасси номер двигателя электронный паспорт"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "арендная плата"
        - "срок аренды"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы"
        - "ДТП"
        - "ремонт"
        - "возврат"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "acceptance_act"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_identification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС
        (включая приложения и акты приёма-передачи) идентифицирующие данные
        транспортного средства: VIN, госномер, марку, модель, год выпуска,
        ПТС / ЭПТС / СТС.
        Не анализируй арендную плату, страхование, ДТП, ремонт или ответственность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_identification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (vin_status, state_number_status, make_model_status,
              year_status, pts_sts_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vin_status = "not_defined";
           - state_number_status = "not_defined";
           - make_model_status = "not_defined";
           - year_status = "not_defined";
           - pts_sts_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. vin_status:
           - "defined" — если VIN (17-значный код из букв и цифр) прямо указан;
           - "not_defined" — если VIN не указан или указан не полностью.

        2. vin_details:
           VIN транспортного средства в виде, как он указан в тексте.
           Не вычисляй и не восстанавливай VIN.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. state_number_status:
           - "defined" — если государственный регистрационный номер прямо указан;
           - "not_defined" — если не указан.

        4. state_number_details:
           Госномер в формате из договора.
           Если данных нет — "Данные не определены".

        5. make_model_status:
           - "defined" — если марка и модель прямо указаны;
           - "not_defined" — если указано только общее понятие ("автомобиль",
             "ТС") без марки и модели.

        6. make_model_details:
           Марка и модель ТС (с модификацией, если указана).
           Если данных нет — "Данные не определены".

        7. year_status:
           - "defined" — если год выпуска прямо указан;
           - "not_defined" — если не указан.

        8. year_details:
           Год выпуска (числом).
           Если данных нет — "Данные не определены".

        9. pts_sts_status:
           - "defined" — если ПТС, ЭПТС или СТС прямо указаны (хотя бы одним
             из реквизитов);
           - "not_defined" — если ни один из этих документов не указан.

        10. pts_sts_details:
            Реквизиты документа (тип, серия, номер, дата, кем выдан —
            то, что указано). Для ЭПТС — номер ЭПТС и дата с явной пометкой "ЭПТС".
            Для спецтехники/прицепов без VIN — номер кузова/шасси/двигателя
            с пометкой.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_identification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - vin_status = "defined" только если VIN прямо воспроизведён в тексте (17 символов, буквы и цифры). Не вычисляй и не восстанавливай VIN.
        - ПТС и ЭПТС — равнозначные варианты. Если указан ЭПТС, отрази это в pts_sts_details с явной пометкой "ЭПТС".
        - Для спецтехники и прицепов VIN может отсутствовать. Если вместо VIN указан номер кузова, шасси или двигателя — vin_status = "not_defined", а фактический номер отрази в pts_sts_details.
        - Если идентификаторы вынесены в приложение или акт приёма-передачи — отрази отсылку в соответствующем *_details (например, "Согласно Акту приёма-передачи (Приложение №1)").
        - Если в разных фрагментах указаны разные идентификаторы (например, разные VIN) — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного идентификатора ТС (только общее "автомобиль"
           или "транспортное средство").
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Спецтехника/прицеп без VIN.
           Указаны марка, модель, госномер, но вместо VIN — номер кузова,
           шасси или двигателя.
           → presence = "present";
             vin_status = "not_defined";
             vin_details = "Данные не определены";
             pts_sts_details содержит фактический номер кузова/шасси/двигателя
             с пометкой.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные VIN или разные госномера
           для одного ТС.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Отсылка на приложение / акт приёма-передачи.
           Идентификаторы вынесены в приложение или акт приёма-передачи,
           которые доступны в контексте.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит идентификатор + формулировку отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_identification_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_identification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификаторов ТС в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vin_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания VIN."
          required: true
          display_in_grid: false
        - name: "vin_details"
          type: "string"
          presentation: "fact"
          label: "VIN"
          description: "VIN транспортного средства (17-значный код)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "state_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания госномера."
          required: true
          display_in_grid: false
        - name: "state_number_details"
          type: "string"
          presentation: "fact"
          label: "Госномер"
          description: "Государственный регистрационный номер (гос. знак)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "make_model_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания марки и модели."
          required: true
          display_in_grid: false
        - name: "make_model_details"
          type: "string"
          presentation: "fact"
          label: "Марка и модель"
          description: "Марка и модель ТС (с модификацией, если указана)."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "year_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания года выпуска."
          required: true
          display_in_grid: false
        - name: "year_details"
          type: "string"
          presentation: "fact"
          label: "Год выпуска"
          description: "Год выпуска ТС."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "pts_sts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ПТС / ЭПТС / СТС."
          required: true
          display_in_grid: false
        - name: "pts_sts_details"
          type: "string"
          presentation: "fact"
          label: "ПТС / ЭПТС / СТС"
          description: "Реквизиты ПТС, ЭПТС или СТС (тип, серия, номер, дата, кем выдан)."
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: vehicle_handover_check
    name: "Передача ТС: акт, состояние, пробег, фотофиксация, документы"
    description: >
      Фактографическая проверка порядка передачи ТС арендатору: оформление
      акта приёма-передачи, фиксация технического состояния, показаний
      одометра (пробега), уровня топлива, проведение фотофиксации,
      отражение существующих повреждений и состав передаваемого комплекта
      документов и ключей (ст. 611 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт приема-передачи"
        - "акт приёма-передачи"
        - "акт осмотра"
        - "техническое состояние"
        - "пробег"
        - "одометр"
        - "фотофиксация"
        - "существующие повреждения"
        - "дефектовочная ведомость"
        - "комплект документов"
        - "ключи"
        - "уровень топлива"
        - "запасное колесо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач|осмотр)"
        - "(?i)(?:пробег|одометр)"
        - "(?i)фотофиксац"
        - "(?i)уровень\\s+топлив"
        - "(?i)дефект[а-я]*\\s+ведомост"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок передачи ТС арендатору
        (ст. 611 ГК РФ — исполнение обязанности по передаче имущества).

        Нормативный ориентир:
        - ст. 611 ГК РФ — предоставление имущества арендатору в состоянии,
          соответствующем условиям договора и назначению имущества
        - фиксация состояния, пробега, топлива и повреждений исключает споры
          при возврате ТС (ст. 622 ГК РФ).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли двусторонний акт приёма-передачи (или акт осмотра).
        2. Фиксируется ли техническое состояние при передаче.
        3. Фиксируются ли показания пробега (одометра) и уровень топлива.
        4. Предусмотрена ли фотофиксация состояния ТС.
        5. Фиксируются ли существующие повреждения/дефекты ТС.
        6. Указан ли перечень передаваемых документов (СТС, ПТС/ЭПТС, полис ОСАГО)
           и ключей/оборудования.
        7. Сформируй краткую читаемую сводку порядка передачи для юриста
           в поле handover_summary_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не предусмотрено договором — возвращай статус "not_defined"
           и значение "Не установлено" (для деталей) или отрази отсутствие
           в сводке.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. В evidence включай только текст договора.
        5. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация передачи ТС:
        Фрагмент:
        "2.1. Передача ТС осуществляется по двустороннему Акту приёма-передачи.
        2.2. При передаче стороны фиксируют в Акте техническое состояние ТС,
        показания одометра (пробег), остаток топлива в баке, а также имеющиеся
        сколы, царапины и иные дефекты с приложением фотографий ТС.
        2.3. Одновременно с ТС передаются: оригинал СТС, заверенная копия
        полиса ОСАГО, 2 комплекта ключей, сервисная книжка и знак аварийной остановки."

        Ответ:
        {
          "handover_act_status": "defined",
          "handover_act_details": "двусторонний Акт приёма-передачи",
          "condition_recorded_status": "defined",
          "condition_recorded_details": "техническое состояние фиксируется в акте",
          "mileage_recorded_status": "defined",
          "mileage_recorded_details": "показания одометра (пробег) и остаток топлива в баке",
          "photo_fixation_status": "defined",
          "photo_fixation_details": "приложение фотографий ТС к акту",
          "existing_damage_status": "defined",
          "existing_damage_details": "имеющиеся сколы, царапины и иные дефекты",
          "document_pack_status": "defined",
          "document_pack_details": "оригинал СТС, копия полиса ОСАГО, 2 комплекта ключей, сервисная книжка, знак аварийной остановки",
          "handover_summary_display": "Акт приёма-передачи; состояние, пробег, топливо и дефекты фиксируются с фото; СТС, ОСАГО, 2 комплекта ключей",
          "evidence": [
            {
              "clause_ref": "п. 2.1–2.3",
              "quote": "Передача ТС осуществляется по двустороннему Акту приёма-передачи. При передаче стороны фиксируют в Акте техническое состояние ТС, показания одометра (пробег), остаток топлива в баке, а также имеющиеся сколы, царапины и иные дефекты с приложением фотографий ТС."
            }
          ]
        }

        Пример 2 — частичная фиксация (только акт и документы):
        Фрагмент:
        "3.1. ТС передаётся Арендатору по акту с передачей свидетельства
        о регистрации ТС и одного ключа зажигания."

        Ответ:
        {
          "handover_act_status": "defined",
          "handover_act_details": "акт приёма-передачи",
          "condition_recorded_status": "not_defined",
          "condition_recorded_details": "Не установлено",
          "mileage_recorded_status": "not_defined",
          "mileage_recorded_details": "Не установлено",
          "photo_fixation_status": "not_defined",
          "photo_fixation_details": "Не установлено",
          "existing_damage_status": "not_defined",
          "existing_damage_details": "Не установлено",
          "document_pack_status": "defined",
          "document_pack_details": "свидетельство о регистрации ТС (СТС), 1 ключ зажигания",
          "handover_summary_display": "По акту передачи (СТС, 1 ключ); фиксация состояния, пробега, дефектов и фото не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "ТС передаётся Арендатору по акту с передачей свидетельства о регистрации ТС и одного ключа зажигания."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендодатель обязуется предоставить ТС в пользование Арендатору."

        Ответ:
        {
          "handover_act_status": "not_defined",
          "handover_act_details": "Не установлено",
          "condition_recorded_status": "not_defined",
          "condition_recorded_details": "Не установлено",
          "mileage_recorded_status": "not_defined",
          "mileage_recorded_details": "Не установлено",
          "photo_fixation_status": "not_defined",
          "photo_fixation_details": "Не установлено",
          "existing_damage_status": "not_defined",
          "existing_damage_details": "Не установлено",
          "document_pack_status": "not_defined",
          "document_pack_details": "Не установлено",
          "handover_summary_display": "Порядок передачи ТС не урегулирован",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт об оформлении акта приёма-передачи.
        2. Проверь наличие условий о состоянии, пробеге, топливе, фото, дефектах.
        3. Проверь состав передаваемых документов и ключей.
        4. Сформируй информативное значение handover_summary_display.
        5. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "handover_act_status": "<defined / not_defined>",
          "handover_act_details": "<текст или 'Не установлено'>",
          "condition_recorded_status": "<defined / not_defined>",
          "condition_recorded_details": "<текст или 'Не установлено'>",
          "mileage_recorded_status": "<defined / not_defined>",
          "mileage_recorded_details": "<текст или 'Не установлено'>",
          "photo_fixation_status": "<defined / not_defined>",
          "photo_fixation_details": "<текст или 'Не установлено'>",
          "existing_damage_status": "<defined / not_defined>",
          "existing_damage_details": "<текст или 'Не установлено'>",
          "document_pack_status": "<defined / not_defined>",
          "document_pack_details": "<текст или 'Не установлено'>",
          "handover_summary_display": "<краткая сводка для таблицы DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи акт приема-передачи передача ТС техническое состояние пробег одометр уровень топлива фотофиксация существующие повреждения дефекты комплект документов ключи СТС ПТС ОСАГО"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "арендная плата"
        - "VIN"
        - "госномер"
        - "штрафы"
        - "ДТП"
        - "возврат ТС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "acceptance_act"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_handover_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства порядок передачи ТС: оформление акта, фиксацию состояния,
        пробега/топлива, фотофиксацию, повреждения и передаваемые документы/ключи.
        Не анализируй размер арендной платы, штрафы, ДТП или возврат ТС по окончании аренды.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_handover_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (handover_act_status, condition_recorded_status,
              mileage_recorded_status, photo_fixation_status,
              existing_damage_status, document_pack_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - handover_act_status = "not_defined";
           - condition_recorded_status = "not_defined";
           - mileage_recorded_status = "not_defined";
           - photo_fixation_status = "not_defined";
           - existing_damage_status = "not_defined";
           - document_pack_status = "not_defined";
           - все *_details = "Не установлено";
           - handover_summary_display = "Порядок передачи ТС не урегулирован";
           - не выполняй остальные шаги.

        1. handover_act_status:
           - "defined" — если акт приёма-передачи или акт осмотра прямо предусмотрен;
           - "not_defined" — если не предусмотрен.

        2. handover_act_details:
           Формулировка об акте приёма-передачи (например, "двусторонний Акт
           приёма-передачи", "По Акту приёма-передачи (Приложение №1)").
           Если данных нет — "Не установлено".

        3. condition_recorded_status:
           - "defined" — если техническое состояние прямо фиксируется;
           - "not_defined" — если не фиксируется.

        4. condition_recorded_details:
           Формулировка о фиксации технического состояния.
           Если данных нет — "Не установлено".

        5. mileage_recorded_status:
           - "defined" — если пробег (одометр) или уровень топлива прямо фиксируются;
           - "not_defined" — если не фиксируются.

        6. mileage_recorded_details:
           Формулировка о фиксации пробега и остатка топлива.
           Если данных нет — "Не установлено".

        7. photo_fixation_status:
           - "defined" — если фотофиксация прямо предусмотрена;
           - "not_defined" — если не предусмотрена.

        8. photo_fixation_details:
           Формулировка о фотофиксации.
           Если данных нет — "Не установлено".

        9. existing_damage_status:
           - "defined" — если существующие дефекты/повреждения прямо фиксируются;
           - "not_defined" — если не фиксируются.

        10. existing_damage_details:
            Формулировка о фиксации повреждений.
            Если данных нет — "Не установлено".

        11. document_pack_status:
            - "defined" — если комплект передаваемых документов/ключей прямо указан;
            - "not_defined" — если не указан.

        12. document_pack_details:
            Перечень передаваемых документов (СТС, ПТС/ЭПТС, ОСАГО), ключей
            и доп. оборудования.
            Если данных нет — "Не установлено".

        13. handover_summary_display:
            Читаемая краткая сводка для юриста в таблице DD Grid.
            Отрази ключевые моменты: есть ли акт, что фиксируется (состояние,
            пробег, топливо, дефекты, фото) и какие документы/ключи передаются.
            Если presence = "missing" — "Порядок передачи ТС не урегулирован".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_handover_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", handover_summary_display = "Порядок передачи ТС не урегулирован".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - Если передача осуществляется по акту по форме Приложения — укажи это в handover_act_details (например, "По Акту приёма-передачи (Приложение №1)").
        - handover_summary_display должен содержать только данные из других полей — не добавляй сведения, которых нет в них.
        - Если в разных фрагментах указаны разные условия передачи и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания акта, ни фиксации состояния, ни передачи
           документов (только общая обязанность предоставить ТС).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             handover_summary_display = "Порядок передачи ТС не урегулирован".

        2. Только акт без детализации.
           Указан акт приёма-передачи, но не раскрыто, что в нём фиксируется.
           → presence = "present";
             handover_act_status = "defined";
             остальные *_status = "not_defined";
             *_details для нераскрытых аспектов = "Не установлено";
             handover_summary_display отражает только наличие акта.

        3. Противоречие между фрагментами.
           В разных частях договора разные условия передачи
           (например, один пункт требует фотофиксацию, другой — нет).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Передача по форме Приложения.
           Договор ссылается на форму акта из приложения, где детализируются
           все аспекты фиксации.
           → presence = "present";
             handover_act_status = "defined";
             handover_act_details содержит отсылку
             (например, "По Акту приёма-передачи (Приложение №1)");
             остальные *_status определяются по содержанию приложения,
             если оно доступно в контексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_handover_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * handover_summary_display → "Порядок передачи ТС не урегулирован".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * handover_summary_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_handover_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка передачи ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "handover_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия акта приёма-передачи."
          required: true
          display_in_grid: false
        - name: "handover_act_details"
          label: "Сведения об акте приема-передачи"
          type: "string"
          presentation: "fact"
          description: "Формулировка об акте приёма-передачи (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "condition_recorded_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус фиксации технического состояния."
          required: true
          display_in_grid: false
        - name: "condition_recorded_details"
          label: "Фиксация состояния автомобиля"
          type: "string"
          presentation: "fact"
          description: "Формулировка о фиксации технического состояния (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "mileage_recorded_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус фиксации пробега и топлива."
          required: true
          display_in_grid: false
        - name: "mileage_recorded_details"
          label: "Фиксация пробега"
          type: "string"
          presentation: "fact"
          description: "Формулировка о фиксации пробега и топлива (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "photo_fixation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус фотофиксации."
          required: true
          display_in_grid: false
        - name: "photo_fixation_details"
          label: "Фотофиксация состояния"
          type: "string"
          presentation: "fact"
          description: "Формулировка о фотофиксации (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "existing_damage_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус фиксации существующих повреждений."
          required: true
          display_in_grid: false
        - name: "existing_damage_details"
          label: "Описание имеющихся повреждений"
          type: "string"
          presentation: "fact"
          description: "Формулировка о фиксации повреждений (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "document_pack_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания комплекта документов."
          required: true
          display_in_grid: false
        - name: "document_pack_details"
          label: "Комплект документов на автомобиль"
          type: "string"
          presentation: "fact"
          description: "Перечень документов и ключей (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "handover_summary_display"
          type: "string"
          presentation: "fact"
          label: "Порядок передачи ТС"
          description: "Сводная информация о процедуре передачи ТС (акт, состояние, пробег, топливо, дефекты, фото, документы и ключи)."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: vehicle_title_and_fitness_check
    name: "Титул арендодателя на ТС, исправность и отсутствие обременений"
    description: >
      Фактографическая проверка подтверждения права собственности (или иного
      законного титула, например, субаренды / лизинга) на ТС, технической исправности,
      действующего техосмотра (диагностической карты) и отсутствия
      залога / ареста / прав третьих лиц / запретов на регистрационные действия
      (ст. 608, 612 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "зарегистрировано в ГИБДД"
        - "договор лизинга"
        - "субаренда"
        - "согласие собственника"
        - "исправное техническое состояние"
        - "не в залоге"
        - "не под арестом"
        - "свободно от обременений"
        - "права третьих лиц"
        - "запрет"
        - "действующий техосмотр"
        - "диагностическая карта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)исправн(ое|ого)\\s+техническ(ое|ого)"
        - "(?i)не\\s+(в\\s+)?залоге|не\\s+под\\s+арестом"
        - "(?i)диагностическ(ая|ой)\\s+карт"
        - "(?i)субаренд[а-я]*|лизингодател[а-я]*"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды транспортного средства по §3 Главы 34 ГК РФ.
        Проверяется титул арендодателя на ТС (право собственности, лизинг, субаренда),
        техническая исправность и отсутствие обременений (залог, арест, права третьих лиц).

        Нормативный ориентир:
        - ст. 608 ГК РФ — право сдачи имущества в аренду принадлежит его собственнику.
          Арендодателями также могут быть лица, уполномоченные законом или собственником.
        - ст. 612 ГК РФ — ответственность арендодателя за недостатки сданного в аренду имущества.
        - ст. 613 ГК РФ — права третьих лиц на арендуемое имущество (залог, сервитут и т.п.).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Титул Арендодателя (принадлежит ли ТС ему на праве собственности, праве лизинга,
           или он сдаёт ТС в субаренду).
        2. Есть ли заверение о технической исправности ТС на момент передачи.
        3. Есть ли заверения об отсутствии обременений (не находится ли ТС в залоге,
           не наложен ли арест или запрет на регистрационные действия, свободно ли от прав третьих лиц).
        4. Есть ли указание на действующий техосмотр (диагностическую карту).
        5. Сформируй сводные читаемые поля для DD Grid:
           - encumbrances_display (сводка по залогу, аресту, правам третьих лиц)
           - technical_fitness_display (сводка по исправности и диагностической карте)

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай и не дополняй данные
           из общих знаний.
        2. Если условие не указано прямо — возвращай статус "not_defined"
           и текстовое значение "Не установлено" (для деталей) или отрази отсутствие
           в сводных полях.
        3. Не используй "None", "null" или пустые строки в JSON.
           Для отсутствующих данных используй "not_defined" (для статусов)
           и "Не установлено" (для текстовых деталей).
        4. Если титул Арендодателя подтверждается ссылкой на СТС / ПТС / Договор лизинга —
           отрази это в title_confirmation_details (например, "Собственность (СТС серия 77 12 № 345678)").
        5. В evidence включай только текст договора.
        6. Верни строго один JSON-объект. Никакого текста до или после JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул собственника, заверений об обременениях и ТО нет:
        Фрагмент:
        "1.3. ТС принадлежит Арендодателю на праве собственности.
        1.4. Арендодатель гарантирует, что на момент заключения договора ТС
        находится в исправном состоянии."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "принадлежит Арендодателю на праве собственности",
          "fitness_warranty_status": "defined",
          "fitness_warranty_details": "на момент заключения договора ТС находится в исправном состоянии",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Не установлено",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Не установлено",
          "tech_inspection_status": "not_defined",
          "tech_inspection_details": "Не установлено",
          "encumbrances_display": "Залог/арест: не урегулировано",
          "technical_fitness_display": "Исправно | Техосмотр: не урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 1.3–1.4",
              "quote": "ТС принадлежит Арендодателю на праве собственности. Арендодатель гарантирует, что на момент заключения договора ТС находится в исправном состоянии."
            }
          ]
        }

        Пример 2 — субаренда, полные заверения, техосмотр:
        Фрагмент:
        "1.2. ТС находится во владении Арендодателя на основании договора аренды № 12 от 10.01.2023 г.
        Собственник ТС выразил согласие на передачу ТС в субаренду.
        1.5. ТС предоставляется в исправном состоянии, прошедшим регулярный техосмотр
        (диагностическая карта № 12023050112345 действительна до 01.05.2025).
        1.6. Арендодатель гарантирует, что ТС не находится в залоге, не под арестом,
        свободно от любых прав третьих лиц и запретов."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "Субаренда (договор аренды № 12 от 10.01.2023, согласие собственника получено)",
          "fitness_warranty_status": "defined",
          "fitness_warranty_details": "предоставляется в исправном состоянии",
          "no_pledge_status": "defined",
          "no_pledge_details": "не находится в залоге",
          "no_arrest_status": "defined",
          "no_arrest_details": "не под арестом, свободно от любых запретов",
          "tech_inspection_status": "defined",
          "tech_inspection_details": "техосмотр пройден (диагностическая карта № 12023050112345 до 01.05.2025)",
          "encumbrances_display": "Обременения отсутствуют (залог, арест, запреты, права третьих лиц)",
          "technical_fitness_display": "Исправно | ТО пройдено (диагностическая карта № 12023050112345 до 01.05.2025)",
          "evidence": [
            {
              "clause_ref": "п. 1.2, 1.5–1.6",
              "quote": "ТС находится во владении Арендодателя на основании договора аренды № 12 от 10.01.2023 г. Собственник ТС выразил согласие на передачу ТС в субаренду. ТС предоставляется в исправном состоянии, прошедшим регулярный техосмотр (диагностическая карта № 12023050112345 действительна до 01.05.2025). Арендодатель гарантирует, что ТС не находится в залоге, не под арестом, свободно от любых прав третьих лиц и запретов."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт, а Арендатор принимает ТС."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Не установлено",
          "fitness_warranty_status": "not_defined",
          "fitness_warranty_details": "Не установлено",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Не установлено",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Не установлено",
          "tech_inspection_status": "not_defined",
          "tech_inspection_details": "Не установлено",
          "encumbrances_display": "Не установлено",
          "technical_fitness_display": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди пункт договора о праве собственности, аренде или лизинге ТС Арендодателем.
        2. Проверь наличие заверений об исправности ТС.
        3. Проверь наличие слов "залог", "арест", "запрет", "обременение", "права третьих лиц".
        4. Найди упоминания диагностической карты или техосмотра.
        5. Сформируй итоговые display-поля строго на основе найденного текста.
        6. Если условия отсутствуют — укажи "Не установлено" / "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Не установлено'>",
          "fitness_warranty_status": "<defined / not_defined>",
          "fitness_warranty_details": "<текст или 'Не установлено'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Не установлено'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Не установлено'>",
          "tech_inspection_status": "<defined / not_defined>",
          "tech_inspection_details": "<текст или 'Не установлено'>",
          "encumbrances_display": "<сводка по обременениям для DD Grid>",
          "technical_fitness_display": "<сводка по исправности и ТО для DD Grid>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принадлежит на праве собственности зарегистрировано в ГИБДД лизинг субаренда согласие собственника технически исправное состояние не в залоге не под арестом свободно от обременений права третьих лиц запрет регистрационных действий диагностическая карта техосмотр"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "арендная плата"
        - "срок аренды"
        - "ОСАГО"
        - "КАСКО"
        - "штрафы"
        - "ДТП"
        - "ремонт"
        - "возврат"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vehicle_title_and_fitness_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды транспортного
        средства сведения о титуле Арендодателя (собственность, лизинг, субаренда),
        гарантиях технической исправности и наличии/отсутствии обременений (залог, арест, права третьих лиц).
        Не анализируй арендную плату, страхование, ДТП или условия возврата ТС.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_title_and_fitness_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (title_confirmation_status, fitness_warranty_status,
              no_pledge_status, no_arrest_status, tech_inspection_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - title_confirmation_status = "not_defined";
           - fitness_warranty_status = "not_defined";
           - no_pledge_status = "not_defined";
           - no_arrest_status = "not_defined";
           - tech_inspection_status = "not_defined";
           - все *_details = "Не установлено";
           - encumbrances_display = "Не установлено";
           - technical_fitness_display = "Не установлено";
           - не выполняй остальные шаги.

        1. title_confirmation_status:
           - "defined" — если законный титул Арендодателя на ТС прямо указан
             (собственность, лизинг, субаренда с согласием);
           - "not_defined" — если титул не указан.

        2. title_confirmation_details:
           Формулировка о праве собственности, лизинге или субаренде.
           Если титул подтверждается ссылкой на СТС/ПТС/договор лизинга —
           отрази это (например, "Собственность (СТС серия 77 12 № 345678)").
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. fitness_warranty_status:
           - "defined" — если исправность ТС прямо подтверждена;
           - "not_defined" — если не подтверждена.

        4. fitness_warranty_details:
           Формулировка об исправности.
           Если данных нет — "Не установлено".

        5. no_pledge_status:
           - "defined" — если отсутствие залога прямо гарантировано;
           - "not_defined" — если не гарантировано.

        6. no_pledge_details:
           Формулировка об отсутствии залога.
           Если данных нет — "Не установлено".

        7. no_arrest_status:
           - "defined" — если отсутствие ареста/запретов прямо гарантировано;
           - "not_defined" — если не гарантировано.

        8. no_arrest_details:
           Формулировка об отсутствии ареста/запретов на регистрационные действия.
           Если данных нет — "Не установлено".

        9. tech_inspection_status:
           - "defined" — если прохождение техосмотра / наличие диагностической карты
             прямо указано;
           - "not_defined" — если не указано.

        10. tech_inspection_details:
            Формулировка о техосмотре (номер диагностической карты, срок действия).
            Если данных нет — "Не установлено".

        11. encumbrances_display:
            Краткая сводка по обременениям для DD Grid (залог, арест, права
            третьих лиц, запреты). Строится на основе no_pledge_*, no_arrest_*.
            Если оба not_defined — "Не установлено".
            Если оба defined и обременений нет — "Обременения отсутствуют".
            Если данные противоречивы — "Не удалось определить".

        12. technical_fitness_display:
            Краткая сводка по исправности и техосмотру для DD Grid.
            Строится на основе fitness_warranty_* и tech_inspection_*.
            Если оба not_defined — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_title_and_fitness_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Не установлено", encumbrances_display = "Не установлено", technical_fitness_display = "Не установлено".
        - Используй только текст договора. Не выдумывай и не дополняй данные из общих знаний.
        - При проверке титула: если арендодатель владеет ТС по договору лизинга или аренды (субаренда) — это "defined". Отрази это прямо в title_confirmation_details.
        - encumbrances_display и technical_fitness_display должны содержать только данные из соответствующих status/details-полей — не добавляй сведения, которых нет в них.
        - Если в разных фрагментах указаны противоречивые данные (например, "не в залоге" и "залогодержатель — банк X") — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни титула, ни заверений об исправности, ни обременений,
           ни техосмотра.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Не установлено";
             encumbrances_display = "Не установлено";
             technical_fitness_display = "Не установлено".

        2. Титул указан, но обременения и ТО не раскрыты.
           Арендодатель подтверждает собственность, но нет заверений о залоге,
           аресте и техосмотре.
           → presence = "present";
             title_confirmation_status = "defined";
             no_pledge_status = no_arrest_status = tech_inspection_status = "not_defined";
             encumbrances_display = "Не установлено";
             technical_fitness_display отражает только исправность (если есть).

        3. Противоречие между фрагментами.
           В одном пункте "ТС не в залоге", в другом — "залогодержатель ПАО Банк".
           → presence = "unclear";
             no_pledge_status = "not_defined";
             no_pledge_details = "Не удалось определить";
             encumbrances_display = "Не удалось определить".

        4. Субаренда / лизинг с согласием собственника.
           Арендодатель не собственник, но имеет законное основание (договор
           аренды + согласие собственника, договор лизинга).
           → presence = "present";
             title_confirmation_status = "defined";
             title_confirmation_details содержит формулировку основания
             (например, "Субаренда (договор аренды № 12, согласие собственника)").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_title_and_fitness_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Не установлено";
          * encumbrances_display → "Не установлено";
          * technical_fitness_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * encumbrances_display → "Не удалось определить";
          * technical_fitness_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_title_and_fitness_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений о титуле / исправности / обременениях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "title_confirmation_status"
          type: "string"
