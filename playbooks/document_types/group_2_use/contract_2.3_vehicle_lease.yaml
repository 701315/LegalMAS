          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус КАСКО."
          required: true
          display_in_grid: false
        - name: "casco_details"
          type: "string"
          presentation: "fact"
          label: "КАСКО и выгодоприобретатель"
          description: "Условия КАСКО: риски, плательщик, франшиза, выгодоприобретатель."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "insurance_cost_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на страхование."
          required: true
          display_in_grid: false
        - name: "insurance_cost_allocation_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о распределении расходов на страхование (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "beneficiary_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания выгодоприобретателя."
          required: true
          display_in_grid: false
        - name: "beneficiary_details"
          type: "string"
          presentation: "fact"
          description: "Выгодоприобретатель по полису (внутреннее поле)."
          required: false
          display_in_grid: false
        - name: "insurance_summary_display"
          type: "string"
          presentation: "fact"
