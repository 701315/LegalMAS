      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1100


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды ТС вид аренды,
        описание ТС, тип ТС, срок и арендную плату.
        Не анализируй страхование, ДТП, штрафы или ремонт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. lease_type_status — "defined" если вид аренды прямо указан,
           иначе "not_defined".
        2. lease_type_code — "with_crew" / "without_crew" / "not_defined".
        3. lease_type_details — формулировка.
        4. vehicle_type — "road_vehicle" / "vessel" / "aircraft" / "other" /
           "not_defined".
        5. vehicle_description_status — "defined" если ТС прямо описано,
           иначе "not_defined".
        6. vehicle_description_value — описание ТС.
        7. lease_term_status — "defined" если срок прямо указан,
           иначе "not_defined".
        8. lease_term_value — срок аренды.
        9. rent_amount_status — "defined" если плата прямо указана,
           иначе "not_defined".
        10. rent_amount_value — размер платы.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - lease_type_code:
            - "with_crew" — аренда с экипажем / с услугами по управлению.
            - "without_crew" — аренда без экипажа.
            - "not_defined" — вид не определён.
        - vehicle_type:
            - "road_vehicle" — автомобиль, грузовик, автобус, спецтехника.
            - "vessel" — морское или речное судно.
            - "aircraft" — воздушное судно.
            - "other" — иное ТС.
            - "not_defined" — не определено.
        - Верни только JSON.
        </rules>
      fields:
