          description: "Статус заверения об отсутствии прав третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "no_third_party_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Отсутствие прав третьих лиц"
          description: >
            Прямое заверение об отсутствии прав третьих лиц на объект аренды,
            например: "Свободно от прав третьих лиц".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_insurance_check
    name: "Страхование объекта аренды"
    description: >
      Фактографическая проверка наличия условий страхования:
      кто страхует, что страхуется, выгодоприобретатель,
      минимальная сумма покрытия, срок представления полиса.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "выгодоприобретатель"
        - "страховая сумма"
        - "страховой случай"
        - "имущественное страхование"
        - "страхование ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован"
        - "(?i)страхов(ой|ого)\\s+полис"
        - "(?i)выгодоприобретател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: страхование объекта аренды.

        Нормативный ориентир:
        - ст. 211 ГК РФ — риск случайной гибели
        - ст. 929–930 ГК РФ — имущественное страхование

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи обязанность страхования из общей практики, типа объекта
          или факта его ценности — только из прямой формулировки в тексте.
        - Обе стороны могут страховать разные виды рисков одновременно
          (например, Арендодатель — конструктив здания, Арендатор — отделку
          и оборудование). В этом случае insurance_obligor = "both", а в
          insurance_scope_details укажи оба вида страхования раздельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность застраховать объект.
        2. Кто обязан застраховать.
        3. Что именно страхуется.
        4. Кто является выгодоприобретателем.
        5. Указана ли минимальная страховая сумма.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" / "Не установлено" — если
             условие прямо не указано (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — страхует одна сторона:
        Фрагмент:
        "Арендатор обязан застраховать помещение от пожара и залива на сумму
        не менее 5 000 000 рублей. Выгодоприобретатель — Арендодатель.
        Копия полиса представляется в течение 10 дней."

        Ответ:
        {
          "insurance_obligation_status": "defined",
          "insurance_obligor": "tenant",
          "insurance_obligor_display": "Страхует Арендатор",
          "insurance_scope_status": "defined",
          "insurance_scope_details": "От пожара и залива",
          "beneficiary_status": "defined",
          "beneficiary_details": "Арендодатель",
          "minimum_coverage_status": "defined",
          "minimum_coverage_details": "Не менее 5 000 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 5.5",
              "quote": "Арендатор обязан застраховать помещение от пожара и залива на сумму не менее 5 000 000 рублей. Выгодоприобретатель — Арендодатель."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны используют помещение по назначению."

        Ответ:
        {
          "insurance_obligation_status": "not_defined",
          "insurance_obligor": "not_defined",
          "insurance_obligor_display": "Не установлено",
          "insurance_scope_status": "not_defined",
          "insurance_scope_details": "Не установлен",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Не установлен",
          "minimum_coverage_status": "not_defined",
          "minimum_coverage_details": "Не установлена",
          "evidence": []
        }

        Пример 3 — страхование разделено между сторонами:
        Фрагмент:
        "Арендодатель страхует конструктивные элементы здания. Арендатор
        страхует отделку и оборудование, размещённое в помещении."

        Ответ:
        {
          "insurance_obligation_status": "defined",
          "insurance_obligor": "both",
          "insurance_obligor_display": "Страхуют обе стороны",
          "insurance_scope_status": "defined",
          "insurance_scope_details": "Арендодатель — конструктивные элементы здания; Арендатор — отделка и оборудование",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Не установлен",
          "minimum_coverage_status": "not_defined",
          "minimum_coverage_details": "Не установлена",
          "evidence": [
            {
              "clause_ref": "п. 5.6",
              "quote": "Арендодатель страхует конструктивные элементы здания. Арендатор страхует отделку и оборудование, размещённое в помещении."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности застраховать.
        2. Определи, кто именно обязан страховать — Арендодатель, Арендатор
           или оба (для разных видов рисков раздельно).
        3. Найди прямую цитату о выгодоприобретателе.
        4. Найди прямую цитату о минимальной сумме покрытия.
        5. Если прямой цитаты нет — верни "not_defined". Не выводи обязанность
           страхования из общей практики или типа объекта.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "insurance_obligation_status": "<defined / not_defined>",
          "insurance_obligor": "<landlord / tenant / both / not_defined>",
          "insurance_obligor_display": "<текст или 'Не установлено'>",
          "insurance_scope_status": "<defined / not_defined>",
          "insurance_scope_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "minimum_coverage_status": "<defined / not_defined>",
          "minimum_coverage_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование страховой полис выгодоприобретатель страховая сумма имущественное страхование страхование ответственности страховой случай"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "расторжение"
        - "улучшения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lease_insurance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        страхования объекта: кто страхует, что страхуется, выгодоприобретатель,
        минимальная сумма покрытия.
        Не анализируй ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lease_insurance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (insurance_obligation_status, insurance_scope_status, beneficiary_status,
              minimum_coverage_status) = "defined"
             или сторона insurance_obligor ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_obligation_status = "not_defined";
           - insurance_obligor = "not_defined";
           - insurance_scope_status = "not_defined";
           - beneficiary_status = "not_defined";
           - minimum_coverage_status = "not_defined";
           - insurance_obligor_display = "Не установлено";
           - insurance_scope_details = "Не установлен";
           - beneficiary_details = "Не установлен";
           - minimum_coverage_details = "Не установлена";
           - не выполняй остальные шаги.

        1. insurance_obligation_status:
           - "defined" — если обязанность застраховать объект прямо
             предусмотрена;
           - "not_defined" — если прямо не предусмотрена. Не выводи обязанность
             из общей практики или типа объекта.

        2. insurance_obligor:
           - "landlord" — страхует арендодатель;
           - "tenant" — страхует арендатор;
           - "both" — страхуют обе стороны (в том числе разные виды рисков
             раздельно);
           - "not_defined" — не определено.

        3. insurance_obligor_display:
           Человекочитаемое описание того, кто обязан страховать.
           - "Страхует Арендодатель" — если "landlord";
           - "Страхует Арендатор" — если "tenant";
           - "Страхуют обе стороны" — если "both";
           - "Не установлено" — если "not_defined".

        4. insurance_scope_status:
           - "defined" — если объём страхования (что именно страхуется) прямо
             указан;
           - "not_defined" — если прямо не указан.

        5. insurance_scope_details:
           Краткое user-facing описание объёма страхования.
           - если указан, верни краткое summary, например: "От пожара и залива";
           - если страхование разделено между сторонами, укажи оба вида
             раздельно, например: "Арендодатель — конструктивные элементы
             здания; Арендатор — отделка и оборудование";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        6. beneficiary_status:
           - "defined" — если выгодоприобретатель прямо указан;
           - "not_defined" — если прямо не указан.

        7. beneficiary_details:
           Краткое описание выгодоприобретателя.
           - если указан, верни краткое summary, например: "Арендодатель";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        8. minimum_coverage_status:
           - "defined" — если минимальная страховая сумма прямо указана;
           - "not_defined" — если прямо не указана.

        9. minimum_coverage_details:
           Краткое описание минимальной страховой суммы.
           - если указана, верни краткое summary, например:
             "Не менее 5 000 000 рублей";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_insurance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/display-поля заменяются на соответствующий fallback ("Не установлено" / "Не установлен" / "Не установлена").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Не выводи обязанность страхования из общей практики, типа объекта
          или его ценности — только из прямой формулировки в тексте.
        - Если обе стороны страхуют разные виды рисков — зафиксируй
          insurance_obligor = "both" и опиши оба вида страхования раздельно
          в insurance_scope_details.
        - Не смешивай страхование объекта с ремонтом, арендной платой,
          субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора полностью отсутствуют любые условия о страховании объекта, рисках гибели или страховых суммах.
           → presence = "missing"; все status и enum-поля = "not_defined"; все details/display-поля = соответствующий fallback.

        2. Обязанность без конкретизации параметров.
           "Арендатор обязан заключить договор страхования помещения" (страховая сумма и выгодоприобретатель в договоре не определены).
           → presence = "present"; insurance_obligation_status = "defined", insurance_obligor = "tenant", minimum_coverage_status = "not_defined" (value = "Не установлена"), beneficiary_status = "not_defined" (value = "Не установлен").

        3. Противоречие между фрагментами.
           В пункте 5.1 обязанность застраховать помещение возложена на Арендатора, а в пункте 12.3 указано, что все договоры страхования заключает Арендодатель.
           → presence = "unclear"; insurance_obligation_status = "not_defined"; insurance_scope_details = "Не удалось определить".

        4. Раздельное страхование рисков.
           Арендодатель страхует конструктив здания, а Арендатор — имущество и отделку внутри.
           → presence = "present"; insurance_obligation_status = "defined", insurance_obligor = "both" (display = "Страхуют обе стороны"), insurance_scope_details = "Арендодатель — конструктивные элементы здания; Арендатор — отделка и оборудование".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_insurance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для insurance_obligor используй только: "landlord", "tenant", "both", "not_defined".
        - Fallback при отсутствии данных:
          * insurance_obligor_display → "Не установлено"
          * insurance_scope_details → "Не установлен"
          * beneficiary_details → "Не установлен"
          * minimum_coverage_details → "Не установлена"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_insurance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий страхования объекта аренды. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности застраховать объект. Внутреннее enum-поле."
          required: true

        - name: "insurance_obligor"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["landlord", "tenant", "both", "not_defined"]
          display_in_grid: false
          description: "Кто обязан застраховать. Внутреннее enum-поле."
          required: true

        - name: "insurance_obligor_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кто страхует"
          description: >
            Человекочитаемое описание того, кто обязан застраховать объект:
            "Страхует Арендодатель" / "Страхует Арендатор" /
            "Страхуют обе стороны".
            Fallback: "Не установлено".
          required: false

        - name: "insurance_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания объёма страхования. Внутреннее enum-поле."
          required: true

        - name: "insurance_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Объём страхования"
          description: >
            Краткое описание того, что именно страхуется, например:
            "От пожара и залива", "Арендодатель — конструктивные элементы
            здания; Арендатор — отделка и оборудование".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "beneficiary_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания выгодоприобретателя. Внутреннее enum-поле."
          required: true

        - name: "beneficiary_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Выгодоприобретатель"
          description: >
            Выгодоприобретатель по страховому полису, например: "Арендодатель".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "minimum_coverage_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания минимальной страховой суммы. Внутреннее enum-поле."
          required: true

        - name: "minimum_coverage_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Минимальная страховая сумма"
          description: >
            Минимальная сумма страхового покрытия, например: "Не менее
            5 000 000 рублей".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_liability_and_penalties_check
    name: "Ответственность сторон, неустойки и ограничение ответственности"
    description: >
      Фактографическая проверка наличия в договоре неустоек, штрафов,
      ограничения ответственности и распределения ответственности
      за ущерб третьим лицам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пени"
        - "ответственность"
        - "ограничение ответственности"
        - "возмещение убытков"
        - "ущерб третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк|штраф|пени"
        - "(?i)ограничени(е|я)\\s+ответственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: ответственность сторон, неустойки
        и ограничение ответственности.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - tenant_breach_penalty и landlord_breach_penalty фиксируют штрафы
          именно за специфичные для аренды нарушения (нецелевое использование
          объекта, самовольная перепланировка, порча имущества, нарушение
          режима доступа/содержания объекта) — не любые общие штрафы за
          нарушение договорных обязательств в целом.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку оплаты арендной платы.
        2. Есть ли штраф/неустойка за специфичные для аренды нарушения арендатора
           (нецелевое использование, перепланировка без согласия, порча имущества).
        3. Есть ли штраф/неустойка за специфичные для аренды нарушения арендодателя
           (например, за непредоставление доступа, необоснованное препятствование
           пользованию объектом).
        4. Есть ли общее ограничение (кап) ответственности сторон.
        5. Есть ли распределение ответственности за ущерб третьим лицам,
           возникший в связи с использованием объекта аренды.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлена" / "Не установлено" — если условие прямо не указано
             (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не относи к tenant_breach_penalty/landlord_breach_penalty общие
           штрафы за любое нарушение обязательств без привязки к специфике
           аренды — такие общие штрафы не заполняют эти поля.
        6. Не используй "None", "null", "not_defined" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — lease-specific нарушения определены:
        Фрагмент:
        "За просрочку оплаты — пени 0,1% в день. За нецелевое использование
        помещения — штраф 500 000 руб. Совокупная ответственность Арендодателя
        ограничена размером годовой арендной платы."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "Пени 0,1% в день",
          "tenant_breach_penalty_status": "defined",
          "tenant_breach_penalty_details": "Штраф 500 000 руб. за нецелевое использование помещения",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Не установлено",
          "liability_cap_status": "defined",
          "liability_cap_details": "Ответственность Арендодателя ограничена размером годовой арендной платы",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Не установлено",
          "evidence": [{"clause_ref": "п. 9.1", "quote": "За просрочку оплаты — пени 0,1% в день. За нецелевое использование помещения — штраф 500 000 руб."}]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлена",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Не установлено",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Не установлено",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Не установлено",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — только generic штраф, не lease-specific:
        Фрагмент:
        "За любое нарушение условий настоящего договора виновная сторона
        уплачивает штраф в размере 10 000 рублей."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлена",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Не установлено",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Не установлено",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Не установлено",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку оплаты арендной платы.
        2. Найди прямую цитату о штрафе за специфичное для аренды нарушение
           арендатора — убедись, что нарушение привязано к специфике аренды
           (использование объекта, перепланировка, порча), а не является общим
           штрафом за любое нарушение.
        3. Аналогично для нарушений арендодателя.
        4. Найди прямую цитату об ограничении (капе) ответственности.
        5. Найди прямую цитату о распределении ответственности за ущерб
           третьим лицам в связи с использованием объекта.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "tenant_breach_penalty_status": "<defined / not_defined>",
          "tenant_breach_penalty_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "landlord_breach_penalty_status": "<defined / not_defined>",
          "landlord_breach_penalty_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "third_party_liability_status": "<defined / not_defined>",
          "third_party_liability_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка штраф пени ответственность ограничение ответственности кап возмещение убытков ущерб третьим лицам залив пожар нецелевое использование перепланировка порча имущества"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lease_liability_and_penalties_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды неустойку за
        просрочку оплаты, штрафы за специфичные для аренды нарушения сторон,
        ограничение ответственности и ответственность за ущерб третьим лицам.
        Не анализируй арендную плату, ремонт или субаренду.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lease_liability_and_penalties_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (late_payment_penalty_status, tenant_breach_penalty_status,
              landlord_breach_penalty_status, liability_cap_status,
              third_party_liability_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_payment_penalty_status = "not_defined";
           - tenant_breach_penalty_status = "not_defined";
           - landlord_breach_penalty_status = "not_defined";
           - liability_cap_status = "not_defined";
           - third_party_liability_status = "not_defined";
           - late_payment_penalty_details = "Не установлена";
           - tenant_breach_penalty_details = "Не установлено";
           - landlord_breach_penalty_details = "Не установлено";
           - liability_cap_details = "Не установлено";
           - third_party_liability_details = "Не установлено";
           - не выполняй остальные шаги.

        1. late_payment_penalty_status:
           - "defined" — если неустойка за просрочку оплаты арендной платы
             прямо указана;
           - "not_defined" — если прямо не указана.

        2. late_payment_penalty_details:
           Краткое user-facing описание неустойки за просрочку оплаты.
           - если указана, верни краткое summary, например: "Пени 0,1% в день";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. tenant_breach_penalty_status:
           - "defined" — если штраф/неустойка за специфичное для аренды
             нарушение арендатора (нецелевое использование, самовольная
             перепланировка, порча имущества, нарушение режима доступа) прямо
             указан;
           - "not_defined" — если такого lease-specific штрафа нет. Общий штраф
             за любое нарушение обязательств без привязки к специфике аренды
             не считается "defined".

        4. tenant_breach_penalty_details:
           Краткое описание штрафа за lease-specific нарушение арендатора.
           - если указан, верни краткое summary, например: "Штраф 500 000 руб.
             за нецелевое использование помещения";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. landlord_breach_penalty_status — аналогично п.3, но для нарушений
           арендодателя (например, непредоставление доступа, необоснованное
           препятствование пользованию объектом).

        6. landlord_breach_penalty_details — аналогично п.4, но для нарушений
           арендодателя.

        7. liability_cap_status:
           - "defined" — если общее ограничение (кап) ответственности сторон
             прямо указано;
           - "not_defined" — если прямо не указано.

        8. liability_cap_details:
           Краткое описание ограничения ответственности.
           - если указано, верни краткое summary, например: "Ответственность
             Арендодателя ограничена размером годовой арендной платы";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. third_party_liability_status:
           - "defined" — если распределение ответственности за ущерб третьим
             лицам в связи с использованием объекта аренды прямо указано;
           - "not_defined" — если прямо не указано.

        10. third_party_liability_details:
            Краткое описание распределения ответственности за ущерб третьим
            лицам.
            - если указано, верни краткое summary;
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_liability_and_penalties_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлена" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - tenant_breach_penalty и landlord_breach_penalty фиксируют только
          штрафы за нарушения, специфичные для аренды (использование объекта
          не по назначению, самовольная перепланировка, порча имущества,
          нарушение режима доступа/содержания). Общие штрафы за любое
          нарушение договорных обязательств без такой привязки не заполняют
          эти поля.
        - Не смешивай неустойку за просрочку оплаты с иными штрафами.
        - Не смешивай тему настоящего check с арендной платой, ремонтом
          и субарендой.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре вообще не предусмотрены меры ответственности, штрафы, неустойки и ограничение ответственности.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Общие неспецифичные штрафы.
           "За любое нарушение условий договора виновная сторона выплачивает штраф в размере 10 000 рублей" (нет специфики аренды).
           → presence = "present"; late_payment_penalty_status = "not_defined", tenant_breach_penalty_status = "not_defined", landlord_breach_penalty_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте неустойка за просрочку платежа равна 0,1% в день, а в приложении — 0,5% за каждый день задержки.
           → presence = "unclear"; late_payment_penalty_status = "not_defined"; late_payment_penalty_details = "Не удалось определить".

        4. Односторонний кап ответственности.
           В договоре ограничен размер ответственности только одной стороны (например, Арендодателя).
           → presence = "present"; liability_cap_status = "defined"; liability_cap_details = "Ответственность Арендодателя ограничена размером годовой арендной платы".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_liability_and_penalties_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * late_payment_penalty_details → "Не установлена"
          * tenant_breach_penalty_details → "Не установлено"
          * landlord_breach_penalty_details → "Не установлено"
          * liability_cap_details → "Не установлено"
          * third_party_liability_details → "Не установлено"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_liability_and_penalties_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие положений об ответственности сторон, неустойках и капе ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус неустойки за просрочку оплаты. Внутреннее enum-поле."
          required: true

        - name: "late_payment_penalty_details"
          label: "Штраф за просрочку платежа"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Краткое описание неустойки за просрочку оплаты арендной платы,
            например: "Пени 0,1% в день".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "tenant_breach_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус штрафа за lease-specific нарушение арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_breach_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Штрафы арендатора"
          description: >
            Краткое описание штрафа за специфичное для аренды нарушение
            арендатора (нецелевое использование, перепланировка, порча
            имущества), например: "Штраф 500 000 руб. за нецелевое
            использование помещения".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "landlord_breach_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус штрафа за lease-specific нарушение арендодателя. Внутреннее enum-поле."
          required: true

        - name: "landlord_breach_penalty_details"
          label: "Штраф за нарушения арендодателя"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Краткое описание штрафа за специфичное для аренды нарушение
            арендодателя (например, непредоставление доступа).
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничения ответственности. Внутреннее enum-поле."
          required: true

        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ограничение ответственности"
          description: >
            Краткое описание ограничения (капа) ответственности сторон,
            например: "Ответственность Арендодателя ограничена размером
            годовой арендной платы".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "third_party_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения ответственности за ущерб третьим лицам. Внутреннее enum-поле."
          required: true

        - name: "third_party_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственность перед третьими лицами"
          description: >
            Краткое описание распределения ответственности за ущерб третьим
            лицам в связи с использованием объекта аренды.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_registration_check
    name: "Государственная регистрация договора аренды (ст. 651 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о государственной
      регистрации: кто подаёт, сроки, расходы на регистрацию.
    triggers:
      any: ["long_term_lease", "real_estate_lease"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "регистрация договора аренды"
        - "расходы на регистрацию"
        - "госпошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)Росреестр"
        - "(?i)госпошлин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: государственная регистрация договора
        аренды (не регистрация права собственности арендодателя).

        Нормативный ориентир:
        - ст. 651 ГК РФ — регистрация договора аренды недвижимости сроком > 1 года

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай регистрацию самого договора аренды в Росреестре
          с регистрацией права собственности арендодателя на объект (ЕГРН,
          свидетельство о праве) — это разные регистрационные действия.
          К этому check относится только регистрация именно договора аренды.
        - Не выводи необходимость регистрации из одного лишь срока аренды —
          нужна прямая формулировка в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о государственной регистрации договора аренды.
        2. Кто обязан подать заявление на регистрацию и в какой срок.
        3. Кто несёт расходы на регистрацию / госпошлину.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлена" / "Не установлено" / "Не установлены" — если
             условие прямо не указано (согласуй род и число с существительным
             поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — регистрация урегулирована:
        Фрагмент:
        "Настоящий договор подлежит государственной регистрации в Росреестре.
        Заявление подаёт Арендодатель в течение 10 рабочих дней. Расходы на
        регистрацию стороны несут поровну."

        Ответ:
        {
          "registration_required_status": "defined",
          "registration_required_details": "Подлежит государственной регистрации в Росреестре",
          "registration_applicant_status": "defined",
          "registration_applicant_details": "Арендодатель, в течение 10 рабочих дней",
          "registration_costs_status": "defined",
          "registration_costs_details": "Расходы стороны несут поровну",
          "evidence": [{"clause_ref": "п. 10.1", "quote": "Настоящий договор подлежит государственной регистрации в Росреестре. Заявление подаёт Арендодатель в течение 10 рабочих дней."}]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Срок аренды — 11 месяцев."

        Ответ:
        {
          "registration_required_status": "not_defined",
          "registration_required_details": "Не установлена",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Не установлено",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Не установлены",
          "evidence": []
        }

        Пример 3 — упомянута регистрация права, а не договора:
        Фрагмент:
        "Право собственности Арендодателя зарегистрировано в ЕГРН, запись
        № 77:06:0001001:123-77/001/2020-1."

        Ответ:
        {
          "registration_required_status": "not_defined",
          "registration_required_details": "Не установлена",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Не установлено",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о государственной регистрации договора аренды —
           убедись, что это регистрация именно договора, а не права
           собственности арендодателя на объект.
        2. Найди прямую цитату о том, кто подаёт заявление и в какой срок.
        3. Найди прямую цитату о расходах на регистрацию.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "registration_required_status": "<defined / not_defined>",
          "registration_required_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "registration_applicant_status": "<defined / not_defined>",
          "registration_applicant_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Не установлено' / 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация Росреестр регистрация договора аренды расходы на регистрацию госпошлина заявление о регистрации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "право собственности"
        - "правоустанавливающие документы"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.15
        scope: segment
      retrieval_profile: "registration_check"
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lease_registration_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        государственной регистрации самого договора: необходимость, кто подаёт,
        сроки и расходы.
        Не анализируй арендную плату, ремонт или субаренду.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lease_registration_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (registration_required_status, registration_applicant_status,
              registration_costs_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - registration_required_status = "not_defined";
           - registration_applicant_status = "not_defined";
           - registration_costs_status = "not_defined";
           - registration_required_details = "Не установлена";
           - registration_applicant_details = "Не установлено";
           - registration_costs_details = "Не установлены";
           - не выполняй остальные шаги.

        1. registration_required_status:
           - "defined" — если государственная регистрация договора аренды
             прямо предусмотрена;
           - "not_defined" — если прямо не предусмотрена. Не выводи
             необходимость регистрации из одного лишь срока аренды.

        2. registration_required_details:
           Краткое user-facing описание условия о регистрации.
           - если указано, верни краткое summary, например: "Подлежит
             государственной регистрации в Росреестре";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. registration_applicant_status:
           - "defined" — если подающая заявление сторона и/или срок подачи
             прямо указаны;
           - "not_defined" — если прямо не указаны.

        4. registration_applicant_details:
           Краткое описание того, кто подаёт заявление на регистрацию и в
           какой срок.
           - если указано, верни краткое summary, например: "Арендодатель,
             в течение 10 рабочих дней";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. registration_costs_status:
           - "defined" — если распределение расходов на регистрацию/госпошлину
             прямо указано;
           - "not_defined" — если прямо не указано.

        6. registration_costs_details:
           Краткое описание распределения расходов на регистрацию.
           - если указано, верни краткое summary, например: "Расходы стороны
             несут поровну";
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_registration_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлена" / "Не установлено" / "Не установлены").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Регистрация договора аренды (Росреестр) — это иное регистрационное
          действие, чем регистрация права собственности арендодателя на объект
          (ЕГРН, правоустанавливающие документы). Не заполняй поля этого check
          на основе цитат про регистрацию права собственности — это тема
          другого check.
        - Не выводи необходимость регистрации из одного лишь упоминания срока
          аренды — нужна прямая формулировка о регистрации договора.
        - Не смешивай тему настоящего check с арендной платой, ремонтом
          и субарендой.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминаний государственной регистрации, Росреестра или уплаты госпошлины за регистрацию сделки.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Регистрация титула вместо договора.
           В договоре упомянута запись в ЕГРН о праве собственности арендодателя, но о регистрации договора аренды ничего не сказано.
           → presence = "missing"; все status-поля = "not_defined".

        3. Противоречие между фрагментами.
           В одном разделе обязанность по регистрации возложена на Арендатора, а в другом — на Арендодателя.
           → presence = "unclear"; registration_applicant_status = "not_defined"; registration_applicant_details = "Не удалось определить".

        4. Ссылка на закон без регламентации.
           "Договор подлежит регистрации в случаях, предусмотренных ст. 651 ГК РФ" (сторона и расходы в договоре не определены).
           → presence = "present"; registration_required_status = "not_defined" (value = "Не установлена"), registration_applicant_status = "not_defined" (value = "Не установлено").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_registration_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * registration_required_details → "Не установлена"
          * registration_applicant_details → "Не установлено"
          * registration_costs_details → "Не установлены"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_registration_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие положений о государственной регистрации договора аренды в Росреестре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "registration_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о госрегистрации. Внутреннее enum-поле."
          required: true

        - name: "registration_required_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Госрегистрация"
          description: >
            Краткое описание условия о государственной регистрации договора
            аренды, например: "Подлежит государственной регистрации в Росреестре".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "registration_applicant_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания подающей стороны. Внутреннее enum-поле."
          required: true

        - name: "registration_applicant_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Кто регистрирует"
          description: >
            Краткое описание того, кто подаёт заявление и в какой срок,
            например: "Арендодатель, в течение 10 рабочих дней".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения расходов на регистрацию. Внутреннее enum-поле."
          required: true

        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Расходы на регистрацию"
          description: >
            Краткое описание распределения расходов на регистрацию/госпошлину,
            например: "Расходы стороны несут поровну".
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

      store_payload: true

  - id: risk_of_accidental_loss_check
    name: "Риск случайной гибели или повреждения объекта аренды (ст. 211, 669 ГК РФ)"
    description: >
      Фактографическая проверка распределения риска случайной гибели или
      повреждения объекта аренды в период владения и пользования, а также
      момента перехода этого риска между сторонами. Не относится к состоянию
      объекта на момент передачи (см. отдельный check) и не заменяет проверку
      наличия страхования (см. отдельный check).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "риск утраты"
        - "риск повреждения"
        - "переходит к арендатору"
        - "несёт риск"
        - "случайная гибель имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск[а-я]*\\s+случайн(ой|ого)\\s+(гибел|повреждени|утрат)"
        - "(?i)риск[а-я]*\\s+(гибел|утрат|повреждени)"
        - "(?i)несёт\\s+риск|переходит\\s+риск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: распределение риска случайной гибели
        или повреждения объекта аренды в период владения и пользования, и
        момент перехода этого риска между сторонами.

        Нормативный ориентир:
        - ст. 211 ГК РФ — риск случайной гибели несёт собственник, если иное
          не предусмотрено законом или договором
        - ст. 669 ГК РФ — риск случайной гибели при лизинге (по аналогии для
          иных форм передачи во владение и пользование)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи распределение риска из общей нормы ГК (по умолчанию риск
          несёт собственник) — фиксируй только то, что прямо написано в
          договоре. Если договор молчит, это "not_defined", а не автоматическое
          применение диспозитивной нормы.
        - Не путай это с состоянием объекта на момент передачи (акт
          приёма-передачи, техническое состояние — это отдельная тема) и с
          наличием страхования объекта (страхование — это финансовый
          инструмент покрытия риска, а не сам факт его распределения; договор
          может распределять риск без упоминания страхования, и наоборот).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт риск случайной гибели или повреждения объекта аренды
           в период владения и пользования.
        2. С какого момента этот риск переходит (например, с момента передачи
           по акту, с момента подписания договора, с момента фактического
           начала использования).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлено" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — риск и момент перехода прямо определены:
        Фрагмент:
        "Риск случайной гибели или повреждения объекта аренды переходит
        от Арендодателя к Арендатору с момента подписания акта
        приёма-передачи объекта."

        Ответ:
        {
          "risk_allocation_status": "defined",
          "risk_allocation_code": "tenant",
          "risk_allocation_display": "Несёт Арендатор (с момента передачи)",
          "risk_transfer_moment_status": "defined",
          "risk_transfer_moment_details": "С момента подписания акта приёма-передачи объекта",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Риск случайной гибели или повреждения объекта аренды переходит от Арендодателя к Арендатору с момента подписания акта приёма-передачи объекта."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует объект в соответствии с его назначением."

        Ответ:
        {
          "risk_allocation_status": "not_defined",
          "risk_allocation_code": "not_defined",
          "risk_allocation_display": "Не установлено",
          "risk_transfer_moment_status": "not_defined",
          "risk_transfer_moment_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — упомянуто только страхование, без распределения риска:
        Фрагмент:
        "Арендатор обязан застраховать объект аренды от пожара и залива на
        сумму не менее 5 000 000 рублей."

        Ответ:
        {
          "risk_allocation_status": "not_defined",
          "risk_allocation_code": "not_defined",
          "risk_allocation_display": "Не установлено",
          "risk_transfer_moment_status": "not_defined",
          "risk_transfer_moment_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о том, кто несёт риск случайной гибели или
           повреждения объекта — убедись, что это именно распределение риска,
           а не описание страхования или состояния объекта при передаче.
        2. Найди прямую цитату о моменте перехода риска.
        3. Если прямой цитаты нет — верни "not_defined". Не выводи из общей
           нормы ГК и не додумывай условия.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_code": "<landlord / tenant / not_defined>",
          "risk_allocation_display": "<текст или 'Не установлено'>",
          "risk_transfer_moment_status": "<defined / not_defined>",
          "risk_transfer_moment_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели риск случайного повреждения риск утраты имущества переходит к арендатору несёт риск момент передачи акт приёма-передачи"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "досрочное расторжение"
        - "страхование"
        - "право собственности"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "risk_of_accidental_loss_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды распределение
        риска случайной гибели или повреждения объекта аренды и момент
        перехода этого риска между сторонами.
        Не анализируй состояние объекта при передаче, страхование, ремонт
        или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_of_accidental_loss_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (risk_allocation_status, risk_transfer_moment_status) = "defined"
             или risk_allocation_code ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_allocation_status = "not_defined";
           - risk_allocation_code = "not_defined";
           - risk_transfer_moment_status = "not_defined";
           - risk_allocation_display = "Не установлено";
           - risk_transfer_moment_details = "Не установлено";
           - не выполняй остальные шаги.

        1. risk_allocation_status:
           - "defined" — если риск случайной гибели или повреждения объекта
             прямо распределён между сторонами (кто именно несёт риск);
           - "not_defined" — если прямо не распределён. Не выводи из общей
             диспозитивной нормы ГК (по умолчанию риск несёт собственник).

        2. risk_allocation_code:
           - "landlord" — риск несёт арендодатель;
           - "tenant" — риск несёт арендатор;
           - "not_defined" — не определено.

        3. risk_allocation_display:
           Человекочитаемое описание того, кто несёт риск, с учётом момента
           перехода, если это кратко можно включить.
           - "Несёт Арендодатель" — если "landlord";
           - "Несёт Арендатор" — если "tenant" (можно дополнить кратким
             указанием момента, например: "Несёт Арендатор (с момента
             передачи)", если это не дублирует отдельное поле избыточно);
           - "Не установлено" — если "not_defined".

        4. risk_transfer_moment_status:
           - "defined" — если момент перехода риска прямо указан (например,
             с момента передачи по акту, с момента подписания договора);
           - "not_defined" — если прямо не указан.

        5. risk_transfer_moment_details:
           Краткое описание момента перехода риска.
           - если указан, верни краткое summary, например: "С момента
             подписания акта приёма-передачи объекта";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_of_accidental_loss_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/display-поля заменяются на соответствующий fallback ("Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Не путай распределение риска случайной гибели/повреждения с:
          * состоянием объекта на момент передачи (акт приёма-передачи,
            техническое состояние — это тема другого check);
          * наличием и условиями страхования объекта (страхование — это
            финансовый инструмент покрытия риска, не сам факт его
            распределения; фиксируется в другом check).
        - Если договор молчит о риске случайной гибели, но упоминает
          страхование — это не основание для "defined" в risk_allocation_status.
        - Не смешивай тему настоящего check с ремонтом, арендной платой
          и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствует распределение риска случайной гибели или повреждения объекта.
           → presence = "missing"; все status и enum-поля = "not_defined"; все details/display-поля = "Не установлено".

        2. Упоминание только страхования.
           В договоре закреплена обязанность застраховать имущество, но прямого распределения риска гибели нет.
           → presence = "missing" (так как страхование не распределяет риск напрямую); все status-поля = "not_defined".

        3. Противоречие между фрагментами.
           В разделе 4 риск гибели лежит на Арендаторе с момента приёмки, а в разделе 11 указано, что риск гибели на весь срок аренды сохраняется за Арендодателем.
           → presence = "unclear"; risk_allocation_status = "not_defined"; risk_allocation_code = "not_defined"; risk_transfer_moment_details = "Не удалось определить".

        4. Прямая ссылка на диспозитивную норму ГК РФ.
           "Риск случайной гибели распределяется в соответствии со статьей 211 ГК РФ" (без самостоятельного договорного смещения момента).
           → presence = "present"; risk_allocation_status = "not_defined" (value = "Не установлено").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_of_accidental_loss_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для risk_allocation_code используй только: "landlord", "tenant", "not_defined".
        - Fallback при отсутствии данных:
          * risk_allocation_display → "Не установлено"
          * risk_transfer_moment_details → "Не установлено"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_of_accidental_loss_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования распределения риска случайной гибели объекта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения риска случайной гибели/повреждения. Внутреннее enum-поле."
          required: true

        - name: "risk_allocation_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["landlord", "tenant", "not_defined"]
          display_in_grid: false
          description: "Кто несёт риск случайной гибели/повреждения объекта. Внутреннее enum-поле."
          required: true

        - name: "risk_allocation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кто несёт риск гибели/повреждения"
          description: >
            Человекочитаемое описание того, кто несёт риск случайной гибели
            или повреждения объекта аренды: "Несёт Арендодатель" /
            "Несёт Арендатор".
            Fallback: "Не установлено".
          required: false

        - name: "risk_transfer_moment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания момента перехода риска. Внутреннее enum-поле."
          required: true

        - name: "risk_transfer_moment_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Момент перехода риска"
          description: >
            Краткое описание момента перехода риска случайной гибели или
            повреждения объекта, например: "С момента подписания акта
            приёма-передачи объекта".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_reinstatement_obligations_check
    name: "Восстановительные работы при выезде (возврат в исходное состояние)"
    description: >
      Фактографическая проверка наличия в договоре обязанности арендатора
      вернуть помещение в исходное состояние при выезде: демонтаж перегородок,
      восстановление отделки, заделка отверстий, вывоз мусора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "восстановительные работы"
        - "исходное состояние"
        - "демонтаж перегородок"
        - "восстановление отделки"
        - "возврат в первоначальное состояние"
        - "заделка отверстий"
        - "вывоз мусора"
        - "восстановление при выезде"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)восстанов[а-я]*\\s+состояни"
        - "(?i)демонтаж|восстановлен"
        - "(?i)первоначальн(ое|ого)\\s+состояни"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: обязанность арендатора выполнить
        восстановительные работы при выезде из помещения.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай это с обычным возвратом объекта по акту (Check 7) —
          здесь речь о дополнительных работах: демонтаж, восстановление
          отделки, заделка отверстий после перепланировки.
        - Молчание договора о восстановлении — это "not_defined", а не
          автоматическое отсутствие обязанности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность вернуть помещение в исходное состояние.
        2. Какие конкретно работы требуются (демонтаж, восстановление и т.п.).
        3. Кто несёт расходы на восстановительные работы.
        4. Есть ли срок выполнения восстановительных работ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлена" / "Не установлено" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — восстановление урегулирована:
        Фрагмент:
        "При прекращении договора Арендатор обязан за свой счёт демонтировать
        все возведённые перегородки и восстановить отделку помещения в
        исходное состояние в течение 10 рабочих дней."

        Ответ:
        {
          "reinstatement_obligation_status": "defined",
          "reinstatement_obligation_details": "Обязан вернуть помещение в исходное состояние",
          "reinstatement_scope_status": "defined",
          "reinstatement_scope_details": "Демонтаж перегородок, восстановление отделки",
          "reinstatement_costs_status": "defined",
          "reinstatement_costs_details": "За счёт Арендатора",
          "reinstatement_deadline_status": "defined",
          "reinstatement_deadline_details": "В течение 10 рабочих дней",
          "evidence": [{"clause_ref": "п. 7.3", "quote": "При прекращении договора Арендатор обязан за свой счёт демонтировать все возведённые перегородки и восстановить отделку помещения в исходное состояние в течение 10 рабочих дней."}]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор возвращает помещение по акту приёма-передачи."

        Ответ:
        {
          "reinstatement_obligation_status": "not_defined",
          "reinstatement_obligation_details": "Не установлено",
          "reinstatement_scope_status": "not_defined",
          "reinstatement_scope_details": "Не установлено",
          "reinstatement_costs_status": "not_defined",
          "reinstatement_costs_details": "Не установлено",
          "reinstatement_deadline_status": "not_defined",
          "reinstatement_deadline_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности восстановления.
        2. Найди прямую цитату о конкретных работах (демонтаж, отделка).
        3. Найди прямую цитату о распределении расходов.
        4. Найди прямую цитату о сроке выполнения работ.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "reinstatement_obligation_status": "<defined / not_defined>",
          "reinstatement_obligation_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "reinstatement_scope_status": "<defined / not_defined>",
          "reinstatement_scope_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "reinstatement_costs_status": "<defined / not_defined>",
          "reinstatement_costs_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "reinstatement_deadline_status": "<defined / not_defined>",
          "reinstatement_deadline_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "восстановительные работы исходное состояние демонтаж перегородок восстановление отделки возврат в первоначальное состояние заделка отверстий вывоз мусора при выезде"
      retrieval_profile: "repair_maintenance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "reinstatement_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды обязанность
        арендатора выполнить восстановительные работы при выезде: демонтаж,
        восстановление отделки, расходы и сроки.
        Не анализируй арендную плату, ремонт или субаренду.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. reinstatement_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (reinstatement_obligation_status, reinstatement_scope_status,
              reinstatement_costs_status, reinstatement_deadline_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - reinstatement_obligation_status = "not_defined";
           - reinstatement_scope_status = "not_defined";
           - reinstatement_costs_status = "not_defined";
           - reinstatement_deadline_status = "not_defined";
           - reinstatement_obligation_details = "Не установлено";
           - reinstatement_scope_details = "Не установлено";
           - reinstatement_costs_details = "Не установлено";
           - reinstatement_deadline_details = "Не установлено";
           - не выполняй остальные шаги.

        1. reinstatement_obligation_status:
           - "defined" — если обязанность вернуть помещение в исходное
             состояние прямо предусмотрена;
           - "not_defined" — если прямо не предусмотрена.

        2. reinstatement_obligation_details:
           Краткое user-facing описание обязанности восстановления.
           - если указано, верни краткое summary, например: "Обязан вернуть
             помещение в исходное состояние";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. reinstatement_scope_status:
           - "defined" — если конкретные работы (демонтаж, отделка) прямо
             указаны;
           - "not_defined" — если прямо не указаны.

        4. reinstatement_scope_details:
           Краткое описание конкретных восстановительных работ.
           - если указаны, верни краткое summary, например: "Демонтаж
             перегородок, восстановление отделки";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        5. reinstatement_costs_status:
           - "defined" — если распределение расходов на восстановление
             прямо указано;
           - "not_defined" — если прямо не указано.

        6. reinstatement_costs_details:
           Краткое описание распределения расходов.
           - если указано, верни краткое summary, например: "За счёт
             Арендатора";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        7. reinstatement_deadline_status:
           - "defined" — если срок выполнения работ прямо указан;
           - "not_defined" — если прямо не указан.

        8. reinstatement_deadline_details:
           Краткое описание срока выполнения восстановительных работ.
           - если указан, верни краткое summary, например: "В течение
             10 рабочих дней";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни reinstatement_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Не путай восстановительные работы с обычным возвратом объекта
          по акту (это тема Check 7) — здесь речь о демонтаже и восстановлении
          отделки после перепланировки.
        - Не смешивай тему настоящего check с ремонтом, арендной платой
          и субарендой.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминаний о демонтаже, исходном состоянии или восстановительных ремонтах при выезде.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлено".

        2. Общая фраза о возврате без специфики.
           "Помещение возвращается в том состоянии, в котором Арендатор его получил" (без указания конкретной восстановительной специфики по перепланировкам).
           → presence = "present"; reinstatement_obligation_status = "defined" (value = "Обязан вернуть помещение в исходное состояние"), reinstatement_scope_status = "not_defined" (value = "Не установлено").

        3. Противоречие между фрагментами.
           В разделе 7 написано, что перегородки демонтирует Арендатор за свой счёт, а в разделе 12 — что перегородки остаются в собственности Арендодателя без демонтажа.
           → presence = "unclear"; reinstatement_scope_status = "not_defined"; reinstatement_scope_details = "Не удалось определить".

        4. Обязательство по отдельному регламенту.
           "Демонтажные и восстановительные работы выполняются Арендатором в соответствии с Правилами проведения фит-аут работ Арендодателя."
           → presence = "present"; reinstatement_scope_status = "defined"; value = "Определяется согласно Правилам проведения фит-аут работ Арендодателя".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          reinstatement_obligation_details → "Не установлено"
          reinstatement_scope_details → "Не установлено"
          reinstatement_costs_details → "Не установлено"
          reinstatement_deadline_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reinstatement_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
