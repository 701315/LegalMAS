    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "repairs_and_operational_costs_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды распределение
        ремонтных и эксплуатационных обязанностей: капремонт, текущий ремонт,
        эксплуатационные расходы на содержание объекта и техобслуживание.
        Не анализируй арендную плату, предмет аренды, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. repairs_and_operational_costs_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (capital_repairs_status, current_repairs_status, operational_costs_status,
              maintenance_status) = "defined"
             или стороны аллокации (capital_repairs_allocation, current_repairs_allocation,
              operational_costs_allocation) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - capital_repairs_status = "not_defined";
           - capital_repairs_allocation = "not_defined";
           - current_repairs_status = "not_defined";
           - current_repairs_allocation = "not_defined";
           - operational_costs_status = "not_defined";
           - operational_costs_allocation = "not_defined";
           - maintenance_status = "not_defined";
           - capital_repairs_allocation_display = "Не установлено";
           - capital_repairs_details = "Не установлен";
           - current_repairs_allocation_display = "Не установлено";
           - current_repairs_details = "Не установлен";
           - operational_costs_allocation_display = "Не установлено";
           - operational_costs_details = "Не установлены";
           - maintenance_details = "Не установлено";
           - не выполняй остальные шаги.

        1. capital_repairs_status:
           - "defined" — если обязанность по капитальному ремонту прямо
             распределена и вид ремонта (капитальный) явно назван или однозначно
             вытекает из характера описанных работ;
           - "not_defined" — если не распределена или вид ремонта неясен.

        2. capital_repairs_allocation:
           - "landlord" — обязанность по капремонту возложена на арендодателя;
           - "tenant" — возложена на арендатора;
           - "mixed" — распределена между сторонами;
           - "not_defined" — распределение прямо не определено.

        3. capital_repairs_allocation_display:
           Человекочитаемое описание распределения обязанности по капремонту.
           - "Несёт Арендодатель" — если "landlord";
           - "Несёт Арендатор" — если "tenant";
           - "Распределена между сторонами" — если "mixed";
           - "Не установлено" — если "not_defined".

        4. capital_repairs_details:
           Краткое user-facing описание условий капитального ремонта.
           - если указано, верни краткое summary, например:
             "Капитальный ремонт осуществляется Арендодателем за свой счёт";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. current_repairs_status — аналогично п.1, но для текущего ремонта.

        6. current_repairs_allocation — аналогично п.2, но для текущего ремонта.

        7. current_repairs_allocation_display — аналогично п.3, но для текущего
           ремонта.

        8. current_repairs_details:
           Краткое user-facing описание условий текущего ремонта.
           - если указано, верни краткое summary, например:
             "Текущий ремонт — обязанность Арендатора";
           - если формулировка про "ремонт" не уточняет вид, а по контексту
             нельзя однозначно определить, что речь именно о текущем ремонте —
             "Не удалось определить";
           - если данных нет — "Не установлен".

        9. operational_costs_status:
           - "defined" — если распределение эксплуатационных расходов на
             содержание объекта (охрана, клининг, обслуживание инженерных систем,
             вывоз мусора, страхование объекта и т.п.) прямо указано;
           - "not_defined" — если прямо не указано.
           Важно: не относи к этому полю оплату коммунальных счетов
           (электричество, вода, отопление по счётчикам) — это фиксируется
           отдельно как часть структуры арендной платы, а не как эксплуатационные
           расходы на содержание объекта.

        10. operational_costs_allocation — аналогично п.2, но для эксплуатационных
            расходов на содержание объекта.

        11. operational_costs_allocation_display — аналогично п.3, но для
            эксплуатационных расходов на содержание объекта.

        12. operational_costs_details:
            Краткое user-facing описание эксплуатационных расходов на содержание
            объекта.
            - если указано, верни краткое summary, например:
              "Расходы на охрану и клининг здания несёт Арендодатель";
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        13. maintenance_status:
            - "defined" — если обязанность по техническому обслуживанию прямо
              указана;
            - "not_defined" — если прямо не указана.

        14. maintenance_details:
            Краткое user-facing описание обязанности по техобслуживанию.
            - если указано, верни краткое summary, например:
              "Техническое обслуживание — обязанность Арендатора";
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни repairs_and_operational_costs_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/display-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлено" / "Не установлены").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Общая формулировка "ремонт" без уточнения вида (капитальный или
          текущий) не относится автоматически ни к capital_repairs, ни к
          current_repairs. Относи цитату к конкретному виду только если вид
          явно назван или однозначно вытекает из характера описанных работ.
        - operational_costs_* относится только к расходам на содержание объекта
          в широком смысле (охрана, клининг, обслуживание инженерных систем,
          вывоз мусора, страхование объекта). Не включай сюда оплату
          коммунальных счетов (электричество, вода, отопление по показаниям
          приборов учёта) — это отдельная тема платёжной структуры.
        - Не смешивай условия ремонта и содержания с арендной платой, предметом
          аренды, субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу значения
          одного параметра и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре полностью обойдены вопросы поддержания объекта, ремонтных обязательств и сопутствующего OPEX.
           → presence = "missing"; все status и allocation-поля = "not_defined"; все details/display-поля = соответствующий fallback.

        2. Общие формулировки без деления.
           "Арендатор обязуется своевременно производить ремонт арендуемого Помещения" (без разграничения капремонта/текущего).
           → presence = "present"; capital_repairs_status = "not_defined" (value = "Не установлен"), current_repairs_status = "not_defined" (value = "Не удалось определить", так как сторона указана, но вид ремонта юридически не ясен).

        3. Противоречие между фрагментами.
           В одном месте текущий ремонт Помещения отнесён к обязанностям Арендатора, а в другом — к обязанностям Арендодателя.
           → presence = "unclear"; соответствующий status = "not_defined"; details = "Не удалось определить".

        4. Отсылка на регламенты/соглашения.
           Эксплуатационные расходы и техническое обслуживание распределяются согласно отдельному Договору на эксплуатационное обслуживание.
           → presence = "present"; operational_costs_status = "defined"; value = "Согласно отдельному Договору на эксплуатационное обслуживание".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для repairs_and_operational_costs_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для allocation-полей используй только: "landlord", "tenant", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * capital_repairs_details → "Не установлен"
          * current_repairs_details → "Не установлен"
          * operational_costs_details → "Не установлены"
          * maintenance_details → "Не установлено"
          * все display-поля при "not_defined" → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все details-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "repairs_and_operational_costs_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования обязательств по ремонту, эксплуатации и техническому обслуживанию объекта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "capital_repairs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения обязанности по капремонту. Внутреннее enum-поле."
          required: true

        - name: "capital_repairs_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: "Кто несёт обязанность по капитальному ремонту. Внутреннее enum-поле."
          required: true

        - name: "capital_repairs_allocation_display"
          label: "Расходы на капитальный ремонт"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание того, кто несёт обязанность по капитальному
            ремонту: "Несёт Арендодатель" / "Несёт Арендатор" /
            "Распределена между сторонами".
            Fallback: "Не установлено".
          required: false

        - name: "capital_repairs_details"
          type: "string"
          presentation: "fact"
