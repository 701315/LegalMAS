      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence: 
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды неустойки,
        штрафы, ограничение ответственности и ответственность за ущерб третьим лицам.
        Не анализируй арендную плату, ремонт или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. late_payment_penalty_status — "defined" если неустойка за просрочку оплаты указана.
        2. late_payment_penalty_details — формулировка.
        3. tenant_breach_penalty_status — "defined" если неустойка за иные нарушения арендатора указана.
        4. tenant_breach_penalty_details — формулировка.
        5. landlord_breach_penalty_status — "defined" если неустойка за нарушения арендодателя указана.
        6. landlord_breach_penalty_details — формулировка.
        7. liability_cap_status — "defined" если ограничение ответственности указано.
        8. liability_cap_details — формулировка.
        9. third_party_liability_status — "defined" если ответственность за ущерб третьим лицам распределена.
        10. third_party_liability_details — формулировка.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - Не смешивай неустойку за просрочку с иными штрафами.
        - Верни только JSON.
        </rules>
      fields:
        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за просрочку оплаты."
          required: true
