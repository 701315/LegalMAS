      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: режим улучшений, перепланировки и субаренды.

        Нормативный ориентир:
        - ст. 623 ГК РФ — улучшения арендованного имущества
        - ст. 615 ГК РФ — субаренда и перенаём

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли режим согласования улучшений и перепланировки.
        2. Как определена судьба неотделимых улучшений.
        3. Предусмотрена ли компенсация стоимости улучшений.
        4. Разрешена, запрещена или ограничена субаренда.
        5. Есть ли условие о перенайме.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — режим определён:
        Фрагмент:
        "Перепланировка допускается только с письменного согласия Арендодателя.
        Неотделимые улучшения переходят Арендодателю без компенсации.
        Субаренда допускается с предварительного согласия Арендодателя."

        Ответ:
        {
          "improvements_consent_status": "defined",
          "improvements_consent_details": "перепланировка допускается только с письменного согласия Арендодателя",
          "inseparable_improvements_status": "defined",
          "inseparable_improvements_details": "неотделимые улучшения переходят Арендодателю без компенсации",
          "improvements_compensation_status": "defined",
          "improvements_compensation_details": "без компенсации",
          "sublease_status": "defined",
          "sublease_regime": "allowed_with_consent",
          "sublease_details": "субаренда допускается с предварительного согласия Арендодателя",
          "assignment_status": "not_defined",
          "assignment_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Перепланировка допускается только с письменного согласия Арендодателя. Неотделимые улучшения переходят Арендодателю без компенсации."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует объект по назначению."

        Ответ:
        {
          "improvements_consent_status": "not_defined",
          "improvements_consent_details": "Данные не определены",
          "inseparable_improvements_status": "not_defined",
          "inseparable_improvements_details": "Данные не определены",
          "improvements_compensation_status": "not_defined",
          "improvements_compensation_details": "Данные не определены",
          "sublease_status": "not_defined",
          "sublease_regime": "not_defined",
          "sublease_details": "Данные не определены",
          "assignment_status": "not_defined",
          "assignment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о согласовании улучшений / перепланировки.
        2. Найди прямую цитату о судьбе неотделимых улучшений.
        3. Найди прямую цитату о компенсации улучшений.
        4. Найди прямую цитату о субаренде.
        5. Найди прямую цитату о перенайме.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "improvements_consent_status": "<defined / not_defined>",
