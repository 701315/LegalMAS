          display_in_grid: false
          description: "Статус распределения обязанности по текущему ремонту. Внутреннее enum-поле."
          required: true

        - name: "current_repairs_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: "Кто несёт обязанность по текущему ремонту. Внутреннее enum-поле."
          required: true

        - name: "current_repairs_allocation_display"
          label: "Расходы на текущий ремонт"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание того, кто несёт обязанность по текущему
            ремонту: "Несёт Арендодатель" / "Несёт Арендатор" /
            "Распределена между сторонами".
            Fallback: "Не установлено".
          required: false

        - name: "current_repairs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Текущий ремонт"
          description: >
            Краткое описание условий текущего ремонта, например:
            "Текущий ремонт — обязанность Арендатора".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "operational_costs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения эксплуатационных расходов на содержание объекта. Внутреннее enum-поле."
          required: true

        - name: "operational_costs_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: "Кто несёт эксплуатационные расходы на содержание объекта. Внутреннее enum-поле."
          required: true

        - name: "operational_costs_allocation_display"
          label: "Распределение эксплуатационных расходов"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание того, кто несёт эксплуатационные расходы
            на содержание объекта (охрана, клининг, обслуживание систем).
            Fallback: "Не установлено".
          required: false

        - name: "operational_costs_details"
          label: "Сведения об эксплуатационных расходах"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Описание эксплуатационных расходов на содержание объекта (охрана,
            клининг, обслуживание инженерных систем, вывоз мусора, страхование),
            без учёта коммунальных платежей по счётчикам.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "maintenance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности по техобслуживанию. Внутреннее enum-поле."
          required: true

        - name: "maintenance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Техническое обслуживание"
          description: >
            Краткое описание обязанности по техническому обслуживанию объекта,
            например: "Техническое обслуживание — обязанность Арендатора".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: improvements_and_sublease_check
    name: "Улучшения, перепланировка и субаренда"
    description: >
      Фактографическая проверка порядка согласования улучшений и перепланировки,
      судьбы отделимых и неотделимых улучшений, условий субаренды и перенайма.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "улучшения"
        - "неотделимые улучшения"
        - "отделимые улучшения"
        - "перепланировка"
        - "переоборудование"
        - "субаренда"
        - "перенаем"
        - "с письменного согласия"
        - "компенсация улучшений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неотделим(ые|ых)\\s+улучшени"
        - "(?i)отделим(ые|ых)\\s+улучшени"
        - "(?i)субаренд|перенаем|перепланировк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: режим улучшений, перепланировки и субаренды.

        Нормативный ориентир:
        - ст. 623 ГК РФ — улучшения арендованного имущества
        - ст. 615 ГК РФ — субаренда и перенаём

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отделимые и неотделимые улучшения — разные категории с разным
          правовым режимом. Общая формулировка "улучшения" без уточнения вида
          не относится автоматически к неотделимым улучшениям.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли режим согласования улучшений и перепланировки.
        2. Как определена судьба неотделимых улучшений и предусмотрена ли
           компенсация их стоимости.
        3. Разрешена, запрещена или ограничена субаренда.
        4. Есть ли условие о перенайме.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" / "Не установлено" — если условие
             прямо не указано (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        4. Не путай отделимые и неотделимые улучшения — относи цитату к
           неотделимым только если вид явно назван или однозначно вытекает
           из текста ("неотделимые", "капитальные вложения в объект" и т.п.).
        5. В поле inseparable_improvements_details агрегируй и судьбу улучшений,
           и порядок компенсации в одну краткую формулировку (например:
           "Переходят Арендодателю без компенсации").
        6. Не используй "None", "null", "not_defined" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — режим определён:
        Фрагмент:
        "Перепланировка допускается только с письменного согласия Арендодателя.
        Неотделимые улучшения переходят Арендодателю без компенсации.
        Субаренда допускается с предварительного согласия Арендодателя."

        Ответ:
        {
          "improvements_consent_status": "defined",
          "improvements_consent_details": "Перепланировка допускается только с письменного согласия Арендодателя",
          "inseparable_improvements_status": "defined",
          "inseparable_improvements_details": "Переходят Арендодателю без compensation",
          "improvements_compensation_status": "defined",
          "improvements_compensation_details": "Без компенсации",
          "sublease_status": "defined",
          "sublease_regime": "allowed_with_consent",
          "sublease_regime_display": "Допускается с согласия Арендодателя",
          "sublease_details": "Субаренда допускается с предварительного согласия Арендодателя",
          "assignment_status": "not_defined",
          "assignment_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Перепланировка допускается только с письменного согласия Арендодателя. Неотделимые улучшения переходят Арендодателю без компенсации."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует объект по назначению."

        Ответ:
        {
          "improvements_consent_status": "not_defined",
          "improvements_consent_details": "Не установлен",
          "inseparable_improvements_status": "not_defined",
          "inseparable_improvements_details": "Не установлена",
          "improvements_compensation_status": "not_defined",
          "improvements_compensation_details": "Не установлена",
          "sublease_status": "not_defined",
          "sublease_regime": "not_defined",
          "sublease_regime_display": "Не установлено",
          "sublease_details": "Не установлен",
          "assignment_status": "not_defined",
          "assignment_details": "Не установлен",
          "evidence": []
        }

        Пример 3 — улучшения упомянуты без уточнения вида:
        Фрагмент:
        "Арендатор вправе производить улучшения объекта с согласия Арендодателя."

        Ответ:
        {
          "improvements_consent_status": "defined",
          "improvements_consent_details": "Производятся с согласия Арендодателя",
          "inseparable_improvements_status": "not_defined",
          "inseparable_improvements_details": "Не установлена",
          "improvements_compensation_status": "not_defined",
          "improvements_compensation_details": "Не установлена",
          "sublease_status": "not_defined",
          "sublease_regime": "not_defined",
          "sublease_regime_display": "Не установлено",
          "sublease_details": "Не установлен",
          "assignment_status": "not_defined",
          "assignment_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Арендатор вправе производить улучшения объекта с согласия Арендодателя."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о согласовании улучшений / перепланировки.
        2. Найди прямую цитату о судьбе неотделимых улучшений и компенсации —
           убедись, что вид улучшений (неотделимые) явно назван или однозначно
           вытекает из текста. В inseparable_improvements_details включи
           и судьбу, и компенсацию одной фразой.
        3. Найди прямую цитату о субаренде.
        4. Найди прямую цитату о перенайме.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "improvements_consent_status": "<defined / not_defined>",
          "improvements_consent_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "inseparable_improvements_status": "<defined / not_defined>",
          "inseparable_improvements_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "improvements_compensation_status": "<defined / not_defined>",
          "improvements_compensation_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "sublease_status": "<defined / not_defined>",
          "sublease_regime": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "sublease_regime_display": "<текст или 'Не установлено'>",
          "sublease_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "assignment_status": "<defined / not_defined>",
          "assignment_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "улучшения неотделимые улучшения отделимые улучшения перепланировка переоборудование субаренда перенаем с письменного согласия компенсация стоимости улучшений"
      retrieval_profile: "subletting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "досрочное расторжение"
        - "возврат имущества"
        - "обеспечительный платеж"
        - "преимущественное право"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "improvements_and_sublease_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды режим улучшений,
        перепланировки, субаренды и перенайма.
        Не анализируй ремонт, арендную плату, предмет аренды или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. improvements_and_sublease_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (improvements_consent_status, inseparable_improvements_status,
              improvements_compensation_status, sublease_status, assignment_status) = "defined"
             или субарендный режим sublease_regime ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - improvements_consent_status = "not_defined";
           - inseparable_improvements_status = "not_defined";
           - improvements_compensation_status = "not_defined";
           - sublease_status = "not_defined";
           - sublease_regime = "not_defined";
           - assignment_status = "not_defined";
           - improvements_consent_details = "Не установлен";
           - inseparable_improvements_details = "Не установлена";
           - improvements_compensation_details = "Не установлена";
           - sublease_regime_display = "Не установлено";
           - sublease_details = "Не установлен";
           - assignment_details = "Не установлен";
           - не выполняй остальные шаги.

        1. improvements_consent_status:
           - "defined" — если порядок согласования улучшений/перепланировки
             прямо описан;
           - "not_defined" — если прямо не описан.

        2. improvements_consent_details:
           Краткое user-facing описание порядка согласования.
           - если указан, верни краткое summary, например:
             "Перепланировка допускается только с письменного согласия Арендодателя";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. inseparable_improvements_status:
           - "defined" — если судьба неотделимых улучшений прямо определена
             (вид улучшений — неотделимые — явно назван или однозначно вытекает
             из текста);
           - "not_defined" — если прямо не определена, либо в тексте упомянуты
             улучшения без уточнения вида (отделимые/неотделимые).

        4. inseparable_improvements_details:
           Краткое user-facing описание судьбы неотделимых улучшений
           И порядка их компенсации в одной фразе.
           - если указана, верни краткое summary, например:
             "Переходят Арендодателю без компенсации",
             "Переходят Арендодателю, компенсируются в размере остаточной стоимости";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. improvements_compensation_status:
           - "defined" — если компенсация стоимости улучшений прямо урегулирована;
           - "not_defined" — если прямо не урегулирована.

        6. improvements_compensation_details:
           Краткое user-facing описание условий компенсации.
           - если указана, верни краткое summary, например: "Без компенсации",
             "Компенсируется в размере остаточной стоимости";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. sublease_status:
           - "defined" — если субаренда прямо урегулирована;
           - "not_defined" — если прямо не урегулирована.

        8. sublease_regime:
           - "prohibited" — субаренда прямо запрещена;
           - "allowed_with_consent" — субаренда допускается с согласия арендодателя;
           - "allowed" — субаренда допускается без дополнительного согласия;
           - "not_defined" — субаренда прямо не урегулирована.

        9. sublease_regime_display:
           Человекочитаемое описание режима субаренды на русском языке.
           - "Запрещена" — если "prohibited";
           - "Допускается с согласия Арендодателя" — если "allowed_with_consent";
           - "Допускается без согласия" — если "allowed";
           - "Не установлено" — если "not_defined".

        10. sublease_details:
            Краткое user-facing описание условий субаренды.
            - если указаны, верни краткое summary, например:
              "Субаренда допускается с предварительного согласия Арендодателя";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        11. assignment_status:
            - "defined" — если перенаём прямо урегулирован;
            - "not_defined" — если прямо не урегулирован.

        12. assignment_details:
            Краткое user-facing описание условий перенайма.
            - если указаны, верни краткое summary;
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни improvements_and_sublease_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/display-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлена" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Отделимые и неотделимые улучшения — разные правовые категории.
          Не относи общую формулировку "улучшения" без уточнения вида
          к inseparable_improvements — только если текст явно указывает
          на неотделимый характер улучшений.
        - В поле inseparable_improvements_details агрегируй и судьбу улучшений,
          и порядок компенсации одной краткой фразой. Поле
          improvements_compensation_details заполняй отдельно для полноты
          данных, но в Grid юрист увидит именно inseparable_improvements_details.
        - Не смешивай режим субаренды (передача объекта третьему лицу во
          временное пользование с сохранением арендатора стороной договора)
          с перенаймом (замена арендатора в договоре).
        - Не смешивай ремонт, арендную плату, предмет аренды и расторжение
          with темами настоящего check.
        - Если в разных фрагментах указаны противоречащие друг другу условия
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствуют какие-либо упоминания о перепланировке, улучшениях, субаренде или уступке прав.
           → presence = "missing"; все status и enum-поля = "not_defined"; все details/display-поля = соответствующий fallback.

        2. Общие понятия улучшений без детализации.
           В тексте разрешены "любые улучшения" с письменного согласия, но условия возврата или компенсации неотделимых улучшений не зафиксированы.
           → presence = "present"; improvements_consent_status = "defined" (value = "Производятся с согласия Арендодателя"), inseparable_improvements_status = "not_defined" (value = "Не установлена").

        3. Противоречие между фрагментами.
           В пункте 5.3 субаренда строго запрещена, а в Приложении 1 указано, что Арендатор вправе сдавать площади в субаренду без ограничений.
           → presence = "unclear"; sublease_status = "not_defined"; sublease_details = "Не удалось определить".

        4. Ограничения по закону.
           "Режим субаренды и перенайма определяется в соответствии со статьей 615 Гражданского кодекса РФ" (без самостоятельного договорного регулирования).
           → presence = "present"; sublease_status = "not_defined" (так как это прямая норма закона без договорной конкретики, value = "Не установлен").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для improvements_and_sublease_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для sublease_regime используй только: "prohibited", "allowed_with_consent", "allowed", "not_defined".
        - Fallback при отсутствии данных:
          * improvements_consent_details → "Не установлен"
          * inseparable_improvements_details → "Не установлена"
          * improvements_compensation_details → "Не установлена"
          * sublease_regime_display → "Не установлено"
          * sublease_details → "Не установлен"
          * assignment_details → "Не установлен"
        - Fallback при противоречии или неоднозначности:
          * все details / display поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "improvements_and_sublease_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования перепланировок, улучшений и передачи прав аренды третьим лицам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "improvements_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус регулирования согласования улучшений. Внутреннее enum-поле."
          required: true

        - name: "improvements_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Согласование улучшений"
          description: >
            Краткое описание порядка согласования улучшений и перепланировки,
            например: "Перепланировка допускается только с письменного согласия
            Арендодателя".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "inseparable_improvements_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения судьбы неотделимых улучшений. Внутреннее enum-поле."
          required: true

        - name: "inseparable_improvements_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Неотделимые улучшения и компенсация"
          description: >
            Краткое описание судьбы неотделимых улучшений и порядка компенсации
            в одной фразе, например: "Переходят Арендодателю без компенсации",
            "Переходят Арендодателю, компенсируются в размере остаточной стоимости".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "improvements_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсации стоимости улучшений. Внутреннее enum-поле."
          required: true

        - name: "improvements_compensation_details"
          label: "Сведения о компенсации за улучшения"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Краткое описание условий компенсации стоимости улучшений, например:
            "Без компенсации", "Компенсируется в размере остаточной стоимости".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "sublease_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус регулирования субаренды. Внутреннее enum-поле."
          required: true

        - name: "sublease_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          display_in_grid: false
          description: "Режим субаренды. Внутреннее enum-поле."
          required: true

        - name: "sublease_regime_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Режим субаренды"
          description: >
            Человекочитаемое описание режима субаренды: "Запрещена" /
            "Допускается с согласия Арендодателя" / "Допускается без согласия".
            Fallback: "Не установлено".
          required: false

        - name: "sublease_details"
          label: "Условия субаренды"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Краткое описание условий субаренды, например: "Субаренда допускается
            с предварительного согласия Арендодателя".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "assignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус регулирования перенайма. Внутреннее enum-поле."
          required: true

        - name: "assignment_details"
          label: "Условия переуступки прав аренды"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Краткое описание условий перенайма.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

      store_payload: true

  - id: termination_and_return_check
    name: "Досрочное прекращение аренды, возврат объекта и обеспечительный платёж"
    description: >
      Фактографическая проверка оснований одностороннего отказа / расторжения
      с разбивкой по ролям (арендатор / арендодатель), срока уведомления,
      порядка возврата объекта аренды и механизма возврата / удержания
      обеспечительного платежа при прекращении договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "односторонний отказ"
        - "досрочное расторжение"
        - "уведомление за"
        - "возврат имущества"
        - "возврат объекта"
        - "обеспечительный платеж"
        - "удержание депозита"
        - "возврат депозита"
        - "акт возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)односторонн(ий|его)\\s+отказ"
        - "(?i)досрочн(ое|ого)\\s+расторж"
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)возврат.*имуществ|возврат.*объект"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: основания досрочного прекращения
        с разбивкой по ролям, срок уведомления, возврат объекта и обеспечительный
        платёж при прекращении договора.

        Нормативный ориентир:
        - ст. 619–620 ГК РФ — досрочное расторжение
        - ст. 622 ГК РФ — возврат арендованного имущества
        - ст. 381.1 ГК РФ — обеспечительный платёж

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Фиксируй основания досрочного прекращения раздельно для арендатора
          и для арендодателя — с фокусом именно на том, что предусмотрено
          конкретно для каждой роли. Не смешивай их в одно общее описание
          и не подменяй ролевую специфику общими/взаимными основаниями
          расторжения (соглашение сторон, форс-мажор и т.п. фиксируются
          в другом check).
        - deposit_refund_details касается только механизма возврата, удержания
          или зачёта обеспечительного платежа при прекращении договора — не сам
          факт наличия и размер депозита (это фиксируется в другом check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право арендатора на досрочное прекращение и его условия.
        2. Есть ли право арендодателя на досрочное прекращение и его условия.
        3. Какой срок уведомления о досрочном прекращении.
        4. Есть ли порядок возврата объекта аренды.
        5. Есть ли механизм возврата / удержания обеспечительного платежа при
           прекращении договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" — если условие прямо не указано (согласуй род
             с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены раздельно по ролям:
        Фрагмент:
        "Арендатор вправе в одностороннем порядке отказаться от договора,
        уведомив Арендодателя за 3 месяца. Арендодатель вправе расторгнуть
        договор при нарушении арендатором обязанности по оплате более 2 месяцев
        подряд. Объект возвращается по акту возврата. Обеспечительный платёж
        засчитывается в счёт последнего месяца аренды."

        Ответ:
        {
          "tenant_termination_status": "defined",
          "tenant_termination_details": "Вправе отказаться в одностороннем порядке, уведомив за 3 месяца",
          "landlord_termination_status": "defined",
          "landlord_termination_details": "Вправе расторгнуть при нарушении оплаты более 2 месяцев подряд",
          "notice_period_status": "defined",
          "notice_period_details": "3 месяца (для одностороннего отказа Арендатора)",
          "return_procedure_status": "defined",
          "return_procedure_details": "Возврат объекта по акту возврата",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "Засчитывается в счёт последнего месяца аренды",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Арендатор вправе в одностороннем порядке отказаться от договора, уведомив Арендодателя за 3 месяца."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "tenant_termination_status": "not_defined",
          "tenant_termination_details": "Не установлен",
          "landlord_termination_status": "not_defined",
          "landlord_termination_details": "Не установлен",
          "notice_period_status": "not_defined",
          "notice_period_details": "Не установлен",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Не установлен",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Не установлен",
          "evidence": []
        }

        Пример 3 — только взаимное основание, без ролевой специфики:
        Фрагмент:
        "Договор может быть расторгнут досрочно по соглашению сторон
        или в случаях, предусмотренных законодательством."

        Ответ:
        {
          "tenant_termination_status": "not_defined",
          "tenant_termination_details": "Не установлен",
          "landlord_termination_status": "not_defined",
          "landlord_termination_details": "Не установлен",
          "notice_period_status": "not_defined",
          "notice_period_details": "Не установлен",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Не установлен",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве арендатора на досрочное прекращение —
           убедись, что она относится именно к арендатору, а не к обеим сторонам
           одновременно.
        2. Найди прямую цитату о праве арендодателя на досрочное прекращение —
           аналогично, только про арендодателя.
        3. Если основание расторжения общее/взаимное (соглашение сторон,
           форс-мажор) без привязки к конкретной роли — не заполняй
           tenant_termination_details/landlord_termination_details на основе
           этой цитаты.
        4. Найди прямую цитату о сроке уведомления, и если сроки разные для
           разных оснований — зафиксируй тот, что относится к одностороннему
           отказу, и укажи привязку к роли в тексте значения.
        5. Найди прямую цитату о порядке возврата объекта.
        6. Найди прямую цитату о возврате/удержании/зачёте обеспечительного
           платежа при прекращении — не сумму депозита, а именно механизм.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "tenant_termination_status": "<defined / not_defined>",
          "tenant_termination_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "landlord_termination_status": "<defined / not_defined>",
          "landlord_termination_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "deposit_refund_status": "<defined / not_defined>",
          "deposit_refund_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "односторонний отказ досрочное расторжение уведомление за возврат имущества возврат объекта обеспечительный платёж удержание депозита возврат депозита акт возврата"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "преимущественное право"
        - "продление"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.90]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "termination_and_return_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды основания
        досрочного прекращения раздельно для арендатора и арендодателя, срок
        уведомления, порядок возврата объекта и механизм возврата / удержания
        обеспечительного платежа при прекращении договора.
        Не анализируй предмет аренды, арендную плату, ремонт или субаренду.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_return_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (tenant_termination_status, landlord_termination_status, notice_period_status,
              return_procedure_status, deposit_refund_status) = "defined";
           - "missing" — если все эти содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tenant_termination_status = "not_defined";
           - landlord_termination_status = "not_defined";
           - notice_period_status = "not_defined";
           - return_procedure_status = "not_defined";
           - deposit_refund_status = "not_defined";
           - tenant_termination_details = "Не установлен";
           - landlord_termination_details = "Не установлен";
           - notice_period_details = "Не установлен";
           - return_procedure_details = "Не установлен";
           - deposit_refund_details = "Не установлен";
           - не выполняй остальные шаги.

        1. tenant_termination_status:
           - "defined" — если право арендатора на досрочное прекращение прямо
             предусмотрено (именно для арендатора, не общее/взаимное основание);
           - "not_defined" — если прямо не предусмотрено.

        2. tenant_termination_details:
           Краткое user-facing описание оснований и условий досрочного
           прекращения именно арендатором.
           - если указано, верни краткое summary, например:
             "Вправе отказаться в одностороннем порядке, уведомив за 3 месяца";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. landlord_termination_status:
           - "defined" — если право арендодателя на досрочное прекращение прямо
             предусмотрено (именно для арендодателя, не общее/взаимное основание);
           - "not_defined" — если прямо не предусмотрено.

        4. landlord_termination_details:
           Краткое user-facing описание оснований и условий досрочного
           прекращения именно арендодателем.
           - если указано, верни краткое summary, например:
             "Вправе расторгнуть при нарушении оплаты более 2 месяцев подряд";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. notice_period_status:
           - "defined" — если срок уведомления о досрочном прекращении прямо
             указан;
           - "not_defined" — если прямо не указан.

        6. notice_period_details:
           Краткое user-facing описание срока уведомления. Если сроки разные
           для разных оснований/ролей, укажи привязку в тексте значения.
           - если указан, верни краткое summary, например:
             "3 месяца (для одностороннего отказа Арендатора)";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. return_procedure_status:
           - "defined" — если порядок возврата объекта аренды прямо описан;
           - "not_defined" — если прямо не описан.

        8. return_procedure_details:
           Краткое user-facing описание порядка возврата объекта.
           - если указан, верни краткое summary, например:
             "Возврат объекта по акту возврата";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. deposit_refund_status:
           - "defined" — если механизм возврата, удержания или зачёта
             обеспечительного платежа при прекращении договора прямо описан;
           - "not_defined" — если прямо не описан.
           Важно: фиксируй только механизм (возврат / удержание / зачёт),
           а не сам факт наличия и размер депозита.

        10. deposit_refund_details:
            Краткое user-facing описание механизма возврата/удержания/зачёта
            обеспечительного платежа.
            - если указан, верни краткое summary, например:
              "Засчитывается в счёт последнего месяца аренды";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_return_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлен").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Основания досрочного прекращения фиксируй раздельно по ролям.
          Общие/взаимные основания (соглашение сторон, форс-мажор, судебное
          решение без привязки к конкретной роли) не относятся ни к
          tenant_termination, ни к landlord_termination — это тема другого check.
        - deposit_refund_status/details касаются только механизма возврата,
          удержания или зачёта обеспечительного платежа при прекращении
          договора. Не включай сюда сам факт наличия депозита или его размер —
          это фиксируется в отдельном check о структуре арендной платы.
        - Не смешивай предмет аренды, арендную плату, ремонт и субаренду
          с темами настоящего check.
        - Если в разных фрагментах указаны противоречащие друг другу условия
          (например, разные сроки уведомления для одного и того же основания)
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствуют любые положения о досрочном расторжении, возврате имущества или судьбе обеспечительного взноса.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлен".

        2. Общие недифференцированные формулировки.
           "Договор может быть расторгнут досрочно одной из сторон в судебном порядке по основаниям, предусмотренным ГК РФ" (нет самостоятельной ролевой специфики).
           → presence = "present"; tenant_termination_status = "not_defined" (value = "Не установлен"), landlord_termination_status = "not_defined" (value = "Не установлен").

        3. Противоречие между фрагментами.
           В разделе 7 написано, что Арендатор уведомляет за 30 дней, а в Приложении 2 к этому же отказу указано — за 90 дней.
           → presence = "unclear"; notice_period_status = "not_defined"; notice_period_details = "Не удалось определить".

        4. Ограничения обеспечительного платежа.
           В договоре установлен обеспечительный взнос, но условия его возврата/удержания при прекращении договора отсутствуют (описан только порядок внесения).
           → presence = "present"; deposit_refund_status = "not_defined" (value = "Не установлен").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_return_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * tenant_termination_details → "Не установлен"
          * landlord_termination_details → "Не установлен"
          * notice_period_details → "Не установлен"
          * return_procedure_details → "Не установлен"
          * deposit_refund_details → "Не установлен"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_return_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка досрочного расторжения, возврата объекта и депозита. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tenant_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
