          display_in_grid: true
          display_priority: 1
        - name: "tenant_breach_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за иные нарушения арендатора."
          required: false
        - name: "tenant_breach_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штрафы арендатора"
          description: "Формулировка о штрафах за нарушения арендатора."
          required: false
          display_in_grid: false
        - name: "landlord_breach_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за нарушения арендодателя."
          required: false
        - name: "landlord_breach_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штрафы арендодателя"
          description: "Формулировка о штрафах за нарушения арендодателя."
          required: false
          display_in_grid: false
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничения ответственности."
          required: false
        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение ответственности"
          description: "Формулировка об ограничении ответственности."
          required: false, 
          display_in_grid: true
          display_priority: 2
        - name: "third_party_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения ответственности за ущерб третьим лицам."
          required: false
        - name: "third_party_liability_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность перед третьими лицами"
          description: "Формулировка об ответственности за ущерб третьим лицам."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Государственная регистрация
  # ──────────────────────────────────────────────────────────────────────────
  - id: lease_registration_check
    name: "Государственная регистрация договора аренды (ст. 651 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о государственной
      регистрации: кто подаёт, сроки, расходы на регистрацию.
    triggers:
      any: ["long_term_lease", "real_estate_lease"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "регистрация договора аренды"
        - "расходы на регистрацию"
        - "госпошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)Росреестр"
        - "(?i)госпошлин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: госрегистрация договора аренды.

        Нормативный ориентир:
        - ст. 651 ГК РФ — регистрация договора аренды недвижимости сроком > 1 года

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о государственной регистрации.
        2. Кто обязан подать заявление на регистрацию.
        3. В какой срок подаётся заявление.
        4. Кто несёт расходы на регистрацию / госпошлину.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано — "not_defined" / "Данные не определены".
        3. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящий договор подлежит государственной регистрации в Росреестре.
        Заявление подаёт Арендодатель в течение 10 рабочих дней. Расходы на
        регистрацию стороны несут поровну."

        Ответ:
        {
          "registration_required_status": "defined",
          "registration_required_details": "подлежит государственной регистрации в Росреестре",
          "registration_applicant_status": "defined",
          "registration_applicant_details": "Арендодатель в течение 10 рабочих дней",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы стороны несут поровну",
          "evidence": [{"clause_ref": "п. 10.1", "quote": "Настоящий договор подлежит государственной регистрации в Росреестре."}]
        }

        Пример 2:
        Фрагмент:
        "Срок аренды — 11 месяцев."

        Ответ:
        {
          "registration_required_status": "not_defined",
          "registration_required_details": "Данные не определены",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о государственной регистрации.
        2. Найди прямую цитату о том, кто подаёт и в какой срок.
        3. Найди прямую цитату о расходах.
        4. Если нет — "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "registration_required_status": "<defined / not_defined>",
          "registration_required_details": "<текст или 'Данные не определены'>",
          "registration_applicant_status": "<defined / not_defined>",
          "registration_applicant_details": "<текст или 'Данные не определены'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация Росреестр регистрация договора аренды расходы на регистрацию госпошлина заявление о регистрации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias: 
        preferred_range: [0.65, 1.0]
        boost: 0.15
        scope: segment
      retrieval_profile: "registration_check"
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        государственной регистрации: необходимость, кто подаёт, сроки и расходы.
        Не анализируй арендную плату, ремонт или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. registration_required_status — "defined" если госрегистрация прямо
           предусмотрена, иначе "not_defined".
        2. registration_required_details — формулировка.
        3. registration_applicant_status — "defined" если подающая сторона и срок
           прямо указаны, иначе "not_defined".
        4. registration_applicant_details — формулировка.
        5. registration_costs_status — "defined" если расходы на регистрацию
           распределены, иначе "not_defined".
        6. registration_costs_details — формулировка.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи необходимость регистрации из срока аренды и ст. 651 ГК РФ.
        - Верни только JSON.
        </rules>
      fields:
        - name: "registration_required_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о госрегистрации."
          required: true
        - name: "registration_required_details"
          type: "string"
          presentation: "fact"
          label: "Госрегистрация"
          description: "Формулировка о государственной регистрации договора."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "registration_applicant_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подающей стороны."
          required: false
        - name: "registration_applicant_details"
          type: "string"
          presentation: "fact"
          label: "Кто регистрирует"
          description: "Кто подаёт заявление и в какой срок."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на регистрацию."
          required: false
        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на регистрацию"
          description: "Формулировка о распределении расходов на регистрацию."
          required: false
          display_in_grid: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты арендодателя и арендатора,
      полномочия подписантов, а также правовое основание, по которому арендодатель
      вправе сдавать имущество в аренду.
    addressee: "Обе стороны"

  lease_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: точное описание объекта аренды,
      срок аренды, размер арендной платы, цель использования, а также комплект
      документов для передачи объекта.
    addressee: "Арендодатель"

  lease_subject_identification_check:
    text: >
      Просим уточнить в {doc_names}: индивидуализирующие признаки объекта аренды
      (адрес, площадь, кадастровый номер, номер помещения, серийный номер, VIN и т.п.),
      достаточные для его однозначного определения.
    addressee: "Арендодатель / Юридический советник"

  lessor_title_and_authority:
    text: >
      Просим предоставить по {doc_names}: выписку ЕГРН / документы на титул,
      а также подтверждение права арендодателя сдавать объект в аренду.
    addressee: "Арендодатель"

  rent_payment_and_indexation_check:
    text: >
      Просим уточнить в {doc_names}: фиксированную и переменную часть арендной платы,
      индексацию, структуру коммунальных и эксплуатационных платежей,
      а также размер и режим обеспечительного платежа.
    addressee: "Обе стороны / Финансовый советник"

  rent_payment_required:
    text: >
      Просим уточнить в {doc_names}: размер арендной платы, сроки оплаты,
      валюту, реквизиты и порядок расчёта переменной части (если применимо).
    addressee: "Обе стороны"

  lease_term_clause:
    text: >
      Просим уточнить в {doc_names}: срок аренды, дату начала и окончания,
      а также модель договора при неопределенном сроке (если она используется).
    addressee: "Юридический советник"

  long_term_real_estate_lease_registration:
    text: >
      Внимание: для {doc_names} может требоваться государственная регистрация.
      Просим подтвердить регистрационную позицию, порядок подачи документов,
      распределение расходов и последствия отказа/приостановки регистрации.
    addressee: "Юридический советник / Росреестр"

  handover_condition_and_fitness_check:
    text: >
      Просим предоставить по {doc_names}: форму акта приема-передачи,
      описание состояния объекта, перечень недостатков (если есть),
      подтверждение пригодности для согласованного использования.
    addressee: "Арендодатель"

  handover_act:
    text: >
      Просим согласовать в {doc_names}: форму и содержание акта приема-передачи,
      дату передачи, перечень передаваемых ключей, документов и аксессуаров.
    addressee: "Обе стороны"

  repairs_and_operational_costs_check:
    text: >
      Просим уточнить в {doc_names}: кто несет капитальный и текущий ремонт,
      эксплуатационные расходы, коммунальные платежи, техническое обслуживание
      и иные обязательные расходы по объекту.
    addressee: "Обе стороны"

  maintenance_duties:
    text: >
      Просим четко разграничить в {doc_names}: капитальный ремонт, текущий ремонт,
      maintenance duties и последствия нарушения ремонтных обязанностей.
    addressee: "Юридический советник"

  utilities_and_operating_expenses:
    text: >
      Просим уточнить в {doc_names}: состав коммунальных и эксплуатационных расходов,
      механизм их расчета, документы-основания и сроки возмещения/оплаты.
    addressee: "Обе стороны / Финансовый советник"

  security_deposit:
    text: >
      Просим уточнить в {doc_names}: размер обеспечительного платежа,
      основания для удержания, условия возврата и возможность зачета.
    addressee: "Юридический советник"

  improvements_and_sublease_check:
    text: >
      Просим уточнить в {doc_names}: режим улучшений, порядок согласования перепланировки,
      компенсацию неотделимых улучшений и правила субаренды/перенаема.
    addressee: "Обе стороны / Юридический советник"

  improvements_ownership:
    text: >
      Просим уточнить в {doc_names}: судьбу отделимых и неотделимых улучшений,
      необходимость согласия арендодателя и порядок компенсации.
    addressee: "Юридический советник"

  sublease_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли субаренда/перенаем,
      требуется ли согласие арендодателя и в какой форме оно дается.
    addressee: "Юридический советник"

  termination_and_return_check:
    text: >
      Просим уточнить в {doc_names}: основания досрочного расторжения,
      одностороннего отказа, порядок возврата имущества, акт возврата,
      а также механику возврата/удержания обеспечительного платежа.
    addressee: "Юридический советник"

  return_condition_of_asset:
    text: >
      Просим уточнить в {doc_names}: в каком состоянии объект должен быть возвращён,
      допускается ли нормальный износ, как фиксируется состояние при возврате.
    addressee: "Обе стороны"

  use_purpose_and_land_vri:
    text: >
      Просим уточнить в {doc_names}: назначение использования объекта,
      а для земли — ВРИ, категорию земель и допустимость использования
      под цели арендатора.
    addressee: "Арендодатель / Юридический советник"

  insurance_clause:
    text: >
      Просим уточнить в {doc_names}: требуется ли страхование имущества
      или ответственности, кто несет расходы и кто является выгодоприобретателем.
    addressee: "Юридический советник / Страховой консультант"

  penalty_late_payment:
    text: >
      Просим уточнить в {doc_names}: размер неустойки/пени за просрочку
      арендной платы, порядок начисления и соотношение с убытками.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и механизм разрешения споров.
    addressee: "Юридический советник"

  lessor_title_risk:
    text: >
      Внимание: по {doc_names} необходимо подтвердить титул арендодателя
      и его право на сдачу имущества в аренду. Просим предоставить title pack
      и правовое заключение по полномочиям арендодателя.
    addressee: "Арендодатель / Юридический советник"

  land_use_vri_compliance:
    text: >
      Внимание: по {doc_names} (земельный участок) необходимо подтвердить
      соответствие использования участков ВРИ и категории земель.
      Просим предоставить выписку ЕГРН и сведения о допустимом использовании.
    addressee: "Арендодатель / Земельный консультант"

  preemptive_right_and_renewal_check:
    text: >
      Просим уточнить в {doc_names}: преимущественное право арендатора
      на заключение нового договора (ст. 621 ГК РФ), порядок и сроки
      уведомления о продлении/отказе, условия пролонгации, последствия
      продолжения пользования после истечения срока.
    addressee: "Обе стороны / Юридический советник"

  preemptive_right_renewal:
    text: >
      Просим включить в {doc_names}: условие о преимущественном праве
      арендатора на заключение нового договора (ст. 621 ГК РФ),
      срок уведомления о продлении и порядок согласования новых условий.
    addressee: "Юридический советник"

  landlord_access_and_inspection_check:
    text: >
      Просим уточнить в {doc_names}: порядок доступа арендодателя в помещение —
      предварительное уведомление (за сколько дней), присутствие арендатора,
      допустимое время осмотра, ограничение частоты, экстренные ситуации.
    addressee: "Обе стороны"

  landlord_access_rights:
    text: >
      Просим включить в {doc_names}: регламент доступа арендодателя —
      предварительное уведомление, согласование времени, присутствие
      представителя арендатора, исключения для аварийных ситуаций.
    addressee: "Юридический советник"

  eleven_month_auto_renewal_registration_risk:
    text: >
      Внимание: {doc_names} содержит признаки «11-месячного трюка» — краткосрочный
      договор аренды недвижимости с автопродлением для обхода регистрации.
      При многократном продлении суд может квалифицировать отношения как
      долгосрочную аренду (п. 10 ИП ВАС РФ № 59). Просим дать правовое
      заключение по рискам и, при необходимости, зарегистрировать договор.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для арендной платы
      и обязательств сторон, срок приостановки обязательств.
