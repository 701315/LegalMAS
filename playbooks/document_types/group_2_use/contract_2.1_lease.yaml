      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "rent_payment_and_indexation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды структуру арендной
        платы: фиксированная и переменная части, индексация, оплата коммунальных
        услуг, обеспечительный платёж и последствия просрочки.
        Не анализируй предмет аренды, ремонт, содержание объекта, субаренду или
        расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rent_payment_and_indexation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (fixed_rent_status, variable_rent_status, indexation_status,
              security_deposit_status, late_payment_status) = "defined"
              или utilities_allocation ≠ "not_defined";
           - "missing" — если все содержательные поля-статусы = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - fixed_rent_status = "not_defined";
           - variable_rent_status = "not_defined";
           - indexation_status = "not_defined";
           - utilities_allocation = "not_defined";
           - security_deposit_status = "not_defined";
           - late_payment_status = "not_defined";
           - fixed_rent_details = "Не установлена";
           - variable_rent_details = "Не установлена";
           - indexation_details = "Не установлена";
           - utilities_allocation_display = "Не установлено";
           - security_deposit_details = "Не установлен";
           - late_payment_details = "Не установлены";
           - не выполняй остальные шаги.

        1. fixed_rent_status:
           - "defined" — если фиксированная (постоянная) часть арендной платы
             прямо указана;
           - "not_defined" — если прямо не указана или её нельзя надёжно определить.

        2. fixed_rent_details:
           Краткое user-facing описание размера и условий фиксированной части.
           Правила:
           - если указана, верни краткое summary, например: "200 000 рублей в месяц";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. variable_rent_status:
           - "defined" — если переменная часть арендной платы прямо указана,
             либо прямо сказано, что она рассчитывается по счетам, показаниям
             приборов учёта или тарифам управляющей компании;
           - "not_defined" — если прямо не указана или её нельзя надёжно определить.

        4. variable_rent_details:
           Краткое user-facing описание переменной части.
           Правила:
           - если указана прямо, верни краткое summary, например:
             "По фактическим расходам на коммунальные услуги";
           - если рассчитывается через внешний механизм, верни, например:
             "Рассчитывается по показаниям приборов учёта и счетам управляющей компании";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. indexation_status:
           - "defined" — если механизм индексации прямо описан;
           - "not_defined" — если прямо не описан или его нельзя надёжно определить.

        6. indexation_details:
           Краткое user-facing описание условий индексации.
           Правила:
           - если указаны, верни краткое summary, например:
             "Ежегодно на ИПЦ, но не более 7%";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. utilities_allocation:
           - "landlord" — оплату коммунальных услуг по счётчикам/счетам несёт
             арендодатель;
           - "tenant" — несёт арендатор;
           - "mixed" — распределена между сторонами;
           - "not_defined" — распределение прямо не определено.
           Важно: относится только к оплате коммунальных услуг (электричество,
           вода, отопление и т.п.) по счётчикам/счетам. Не включай сюда общие
           эксплуатационные расходы на содержание объекта (охрана, клининг,
           обслуживание инженерных систем) — это относится к отдельному check.

        8. utilities_allocation_display:
           Человекочитаемое описание распределения расходов на оплату
           коммунальных услуг на русском языке.
           Правила:
           - "Несёт Арендодатель" — если применяется "landlord";
           - "Несёт Арендатор" — если применяется "tenant";
           - "Распределены между сторонами" — если применяется "mixed";
           - "Не установлено" — если применяется "not_defined".

        9. security_deposit_status:
           - "defined" — если обеспечительный платёж прямо предусмотрен;
           - "not_defined" — если прямо не предусмотрен или его нельзя надёжно
             определить.

        10. security_deposit_details:
            Краткое user-facing описание размера и условий обеспечительного платежа.
            Правила:
            - если указан, верни краткое summary, например: "400 000 рублей";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        11. late_payment_status:
            - "defined" — если последствия просрочки оплаты прямо указаны;
            - "not_defined" — если прямо не указаны или их нельзя надёжно определить.

        12. late_payment_details:
            Краткое user-facing описание последствий просрочки оплаты.
            Правила:
            - если указаны, верни краткое summary, например: "0,1% в день";
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни rent_payment_and_indexation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/display-поля заменяются на соответствующий fallback ("Не установлена" / "Не установлено" / "Не установлен" / "Не установлены").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай фиксированную часть, переменную часть, обеспечительный
          платёж и сумму/ставку неустойки за просрочку между собой — это четыре
          разные денежные величины, каждая относится только к своему полю.
        - Если переменная часть арендной платы определяется по счёту, показаниям
          приборов учёта, тарифам управляющей компании или прайс-листу — считай
          это определённым механизмом расчёта ("defined"), а не отсутствием
          регулирования.
        - utilities_allocation and utilities_allocation_display относятся только
          к оплате коммунальных услуг (электричество, вода, отопление) по
          счётчикам/счетам. Не относи к этим полям общие эксплуатационные
          расходы на содержание объекта (охрана, клининг, обслуживание
          инженерных систем, вывоз мусора, страхование объекта) — эта тема
          фиксируется в отдельном check о содержании имущества.
        - Не смешивай предмет аренды, ремонт, содержание объекта, улучшения,
          субаренду и расторжение с темами настоящего check.
        - Если в разных фрагментах указаны разные значения одного параметра
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте вообще отсутствуют финансовые взаимоотношения сторон, условия по аренде и обеспечению обязательств.
           → presence = "missing"; все status-поля и enum = "not_defined"; все details/display-поля = соответствующий fallback.

        2. Прямое указание на согласование в будущем.
           "Размер обеспечительного платежа и неустойка за задержку оплаты устанавливаются Сторонами дополнительно в Приложении №3."
           → presence = "present"; соответствующие status = "not_defined"; details = соответствующий fallback.

        3. Противоречие между фрагментами.
           В разных частях договора приведены различные условия индексации (например, в одном — "раз в год на 5%", в другом — "раз в год на индекс потребительских цен").
           → presence = "unclear"; соответствующий status = "not_defined"; details = "Не удалось определить".

        4. Отсылка на внешний документ.
           Размер постоянной и переменной частей арендной платы рассчитывается исключительно по внешнему прайс-листу Арендодателя.
           → presence = "present"; соответствующие status = "defined"; details = "Определяется согласно прайс-листу Арендодателя" (или по тексту).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rent_payment_and_indexation_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для utilities_allocation используй только: "landlord", "tenant", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * fixed_rent_details → "Не установлена"
          * variable_rent_details → "Не установлена"
          * indexation_details → "Не установлена"
          * utilities_allocation_display → "Не установлено"
          * security_deposit_details → "Не установлен"
          * late_payment_details → "Не установлены"
        - Fallback при противоречии или неоднозначности:
          * все details / display поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_payment_and_indexation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по оплате аренды, индексации и обеспечению платежа. Внутреннее агрегатное signal-поле."
          required: true

        - name: "fixed_rent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания фиксированной части арендной платы. Внутреннее enum-поле."
          required: true

        - name: "fixed_rent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Фиксированная арендная плата"
          description: >
            Краткое описание размера и условий фиксированной (постоянной) части
            арендной платы, например: "200 000 рублей в месяц".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "variable_rent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания переменной части арендной платы. Внутреннее enum-поле."
          required: true

        - name: "variable_rent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Переменная часть"
          description: >
            Краткое описание переменной части арендной платы, например:
            "По фактическим расходам на коммунальные услуги",
            "Рассчитывается по показаниям приборов учёта и счетам управляющей компании".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания механизма индексации. Внутреннее enum-поле."
          required: true

        - name: "indexation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Индексация"
          description: >
            Краткое описание условий индексации арендной платы, например:
            "Ежегодно на ИПЦ, но не более 7%".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "utilities_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: >
            Кто несёт расходы по оплате коммунальных услуг по счётчикам/счетам.
            Внутреннее enum-поле. Не включает общие эксплуатационные расходы
            на содержание объекта.
          required: true

        - name: "utilities_allocation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Коммунальные услуги"
          description: >
            Человекочитаемое описание распределения расходов на оплату
            коммунальных услуг по счётчикам/счетам: "Несёт Арендодатель" /
            "Несёт Арендатор" / "Распределены между сторонами".
            Не включает общие эксплуатационные расходы на содержание объекта.
            Fallback: "Не установлено".
          required: false

        - name: "security_deposit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия обеспечительного платежа. Внутреннее enum-поле."
          required: true

        - name: "security_deposit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Обеспечительный платёж"
          description: >
            Краткое описание размера и условий обеспечительного платежа,
            например: "400 000 рублей".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "late_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания последствий просрочки. Внутреннее enum-поле."
          required: true

        - name: "late_payment_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Последствия просрочки"
          description: >
            Краткое описание последствий просрочки оплаты, например: "0,1% в день".
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

      store_payload: true

  - id: handover_condition_and_fitness_check
    name: "Передача объекта аренды: акт, состояние, пригодность и недостатки"
    description: >
      Фактографическая проверка наличия в договоре аренды условий о передаче
      объекта: акт приёма-передачи, описание технического состояния, гарантия
      пригодности для согласованного использования, раскрытие недостатков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт приема-передачи"
        - "техническое состояние"
        - "исправное состояние"
        - "пригодно для использования"
        - "недостатки"
        - "дефекты"
        - "соответствие назначению"
        - "качество объекта"
        - "передача объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)исправн(ое|ом)\\s+состояни"
        - "(?i)пригодн(о|ость)\\s+для\\s+использован"
        - "(?i)недостат(ки|ков|ок)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: порядок передачи объекта аренды,
        описание его состояния, гарантия пригодности и раскрытие недостатков.

        Нормативный ориентир:
        - ст. 611 ГК РФ — обязанность передать имущество в надлежащем состоянии
        - ст. 612 ГК РФ — ответственность за недостатки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Общая фраза "имущество передаётся в надлежащем/исправном состоянии"
          без конкретных характеристик — это norma без конкретики, а не описание
          состояния объекта.
        - Раскрытие недостатков (обязанность арендодателя заранее сообщить
          об известных недостатках до подписания акта) и порядок фиксации
          претензий (действия арендатора после обнаружения недостатков при
          приёмке) — это два разных вопроса; не путай их.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт приёма-передачи.
        2. Есть ли описание технического состояния объекта при передаче.
        3. Есть ли гарантия пригодности объекта для согласованного использования.
        4. Есть ли условие о раскрытии недостатков арендодателем до передачи.
        5. Есть ли порядок фиксации недостатков и претензий арендатором при приёмке.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" / "Не установлено" — если условие
             прямо не указано (согласуй род и число с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — передача урегулирована, порядок претензий явный:
        Фрагмент:
        "Объект передаётся Арендатору по двустороннему акту приёма-передачи
        в исправном техническом состоянии, пригодном для использования
        в качестве офиса. При обнаружении недостатков в течение 5 рабочих дней
        Арендатор направляет Арендодателю рекламацию."

        Ответ:
        {
          "handover_act_status": "defined",
          "handover_act_details": "Двусторонний акт приёма-передачи",
          "condition_description_status": "defined",
          "condition_description_details": "В исправном техническом состоянии",
          "fitness_warranty_status": "defined",
          "fitness_warranty_details": "Пригодно для использования в качестве офиса",
          "defect_disclosure_status": "not_defined",
          "defect_disclosure_details": "Не установлено",
          "defect_claim_procedure_status": "defined",
          "defect_claim_procedure_details": "Рекламация в течение 5 рабочих дней с момента обнаружения недостатков",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Объект передаётся Арендатору по двустороннему акту приёма-передачи в исправном техническом состоянии, пригодном для использования в качестве офиса. При обнаружении недостатков в течение 5 рабочих дней Арендатор направляет Арендодателю рекламацию."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель предоставляет помещение Арендатору."

        Ответ:
        {
          "handover_act_status": "not_defined",
          "handover_act_details": "Не установлен",
          "condition_description_status": "not_defined",
          "condition_description_details": "Не установлено",
          "fitness_warranty_status": "not_defined",
          "fitness_warranty_details": "Не установлена",
          "defect_disclosure_status": "not_defined",
          "defect_disclosure_details": "Не установлено",
          "defect_claim_procedure_status": "not_defined",
          "defect_claim_procedure_details": "Не установлен",
          "evidence": []
        }

        Пример 3 — раскрытие недостатков и претензии явно разделены:
        Фрагмент:
        "Арендодатель обязан до подписания акта письменно уведомить Арендатора
        об известных ему недостатках помещения. Недостатки, не указанные
        Арендодателем и обнаруженные Арендатором после приёмки, фиксируются
        двусторонним актом в течение 10 рабочих дней."

        Ответ:
        {
          "handover_act_status": "not_defined",
          "handover_act_details": "Не установлен",
          "condition_description_status": "not_defined",
          "condition_description_details": "Не установлено",
          "fitness_warranty_status": "not_defined",
          "fitness_warranty_details": "Не установлена",
          "defect_disclosure_status": "defined",
          "defect_disclosure_details": "Письменное уведомление об известных недостатках до подписания акта",
          "defect_claim_procedure_status": "defined",
          "defect_claim_procedure_details": "Фиксация двусторонним актом в течение 10 рабочих дней после приёмки",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Арендодатель обязан до подписания акта письменно уведомить Арендатора об известных ему недостатках помещения. Недостатки, не указанные Арендодателем и обнаруженные Арендатором после приёмки, фиксируются двусторонним актом в течение 10 рабочих дней."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об акте приёма-передачи.
        2. Найди прямую цитату о техническом состоянии при передаче (проверь,
           что это конкретное описание, а не общая norma без конкретики).
        3. Найди прямую цитату о пригодности для использования.
        4. Найди прямую цитату об обязанности арендодателя раскрыть недостатки
           заранее — отличи её от порядка действий арендатора после приёмки.
        5. Найди прямую цитату о порядке фиксации недостатков и претензий
           арендатором.
        6. Если одна формулировка описывает и раскрытие, и порядок претензий
           одновременно (например, только про рекламацию после обнаружения) —
           отнеси её к defect_claim_procedure, а defect_disclosure оставь
           "not_defined", если отдельного условия о заблаговременном раскрытии нет.
        7. Если в тексте есть противоречие (например, в одном пункте упомянут акт,
           а в другом — передача без акта) и конфликт нельзя снять — верни
           "Не удалось определить".
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "handover_act_status": "<defined / not_defined>",
          "handover_act_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "condition_description_status": "<defined / not_defined>",
          "condition_description_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "fitness_warranty_status": "<defined / not_defined>",
          "fitness_warranty_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "defect_disclosure_status": "<defined / not_defined>",
          "defect_disclosure_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "defect_claim_procedure_status": "<defined / not_defined>",
          "defect_claim_procedure_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи техническое состояние исправное состояние пригодно для использования недостатки дефекты соответствие назначению качество объекта передача объекта рекламация"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "обеспечительный платеж"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "досрочное расторжение"
        - "возврат имущества"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "handover_condition_and_fitness_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия передачи
        объекта: акт приёма-передачи, описание состояния, гарантия пригодности,
        раскрытие недостатков арендодателем и порядок фиксации претензий арендатором.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. handover_condition_and_fitness_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (handover_act_status, condition_description_status, fitness_warranty_status,
              defect_disclosure_status, defect_claim_procedure_status) = "defined";
           - "missing" — если все пять содержательных статусных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - handover_act_status = "not_defined";
           - condition_description_status = "not_defined";
           - fitness_warranty_status = "not_defined";
           - defect_disclosure_status = "not_defined";
           - defect_claim_procedure_status = "not_defined";
           - handover_act_details = "Не установлен";
           - condition_description_details = "Не установлено";
           - fitness_warranty_details = "Не установлена";
           - defect_disclosure_details = "Не установлено";
           - defect_claim_procedure_details = "Не установлен";
           - не выполняй остальные шаги.

        1. handover_act_status:
           - "defined" — если акт приёма-передачи прямо предусмотрен;
           - "not_defined" — если прямо не предусмотрен или это нельзя надёжно
             определить. Не выводи наличие акта из общего факта передачи имущества.

        2. handover_act_details:
           Краткое user-facing описание условий об акте приёма-передачи.
           Правила:
           - если указан, верни краткое summary, например:
             "Двусторонний акт приёма-передачи";
           - если данных нет — "Не установлен";
           - если данные противоречивы (например, в одном месте акт упомянут,
             в другом — передача без акта) — "Не удалось определить".

        3. condition_description_status:
           - "defined" — если в тексте есть конкретное описание технического
             состояния объекта при передаче (характеристики, исправность
             конкретных систем, показания приборов и т.п.);
           - "not_defined" — если есть только общая norma без конкретики
             (например, "передаётся в надлежащем состоянии" без деталей),
             либо описание отсутствует.

        4. condition_description_details:
           Краткое user-facing описание состояния объекта при передаче.
           Правила:
           - если указано конкретно, верни краткое summary, например:
             "В исправном техническом состоянии";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. fitness_warranty_status:
           - "defined" — если гарантия пригодности объекта для согласованного
             использования прямо сформулирована;
           - "not_defined" — если прямо не сформулирована.

        6. fitness_warranty_details:
           Краткое user-facing описание гарантии пригодности.
           Правила:
           - если указана, верни краткое summary, например:
             "Пригодно для использования в качестве офиса";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. defect_disclosure_status:
           - "defined" — если прямо предусмотрена обязанность арендодателя
             заранее (до подписания акта) раскрыть/сообщить об известных
             недостатках объекта;
           - "not_defined" — если такой обязанности прямо не предусмотрено.
           Не путай с порядком действий арендатора после обнаружения недостатков
           при приёмке — это отдельное поле defect_claim_procedure.

        8. defect_disclosure_details:
           Краткое user-facing описание обязанности арендодателя раскрыть
           недостатки заранее.
           Правила:
           - если указана, верни краткое summary, например:
             "Письменное уведомление об известных недостатках до подписания акта";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. defect_claim_procedure_status:
           - "defined" — если прямо описан порядок действий арендатора при
             обнаружении недостатков в процессе приёмки (срок, форма уведомления,
             фиксация актом и т.п.);
           - "not_defined" — если такой порядок прямо не описан.

        10. defect_claim_procedure_details:
            Краткое user-facing описание порядка фиксации недостатков и претензий.
            Правила:
            - если указан, верни краткое summary, например:
              "Рекламация в течение 5 рабочих дней с момента обнаружения недостатков";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни handover_condition_and_fitness_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлено" / "Не установлена").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Общая фраза "передаётся в надлежащем/исправном состоянии" без
          конкретных характеристик — это norma без конкретики, а не описание
          состояния; такое условие не считается "defined" для
          condition_description_status.
        - Раскрытие недостатков (обязанность арендодателя заранее сообщить
          об известных недостатках до подписания акта) и порядок претензий
          (действия арендатора после обнаружения недостатков при приёмке) —
          два разных явления. Если формулировка описывает только действия
          арендатора после обнаружения — заполняй только defect_claim_procedure,
          а defect_disclosure оставляй "not_defined", если отдельного условия
          о заблаговременном раскрытии нет.
        - Не смешивай условия передачи объекта с арендной платой, ремонтом,
          субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу условия
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре полностью отсутствуют положения о приёмке, техническом качестве, дефектах или акте приёма-передачи.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Неполное регулирование (норма без конкретики).
           Передача описана общей фразой "в исправном состоянии" без какого-либо упоминания порядка приёмки или составления акта.
           → presence = "present"; handover_act_status = "not_defined" (value = "Не установлен"), а condition_description_status = "not_defined" (так как фраза общая, value = "Не установлено").

        3. Противоречие между фрагментами.
           В одном разделе написано, что объект передаётся без составления актов в день оплаты, а в другом — что требуется двусторонний акт приёма-передачи.
           → presence = "unclear"; соответствующие status = "not_defined"; value = "Не удалось определить".

        4. Отсылка к сторонним правилам/документам.
           Порядок выявления дефектов и фиксации претензий при приёмке определяется Регламентом ТРЦ, являющимся приложением к договору.
           → presence = "present"; defect_claim_procedure_status = "defined"; value = "Определяется согласно Регламенту ТРЦ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для handover_condition_and_fitness_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * handover_act_details → "Не установлен"
          * condition_description_details → "Не установлено"
          * fitness_warranty_details → "Не установлена"
          * defect_disclosure_details → "Не установлено"
          * defect_claim_procedure_details → "Не установлен"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "handover_condition_and_fitness_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка приёма-передачи, оценки состояния и дефектов объекта аренды. Внутреннее агрегатное signal-поле."
          required: true

        - name: "handover_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на акт приёма-передачи. Внутреннее enum-поле."
          required: true

        - name: "handover_act_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Акт приёма-передачи"
          description: >
            Краткое описание условий об акте приёма-передачи, например:
            "Двусторонний акт приёма-передачи".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "condition_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания состояния при передаче. Внутреннее enum-поле."
          required: true

        - name: "condition_description_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Состояние при передаче"
          description: >
            Краткое описание технического состояния объекта при передаче,
            например: "В исправном техническом состоянии".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "fitness_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии пригодности для использования. Внутреннее enum-поле."
          required: true

        - name: "fitness_warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Гарантия пригодности"
          description: >
            Краткое описание гарантии пригодности объекта для согласованного
            использования, например: "Пригодно для использования в качестве офиса".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "defect_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия недостатков арендодателем при передаче. Внутреннее enum-поле."
          required: true

        - name: "defect_disclosure_details"
          label: "Сведения о выявленных дефектах"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Формулировка об обязанности арендодателя заранее раскрыть известные
            недостатки до подписания акта.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "defect_claim_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка фиксации недостатков и претензий арендатором. Внутреннее enum-поле."
          required: true

        - name: "defect_claim_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Порядок фиксации недостатков"
          description: >
            Краткое описание порядка действий арендатора при обнаружении
            недостатков и направления претензий, например:
            "Рекламация в течение 5 рабочих дней с момента обнаружения недостатков".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

      store_payload: true

  - id: repairs_and_operational_costs_check
    name: "Ремонт, содержание имущества и эксплуатационные расходы"
    description: >
      Фактографическая проверка распределения капитального и текущего ремонта,
      эксплуатационных расходов на содержание объекта (охрана, клининг,
      обслуживание инженерных систем и т.п.), технического обслуживания
      и обязанностей по содержанию объекта аренды.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
        - "техническое обслуживание"
        - "обязанность по содержанию"
        - "OPEX"
        - "maintenance"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+ремонт"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)эксплуатационн(ые|ых)\\s+расход"
        - "(?i)коммунальн(ые|ых)\\s+услуг"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: распределение ремонтных
        и эксплуатационных обязанностей по содержанию объекта.

        Нормативный ориентир:
        - ст. 616 ГК РФ — обязанности по содержанию арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общая формулировка "ремонт" без уточнения вида (капитальный или
          текущий) не относится автоматически ни к капитальному, ни к текущему
          ремонту — только если вид явно назван или однозначно вытекает
          из характера описанных работ.
        - Эксплуатационные расходы в этом check — это расходы на содержание
          объекта в широком смысле (охрана, клининг, обслуживание инженерных
          систем, вывоз мусора, страхование объекта и т.п.), а не оплата
          коммунальных счетов (электричество, вода, отопление) — учёт
          коммунальных платежей как части арендной платы фиксируется отдельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт обязанность по капитальному ремонту.
        2. Кто несёт обязанность по текущему ремонту.
        3. Кто несёт эксплуатационные расходы на содержание объекта (охрана,
           клининг, обслуживание инженерных систем и т.п., без коммунальных счетов).
        4. Есть ли детализация состава расходов.
        5. Есть ли обязанность по техническому обслуживанию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлено" — если условие прямо не указано
             (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — распределение определено:
        Фрагмент:
        "Капитальный ремонт объекта осуществляется Арендодателем за свой счёт.
        Текущий ремонт и техническое обслуживание — обязанность Арендатора.
        Расходы на охрану и клининг здания несёт Арендодатель."

        Ответ:
        {
          "capital_repairs_status": "defined",
          "capital_repairs_allocation": "landlord",
          "capital_repairs_allocation_display": "Несёт Арендодатель",
          "capital_repairs_details": "Капитальный ремонт осуществляется Арендодателем за свой счёт",
          "current_repairs_status": "defined",
          "current_repairs_allocation": "tenant",
          "current_repairs_allocation_display": "Несёт Арендатор",
          "current_repairs_details": "Текущий ремонт — обязанность Арендатора",
          "operational_costs_status": "defined",
          "operational_costs_allocation": "landlord",
          "operational_costs_allocation_display": "Несёт Арендодатель",
          "operational_costs_details": "Расходы на охрану и клининг здания несёт Арендодатель",
          "maintenance_status": "defined",
          "maintenance_details": "Техническое обслуживание — обязанность Арендатора",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Капитальный ремонт объекта осуществляется Арендодателем за свой счёт. Текущий ремонт и техническое обслуживание — обязанность Арендатора."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны содержат объект в надлежащем состоянии."

        Ответ:
        {
          "capital_repairs_status": "not_defined",
          "capital_repairs_allocation": "not_defined",
          "capital_repairs_allocation_display": "Не установлено",
          "capital_repairs_details": "Не установлен",
          "current_repairs_status": "not_defined",
          "current_repairs_allocation": "not_defined",
          "current_repairs_allocation_display": "Не установлено",
          "current_repairs_details": "Не установлен",
          "operational_costs_status": "not_defined",
          "operational_costs_allocation": "not_defined",
          "operational_costs_allocation_display": "Не установлено",
          "operational_costs_details": "Не установлены",
          "maintenance_status": "not_defined",
          "maintenance_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — общая формулировка без вида ремонта:
        Фрагмент:
        "Арендатор обязан своевременно производить ремонт объекта за свой счёт."

        Ответ:
        {
          "capital_repairs_status": "not_defined",
          "capital_repairs_allocation": "not_defined",
          "capital_repairs_allocation_display": "Не установлено",
          "capital_repairs_details": "Не установлен",
          "current_repairs_status": "not_defined",
          "current_repairs_allocation": "not_defined",
          "current_repairs_allocation_display": "Не установлено",
          "current_repairs_details": "Не удалось определить",
          "operational_costs_status": "not_defined",
          "operational_costs_allocation": "not_defined",
          "operational_costs_allocation_display": "Не установлено",
          "operational_costs_details": "Не установлены",
          "maintenance_status": "not_defined",
          "maintenance_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Арендатор обязан своевременно производить ремонт объекта за свой счёт."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о капитальном ремонте (вид ремонта должен быть
           явно назван или однозначно вытекает из характера работ).
        2. Найди прямую цитату о текущем ремонте (аналогично).
        3. Если "ремонт" упомянут без уточнения вида и вид нельзя однозначно
           определить — не относи цитату ни к capital_repairs, ни к
           current_repairs; для current_repairs_details в этом случае верни
           "Не удалось определить", если формулировка достаточно конкретна
           по обязанному лицу, но не по виду ремонта.
        4. Найди прямую цитату об эксплуатационных расходах на содержание
           объекта (охрана, клининг, обслуживание систем) — не путай с оплатой
           коммунальных счетов.
        5. Найди прямую цитату о техническом обслуживании.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "capital_repairs_status": "<defined / not_defined>",
          "capital_repairs_allocation": "<landlord / tenant / mixed / not_defined>",
          "capital_repairs_allocation_display": "<текст или 'Не установлено'>",
          "capital_repairs_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "current_repairs_status": "<defined / not_defined>",
          "current_repairs_allocation": "<landlord / tenant / mixed / not_defined>",
          "current_repairs_allocation_display": "<текст или 'Не установлено'>",
          "current_repairs_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "operational_costs_status": "<defined / not_defined>",
          "operational_costs_allocation": "<landlord / tenant / mixed / not_defined>",
          "operational_costs_allocation_display": "<текст или 'Не установлено'>",
          "operational_costs_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "maintenance_status": "<defined / not_defined>",
          "maintenance_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "капитальный ремонт текущий ремонт эксплуатационные расходы охрана клининг обслуживание инженерных систем техническое обслуживание содержание объекта OPEX maintenance обязанность по содержанию"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "обеспечительный платеж"
        - "предмет аренды"
        - "кадастровый номер"
        - "акт приёма-передачи"
        - "улучшения"
        - "субаренда"
        - "досрочное расторжение"
        - "коммунальные платежи по счетчикам"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.65]
        boost: 0.15
        scope: segment
      retrieval_profile: "repair_maintenance_check"
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
