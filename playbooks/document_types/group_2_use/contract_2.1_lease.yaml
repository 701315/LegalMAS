          display_in_grid: false
          description: "Статус ссылки на правоустанавливающие документы. Внутреннее enum-поле."
          required: true

        - name: "title_documents_details"
          label: "Сведения о правоустанавливающих документах"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Ссылка на правоустанавливающие документы, например: "Договор
            купли-продажи от 15.01.2020".
            Fallback: "Не установлены" / "Не удалось определить".
