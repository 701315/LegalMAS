      regex_patterns:
        - "(?i)арендн(ая|ой)\\s+плат"
        - "(?i)ежемесячно|ежеквартально"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

  - id: "lease_term_clause"
    name: "Срок аренды"
    description: "Проверяет наличие срока аренды или корректную модель неопределенного срока"
    legal_base: "ст. 610 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок аренды"
        - "срок действия договора"
        - "до"
        - "на неопределенный срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+аренд"
        - "(?i)на\\s+неопределенн(ый|ого)\\s+срок"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"

  - id: "registration_clause_for_long_term_real_estate"
    name: "Долгосрочная аренда недвижимости: регистрационный блок"
    description: "Проверяет урегулирование регистрации при долгосрочной аренде недвижимости"
    legal_base: "ст. 609, 651 ГК РФ, ФЗ-218"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
