      - "(?i)\\bдепозит\\b"
      - "(?i)гарантийн[ыо]й\\s+плат[её]ж"
      - "(?i)страхов[оа]й\\s+депозит"
      - "(?i)удержани[ея]\\s+обеспечительн[оа]го\\s+платеж[аа]"

  indexed_rent:
