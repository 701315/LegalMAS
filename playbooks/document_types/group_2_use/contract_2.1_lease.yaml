        - "отделимые улучшения"
        - "компенсация улучшений"
        - "перепланировка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неотделим(ые|ых)\\s+улучшени"
        - "(?i)отделим(ые|ых)\\s+улучшени"
        - "(?i)компенсаци.*улучшени"

  - id: "use_purpose_and_land_vri"
    name: "Назначение использования объекта / ВРИ для земли"
    description: "Проверяет согласованное использование и соблюдение ВРИ"
