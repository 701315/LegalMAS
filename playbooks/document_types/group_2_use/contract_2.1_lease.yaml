          label: "Досрочное прекращение (арендатор)"
          description: >
            Краткое описание оснований и условий досрочного прекращения именно
            арендатором, например: "Вправе отказаться в одностороннем порядке,
            уведомив за 3 месяца".
            Fallback: "Не установлен" / "Не удалось определить".
