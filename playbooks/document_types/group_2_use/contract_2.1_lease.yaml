      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь условия продления/возобновления договора и преимущественное право арендатора.

        По ст. 621 ГК РФ:
        - Арендатор, надлежащим образом исполнявший обязанности, имеет ПРЕИМУЩЕСТВЕННОЕ
          право на заключение нового договора на новый срок
        - Стороны могут изменить условия нового договора, но арендодатель не вправе
          отказать и заключить договор с другим лицом
        - Если после истечения срока арендатор продолжает пользоваться — договор считается
          возобновлённым на тех же условиях на неопределённый срок

