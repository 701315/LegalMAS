  - id: preemptive_right_and_renewal_check
    name: "Преимущественное право арендатора на заключение договора на новый срок"
    description: >
      Фактографическая проверка наличия в договоре преимущественного права
      арендатора на заключение договора на новый срок (ст. 621 ГК РФ) и наличия
      отказа арендатора от этого права. Условия автопродления, пролонгации
      и срок уведомления о продлении покрываются глобальной проверкой срока
      договора и не дублируются здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "преимущественное право"
        - "отказ от преимущественного права"
        - "на новый срок"
        - "заключение договора на новый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)отказ(ывается)?\\s+от\\s+преимущественного\\s+права"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: преимущественное право арендатора
        на заключение договора на новый срок и отказ от этого права.

        Нормативный ориентир:
        - ст. 621 ГК РФ — преимущественное право арендатора на заключение
          договора на новый срок

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не анализируй автоматическое продление / пролонгацию существующего
          договора, срок уведомления о продлении или условия нового срока —
          это отдельная тема, покрываемая другой проверкой.
        - Преимущественное право (право арендатора заключить новый договор
          при прочих равных условиях, если арендодатель намерен сдавать
          имущество дальше) — это иной институт, чем автопродление
          (автоматическое продолжение действующего договора без заключения
          нового). Не путай их.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание преимущественного права арендатора на заключение
           договора на новый срок.
        2. Есть ли оговорка об отказе арендатора от преимущественного права.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлено" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — преимущественное право предусмотрено:
        Фрагмент:
        "Арендатор имеет преимущественное право на заключение договора аренды
        на новый срок при условии надлежащего исполнения обязательств
        по настоящему договору."

        Ответ:
        {
          "preemptive_right_status": "defined",
          "preemptive_right_details": "Имеет преимущественное право на заключение договора на новый срок при надлежащем исполнении обязательств",
          "waiver_of_preemptive_right_status": "not_defined",
          "waiver_of_preemptive_right_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Арендатор имеет преимущественное право на заключение договора аренды на новый срок при условии надлежащего исполнения обязательств по настоящему договору."
            }
          ]
        }

        Пример 2 — отказ от преимущественного права:
        Фрагмент:
        "Арендатор настоящим отказывается от преимущественного права
        на заключение договора аренды на новый срок, предусмотренного
        ст. 621 ГК РФ."

        Ответ:
        {
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Не установлено",
          "waiver_of_preemptive_right_status": "defined",
          "waiver_of_preemptive_right_details": "Арендатор отказывается от преимущественного права на заключение договора на новый срок",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Арендатор настоящим отказывается от преимущественного права на заключение договора аренды на новый срок, предусмотренного ст. 621 ГК РФ."
            }
          ]
        }

        Пример 3 — данные отсутствуют (только автопродление, не преимущественное право):
        Фрагмент:
        "Договор автоматически продлевается на 1 год, если ни одна из сторон
        не направила уведомление об отказе от продления за 60 дней
        до истечения срока."

        Ответ:
        {
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Не установлено",
          "waiver_of_preemptive_right_status": "not_defined",
          "waiver_of_preemptive_right_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о преимущественном праве арендатора на
           заключение договора на новый срок.
        2. Найди прямую цитату об отказе арендатора от этого права.
        3. Убедись, что цитата не про автопродление/пролонгацию существующего
           договора — если это так, не заполняй поля этого check на основе
           такой цитаты.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "waiver_of_preemptive_right_status": "<defined / not_defined>",
          "waiver_of_preemptive_right_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преимущественное право арендатора заключение договора на новый срок отказ от преимущественного права ст. 621"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "досрочное расторжение"
        - "односторонний отказ"
        - "возврат имущества"
        - "обеспечительный платеж"
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "субаренда"
        - "улучшения"
        - "автоматическое продление"
        - "пролонгация"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "preemptive_right_and_renewal_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды сведения
        только о преимущественном праве арендатора на заключение договора
        на новый срок и об отказе от этого права.
        Не анализируй автопродление, пролонгацию, срок уведомления о продлении,
        условия нового срока, досрочное расторжение или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. preemptive_right_and_renewal_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (preemptive_right_status, waiver_of_preemptive_right_status) = "defined";
           - "missing" — если все эти содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - preemptive_right_status = "not_defined";
           - waiver_of_preemptive_right_status = "not_defined";
           - preemptive_right_details = "Не установлено";
           - waiver_of_preemptive_right_details = "Не установлено";
           - не выполняй остальные шаги.

        1. preemptive_right_status:
           - "defined" — если преимущественное право арендатора на заключение
             договора на новый срок прямо упомянуто;
           - "not_defined" — если прямо не упомянуто.

        2. preemptive_right_details:
           Краткое user-facing описание условий преимущественного права.
           - если указано, верни краткое summary, например:
             "Имеет преимущественное право на заключение договора на новый срок
             при надлежащем исполнении обязательств";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. waiver_of_preemptive_right_status:
           - "defined" — если отказ арендатора от преимущественного права
             прямо указан;
           - "not_defined" — если прямо не указан.

        4. waiver_of_preemptive_right_details:
           Краткое user-facing описание отказа от преимущественного права.
           - если указано, верни краткое summary, например: "Арендатор
             отказывается от преимущественного права на заключение договора
             на новый срок";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни preemptive_right_and_renewal_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Преимущественное право (право заключить новый договор при прочих
          равных условиях) — это не то же самое, что автопродление
          (автоматическое продолжение действующего договора). Не заполняй
          поля этого check на основе цитат про автопродление, пролонгацию,
          срок уведомления о продлении или условия нового срока — это тема
          другой проверки.
        - Не смешивай преимущественное право с досрочным расторжением, арендной
          платой, ремонтом или субарендой.
        - Если в разных фрагментах указаны противоречащие друг другу условия
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствуют любые упоминания преимущественного права заключения договора аренды на новый срок или оговорок об отказе.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлено".

        2. Упоминание норм ГК РФ.
           "Стороны руководствуются статьей 621 Гражданского кодекса РФ" (без явной расшифровки условий преимущественного права или прямого отказа от него).
           → presence = "present"; preemptive_right_status = "not_defined" (value = "Не установлено").

        3. Противоречие между фрагментами.
           В пункте 8.1 указано, что Арендатор имеет преимущественное право, а в пункте 8.5 — что Арендатор безоговорочно отказывается от такого права.
           → presence = "unclear"; оба статуса = "not_defined"; details = "Не удалось определить".

        4. Ограниченное автопродление.
           В договоре есть условия автопродления срока, но нет ни слова о преимущественном праве на новый договор.
           → presence = "missing" (так как это автопродление, а не ст. 621); все status-поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          preemptive_right_details → "Не установлено"
          waiver_of_preemptive_right_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "preemptive_right_and_renewal_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования преимущественного права арендатора на продление. Внутреннее агрегатное signal-поле."
          required: true

        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания преимущественного права арендатора. Внутреннее enum-поле."
          required: true

        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Преимущественное право"
          description: >
            Краткое описание условий преимущественного права арендатора на
            заключение договора на новый срок, например: "Имеет преимущественное
            право на заключение договора на новый срок при надлежащем исполнении
            обязательств".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "waiver_of_preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отказа от преимущественного права. Внутреннее enum-поле."
          required: true

        - name: "waiver_of_preemptive_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отказ от преимущественного права"
          description: >
            Краткое описание отказа арендатора от преимущественного права,
            например: "Арендатор отказывается от преимущественного права
            на заключение договора на новый срок".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: landlord_access_and_inspection_check
    name: "Доступ арендодателя в помещение и порядок осмотра"
    description: >
      Фактографическая проверка условий доступа арендодателя в арендуемое
      помещение: регламентация доступа, предварительное уведомление,
      присутствие арендатора, экстренный доступ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "доступ в помещение"
        - "осмотр помещения"
        - "посещение арендодателем"
        - "предварительное уведомление"
        - "право проверки"
        - "ключи"
        - "в присутствии арендатора"
        - "право доступа"
        - "экстренный доступ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доступ.*в.*помещени"
        - "(?i)осмотр.*помещени"
        - "(?i)предварительн(ое|ого)\\s+уведомлен"
        - "(?i)в\\s+присутствии\\s+арендатор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: условия доступа арендодателя
        в арендуемое помещение и порядок осмотра.

        Нормативный ориентир:
        - ст. 606 ГК РФ — владение и пользование
        - общая договорная практика доступа арендодателя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общая фраза о праве арендодателя контролировать использование
          имущества без конкретных условий (срок уведомления, присутствие
          арендатора, периодичность, режим осмотра) — это norma без конкретики,
          а не регламентация доступа. Такая фраза не даёт основания для
          "defined" в access_regulated_status.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Регламентирован ли доступ арендодателя в помещение конкретными условиями.
        2. Требуется ли предварительное уведомление и какой срок.
        3. Требуется ли присутствие арендатора при осмотре.
        4. Есть ли условие об экстренном (аварийном) доступе.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлено" — если условие прямо не указано
             (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — доступ урегулирован конкретно:
        Фрагмент:
        "А scoreboard вправе осматривать помещение не чаще 1 раза в месяц,
        предварительно уведомив Арендатора за 2 рабочих дня. Осмотр
        проводится в присутствии представителя Арендатора в рабочее время.
        В случае аварии Арендодатель имеет право на немедленный доступ."

        Ответ:
        {
          "access_regulated_status": "defined",
          "access_regulated_details": "Вправе осматривать не чаще 1 раза в месяц",
          "prior_notice_status": "defined",
          "prior_notice_details": "Предварительное уведомление за 2 рабочих дня",
          "tenant_presence_status": "defined",
          "tenant_presence_details": "В присутствии представителя Арендатора в рабочее время",
          "emergency_access_status": "defined",
          "emergency_access_details": "В случае аварии — право на немедленный доступ",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Арендодатель вправе осматривать помещение не чаще 1 раза в месяц, предварительно уведомив Арендатора за 2 рабочих дня."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует помещение самостоятельно."

        Ответ:
        {
          "access_regulated_status": "not_defined",
          "access_regulated_details": "Не установлен",
          "prior_notice_status": "not_defined",
          "prior_notice_details": "Не установлено",
          "tenant_presence_status": "not_defined",
          "tenant_presence_details": "Не установлено",
          "emergency_access_status": "not_defined",
          "emergency_access_details": "Не установлен",
          "evidence": []
        }

        Пример 3 — общая фраза без конкретики:
        Фрагмент:
        "Арендодатель имеет право контролировать целевое использование
        имущества Арендатором."

        Ответ:
        {
          "access_regulated_status": "not_defined",
          "access_regulated_details": "Не установлен",
          "prior_notice_status": "not_defined",
          "prior_notice_details": "Не установлено",
          "tenant_presence_status": "not_defined",
          "tenant_presence_details": "Не установлено",
          "emergency_access_status": "not_defined",
          "emergency_access_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о регламентации доступа — убедись, что она
           содержит конкретные условия (срок, периодичность, порядок), а не
           общую фразу о праве контроля.
        2. Найди прямую цитату о предварительном уведомлении и его сроке.
        3. Найди прямую цитату о присутствии арендатора.
        4. Найди прямую цитату об экстренном / аварийном доступе.
        5. Если в тексте указаны разные условия доступа для разных целей
           осмотра (плановый / аварийный) и они не противоречат друг другу —
           зафиксируй каждое в соответствующем поле раздельно.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "access_regulated_status": "<defined / not_defined>",
          "access_regulated_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "prior_notice_status": "<defined / not_defined>",
          "prior_notice_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "tenant_presence_status": "<defined / not_defined>",
          "tenant_presence_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "emergency_access_status": "<defined / not_defined>",
          "emergency_access_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доступ в помещение осмотр помещения посещение арендодателем предварительное уведомление право проверки ключи в присутствии арендатора экстренный доступ аварийный доступ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "досрочное расторжение"
        - "возврат имущества"
        - "обеспечительный платеж"
        - "преимущественное право"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "landlord_access_and_inspection_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        доступа арендодателя в помещение: регламентация, уведомление,
        присутствие арендатора и экстренный доступ.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. landlord_access_and_inspection_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (access_regulated_status, prior_notice_status, tenant_presence_status,
              emergency_access_status) = "defined";
           - "missing" — если все содержательные поля-статусы = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - access_regulated_status = "not_defined";
           - prior_notice_status = "not_defined";
           - tenant_presence_status = "not_defined";
           - emergency_access_status = "not_defined";
           - access_regulated_details = "Не установлен";
           - prior_notice_details = "Не установлено";
           - tenant_presence_details = "Не установлено";
           - emergency_access_details = "Не установлен";
           - не выполняй остальные шаги.

        1. access_regulated_status:
           - "defined" — если доступ арендодателя регламентирован конкретными
             условиями (срок, периодичность, порядок);
           - "not_defined" — если условия не указаны прямо или указана только
             общая фраза о праве контроля без конкретики.

        2. access_regulated_details:
           Краткое user-facing описание регламентации доступа.
           - если указано конкретно, верни краткое summary, например:
             "Вправе осматривать не чаще 1 раза в месяц";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. prior_notice_status:
           - "defined" — если предварительное уведомление прямо требуется;
           - "not_defined" — если прямо не требуется или не указано.

        4. prior_notice_details:
           Краткое user-facing описание требования об уведомлении и его сроке.
           - если указано, верни краткое summary, например:
             "Предварительное уведомление за 2 рабочих дня";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. tenant_presence_status:
           - "defined" — если присутствие арендатора при осмотре прямо требуется;
           - "not_defined" — если прямо не требуется или не указано.

        6. tenant_presence_details:
           Краткое user-facing описание требования о присутствии арендатора.
           - если указано, верни краткое summary, например:
             "В присутствии представителя Арендатора в рабочее время";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. emergency_access_status:
           - "defined" — если экстренный/аварийный доступ прямо предусмотрен;
           - "not_defined" — если прямо не предусмотрен или не указан.

        8. emergency_access_details:
           Краткое user-facing описание условий экстренного доступа.
           - если указано, верни краткое summary, например:
             "В случае аварии — право на немедленный доступ";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни landlord_access_and_inspection_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Общая фраза о праве арендодателя контролировать использование
          имущества без конкретных условий (срок, периодичность, порядок) —
          это norma без конкретики, а не регламентация доступа. Не считай такую
          фразу "defined" для access_regulated_status.
        - Не выводи наличие экстренного доступа из общего права собственника —
          только если это прямо указано в тексте.
        - Не смешивай условия доступа с арендной платой, ремонтом, субарендой
          или расторжением.
        - Если в тексте указаны разные условия доступа для разных целей осмотра
          (плановый / аварийный) без противоречия — фиксируй каждое условие
          в соответствующем поле.
        - Если в разных фрагментах указаны противоречащие друг другу условия
          одного и того же параметра и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре полностью отсутствуют любые упоминания прав арендодателя на посещение, осмотр или доступ.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Общие контролирующие фразы.
           "Арендодатель имеет право осуществлять контроль за целевым использованием арендуемого имущества" (без описания сроков/процедур посещения).
           → presence = "present"; access_regulated_status = "not_defined" (value = "Не установлен").

        3. Противоречие между фрагментами.
           В одном месте указано, что арендодатель посещает Помещение в присутствии Арендатора, а во втором — что Арендодатель имеет свободный доступ в любое время в отсутствие Арендатора.
           → presence = "unclear"; tenant_presence_status = "not_defined"; tenant_presence_details = "Не удалось определить".

        4. Односторонние жесткие права.
           "Арендодатель вправе входить в Помещение без предварительного уведомления" (однако присутствие арендатора или аварийность при этом не регламентированы).
           → presence = "present"; prior_notice_status = "not_defined" (value = "Не установлено").
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          access_regulated_details → "Не установлен"
          prior_notice_details → "Не установлено"
          tenant_presence_details → "Не установлено"
          emergency_access_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "landlord_access_and_inspection_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка доступа арендодателя в Помещение. Внутреннее агрегатное signal-поле."
          required: true

        - name: "access_regulated_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус регламентации доступа арендодателя. Внутреннее enum-поле."
          required: true

        - name: "access_regulated_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Регламент доступа"
          description: >
            Краткое описание регламентации доступа арендодателя, например:
            "Вправе осматривать не чаще 1 раза в месяц".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "prior_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования предварительного уведомления. Внутреннее enum-поле."
          required: true

        - name: "prior_notice_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Уведомление о доступе"
          description: >
            Краткое описание требования о предварительном уведомлении и его
            сроке, например: "Предварительное уведомление за 2 рабочих дня".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "tenant_presence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования присутствия арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_presence_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Присутствие арендатора"
          description: >
            Краткое описание требования о присутствии арендатора при осмотре,
            например: "В присутствии представителя Арендатора в рабочее время".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "emergency_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об экстренном доступе. Внутреннее enum-поле."
          required: true

        - name: "emergency_access_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Экстренный доступ"
          description: >
            Краткое описание условий экстренного/аварийного доступа, например:
            "В случае аварии — право на немедленный доступ".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_parties_and_authority
    name: "Стороны договора аренды: арендодатель, арендатор, полномочия, корпоративное одобрение"
    description: >
      Фактографическая проверка наличия в договоре аренды идентификации
      арендодателя и арендатора, их реквизитов, подписантов, оснований
      полномочий и указания на корпоративное одобрение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение"
        - "решение единственного участника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: идентификация арендодателя и арендатора,
        полномочия подписантов и корпоративное одобрение.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 182–185 ГК РФ — полномочия представителя
        - ФЗ-14 ст. 45–46, ФЗ-208 ст. 78–84 — одобрение крупных сделок

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Различай общую фразу "стороны заключили договор" (недостаточно для
          идентификации) от конкретных реквизитов (наименование, ИНН, ОГРН,
          адрес — достаточно для "defined").

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Арендодатель (наименование/ФИО, ИНН, ОГРН, адрес).
        2. Кто указан как Арендатор (наименование/ФИО, ИНН, ОГРН, адрес).
        3. Кто подписывает договор от каждой стороны и на каком основании.
        4. Есть ли ссылка на корпоративное одобрение или указание, что оно не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлено" — если условие прямо не указано
             (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стороны определены:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Арендодатель»,
        в лице Генерального директора Иванова И.И., действующего на основании Устава,
        и ООО «Бета» (ИНН 7700000002), именуемое «Арендатор», в лице директора
        Петрова П.П., действующего на основании доверенности № 5 от 01.01.2024.
        Сделка одобрена решением единственного участника Арендатора от 15.01.2024."

        Ответ:
        {
          "landlord_details_status": "defined",
          "landlord_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "landlord_type": "legal_entity",
          "landlord_type_display": "Юридическое лицо",
          "landlord_signatory_status": "defined",
          "landlord_signatory_value": "Генеральный директор Иванов И.И.",
          "landlord_signatory_basis": "charter",
          "landlord_signatory_basis_display": "На основании Устава",
          "tenant_details_status": "defined",
          "tenant_details_value": "ООО «Бета», ИНН 7700000002",
          "tenant_type": "legal_entity",
          "tenant_type_display": "Юридическое лицо",
          "tenant_signatory_status": "defined",
          "tenant_signatory_value": "Директор Петров П.П.",
          "tenant_signatory_basis": "poa",
          "tenant_signatory_basis_display": "На основании доверенности",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Решение единственного участника Арендатора от 15.01.2024",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Арендодатель», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор аренды."

        Ответ:
        {
          "landlord_details_status": "not_defined",
          "landlord_details_value": "Не установлен",
          "landlord_type": "not_defined",
          "landlord_type_display": "Не установлено",
          "landlord_signatory_status": "not_defined",
          "landlord_signatory_value": "Не установлен",
          "landlord_signatory_basis": "not_defined",
          "landlord_signatory_basis_display": "Не установлено",
          "tenant_details_status": "not_defined",
          "tenant_details_value": "Не установлен",
          "tenant_type": "not_defined",
          "tenant_type_display": "Не установлено",
          "tenant_signatory_status": "not_defined",
          "tenant_signatory_value": "Не установлен",
          "tenant_signatory_basis": "not_defined",
          "tenant_signatory_basis_display": "Не установлено",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Арендодателя (наименование/ФИО
           и реквизиты, а не просто "Арендодатель").
        2. Найди прямую цитату с идентификацией Арендатора.
        3. Найди прямую цитату о подписантах и основаниях полномочий.
        4. Найди прямую цитату о корпоративном одобрении.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "landlord_details_status": "<defined / not_defined>",
          "landlord_details_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "landlord_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "landlord_type_display": "<текст или 'Не установлено'>",
          "landlord_signatory_status": "<defined / not_defined>",
          "landlord_signatory_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "landlord_signatory_basis": "<charter / poa / order / other / not_defined>",
          "landlord_signatory_basis_display": "<текст или 'Не установлено'>",
          "tenant_details_status": "<defined / not_defined>",
          "tenant_details_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "tenant_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "tenant_type_display": "<текст или 'Не установлено'>",
          "tenant_signatory_status": "<defined / not_defined>",
          "tenant_signatory_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "tenant_signatory_basis": "<charter / poa / order / other / not_defined>",
          "tenant_signatory_basis_display": "<текст или 'Не установлено'>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендодатель арендатор именуем в лице действующего на основании ИНН ОГРН крупная сделка сделка с заинтересованностью одобрение решение единственного участника реквизиты"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет аренды"
        - "арендная плата"
        - "срок аренды"
        - "капитальный ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.98]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lease_parties_and_authority_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды сведения
        об Арендодателе, Арендаторе, подписантах, основаниях полномочий
        и корпоративном одобрении.
        Не анализируй предмет аренды, плату, ремонт или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lease_parties_and_authority_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (landlord_details_status, tenant_details_status, landlord_signatory_status,
              tenant_signatory_status, corporate_approval_status) = "defined"
             или landlord_signatory_basis / tenant_signatory_basis ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - landlord_details_status = "not_defined";
           - landlord_type = "not_defined";
           - landlord_signatory_status = "not_defined";
           - landlord_signatory_basis = "not_defined";
           - tenant_details_status = "not_defined";
           - tenant_type = "not_defined";
           - tenant_signatory_status = "not_defined";
           - tenant_signatory_basis = "not_defined";
           - corporate_approval_status = "not_defined";
           - landlord_details_value = "Не установлен";
           - landlord_type_display = "Не установлено";
           - landlord_signatory_value = "Не установлен";
           - landlord_signatory_basis_display = "Не установлено";
           - tenant_details_value = "Не установлен";
           - tenant_type_display = "Не установлено";
           - tenant_signatory_value = "Не установлен";
           - tenant_signatory_basis_display = "Не установлено";
           - corporate_approval_details = "Не установлено";
           - не выполняй остальные шаги.

        1. landlord_details_status:
           - "defined" — если Арендодатель прямо идентифицирован (наименование/ФИО
             и хотя бы один реквизит — ИНН, ОГРН, адрес);
           - "not_defined" — если указано только родовое слово "Арендодатель"
             без конкретных реквизитов.

        2. landlord_details_value:
           Краткое user-facing описание Арендодателя.
           - если указано, верни краткое summary, например:
             "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. landlord_type:
           - "legal_entity" — ООО, АО, ПАО и иные юрлица;
           - "individual" — физическое лицо без статуса ИП;
           - "individual_entrepreneur" — ИП (указан ОГРНИП);
           - "not_defined" — тип прямо не указан.

        4. landlord_type_display:
           Человекочитаемое описание типа Арендодателя.
           - "Юридическое лицо" — если "legal_entity";
           - "Физическое лицо" — если "individual";
           - "Индивидуальный предприниматель" — если "individual_entrepreneur";
           - "Не установлено" — если "not_defined".

        5. landlord_signatory_status:
           - "defined" — если подписант Арендодателя прямо указан;
           - "not_defined" — если прямо не указан.

        6. landlord_signatory_value:
           Краткое описание подписанта от Арендодателя.
           - если указан, верни краткое summary, например:
             "Генеральный директор Иванов И.И.";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. landlord_signatory_basis:
           - "charter" — действует на основании устава;
           - "poa" — действует на основании доверенности;
           - "order" — действует на основании приказа;
           - "other" — иное основание, прямо указанное в тексте;
           - "not_defined" — основание не указано.

        8. landlord_signatory_basis_display:
           Человекочитаемое описание основания полномочий Арендодателя.
           - "На основании Устава" — если "charter";
           - "На основании доверенности" — если "poa";
           - "На основании приказа" — если "order";
           - краткая формулировка из текста — если "other";
           - "Не установлено" — если "not_defined".

        9. tenant_details_status — аналогично п.1, но для Арендатора.

        10. tenant_details_value — аналогично п.2, но для Арендатора.

        11. tenant_type — аналогично п.3, но для Арендатора.

        12. tenant_type_display — аналогично п.4, но для Арендатора.

        13. tenant_signatory_status — аналогично п.5, но для Арендатора.

        14. tenant_signatory_value — аналогично п.6, но для Арендатора.

        15. tenant_signatory_basis — аналогично п.7, но для Арендатора.

        16. tenant_signatory_basis_display — аналогично п.8, но для Арендатора.

        17. corporate_approval_status:
            - "defined" — если корпоративное одобрение прямо указано, либо
              прямо указано, что одобрение не требуется;
            - "not_defined" — если вопрос одобрения прямо не затронут.

        18. corporate_approval_details:
            Краткое описание одобрения или указания на его ненужность.
            - если указано, верни краткое summary, например:
              "Решение единственного участника Арендатора от 15.01.2024",
              "Одобрение не требуется, сделка не является крупной";
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_parties_and_authority_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все details/value/display-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или ФЗ вместо текста договора.
        - Родовое слово "Арендодатель"/"Арендатор" без конкретного наименования
          и реквизитов не считается идентификацией стороны — используй
          "not_defined" для landlord_details_status/tenant_details_status.
        - Не путай ИНН/ОГРН арендодателя и арендатора между собой — сверяй,
          к какой стороне относится каждый реквизит.
        - Не смешивай подписанта и основание его полномочий с идентификацией
          самой стороны (юридического лица/физлица).
        - Не смешивай предмет аренды, арендную плату, ремонт и споры с темами
          настоящего check.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          (например, разные реквизиты для одной стороны) и конфликт нельзя
          разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствуют преамбула, блок реквизитов и подписей.
           → presence = "missing"; все status и enum-поля = "not_defined"; все details/value/display = соответствующий fallback.

        2. Только роли без реквизитов.
           В тексте используются обозначения "Арендодатель" и "Арендатор" без раскрытия наименований, ОГРН/ИНН и паспортных данных.
           → presence = "present"; landlord_details_status = "not_defined" (value = "Не установлен"), tenant_details_status = "not_defined" (value = "Не установлен").

        3. Противоречие между фрагментами.
           В преамбуле указан один директор (Иванов И.И.), а в блоке подписей без объяснения причин указан другой (Сидоров С.С.).
           → presence = "unclear"; signatory_status = "not_defined"; signatory_value = "Не удалось определить".

        4. Оговорка об одобрении сделки.
           "Стороны заверяют, что сделка не требует одобрения органами управления Сторон."
           → presence = "present"; corporate_approval_status = "defined"; corporate_approval_details = "Одобрение не требуется, сделка не является крупной/с заинтересованностью".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_parties_and_authority_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для landlord_type/tenant_type используй только: "legal_entity", "individual", "individual_entrepreneur", "not_defined".
        - Для landlord_signatory_basis/tenant_signatory_basis используй только: "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных:
          * landlord_details_value → "Не установлен"
          * landlord_type_display → "Не установлено"
          * landlord_signatory_value → "Не установлен"
          * landlord_signatory_basis_display → "Не установлено"
          * tenant_details_value → "Не установлен"
          * tenant_type_display → "Не установлено"
          * tenant_signatory_value → "Не установлен"
          * tenant_signatory_basis_display → "Не установлено"
          * corporate_approval_details → "Не установлено"
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_parties_and_authority_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификационных сведений сторон, полномочий подписантов и одобрения сделки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "landlord_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации Арендодателя. Внутреннее enum-поле."
          required: true

        - name: "landlord_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Арендодатель"
          description: >
            Наименование/ФИО и реквизиты Арендодателя, например:
            "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "landlord_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          display_in_grid: false
          description: "Тип Арендодателя. Внутреннее enum-поле."
          required: true

        - name: "landlord_type_display"
          label: "Статус арендодателя"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание типа Арендодателя: "Юридическое лицо" /
            "Физическое лицо" / "Индивидуальный предприниматель".
            Fallback: "Не установлено".
          required: false

        - name: "landlord_signatory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания подписанта Арендодателя. Внутреннее enum-поле."
          required: true

        - name: "landlord_signatory_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Арендодатель: подписант"
          description: >
            Подписант от Арендодателя, например: "Генеральный директор
            Иванов И.И.".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "landlord_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          display_in_grid: false
          description: "Основание полномочий подписанта Арендодателя. Внутреннее enum-поле."
          required: true

        - name: "landlord_signatory_basis_display"
          label: "Основание полномочий подписанта арендодателя"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание основания полномочий подписанта
            Арендодателя: "На основании Устава" / "На основании доверенности" /
            "На основании приказа".
            Fallback: "Не установлено".
          required: false

        - name: "tenant_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации Арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Арендатор"
          description: >
            Наименование/ФИО и реквизиты Арендатора, например:
            "ООО «Бета», ИНН 7700000002".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "tenant_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          display_in_grid: false
          description: "Тип Арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_type_display"
          label: "Статус арендатора"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание типа Арендатора: "Юридическое лицо" /
            "Физическое лицо" / "Индивидуальный предприниматель".
            Fallback: "Не установлено".
          required: false

        - name: "tenant_signatory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания подписанта Арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_signatory_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Арендатор: подписант"
          description: >
            Подписант от Арендатора, например: "Директор Петров П.П.".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "tenant_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          display_in_grid: false
          description: "Основание полномочий подписанта Арендатора. Внутреннее enum-поле."
          required: true

        - name: "tenant_signatory_basis_display"
          label: "Основание полномочий подписанта арендатора"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Человекочитаемое описание основания полномочий подписанта
            Арендатора: "На основании Устава" / "На основании доверенности" /
            "На основании приказа".
            Fallback: "Не установлено".
          required: false

        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на корпоративное одобрение. Внутреннее enum-поле."
          required: true

        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Корпоративное одобрение"
          description: >
            Формулировка о корпоративном одобрении или его ненужности,
            например: "Решение единственного участника Арендатора от 15.01.2024".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: landlord_title_check
    name: "Право собственности арендодателя на объект аренды (ст. 608 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре подтверждения права
      собственности арендодателя на объект аренды, ссылки на правоустанавливающие
      документы и ЕГРН, а также указания на отсутствие обременений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "правоустанавливающие документы"
        - "свидетельство о праве"
        - "выписка из ЕГРН"
        - "свободно от обременений"
        - "не заложено"
        - "не арестовано"
        - "право сдачи в аренду"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)свободн(о|ым)\\s+от\\s+обременен"
        - "(?i)выписк(а|и)\\s+из\\s+ЕГРН"
        - "(?i)не\\s+заложен|не\\s+арестован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: подтверждение права собственности
        арендодателя на объект аренды и заявленное состояние объекта
        (обременения) до его передачи в аренду.

        Нормативный ориентир:
        - ст. 608 ГК РФ — право сдачи имущества в аренду
        - ст. 613 ГК РФ — права третьих лиц на объект аренды

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Молчание договора об обременениях — это отсутствие информации
          ("not_defined"), а не автоматическое подтверждение того, что объект
          свободен от залога, ареста или прав третьих лиц. Заверение об
          отсутствии обременений должно быть прямо сформулировано в тексте.
        - Эти поля фиксируют заявленное состояние объекта до передачи, а не
          механизм обеспечения обязательств по самому договору аренды
          (обеспечительный платёж и иные обеспечительные механизмы договора
          фиксируются в другом check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности арендодателя.
        2. Есть ли ссылка на правоустанавливающие документы.
        3. Есть ли ссылка на ЕГРН / выписку из ЕГРН.
        4. Есть ли прямое заверение об отсутствии залога.
        5. Есть ли прямое заверение об отсутствии ареста.
        6. Есть ли прямое заверение об отсутствии прав третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" / "Не установлено" — если
             условие прямо не указано (согласуй род с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Не выводи заверение об отсутствии обременений из молчания договора —
          только из прямой формулировки.
        6. Не используй "None", "null", "not_defined" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул подтверждён:
        Фрагмент:
        "Арендодатель подтверждает, что помещение принадлежит ему на праве
        собственности на основании договора купли-продажи от 15.01.2020,
        запись в ЕГРН № 77:06:0001001:123-77/001/2020-1. Помещение свободно
        от залога, ареста и прав третьих лиц."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "Принадлежит на праве собственности на основании договора купли-продажи от 15.01.2020",
          "title_documents_status": "defined",
          "title_documents_details": "Договор купли-продажи от 15.01.2020",
          "egrn_reference_status": "defined",
          "egrn_reference_details": "Запись в ЕГРН № 77:06:0001001:123-77/001/2020-1",
          "no_pledge_status": "defined",
          "no_pledge_details": "Свободно от залога",
          "no_arrest_status": "defined",
          "no_arrest_details": "Свободно от ареста",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "Свободно от прав третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Арендодатель подтверждает, что помещение принадлежит ему на праве собственности на основании договора купли-продажи от 15.01.2020. Помещение свободно от залога, ареста и прав третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют (молчание, не заверение):
        Фрагмент:
        "Арендодатель предоставляет помещение в аренду."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Не установлен",
          "title_documents_status": "not_defined",
          "title_documents_details": "Не установлены",
          "egrn_reference_status": "not_defined",
          "egrn_reference_details": "Не установлена",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Не установлено",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Не установлено",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — титул подтверждён, но обременения не упомянуты:
        Фрагмент:
        "Помещение принадлежит Арендодателю на праве собственности,
        свидетельство о государственной регистрации от 10.03.2018."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "Принадлежит на праве собственности",
          "title_documents_status": "defined",
          "title_documents_details": "Свидетельство о государственной регистрации от 10.03.2018",
          "egrn_reference_status": "not_defined",
          "egrn_reference_details": "Не установлена",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Не установлено",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Не установлено",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Помещение принадлежит Арендодателю на праве собственности, свидетельство о государственной регистрации от 10.03.2018."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности арендодателя.
        2. Найди прямую цитату о правоустанавливающих документах.
        3. Найди прямую цитату о ЕГРН.
        4. Найди прямые цитаты об отсутствии залога, ареста, прав третьих лиц —
           убедись, что это прямое заверение, а не твой вывод из молчания
           договора.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай заверения.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "title_documents_status": "<defined / not_defined>",
          "title_documents_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "egrn_reference_status": "<defined / not_defined>",
          "egrn_reference_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принадлежит на праве собственности правоустанавливающие документы выписка из ЕГРН свободно от обременений не заложено не арестовано права третьих лиц право сдачи в аренду свидетельство о праве"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "арендная плата"
        - "срок аренды"
        - "акт приёма-передачи"
        - "ремонт"
        - "улучшения"
        - "субаренда"
        - "расторжение"
        - "страхование"
        - "обеспечительный платеж"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "landlord_title_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды подтверждение
        титула арендодателя, правоустанавливающие документы, ЕГРН и прямые
        заверения об отсутствии обременений (залог, арест, права третьих лиц).
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. landlord_title_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (title_confirmation_status, title_documents_status, egrn_reference_status,
              no_pledge_status, no_arrest_status, no_third_party_rights_status) = "defined";
           - "missing" — если все содержательные статусные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - title_confirmation_status = "not_defined";
           - title_documents_status = "not_defined";
           - egrn_reference_status = "not_defined";
           - no_pledge_status = "not_defined";
           - no_arrest_status = "not_defined";
           - no_third_party_rights_status = "not_defined";
           - title_confirmation_details = "Не установлен";
           - title_documents_details = "Не установлены";
           - egrn_reference_details = "Не установлена";
           - no_pledge_details = "Не установлено";
           - no_arrest_details = "Не установлено";
           - no_third_party_rights_details = "Не установлено";
           - не выполняй остальные шаги.

        1. title_confirmation_status:
           - "defined" — если право собственности арендодателя прямо
             подтверждено в тексте;
           - "not_defined" — если прямо не подтверждено. Не выводи подтверждение
             из самого факта заключения договора аренды.

        2. title_confirmation_details:
           Краткое user-facing описание подтверждения права собственности.
           - если указано, верни краткое summary, например:
             "Принадлежит на праве собственности на основании договора
             купли-продажи от 15.01.2020";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. title_documents_status:
           - "defined" — если правоустанавливающие документы прямо указаны;
           - "not_defined" — если прямо не указаны.

        4. title_documents_details:
           Краткое описание правоустанавливающих документов.
           - если указаны, верни краткое summary, например:
             "Договор купли-продажи от 15.01.2020";
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. egrn_reference_status:
           - "defined" — если ЕГРН/выписка из ЕГРН прямо упомянуты;
           - "not_defined" — если прямо не упомянуты.

        6. egrn_reference_details:
           Краткое описание ссылки на ЕГРН.
           - если указана, верни краткое summary, например:
             "Запись в ЕГРН № 77:06:0001001:123-77/001/2020-1";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. no_pledge_status:
           - "defined" — только если в тексте есть прямое заверение об
             отсутствии залога на объект;
           - "not_defined" — если такого прямого заверения нет (включая случай,
             когда договор просто не упоминает залог вообще — это молчание,
             а не заверение).

        8. no_pledge_details:
           Краткое описание заверения об отсутствии залога.
           - если указано, верни краткое summary, например: "Свободно от залога";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. no_arrest_status — аналогично п.7, но для ареста.

        10. no_arrest_details — аналогично п.8, но для ареста, например:
            "Свободно от ареста".

        11. no_third_party_rights_status — аналогично п.7, но для прав третьих лиц.

        12. no_third_party_rights_details — аналогично п.8, но для прав третьих
            лиц, например: "Свободно от прав третьих лиц".
        </task>

        <context_rules>
        - Перед остальными полями заполни landlord_title_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлены" / "Не установлена" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Молчание договора об обременениях (залог, арест, права третьих лиц) —
          это "not_defined", а не "defined". Заверение об отсутствии обременений
          должно быть прямо сформулировано в тексте (например, "свободно от
          залога", "не находится под арестом", "права третьих лиц отсутствуют").
        - no_pledge/no_arrest/no_third_party_rights фиксируют заявленное
          состояние объекта до передачи в аренду, а не обеспечительные
          механизмы самого договора аренды (обеспечительный платёж и т.п.) —
          это относится к другому check.
        - Не смешивай подтверждение титула, документы и ЕГРН с арендной платой,
          ремонтом, субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет подтверждения титула, правоустанавливающих документов или упоминания обременений.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Молчание договора об обременениях.
           Титул и выписка из ЕГРН прямо указаны, однако об отсутствии залога и прав третьих лиц в договоре ничего не сказано.
           → presence = "present"; title_confirmation_status = "defined", egrn_reference_status = "defined", а поля по залогу/аресту = "not_defined" (value = "Не установлено").

        3. Противоречие между фрагментами.
           В разделе 1 указано, что объект свободен от залога, а в разделе 9 содержится ссылка на согласие залогодержателя банка на аренду.
           → presence = "unclear"; no_pledge_status = "not_defined"; no_pledge_details = "Не удалось определить".

        4. Отсылка на предоставление документов.
           "Арендодатель обязуется предоставить выписку из ЕГРН в течение 10 дней после подписания договора" (реквизиты документов на момент подписания не зафиксированы).
           → presence = "present"; title_documents_status = "not_defined" (value = "Не установлены").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для landlord_title_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * title_confirmation_details → "Не установлен"
          * title_documents_details → "Не установлены"
          * egrn_reference_details → "Не установлена"
          * no_pledge_details → "Не установлено"
          * no_arrest_details → "Не установлено"
          * no_third_party_rights_details → "Не установлено"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "landlord_title_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие положений о титуле арендодателя и отсутствии обременений объекта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "title_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения права собственности арендодателя. Внутреннее enum-поле."
          required: true

        - name: "title_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Титул арендодателя"
          description: >
            Формулировка о праве собственности арендодателя на объект аренды,
            например: "Принадлежит на праве собственности на основании
            договора купли-продажи от 15.01.2020".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "title_documents_status"
          type: "string"
