        - "Росреестр"
        - "ЕГРН"
        - "расходы на регистрацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)Росреестр|ЕГРН"

  - id: "handover_act"
    name: "Акт приема-передачи объекта аренды"
    description: "Проверяет наличие условия об акте передачи"
    legal_base: "ст. 611 ГК РФ, судебная практика"
    severity: "high"
