trigger_definitions:

  real_estate_lease:
    any_keywords:
      - "(?i)нежил[оаоеые]+\\s+помещени[ея]"
      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bсооружени[ея]\\b"
      - "(?i)\\bофис\\b"
      - "(?i)\\bсклад\\b"
      - "(?i)объект\\s+недвижимост[ии]"
      - "(?i)кадастров[а-яё]+\\s+номер"
      - "(?i)\\bЕГРН\\b"
      - "(?i)\\bРосреестр\\b"
      - "(?i)\\bэтаж\\b"
      - "(?i)\\bплощад[ьи]\\b"

  land_lease:
    any_keywords:
      - "(?i)земельн[а-яё]+\\s+участ[оа]к"
      - "(?i)кадастров[а-яё]+\\s+номер"
