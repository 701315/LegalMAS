  - id: rent_payment_and_indexation_check
    name: "Арендная плата: фиксированная и переменная части, индексация, обеспечительный платёж"
    description: >
      Фактографическая проверка структуры арендной платы: фиксированная часть,
      переменная часть (OPEX/коммунальные), механизм индексации, периодичность
      платежей, обеспечительный платёж и последствия просрочки.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендная плата"
        - "ежемесячно"
        - "фиксированная часть"
        - "постоянная часть"
        - "переменная часть"
        - "индексация"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
        - "обеспечительный платеж"
        - "пени"
        - "неустойка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци"
        - "(?i)переменн(ая|ой)\\s+част"
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: структура арендной платы, индексация
        и обеспечительный платёж.

        Нормативный ориентир:
        - ст. 614 ГК РФ — арендная плата
        - ст. 381.1 ГК РФ — обеспечительный платёж

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли фиксированная (постоянная) часть арендной платы и её размер.
        2. Есть ли переменная часть арендной платы.
        3. Есть ли механизм индексации и его условия.
        4. Кто несёт коммунальные / эксплуатационные расходы.
        5. Есть ли обеспечительный платёж и его размер.
        6. Есть ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — структура определена:
        Фрагмент:
        "Арендная плата состоит из постоянной части — 200 000 рублей в месяц
        и переменной части, определяемой по фактическим расходам на коммунальные
        услуги. Постоянная часть индексируется ежегодно на ИПЦ, но не более 7%.
        Обеспечительный платёж — 400 000 рублей. За просрочку — 0,1% в день."

        Ответ:
        {
          "fixed_rent_status": "defined",
          "fixed_rent_details": "200 000 рублей в месяц",
          "variable_rent_status": "defined",
          "variable_rent_details": "переменная часть по фактическим расходам на коммунальные услуги",
          "indexation_status": "defined",
          "indexation_details": "ежегодно на ИПЦ, но не более 7%",
          "utilities_allocation": "tenant",
          "security_deposit_status": "defined",
          "security_deposit_details": "400 000 рублей",
          "late_payment_status": "defined",
          "late_payment_details": "0,1% в день",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Арендная плата состоит из постоянной части — 200 000 рублей в месяц и переменной части, определяемой по фактическим расходам на коммунальные услуги."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор оплачивает аренду в порядке, согласованном сторонами."

        Ответ:
        {
          "fixed_rent_status": "not_defined",
          "fixed_rent_details": "Данные не определены",
          "variable_rent_status": "not_defined",
          "variable_rent_details": "Данные не определены",
          "indexation_status": "not_defined",
          "indexation_details": "Данные не определены",
          "utilities_allocation": "not_defined",
          "security_deposit_status": "not_defined",
          "security_deposit_details": "Данные не определены",
          "late_payment_status": "not_defined",
          "late_payment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о фиксированной части арендной платы.
        2. Найди прямую цитату о переменной части.
        3. Найди прямую цитату об индексации.
        4. Найди прямую цитату о коммунальных расходах.
        5. Найди прямую цитату об обеспечительном платеже.
        6. Найди прямую цитату о последствиях просрочки.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

