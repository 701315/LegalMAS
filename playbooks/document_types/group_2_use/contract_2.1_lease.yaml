        - "гарантийный платеж"
        - "возврат депозита"
        - "удержание депозита"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)депозит|гарантийн(ый|ого)\\s+плат"

  - id: "sublease_control"
    name: "Субаренда и передача прав третьим лицам"
