# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  area_pattern: "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: lease_subject_extraction
    name: "Предмет аренды, срок, арендная плата и целевое использование"
    description: >
      Фактографическая проверка наличия в договоре аренды описания объекта,
      срока аренды, размера арендной платы, целевого назначения использования
      и механизма передачи объекта. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "предмет аренды"
        - "объект аренды"
        - "арендная плата"
        - "срок аренды"
        - "акт приема-передачи"
        - "помещение"
        - "оборудование"
        - "здание"
        - "земельный участок"
        - "назначение использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ (ст. 606–625).
        Проверяется только один вопрос: предмет аренды, срок, арендная плата,
        целевое использование и механизм передачи объекта.

        Нормативный ориентир:
        - ст. 606–607 ГК РФ — предмет аренды
        - ст. 610 ГК РФ — срок аренды
        - ст. 614 ГК РФ — арендная плата
        - ст. 615 ГК РФ — использование арендованного имущества

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой тип объекта аренды указан.
        2. Как описан объект аренды.
        3. Какой срок аренды установлен.
        4. Какой размер арендной платы установлен.
        5. Указано ли целевое назначение использования объекта.
        6. Какой механизм передачи объекта предусмотрен.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" / "Не установлено" — если условие
             прямо не указано (род и число согласуй с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Если параметр определяется по названному внешнему документу
           (спецификации, приложению, заявке, прайс-листу) — это не отсутствие
           регулирования; отрази это в user-facing поле как "Определяется
           согласно <документ>".
        6. Общая фраза вроде "в соответствии с действующим законодательством"
           без конкретизации не является достаточным основанием для "defined".
        7. Не оценивай серьёзность риска — только фиксируй, что есть в тексте.
        8. Юрист будет использовать результат в сравнительной таблице.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён:
        Фрагмент:
        "Арендодатель передаёт Арендатору во временное владение и пользование
        нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу:
        г. Москва, ул. Ленина, д. 10, помещение III. Срок аренды — 3 года
        с даты подписания акта приёма-передачи. Арендная плата составляет
        250 000 рублей в месяц. Помещение используется исключительно
        под офис. Передача осуществляется по акту приёма-передачи."

        Ответ:
        {
          "asset_type": "real_estate",
          "asset_description_status": "defined",
          "asset_description_value": "нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу: г. Москва, ул. Ленина, д. 10, помещение III",
          "lease_term_status": "defined",
          "lease_term_value": "3 года с даты подписания акта приёма-передачи",
          "rent_amount_status": "defined",
          "rent_amount_value": "250 000 рублей в месяц",
          "use_purpose_status": "defined",
          "use_purpose_value": "исключительно под офис",
          "handover_mechanism": "act",
          "handover_mechanism_display": "По акту приёма-передачи",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт Арендатору во временное владение и пользование нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу: г. Москва, ул. Ленина, д. 10, помещение III."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор аренды."

        Ответ:
        {
          "asset_type": "not_defined",
          "asset_description_status": "not_defined",
          "asset_description_value": "Не установлен",
          "lease_term_status": "not_defined",
          "lease_term_value": "Не установлен",
          "rent_amount_status": "not_defined",
          "rent_amount_value": "Не установлена",
          "use_purpose_status": "not_defined",
          "use_purpose_value": "Не установлено",
          "handover_mechanism": "not_defined",
          "handover_mechanism_display": "Не установлен",
          "evidence": []
        }

        Пример 3 — параметр определяется через внешний документ:
        Фрагмент:
        "Размер арендной платы, срок аренды и порядок передачи Оборудования
        определяются Спецификацией №1, являющейся неотъемлемой частью
        настоящего Договора."

        Ответ:
        {
          "asset_type": "equipment",
          "asset_description_status": "defined",
          "asset_description_value": "Оборудование, состав и характеристики которого определяются Спецификацией №1",
          "lease_term_status": "defined",
          "lease_term_value": "Определяется согласно Спецификации №1",
          "rent_amount_status": "defined",
          "rent_amount_value": "Определяется согласно Спецификации №1",
          "use_purpose_status": "not_defined",
          "use_purpose_value": "Не установлено",
          "handover_mechanism": "other",
          "handover_mechanism_display": "Порядок передачи определяется Спецификацией №1",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Размер арендной платы, срок аренды и порядок передачи Оборудования определяются Спецификацией №1, являющейся неотъемлемой частью настоящего Договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием объекта аренды.
        2. Найди прямую цитату о сроке аренды.
        3. Найди прямую цитату о размере арендной платы.
        4. Найди прямую цитату о целевом назначении.
        5. Найди прямую цитату о механизме передачи объекта.
        6. Если по параметру есть отсылка к спецификации, приложению, заявке
           или прайс-листу — зафиксируй как "Определяется согласно ...",
           а не как отсутствие регулирования.
        7. Если сказано только "в соответствии с законодательством" —
           это not_defined, а не defined.
        8. Если в разных фрагментах указаны противоречащие друг другу значения
           и конфликт нельзя снять по тексту — верни "Не удалось определить",
           а в status используй "not_defined".
        9. Если прямой цитаты нет — верни "not_defined" и корректный fallback
           по роду. Не додумывай условия.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "asset_type": "<real_estate / land / equipment / vehicle / other / mixed / not_defined>",
          "asset_description_status": "<defined / not_defined>",
          "asset_description_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "lease_term_status": "<defined / not_defined>",
          "lease_term_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "rent_amount_status": "<defined / not_defined>",
          "rent_amount_value": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "use_purpose_status": "<defined / not_defined>",
          "use_purpose_value": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "handover_mechanism": "<act / invoice / registration / other / not_defined>",
          "handover_mechanism_display": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "rent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет аренды объект аренды арендная плата срок аренды назначение использования акт приёма-передачи помещение оборудование здание земельный участок площадь кадастровый номер"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "неотделимые улучшения"
        - "субаренда"
        - "индексация"
        - "обеспечительный платеж"
        - "досрочное расторжение"
        - "преимущественное право"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "lease_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора аренды
        сведения только о предмете аренды, сроке аренды, размере арендной платы,
        целевом назначении использования и механизме передачи объекта.
        Не анализируй ремонт, улучшения, субаренду, расторжение, споры или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lease_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - asset_type = "not_defined";
           - asset_description_status = "not_defined";
           - lease_term_status = "not_defined";
           - rent_amount_status = "not_defined";
           - use_purpose_status = "not_defined";
           - handover_mechanism = "not_defined";
           - asset_description_value = "Не установлен";
           - lease_term_value = "Не установлен";
           - rent_amount_value = "Не установлена";
           - use_purpose_value = "Не установлено";
           - handover_mechanism_display = "Не установлен";
           - не выполняй остальные шаги.

        1. asset_type:
           - "real_estate" — нежилое или жилое помещение, здание, строение, сооружение;
           - "land" — земельный участок;
           - "equipment" — оборудование, станки, машины (не транспорт);
           - "vehicle" — транспортное средство;
           - "other" — иной объект, прямо названный в тексте;
           - "mixed" — несколько разнотипных объектов одновременно;
           - "not_defined" — тип объекта прямо не определён.

        2. asset_description_status:
           - "defined" — если объект аренды прямо описан в тексте, либо прямо
             сказано, что состав/характеристики объекта определяются названным
             внешним документом (спецификацией, приложением, заявкой);
           - "not_defined" — если объект прямо не описан или его нельзя надёжно
             определить.

        3. asset_description_value:
           Краткое user-facing описание объекта аренды на русском языке.
           Правила:
           - если объект прямо описан, верни краткое summary (1–2 коротких фразы),
             например: "Нежилое помещение площадью 150 кв.м по адресу:
             г. Москва, ул. Ленина, д. 10";
           - если объект определяется по названному внешнему документу, верни,
             например: "Оборудование согласно Спецификации №1";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        4. lease_term_status:
           - "defined" — если срок аренды прямо указан, либо прямо сказано,
             что срок определяется названным внешним документом;
           - "not_defined" — если срок прямо не указан или его нельзя надёжно
             определить.

        5. lease_term_value:
           Краткое user-facing описание срока аренды на русском языке.
           Правила:
           - если срок прямо указан, верни краткое summary, например:
             "3 года с даты подписания акта приёма-передачи";
           - если срок определяется по названному внешнему документу, верни,
             например: "Определяется согласно Спецификации №1";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        6. rent_amount_status:
           - "defined" — если размер арендной платы прямо указан, либо прямо
             сказано, что размер определяется названным внешним документом
             (прайс-листом, спецификацией, счётом);
           - "not_defined" — если размер прямо не указан или его нельзя надёжно
             определить.

        7. rent_amount_value:
           Краткое user-facing описание размера арендной платы на русском языке.
           Правила:
           - если размер прямо указан, верни краткое summary, например:
             "250 000 рублей в месяц";
           - если размер определяется по названному внешнему документу, верни,
             например: "Определяется согласно прайс-листу Арендодателя";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        8. use_purpose_status:
           - "defined" — если целевое назначение использования объекта прямо
             указано;
           - "not_defined" — если назначение прямо не указано или его нельзя
             надёжно определить.

        9. use_purpose_value:
           Краткое user-facing описание целевого назначения на русском языке.
           Правила:
           - если назначение прямо указано, верни краткое summary, например:
             "Исключительно под офис";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        10. handover_mechanism:
            - "act" — передача по акту приёма-передачи;
            - "invoice" — передача по накладной или товарному документу;
            - "registration" — передача через государственную регистрацию;
            - "other" — иной механизм, прямо указанный в тексте (в т.ч. если
              механизм определяется отдельным документом);
            - "not_defined" — механизм передачи прямо не определён.

        11. handover_mechanism_display:
            Краткое user-facing описание механизма передачи объекта на русском языке.
            Правила:
            - "По акту приёма-передачи" — если применяется "act";
            - "По накладной" — если применяется "invoice";
            - "Через государственную регистрацию" — если применяется "registration";
            - краткая формулировка из текста — если применяется "other", например:
              "Порядок передачи определяется Спецификацией №1";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля и enum = "not_defined", а все value/display-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлена" / "Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай предмет, срок, плату, назначение и передачу с ремонтом,
          улучшениями, субарендой, индексацией, обеспечительным платежом,
          расторжением и иными нерелевантными темами.
        - Если конкретный параметр (объект, срок, плата, механизм передачи)
          прямо определяется названным внешним документом (спецификацией,
          приложением, заявкой, прайс-листом, счётом), считай его определённым
          и отрази это в user-facing поле в формате "Определяется согласно <документ>".
        - Общие фразы вроде "в соответствии с законодательством РФ" без
          конкретизации — это not_defined, а не defined.
        - Если в разных фрагментах указаны разные значения одного параметра
          и конфликт нельзя разрешить по тексту (например, приложениям явно не
          придан приоритет):
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания объекта аренды, ни срока, ни условий об оплате.
           → presence = "missing"; все status-поля и enum = "not_defined"; все value/display-поля = соответствующий fallback.

        2. Прямое указание на согласование в будущем.
           "Срок аренды и размер арендной платы будут согласованы Сторонами дополнительно в соглашении."
           → presence = "present"; соответствующие status = "not_defined"; value = "Не установлен".

        3. Противоречие между фрагментами.
           В одном разделе арендная плата составляет 100 000 рублей, а в приложении — 120 000 рублей без механизма приоритета.
           → presence = "unclear"; соответствующие status = "not_defined"; value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Объект, срок или плата определяются согласно спецификации, приложению или заявке.
           → presence = "present"; соответствующие status = "defined"; value = "Определяется согласно <название документа>".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для asset_type используй только: "real_estate", "land", "equipment", "vehicle", "other", "mixed", "not_defined".
        - Для handover_mechanism используй только: "act", "invoice", "registration", "other", "not_defined".
        - Fallback при отсутствии данных:
          * asset_description_value → "Не установлен"
          * lease_term_value → "Не установлен"
          * rent_amount_value → "Не установлена"
          * use_purpose_value → "Не установлено"
          * handover_mechanism_display → "Не установлен"
        - Fallback при противоречии или неоднозначности:
          * все value / display поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету, сроку, арендной плате, использованию и передаче объекта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "asset_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["real_estate", "land", "equipment", "vehicle", "other", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип объекта аренды. Внутреннее enum-поле."
          required: true

        - name: "asset_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения объекта аренды. Внутреннее enum-поле."
          required: true

        - name: "asset_description_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Объект аренды"
          description: >
            Краткое user-facing описание объекта аренды, например:
            "Нежилое помещение площадью 150 кв.м по адресу: г. Москва, ул. Ленина, д. 10",
            "Оборудование согласно Спецификации №1".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "lease_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока аренды. Внутреннее enum-поле."
          required: true

        - name: "lease_term_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок аренды"
          description: >
            Краткое user-facing описание срока аренды, например:
            "3 года с даты подписания акта приёма-передачи",
            "Определяется согласно Спецификации №1".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "rent_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения арендной платы. Внутреннее enum-поле."
          required: true

        - name: "rent_amount_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Арендная плата"
          description: >
            Краткое user-facing описание размера арендной платы, например:
            "250 000 рублей в месяц",
            "Определяется согласно прайс-листу Арендодателя".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

        - name: "use_purpose_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения целевого назначения. Внутреннее enum-поле."
          required: true

        - name: "use_purpose_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Целевое назначение"
          description: >
            Краткое user-facing описание целевого назначения использования объекта,
            например: "Исключительно под офис".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "handover_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["act", "invoice", "registration", "other", "not_defined"]
          display_in_grid: false
          description: "Механизм передачи объекта. Внутреннее enum-поле."
          required: true

        - name: "handover_mechanism_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Механизм передачи объекта"
          description: >
            Краткое user-facing описание механизма передачи объекта аренды,
            например: "По акту приёма-передачи", "По накладной",
            "Порядок передачи определяется Спецификацией №1".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_subject_identification_check
    name: "Индивидуализация объекта аренды: кадастр, адрес, площадь, идентификаторы"
    description: >
      Фактографическая проверка достаточности идентификации объекта аренды:
      кадастровый номер, адрес, площадь, этаж, номер помещения (для недвижимости);
      серийный номер, VIN, инвентарный номер (для оборудования/транспорта).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "этаж"
        - "номер помещения"
        - "серийный номер"
        - "VIN"
        - "инвентарный номер"
        - "технический паспорт"
        - "поэтажный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: достаточность индивидуализации объекта аренды.

        Нормативный ориентир:
        - ст. 607 ГК РФ — определённость предмета аренды
        - п. 3 ст. 607 ГК РФ — данные, позволяющие определённо установить имущество

        Важно:
        - Твоя задача — только установить, какие идентифицирующие данные прямо
          есть в тексте договора, а каких прямо нет.
        - Не оценивай серьёзность риска незаключённости.
        - Не делай правовой вывод о достаточности идентификации.
        - Сначала определи тип объекта (недвижимость / оборудование или транспорт /
          неясно), затем заполняй поля с учётом того, что часть полей может быть
          не применима к данному типу объекта.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли кадастровый номер объекта.
        2. Есть ли адрес объекта.
        3. Есть ли площадь объекта.
        4. Есть ли указание на этаж и/или номер помещения.
        5. Есть ли серийный номер, VIN или инвентарный номер (для оборудования/транспорта).
        6. Есть ли ссылка на поэтажный план, техпаспорт или иной идентифицирующий документ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо, а поле применимо к типу объекта —
           возвращай статус "not_defined" и текст "Не установлен" / "Не установлена" /
           "Не установлены" (согласуй род и число с существительным поля).
        4. If поле объективно неприменимо к типу объекта (например, серийный
           номер/VIN для объекта недвижимости, или кадастровый номер для
           оборудования/транспорта) — возвращай статус "not_defined" и текст
           "Не применимо".
        5. Не путай кадастровый номер с иными номерами (инвентарный номер,
           номер договора, номер лицевого счёта) — они относятся к разным полям
           и не должны заменять друг друга.
        6. Не используй "None", "null" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — объект недвижимость, индивидуализирован:
        Фрагмент:
        "Объект аренды — нежилое помещение III, кадастровый номер 77:06:0001001:123,
        расположенное по адресу: г. Москва, ул. Ленина, д. 10, 2-й этаж,
        общей площадью 150,5 кв.м. Поэтажный план — Приложение № 1."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "address_status": "defined",
          "address_value": "г. Москва, ул. Ленина, д. 10",
          "area_status": "defined",
          "area_value": "150,5 кв.м",
          "floor_and_unit_status": "defined",
          "floor_and_unit_value": "2-й этаж, помещение III",
          "equipment_identifiers_status": "not_defined",
          "equipment_identifiers_value": "Не применимо",
          "reference_document_status": "defined",
          "reference_document_value": "поэтажный план — Приложение № 1",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Объект аренды — нежилое помещение III, кадастровый номер 77:06:0001001:123, расположенное по адресу: г. Москва, ул. Ленина, д. 10, 2-й этаж, общей площадью 150,5 кв.м."
            }
          ]
        }

        Пример 2 — объект оборудование, частично индивидуализирован:
        Фрагмент:
        "Арендодатель передаёт Арендатору станок токарный, серийный номер SN-88431,
        инвентарный номер 0012-ОС."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Не применимо",
          "address_status": "not_defined",
          "address_value": "Не применимо",
          "area_status": "not_defined",
          "area_value": "Не применимо",
          "floor_and_unit_status": "not_defined",
          "floor_and_unit_value": "Не применимо",
          "equipment_identifiers_status": "defined",
          "equipment_identifiers_value": "Серийный номер SN-88431, инвентарный номер 0012-ОС",
          "reference_document_status": "not_defined",
          "reference_document_value": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт Арендатору станок токарный, серийный номер SN-88431, инвентарный номер 0012-ОС."
            }
          ]
        }

        Пример 3 — объект не индивидуализирован:
        Фрагмент:
        "Арендодатель предоставляет помещение в аренду."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Не установлен",
          "address_status": "not_defined",
          "address_value": "Не установлен",
          "area_status": "not_defined",
          "area_value": "Не установлена",
          "floor_and_unit_status": "not_defined",
          "floor_and_unit_value": "Не установлены",
          "equipment_identifiers_status": "not_defined",
          "equipment_identifiers_value": "Не применимо",
          "reference_document_status": "not_defined",
          "reference_document_value": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определи тип объекта: недвижимость / оборудование или транспорт / неясно.
        2. Найди прямую цитату с кадастровым номером (если объект — недвижимость
           или тип неясен).
        3. Найди прямую цитату с адресом (если объект — недвижимость или тип неясен).
        4. Найди прямую цитату с площадью (если объект — недвижимость или тип неясен).
        5. Найди прямую цитату с этажом и/или номером помещения (если объект —
           недвижимость или тип неясен).
        6. Найди прямую цитату с серийным номером / VIN / инвентарным номером
           (если объект — оборудование, транспорт или тип неясен).
        7. Найди прямую цитату о поэтажном плане / техпаспорте.
        8. Если поле неприменимо к определённому типу объекта — верни status
           "not_defined" и value "Не применимо". Если применимо, но данных нет —
           верни status "not_defined" и корректный fallback по роду/числу
           ("Не установлен" / "Не установлена" / "Не установлены").
        9. Не путай кадастровый номер, инвентарный номер, номер договора и номер
           лицевого счёта между собой.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<текст или 'Не установлен' / 'Не применимо'>",
          "address_status": "<defined / not_defined>",
          "address_value": "<текст или 'Не установлен' / 'Не применимо'>",
          "area_status": "<defined / not_defined>",
          "area_value": "<текст или 'Не установлена' / 'Не применимо'>",
          "floor_and_unit_status": "<defined / not_defined>",
          "floor_and_unit_value": "<текст или 'Не установлены' / 'Не применимо'>",
          "equipment_identifiers_status": "<defined / not_defined>",
          "equipment_identifiers_value": "<текст или 'Не установлены' / 'Не применимо'>",
          "reference_document_status": "<defined / not_defined>",
          "reference_document_value": "<текст или 'Не установлен'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кадастровый номер адрес площадь этаж номер помещения серийный номер VIN инвентарный номер технический паспорт поэтажный план идентификация объекта аренды"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "арендная плата"
        - "срок аренды"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "досрочное расторжение"
        - "обеспечительный платеж"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lease_subject_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды идентифицирующие
        данные объекта: кадастровый номер, адрес, площадь, этаж, номер помещения,
        серийный номер, VIN, инвентарный номер и ссылки на идентифицирующие документы.
        Не анализируй арендную плату, срок, ремонт, субаренду или споры.
        Не оценивай риски и не делай правовой вывод о достаточности индивидуализации.
        </role>

        <context>
        {context}
        </context>

        <task>
        Сначала определи тип объекта аренды по тексту: недвижимость (помещение,
        здание, земельный участок) / оборудование или транспорт / неясно.
        Затем заполни строго следующие поля:

        0. lease_subject_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных статусных полей
             (cadastral_number_status, address_status, area_status,
              floor_and_unit_status, equipment_identifiers_status,
              reference_document_status) = "defined";
           - "missing" — если все эти содержательные статусные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cadastral_number_status = "not_defined";
           - address_status = "not_defined";
           - area_status = "not_defined";
           - floor_and_unit_status = "not_defined";
           - equipment_identifiers_status = "not_defined";
           - reference_document_status = "not_defined";
           - cadastral_number_value = "Не установлен";
           - address_value = "Не установлен";
           - area_value = "Не установлена";
           - floor_and_unit_value = "Не установлены";
           - equipment_identifiers_value = "Не установлены";
           - reference_document_value = "Не установлен";
           - не выполняй остальные шаги.

        1. cadastral_number_status:
           - "defined" — если кадастровый номер прямо указан;
           - "not_defined" — если объект не является недвижимостью (оборудование,
             транспорт) либо номер прямо не указан.

        2. cadastral_number_value:
           Краткое значение кадастрового номера.
           - если указан — верни номер в формате из текста, например: "77:06:0001001:123";
           - если объект не недвижимость — "Не применимо";
           - если объект недвижимость, но номер не указан — "Не установлен".

        3. address_status:
           - "defined" — если адрес прямо указан;
           - "not_defined" — если объект не недвижимость либо адрес не указан.

        4. address_value:
           Краткий адрес объекта (без длинных сопутствующих формулировок).
           - если указан — например: "г. Москва, ул. Ленина, д. 10";
           - если объект не недвижимость — "Не применимо";
           - если объект недвижимость, но адрес не указан — "Не установлен".

        5. area_status:
           - "defined" — если площадь прямо указана;
           - "not_defined" — если объект не недвижимость либо площадь не указана.

        6. area_value:
           Краткое значение площади, например: "150,5 кв.м".
           - если объект не недвижимость — "Не применимо";
           - если объект недвижимость, но площадь не указана — "Не установлена".

        7. floor_and_unit_status:
           - "defined" — если этаж и/или номер помещения прямо указаны;
           - "not_defined" — если объект не недвижимость либо данные не указаны.

        8. floor_and_unit_value:
           Краткое значение этажа и/или номера помещения, например:
           "2-й этаж, помещение III".
           - если объект не недвижимость — "Не применимо";
           - если объект недвижимость, но данные не указаны — "Не установлены".

        9. equipment_identifiers_status:
           - "defined" — если серийный номер, VIN или инвентарный номер прямо указаны;
           - "not_defined" — если объект является недвижимостью либо идентификаторы
             не указаны.

        10. equipment_identifiers_value:
            Краткое перечисление найденных идентификаторов, например:
            "Серийный номер SN-88431, инвентарный номер 0012-ОС".
            - если объект недвижимость — "Не применимо";
            - если объект оборудование/транспорт, но идентификаторы не указаны —
              "Не установлены".

        11. reference_document_status:
            - "defined" — если есть прямая ссылка на поэтажный план, техпаспорт
              или иной идентифицирующий документ;
            - "not_defined" — если такой ссылки нет.

        12. reference_document_value:
            Краткая формулировка о таком документе, например:
            "поэтажный план — Приложение № 1".
            - если not_defined — "Не установлен".
        </task>

        <context_rules>
        - Перед остальными полями заполни lease_subject_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все value-поля заменяются на соответствующий fallback ("Не установлен" / "Не установлена" / "Не установлены").
        - Используй только релевантные фрагменты контекста.
        - Определи тип объекта аренды до заполнения полей. Если тип объекта
          явно недвижимость — поля про серийный номер/VIN/инвентарный номер
          получают статус "not_defined" и значение "Не применимо". Если тип
          объекта явно оборудование или транспорт — поля про кадастровый номер,
          адрес, площадь, этаж/помещение получают статус "not_defined" и
          значение "Не применимо".
        - Если тип объекта неясен из контекста — не присваивай "Не применимо"
          произвольно; используй "not_defined" и fallback по роду/числу
          ("Не установлен" / "Не установлена" / "Не установлены").
        - Не путай кадастровый номер с инвентарным номером, номером договора или
          номером лицевого счёта — это разные идентификаторы, относящиеся
          к разным полям.
        - Не копируй длинные абзацы в value-поля; давай краткое значение
          (одно значение или короткий список через запятую).
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Не смешивай индивидуализацию объекта с арендной платой, сроком аренды,
          ремонтом, улучшениями, субарендой и иными нерелевантными темами.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни адреса, ни кадастрового номера, ни заводских номеров оборудования, ни планов.
           → presence = "missing"; все status-поля = "not_defined"; все value-поля = соответствующий fallback.

        2. Неприменимость по типу объекта.
           Объект — оборудование, в связи с чем кадастровые и адресные сведения недвижимости не применимы.
           → presence = "present" (так как есть серийные номера); статусы недвижимости = "not_defined", а их значения = "Не применимо".

        3. Противоречие между фрагментами.
           В договоре указаны два разных кадастровых номера или адреса для одного помещения, и конфликт нельзя снять.
           → presence = "unclear"; соответствующий status = "not_defined"; value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Все идентифицирующие характеристики вынесены в Приложение (например, поэтажный план или спецификацию).
           → presence = "present"; reference_document_status = "defined"; value содержит точные реквизиты ссылки из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lease_subject_identification_presence используй только: "present", "missing", "unclear".
        - Для всех status-полей используй только: "defined" или "not_defined".
        - Fallback при неприменимости к типу объекта: "Не применимо".
        - Fallback при отсутствии данных (поле применимо):
          * cadastral_number_value → "Не установлен"
          * address_value → "Не установлен"
          * area_value → "Не установлена"
          * floor_and_unit_value → "Не установлены"
          * equipment_identifiers_value → "Не установлены"
          * reference_document_value → "Не установлен"
        - Fallback при противоречии или неоднозначности:
          * все value поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lease_subject_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификационных сведений объекта в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания кадастрового номера. Внутреннее enum-поле."
          required: true

        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кадастровый номер"
          description: >
            Кадастровый номер объекта аренды, например: "77:06:0001001:123".
            Fallback: "Не установлен" / "Не применимо" (если объект не недвижимость).
          required: false

        - name: "address_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания адреса. Внутреннее enum-поле."
          required: true

        - name: "address_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Адрес"
          description: >
            Краткий адрес объекта аренды, например: "г. Москва, ул. Ленина, д. 10".
            Fallback: "Не установлен" / "Не применимо" (если объект не недвижимость).
          required: false

        - name: "area_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания площади. Внутреннее enum-поле."
          required: true

        - name: "area_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Площадь"
          description: >
            Краткое значение площади объекта аренды, например: "150,5 кв.м".
            Fallback: "Не установлена" / "Не применимо" (если объект не недвижимость).
          required: false

        - name: "floor_and_unit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания этажа и номера помещения. Внутреннее enum-поле."
          required: true

        - name: "floor_and_unit_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Этаж / помещение"
          description: >
            Краткое значение этажа и/или номера помещения, например:
            "2-й этаж, помещение III".
            Fallback: "Не установлены" / "Не применимо" (если объект не недвижимость).
          required: false

        - name: "equipment_identifiers_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания серийного номера / VIN / инвентарного номера. Внутреннее enum-поле."
          required: true

        - name: "equipment_identifiers_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Идентификаторы оборудования"
          description: >
            Серийный номер, VIN или инвентарный номер оборудования/транспорта,
            например: "Серийный номер SN-88431, инвентарный номер 0012-ОС".
            Fallback: "Не установлены" / "Не применимо" (если объект недвижимость).
          required: false

        - name: "reference_document_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на поэтажный план, техпаспорт или иной документ. Внутреннее enum-поле."
          required: true

        - name: "reference_document_value"
          label: "Реквизиты документа-основания"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Ссылка на поэтажный план, техпаспорт или иной идентифицирующий документ,
            например: "поэтажный план — Приложение № 1".
            Fallback: "Не установлен".
          required: false

      store_payload: true

  - id: rent_payment_and_indexation_check
    name: "Арендная плата: фиксированная и переменная части, индексация, обеспечительный платёж"
    description: >
      Фактографическая проверка структуры арендной платы: фиксированная часть,
      переменная часть (оплата коммунальных услуг по счетам/показаниям приборов
      учёта), механизм индексации, обеспечительный платёж и последствия просрочки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендная плата"
        - "ежемесячно"
        - "фиксированная часть"
        - "постоянная часть"
        - "переменная часть"
        - "индексация"
        - "коммунальные услуги"
        - "обеспечительный платеж"
        - "пени"
        - "неустойка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци"
        - "(?i)переменн(ая|ой)\\s+част"
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)\\b[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: структура арендной платы, индексация
        и обеспечительный платёж.

        Нормативный ориентир:
        - ст. 614 ГК РФ — арендная плата
        - ст. 381.1 ГК РФ — обеспечительный платёж

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если параметр (например, переменная часть) определяется по счёту,
          показаниям приборов учёта, тарифам управляющей компании или прайс-листу —
          это не отсутствие регулирования, а определённый механизм расчёта.
        - utilities_allocation в этом check касается только оплаты коммунальных
          услуг по счётчикам/счетам (электричество, вода, отопление), которая
          входит в переменную часть арендной платы. Общие эксплуатационные
          расходы на содержание объекта (охрана, клининг, обслуживание
          инженерных систем, вывоз мусора, страхование объекта) относятся
          к отдельному check о содержании имущества и здесь не фиксируются.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли фиксированная (постоянная) часть арендной платы и её размер.
        2. Есть ли переменная часть арендной платы.
        3. Есть ли механизм индексации и его условия.
        4. Кто несёт расходы по оплате коммунальных услуг (по счётчикам/счетам).
        5. Есть ли обеспечительный платёж и его размер.
        6. Есть ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Для текстовых полей используй:
           - "Не установлена" / "Не установлен" / "Не установлены" — если условие
             прямо не указано (согласуй род и число с существительным поля);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        4. Не путай между собой: фиксированную часть, переменную часть,
           обеспечительный платёж и сумму/ставку неустойки за просрочку —
           это четыре разные денежные величины, каждая относится только к своему полю.
        5. Не относи к utilities_allocation общие эксплуатационные расходы на
           содержание объекта (охрана, клининг, обслуживание систем) — только
           оплату коммунальных услуг по счётчикам/счетам.
        6. Не используй "None", "null", "not_defined" или пустые строки в текстовых полях.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

