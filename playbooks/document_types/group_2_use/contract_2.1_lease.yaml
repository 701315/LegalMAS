        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о фиксированной части арендной платы.
        2. Найди прямую цитату о переменной части (включая расчёт через счета,
           показания приборов учёта или тарифы управляющей компании).
        3. Найди прямую цитату об индексации.
        4. Найди прямую цитату о том, кто платит за коммунальные услуги по
           счётчикам/счетам — не путай с расходами на охрану, клининг
           и обслуживание систем (это другой check).
        5. Найди прямую цитату об обеспечительном платеже.
        6. Найди прямую цитату о последствиях просрочки.
        7. Проверь, что суммы в разных полях не перепутаны между собой
           (фиксированная часть ≠ обеспечительный платёж ≠ неустойка).
        8. Если в разных фрагментах указаны противоречащие друг другу значения
           одного параметра и конфликт нельзя снять по тексту — верни
           "Не удалось определить", а в status используй "not_defined".
        9. Если прямой цитаты нет — верни "not_defined" и корректный fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

