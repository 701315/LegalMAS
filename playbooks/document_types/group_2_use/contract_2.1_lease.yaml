      - "(?i)\\bгражданин\\b"
      - "(?i)физическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bпаспорт\\b"
      - "(?i)дата\\s+рождения"
      - "(?i)место\\s+рождения"

  legal_entity_party:
    any_keywords:
      - "(?i)\\bООО\\b"
      - "(?i)\\bАО\\b"
      - "(?i)\\bПАО\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bКПП\\b"
      - "(?i)юридическ[оеая]\\s+лиц[оа]"

  renewal_and_preemptive_right:
    any_keywords:
      - "(?i)преимущественн[оа]е\\s+прав[оа]"
      - "(?i)продлени[ея]\\s+договор[аа]"
      - "(?i)возобновлени[ея]"
      - "(?i)пролонгаци[яи]"
      - "(?i)автоматическ[оа]е\\s+продлени[ея]"
      - "(?i)на\\s+тех\\s+же\\s+услови[яях]"
      - "(?i)на\\s+нов[ыо]й\\s+срок"
      - "(?i)ст\\.\\s*621"

  access_to_premises:
    any_keywords:
      - "(?i)доступ\\s+в\\s+помещени[ея]"
      - "(?i)осмотр\\s+помещени[ея]"
      - "(?i)посещени[ея]\\s+арендодател[еям]"
      - "(?i)предварительн[оа]е\\s+уведомлени[ея]"
      - "(?i)\\bключ[ии]\\b"
      - "(?i)прав[оа]\\s+доступ[аа]"
      - "(?i)проверк[аи]\\s+состояни[яя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  area_pattern: "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Предмета, срок и базовые условия
  # ──────────────────────────────────────────────────────────────────────────
  - id: lease_subject_extraction
    name: "Предмет аренды, срок, арендная плата и целевое использование"
    description: >
      Фактографическая проверка наличия в договоре аренды описания объекта,
      срока аренды, размера арендной платы, целевого назначения использования
      и механизма передачи объекта. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "предмет аренды"
        - "объект аренды"
        - "арендная плата"
        - "срок аренды"
        - "акт приема-передачи"
        - "помещение"
        - "оборудование"
        - "здание"
        - "земельный участок"
        - "назначение использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ (ст. 606–625).
        Проверяется только один вопрос: предмет аренды, срок, арендная плата,
        целевое использование и механизм передачи объекта.

        Нормативный ориентир:
        - ст. 606–607 ГК РФ — предмет аренды
        - ст. 610 ГК РФ — срок аренды
        - ст. 614 ГК РФ — арендная плата
        - ст. 615 ГК РФ — использование арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой тип объекта аренды указан.
        2. Как описан объект аренды.
        3. Какой срок аренды установлен.
        4. Какой размер арендной платы установлен.
        5. Указано ли целевое назначение использования объекта.
        6. Какой механизм передачи объекта предусмотрен.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён:
        Фрагмент:
        "Арендодатель передаёт Арендатору во временное владение и пользование
        нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу:
        г. Москва, ул. Ленина, д. 10, помещение III. Срок аренды — 3 года
        с даты подписания акта приёма-передачи. Арендная плата составляет
        250 000 рублей в месяц. Помещение используется исключительно
        под офис. Передача осуществляется по акту приёма-передачи."

        Ответ:
        {
          "asset_type": "real_estate",
          "asset_description_status": "defined",
          "asset_description_value": "нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу: г. Москва, ул. Ленина, д. 10, помещение III",
          "lease_term_status": "defined",
          "lease_term_value": "3 года с даты подписания акта приёма-передачи",
          "rent_amount_status": "defined",
          "rent_amount_value": "250 000 рублей в месяц",
          "use_purpose_status": "defined",
          "use_purpose_value": "исключительно под офис",
          "handover_mechanism": "act",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт Арендатору во временное владение и пользование нежилое помещение площадью 150 кв.м на 2-м этаже здания по адресу: г. Москва, ул. Ленина, д. 10, помещение III."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор аренды."

        Ответ:
        {
          "asset_type": "not_defined",
          "asset_description_status": "not_defined",
          "asset_description_value": "Данные не определены",
          "lease_term_status": "not_defined",
          "lease_term_value": "Данные не определены",
          "rent_amount_status": "not_defined",
          "rent_amount_value": "Данные не определены",
          "use_purpose_status": "not_defined",
          "use_pu pose": "Данные не определены",
          "handover_mechanism": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием объекта аренды.
        2. Найди прямую цитату о сроке аренды.
        3. Найди прямую цитату о размере арендной платы.
        4. Найди прямую цитату о целевом назначении.
        5. Найди прямую цитату о механизме передачи объекта.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "asset_type": "<real_estate / land / equipment / vehicle / other / mixed / not_defined>",
          "asset_description_status": "<defined / not_defined>",
          "asset_description_value": "<текст или 'Данные не определены'>",
          "lease_term_status": "<defined / not_defined>",
          "lease_term_value": "<текст или 'Данные не определены'>",
          "rent_amount_status": "<defined / not_defined>",
          "rent_amount_value": "<текст или 'Данные не определены'>",
          "use_purpose_status": "<defined / not_defined>",
          "use_purpose_value": "<текст или 'Данные не определены'>",
          "handover_mechanism": "<act / invoice / registration / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет аренды объект аренды арендная плата срок аренды назначение использования акт приёма-передачи помещение оборудование здание земельный участок площадь кадастровый номер"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "неотделимые улучшения"
        - "субаренда"
        - "индексация"
        - "обеспечительный платеж"
        - "досрочное расторжение"
        - "преимущественное право"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды предмет аренды,
        срок, арендную плату, целевое назначение и механизм передачи объекта.
        Не анализируй ремонт, улучшения, субаренду, расторжение или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. asset_type — "real_estate" / "land" / "equipment" / "vehicle" / "other" /
           "mixed" / "not_defined".
        2. asset_description_status — "defined" если объект аренды прямо описан,
           иначе "not_defined".
        3. asset_description_value — описание объекта аренды.
        4. lease_term_status — "defined" если срок аренды прямо указан,
           иначе "not_defined".
        5. lease_term_value — срок аренды.
        6. rent_amount_status — "defined" если размер арендной платы прямо указан,
           иначе "not_defined".
        7. rent_amount_value — размер арендной платы.
        8. use_purpose_status — "defined" если целевое назначение прямо указано,
           иначе "not_defined".
        9. use_purpose_value — целевое назначение использования.
        10. handover_mechanism — "act" / "invoice" / "registration" / "other" /
            "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - asset_type:
            - "real_estate" — нежилое или жилое помещение, здание, строение, сооружение.
            - "land" — земельный участок.
            - "equipment" — оборудование, станки, машины (не транспорт).
            - "vehicle" — транспортное средство.
            - "other" — иной объект, прямо названный в тексте.
            - "mixed" — несколько разнотипных объектов одновременно.
            - "not_defined" — тип объекта прямо не определён.
        - handover_mechanism:
            - "act" — передача по акту приёма-передачи.
            - "invoice" — передача по накладной или товарному документу.
            - "registration" — передача через государственную регистрацию.
            - "other" — иной механизм, прямо указанный в тексте.
            - "not_defined" — механизм передачи прямо не определён.
        - Верни только JSON.
        </rules>
      fields:
        - name: "asset_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["real_estate", "land", "equipment", "vehicle", "other", "mixed", "not_defined"]
          description: "Тип объекта аренды."
          required: true
        - name: "asset_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания объекта аренды."
          required: true
        - name: "asset_description_value"
          type: "string"
          presentation: "fact"
          label: "Объект аренды"
          description: "Описание объекта аренды из текста договора."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "lease_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока аренды."
          required: true
        - name: "lease_term_value"
          type: "string"
          presentation: "fact"
          label: "Срок аренды"
          description: "Срок аренды из текста договора."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "rent_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания арендной платы."
          required: true
        - name: "rent_amount_value"
          type: "string"
          presentation: "fact"
          label: "Арендная плата"
          description: "Размер арендной платы из текста договора."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "use_purpose_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания целевого назначения."
          required: false
        - name: "use_purpose_value"
          type: "string"
          presentation: "fact"
          label: "Целевое назначение"
          description: "Целевое назначение использования объекта."
          required: false
          display_in_grid: false
        - name: "handover_mechanism"
          type: "string"
          presentation: "signal"
          allowed_values: ["act", "invoice", "registration", "other", "not_defined"]
          description: "Механизм передачи объекта."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Индивидуализация объекта аренды
  # ──────────────────────────────────────────────────────────────────────────
  - id: lease_subject_identification_check
    name: "Индивидуализация объекта аренды: кадастр, адрес, площадь, идентификаторы"
    description: >
      Фактографическая проверка достаточности идентификации объекта аренды:
      кадастровый номер, адрес, площадь, этаж, номер помещения (для недвижимости);
      серийный номер, VIN, инвентарный номер (для оборудования/транспорта).
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "этаж"
        - "номер помещения"
        - "серийный номер"
        - "VIN"
        - "инвентарный номер"
        - "технический паспорт"
        - "поэтажный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: достаточность индивидуализации объекта аренды.

        Нормативный ориентир:
        - ст. 607 ГК РФ — определённость предмета аренды
        - п. 3 ст. 607 ГК РФ — данные, позволяющие определённо установить имущество

        Важно:
        - Твоя задача — только установить, какие идентифицирующие данные прямо
          есть в тексте договора, а каких прямо нет.
        - Не оценивай серьёзность риска незаключённости.
        - Не делай правовой вывод о достаточности идентификации.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли кадастровый номер объекта.
        2. Есть ли адрес объекта.
        3. Есть ли площадь объекта.
        4. Есть ли указание на этаж и/или номер помещения.
        5. Есть ли серийный номер, VIN или инвентарный номер (для оборудования/транспорта).
        6. Есть ли ссылка на поэтажный план, техпаспорт или иной идентифицирующий документ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — объект индивидуализирован:
        Фрагмент:
        "Объект аренды — нежилое помещение III, кадастровый номер 77:06:0001001:123,
        расположенное по адресу: г. Москва, ул. Ленина, д. 10, 2-й этаж,
        общей площадью 150,5 кв.м. Поэтажный план — Приложение № 1."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "address_status": "defined",
          "address_value": "г. Москва, ул. Ленина, д. 10",
          "area_status": "defined",
          "area_value": "150,5 кв.м",
          "floor_and_unit_status": "defined",
          "floor_and_unit_value": "2-й этаж, помещение III",
          "equipment_identifiers_status": "not_defined",
          "equipment_identifiers_value": "Данные не определены",
          "reference_document_status": "defined",
