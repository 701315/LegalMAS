      - "(?i)передач[аи]\\s+прав\\s+и\\s+обязанност[еий]\\s+по\\s+договору"
      - "(?i)передач[аи]\\s+имуществ[аа]\\s+третьим\\s+лицам"

  security_deposit_related:
    any_keywords:
