        - "с письменного согласия"
        - "без права субаренды"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субаренд|перенаем"
        - "(?i)без\\s+права\\s+субаренд"

  - id: "improvements_ownership"
    name: "Улучшения: отделимые и неотделимые"
    description: "Проверяет судьбу улучшений и право на компенсацию/изъятие"
    legal_base: "ст. 623 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
