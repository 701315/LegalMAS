          "sublease_details": "<текст или 'Данные не определены'>",
          "assignment_status": "<defined / not_defined>",
          "assignment_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
