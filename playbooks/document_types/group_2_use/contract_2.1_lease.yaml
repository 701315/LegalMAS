type: contract_2.1_lease
name: "Договор аренды (общая коммерческая)"
version: 6.0
parent: class_2_transfer_for_use
description: |
  Базовая конструкция аренды для возмездного предоставления имущества
  во временное владение и (или) пользование в коммерческом B2B-контексте.
  Применяется к аренде нежилых помещений, зданий, складов, оборудования,
  техники, земельных участков и иного имущества, если документ не подпадает
  под более специальный арендный режим (лизинг, прокат, наем жилого помещения,
  безвозмездное пользование и т.п.).
  Ключевыми рисками являются индивидуализация объекта аренды, титул арендодателя,
  срок аренды и регистрационные последствия, размер и структура арендной платы,
  эксплуатационные расходы, судьба улучшений, досрочное расторжение и возврат имущества.
metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 34 ГК РФ (ст. 606-625)"
  doc_types_supported:
    - "договор аренды"
    - "договор аренды нежилого помещения"
    - "договор аренды офиса"
    - "договор аренды склада"
    - "договор аренды здания"
    - "договор аренды сооружения"
    - "договор аренды оборудования"
    - "договор аренды техники"
    - "договор аренды земельного участка"
    - "договор коммерческой аренды"
    - "договор аренды помещения"
    - "договор аренды части помещения"
    - "договор аренды машино-места"
    - "договор аренды с правом выкупа"
    - "коммерческая аренда"
    - "commercial lease agreement"
    - "office lease"
    - "premises lease agreement"
    - "lease deed"
    - "tenancy agreement"
    - "equipment lease"
    - "operating lease"
    - "triple net lease"
    - "NNN lease"
    - "gross lease"
    - "modified gross lease"
    - "ground lease"
    - "occupancy agreement"
    - "sublease agreement"
    - "leaseback agreement"
    - "right-of-use agreement"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.78
    strong_signal_threshold: 0.87
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      # Русский – явные арендные договоры
      - pattern: "(?i)договор[_\\s-]*аренд[ыы]"
        kind: specific_subject
        weight: 1.0
        # Базовое "договор аренды"

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*нежил[а-я\\s]*помещен"
        kind: specific_subject
        weight: 1.0
        # Аренда нежилого помещения

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*офис[аы]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*склад[аы]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*(здани[яия]|сооружен[ияи])"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*земельн[а-я\\s]*участ"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*оборудовани[яия]"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*техник[иы]"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*помещен[ияи]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*част[ии][_\\s-]*помещен[ияи]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*машино[_\\s-]*мест"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)коммерческ[аяий][_\\s-]*аренд[аы]"
        kind: specific_subject
        weight: 0.95
        # Коммерческая аренда

      - pattern: "(?i)договор[_\\s-]*аренд[ыы][_\\s-]*с[_\\s-]*правом[_\\s-]*выкуп[аау]"
        kind: specific_subject
        weight: 0.9
        # Аренда с правом выкупа (но не чистый лизинг)

      # Базовый арендный маркер в имени файла
      - pattern: "(?i)аренд[аоы]"
        kind: specific_subject
        weight: 0.8
        # Любая форма "аренда" в имени файла (оснащено L2/L3, так что можно оставить)

      # Английский – lease/tenancy/occupancy
      - pattern: "(?i)commercial[_\\s-]*lease[_\\s-]*(agreement|contract)?"
        kind: specific_subject
        weight: 1.0

      - pattern: "(?i)office[_\\s-]*lease"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)premises[_\\s-]*lease[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)warehouse[_\\s-]*lease"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)equipment[_\\s-]*lease"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)ground[_\\s-]*lease"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)sublease[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9
        # Сублизинг/субаренда — тоже аренда для нашей иерархии

      - pattern: "(?i)lease[_\\s-]*deed"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)tenancy[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)occupancy[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.85

      - pattern: "(?i)triple[_\\s-]*net[_\\s-]*lease|\\bNNN[_\\s-]*lease\\b"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)gross[_\\s-]*lease"
        kind: specific_subject
        weight: 0.85

      - pattern: "(?i)modified[_\\s-]*gross[_\\s-]*lease"
        kind: specific_subject
        weight: 0.85

      - pattern: "(?i)operating[_\\s-]*lease"
        kind: specific_subject
        weight: 0.85
        # Оперейтинг‑лиз (в МСФО‑лексике) мы всё равно относим к аренде, не к финансовому лизингу

      - pattern: "(?i)sub[_\\s-]*lease"
        kind: specific_subject
        weight: 0.85

      - pattern: "(?i)lease[_\\s-]*back[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.85
        # Leaseback agreement

      - pattern: "(?i)right[_\\s-]*of[_\\s-]*use[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.85
        # Right-of-use — договор пользования

      # Общие rent/lease формы – generic_form, чтобы не ловить всё подряд
      - pattern: "(?i)lease"
        kind: generic_form
        weight: 0.5
        # Голое 'lease' в имени файла, без уточнения объекта

      - pattern: "(?i)rent[\\s_.-]*agreement"
        kind: generic_form
        weight: 0.55
        # Rent agreement — часто про аренду, но может быть и consumer/joint context

    folder_patterns:
      - pattern: "(?i)аренд[аоы]"
        kind: specific_subject
        weight: 0.8
        # Папка "аренда"

      - pattern: "(?i)lease"
        kind: specific_subject
        weight: 0.75
        # Папка lease в юридическом/real estate контексте

      - pattern: "(?i)rent"
        kind: generic_form
        weight: 0.5
        # rent-папка может содержать и расчёты, и политики

      - pattern: "(?i)commercial[_\\s-]*lease"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)office[_\\s-]*lease"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)warehouse"
        kind: context
        weight: 0.4
        # Warehouse-папка — складской контекст, но не обязательно договоры

      - pattern: "(?i)real[\\s_]?estate"
        kind: context
        weight: 0.4
        # Реал эстейт-папка может содержать куплю-продажу и иные сделки

      - pattern: "(?i)tenancy"
        kind: specific_subject
        weight: 0.75

      - pattern: "(?i)sublease"
        kind: specific_subject
        weight: 0.75

    keywords:

      high:
        - pattern: "(?i)договор\\s+аренд[ыу]\\s+нежил[а-я\\s]*помещен[ияи]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название для аренды нежилого помещения"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+здани[яй]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Аренда здания как предмет договора"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+склад[ао]?"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда склада"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+офис[ао]?"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда офиса"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+сооружен[ияи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда сооружения — § 4 Главы 34 ГК РФ"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+оборудован[ияи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда оборудования"

        - pattern: "(?i)договор\\s+аренд[ыу]\\s+земельн[огоой\\s]*участк[аеи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Аренда земельного участка"

        - pattern: "(?i)договор\\s+коммерческ[ойого]\\s+аренд[ыу]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Коммерческая аренда — прямое указание на B2B-режим"

        - pattern: "(?i)арендодател[ьяеи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Ключевой субъект арендных отношений — арендодатель"

        - pattern: "(?i)арендатор[ауы]?"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Ключевой субъект арендных отношений — арендатор"

        - pattern: "(?i)передаетс[яь]\\s+во\\s+временн[оеое]\\s+владен[иеи]\\s+и\\s+пользован[иеи]"
          weight: 0.9
          distinctiveness: high
          context: body
          description: "Классическая формула аренды по ст. 606 ГК РФ"

        - pattern: "(?i)арендн[аяые]\\s+плат[ауы]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Арендная плата — существенное условие аренды"

      medium:
        - pattern: "(?i)нежил[оаоеые]+\\s+помещени[ея]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Нежилое помещение — распространённый объект коммерческой аренды"

        - pattern: "(?i)акт\\s+при[её]ма-?передач[ии]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Акт приёма-передачи — обязательный документ при передаче и возврате объекта"

        - pattern: "(?i)обеспечительн[ыо]й\\s+плат[её]ж"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Обеспечительный платёж — характерен для коммерческой аренды"

        - pattern: "(?i)коммунальн[ыо]е\\s+услуг[ии]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Коммунальные услуги — обычно входят в структуру арендной платы или OPEX"

        - pattern: "(?i)капитальн[ыо]й\\s+ремонт"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Капитальный ремонт — распределение обязанностей между сторонами, ст. 616 ГК РФ"

        - pattern: "(?i)текущ[иоя]+\\s+ремонт"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Текущий ремонт — обязанность арендатора по умолчанию, ст. 616 ГК РФ"

        - pattern: "(?i)\\bсубаренд[аы]\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Субаренда — специфичный режим, требует согласия арендодателя, ст. 615 ГК РФ"

        - pattern: "(?i)ежемесячн[а-яё]+\\s+плат[аа]"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Ежемесячная плата — типовая периодичность арендных платежей"

      low:
        - pattern: "(?i)эксплуатационн[ыо]е\\s+расход[ыо]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "OPEX / эксплуатационные расходы — характерны для сложных коммерческих аренд"

        - pattern: "(?i)индексаци[яи]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Индексация арендной платы — снижение покупательной способности"

        - pattern: "(?i)\\bдепозит\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Депозит — общий термин, может встречаться в разных типах договоров"

        - pattern: "(?i)возврат\\s+имуществ[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Возврат имущества — обязанность арендатора при завершении аренды"

        - pattern: "(?i)прав[оа]\\s+доступ[аа]"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Право доступа — встречается в аренде, но и в других типах договоров"

    exclusions:
      - pattern: "(?i)жил[оа]й\\s+на[её]м"
        severity: hard
        weight: -1.0
        description: "Наём жилья — отдельный режим, Глава 35 ГК РФ (contract_2.5_residential_lease)"

      - pattern: "(?i)договор\\s+на[йеё]м[ауы]\\s+жил[оа]го\\s+помещени[яя]"
        severity: hard
        weight: -1.0
        description: "Договор найма жилого помещения — не коммерческая аренда (contract_2.5_residential_lease)"

      - pattern: "(?i)финансов[а-яё]+\\s+аренд[аы]"
        severity: hard
        weight: -1.0
        description: "Финансовая аренда (лизинг) — отдельный тип (contract_2.4_leasing)"

      - pattern: "(?i)безвозмездн[оа]е\\s+пользовани[ея]"
        severity: hard
        weight: -1.0
        description: "Безвозмездное пользование (ссуда) — не аренда, Глава 36 ГК РФ (contract_2.6_gratuitous_use)"

      - pattern: "(?i)договор\\s+прокат[аыу]"
        severity: hard
        weight: -1.0
        description: "Договор проката — специальный потребительский режим (§ 2 Главы 34 ГК РФ, contract_2.2_rental)"

      - pattern: "(?i)договор\\s+бытов[огоый]\\s+прокат[аыу]"
        severity: hard
        weight: -1.0
        description: "Бытовой прокат — consumer-режим, не общая коммерческая аренда (contract_2.2_rental)"

      # ── Soft exclusions

      - pattern: "(?i)\\bлизинг\\b"
        severity: soft
        weight: -0.4
        description: "Упоминание лизинга снижает уверенность — возможен смешанный или переходный тип (contract_2.4_leasing)"

      - pattern: "(?i)\\bпрокат\\b"
        severity: soft
        weight: -0.35
        description: "Упоминание проката в общем контексте (без 'договор проката') снижает уверенность в общей аренде (contract_2.2_rental)"

      - pattern: "(?i)\\bссуд[аы]\\b"
        severity: soft
        weight: -0.3
        description: "Ссуда / безвозмездное пользование может смешиваться с арендой в тексте (contract_2.6_gratuitous_use)"

