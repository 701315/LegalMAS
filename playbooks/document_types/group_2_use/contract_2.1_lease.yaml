        - "акт передачи"
        - "подписывается акт"
        - "передача имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"

  - id: "maintenance_duties"
    name: "Капитальный и текущий ремонт"
    description: "Проверяет распределение обязанностей по ремонту"
    legal_base: "ст. 616 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "обязанность ремонта"
        - "техническое обслуживание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+ремонт"
        - "(?i)текущ(ий|его)\\s+ремонт"

  - id: "utilities_and_operating_expenses"
    name: "Коммунальные и эксплуатационные расходы"
    description: "Проверяет распределение коммунальных услуг и OPEX"
