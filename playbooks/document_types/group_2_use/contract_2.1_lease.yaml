        - "ст. 621"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "preemptive_right_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Упомянуто ли преимущественное право"
        - name: "auto_renewal_clause"
