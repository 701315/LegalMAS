type: contract_2.1_lease
name: "Договор аренды (общая коммерческая)"

description: |
  Базовая конструкция аренды для возмездного предоставления имущества
  во временное владение и (или) пользование в коммерческом B2B-контексте.
  Применяется к аренде нежилых помещений, зданий, складов, оборудования,
  техники, земельных участков и иного имущества, если документ не подпадает
  под более специальный арендный режим (лизинг, прокат, наем жилого помещения,
  безвозмездное пользование и т.п.).
  Ключевыми рисками являются индивидуализация объекта аренды, титул арендодателя,
  срок аренды и регистрационные последствия, размер и структура арендной платы,
  эксплуатационные расходы, судьба улучшений, досрочное расторжение и возврат имущества.

version: 4.0
parent: class_2_transfer_for_use

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 34 ГК РФ (ст. 606-625)"
  doc_types_supported:
    - "договор аренды"
    - "договор аренды нежилого помещения"
    - "договор аренды офиса"
    - "договор аренды склада"
    - "договор аренды здания"
    - "договор аренды сооружения"
    - "договор аренды оборудования"
    - "договор аренды техники"
    - "договор аренды земельного участка"
    - "договор коммерческой аренды"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)аренд"
      - "(?i)lease"
      - "(?i)rent[\\s_.-]?agreement"
      - "(?i)нежил"
      - "(?i)office"
      - "(?i)warehouse"

    folder_patterns:
      - "(?i)lease"
      - "(?i)rent"
      - "(?i)аренд"
      - "(?i)real[\\s_]?estate"

    keywords:

      high:
        - "(?i)аренд[аыу]"
        - "(?i)договор\\s+аренд[ыыу]"
        - "(?i)договор\\s+аренд[ыыу]\\s+нежил[а-я\\s]*помещен[ияи]"
        - "(?i)договор\\s+аренд[ыыу]\\s+офис[ао]?"
        - "(?i)договор\\s+аренд[ыыу]\\s+склад[ао]?"
        - "(?i)договор\\s+аренд[ыыу]\\s+здани[яй]"
        - "(?i)договор\\s+аренд[ыыу]\\s+сооружен[ияи]"
        - "(?i)договор\\s+аренд[ыыу]\\s+оборудован[ияи]"
        - "(?i)договор\\s+аренд[ыыу]\\s+техник[иу]"
        - "(?i)договор\\s+аренд[ыыу]\\s+земельн[огоой\\s]*участк[аеи]"
        - "(?i)договор\\s+коммерческ[ойого]\\s+аренд[ыыу]"
        - "(?i)арендодател[ьяеи]"
        - "(?i)арендатор[ауы]?"
        - "(?i)временн[оая]\\s+пользован[иеи]"
        - "(?i)временн[оая]\\s+владен[иеи]"
        - "(?i)арендн[аяые]\\s+плат[ауы]"
        - "(?i)передаетс[яь]\\s+во\\s+временн[оеое]\\s+владен[иеи]\\s+и\\s+пользован[иеи]"

      medium:
        - "помещение"
        - "здание"
        - "оборудование"
        - "нежилое помещение"
        - "акт приема-передачи"
        - "ежемесячная плата"
        - "коммунальные услуги"
        - "обеспечительный платеж"
        - "субаренда"
        - "капитальный ремонт"
        - "текущий ремонт"

      low:
        - "эксплуатационные расходы"
        - "индексация"
        - "депозит"
        - "возврат имущества"
        - "право доступа"
        - "страхование"
        - "ВРИ"

    exclusions:
      - "жилой наем"
      - "договор найма жилого помещения"
      - "лизинг"
      - "финансовая аренда"
      - "прокат"
      - "безвозмездное пользование"
      - "ссуда"

# ════════════════════════════════════════════════════════════════════════════
