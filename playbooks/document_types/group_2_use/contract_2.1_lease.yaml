  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Досрочное прекращение аренды
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_return_check
    name: "Досрочное прекращение аренды, возврат объекта и обеспечительный платёж"
    description: >
      Фактографическая проверка оснований одностороннего отказа / расторжения,
      срока уведомления, порядка возврата объекта аренды и механизма
      возврата / удержания обеспечительного платежа.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "односторонний отказ"
        - "досрочное расторжение"
        - "уведомление за"
        - "возврат имущества"
        - "возврат объекта"
        - "обеспечительный платеж"
        - "удержание депозита"
        - "возврат депозита"
        - "акт возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)односторонн(ий|его)\\s+отказ"
        - "(?i)досрочн(ое|ого)\\s+расторж"
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)возврат.*имуществ|возврат.*объект"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: основания досрочного прекращения,
        возврат объекта и обеспечительный платёж.

        Нормативный ориентир:
        - ст. 619–620 ГК РФ — досрочное расторжение
        - ст. 622 ГК РФ — возврат арендованного имущества
        - ст. 381.1 ГК РФ — обеспечительный платёж

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право арендатора на досрочное прекращение и его условия.
        2. Есть ли право арендодателя на досрочное прекращение и его условия.
        3. Какой срок уведомления о досрочном прекращении.
        4. Есть ли порядок возврата объекта аренды.
        5. Есть ли механизм возврата / удержания обеспечительного платежа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "Арендатор вправе в одностороннем порядке отказаться от договора,
        уведомив Арендодателя за 3 месяца. Арендодатель вправе расторгнуть
        договор при нарушении арендатором обязанности по оплате более 2 месяцев
        подряд. Объект возвращается по акту возврата. Обеспечительный платёж
        засчитывается в счёт последнего месяца аренды."

        Ответ:
        {
          "tenant_termination_status": "defined",
          "tenant_termination_details": "вправе в одностороннем порядке отказаться, уведомив за 3 месяца",
          "landlord_termination_status": "defined",
          "landlord_termination_details": "вправе расторгнуть при нарушении оплаты более 2 месяцев подряд",
          "notice_period_status": "defined",
          "notice_period_details": "за 3 месяца",
          "return_procedure_status": "defined",
          "return_procedure_details": "объект возвращается по акту возврата",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "обеспечительный платёж засчитывается в счёт последнего месяца аренды",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Арендатор вправе в одностороннем порядке отказаться от договора, уведомив Арендодателя за 3 месяца."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "tenant_termination_status": "not_defined",
          "tenant_termination_details": "Данные не определены",
          "landlord_termination_status": "not_defined",
          "landlord_termination_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве арендатора на досрочное прекращение.
        2. Найди прямую цитату о праве арендодателя на досрочное прекращение.
        3. Найди прямую цитату о сроке уведомления.
        4. Найди прямую цитату о порядке возврата объекта.
        5. Найди прямую цитату о возврате / удержании обеспечительного платежа.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "tenant_termination_status": "<defined / not_defined>",
          "tenant_termination_details": "<текст или 'Данные не определены'>",
          "landlord_termination_status": "<defined / not_defined>",
          "landlord_termination_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "deposit_refund_status": "<defined / not_defined>",
          "deposit_refund_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "односторонний отказ досрочное расторжение уведомление за возврат имущества возврат объекта обеспечительный платёж удержание депозита возврат депозита акт возврата"
      retrieval_profile: "termination_check"      
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "преимущественное право"
        - "продление"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды основания досрочного
        прекращения, срок уведомления, порядок возврата объекта и механизм
        возврата / удержания обеспечительного платежа.
        Не анализируй предмет аренды, арендную плату, ремонт или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. tenant_termination_status — "defined" если право арендатора на досрочное
           прекращение прямо предусмотрено, иначе "not_defined".
        2. tenant_termination_details — основания и условия.
        3. landlord_termination_status — "defined" если право арендодателя на досрочное
           прекращение прямо предусмотрено, иначе "not_defined".
        4. landlord_termination_details — основания и условия.
        5. notice_period_status — "defined" если срок уведомления прямо указан,
           иначе "not_defined".
        6. notice_period_details — срок уведомления.
        7. return_procedure_status — "defined" если порядок возврата объекта
           прямо описан, иначе "not_defined".
        8. return_procedure_details — формулировка о возврате.
        9. deposit_refund_status — "defined" если механизм возврата / удержания
           обеспечительного платежа прямо описан, иначе "not_defined".
        10. deposit_refund_details — формулировка о возврате / удержании депозита.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи основания расторжения из нормы ст. 619–620 ГК РФ.
        - Верни только JSON.
        </rules>
      fields:
        - name: "tenant_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права арендатора на досрочное прекращение."
          required: true
        - name: "tenant_termination_details"
          type: "string"
          presentation: "fact"
          label: "Досрочное прекращение (арендатор)"
          description: "Основания и условия досрочного прекращения арендатором."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "landlord_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права арендодателя на досрочное прекращение."
          required: false
        - name: "landlord_termination_details"
          type: "string"
          presentation: "fact"
          label: "Досрочное прекращение (арендодатель)"
          description: "Основания и условия досрочного прекращения арендодателем."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока уведомления."
          required: false
        - name: "notice_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: "Срок уведомления о досрочном прекращении."
          required: false
          display_in_grid: false
        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания порядка возврата объекта."
          required: false
        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата объекта"
          description: "Формулировка о порядке возврата арендованного имущества."
          required: false
          display_in_grid: false
        - name: "deposit_refund_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания возврата / удержания обеспечительного платежа."
          required: false
        - name: "deposit_refund_details"
          type: "string"
          presentation: "fact"
          label: "Возврат обеспечительного платежа"
          description: "Формулировка о возврате или удержании обеспечительного платежа."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Преимущественное право
  # ──────────────────────────────────────────────────────────────────────────
  - id: preemptive_right_and_renewal_check
    name: "Преимущественное право, продление и пролонгация договора аренды"
    description: >
      Фактографическая проверка наличия в договоре преимущественного права
      арендатора на новый договор, условий продления / автопролонгации,
      срока уведомления о продлении и условий нового срока.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "преимущественное право"
        - "продление договора"
        - "возобновление"
        - "пролонгация"
        - "автоматическое продление"
        - "на тех же условиях"
        - "уведомление о продлении"
        - "отказ от продления"
        - "на новый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)автоматическ(ое|ого|ая|ой)\\s+продлен"
        - "(?i)пролонгац"
        - "(?i)уведомлени(е|я).*за\\s+\\d+\\s*(дней|месяц)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: преимущественное право арендатора,
        условия продления и пролонгации.

        Нормативный ориентир:
        - ст. 621 ГК РФ — преимущественное право арендатора
          и возобновление договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не делай самостоятельный правовой вывод о наличии «11-месячного трюка».

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание преимущественного права арендатора на новый договор.
        2. Есть ли оговорка об отказе от преимущественного права.
        3. Есть ли условие об автоматическом продлении / пролонгации.
        4. Какой срок уведомления о продлении.
        5. На каких условиях продлевается договор.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "Арендатор имеет преимущественное право на заключение договора аренды
        на новый срок. Договор автоматически продлевается на 1 год, если ни одна
        из сторон не направила уведомление об отказе от продления за 60 дней
        до истечения срока. При продлении условия сохраняются."

        Ответ:
        {
          "preemptive_right_status": "defined",
          "preemptive_right_details": "Арендатор имеет преимущественное право на заключение договора аренды на новый срок",
          "waiver_of_preemptive_right_status": "not_defined",
          "waiver_of_preemptive_right_details": "Данные не определены",
          "auto_renewal_status": "defined",
          "auto_renewal_details": "автоматически продлевается на 1 год",
          "renewal_notice_period_status": "defined",
          "renewal_notice_period_details": "за 60 дней до истечения срока",
          "renewal_terms_status": "defined",
          "renewal_terms_details": "условия сохраняются",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Арендатор имеет преимущественное право на заключение договора аренды на новый срок."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор действует до 31.12.2025."

        Ответ:
        {
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "waiver_of_preemptive_right_status": "not_defined",
          "waiver_of_preemptive_right_details": "Данные не определены",
          "auto_renewal_status": "not_defined",
          "auto_renewal_details": "Данные не определены",
          "renewal_notice_period_status": "not_defined",
          "renewal_notice_period_details": "Данные не определены",
          "renewal_terms_status": "not_defined",
          "renewal_terms_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о преимущественном праве.
        2. Найди прямую цитату об отказе от преимущественного права.
        3. Найди прямую цитату об автопродлении / пролонгации.
        4. Найди прямую цитату о сроке уведомления.
        5. Найди прямую цитату об условиях нового срока.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Данные не определены'>",
          "waiver_of_preemptive_right_status": "<defined / not_defined>",
          "waiver_of_preemptive_right_details": "<текст или 'Данные не определены'>",
          "auto_renewal_status": "<defined / not_defined>",
          "auto_renewal_details": "<текст или 'Данные не определены'>",
          "renewal_notice_period_status": "<defined / not_defined>",
          "renewal_notice_period_details": "<текст или 'Данные не определены'>",
          "renewal_terms_status": "<defined / not_defined>",
          "renewal_terms_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преимущественное право продление пролонгация автоматическое продление возобновление на тех же условиях уведомление о продлении отказ от продления на новый срок ст. 621"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "досрочное расторжение"
        - "односторонний отказ"
        - "возврат имущества"
        - "обеспечительный платеж"
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "субаренда"
        - "улучшения"
        - "доступ арендодателя"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        о преимущественном праве арендатора, автопродлении, пролонгации,
        сроке уведомления и условиях нового срока.
        Не анализируй досрочное расторжение, арендную плату, ремонт или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. preemptive_right_status — "defined" если преимущественное право арендатора
           прямо упомянуто, иначе "not_defined".
        2. preemptive_right_details — формулировка.
        3. waiver_of_preemptive_right_status — "defined" если отказ от
           преимущественного права прямо указан, иначе "not_defined".
        4. waiver_of_preemptive_right_details — формулировка.
        5. auto_renewal_status — "defined" если автопродление / пролонгация
           прямо предусмотрены, иначе "not_defined".
        6. auto_renewal_details — формулировка.
        7. renewal_notice_period_status — "defined" если срок уведомления
           о продлении прямо указан, иначе "not_defined".
        8. renewal_notice_period_details — срок уведомления.
        9. renewal_terms_status — "defined" если условия нового срока прямо
           определены, иначе "not_defined".
        10. renewal_terms_details — формулировка об условиях.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи преимущественное право из нормы ст. 621 ГК РФ.
        - preemptive_right_status = "defined" только если преимущественное право
          прямо упомянуто в тексте.
        - Верни только JSON.
        </rules>
      fields:
        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания преимущественного права арендатора."
          required: true
        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
