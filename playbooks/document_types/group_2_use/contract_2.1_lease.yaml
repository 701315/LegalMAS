  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Передача объекта аренды
  # ──────────────────────────────────────────────────────────────────────────
  - id: handover_condition_and_fitness_check
    name: "Передача объекта аренды: акт, состояние, пригодность и недостатки"
    description: >
      Фактографическая проверка наличия в договоре аренды условий о передаче
      объекта: акт приёма-передачи, описание технического состояния, гарантия
      пригодности для согласованного использования, раскрытие недостатков.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт приема-передачи"
        - "техническое состояние"
        - "исправное состояние"
        - "пригодно для использования"
        - "недостатки"
        - "дефекты"
        - "соответствие назначению"
        - "качество объекта"
        - "передача объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)исправн(ое|ом)\\s+состояни"
        - "(?i)пригодн(о|ость)\\s+для\\s+использован"
        - "(?i)недостат(ки|ков|ок)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: порядок передачи объекта аренды,
        описание его состояния, гарантия пригодности и раскрытие недостатков.

        Нормативный ориентир:
        - ст. 611 ГК РФ — обязанность передать имущество в надлежащем состоянии
        - ст. 612 ГК РФ — ответственность за недостатки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт приёма-передачи.
        2. Есть ли описание технического состояния объекта при передаче.
        3. Есть ли гарантия пригодности объекта для согласованного использования.
        4. Есть ли условие о раскрытии недостатков при передаче.
        5. Есть ли порядок фиксации недостатков и претензий при передаче.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — передача урегулирована:
        Фрагмент:
        "Объект передаётся Арендатору по двустороннему акту приёма-передачи
        в исправном техническом состоянии, пригодном для использования
        в качестве офиса. При обнаружении недостатков в течение 5 рабочих дней
        Арендатор направляет Арендодателю рекламацию."

        Ответ:
        {
          "handover_act_status": "defined",
          "handover_act_details": "двусторонний акт приёма-передачи",
          "condition_description_status": "defined",
          "condition_description_details": "в исправном техническом состоянии",
          "fitness_warranty_status": "defined",
          "fitness_warranty_details": "пригодном для использования в качестве офиса",
          "defect_disclosure_status": "defined",
          "defect_disclosure_details": "при обнаружении недостатков в течение 5 рабочих дней Арендатор направляет рекламацию",
          "defect_claim_procedure_status": "defined",
          "defect_claim_procedure_details": "рекламация в течение 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Объект передаётся Арендатору по двустороннему акту приёма-передачи в исправном техническом состоянии, пригодном для использования в качестве офиса."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель предоставляет помещение Арендатору."

        Ответ:
        {
          "handover_act_status": "not_defined",
          "handover_act_details": "Данные не определены",
          "condition_description_status": "not_defined",
          "condition_description_details": "Данные не определены",
          "fitness_warranty_status": "not_defined",
          "fitness_warranty_details": "Данные не определены",
          "defect_disclosure_status": "not_defined",
          "defect_disclosure_details": "Данные не определены",
          "defect_claim_procedure_status": "not_defined",
          "defect_claim_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об акте приёма-передачи.
        2. Найди прямую цитату о техническом состоянии при передаче.
        3. Найди прямую цитату о пригодности для использования.
        4. Найди прямую цитату о раскрытии или фиксации недостатков.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "handover_act_status": "<defined / not_defined>",
          "handover_act_details": "<текст или 'Данные не определены'>",
          "condition_description_status": "<defined / not_defined>",
          "condition_description_details": "<текст или 'Данные не определены'>",
          "fitness_warranty_status": "<defined / not_defined>",
          "fitness_warranty_details": "<текст или 'Данные не определены'>",
          "defect_disclosure_status": "<defined / not_defined>",
          "defect_disclosure_details": "<текст или 'Данные не определены'>",
          "defect_claim_procedure_status": "<defined / not_defined>",
          "defect_claim_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи техническое состояние исправное состояние пригодно для использования недостатки дефекты соответствие назначению качество объекта передача объекта рекламация"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "обеспечительный платеж"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "досрочное расторжение"
        - "возврат имущества"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия передачи
        объекта: акт приёма-передачи, описание состояния, гарантия пригодности,
        раскрытие и фиксация недостатков.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. handover_act_status — "defined" если акт приёма-передачи прямо
           предусмотрен, иначе "not_defined".
        2. handover_act_details — формулировка об акте приёма-передачи.
        3. condition_description_status — "defined" если описание технического
           состояния при передаче прямо указано, иначе "not_defined".
        4. condition_description_details — формулировка о состоянии объекта.
        5. fitness_warranty_status — "defined" если гарантия пригодности для
           согласованного использования прямо указана, иначе "not_defined".
        6. fitness_warranty_details — формулировка о пригодности.
        7. defect_disclosure_status — "defined" если раскрытие недостатков при
           передаче прямо предусмотрено, иначе "not_defined".
        8. defect_disclosure_details — формулировка о раскрытии недостатков.
        9. defect_claim_procedure_status — "defined" если порядок фиксации
           недостатков и претензий прямо описан, иначе "not_defined".
        10. defect_claim_procedure_details — формулировка о порядке претензий.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - handover_act_status = "defined" только если акт приёма-передачи прямо
          предусмотрен текстом; не выводи из факта передачи имущества.
        - fitness_warranty_status = "defined" только если пригодность для
          согласованного использования прямо сформулирована.
        - Верни только JSON.
        </rules>
      fields:
        - name: "handover_act_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на акт приёма-передачи."
          required: true
        - name: "handover_act_details"
          type: "string"
          presentation: "fact"
          label: "Акт приёма-передачи"
          description: "Формулировка об акте приёма-передачи."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "condition_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания состояния при передаче."
          required: false
        - name: "condition_description_details"
          type: "string"
          presentation: "fact"
          label: "Состояние при передаче"
          description: "Описание технического состояния объекта при передаче."
          required: false
          display_in_grid: false
        - name: "fitness_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантии пригодности для использования."
          required: false
        - name: "fitness_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия пригодности"
          description: "Формулировка о пригодности для согласованного использования."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "defect_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия недостатков при передаче."
          required: false
        - name: "defect_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие недостатков"
          description: "Формулировка о раскрытии недостатков при передаче."
          required: false
          display_in_grid: false
        - name: "defect_claim_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка фиксации недостатков и претензий."
          required: false
        - name: "defect_claim_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок фиксации недостатков"
          description: "Формулировка о порядке фиксации недостатков и направления претензий."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Ремонт, содержание
  # ──────────────────────────────────────────────────────────────────────────
  - id: repairs_and_operational_costs_check
    name: "Ремонт, содержание имущества и эксплуатационные расходы"
    description: >
      Фактографическая проверка распределения капитального и текущего ремонта,
      эксплуатационных и коммунальных расходов, технического обслуживания
      и обязанностей по содержанию объекта аренды.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
        - "техническое обслуживание"
        - "обязанность по содержанию"
        - "OPEX"
        - "maintenance"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+ремонт"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)эксплуатационн(ые|ых)\\s+расход"
        - "(?i)коммунальн(ые|ых)\\s+услуг"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: распределение ремонтных
        и эксплуатационных обязанностей.

        Нормативный ориентир:
        - ст. 616 ГК РФ — обязанности по содержанию арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт обязанность по капитальному ремонту.
        2. Кто несёт обязанность по текущему ремонту.
        3. Кто несёт эксплуатационные / коммунальные расходы.
        4. Есть ли детализация состава расходов.
        5. Есть ли обязанность по техническому обслуживанию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — распределение определено:
        Фрагмент:
        "Капитальный ремонт объекта осуществляется Арендодателем за свой счёт.
        Текущий ремонт и техническое обслуживание — обязанность Арендатора.
        Коммунальные услуги оплачивает Арендатор по показаниям приборов учёта."

        Ответ:
        {
          "capital_repairs_status": "defined",
          "capital_repairs_allocation": "landlord",
          "capital_repairs_details": "капитальный ремонт осуществляется Арендодателем за свой счёт",
          "current_repairs_status": "defined",
          "current_repairs_allocation": "tenant",
          "current_repairs_details": "текущий ремонт — обязанность Арендатора",
          "operational_costs_status": "defined",
          "operational_costs_allocation": "tenant",
          "operational_costs_details": "коммунальные услуги оплачивает Арендатор по показаниям приборов учёта",
          "maintenance_status": "defined",
          "maintenance_details": "техническое обслуживание — обязанность Арендатора",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Капитальный ремонт объекта осуществляется Арендодателем за свой счёт. Текущий ремонт и техническое обслуживание — обязанность Арендатора."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны содержат объект в надлежащем состоянии."

        Ответ:
        {
          "capital_repairs_status": "not_defined",
          "capital_repairs_allocation": "not_defined",
          "capital_repairs_details": "Данные не определены",
          "current_repairs_status": "not_defined",
          "current_repairs_allocation": "not_defined",
          "current_repairs_details": "Данные не определены",
          "operational_costs_status": "not_defined",
          "operational_costs_allocation": "not_defined",
          "operational_costs_details": "Данные не определены",
          "maintenance_status": "not_defined",
          "maintenance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о капитальном ремонте.
