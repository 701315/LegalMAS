      context_k: 10
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендная плата фиксированная переменная коммунальные услуги счетчики индексация обеспечительный платёж пени неустойка просрочка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "предмет аренды"
        - "кадастровый номер"
        - "площадь"
        - "капитальный ремонт"
