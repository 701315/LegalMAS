  # CHECK 11: Право собственности арендодателя
  # ──────────────────────────────────────────────────────────────────────────
  - id: landlord_title_check
    name: "Право собственности арендодателя на объект аренды (ст. 608 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре подтверждения права
      собственности арендодателя на объект аренды, ссылки на правоустанавливающие
      документы и ЕГРН, а также указания на отсутствие обременений.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "правоустанавливающие документы"
        - "свидетельство о праве"
        - "выписка из ЕГРН"
        - "свободно от обременений"
        - "не заложено"
        - "не арестовано"
        - "право сдачи в аренду"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)свободн(о|ым)\\s+от\\s+обременен"
        - "(?i)выписк(а|и)\\s+из\\s+ЕГРН"
        - "(?i)не\\s+заложен|не\\s+арестован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: подтверждение права собственности
        арендодателя на объект аренды и отсутствие обременений.

        Нормативный ориентир:
        - ст. 608 ГК РФ — право сдачи имущества в аренду
        - ст. 613 ГК РФ — права третьих лиц на объект аренды

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности арендодателя.
        2. Есть ли ссылка на правоустанавливающие документы.
        3. Есть ли ссылка на ЕГРН / выписку из ЕГРН.
        4. Есть ли указание на отсутствие залога.
        5. Есть ли указание на отсутствие ареста.
        6. Есть ли указание на отсутствие прав третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул подтверждён:
        Фрагмент:
        "Арендодатель подтверждает, что помещение принадлежит ему на праве
        собственности на основании договора купли-продажи от 15.01.2020,
        запись в ЕГРН № 77:06:0001001:123-77/001/2020-1. Помещение свободно
        от залога, ареста и прав третьих лиц."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "принадлежит на праве собственности на основании договора купли-продажи от 15.01.2020",
          "title_documents_status": "defined",
          "title_documents_details": "договор купли-продажи от 15.01.2020",
          "egrn_reference_status": "defined",
          "egrn_reference_details": "запись в ЕГРН № 77:06:0001001:123-77/001/2020-1",
          "no_pledge_status": "defined",
          "no_pledge_details": "свободно от залога",
          "no_arrest_status": "defined",
          "no_arrest_details": "свободно от ареста",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "свободно от прав третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Арендодатель подтверждает, что помещение принадлежит ему на праве собственности на основании договора купли-продажи от 15.01.2020."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель предоставляет помещение в аренду."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "title_documents_status": "not_defined",
          "title_documents_details": "Данные не определены",
          "egrn_reference_status": "not_defined",
          "egrn_reference_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
