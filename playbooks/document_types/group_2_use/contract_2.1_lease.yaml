          description: "Статус отказа от преимущественного права."
          required: false
        - name: "waiver_of_preemptive_right_details"
          type: "string"
          presentation: "fact"
          label: "Отказ от преимущественного права"
          description: "Формулировка об отказе от преимущественного права."
          required: false
          display_in_grid: false
        - name: "auto_renewal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус автопродления / пролонгации."
          required: false
        - name: "auto_renewal_details"
          type: "string"
          presentation: "fact"
          label: "Автопродление"
          description: "Формулировка об автоматическом продлении договора."
