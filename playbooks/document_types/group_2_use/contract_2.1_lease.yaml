      - "(?i)земл[ии]\\s+населенн[ыо]х\\s+пункт[оа]в"

  equipment_lease:
    any_keywords:
      - "(?i)\\bоборудовани[ея]\\b"
      - "(?i)\\bтехник[аи]\\b"
      - "(?i)\\bстан[оа]к\\b"
      - "(?i)\\bлини[яи]\\b"
      - "(?i)\\bмашин[аы]\\b"
      - "(?i)серийн[ыо]й\\s+номер"
      - "(?i)техническ[иоя]+\\s+паспорт"
      - "(?i)гарантийн[оа]е\\s+обслуживани[ея]"
      - "(?i)сервисн[оа]е\\s+обслуживани[ея]"

  long_term_lease:
