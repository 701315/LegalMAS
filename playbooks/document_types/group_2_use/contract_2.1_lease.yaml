          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии ареста. Внутреннее enum-поле."
          required: true

        - name: "no_arrest_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Отсутствие ареста"
          description: >
            Прямое заверение об отсутствии ареста на объект аренды, например:
            "Свободно от ареста".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "no_third_party_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
