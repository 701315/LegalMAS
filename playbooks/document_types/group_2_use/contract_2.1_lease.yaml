  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Страхование объекта аренды
  # ──────────────────────────────────────────────────────────────────────────
  - id: lease_insurance_check
    name: "Страхование объекта аренды"
    description: >
      Фактографическая проверка наличия условий страхования:
      кто страхует, что страхуется, выгодоприобретатель,
      минимальная сумма покрытия, срок представления полиса.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "выгодоприобретатель"
        - "страховая сумма"
        - "страховой случай"
        - "имущественное страхование"
        - "страхование ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован"
        - "(?i)страхов(ой|ого)\\s+полис"
        - "(?i)выгодоприобретател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: страхование объекта аренды.

        Нормативный ориентир:
        - ст. 211 ГК РФ — риск случайной гибели
        - ст. 929–930 ГК РФ — имущественное страхование

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность застраховать объект.
        2. Кто обязан застраховать.
        3. Что именно страхуется.
        4. Кто является выгодоприобретателем.
        5. Указана ли минимальная страховая сумма.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Арендатор обязан застраховать помещение от пожара и залива на сумму
        не менее 5 000 000 рублей. Выгодоприобретатель — Арендодатель.
        Копия полиса представляется в течение 10 дней."

        Ответ:
        {
          "insurance_obligation_status": "defined",
          "insurance_obligor": "tenant",
          "insurance_scope_status": "defined",
          "insurance_scope_details": "от пожара и залива",
          "beneficiary_status": "defined",
          "beneficiary_details": "Арендодатель",
          "minimum_coverage_status": "defined",
          "minimum_coverage_details": "не менее 5 000 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 5.5",
              "quote": "Арендатор обязан застраховать помещение от пожара и залива на сумму не менее 5 000 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны используют помещение по назначению."

        Ответ:
        {
          "insurance_obligation_status": "not_defined",
          "insurance_obligor": "not_defined",
          "insurance_scope_status": "not_defined",
          "insurance_scope_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Данные не определены",
          "minimum_coverage_status": "not_defined",
          "minimum_coverage_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности застраховать.
        2. Найди прямую цитату о выгодоприобретателе.
        3. Найди прямую цитату о минимальной сумме покрытия.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "insurance_obligation_status": "<defined / not_defined>",
          "insurance_obligor": "<landlord / tenant / both / not_defined>",
          "insurance_scope_status": "<defined / not_defined>",
          "insurance_scope_details": "<текст или 'Данные не определены'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_details": "<текст или 'Данные не определены'>",
          "minimum_coverage_status": "<defined / not_defined>",
          "minimum_coverage_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels: 
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование страховой полис выгодоприобретатель страховая сумма имущественное страхование страхование ответственности страховой случай"
      retrieval_profile: "insurance_check"
      preferred_unit_types: 
        - obligation
        - general_provision
      excluded_unit_types: 
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions: 
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "расторжение"
        - "улучшения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        страхования объекта: кто страхует, что страхуется, выгодоприобретатель,
        минимальная сумма.
        Не анализируй ремонт, субаренду или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. insurance_obligation_status — "defined" если обязанность застраховать
           прямо предусмотрена, иначе "not_defined".
        2. insurance_obligor — "landlord" / "tenant" / "both" / "not_defined".
        3. insurance_scope_status — "defined" если объём страхования прямо указан.
        4. insurance_scope_details — что именно страхуется.
        5. beneficiary_status — "defined" если выгодоприобретатель прямо указан.
        6. beneficiary_details — выгодоприобретатель.
        7. minimum_coverage_status — "defined" если минимальная сумма указана.
        8. minimum_coverage_details — минимальная страховая сумма.

        Если данные отсутствуют: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - insurance_obligor:
            - "landlord" — страхует арендодатель.
            - "tenant" — страхует арендатор.
            - "both" — страхуют обе стороны (разные виды).
            - "not_defined" — не определено.
        - Верни только JSON.
        </rules>
      fields:
        - name: "insurance_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности застраховать объект."
          required: true
        - name: "insurance_obligor"
          type: "string"
          presentation: "signal"
          allowed_values: ["landlord", "tenant", "both", "not_defined"]
          description: "Кто обязан застраховать."
          required: false
        - name: "insurance_scope_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания объёма страхования."
          required: false
        - name: "insurance_scope_details"
          type: "string"
          presentation: "fact"
          label: "Объём страхования"
          description: "Что именно страхуется."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "beneficiary_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания выгодоприобретателя."
          required: false
        - name: "beneficiary_details"
          type: "string"
          presentation: "fact"
          label: "Выгодоприобретатель"
          description: "Выгодоприобретатель по страховому полису."
          required: false
          display_in_grid: false
        - name: "minimum_coverage_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания минимальной страховой суммы."
          required: false
        - name: "minimum_coverage_details"
          type: "string"
          presentation: "fact"
          label: "Минимальная страховая сумма"
          description: "Минимальная сумма страхового покрытия."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: Ответственность сторон
  # ──────────────────────────────────────────────────────────────────────────
  - id: lease_liability_and_penalties_check
    name: "Ответственность сторон, неустойки и ограничение ответственности"
    description: >
      Фактографическая проверка наличия в договоре неустоек, штрафов,
      ограничения ответственности и распределения ответственности
      за ущерб третьим лицам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords: 
        - "неустойка"
        - "штраф"
        - "пени"
        - "ответственность"
        - "ограничение ответственности"
        - "возмещение убытков"
        - "ущерб третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк|штраф|пени"
        - "(?i)ограничени(е|я)\\s+ответственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: ответственность сторон, неустойки
        и ограничение ответственности.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку оплаты.
        2. Есть ли неустойка за иные нарушения арендатора.
        3. Есть ли неустойка за нарушения арендодателя.
        4. Есть ли ограничение ответственности.
        5. Есть ли распределение ответственности за ущерб третьим лицам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано — "not_defined" / "Данные не определены".
        3. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку оплаты — пени 0,1% в день. За нецелевое использование —
        штраф 500 000 руб. Совокупная ответственность Арендодателя ограничена
        размером годовой арендной платы."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,1% в день",
          "tenant_breach_penalty_status": "defined",
          "tenant_breach_penalty_details": "штраф 500 000 руб. за нецелевое использование",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Арендодателя ограничена размером годовой арендной платы",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 9.1", "quote": "За просрочку оплаты — пени 0,1% в день."}]
        }

        Пример 2:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Данные не определены",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1–5. Найди прямые цитаты по каждому из 5 пунктов задачи.
        6. Если нет — "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "tenant_breach_penalty_status": "<defined / not_defined>",
          "tenant_breach_penalty_details": "<текст или 'Данные не определены'>",
          "landlord_breach_penalty_status": "<defined / not_defined>",
          "landlord_breach_penalty_details": "<текст или 'Данные не определены'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "third_party_liability_status": "<defined / not_defined>",
          "third_party_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка штраф пени ответственность ограничение ответственности возмещение убытков ущерб третьим лицам"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
