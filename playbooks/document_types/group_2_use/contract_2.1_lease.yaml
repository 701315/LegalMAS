        - "эксплуатационные расходы"
        - "электроэнергия"
        - "отопление"
        - "водоснабжение"
        - "услуги управляющей компании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)коммунальн(ые|ых)\\s+услуг"
        - "(?i)эксплуатационн(ые|ых)\\s+расход"

  - id: "security_deposit"
    name: "Обеспечительный платеж / депозит"
