  - id: lease_rent_free_period_check
    name: "Арендные каникулы и льготные периоды (rent-free period)"
    description: >
      Фактографическая проверка наличия в договоре арендных каникул:
      продолжительность льготного периода, условия предоставления,
      действия при досрочном расторжении в период каникул.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендные каникулы"
        - "льготный период"
        - "rent-free"
        - "безвозмездное пользование"
        - "освобождение от арендной платы"
        - "период на благоустройство"
        - "fit-out period"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арендн(ые|ых)\\s+каникул"
        - "(?i)льготн(ый|ого)\\s+период"
        - "(?i)освобожд[а-я]*\\s+от\\s+плат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: наличие и условия арендных каникул
        (льготного периода без арендной платы).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Арендные каникулы — это период, когда арендатор освобождается
          от уплаты арендной платы полностью или частично (часто на время
          fit-out / ремонта помещения перед открытием).
        - Не путай с обычной отсрочкой платежа — каникулы это системное
          условие договора, а не разовая уступка.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие об арендных каникулах / льготном периоде.
        2. Продолжительность льготного периода.
        3. Условия предоставления каникул (например, только на fit-out).
        4. Последствия досрочного расторжения в период каникул
           (возврат льгот, перерасчёт).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлена" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — каникулы урегулированы:
        Фрагмент:
        "Арендатору предоставляются арендные каникулы на 3 месяца с даты
        подписания акта приёма-передачи для проведения отделочных работ.
        При досрочном расторжении в период каникул Арендатор обязан
        оплатить арендную плату за весь период каникул."

        Ответ:
        {
          "rent_free_period_status": "defined",
          "rent_free_period_details": "Предоставляются арендные каникулы на 3 месяца",
          "rent_free_duration_status": "defined",
          "rent_free_duration_details": "3 месяца с даты подписания акта приёма-передачи",
          "rent_free_conditions_status": "defined",
          "rent_free_conditions_details": "Для проведения отделочных работ (fit-out)",
          "rent_free_clawback_status": "defined",
          "rent_free_clawback_details": "При досрочном расторжении — оплата за весь период каникул",
          "evidence": [{"clause_ref": "п. 3.5", "quote": "Арендатору предоставляются арендные каникулы на 3 месяца с даты подписания акта приёма-передачи для проведения отделочных работ."}]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендная плата уплачивается ежемесячно до 10 числа."

        Ответ:
        {
          "rent_free_period_status": "not_defined",
          "rent_free_period_details": "Не установлено",
          "rent_free_duration_status": "not_defined",
          "rent_free_duration_details": "Не установлен",
          "rent_free_conditions_status": "not_defined",
          "rent_free_conditions_details": "Не установлено",
          "rent_free_clawback_status": "not_defined",
          "rent_free_clawback_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об арендных каникулах / льготном периоде.
        2. Найди прямую цитату о продолжительности каникул.
        3. Найди прямую цитату об условиях предоставления.
        4. Найди прямую цитату о последствиях досрочного расторжения
           (clawback).
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rent_free_period_status": "<defined / not_defined>",
          "rent_free_period_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "rent_free_duration_status": "<defined / not_defined>",
          "rent_free_duration_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "rent_free_conditions_status": "<defined / not_defined>",
          "rent_free_conditions_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "rent_free_clawback_status": "<defined / not_defined>",
          "rent_free_clawback_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендные каникулы льготный период rent-free освобождение от арендной платы период на благоустройство fit-out период без оплаты"
      retrieval_profile: "rent_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "неустойка"
        - "штраф"
        - "ремонт"
        - "субаренда"
        - "улучшения"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.50]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "rent_free_period_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        арендных каникул: наличие, продолжительность, условия предоставления,
        последствия досрочного расторжения (clawback).
        Не анализируй арендную плату, ремонт или субаренду.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rent_free_period_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (rent_free_period_status, rent_free_duration_status,
              rent_free_conditions_status, rent_free_clawback_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rent_free_period_status = "not_defined";
           - rent_free_duration_status = "not_defined";
           - rent_free_conditions_status = "not_defined";
           - rent_free_clawback_status = "not_defined";
           - rent_free_period_details = "Не установлено";
           - rent_free_duration_details = "Не установлен";
           - rent_free_conditions_details = "Не установлено";
           - rent_free_clawback_details = "Не установлено";
           - не выполняй остальные шаги.

        1. rent_free_period_status:
           - "defined" — если арендные каникулы / льготный период прямо
             предусмотрены;
           - "not_defined" — если прямо не предусмотрены.

        2. rent_free_period_details:
           Краткое user-facing описание условия о каникулах.
           - если указано, верни краткое summary, например: "Предоставляются
             арендные каникулы на 3 месяца";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. rent_free_duration_status:
           - "defined" — если продолжительность каникул прямо указана;
           - "not_defined" — если прямо не указана.

        4. rent_free_duration_details:
           Краткое описание продолжительности льготного периода.
           - если указана, верни краткое summary, например: "3 месяца с даты
             подписания акта приёма-передачи";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        5. rent_free_conditions_status:
           - "defined" — если условия предоставления каникул прямо указаны;
           - "not_defined" — если прямо не указаны.

        6. rent_free_conditions_details:
           Краткое описание условий предоставления каникул.
           - если указаны, верни краткое summary, например: "Для проведения
             отделочных работ (fit-out)";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        7. rent_free_clawback_status:
           - "defined" — если последствия досрочного расторжения в период
             каникул прямо указаны (возврат льгот, перерасчёт);
           - "not_defined" — если прямо не указаны.

        8. rent_free_clawback_details:
           Краткое описание последствий досрочного расторжения.
           - если указаны, верни краткое summary, например: "При досрочном
             расторжении — оплата за весь период каникул";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни rent_free_period_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлено").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК или предположения вместо текста договора.
        - Арендные каникулы — это период освобождения от арендной платы
          (полностью или частично), а не обычная отсрочка платежа.
        - Не смешивай тему настоящего check с арендной платой, ремонтом
          и субарендой.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте вообще отсутствуют положения о снижении плат, каникулах, безвозмездных периодах или льготных сроках.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлено".

        2. Общая фраза о каникулах без детализации.
           "Арендатору предоставляются арендные каникулы в соответствии с условиями договора" (продолжительность, условия и clawback не раскрыты).
           → presence = "present"; rent_free_period_status = "defined" (value = "Предоставляются арендные каникулы"), остальные status-поля = "not_defined" (values = "Не установлено" / "Не установлен").

        3. Противоречие между фрагментами.
           В разделе 3 указано, что каникулы длятся 2 месяца, а в графике платежей — что первый платеж взимается только с 4-го месяца аренды (каникулы 3 месяца).
           → presence = "unclear"; rent_free_duration_status = "not_defined"; rent_free_duration_details = "Не удалось определить".

        4. Односторонняя отмена льгот.
           "При любом существенном нарушении со стороны Арендатора Арендодатель имеет право в одностороннем порядке прекратить льготный период."
           → presence = "present"; rent_free_clawback_status = "defined"; value = "При нарушении обязательств — прекращение льготного периода".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          rent_free_period_details → "Не установлено"
          rent_free_duration_details → "Не установлен"
          rent_free_conditions_details → "Не установлено"
          rent_free_clawback_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_free_period_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие положений об арендных каникулах / льготном периоде. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rent_free_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об арендных каникулах. Внутреннее enum-поле."
          required: true

        - name: "rent_free_period_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Арендные каникулы"
          description: >
            Краткое описание условия о льготном периоде, например:
            "Предоставляются арендные каникулы на 3 месяца".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "rent_free_duration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания продолжительности каникул. Внутреннее enum-поле."
          required: true

        - name: "rent_free_duration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Продолжительность каникул"
          description: >
            Краткое описание продолжительности льготного периода, например:
            "3 месяца с даты подписания акта приёма-передачи".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "rent_free_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания условий предоставления. Внутреннее enum-поле."
          required: true

        - name: "rent_free_conditions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Условия предоставления"
          description: >
            Краткое описание условий предоставления каникул, например:
            "Для проведения отделочных работ (fit-out)".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "rent_free_clawback_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания последствий досрочного расторжения. Внутреннее enum-поле."
          required: true

        - name: "rent_free_clawback_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Возврат льгот при расторжении"
          description: >
            Краткое описание последствий досрочного расторжения в период
            каникул, например: "При досрочном расторжении — оплата за весь
            период каникул".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_notices_and_communications_check
    name: "Порядок уведомлений и юридических коммуникаций между сторонами"
    description: >
      Фактографическая проверка наличия в договоре аренды условий о порядке
      направления юридических уведомлений: допустимые способы (почта, e-mail,
      курьер, мессенджер), адреса и реквизиты для направления, момент вступления
      уведомления в силу, язык и форма уведомлений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомление"
        - "извещение"
        - "направление уведомлений"
        - "юридический адрес"
        - "почтовое отправление"
        - "электронная почта"
        - "e-mail"
        - "курьерская доставка"
        - "вручение под расписку"
        - "вступает в силу"
        - "момент получения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлен[а-я]*\\s+(направл|вруч|достав)"
        - "(?i)юридическ[а-я]+\\s+адрес"
        - "(?i)e-?mail|электронн[а-я]+\\s+почт"
        - "(?i)вступа[ею]т?\\s+в\\s+силу"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: порядок направления юридических
        уведомлений и коммуникаций между сторонами договора.

        Нормативный ориентир:
        - ст. 165.1 ГК РФ — юридически значимые сообщения
        - ст. 452 ГК РФ — форма соглашения об изменении/расторжении

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай адрес для уведомлений с юридическим адресом стороны
          (регистрация в ЕГРЮЛ) — здесь речь о договорном адресе для
          направления корреспонденции.
        - Момент вступления уведомления в силу — это конкретное правило
          (например, "с момента вручения", "через 3 рабочих дня после
          отправки"), а не общая фраза о том, что уведомления обязательны.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какие способы направления уведомлений прямо предусмотрены
           (заказное письмо, e-mail, курьер, вручение под расписку и т.п.).
        2. Указаны ли конкретные адреса / реквизиты для направления
           уведомлений каждой стороне.
        3. Определён ли момент вступления уведомления в силу.
        4. Указан ли язык и/или обязательная форма уведомлений
           (письменная, электронная с ЭЦП и т.п.).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" / "Не установлено" / "Не установлены" — если
             условие прямо не указано (согласуй род и число);
           - "Не удалось определить" — если данные противоречивы.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок уведомлений урегулирован:
        Фрагмент:
        "Все уведомления по настоящему договору направляются заказным
        письмом с уведомлением о вручении или курьерской доставкой по
        адресам, указанным в разделе «Реквизиты сторон». Уведомление
        считается полученным через 3 (три) рабочих дня с даты отправки.
        Уведомления направляются на русском языке в письменной форме."

        Ответ:
        {
          "notice_method_status": "defined",
          "notice_method_details": "Заказное письмо с уведомлением о вручении или курьерская доставка",
          "notice_address_status": "defined",
          "notice_address_details": "Адреса, указанные в разделе «Реквизиты сторон»",
          "notice_effectiveness_status": "defined",
          "notice_effectiveness_details": "Через 3 рабочих дня с даты отправки",
          "notice_form_status": "defined",
          "notice_form_details": "На русском языке в письменной форме",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Все уведомления по настоящему договору направляются заказным письмом с уведомлением о вручении или курьерской доставкой по адресам, указанным в разделе «Реквизиты сторон»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются добросовестно исполнять условия договора."

        Ответ:
        {
          "notice_method_status": "not_defined",
          "notice_method_details": "Не установлен",
          "notice_address_status": "not_defined",
          "notice_address_details": "Не установлены",
          "notice_effectiveness_status": "not_defined",
          "notice_effectiveness_details": "Не установлен",
          "notice_form_status": "not_defined",
          "notice_form_details": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о способах направления уведомлений.
        2. Найди прямую цитату об адресах для уведомлений.
        3. Найди прямую цитату о моменте вступления в силу.
        4. Найди прямую цитату о форме/языке уведомлений.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "notice_method_status": "<defined / not_defined>",
          "notice_method_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "notice_address_status": "<defined / not_defined>",
          "notice_address_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "notice_effectiveness_status": "<defined / not_defined>",
          "notice_effectiveness_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "notice_form_status": "<defined / not_defined>",
          "notice_form_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление извещение направление уведомлений юридический адрес почтовое отправление электронная почта e-mail курьерская доставка вручение под расписку вступает в силу момент получения реквизиты сторон"
      retrieval_profile: "notice_check"
      preferred_unit_types:
        - general_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "текущий ремонт"
        - "субаренда"
        - "улучшения"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "notices_and_communications_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        о порядке направления юридических уведомлений: способы, адреса,
        момент вступления в силу, форма и язык.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. notices_and_communications_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (notice_method_status, notice_address_status,
              notice_effectiveness_status, notice_form_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notice_method_status = "not_defined";
           - notice_address_status = "not_defined";
           - notice_effectiveness_status = "not_defined";
           - notice_form_status = "not_defined";
           - notice_method_details = "Не установлен";
           - notice_address_details = "Не установлены";
           - notice_effectiveness_details = "Не установлен";
           - notice_form_details = "Не установлена";
           - не выполняй остальные шаги.

        1. notice_method_status:
           - "defined" — если способы направления уведомлений прямо указаны
             (заказное письмо, e-mail, курьер, вручение под расписку и т.п.);
           - "not_defined" — если прямо не указаны.

        2. notice_method_details:
           Краткое user-facing описание допустимых способов.
           - если указаны, верни краткое summary, например: "Заказное письмо
             с уведомлением о вручении или курьерская доставка";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        3. notice_address_status:
           - "defined" — если адреса или реквизиты для направления уведомлений
             прямо указаны или прямо отсылают к разделу договора;
           - "not_defined" — если прямо не указаны.

        4. notice_address_details:
           Краткое описание адресов для уведомлений.
           - если указаны, верни краткое summary, например: "Адреса, указанные
             в разделе «Реквизиты сторон»";
           - если данных нет — "Не установлены";
           - если данные противоречивы — "Не удалось определить".

        5. notice_effectiveness_status:
           - "defined" — если момент вступления уведомления в силу прямо
             определён (например, "с момента вручения", "через 3 рабочих
             дня после отправки");
           - "not_defined" — если прямо не определён.

        6. notice_effectiveness_details:
           Краткое описание момента вступления в силу.
           - если указан, верни краткое summary, например: "Через 3 рабочих
             дня с даты отправки";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        7. notice_form_status:
           - "defined" — если форма и/или язык уведомлений прямо указаны
             (письменная, электронная с ЭЦП, русский язык и т.п.);
           - "not_defined" — если прямо не указаны.

        8. notice_form_details:
           Краткое описание формы и языка уведомлений.
           - если указаны, верни краткое summary, например: "На русском языке
             в письменной форме";
           - если данных нет — "Не установлена";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notices_and_communications_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК (ст. 165.1) или предположения вместо текста договора.
        - Не путай адрес для уведомлений с юридическим адресом регистрации
          стороны в ЕГРЮЛ — фиксируй только договорный порядок.
        - Не смешивай тему уведомлений с арендной платой, ремонтом,
          субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет раздела об уведомлениях, корреспонденции или порядке коммуникаций.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = соответствующий fallback.

        2. Общая фраза без конкретики.
           "Стороны уведомляют друг друга в порядке, предусмотренном действующим законодательством" (без указания конкретных способов, сроков, адресов).
           → presence = "present"; notice_method_status = "not_defined" (value = "Не установлен"), notice_effectiveness_status = "not_defined" (value = "Не установлен").

        3. Противоречие между фрагментами.
           В разделе 12 уведомления считаются полученными через 3 дня, а в разделе 15 — через 10 рабочих дней.
           → presence = "unclear"; notice_effectiveness_status = "not_defined"; notice_effectiveness_details = "Не удалось определить".

        4. Электронный документооборот.
           "Уведомления могут направляться по электронной почте с использованием усиленной квалифицированной электронной подписи".
           → presence = "present"; notice_method_status = "defined"; notice_form_status = "defined"; value = "Электронная почта с УКЭП".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notices_and_communications_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * notice_method_details → "Не установлен"
          * notice_address_details → "Не установлены"
          * notice_effectiveness_details → "Не установлен"
          * notice_form_details → "Не установлена"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notices_and_communications_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка юридических уведомлений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notice_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания способов направления уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notice_method_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Способ уведомлений"
          description: >
            Допустимые способы направления уведомлений, например: "Заказное
            письмо с уведомлением о вручении или курьерская доставка".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "notice_address_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания адресов для уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notice_address_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Адрес для уведомлений"
          description: >
            Адреса или реквизиты для направления уведомлений, например:
            "Адреса, указанные в разделе «Реквизиты сторон»".
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "notice_effectiveness_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента вступления уведомления в силу. Внутреннее enum-поле."
          required: true

        - name: "notice_effectiveness_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Момент вступления в силу"
          description: >
            Момент, с которого уведомление считается полученным, например:
            "Через 3 рабочих дня с даты отправки".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "notice_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания формы и языка уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notice_form_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Форма уведомлений"
          description: >
            Форма и язык уведомлений, например: "На русском языке в
            письменной форме".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_environmental_obligations_check
    name: "Экологические обязательства, загрязнение и рекультивация"
    description: >
      Фактографическая проверка наличия в договоре аренды экологических
      обязательств сторон: соблюдение природоохранного законодательства,
      распределение ответственности за загрязнение объекта и земельного
      участка, обращение с отходами, обязанность рекультивации при выезде.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "экологический"
        - "охрана окружающей среды"
        - "загрязнение"
        - "рекультивация"
        - "отходы"
        - "выбросы"
        - "сбросы"
        - "экологическая экспертиза"
        - "ПДК"
        - "природоохранное законодательство"
        - "экологический аудит"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)экологич[а-я]+"
        - "(?i)загрязнен[а-я]+"
        - "(?i)рекультиваци"
        - "(?i)отход[а-я]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: экологические обязательства сторон
        в связи с использованием объекта аренды.

        Нормативный ориентир:
        - ФЗ-7 «Об охране окружающей среды»
        - ФЗ-89 «Об отходах производства и потребления»
        - ст. 1064–1068 ГК РФ — возмещение вреда

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи экологические обязательства из общего требования
          «соблюдать законодательство» — фиксируй только конкретные
          экологические условия.
        - Для производственных и промышленных объектов экологические
          условия особенно критичны, но и для офисных помещений может
          быть установлен режим обращения с отходами.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли общие экологические обязательства (соблюдение
           природоохранных норм, запрет на загрязнение).
        2. Распределена ли ответственность за загрязнение объекта
           и/или земельного участка.
        3. Урегулировано ли обращение с отходами (вывоз, утилизация).
        4. Есть ли обязанность рекультивации или экологического
           восстановления при выезде.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлено" / "Не установлена" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — экологические условия урегулированы:
        Фрагмент:
        "Арендатор обязан соблюдать требования природоохранного
        законодательства и не допускать загрязнения земельного участка
        и объекта аренды. Все отходы производства вывозятся Арендатором
        за свой счёт силами лицензированной организации. При прекращении
        договора Арендатор обязан провести рекультивацию земельного
        участка до состояния, существовавшего на момент передачи."

        Ответ:
        {
          "environmental_compliance_status": "defined",
          "environmental_compliance_details": "Соблюдение природоохранного законодательства, запрет на загрязнение",
          "contamination_liability_status": "defined",
          "contamination_liability_details": "Арендатор не допускает загрязнения участка и объекта",
          "waste_disposal_status": "defined",
          "waste_disposal_details": "Вывоз отходов Арендатором за свой счёт силами лицензированной организации",
          "remediation_obligation_status": "defined",
          "remediation_obligation_details": "Рекультивация земельного участка до исходного состояния при выезде",
          "evidence": [
            {
              "clause_ref": "п. 6.8",
              "quote": "Арендатор обязан соблюдать требования природоохранного законодательства и не допускать загрязнения земельного участка и объекта аренды."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует объект по целевому назначению."

        Ответ:
        {
          "environmental_compliance_status": "not_defined",
          "environmental_compliance_details": "Не установлено",
          "contamination_liability_status": "not_defined",
          "contamination_liability_details": "Не установлено",
          "waste_disposal_status": "not_defined",
          "waste_disposal_details": "Не установлено",
          "remediation_obligation_status": "not_defined",
          "remediation_obligation_details": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об экологических обязательствах.
        2. Найди прямую цитату об ответственности за загрязнение.
        3. Найди прямую цитату об обращении с отходами.
        4. Найди прямую цитату о рекультивации.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "environmental_compliance_status": "<defined / not_defined>",
          "environmental_compliance_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "contamination_liability_status": "<defined / not_defined>",
          "contamination_liability_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "waste_disposal_status": "<defined / not_defined>",
          "waste_disposal_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "remediation_obligation_status": "<defined / not_defined>",
          "remediation_obligation_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "экологический охрана окружающей среды загрязнение рекультивация отходы выбросы сбросы экологическая экспертиза ПДК природоохранное законодательство экологический аудит"
      retrieval_profile: "repair_maintenance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "субаренда"
        - "страхование"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "environmental_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды
        экологические обязательства: соблюдение природоохранных норм,
        ответственность за загрязнение, обращение с отходами и
        рекультивация при выезде.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. environmental_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (environmental_compliance_status, contamination_liability_status,
              waste_disposal_status, remediation_obligation_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - environmental_compliance_status = "not_defined";
           - contamination_liability_status = "not_defined";
           - waste_disposal_status = "not_defined";
           - remediation_obligation_status = "not_defined";
           - environmental_compliance_details = "Не установлено";
           - contamination_liability_details = "Не установлено";
           - waste_disposal_details = "Не установлено";
           - remediation_obligation_details = "Не установлена";
           - не выполняй остальные шаги.

        1. environmental_compliance_status:
           - "defined" — если общие экологические обязательства прямо указаны
             (соблюдение природоохранных норм, запрет на загрязнение и т.п.);
           - "not_defined" — если прямо не указаны. Общая фраза «соблюдать
             законодательство РФ» без экологической специфики не считается
             "defined".

        2. environmental_compliance_details:
           Краткое user-facing описание экологических обязательств.
           - если указаны, верни краткое summary, например: "Соблюдение
             природоохранного законодательства, запрет на загрязнение";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. contamination_liability_status:
           - "defined" — если распределение ответственности за загрязнение
             объекта и/или земельного участка прямо указано;
           - "not_defined" — если прямо не указано.

        4. contamination_liability_details:
           Краткое описание ответственности за загрязнение.
           - если указано, верни краткое summary, например: "Арендатор не
             допускает загрязнения участка и объекта";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        5. waste_disposal_status:
           - "defined" — если порядок обращения с отходами прямо указан
             (вывоз, утилизация, лицензированный подрядчик);
           - "not_defined" — если прямо не указан.

        6. waste_disposal_details:
           Краткое описание обращения с отходами.
           - если указано, верни краткое summary, например: "Вывоз отходов
             Арендатором за свой счёт силами лицензированной организации";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        7. remediation_obligation_status:
           - "defined" — если обязанность рекультивации или экологического
             восстановления при выезде прямо указана;
           - "not_defined" — если прямо не указана.

        8. remediation_obligation_details:
           Краткое описание обязанности рекультивации.
           - если указана, верни краткое summary, например: "Рекультивация
             земельного участка до исходного состояния при выезде";
           - если данных нет — "Не установлена";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни environmental_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлено" / "Не установлена").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ФЗ-7, ФЗ-89 или предположения вместо текста договора.
        - Общая фраза «Стороны соблюдают действующее законодательство» без
          экологической конкретики не является "defined" для
          environmental_compliance_status.
        - Не смешивай экологические обязательства с ремонтом, арендной
          платой, субарендой и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминаний экологических норм, загрязнения, отходов или рекультивации.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлено".

        2. Общая ссылка на законодательство.
           "Арендатор обязуется соблюдать все применимые нормы законодательства РФ" (без экологической конкретики).
           → presence = "missing" (так как нет экологической специфики); все status-поля = "not_defined".

        3. Противоречие между фрагментами.
           В разделе 6 ответственность за загрязнение несёт Арендатор, а в разделе 14 — Арендодатель как собственник земельного участка.
           → presence = "unclear"; contamination_liability_status = "not_defined"; contamination_liability_details = "Не удалось определить".

        4. Частичное регулирование.
           Установлен запрет на загрязнение, но порядок обращения с отходами и рекультивация не описаны.
           → presence = "present"; environmental_compliance_status = "defined", waste_disposal_status = "not_defined" (value = "Не установлено"), remediation_obligation_status = "not_defined" (value = "Не установлена").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для environmental_obligations_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * environmental_compliance_details → "Не установлено"
          * contamination_liability_details → "Не установлено"
          * waste_disposal_details → "Не установлено"
          * remediation_obligation_details → "Не установлена"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "environmental_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие экологических обязательств в договоре аренды. Внутреннее агрегатное signal-поле."
          required: true

        - name: "environmental_compliance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус общих экологических обязательств. Внутреннее enum-поле."
          required: true

        - name: "environmental_compliance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Экологические обязательства"
          description: >
            Краткое описание экологических обязательств, например:
            "Соблюдение природоохранного законодательства, запрет на
            загрязнение".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "contamination_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения ответственности за загрязнение. Внутреннее enum-поле."
          required: true

        - name: "contamination_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ответственность за загрязнение"
          description: >
            Краткое описание ответственности за загрязнение, например:
            "Арендатор не допускает загрязнения участка и объекта".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "waste_disposal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус регулирования обращения с отходами. Внутреннее enum-поле."
          required: true

        - name: "waste_disposal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Обращение с отходами"
          description: >
            Краткое описание обращения с отходами, например: "Вывоз отходов
            Арендатором за свой счёт силами лицензированной организации".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "remediation_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности рекультивации при выезде. Внутреннее enum-поле."
          required: true

        - name: "remediation_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Рекультивация при выезде"
          description: >
            Краткое описание обязанности рекультивации, например:
            "Рекультивация земельного участка до исходного состояния
            при выезде".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

      store_payload: true

  - id: lease_signage_and_branding_check
    name: "Вывеска, товарный знак и брендирование объекта"
    description: >
      Фактографическая проверка наличия в договоре условий о праве арендатора
      на размещение вывески, товарного знака, рекламы и элементов
      брендирования на фасаде, внутри и на прилегающей территории объекта
      аренды, а также порядка согласования и демонтажа при выезде.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вывеска"
        - "товарный знак"
        - "брендирование"
        - "реклама"
        - "фасад"
        - "рекламная конструкция"
        - "логотип"
        - "фирменное наименование"
        - "визуальное оформление"
        - "деонтаж вывески"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вывеск"
        - "(?i)товарн[а-я]+\\s+знак"
        - "(?i)брендирова"
        - "(?i)рекламн[а-я]+\\s+конструкц"
        - "(?i)логотип|фирменн[а-я]+\\s+наименован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор аренды по Главе 34 ГК РФ.
        Проверяется только один вопрос: право арендатора на размещение
        вывески, товарного знака и элементов брендирования на объекте аренды.

        Нормативный ориентир:
        - ст. 1484 ГК РФ — исключительное право на товарный знак
        - ФЗ-38 «О рекламе» — размещение рекламы на зданиях
        - муниципальные правила размещения вывесок

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай право на вывеску с правом на рекламу — вывеска содержит
          информацию о фирменном наименовании и роде деятельности, а
          реклама продвигает конкретные товары/услуги. Договор может
          регулировать их раздельно.
        - Для retail-аренды (магазины, рестораны) право на вывеску —
          критически важное коммерческое условие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право арендатора на размещение вывески.
        2. Требуется ли согласование вывески/брендирования с арендодателем.
        3. Определён ли объём брендирования (фасад, интерьер, территория).
        4. Есть ли обязанность демонтажа вывески при выезде.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлено" / "Не установлена" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — вывеска урегулирована:
        Фрагмент:
        "Арендатор вправе разместить вывеску с фирменным наименованием
        и логотипом на фасаде здания в месте, согласованном с
        Арендодателем. Эскиз вывески утверждается Арендодателем в
        течение 10 рабочих дней. При прекращении договора Арендатор
        обязан демонтировать вывеску и восстановить фасад за свой счёт."

        Ответ:
        {
          "signage_right_status": "defined",
          "signage_right_details": "Вывеска с фирменным наименованием и логотипом на фасаде",
          "signage_approval_status": "defined",
          "signage_approval_details": "Эскиз утверждается Арендодателем в течение 10 рабочих дней",
          "branding_scope_status": "defined",
          "branding_scope_details": "Фасад здания в согласованном месте",
          "signage_removal_status": "defined",
          "signage_removal_details": "Демонтаж вывески и восстановление фасада за счёт Арендатора",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Арендатор вправе разместить вывеску с фирменным наименованием и логотипом на фасаде здания в месте, согласованном с Арендодателем."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор использует помещение под офис."

        Ответ:
        {
          "signage_right_status": "not_defined",
          "signage_right_details": "Не установлено",
          "signage_approval_status": "not_defined",
          "signage_approval_details": "Не установлен",
          "branding_scope_status": "not_defined",
          "branding_scope_details": "Не установлен",
          "signage_removal_status": "not_defined",
          "signage_removal_details": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на вывеску.
        2. Найди прямую цитату о согласовании.
        3. Найди прямую цитату об объёме брендирования.
        4. Найди прямую цитату о демонтаже.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "signage_right_status": "<defined / not_defined>",
          "signage_right_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "signage_approval_status": "<defined / not_defined>",
          "signage_approval_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "branding_scope_status": "<defined / not_defined>",
          "branding_scope_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "signage_removal_status": "<defined / not_defined>",
          "signage_removal_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вывеска товарный знак брендирование реклама фасад рекламная конструкция логотип фирменное наименование визуальное оформление демонтаж вывески"
      retrieval_profile: "notice_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "индексация"
        - "капитальный ремонт"
        - "субаренда"
        - "страхование"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "signage_and_branding_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора аренды условия
        о вывеске, товарном знаке и брендировании: право на размещение,
        порядок согласования, объём и демонтаж при выезде.
        Не анализируй арендную плату, ремонт, субаренду или расторжение.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. signage_and_branding_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных содержательных полей
             (signage_right_status, signage_approval_status,
              branding_scope_status, signage_removal_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - signage_right_status = "not_defined";
           - signage_approval_status = "not_defined";
           - branding_scope_status = "not_defined";
           - signage_removal_status = "not_defined";
           - signage_right_details = "Не установлено";
           - signage_approval_details = "Не установлен";
           - branding_scope_details = "Не установлен";
           - signage_removal_details = "Не установлена";
           - не выполняй остальные шаги.

        1. signage_right_status:
           - "defined" — если право арендатора на размещение вывески,
             товарного знака или логотипа прямо предусмотрено;
           - "not_defined" — если прямо не предусмотрено.

        2. signage_right_details:
           Краткое user-facing описание права на вывеску.
           - если указано, верни краткое summary, например: "Вывеска с
             фирменным наименованием и логотипом на фасаде";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. signage_approval_status:
           - "defined" — если порядок согласования вывески/брендирования
             с арендодателем прямо указан (сроки, процедура, эскиз);
           - "not_defined" — если прямо не указан.

        4. signage_approval_details:
           Краткое описание порядка согласования.
           - если указан, верни краткое summary, например: "Эскиз утверждается
             Арендодателем в течение 10 рабочих дней";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        5. branding_scope_status:
           - "defined" — если объём и место брендирования прямо определены
             (фасад, интерьер, прилегающая территория, витрины);
           - "not_defined" — если прямо не определены.

        6. branding_scope_details:
           Краткое описание объёма брендирования.
           - если указан, верни краткое summary, например: "Фасад здания
             в согласованном месте";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        7. signage_removal_status:
           - "defined" — если обязанность демонтажа вывески и/или
             восстановления фасада при выезде прямо указана;
           - "not_defined" — если прямо не указана.

        8. signage_removal_details:
           Краткое описание обязанности демонтажа.
           - если указана, верни краткое summary, например: "Демонтаж вывески
             и восстановление фасада за счёт Арендатора";
           - если данных нет — "Не установлена";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни signage_and_branding_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все status-поля = "not_defined", а все details-поля заменяются на соответствующий fallback ("Не установлено" / "Не установлен" / "Не установлена").
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ФЗ-38 или предположения вместо текста договора.
        - Не путай вывеску (информация о фирменном наименовании) с рекламой
          (продвижение товаров/услуг) — если договор разделяет эти понятия,
          фиксируй только то, что относится к вывеске и брендированию.
        - Не смешивай тему вывески с арендной платой, ремонтом, субарендой
          и расторжением.
        - Если в разных фрагментах указаны противоречащие друг другу данные
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминаний вывески, товарного знака, логотипа, брендирования или рекламы.
           → presence = "missing"; все status-поля = "not_defined"; все details-поля = "Не установлено".

        2. Запрет на вывеску.
           "Арендатор не вправе размещать какие-либо вывески, рекламные конструкции или элементы брендирования на фасаде здания без письменного согласия Арендодателя."
           → presence = "present"; signage_right_status = "not_defined" (value = "Не установлено"), signage_approval_status = "defined" (value = "Запрет без письменного согласия Арендодателя").

        3. Противоречие между фрагментами.
           В разделе 5 указано, что вывеска размещается свободно, а в Правилах ТЦ (приложение) — что все вывески согласовываются с управляющей компанией.
           → presence = "unclear"; signage_approval_status = "not_defined"; signage_approval_details = "Не удалось определить".

        4. Ссылка на внешние правила.
           "Размещение вывесок осуществляется в соответствии с Правилами благоустройства города и Дизайн-кодом ТЦ."
           → presence = "present"; signage_right_status = "defined"; value = "В соответствии с Правилами благоустройства и Дизайн-кодом ТЦ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для signage_and_branding_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * signage_right_details → "Не установлено"
          * signage_approval_details → "Не установлен"
          * branding_scope_details → "Не установлен"
          * signage_removal_details → "Не установлена"
        - Fallback при противоречии или неоднозначности:
          * все details поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "signage_and_branding_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования вывески, товарного знака и брендирования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "signage_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на размещение вывески. Внутреннее enum-поле."
          required: true

        - name: "signage_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на вывеску"
          description: >
            Краткое описание права на вывеску, например: "Вывеска с
            фирменным наименованием и логотипом на фасаде".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "signage_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка согласования вывески. Внутреннее enum-поле."
          required: true

        - name: "signage_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласование вывески"
          description: >
            Краткое описание порядка согласования, например: "Эскиз
            утверждается Арендодателем в течение 10 рабочих дней".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "branding_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения объёма брендирования. Внутреннее enum-поле."
          required: true

        - name: "branding_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Объём брендирования"
          description: >
            Краткое описание объёма и мест брендирования, например:
            "Фасад здания в согласованном месте".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "signage_removal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности демонтажа вывески при выезде. Внутреннее enum-поле."
          required: true

        - name: "signage_removal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Демонтаж вывески"
          description: >
            Краткое описание обязанности демонтажа, например: "Демонтаж
            вывески и восстановление фасада за счёт Арендатора".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты арендодателя и арендатора,
      полномочия подписантов, а также правовое основание, по которому арендодатель
      вправе сдавать имущество в аренду.
    addressee: "Обе стороны"

  lease_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: точное описание объекта аренды,
      срок аренды, размер арендной платы, цель использования, а также комплект
      документов для передачи объекта.
    addressee: "Арендодатель"

  lease_subject_identification_check:
    text: >
      Просим уточнить в {doc_names}: индивидуализирующие признаки объекта аренды
      (адрес, площадь, кадастровый номер, номер помещения, серийный номер, VIN и т.п.),
      достаточные для его однозначного определения.
    addressee: "Арендодатель / Юридический советник"

  lessor_title_and_authority:
    text: >
      Просим предоставить по {doc_names}: выписку ЕГРН / документы на титул,
      а также подтверждение права арендодателя сдавать объект в аренду.
    addressee: "Арендодатель"

  rent_payment_and_indexation_check:
    text: >
      Просим уточнить в {doc_names}: фиксированную и переменную часть арендной платы,
      индексацию, структуру коммунальных и эксплуатационных платежей,
      а также размер и режим обеспечительного платежа.
    addressee: "Обе стороны / Финансовый советник"

  rent_payment_required:
    text: >
      Просим уточнить в {doc_names}: размер арендной платы, сроки оплаты,
      валюту, реквизиты и порядок расчёта переменной части (если применимо).
    addressee: "Обе стороны"

  lease_term_clause:
    text: >
      Просим уточнить в {doc_names}: срок аренды, дату начала и окончания,
      а также модель договора при неопределенном сроке (если она используется).
    addressee: "Юридический советник"

  long_term_real_estate_lease_registration:
    text: >
      Внимание: для {doc_names} может требоваться государственная регистрация.
      Просим подтвердить регистрационную позицию, порядок подачи документов,
      распределение расходов и последствия отказа/приостановки регистрации.
    addressee: "Юридический советник / Росреестр"

  handover_condition_and_fitness_check:
    text: >
      Просим предоставить по {doc_names}: форму акта приема-передачи,
      описание состояния объекта, перечень недостатков (если есть),
      подтверждение пригодности для согласованного использования.
    addressee: "Арендодатель"

  handover_act:
    text: >
      Просим согласовать в {doc_names}: форму и содержание акта приема-передачи,
      дату передачи, перечень передаваемых ключей, документов и аксессуаров.
    addressee: "Обе стороны"

  repairs_and_operational_costs_check:
    text: >
      Просим уточнить в {doc_names}: кто несет капитальный и текущий ремонт,
      эксплуатационные расходы, коммунальные платежи, техническое обслуживание
      и иные обязательные расходы по объекту.
    addressee: "Обе стороны"

  maintenance_duties:
    text: >
      Просим четко разграничить в {doc_names}: капитальный ремонт, текущий ремонт,
      maintenance duties и последствия нарушения ремонтных обязанностей.
    addressee: "Юридический советник"

  utilities_and_operating_expenses:
    text: >
      Просим уточнить в {doc_names}: состав коммунальных и эксплуатационных расходов,
      механизм их расчета, документы-основания и сроки возмещения/оплаты.
    addressee: "Обе стороны / Финансовый советник"

  security_deposit:
    text: >
      Просим уточнить в {doc_names}: размер обеспечительного платежа,
      основания для удержания, условия возврата и возможность зачета.
    addressee: "Юридический советник"

  improvements_and_sublease_check:
    text: >
      Просим уточнить в {doc_names}: режим улучшений, порядок согласования перепланировки,
      компенсацию неотделимых улучшений и правила субаренды/перенаема.
    addressee: "Обе стороны / Юридический советник"

  improvements_ownership:
    text: >
      Просим уточнить в {doc_names}: судьбу отделимых и неотделимых улучшений,
      необходимость согласия арендодателя и порядок компенсации.
    addressee: "Юридический советник"

  sublease_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли субаренда/перенаем,
      требуется ли согласие арендодателя и в какой форме оно дается.
    addressee: "Юридический советник"

  termination_and_return_check:
    text: >
      Просим уточнить в {doc_names}: основания досрочного расторжения,
      одностороннего отказа, порядок возврата имущества, акт возврата,
      а также механику возврата/удержания обеспечительного платежа.
    addressee: "Юридический советник"

  return_condition_of_asset:
    text: >
      Просим уточнить в {doc_names}: в каком состоянии объект должен быть возвращён,
      допускается ли нормальный износ, как фиксируется состояние при возврате.
    addressee: "Обе стороны"

  use_purpose_and_land_vri:
    text: >
      Просим уточнить в {doc_names}: назначение использования объекта,
      а для земли — ВРИ, категорию земель и допустимость использования
      под цели арендатора.
    addressee: "Арендодатель / Юридический советник"

  insurance_clause:
    text: >
      Просим уточнить в {doc_names}: требуется ли страхование имущества
      или ответственности, кто несет расходы и кто является выгодоприобретателем.
    addressee: "Юридический советник / Страховой консультант"

  penalty_late_payment:
    text: >
      Просим уточнить в {doc_names}: размер неустойки/пени за просрочку
      арендной платы, порядок начисления и соотношение с убытками.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и механизм разрешения споров.
    addressee: "Юридический советник"

  lessor_title_risk:
    text: >
      Внимание: по {doc_names} необходимо подтвердить титул арендодателя
      и его право на сдачу имущества в аренду. Просим предоставить title pack
      и правовое заключение по полномочиям арендодателя.
    addressee: "Арендодатель / Юридический советник"

  land_use_vri_compliance:
    text: >
      Внимание: по {doc_names} (земельный участок) необходимо подтвердить
      соответствие использования участков ВРИ и категории земель.
      Просим предоставить выписку ЕГРН и сведения о допустимом использовании.
    addressee: "Арендодатель / Земельный консультант"

  preemptive_right_and_renewal_check:
    text: >
      Просим уточнить в {doc_names}: преимущественное право арендатора
      на заключение нового договора (ст. 621 ГК РФ), порядок и сроки
      уведомления о продлении/отказе, условия пролонгации, последствия
      продолжения пользования после истечения срока.
    addressee: "Обе стороны / Юридический советник"

  preemptive_right_renewal:
    text: >
      Просим включить в {doc_names}: условие о преимущественном праве
      арендатора на заключение нового договора (ст. 621 ГК РФ),
      срок уведомления о продлении и порядок согласования новых условий.
    addressee: "Юридический советник"

  landlord_access_and_inspection_check:
    text: >
      Просим уточнить в {doc_names}: порядок доступа арендодателя в помещение —
      предварительное уведомление (за сколько дней), присутствие арендатора,
      допустимое время осмотра, ограничение частоты, экстренные ситуации.
    addressee: "Обе стороны"

  landlord_access_rights:
    text: >
      Просим включить в {doc_names}: регламент доступа арендодателя —
      предварительное уведомление, согласование времени, присутствие
      представителя арендатора, исключения для аварийных ситуаций.
    addressee: "Юридический советник"

  eleven_month_auto_renewal_registration_risk:
    text: >
      Внимание: {doc_names} содержит признаки «11-месячного трюка» — краткосрочный
      договор аренды недвижимости с автопродлением для обхода регистрации.
      При многократном продлении суд может квалифицировать отношения как
      долгосрочную аренду (п. 10 ИП ВАС РФ № 59). Просим дать правовое
      заключение по рискам и, при необходимости, зарегистрировать договор.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок и сроки уведомления, последствия для арендной платы
      и обязательств сторон, срок приостановки обязательств.
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names}: раздел о конфиденциальности условий аренды —
      перечень конфиденциальных сведений, срок неразглашения, исключения,
      ответственность за нарушение.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
