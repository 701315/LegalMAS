  - id: consumer_rights_notification_check
    name: "Уведомление о правах потребителя по Закону о защите прав потребителей"
    description: >
      Фактографическая проверка наличия в тексте договора информации
      о правах арендатора-потребителя по ЗоЗПП: право на отказ,
      право на качество, порядок возврата, контакты Роспотребнадзора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "Закон о защите прав потребителей"
        - "ЗоЗПП"
        - "право на отказ"
        - "право на качество"
        - "возврат товара"
        - "Роспотребнадзор"
        - "информация о потребителе"
        - "ст. 32 ЗоЗПП"
        - "ст. 8 ЗоЗПП"
        - "ст. 10 ЗоЗПП"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закон\\s+о\\s+защите\\s+прав\\s+потребител"
        - "(?i)зозпп"
        - "(?i)роспотребнадзор"
        - "(?i)ст\\.?\\s*32\\s*зо"
        - "(?i)ст\\.?\\s*(8|10)\\s*зо"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: информирование арендатора-потребителя
        о правах по Закону о защите прав потребителей.

        Нормативный ориентир:
        - ст. 8-10 ЗоЗПП — право на информацию
        - ст. 32 ЗоЗПП — право на отказ от договора
        - ст. 14.8 КоАП РФ — ответственность за нарушение прав потребителей

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - Отсутствие уведомления о правах потребителя = потенциальный
          штраф по ст. 14.8 КоАП РФ (до 500 000 руб. для юрлиц).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на ЗоЗПП.
        2. Есть ли информация о праве на отказ от договора.
        3. Есть ли информация о праве на качество услуги.
        4. Есть ли информация о порядке возврата/обмена.
        5. Есть ли контакты Роспотребнадзора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — права потребителя раскрыты:
        Фрагмент:
        "Договор регулируется Законом РФ «О защите прав потребителей».
        Арендатор вправе отказаться от договора в любое время (ст. 32 ЗоЗПП).
        Информация о правах потребителя предоставлена в соответствии
        со ст. 8-10 ЗоЗПП. Контакты Роспотребнадзора: 8-800-100-00-04."

        Ответ:
        {
          "zozpp_reference_status": "defined",
          "zozpp_reference_details": "Закон РФ «О защите прав потребителей»",
          "right_to_cancel_status": "defined",
          "right_to_cancel_details": "Арендатор вправе отказаться от договора в любое время (ст. 32 ЗоЗПП)",
          "quality_right_status": "defined",
          "quality_right_details": "Информация о правах потребителя предоставлена в соответствии со ст. 8-10 ЗоЗПП",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "rospotrebnadzor_contact_status": "defined",
          "rospotrebnadzor_contact_details": "8-800-100-00-04",
          "consumer_rights_summary": "Права раскрыты полностью",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Договор регулируется Законом РФ «О защите прав потребителей»."
            }
          ]
        }

        Пример 2 — права потребителя не раскрыты (типично для проката):
        Фрагмент:
        "Арендатор пользуется имуществом бережно."

        Ответ:
        {
          "zozpp_reference_status": "not_defined",
          "zozpp_reference_details": "Данные не определены",
          "right_to_cancel_status": "not_defined",
          "right_to_cancel_details": "Данные не определены",
          "quality_right_status": "not_defined",
          "quality_right_details": "Данные не определены",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "rospotrebnadzor_contact_status": "not_defined",
          "rospotrebnadzor_contact_details": "Данные не определены",
          "consumer_rights_summary": "Не раскрыты (риск штрафа по ст. 14.8 КоАП)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о ссылке на ЗоЗПП.
        2. Найди прямую цитату о праве на отказ.
        3. Найди прямую цитату о праве на качество.
        4. Найди прямую цитату о порядке возврата.
        5. Найди прямую цитату о контактах Роспотребнадзора.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "zozpp_reference_status": "<defined / not_defined>",
          "zozpp_reference_details": "<текст или 'Данные не определены'>",
          "right_to_cancel_status": "<defined / not_defined>",
          "right_to_cancel_details": "<текст или 'Данные не определены'>",
          "quality_right_status": "<defined / not_defined>",
          "quality_right_details": "<текст или 'Данные не определены'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "rospotrebnadzor_contact_status": "<defined / not_defined>",
          "rospotrebnadzor_contact_details": "<текст или 'Данные не определены'>",
          "consumer_rights_summary": "<'Права раскрыты полностью' / 'Права раскрыты частично' / 'Не раскрыты (риск штрафа по ст. 14.8 КоАП)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Закон о защите прав потребителей ЗоЗПП право на отказ право на качество возврат товара Роспотребнадзор ст. 32 ЗоЗПП ст. 8 ЗоЗПП ст. 10 ЗоЗПП информация о потребителе"
      preferred_unit_types:
        - general_provision
        - obligation
        - warranty
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - boilerplate
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката информацию
        о правах арендатора-потребителя по Закону о защите прав потребителей:
        ссылка на ЗоЗПП, право на отказ, право на качество, порядок возврата,
        контакты Роспотребнадзора.
        Не анализируй арендную плату, ремонт, возврат имущества или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей (все обязательны в ответе):

        1. zozpp_reference_status — "defined" если прямая ссылка на ЗоЗПП
           есть в тексте («Закон о защите прав потребителей», «ЗоЗПП»),
           иначе "not_defined".
        2. zozpp_reference_details — формулировка ссылки на ЗоЗПП.
           Если отсутствует — "Данные не определены".
        3. right_to_cancel_status — "defined" если право на отказ от договора
           прямо указано (ст. 32 ЗоЗПП), иначе "not_defined".
        4. right_to_cancel_details — формулировка о праве на отказ.
           Если отсутствует — "Данные не определены".
        5. quality_right_status — "defined" если право на качество услуги
           прямо указано (ст. 8-10 ЗоЗПП), иначе "not_defined".
        6. quality_right_details — формулировка о праве на качество.
           Если отсутствует — "Данные не определены".
        7. return_procedure_status — "defined" если порядок возврата/обмена
           для потребителя прямо описан, иначе "not_defined".
        8. return_procedure_details — формулировка о порядке возврата.
           Если отсутствует — "Данные не определены".
        9. rospotrebnadzor_contact_status — "defined" если контакты
           Роспотребнадзора прямо указаны, иначе "not_defined".
        10. rospotrebnadzor_contact_details — формулировка с контактами
            (телефон, сайт). Если отсутствует — "Данные не определены".
        11. consumer_rights_summary — краткий user-friendly вывод:
            - "Права раскрыты полностью" — если все 5 аспектов прямо раскрыты;
            - "Права раскрыты частично" — если раскрыты 2-4 аспекта из 5;
            - "Не раскрыты (риск штрафа по ст. 14.8 КоАП)" — если ни один
              аспект не раскрыт (для юрлиц штраф до 500 000 руб.);
            - "Данные не определены" — если договор не содержит данных
              о сторонах.

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ЗоЗПП)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - zozpp_reference_status = "defined" ТОЛЬКО если в тексте есть прямые
        слова: «Закон о защите прав потребителей», «ЗоЗПП», «законодательство
        о защите прав потребителей».
        - Отсутствие уведомления о правах потребителя не делает договор
        недействительным, но создаёт риск штрафа по ст. 14.8 КоАП РФ.
        - В договорах проката права потребителя часто не прописываются явно —
        это распространённая практика, но не соответствует требованиям ЗоЗПП.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о ЗоЗПП, правах потребителя,
          Роспотребнадзоре — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле, разделе «Общие положения» или «Заключительные положения».
        - Информация о правах потребителя обычно в начале или конце договора.
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 11 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "zozpp_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ЗоЗПП."
          required: true
          display_in_grid: false
        - name: "zozpp_reference_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка ссылки на ЗоЗПП (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "right_to_cancel_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на отказ."
          required: true
          display_in_grid: false
        - name: "right_to_cancel_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о праве на отказ (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "quality_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на качество."
          required: true
          display_in_grid: false
        - name: "quality_right_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о праве на качество (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата."
          required: true
          display_in_grid: false
        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке возврата (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "rospotrebnadzor_contact_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус контактов Роспотребнадзора."
          required: true
          display_in_grid: false
        - name: "rospotrebnadzor_contact_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка с контактами Роспотребнадзора (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "consumer_rights_summary"
          type: "string"
          presentation: "fact"
          label: "Права потребителя (ЗоЗПП)"
          description: "Компактный статус информирования арендатора-потребителя о правах по ЗоЗПП."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: кто выступает профессиональным арендодателем,
      на каком основании он осуществляет деятельность по прокату, а также реквизиты арендатора.
    addressee: "Арендодатель / Юридический советник"

  rental_subject_and_consumer_purpose_extraction:
    text: >
      Просим предоставить по {doc_names}: описание предмета проката, срок,
      твердую стоимость проката, наличие залога/депозита и подтверждение,
      что использование имеет бытовой/потребительский характер.
    addressee: "Арендодатель"

  consumer_purpose_declaration:
    text: >
      Просим уточнить в {doc_names}, что имущество предоставляется именно
      для личных, семейных, бытовых нужд, а не для предпринимательской деятельности.
    addressee: "Юридический советник"

  movable_property_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный/инвентарный номер,
      комплектность и состояние имущества на момент выдачи.
    addressee: "Арендодатель"

  fixed_rent_payment:
    text: >
      Просим подтвердить в {doc_names}: размер платы в твердой сумме,
      единицу тарификации (час/сутки/день), порядок оплаты и возврата части платы
      при досрочном возврате.
    addressee: "Арендодатель / Финансовый консультант"

  term_limitation_one_year:
    text: >
      Просим уточнить в {doc_names}: срок проката и подтвердить,
      что он не выходит за пределы специального режима договора проката.
    addressee: "Юридический советник"

  public_contract_status_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор публичным,
      применяются ли единые условия для всех потребителей и в какой форме
      опубликована оферта/типовые условия.
    addressee: "Юридический советник"

  public_contract_declaration:
    text: >
      Просим включить в {doc_names} прямое указание на публичный характер договора
      и единые условия для всех обратившихся потребителей.
    addressee: "Юридический советник арендодателя"

  unilateral_termination_consumer_check:
    text: >
      Просим уточнить в {doc_names}: право арендатора на отказ в любое время,
      порядок уведомления, перерасчет платы и возврат денежных средств
      за неиспользованный период.
    addressee: "Юридический советник"

  fitness_and_instruction_check:
    text: >
      Просим предоставить по {doc_names}: порядок проверки исправности имущества,
      форму подтверждения инструктажа, правила эксплуатации и safety rules.
    addressee: "Арендодатель"

  fitness_warranty_and_safety_briefing:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность арендодателя
      проверить исправность имущества, провести инструктаж и ознакомить
      арендатора с правилами эксплуатации и техники безопасности.
    addressee: "Юридический советник арендодателя"

  repairs_obligation_check:
    text: >
      Просим уточнить в {doc_names}: что капитальный и текущий ремонт,
      а также устранение недостатков и замена неисправного имущества
      осуществляются за счет арендодателя.
    addressee: "Юридический советник"

  all_repairs_by_lessor:
    text: >
      Просим привести в {doc_names} блок ремонта в соответствие со ст. 631 ГК РФ
      и исключить возложение ремонтных обязанностей на арендатора.
    addressee: "Юридический советник арендодателя"

  sublease_and_personal_use_check:
    text: >
      Просим уточнить в {doc_names}: запрет субаренды, передачи вещи третьим лицам
      и подтверждение личного характера использования имущества.
    addressee: "Юридический советник"

  absolute_prohibition_of_sublease:
    text: >
      Просим включить в {doc_names} прямой запрет субаренды, перенаема
      и передачи имущества третьим лицам.
    addressee: "Юридический советник арендодателя"

  deposit_and_damage_liability_check:
    text: >
      Просим уточнить в {doc_names}: режим депозита/залога, основания удержания,
      порядок возврата, ответственность за утрату/повреждение и исключение
      нормального износа из зоны ответственности арендатора.
    addressee: "Арендодатель / Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита, основание его удержания,
      сроки возврата и порядок документального подтверждения повреждений.
    addressee: "Юридический советник"

  clear_liability_for_damage:
    text: >
      Просим уточнить в {doc_names}: как определяется размер ответственности
      арендатора за повреждение или утрату имущества (ремонт / полная стоимость / market value).
    addressee: "Юридический советник"

  normal_wear_and_tear_exclusion:
    text: >
      Просим включить в {doc_names} прямое указание, что арендатор не отвечает
      за нормальный (естественный) износ имущества при надлежащем использовании.
    addressee: "Юридический советник"

  consumer_law_application:
    text: >
      Просим уточнить в {doc_names}: применение Закона о защите прав потребителей,
      исключить unfair terms и раскрыть все дополнительные платные услуги
      (страховка, допоборудование, комиссии).
    addressee: "Юридический советник / Compliance"

  breakdown_emergency_procedure_check:
    text: >
      Просим уточнить в {doc_names}: порядок действий при поломке,
      экстренный контакт, запрет на самостоятельный ремонт и порядок замены вещи.
    addressee: "Арендодатель / Юридический советник"

  breakdown_emergency_procedure:
    text: >
      Просим включить в {doc_names}: emergency procedure на случай поломки
      или аварийной ситуации, включая обязанность немедленного уведомления арендодателя.
    addressee: "Юридический советник арендодателя"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      а также consumer-specific forum aspects, если применимо.
    addressee: "Юридический советник"

  commercial_use_reclassification_risk:
    text: >
      Внимание: {doc_names} содержит признаки использования имущества
      для предпринимательских целей. Просим проверить корректность квалификации
      договора и, при необходимости, перевести документ в режим общей аренды.
    addressee: "Юридический советник"

  term_over_one_year_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить, не превышает ли срок проката
      пределы специального режима договора проката. Просим дать квалификационное заключение.
    addressee: "Юридический советник"

  consumer_law_mandatory_context:
    text: >
      Внимание: {doc_names} подпадает под consumer-law контекст.
      Просим проверить текст на unfair terms, навязывание дополнительных услуг,
      ограничения права на отказ и возврат денежных средств.
    addressee: "Юридический советник / Compliance"

  return_procedure_and_condition_check:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета проката —
      допустимое состояние (нормальный износ vs повреждения), метод оценки
      (сравнение с актом выдачи, фото), комплектность, место и время возврата,
      штрафы за просрочку, порядок удержания из депозита.
    addressee: "Арендодатель / Юридический советник"

  return_conditions_and_penalties:
    text: >
      В {doc_names} не урегулированы условия возврата имущества. Просим включить:
      порядок приёмки при возврате, стандарт допустимого состояния, санкции
      за просрочку (неустойка за каждый день/час), место возврата, порядок
      фиксации повреждений.
    addressee: "Юридический советник арендодателя"

  issuance_act_receipt:
    text: >
      Просим включить в {doc_names}: акт выдачи / квитанцию с фиксацией
      состояния имущества, комплектности и внешнего вида при передаче арендатору.
      Это необходимо для объективного сравнения при возврате.
    addressee: "Юридический советник арендодателя"

  personal_data_consent:
    text: >
      Просим включить в {doc_names}: согласие арендатора на обработку
      персональных данных (ФЗ-152), цели обработки, перечень данных,
      сроки хранения и порядок отзыва согласия.
    addressee: "Юридический советник / Compliance"

  age_restrictions:
    text: >
      Просим уточнить в {doc_names}: возрастные ограничения для арендатора,
      порядок проверки возраста, необходимость согласия законных представителей
      для несовершеннолетних (если допускается).
    addressee: "Юридический советник арендодателя"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
