  - id: rental_max_term_check
    name: "Максимальный срок проката и соответствие ст. 627 ГК РФ"
    description: >
      Фактографическая проверка наличия в тексте срока проката, его соответствия
      максимальному пределу в 1 год (ст. 627 ГК РФ), а также указания
      на невозможность возобновления на неопределённый срок и отсутствие
      преимущественного права арендатора на заключение нового договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок проката"
        - "срок аренды"
        - "не более одного года"
        - "не более 12 месяцев"
        - "максимальный срок"
        - "возобновление"
        - "на неопределённый срок"
        - "преимущественное право"
        - "ст. 627"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+(проката|аренды)"
        - "(?i)не\\s+более\\s+(одного\\s+года|12\\s+месяцев|1\\s+года)"
        - "(?i)на\\s+неопределённый\\s+срок"
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)ст(?:атья|\\.)?\\s*627"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: срок проката и его соответствие
        императивным ограничениям ст. 627 ГК РФ.

        Нормативный ориентир:
        - ст. 627 ГК РФ:
          - срок проката не может превышать одного года
          - правила о возобновлении на неопределённый срок не применяются
          - арендатор не имеет преимущественного права на заключение нового договора

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой срок проката установлен (конкретная цифра/период).
        2. Есть ли прямая ссылка на максимальный предел в 1 год.
        3. Есть ли условие о возобновлении / пролонгации договора.
        4. Есть ли упоминание преимущественного права арендатора (предоставлено или исключено).
        5. Есть ли прямая ссылка на ст. 627 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок указан, ограничения ст. 627 ГК раскрыты:
        Фрагмент:
        "Срок проката составляет 30 суток с даты подписания акта выдачи.
        В соответствии со ст. 627 ГК РФ преимущественное право арендатора
        на заключение нового договора не применяется. Договор не подлежит
        автоматическому возобновлению на неопределённый срок."

        Ответ:
        {
          "rental_term_status": "defined",
          "rental_term_details": "30 суток с даты подписания акта выдачи",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "defined",
          "renewal_clause_details": "договор не подлежит автоматическому возобновлению на неопределённый срок",
          "renewal_excluded_display": "Исключена (ст. 627 ГК)",
          "preemptive_right_status": "defined",
          "preemptive_right_details": "преимущественное право арендатора на заключение нового договора не применяется",
          "preemptive_right_excluded_display": "Исключено (ст. 627 ГК)",
          "st627_reference_status": "defined",
          "st627_reference_details": "ст. 627 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Срок проката составляет 30 суток с даты подписания акта выдачи."
            },
            {
              "clause_ref": "п. 2.3",
              "quote": "В соответствии со ст. 627 ГК РФ преимущественное право арендатора на заключение нового договора не применяется."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "rental_term_status": "not_defined",
          "rental_term_details": "Данные не определены",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "not_defined",
          "renewal_clause_details": "Данные не определены",
          "renewal_excluded_display": "Данные не определены",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "preemptive_right_excluded_display": "Данные не определены",
          "st627_reference_status": "not_defined",
          "st627_reference_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — срок указан, но ст. 627 ГК не раскрыта (типичная ситуация):
        Фрагмент:
        "Срок проката составляет 6 месяцев. По истечении срока договор
        прекращается автоматически."

        Ответ:
        {
          "rental_term_status": "defined",
          "rental_term_details": "6 месяцев",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "defined",
          "renewal_clause_details": "по истечении срока договор прекращается автоматически",
          "renewal_excluded_display": "Исключена (автоматическое прекращение)",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "preemptive_right_excluded_display": "Не упомянуто",
          "st627_reference_status": "not_defined",
          "st627_reference_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Срок проката составляет 6 месяцев. По истечении срока договор прекращается автоматически."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке проката.
        2. Найди прямую цитату о максимальном пределе в 1 год.
        3. Найди прямую цитату о возобновлении / пролонгации.
        4. Найди прямую цитату о преимущественном праве.
        5. Найди прямую ссылку на ст. 627 ГК РФ.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rental_term_status": "<defined / not_defined>",
          "rental_term_details": "<текст или 'Данные не определены'>",
          "max_term_reference_status": "<defined / not_defined>",
          "max_term_reference_details": "<текст или 'Данные не определены'>",
          "renewal_clause_status": "<defined / not_defined>",
          "renewal_clause_details": "<текст или 'Данные не определены'>",
          "renewal_excluded_display": "<'Исключена (ст. 627 ГК)' / 'Исключена (автоматическое прекращение)' / 'Предусмотрена' / 'Не упомянуто' / 'Данные не определены'>",
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Данные не определены'>",
          "preemptive_right_excluded_display": "<'Исключено (ст. 627 ГК)' / 'Предусмотрено' / 'Не упомянуто' / 'Данные не определены'>",
          "st627_reference_status": "<defined / not_defined>",
          "st627_reference_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок проката срок аренды не более одного года не более 12 месяцев максимальный срок возобновление на неопределённый срок преимущественное право ст. 627"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "депозит"
        - "возврат имущества"
        - "субаренда"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката срок проката,
        ссылку на максимальный предел, условия возобновления / пролонгации,
        преимущественное право и ссылку на ст. 627 ГК РФ.
        Не анализируй арендную плату, ремонт, депозит или возврат имущества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей (все обязательны в ответе):

        1. rental_term_status — "defined" если срок проката прямо указан
           (конкретная цифра/период), иначе "not_defined".
        2. rental_term_details — срок проката из текста договора.
           Если отсутствует — "Данные не определены".
        3. max_term_reference_status — "defined" если прямая ссылка на
           максимальный предел в 1 год есть в тексте, иначе "not_defined".
        4. max_term_reference_details — формулировка о максимальном пределе.
           Если отсутствует — "Данные не определены".
        5. renewal_clause_status — "defined" если условие о возобновлении /
           пролонгации / автоматическом прекращении прямо указано, иначе "not_defined".
        6. renewal_clause_details — формулировка о возобновлении / прекращении.
           Если отсутствует — "Данные не определены".
        7. renewal_excluded_display — краткий user-friendly статус:
           - "Исключена (ст. 627 ГК)" — если прямо указано, что возобновление
             на неопределённый срок не применяется / исключено со ссылкой на ст. 627 ГК;
           - "Исключена (автоматическое прекращение)" — если указано, что договор
             прекращается автоматически по истечении срока;
           - "Предусмотрена" — если есть условие о пролонгации / возобновлении;
           - "Не упомянуто" — если вопрос не урегулирован, но срок указан;
           - "Данные не определены" — если срок вообще не указан.
        8. preemptive_right_status — "defined" если преимущественное право
           прямо упомянуто (предоставлено или исключено), иначе "not_defined".
        9. preemptive_right_details — формулировка о преимущественном праве.
           Если отсутствует — "Данные не определены".
        10. preemptive_right_excluded_display — краткий user-friendly статус:
            - "Исключено (ст. 627 ГК)" — если прямо указано, что преимущественное
              право не применяется со ссылкой на ст. 627 ГК;
            - "Исключено" — если указано, что арендатор не имеет преимущественного
              права без ссылки на статью;
            - "Предусмотрено" — если преимущественное право предоставлено;
            - "Не упомянуто" — если вопрос не урегулирован, но срок указан;
            - "Данные не определены" — если срок вообще не указан.
        11. st627_reference_status — "defined" если прямая ссылка на ст. 627 ГК РФ
            есть в тексте, иначе "not_defined".
        12. st627_reference_details — формулировка ссылки на ст. 627 ГК РФ.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ст. 627 ГК РФ)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - max_term_reference_status = "defined" ТОЛЬКО если в тексте есть прямые
        слова: «не более одного года», «не более 12 месяцев», «максимальный
        срок проката — 1 год» и т.п.
        - renewal_clause_status = "defined" также если указано, что договор
        «прекращается автоматически» по истечении срока — это форма регулирования
        вопроса о возобновлении.
        - Не выводи ограничение срока из ст. 627 ГК РФ — фиксируй только то,
        что написано в тексте договора.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о сроке, возобновлении,
          преимущественном праве или ссылке на ст. 627 ГК — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Срок договора» или «Заключительные положения».
        - Срок проката обычно указывается в преамбуле или разделе «Предмет и срок».
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 12 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "rental_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока проката."
          required: true
          display_in_grid: false
        - name: "rental_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок проката"
          description: "Конкретный срок проката, указанный в договоре (дни, месяцы, годы)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "max_term_reference_status"
