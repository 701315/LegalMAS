        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой предмет проката указан (описание, марка, модель).
        2. Какой тип предмета проката.
        3. Есть ли индивидуализирующие признаки предмета.
