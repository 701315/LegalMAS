        - "ремонт"
        - "депозит"
        - "субаренда"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
