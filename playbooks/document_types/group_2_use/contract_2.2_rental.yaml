  - id: rental_subject_and_consumer_purpose_extraction
    name: "Предмет проката, срок, плата и потребительская цель использования"
    description: >
      Фактографическая проверка наличия в договоре проката описания предмета,
      срока проката, размера платы, потребительской цели использования
      и обеспечительного платежа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "прокат"
        - "предмет проката"
        - "бытовые нужды"
        - "потребительские цели"
        - "арендная плата"
        - "срок проката"
        - "марка"
        - "модель"
        - "серийный номер"
        - "залог"
        - "обеспечительный платеж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
        - "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется один вопрос: предмет проката, срок, плата,
        потребительская цель использования и обеспечительный платёж.

        Нормативный ориентир:
        - ст. 626 ГК РФ — предмет проката, потребительская цель
        - ст. 627 ГК РФ — срок проката не более одного года
        - ст. 630 ГК РФ — арендная плата в виде определённых в твёрдой сумме платежей

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой предмет проката указан (описание, марка, модель).
        2. Какой тип предмета проката.
        3. Есть ли индивидуализирующие признаки предмета (серийный номер, IMEI, VIN).
        4. Есть ли указание на потребительскую цель использования.
        5. Какой срок проката установлен.
        6. Какой размер платы за прокат.
        7. Есть ли обеспечительный платёж / залог / депозит.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай статус "not_defined".
        3. Для текстовых полей (*_value, *_details, *_display) не используй
           "None", "null" или пустые строки — возвращай "Данные не определены".
        4. Для статусов и enum-полей допустимо значение "not_defined".
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все данные определены:
        Фрагмент:
        "Арендодатель передаёт Арендатору во временное пользование
        для бытовых нужд электросамокат Xiaomi Mi Pro 2, серийный номер
        SN12345678, сроком на 3 суток. Арендная плата — 500 рублей в сутки.
        Обеспечительный платёж — 5 000 рублей, возвращается при возврате
        имущества в исправном состоянии."

        Ответ:
        {
          "rental_item_status": "defined",
          "rental_item_value": "электросамокат Xiaomi Mi Pro 2",
          "item_type": "scooter",
          "item_type_display": "Электросамокат",
          "identifying_features_status": "defined",
          "identifying_features_value": "SN12345678",
          "consumer_purpose_status": "defined",
          "consumer_purpose_details": "для бытовых нужд",
          "rental_term_status": "defined",
          "rental_term_value": "3 суток",
          "rental_fee_status": "defined",
          "rental_fee_value": "500 рублей в сутки",
          "deposit_status": "defined",
          "deposit_details": "5 000 рублей, возвращается при возврате имущества в исправном состоянии",
          "deposit_display": "5 000 ₽",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт Арендатору во временное пользование для бытовых нужд электросамокат Xiaomi Mi Pro 2, серийный номер SN12345678, сроком на 3 суток."
            },
            {
              "clause_ref": "п. 3.1",
              "quote": "Арендная плата — 500 рублей в сутки."
            },
            {
              "clause_ref": "п. 3.3",
              "quote": "Обеспечительный платёж — 5 000 рублей, возвращается при возврате имущества в исправном состоянии."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "rental_item_status": "not_defined",
          "rental_item_value": "Данные не определены",
          "item_type": "not_defined",
          "item_type_display": "Данные не определены",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Данные не определены",
          "consumer_purpose_status": "not_defined",
          "consumer_purpose_details": "Данные не определены",
          "rental_term_status": "not_defined",
          "rental_term_value": "Данные не определены",
          "rental_fee_status": "not_defined",
          "rental_fee_value": "Данные не определены",
          "deposit_status": "not_defined",
          "deposit_details": "Данные не определены",
          "deposit_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием предмета проката.
        2. Найди прямую цитату о потребительской цели.
        3. Найди прямую цитату о сроке проката.
        4. Найди прямую цитату о размере платы.
        5. Найди прямую цитату о залоге / депозите / обеспечительном платеже.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rental_item_status": "<defined / not_defined>",
          "rental_item_value": "<текст или 'Данные не определены'>",
          "item_type": "<equipment / tool / scooter / bicycle / costume / consumer_item / other / not_defined>",
          "item_type_display": "<'Оборудование' / 'Инструмент' / 'Электросамокат' / 'Велосипед' / 'Одежда/костюм' / 'Бытовой предмет' / 'Иное' / 'Данные не определены'>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<серийный номер / IMEI / VIN или 'Данные не определены'>",
          "consumer_purpose_status": "<defined / not_defined>",
          "consumer_purpose_details": "<текст или 'Данные не определены'>",
          "rental_term_status": "<defined / not_defined>",
          "rental_term_value": "<текст или 'Данные не определены'>",
          "rental_fee_status": "<defined / not_defined>",
          "rental_fee_value": "<текст или 'Данные не определены'>",
          "deposit_status": "<defined / not_defined>",
          "deposit_details": "<текст или 'Данные не определены'>",
          "deposit_display": "<краткая сумма или 'Не предусмотрен' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "rent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прокат предмет проката бытовые нужды потребительские цели арендная плата срок проката марка модель серийный номер залог обеспечительный платёж депозит"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "ремонт"
        - "субаренда"
        - "возврат имущества"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката предмет,
        его тип и идентифицирующие признаки, срок, плату, потребительскую
        цель использования и обеспечительный платёж (залог, депозит).
        Не анализируй ремонт, возврат, субаренду, споры или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 15 полей (все обязательны в ответе):

        1. rental_item_status — "defined" если предмет проката прямо описан,
           иначе "not_defined".
        2. rental_item_value — описание предмета проката (наименование, марка,
           модель). Если отсутствует — "Данные не определены".
        3. item_type — "equipment" / "tool" / "scooter" / "bicycle" / "costume" /
           "consumer_item" / "other" / "not_defined".
        4. item_type_display — user-friendly формулировка типа предмета:
           - "Оборудование" — если item_type = "equipment"
           - "Инструмент" — если item_type = "tool"
           - "Электросамокат" — если item_type = "scooter"
           - "Велосипед" — если item_type = "bicycle"
           - "Одежда/костюм" — если item_type = "costume"
           - "Бытовой предмет" — если item_type = "consumer_item"
           - "Иное" — если item_type = "other"
           - "Данные не определены" — если item_type = "not_defined"
        5. identifying_features_status — "defined" если индивидуализирующие
           признаки прямо указаны, иначе "not_defined".
        6. identifying_features_value — серийный номер, IMEI, VIN, инвентарный
           номер и т.п. Если отсутствуют — "Данные не определены".
        7. consumer_purpose_status — "defined" если потребительская цель прямо
           указана, иначе "not_defined".
        8. consumer_purpose_details — формулировка о потребительской / бытовой
           цели из текста договора. Если отсутствует — "Данные не определены".
        9. rental_term_status — "defined" если срок прямо указан,
           иначе "not_defined".
        10. rental_term_value — срок проката (например, "3 суток", "11 месяцев").
            Если отсутствует — "Данные не определены".
        11. rental_fee_status — "defined" если плата прямо указана,
            иначе "not_defined".
        12. rental_fee_value — размер и периодичность платы за прокат
            (например, "500 рублей в сутки"). Если отсутствует —
            "Данные не определены".
        13. deposit_status — "defined" если залог / депозит / обеспечительный
            платёж прямо предусмотрен, иначе "not_defined".
        14. deposit_details — размер и условия залога / депозита из текста
            договора. Если отсутствует — "Данные не определены".
        15. deposit_display — краткое user-friendly значение:
            - "<сумма> ₽" — если обеспечительный платёж указан
              (например, "5 000 ₽")
            - "Не предусмотрен" — если в договоре прямо указано, что
              залог/депозит не требуется
            - "Данные не определены" — если вопрос не урегулирован

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона вместо
        текста договора.
        - Не оценивай риски, не давай юридических выводов.
        - item_type:
        - "equipment" — оборудование, техника (фотоаппарат, проектор и т.п.).
        - "tool" — инструмент (дрель, перфоратор и т.п.).
        - "scooter" — самокат, электросамокат, гироскутер.
        - "bicycle" — велосипед.
        - "costume" — костюм, одежда, карнавальный наряд.
        - "consumer_item" — иной бытовой предмет (коляска, палатка и т.п.).
        - "other" — иной объект, не подходящий под категории выше.
        - "not_defined" — тип не определён из текста.
        - consumer_purpose_status = "defined" только если потребительская /
        бытовая / личная цель прямо указана в тексте договора. Отсутствие
        указания ≠ "defined".
        - deposit_display: извлекай только числовую сумму. Не копируй длинные
        условия возврата — они остаются в deposit_details.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о предмете, сроке, плате,
          цели использования или залоге — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Предмет договора» или «Порядок расчётов».
        - Не смешивай данные о предмете проката с данными о залоге.
        - Если плата определена по прайс-листу / тарифам / приложению —
          укажи это в rental_fee_value (например, "Согласно Приложению №1").
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 15 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов/enum и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

