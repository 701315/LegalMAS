  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Недопустимые потребительские условия
  # ──────────────────────────────────────────────────────────────────────────
  - id: unfair_consumer_clauses_check
    name: "Недопустимые потребительские условия в договоре проката"
    description: >
      Фактографическая проверка наличия в тексте формулировок, которые могут
      ограничивать законные права арендатора-потребителя: невозвратность платы,
      blanket disclaimer ответственности арендодателя, запрет отказа от договора,
      несоразмерные штрафы, навязанные удержания, отказ от законных гарантий.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "деньги не возвращаются"
        - "оплата не подлежит возврату"
        - "минимальный срок аренды обязателен"
        - "арендодатель не несет ответственности"
        - "арендодатель освобождается от ответственности"
        - "штраф"
        - "безусловное удержание"
        - "арендатор отказывается от претензий"
        - "арендатор принимает на себя все риски"
        - "гарантии не предоставляются"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)деньги\\s+не\\s+возвращ"
        - "(?i)оплата\\s+не\\s+подлежит\\s+возврат"
        - "(?i)арендодатель.*не\\s+нес[её]т\\s+ответственност"
        - "(?i)арендодатель.*освобожда(ется|ют)\\s+от\\s+ответственност"
        - "(?i)арендатор.*отказыва(ется|ют)\\s+от\\s+претензи"
        - "(?i)арендатор.*принима(ет|ют)\\s+на\\s+себя\\s+все\\s+риск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: есть ли в тексте формулировки,
        которые могут ограничивать законные права арендатора-потребителя.

        Нормативный ориентир:
        - ст. 16 Закона о защите прав потребителей — недействительность условий,
          ущемляющих права потребителя
        - ст. 627 ГК РФ — право арендатора на отказ в любое время
        - ст. 631 ГК РФ — ремонт за счёт арендодателя

        Важно:
        - Не делай самостоятельный юридический вывод о недействительности.
        - Фиксируй только наличие или отсутствие конкретных формулировок.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли формулировка о невозвратности платы ни при каких условиях.
        2. Есть ли blanket disclaimer ответственности арендодателя.
