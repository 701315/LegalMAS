          required: false
      store_payload: true

  - id: return_procedure_and_condition_check
    name: "Возврат предмета проката: состояние, акт, комплектность, штрафы за просрочку"
    description: >
      Фактографическая проверка порядка возврата предмета проката: акт возврата,
      допустимое состояние, нормальный износ, комплектность, место возврата,
      штрафы за просрочку возврата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат имущества"
        - "акт возврата"
        - "акт приёма-передачи"
        - "состояние при возврате"
        - "нормальный износ"
        - "естественный износ"
        - "повреждения при возврате"
        - "просрочка возврата"
        - "штраф за невозврат"
        - "комплектность"
        - "удержание из депозита"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+имуществ"
        - "(?i)акт\\s+(возврат|приёма-передачи|сдачи-приёмки)"
        - "(?i)просрочк(а|и)\\s+возврат"
        - "(?i)штраф.*невозврат"
        - "(?i)комплектност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: порядок возврата предмета проката
        арендодателю по окончании срока проката.

        Нормативный ориентир:
        - ст. 622 ГК РФ — возврат арендованного имущества в том состоянии,
          в котором арендатор его получил, с учётом нормального износа

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок возврата предмета проката (сроки, процедура).
        2. Есть ли требование об оформлении акта возврата.
        3. Как определяется допустимое состояние при возврате.
        4. Исключён ли нормальный (естественный) износ из оснований для удержаний.
        5. Есть ли проверка комплектности при возврате.
        6. Указано ли место возврата имущества.
        7. Есть ли штрафы / пени за просрочку возврата и их размер.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — возврат урегулирован полностью:
        Фрагмент:
        "Арендатор обязан вернуть предмет проката по акту возврата в том же
        пункте проката, где он был получен, в течение 24 часов после окончания
        срока проката. Состояние оценивается путём сравнения с актом выдачи.
        Нормальный износ не является основанием для удержания из депозита.
        Комплектность проверяется при возврате. За просрочку возврата —
        пени 500 рублей в день."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "вернуть предмет проката по акту возврата в течение 24 часов после окончания срока",
          "return_act_status": "defined",
          "return_act_details": "по акту возврата",
          "condition_assessment_status": "defined",
          "condition_assessment_details": "состояние оценивается путём сравнения с актом выдачи",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "нормальный износ не является основанием для удержания из депозита",
          "completeness_check_status": "defined",
          "completeness_check_details": "комплектность проверяется при возврате",
          "return_location_status": "defined",
          "return_location_details": "в том же пункте проката, где он был получен",
          "late_return_penalty_status": "defined",
          "late_return_penalty_details": "пени 500 рублей в день",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Арендатор обязан вернуть предмет проката по акту возврата в том же пункте проката, где он был получен, в течение 24 часов после окончания срока проката."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "По окончании срока имущество подлежит возврату."

        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "return_act_status": "not_defined",
          "return_act_details": "Данные не определены",
          "condition_assessment_status": "not_defined",
          "condition_assessment_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "completeness_check_status": "not_defined",
          "completeness_check_details": "Данные не определены",
          "return_location_status": "not_defined",
          "return_location_details": "Данные не определены",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке возврата (сроки, процедура).
        2. Найди прямую цитату об акте возврата / приёма-передачи.
        3. Найди прямую цитату о способе оценки состояния.
        4. Найди прямую цитату о нормальном износе.
        5. Найди прямую цитату о комплектности.
        6. Найди прямую цитату о месте возврата.
        7. Найди прямую цитату о штрафах / пенях за просрочку.
        8. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "return_act_status": "<defined / not_defined>",
          "return_act_details": "<текст или 'Данные не определены'>",
          "condition_assessment_status": "<defined / not_defined>",
          "condition_assessment_details": "<текст или 'Данные не определены'>",
          "normal_wear_excluded_status": "<defined / not_defined>",
          "normal_wear_excluded_details": "<текст или 'Данные не определены'>",
          "completeness_check_status": "<defined / not_defined>",
          "completeness_check_details": "<текст или 'Данные не определены'>",
          "return_location_status": "<defined / not_defined>",
          "return_location_details": "<текст или 'Данные не определены'>",
          "late_return_penalty_status": "<defined / not_defined>",
          "late_return_penalty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат имущества акт возврата акт приёма-передачи оценка состояния нормальный износ естественный износ комплектность место возврата просрочка возврата штраф пени за невозврат"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.18
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "return_procedure_and_condition_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката порядок возврата
        предмета: акт возврата, состояние, нормальный износ, комплектность,
        место возврата и штрафы за просрочку.
        Не анализируй регулярную арендную плату, ремонт, субаренду или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. return_procedure_and_condition_check_presence:
           Агрегатное signal-поле — наличие регулирования по порядку возврата
           предмета проката.
           - "present" — если хотя бы одно из содержательных полей
             (return_procedure_status, return_act_status,
              condition_assessment_status, normal_wear_excluded_status,
              completeness_check_status, return_location_status,
              late_return_penalty_status) = "defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - return_procedure_status = "not_defined";
           - return_procedure_details = "Данные не определены";
           - return_act_status = "not_defined";
           - return_act_details = "Данные не определены";
           - condition_assessment_status = "not_defined";
           - condition_assessment_details = "Данные не определены";
           - normal_wear_excluded_status = "not_defined";
           - normal_wear_excluded_details = "Данные не определены";
           - completeness_check_status = "not_defined";
           - completeness_check_details = "Данные не определены";
           - return_location_status = "not_defined";
           - return_location_details = "Данные не определены";
           - late_return_penalty_status = "not_defined";
           - late_return_penalty_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. return_procedure_status — "defined" если порядок возврата прямо описан
           (сроки, процедура), иначе "not_defined".
        2. return_procedure_details — формулировка о порядке возврата.
           Если отсутствует — "Данные не определены".
        3. return_act_status — "defined" если акт возврата прямо предусмотрен,
           иначе "not_defined".
        4. return_act_details — формулировка об акте (может называться «акт возврата»,
           «акт приёма-передачи», «акт сдачи-приёмки», «квитанция возврата»).
           Если отсутствует — "Данные не определены".
        5. condition_assessment_status — "defined" если способ оценки состояния
           при возврате прямо описан, иначе "not_defined".
        6. condition_assessment_details — формулировка об оценке состояния
           (например, «сравнение с актом выдачи»).
           Если отсутствует — "Данные не определены".
        7. normal_wear_excluded_status — "defined" если нормальный (естественный)
           износ прямо исключён из оснований для удержаний, иначе "not_defined".
        8. normal_wear_excluded_details — формулировка об исключении износа.
           Если отсутствует — "Данные не определены".
        9. completeness_check_status — "defined" если проверка комплектности
           при возврате прямо предусмотрена, иначе "not_defined".
        10. completeness_check_details — формулировка о проверке комплектности.
            Если отсутствует — "Данные не определены".
        11. return_location_status — "defined" если место возврата прямо указано,
            иначе "not_defined".
        12. return_location_details — формулировка о месте возврата
            (например, «тот же пункт проката», «курьером», «почтой»).
            Если отсутствует — "Данные не определены".
        13. late_return_penalty_status — "defined" если штраф / пени за просрочку
            возврата прямо предусмотрены, иначе "not_defined".
        14. late_return_penalty_details — формулировка и размер штрафа / пени.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни return_procedure_and_condition_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 622 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - normal_wear_excluded_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова: «нормальный износ», «естественный износ», «с учётом износа»,
          «износ не возмещается».
        - Акт возврата может называться по-разному: «акт возврата», «акт приёма-передачи»,
          «акт сдачи-приёмки», «квитанция», «расписка». Фиксируй любое название.
        - Если фрагмент контекста не содержит данных о возврате имущества, акте,
          состоянии, комплектности, месте возврата или штрафах за просрочку — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Порядок возврата имущества» или «Завершение договора проката».
        - Условия о возврате могут находиться в конце договора (раздел «Заключительные
          положения») или в разделе «Обязанности Арендатора». Анализируй оба блока.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка возврата, ни акта, ни способа оценки
           состояния, ни оговорки об износе, ни комплектности, ни места
           возврата, ни штрафов за просрочку.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано, что имущество возвращается по акту, но без сроков,
           без способа оценки состояния, без комплектности, без места
           и без штрафов.
           → presence = "present";
             return_act_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что нормальный износ не является основанием
           для удержаний, в другом — что любые следы использования влекут
           удержание из депозита, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             normal_wear_excluded_status = "not_defined";
             normal_wear_excluded_details = "Не удалось определить".

        4. Специфика темы: штраф за просрочку возврата (red flag для потребителя).
           В тексте прямо предусмотрен штраф или пени за просрочку возврата
           имущества, при этом их размер несоразмерно высок либо не ограничен
           (например, «штраф 100% стоимости за каждый день просрочки»).
           → presence = "present";
             late_return_penalty_status = "defined";
             late_return_penalty_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для return_procedure_and_condition_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * return_procedure_details → "Данные не определены";
          * return_act_details → "Данные не определены";
          * condition_assessment_details → "Данные не определены";
          * normal_wear_excluded_details → "Данные не определены";
          * completeness_check_details → "Данные не определены";
          * return_location_details → "Данные не определены";
          * late_return_penalty_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "return_procedure_and_condition_check_presence"
