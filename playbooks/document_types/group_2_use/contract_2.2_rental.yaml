          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,5% в день от суммы долга",
          "tenant_breach_penalty_status": "defined",
          "tenant_breach_penalty_details": "штраф в размере полной стоимости за повреждение",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Арендодателя ограничена размером полученной арендной платы",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "За просрочку оплаты — пени 0,5% в день от суммы долга."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Данные не определены",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку.
        2. Найди прямую цитату о штрафах арендатора.
        3. Найди прямую цитату о штрафах арендодателя.
        4. Найди прямую цитату об ограничении ответственности.
        5. Найди прямую цитату о порядке возмещения убытков.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "tenant_breach_penalty_status": "<defined / not_defined>",
