shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  duration_pattern: "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
  serial_number: "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: rental_parties_and_authority
    name: "Стороны договора проката: арендодатель, арендатор, полномочия"
    description: >
      Фактографическая проверка идентификации сторон договора проката:
      арендодатель (профессиональный — ИП или коммерческая организация),
      арендатор (гражданин), реквизиты, подписанты и основания полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "гражданин"
        - "ИП"
        - "коммерческая организация"
        - "пункт проката"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: идентификация арендодателя и арендатора,
        полномочия подписантов, профессиональный характер деятельности арендодателя
        и тип арендатора (гражданин или ИП).

        Нормативный ориентир:
        - ст. 626 ГК РФ — арендодатель — лицо, осуществляющее сдачу имущества
          в аренду в качестве постоянной предпринимательской деятельности;
          арендатор использует имущество для потребительских (личных, семейных,
          бытовых) нужд, если иное не вытекает из договора
        - ст. 432 ГК РФ — идентификация сторон

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Арендодатель (наименование/ФИО, ИНН, ОГРН/ОГРНИП).
        2. Есть ли признаки профессионального арендодателя (ИП, организация, пункт проката).
        3. Кто указан как Арендатор (ФИО, паспортные данные).
        4. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стороны определены:
        Фрагмент:
        "ИП Сидоров А.А. (ОГРНИП 312770000000001), именуемый «Арендодатель»,
        осуществляющий деятельность пункта проката, и гражданин Петров П.П.
        (паспорт серия 4500 № 123456), именуемый «Арендатор»."

        Ответ:
        {
          "landlord_details_status": "defined",
          "landlord_details_value": "ИП Сидоров А.А., ОГРНИП 312770000000001",
          "landlord_type": "individual_entrepreneur",
          "landlord_type_display": "ИП",
          "landlord_professional_status": "defined",
          "landlord_professional_details": "осуществляющий деятельность пункта проката",
          "landlord_professional_display": "Профессиональный (пункт проката)",
          "landlord_signatory_status": "defined",
          "landlord_signatory_value": "Сидоров А.А.",
          "landlord_signatory_basis": "not_defined",
          "tenant_details_status": "defined",
          "tenant_details_value": "гражданин Петров П.П., паспорт серия 4500 № 123456",
          "tenant_type": "individual",
          "tenant_type_display": "Гражданин (потребитель)",
          "tenant_signatory_status": "defined",
          "tenant_signatory_value": "Петров П.П.",
          "tenant_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ИП Сидоров А.А. (ОГРНИП 312770000000001), именуемый «Арендодатель», осуществляющий деятельность пункта проката, и гражданин Петров П.П. (паспорт серия 4500 № 123456), именуемый «Арендатор»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "landlord_details_status": "not_defined",
          "landlord_details_value": "Данные не определены",
          "landlord_type": "not_defined",
          "landlord_type_display": "Данные не определены",
          "landlord_professional_status": "not_defined",
          "landlord_professional_details": "Данные не определены",
          "landlord_professional_display": "Данные не определены",
          "landlord_signatory_status": "not_defined",
          "landlord_signatory_value": "Данные не определены",
          "landlord_signatory_basis": "not_defined",
          "tenant_details_status": "not_defined",
          "tenant_details_value": "Данные не определены",
          "tenant_type": "not_defined",
          "tenant_type_display": "Данные не определены",
          "tenant_signatory_status": "not_defined",
          "tenant_signatory_value": "Данные не определены",
          "tenant_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Арендодателя.
        2. Найди прямую цитату о профессиональном характере деятельности.
        3. Найди прямую цитату с идентификацией Арендатора.
        4. Найди прямую цитату о подписантах и полномочиях.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "landlord_details_status": "<defined / not_defined>",
          "landlord_details_value": "<текст или 'Данные не определены'>",
          "landlord_type": "<legal_entity / individual_entrepreneur / not_defined>",
          "landlord_type_display": "<'Юридическое лицо' / 'ИП' / 'Данные не определены'>",
          "landlord_professional_status": "<defined / not_defined>",
          "landlord_professional_details": "<текст или 'Данные не определены'>",
          "landlord_professional_display": "<'Профессиональный (пункт проката)' / 'Профессиональный' / 'Не подтверждён' / 'Данные не определены'>",
          "landlord_signatory_status": "<defined / not_defined>",
          "landlord_signatory_value": "<текст или 'Данные не определены'>",
          "landlord_signatory_basis": "<charter / poa / order / other / not_defined>",
          "tenant_details_status": "<defined / not_defined>",
          "tenant_details_value": "<текст или 'Данные не определены'>",
          "tenant_type": "<individual / individual_entrepreneur / not_defined>",
          "tenant_type_display": "<'Гражданин (потребитель)' / 'ИП' / 'Данные не определены'>",
          "tenant_signatory_status": "<defined / not_defined>",
          "tenant_signatory_value": "<текст или 'Данные не определены'>",
          "tenant_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендодатель арендатор гражданин ИП коммерческая организация пункт проката в лице действующего на основании ИНН ОГРН ОГРНИП паспорт реквизиты"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет проката"
        - "арендная плата"
        - "срок проката"
        - "ремонт"
        - "субаренда"
        - "возврат имущества"
        - "депозит"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката сведения
        об Арендодателе, Арендаторе, подписантах, профессиональном характере
        деятельности арендодателя и типе арендатора.
        Не анализируй предмет проката, плату, ремонт, субаренду, возврат
        имущества или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 17 полей (все обязательны в ответе):

        1. landlord_details_status — "defined" если Арендодатель прямо идентифицирован,
           иначе "not_defined".
        2. landlord_details_value — наименование/ФИО и реквизиты Арендодателя
           (ИНН, ОГРН/ОГРНИП). Если отсутствует — "Данные не определены".
        3. landlord_type — "legal_entity" / "individual_entrepreneur" / "not_defined".
        4. landlord_type_display — user-friendly формулировка типа арендодателя:
           - "Юридическое лицо" — если landlord_type = "legal_entity"
           - "ИП" — если landlord_type = "individual_entrepreneur"
           - "Данные не определены" — если landlord_type = "not_defined"
        5. landlord_professional_status — "defined" если профессиональный характер
           деятельности прямо указан (пункт проката, постоянная предпринимательская
           деятельность), иначе "not_defined".
        6. landlord_professional_details — формулировка о профессиональном
           характере деятельности из текста договора. Если отсутствует —
           "Данные не определены".
        7. landlord_professional_display — user-friendly вывод:
           - "Профессиональный (пункт проката)" — если прямо упомянут пункт проката
           - "Профессиональный" — если указан иной признак постоянной
             предпринимательской деятельности
           - "Не подтверждён" — если арендодатель идентифицирован, но нет прямых
             указаний на профессиональный характер деятельности
           - "Данные не определены" — если Арендодатель вообще не идентифицирован
        8. landlord_signatory_status — "defined" если подписант прямо указан,
           иначе "not_defined".
        9. landlord_signatory_value — подписант Арендодателя.
           Если отсутствует — "Данные не определены".
        10. landlord_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        11. tenant_details_status — "defined" если Арендатор прямо идентифицирован,
            иначе "not_defined".
        12. tenant_details_value — ФИО и реквизиты Арендатора (паспорт, адрес).
            Если отсутствует — "Данные не определены".
        13. tenant_type — "individual" / "individual_entrepreneur" / "not_defined".
        14. tenant_type_display — user-friendly формулировка типа арендатора:
            - "Гражданин (потребитель)" — если tenant_type = "individual"
            - "ИП" — если tenant_type = "individual_entrepreneur"
            - "Данные не определены" — если tenant_type = "not_defined"
        15. tenant_signatory_status — "defined" если подписант прямо указан,
            иначе "not_defined".
        16. tenant_signatory_value — подписант Арендатора.
            Если отсутствует — "Данные не определены".
        17. tenant_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона вместо
        текста договора.
        - Не оценивай риски, не давай юридических выводов.
        - landlord_type:
        - "legal_entity" — ООО, АО, ПАО, НАО и иные юрлица.
        - "individual_entrepreneur" — ИП (указан ОГРНИП).
        - "not_defined" — тип прямо не указан.
        - tenant_type:
        - "individual" — гражданин / физическое лицо (не ИП).
        - "individual_entrepreneur" — ИП (указан ОГРНИП).
        - "not_defined" — тип прямо не указан.
        - landlord_signatory_basis / tenant_signatory_basis:
        - "charter" — устав.
        - "poa" — доверенность.
        - "order" — приказ.
        - "other" — иное основание.
        - "not_defined" — не указано.
        - Для арендатора-гражданина, действующего лично, tenant_signatory_basis
        обычно = "not_defined" (это норма для проката, не ошибка).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о сторонах,
          подписантах или профессиональном статусе — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле или блоке реквизитов сторон.
        - Не смешивай реквизиты арендодателя и арендатора.
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 17 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов/enum и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

