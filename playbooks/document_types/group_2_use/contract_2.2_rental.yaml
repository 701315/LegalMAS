      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "возврат имущества"
        - "депозит"
        - "субаренда"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката порядок действий
        при поломке: уведомление, запрет самостоятельного ремонта, экстренная связь
        и замена имущества.
        Не анализируй размер арендной платы, депозит, субаренду или возврат имущества
        по окончании срока.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей (все обязательны в ответе):

        1. breakdown_procedure_status — "defined" если регламент действий при поломке
           прямо описан в тексте договора, иначе "not_defined".
        2. breakdown_procedure_details — формулировка о порядке действий при поломке
           (например, "прекратить эксплуатацию и уведомить").
           Если отсутствует — "Данные не определены".
        3. notification_obligation_status — "defined" если обязанность уведомить
           арендодателя прямо указана, иначе "not_defined".
        4. notification_obligation_details — формулировка об уведомлении (сроки, способ).
           Если отсутствует — "Данные не определены".
        5. self_repair_prohibition_status — "defined" если запрет самостоятельного
           ремонта / вскрытия пломб прямо указан, иначе "not_defined".
        6. self_repair_prohibition_details — формулировка о запрете ремонта.
           Если отсутствует — "Данные не определены".
        7. emergency_contact_status — "defined" если контакты для экстренной связи
           прямо указаны, иначе "not_defined".
        8. emergency_contact_details — контактные данные (телефон, email, чат,
           мобильное приложение). Если отсутствуют — "Данные не определены".
        9. replacement_option_status — "defined" если замена неисправного имущества
           прямо предусмотрена, иначе "not_defined".
        10. replacement_option_details — формулировка о замене имущества.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ст. 629 ГК РФ)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - emergency_contact_details может включать: номер телефона, email, ссылку на
        чат-бот, название мобильного приложения, телеграм-канал и т.п.
        - Не выводи обязанность замены из ст. 629 ГК РФ — фиксируй только то,
        что написано в тексте договора.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о поломке, уведомлении, ремонте
          или экстренной связи — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Обязанности Арендатора при авариях и поломках» или
          «Порядок действий при неисправности».
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 10 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "breakdown_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регламента действий при поломке."
          required: true
          display_in_grid: false
        - name: "breakdown_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Регламент при поломке"
          description: "Формулировка о порядке действий арендатора при обнаружении неисправности (ст. 629 ГК РФ)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notification_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности уведомить арендодателя."
          required: true
          display_in_grid: false
        - name: "notification_obligation_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об уведомлении арендодателя о поломке (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "self_repair_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
