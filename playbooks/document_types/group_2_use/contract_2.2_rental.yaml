  - id: deposit_and_damage_liability_check
    name: "Залог / депозит, ответственность за повреждение и нормальный износ"
    description: >
      Фактографическая проверка режима обеспечительного платежа / залога,
      критериев удержания, ответственности за утрату / повреждение предмета
      проката и исключения нормального износа.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "страховой депозит"
