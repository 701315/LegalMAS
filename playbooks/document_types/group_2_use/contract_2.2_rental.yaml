  - id: rental_max_term_check
    name: "Максимальный срок проката и соответствие ст. 627 ГК РФ"
    description: >
      Фактографическая проверка наличия в тексте срока проката, его соответствия
      максимальному пределу в 1 год (ст. 627 ГК РФ), а также указания
      на невозможность возобновления на неопределённый срок и отсутствие
      преимущественного права арендатора на заключение нового договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок проката"
        - "срок аренды"
        - "не более одного года"
        - "не более 12 месяцев"
        - "максимальный срок"
        - "возобновление"
        - "на неопределённый срок"
        - "преимущественное право"
        - "ст. 627"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+(проката|аренды)"
        - "(?i)не\\s+более\\s+(одного\\s+года|12\\s+месяцев|1\\s+года)"
        - "(?i)на\\s+неопределённый\\s+срок"
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)ст(?:атья|\\.)?\\s*627"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: срок проката и его соответствие
        императивным ограничениям ст. 627 ГК РФ.

        Нормативный ориентир:
        - ст. 627 ГК РФ:
          - срок проката не может превышать одного года
          - правила о возобновлении на неопределённый срок не применяются
          - арендатор не имеет преимущественного права на заключение нового договора

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой срок проката установлен (конкретная цифра/период).
        2. Есть ли прямая ссылка на максимальный предел в 1 год.
        3. Есть ли условие о возобновлении / пролонгации договора.
        4. Есть ли упоминание преимущественного права арендатора (предоставлено или исключено).
        5. Есть ли прямая ссылка на ст. 627 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок указан, ограничения ст. 627 ГК раскрыты:
        Фрагмент:
        "Срок проката составляет 30 суток с даты подписания акта выдачи.
        В соответствии со ст. 627 ГК РФ преимущественное право арендатора
        на заключение нового договора не применяется. Договор не подлежит
        автоматическому возобновлению на неопределённый срок."

        Ответ:
        {
          "rental_term_status": "defined",
          "rental_term_details": "30 суток с даты подписания акта выдачи",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "defined",
          "renewal_clause_details": "договор не подлежит автоматическому возобновлению на неопределённый срок",
          "renewal_excluded_display": "Исключена (ст. 627 ГК)",
          "preemptive_right_status": "defined",
          "preemptive_right_details": "преимущественное право арендатора на заключение нового договора не применяется",
          "preemptive_right_excluded_display": "Исключено (ст. 627 ГК)",
          "st627_reference_status": "defined",
          "st627_reference_details": "ст. 627 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Срок проката составляет 30 суток с даты подписания акта выдачи."
            },
            {
              "clause_ref": "п. 2.3",
              "quote": "В соответствии со ст. 627 ГК РФ преимущественное право арендатора на заключение нового договора не применяется."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "rental_term_status": "not_defined",
          "rental_term_details": "Данные не определены",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "not_defined",
          "renewal_clause_details": "Данные не определены",
          "renewal_excluded_display": "Данные не определены",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "preemptive_right_excluded_display": "Данные не определены",
          "st627_reference_status": "not_defined",
          "st627_reference_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — срок указан, но ст. 627 ГК не раскрыта (типичная ситуация):
        Фрагмент:
        "Срок проката составляет 6 месяцев. По истечении срока договор
        прекращается автоматически."

        Ответ:
        {
          "rental_term_status": "defined",
          "rental_term_details": "6 месяцев",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "defined",
          "renewal_clause_details": "по истечении срока договор прекращается автоматически",
          "renewal_excluded_display": "Исключена (автоматическое прекращение)",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "preemptive_right_excluded_display": "Не упомянуто",
          "st627_reference_status": "not_defined",
          "st627_reference_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Срок проката составляет 6 месяцев. По истечении срока договор прекращается автоматически."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке проката.
        2. Найди прямую цитату о максимальном пределе в 1 год.
        3. Найди прямую цитату о возобновлении / пролонгации.
        4. Найди прямую цитату о преимущественном праве.
        5. Найди прямую ссылку на ст. 627 ГК РФ.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rental_term_status": "<defined / not_defined>",
          "rental_term_details": "<текст или 'Данные не определены'>",
          "max_term_reference_status": "<defined / not_defined>",
          "max_term_reference_details": "<текст или 'Данные не определены'>",
          "renewal_clause_status": "<defined / not_defined>",
          "renewal_clause_details": "<текст или 'Данные не определены'>",
          "renewal_excluded_display": "<'Исключена (ст. 627 ГК)' / 'Исключена (автоматическое прекращение)' / 'Предусмотрена' / 'Не упомянуто' / 'Данные не определены'>",
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Данные не определены'>",
          "preemptive_right_excluded_display": "<'Исключено (ст. 627 ГК)' / 'Предусмотрено' / 'Не упомянуто' / 'Данные не определены'>",
          "st627_reference_status": "<defined / not_defined>",
          "st627_reference_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок проката срок аренды не более одного года не более 12 месяцев максимальный срок возобновление на неопределённый срок преимущественное право ст. 627"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "депозит"
        - "возврат имущества"
        - "субаренда"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "rental_max_term_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката срок проката,
        ссылку на максимальный предел, условия возобновления / пролонгации,
        преимущественное право и ссылку на ст. 627 ГК РФ.
        Не анализируй арендную плату, ремонт, депозит или возврат имущества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rental_max_term_check_presence:
           Агрегатное signal-поле — наличие регулирования по сроку проката
           и связанным императивным ограничениям ст. 627 ГК РФ.
           - "present" — если хотя бы одно из содержательных полей
             (rental_term_status, max_term_reference_status,
              renewal_clause_status, preemptive_right_status,
              st627_reference_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rental_term_status = "not_defined";
           - rental_term_details = "Данные не определены";
           - max_term_reference_status = "not_defined";
           - max_term_reference_details = "Данные не определены";
           - renewal_clause_status = "not_defined";
           - renewal_clause_details = "Данные не определены";
           - renewal_excluded_display = "Данные не определены";
           - preemptive_right_status = "not_defined";
           - preemptive_right_details = "Данные не определены";
           - preemptive_right_excluded_display = "Данные не определены";
           - st627_reference_status = "not_defined";
           - st627_reference_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. rental_term_status — "defined" если срок проката прямо указан
           (конкретная цифра/период), иначе "not_defined".
        2. rental_term_details — срок проката из текста договора.
           Если отсутствует — "Данные не определены".
        3. max_term_reference_status — "defined" если прямая ссылка на
           максимальный предел в 1 год есть в тексте, иначе "not_defined".
        4. max_term_reference_details — формулировка о максимальном пределе.
           Если отсутствует — "Данные не определены".
        5. renewal_clause_status — "defined" если условие о возобновлении /
           пролонгации / автоматическом прекращении прямо указано, иначе "not_defined".
        6. renewal_clause_details — формулировка о возобновлении / прекращении.
           Если отсутствует — "Данные не определены".
        7. renewal_excluded_display — краткий user-friendly статус:
           - "Исключена (ст. 627 ГК)" — если прямо указано, что возобновление
             на неопределённый срок не применяется / исключено со ссылкой на ст. 627 ГК;
           - "Исключена (автоматическое прекращение)" — если указано, что договор
             прекращается автоматически по истечении срока;
           - "Предусмотрена" — если есть условие о пролонгации / возобновлении;
           - "Не упомянуто" — если вопрос не урегулирован, но срок указан;
           - "Данные не определены" — если срок вообще не указан.
        8. preemptive_right_status — "defined" если преимущественное право
           прямо упомянуто (предоставлено или исключено), иначе "not_defined".
        9. preemptive_right_details — формулировка о преимущественном праве.
           Если отсутствует — "Данные не определены".
        10. preemptive_right_excluded_display — краткий user-friendly статус:
            - "Исключено (ст. 627 ГК)" — если прямо указано, что преимущественное
              право не применяется со ссылкой на ст. 627 ГК;
            - "Исключено" — если указано, что арендатор не имеет преимущественного
              права без ссылки на статью;
            - "Предусмотрено" — если преимущественное право предоставлено;
            - "Не упомянуто" — если вопрос не урегулирован, но срок указан;
            - "Данные не определены" — если срок вообще не указан.
        11. st627_reference_status — "defined" если прямая ссылка на ст. 627 ГК РФ
            есть в тексте, иначе "not_defined".
        12. st627_reference_details — формулировка ссылки на ст. 627 ГК РФ.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - соответствующий *_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни rental_max_term_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details/*_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 627 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - max_term_reference_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова: «не более одного года», «не более 12 месяцев», «максимальный
          срок проката — 1 год» и т.п.
        - renewal_clause_status = "defined" также если указано, что договор
          «прекращается автоматически» по истечении срока — это форма регулирования
          вопроса о возобновлении.
        - Не выводи ограничение срока из ст. 627 ГК РФ — фиксируй только то,
          что написано в тексте договора.
        - Если фрагмент контекста не содержит данных о сроке, возобновлении,
          преимущественном праве или ссылке на ст. 627 ГК — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Срок договора» или «Заключительные положения».
        - Срок проката обычно указывается в преамбуле или разделе «Предмет и срок».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока проката, ни ссылки на максимальный предел,
           ни условия о возобновлении, ни преимущественного права, ни ссылки
           на ст. 627 ГК РФ.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы.
           Срок проката указан, но без ссылки на максимальный предел,
           без условия о возобновлении, без преимущественного права
           и без ссылки на ст. 627 ГК РФ (типичная ситуация).
           → presence = "present";
             rental_term_status = "defined";
             max_term_reference_status = "not_defined";
             renewal_clause_status = "not_defined";
             preemptive_right_status = "not_defined";
             st627_reference_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указан срок проката 6 месяцев, в другом — 18 месяцев,
           и конфликт нельзя снять по тексту.
           → presence = "unclear";
             rental_term_status = "not_defined";
             rental_term_details = "Не удалось определить".

        4. Специфика темы: срок проката превышает 1 год (нарушение ст. 627 ГК РФ).
           В тексте прямо указан срок проката более одного года
           (например, «сроком на 18 месяцев»), что противоречит
           императивному пределу ст. 627 ГК РФ.
           → presence = "present";
             rental_term_status = "defined";
             rental_term_details = точная формулировка из текста
             (например, «18 месяцев»).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rental_max_term_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для renewal_excluded_display используй только: "Исключена (ст. 627 ГК)",
          "Исключена (автоматическое прекращение)", "Предусмотрена",
          "Не упомянуто" или "Данные не определены".
        - Для preemptive_right_excluded_display используй только: "Исключено (ст. 627 ГК)",
          "Исключено", "Предусмотрено", "Не упомянуто" или "Данные не определены".
        - Fallback при отсутствии данных:
          * rental_term_details → "Данные не определены";
          * max_term_reference_details → "Данные не определены";
          * renewal_clause_details → "Данные не определены";
          * renewal_excluded_display → "Данные не определены";
          * preemptive_right_details → "Данные не определены";
          * preemptive_right_excluded_display → "Данные не определены";
          * st627_reference_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * соответствующий *_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rental_max_term_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сроку проката и императивным ограничениям ст. 627 ГК РФ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rental_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока проката."
          required: true

        - name: "rental_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок проката"
          description: "Конкретный срок проката, указанный в договоре (дни, месяцы, годы)."
          required: false

        - name: "max_term_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на максимальный предел в 1 год."
          required: true

        - name: "max_term_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ссылка на предельный срок"
          description: "Формулировка о максимальном пределе срока проката (скрыта из Grid — почти всегда 'Данные не определены', так как это императивная норма)."
          required: false

        - name: "renewal_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о возобновлении / пролонгации."
          required: true

        - name: "renewal_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Условия пролонгации"
          description: "Формулировка о возобновлении / пролонгации / автоматическом прекращении (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "renewal_excluded_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Пролонгация"
          description: "Статус возможности возобновления договора проката на неопределённый срок (ст. 627 ГК РФ — не применяется)."
          required: false

        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания преимущественного права."
          required: true

        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Преимущественное право на заключение договора"
          description: "Формулировка о преимущественном праве арендатора (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "preemptive_right_excluded_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Преимущественное право"
          description: "Статус преимущественного права арендатора на заключение нового договора (ст. 627 ГК РФ — не применяется)."
          required: false

        - name: "st627_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на ст. 627 ГК РФ."
          required: true

        - name: "st627_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ссылка на ст. 627 ГК РФ"
          description: "Формулировка ссылки на ст. 627 ГК РФ (скрыта из Grid, доступна в drawer)."
          required: false
      store_payload: true

  - id: pledge_and_encumbrance_prohibition_check
    name: "Запрет залога и обременения предмета проката (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте запрета на передачу
      предмета проката в залог, внесение в качестве вклада и иные обременения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет залога"
        - "не вправе передавать в залог"
        - "не подлежит залогу"
        - "обременение запрещено"
        - "в качестве вклада"
        - "в качестве имущественного взноса"
        - "ст. 631"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе.*залог"
        - "(?i)запрет.*залог"
        - "(?i)в\\s+качестве\\s+вклад"
        - "(?i)ст(?:атья|\\.)?\\s*631"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: запрет залога и обременения предмета проката.

        Нормативный ориентир:
        - ст. 631 ГК РФ — имущество, полученное по договору проката,
          не может быть передано в субаренду, в залог, внесено в качестве
          вклада или имущественного взноса

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли запрет передачи предмета проката в залог.
        2. Есть ли запрет внесения в качестве вклада / имущественного взноса.
        3. Есть ли запрет иных обременений.
        4. Есть ли ссылка на ст. 631 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запреты указаны со ссылкой на ст. 631 ГК РФ:
        Фрагмент:
        "В соответствии со ст. 631 ГК РФ Арендатор не вправе передавать предмет
        проката в залог, вносить его в качестве вклада в уставный капитал
        или иным образом обременять правами третьих лиц."

        Ответ:
        {
          "pledge_prohibition_status": "defined",
          "pledge_prohibition_details": "не вправе передавать предмет проката в залог",
          "contribution_prohibition_status": "defined",
          "contribution_prohibition_details": "не вправе вносить в качестве вклада в уставный капитал",
          "other_encumbrance_prohibition_status": "defined",
          "other_encumbrance_prohibition_details": "не вправе иным образом обременять правами третьих лиц",
          "st631_reference_status": "defined",
          "st631_reference_details": "ст. 631 ГК РФ",
          "encumbrance_prohibition_display": "Запрещён (ст. 631 ГК)",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "В соответствии со ст. 631 ГК РФ Арендатор не вправе передавать предмет проката в залог, вносить его в качестве вклада в уставный капитал или иным образом обременять правами третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют (типичная ситуация):
        Фрагмент:
        "Арендатор пользуется имуществом."

        Ответ:
        {
          "pledge_prohibition_status": "not_defined",
          "pledge_prohibition_details": "Данные не определены",
          "contribution_prohibition_status": "not_defined",
          "contribution_prohibition_details": "Данные не определены",
          "other_encumbrance_prohibition_status": "not_defined",
          "other_encumbrance_prohibition_details": "Данные не определены",
          "st631_reference_status": "not_defined",
          "st631_reference_details": "Данные не определены",
          "encumbrance_prohibition_display": "Не упомянут (запрет действует в силу закона)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о запрете залога.
        2. Найди прямую цитату о запрете внесения в качестве вклада.
        3. Найди прямую цитату о запрете иных обременений.
        4. Найди прямую ссылку на ст. 631 ГК РФ.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "pledge_prohibition_status": "<defined / not_defined>",
          "pledge_prohibition_details": "<текст или 'Данные не определены'>",
          "contribution_prohibition_status": "<defined / not_defined>",
          "contribution_prohibition_details": "<текст или 'Данные не определены'>",
          "other_encumbrance_prohibition_status": "<defined / not_defined>",
          "other_encumbrance_prohibition_details": "<текст или 'Данные не определены'>",
          "st631_reference_status": "<defined / not_defined>",
          "st631_reference_details": "<текст или 'Данные не определены'>",
          "encumbrance_prohibition_display": "<'Запрещён (ст. 631 ГК)' / 'Запрещён (без ссылки на статью)' / 'Не упомянут (запрет действует в силу закона)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет залога не вправе передавать в залог обременение запрещено в качестве вклада имущественный взнос ст. 631 не подлежит залогу"
      retrieval_profile: "security_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "субаренда"
        - "арендная плата"
        - "ремонт"
        - "депозит"
        - "возврат"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "pledge_and_encumbrance_prohibition_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о запрете залога, внесения в качестве вклада и иных обременений
        предмета проката, а также ссылку на ст. 631 ГК РФ.
        Не анализируй арендную плату, ремонт, возврат имущества или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pledge_and_encumbrance_prohibition_check_presence:
           Агрегатное signal-поле — наличие регулирования по запрету залога
           и обременения предмета проката.
           - "present" — если хотя бы одно из содержательных полей
             (pledge_prohibition_status, contribution_prohibition_status,
              other_encumbrance_prohibition_status, st631_reference_status)
             = "defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pledge_prohibition_status = "not_defined";
           - pledge_prohibition_details = "Данные не определены";
           - contribution_prohibition_status = "not_defined";
           - contribution_prohibition_details = "Данные не определены";
           - other_encumbrance_prohibition_status = "not_defined";
           - other_encumbrance_prohibition_details = "Данные не определены";
           - st631_reference_status = "not_defined";
           - st631_reference_details = "Данные не определены";
           - encumbrance_prohibition_display = "Не упомянут (запрет действует в силу закона)";
           - не выполняй остальные шаги.

        1. pledge_prohibition_status — "defined" если запрет залога прямо указан
           в тексте договора, иначе "not_defined".
        2. pledge_prohibition_details — формулировка о запрете залога.
           Если отсутствует — "Данные не определены".
        3. contribution_prohibition_status — "defined" если запрет внесения
           в качестве вклада / имущественного взноса прямо указан, иначе "not_defined".
        4. contribution_prohibition_details — формулировка о запрете вклада.
           Если отсутствует — "Данные не определены".
        5. other_encumbrance_prohibition_status — "defined" если запрет иных
           обременений прямо указан, иначе "not_defined".
        6. other_encumbrance_prohibition_details — формулировка о запрете
           иных обременений. Если отсутствует — "Данные не определены".
        7. st631_reference_status — "defined" если прямая ссылка на ст. 631 ГК РФ
           есть в тексте, иначе "not_defined".
        8. st631_reference_details — формулировка ссылки на ст. 631 ГК РФ.
           Если отсутствует — "Данные не определены".
        9. encumbrance_prohibition_display — краткий user-friendly статус:
           - "Запрещён (ст. 631 ГК)" — если есть прямая ссылка на ст. 631 ГК РФ
             с запретом залога/вклада/обременений;
           - "Запрещён (без ссылки на статью)" — если запрет указан, но без
             ссылки на статью;
           - "Не упомянут (запрет действует в силу закона)" — если в договоре
             нет прямого запрета (императивная норма ст. 631 ГК РФ всё равно
             применяется);
           - "Данные не определены" — если договор вообще не содержит данных
             о предмете проката.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - encumbrance_prohibition_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни pledge_and_encumbrance_prohibition_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", encumbrance_prohibition_display = "Не упомянут (запрет действует в силу закона)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 631 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - pledge_prohibition_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова о запрете залога («не вправе передавать в залог», «запрещается залог» и т.п.).
        - В 90%+ договоров проката этот запрет не прописывается явно — это нормально,
          так как ст. 631 ГК РФ является императивной нормой.
        - Если фрагмент контекста не содержит данных о залоге, вкладе, обременениях
          или ссылке на ст. 631 ГК — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ограничения пользования» или «Обязанности Арендатора».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета залога, ни запрета внесения в качестве
           вклада, ни запрета иных обременений, ни ссылки на ст. 631 ГК РФ
           (типичная ситуация для 90%+ договоров проката — запрет действует
           в силу императивной нормы).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             encumbrance_prohibition_display = "Не упомянут (запрет действует в силу закона)".

        2. Неполное раскрытие темы.
           Указан запрет залога, но без запрета вклада, иных обременений
           и без ссылки на ст. 631 ГК РФ.
           → presence = "present";
             pledge_prohibition_status = "defined";
             contribution_prohibition_status = "not_defined";
             other_encumbrance_prohibition_status = "not_defined";
             st631_reference_status = "not_defined";
             encumbrance_prohibition_display = "Запрещён (без ссылки на статью)".

        3. Противоречие между фрагментами.
           В одном пункте указано, что арендатор не вправе передавать
           имущество в залог, в другом — что он вправе обременять его
           с согласия арендодателя, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             pledge_prohibition_status = "not_defined";
             pledge_prohibition_details = "Не удалось определить";
             encumbrance_prohibition_display = "Данные не определены".

        4. Специфика темы: явный запрет обременений со ссылкой на ст. 631 ГК РФ.
           В тексте прямо предусмотрен запрет залога, внесения вклада
           и иных обременений со ссылкой на ст. 631 ГК РФ
           (усиленная защита от переквалификации).
           → presence = "present";
             pledge_prohibition_status = "defined";
             contribution_prohibition_status = "defined";
             other_encumbrance_prohibition_status = "defined";
             st631_reference_status = "defined";
             encumbrance_prohibition_display = "Запрещён (ст. 631 ГК)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pledge_and_encumbrance_prohibition_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для encumbrance_prohibition_display используй только: "Запрещён (ст. 631 ГК)",
          "Запрещён (без ссылки на статью)",
          "Не упомянут (запрет действует в силу закона)" или "Данные не определены".
        - Fallback при отсутствии данных:
          * pledge_prohibition_details → "Данные не определены";
          * contribution_prohibition_details → "Данные не определены";
          * other_encumbrance_prohibition_details → "Данные не определены";
          * st631_reference_details → "Данные не определены";
          * encumbrance_prohibition_display → "Не упомянут (запрет действует в силу закона)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * encumbrance_prohibition_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pledge_and_encumbrance_prohibition_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по запрету залога и обременения предмета проката. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pledge_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета залога предмета проката."
          required: true

        - name: "pledge_prohibition_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Запрет залога имущества"
          description: "Формулировка о запрете залога предмета проката (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "contribution_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета внесения в качестве вклада."
          required: true

        - name: "contribution_prohibition_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Запрет внесения в качестве вклада"
          description: "Формулировка о запрете внесения в качестве вклада (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "other_encumbrance_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета иных обременений."
          required: true

        - name: "other_encumbrance_prohibition_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Запрет иных обременений"
          description: "Формулировка о запрете иных обременений (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "st631_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на ст. 631 ГК РФ."
          required: true

        - name: "st631_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ссылка на ст. 631 ГК РФ"
          description: "Формулировка ссылки на ст. 631 ГК РФ (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "encumbrance_prohibition_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Запрет обременений"
          description: "Компактный статус запрета залога, вклада и иных обременений предмета проката (ст. 631 ГК РФ)."
          required: false
      store_payload: true

  - id: rental_liability_and_penalties_check
    name: "Ответственность сторон и неустойки в договоре проката"
    description: >
      Фактографическая проверка наличия в тексте неустоек, штрафов
      за нарушения арендатора и арендодателя, ограничения ответственности
      и порядка возмещения убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пени"
        - "ответственность"
        - "ограничение ответственности"
        - "возмещение убытков"
        - "ущерб"
        - "утрата имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк|штраф|пени"
        - "(?i)ограничени(е|я)\\s+ответственност"
        - "(?i)возмещени(е|я)\\s+убытк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется общий режим ответственности сторон и неустойки.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки
        - ст. 16 ЗоЗПП — ничтожность условий, ущемляющих права потребителя

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В договоре проката с потребителем ограничения ответственности
          арендодателя могут быть ничтожны по ЗоЗПП.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку оплаты.
        2. Есть ли штрафы за нарушения арендатора.
        3. Есть ли штрафы за нарушения арендодателя.
        4. Есть ли ограничение ответственности (caps, лимиты).
        5. Есть ли порядок возмещения убытков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ответственность сбалансирована:
        Фрагмент:
        "За просрочку оплаты — пени 0,5% в день от суммы долга. За повреждение
        предмета проката — штраф в размере полной стоимости. Ответственность
        Арендодателя ограничена размером полученной арендной платы."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,5% в день от суммы долга",
          "tenant_breach_penalty_status": "defined",
          "tenant_breach_penalty_details": "штраф в размере полной стоимости за повреждение",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Арендодателя ограничена размером полученной арендной платы",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "liability_balance_display": "Перекос в пользу арендодателя (ограничение ответственности арендодателя)",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "За просрочку оплаты — пени 0,5% в день от суммы долга."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Данные не определены",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "liability_balance_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку.
        2. Найди прямую цитату о штрафах арендатора.
        3. Найди прямую цитату о штрафах арендодателя.
        4. Найди прямую цитату об ограничении ответственности.
        5. Найди прямую цитату о порядке возмещения убытков.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "tenant_breach_penalty_status": "<defined / not_defined>",
          "tenant_breach_penalty_details": "<текст или 'Данные не определены'>",
          "landlord_breach_penalty_status": "<defined / not_defined>",
          "landlord_breach_penalty_details": "<текст или 'Данные не определены'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "damages_procedure_status": "<defined / not_defined>",
          "damages_procedure_details": "<текст или 'Данные не определены'>",
          "liability_balance_display": "<'Сбалансирована' / 'Перекос в пользу арендодателя' / 'Перекос в пользу арендатора' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка штраф пени ответственность ограничение ответственности возмещение убытков ущерб утрата имущества повреждение просрочка оплаты"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "возврат"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "rental_liability_and_penalties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката неустойки,
        штрафы за нарушения сторон, ограничение ответственности и порядок
        возмещения убытков.
        Не анализируй регулярную арендную плату, ремонт, субаренду или возврат
        имущества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rental_liability_and_penalties_check_presence:
           Агрегатное signal-поле — наличие регулирования по ответственности
           сторон и неустойкам.
           - "present" — если хотя бы одно из содержательных полей
             (late_payment_penalty_status, tenant_breach_penalty_status,
              landlord_breach_penalty_status, liability_cap_status,
              damages_procedure_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_payment_penalty_status = "not_defined";
           - late_payment_penalty_details = "Данные не определены";
           - tenant_breach_penalty_status = "not_defined";
           - tenant_breach_penalty_details = "Данные не определены";
           - landlord_breach_penalty_status = "not_defined";
           - landlord_breach_penalty_details = "Данные не определены";
           - liability_cap_status = "not_defined";
           - liability_cap_details = "Данные не определены";
           - damages_procedure_status = "not_defined";
           - damages_procedure_details = "Данные не определены";
           - liability_balance_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. late_payment_penalty_status — "defined" если неустойка (пени) за
           просрочку арендной платы прямо указана, иначе "not_defined".
        2. late_payment_penalty_details — формулировка о неустойке за просрочку
           оплаты (размер, порядок расчёта).
           Если отсутствует — "Данные не определены".
        3. tenant_breach_penalty_status — "defined" если штрафы за нарушения
           арендатора (повреждение, утрата, просрочка возврата) прямо указаны,
           иначе "not_defined".
        4. tenant_breach_penalty_details — формулировка о штрафах арендатора.
           Если отсутствует — "Данные не определены".
        5. landlord_breach_penalty_status — "defined" если штрафы за нарушения
           арендодателя (непредоставление вещи, недостатки) прямо указаны,
           иначе "not_defined".
        6. landlord_breach_penalty_details — формулировка о штрафах арендодателя.
           Если отсутствует — "Данные не определены".
        7. liability_cap_status — "defined" если ограничение ответственности
           (caps, лимиты) прямо указано, иначе "not_defined".
        8. liability_cap_details — формулировка об ограничении ответственности.
           Если отсутствует — "Данные не определены".
        9. damages_procedure_status — "defined" если порядок возмещения убытков
           прямо описан, иначе "not_defined".
        10. damages_procedure_details — формулировка о возмещении убытков.
            Если отсутствует — "Данные не определены".
        11. liability_balance_display — краткий user-friendly вывод о балансе
            ответственности сторон:
            - "Сбалансирована" — если штрафы/ответственность предусмотрены для
              обеих сторон примерно в равной мере;
            - "Перекос в пользу арендодателя" — если штрафы/ограничения
              существенно ущемляют права арендатора (например, ответственность
              арендодателя ограничена, а арендатора — полная);
            - "Перекос в пользу арендатора" — если ответственность арендодателя
              существенно выше ответственности арендатора;
            - "Данные не определены" — если договор не содержит условий об
              ответственности.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - liability_balance_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни rental_liability_and_penalties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details/*_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ГК РФ,
          ЗоЗПП) вместо текста документа.
        - Не оценивай риски, не давай субъективных юридических оценок.
        - Не смешивай неустойку за просрочку оплаты с штрафами за иные нарушения.
        - В договоре проката с потребителем ограничения ответственности
          арендодателя могут быть ничтожны по ст. 16 ЗоЗПП, но в DD важно
          зафиксировать их наличие как факт.
        - tenant_breach_penalty_details может дублировать Check 8
          (damage_liability_details) — это нормально, фиксируй текст договора.
        - Если фрагмент контекста не содержит данных о неустойках, штрафах,
          ограничении ответственности или возмещении убытков — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ответственность сторон» или «Заключительные положения».
        - Условия об ответственности могут быть разбросаны по разным разделам
          договора (платежи, возврат, общие положения). Анализируй весь контекст.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустойки за просрочку оплаты, ни штрафов арендатора
           или арендодателя, ни ограничения ответственности, ни порядка
           возмещения убытков.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы.
           Указана только неустойка за просрочку оплаты, без штрафов
           за иные нарушения, без ограничения ответственности и без порядка
           возмещения убытков.
           → presence = "present";
             late_payment_penalty_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что ответственность сторон симметрична,
           в другом — что ответственность арендодателя ограничена суммой
           арендной платы, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             liability_cap_status = "not_defined";
             liability_cap_details = "Не удалось определить";
             liability_balance_display = "Данные не определены".

        4. Специфика темы: асимметричное ограничение ответственности (red flag).
           В тексте прямо ограничена ответственность арендодателя (например,
           размером арендной платы), при этом ответственность арендатора
           предусмотрена в полном объёме (штрафы за повреждения, невозврат
           аванса и т.п.).
           → presence = "present";
             liability_cap_status = "defined";
             liability_cap_details = точная формулировка из текста;
             liability_balance_display = "Перекос в пользу арендодателя (ограничение ответственности арендодателя)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rental_liability_and_penalties_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для liability_balance_display используй только: "Сбалансирована",
          "Перекос в пользу арендодателя", "Перекос в пользу арендатора"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * late_payment_penalty_details → "Данные не определены";
          * tenant_breach_penalty_details → "Данные не определены";
          * landlord_breach_penalty_details → "Данные не определены";
          * liability_cap_details → "Данные не определены";
          * damages_procedure_details → "Данные не определены";
          * liability_balance_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * liability_balance_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rental_liability_and_penalties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности сторон и неустойкам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус неустойки за просрочку оплаты."
          required: true

        - name: "late_payment_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Неустойка за просрочку"
          description: "Формулировка о неустойке (пени) за просрочку арендной платы."
          required: false

        - name: "tenant_breach_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус штрафов за нарушения арендатора."
          required: true

        - name: "tenant_breach_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Штрафы за нарушения арендатора"
          description: "Формулировка о штрафах за нарушения арендатора (скрыта из Grid — дублирует Check 8, доступна в drawer)."
          required: false

        - name: "landlord_breach_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус штрафов за нарушения арендодателя."
          required: true

        - name: "landlord_breach_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Штраф за нарушения арендодателя"
          description: "Формулировка о штрафах за нарушения арендодателя (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничения ответственности."
          required: true

        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Лимит ответственности"
          description: "Формулировка об ограничении ответственности (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "damages_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возмещения убытков."
          required: true

        - name: "damages_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок возмещения убытков"
          description: "Формулировка о порядке возмещения убытков (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "liability_balance_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Баланс ответственности"
          description: "Компактный вывод о балансе ответственности сторон в договоре проката."
          required: false
      store_payload: true

  - id: unfair_consumer_clauses_check
    name: "Недопустимые потребительские условия в договоре проката"
    description: >
      Фактографическая проверка наличия в тексте формулировок, которые могут
      ограничивать законные права арендатора-потребителя: невозвратность платы,
      blanket disclaimer ответственности арендодателя, запрет отказа от договора,
      несоразмерные штрафы, навязанные удержания, отказ от законных гарантий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "деньги не возвращаются"
        - "оплата не подлежит возврату"
        - "минимальный срок аренды обязателен"
        - "арендодатель не несет ответственности"
        - "арендодатель освобождается от ответственности"
        - "штраф"
        - "безусловное удержание"
        - "арендатор отказывается от претензий"
        - "арендатор принимает на себя все риски"
        - "гарантии не предоставляются"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)деньги\\s+не\\s+возвращ"
        - "(?i)оплата\\s+не\\s+подлежит\\s+возврат"
        - "(?i)арендодатель.*не\\s+нес[её]т\\s+ответственност"
        - "(?i)арендодатель.*освобожда(ется|ют)\\s+от\\s+ответственност"
        - "(?i)арендатор.*отказыва(ется|ют)\\s+от\\s+претензи"
        - "(?i)арендатор.*принима(ет|ют)\\s+на\\s+себя\\s+все\\s+риск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется наличие формулировок, потенциально ущемляющих права
        арендатора-потребителя по ст. 16 ЗоЗПП.

        Нормативный ориентир:
        - ст. 16 Закона о защите прав потребителей — недействительность условий,
          ущемляющих права потребителя
        - ст. 627 ГК РФ — право арендатора на отказ в любое время
        - ст. 631 ГК РФ — ремонт за счёт арендодателя

        Важно:
        - Не делай самостоятельный юридический вывод о недействительности.
        - Фиксируй только наличие или отсутствие конкретных формулировок.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли формулировка о невозвратности платы ни при каких условиях.
        2. Есть ли blanket disclaimer ответственности арендодателя.
        3. Есть ли запрет или ограничение права арендатора на отказ от договора.
        4. Есть ли формулировка об отказе арендатора от претензий.
        5. Есть ли формулировка о принятии арендатором всех рисков.
        6. Есть ли формулировка об отказе от гарантий.
        7. Есть ли условие о безусловном удержании из депозита.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не делай самостоятельный правовой вывод о недействительности условия.
        4. Если формулировка не указана прямо — возвращай статус "not_defined".
        5. Для текстовых полей (*_details, *_summary) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        6. Для статусов допустимо значение "not_defined".
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — проблемные формулировки есть (несколько):
        Фрагмент:
        "Оплата за прокат не подлежит возврату ни при каких обстоятельствах.
        Арендодатель не несёт ответственности за вред, причинённый здоровью
        или имуществу Арендатора при использовании предмета проката.
        Арендатор принимает на себя все риски, связанные с эксплуатацией."

        Ответ:
        {
          "non_refund_clause_status": "defined",
          "non_refund_clause_details": "оплата за прокат не подлежит возврату ни при каких обстоятельствах",
          "blanket_disclaimer_status": "defined",
          "blanket_disclaimer_details": "Арендодатель не несёт ответственности за вред, причинённый здоровью или имуществу Арендатора",
          "termination_restriction_status": "not_defined",
          "termination_restriction_details": "Данные не определены",
          "waiver_of_claims_status": "not_defined",
          "waiver_of_claims_details": "Данные не определены",
          "full_risk_assumption_status": "defined",
          "full_risk_assumption_details": "Арендатор принимает на себя все риски, связанные с эксплуатацией",
          "warranty_disclaimer_status": "not_defined",
          "warranty_disclaimer_details": "Данные не определены",
          "unconditional_retention_status": "not_defined",
          "unconditional_retention_details": "Данные не определены",
          "unfair_clauses_summary": "Выявлены недопустимые условия",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Оплата за прокат не подлежит возврату ни при каких обстоятельствах."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Арендодатель не несёт ответственности за вред, причинённый здоровью или имуществу Арендатора при использовании предмета проката."
            }
          ]
        }

        Пример 2 — проблемных формулировок нет:
        Фрагмент:
        "Арендатор вправе отказаться от договора в любое время."

        Ответ:
        {
          "non_refund_clause_status": "not_defined",
          "non_refund_clause_details": "Данные не определены",
          "blanket_disclaimer_status": "not_defined",
          "blanket_disclaimer_details": "Данные не определены",
          "termination_restriction_status": "not_defined",
          "termination_restriction_details": "Данные не определены",
          "waiver_of_claims_status": "not_defined",
          "waiver_of_claims_details": "Данные не определены",
          "full_risk_assumption_status": "not_defined",
          "full_risk_assumption_details": "Данные не определены",
          "warranty_disclaimer_status": "not_defined",
          "warranty_disclaimer_details": "Данные не определены",
          "unconditional_retention_status": "not_defined",
          "unconditional_retention_details": "Данные не определены",
          "unfair_clauses_summary": "Не выявлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о невозвратности платы.
        2. Найди прямую цитату о полном снятии ответственности арендодателя.
        3. Найди прямую цитату о запрете / ограничении отказа от договора.
        4. Найди прямую цитату об отказе от претензий.
        5. Найди прямую цитату о принятии всех рисков арендатором.
        6. Найди прямую цитату об отказе от гарантий.
        7. Найди прямую цитату о безусловном удержании.
        8. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "non_refund_clause_status": "<defined / not_defined>",
          "non_refund_clause_details": "<текст или 'Данные не определены'>",
          "blanket_disclaimer_status": "<defined / not_defined>",
          "blanket_disclaimer_details": "<текст или 'Данные не определены'>",
          "termination_restriction_status": "<defined / not_defined>",
          "termination_restriction_details": "<текст или 'Данные не определены'>",
          "waiver_of_claims_status": "<defined / not_defined>",
          "waiver_of_claims_details": "<текст или 'Данные не определены'>",
          "full_risk_assumption_status": "<defined / not_defined>",
          "full_risk_assumption_details": "<текст или 'Данные не определены'>",
          "warranty_disclaimer_status": "<defined / not_defined>",
          "warranty_disclaimer_details": "<текст или 'Данные не определены'>",
          "unconditional_retention_status": "<defined / not_defined>",
          "unconditional_retention_details": "<текст или 'Данные не определены'>",
          "unfair_clauses_summary": "<'Выявлены недопустимые условия' / 'Не выявлены' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 12
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "невозвратность платы деньги не возвращаются оплата не подлежит возврату снятие ответственности арендодатель не несёт освобождается от ответственности отказ от претензий принятие всех рисков отказ от гарантий безусловное удержание минимальный срок обязателен запрет отказа"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
        - boilerplate
      negative_keywords:
        - "предмет проката"
        - "срок проката"
        - "ремонт"
        - "субаренда"
        - "публичный договор"
        - "инструктаж"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.20
        scope: segment
      context_k: 12
      max_chunks: 16
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1700

      compact_output: false

      presence_signal:
        field: "unfair_consumer_clauses_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката формулировки,
        которые потенциально ущемляют права арендатора-потребителя: невозвратность
        платы, blanket disclaimer ответственности, запрет отказа от договора,
        отказ от претензий, принятие всех рисков, отказ от гарантий, безусловное
        удержание из депозита.
        Не делай самостоятельный правовой вывод о недействительности условий.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unfair_consumer_clauses_check_presence:
           Агрегатное signal-поле — наличие регулирования по потенциально
           ущемляющим формулировкам.
           - "present" — если хотя бы одно из содержательных полей
             (non_refund_clause_status, blanket_disclaimer_status,
              termination_restriction_status, waiver_of_claims_status,
              full_risk_assumption_status, warranty_disclaimer_status,
              unconditional_retention_status) = "defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - non_refund_clause_status = "not_defined";
           - non_refund_clause_details = "Данные не определены";
           - blanket_disclaimer_status = "not_defined";
           - blanket_disclaimer_details = "Данные не определены";
           - termination_restriction_status = "not_defined";
           - termination_restriction_details = "Данные не определены";
           - waiver_of_claims_status = "not_defined";
           - waiver_of_claims_details = "Данные не определены";
           - full_risk_assumption_status = "not_defined";
           - full_risk_assumption_details = "Данные не определены";
           - warranty_disclaimer_status = "not_defined";
           - warranty_disclaimer_details = "Данные не определены";
           - unconditional_retention_status = "not_defined";
           - unconditional_retention_details = "Данные не определены";
           - unfair_clauses_summary = "Не выявлены";
           - не выполняй остальные шаги.

        1. non_refund_clause_status — "defined" если формулировка о невозвратности
           платы («не подлежит возврату», «деньги не возвращаются») прямо присутствует,
           иначе "not_defined".
        2. non_refund_clause_details — формулировка о невозвратности платы.
           Если отсутствует — "Данные не определены".
        3. blanket_disclaimer_status — "defined" если полное снятие ответственности
           с арендодателя прямо присутствует («не несёт ответственности»,
           «освобождается от ответственности»), иначе "not_defined".
        4. blanket_disclaimer_details — формулировка о снятии ответственности.
           Если отсутствует — "Данные не определены".
        5. termination_restriction_status — "defined" если запрет / ограничение
           права на отказ от договора прямо присутствует, иначе "not_defined".
        6. termination_restriction_details — формулировка об ограничении отказа.
           Если отсутствует — "Данные не определены".
        7. waiver_of_claims_status — "defined" если отказ арендатора от претензий
           прямо присутствует («отказывается от претензий», «не имеет права на
           претензии»), иначе "not_defined".
        8. waiver_of_claims_details — формулировка об отказе от претензий.
           Если отсутствует — "Данные не определены".
        9. full_risk_assumption_status — "defined" если принятие арендатором
           всех рисков прямо присутствует («принимает на себя все риски»),
           иначе "not_defined".
        10. full_risk_assumption_details — формулировка о принятии рисков.
            Если отсутствует — "Данные не определены".
        11. warranty_disclaimer_status — "defined" если отказ от гарантий прямо
            присутствует («гарантии не предоставляются», «без гарантий»),
            иначе "not_defined".
        12. warranty_disclaimer_details — формулировка об отказе от гарантий.
            Если отсутствует — "Данные не определены".
        13. unconditional_retention_status — "defined" если безусловное удержание
            из депозита прямо присутствует («удерживается без условий»,
            «не возвращается ни при каких обстоятельствах»), иначе "not_defined".
        14. unconditional_retention_details — формулировка о безусловном удержании.
            Если отсутствует — "Данные не определены".
        15. unfair_clauses_summary — краткий user-friendly статус:
            - "Выявлены недопустимые условия" — если найдена хотя бы одна
              проблемная формулировка из пунктов 1-7;
            - "Не выявлены" — если ни одна проблемная формулировка не найдена;
            - "Данные не определены" — если договор не содержит данных об
              ответственности/платежах/правах сторон.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - unfair_clauses_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни unfair_consumer_clauses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", unfair_clauses_summary = "Не выявлены".
        - Используй только текст договора. Не подставляй нормы закона (ЗоЗПП, ГК РФ)
          вместо текста документа.
        - Не делай самостоятельный правовой вывод о недействительности или
          противоречии закону — только фиксируй наличие формулировок.
        - termination_restriction_status может дублировать Check 4 — это нормально,
          фиксируй текст договора как есть.
        - blanket_disclaimer_status = "defined" ТОЛЬКО если есть формулировки
          типа «не несёт ответственности», «освобождается от ответственности»
          без конкретизации исключений.
        - Если фрагмент контекста не содержит данных о невозвратности платы,
          ответственности, отказе от претензий, рисках, гарантиях или удержаниях —
          игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ответственность сторон», «Заключительные положения» или
          «Особые условия».
        - Проблемные формулировки часто встречаются в конце договора
          (заключительные положения, особые условия, disclaimer). Анализируй
          весь контекст.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни формулировки о невозвратности платы, ни blanket
           disclaimer, ни ограничения отказа, ни отказа от претензий, ни принятия
           рисков, ни отказа от гарантий, ни безусловного удержания.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             unfair_clauses_summary = "Не выявлены".

        2. Неполное раскрытие темы.
           Указана только формулировка о невозвратности платы, остальные
           проблемные условия отсутствуют.
           → presence = "present";
             non_refund_clause_status = "defined";
             остальные статусы = "not_defined";
             unfair_clauses_summary = "Выявлены недопустимые условия".

        3. Противоречие между фрагментами.
           В одном пункте указано, что арендодатель освобождается от всей
           ответственности, в другом — что он несёт ответственность за
           конкретные нарушения, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             blanket_disclaimer_status = "not_defined";
             blanket_disclaimer_details = "Не удалось определить";
             unfair_clauses_summary = "Данные не определены".

        4. Специфика темы: комплексная недобросовестная конструкция (red flag).
           В тексте одновременно присутствуют несколько проблемных формулировок:
           невозвратность платы, полное снятие ответственности арендодателя,
           запрет отказа от договора и отказ от претензий — типичная
           «потребительская ловушка» по ст. 16 ЗоЗПП.
           → presence = "present";
             non_refund_clause_status = "defined";
             blanket_disclaimer_status = "defined";
             termination_restriction_status = "defined";
             waiver_of_claims_status = "defined";
             unfair_clauses_summary = "Выявлены недопустимые условия".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unfair_consumer_clauses_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для unfair_clauses_summary используй только: "Выявлены недопустимые условия",
          "Не выявлены" или "Данные не определены".
        - Fallback при отсутствии данных:
          * non_refund_clause_details → "Данные не определены";
          * blanket_disclaimer_details → "Данные не определены";
          * termination_restriction_details → "Данные не определены";
          * waiver_of_claims_details → "Данные не определены";
          * full_risk_assumption_details → "Данные не определены";
          * warranty_disclaimer_details → "Данные не определены";
          * unconditional_retention_details → "Данные не определены";
          * unfair_clauses_summary → "Не выявлены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * unfair_clauses_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unfair_consumer_clauses_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по потенциально ущемляющим формулировкам в договоре проката. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_refund_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус формулировки о невозвратности платы."
          required: true

        - name: "non_refund_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Невозвратность платы"
          description: "Формулировка о невозвратности арендной платы (потенциально ущемляет права потребителя по ст. 16 ЗоЗПП)."
          required: false

        - name: "blanket_disclaimer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус полного снятия ответственности арендодателя."
          required: true

        - name: "blanket_disclaimer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отказ от ответственности"
          description: "Формулировка о полном снятии ответственности с арендодателя (скрыта из Grid, доступна в drawer)."
