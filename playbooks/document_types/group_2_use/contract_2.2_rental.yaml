    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката формулировки,
        которые потенциально ущемляют права арендатора-потребителя: невозвратность
        платы, blanket disclaimer ответственности, запрет отказа от договора,
        отказ от претензий, принятие всех рисков, отказ от гарантий, безусловное
        удержание из депозита.
        Не делай самостоятельный правовой вывод о недействительности условий.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 15 полей (все обязательны в ответе):

        1. non_refund_clause_status — "defined" если формулировка о невозвратности
           платы («не подлежит возврату», «деньги не возвращаются») прямо присутствует,
           иначе "not_defined".
        2. non_refund_clause_details — формулировка о невозвратности платы.
           Если отсутствует — "Данные не определены".
        3. blanket_disclaimer_status — "defined" если полное снятие ответственности
           с арендодателя прямо присутствует («не несёт ответственности»,
           «освобождается от ответственности»), иначе "not_defined".
        4. blanket_disclaimer_details — формулировка о снятии ответственности.
           Если отсутствует — "Данные не определены".
        5. termination_restriction_status — "defined" если запрет / ограничение
           права на отказ от договора прямо присутствует, иначе "not_defined".
        6. termination_restriction_details — формулировка об ограничении отказа.
           Если отсутствует — "Данные не определены".
        7. waiver_of_claims_status — "defined" если отказ арендатора от претензий
           прямо присутствует («отказывается от претензий», «не имеет права на
           претензии»), иначе "not_defined".
        8. waiver_of_claims_details — формулировка об отказе от претензий.
           Если отсутствует — "Данные не определены".
        9. full_risk_assumption_status — "defined" если принятие арендатором
           всех рисков прямо присутствует («принимает на себя все риски»),
           иначе "not_defined".
        10. full_risk_assumption_details — формулировка о принятии рисков.
            Если отсутствует — "Данные не определены".
        11. warranty_disclaimer_status — "defined" если отказ от гарантий прямо
            присутствует («гарантии не предоставляются», «без гарантий»),
            иначе "not_defined".
        12. warranty_disclaimer_details — формулировка об отказе от гарантий.
            Если отсутствует — "Данные не определены".
        13. unconditional_retention_status — "defined" если безусловное удержание
            из депозита прямо присутствует («удерживается без условий»,
            «не возвращается ни при каких обстоятельствах»), иначе "not_defined".
        14. unconditional_retention_details — формулировка о безусловном удержании.
            Если отсутствует — "Данные не определены".
        15. unfair_clauses_summary — краткий user-friendly статус:
            - "Выявлены недопустимые условия" — если найдена хотя бы одна
              проблемная формулировка из пунктов 1-7;
            - "Не выявлены" — если ни одна проблемная формулировка не найдена;
            - "Данные не определены" — если договор не содержит данных об
              ответственности/платежах/правах сторон.

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ЗоЗПП, ГК РФ)
        вместо текста документа.
        - Не делай самостоятельный правовой вывод о недействительности или
        противоречии закону — только фиксируй наличие формулировок.
        - termination_restriction_status может дублировать Check 4 — это нормально,
        фиксируй текст договора как есть.
        - blanket_disclaimer_status = "defined" ТОЛЬКО если есть формулировки
        типа «не несёт ответственности», «освобождается от ответственности»
        без конкретизации исключений.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о невозвратности платы,
          ответственности, отказе от претензий, рисках, гарантиях или удержаниях —
          игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ответственность сторон», «Заключительные положения» или
          «Особые условия».
        - Проблемные формулировки часто встречаются в конце договора
          (заключительные положения, особые условия, disclaimer). Анализируй
          весь контекст.
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 15 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
