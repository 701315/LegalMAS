          required: true

        - name: "deposit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения об обеспечительном платеже"
          description: "Размер и условия залога / депозита (скрыт из Grid, так как сумма выводится в Check 2; доступен в drawer)."
          required: false

        - name: "damage_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за повреждение / утрату."
          required: true

        - name: "damage_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ответственность за ущерб"
          description: "Формулировка об ответственности арендатора за повреждение или утрату предмета проката."
          required: false

        - name: "deposit_refund_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания порядка возврата залога."
          required: true

        - name: "deposit_refund_details"
          type: "string"
