          description: "Статус привязки доказательств к дате/номеру/акту."
          required: true

        - name: "evidence_binding_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Привязка доказательств"
          description: "Формулировка о привязке доказательств к дате/номеру акта (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "condition_fixation_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Фиксация состояния"
          description: "Компактный статус регулирования фиксации состояния предмета проката при выдаче и возврате."
          required: false
      store_payload: true

  - id: tenant_age_and_capacity_check
    name: "Возраст и дееспособность Арендатора-потребителя"
    description: >
      Фактографическая проверка возраста арендатора, наличия письменного
      согласия законных представителей для несовершеннолетних 14–18 лет,
      действий законных представителей для малолетних, ограниченной
      или полной недееспособности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возраст арендатора"
        - "совершеннолетний"
        - "несовершеннолетний"
        - "согласие родителей"
        - "законный представитель"
        - "опекун"
        - "попечитель"
        - "дееспособность"
        - "недееспособный"
        - "ограниченно дееспособный"
        - "с 18 лет"
        - "с 14 лет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возраст.*арендатор"
        - "(?i)несовершеннолетн|совершеннолетн"
        - "(?i)согласи[ея].*родител|согласи[ея].*законн[а-я]+\\s+представител"
        - "(?i)опекун|попечител"
        - "(?i)дееспособн|недееспособн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: урегулирован ли в тексте возраст
        и дееспособность арендатора-потребителя.

        Нормативный ориентир:
        - ст. 21 ГК РФ — полная дееспособность с 18 лет
        - ст. 26 ГК РФ — сделки несовершеннолетних 14–18 лет требуют
          письменного согласия законных представителей
        - ст. 28 ГК РФ — сделки малолетних (до 14 лет) совершают законные
          представители
        - ст. 29, 30 ГК РФ — ограничение дееспособности и признание
          недееспособным
        - ст. 25 ФЗ-196 — возрастные ограничения для управления ТС

        Важно:
        - Не оценивай серьёзность риска и не давай правовых выводов
          о действительности сделки.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В потребительском прокате возраст арендатора часто не урегулирован —
          это норма для взрослых арендаторов, но существенный риск для
          шеринга и проката спортинвентаря.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на возраст арендатора (минимальный возраст).
        2. Есть ли требование письменного согласия законных представителей
           для несовершеннолетних 14–18 лет.
        3. Есть ли требование действий законных представителей для малолетних
           (до 14 лет).
        4. Есть ли заверение арендатора о полной дееспособности.
        5. Есть ли проверка дееспособности (медицинская, судебная).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — возраст и дееспособность урегулированы:
        Фрагмент:
        "Арендатор подтверждает, что достиг 18-летнего возраста и является
        полностью дееспособным. При аренде несовершеннолетними в возрасте
        от 14 до 18 лет договор заключается с письменного согласия законных
        представителей. Для лиц младше 14 лет договор заключается законными
        представителями от имени несовершеннолетнего."

        Ответ:
        {
          "age_requirement_status": "defined",
          "age_requirement_details": "достиг 18-летнего возраста",
          "minor_consent_status": "defined",
          "minor_consent_details": "при аренде несовершеннолетними 14–18 лет договор заключается с письменного согласия законных представителей",
          "legal_representative_status": "defined",
          "legal_representative_details": "для лиц младше 14 лет договор заключается законными представителями",
          "capacity_confirmation_status": "defined",
          "capacity_confirmation_details": "полностью дееспособный",
          "capacity_verification_status": "not_defined",
          "capacity_verification_details": "Данные не определены",
          "age_capacity_summary": "Полностью урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Арендатор подтверждает, что достиг 18-летнего возраста и является полностью дееспособным."
            }
          ]
        }

        Пример 2 — возраст и дееспособность не урегулированы:
        Фрагмент:
        "Арендатор берёт предмет проката во временное пользование."

        Ответ:
        {
          "age_requirement_status": "not_defined",
          "age_requirement_details": "Данные не определены",
          "minor_consent_status": "not_defined",
          "minor_consent_details": "Данные не определены",
          "legal_representative_status": "not_defined",
          "legal_representative_details": "Данные не определены",
          "capacity_confirmation_status": "not_defined",
          "capacity_confirmation_details": "Данные не определены",
          "capacity_verification_status": "not_defined",
          "capacity_verification_details": "Данные не определены",
          "age_capacity_summary": "Не урегулировано (риск оспаривания сделки)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о возрасте арендатора.
        2. Найди прямую цитату о согласии законных представителей.
        3. Найди прямую цитату о действиях законных представителей.
        4. Найди прямую цитату о дееспособности.
        5. Найди прямую цитату о проверке дееспособности.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "age_requirement_status": "<defined / not_defined>",
          "age_requirement_details": "<текст или 'Данные не определены'>",
          "minor_consent_status": "<defined / not_defined>",
          "minor_consent_details": "<текст или 'Данные не определены'>",
          "legal_representative_status": "<defined / not_defined>",
          "legal_representative_details": "<текст или 'Данные не определены'>",
          "capacity_confirmation_status": "<defined / not_defined>",
          "capacity_confirmation_details": "<текст или 'Данные не определены'>",
          "capacity_verification_status": "<defined / not_defined>",
          "capacity_verification_details": "<текст или 'Данные не определены'>",
          "age_capacity_summary": "<'Полностью урегулировано' / 'Частично урегулировано' / 'Не урегулировано (риск оспаривания сделки)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возраст арендатора совершеннолетний несовершеннолетний согласие родителей законный представитель опекун попечитель дееспособность недееспособный ограниченно дееспособный с 18 лет с 14 лет"
      retrieval_profile: "capacity_and_age_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката недвижимость"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "tenant_age_and_capacity_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия,
        касающиеся возраста и дееспособности арендатора-потребителя:
        требование о возрасте, письменное согласие законных представителей
        для несовершеннолетних 14–18 лет, действия законных представителей
        для малолетних, заверение о полной дееспособности, проверка
        дееспособности.
        Не анализируй арендную плату, ремонт, субаренду или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tenant_age_and_capacity_check_presence:
           Агрегатное signal-поле — наличие регулирования по возрасту
           и дееспособности арендатора-потребителя.
           - "present" — если хотя бы одно из содержательных полей
             (age_requirement_status, minor_consent_status,
              legal_representative_status, capacity_confirmation_status,
              capacity_verification_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - age_requirement_status = "not_defined";
           - age_requirement_details = "Данные не определены";
           - minor_consent_status = "not_defined";
           - minor_consent_details = "Данные не определены";
           - legal_representative_status = "not_defined";
           - legal_representative_details = "Данные не определены";
           - capacity_confirmation_status = "not_defined";
           - capacity_confirmation_details = "Данные не определены";
           - capacity_verification_status = "not_defined";
           - capacity_verification_details = "Данные не определены";
           - age_capacity_summary = "Не урегулировано (риск оспаривания сделки)";
           - не выполняй остальные шаги.

        1. age_requirement_status — "defined" если минимальный возраст
           арендатора прямо указан, иначе "not_defined".
        2. age_requirement_details — формулировка о возрасте (например,
           «достиг 18-летнего возраста», «не моложе 21 года»).
           Если отсутствует — "Данные не определены".
        3. minor_consent_status — "defined" если требование письменного согласия
           законных представителей для несовершеннолетних 14–18 лет прямо
           указано, иначе "not_defined".
        4. minor_consent_details — формулировка о согласии законных
           представителей. Если отсутствует — "Данные не определены".
        5. legal_representative_status — "defined" если прямо указано, что
           для малолетних (до 14 лет) договор заключается законными
           представителями от их имени, иначе "not_defined".
        6. legal_representative_details — формулировка о действиях законных
           представителей. Если отсутствует — "Данные не определены".
        7. capacity_confirmation_status — "defined" если заверение арендатора
           о полной дееспособности прямо указано, иначе "not_defined".
        8. capacity_confirmation_details — формулировка о дееспособности.
           Если отсутствует — "Данные не определены".
        9. capacity_verification_status — "defined" если проверка дееспособности
           (медицинская, судебная, иная) прямо предусмотрена, иначе "not_defined".
        10. capacity_verification_details — формулировка о проверке
            дееспособности. Если отсутствует — "Данные не определены".
        11. age_capacity_summary — краткий user-friendly вывод:
            - "Полностью урегулировано" — если раскрыты все ключевые аспекты
              (возраст + согласие представителей + дееспособность);
            - "Частично урегулировано" — если раскрыто 2 из 3 аспектов;
            - "Не урегулировано (риск оспаривания сделки)" — если ни один
              аспект не раскрыт;
            - "Данные не определены" — если договор не содержит данных
              о сторонах.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - age_capacity_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни tenant_age_and_capacity_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", age_capacity_summary = "Не урегулировано (риск оспаривания сделки)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 21, 26,
          28, 29, 30 ГК РФ) вместо текста документа.
        - Не оценивай риски, не давай юридических выводов о действительности сделки.
        - age_requirement_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова о минимальном возрасте.
        - В потребительском прокате возраст часто не урегулирован — это норма
          для взрослых арендаторов, но существенный риск для шеринга.
        - Если фрагмент контекста не содержит данных о возрасте, согласии
          представителей, дееспособности или проверке дееспособности —
          игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле, разделе «Требования к Арендатору» или «Заверения».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни требований к возрасту, ни согласия законных
           представителей, ни заверений о дееспособности, ни проверки
           дееспособности (типичная ситуация для проката взрослому населению).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             age_capacity_summary = "Не урегулировано (риск оспаривания сделки)".

        2. Неполное раскрытие темы.
           Указано только требование о минимальном возрасте (18 лет), без
           согласия законных представителей, без действий представителей
           для малолетних и без заверений о дееспособности.
           → presence = "present";
             age_requirement_status = "defined";
             остальные статусы = "not_defined";
             age_capacity_summary = "Частично урегулировано".

        3. Противоречие между фрагментами.
           В одном пункте указано, что арендатор должен быть не моложе 18 лет,
           в другом — что допускается аренда с 14 лет с согласия родителей;
           конфликт нельзя снять по тексту.
           → presence = "unclear";
             age_requirement_status = "not_defined";
             age_requirement_details = "Не удалось определить";
             age_capacity_summary = "Данные не определены".

        4. Специфика темы: полное регулирование возраста и дееспособности.
           В тексте раскрыты все аспекты: возрастное требование, согласие
           законных представителей для несовершеннолетних 14–18 лет, действия
           законных представителей для малолетних, заверение о полной
           дееспособности.
           → presence = "present";
             age_requirement_status = "defined";
             minor_consent_status = "defined";
             legal_representative_status = "defined";
             capacity_confirmation_status = "defined";
             age_capacity_summary = "Полностью урегулировано".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tenant_age_and_capacity_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для age_capacity_summary используй только: "Полностью урегулировано",
          "Частично урегулировано", "Не урегулировано (риск оспаривания сделки)"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * age_requirement_details → "Данные не определены";
          * minor_consent_details → "Данные не определены";
          * legal_representative_details → "Данные не определены";
          * capacity_confirmation_details → "Данные не определены";
          * capacity_verification_details → "Данные не определены";
          * age_capacity_summary → "Не урегулировано (риск оспаривания сделки)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * age_capacity_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tenant_age_and_capacity_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по возрасту и дееспособности арендатора-потребителя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "age_requirement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования о минимальном возрасте."
          required: true

        - name: "age_requirement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Возрастные требования"
          description: "Формулировка о минимальном возрасте арендатора."
          required: false

        - name: "minor_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласия законных представителей для 14–18 лет."
          required: true

        - name: "minor_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласие законных представителей"
          description: "Формулировка о письменном согласии законных представителей для несовершеннолетних 14–18 лет."
          required: false

        - name: "legal_representative_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус действий законных представителей для малолетних."
          required: true

        - name: "legal_representative_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Действия законных представителей"
          description: "Формулировка о заключении договора законными представителями для лиц младше 14 лет."
          required: false

        - name: "capacity_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения о полной дееспособности."
          required: true

        - name: "capacity_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Заверение о дееспособности"
          description: "Формулировка о полной дееспособности арендатора."
          required: false

        - name: "capacity_verification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус проверки дееспособности."
          required: true

        - name: "capacity_verification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Проверка дееспособности"
          description: "Формулировка о проверке дееспособности (медицинская, судебная, иная) (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "age_capacity_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Возраст и дееспособность"
          description: "Компактный статус регулирования возраста и дееспособности арендатора-потребителя."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: кто выступает профессиональным арендодателем,
      на каком основании он осуществляет деятельность по прокату, а также реквизиты арендатора.
    addressee: "Арендодатель / Юридический советник"

  rental_subject_and_consumer_purpose_extraction:
    text: >
      Просим предоставить по {doc_names}: описание предмета проката, срок,
      твердую стоимость проката, наличие залога/депозита и подтверждение,
      что использование имеет бытовой/потребительский характер.
    addressee: "Арендодатель"

  consumer_purpose_declaration:
    text: >
      Просим уточнить в {doc_names}, что имущество предоставляется именно
      для личных, семейных, бытовых нужд, а не для предпринимательской деятельности.
    addressee: "Юридический советник"

  movable_property_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный/инвентарный номер,
      комплектность и состояние имущества на момент выдачи.
    addressee: "Арендодатель"

  fixed_rent_payment:
    text: >
      Просим подтвердить в {doc_names}: размер платы в твердой сумме,
      единицу тарификации (час/сутки/день), порядок оплаты и возврата части платы
      при досрочном возврате.
    addressee: "Арендодатель / Финансовый консультант"

  term_limitation_one_year:
    text: >
      Просим уточнить в {doc_names}: срок проката и подтвердить,
      что он не выходит за пределы специального режима договора проката.
    addressee: "Юридический советник"

  public_contract_status_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор публичным,
      применяются ли единые условия для всех потребителей и в какой форме
      опубликована оферта/типовые условия.
    addressee: "Юридический советник"

  public_contract_declaration:
    text: >
      Просим включить в {doc_names} прямое указание на публичный характер договора
      и единые условия для всех обратившихся потребителей.
    addressee: "Юридический советник арендодателя"

  unilateral_termination_consumer_check:
    text: >
      Просим уточнить в {doc_names}: право арендатора на отказ в любое время,
      порядок уведомления, перерасчет платы и возврат денежных средств
      за неиспользованный период.
    addressee: "Юридический советник"

  fitness_and_instruction_check:
    text: >
      Просим предоставить по {doc_names}: порядок проверки исправности имущества,
      форму подтверждения инструктажа, правила эксплуатации и safety rules.
    addressee: "Арендодатель"

  fitness_warranty_and_safety_briefing:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность арендодателя
      проверить исправность имущества, провести инструктаж и ознакомить
      арендатора с правилами эксплуатации и техники безопасности.
    addressee: "Юридический советник арендодателя"

  repairs_obligation_check:
    text: >
      Просим уточнить в {doc_names}: что капитальный и текущий ремонт,
      а также устранение недостатков и замена неисправного имущества
      осуществляются за счет арендодателя.
    addressee: "Юридический советник"

  all_repairs_by_lessor:
    text: >
      Просим привести в {doc_names} блок ремонта в соответствие со ст. 631 ГК РФ
      и исключить возложение ремонтных обязанностей на арендатора.
    addressee: "Юридический советник арендодателя"

  sublease_and_personal_use_check:
    text: >
      Просим уточнить в {doc_names}: запрет субаренды, передачи вещи третьим лицам
      и подтверждение личного характера использования имущества.
    addressee: "Юридический советник"

  absolute_prohibition_of_sublease:
    text: >
      Просим включить в {doc_names} прямой запрет субаренды, перенаема
      и передачи имущества третьим лицам.
    addressee: "Юридический советник арендодателя"

  deposit_and_damage_liability_check:
    text: >
      Просим уточнить в {doc_names}: режим депозита/залога, основания удержания,
      порядок возврата, ответственность за утрату/повреждение и исключение
      нормального износа из зоны ответственности арендатора.
    addressee: "Арендодатель / Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита, основание его удержания,
      сроки возврата и порядок документального подтверждения повреждений.
    addressee: "Юридический советник"

  clear_liability_for_damage:
    text: >
      Просим уточнить в {doc_names}: как определяется размер ответственности
      арендатора за повреждение или утрату имущества (ремонт / полная стоимость / market value).
    addressee: "Юридический советник"

  normal_wear_and_tear_exclusion:
    text: >
      Просим включить в {doc_names} прямое указание, что арендатор не отвечает
      за нормальный (естественный) износ имущества при надлежащем использовании.
    addressee: "Юридический советник"

  consumer_law_application:
    text: >
      Просим уточнить в {doc_names}: применение Закона о защите прав потребителей,
      исключить unfair terms и раскрыть все дополнительные платные услуги
      (страховка, допоборудование, комиссии).
    addressee: "Юридический советник / Compliance"

  breakdown_emergency_procedure_check:
    text: >
      Просим уточнить в {doc_names}: порядок действий при поломке,
      экстренный контакт, запрет на самостоятельный ремонт и порядок замены вещи.
    addressee: "Арендодатель / Юридический советник"

  breakdown_emergency_procedure:
    text: >
      Просим включить в {doc_names}: emergency procedure на случай поломки
      или аварийной ситуации, включая обязанность немедленного уведомления арендодателя.
    addressee: "Юридический советник арендодателя"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      а также consumer-specific forum aspects, если применимо.
    addressee: "Юридический советник"

  commercial_use_reclassification_risk:
    text: >
      Внимание: {doc_names} содержит признаки использования имущества
      для предпринимательских целей. Просим проверить корректность квалификации
      договора и, при необходимости, перевести документ в режим общей аренды.
    addressee: "Юридический советник"

  term_over_one_year_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить, не превышает ли срок проката
      пределы специального режима договора проката. Просим дать квалификационное заключение.
    addressee: "Юридический советник"

  consumer_law_mandatory_context:
    text: >
      Внимание: {doc_names} подпадает под consumer-law контекст.
      Просим проверить текст на unfair terms, навязывание дополнительных услуг,
      ограничения права на отказ и возврат денежных средств.
    addressee: "Юридический советник / Compliance"

  return_procedure_and_condition_check:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета проката —
      допустимое состояние (нормальный износ vs повреждения), метод оценки
      (сравнение с актом выдачи, фото), комплектность, место и время возврата,
      штрафы за просрочку, порядок удержания из депозита.
    addressee: "Арендодатель / Юридический советник"

  return_conditions_and_penalties:
    text: >
      В {doc_names} не урегулированы условия возврата имущества. Просим включить:
      порядок приёмки при возврате, стандарт допустимого состояния, санкции
      за просрочку (неустойка за каждый день/час), место возврата, порядок
      фиксации повреждений.
    addressee: "Юридический советник арендодателя"

  issuance_act_receipt:
    text: >
      Просим включить в {doc_names}: акт выдачи / квитанцию с фиксацией
      состояния имущества, комплектности и внешнего вида при передаче арендатору.
      Это необходимо для объективного сравнения при возврате.
    addressee: "Юридический советник арендодателя"

  personal_data_consent:
    text: >
      Просим включить в {doc_names}: согласие арендатора на обработку
      персональных данных (ФЗ-152), цели обработки, перечень данных,
      сроки хранения и порядок отзыва согласия.
    addressee: "Юридический советник / Compliance"

  age_restrictions:
    text: >
      Просим уточнить в {doc_names}: возрастные ограничения для арендатора,
      порядок проверки возраста, необходимость согласия законных представителей
      для несовершеннолетних (если допускается).
    addressee: "Юридический советник арендодателя"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
