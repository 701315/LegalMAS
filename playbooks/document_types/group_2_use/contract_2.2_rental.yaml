        - name: "current_repairs_allocation"
          type: "string"
          presentation: "signal"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          description: "Кто несёт обязанность по текущему ремонту (raw enum)."
          required: true
          display_in_grid: false
        - name: "current_repairs_details"
          type: "string"
          presentation: "fact"
          label: "Текущий ремонт"
          description: "Формулировка о текущем ремонте (по ст. 631 ГК РФ — обязанность арендодателя)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "defect_remedy_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об устранении недостатков."
          required: true
