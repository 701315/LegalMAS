  - id: rental_subject_and_consumer_purpose_extraction
    name: "Предмет проката, срок, плата и потребительская цель использования"
    description: >
      Фактографическая проверка наличия в договоре проката описания предмета,
      срока проката, размера платы, потребительской цели использования
      и обеспечительного платежа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "прокат"
        - "предмет проката"
        - "бытовые нужды"
        - "потребительские цели"
        - "арендная плата"
        - "срок проката"
        - "марка"
        - "модель"
        - "серийный номер"
        - "залог"
        - "обеспечительный платеж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
        - "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется один вопрос: предмет проката, срок, плата,
        потребительская цель использования и обеспечительный платёж.

        Нормативный ориентир:
        - ст. 626 ГК РФ — предмет проката, потребительская цель
        - ст. 627 ГК РФ — срок проката не более одного года
        - ст. 630 ГК РФ — арендная плата в виде определённых в твёрдой сумме платежей

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой предмет проката указан (описание, марка, модель).
        2. Какой тип предмета проката.
        3. Есть ли индивидуализирующие признаки предмета (серийный номер, IMEI, VIN).
        4. Есть ли указание на потребительскую цель использования.
        5. Какой срок проката установлен.
        6. Какой размер платы за прокат.
        7. Есть ли обеспечительный платёж / залог / депозит.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай статус "not_defined".
        3. Для текстовых полей (*_value, *_details, *_display) не используй
           "None", "null" или пустые строки — возвращай "Данные не определены".
        4. Для статусов и enum-полей допустимо значение "not_defined".
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все данные определены:
        Фрагмент:
        "Арендодатель передаёт Арендатору во временное пользование
        для бытовых нужд электросамокат Xiaomi Mi Pro 2, серийный номер
        SN12345678, сроком на 3 суток. Арендная плата — 500 рублей в сутки.
        Обеспечительный платёж — 5 000 рублей, возвращается при возврате
        имущества в исправном состоянии."

        Ответ:
        {
          "rental_item_status": "defined",
          "rental_item_value": "электросамокат Xiaomi Mi Pro 2",
          "item_type": "scooter",
          "item_type_display": "Электросамокат",
          "identifying_features_status": "defined",
          "identifying_features_value": "SN12345678",
          "consumer_purpose_status": "defined",
          "consumer_purpose_details": "для бытовых нужд",
          "rental_term_status": "defined",
          "rental_term_value": "3 суток",
          "rental_fee_status": "defined",
          "rental_fee_value": "500 рублей в сутки",
          "deposit_status": "defined",
          "deposit_details": "5 000 рублей, возвращается при возврате имущества в исправном состоянии",
          "deposit_display": "5 000 ₽",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Арендодатель передаёт Арендатору во временное пользование для бытовых нужд электросамокат Xiaomi Mi Pro 2, серийный номер SN12345678, сроком на 3 суток."
            },
            {
              "clause_ref": "п. 3.1",
              "quote": "Арендная плата — 500 рублей в сутки."
            },
            {
              "clause_ref": "п. 3.3",
              "quote": "Обеспечительный платёж — 5 000 рублей, возвращается при возврате имущества в исправном состоянии."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "rental_item_status": "not_defined",
          "rental_item_value": "Данные не определены",
          "item_type": "not_defined",
          "item_type_display": "Данные не определены",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Данные не определены",
          "consumer_purpose_status": "not_defined",
          "consumer_purpose_details": "Данные не определены",
          "rental_term_status": "not_defined",
          "rental_term_value": "Данные не определены",
          "rental_fee_status": "not_defined",
          "rental_fee_value": "Данные не определены",
          "deposit_status": "not_defined",
          "deposit_details": "Данные не определены",
          "deposit_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием предмета проката.
        2. Найди прямую цитату о потребительской цели.
        3. Найди прямую цитату о сроке проката.
        4. Найди прямую цитату о размере платы.
        5. Найди прямую цитату о залоге / депозите / обеспечительном платеже.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rental_item_status": "<defined / not_defined>",
          "rental_item_value": "<текст или 'Данные не определены'>",
          "item_type": "<equipment / tool / scooter / bicycle / costume / consumer_item / other / not_defined>",
          "item_type_display": "<'Оборудование' / 'Инструмент' / 'Электросамокат' / 'Велосипед' / 'Одежда/костюм' / 'Бытовой предмет' / 'Иное' / 'Данные не определены'>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<серийный номер / IMEI / VIN или 'Данные не определены'>",
          "consumer_purpose_status": "<defined / not_defined>",
          "consumer_purpose_details": "<текст или 'Данные не определены'>",
          "rental_term_status": "<defined / not_defined>",
          "rental_term_value": "<текст или 'Данные не определены'>",
          "rental_fee_status": "<defined / not_defined>",
          "rental_fee_value": "<текст или 'Данные не определены'>",
          "deposit_status": "<defined / not_defined>",
          "deposit_details": "<текст или 'Данные не определены'>",
          "deposit_display": "<краткая сумма или 'Не предусмотрен' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "rent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прокат предмет проката бытовые нужды потребительские цели арендная плата срок проката марка модель серийный номер залог обеспечительный платёж депозит"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "ремонт"
        - "субаренда"
        - "возврат имущества"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "rental_subject_and_consumer_purpose_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката предмет,
        его тип и идентифицирующие признаки, срок, плату, потребительскую
        цель использования и обеспечительный платёж (залог, депозит).
        Не анализируй ремонт, возврат, субаренду, споры или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rental_subject_and_consumer_purpose_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме предмета
           проката, срока, платы и потребительской цели использования.
           - "present" — если хотя бы одно из содержательных полей
             находится в «информативном» состоянии:
             rental_item_status = "defined" ИЛИ
             item_type ≠ "not_defined" ИЛИ
             identifying_features_status = "defined" ИЛИ
             consumer_purpose_status = "defined" ИЛИ
             rental_term_status = "defined" ИЛИ
             rental_fee_status = "defined" ИЛИ
             deposit_status = "defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rental_item_status = "not_defined";
           - rental_item_value = "Данные не определены";
           - item_type = "not_defined";
           - item_type_display = "Данные не определены";
           - identifying_features_status = "not_defined";
           - identifying_features_value = "Данные не определены";
           - consumer_purpose_status = "not_defined";
           - consumer_purpose_details = "Данные не определены";
           - rental_term_status = "not_defined";
           - rental_term_value = "Данные не определены";
           - rental_fee_status = "not_defined";
           - rental_fee_value = "Данные не определены";
           - deposit_status = "not_defined";
           - deposit_details = "Данные не определены";
           - deposit_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. rental_item_status — "defined" если предмет проката прямо описан,
           иначе "not_defined".
        2. rental_item_value — описание предмета проката (наименование, марка,
           модель). Если отсутствует — "Данные не определены".
        3. item_type — "equipment" / "tool" / "scooter" / "bicycle" / "costume" /
           "consumer_item" / "other" / "not_defined".
        4. item_type_display — user-friendly формулировка типа предмета:
           - "Оборудование" — если item_type = "equipment";
           - "Инструмент" — если item_type = "tool";
           - "Электросамокат" — если item_type = "scooter";
           - "Велосипед" — если item_type = "bicycle";
           - "Одежда/костюм" — если item_type = "costume";
           - "Бытовой предмет" — если item_type = "consumer_item";
           - "Иное" — если item_type = "other";
           - "Данные не определены" — если item_type = "not_defined".
        5. identifying_features_status — "defined" если индивидуализирующие
           признаки прямо указаны, иначе "not_defined".
        6. identifying_features_value — серийный номер, IMEI, VIN, инвентарный
           номер и т.п. Если отсутствуют — "Данные не определены".
        7. consumer_purpose_status — "defined" если потребительская цель прямо
           указана, иначе "not_defined".
        8. consumer_purpose_details — формулировка о потребительской / бытовой
           цели из текста договора. Если отсутствует — "Данные не определены".
        9. rental_term_status — "defined" если срок прямо указан,
           иначе "not_defined".
        10. rental_term_value — срок проката (например, "3 суток", "11 месяцев").
            Если отсутствует — "Данные не определены".
        11. rental_fee_status — "defined" если плата прямо указана,
            иначе "not_defined".
        12. rental_fee_value — размер и периодичность платы за прокат
            (например, "500 рублей в сутки"). Если отсутствует —
            "Данные не определены".
        13. deposit_status — "defined" если залог / депозит / обеспечительный
            платёж прямо предусмотрен, иначе "not_defined".
        14. deposit_details — размер и условия залога / депозита из текста
            договора. Если отсутствует — "Данные не определены".
        15. deposit_display — краткое user-friendly значение:
            - "<сумма> ₽" — если обеспечительный платёж указан
              (например, "5 000 ₽");
            - "Не предусмотрен" — если в договоре прямо указано, что
              залог/депозит не требуется;
            - "Данные не определены" — если вопрос не урегулирован.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - соответствующий *_display → "Данные не определены"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни rental_subject_and_consumer_purpose_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_value/*_details/*_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо
          текста договора.
        - Не оценивай риски, не давай юридических выводов.
        - item_type:
            - "equipment" — оборудование, техника (фотоаппарат, проектор и т.п.).
            - "tool" — инструмент (дрель, перфоратор и т.п.).
            - "scooter" — самокат, электросамокат, гироскутер.
            - "bicycle" — велосипед.
            - "costume" — костюм, одежда, карнавальный наряд.
            - "consumer_item" — иной бытовой предмет (коляска, палатка и т.п.).
            - "other" — иной объект, не подходящий под категории выше.
            - "not_defined" — тип не определён из текста.
        - consumer_purpose_status = "defined" только если потребительская /
          бытовая / личная цель прямо указана в тексте договора. Отсутствие
          указания ≠ "defined".
        - deposit_display: извлекай только числовую сумму. Не копируй длинные
          условия возврата — они остаются в deposit_details.
        - Если фрагмент контекста не содержит данных о предмете, сроке, плате,
          цели использования или залоге — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Предмет договора» или «Порядок расчётов».
        - Не смешивай данные о предмете проката с данными о залоге.
        - Если плата определена по прайс-листу / тарифам / приложению —
          укажи это в rental_fee_value (например, "Согласно Приложению №1").
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни предмета проката, ни его типа, ни срока, ни платы,
           ни потребительской цели, ни обеспечительного платежа.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_value/*_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы (generic-clause ловушка).
           «Имущество передаётся во временное пользование за плату»
           без указания конкретного предмета, срока и размера платы.
           → presence = "present";
             rental_item_status = "not_defined";
             rental_term_status = "not_defined";
             rental_fee_status = "not_defined";
             все *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки, размеры платы
           или разные описания предмета, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Специфика темы: срок больше года.
           В тексте прямо указан срок проката более одного года
           (например, «сроком на 18 месяцев»), что противоречит ст. 627
           ГК РФ (предел — 1 год).
           → presence = "present";
             rental_term_status = "defined";
             rental_term_value = "18 месяцев".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rental_subject_and_consumer_purpose_extraction_presence используй только: "present", "missing", "unclear".
        - Для item_type используй только: "equipment", "tool", "scooter",
          "bicycle", "costume", "consumer_item", "other" или "not_defined".
        - Для item_type_display используй только: "Оборудование", "Инструмент",
          "Электросамокат", "Велосипед", "Одежда/костюм", "Бытовой предмет",
          "Иное" или "Данные не определены".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * rental_item_value → "Данные не определены";
          * identifying_features_value → "Данные не определены";
          * consumer_purpose_details → "Данные не определены";
          * rental_term_value → "Данные не определены";
          * rental_fee_value → "Данные не определены";
          * deposit_details / deposit_display → "Данные не определены";
          * item_type_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_value/*_details → "Не удалось определить";
          * соответствующий *_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rental_subject_and_consumer_purpose_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету проката, срока, платы и потребительской цели. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rental_item_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания предмета проката."
          required: true

        - name: "rental_item_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Предмет проката"
          description: "Описание предмета проката (наименование, марка, модель)."
          required: true

        - name: "item_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["equipment", "tool", "scooter", "bicycle", "costume", "consumer_item", "other", "not_defined"]
          display_in_grid: false
          description: "Тип предмета проката (raw enum)."
          required: true

        - name: "item_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип предмета"
          description: "User-friendly формулировка типа предмета проката."
          required: false

        - name: "identifying_features_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания идентифицирующих признаков."
          required: true

        - name: "identifying_features_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Идентификаторы предмета"
          description: "Серийный номер, IMEI, VIN, инвентарный номер и т.п."
          required: false

        - name: "consumer_purpose_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания потребительской цели."
          required: true

        - name: "consumer_purpose_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Цель использования"
          description: "Формулировка о потребительской / бытовой цели использования (квалифицирующий признак проката по ст. 626 ГК РФ)."
          required: false

        - name: "rental_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока проката."
          required: true

        - name: "rental_term_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Срок проката"
          description: "Срок проката (не более 1 года по ст. 627 ГК РФ)."
          required: false

        - name: "rental_fee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания платы за прокат."
          required: true

        - name: "rental_fee_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Плата за прокат"
          description: "Размер и периодичность платы за прокат (твёрдая сумма по ст. 630 ГК РФ)."
          required: false

        - name: "deposit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия залога / депозита / обеспечительного платежа."
          required: true

        - name: "deposit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения об обеспечительном платеже"
          description: "Полный текст условий залога / депозита / обеспечительного платежа (скрыт из Grid, доступен в drawer)."
          required: false

        - name: "deposit_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Обеспечительный платёж"
          description: "Краткое user-friendly значение обеспечительного платежа / залога / депозита."
          required: false
      store_payload: true

  - id: public_contract_status_check
    name: "Публичный характер договора проката (ст. 426, 626 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте указания на публичный характер
      договора, единые условия для потребителей и отсутствие дискриминационного
      отказа в заключении договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "публичный договор"
        - "публичная оферта"
        - "единые условия для всех"
        - "каждый обратившийся"
        - "пункт проката"
        - "ст. 426"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)публичн(ый|ого)\\s+договор"
        - "(?i)публичн(ая|ой)\\s+оферт"
        - "(?i)кажд(ый|ому)\\s+обративш"
        - "(?i)ст(?:атья|\\.)?\\s*426"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: раскрыт ли публичный характер договора.

        Нормативный ориентир:
        - ст. 426 ГК РФ — публичный договор
        - ст. 626 ГК РФ — договор проката как публичный договор

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.
        - Договор проката является публичным в силу закона (ст. 626 ГК РФ),
          но в DD важно установить, раскрыто ли это в тексте документа.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на публичный характер договора.
        2. Есть ли ссылка на ст. 426 ГК РФ.
        3. Есть ли указание на единые условия для всех потребителей.
        4. Есть ли формулировка о доступности для каждого обратившегося.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй
           "None", "null" или пустые строки — возвращай "Данные не определены".
        5. Для статусов и enum-полей допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — публичный характер раскрыт:
        Фрагмент:
        "Настоящий договор является публичным договором в соответствии
        со ст. 426 ГК РФ. Арендодатель обязуется заключить договор
        с каждым обратившимся на единых условиях."

        Ответ:
        {
          "public_contract_status": "defined",
          "public_contract_details": "является публичным договором в соответствии со ст. 426 ГК РФ",
          "public_contract_display": "Публичный (ст. 426 ГК РФ)",
          "st426_reference_status": "defined",
          "st426_reference_details": "ст. 426 ГК РФ",
          "uniform_terms_status": "defined",
          "uniform_terms_details": "заключить договор с каждым обратившимся на единых условиях",
          "open_access_status": "defined",
          "open_access_details": "с каждым обратившимся",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящий договор является публичным договором в соответствии со ст. 426 ГК РФ. Арендодатель обязуется заключить договор с каждым обратившимся на единых условиях."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "public_contract_status": "not_defined",
          "public_contract_details": "Данные не определены",
          "public_contract_display": "Не раскрыт в тексте",
          "st426_reference_status": "not_defined",
          "st426_reference_details": "Данные не определены",
          "uniform_terms_status": "not_defined",
          "uniform_terms_details": "Данные не определены",
          "open_access_status": "not_defined",
          "open_access_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о публичном характере договора.
        2. Найди прямую ссылку на ст. 426 ГК РФ.
        3. Найди прямую цитату о единых условиях.
        4. Найди прямую цитату о доступности для всех.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "public_contract_status": "<defined / not_defined>",
          "public_contract_details": "<текст или 'Данные не определены'>",
          "public_contract_display": "<'Публичный (ст. 426 ГК РФ)' / 'Публичный' / 'Не раскрыт в тексте' / 'Данные не определены'>",
          "st426_reference_status": "<defined / not_defined>",
          "st426_reference_details": "<текст или 'Данные не определены'>",
          "uniform_terms_status": "<defined / not_defined>",
          "uniform_terms_details": "<текст или 'Данные не определены'>",
          "open_access_status": "<defined / not_defined>",
          "open_access_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "публичный договор публичная оферта единые условия каждый обратившийся пункт проката ст. 426"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет проката"
        - "арендная плата"
        - "ремонт"
        - "возврат"
        - "депозит"
        - "субаренда"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "public_contract_status_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката формулировки
        о публичном характере договора, ссылку на ст. 426 ГК РФ, единые условия
        и доступность для каждого обратившегося.
        Не анализируй предмет проката, плату, ремонт, возврат или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. public_contract_status_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме публичного
           характера договора.
           - "present" — если хотя бы одно из содержательных полей
             (public_contract_status, st426_reference_status,
              uniform_terms_status, open_access_status) = "defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - public_contract_status = "not_defined";
           - public_contract_details = "Данные не определены";
           - public_contract_display = "Не раскрыт в тексте";
           - st426_reference_status = "not_defined";
           - st426_reference_details = "Данные не определены";
           - uniform_terms_status = "not_defined";
           - uniform_terms_details = "Данные не определены";
           - open_access_status = "not_defined";
           - open_access_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. public_contract_status — "defined" если публичный характер прямо
           указан в тексте договора, иначе "not_defined".
        2. public_contract_details — формулировка о публичном характере из
           текста договора. Если отсутствует — "Данные не определены".
        3. public_contract_display — краткое user-friendly значение:
           - "Публичный (ст. 426 ГК РФ)" — если прямо указан публичный
             характер И есть ссылка на ст. 426 ГК РФ;
           - "Публичный" — если публичный характер указан, но без ссылки
             на ст. 426 ГК РФ;
           - "Не раскрыт в тексте" — если прямого указания нет (договор
             проката является публичным в силу закона, но текст этого
             не раскрывает);
           - "Данные не определены" — если контекст не содержит данных
             о договоре вообще.
        4. st426_reference_status — "defined" если ссылка на ст. 426 ГК РФ
           есть в тексте, иначе "not_defined".
        5. st426_reference_details — формулировка ссылки. Если отсутствует —
           "Данные не определены".
        6. uniform_terms_status — "defined" если единые условия для всех
           потребителей прямо указаны, иначе "not_defined".
        7. uniform_terms_details — формулировка. Если отсутствует —
           "Данные не определены".
        8. open_access_status — "defined" если доступность для каждого
           обратившегося прямо указана, иначе "not_defined".
        9. open_access_details — формулировка. Если отсутствует —
           "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - public_contract_display = "Не раскрыт в тексте".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни public_contract_status_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", public_contract_display = "Не раскрыт в тексте".
        - Используй только текст договора. Не подставляй нормы закона вместо
          текста договора.
        - Не оценивай риски, не давай юридических выводов.
        - public_contract_status = "defined" только если публичный характер
          прямо указан в тексте; не выводи из факта, что это договор проката.
        - st426_reference_status = "defined" только при явной ссылке
          на ст. 426 (например, "ст. 426 ГК РФ", "статья 426").
        - uniform_terms_status = "defined" только при явном указании
          на единые/одинаковые условия для всех/каждого потребителя.
        - open_access_status = "defined" только при явном указании
          на обязанность заключить договор с каждым обратившимся.
        - Если фрагмент контекста не содержит данных о публичном характере
          договора — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что
          находится в преамбуле или разделе «Общие положения».
        - Не путай указание на публичный характер с общими формулировками
          о «свободе договора» (ст. 421 ГК РФ) — это разные вещи.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни квалификации договора как публичного, ни ссылки
           на ст. 426 ГК РФ, ни единых условий, ни доступности для каждого
           обратившегося.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             public_contract_display = "Не раскрыт в тексте".

        2. Неполное раскрытие темы.
           Публичный характер прямо указан, но без ссылки на ст. 426 ГК РФ.
           → presence = "present";
             public_contract_status = "defined";
             public_contract_display = "Публичный";
             st426_reference_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что договор является публичным,
           в другом — что стороны свободны в определении условий (отсылка
           к ст. 421 ГК РФ без упоминания публичности), и конфликт нельзя
           снять по тексту.
           → presence = "unclear";
             public_contract_status = "not_defined";
             public_contract_details = "Не удалось определить";
             public_contract_display = "Не раскрыт в тексте".

        4. Специфика темы: generic-clause ловушка.
           «Арендодатель предоставляет имущество на общих для всех условиях»
           без слов «публичный», «каждый обратившийся», «публичная оферта».
           → presence = "missing";
             все статусы = "not_defined";
             public_contract_display = "Не раскрыт в тексте".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для public_contract_status_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для public_contract_display используй только: "Публичный (ст. 426 ГК РФ)",
          "Публичный", "Не раскрыт в тексте" или "Данные не определены".
        - Fallback при отсутствии данных:
          * public_contract_details → "Данные не определены";
          * st426_reference_details → "Данные не определены";
          * uniform_terms_details → "Данные не определены";
          * open_access_details → "Данные не определены";
          * public_contract_display → "Не раскрыт в тексте".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * public_contract_display → "Не раскрыт в тексте".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "public_contract_status_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие указания на публичный характер договора проката. Внутреннее агрегатное signal-поле."
          required: true

        - name: "public_contract_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на публичный характер договора."
          required: true

        - name: "public_contract_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения о публичном договоре"
          description: "Полная формулировка о публичном характере договора из текста (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "public_contract_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Публичный характер"
          description: "Краткое user-friendly значение: раскрыт ли публичный характер договора проката в тексте (ст. 426, 626 ГК РФ)."
          required: false

        - name: "st426_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на ст. 426 ГК РФ."
          required: true

        - name: "st426_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ссылка на ст. 426 ГК РФ"
          description: "Формулировка ссылки на ст. 426 ГК РФ (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "uniform_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на единые условия."
          required: true

        - name: "uniform_terms_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения об одинаковых условиях"
          description: "Формулировка о единых условиях для потребителей (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "open_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус доступности для каждого обратившегося."
          required: true

        - name: "open_access_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Публичный доступ к условиям"
          description: "Формулировка о доступности для каждого обратившегося (скрыта из Grid, доступна в drawer)."
          required: false
      store_payload: true

  - id: unilateral_termination_consumer_check
    name: "Право арендатора на досрочный отказ и перерасчёт платы (ст. 627 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте права арендатора на односторонний
      отказ от договора проката, досрочный возврат имущества, перерасчёт платы
      и срок уведомления.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вправе отказаться в любое время"
        - "односторонний отказ"
        - "досрочный возврат имущества"
        - "перерасчет"
        - "возврат части платы"
        - "уведомление за"
        - "не менее чем за"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арендатор.*вправе.*отказаться"
        - "(?i)досрочн(ый|ого)\\s+возврат"
        - "(?i)перерасчет|перерасчёт"
        - "(?i)уведомлени(е|я).*за\\s+\\d+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: право арендатора на досрочный отказ
        от договора, перерасчёт платы, досрочный возврат имущества и ограничения
        права на отказ.

        Нормативный ориентир:
        - ст. 627 ГК РФ — арендатор вправе в любое время отказаться от договора
          проката, предупредив арендодателя не менее чем за 10 дней. Это императивная
          норма. Любые ограничения права на отказ (штрафы, минимальный срок,
          невозвратный аванс) являются ничтожными (ст. 16 ЗоЗПП, ст. 627 ГК РФ).

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право арендатора на односторонний отказ от договора.
        2. Какой срок уведомления об отказе.
        3. Есть ли условие о перерасчёте / возврате части платы при досрочном
           возврате имущества.
        4. Есть ли условие о досрочном возврате имущества.
        5. Есть ли ограничения права на отказ, противоречащие ст. 627 ГК РФ
           (например, "не ранее чем через месяц", "комиссия за отказ" и т.п.).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_value, *_display) не используй
           "None", "null" или пустые строки — возвращай "Данные не определены".
        5. Для статусов и enum-полей допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право на отказ урегулировано, ограничений нет:
        Фрагмент:
        "Арендатор вправе в любое время отказаться от настоящего договора,
        уведомив Арендодателя не менее чем за 10 дней. При досрочном возврате
        имущества Арендодатель возвращает часть арендной платы за неиспользованный
        период."

        Ответ:
        {
          "termination_right_status": "defined",
          "termination_right_details": "Арендатор вправе в любое время отказаться от настоящего договора, уведомив Арендодателя не менее чем за 10 дней",
          "notice_period_status": "defined",
