  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Максимальный срок проката
  # ──────────────────────────────────────────────────────────────────────────
  - id: rental_max_term_check
    name: "Максимальный срок проката и соответствие ст. 627 ГК РФ"
    description: >
      Фактографическая проверка наличия в тексте срока проката, его соответствия
      максимальному пределу в 1 год (ст. 627 ГК РФ), а также указания
      на невозможность возобновления на неопределённый срок и отсутствие
      преимущественного права арендатора на заключение нового договора.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок проката"
        - "срок аренды"
        - "не более одного года"
        - "не более 12 месяцев"
        - "максимальный срок"
        - "возобновление"
        - "на неопределённый срок"
        - "преимущественное право"
        - "ст. 627"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+(проката|аренды)"
        - "(?i)не\\s+более\\s+(одного\\s+года|12\\s+месяцев|1\\s+года)"
        - "(?i)на\\s+неопределённый\\s+срок"
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)ст(?:атья|\\.)?\\s*627"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: срок проката и его соответствие
        императивным ограничениям.

        Нормативный ориентир:
        - ст. 627 ГК РФ:
          - срок проката не может превышать одного года
          - правила о возобновлении на неопределённый срок не применяются
          - арендатор не имеет преимущественного права на заключение нового договора

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой срок проката установлен.
        2. Есть ли ссылка на максимальный предел в 1 год.
        3. Есть ли условие о возобновлении / пролонгации.
        4. Есть ли указание на преимущественное право арендатора.
        5. Есть ли ссылка на ст. 627 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок указан:
        Фрагмент:
        "Срок проката составляет 30 суток с даты подписания акта выдачи.
        В соответствии со ст. 627 ГК РФ преимущественное право арендатора
        на заключение нового договора не применяется."

        Ответ:
        {
          "rental_term_status": "defined",
          "rental_term_details": "30 суток с даты подписания акта выдачи",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "not_defined",
          "renewal_clause_details": "Данные не определены",
          "preemptive_right_status": "defined",
          "preemptive_right_details": "преимущественное право арендатора на заключение нового договора не применяется",
          "st627_reference_status": "defined",
          "st627_reference_details": "ст. 627 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Срок проката составляет 30 суток с даты подписания акта выдачи."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор проката."

        Ответ:
        {
          "rental_term_status": "not_defined",
          "rental_term_details": "Данные не определены",
          "max_term_reference_status": "not_defined",
          "max_term_reference_details": "Данные не определены",
          "renewal_clause_status": "not_defined",
          "renewal_clause_details": "Данные не определены",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "st627_reference_status": "not_defined",
          "st627_reference_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке проката.
        2. Найди прямую цитату о максимальном пределе.
        3. Найди прямую цитату о возобновлении / пролонгации.
        4. Найди прямую цитату о преимущественном праве.
        5. Найди прямую ссылку на ст. 627 ГК РФ.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "rental_term_status": "<defined / not_defined>",
          "rental_term_details": "<текст или 'Данные не определены'>",
          "max_term_reference_status": "<defined / not_defined>",
          "max_term_reference_details": "<текст или 'Данные не определены'>",
          "renewal_clause_status": "<defined / not_defined>",
          "renewal_clause_details": "<текст или 'Данные не определены'>",
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Данные не определены'>",
          "st627_reference_status": "<defined / not_defined>",
          "st627_reference_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок проката срок аренды не более одного года не более 12 месяцев максимальный срок возобновление на неопределённый срок преимущественное право ст. 627"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "депозит"
        - "возврат имущества"
        - "субаренда"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката срок проката,
        ссылку на максимальный предел, условия возобновления, преимущественное
        право и ссылку на ст. 627 ГК РФ.
        Не анализируй плату, ремонт, депозит или возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. rental_term_status — "defined" если срок проката прямо указан,
           иначе "not_defined".
        2. rental_term_details — срок проката.
        3. max_term_reference_status — "defined" если ссылка на максимальный
           предел в 1 год прямо указана, иначе "not_defined".
        4. max_term_reference_details — формулировка.
        5. renewal_clause_status — "defined" если условие о возобновлении /
           пролонгации прямо указано, иначе "not_defined".
        6. renewal_clause_details — формулировка.
        7. preemptive_right_status — "defined" если преимущественное право
           прямо упомянуто (предоставлено или исключено), иначе "not_defined".
        8. preemptive_right_details — формулировка.
        9. st627_reference_status — "defined" если ссылка на ст. 627 ГК РФ
           есть, иначе "not_defined".
        10. st627_reference_details — формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи ограничение срока из ст. 627 ГК РФ.
        - Верни только JSON.
        </rules>
      fields:
        - name: "rental_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока проката."
          required: true
        - name: "rental_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок проката"
          description: "Срок проката."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "max_term_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на максимальный предел в 1 год."
          required: false
        - name: "max_term_reference_details"
          type: "string"
          presentation: "fact"
          label: "Максимальный срок"
          description: "Формулировка о максимальном пределе срока проката."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "renewal_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о возобновлении / пролонгации."
          required: false
        - name: "renewal_clause_details"
          type: "string"
          presentation: "fact"
          label: "Возобновление"
          description: "Формулировка о возобновлении / пролонгации."
          required: false
          display_in_grid: false
        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания преимущественного права."
          required: false
        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
          label: "Преимущественное право"
          description: "Формулировка о преимущественном праве арендатора."
          required: false
          display_in_grid: false
        - name: "st627_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ст. 627 ГК РФ."
          required: false
        - name: "st627_reference_details"
          type: "string"
          presentation: "fact"
          label: "Ссылка на ст. 627 ГК РФ"
