          required: false
      store_payload: true

  - id: rental_tariff_and_overrun_mechanics_check
    name: "Тарифная модель проката и начисление платы за просрочку пользования"
    description: >
      Фактографическая проверка тарифной модели: единица тарификации,
      минимальный оплачиваемый период, плата за превышение срока,
      округление и автоматическое доначисление.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "тариф"
        - "стоимость проката"
        - "за час"
        - "за сутки"
        - "в день"
        - "минимальный период"
        - "минимальная оплата"
        - "плата за превышение"
        - "дополнительные сутки"
        - "доначисление"
        - "округление"
        - "поминутная"
        - "почасовая"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)\\s*/\\s*(?:час|сутки|день|мин)"
        - "(?i)минимальн(ый|ого|ая|ой)\\s+(?:период|оплат|срок)"
        - "(?i)плат(а|ы)\\s+за\\s+превышен"
        - "(?i)дополнительн(ые|ых)\\s+сутк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: тарифная модель проката и механика
        начисления платы за пользование.

        Нормативный ориентир:
        - ст. 630 ГК РФ — арендная плата в виде определённых в твёрдой сумме платежей

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не путай плату за превышение срока (легальное доначисление) со
          штрафом за просрочку возврата (санкция за нарушение).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая единица тарификации (час / сутки / день / минута).
        2. Есть ли минимальный оплачиваемый период.
        3. Есть ли плата за превышение срока пользования.
        4. Есть ли правило округления времени.
        5. Есть ли автоматическое доначисление платы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — тарифная модель определена полностью:
        Фрагмент:
        "Стоимость проката — 300 рублей/час, минимальный период — 2 часа.
        При превышении согласованного срока взимается плата 500 рублей
        за каждый дополнительный час. Неполный час округляется до полного."

        Ответ:
        {
          "tariff_unit_status": "defined",
          "tariff_unit_details": "300 рублей/час",
          "minimum_period_status": "defined",
          "minimum_period_details": "минимальный период — 2 часа",
          "overrun_fee_status": "defined",
          "overrun_fee_details": "500 рублей за каждый дополнительный час при превышении срока",
          "rounding_rule_status": "defined",
          "rounding_rule_details": "неполный час округляется до полного",
          "auto_charge_status": "not_defined",
          "auto_charge_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Стоимость проката — 300 рублей/час, минимальный период — 2 часа."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор оплачивает прокат."

        Ответ:
        {
          "tariff_unit_status": "not_defined",
          "tariff_unit_details": "Данные не определены",
          "minimum_period_status": "not_defined",
          "minimum_period_details": "Данные не определены",
          "overrun_fee_status": "not_defined",
          "overrun_fee_details": "Данные не определены",
          "rounding_rule_status": "not_defined",
          "rounding_rule_details": "Данные не определены",
          "auto_charge_status": "not_defined",
          "auto_charge_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о единице тарификации.
        2. Найди прямую цитату о минимальном периоде.
        3. Найди прямую цитату о плате за превышение.
        4. Найди прямую цитату о правиле округления.
        5. Найди прямую цитату об автоматическом доначислении.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "tariff_unit_status": "<defined / not_defined>",
          "tariff_unit_details": "<текст или 'Данные не определены'>",
          "minimum_period_status": "<defined / not_defined>",
          "minimum_period_details": "<текст или 'Данные не определены'>",
          "overrun_fee_status": "<defined / not_defined>",
          "overrun_fee_details": "<текст или 'Данные не определены'>",
          "rounding_rule_status": "<defined / not_defined>",
          "rounding_rule_details": "<текст или 'Данные не определены'>",
          "auto_charge_status": "<defined / not_defined>",
          "auto_charge_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "тариф стоимость проката за час за сутки в день минимальный период минимальная оплата плата за превышение дополнительные сутки доначисление округление поминутная почасовая"
      retrieval_profile: "rent_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "rental_tariff_and_overrun_mechanics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката тарифную
        модель: единица тарификации, минимальный период, плата за превышение
        срока, округление и автоматическое доначисление.
        Не анализируй предмет проката, ремонт, возврат имущества или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rental_tariff_and_overrun_mechanics_check_presence:
           Агрегатное signal-поле — наличие регулирования по тарифной модели
           и механике начисления платы.
           - "present" — если хотя бы одно из содержательных полей
             (tariff_unit_status, minimum_period_status, overrun_fee_status,
              rounding_rule_status, auto_charge_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tariff_unit_status = "not_defined";
           - tariff_unit_details = "Данные не определены";
           - minimum_period_status = "not_defined";
           - minimum_period_details = "Данные не определены";
           - overrun_fee_status = "not_defined";
           - overrun_fee_details = "Данные не определены";
           - rounding_rule_status = "not_defined";
           - rounding_rule_details = "Данные не определены";
           - auto_charge_status = "not_defined";
           - auto_charge_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. tariff_unit_status — "defined" если единица тарификации (час/сутки/
           день/минута) прямо указана, иначе "not_defined".
        2. tariff_unit_details — формулировка о тарифе (например, "300 рублей/час").
           Если отсутствует — "Данные не определены".
        3. minimum_period_status — "defined" если минимальный оплачиваемый период
           прямо указан, иначе "not_defined".
        4. minimum_period_details — формулировка о минимальном периоде.
           Если отсутствует — "Данные не определены".
        5. overrun_fee_status — "defined" если плата за превышение срока пользования
           прямо указана, иначе "not_defined".
        6. overrun_fee_details — формулировка о плате за превышение (это легальное
           доначисление за продление, а не штраф за нарушение).
           Если отсутствует — "Данные не определены".
        7. rounding_rule_status — "defined" если правило округления времени
           прямо указано, иначе "not_defined".
        8. rounding_rule_details — формулировка о правиле округления.
           Если отсутствует — "Данные не определены".
        9. auto_charge_status — "defined" если автоматическое доначисление платы
           прямо предусмотрено, иначе "not_defined".
        10. auto_charge_details — формулировка об автоматическом доначислении.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни rental_tariff_and_overrun_mechanics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 630 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - Не смешивай плату за прокат с залогом / депозитом / обеспечительным платежом.
        - overrun_fee_details — это плата за легальное превышение срока (продление),
          а не штраф за просрочку возврата (санкция за нарушение). Не путай с
          Check 10 (late_return_penalty_details).
        - В шеринговых сервисах тарифы могут быть указаны в приложении или оферте —
          если в договоре есть отсылка, извлекай её.
        - Если фрагмент контекста не содержит данных о тарифах, стоимости,
          минимальном периоде, округлении или доначислении — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Стоимость и порядок расчётов» или «Тарифы».
        - Условия о тарифах обычно находятся в начале договора (раздел «Предмет
          и стоимость» или «Порядок расчётов»).
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни единицы тарификации, ни минимального периода,
           ни платы за превышение, ни правила округления, ни автоматического
           доначисления.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указана только единица тарификации (например, «500 рублей в сутки»),
           без минимального периода, без платы за превышение, без округления
           и без автоматического доначисления.
           → presence = "present";
             tariff_unit_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что тариф почасовой, в другом — что оплата
           производится за сутки целиком, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             tariff_unit_status = "not_defined";
             tariff_unit_details = "Не удалось определить".

        4. Специфика темы: скрытое удорожание через округление (red flag).
           В тексте прямо предусмотрено правило округления времени в пользу
           арендодателя (например, «неполный час округляется до полного»,
           «неполные сутки округляются до полных»), которое существенно
           увеличивает итоговую стоимость проката.
           → presence = "present";
             rounding_rule_status = "defined";
             rounding_rule_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rental_tariff_and_overrun_mechanics_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * tariff_unit_details → "Данные не определены";
          * minimum_period_details → "Данные не определены";
          * overrun_fee_details → "Данные не определены";
          * rounding_rule_details → "Данные не определены";
          * auto_charge_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rental_tariff_and_overrun_mechanics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по тарифной модели и механике начисления платы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tariff_unit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания единицы тарификации."
          required: true

        - name: "tariff_unit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тариф"
          description: "Единица тарификации и стоимость проката (час/сутки/день/минута)."
          required: false

        - name: "minimum_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус минимального оплачиваемого периода."
          required: true

        - name: "minimum_period_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Минимальный период"
          description: "Минимальный оплачиваемый период проката."
          required: false

        - name: "overrun_fee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус платы за превышение срока."
          required: true

        - name: "overrun_fee_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Плата за превышение"
          description: "Формулировка о плате за превышение срока пользования (легальное доначисление)."
          required: false

        - name: "rounding_rule_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус правила округления."
          required: true

        - name: "rounding_rule_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Округление"
          description: "Формулировка о правиле округления времени (скрытое удорожание)."
          required: false

        - name: "auto_charge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус автоматического доначисления."
          required: true

        - name: "auto_charge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения об автосписании"
          description: "Формулировка об автоматическом доначислении (скрыта из Grid, доступна в drawer)."
          required: false
      store_payload: true

  - id: rental_item_title_and_no_third_party_rights_check
    name: "Титул арендодателя на предмет проката и отсутствие прав третьих лиц"
    description: >
      Фактографическая проверка наличия в тексте подтверждения права
      собственности арендодателя на предмет проката, отсутствия залога,
      ареста и прав третьих лиц.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "вправе передавать в прокат"
        - "правоустанавливающие документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)свободн(о|ым)\\s+от\\s+прав\\s+третьих"
        - "(?i)не\\s+заложен|не\\s+арестован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: подтверждение права арендодателя
        на предмет проката и отсутствие обременений.

        Нормативный ориентир:
        - ст. 608 ГК РФ — право сдачи имущества в аренду
        - ст. 611 ГК РФ — обязанность передать имущество свободным от прав третьих лиц

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В договорах потребительского проката заверения о титуле часто
          не прописываются явно — это норма, так как право арендодателя
          подразумевается в силу закона.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности арендодателя на предмет проката.
        2. Есть ли указание на отсутствие залога.
        3. Есть ли указание на отсутствие ареста.
        4. Есть ли указание на отсутствие прав третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_summary) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул подтверждён явно:
        Фрагмент:
        "Арендодатель подтверждает, что предмет проката принадлежит ему
        на праве собственности, не заложен, не арестован и свободен
        от прав третьих лиц."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "принадлежит ему на праве собственности",
          "no_pledge_status": "defined",
          "no_pledge_details": "не заложен",
          "no_arrest_status": "defined",
          "no_arrest_details": "не арестован",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "свободен от прав третьих лиц",
          "title_warranty_summary": "Подтверждены",
          "evidence": [
            {
              "clause_ref": "п. 1.4",
              "quote": "Арендодатель подтверждает, что предмет проката принадлежит ему на праве собственности, не заложен, не арестован и свободен от прав третьих лиц."
            }
          ]
        }

        Пример 2 — титул не упомянут (типичная ситуация для проката):
        Фрагмент:
        "Арендодатель передаёт предмет проката Арендатору."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Данные не определены",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Данные не определены",
          "title_warranty_summary": "Не упомянуты (норма для проката)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности.
        2. Найди прямую цитату об отсутствии залога.
        3. Найди прямую цитату об отсутствии ареста.
        4. Найди прямую цитату об отсутствии прав третьих лиц.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Данные не определены'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Данные не определены'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Данные не определены'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Данные не определены'>",
          "title_warranty_summary": "<'Подтверждены' / 'Частично подтверждены' / 'Не упомянуты (норма для проката)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принадлежит на праве собственности свободно от прав третьих лиц не заложено не арестовано вправе передавать в прокат правоустанавливающие документы заверения сторон"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "rental_item_title_and_no_third_party_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката подтверждение
        титула арендодателя на предмет проката и заверения об отсутствии
        залога, ареста и прав третьих лиц.
        Не анализируй арендную плату, ремонт, возврат имущества или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rental_item_title_and_no_third_party_rights_check_presence:
           Агрегатное signal-поле — наличие заверений о титуле арендодателя
           и отсутствии обременений.
           - "present" — если хотя бы одно из содержательных полей
             (title_confirmation_status, no_pledge_status, no_arrest_status,
              no_third_party_rights_status) = "defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - title_confirmation_status = "not_defined";
           - title_confirmation_details = "Данные не определены";
           - no_pledge_status = "not_defined";
           - no_pledge_details = "Данные не определены";
           - no_arrest_status = "not_defined";
           - no_arrest_details = "Данные не определены";
           - no_third_party_rights_status = "not_defined";
           - no_third_party_rights_details = "Данные не определены";
           - title_warranty_summary = "Не упомянуты (норма для проката)";
           - не выполняй остальные шаги.

        1. title_confirmation_status — "defined" если право собственности
           арендодателя прямо подтверждено в тексте («принадлежит на праве
           собственности», «является собственником»), иначе "not_defined".
        2. title_confirmation_details — формулировка о праве собственности.
           Если отсутствует — "Данные не определены".
        3. no_pledge_status — "defined" если отсутствие залога прямо указано
           («не заложен», «не является предметом залога»), иначе "not_defined".
        4. no_pledge_details — формулировка об отсутствии залога.
           Если отсутствует — "Данные не определены".
        5. no_arrest_status — "defined" если отсутствие ареста/запретов прямо
           указано («не арестован», «запреты на распоряжение отсутствуют»),
           иначе "not_defined".
        6. no_arrest_details — формулировка об отсутствии ареста.
           Если отсутствует — "Данные не определены".
        7. no_third_party_rights_status — "defined" если отсутствие прав
           третьих лиц прямо указано («свободен от прав третьих лиц»,
           «не обременён правами третьих лиц»), иначе "not_defined".
        8. no_third_party_rights_details — формулировка об отсутствии прав
           третьих лиц. Если отсутствует — "Данные не определены".
        9. title_warranty_summary — краткий user-friendly статус:
           - "Подтверждены" — если все 4 аспекта (собственность, залог, арест,
             права третьих лиц) прямо подтверждены в тексте;
           - "Частично подтверждены" — если подтверждено 2-3 аспекта из 4;
           - "Не упомянуты (норма для проката)" — если ни один аспект не
             подтверждён явно (в потребительском прокате это типичная ситуация,
             право арендодателя подразумевается в силу ст. 608 ГК РФ);
           - "Данные не определены" — если договор не содержит данных о предмете.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - title_warranty_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни rental_item_title_and_no_third_party_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", title_warranty_summary = "Не упомянуты (норма для проката)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 608 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - title_confirmation_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова о праве собственности арендодателя.
        - В договорах потребительского проката заверения о титуле часто не
          прописываются явно — это норма, а не недостаток договора.
        - Не путай отсутствие залога со стороны арендодателя (этот check) с
          запретом залога со стороны арендатора (Check 12).
        - Если фрагмент контекста не содержит данных о титуле, собственности,
          залоге, аресте или правах третьих лиц — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле, разделе «Предмет договора» или «Заверения сторон».
        - Заверения о титуле обычно находятся в начале договора (преамбула,
          предмет договора).
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни подтверждения права собственности арендодателя,
           ни указания на отсутствие залога, ни указания на отсутствие ареста,
           ни указания на отсутствие прав третьих лиц (типичная ситуация
           для потребительского проката).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             title_warranty_summary = "Не упомянуты (норма для проката)".

        2. Неполное раскрытие темы.
           Указано право собственности арендодателя, но без указаний
           на отсутствие залога, ареста и прав третьих лиц.
           → presence = "present";
             title_confirmation_status = "defined";
             остальные статусы = "not_defined";
             title_warranty_summary = "Частично подтверждены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что имущество свободно от прав третьих лиц,
           в другом — что на него установлено обременение в пользу третьего
           лица, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             no_third_party_rights_status = "not_defined";
             no_third_party_rights_details = "Не удалось определить";
             title_warranty_summary = "Данные не определены".

        4. Специфика темы: red flag — обременение прямо указано.
           В тексте прямо указано наличие обременения предмета проката
           (залог, арест, права третьих лиц), несмотря на то что по ст. 611
           ГК РФ имущество должно передаваться свободным от прав третьих лиц.
           → presence = "present";
             соответствующий статус (например, no_pledge_status) = "defined";
             соответствующее *_details = точная формулировка из текста
             (например, «имущество находится в залоге у ПАО "Банк"»);
             title_warranty_summary = "Частично подтверждены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rental_item_title_and_no_third_party_rights_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для title_warranty_summary используй только: "Подтверждены",
          "Частично подтверждены", "Не упомянуты (норма для проката)"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * title_confirmation_details → "Данные не определены";
          * no_pledge_details → "Данные не определены";
          * no_arrest_details → "Данные не определены";
          * no_third_party_rights_details → "Данные не определены";
          * title_warranty_summary → "Не упомянуты (норма для проката)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * title_warranty_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rental_item_title_and_no_third_party_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений о титуле арендодателя и отсутствии обременений предмета проката. Внутреннее агрегатное signal-поле."
          required: true

        - name: "title_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения титула арендодателя."
          required: true

        - name: "title_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Подтверждение права собственности"
          description: "Формулировка о праве собственности арендодателя (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "no_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии залога."
          required: true

        - name: "no_pledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отсутствие залога"
          description: "Формулировка об отсутствии залога (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "no_arrest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии ареста."
          required: true

        - name: "no_arrest_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отсутствие ареста"
          description: "Формулировка об отсутствии ареста (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "no_third_party_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии прав третьих лиц."
          required: true

        - name: "no_third_party_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отсутствие прав третьих лиц"
          description: "Формулировка об отсутствии прав третьих лиц (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "title_warranty_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Заверения о титуле"
          description: "Компактный статус заверений арендодателя о праве собственности и отсутствии обременений предмета проката."
          required: false
      store_payload: true

  - id: insurance_and_risk_allocation_check
    name: "Страхование предмета проката и распределение рисков гибели/повреждения"
    description: >
      Фактографическая проверка условий страхования предмета проката,
      распределения рисков случайной гибели или повреждения имущества
      между арендодателем и арендатором.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "риск случайной гибели"
        - "риск повреждения"
        - "выгодоприобретатель"
        - "страховая выплата"
        - "франшиза"
        - "КАСКО"
        - "ОСАГО"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страховани"
        - "(?i)риск\\s+(случайной|гибели|повреждения)"
        - "(?i)выгодоприобретатель"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: страхование предмета проката
        и распределение рисков гибели/повреждения.

        Нормативный ориентир:
        - ст. 211 ГК РФ — риск случайной гибели несёт собственник,
          если иное не предусмотрено законом или договором
        - ст. 669 ГК РФ — риск случайной гибели при аренде с выкупом

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В потребительском прокате перекладывание риска на арендатора
          может быть ничтожно по ст. 16 ЗоЗПП.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто обязан страховать предмет проката.
        2. Кто несёт риск случайной гибели/повреждения.
        3. Кто является выгодоприобретателем по страховке.
        4. Есть ли франшиза и её размер.
        5. Есть ли исключения из страхового покрытия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — страхование урегулировано:
        Фрагмент:
        "Арендодатель обязан за свой счёт застраховать предмет проката.
        Риск случайной гибели несёт Арендодатель как собственник.
        Выгодоприобретателем по страховому полису является Арендодатель.
        Франшиза составляет 10 000 рублей."

        Ответ:
        {
          "insurance_obligation_status": "defined",
          "insurance_obligation_details": "Арендодатель обязан за свой счёт застраховать предмет проката",
          "risk_allocation_status": "defined",
          "risk_allocation_details": "риск случайной гибели несёт Арендодатель как собственник",
          "beneficiary_status": "defined",
          "beneficiary_details": "выгодоприобретателем является Арендодатель",
          "franchise_status": "defined",
          "franchise_details": "10 000 рублей",
          "coverage_exclusions_status": "not_defined",
          "coverage_exclusions_details": "Данные не определены",
          "insurance_risk_summary": "Страхование на арендодателе, риск на собственнике",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Арендодатель обязан за свой счёт застраховать предмет проката."
            }
          ]
        }

        Пример 2 — страхование не урегулировано (типично для проката):
        Фрагмент:
        "Арендатор пользуется имуществом бережно."

        Ответ:
        {
          "insurance_obligation_status": "not_defined",
          "insurance_obligation_details": "Данные не определены",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Данные не определены",
          "franchise_status": "not_defined",
          "franchise_details": "Данные не определены",
          "coverage_exclusions_status": "not_defined",
          "coverage_exclusions_details": "Данные не определены",
          "insurance_risk_summary": "Не урегулировано (риск на собственнике по ГК РФ)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности страхования.
        2. Найди прямую цитату о распределении рисков.
        3. Найди прямую цитату о выгодоприобретателе.
        4. Найди прямую цитату о франшизе.
        5. Найди прямую цитату об исключениях из покрытия.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "insurance_obligation_status": "<defined / not_defined>",
          "insurance_obligation_details": "<текст или 'Данные не определены'>",
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_details": "<текст или 'Данные не определены'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_details": "<текст или 'Данные не определены'>",
          "franchise_status": "<defined / not_defined>",
          "franchise_details": "<текст или 'Данные не определены'>",
          "coverage_exclusions_status": "<defined / not_defined>",
          "coverage_exclusions_details": "<текст или 'Данные не определены'>",
          "insurance_risk_summary": "<'Страхование на арендодателе, риск на собственнике' / 'Страхование на арендаторе' / 'Риск перекладывается на арендатора' / 'Не урегулировано (риск на собственнике по ГК РФ)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование страховой полис риск случайной гибели риск повреждения выгодоприобретатель страховая выплата франшиза КАСКО ОСАГО"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "insurance_and_risk_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        страхования предмета проката и распределения рисков случайной гибели
        или повреждения имущества.
        Не анализируй арендную плату, ремонт, возврат или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insurance_and_risk_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по страхованию
           и распределению рисков гибели/повреждения.
           - "present" — если хотя бы одно из содержательных полей
             (insurance_obligation_status, risk_allocation_status,
              beneficiary_status, franchise_status, coverage_exclusions_status)
             = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_obligation_status = "not_defined";
           - insurance_obligation_details = "Данные не определены";
           - risk_allocation_status = "not_defined";
           - risk_allocation_details = "Данные не определены";
           - beneficiary_status = "not_defined";
           - beneficiary_details = "Данные не определены";
           - franchise_status = "not_defined";
           - franchise_details = "Данные не определены";
           - coverage_exclusions_status = "not_defined";
           - coverage_exclusions_details = "Данные не определены";
           - insurance_risk_summary = "Не урегулировано (риск на собственнике по ГК РФ)";
           - не выполняй остальные шаги.

        1. insurance_obligation_status — "defined" если обязанность страхования
           прямо указана (кто страхует, за чей счёт), иначе "not_defined".
        2. insurance_obligation_details — формулировка об обязанности страхования.
           Если отсутствует — "Данные не определены".
        3. risk_allocation_status — "defined" если распределение рисков гибели/
           повреждения прямо указано, иначе "not_defined".
        4. risk_allocation_details — формулировка о распределении рисков.
           Если отсутствует — "Данные не определены".
        5. beneficiary_status — "defined" если выгодоприобретатель по страховке
           прямо указан, иначе "not_defined".
        6. beneficiary_details — формулировка о выгодоприобретателе.
           Если отсутствует — "Данные не определены".
        7. franchise_status — "defined" если франшиза прямо указана,
           иначе "not_defined".
        8. franchise_details — формулировка о франшизе (размер, условия).
           Если отсутствует — "Данные не определены".
        9. coverage_exclusions_status — "defined" если исключения из страхового
           покрытия прямо указаны, иначе "not_defined".
        10. coverage_exclusions_details — формулировка об исключениях.
            Если отсутствует — "Данные не определены".
        11. insurance_risk_summary — краткий user-friendly вывод:
            - "Страхование на арендодателе, риск на собственнике" — если
              арендодатель страхует и риск на нём (стандарт по ГК РФ);
            - "Страхование на арендаторе" — если обязанность страхования
              возложена на арендатора;
            - "Риск перекладывается на арендатора" — если риск гибели
              возложен на арендатора (potentially unfair по ЗоЗПП);
            - "Не урегулировано (риск на собственнике по ГК РФ)" — если
              договор не содержит условий (применяется ст. 211 ГК РФ);
            - "Данные не определены" — если нет данных о предмете проката.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - insurance_risk_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни insurance_and_risk_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", insurance_risk_summary = "Не урегулировано (риск на собственнике по ГК РФ)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 211 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - insurance_obligation_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова об обязанности страхования («обязан застраховать», «страхование
          за счёт» и т.п.).
        - В договорах потребительского проката страхование часто не прописывается
          явно — риск остаётся на собственнике по ст. 211 ГК РФ.
        - Перекладывание риска на арендатора-потребителя может быть ничтожно
          по ст. 16 ЗоЗПП, но в DD важно зафиксировать это как факт.
        - Если фрагмент контекста не содержит данных о страховании, рисках гибели,
          выгодоприобретателе или франшизе — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Страхование», «Ответственность сторон» или «Обязанности
          Арендодателя».
        - Условия о страховании могут быть в разделе «Предмет договора» или
          «Обязанности сторон».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности страхования, ни распределения рисков,
           ни выгодоприобретателя, ни франшизы, ни исключений из покрытия
           (типичная ситуация для потребительского проката).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             insurance_risk_summary = "Не урегулировано (риск на собственнике по ГК РФ)".

        2. Неполное раскрытие темы.
           Указано только распределение рисков (риск на арендодателе), но без
           обязанности страхования, без выгодоприобретателя, без франшизы
           и без исключений.
           → presence = "present";
             risk_allocation_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что риск случайной гибели несёт арендодатель,
           в другом — что арендатор; конфликт нельзя снять по тексту.
           → presence = "unclear";
             risk_allocation_status = "not_defined";
             risk_allocation_details = "Не удалось определить";
             insurance_risk_summary = "Данные не определены".

        4. Специфика темы: перекладывание риска на арендатора (red flag).
           В тексте прямо указано, что риск случайной гибели или повреждения
           предмета проката несёт арендатор, что потенциально ущемляет права
           потребителя по ст. 16 ЗоЗПП.
           → presence = "present";
             risk_allocation_status = "defined";
             risk_allocation_details = точная формулировка из текста;
             insurance_risk_summary = "Риск перекладывается на арендатора".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insurance_and_risk_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для insurance_risk_summary используй только: "Страхование на арендодателе, риск на собственнике",
          "Страхование на арендаторе", "Риск перекладывается на арендатора",
          "Не урегулировано (риск на собственнике по ГК РФ)" или "Данные не определены".
        - Fallback при отсутствии данных:
          * insurance_obligation_details → "Данные не определены";
          * risk_allocation_details → "Данные не определены";
          * beneficiary_details → "Данные не определены";
          * franchise_details → "Данные не определены";
          * coverage_exclusions_details → "Данные не определены";
          * insurance_risk_summary → "Не урегулировано (риск на собственнике по ГК РФ)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * insurance_risk_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "insurance_and_risk_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по страхованию и распределению рисков гибели/повреждения. Внутреннее агрегатное signal-поле."
