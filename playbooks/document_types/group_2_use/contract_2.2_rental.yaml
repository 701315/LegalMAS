type: contract_2.2_rental
name: "Договор проката"
version: 6.0
parent: class_2_transfer_for_use
description: |
  Специальный вид аренды движимого имущества, предоставляемого во временное владение
  и пользование за плату для потребительских (личных, семейных, бытовых) нужд.
  Характеризуется публичным характером договора, профессиональным арендодателем,
  краткосрочностью, обязательной consumer-ориентацией арендатора и особыми правилами:
  срок до одного года, фиксированная плата, обязанность арендодателя по ремонту,
  обязанность проверить исправность имущества и ознакомить арендатора с правилами эксплуатации,
  а также запрет субаренды и передачи прав третьим лицам.
  Регулируется § 2 Главы 34 ГК РФ и, в соответствующих случаях, законодательством
  о защите прав потребителей.
metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 34 ГК РФ (ст. 626-631)"
  doc_types_supported:
    - "договор проката"
    - "договор бытового проката"
    - "публичный договор проката"
    - "прокат инвентаря"
    - "прокат инструмента"
    - "прокат оборудования для бытовых нужд"
    - "краткосрочный договор проката"
    - "оферта сервиса проката"
    - "договор бытового проката"
    - "публичный договор проката"
    - "договор краткосрочного проката"
    - "договор аренды имущества для бытовых нужд"
    - "прокат оборудования"
    - "прокат техники"
    - "прокат спортивного инвентаря"
    - "прокат туристического снаряжения"
    - "прокат велосипедов"
    - "прокат электросамокатов"
    - "прокат бытовой техники"
    - "договор проката автомобиля"

    - "rental agreement for personal use"
    - "consumer rental agreement"
    - "short-term rental agreement"
    - "hire agreement"
    - "hire of goods agreement"
    - "equipment rental agreement"
    - "tool rental agreement"
    - "recreational equipment rental agreement"
    - "bicycle rental agreement"
    - "scooter rental agreement"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bдоговор[\\s_.-]*проката\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование договора проката

      - pattern: "(?i)\\bпрокат[\\s_.-]*(?:бытов[а-я]*|потребительск[а-я]*|краткосрочн[а-я]*)\\b|\\b(?:бытов[а-я]*|потребительск[а-я]*|краткосрочн[а-я]*)[\\s_.-]*прокат\\b"
        kind: specific_subject
        weight: 0.96
        # Прокат с явным consumer/бытовым/краткосрочным квалификатором

      - pattern: "(?i)\\bпублично[а-я]*[\\s_.-]*договор[\\s_.-]*проката\\b|\\bоферта[\\s_.-]*(?:сервиса[\\s_.-]*)?проката\\b"
        kind: specific_subject
        weight: 0.94
        # Публичный договор проката / оферта сервиса проката — из supported types

      - pattern: "(?i)\\bпрокат[\\s_.-]*(?:велосипед[а-я]*|электросамокат[а-я]*|самокат[а-я]*)\\b"
        kind: specific_subject
        weight: 0.94
        # Прокат велосипедов / самокатов — специфичный потребительский subtype

      - pattern: "(?i)\\bпрокат[\\s_.-]*(?:спортивн[а-я]*[\\s_.-]*инвентар[а-я]*|туристическ[а-я]*[\\s_.-]*снаряжени[а-я]*)\\b"
        kind: specific_subject
        weight: 0.92
        # Прокат спортивного/туристического инвентаря

      - pattern: "(?i)\\bпрокат[\\s_.-]*(?:инвентар[а-я]*|инструмент[а-я]*|бытов[а-я]*[\\s_.-]*техник[а-я]*)\\b"
        kind: specific_subject
        weight: 0.92
        # Прокат инвентаря / инструмента / бытовой техники

      - pattern: "(?i)\\bпрокат[\\s_.-]*(?:оборудовани[а-я]*|техник[а-я]*)\\b"
        kind: specific_subject
        weight: 0.84
        # Прокат оборудования / техники из supported types; чуть ниже — возможен конфликт с коммерческой арендой

      - pattern: "(?i)\\bпрокат[\\s_.-]*автомобил[а-я]*\\b"
        kind: specific_subject
        weight: 0.88
        # Прокат автомобиля — из supported types; car rental достаточно специфичен

      - pattern: "(?i)\\bпрокат\\b"
        kind: specific_subject
        weight: 0.80
        # Базовый русский маркер проката; без квалификатора чуть ниже, но достаточно специфичен

      - pattern: "(?i)\\bдоговор[\\s_.-]*аренд[а-я]*[\\s_.-]*(?:имущества[\\s_.-]*)?(?:для[\\s_.-]*)?(?:бытов[а-я]*|личн[а-я]*|потребительск[а-я]*)[\\s_.-]*нужд\\b"
        kind: specific_subject
        weight: 0.90
        # Аренда для бытовых/личных нужд — из supported types, прямо указывает на прокат

      - pattern: "(?i)\\bconsumer[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.92
        # Consumer rental agreement — из supported types, прямой маркер потребительского проката

      - pattern: "(?i)\\brental[\\s_.-]*(?:agreement[\\s_.-]*)?(?:for[\\s_.-]*)?personal[\\s_.-]*use\\b"
        kind: specific_subject
        weight: 0.88
        # Rental for personal use — хороший потребительский маркер

      - pattern: "(?i)\\bhire[\\s_.-]*of[\\s_.-]*goods(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.86
        # Hire of goods agreement — из supported types, достаточно специфичная consumer-форма

      - pattern: "(?i)\\b(?:bicycle|bike)[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.92
        # Bicycle rental agreement — из supported types

      - pattern: "(?i)\\bscooter[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.92
        # Scooter rental agreement — из supported types

      - pattern: "(?i)\\brecreational[\\s_.-]*(?:equipment[\\s_.-]*)?rental(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.88
        # Recreational equipment rental — из supported types

      - pattern: "(?i)\\btool[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.86
        # Tool rental — из supported types; инструмент почти всегда потребительский прокат

      - pattern: "(?i)\\b(?:short[\\s_.-]*term[\\s_.-]*)?hire(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.58
        # Hire agreement без goods/consumer квалификатора шире проката; конфликт с lease и commercial hire

      - pattern: "(?i)\\bequipment[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.54
        # Equipment rental без consumer/personal qualifier конфликтует с коммерческой арендой оборудования

      - pattern: "(?i)\\bshort[\\s_.-]*term[\\s_.-]*rental(?:[\\s_.-]*agreement)?\\b"
        kind: generic_form
        weight: 0.52
        # Short-term rental шире проката: возможен в real estate (vacation rental), commercial и т.д.

      - pattern: "(?i)\\brental[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.46
        # Rental agreement без квалификатора слишком широк

      - pattern: "(?i)\\bпрокат[\\s_.-]*пункт\\b|\\bпункт[\\s_.-]*проката\\b"
        kind: context
        weight: 0.28
        # Пункт проката — операционный контекст, не форма документа

      - pattern: "(?i)\\bconsumer\\b"
        kind: context
        weight: 0.18
        # Consumer без rental/прокат слишком широкий маркер

      - pattern: "(?i)\\bpersonal[\\s_.-]*use\\b"
        kind: context
        weight: 0.18
        # Personal use без rental контекста не определяет тип

    folder_patterns:
      - pattern: "(?i)прокат"
        kind: specific_subject
        weight: 0.86
        # Явная папка по договорам проката

      - pattern: "(?i)consumer[_\\s-]*rental|rental[_\\s-]*(?:for[_\\s-]*)?personal[_\\s-]*use"
        kind: specific_subject
        weight: 0.82
        # Потребительская аренда в taxonomy папок

      - pattern: "(?i)hire[_\\s-]*of[_\\s-]*goods"
        kind: specific_subject
        weight: 0.78
        # Hire of goods — специфичная consumer-форма

      - pattern: "(?i)(?:bicycle|bike|scooter|велосипед|самокат|электросамокат)[_\\s-]*rental"
        kind: specific_subject
        weight: 0.80
        # Папки по специфическим объектам проката

      - pattern: "(?i)(?:tool|instrument|recreational|sport)[_\\s-]*rental|прокат[_\\s-]*(?:инструмент|инвентар|спортивн)"
        kind: specific_subject
        weight: 0.76
        # Папки по типовым объектам потребительского проката

      - pattern: "(?i)short[_\\s-]*term[_\\s-]*rental|краткосрочн[а-я]*[_\\s-]*аренд|краткосрочн[а-я]*[_\\s-]*прокат"
        kind: generic_form
        weight: 0.52
        # Краткосрочная аренда / short-term rental — полезна, но шире проката

      - pattern: "(?i)equipment[_\\s-]*rental"
        kind: generic_form
        weight: 0.46
        # Equipment rental folder конфликтует с коммерческой арендой оборудования

      - pattern: "(?i)rental"
        kind: generic_form
        weight: 0.36
        # Общий rental folder без квалификатора

      - pattern: "(?i)hire"
        kind: generic_form
        weight: 0.32
        # Hire folder без goods/consumer квалификатора слишком широк

      - pattern: "(?i)consumer"
        kind: context
        weight: 0.20
        # Consumer folder без rental контекста

      - pattern: "(?i)b2c"
        kind: context
        weight: 0.18
        # B2C — полезный, но не достаточный folder-marker

    keywords:

      high:
        - pattern: "(?i)договор\\s+прокат[аыу]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Прямое название договора проката"

        - pattern: "(?i)договор\\s+бытов[огоый]\\s+прокат[аыу]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Бытовой прокат — специализированный потребительский режим"

        - pattern: "(?i)публичн[ыйое]\\s+договор\\s+прокат[аыу]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Публичный договор проката по ст. 626 ГК РФ"

        - pattern: "(?i)оферт[аы]\\s+сервис[ауы]\\s+прокат[аыу]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Оферта сервиса проката — типичная форма у сервисов sharing-экономики"

        - pattern: "(?i)прокат\\s+инвентар[яея]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прокат инвентаря — классический предмет договора проката"

        - pattern: "(?i)прокат\\s+инструмент[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прокат инструмента для бытовых нужд"

        - pattern: "(?i)прокат\\s+оборудован[ияи]\\s+для\\s+бытов[ыхых]\\s+нужд"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прямое указание на бытовой прокат оборудования"

        - pattern: "(?i)краткосрочн[ыйое]\\s+договор\\s+прокат[аыу]"
          weight: 0.85
          distinctiveness: high
          context: header
          description: "Краткосрочный договор проката — срок до одного года"

        - pattern: "(?i)бытов[ыеых]\\s+нужд[ы]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Бытовые нужды — ключевой признак потребительского проката"

        - pattern: "(?i)потребительск[иеих]\\s+цел[ией]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Потребительские цели — характерны для consumer-регулирования"

        - pattern: "(?i)пункт\\s+прокат[аыу]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Пункт проката — типичная организационная форма проката"

        - pattern: "(?i)проверка\\s+исправност[ии]"
          weight: 0.8
          distinctiveness: high
          context: body
          description: "Обязанность арендодателя по проверке исправности имущества"

        - pattern: "(?i)инструкц[иеи]\\s+по\\s+эксплуатац[иии]"
          weight: 0.8
          distinctiveness: high
          context: body
          description: "Обязанность ознакомить арендатора с правилами эксплуатации"

      medium:
        - pattern: "(?i)почасов[а-яё]+\\s+аренд[аы]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Почасовая аренда — характерна для краткосрочного проката"

        - pattern: "(?i)публичн[ыйое]\\s+договор"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Публичный договор в контексте проката — маркер § 2 Главы 34 ГК РФ"

        - pattern: "(?i)посуточн[а-яё]+\\s+аренд[аы]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Посуточная аренда — признак краткосрочного consumer-проката"

        - pattern: "(?i)краткосрочн[а-яё]+\\s+аренд[аы]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Краткосрочная аренда в связке с consumer-контекстом тяготеет к прокату"

        - pattern: "(?i)аренд[аы]\\s+инвентар[яя]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Аренда инвентаря — часто оформляется как прокат"

        - pattern: "(?i)движим[оа]е?\\s+имуществ[оа]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Движимое имущество — общий предмет, важен в сочетании с consumer-маркерами"

        - pattern: "(?i)страхов[оа]й\\s+депозит"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Страховой депозит — типичен для сервисов проката"

        - pattern: "(?i)обеспечительн[ыо]й\\s+плат[её]ж"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Обеспечительный платёж — встречается и в аренде, и в прокате"

        - pattern: "(?i)нормальн[ыо]й\\s+износ"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Нормальный износ имущества — важен в контексте краткосрочного consumer-проката"

        - pattern: "(?i)возврат\\s+залога"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Возврат залога/депозита — частый элемент договоров проката"

      low:
        - pattern: "(?i)квитанци[яи]\\s+прокат[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Квитанция проката — служебный документ, подтверждающий сделку"

        - pattern: "(?i)\\bчек\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Кассовый чек — общий платежный документ, встречается во многих типах"

        - pattern: "(?i)\\bкаршеринг\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Каршеринг — транспортный сервис, близок к прокату по модели использования"

        - pattern: "(?i)\\bкикшеринг\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Кикшеринг — прокат электросамокатов"

        - pattern: "(?i)\\bсамокат\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Самокат — типичный объект новых consumer-сервисов проката"

        - pattern: "(?i)\\bвелосипед\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Велосипед — типичный предмет проката для личных нужд"

        - pattern: "(?i)\\bинструмент\\b"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Инструмент — общий термин, может быть объектом аренды/проката"

        - pattern: "(?i)спортинвентар[ьяю]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Спортивный инвентарь — частый объект краткосрочного проката"

    exclusions:
      - pattern: "(?i)аренд[аы]\\s+недвижимост[ии]"
        severity: hard
        weight: -1.0
        description: "Аренда недвижимости — иной объект, регулируется иными подразделами Главы 34 ГК РФ (contract_1.6_real_estate, contract_2.1_lease)"

      - pattern: "(?i)финансов[а-яё]+\\s+аренд[аы]"
        severity: hard
        weight: -1.0
        description: "Финансовая аренда (лизинг) — отдельный тип (contract_2.4_leasing)"

      - pattern: "(?i)безвозмездн[оа]е\\s+пользовани[ея]"
        severity: hard
        weight: -1.0
        description: "Безвозмездное пользование (ссуда) — не прокат, Глава 36 ГК РФ (contract_2.6_gratuitous_use)"

      - pattern: "(?i)договор\\s+на[йеё]м[ауы]\\s+жил[оа]го\\s+помещени[яя]"
        severity: hard
        weight: -1.0
        description: "Найм жилого помещения — жилищный найм, не прокат (contract_2.5_residential_lease)"

      - pattern: "(?i)аренд[аы]\\s+для\\s+предпринимательск[оа]й\\s+деятельност[ии]\\s+арендатор[аа]"
        severity: hard
        weight: -1.0
        description: "B2B-аренда для предпринимательской деятельности — должна классифицироваться как общая аренда (contract_2.1_lease)"

      - pattern: "(?i)для\\s+извлечени[яя]\\s+прибыл[ии]"
        severity: hard
        weight: -1.0
        description: "Использование имущества для извлечения прибыли — предпринимательская цель, не прокат"

      # ── Soft exclusions

      - pattern: "(?i)\\bлизинг\\b"
        severity: soft
        weight: -0.4
        description: "Упоминание лизинга рядом с consumer-контекстом снижает уверенность в чистом прокате (contract_2.4_leasing)"

      - pattern: "(?i)\\bссуд[аы]\\b"
        severity: soft
        weight: -0.35
        description: "Ссуда / безвозмездное пользование может встречаться в примерах или оговорках (contract_2.6_gratuitous_use)"

      - pattern: "(?i)транспортн[оеая]\\s+средств[оа]\\s+с\\s+экипажем"
        severity: soft
        weight: -0.3
        description: "Аренда транспортного средства с экипажем — особый режим, ближе к перевозке и vehicle lease"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  consumer_purpose:
    any_keywords:
      - "(?i)для\\s+бытов[ыо]х\\s+нужд"
      - "(?i)для\\s+личн[ыо]х\\s+нужд"
      - "(?i)потребительск[иоя]+\\s+цел[еи]"
      - "(?i)семейн[ыо]е\\s+нужд[ыа]"
      - "(?i)личн[оа]е\\s+использовани[ея]"
      - "(?i)гражданин-?арендатор"

  movable_item_rental:
    any_keywords:
      - "(?i)движим[оа]е?\\s+имуществ[оа]"
      - "(?i)\\bинструмент\\b"
      - "(?i)\\bоборудовани[ея]\\b"
      - "(?i)\\bтехник[аи]\\b"
      - "(?i)\\bсамокат\\b"
      - "(?i)\\bвелосипед\\b"
      - "(?i)спортинвентар[ьяю]"
      - "(?i)\\bкостюм\\b"
      - "(?i)серийн[ыо]й\\s+номер"
      - "(?i)\\bмарк[аа]\\b"
      - "(?i)\\bмодел[ьяи]\\b"

  short_term_rental:
