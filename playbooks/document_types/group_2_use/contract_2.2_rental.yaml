          description: "Формулировка о запрете (или разрешении) субаренды предмета проката (ст. 631 ГК РФ)."
          required: false

        - name: "third_party_transfer_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета передачи третьим лицам."
          required: true

        - name: "third_party_transfer_prohibition_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Передача третьим лицам"
          description: "Формулировка о запрете передачи предмета проката третьим лицам."
          required: false

        - name: "personal_use_status"
          type: "string"
