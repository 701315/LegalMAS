  - id: insurance_and_risk_allocation_check
    name: "Страхование предмета проката и распределение рисков гибели/повреждения"
    description: >
      Фактографическая проверка условий страхования предмета проката,
      распределения рисков случайной гибели или повреждения имущества
      между арендодателем и арендатором.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "риск случайной гибели"
        - "риск повреждения"
        - "выгодоприобретатель"
        - "страховая выплата"
        - "франшиза"
        - "КАСКО"
        - "ОСАГО"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страховани"
        - "(?i)риск\\s+(случайной|гибели|повреждения)"
        - "(?i)выгодоприобретатель"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: страхование предмета проката
        и распределение рисков гибели/повреждения.

        Нормативный ориентир:
        - ст. 211 ГК РФ — риск случайной гибели несёт собственник,
          если иное не предусмотрено законом или договором
        - ст. 669 ГК РФ — риск случайной гибели при аренде с выкупом

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В потребительском прокате перекладывание риска на арендатора
          может быть ничтожно по ст. 16 ЗоЗПП.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто обязан страховать предмет проката.
        2. Кто несёт риск случайной гибели/повреждения.
        3. Кто является выгодоприобретателем по страховке.
        4. Есть ли франшиза и её размер.
        5. Есть ли исключения из страхового покрытия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — страхование урегулировано:
        Фрагмент:
        "Арендодатель обязан за свой счёт застраховать предмет проката.
        Риск случайной гибели несёт Арендодатель как собственник.
        Выгодоприобретателем по страховому полису является Арендодатель.
        Франшиза составляет 10 000 рублей."

        Ответ:
        {
          "insurance_obligation_status": "defined",
          "insurance_obligation_details": "Арендодатель обязан за свой счёт застраховать предмет проката",
          "risk_allocation_status": "defined",
          "risk_allocation_details": "риск случайной гибели несёт Арендодатель как собственник",
          "beneficiary_status": "defined",
          "beneficiary_details": "выгодоприобретателем является Арендодатель",
          "franchise_status": "defined",
          "franchise_details": "10 000 рублей",
          "coverage_exclusions_status": "not_defined",
          "coverage_exclusions_details": "Данные не определены",
          "insurance_risk_summary": "Страхование на арендодателе, риск на собственнике",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Арендодатель обязан за свой счёт застраховать предмет проката."
            }
          ]
        }

        Пример 2 — страхование не урегулировано (типично для проката):
        Фрагмент:
        "Арендатор пользуется имуществом бережно."

        Ответ:
        {
          "insurance_obligation_status": "not_defined",
          "insurance_obligation_details": "Данные не определены",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Данные не определены",
          "franchise_status": "not_defined",
          "franchise_details": "Данные не определены",
          "coverage_exclusions_status": "not_defined",
          "coverage_exclusions_details": "Данные не определены",
          "insurance_risk_summary": "Не урегулировано (риск на собственнике по ГК РФ)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности страхования.
        2. Найди прямую цитату о распределении рисков.
        3. Найди прямую цитату о выгодоприобретателе.
        4. Найди прямую цитату о франшизе.
        5. Найди прямую цитату об исключениях из покрытия.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "insurance_obligation_status": "<defined / not_defined>",
          "insurance_obligation_details": "<текст или 'Данные не определены'>",
          "risk_allocation_status": "<defined / not_defined>",
