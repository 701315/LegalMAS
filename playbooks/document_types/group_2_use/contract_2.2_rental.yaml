          description: "Формулировка об исключении нормального / естественного износа (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "normal_wear_excluded_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Учет износа"
