      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката подтверждение
        титула арендодателя на предмет проката и заверения об отсутствии
        залога, ареста и прав третьих лиц.
        Не анализируй арендную плату, ремонт, возврат имущества или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей (все обязательны в ответе):

        1. title_confirmation_status — "defined" если право собственности
           арендодателя прямо подтверждено в тексте («принадлежит на праве
           собственности», «является собственником»), иначе "not_defined".
        2. title_confirmation_details — формулировка о праве собственности.
           Если отсутствует — "Данные не определены".
        3. no_pledge_status — "defined" если отсутствие залога прямо указано
           («не заложен», «не является предметом залога»), иначе "not_defined".
        4. no_pledge_details — формулировка об отсутствии залога.
           Если отсутствует — "Данные не определены".
        5. no_arrest_status — "defined" если отсутствие ареста/запретов прямо
           указано («не арестован», «запреты на распоряжение отсутствуют»),
           иначе "not_defined".
        6. no_arrest_details — формулировка об отсутствии ареста.
           Если отсутствует — "Данные не определены".
        7. no_third_party_rights_status — "defined" если отсутствие прав
           третьих лиц прямо указано («свободен от прав третьих лиц»,
           «не обременён правами третьих лиц»), иначе "not_defined".
        8. no_third_party_rights_details — формулировка об отсутствии прав
           третьих лиц. Если отсутствует — "Данные не определены".
        9. title_warranty_summary — краткий user-friendly статус:
           - "Подтверждены" — если все 4 аспекта (собственность, залог, арест,
             права третьих лиц) прямо подтверждены в тексте;
           - "Частично подтверждены" — если подтверждено 2-3 аспекта из 4;
           - "Не упомянуты (норма для проката)" — если ни один аспект не
             подтверждён явно (в потребительском прокате это типичная ситуация,
             право арендодателя подразумевается в силу ст. 608 ГК РФ);
           - "Данные не определены" — если договор не содержит данных о предмете.

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ст. 608 ГК РФ)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - title_confirmation_status = "defined" ТОЛЬКО если в тексте есть прямые
        слова о праве собственности арендодателя.
        - В договорах потребительского проката заверения о титуле часто не
        прописываются явно — это норма, а не недостаток договора.
        - Не путай отсутствие залога со стороны арендодателя (этот check) с
        запретом залога со стороны арендатора (Check 12).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о титуле, собственности,
          залоге, аресте или правах третьих лиц — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле, разделе «Предмет договора» или «Заверения сторон».
        - Заверения о титуле обычно находятся в начале договора (преамбула,
          предмет договора).
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 9 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

