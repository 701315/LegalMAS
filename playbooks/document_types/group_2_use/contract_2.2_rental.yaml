        <role>
        Ты — российский юрист. Извлеки из текста договора проката тарифную
        модель: единица тарификации, минимальный период, плата за превышение,
        округление и автоматическое доначисление.
        Не анализируй предмет проката, ремонт, возврат или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. tariff_unit_status — "defined" если единица тарификации прямо указана,
           иначе "not_defined".
        2. tariff_unit_details — формулировка.
        3. minimum_period_status — "defined" если минимальный оплачиваемый период
           прямо указан, иначе "not_defined".
        4. minimum_period_details — формулировка.
        5. overrun_fee_status — "defined" если плата за превышение срока прямо
           указана, иначе "not_defined".
        6. overrun_fee_details — формулировка.
        7. rounding_rule_status — "defined" если правило округления прямо указано,
           иначе "not_defined".
        8. rounding_rule_details — формулировка.
        9. auto_charge_status — "defined" если автоматическое доначисление прямо
           предусмотрено, иначе "not_defined".
        10. auto_charge_details — формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не смешивай плату за прокат с залогом / депозитом.
        - Верни только JSON.
        </rules>
      fields:
        - name: "tariff_unit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания единицы тарификации."
          required: true
        - name: "tariff_unit_details"
          type: "string"
          presentation: "fact"
          label: "Тариф"
          description: "Единица тарификации и стоимость."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "minimum_period_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус минимального оплачиваемого периода."
          required: false
        - name: "minimum_period_details"
          type: "string"
          presentation: "fact"
          label: "Минимальный период"
          description: "Минимальный оплачиваемый период проката."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "overrun_fee_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус платы за превышение срока."
          required: false
        - name: "overrun_fee_details"
          type: "string"
          presentation: "fact"
          label: "Плата за превышение"
          description: "Формулировка о плате за превышение срока проката."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "rounding_rule_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус правила округления."
          required: false
        - name: "rounding_rule_details"
          type: "string"
          presentation: "fact"
          label: "Округление"
          description: "Формулировка о правиле округления."
          required: false
          display_in_grid: false
        - name: "auto_charge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус автоматического доначисления."
          required: false
        - name: "auto_charge_details"
          type: "string"
          presentation: "fact"
          label: "Автоматическое доначисление"
          description: "Формулировка об автоматическом доначислении."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 16: Титул арендодателя на предмет
  # ──────────────────────────────────────────────────────────────────────────
  - id: rental_item_title_and_no_third_party_rights_check
    name: "Титул арендодателя на предмет проката и отсутствие прав третьих лиц"
    description: >
      Фактографическая проверка наличия в тексте подтверждения права
      собственности арендодателя на предмет проката, отсутствия залога,
      ареста и прав третьих лиц.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "вправе передавать в прокат"
        - "правоустанавливающие документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)свободн(о|ым)\\s+от\\s+прав\\s+третьих"
        - "(?i)не\\s+заложен|не\\s+арестован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: подтверждение права арендодателя
        на предмет проката и отсутствие обременений.

        Нормативный ориентир:
        - ст. 608 ГК РФ — право сдачи имущества в аренду

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности арендодателя на предмет проката.
        2. Есть ли указание на отсутствие залога.
        3. Есть ли указание на отсутствие ареста.
        4. Есть ли указание на отсутствие прав третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул подтверждён:
        Фрагмент:
        "Арендодатель подтверждает, что предмет проката принадлежит ему
        на праве собственности, не заложен, не арестован и свободен
        от прав третьих лиц."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "принадлежит на праве собственности",
          "no_pledge_status": "defined",
          "no_pledge_details": "не заложен",
          "no_arrest_status": "defined",
          "no_arrest_details": "не арестован",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "свободен от прав третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 1.4",
              "quote": "Арендодатель подтверждает, что предмет проката принадлежит ему на праве собственности, не заложен, не арестован и свободен от прав третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт предмет проката Арендатору."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Данные не определены",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности.
        2. Найди прямую цитату об отсутствии залога.
        3. Найди прямую цитату об отсутствии ареста.
        4. Найди прямую цитату об отсутствии прав третьих лиц.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Данные не определены'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Данные не определены'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Данные не определены'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принадлежит на праве собственности свободно от прав третьих лиц не заложено не арестовано вправе передавать в прокат правоустанавливающие документы"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "субаренда"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката подтверждение
        титула арендодателя на предмет проката и заверения об отсутствии
        залога, ареста и прав третьих лиц.
        Не анализируй плату, ремонт, возврат или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. title_confirmation_status — "defined" если право собственности
           арендодателя прямо подтверждено, иначе "not_defined".
        2. title_confirmation_details — формулировка.
        3. no_pledge_status — "defined" если отсутствие залога прямо указано,
           иначе "not_defined".
        4. no_pledge_details — формулировка.
        5. no_arrest_status — "defined" если отсутствие ареста прямо указано,
           иначе "not_defined".
        6. no_arrest_details — формулировка.
        7. no_third_party_rights_status — "defined" если отсутствие прав
           третьих лиц прямо указано, иначе "not_defined".
        8. no_third_party_rights_details — формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - title_confirmation_status = "defined" только если право собственности
          прямо подтверждено; не выводи из факта заключения договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "title_confirmation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения титула арендодателя."
          required: true
        - name: "title_confirmation_details"
          type: "string"
          presentation: "fact"
          label: "Титул арендодателя"
          description: "Формулировка о праве собственности арендодателя."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "no_pledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога."
          required: false
        - name: "no_pledge_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие залога"
          description: "Формулировка об отсутствии залога."
          required: false
          display_in_grid: false
        - name: "no_arrest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии ареста."
          required: false
        - name: "no_arrest_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие ареста"
          description: "Формулировка об отсутствии ареста."
          required: false
          display_in_grid: false
        - name: "no_third_party_rights_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии прав третьих лиц."
          required: false
        - name: "no_third_party_rights_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие прав третьих лиц"
          description: "Формулировка об отсутствии прав третьих лиц."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: кто выступает профессиональным арендодателем,
      на каком основании он осуществляет деятельность по прокату, а также реквизиты арендатора.
    addressee: "Арендодатель / Юридический советник"

  rental_subject_and_consumer_purpose_extraction:
    text: >
      Просим предоставить по {doc_names}: описание предмета проката, срок,
      твердую стоимость проката, наличие залога/депозита и подтверждение,
      что использование имеет бытовой/потребительский характер.
    addressee: "Арендодатель"

  consumer_purpose_declaration:
    text: >
      Просим уточнить в {doc_names}, что имущество предоставляется именно
      для личных, семейных, бытовых нужд, а не для предпринимательской деятельности.
    addressee: "Юридический советник"

  movable_property_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный/инвентарный номер,
      комплектность и состояние имущества на момент выдачи.
    addressee: "Арендодатель"

  fixed_rent_payment:
    text: >
      Просим подтвердить в {doc_names}: размер платы в твердой сумме,
      единицу тарификации (час/сутки/день), порядок оплаты и возврата части платы
      при досрочном возврате.
    addressee: "Арендодатель / Финансовый консультант"

  term_limitation_one_year:
    text: >
      Просим уточнить в {doc_names}: срок проката и подтвердить,
      что он не выходит за пределы специального режима договора проката.
    addressee: "Юридический советник"

  public_contract_status_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор публичным,
      применяются ли единые условия для всех потребителей и в какой форме
      опубликована оферта/типовые условия.
    addressee: "Юридический советник"

  public_contract_declaration:
    text: >
      Просим включить в {doc_names} прямое указание на публичный характер договора
      и единые условия для всех обратившихся потребителей.
    addressee: "Юридический советник арендодателя"

  unilateral_termination_consumer_check:
    text: >
      Просим уточнить в {doc_names}: право арендатора на отказ в любое время,
      порядок уведомления, перерасчет платы и возврат денежных средств
      за неиспользованный период.
    addressee: "Юридический советник"

  fitness_and_instruction_check:
    text: >
      Просим предоставить по {doc_names}: порядок проверки исправности имущества,
      форму подтверждения инструктажа, правила эксплуатации и safety rules.
    addressee: "Арендодатель"

  fitness_warranty_and_safety_briefing:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность арендодателя
      проверить исправность имущества, провести инструктаж и ознакомить
      арендатора с правилами эксплуатации и техники безопасности.
    addressee: "Юридический советник арендодателя"

  repairs_obligation_check:
    text: >
      Просим уточнить в {doc_names}: что капитальный и текущий ремонт,
      а также устранение недостатков и замена неисправного имущества
      осуществляются за счет арендодателя.
    addressee: "Юридический советник"

  all_repairs_by_lessor:
    text: >
      Просим привести в {doc_names} блок ремонта в соответствие со ст. 631 ГК РФ
      и исключить возложение ремонтных обязанностей на арендатора.
    addressee: "Юридический советник арендодателя"

  sublease_and_personal_use_check:
    text: >
      Просим уточнить в {doc_names}: запрет субаренды, передачи вещи третьим лицам
      и подтверждение личного характера использования имущества.
    addressee: "Юридический советник"

  absolute_prohibition_of_sublease:
    text: >
      Просим включить в {doc_names} прямой запрет субаренды, перенаема
      и передачи имущества третьим лицам.
    addressee: "Юридический советник арендодателя"

  deposit_and_damage_liability_check:
    text: >
      Просим уточнить в {doc_names}: режим депозита/залога, основания удержания,
      порядок возврата, ответственность за утрату/повреждение и исключение
      нормального износа из зоны ответственности арендатора.
    addressee: "Арендодатель / Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита, основание его удержания,
      сроки возврата и порядок документального подтверждения повреждений.
    addressee: "Юридический советник"

  clear_liability_for_damage:
    text: >
      Просим уточнить в {doc_names}: как определяется размер ответственности
      арендатора за повреждение или утрату имущества (ремонт / полная стоимость / market value).
    addressee: "Юридический советник"

  normal_wear_and_tear_exclusion:
    text: >
      Просим включить в {doc_names} прямое указание, что арендатор не отвечает
      за нормальный (естественный) износ имущества при надлежащем использовании.
    addressee: "Юридический советник"

  consumer_law_application:
    text: >
      Просим уточнить в {doc_names}: применение Закона о защите прав потребителей,
      исключить unfair terms и раскрыть все дополнительные платные услуги
      (страховка, допоборудование, комиссии).
    addressee: "Юридический советник / Compliance"

  breakdown_emergency_procedure_check:
    text: >
      Просим уточнить в {doc_names}: порядок действий при поломке,
      экстренный контакт, запрет на самостоятельный ремонт и порядок замены вещи.
    addressee: "Арендодатель / Юридический советник"

  breakdown_emergency_procedure:
    text: >
      Просим включить в {doc_names}: emergency procedure на случай поломки
      или аварийной ситуации, включая обязанность немедленного уведомления арендодателя.
    addressee: "Юридический советник арендодателя"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      а также consumer-specific forum aspects, если применимо.
    addressee: "Юридический советник"

  commercial_use_reclassification_risk:
    text: >
      Внимание: {doc_names} содержит признаки использования имущества
      для предпринимательских целей. Просим проверить корректность квалификации
      договора и, при необходимости, перевести документ в режим общей аренды.
    addressee: "Юридический советник"

  term_over_one_year_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить, не превышает ли срок проката
      пределы специального режима договора проката. Просим дать квалификационное заключение.
    addressee: "Юридический советник"

  consumer_law_mandatory_context:
    text: >
      Внимание: {doc_names} подпадает под consumer-law контекст.
      Просим проверить текст на unfair terms, навязывание дополнительных услуг,
      ограничения права на отказ и возврат денежных средств.
    addressee: "Юридический советник / Compliance"

  return_procedure_and_condition_check:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета проката —
      допустимое состояние (нормальный износ vs повреждения), метод оценки
      (сравнение с актом выдачи, фото), комплектность, место и время возврата,
      штрафы за просрочку, порядок удержания из депозита.
    addressee: "Арендодатель / Юридический советник"

  return_conditions_and_penalties:
    text: >
      В {doc_names} не урегулированы условия возврата имущества. Просим включить:
      порядок приёмки при возврате, стандарт допустимого состояния, санкции
      за просрочку (неустойка за каждый день/час), место возврата, порядок
      фиксации повреждений.
    addressee: "Юридический советник арендодателя"

  issuance_act_receipt:
    text: >
      Просим включить в {doc_names}: акт выдачи / квитанцию с фиксацией
      состояния имущества, комплектности и внешнего вида при передаче арендатору.
      Это необходимо для объективного сравнения при возврате.
    addressee: "Юридический советник арендодателя"

  personal_data_consent:
    text: >
      Просим включить в {doc_names}: согласие арендатора на обработку
      персональных данных (ФЗ-152), цели обработки, перечень данных,
      сроки хранения и порядок отзыва согласия.
    addressee: "Юридический советник / Compliance"

  age_restrictions:
    text: >
      Просим уточнить в {doc_names}: возрастные ограничения для арендатора,
      порядок проверки возраста, необходимость согласия законных представителей
      для несовершеннолетних (если допускается).
    addressee: "Юридический советник арендодателя"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
