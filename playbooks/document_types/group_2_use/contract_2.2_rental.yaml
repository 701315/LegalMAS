#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  duration_pattern: "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
  serial_number: "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны договора проката
  # ──────────────────────────────────────────────────────────────────────────
  - id: rental_parties_and_authority
    name: "Стороны договора проката: арендодатель, арендатор, полномочия"
    description: >
      Фактографическая проверка идентификации сторон договора проката:
      арендодатель (профессиональный — ИП или коммерческая организация),
      арендатор (гражданин), реквизиты, подписанты и основания полномочий.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "гражданин"
        - "ИП"
        - "коммерческая организация"
        - "пункт проката"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: идентификация арендодателя и арендатора,
        полномочия подписантов.

        Нормативный ориентир:
        - ст. 626 ГК РФ — арендодатель — лицо, осуществляющее сдачу имущества
          в аренду в качестве постоянной предпринимательской деятельности
        - ст. 432 ГК РФ — идентификация сторон

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Арендодатель (наименование/ФИО, ИНН, ОГРН/ОГРНИП).
        2. Есть ли признаки профессионального арендодателя (ИП, организация, пункт проката).
        3. Кто указан как Арендатор (ФИО, паспортные данные).
        4. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стороны определены:
        Фрагмент:
        "ИП Сидоров А.А. (ОГРНИП 312770000000001), именуемый «Арендодатель»,
        осуществляющий деятельность пункта проката, и гражданин Петров П.П.
        (паспорт серия 4500 № 123456), именуемый «Арендатор»."

        Ответ:
        {
          "landlord_details_status": "defined",
          "landlord_details_value": "ИП Сидоров А.А., ОГРНИП 312770000000001",
          "landlord_type": "individual_entrepreneur",
          "landlord_professional_status": "defined",
          "landlord_professional_details": "осуществляющий деятельность пункта проката",
          "landlord_signatory_status": "defined",
          "landlord_signatory_value": "Сидоров А.А.",
          "landlord_signatory_basis": "not_defined",
          "tenant_details_status": "defined",
          "tenant_details_value": "гражданин Петров П.П., паспорт серия 4500 № 123456",
          "tenant_type": "individual",
          "tenant_signatory_status": "defined",
          "tenant_signatory_value": "Петров П.П.",
          "tenant_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ИП Сидоров А.А. (ОГРНИП 312770000000001), именуемый «Арендодатель», осуществляющий деятельность пункта проката, и гражданин Петров П.П. (паспорт серия 4500 № 123456), именуемый «Арендатор»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "landlord_details_status": "not_defined",
          "landlord_details_value": "Данные не определены",
          "landlord_type": "not_defined",
          "landlord_professional_status": "not_defined",
          "landlord_professional_details": "Данные не определены",
          "landlord_signatory_status": "not_defined",
          "landlord_signatory_value": "Данные не определены",
          "landlord_signatory_basis": "not_defined",
          "tenant_details_status": "not_defined",
          "tenant_details_value": "Данные не определены",
          "tenant_type": "not_defined",
          "tenant_signatory_status": "not_defined",
          "tenant_signatory_value": "Данные не определены",
          "tenant_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Арендодателя.
        2. Найди прямую цитату о профессиональном характере деятельности.
        3. Найди прямую цитату с идентификацией Арендатора.
        4. Найди прямую цитату о подписантах и полномочиях.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "landlord_details_status": "<defined / not_defined>",
          "landlord_details_value": "<текст или 'Данные не определены'>",
          "landlord_type": "<legal_entity / individual_entrepreneur / not_defined>",
          "landlord_professional_status": "<defined / not_defined>",
          "landlord_professional_details": "<текст или 'Данные не определены'>",
          "landlord_signatory_status": "<defined / not_defined>",
          "landlord_signatory_value": "<текст или 'Данные не определены'>",
          "landlord_signatory_basis": "<charter / poa / order / other / not_defined>",
          "tenant_details_status": "<defined / not_defined>",
          "tenant_details_value": "<текст или 'Данные не определены'>",
          "tenant_type": "<individual / individual_entrepreneur / not_defined>",
          "tenant_signatory_status": "<defined / not_defined>",
          "tenant_signatory_value": "<текст или 'Данные не определены'>",
          "tenant_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "арендодатель арендатор гражданин ИП коммерческая организация пункт проката в лице действующего на основании ИНН ОГРН ОГРНИП паспорт реквизиты"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет проката"
        - "арендная плата"
        - "срок проката"
        - "ремонт"
        - "субаренда"
        - "возврат имущества"
        - "депозит"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката сведения
        об Арендодателе, Арендаторе, подписантах и профессиональном характере
        деятельности арендодателя.
        Не анализируй предмет проката, плату, ремонт или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. landlord_details_status — "defined" если Арендодатель прямо идентифицирован,
           иначе "not_defined".
        2. landlord_details_value — наименование/ФИО и реквизиты Арендодателя.
        3. landlord_type — "legal_entity" / "individual_entrepreneur" / "not_defined".
        4. landlord_professional_status — "defined" если профессиональный характер
           деятельности прямо указан (пункт проката, постоянная предпринимательская
           деятельность), иначе "not_defined".
        5. landlord_professional_details — формулировка.
        6. landlord_signatory_status — "defined" если подписант прямо указан,
           иначе "not_defined".
        7. landlord_signatory_value — подписант Арендодателя.
        8. landlord_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        9. tenant_details_status — "defined" если Арендатор прямо идентифицирован,
           иначе "not_defined".
        10. tenant_details_value — ФИО и реквизиты Арендатора.
        11. tenant_type — "individual" / "individual_entrepreneur" / "not_defined".
        12. tenant_signatory_status — "defined" если подписант прямо указан,
            иначе "not_defined".
        13. tenant_signatory_value — подписант Арендатора.
        14. tenant_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - landlord_type:
            - "legal_entity" — ООО, АО и иные юрлица.
            - "individual_entrepreneur" — ИП (указан ОГРНИП).
            - "not_defined" — тип прямо не указан.
        - tenant_type:
            - "individual" — гражданин / физическое лицо.
            - "individual_entrepreneur" — ИП.
            - "not_defined" — тип прямо не указан.
        - landlord_signatory_basis / tenant_signatory_basis:
            - "charter" — устав.
            - "poa" — доверенность.
            - "order" — приказ.
            - "other" — иное основание.
            - "not_defined" — не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "landlord_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Арендодателя."
          required: true
        - name: "landlord_details_value"
          type: "string"
          presentation: "fact"
          label: "Арендодатель: реквизиты"
          description: "Наименование/ФИО и реквизиты Арендодателя."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "landlord_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "not_defined"]
          description: "Тип Арендодателя."
          required: false
        - name: "landlord_professional_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на профессиональный характер деятельности."
          required: false
        - name: "landlord_professional_details"
          type: "string"
          presentation: "fact"
          label: "Профессиональный арендодатель"
          description: "Формулировка о профессиональном характере деятельности."
          required: false
          display_in_grid: false
        - name: "landlord_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подписанта Арендодателя."
          required: false
        - name: "landlord_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Арендодатель: подписант"
          description: "Подписант от Арендодателя."
          required: false
          display_in_grid: false
        - name: "landlord_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Арендодателя."
          required: false
        - name: "tenant_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Арендатора."
          required: true
        - name: "tenant_details_value"
          type: "string"
          presentation: "fact"
          label: "Арендатор: реквизиты"
          description: "ФИО и реквизиты Арендатора."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "tenant_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["individual", "individual_entrepreneur", "not_defined"]
          description: "Тип Арендатора."
          required: false
        - name: "tenant_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подписанта Арендатора."
          required: false
        - name: "tenant_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Арендатор: подписант"
          description: "Подписант от Арендатора."
          required: false
          display_in_grid: false
        - name: "tenant_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Арендатора."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет проката, срок, плата
  # ──────────────────────────────────────────────────────────────────────────
  - id: rental_subject_and_consumer_purpose_extraction
    name: "Предмет проката, срок, плата и потребительская цель использования"
    description: >
      Фактографическая проверка наличия в договоре проката описания предмета,
      срока проката, размера платы, потребительской цели использования
      и обеспечительного платежа.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "прокат"
        - "предмет проката"
        - "бытовые нужды"
        - "потребительские цели"
