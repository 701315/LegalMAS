          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: "Кто несёт обязанность по текущему ремонту (raw enum)."
          required: true

        - name: "current_repairs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
