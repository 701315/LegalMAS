        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на отказ.
        2. Найди прямую цитату о сроке уведомления.
        3. Найди прямую цитату о перерасчёте / возврате платы.
        4. Найди прямую цитату о досрочном возврате.
        5. Найди прямую цитату об ограничениях права на отказ (если они есть).
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_right_status": "<defined / not_defined>",
          "termination_right_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "refund_recalculation_status": "<defined / not_defined>",
          "refund_recalculation_details": "<текст или 'Данные не определены'>",
          "early_return_status": "<defined / not_defined>",
          "early_return_details": "<текст или 'Данные не определены'>",
          "termination_restriction_status": "<defined / not_defined>",
          "termination_restriction_details": "<текст или 'Данные не определены'>",
          "termination_restriction_display": "<'Не установлены' / краткая суть ограничений / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вправе отказаться в любое время односторонний отказ досрочный возврат имущества перерасчёт возврат части платы уведомление за не менее чем за"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
        - procedures
      negative_keywords:
        - "предмет проката"
        - "арендная плата"
        - "ремонт"
        - "депозит"
        - "субаренда"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "unilateral_termination_consumer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката право арендатора
        на односторонний отказ от договора, срок уведомления, условия перерасчёта
        платы, условия досрочного возврата имущества и ограничения права на отказ.
        Не анализируй предмет проката, базовую цену, ремонт или залог/депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unilateral_termination_consumer_check_presence:
           Агрегатное signal-поле — наличие регулирования по праву арендатора
           на досрочный отказ и связанные с ним условия.
           - "present" — если хотя бы одно из содержательных полей
             (termination_right_status, notice_period_status,
              refund_recalculation_status, early_return_status,
              termination_restriction_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_right_status = "not_defined";
           - termination_right_details = "Данные не определены";
           - notice_period_status = "not_defined";
           - notice_period_details = "Данные не определены";
           - refund_recalculation_status = "not_defined";
           - refund_recalculation_details = "Данные не определены";
           - early_return_status = "not_defined";
           - early_return_details = "Данные не определены";
           - termination_restriction_status = "not_defined";
           - termination_restriction_details = "Данные не определены";
           - termination_restriction_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_right_status — "defined" если право на отказ прямо
           предусмотрено, иначе "not_defined".
        2. termination_right_details — формулировка о праве на отказ из текста
           договора (например, "вправе отказаться в любое время").
           Если отсутствует — "Данные не определены".
        3. notice_period_status — "defined" если срок уведомления прямо указан,
           иначе "not_defined".
        4. notice_period_details — срок уведомления (например, "за 10 дней",
           "в день возврата"). Если отсутствует — "Данные не определены".
        5. refund_recalculation_status — "defined" если перерасчёт / возврат платы
           при досрочном отказе/возврате прямо предусмотрен, иначе "not_defined".
        6. refund_recalculation_details — формулировка о перерасчёте / возврате
           платы. Если отсутствует — "Данные не определены".
        7. early_return_status — "defined" если досрочный возврат имущества прямо
           предусмотрен, иначе "not_defined".
        8. early_return_details — формулировка о досрочном возврате.
           Если отсутствует — "Данные не определены".
        9. termination_restriction_status — "defined" если в тексте обнаружены
           ограничения права на отказ (например, штрафы за отказ, минимальный
           невозвратный срок, удержание всей платы, необходимость согласия
           арендодателя), иначе "not_defined".
        10. termination_restriction_details — формулировка ограничений.
            Если отсутствует — "Данные не определены".
        11. termination_restriction_display — краткое user-friendly значение:
            - "Не установлены" — если договор прямо разрешает отказ в любое
              время без штрафов и удержаний платы за неиспользованные дни,
              или если ограничения не найдены вовсе (при наличии самого права);
            - краткая суть ограничений (например, "Минимальный срок 1 месяц",
              "Штраф 20% при возврате", "Аванс не возвращается");
            - "Данные не определены" — если право на отказ вообще не описано
              и договор "молчит" о расторжении.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - termination_restriction_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни unilateral_termination_consumer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details/*_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо
          текста договора.
        - Не оценивай риски, не давай юридических выводов.
        - termination_restriction_status = "defined" только если ограничения
          прямо прописаны в тексте договора. В прокате любые ограничения права
          арендатора на отказ ничтожны, но мы должны извлечь их как факт,
          если они есть.
        - Ограничениями права на отказ являются:
            - минимальный срок аренды, до истечения которого отказ запрещён;
            - штрафы или сборы за досрочный возврат имущества;
            - условия о том, что уплаченный аванс не возвращается ни при каких
              обстоятельствах;
            - требования получить предварительное согласие арендодателя на отказ;
            - срок предупреждения более 10 дней (ухудшает положение потребителя).
        - Не выводи право на отказ из ст. 627 ГК РФ — фиксируй только то,
          что написано в тексте.
        - Если фрагмент контекста не содержит данных об отказе от договора,
          возврате вещи или расчётах при расторжении — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Порядок расторжения» или «Права и обязанности Арендатора».
        - Отличай право арендодателя на отказ (в связи с нарушениями) от права
          арендатора на отказ (по его воле) — извлекай только условия отказа
          Арендатора.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на отказ, ни срока уведомления, ни перерасчёта
           платы, ни досрочного возврата, ни ограничений.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы.
           Право на отказ указано, но без срока уведомления, без перерасчёта
           платы и без досрочного возврата.
           → presence = "present";
             termination_right_status = "defined";
             notice_period_status = "not_defined";
             refund_recalculation_status = "not_defined";
             early_return_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано право арендатора на отказ в любое время,
           в другом — право арендодателя на удержание всей платы при досрочном
           возврате, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             termination_restriction_status = "not_defined";
             termination_restriction_details = "Не удалось определить";
             termination_restriction_display = "Данные не определены".

        4. Специфика темы: ничтожное ограничение права на отказ.
           В тексте прямо предусмотрены ограничения права на отказ, ничтожные
           по ст. 627 ГК РФ (минимальный срок аренды, штраф за отказ, удержание
           аванса, требование согласия арендодателя, срок предупреждения > 10 дней).
           → presence = "present";
             termination_restriction_status = "defined";
             termination_restriction_details = точная формулировка из текста;
             termination_restriction_display = краткая суть ограничения.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unilateral_termination_consumer_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * termination_right_details → "Данные не определены";
          * notice_period_details → "Данные не определены";
          * refund_recalculation_details → "Данные не определены";
          * early_return_details → "Данные не определены";
          * termination_restriction_details / termination_restriction_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * termination_restriction_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unilateral_termination_consumer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по праву арендатора на досрочный отказ и перерасчёт платы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права арендатора на досрочный отказ."
          required: true

        - name: "termination_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Досрочный отказ арендатора"
          description: "Формулировка о праве арендатора на односторонний отказ от договора в любое время (ст. 627 ГК РФ)."
          required: false

        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока уведомления."
          required: true

        - name: "notice_period_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок уведомления"
          description: "Срок уведомления об отказе от договора (по закону — не менее чем за 10 дней)."
          required: false

        - name: "refund_recalculation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перерасчёта / возврата платы."
          required: true

        - name: "refund_recalculation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Перерасчёт платы"
          description: "Формулировка о перерасчёте арендной платы и возврате части денег за неиспользованный период проката."
          required: false

        - name: "early_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о досрочном возврате имущества."
          required: true

        - name: "early_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Досрочный возврат"
          description: "Формулировка о досрочном возврате имущества Арендодателю."
          required: false

        - name: "termination_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений права на отказ."
          required: true

        - name: "termination_restriction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ограничения на расторжение"
          description: "Полная формулировка об ограничениях права арендатора на отказ (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "termination_restriction_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Ограничения отказа"
          description: "Краткое user-friendly значение обнаруженных ограничений или удержаний при досрочном отказе (red flags по ст. 627 ГК РФ)."
          required: false
      store_payload: true

  - id: fitness_and_instruction_check
    name: "Исправность имущества, проверка при выдаче и инструктаж арендатора"
    description: >
      Фактографическая проверка наличия в тексте условий о проверке исправности
      при выдаче, ознакомлении арендатора с правилами эксплуатации и технике
      безопасности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исправное состояние"
        - "проверка исправности"
        - "правила эксплуатации"
        - "инструктаж"
        - "техника безопасности"
        - "ознакомление с правилами"
        - "подпись об ознакомлении"
        - "комплектность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)проверк(а|и)\\s+исправност"
        - "(?i)правил(а|ами)\\s+эксплуатац"
        - "(?i)техник(а|е)\\s+безопасност"
        - "(?i)подпис(ь|ью)\\s+об\\s+ознакомлен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: проверка исправности при выдаче,
        инструктаж арендатора, правила эксплуатации, техника безопасности
        и комплектность.

        Нормативный ориентир:
        - ст. 628 ГК РФ — арендодатель обязан в присутствии арендатора проверить
          исправность сдаваемого в аренду имущества, а также ознакомить арендатора
          с правилами эксплуатации имущества либо выдать ему письменные
          инструкции о пользовании этим имуществом.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о проверке исправности имущества при выдаче.
        2. Есть ли условие об ознакомлении арендатора с правилами эксплуатации
           (включая выдачу письменных инструкций/руководств).
        3. Есть ли упоминание техники безопасности.
        4. Есть ли условие о фиксации подписи арендатора об ознакомлении
           (в договоре, акте выдачи или квитанции).
        5. Есть ли условие о проверке комплектности при выдаче.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — проверка и инструктаж урегулированы:
        Фрагмент:
        "Арендодатель обязан проверить исправность и комплектность имущества
        в присутствии Арендатора, а также передать инструкцию по эксплуатации.
        Арендатор подтверждает исправность и прохождение инструктажа подписью
        в акте приёма-передачи."

        Ответ:
        {
          "fitness_check_status": "defined",
          "fitness_check_details": "проверить исправность в присутствии Арендатора",
          "instruction_status": "defined",
          "instruction_details": "передать инструкцию по эксплуатации",
          "safety_rules_status": "not_defined",
          "safety_rules_details": "Данные не определены",
          "acknowledgment_signature_status": "defined",
          "acknowledgment_signature_details": "подтверждает исправность и прохождение инструктажа подписью в акте приёма-передачи",
          "completeness_check_status": "defined",
          "completeness_check_details": "проверить комплектность имущества в присутствии Арендатора",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Арендодатель обязан проверить исправность и комплектность имущества в присутствии Арендатора, а также передать инструкцию по эксплуатации."
            },
            {
              "clause_ref": "п. 2.3",
              "quote": "Арендатор подтверждает исправность и прохождение инструктажа подписью в акте приёма-передачи."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендодатель передаёт имущество Арендатору во временное пользование."

        Ответ:
        {
          "fitness_check_status": "not_defined",
          "fitness_check_details": "Данные не определены",
          "instruction_status": "not_defined",
          "instruction_details": "Данные не определены",
          "safety_rules_status": "not_defined",
          "safety_rules_details": "Данные не определены",
          "acknowledgment_signature_status": "not_defined",
          "acknowledgment_signature_details": "Данные не определены",
          "completeness_check_status": "not_defined",
          "completeness_check_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о проверке исправности.
        2. Найди прямую цитату об ознакомлении с правилами или передаче инструкций.
        3. Найди прямую цитату о технике безопасности.
        4. Найди прямую цитату о подписи арендатора об ознакомлении.
        5. Найди прямую цитату о проверке комплектности.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "fitness_check_status": "<defined / not_defined>",
          "fitness_check_details": "<текст или 'Данные не определены'>",
          "instruction_status": "<defined / not_defined>",
          "instruction_details": "<текст или 'Данные не определены'>",
          "safety_rules_status": "<defined / not_defined>",
          "safety_rules_details": "<текст или 'Данные не определены'>",
          "acknowledgment_signature_status": "<defined / not_defined>",
          "acknowledgment_signature_details": "<текст или 'Данные не определены'>",
          "completeness_check_status": "<defined / not_defined>",
          "completeness_check_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исправное состояние проверка исправности правила эксплуатации инструктаж инструкция техника безопасности ознакомление подпись об ознакомлении комплектность акт приёма-передачи"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "возврат имущества"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "fitness_and_instruction_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        проверки исправности имущества при выдаче, инструктажа арендатора
        (включая выдачу инструкций), упоминания техники безопасности,
        подписи об ознакомлении и комплектности.
        Не анализируй размер платы, возврат имущества по окончании срока,
        ремонт или залог/депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. fitness_and_instruction_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме проверки
           исправности, инструктажа, техники безопасности и комплектности.
           - "present" — если хотя бы одно из содержательных полей
             (fitness_check_status, instruction_status,
              safety_rules_status, acknowledgment_signature_status,
              completeness_check_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - fitness_check_status = "not_defined";
           - fitness_check_details = "Данные не определены";
           - instruction_status = "not_defined";
           - instruction_details = "Данные не определены";
           - safety_rules_status = "not_defined";
           - safety_rules_details = "Данные не определены";
           - acknowledgment_signature_status = "not_defined";
           - acknowledgment_signature_details = "Данные не определены";
           - completeness_check_status = "not_defined";
           - completeness_check_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. fitness_check_status — "defined" если проверка исправности при выдаче
           прямо предусмотрена в тексте договора/акта, иначе "not_defined".
        2. fitness_check_details — формулировка о проверке исправности.
           Если отсутствует — "Данные не определены".
        3. instruction_status — "defined" если ознакомление с правилами эксплуатации
           или выдача письменной инструкции/руководства прямо предусмотрены,
           иначе "not_defined".
        4. instruction_details — формулировка об инструктаже / выдаче инструкции.
           Если отсутствует — "Данные не определены".
        5. safety_rules_status — "defined" если соблюдение техники безопасности
           прямо упомянуто, иначе "not_defined".
        6. safety_rules_details — формулировка о технике безопасности.
           Если отсутствует — "Данные не определены".
        7. acknowledgment_signature_status — "defined" если подпись арендатора
           об ознакомлении с правилами/исправностью прямо предусмотрена
           (в договоре, акте приёма-передачи, квитанции), иначе "not_defined".
        8. acknowledgment_signature_details — формулировка о подписи об ознакомлении.
           Если отсутствует — "Данные не определены".
        9. completeness_check_status — "defined" если проверка комплектности
           при выдаче прямо предусмотрена, иначе "not_defined".
        10. completeness_check_details — формулировка о комплектности.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни fitness_and_instruction_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 628 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - Передача письменного руководства пользователя / инструкции по эксплуатации
          квалифицируется как выполнение обязанности по ознакомлению
          (instruction_status = "defined").
        - Если проверка или подпись фиксируются в отдельном Акте выдачи /
          приёма-передачи согласно тексту договора — извлеки эту отсылку.
        - Если фрагмент контекста не содержит данных о проверке при передаче,
          инструкциях, технике безопасности или комплектности — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Порядок передачи имущества» или «Обязанности Арендодателя».
        - Не путай проверку исправности при *выдаче* (ст. 628 ГК РФ) с проверкой
          состояния при *возврате* имущества арендатором.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни проверки исправности, ни инструктажа, ни техники
           безопасности, ни подписи об ознакомлении, ни комплектности.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Проверка исправности указана, но без инструктажа, техники
           безопасности, подписи об ознакомлении и комплектности.
           → presence = "present";
             fitness_check_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указана обязанность арендодателя провести инструктаж,
           в другом — обязанность арендатора самостоятельно ознакомиться
           с правилами, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             instruction_status = "not_defined";
             instruction_details = "Не удалось определить".

        4. Специфика темы: фиксация в акте приёма-передачи.
           В договоре есть отсылка к акту приёма-передачи, в котором
           фиксируются исправность, комплектность и подпись арендатора
           об ознакомлении с правилами.
           → presence = "present";
             fitness_check_status = "defined";
             acknowledgment_signature_status = "defined";
             completeness_check_status = "defined";
             соответствующие *_details = точная формулировка из текста
             с указанием акта приёма-передачи.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для fitness_and_instruction_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * fitness_check_details → "Данные не определены";
          * instruction_details → "Данные не определены";
          * safety_rules_details → "Данные не определены";
          * acknowledgment_signature_details → "Данные не определены";
          * completeness_check_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "fitness_and_instruction_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о проверке исправности, инструктаже, технике безопасности и комплектности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "fitness_check_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о проверке исправности при выдаче."
          required: true

        - name: "fitness_check_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Проверка исправности"
          description: "Формулировка о проверке исправности имущества при передаче арендатору (ст. 628 ГК РФ)."
          required: false

        - name: "instruction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ознакомления с правилами эксплуатации / выдачи инструкции."
          required: true

        - name: "instruction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Инструктаж и правила"
          description: "Формулировка об ознакомлении арендатора с правилами эксплуатации или выдаче руководства (ст. 628 ГК РФ)."
          required: false

        - name: "safety_rules_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания техники безопасности."
          required: true

        - name: "safety_rules_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сведения о правилах безопасности"
          description: "Формулировка о технике безопасности (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "acknowledgment_signature_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подписи об ознакомлении."
          required: true

        - name: "acknowledgment_signature_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подпись об ознакомлении"
          description: "Формулировка о фиксации подписи арендатора об ознакомлении с правилами и исправностью."
          required: false

        - name: "completeness_check_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус проверки комплектности при выдаче."
          required: true

        - name: "completeness_check_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Комплектность"
          description: "Формулировка о проверке комплектности передаваемого имущества."
          required: false
      store_payload: true

  - id: repairs_obligation_check
    name: "Ремонт предмета проката: капитальный и текущий за счёт арендодателя (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка распределения обязанностей по капитальному
      и текущему ремонту, замене неисправного имущества и устранению недостатков.
      По ст. 631 ГК РФ оба вида ремонта — обязанность арендодателя.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "капитальный и текущий ремонт"
        - "ремонт за счет арендодателя"
        - "устранение недостатков"
        - "замена неисправного имущества"
        - "ремонт за счет арендатора"
        - "арендатор обязан ремонтировать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+(и\\s+текущ(ий|его)\\s+)?ремонт"
        - "(?i)ремонт.*за\\s+счет\\s+арендодател"
        - "(?i)ремонт.*за\\s+счет\\s+арендатор"
        - "(?i)арендатор.*обязан.*ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: распределение обязанностей по ремонту
        предмета проката, устранению недостатков и замене неисправного имущества.

        Нормативный ориентир:
        - ст. 631 ГК РФ — капитальный и текущий ремонт имущества, сданного
          в прокат, является обязанностью арендодателя. Возложение любого ремонта
          на арендатора-потребителя ничтожно (ст. 631 ГК РФ, ст. 16 ЗоЗПП).
        - ст. 629 ГК РФ — арендодатель обязан в 10-дневный срок (если иной срок
          не установлен договором) устранить недостатки либо заменить вещь.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На кого возложен капитальный ремонт.
        2. На кого возложен текущий ремонт.
        3. Есть ли условие об устранении недостатков арендодателем и сроки.
        4. Есть ли условие о замене неисправного имущества арендодателем.
        5. Есть ли перекладывание обязанностей по ремонту на арендатора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов и enum-полей допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ремонт на арендодателе, нарушений нет:
        Фрагмент:
        "Капитальный и текущий ремонт предмета проката осуществляется
        Арендодателем за свой счёт. При обнаружении неисправностей
        Арендодатель обязан в течение 3 дней устранить недостатки
        или заменить имущество на аналогичное."

        Ответ:
        {
          "capital_repairs_status": "defined",
          "capital_repairs_allocation": "landlord",
          "capital_repairs_details": "капитальный ремонт осуществляется Арендодателем за свой счёт",
          "current_repairs_status": "defined",
          "current_repairs_allocation": "landlord",
          "current_repairs_details": "текущий ремонт осуществляется Арендодателем за свой счёт",
          "defect_remedy_status": "defined",
          "defect_remedy_details": "в течение 3 дней устранить недостатки",
          "replacement_status": "defined",
          "replacement_details": "заменить имущество на аналогичное",
          "repair_shift_to_tenant_status": "not_defined",
          "repair_shift_to_tenant_details": "Данные не определены",
          "repair_shift_to_tenant_display": "Не возложен",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Капитальный и текущий ремонт предмета проката осуществляется Арендодателем за свой счёт. При обнаружении неисправностей Арендодатель обязан в течение 3 дней устранить недостатки или заменить имущество на аналогичное."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор пользуется имуществом в соответствии с его назначением."

        Ответ:
        {
          "capital_repairs_status": "not_defined",
          "capital_repairs_allocation": "not_defined",
          "capital_repairs_details": "Данные не определены",
          "current_repairs_status": "not_defined",
          "current_repairs_allocation": "not_defined",
          "current_repairs_details": "Данные не определены",
          "defect_remedy_status": "not_defined",
          "defect_remedy_details": "Данные не определены",
          "replacement_status": "not_defined",
          "replacement_details": "Данные не определены",
          "repair_shift_to_tenant_status": "not_defined",
          "repair_shift_to_tenant_details": "Данные не определены",
          "repair_shift_to_tenant_display": "Данные не определены",
          "evidence": []
        }

        Пример 3 — обнаружено возложение текущего ремонта на арендатора (нарушение ст. 631 ГК РФ):
        Фрагмент:
        "Арендодатель производит капитальный ремонт. Арендатор обязан за свой
        счёт производить текущий ремонт и профилактическое обслуживание имущества."

        Ответ:
        {
          "capital_repairs_status": "defined",
          "capital_repairs_allocation": "landlord",
          "capital_repairs_details": "Арендодатель производит капитальный ремонт",
          "current_repairs_status": "defined",
          "current_repairs_allocation": "tenant",
          "current_repairs_details": "Арендатор обязан за свой счёт производить текущий ремонт",
          "defect_remedy_status": "not_defined",
          "defect_remedy_details": "Данные не определены",
          "replacement_status": "not_defined",
          "replacement_details": "Данные не определены",
          "repair_shift_to_tenant_status": "defined",
          "repair_shift_to_tenant_details": "Арендатор обязан за свой счёт производить текущий ремонт и профилактическое обслуживание",
          "repair_shift_to_tenant_display": "Текущий ремонт возложен на арендатора (нарушение ст. 631 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Арендатор обязан за свой счёт производить текущий ремонт и профилактическое обслуживание имущества."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о капитальном ремонте.
        2. Найди прямую цитату о текущем ремонте.
        3. Найди прямую цитату об устранении недостатков.
        4. Найди прямую цитату о замене имущества.
        5. Найди прямую цитату о перекладывании ремонта на арендатора.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "capital_repairs_status": "<defined / not_defined>",
          "capital_repairs_allocation": "<landlord / tenant / mixed / not_defined>",
          "capital_repairs_details": "<текст или 'Данные не определены'>",
          "current_repairs_status": "<defined / not_defined>",
          "current_repairs_allocation": "<landlord / tenant / mixed / not_defined>",
          "current_repairs_details": "<текст или 'Данные не определены'>",
          "defect_remedy_status": "<defined / not_defined>",
          "defect_remedy_details": "<текст или 'Данные не определены'>",
          "replacement_status": "<defined / not_defined>",
          "replacement_details": "<текст или 'Данные не определены'>",
          "repair_shift_to_tenant_status": "<defined / not_defined>",
          "repair_shift_to_tenant_details": "<текст или 'Данные не определены'>",
          "repair_shift_to_tenant_display": "<'Не возложен' / 'Текущий ремонт возложен на арендатора (нарушение ст. 631 ГК РФ)' / 'Ремонт возложен на арендатора' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "капитальный ремонт текущий ремонт ремонт за счёт арендодателя устранение недостатков замена неисправного имущества ремонт за счёт арендатора арендатор обязан ремонтировать"
      retrieval_profile: "repair_maintenance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "возврат имущества"
        - "субаренда"
        - "депозит"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "repairs_obligation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката распределение
        обязанностей по ремонту: капитальный ремонт, текущий ремонт, устранение
        недостатков, замена неисправного имущества и возложение ремонта
        на арендатора.
        Не анализируй размер арендной платы, возврат имущества по окончании срока,
        субаренду или обеспечительный платёж/депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. repairs_obligation_check_presence:
           Агрегатное signal-поле — наличие регулирования по обязанностям
           ремонта предмета проката.
           - "present" — если хотя бы одно из содержательных полей
             (capital_repairs_status, current_repairs_status,
              defect_remedy_status, replacement_status,
              repair_shift_to_tenant_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - capital_repairs_status = "not_defined";
           - capital_repairs_allocation = "not_defined";
           - capital_repairs_details = "Данные не определены";
           - current_repairs_status = "not_defined";
           - current_repairs_allocation = "not_defined";
           - current_repairs_details = "Данные не определены";
           - defect_remedy_status = "not_defined";
           - defect_remedy_details = "Данные не определены";
           - replacement_status = "not_defined";
           - replacement_details = "Данные не определены";
           - repair_shift_to_tenant_status = "not_defined";
           - repair_shift_to_tenant_details = "Данные не определены";
           - repair_shift_to_tenant_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. capital_repairs_status — "defined" если обязанность по капремонту
           прямо распределена, иначе "not_defined".
        2. capital_repairs_allocation — "landlord" / "tenant" / "mixed" / "not_defined".
        3. capital_repairs_details — формулировка о капремонте из договора.
           Если отсутствует — "Данные не определены".
        4. current_repairs_status — "defined" если обязанность по текущему ремонту
           прямо распределена, иначе "not_defined".
        5. current_repairs_allocation — "landlord" / "tenant" / "mixed" / "not_defined".
        6. current_repairs_details — формулировка о текущем ремонте из договора.
           Если отсутствует — "Данные не определены".
        7. defect_remedy_status — "defined" если порядок/сроки устранения недостатков
           арендодателем прямо предусмотрены, иначе "not_defined".
        8. defect_remedy_details — формулировка об устранении недостатков (сроки, порядок).
           Если отсутствует — "Данные не определены".
        9. replacement_status — "defined" если замена неисправного имущества
           прямо предусмотрена, иначе "not_defined".
        10. replacement_details — формулировка о замене неисправного имущества.
            Если отсутствует — "Данные не определены".
        11. repair_shift_to_tenant_status — "defined" если в договоре обнаружено
            возложение капитального или текущего ремонта на арендатора, иначе "not_defined".
        12. repair_shift_to_tenant_details — формулировка об обязанности арендатора
            производить ремонт. Если отсутствует — "Данные не определены".
        13. repair_shift_to_tenant_display — краткий user-friendly вывод:
            - "Не возложен" — если ремонт на арендодателе либо условие о перекладывании
              ремонта на арендатора отсутствует при наличии условий о ремонте;
            - "Текущий ремонт возложен на арендатора (нарушение ст. 631 ГК РФ)" — если
              на арендатора возложен текущий ремонт/обслуживание;
            - "Ремонт возложен на арендатора" — если на арендатора возложен капремонт
              или ремонт в целом;
            - "Данные не определены" — если договор вообще не содержит условий о ремонте.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - repair_shift_to_tenant_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни repairs_obligation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = "Данные не определены", repair_shift_to_tenant_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 631 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - capital_repairs_allocation / current_repairs_allocation:
            - "landlord" — обязанность арендодателя;
            - "tenant" — обязанность арендатора;
            - "mixed" — распределена между сторонами;
            - "not_defined" — не определено прямо в тексте.
        - Возложение на арендатора обязанности устранять поломки, возникшие по его вине
          (вследствие нарушения правил эксплуатации) — это гражданско-правовая ответственность
          за вред, а не обязанность по проведению эксплуатационного ремонта.
          Не путай эти понятия: repair_shift_to_tenant_status = "defined" только при
          возложении обычного текущего/капитального ремонта или техобслуживания на арендатора.
        - Если фрагмент контекста не содержит данных о ремонте, устранении недостатков
          или замене вещи — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ремонт и обслуживание» или «Права и обязанности Сторон».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни капремонта, ни текущего ремонта, ни устранения
           недостатков, ни замены имущества, ни возложения ремонта
           на арендатора.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано только, что капремонт — на арендодателе, без текущего ремонта
           и без порядка устранения недостатков.
           → presence = "present";
             capital_repairs_status = "defined";
             capital_repairs_allocation = "landlord";
             current_repairs_status = "not_defined";
             defect_remedy_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что текущий ремонт на арендодателе,
           в другом — на арендаторе, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             current_repairs_status = "not_defined";
             current_repairs_allocation = "not_defined";
             current_repairs_details = "Не удалось определить".

        4. Специфика темы: перекладывание ремонта на арендатора (red flag).
           В тексте прямо указано, что арендатор обязан за свой счёт
           производить текущий ремонт или профилактическое обслуживание
           имущества (нарушение императивной ст. 631 ГК РФ).
           → presence = "present";
             current_repairs_status = "defined";
             current_repairs_allocation = "tenant";
             repair_shift_to_tenant_status = "defined";
             repair_shift_to_tenant_display = "Текущий ремонт возложен на арендатора (нарушение ст. 631 ГК РФ)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для repairs_obligation_check_presence используй только: "present", "missing", "unclear".
        - Для capital_repairs_status / current_repairs_status / defect_remedy_status /
          replacement_status / repair_shift_to_tenant_status используй только:
          "defined" или "not_defined".
        - Для capital_repairs_allocation / current_repairs_allocation используй только:
          "landlord", "tenant", "mixed" или "not_defined".
        - Для repair_shift_to_tenant_display используй только: "Не возложен",
          "Текущий ремонт возложен на арендатора (нарушение ст. 631 ГК РФ)",
          "Ремонт возложен на арендатора" или "Данные не определены".
        - Fallback при отсутствии данных:
          * capital_repairs_details → "Данные не определены";
          * current_repairs_details → "Данные не определены";
          * defect_remedy_details → "Данные не определены";
          * replacement_details → "Данные не определены";
          * repair_shift_to_tenant_details / repair_shift_to_tenant_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * соответствующий *_allocation → "not_defined";
          * repair_shift_to_tenant_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "repairs_obligation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обязанностям ремонта предмета проката. Внутреннее агрегатное signal-поле."
          required: true

        - name: "capital_repairs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения капитального ремонта."
          required: true

        - name: "capital_repairs_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["landlord", "tenant", "mixed", "not_defined"]
          display_in_grid: false
          description: "Кто несёт обязанность по капремонту (raw enum)."
          required: true

        - name: "capital_repairs_details"
          type: "string"
