  - id: sublease_and_personal_use_check
    name: "Запрет субаренды и личный характер пользования (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте запрета субаренды,
      запрета передачи предмета проката третьим лицам и указания
      на личный потребительский характер использования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субаренда запрещена"
        - "передача третьим лицам не допускается"
        - "без права передачи"
        - "только для личного использования"
        - "использование только арендатором"
        - "запрет субаренды"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субаренд.*запрещ"
        - "(?i)передач.*третьим\\s+лицам.*не\\s+допуска"
        - "(?i)личн(ое|ого)\\s+использован"
        - "(?i)без\\s+права\\s+передач"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: запрет субаренды, запрет передачи предмета
        проката третьим лицам и личный потребительский характер использования.

        Нормативный ориентир:
        - ст. 631 ГК РФ — арендатор не вправе сдавать в субаренду имущество,
          полученное по договору проката, передавать свои права и обязанности
          по договору проката другому лицу, предоставлять это имущество в безвозмездное
          пользование, закладывать арендные права и вносить их в качестве имущественного
          взноса. Любое условие договора проката, разрешающее распоряжение вещью, ничтожно.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора (если запрета нет в тексте —
          так и укажи).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли запрет субаренды (или, наоборот, незаконное разрешение субаренды).
        2. Есть ли запрет передачи предмета проката третьим лицам.
        3. Есть ли указание на личный / потребительский характер использования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запреты и личный характер прямо указаны в тексте:
        Фрагмент:
        "Арендатор не вправе сдавать предмет проката в субаренду. Передача
        предмета проката третьим лицам без предварительного согласия не допускается.
        Имущество предоставляется исключительно для личного использования Арендатором."

        Ответ:
        {
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "Арендатор не вправе сдавать предмет проката в субаренду",
          "third_party_transfer_prohibition_status": "defined",
          "third_party_transfer_prohibition_details": "Передача предмета проката третьим лицам без предварительного согласия не допускается",
          "personal_use_status": "defined",
          "personal_use_details": "Имущество предоставляется исключительно для личного использования Арендатором",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Арендатор не вправе сдавать предмет проката в субаренду. Передача предмета проката третьим лицам без предварительного согласия не допускается. Имущество предоставляется исключительно для личного использования Арендатором."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязуется бережно относиться к имуществу."

        Ответ:
        {
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Данные не определены",
          "third_party_transfer_prohibition_status": "not_defined",
          "third_party_transfer_prohibition_details": "Данные не определены",
          "personal_use_status": "not_defined",
          "personal_use_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — обнаружено незаконное разрешение субаренды (red flag):
        Фрагмент:
        "Арендатор имеет право сдавать имущество в субаренду третьим лицам
        с письменного согласия Арендодателя."

        Ответ:
        {
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "Арендатор имеет право сдавать имущество в субаренду третьим лицам с письменного согласия",
          "third_party_transfer_prohibition_status": "not_defined",
          "third_party_transfer_prohibition_details": "Данные не определены",
          "personal_use_status": "not_defined",
          "personal_use_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.8",
              "quote": "Арендатор имеет право сдавать имущество в субаренду третьим лицам с письменного согласия Арендодателя."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о субаренде (запрет или разрешение).
        2. Найди прямую цитату о запрете передачи третьим лицам.
        3. Найди прямую цитату о личном использовании.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "sublease_prohibition_status": "<defined / not_defined>",
          "sublease_prohibition_details": "<текст или 'Данные не определены'>",
          "third_party_transfer_prohibition_status": "<defined / not_defined>",
          "third_party_transfer_prohibition_details": "<текст или 'Данные не определены'>",
          "personal_use_status": "<defined / not_defined>",
          "personal_use_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субаренда запрещена передача третьим лицам не допускается без права передачи личное использование только арендатором запрет субаренды"
      retrieval_profile: "subletting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о запрете субаренды, передачи предмета третьим лицам и личном характере
        эксплуатации.
        Не анализируй размер арендной платы, ремонт, возврат или залог/депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (все обязательны в ответе):

        1. sublease_prohibition_status — "defined" если условия о субаренде прямо
           прописаны в тексте договора (независимо от того, запрещена она или
           незаконно разрешена), иначе "not_defined".
        2. sublease_prohibition_details — формулировка о субаренде из договора.
           Если отсутствует — "Данные не определены".
        3. third_party_transfer_prohibition_status — "defined" если запрет передачи
           имущества третьим лицам прямо указан, иначе "not_defined".
        4. third_party_transfer_prohibition_details — формулировка о передаче
           имущества третьим лицам. Если отсутствует — "Данные не определены".
        5. personal_use_status — "defined" если личный, бытовой или
           потребительский характер эксплуатации непосредственно арендатором
           прямо указан, иначе "not_defined".
        6. personal_use_details — формулировка о личном характере использования.
           Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ст. 631 ГК РФ)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - Если в договоре субаренда прямо разрешена (например, "с письменного согласия") —
        это факт урегулирования вопроса (sublease_prohibition_status = "defined"),
        извлеки эту разрешающую формулировку как есть. В прокате это ничтожно, но в DD
        важно зафиксировать это условие.
        - Запреты передачи третьим лицам могут формулироваться как "без права передачи",
        "запрещается совместное использование", "пользование третьими лицами не допускается".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о субаренде, передаче вещи
          или характере использования — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Права и обязанности Арендатора» или «Ограничения пользования».
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 6 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" and "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "sublease_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета субаренды."
          required: true
          display_in_grid: false
        - name: "sublease_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет субаренды"
          description: "Формулировка о запрете (или разрешении) субаренды предмета проката (ст. 631 ГК РФ)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "third_party_transfer_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета передачи третьим лицам."
          required: true
          display_in_grid: false
        - name: "third_party_transfer_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Передача третьим лицам"
          description: "Формулировка о запрете передачи предмета проката третьим лицам."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "personal_use_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на личное использование."
          required: true
          display_in_grid: false
        - name: "personal_use_details"
          type: "string"
          presentation: "fact"
          label: "Личное использование"
          description: "Формулировка о личном / потребительском характере эксплуатации имущества непосредственно Арендатором."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: deposit_and_damage_liability_check
    name: "Залог / депозит, ответственность за повреждение и нормальный износ"
    description: >
      Фактографическая проверка режима обеспечительного платежа / залога,
      критериев удержания, порядка возврата, ответственности за утрату /
      повреждение предмета проката и исключения нормального износа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "страховой депозит"
        - "обеспечительный платеж"
        - "возврат залога"
        - "удержание залога"
        - "утрата имущества"
        - "повреждение имущества"
        - "нормальный износ"
        - "естественный износ"
        - "критерии удержания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ой|ого)\\s+депозит|обеспечительн(ый|ого)\\s+плат|залог"
        - "(?i)утрат(а|ы)\\s+имуществ|поврежден(ие|ия)"
        - "(?i)нормальн(ый|ого)\\s+износ|естественн(ый|ого)\\s+износ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется правовой режим залога / обеспечительного платежа, порядок
        его возврата, условия удержания и ответственность за повреждение вещи
        с учётом нормального (естественного) износа.

        Нормативный ориентир:
        - ст. 381.1 ГК РФ — обеспечительный платёж (возврат при ненаступлении обстоятельств)
        - ст. 622 ГК РФ — возврат имущества в том состоянии, в котором арендатор
          его получил, с учётом нормального износа
        - ст. 16 ЗоЗПП — недопустимость удержания средств за естественный износ

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли залог / обеспечительный платёж / депозит и его условия.
        2. Есть ли порядок и сроки возврата залога / депозита.
        3. Есть ли критерии и основания удержания залога арендодателем.
        4. Какая ответственность арендатора за утрату или повреждение вещи предусмотрена.
        5. Исключён ли прямо нормальный (естественный) износ из ответственности арендатора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай статус "not_defined".
        3. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        4. Для статусов допустимо значение "not_defined".
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный защитный режим (износ исключен, сроки возврата есть):
        Фрагмент:
        "Арендатор вносит обеспечительный платёж в размере 5 000 рублей.
        Платёж возвращается в полном объёме в течение 3 рабочих дней после
        возврата имущества по акту. Арендатор несёт ответственность за повреждения
        вещи, возникшие по его вине, за исключением нормального износа.
        Удержание из платежа производится только в размере документально
        подтверждённого ущерба."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "обеспечительный платёж в размере 5 000 рублей",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "возвращается в полном объёме в течение 3 рабочих дней после возврата имущества по акту",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "только в размере документально подтверждённого ущерба",
          "damage_liability_status": "defined",
          "damage_liability_details": "ответственность за повреждения вещи, возникшие по его вине, за исключением нормального износа",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "за исключением нормального износа",
          "normal_wear_excluded_display": "Исключен из ответственности",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Арендатор вносит обеспечительный платёж в размере 5 000 рублей. Платёж возвращается в полном объёме в течение 3 рабочих дней после возврата имущества по акту."
            },
            {
              "clause_ref": "п. 5.3",
              "quote": "Арендатор несёт ответственность за повреждения вещи, возникшие по его вине, за исключением нормального износа."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязуется бережно эксплуатировать имущество."

        Ответ:
        {
          "deposit_status": "not_defined",
          "deposit_details": "Данные не определены",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "retention_criteria_status": "not_defined",
          "retention_criteria_details": "Данные не определены",
          "damage_liability_status": "not_defined",
          "damage_liability_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "normal_wear_excluded_display": "Данные не определены",
          "evidence": []
        }

        Пример 3 — залог есть, но износ не исключен (риск для потребителя):
        Фрагмент:
        "Залог составляет 3 000 руб. В случае любых царапин или потертостей
        залог не возвращается и удерживается в качестве штрафа."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "Залог составляет 3 000 руб.",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "retention_criteria_status": "defined",
