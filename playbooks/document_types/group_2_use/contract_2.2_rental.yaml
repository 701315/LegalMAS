        <task>
        Заполни строго следующие поля:

        1. late_payment_penalty_status — "defined" если неустойка за просрочку
           оплаты прямо указана, иначе "not_defined".
        2. late_payment_penalty_details — формулировка.
        3. tenant_breach_penalty_status — "defined" если штрафы за нарушения
           арендатора прямо указаны, иначе "not_defined".
        4. tenant_breach_penalty_details — формулировка.
