        - name: "self_repair_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет самостоятельного ремонта"
          description: "Формулировка о запрете самостоятельного ремонта / вскрытия пломб арендатором."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "emergency_contact_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания контактов для экстренной связи."
          required: true
          display_in_grid: false
        - name: "emergency_contact_details"
          type: "string"
          presentation: "fact"
          label: "Канал связи при аварии"
