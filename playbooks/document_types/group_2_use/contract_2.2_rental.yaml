          required: false
      store_payload: true

  - id: breakdown_emergency_procedure_check
    name: "Порядок действий при поломке и запрет самостоятельного ремонта"
    description: >
      Фактографическая проверка наличия в тексте регламента действий арендатора
      при поломке предмета проката: уведомление арендодателя, запрет
      самостоятельного ремонта, экстренная связь и замена имущества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в случае поломки"
        - "немедленно уведомить арендодателя"
        - "не ремонтировать самостоятельно"
        - "экстренная связь"
        - "аварийная ситуация"
        - "замена неисправного имущества"
        - "прекратить эксплуатацию"
        - "телефон для связи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+случае\\s+поломк"
        - "(?i)немедленно\\s+уведом"
        - "(?i)не\\s+ремонтироват.*самостоятельн"
        - "(?i)прекратить\\s+эксплуатац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: порядок действий арендатора при поломке
        предмета проката.

        Нормативный ориентир:
        - ст. 629 ГК РФ — устранение недостатков арендодателем
        - ст. 631 ГК РФ — ремонт — обязанность арендодателя

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли регламент действий арендатора при поломке / аварии.
        2. Есть ли обязанность уведомить арендодателя о поломке и в какой срок.
        3. Есть ли запрет на самостоятельный ремонт / вскрытие пломб.
        4. Есть ли контактные данные для экстренной связи (телефон, чат, приложение).
        5. Есть ли условие о замене неисправного имущества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок описан полностью:
        Фрагмент:
        "При обнаружении неисправности Арендатор обязан немедленно прекратить
        эксплуатацию и уведомить Арендодателя по телефону +7-999-000-00-00.
        Самостоятельный ремонт запрещён. Арендодатель обязан в течение 24 часов
        устранить неисправность или предоставить замену."

        Ответ:
        {
          "breakdown_procedure_status": "defined",
          "breakdown_procedure_details": "немедленно прекратить эксплуатацию и уведомить Арендодателя",
          "notification_obligation_status": "defined",
          "notification_obligation_details": "уведомить Арендодателя по телефону +7-999-000-00-00",
          "self_repair_prohibition_status": "defined",
          "self_repair_prohibition_details": "самостоятельный ремонт запрещён",
          "emergency_contact_status": "defined",
          "emergency_contact_details": "+7-999-000-00-00",
          "replacement_option_status": "defined",
          "replacement_option_details": "в течение 24 часов устранить неисправность или предоставить замену",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "При обнаружении неисправности Арендатор обязан немедленно прекратить эксплуатацию и уведомить Арендодателя по телефону +7-999-000-00-00."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор пользуется имуществом бережно."

        Ответ:
        {
          "breakdown_procedure_status": "not_defined",
          "breakdown_procedure_details": "Данные не определены",
          "notification_obligation_status": "not_defined",
          "notification_obligation_details": "Данные не определены",
          "self_repair_prohibition_status": "not_defined",
          "self_repair_prohibition_details": "Данные не определены",
          "emergency_contact_status": "not_defined",
          "emergency_contact_details": "Данные не определены",
          "replacement_option_status": "not_defined",
          "replacement_option_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке действий при поломке.
        2. Найди прямую цитату об уведомлении арендодателя.
        3. Найди прямую цитату о запрете самостоятельного ремонта.
        4. Найди прямую цитату о контактах для экстренной связи.
        5. Найди прямую цитату о замене имущества.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "breakdown_procedure_status": "<defined / not_defined>",
          "breakdown_procedure_details": "<текст или 'Данные не определены'>",
          "notification_obligation_status": "<defined / not_defined>",
          "notification_obligation_details": "<текст или 'Данные не определены'>",
          "self_repair_prohibition_status": "<defined / not_defined>",
          "self_repair_prohibition_details": "<текст или 'Данные не определены'>",
          "emergency_contact_status": "<defined / not_defined>",
          "emergency_contact_details": "<текст или 'Данные не определены'>",
          "replacement_option_status": "<defined / not_defined>",
          "replacement_option_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "в случае поломки немедленно уведомить не ремонтировать самостоятельно экстренная связь аварийная ситуация замена неисправного имущества прекратить эксплуатацию телефон для связи"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "возврат имущества"
        - "депозит"
        - "субаренда"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "breakdown_emergency_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката порядок действий
        при поломке: уведомление, запрет самостоятельного ремонта, экстренная связь
        и замена имущества.
        Не анализируй размер арендной платы, депозит, субаренду или возврат имущества
        по окончании срока.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. breakdown_emergency_procedure_check_presence:
           Агрегатное signal-поле — наличие регулирования по порядку действий
           при поломке и запрету самостоятельного ремонта.
           - "present" — если хотя бы одно из содержательных полей
             (breakdown_procedure_status, notification_obligation_status,
              self_repair_prohibition_status, emergency_contact_status,
              replacement_option_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - breakdown_procedure_status = "not_defined";
           - breakdown_procedure_details = "Данные не определены";
           - notification_obligation_status = "not_defined";
           - notification_obligation_details = "Данные не определены";
           - self_repair_prohibition_status = "not_defined";
           - self_repair_prohibition_details = "Данные не определены";
           - emergency_contact_status = "not_defined";
           - emergency_contact_details = "Данные не определены";
           - replacement_option_status = "not_defined";
           - replacement_option_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. breakdown_procedure_status — "defined" если регламент действий при поломке
           прямо описан в тексте договора, иначе "not_defined".
        2. breakdown_procedure_details — формулировка о порядке действий при поломке
           (например, "прекратить эксплуатацию и уведомить").
           Если отсутствует — "Данные не определены".
        3. notification_obligation_status — "defined" если обязанность уведомить
           арендодателя прямо указана, иначе "not_defined".
        4. notification_obligation_details — формулировка об уведомлении (сроки, способ).
           Если отсутствует — "Данные не определены".
        5. self_repair_prohibition_status — "defined" если запрет самостоятельного
           ремонта / вскрытия пломб прямо указан, иначе "not_defined".
        6. self_repair_prohibition_details — формулировка о запрете ремонта.
           Если отсутствует — "Данные не определены".
        7. emergency_contact_status — "defined" если контакты для экстренной связи
           прямо указаны, иначе "not_defined".
        8. emergency_contact_details — контактные данные (телефон, email, чат,
           мобильное приложение). Если отсутствуют — "Данные не определены".
        9. replacement_option_status — "defined" если замена неисправного имущества
           прямо предусмотрена, иначе "not_defined".
        10. replacement_option_details — формулировка о замене имущества.
            Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни breakdown_emergency_procedure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 629 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - emergency_contact_details может включать: номер телефона, email, ссылку на
          чат-бот, название мобильного приложения, телеграм-канал и т.п.
        - Не выводи обязанность замены из ст. 629 ГК РФ — фиксируй только то,
          что написано в тексте договора.
        - Если фрагмент контекста не содержит данных о поломке, уведомлении, ремонте
          или экстренной связи — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Обязанности Арендатора при авариях и поломках» или
          «Порядок действий при неисправности».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни регламента действий при поломке, ни обязанности
           уведомить, ни запрета ремонта, ни экстренной связи, ни замены.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указана только обязанность уведомить арендодателя, без срока
           уведомления, без запрета самостоятельного ремонта, без экстренной
           связи и без замены имущества.
           → presence = "present";
             notification_obligation_status = "defined";
             остальные статусы = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что самостоятельный ремонт запрещён,
           в другом — что арендатор вправе самостоятельно устранять
           мелкие неисправности, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             self_repair_prohibition_status = "not_defined";
             self_repair_prohibition_details = "Не удалось определить".

        4. Специфика темы: запрет ремонта без канала экстренной связи.
           Указан запрет самостоятельного ремонта, но арендатору не предоставлен
           конкретный канал связи для уведомления о поломке (нет телефона, чата,
           приложения) — риск невозможности исполнить обязанность уведомления.
           → presence = "present";
             self_repair_prohibition_status = "defined";
             emergency_contact_status = "not_defined";
             emergency_contact_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для breakdown_emergency_procedure_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * breakdown_procedure_details → "Данные не определены";
          * notification_obligation_details → "Данные не определены";
          * self_repair_prohibition_details → "Данные не определены";
          * emergency_contact_details → "Данные не определены";
          * replacement_option_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "breakdown_emergency_procedure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку действий при поломке и запрету самостоятельного ремонта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "breakdown_procedure_status"
