    description: >
      Проверяет порядок возврата предмета проката по окончании срока или
      при досрочном отказе. Главный источник споров: что считается нормальным
      износом, кто и как оценивает повреждения, штрафы за просрочку возврата,
      комплектность при возврате.
    triggers:
      any: ["return_and_handover", "deposit_related"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат имущества"
        - "акт возврата"
        - "состояние при возврате"
        - "нормальный износ"
        - "повреждения при возврате"
        - "просрочка возврата"
        - "штраф за невозврат"
        - "комплектность"
        - "удержание из депозита"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+имуществ"
        - "(?i)акт\\s+возврат"
        - "(?i)просрочк(а|и)\\s+возврат"
        - "(?i)штраф.*невозврат"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор проката.
        Проверь условия возврата имущества.

        Это главный источник споров в прокате. Ключевые вопросы:
        - Допустимое состояние при возврате (нормальный износ vs повреждения)
        - Как фиксируется состояние (акт возврата, фото, сравнение с актом выдачи)
        - Комплектность при возврате (все аксессуары, зарядки, ключи)
        - Сроки возврата и штрафы за просрочку
        - Место возврата (тот же пункт или иное)
        - Порядок удержания из депозита при повреждениях

        Ответь строго в JSON:
        {
          "return_procedure_present": "<yes / partial / no>",
          "condition_assessment_method": "<comparison_with_issuance_act / visual_inspection / not_specified / not_found>",
          "normal_wear_excluded": "<yes / no / not_found>",
          "late_return_penalty": "<yes / no / not_found>",
          "late_return_formula": "<формула/сумма или not_found>",
          "completeness_check": "<yes / no / not_found>",
          "return_location_specified": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "возврат"
        - "акт возврата"
        - "состояние"
        - "нормальный износ"
        - "просрочка"
        - "штраф"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "return_procedure_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Урегулирован ли порядок возврата"
        - name: "normal_wear_excluded"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Исключён ли нормальный износ из ответственности"
        - name: "late_return_penalty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли штраф за просрочку возврата"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора: профессиональный арендодатель и арендатор"
    description: "Проверяет идентификацию сторон и признаки профессионального арендодателя"
    legal_base: "ст. 426, 626 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "гражданин"
        - "ИП"
        - "коммерческая организация"
        - "пункт проката"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(арендодатель|арендатор).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

  - id: "consumer_purpose_declaration"
    name: "Потребительская (бытовая) цель использования"
    description: "Проверяет фиксацию бытового/потребительского назначения проката"
    legal_base: "ст. 626 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["consumer_purpose"]
    rules:
      keywords:
        - "для бытовых нужд"
        - "для личных нужд"
        - "потребительские цели"
        - "для семейных нужд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)бытов(ых|ые)\\s+нужд"
        - "(?i)потребительск(ие|их)\\s+цел"

  - id: "movable_property_identification"
    name: "Индивидуализация движимого имущества"
    description: "Проверяет описание вещи, марки, модели, серийного номера, комплектности и состояния"
    legal_base: "ст. 607, 626 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["movable_item_rental"]
    rules:
      keywords:
        - "марка"
        - "модель"
        - "серийный номер"
        - "инвентарный номер"
        - "комплектность"
        - "состояние"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
        - "(?i)марк(а|и)|модел(ь|и)"

  - id: "fixed_rent_payment"
    name: "Плата в твердой сумме"
    description: "Проверяет, что плата по прокату определена в фиксированной сумме"
    legal_base: "ст. 630 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "плата"
        - "стоимость проката"
        - "твердая сумма"
        - "за сутки"
        - "за час"
        - "за день"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
        - "(?i)за\\s+(?:час|сутки|день|месяц)"

  - id: "term_limitation_one_year"
    name: "Срок проката не более одного года"
    description: "Проверяет, что срок договора не выходит за пределы специального режима проката"
    legal_base: "ст. 627 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["short_term_rental"]
    rules:
      keywords:
        - "до одного года"
        - "12 месяцев"
        - "срок проката"
        - "на сутки"
        - "на часы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"

  - id: "public_contract_declaration"
    name: "Явное указание на публичный характер"
    description: "Проверяет публичный статус договора и единые условия для потребителей"
    legal_base: "ст. 426 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["public_contract_features"]
    rules:
      keywords:
        - "публичный договор"
        - "публичная оферта"
        - "единые условия"
        - "каждый обратившийся"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)публичн(ый|ого)\\s+договор"
        - "(?i)публичн(ая|ой)\\s+оферт"

  - id: "all_repairs_by_lessor"
    name: "Все виды ремонта за счет арендодателя"
    description: "Проверяет соблюдение специального правила о ремонте"
    legal_base: "ст. 631 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["repair_obligations"]
    rules:
      keywords:
        - "капитальный и текущий ремонт"
        - "ремонт за счет арендодателя"
        - "замена неисправного имущества"
        - "устранение недостатков"
      keyword_mode: "any"
      negative_keywords:
        - "текущий ремонт за счет арендатора"
        - "арендатор обязан ремонтировать"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+и\\s+текущ(ий|его)\\s+ремонт"
        - "(?i)ремонт.*за\\s+счет\\s+арендодател"

  - id: "fitness_warranty_and_safety_briefing"
    name: "Исправность имущества и обязательный инструктаж"
    description: "Проверяет проверку исправности, инструктаж и safety disclosure"
    legal_base: "ст. 628 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["safety_and_instruction"]
    rules:
      keywords:
        - "проверка исправности"
        - "исправное состояние"
        - "правила эксплуатации"
        - "инструктаж"
        - "техника безопасности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)проверк(а|и)\\s+исправност"
        - "(?i)правил(а|ами)\\s+эксплуатац"
        - "(?i)инструктаж"

  - id: "absolute_prohibition_of_sublease"
    name: "Запрет субаренды и передачи третьим лицам"
    description: "Проверяет, что субаренда и передача вещи третьим лицам запрещены"
    legal_base: "ст. 631 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "субаренда запрещена"
        - "передача третьим лицам не допускается"
        - "без права передачи"
        - "использование только лично"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субаренд.*запрещ"
        - "(?i)передач.*третьим\\s+лицам.*не\\s+допуска"

  - id: "security_deposit_mechanism"
    name: "Залог / обеспечительный платеж"
    description: "Проверяет механизм внесения, удержания и возврата депозита"
    legal_base: "ст. 329, 334, 381.1 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["deposit_related"]
    rules:
      keywords:
        - "залог"
        - "обеспечительный платеж"
        - "страховой депозит"
        - "возврат залога"
        - "удержание депозита"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеспечительн(ый|ого)\\s+плат|страхов(ой|ого)\\s+депозит|залог"

  - id: "clear_liability_for_damage"
    name: "Ответственность за утрату и повреждение имущества"
    description: "Проверяет ясные правила ответственности за порчу/утрату"
    legal_base: "ст. 629 ГК РФ, ст. 1064 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "утрата имущества"
        - "повреждение имущества"
        - "стоимость ремонта"
        - "полная стоимость"
        - "акт о повреждении"
        - "возмещение ущерба"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утрат(а|ы)\\s+имуществ"
        - "(?i)поврежден(ие|ия)\\s+имуществ"
        - "(?i)стоимост(ь|и)\\s+ремонт"

  - id: "normal_wear_and_tear_exclusion"
    name: "Исключение ответственности за нормальный износ"
    description: "Проверяет исключение нормального износа из ответственности арендатора"
    legal_base: "ст. 629 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "нормальный износ"
        - "естественный износ"
        - "не несет ответственности за износ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нормальн(ый|ого)\\s+износ"
        - "(?i)естественн(ый|ого)\\s+износ"

  - id: "consumer_law_application"
    name: "Учет Закона о защите прав потребителей"
    description: "Проверяет наличие consumer-law disclosure и отсутствие заведомо unfair terms"
    legal_base: "Закон РФ № 2300-1, ст. 16 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["consumer_purpose", "public_contract_features"]
    rules:
      keywords:
        - "закон о защите прав потребителей"
        - "права потребителя"
        - "дополнительные услуги"
        - "страховка"
        - "моральный вред"
      keyword_mode: "any"
      negative_keywords:
        - "деньги не возвращаются"
        - "отказ невозможен"
      regex_patterns:
        - "(?i)защит[аы]\\s+прав\\s+потребител"
        - "(?i)моральн(ый|ого)\\s+вред"

  - id: "breakdown_emergency_procedure"
    name: "Порядок действий при поломке"
    description: "Проверяет регламент уведомления, replacement flow и запрет self-repair"
    legal_base: "ст. 628 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в случае поломки"
        - "немедленно уведомить"
        - "не ремонтировать самостоятельно"
        - "экстренная связь"
        - "замена неисправного имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+случае\\s+поломк"
        - "(?i)немедленно\\s+уведом"
        - "(?i)не\\s+ремонтироват.*самостоятельн"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет суд/претензионный порядок/форум"
    legal_base: "ГПК РФ, Закон о защите прав потребителей"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "подсудность"
        - "суд"
        - "претензионный порядок"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подсудност"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "return_conditions_and_penalties"
    name: "Условия возврата и штраф за просрочку"
    description: "Проверяет наличие условий возврата, сроков и санкций за невозврат/просрочку"
    legal_base: "ст. 622, 629 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возврат имущества"
        - "акт возврата"
        - "при возврате"
        - "просрочка возврата"
        - "штраф за невозврат"
        - "неустойка за просрочку"
        - "за каждый день просрочки"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+имуществ"
        - "(?i)просрочк(а|и)\\s+возврат"
        - "(?i)штраф.*невозврат"

  - id: "issuance_act_receipt"
    name: "Акт выдачи / квитанция проката при передаче имущества"
    description: "Проверяет наличие документа, фиксирующего состояние и комплектность при выдаче"
    legal_base: "ст. 628 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "акт выдачи"
        - "квитанция"
        - "акт приема-передачи"
        - "состояние при выдаче"
        - "фотофиксация"
        - "комплектность при выдаче"
        - "пробег при выдаче"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(выдач|приема|приёма|передач)"
        - "(?i)квитанц"
        - "(?i)фотофиксац"

  - id: "personal_data_consent"
    name: "Обработка персональных данных арендатора (ФЗ-152)"
    description: "Проверяет наличие согласия на обработку персональных данных — обязательно для consumer-контрактов"
    legal_base: "ФЗ-152 «О персональных данных»"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["personal_data_processing", "consumer_purpose"]
    rules:
      keywords:
        - "персональные данные"
        - "согласие на обработку"
        - "обработка персональных данных"
        - "оператор персональных данных"
        - "ФЗ-152"
        - "конфиденциальность данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ых|ые)\\s+данн"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"

  - id: "age_restrictions"
    name: "Возрастные ограничения арендатора"
    description: "Проверяет наличие возрастных ограничений — актуально для электросамокатов, инструмента, спортинвентаря"
    legal_base: "ГК РФ (дееспособность), отраслевые акты"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возраст"
        - "совершеннолетие"
        - "18 лет"
        - "16 лет"
        - "14 лет"
        - "несовершеннолетний"
        - "дееспособность"
        - "согласие законного представителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(старше|не\\s+моложе)\\s+\\d{2}\\s+лет"
        - "(?i)несовершеннолетн"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: кто выступает профессиональным арендодателем,
      на каком основании он осуществляет деятельность по прокату, а также реквизиты арендатора.
    addressee: "Арендодатель / Юридический советник"

  rental_subject_and_consumer_purpose_extraction:
    text: >
      Просим предоставить по {doc_names}: описание предмета проката, срок,
      твердую стоимость проката, наличие залога/депозита и подтверждение,
      что использование имеет бытовой/потребительский характер.
    addressee: "Арендодатель"

  consumer_purpose_declaration:
    text: >
      Просим уточнить в {doc_names}, что имущество предоставляется именно
      для личных, семейных, бытовых нужд, а не для предпринимательской деятельности.
    addressee: "Юридический советник"

  movable_property_identification:
    text: >
      Просим уточнить в {doc_names}: марку, модель, серийный/инвентарный номер,
      комплектность и состояние имущества на момент выдачи.
    addressee: "Арендодатель"

  fixed_rent_payment:
    text: >
      Просим подтвердить в {doc_names}: размер платы в твердой сумме,
      единицу тарификации (час/сутки/день), порядок оплаты и возврата части платы
      при досрочном возврате.
    addressee: "Арендодатель / Финансовый консультант"

  term_limitation_one_year:
    text: >
      Просим уточнить в {doc_names}: срок проката и подтвердить,
      что он не выходит за пределы специального режима договора проката.
    addressee: "Юридический советник"

  public_contract_status_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор публичным,
      применяются ли единые условия для всех потребителей и в какой форме
      опубликована оферта/типовые условия.
    addressee: "Юридический советник"

  public_contract_declaration:
    text: >
      Просим включить в {doc_names} прямое указание на публичный характер договора
      и единые условия для всех обратившихся потребителей.
    addressee: "Юридический советник арендодателя"

  unilateral_termination_consumer_check:
    text: >
      Просим уточнить в {doc_names}: право арендатора на отказ в любое время,
      порядок уведомления, перерасчет платы и возврат денежных средств
      за неиспользованный период.
    addressee: "Юридический советник"

  fitness_and_instruction_check:
    text: >
      Просим предоставить по {doc_names}: порядок проверки исправности имущества,
      форму подтверждения инструктажа, правила эксплуатации и safety rules.
    addressee: "Арендодатель"

  fitness_warranty_and_safety_briefing:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность арендодателя
      проверить исправность имущества, провести инструктаж и ознакомить
      арендатора с правилами эксплуатации и техники безопасности.
    addressee: "Юридический советник арендодателя"

  repairs_obligation_check:
    text: >
      Просим уточнить в {doc_names}: что капитальный и текущий ремонт,
      а также устранение недостатков и замена неисправного имущества
      осуществляются за счет арендодателя.
    addressee: "Юридический советник"

  all_repairs_by_lessor:
    text: >
      Просим привести в {doc_names} блок ремонта в соответствие со ст. 631 ГК РФ
      и исключить возложение ремонтных обязанностей на арендатора.
    addressee: "Юридический советник арендодателя"

  sublease_and_personal_use_check:
    text: >
      Просим уточнить в {doc_names}: запрет субаренды, передачи вещи третьим лицам
      и подтверждение личного характера использования имущества.
    addressee: "Юридический советник"

  absolute_prohibition_of_sublease:
    text: >
      Просим включить в {doc_names} прямой запрет субаренды, перенаема
      и передачи имущества третьим лицам.
    addressee: "Юридический советник арендодателя"

  deposit_and_damage_liability_check:
    text: >
      Просим уточнить в {doc_names}: режим депозита/залога, основания удержания,
      порядок возврата, ответственность за утрату/повреждение и исключение
      нормального износа из зоны ответственности арендатора.
    addressee: "Арендодатель / Юридический советник"

  security_deposit_mechanism:
    text: >
      Просим уточнить в {doc_names}: размер депозита, основание его удержания,
      сроки возврата и порядок документального подтверждения повреждений.
    addressee: "Юридический советник"

  clear_liability_for_damage:
    text: >
      Просим уточнить в {doc_names}: как определяется размер ответственности
      арендатора за повреждение или утрату имущества (ремонт / полная стоимость / market value).
    addressee: "Юридический советник"

  normal_wear_and_tear_exclusion:
    text: >
      Просим включить в {doc_names} прямое указание, что арендатор не отвечает
      за нормальный (естественный) износ имущества при надлежащем использовании.
    addressee: "Юридический советник"

  consumer_law_application:
    text: >
      Просим уточнить в {doc_names}: применение Закона о защите прав потребителей,
      исключить unfair terms и раскрыть все дополнительные платные услуги
      (страховка, допоборудование, комиссии).
    addressee: "Юридический советник / Compliance"

  breakdown_emergency_procedure_check:
    text: >
      Просим уточнить в {doc_names}: порядок действий при поломке,
      экстренный контакт, запрет на самостоятельный ремонт и порядок замены вещи.
    addressee: "Арендодатель / Юридический советник"

  breakdown_emergency_procedure:
    text: >
      Просим включить в {doc_names}: emergency procedure на случай поломки
      или аварийной ситуации, включая обязанность немедленного уведомления арендодателя.
    addressee: "Юридический советник арендодателя"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      а также consumer-specific forum aspects, если применимо.
    addressee: "Юридический советник"

  commercial_use_reclassification_risk:
    text: >
      Внимание: {doc_names} содержит признаки использования имущества
      для предпринимательских целей. Просим проверить корректность квалификации
      договора и, при необходимости, перевести документ в режим общей аренды.
    addressee: "Юридический советник"

  term_over_one_year_risk:
    text: >
      Внимание: по {doc_names} необходимо проверить, не превышает ли срок проката
      пределы специального режима договора проката. Просим дать квалификационное заключение.
    addressee: "Юридический советник"

  consumer_law_mandatory_context:
    text: >
      Внимание: {doc_names} подпадает под consumer-law контекст.
      Просим проверить текст на unfair terms, навязывание дополнительных услуг,
      ограничения права на отказ и возврат денежных средств.
    addressee: "Юридический советник / Compliance"

  return_procedure_and_condition_check:
    text: >
      Просим уточнить в {doc_names}: порядок возврата предмета проката —
      допустимое состояние (нормальный износ vs повреждения), метод оценки
      (сравнение с актом выдачи, фото), комплектность, место и время возврата,
      штрафы за просрочку, порядок удержания из депозита.
    addressee: "Арендодатель / Юридический советник"

  return_conditions_and_penalties:
    text: >
      В {doc_names} не урегулированы условия возврата имущества. Просим включить:
      порядок приёмки при возврате, стандарт допустимого состояния, санкции
