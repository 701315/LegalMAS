          description: "Краткий вывод о наличии незаконного перекладывания обязанностей по ремонту на арендатора-потребителя (нарушение ст. 631 ГК РФ)."
          required: false
      store_payload: true

  - id: sublease_and_personal_use_check
    name: "Запрет субаренды и личный характер пользования (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте запрета субаренды,
      запрета передачи предмета проката третьим лицам и указания
      на личный потребительский характер использования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субаренда запрещена"
        - "передача третьим лицам не допускается"
        - "без права передачи"
        - "только для личного использования"
        - "использование только арендатором"
        - "запрет субаренды"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субаренд.*запрещ"
        - "(?i)передач.*третьим\\s+лицам.*не\\s+допуска"
        - "(?i)личн(ое|ого)\\s+использован"
        - "(?i)без\\s+права\\s+передач"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: запрет субаренды, запрет передачи предмета
        проката третьим лицам и личный потребительский характер использования.

        Нормативный ориентир:
        - ст. 631 ГК РФ — арендатор не вправе сдавать в субаренду имущество,
          полученное по договору проката, передавать свои права и обязанности
          по договору проката другому лицу, предоставлять это имущество в безвозмездное
          пользование, закладывать арендные права и вносить их в качестве имущественного
          взноса. Любое условие договора проката, разрешающее распоряжение вещью, ничтожно.

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора (если запрета нет в тексте —
          так и укажи).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли запрет субаренды (или, наоборот, незаконное разрешение субаренды).
        2. Есть ли запрет передачи предмета проката третьим лицам.
        3. Есть ли указание на личный / потребительский характер использования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запреты и личный характер прямо указаны в тексте:
        Фрагмент:
        "Арендатор не вправе сдавать предмет проката в субаренду. Передача
        предмета проката третьим лицам без предварительного согласия не допускается.
        Имущество предоставляется исключительно для личного использования Арендатором."

        Ответ:
        {
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "Арендатор не вправе сдавать предмет проката в субаренду",
          "third_party_transfer_prohibition_status": "defined",
          "third_party_transfer_prohibition_details": "Передача предмета проката третьим лицам без предварительного согласия не допускается",
          "personal_use_status": "defined",
          "personal_use_details": "Имущество предоставляется исключительно для личного использования Арендатором",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Арендатор не вправе сдавать предмет проката в субаренду. Передача предмета проката третьим лицам без предварительного согласия не допускается. Имущество предоставляется исключительно для личного использования Арендатором."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязуется бережно относиться к имуществу."

        Ответ:
        {
          "sublease_prohibition_status": "not_defined",
          "sublease_prohibition_details": "Данные не определены",
          "third_party_transfer_prohibition_status": "not_defined",
          "third_party_transfer_prohibition_details": "Данные не определены",
          "personal_use_status": "not_defined",
          "personal_use_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — обнаружено незаконное разрешение субаренды (red flag):
        Фрагмент:
        "Арендатор имеет право сдавать имущество в субаренду третьим лицам
        с письменного согласия Арендодателя."

        Ответ:
        {
          "sublease_prohibition_status": "defined",
          "sublease_prohibition_details": "Арендатор имеет право сдавать имущество в субаренду третьим лицам с письменного согласия",
          "third_party_transfer_prohibition_status": "not_defined",
          "third_party_transfer_prohibition_details": "Данные не определены",
          "personal_use_status": "not_defined",
          "personal_use_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.8",
              "quote": "Арендатор имеет право сдавать имущество в субаренду третьим лицам с письменного согласия Арендодателя."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о субаренде (запрет или разрешение).
        2. Найди прямую цитату о запрете передачи третьим лицам.
        3. Найди прямую цитату о личном использовании.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "sublease_prohibition_status": "<defined / not_defined>",
          "sublease_prohibition_details": "<текст или 'Данные не определены'>",
          "third_party_transfer_prohibition_status": "<defined / not_defined>",
          "third_party_transfer_prohibition_details": "<текст или 'Данные не определены'>",
          "personal_use_status": "<defined / not_defined>",
          "personal_use_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субаренда запрещена передача третьим лицам не допускается без права передачи личное использование только арендатором запрет субаренды"
      retrieval_profile: "subletting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "арендная плата"
        - "ремонт"
        - "возврат"
        - "депозит"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "sublease_and_personal_use_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о запрете субаренды, передачи предмета третьим лицам и личном характере
        эксплуатации.
        Не анализируй размер арендной платы, ремонт, возврат или залог/депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sublease_and_personal_use_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме запрета
           субаренды и личного характера пользования.
           - "present" — если хотя бы одно из содержательных полей
             (sublease_prohibition_status, third_party_transfer_prohibition_status,
              personal_use_status) = "defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - sublease_prohibition_status = "not_defined";
           - sublease_prohibition_details = "Данные не определены";
           - third_party_transfer_prohibition_status = "not_defined";
           - third_party_transfer_prohibition_details = "Данные не определены";
           - personal_use_status = "not_defined";
           - personal_use_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. sublease_prohibition_status — "defined" если условия о субаренде прямо
           прописаны в тексте договора (независимо от того, запрещена она или
           незаконно разрешена), иначе "not_defined".
        2. sublease_prohibition_details — формулировка о субаренде из договора.
           Если отсутствует — "Данные не определены".
        3. third_party_transfer_prohibition_status — "defined" если запрет передачи
           имущества третьим лицам прямо указан, иначе "not_defined".
        4. third_party_transfer_prohibition_details — формулировка о передаче
           имущества третьим лицам. Если отсутствует — "Данные не определены".
        5. personal_use_status — "defined" если личный, бытовой или
           потребительский характер эксплуатации непосредственно арендатором
           прямо указан, иначе "not_defined".
        6. personal_use_details — формулировка о личном характере использования.
           Если отсутствует — "Данные не определены".

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни sublease_and_personal_use_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 631 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - Если в договоре субаренда прямо разрешена (например, "с письменного согласия") —
          это факт урегулирования вопроса (sublease_prohibition_status = "defined"),
          извлеки эту разрешающую формулировку как есть. В прокате это ничтожно, но в DD
          важно зафиксировать это условие.
        - Запреты передачи третьим лицам могут формулироваться как "без права передачи",
          "запрещается совместное использование", "пользование третьими лицами не допускается".
        - Если фрагмент контекста не содержит данных о субаренде, передаче вещи
          или характере использования — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Права и обязанности Арендатора» или «Ограничения пользования».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия о субаренде, ни запрета передачи третьим
           лицам, ни указания на личный характер использования.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Запрет субаренды указан, но нет запрета передачи третьим лицам
           и нет указания на личный характер использования.
           → presence = "present";
             sublease_prohibition_status = "defined";
             third_party_transfer_prohibition_status = "not_defined";
             personal_use_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что субаренда запрещена, в другом — что
           арендатор вправе сдавать имущество в субаренду с согласия
           арендодателя, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             sublease_prohibition_status = "not_defined";
             sublease_prohibition_details = "Не удалось определить".

        4. Специфика темы: незаконное разрешение субаренды (red flag).
           В тексте прямо указано, что арендатор вправе сдавать имущество
           в субаренду или передавать свои права третьим лицам с согласия
           арендодателя (что противоречит императивной ст. 631 ГК РФ).
           → presence = "present";
             sublease_prohibition_status = "defined";
             sublease_prohibition_details = точная формулировка из текста
             с указанием на разрешение субаренды.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sublease_and_personal_use_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * sublease_prohibition_details → "Данные не определены";
          * third_party_transfer_prohibition_details → "Данные не определены";
          * personal_use_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sublease_and_personal_use_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по запрету субаренды и личному характеру пользования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sublease_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета субаренды."
          required: true

        - name: "sublease_prohibition_details"
          type: "string"
          presentation: "fact"
