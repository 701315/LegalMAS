  - id: pledge_and_encumbrance_prohibition_check
    name: "Запрет залога и обременения предмета проката (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте запрета на передачу
      предмета проката в залог, внесение в качестве вклада и иные обременения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет залога"
        - "не вправе передавать в залог"
        - "не подлежит залогу"
        - "обременение запрещено"
        - "в качестве вклада"
        - "в качестве имущественного взноса"
        - "ст. 631"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе.*залог"
        - "(?i)запрет.*залог"
        - "(?i)в\\s+качестве\\s+вклад"
        - "(?i)ст(?:атья|\\.)?\\s*631"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: запрет залога и обременения предмета проката.

        Нормативный ориентир:
        - ст. 631 ГК РФ — имущество, полученное по договору проката,
          не может быть передано в субаренду, в залог, внесено в качестве
          вклада или имущественного взноса

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли запрет передачи предмета проката в залог.
        2. Есть ли запрет внесения в качестве вклада / имущественного взноса.
        3. Есть ли запрет иных обременений.
        4. Есть ли ссылка на ст. 631 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запреты указаны со ссылкой на ст. 631 ГК РФ:
        Фрагмент:
        "В соответствии со ст. 631 ГК РФ Арендатор не вправе передавать предмет
        проката в залог, вносить его в качестве вклада в уставный капитал
        или иным образом обременять правами третьих лиц."

        Ответ:
        {
          "pledge_prohibition_status": "defined",
          "pledge_prohibition_details": "не вправе передавать предмет проката в залог",
          "contribution_prohibition_status": "defined",
          "contribution_prohibition_details": "не вправе вносить в качестве вклада в уставный капитал",
          "other_encumbrance_prohibition_status": "defined",
          "other_encumbrance_prohibition_details": "не вправе иным образом обременять правами третьих лиц",
          "st631_reference_status": "defined",
          "st631_reference_details": "ст. 631 ГК РФ",
          "encumbrance_prohibition_display": "Запрещён (ст. 631 ГК)",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "В соответствии со ст. 631 ГК РФ Арендатор не вправе передавать предмет проката в залог, вносить его в качестве вклада в уставный капитал или иным образом обременять правами третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют (типичная ситуация):
        Фрагмент:
        "Арендатор пользуется имуществом."

        Ответ:
        {
          "pledge_prohibition_status": "not_defined",
          "pledge_prohibition_details": "Данные не определены",
          "contribution_prohibition_status": "not_defined",
          "contribution_prohibition_details": "Данные не определены",
          "other_encumbrance_prohibition_status": "not_defined",
          "other_encumbrance_prohibition_details": "Данные не определены",
          "st631_reference_status": "not_defined",
          "st631_reference_details": "Данные не определены",
          "encumbrance_prohibition_display": "Не упомянут (запрет действует в силу закона)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о запрете залога.
        2. Найди прямую цитату о запрете внесения в качестве вклада.
        3. Найди прямую цитату о запрете иных обременений.
        4. Найди прямую ссылку на ст. 631 ГК РФ.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "pledge_prohibition_status": "<defined / not_defined>",
          "pledge_prohibition_details": "<текст или 'Данные не определены'>",
          "contribution_prohibition_status": "<defined / not_defined>",
          "contribution_prohibition_details": "<текст или 'Данные не определены'>",
          "other_encumbrance_prohibition_status": "<defined / not_defined>",
          "other_encumbrance_prohibition_details": "<текст или 'Данные не определены'>",
          "st631_reference_status": "<defined / not_defined>",
          "st631_reference_details": "<текст или 'Данные не определены'>",
          "encumbrance_prohibition_display": "<'Запрещён (ст. 631 ГК)' / 'Запрещён (без ссылки на статью)' / 'Не упомянут (запрет действует в силу закона)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет залога не вправе передавать в залог обременение запрещено в качестве вклада имущественный взнос ст. 631 не подлежит залогу"
      retrieval_profile: "security_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "субаренда"
        - "арендная плата"
        - "ремонт"
        - "депозит"
        - "возврат"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о запрете залога, внесения в качестве вклада и иных обременений
        предмета проката, а также ссылку на ст. 631 ГК РФ.
        Не анализируй арендную плату, ремонт, возврат имущества или субаренду.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей (все обязательны в ответе):

        1. pledge_prohibition_status — "defined" если запрет залога прямо указан
           в тексте договора, иначе "not_defined".
        2. pledge_prohibition_details — формулировка о запрете залога.
           Если отсутствует — "Данные не определены".
        3. contribution_prohibition_status — "defined" если запрет внесения
           в качестве вклада / имущественного взноса прямо указан, иначе "not_defined".
        4. contribution_prohibition_details — формулировка о запрете вклада.
           Если отсутствует — "Данные не определены".
        5. other_encumbrance_prohibition_status — "defined" если запрет иных
           обременений прямо указан, иначе "not_defined".
        6. other_encumbrance_prohibition_details — формулировка о запрете
           иных обременений. Если отсутствует — "Данные не определены".
        7. st631_reference_status — "defined" если прямая ссылка на ст. 631 ГК РФ
           есть в тексте, иначе "not_defined".
        8. st631_reference_details — формулировка ссылки на ст. 631 ГК РФ.
           Если отсутствует — "Данные не определены".
        9. encumbrance_prohibition_display — краткий user-friendly статус:
           - "Запрещён (ст. 631 ГК)" — если есть прямая ссылка на ст. 631 ГК РФ
             с запретом залога/вклада/обременений;
           - "Запрещён (без ссылки на статью)" — если запрет указан, но без
             ссылки на статью;
           - "Не упомянут (запрет действует в силу закона)" — если в договоре
             нет прямого запрета (императивная норма ст. 631 ГК РФ всё равно
             применяется);
           - "Данные не определены" — если договор вообще не содержит данных
             о предмете проката.

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ст. 631 ГК РФ)
        вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - pledge_prohibition_status = "defined" ТОЛЬКО если в тексте есть прямые
        слова о запрете залога («не вправе передавать в залог», «запрещается залог» и т.п.).
        - В 90%+ договоров проката этот запрет не прописывается явно — это нормально,
        так как ст. 631 ГК РФ является императивной нормой.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о залоге, вкладе, обременениях
          или ссылке на ст. 631 ГК — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ограничения пользования» или «Обязанности Арендатора».
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 9 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "pledge_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета залога предмета проката."
          required: true
          display_in_grid: false
        - name: "pledge_prohibition_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о запрете залога предмета проката (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "contribution_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета внесения в качестве вклада."
          required: true
          display_in_grid: false
        - name: "contribution_prohibition_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о запрете внесения в качестве вклада (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "other_encumbrance_prohibition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета иных обременений."
          required: true
          display_in_grid: false
        - name: "other_encumbrance_prohibition_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о запрете иных обременений (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "st631_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ст. 631 ГК РФ."
          required: true
          display_in_grid: false
        - name: "st631_reference_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка ссылки на ст. 631 ГК РФ (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "encumbrance_prohibition_display"
          type: "string"
