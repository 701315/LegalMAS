      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката право арендатора
        на досрочный отказ, срок уведомления, перерасчёт платы и ограничения
        права на отказ.
        Не анализируй предмет проката, плату, ремонт или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_right_status — "defined" если право на отказ прямо
           предусмотрено, иначе "not_defined".
        2. termination_right_details — формулировка.
        3. notice_period_status — "defined" если срок уведомления прямо указан,
           иначе "not_defined".
        4. notice_period_details — срок уведомления.
        5. refund_recalculation_status — "defined" если перерасчёт / возврат платы
           при досрочном возврате прямо предусмотрен, иначе "not_defined".
        6. refund_recalculation_details — формулировка.
        7. early_return_status — "defined" если досрочный возврат имущества прямо
           предусмотрен, иначе "not_defined".
        8. early_return_details — формулировка.
        9. termination_restriction_status — "defined" если есть ограничения права
           на отказ (минимальный срок, невозвратная оплата), иначе "not_defined".
        10. termination_restriction_details — формулировка ограничений.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - termination_restriction_status = "defined" только если в тексте прямо
