        - "удержание залога"
        - "утрата имущества"
        - "повреждение имущества"
        - "нормальный износ"
        - "критерии удержания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ой|ого)\\s+депозит|обеспечительн(ый|ого)\\s+плат|залог"
        - "(?i)утрат(а|ы)\\s+имуществ|поврежден(ие|ия)"
        - "(?i)нормальн(ый|ого)\\s+износ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: режим залога / депозита и ответственность
        за повреждение / утрату предмета проката.

        Нормативный ориентир:
        - ст. 381.1 ГК РФ — обеспечительный платёж
        - ст. 622 ГК РФ — возврат арендованного имущества

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли залог / обеспечительный платёж и его размер.
        2. Есть ли критерии удержания залога.
        3. Есть ли порядок возврата залога.
        4. Есть ли ответственность за утрату / повреждение имущества.
        5. Исключён ли нормальный износ из ответственности арендатора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — депозит урегулирован:
        Фрагмент:
        "Арендатор вносит обеспечительный платёж в размере 5 000 рублей.
        При отсутствии повреждений (за исключением нормального износа) платёж
        возвращается в течение 3 рабочих дней после возврата имущества.
        Арендатор несёт ответственность за утрату или повреждение предмета
        проката сверх нормального износа."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "обеспечительный платёж 5 000 рублей",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "при отсутствии повреждений за исключением нормального износа",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "возвращается в течение 3 рабочих дней после возврата имущества",
          "damage_liability_status": "defined",
          "damage_liability_details": "ответственность за утрату или повреждение сверх нормального износа",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "за исключением нормального износа",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Арендатор вносит обеспечительный платёж в размере 5 000 рублей."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязан бережно обращаться с имуществом."

        Ответ:
        {
          "deposit_status": "not_defined",
          "deposit_details": "Данные не определены",
          "retention_criteria_status": "not_defined",
          "retention_criteria_details": "Данные не определены",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "damage_liability_status": "not_defined",
          "damage_liability_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о залоге / депозите и его размере.
        2. Найди прямую цитату о критериях удержания.
        3. Найди прямую цитату о порядке возврата.
        4. Найди прямую цитату об ответственности за повреждение / утрату.
        5. Найди прямую цитату об исключении нормального износа.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "deposit_status": "<defined / not_defined>",
          "deposit_details": "<текст или 'Данные не определены'>",
          "retention_criteria_status": "<defined / not_defined>",
          "retention_criteria_details": "<текст или 'Данные не определены'>",
          "deposit_refund_status": "<defined / not_defined>",
