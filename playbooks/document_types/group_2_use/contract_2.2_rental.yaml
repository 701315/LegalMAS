        - "(?i)возмещени(е|я)\\s+убытк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: ответственность сторон и неустойки.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку оплаты.
        2. Есть ли штрафы за нарушения арендатора.
        3. Есть ли штрафы за нарушения арендодателя.
        4. Есть ли ограничение ответственности.
        5. Есть ли порядок возмещения убытков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ответственность описана:
        Фрагмент:
        "За просрочку оплаты — пени 0,5% в день от суммы долга. За повреждение
        предмета проката — штраф в размере полной стоимости. Ответственность
        Арендодателя ограничена размером полученной арендной платы."

        Ответ:
