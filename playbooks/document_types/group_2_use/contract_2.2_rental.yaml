type: contract_2.2_rental
name: "Договор проката"

description: |
  Специальный вид аренды движимого имущества, предоставляемого во временное владение
  и пользование за плату для потребительских (личных, семейных, бытовых) нужд.
  Характеризуется публичным характером договора, профессиональным арендодателем,
  краткосрочностью, обязательной consumer-ориентацией арендатора и особыми правилами:
  срок до одного года, фиксированная плата, обязанность арендодателя по ремонту,
  обязанность проверить исправность имущества и ознакомить арендатора с правилами эксплуатации,
  а также запрет субаренды и передачи прав третьим лицам.
  Регулируется § 2 Главы 34 ГК РФ и, в соответствующих случаях, законодательством
  о защите прав потребителей.

version: 4.0
parent: class_2_transfer_for_use

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 34 ГК РФ (ст. 626-631)"
  doc_types_supported:
    - "договор проката"
    - "договор бытового проката"
    - "публичный договор проката"
    - "прокат инвентаря"
    - "прокат инструмента"
    - "прокат оборудования для бытовых нужд"
    - "краткосрочный договор проката"
    - "оферта сервиса проката"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)прокат"
      - "(?i)rental[\\s_.-]?consumer"
      - "(?i)consumer[\\s_.-]?rental"
      - "(?i)пункт[\\s_.-]?проката"

    folder_patterns:
      - "(?i)прокат"
      - "(?i)consumer"
      - "(?i)retail[\\s_]?rental"

    keywords:

      high:
        - "(?i)прокат[аыу]?"
        - "(?i)договор\\s+прокат[аыу]"
        - "(?i)договор\\s+бытов[огоый]\\s+прокат[аыу]"
        - "(?i)публичн[ыйое]\\s+договор\\s+прокат[аыу]"
        - "(?i)прокат\\s+инвентар[яея]"
        - "(?i)прокат\\s+инструмент[ауы]"
        - "(?i)прокат\\s+оборудован[ияи]\\s+для\\s+бытов[ыхых]\\s+нужд"
        - "(?i)краткосрочн[ыйое]\\s+договор\\s+прокат[аыу]"
        - "(?i)оферт[аы]\\s+сервис[ауы]\\s+прокат[аыу]"
        - "(?i)бытов[ыеых]\\s+нужд[ы]"
        - "(?i)потребительск[иеих]\\s+цел[ией]"
        - "(?i)публичн[ыйое]\\s+договор"
        - "(?i)пункт\\s+прокат[аыу]"
        - "(?i)гражданин[ауы]"
        - "(?i)проверка\\s+исправност[ии]"
        - "(?i)инструкц[ияи]\\s+по\\s+эксплуатац[иии]"

      medium:
        - "(?i)почасов[а-яё]+\\s+аренд[аы]"
        - "(?i)посуточн[а-яё]+\\s+аренд[аы]"
        - "(?i)краткосрочн[а-яё]+\\s+аренд[аы]"
        - "(?i)аренд[аы]\\s+инвентар[яя]"
        - "(?i)движим[оа]е?\\s+имуществ[оа]"
        - "(?i)страхов[оа]й\\s+депозит"
        - "(?i)обеспечительн[ыо]й\\s+плат[её]ж"
        - "(?i)нормальн[ыо]й\\s+износ"
        - "(?i)возврат\\s+залога"

      low:
        - "(?i)квитанци[яи]\\s+прокат[аа]"
        - "(?i)\\bчек\\b"
        - "(?i)\\bкаршеринг\\b"
        - "(?i)\\bкикшеринг\\b"
        - "(?i)\\bсамокат\\b"
        - "(?i)\\bвелосипед\\b"
        - "(?i)\\bинструмент\\b"
        - "(?i)спортинвентар[ьяю]"

    exclusions:
      - "(?i)аренд[аы]\\s+недвижимост[ии]"
      - "(?i)\\bлизинг\\b"
      - "(?i)финансов[а-яё]+\\s+аренд[аы]"
      - "(?i)безвозмездн[оа]е\\s+пользовани[ея]"
      - "(?i)\\bссуд[аы]\\b"
      - "(?i)договор\\s+на[йеё]м[ауы]\\s+жил[оа]го\\s+помещени[яя]"
      - "(?i)аренд[аы]\\s+для\\s+предпринимательск[оа]й\\s+деятельност[ии]\\s+арендатор[аа]"
      - "(?i)транспортн[оеая]\\s+средств[оа]\\s+с\\s+экипажем"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  consumer_purpose:
    any_keywords:
      - "(?i)для\\s+бытов[ыо]х\\s+нужд"
      - "(?i)для\\s+личн[ыо]х\\s+нужд"
      - "(?i)потребительск[иоя]+\\s+цел[еи]"
      - "(?i)семейн[ыо]е\\s+нужд[ыа]"
      - "(?i)личн[оа]е\\s+использовани[ея]"
      - "(?i)гражданин-?арендатор"

  movable_item_rental:
    any_keywords:
      - "(?i)движим[оа]е?\\s+имуществ[оа]"
      - "(?i)\\bинструмент\\b"
      - "(?i)\\bоборудовани[ея]\\b"
      - "(?i)\\bтехник[аи]\\b"
      - "(?i)\\bсамокат\\b"
      - "(?i)\\bвелосипед\\b"
      - "(?i)спортинвентар[ьяю]"
      - "(?i)\\bкостюм\\b"
      - "(?i)серийн[ыо]й\\s+номер"
      - "(?i)\\bмарк[аа]\\b"
      - "(?i)\\bмодел[ьяи]\\b"

  short_term_rental:
    any_keywords:
      - "(?i)почасов[а-яё]+\\s+аренд[аы]"
      - "(?i)посуточн[а-яё]+\\s+аренд[аы]"
      - "(?i)на\\s+сутк[ии]"
      - "(?i)на\\s+час[ыа]"
      - "(?i)на\\s+несколько\\s+дней"
      - "(?i)до\\s+одного\\s+год[аа]"
      - "(?i)краткосрочн[а-яё]+\\s+аренд[аы]"

  public_contract_features:
    any_keywords:
      - "(?i)публичн[ыо]й\\s+договор"
      - "(?i)публичн[а-яё]+\\s+оферт[аы]"
      - "(?i)един[ыо]е\\s+услови[яе]\\s+для\\s+всех"
      - "(?i)заключаетс[яьа]\\s+с\\s+каждым\\s+обративш[иия]мся"
      - "(?i)пункт\\s+прокат[аа]"

  repair_obligations:
    any_keywords:
      - "(?i)капитальн[ыо]й\\s+и\\s+текущ[иоя]+\\s+ремонт"
      - "(?i)ремонт\\s+за\\s+счет\\s+арендодател[яя]"
      - "(?i)устранени[ея]\\s+недостатк[оа]в"
      - "(?i)замен[аы]\\s+неисправн[оа]го\\s+имуществ[аа]"

  deposit_related:
    any_keywords:
      - "(?i)\\bзалог\\b"
      - "(?i)страхов[оа]й\\s+депозит"
      - "(?i)обеспечительн[ыо]й\\s+плат[её]ж"
      - "(?i)гарантийн[а-яё]+\\s+сумм[аа]"
      - "(?i)возврат\\s+залога"
      - "(?i)удержани[ея]\\s+депозит[аа]"

  safety_and_instruction:
    any_keywords:
      - "(?i)проверк[аи]\\s+исправност[ии]"
      - "(?i)правил[аа]\\s+эксплуатаци[ии]"
      - "(?i)\\bинструктаж\\b"
      - "(?i)техник[аа]\\s+безопасност[ии]"
      - "(?i)ознакомлени[ея]\\s+с\\s+правил[ами]\\s+использовани[яя]"

  commercial_use_risk:
    any_keywords:
      - "(?i)для\\s+предпринимательск[оа]й\\s+деятельност[ии]"
      - "(?i)для\\s+бизнес[аа]"
      - "(?i)в\\s+коммерческ[иоя]+\\s+цел[яах]"
      - "(?i)для\\s+извлечени[яя]\\s+прибыл[ии]"
      - "(?i)\\bИП\\b"
      - "(?i)\\bюрлиц[оа]\\b"

  transport_like_service:
    any_keywords:
      - "(?i)\\bкаршеринг\\b"
      - "(?i)\\bкикшеринг\\b"
      - "(?i)\\bсамокат\\b"
      - "(?i)\\bвелосипед\\b"
      - "(?i)мобильн[оа]е\\s+приложени[ея]"
      - "(?i)оферт[аы]\\s+сервис[аа]"

  return_and_handover:
    description: "Возврат и приёмка/выдача имущества"
    any_keywords:
      - "(?i)возврат\\s+имуществ[аа]"
      - "(?i)акт\\s+возврат[аа]"
      - "(?i)\\bквитанци[яи]\\b"
      - "(?i)акт\\s+выдач[ии]"
      - "(?i)при\\s+возврат[ее]"
      - "(?i)просрочк[аа]\\s+возврат[аа]"
      - "(?i)штраф\\s+за\\s+невозврат"
      - "(?i)комплектност[ьи]\\s+при\\s+возврат[ее]"

  personal_data_processing:
    description: "Обработка персональных данных арендатора"
    any_keywords:
      - "(?i)персональн[ыо]е\\s+данн[ыо]е"
      - "(?i)согласи[ея]\\s+на\\s+обработк[уу]"
      - "(?i)паспортн[ыо]е\\s+данн[ыо]е"
      - "(?i)\\bФЗ-152\\b"
      - "(?i)оператор\\s+персональн[ыо]х\\s+данн[ыо]х"
      - "(?i)фотографировани[ея]\\s+документ[оа]в"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  duration_pattern: "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
  serial_number: "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "commercial_use_reclassification_risk"
    name: "Риск переквалификации: прокат используется для предпринимательских целей"
    description: >
      Если имущество передается не для бытовых/потребительских нужд, а для бизнеса,
      договор не должен квалифицироваться как прокат и, как правило, должен анализироваться
      как общая аренда или иной специальный арендный режим.
    legal_base: "ст. 626 ГК РФ"
    required_triggers: ["commercial_use_risk"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "для предпринимательской деятельности"
        - "для бизнеса"
        - "в коммерческих целях"
        - "для извлечения прибыли"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "предпринимательская деятельность"
        - "коммерческие цели"
        - "ст. 626 ГК РФ"
      rerank: true

  - id: "term_over_one_year_risk"
    name: "Срок проката свыше одного года противоречит специальной модели проката"
    description: >
      Прокат является краткосрочным специальным договором; срок свыше одного года
      несовместим с его стандартной моделью и создает риск переквалификации.
      При обнаружении сроков свыше 12 месяцев или пролонгации, потенциально
      увеличивающей суммарный срок за пределы года, — выдается предупреждение.
    legal_base: "ст. 627 ГК РФ"
    required_triggers: []  
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "2 года"
        - "два года"
        - "3 года"
        - "три года"
        - "18 месяцев"
        - "24 месяца"
        - "на неопределённый срок"
        - "бессрочный"
        - "автоматическое продление"
        - "пролонгация"
        - "возобновление на тот же срок"
      keyword_mode: "any"
      negative_keywords:
        - "до одного года"
        - "не более 12 месяцев"
        - "не более 1 года"
    retrieval:
      context_k: 4
      boost_keywords:
        - "срок"
        - "свыше одного года"
        - "пролонгация"
        - "ст. 627 ГК РФ"
      rerank: true

  - id: "consumer_law_mandatory_context"
    name: "Необходим учет consumer-law контекста в договоре проката"
    description: >
      Если прокат оформляется для гражданина-потребителя, необходимо учитывать
      императивные нормы законодательства о защите прав потребителей, включая запрет
      на ущемляющие условия и навязывание дополнительных услуг.
    legal_base: "Закон РФ № 2300-1, ст. 16 ЗоЗПП, ст. 426 ГК РФ"
    required_triggers: ["consumer_purpose"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "закон о защите прав потребителей"
        - "публичный договор"
        - "дополнительные услуги"
        - "страховка"
        - "без возврата"
        - "навязывание услуг"
        - "обязательная страховка"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ЗоЗПП"
        - "публичный договор"
        - "ущемление прав потребителя"
        - "навязывание"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: rental_subject_and_consumer_purpose_extraction
    name: "Прокат: извлечение предмета, срока и потребительской цели"
    description: >
      Извлекает объект проката, срок, цену, признаки бытового использования,
      модель выдачи и базовые условия consumer-rental.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "прокат"
        - "бытовые нужды"
        - "потребительские цели"
        - "гражданин"
        - "арендная плата"
        - "срок проката"
        - "марка"
        - "модель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(\\b\\d+\\s*(?:час|часов|часа|суток|сутки|дней|день|месяц|месяцев|месяца|год|года|лет)\\b)"
        - "(?i)(серийный\\s+номер|инвентарный\\s+номер|imei|vin|s/n)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор проката.
        Извлеки ключевые условия договора.

        Ответь строго в JSON:
        {
          "rental_item": "<описание вещи или not_found>",
          "item_type": "<equipment / tool / scooter / bicycle / costume / consumer_item / other / not_found>",
          "consumer_purpose_status": "<explicit / implied / contradicted / not_found>",
          "rental_term": "<срок проката или not_found>",
          "fixed_fee": "<размер платы или not_found>",
          "deposit_present": "<yes / no / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "прокат"
        - "бытовые нужды"
        - "срок"
        - "арендная плата"
        - "залог"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "rental_item"
          type: "string"
          description: "Предмет проката"
        - name: "consumer_purpose_status"
          type: "string"
          allowed_values: ["explicit", "implied", "contradicted", "not_found"]
          description: "Статус бытовой/потребительской цели"
        - name: "rental_term"
          type: "string"
          description: "Срок проката"
        - name: "fixed_fee"
          type: "string"
          description: "Размер платы"
      store_payload: true

  - id: public_contract_status_check
    name: "Публичный характер договора проката"
    description: >
      Проверяет, отражен ли публичный характер договора, единые условия
      для потребителей и отсутствие дискриминационного отказа.
    triggers:
      any: ["public_contract_features"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "публичный договор"
        - "публичная оферта"
        - "единые условия для всех"
        - "каждый обратившийся"
        - "пункт проката"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)публичн(ый|ого)\\s+договор"
        - "(?i)публичн(ая|ой)\\s+оферт"
        - "(?i)кажд(ый|ому)\\s+обративш"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор проката.
        Проверь, раскрыт ли публичный характер договора.

        Ответь строго в JSON:
        {
          "public_contract_status": "<explicit / implied / not_found>",
          "uniform_terms_reference": "<yes / no / not_found>",
          "consumer_access_model": "<open_to_all / unclear / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "публичный договор"
        - "публичная оферта"
        - "единые условия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "public_contract_status"
          type: "string"
          allowed_values: ["explicit", "implied", "not_found"]
          description: "Статус публичного договора"
      store_payload: true

  - id: unilateral_termination_consumer_check
    name: "Право арендатора на отказ от договора проката"
    description: >
      Проверяет, отражено ли право арендатора отказаться от договора,
      вернуть имущество досрочно и получить перерасчет.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вправе отказаться в любое время"
        - "односторонний отказ"
        - "досрочный возврат имущества"
