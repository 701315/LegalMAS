          required: false
        - name: "repair_shift_to_tenant_details"
          type: "string"
          presentation: "fact"
          label: "Ремонт за счёт арендатора"
          description: "Формулировка о возложении ремонта на арендатора."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Запрет субаренды
  # ──────────────────────────────────────────────────────────────────────────
  - id: sublease_and_personal_use_check
    name: "Запрет субаренды и личный характер пользования (ст. 631 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте запрета субаренды,
      запрета передачи предмета проката третьим лицам и указания
      на личный потребительский характер использования.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субаренда запрещена"
        - "передача третьим лицам не допускается"
        - "без права передачи"
        - "только для личного использования"
        - "использование только арендатором"
        - "запрет субаренды"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субаренд.*запрещ"
        - "(?i)передач.*третьим\\s+лицам.*не\\s+допуска"
        - "(?i)личн(ое|ого)\\s+использован"
        - "(?i)без\\s+права\\s+передач"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: запрет субаренды и личный характер
        пользования предметом проката.

        Нормативный ориентир:
        - ст. 631 ГК РФ — арендатор не вправе сдавать в субаренду имущество,
          полученное по договору проката

        Важно:
        - Не оценивай серьёзность риска.
