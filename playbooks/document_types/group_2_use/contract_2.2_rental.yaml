        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - normal_wear_excluded_status = "defined" только если нормальный /
          естественный износ прямо исключён из ответственности.
        - Верни только JSON.
        </rules>
