      store_payload: true

  - id: rental_liability_and_penalties_check
    name: "Ответственность сторон и неустойки в договоре проката"
    description: >
      Фактографическая проверка наличия в тексте неустоек, штрафов
      за нарушения арендатора и арендодателя, ограничения ответственности
      и порядка возмещения убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пени"
        - "ответственность"
        - "ограничение ответственности"
        - "возмещение убытков"
        - "ущерб"
        - "утрата имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк|штраф|пени"
        - "(?i)ограничени(е|я)\\s+ответственност"
        - "(?i)возмещени(е|я)\\s+убытк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется общий режим ответственности сторон и неустойки.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393, 15 ГК РФ — убытки
        - ст. 16 ЗоЗПП — ничтожность условий, ущемляющих права потребителя

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - В договоре проката с потребителем ограничения ответственности
          арендодателя могут быть ничтожны по ЗоЗПП.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка за просрочку оплаты.
        2. Есть ли штрафы за нарушения арендатора.
        3. Есть ли штрафы за нарушения арендодателя.
        4. Есть ли ограничение ответственности (caps, лимиты).
        5. Есть ли порядок возмещения убытков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ответственность сбалансирована:
        Фрагмент:
        "За просрочку оплаты — пени 0,5% в день от суммы долга. За повреждение
        предмета проката — штраф в размере полной стоимости. Ответственность
        Арендодателя ограничена размером полученной арендной платы."

        Ответ:
        {
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "пени 0,5% в день от суммы долга",
          "tenant_breach_penalty_status": "defined",
          "tenant_breach_penalty_details": "штраф в размере полной стоимости за повреждение",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "defined",
          "liability_cap_details": "ответственность Арендодателя ограничена размером полученной арендной платы",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "liability_balance_display": "Перекос в пользу арендодателя (ограничение ответственности арендодателя)",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "За просрочку оплаты — пени 0,5% в день от суммы долга."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Данные не определены",
          "tenant_breach_penalty_status": "not_defined",
          "tenant_breach_penalty_details": "Данные не определены",
          "landlord_breach_penalty_status": "not_defined",
          "landlord_breach_penalty_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "damages_procedure_status": "not_defined",
          "damages_procedure_details": "Данные не определены",
          "liability_balance_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку.
        2. Найди прямую цитату о штрафах арендатора.
        3. Найди прямую цитату о штрафах арендодателя.
        4. Найди прямую цитату об ограничении ответственности.
        5. Найди прямую цитату о порядке возмещения убытков.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<текст или 'Данные не определены'>",
          "tenant_breach_penalty_status": "<defined / not_defined>",
          "tenant_breach_penalty_details": "<текст или 'Данные не определены'>",
          "landlord_breach_penalty_status": "<defined / not_defined>",
          "landlord_breach_penalty_details": "<текст или 'Данные не определены'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "damages_procedure_status": "<defined / not_defined>",
          "damages_procedure_details": "<текст или 'Данные не определены'>",
          "liability_balance_display": "<'Сбалансирована' / 'Перекос в пользу арендодателя' / 'Перекос в пользу арендатора' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка штраф пени ответственность ограничение ответственности возмещение убытков ущерб утрата имущества повреждение просрочка оплаты"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "возврат"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката неустойки,
        штрафы за нарушения сторон, ограничение ответственности и порядок
        возмещения убытков.
        Не анализируй регулярную арендную плату, ремонт, субаренду или возврат
        имущества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей (все обязательны в ответе):

        1. late_payment_penalty_status — "defined" если неустойка (пени) за
           просрочку арендной платы прямо указана, иначе "not_defined".
        2. late_payment_penalty_details — формулировка о неустойке за просрочку
           оплаты (размер, порядок расчёта).
           Если отсутствует — "Данные не определены".
        3. tenant_breach_penalty_status — "defined" если штрафы за нарушения
           арендатора (повреждение, утрата, просрочка возврата) прямо указаны,
           иначе "not_defined".
        4. tenant_breach_penalty_details — формулировка о штрафах арендатора.
           Если отсутствует — "Данные не определены".
        5. landlord_breach_penalty_status — "defined" если штрафы за нарушения
           арендодателя (непредоставление вещи, недостатки) прямо указаны,
           иначе "not_defined".
        6. landlord_breach_penalty_details — формулировка о штрафах арендодателя.
           Если отсутствует — "Данные не определены".
        7. liability_cap_status — "defined" если ограничение ответственности
           (caps, лимиты) прямо указано, иначе "not_defined".
        8. liability_cap_details — формулировка об ограничении ответственности.
           Если отсутствует — "Данные не определены".
        9. damages_procedure_status — "defined" если порядок возмещения убытков
           прямо описан, иначе "not_defined".
        10. damages_procedure_details — формулировка о возмещении убытков.
            Если отсутствует — "Данные не определены".
        11. liability_balance_display — краткий user-friendly вывод о балансе
            ответственности сторон:
            - "Сбалансирована" — если штрафы/ответственность предусмотрены для
              обеих сторон примерно в равной мере;
            - "Перекос в пользу арендодателя" — если штрафы/ограничения
              существенно ущемляют права арендатора (например, ответственность
              арендодателя ограничена, а арендатора — полная);
            - "Перекос в пользу арендатора" — если ответственность арендодателя
              существенно выше ответственности арендатора;
            - "Данные не определены" — если договор не содержит условий об
              ответственности.

        Плюс поле evidence — массив цитат из договора с указанием пункта.
        </task>

        <context_rules>
        - Используй только текст договора. Не подставляй нормы закона (ГК РФ,
        ЗоЗПП) вместо текста документа.
        - Не оценивай риски, не давай субъективных юридических оценок.
        - Не смешивай неустойку за просрочку оплаты с штрафами за иные нарушения.
        - В договоре проката с потребителем ограничения ответственности
        арендодателя могут быть ничтожны по ст. 16 ЗоЗПП, но в DD важно
        зафиксировать их наличие как факт.
        - tenant_breach_penalty_details может дублировать Check 8
        (damage_liability_details) — это нормально, фиксируй текст договора.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <context_rules>
        - Если фрагмент контекста не содержит данных о неустойках, штрафах,
          ограничении ответственности или возмещении убытков — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Ответственность сторон» или «Заключительные положения».
        - Условия об ответственности могут быть разбросаны по разным разделам
          договора (платежи, возврат, общие положения). Анализируй весь контекст.
        </context_rules>

        <output_expectations>
        - Верни строго валидный JSON-объект без markdown-обёрток, комментариев
          или пояснений.
        - В ответе должны присутствовать все 11 полей + поле evidence.
        - Не используй значения null, None или пустые строки — для отсутствующих
          данных используй "not_defined" для статусов и
          "Данные не определены" для текстовых полей.
        - evidence — массив объектов с ключами "clause_ref" и "quote";
          если данных нет — верни пустой массив [].
        </output_expectations>

      fields:
        - name: "late_payment_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за просрочку оплаты."
          required: true
          display_in_grid: false
        - name: "late_payment_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку"
          description: "Формулировка о неустойке (пени) за просрочку арендной платы."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "tenant_breach_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафов за нарушения арендатора."
          required: true
          display_in_grid: false
        - name: "tenant_breach_penalty_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о штрафах за нарушения арендатора (скрыта из Grid — дублирует Check 8, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "landlord_breach_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафов за нарушения арендодателя."
          required: true
          display_in_grid: false
        - name: "landlord_breach_penalty_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о штрафах за нарушения арендодателя (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничения ответственности."
          required: true
          display_in_grid: false
        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об ограничении ответственности (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "damages_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возмещения убытков."
          required: true
          display_in_grid: false
        - name: "damages_procedure_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка о порядке возмещения убытков (скрыта из Grid, доступна в drawer)."
          required: false
          display_in_grid: false
        - name: "liability_balance_display"
          type: "string"
          presentation: "fact"
          label: "Баланс ответственности"
          description: "Компактный вывод о балансе ответственности сторон в договоре проката."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: unfair_consumer_clauses_check
    name: "Недопустимые потребительские условия в договоре проката"
    description: >
      Фактографическая проверка наличия в тексте формулировок, которые могут
      ограничивать законные права арендатора-потребителя: невозвратность платы,
      blanket disclaimer ответственности арендодателя, запрет отказа от договора,
      несоразмерные штрафы, навязанные удержания, отказ от законных гарантий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "деньги не возвращаются"
        - "оплата не подлежит возврату"
        - "минимальный срок аренды обязателен"
        - "арендодатель не несет ответственности"
        - "арендодатель освобождается от ответственности"
        - "штраф"
        - "безусловное удержание"
        - "арендатор отказывается от претензий"
        - "арендатор принимает на себя все риски"
        - "гарантии не предоставляются"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)деньги\\s+не\\s+возвращ"
        - "(?i)оплата\\s+не\\s+подлежит\\s+возврат"
        - "(?i)арендодатель.*не\\s+нес[её]т\\s+ответственност"
        - "(?i)арендодатель.*освобожда(ется|ют)\\s+от\\s+ответственност"
        - "(?i)арендатор.*отказыва(ется|ют)\\s+от\\s+претензи"
        - "(?i)арендатор.*принима(ет|ют)\\s+на\\s+себя\\s+все\\s+риск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется наличие формулировок, потенциально ущемляющих права
        арендатора-потребителя по ст. 16 ЗоЗПП.

        Нормативный ориентир:
        - ст. 16 Закона о защите прав потребителей — недействительность условий,
          ущемляющих права потребителя
        - ст. 627 ГК РФ — право арендатора на отказ в любое время
        - ст. 631 ГК РФ — ремонт за счёт арендодателя

        Важно:
        - Не делай самостоятельный юридический вывод о недействительности.
        - Фиксируй только наличие или отсутствие конкретных формулировок.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли формулировка о невозвратности платы ни при каких условиях.
        2. Есть ли blanket disclaimer ответственности арендодателя.
        3. Есть ли запрет или ограничение права арендатора на отказ от договора.
        4. Есть ли формулировка об отказе арендатора от претензий.
        5. Есть ли формулировка о принятии арендатором всех рисков.
        6. Есть ли формулировка об отказе от гарантий.
        7. Есть ли условие о безусловном удержании из депозита.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не делай самостоятельный правовой вывод о недействительности условия.
        4. Если формулировка не указана прямо — возвращай статус "not_defined".
        5. Для текстовых полей (*_details, *_summary) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        6. Для статусов допустимо значение "not_defined".
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown-обёрток.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — проблемные формулировки есть (несколько):
        Фрагмент:
        "Оплата за прокат не подлежит возврату ни при каких обстоятельствах.
        Арендодатель не несёт ответственности за вред, причинённый здоровью
        или имуществу Арендатора при использовании предмета проката.
        Арендатор принимает на себя все риски, связанные с эксплуатацией."

        Ответ:
        {
          "non_refund_clause_status": "defined",
          "non_refund_clause_details": "оплата за прокат не подлежит возврату ни при каких обстоятельствах",
          "blanket_disclaimer_status": "defined",
          "blanket_disclaimer_details": "Арендодатель не несёт ответственности за вред, причинённый здоровью или имуществу Арендатора",
          "termination_restriction_status": "not_defined",
          "termination_restriction_details": "Данные не определены",
          "waiver_of_claims_status": "not_defined",
          "waiver_of_claims_details": "Данные не определены",
          "full_risk_assumption_status": "defined",
          "full_risk_assumption_details": "Арендатор принимает на себя все риски, связанные с эксплуатацией",
          "warranty_disclaimer_status": "not_defined",
          "warranty_disclaimer_details": "Данные не определены",
          "unconditional_retention_status": "not_defined",
          "unconditional_retention_details": "Данные не определены",
          "unfair_clauses_summary": "Выявлены недопустимые условия",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Оплата за прокат не подлежит возврату ни при каких обстоятельствах."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Арендодатель не несёт ответственности за вред, причинённый здоровью или имуществу Арендатора при использовании предмета проката."
            }
          ]
        }

        Пример 2 — проблемных формулировок нет:
        Фрагмент:
        "Арендатор вправе отказаться от договора в любое время."

        Ответ:
        {
          "non_refund_clause_status": "not_defined",
          "non_refund_clause_details": "Данные не определены",
          "blanket_disclaimer_status": "not_defined",
          "blanket_disclaimer_details": "Данные не определены",
          "termination_restriction_status": "not_defined",
          "termination_restriction_details": "Данные не определены",
          "waiver_of_claims_status": "not_defined",
          "waiver_of_claims_details": "Данные не определены",
          "full_risk_assumption_status": "not_defined",
          "full_risk_assumption_details": "Данные не определены",
          "warranty_disclaimer_status": "not_defined",
          "warranty_disclaimer_details": "Данные не определены",
          "unconditional_retention_status": "not_defined",
          "unconditional_retention_details": "Данные не определены",
          "unfair_clauses_summary": "Не выявлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о невозвратности платы.
        2. Найди прямую цитату о полном снятии ответственности арендодателя.
        3. Найди прямую цитату о запрете / ограничении отказа от договора.
        4. Найди прямую цитату об отказе от претензий.
        5. Найди прямую цитату о принятии всех рисков арендатором.
        6. Найди прямую цитату об отказе от гарантий.
        7. Найди прямую цитату о безусловном удержании.
        8. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
