          required: false
      store_payload: true

  - id: deposit_and_damage_liability_check
    name: "Залог / депозит, ответственность за повреждение и нормальный износ"
    description: >
      Фактографическая проверка режима обеспечительного платежа / залога,
      критериев удержания, порядка возврата, ответственности за утрату /
      повреждение предмета проката и исключения нормального износа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "страховой депозит"
        - "обеспечительный платеж"
        - "возврат залога"
        - "удержание залога"
        - "утрата имущества"
        - "повреждение имущества"
        - "нормальный износ"
        - "естественный износ"
        - "критерии удержания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ой|ого)\\s+депозит|обеспечительн(ый|ого)\\s+плат|залог"
        - "(?i)утрат(а|ы)\\s+имуществ|поврежден(ие|ия)"
        - "(?i)нормальн(ый|ого)\\s+износ|естественн(ый|ого)\\s+износ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется правовой режим залога / обеспечительного платежа, порядок
        его возврата, условия удержания и ответственность за повреждение вещи
        с учётом нормального (естественного) износа.

        Нормативный ориентир:
        - ст. 381.1 ГК РФ — обеспечительный платёж (возврат при ненаступлении обстоятельств)
        - ст. 622 ГК РФ — возврат имущества в том состоянии, в котором арендатор
          его получил, с учётом нормального износа
        - ст. 16 ЗоЗПП — недопустимость удержания средств за естественный износ

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли залог / обеспечительный платёж / депозит и его условия.
        2. Есть ли порядок и сроки возврата залога / депозита.
        3. Есть ли критерии и основания удержания залога арендодателем.
        4. Какая ответственность арендатора за утрату или повреждение вещи предусмотрена.
        5. Исключён ли прямо нормальный (естественный) износ из ответственности арендатора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай статус "not_defined".
        3. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        4. Для статусов допустимо значение "not_defined".
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный защитный режим (износ исключён, сроки возврата есть):
        Фрагмент:
        "Арендатор вносит обеспечительный платёж в размере 5 000 рублей.
        Платёж возвращается в полном объёме в течение 3 рабочих дней после
        возврата имущества по акту. Арендатор несёт ответственность за повреждения
        вещи, возникшие по его вине, за исключением нормального износа.
        Удержание из платежа производится только в размере документально
        подтверждённого ущерба."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "обеспечительный платёж в размере 5 000 рублей",
          "deposit_refund_status": "defined",
          "deposit_refund_details": "возвращается в полном объёме в течение 3 рабочих дней после возврата имущества по акту",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "только в размере документально подтверждённого ущерба",
          "damage_liability_status": "defined",
          "damage_liability_details": "ответственность за повреждения вещи, возникшие по его вине, за исключением нормального износа",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "за исключением нормального износа",
          "normal_wear_excluded_display": "Исключен из ответственности",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Арендатор вносит обеспечительный платёж в размере 5 000 рублей. Платёж возвращается в полном объёме в течение 3 рабочих дней после возврата имущества по акту."
            },
            {
              "clause_ref": "п. 5.3",
              "quote": "Арендатор несёт ответственность за повреждения вещи, возникшие по его вине, за исключением нормального износа."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Арендатор обязуется бережно эксплуатировать имущество."

        Ответ:
        {
          "deposit_status": "not_defined",
          "deposit_details": "Данные не определены",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "retention_criteria_status": "not_defined",
          "retention_criteria_details": "Данные не определены",
          "damage_liability_status": "not_defined",
          "damage_liability_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "normal_wear_excluded_display": "Данные не определены",
          "evidence": []
        }

        Пример 3 — залог есть, но износ не исключён (риск для потребителя):
        Фрагмент:
        "Залог составляет 3 000 руб. В случае любых царапин или потертостей
        залог не возвращается и удерживается в качестве штрафа."

        Ответ:
        {
          "deposit_status": "defined",
          "deposit_details": "Залог составляет 3 000 руб.",
          "deposit_refund_status": "not_defined",
          "deposit_refund_details": "Данные не определены",
          "retention_criteria_status": "defined",
          "retention_criteria_details": "В случае любых царапин или потертостей залог не возвращается и удерживается в качестве штрафа",
          "damage_liability_status": "defined",
          "damage_liability_details": "залог удерживается в качестве штрафа при любых царапинах",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "normal_wear_excluded_display": "Не упомянут (риск удержания)",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Залог составляет 3 000 руб. В случае любых царапин или потертостей залог не возвращается и удерживается в качестве штрафа."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о залоге / обеспечительном платеже.
        2. Найди прямую цитату о сроке и порядке возврата залога.
        3. Найди прямую цитату об основаниях удержания.
        4. Найди прямую цитату об ответственности за ущерб.
        5. Найди прямое упоминание исключения нормального (естественного) износа.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "deposit_status": "<defined / not_defined>",
          "deposit_details": "<текст или 'Данные не определены'>",
          "deposit_refund_status": "<defined / not_defined>",
          "deposit_refund_details": "<текст или 'Данные не определены'>",
          "retention_criteria_status": "<defined / not_defined>",
          "retention_criteria_details": "<текст или 'Данные не определены'>",
          "damage_liability_status": "<defined / not_defined>",
          "damage_liability_details": "<текст или 'Данные не определены'>",
          "normal_wear_excluded_status": "<defined / not_defined>",
          "normal_wear_excluded_details": "<текст или 'Данные не определены'>",
          "normal_wear_excluded_display": "<'Исключен из ответственности' / 'Не упомянут (риск удержания)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обеспечительный платёж залог страховой депозит возврат залога удержание ущерб повреждение имущества ответственность арендатора нормальный износ естественный износ акт возврата"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "поломка"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "deposit_and_damage_liability_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о залоге / обеспечительном платеже, сроках его возврата, основаниях
        удержания, ответственности за повреждение имущества и исключении
        нормального (естественного) износа.
        Не анализируй регулярную арендную плату, регламент текущего ремонта,
        субаренду или публичный статус договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deposit_and_damage_liability_check_presence:
           Агрегатное signal-поле — наличие регулирования по режиму залога,
           ответственности за повреждение и учёту нормального износа.
           - "present" — если хотя бы одно из содержательных полей
             (deposit_status, deposit_refund_status, retention_criteria_status,
              damage_liability_status, normal_wear_excluded_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - deposit_status = "not_defined";
           - deposit_details = "Данные не определены";
           - deposit_refund_status = "not_defined";
           - deposit_refund_details = "Данные не определены";
           - retention_criteria_status = "not_defined";
           - retention_criteria_details = "Данные не определены";
           - damage_liability_status = "not_defined";
           - damage_liability_details = "Данные не определены";
           - normal_wear_excluded_status = "not_defined";
           - normal_wear_excluded_details = "Данные не определены";
           - normal_wear_excluded_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. deposit_status — "defined" если залог / депозит / обеспечительный
           платёж прямо предусмотрен, иначе "not_defined".
        2. deposit_details — размер и базовые условия депозита.
           Если отсутствует — "Данные не определены".
        3. deposit_refund_status — "defined" если срок и порядок возврата
           обеспечительного платежа прямо описаны, иначе "not_defined".
        4. deposit_refund_details — формулировка о порядке и сроках возврата залога
           (например, "в течение 3 дней после возврата"). Если отсутствует —
           "Данные не определены".
        5. retention_criteria_status — "defined" если основания и критерии
           удержания залога прямо указаны, иначе "not_defined".
        6. retention_criteria_details — формулировка об удержании залога/депозита.
           Если отсутствует — "Данные не определены".
        7. damage_liability_status — "defined" если ответственность арендатора
           за повреждение или утрату вещи прямо предусмотрена, иначе "not_defined".
        8. damage_liability_details — формулировка об ответственности за ущерб.
           Если отсутствует — "Данные не определены".
        9. normal_wear_excluded_status — "defined" если нормальный (естественный)
           износ прямо исключён из ответственности арендатора, иначе "not_defined".
        10. normal_wear_excluded_details — формулировка об исключении нормального износа.
            Если отсутствует — "Данные не определены".
        11. normal_wear_excluded_display — краткий user-friendly статус:
            - "Исключен из ответственности" — если в договоре прямо указано, что
              износ не возмещается / вещь возвращается с учётом износа;
            - "Не упомянут (риск удержания)" — если установлена ответственность
              за любые недостатки / залог удерживается за любые следы использования,
              а оговорка о нормальном износе отсутствует;
            - "Данные не определены" — если ответственность и залог не урегулированы.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - normal_wear_excluded_display = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни deposit_and_damage_liability_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details/*_display = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона (ст. 622 ГК РФ)
          вместо текста документа.
        - Не оценивай риски, не давай субъективных юридических оценок.
        - normal_wear_excluded_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова: "нормальный износ", "естественный износ", "с учётом износа",
          "за исключением эксплуатационного износа".
        - Если фрагмент контекста не содержит данных об обеспечительном платеже,
          удержаниях, возврате денег, ответственности за порчу или износе — игнорируй его.
        - Условия о залоге могут находиться в разделе расчётов, а условия об ответственности
          и износе — в разделе ответственности или возврата имущества. Анализируй оба блока.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни залога / депозита, ни порядка возврата, ни критериев
           удержания, ни ответственности за ущерб, ни оговорки о нормальном износе.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Неполное раскрытие темы.
           Залог указан, но без порядка возврата и без критериев удержания;
           ответственность за ущерб и оговорка об износе не упомянуты.
           → presence = "present";
             deposit_status = "defined";
             deposit_refund_status = "not_defined";
             retention_criteria_status = "not_defined";
             damage_liability_status = "not_defined";
             normal_wear_excluded_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что депозит возвращается при возврате имущества
           в любом состоянии, в другом — что депозит удерживается за любые следы
           использования, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             retention_criteria_status = "not_defined";
             retention_criteria_details = "Не удалось определить".

        4. Специфика темы: удержание за нормальный износ без оговорки (red flag).
           В тексте прямо указано, что залог удерживается при любых царапинах
           или следах использования, а оговорка о нормальном (естественном)
           износе отсутствует — риск необоснованного удержания по ст. 16 ЗоЗПП.
           → presence = "present";
             retention_criteria_status = "defined";
             retention_criteria_details = точная формулировка из текста;
             normal_wear_excluded_status = "not_defined";
             normal_wear_excluded_display = "Не упомянут (риск удержания)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deposit_and_damage_liability_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для normal_wear_excluded_display используй только: "Исключен из ответственности",
          "Не упомянут (риск удержания)" или "Данные не определены".
        - Fallback при отсутствии данных:
          * deposit_details → "Данные не определены";
          * deposit_refund_details → "Данные не определены";
          * retention_criteria_details → "Данные не определены";
          * damage_liability_details → "Данные не определены";
          * normal_wear_excluded_details / normal_wear_excluded_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * normal_wear_excluded_display → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "deposit_and_damage_liability_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по режиму залога, ответственности за повреждение и учёту нормального износа. Внутреннее агрегатное signal-поле."
          required: true

        - name: "deposit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
