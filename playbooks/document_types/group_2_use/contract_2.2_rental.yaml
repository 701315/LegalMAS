      store_payload: true

  - id: consumer_rights_notification_check
    name: "Уведомление о правах потребителя по Закону о защите прав потребителей"
    description: >
      Фактографическая проверка наличия в тексте договора информации
      о правах арендатора-потребителя по ЗоЗПП: право на отказ,
      право на качество, порядок возврата, контакты Роспотребнадзора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "Закон о защите прав потребителей"
        - "ЗоЗПП"
        - "право на отказ"
        - "право на качество"
        - "возврат товара"
        - "Роспотребнадзор"
        - "информация о потребителе"
        - "ст. 32 ЗоЗПП"
        - "ст. 8 ЗоЗПП"
        - "ст. 10 ЗоЗПП"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закон\\s+о\\s+защите\\s+прав\\s+потребител"
        - "(?i)зозпп"
        - "(?i)роспотребнадзор"
        - "(?i)ст\\.?\\s*32\\s*зо"
        - "(?i)ст\\.?\\s*(8|10)\\s*зо"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: информирование арендатора-потребителя
        о правах по Закону о защите прав потребителей.

        Нормативный ориентир:
        - ст. 8-10 ЗоЗПП — право на информацию
        - ст. 32 ЗоЗПП — право на отказ от договора
        - ст. 14.8 КоАП РФ — ответственность за нарушение прав потребителей

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - Отсутствие уведомления о правах потребителя = потенциальный
          штраф по ст. 14.8 КоАП РФ (до 500 000 руб. для юрлиц).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на ЗоЗПП.
        2. Есть ли информация о праве на отказ от договора.
        3. Есть ли информация о праве на качество услуги.
        4. Есть ли информация о порядке возврата/обмена.
        5. Есть ли контакты Роспотребнадзора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — права потребителя раскрыты:
        Фрагмент:
        "Договор регулируется Законом РФ «О защите прав потребителей».
        Арендатор вправе отказаться от договора в любое время (ст. 32 ЗоЗПП).
        Информация о правах потребителя предоставлена в соответствии
        со ст. 8-10 ЗоЗПП. Контакты Роспотребнадзора: 8-800-100-00-04."

        Ответ:
        {
          "zozpp_reference_status": "defined",
          "zozpp_reference_details": "Закон РФ «О защите прав потребителей»",
          "right_to_cancel_status": "defined",
          "right_to_cancel_details": "Арендатор вправе отказаться от договора в любое время (ст. 32 ЗоЗПП)",
          "quality_right_status": "defined",
          "quality_right_details": "Информация о правах потребителя предоставлена в соответствии со ст. 8-10 ЗоЗПП",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "rospotrebnadzor_contact_status": "defined",
          "rospotrebnadzor_contact_details": "8-800-100-00-04",
          "consumer_rights_summary": "Права раскрыты полностью",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Договор регулируется Законом РФ «О защите прав потребителей»."
            }
          ]
        }

        Пример 2 — права потребителя не раскрыты (типично для проката):
        Фрагмент:
        "Арендатор пользуется имуществом бережно."

        Ответ:
        {
          "zozpp_reference_status": "not_defined",
          "zozpp_reference_details": "Данные не определены",
          "right_to_cancel_status": "not_defined",
          "right_to_cancel_details": "Данные не определены",
          "quality_right_status": "not_defined",
          "quality_right_details": "Данные не определены",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "rospotrebnadzor_contact_status": "not_defined",
          "rospotrebnadzor_contact_details": "Данные не определены",
          "consumer_rights_summary": "Не раскрыты (риск штрафа по ст. 14.8 КоАП)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о ссылке на ЗоЗПП.
        2. Найди прямую цитату о праве на отказ.
        3. Найди прямую цитату о праве на качество.
        4. Найди прямую цитату о порядке возврата.
        5. Найди прямую цитату о контактах Роспотребнадзора.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "zozpp_reference_status": "<defined / not_defined>",
          "zozpp_reference_details": "<текст или 'Данные не определены'>",
          "right_to_cancel_status": "<defined / not_defined>",
          "right_to_cancel_details": "<текст или 'Данные не определены'>",
          "quality_right_status": "<defined / not_defined>",
          "quality_right_details": "<текст или 'Данные не определены'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "rospotrebnadzor_contact_status": "<defined / not_defined>",
          "rospotrebnadzor_contact_details": "<текст или 'Данные не определены'>",
          "consumer_rights_summary": "<'Права раскрыты полностью' / 'Права раскрыты частично' / 'Не раскрыты (риск штрафа по ст. 14.8 КоАП)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Закон о защите прав потребителей ЗоЗПП право на отказ право на качество возврат товара Роспотребнадзор ст. 32 ЗоЗПП ст. 8 ЗоЗПП ст. 10 ЗоЗПП информация о потребителе"
      preferred_unit_types:
        - general_provision
        - obligation
        - warranty
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - boilerplate
      negative_keywords:
        - "арендная плата"
        - "предмет проката"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "поломка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "consumer_rights_notification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката информацию
        о правах арендатора-потребителя по Закону о защите прав потребителей:
        ссылка на ЗоЗПП, право на отказ, право на качество, порядок возврата,
        контакты Роспотребнадзора.
        Не анализируй арендную плату, ремонт, возврат имущества или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. consumer_rights_notification_check_presence:
           Агрегатное signal-поле — наличие регулирования по информированию
           потребителя о его правах.
           - "present" — если хотя бы одно из содержательных полей
             (zozpp_reference_status, right_to_cancel_status,
              quality_right_status, return_procedure_status,
              rospotrebnadzor_contact_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - zozpp_reference_status = "not_defined";
           - zozpp_reference_details = "Данные не определены";
           - right_to_cancel_status = "not_defined";
           - right_to_cancel_details = "Данные не определены";
           - quality_right_status = "not_defined";
           - quality_right_details = "Данные не определены";
           - return_procedure_status = "not_defined";
           - return_procedure_details = "Данные не определены";
           - rospotrebnadzor_contact_status = "not_defined";
           - rospotrebnadzor_contact_details = "Данные не определены";
           - consumer_rights_summary = "Не раскрыты (риск штрафа по ст. 14.8 КоАП)";
           - не выполняй остальные шаги.

        1. zozpp_reference_status — "defined" если прямая ссылка на ЗоЗПП
           есть в тексте («Закон о защите прав потребителей», «ЗоЗПП»),
           иначе "not_defined".
        2. zozpp_reference_details — формулировка ссылки на ЗоЗПП.
           Если отсутствует — "Данные не определены".
        3. right_to_cancel_status — "defined" если право на отказ от договора
           прямо указано (ст. 32 ЗоЗПП), иначе "not_defined".
        4. right_to_cancel_details — формулировка о праве на отказ.
           Если отсутствует — "Данные не определены".
        5. quality_right_status — "defined" если право на качество услуги
           прямо указано (ст. 8-10 ЗоЗПП), иначе "not_defined".
        6. quality_right_details — формулировка о праве на качество.
           Если отсутствует — "Данные не определены".
        7. return_procedure_status — "defined" если порядок возврата/обмена
           для потребителя прямо описан, иначе "not_defined".
        8. return_procedure_details — формулировка о порядке возврата.
           Если отсутствует — "Данные не определены".
        9. rospotrebnadzor_contact_status — "defined" если контакты
           Роспотребнадзора прямо указаны, иначе "not_defined".
        10. rospotrebnadzor_contact_details — формулировка с контактами
            (телефон, сайт). Если отсутствует — "Данные не определены".
        11. consumer_rights_summary — краткий user-friendly вывод:
            - "Права раскрыты полностью" — если все 5 аспектов прямо раскрыты;
            - "Права раскрыты частично" — если раскрыты 2-4 аспекта из 5;
            - "Не раскрыты (риск штрафа по ст. 14.8 КоАП)" — если ни один
              аспект не раскрыт (для юрлиц штраф до 500 000 руб.);
            - "Данные не определены" — если договор не содержит данных
              о сторонах.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - consumer_rights_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни consumer_rights_notification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", consumer_rights_summary = "Не раскрыты (риск штрафа по ст. 14.8 КоАП)".
        - Используй только текст договора. Не подставляй нормы закона (ЗоЗПП)
          вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - zozpp_reference_status = "defined" ТОЛЬКО если в тексте есть прямые
          слова: «Закон о защите прав потребителей», «ЗоЗПП», «законодательство
          о защите прав потребителей».
        - Отсутствие уведомления о правах потребителя не делает договор
          недействительным, но создаёт риск штрафа по ст. 14.8 КоАП РФ.
        - В договорах проката права потребителя часто не прописываются явно —
          это распространённая практика, но не соответствует требованиям ЗоЗПП.
        - Если фрагмент контекста не содержит данных о ЗоЗПП, правах потребителя,
          Роспотребнадзоре — игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в преамбуле, разделе «Общие положения» или «Заключительные положения».
        - Информация о правах потребителя обычно в начале или конце договора.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ссылки на ЗоЗПП, ни информации о праве на отказ,
           ни права на качество, ни порядка возврата, ни контактов
           Роспотребнадзора (типичная ситуация для потребительского проката).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             consumer_rights_summary = "Не раскрыты (риск штрафа по ст. 14.8 КоАП)".

        2. Неполное раскрытие темы.
           Указана только ссылка на ЗоЗПП, но без информации о конкретных
           правах потребителя, порядке возврата и контактах Роспотребнадзора.
           → presence = "present";
             zozpp_reference_status = "defined";
             остальные статусы = "not_defined";
             consumer_rights_summary = "Права раскрыты частично".

        3. Противоречие между фрагментами.
           В одном пункте указано, что договор регулируется ЗоЗПП, в другом —
           что ЗоЗПП не применяется к настоящим отношениям; конфликт нельзя
           снять по тексту.
           → presence = "unclear";
             zozpp_reference_status = "not_defined";
             zozpp_reference_details = "Не удалось определить";
             consumer_rights_summary = "Данные не определены".

        4. Специфика темы: полное информирование потребителя.
           В тексте раскрыты все ключевые аспекты: ссылка на ЗоЗПП, право
           на отказ со ссылкой на ст. 32 ЗоЗПП, порядок действий при
           ненадлежащем качестве, порядок возврата, контакты Роспотребнадзора.
           → presence = "present";
             zozpp_reference_status = "defined";
             right_to_cancel_status = "defined";
             quality_right_status = "defined";
             return_procedure_status = "defined";
             rospotrebnadzor_contact_status = "defined";
             consumer_rights_summary = "Права раскрыты полностью".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для consumer_rights_notification_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для consumer_rights_summary используй только: "Права раскрыты полностью",
          "Права раскрыты частично", "Не раскрыты (риск штрафа по ст. 14.8 КоАП)"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * zozpp_reference_details → "Данные не определены";
          * right_to_cancel_details → "Данные не определены";
          * quality_right_details → "Данные не определены";
          * return_procedure_details → "Данные не определены";
          * rospotrebnadzor_contact_details → "Данные не определены";
          * consumer_rights_summary → "Не раскрыты (риск штрафа по ст. 14.8 КоАП)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * consumer_rights_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "consumer_rights_notification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по информированию потребителя о его правах по ЗоЗПП. Внутреннее агрегатное signal-поле."
          required: true

        - name: "zozpp_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на ЗоЗПП."
          required: true

        - name: "zozpp_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ссылка на Закон о защите прав потребителей"
          description: "Формулировка ссылки на ЗоЗПП (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "right_to_cancel_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на отказ."
          required: true

        - name: "right_to_cancel_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Право на отказ от договора"
          description: "Формулировка о праве на отказ (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "quality_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на качество."
          required: true

        - name: "quality_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Права при ненадлежащем качестве"
          description: "Формулировка о праве на качество (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возврата."
          required: true

        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок возврата имущества"
          description: "Формулировка о порядке возврата (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "rospotrebnadzor_contact_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус контактов Роспотребнадзора."
          required: true

        - name: "rospotrebnadzor_contact_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Контакты Роспотребнадзора"
          description: "Формулировка с контактами Роспотребнадзора (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "consumer_rights_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Права потребителя (ЗоЗПП)"
          description: "Компактный статус информирования арендатора-потребителя о правах по ЗоЗПП."
          required: false
      store_payload: true

  - id: dangerous_item_and_source_of_increased_danger_check
    name: "Опасный предмет проката, источник повышенной опасности и допуск к использованию"
    description: >
      Фактографическая проверка условий эксплуатации опасных предметов проката
      (транспортные средства, самокаты, спортинвентарь): право управления,
      возрастные ограничения, обязательное страхование (ОСАГО), ответственность
      за вред третьим лицам, ограничения эксплуатации и экстренные процедуры.
    triggers:
      any: ["dangerous_item_as_subject", "vehicle_as_subject"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "источник повышенной опасности"
        - "право управления"
        - "водительское удостоверение"
        - "ОСАГО"
        - "страхование гражданской ответственности"
        - "вред третьим лицам"
        - "категория транспортного средства"
        - "ограничения эксплуатации"
        - "запрет эксплуатации"
        - "трезвость"
        - "возрастные ограничения"
        - "экстренные службы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)источник.*повышенн[а-я]+\\s+опасност"
        - "(?i)водительск[а-я]+\\s+удостоверени"
        - "(?i)ОСАГО|ОСГОП"
        - "(?i)вред\\s+третьим\\s+лиц"
        - "(?i)категори[яи]\\s+[A-DM]"
        - "(?i)трезв|состояни[ея]\\s+опьянени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631),
        предметом которого является опасный объект (транспортное средство,
        электросамокат, спортинвентарь).
        Проверяется только один вопрос: урегулирован ли в тексте допуск
        арендатора к использованию и связанные с этим риски.

        Нормативный ориентир:
        - ст. 1079 ГК РФ — ответственность за вред, причинённый источником
          повышенной опасности
        - ст. 25 ФЗ-196 «О безопасности дорожного движения» — право управления ТС
        - ФЗ-40 «Об ОСАГО» — обязательное страхование гражданской ответственности
          владельцев ТС
        - ст. 26, 28 ГК РФ — дееспособность несовершеннолетних

        Важно:
        - Не оценивай серьёзность риска и не давай правовых выводов о том,
          кто именно несёт ответственность за вред третьим лицам.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - Если предмет проката не является опасным (например, книгу или
          палатку сдают в прокат), то это не предмет данного check-а —
          сработает presence_signal = "missing" или значения по умолчанию.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли предмет как опасный объект / источник повышенной опасности.
        2. Есть ли требование о наличии права управления (для ТС).
        3. Есть ли требование обязательного страхования (ОСАГО для ТС, иное).
        4. Есть ли указание на возрастные ограничения для использования.
        5. Есть ли указание на ограничения эксплуатации (время, погода,
           территория, трезвость, число пассажиров).
        6. Есть ли ответственность за вред третьим лицам.
        7. Есть ли процедура действий при причинении вреда третьим лицам
           (вызов ГИБДД, скорой, уведомление страховой).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — каршеринг с полным регулированием:
        Фрагмент:
        "Арендатор подтверждает наличие водительского удостоверения категории B
        со стажем не менее 3 лет. Возраст Арендатора — не менее 25 лет.
        Автомобиль застрахован по ОСАГО и КАСКО. Арендатор несёт ответственность
        за вред третьим лицам в пределах, установленных ОСАГО. Эксплуатация
        в состоянии опьянения запрещена. При ДТП Арендатор обязан вызвать ГИБДД
        и уведомить Арендодателя в течение 30 минут."

        Ответ:
        {
          "dangerous_item_status": "defined",
          "dangerous_item_details": "автомобиль как источник повышенной опасности",
          "driver_license_status": "defined",
          "driver_license_details": "водительское удостоверение категории B со стажем не менее 3 лет",
          "mandatory_insurance_status": "defined",
          "mandatory_insurance_details": "автомобиль застрахован по ОСАГО и КАСКО",
          "age_restriction_status": "defined",
          "age_restriction_details": "возраст Арендатора — не менее 25 лет",
          "usage_restrictions_status": "defined",
          "usage_restrictions_details": "эксплуатация в состоянии опьянения запрещена",
          "third_party_liability_status": "defined",
          "third_party_liability_details": "Арендатор несёт ответственность за вред третьим лицам в пределах, установленных ОСАГО",
          "emergency_procedure_status": "defined",
          "emergency_procedure_details": "при ДТП вызвать ГИБДД и уведомить Арендодателя в течение 30 минут",
          "dangerous_item_summary": "Полностью урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Арендатор подтверждает наличие водительского удостоверения категории B со стажем не менее 3 лет. Возраст Арендатора — не менее 25 лет."
            }
          ]
        }

        Пример 2 — опасный предмет без регулирования (типично для бытового проката):
        Фрагмент:
        "Арендодатель передаёт Арендатору электросамокат во временное пользование."

        Ответ:
        {
          "dangerous_item_status": "not_defined",
          "dangerous_item_details": "Данные не определены",
          "driver_license_status": "not_defined",
          "driver_license_details": "Данные не определены",
          "mandatory_insurance_status": "not_defined",
          "mandatory_insurance_details": "Данные не определены",
          "age_restriction_status": "not_defined",
          "age_restriction_details": "Данные не определены",
          "usage_restrictions_status": "not_defined",
          "usage_restrictions_details": "Данные не определены",
          "third_party_liability_status": "not_defined",
          "third_party_liability_details": "Данные не определены",
          "emergency_procedure_status": "not_defined",
          "emergency_procedure_details": "Данные не определены",
          "dangerous_item_summary": "Не урегулировано (риски допуска и вреда третьим лицам)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о виде предмета / его опасности.
        2. Найди прямую цитату о праве управления.
        3. Найди прямую цитату об обязательном страховании.
        4. Найди прямую цитату о возрастных ограничениях.
        5. Найди прямую цитату об ограничениях эксплуатации.
        6. Найди прямую цитату об ответственности за вред третьим лицам.
        7. Найди прямую цитату об экстренных процедурах.
        8. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "dangerous_item_status": "<defined / not_defined>",
          "dangerous_item_details": "<текст или 'Данные не определены'>",
          "driver_license_status": "<defined / not_defined>",
          "driver_license_details": "<текст или 'Данные не определены'>",
          "mandatory_insurance_status": "<defined / not_defined>",
          "mandatory_insurance_details": "<текст или 'Данные не определены'>",
          "age_restriction_status": "<defined / not_defined>",
          "age_restriction_details": "<текст или 'Данные не определены'>",
          "usage_restrictions_status": "<defined / not_defined>",
          "usage_restrictions_details": "<текст или 'Данные не определены'>",
          "third_party_liability_status": "<defined / not_defined>",
          "third_party_liability_details": "<текст или 'Данные не определены'>",
          "emergency_procedure_status": "<defined / not_defined>",
          "emergency_procedure_details": "<текст или 'Данные не определены'>",
          "dangerous_item_summary": "<'Полностью урегулировано' / 'Частично урегулировано' / 'Не урегулировано (риски допуска и вреда третьим лицам)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "источник повышенной опасности право управления водительское удостоверение ОСАГО страхование гражданской ответственности вред третьим лицам категория транспортного средства ограничения эксплуатации трезвость возрастные ограничения экстренные службы ГИБДД скорая"
      retrieval_profile: "dangerous_item_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - representations
      negative_keywords:
        - "арендная плата"
        - "предмет проката недвижимость"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "возврат"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "dangerous_item_and_source_of_increased_danger_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия,
        касающиеся опасного предмета / источника повышенной опасности: право
        управления, обязательное страхование, возрастные ограничения,
        ограничения эксплуатации, ответственность за вред третьим лицам,
        экстренные процедуры.
        Не анализируй арендную плату, ремонт, субаренду или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dangerous_item_and_source_of_increased_danger_check_presence:
           Агрегатное signal-поле — наличие регулирования по опасному предмету
           и допуску к использованию.
           - "present" — если хотя бы одно из содержательных полей
             (dangerous_item_status, driver_license_status,
              mandatory_insurance_status, age_restriction_status,
              usage_restrictions_status, third_party_liability_status,
              emergency_procedure_status) = "defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - dangerous_item_status = "not_defined";
           - dangerous_item_details = "Данные не определены";
           - driver_license_status = "not_defined";
           - driver_license_details = "Данные не определены";
           - mandatory_insurance_status = "not_defined";
           - mandatory_insurance_details = "Данные не определены";
           - age_restriction_status = "not_defined";
           - age_restriction_details = "Данные не определены";
           - usage_restrictions_status = "not_defined";
           - usage_restrictions_details = "Данные не определены";
           - third_party_liability_status = "not_defined";
           - third_party_liability_details = "Данные не определены";
           - emergency_procedure_status = "not_defined";
           - emergency_procedure_details = "Данные не определены";
           - dangerous_item_summary = "Не урегулировано (риски допуска и вреда третьим лицам)";
           - не выполняй остальные шаги.

        1. dangerous_item_status — "defined" если предмет проката прямо
           охарактеризован как опасный объект / источник повышенной опасности
           (транспортное средство, самокат, спортинвентарь и т.п.), иначе
           "not_defined".
        2. dangerous_item_details — формулировка о характере опасного предмета.
           Если отсутствует — "Данные не определены".
        3. driver_license_status — "defined" если требование о наличии права
           управления (водительского удостоверения) прямо указано, иначе
           "not_defined".
        4. driver_license_details — формулировка о праве управления (категория,
           стаж). Если отсутствует — "Данные не определены".
        5. mandatory_insurance_status — "defined" если обязательное страхование
           (ОСАГО, ОСГОП или иное) прямо указано, иначе "not_defined".
        6. mandatory_insurance_details — формулировка о страховании.
           Если отсутствует — "Данные не определены".
        7. age_restriction_status — "defined" если возрастные ограничения
           для использования предмета прямо указаны, иначе "not_defined".
        8. age_restriction_details — формулировка о возрастном ограничении.
           Если отсутствует — "Данные не определены".
        9. usage_restrictions_status — "defined" если ограничения эксплуатации
           (время, погода, территория, трезвость, число пассажиров) прямо
           указаны, иначе "not_defined".
        10. usage_restrictions_details — формулировка об ограничениях
            эксплуатации. Если отсутствует — "Данные не определены".
        11. third_party_liability_status — "defined" если ответственность
            за вред третьим лицам прямо указана, иначе "not_defined".
        12. third_party_liability_details — формулировка об ответственности
            за вред третьим лицам. Если отсутствует — "Данные не определены".
        13. emergency_procedure_status — "defined" если процедура действий
            при причинении вреда третьим лицам (вызов ГИБДД, скорой,
            уведомление страховой/арендодателя) прямо указана, иначе
            "not_defined".
        14. emergency_procedure_details — формулировка о процедуре.
            Если отсутствует — "Данные не определены".
        15. dangerous_item_summary — краткий user-friendly вывод:
            - "Полностью урегулировано" — если раскрыты все ключевые аспекты
              (допуск + страхование + ограничения + экстренные процедуры);
            - "Частично урегулировано" — если раскрыто 2-4 аспекта из 5;
            - "Не урегулировано (риски допуска и вреда третьим лицам)" — если
              ни один аспект не раскрыт;
            - "Данные не определены" — если договор не содержит данных
              о предмете.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - dangerous_item_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни dangerous_item_and_source_of_increased_danger_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", dangerous_item_summary = "Не урегулировано (риски допуска и вреда третьим лицам)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 1079
          ГК РФ, ФЗ-40) вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - dangerous_item_status = "defined" ТОЛЬКО если в тексте есть прямая
          характеристика предмета как опасного (ТС, самокат, спортинвентарь).
        - Если предмет проката — бытовой (книга, палатка, коляска), тема
          не является предметом данного check-а — оставляй все статусы
          в "not_defined".
        - Если фрагмент контекста не содержит данных об опасном предмете,
          допуске, страховании, ограничениях или экстренных процедурах —
          игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Требования к Арендатору», «Эксплуатация предмета» или
          «Ответственность».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни характеристики предмета как опасного, ни требований
           к допуску арендатора, ни страхования, ни ограничений эксплуатации,
           ни экстренных процедур (типично для бытового проката).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             dangerous_item_summary = "Не урегулировано (риски допуска и вреда третьим лицам)".

        2. Неполное раскрытие темы.
           Предмет обозначен как транспортное средство, но без требований
           к водительскому удостоверению, страхованию и ограничениям
           эксплуатации.
           → presence = "present";
             dangerous_item_status = "defined";
             driver_license_status = "not_defined";
             mandatory_insurance_status = "not_defined";
             dangerous_item_summary = "Частично урегулировано".

        3. Противоречие между фрагментами.
           В одном пункте указано, что арендатор должен иметь водительское
           удостоверение, в другом — что управление допускается без него,
           и конфликт нельзя снять по тексту.
           → presence = "unclear";
             driver_license_status = "not_defined";
             driver_license_details = "Не удалось определить";
             dangerous_item_summary = "Данные не определены".

        4. Специфика темы: red flag — опасный предмет без урегулирования допуска.
           Предмет проката — транспортное средство (автомобиль, скутер,
           электросамокат), но в тексте нет ни требования о водительском
           удостоверении, ни страхования, ни ограничений по трезвости
           или возрасту.
           → presence = "present";
             dangerous_item_status = "defined";
             dangerous_item_details = точная формулировка из текста;
             driver_license_status = "not_defined";
             mandatory_insurance_status = "not_defined";
             dangerous_item_summary = "Не урегулировано (риски допуска и вреда третьим лицам)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dangerous_item_and_source_of_increased_danger_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для dangerous_item_summary используй только: "Полностью урегулировано",
          "Частично урегулировано", "Не урегулировано (риски допуска и вреда третьим лицам)"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * dangerous_item_details → "Данные не определены";
          * driver_license_details → "Данные не определены";
          * mandatory_insurance_details → "Данные не определены";
          * age_restriction_details → "Данные не определены";
          * usage_restrictions_details → "Данные не определены";
          * third_party_liability_details → "Данные не определены";
          * emergency_procedure_details → "Данные не определены";
          * dangerous_item_summary → "Не урегулировано (риски допуска и вреда третьим лицам)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * dangerous_item_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dangerous_item_and_source_of_increased_danger_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по опасному предмету и допуску к использованию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dangerous_item_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус характеристики предмета как опасного / источника повышенной опасности."
          required: true

        - name: "dangerous_item_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Опасный предмет"
          description: "Формулировка об опасном характере предмета проката."
          required: false

        - name: "driver_license_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования о водительском удостоверении."
          required: true

        - name: "driver_license_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Право управления"
          description: "Формулировка о требовании водительского удостоверения (категория, стаж)."
          required: false

        - name: "mandatory_insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязательного страхования (ОСАГО, ОСГОП, иное)."
          required: true

        - name: "mandatory_insurance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Обязательное страхование"
          description: "Формулировка об обязательном страховании."
          required: false

        - name: "age_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус возрастных ограничений."
          required: true

        - name: "age_restriction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Возрастные ограничения"
          description: "Формулировка о возрастном ограничении для использования предмета."
          required: false

        - name: "usage_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений эксплуатации."
          required: true

        - name: "usage_restrictions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Ограничения эксплуатации"
          description: "Формулировка об ограничениях эксплуатации (время, погода, территория, трезвость, число пассажиров)."
          required: false

        - name: "third_party_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за вред третьим лицам."
          required: true

        - name: "third_party_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Ответственность за вред третьим лицам"
          description: "Формулировка об ответственности за вред третьим лицам."
          required: false

        - name: "emergency_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус экстренных процедур при причинении вреда."
          required: true

        - name: "emergency_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Экстренные процедуры"
          description: "Формулировка об экстренных процедурах (ГИБДД, скорая, страховая) (скрыта из Grid, доступна в drawer)."
          required: false

        - name: "dangerous_item_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Опасный предмет: допуск и риски"
          description: "Компактный статус регулирования опасного предмета проката."
          required: false
      store_payload: true

  - id: condition_fixation_and_evidence_check
    name: "Фиксация состояния предмета проката при выдаче и возврате (фото/видео, доказательства)"
    description: >
      Фактографическая проверка наличия в тексте процедуры фиксации состояния
      предмета при выдаче и возврате: фото-/видеосъёмка, обязательный акт
      с подписями, процедура фиксации расхождений, привязка доказательств
      к дате/времени/акту.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "фотофиксация"
        - "видеофиксация"
        - "фотографии при выдаче"
        - "фото при возврате"
        - "акт приёма-передачи"
        - "акт возврата"
        - "фиксация повреждений"
        - "процедура фиксации расхождений"
        - "чек-лист состояния"
        - "осмотр при выдаче"
        - "осмотр при возврате"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)фото(фиксац|съ[её]мк)|видео(фиксац|съ[её]мк)"
        - "(?i)фото(графи|снимк)"
        - "(?i)фиксаци[яю].*состояни"
        - "(?i)акт.*(выдач|возврат|при[её]ма-передачи|осмотра)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор проката по §2 Главы 34 ГК РФ (ст. 626–631).
        Проверяется только один вопрос: как в тексте урегулирована фиксация
        состояния предмета проката при выдаче и при возврате — с точки зрения
        доказательственной базы для последующих споров о повреждениях.

        Нормативный ориентир:
        - ст. 622 ГК РФ — возврат имущества в состоянии с учётом нормального износа
        - ст. 56 ГПК РФ — каждая сторона доказывает обстоятельства, на которые ссылается
        - ст. 628 ГК РФ — проверка исправности при выдаче

        Важно:
        - Не оценивай серьёзность риска и не давай правовых выводов
          о распределении бремени доказывания.
        - Устанавливай только то, что прямо есть в тексте договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не путай этот check с проверкой исправности при выдаче
          (fitness_and_instruction_check) и с порядком возврата имущества
          (return_procedure_and_condition_check). Здесь речь именно о способе
          фиксации состояния (фото, видео, акт с подписями, чек-лист).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о фото-/видеофиксации состояния при выдаче.
        2. Есть ли условие о фото-/видеофиксации состояния при возврате.
        3. Есть ли обязательность подписания двустороннего акта с описанием
           состояния.
        4. Есть ли процедура фиксации расхождений (что делать, если
           повреждения обнаружены при возврате).
        5. Есть ли указание на привязку доказательств к дате/времени/номеру
           акта или заказа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай статус "not_defined".
        4. Для текстовых полей (*_details, *_display) не используй "None", "null"
           или пустые строки — возвращай "Данные не определены".
        5. Для статусов допустимо значение "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — доказательственная фиксация урегулирована:
        Фрагмент:
        "При выдаче предмета проката Арендодатель делает фотографии в присутствии
        Арендатора. Фотографии прилагаются к акту приёма-передачи и подписываются
        обеими Сторонами. При возврате фотографии делаются повторно в присутствии
        Сторон. Если при возврате обнаружены повреждения, они описываются
        в акте возврата с указанием характера, объёма и причины. Фото и акт
        хранятся у Арендодателя не менее 1 года."

        Ответ:
        {
          "issue_photo_status": "defined",
          "issue_photo_details": "при выдаче делаются фотографии в присутствии Арендатора",
          "return_photo_status": "defined",
          "return_photo_details": "при возврате фотографии делаются повторно в присутствии Сторон",
          "bilateral_act_status": "defined",
          "bilateral_act_details": "фотографии прилагаются к акту приёма-передачи и подписываются обеими Сторонами",
          "discrepancy_procedure_status": "defined",
          "discrepancy_procedure_details": "при обнаружении повреждений они описываются в акте возврата с указанием характера, объёма и причины",
          "evidence_binding_status": "defined",
          "evidence_binding_details": "фото и акт хранятся у Арендодателя не менее 1 года",
          "condition_fixation_summary": "Полностью урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "При выдаче предмета проката Арендодатель делает фотографии в присутствии Арендатора. Фотографии прилагаются к акту приёма-передачи и подписываются обеими Сторонами."
            }
          ]
        }

        Пример 2 — доказательственная фиксация отсутствует:
        Фрагмент:
        "Арендатор получает имущество и возвращает его по окончании срока."

        Ответ:
        {
          "issue_photo_status": "not_defined",
          "issue_photo_details": "Данные не определены",
          "return_photo_status": "not_defined",
          "return_photo_details": "Данные не определены",
          "bilateral_act_status": "not_defined",
          "bilateral_act_details": "Данные не определены",
          "discrepancy_procedure_status": "not_defined",
          "discrepancy_procedure_details": "Данные не определены",
          "evidence_binding_status": "not_defined",
          "evidence_binding_details": "Данные не определены",
          "condition_fixation_summary": "Не урегулировано (риск споров о повреждениях)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о фото-/видеофиксации при выдаче.
        2. Найди прямую цитату о фото-/видеофиксации при возврате.
        3. Найди прямую цитату о двустороннем акте.
        4. Найди прямую цитату о процедуре фиксации расхождений.
        5. Найди прямую цитату о привязке доказательств к дате/номеру/акту.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "issue_photo_status": "<defined / not_defined>",
          "issue_photo_details": "<текст или 'Данные не определены'>",
          "return_photo_status": "<defined / not_defined>",
          "return_photo_details": "<текст или 'Данные не определены'>",
          "bilateral_act_status": "<defined / not_defined>",
          "bilateral_act_details": "<текст или 'Данные не определены'>",
          "discrepancy_procedure_status": "<defined / not_defined>",
          "discrepancy_procedure_details": "<текст или 'Данные не определены'>",
          "evidence_binding_status": "<defined / not_defined>",
          "evidence_binding_details": "<текст или 'Данные не определены'>",
          "condition_fixation_summary": "<'Полностью урегулировано' / 'Частично урегулировано' / 'Не урегулировано (риск споров о повреждениях)' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "фотофиксация видеофиксация фотографии при выдаче при возврате акт приёма-передачи фиксация повреждений процедура фиксации расхождений чек-лист состояния осмотр при выдаче осмотр при возврате"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - procedures
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "арендная плата"
        - "предмет проката недвижимость"
        - "ремонт"
        - "субаренда"
        - "депозит"
        - "публичный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "condition_fixation_and_evidence_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора проката условия
        о фиксации состояния предмета при выдаче и при возврате: фото-/видео,
        двусторонний акт, процедура фиксации расхождений, привязка доказательств
        к дате/номеру акта.
        Не анализируй арендную плату, ремонт, субаренду или депозит.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. condition_fixation_and_evidence_check_presence:
           Агрегатное signal-поле — наличие регулирования по фиксации состояния
           предмета проката.
           - "present" — если хотя бы одно из содержательных полей
             (issue_photo_status, return_photo_status, bilateral_act_status,
              discrepancy_procedure_status, evidence_binding_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - issue_photo_status = "not_defined";
           - issue_photo_details = "Данные не определены";
           - return_photo_status = "not_defined";
           - return_photo_details = "Данные не определены";
           - bilateral_act_status = "not_defined";
           - bilateral_act_details = "Данные не определены";
           - discrepancy_procedure_status = "not_defined";
           - discrepancy_procedure_details = "Данные не определены";
           - evidence_binding_status = "not_defined";
           - evidence_binding_details = "Данные не определены";
           - condition_fixation_summary = "Не урегулировано (риск споров о повреждениях)";
           - не выполняй остальные шаги.

        1. issue_photo_status — "defined" если фото-/видеофиксация при выдаче
           прямо предусмотрена, иначе "not_defined".
        2. issue_photo_details — формулировка о фото-/видеофиксации при выдаче.
           Если отсутствует — "Данные не определены".
        3. return_photo_status — "defined" если фото-/видеофиксация при возврате
           прямо предусмотрена, иначе "not_defined".
        4. return_photo_details — формулировка о фото-/видеофиксации при возврате.
           Если отсутствует — "Данные не определены".
        5. bilateral_act_status — "defined" если двусторонний акт с описанием
           состояния прямо предусмотрен, иначе "not_defined".
        6. bilateral_act_details — формулировка о двустороннем акте.
           Если отсутствует — "Данные не определены".
        7. discrepancy_procedure_status — "defined" если процедура фиксации
           расхождений (что делать при обнаружении повреждений) прямо описана,
           иначе "not_defined".
        8. discrepancy_procedure_details — формулировка о процедуре фиксации
           расхождений. Если отсутствует — "Данные не определены".
        9. evidence_binding_status — "defined" если указана привязка
           доказательств к дате/времени/номеру акта или заказа, иначе
           "not_defined".
        10. evidence_binding_details — формулировка о привязке доказательств.
            Если отсутствует — "Данные не определены".
        11. condition_fixation_summary — краткий user-friendly вывод:
            - "Полностью урегулировано" — если раскрыты все ключевые аспекты
              (фото при выдаче + фото при возврате + двусторонний акт +
              процедура расхождений);
            - "Частично урегулировано" — если раскрыто 2-3 аспекта из 4;
            - "Не урегулировано (риск споров о повреждениях)" — если ни один
              аспект не раскрыт;
            - "Данные не определены" — если договор не содержит данных
              о предмете.

        Плюс поле evidence — массив цитат из договора с указанием пункта.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус = "not_defined";
        - соответствующее текстовое поле = "Не удалось определить";
        - condition_fixation_summary = "Данные не определены".

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни condition_fixation_and_evidence_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = "Данные не определены", condition_fixation_summary = "Не урегулировано (риск споров о повреждениях)".
        - Используй только текст договора. Не подставляй нормы закона (ст. 622 ГК РФ,
          ст. 56 ГПК РФ) вместо текста документа.
        - Не оценивай риски, не давай юридических выводов.
        - Не путай этот check с проверкой исправности при выдаче
          (fitness_and_instruction_check) и с порядком возврата имущества
          (return_procedure_and_condition_check). Здесь речь именно о способе
          фиксации состояния (фото, видео, акт с подписями).
        - Если фрагмент контекста не содержит данных о фиксации состояния,
          фото-/видеосъёмке, двустороннем акте или процедуре расхождений —
          игнорируй его.
        - Если фрагменты противоречат друг другу — используй тот, что находится
          в разделе «Порядок передачи», «Порядок возврата» или «Фиксация
          состояния».
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни фото-/видеофиксации, ни двустороннего акта,
           ни процедуры фиксации расхождений, ни привязки доказательств.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = "Данные не определены";
             condition_fixation_summary = "Не урегулировано (риск споров о повреждениях)".

        2. Неполное раскрытие темы.
           Указан двусторонний акт при выдаче, но без фотофиксации,
           без фотофиксации при возврате и без процедуры фиксации расхождений.
           → presence = "present";
             bilateral_act_status = "defined";
             issue_photo_status = "not_defined";
             return_photo_status = "not_defined";
             condition_fixation_summary = "Частично урегулировано".

        3. Противоречие между фрагментами.
           В одном пункте указано, что фотографии делаются в присутствии
           Арендатора, в другом — что Арендодатель фотографирует
           самостоятельно; конфликт нельзя снять по тексту.
           → presence = "unclear";
             issue_photo_status = "not_defined";
             issue_photo_details = "Не удалось определить";
             condition_fixation_summary = "Данные не определены".

        4. Специфика темы: red flag — отсутствие фиксации состояния.
           В договоре есть порядок возврата и удержания из депозита, но нет
           ни слова о фото-/видеофиксации, ни о двустороннем акте состояния —
           риск необоснованных удержаний и невозможности доказывания.
           → presence = "missing";
             все статусы = "not_defined";
             condition_fixation_summary = "Не урегулировано (риск споров о повреждениях)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для condition_fixation_and_evidence_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Для condition_fixation_summary используй только: "Полностью урегулировано",
          "Частично урегулировано", "Не урегулировано (риск споров о повреждениях)"
          или "Данные не определены".
        - Fallback при отсутствии данных:
          * issue_photo_details → "Данные не определены";
          * return_photo_details → "Данные не определены";
          * bilateral_act_details → "Данные не определены";
          * discrepancy_procedure_details → "Данные не определены";
          * evidence_binding_details → "Данные не определены";
          * condition_fixation_summary → "Не урегулировано (риск споров о повреждениях)".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * condition_fixation_summary → "Данные не определены".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "condition_fixation_and_evidence_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по фиксации состояния предмета проката при выдаче и возврате. Внутреннее агрегатное signal-поле."
          required: true

        - name: "issue_photo_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус фото-/видеофиксации при выдаче."
          required: true

        - name: "issue_photo_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Фиксация при выдаче"
          description: "Формулировка о фото-/видеофиксации состояния при выдаче предмета."
          required: false

        - name: "return_photo_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус фото-/видеофиксации при возврате."
          required: true

        - name: "return_photo_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Фиксация при возврате"
          description: "Формулировка о фото-/видеофиксации состояния при возврате предмета."
          required: false

        - name: "bilateral_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус двустороннего акта с описанием состояния."
          required: true

        - name: "bilateral_act_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Двусторонний акт"
          description: "Формулировка о двустороннем акте с описанием состояния предмета."
          required: false

        - name: "discrepancy_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус процедуры фиксации расхождений."
          required: true

        - name: "discrepancy_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Процедура фиксации расхождений"
          description: "Формулировка о процедуре фиксации расхождений (характер, объём, причина повреждений)."
          required: false

        - name: "evidence_binding_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
