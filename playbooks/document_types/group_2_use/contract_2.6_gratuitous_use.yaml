  - id: "gratuitous_between_commercial_orgs_donation_risk"
    name: "Риск переквалификации в дарение между коммерческими организациями (ст. 575 п. 4 ГК РФ)"
    description: |
      Безвозмездное пользование между двумя коммерческими организациями
      без экономического обоснования может быть оспорено как притворная сделка,
      прикрывающая дарение (ст. 170 ГК РФ). Дарение между коммерческими
      организациями запрещено (ст. 575 п. 4 ГК РФ). Налоговые органы
      квалифицируют такие сделки как способ получения необоснованной
      налоговой выгоды (ст. 54.1 НК РФ).
    legal_base: "ст. 575 п. 4, ст. 170 ГК РФ; ст. 54.1 НК РФ"
    required_triggers: ["corporate_lender", "corporate_borrower"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ООО"
        - "АО"
        - "ПАО"
        - "коммерческая организация"
        - "безвозмездно"
        - "бесплатно"
      keyword_mode: "any"
      negative_keywords:
        - "деловая цель"
        - "экономическое обоснование"
        - "связано с хозяйственной деятельностью"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ссудодатель"
        - "ссудополучатель"
        - "коммерческая организация"
        - "экономическое обоснование"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: loan_subject_identification
    name: "Идентификация предмета ссуды (ст. 689, 607 ГК РФ)"
    description: "Извлекает данные об имуществе, передаваемом в безвозмездное пользование"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет ссуды"
        - "передаётся в пользование"
        - "имущество"
        - "вещь"
        - "оборудование"
        - "транспортное средство"
        - "помещение"
        - "индивидуальные признаки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передаётся.*в.*безвозмездное.*пользование"
        - "(?i)предмет.*ссуды"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Найди данные о предмете ссуды — имуществе, передаваемом в пользование.

        Ответь строго в JSON:
        {
          "asset_type": "<equipment / vehicle / real_estate / other / not_found>",
          "asset_name": "<наименование или not_found>",
          "unique_identifiers": "<серийный номер, VIN, кадастровый номер и т.п. или not_found>",
          "technical_condition": "<описание состояния или not_found>",
          "accessories_included": "<комплектация, принадлежности или not_found>",
          "estimated_value": "<оценочная стоимость или not_found>"
        }

        ВАЖНО: Предмет должен быть индивидуально-определённым. Если описание размыто — укажи это.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет"
        - "имущество"
        - "передаётся"
        - "оборудование"
        - "транспорт"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "asset_type"
          type: "string"
          allowed_values: ["equipment", "vehicle", "real_estate", "other", "not_found"]
          description: "Тип имущества"
        - name: "asset_name"
          type: "string"
          keyword_hints: ["наименование", "марка", "модель"]
          description: "Наименование имущества"
        - name: "unique_identifiers"
          type: "string"
          keyword_hints: ["серийный номер", "VIN", "кадастровый номер", "инвентарный"]
          description: "Уникальные идентификаторы"
      store_payload: true

  - id: gratuitous_nature_verification
    name: "Подтверждение безвозмездного характера (ст. 689 ГК РФ)"
    description: "Проверяет явное указание на отсутствие платы за пользование"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "безвозмездно"
        - "бесплатно"
        - "без взимания платы"
        - "плата не взимается"
        - "без оплаты"
        - "безвозмездное пользование"
      keyword_mode: "any"
      negative_keywords:
        - "арендная плата"
        - "ежемесячный платёж"
        - "плата за пользование составляет"
      regex_patterns:
        - "(?i)безвозмездн.*пользован"
        - "(?i)плата.*не.*взимается"
        - "(?i)бесплатн.*пользован"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь, является ли договор действительно БЕЗВОЗМЕЗДНЫМ.

        КРИТЕРИИ:
        - Должно быть ЯВНОЕ указание на отсутствие платы
        - НЕ должно быть никаких платежей за пользование (даже скрытых)
        - Расходы на содержание/ремонт — это НЕ плата за пользование

        Ответь строго в JSON:
        {
          "gratuitous_declared": "<yes / no / unclear>",
          "gratuitous_snippet": "<цитата о безвозмездности или not_found>",
          "payment_clauses_found": "<yes / no>",
          "payment_description": "<описание платежей, если есть, или not_found>",
          "hidden_payment_risk": "<yes / no / unclear>"
        }

        Если обнаружены платежи за пользование — это НЕ ссуда, а аренда.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "безвозмездно"
        - "бесплатно"
        - "плата"
        - "оплата"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "gratuitous_declared"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Указана ли безвозмездность явно"
        - name: "payment_clauses_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Обнаружены ли условия о плате"
      store_payload: true

  - id: loan_term_analysis
    name: "Срок безвозмездного пользования (ст. 610, 692, 699 ГК РФ)"
    description: "Определяет срок договора и последствия для сторон"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок"
        - "на период"
        - "до"
        - "по"
        - "бессрочный"
        - "неопределённый срок"
        - "месяцев"
        - "лет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)на\\s+срок\\s+(\\d+)\\s*(месяц|год|лет)"
        - "(?i)с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}.*по\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)на\\s+неопределённый\\s+срок"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Определи срок договора.

        ВАЖНО по ГК РФ:
        - Если срок НЕ указан — договор бессрочный
        - При бессрочном договоре каждая сторона может отказаться, уведомив за 1 месяц (ст. 699)
        - Для недвижимости — уведомление за 3 месяца

        Ответь строго в JSON:
        {
          "term_specified": "<yes / no>",
          "term_type": "<fixed / indefinite>",
          "start_date": "<дата начала или not_found>",
          "end_date": "<дата окончания или not_found>",
          "term_duration": "<срок в месяцах/годах или not_found>",
          "termination_notice_period": "<срок уведомления о расторжении или not_found>",
          "auto_renewal_clause": "<yes / no / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "срок"
        - "действие"
        - "до"
        - "бессрочный"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "term_type"
          type: "string"
          allowed_values: ["fixed", "indefinite"]
          description: "Тип срока"
        - name: "term_duration"
          type: "string"
          keyword_hints: ["на срок", "месяцев", "лет"]
          description: "Продолжительность срока"
      store_payload: true

  - id: maintenance_expenses_allocation
    name: "Распределение расходов на содержание и ремонт (ст. 695 ГК РФ)"
    description: "Проверяет обязанности по содержанию имущества — критично для ссудодателя"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "текущий ремонт"
        - "капитальный ремонт"
        - "расходы на содержание"
        - "эксплуатационные расходы"
        - "обязанность по ремонту"
        - "поддерживать в исправном состоянии"
        - "несёт ссудополучатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ссудополучатель.*обязан.*содержа"
        - "(?i)расходы.*на.*содержание.*несёт"
        - "(?i)текущ.*и.*капитальн.*ремонт"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь распределение расходов на содержание и ремонт.

        По ст. 695 ГК РФ ссудополучатель обязан нести ВСЕ расходы:
        - текущий ремонт
        - капитальный ремонт
        - содержание имущества

        Ответь строго в JSON:
        {
          "current_repair_payer": "<borrower / lender / not_specified / not_found>",
          "capital_repair_payer": "<borrower / lender / not_specified / not_found>",
          "maintenance_payer": "<borrower / lender / not_specified / not_found>",
          "compliant_with_law": "<yes / no / partially>",
          "deviations_from_law": "<описание отклонений или not_found>"
        }

        По умолчанию (ст. 695 ГК РФ) все расходы несёт ссудополучатель.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "ремонт"
        - "содержание"
        - "расходы"
        - "эксплуатация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "current_repair_payer"
          type: "string"
          allowed_values: ["borrower", "lender", "not_specified", "not_found"]
          description: "Кто несёт расходы на текущий ремонт"
        - name: "capital_repair_payer"
          type: "string"
          allowed_values: ["borrower", "lender", "not_specified", "not_found"]
          description: "Кто несёт расходы на капитальный ремонт"
      store_payload: true

  - id: accidental_loss_risk_analysis
    name: "Распределение риска случайной гибели (ст. 696 ГК РФ)"
    description: "Анализирует распределение риска гибели/повреждения имущества"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "несёт риск"
        - "использование не по назначению"
        - "передача третьим лицам"
        - "гибель имущества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск.*случайн.*гибел"
        - "(?i)риск.*переходит.*на.*ссудополучател"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь распределение риска случайной гибели имущества.

        По ст. 696 ГК РФ:
        - По умолчанию риск несёт ССУДОДАТЕЛЬ (собственник)
        - Риск ПЕРЕХОДИТ на ссудополучателя, если:
          а) вещь использовалась не по назначению
          б) вещь передана третьему лицу без согласия
          в) ссудополучатель мог предотвратить гибель, пожертвовав своей вещью

        Ответь строго в JSON:
        {
          "default_risk_bearer": "<lender / borrower / not_specified>",
          "risk_transfer_conditions_specified": "<yes / no>",
          "risk_transfer_conditions": ["<список условий перехода риска>"],
          "misuse_transfer_clause": "<yes / no / not_found>",
          "third_party_transfer_clause": "<yes / no / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "риск"
        - "гибель"
        - "повреждение"
        - "назначение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "default_risk_bearer"
          type: "string"
          allowed_values: ["lender", "borrower", "not_specified"]
          description: "Кто несёт риск по умолчанию"
        - name: "risk_transfer_conditions_specified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Указаны ли условия перехода риска"
      store_payload: true

  - id: tax_consequences_analysis
    name: "Налоговые последствия для ссудополучателя (ст. 250 НК РФ)"
    description: "Проверяет осведомлённость о налоговых рисках — критично для юрлиц"
    triggers:
      any: ["corporate_borrower"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговые последствия"
        - "внереализационный доход"
        - "рыночная стоимость аренды"
        - "налог на прибыль"
        - "ст. 250 НК РФ"
        - "налоговые риски"
        - "осведомлён о налоговых"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)внереализационн.*доход"
        - "(?i)налог.*на.*прибыль"
        - "(?i)рыночн.*стоимост.*аренд"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь наличие информации о налоговых последствиях.

        КРИТИЧЕСКИЙ РИСК для ссудополучателя-юрлица:
        По п. 8 ст. 250 НК РФ безвозмездное пользование образует ВНЕРЕАЛИЗАЦИОННЫЙ ДОХОД,
        облагаемый налогом на прибыль по РЫНОЧНОЙ СТОИМОСТИ АРЕНДЫ аналогичного имущества.

        Ответь строго в JSON:
        {
          "borrower_is_legal_entity": "<yes / no / unclear>",
          "tax_warning_present": "<yes / no>",
          "tax_warning_snippet": "<цитата о налогах или not_found>",
          "market_rent_value_mentioned": "<yes / no>",
          "tax_calculation_method": "<описание метода или not_found>",
          "tax_risk_acknowledged": "<yes / no / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "налог"
        - "внереализационный"
        - "доход"
        - "рыночная стоимость"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "tax_warning_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Есть ли предупреждение о налогах"
        - name: "tax_risk_acknowledged"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Признаны ли налоговые риски"
      store_payload: true

  - id: related_parties_analysis
    name: "Аффилированность сторон и риски (ст. 690 п.2 ГК, ст. 54.1 НК)"
    description: "Проверяет взаимозависимость сторон и связанные риски"
    triggers:
      any: ["related_parties", "founder_director_transfer"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "аффилированные"
        - "взаимозависимые"
        - "группа компаний"
        - "холдинг"
        - "учредитель"
        - "участник общества"
        - "директор"
        - "родственники"
        - "деловая цель"
        - "экономическое обоснование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)аффилированн.*лиц"
        - "(?i)взаимозависим"
        - "(?i)группа.*компан"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь, являются ли стороны аффилированными/взаимозависимыми.

        РИСКИ:
