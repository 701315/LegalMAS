type: contract_2.6_gratuitous_use
name: "Договор безвозмездного пользования"

description: |
  Договор, по которому ссудодатель передает ссудополучателю индивидуально-определённую вещь 
  в безвозмездное временное пользование с обязательством вернуть её в том же состоянии 
  (с учётом нормального износа). Регулируется Главой 36 ГК РФ (ст. 689-701).
  
  Ключевые особенности:
  - Полное ОТСУТСТВИЕ платы за пользование (иначе — аренда)
  - ВСЕ расходы на содержание и ремонт (текущий И капитальный) несёт ссудополучатель
  - ЗАПРЕТ передачи аффилированным лицам коммерческих организаций (ст. 690 п.2 ГК РФ)
  - НАЛОГОВЫЕ РИСКИ: ссудополучатель-юрлицо признаёт внереализационный доход (ст. 250 НК РФ)
  - Риск случайной гибели по умолчанию на ссудодателе, но переходит при нарушениях

version: 4.0
parent: class_2_transfer_for_use

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 36 ГК РФ (ст. 689-701), НК РФ ст. 250"
  doc_types_supported:
    - "договор безвозмездного пользования имуществом"
    - "договор ссуды оборудования"
    - "договор ссуды транспортного средства"
    - "договор ссуды недвижимости"
    - "договор безвозмездного пользования помещением"
    - "соглашение о бесплатном пользовании"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)безвозмездн.*пользован"
      - "(?i)ссуд.*имуществ"
      - "(?i)бесплатн.*пользован"
      - "(?i)free.*loan"
      - "(?i)gratuitous.*use"

    folder_patterns:
      - "(?i)ссуда"
      - "(?i)безвозмездн"
      - "(?i)free.*use"

    keywords:

      high:
        - pattern: "(?i)безвозмездн[оеая]\\s+пользован[иеия]"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Ключевая формула безвозмездного пользования"

        - pattern: "(?i)договор\\s+безвозмездн[огоой]\\s+пользован[ияия]\\s+имуществ[ома]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора безвозмездного пользования имуществом"

        - pattern: "(?i)договор\\s+ссуд[ыыу]\\s+оборудован[ияи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Ссуда оборудования — разновидность безвозмездного пользования"

        - pattern: "(?i)договор\\s+ссуд[ыыу]\\s+транспортн[огоое\\s]*средств[ао]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Ссуда транспортного средства"

        - pattern: "(?i)договор\\s+ссуд[ыыу]\\s+недвижимост[иью]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Ссуда недвижимости / помещения"

        - pattern: "(?i)договор\\s+безвозмездн[огоой]\\s+пользован[ияия]\\s+помещен[иемия]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Безвозмездное пользование помещением"

        - pattern: "(?i)соглашен[иея]\\s+о\\s+бесплатн[омой]\\s+пользован[ииии]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Соглашение о бесплатном пользовании — прямой синоним конструкции ссуды"

        - pattern: "(?i)ссуд[аыу]\\s+имуществ[ао]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Упоминание договора ссуды имущества"

        - pattern: "(?i)ссудодател[ьяеи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Ссудодатель — ключевой участник по Главе 36 ГК РФ"

        - pattern: "(?i)ссудополучател[ьяеи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Ссудополучатель — ключевой участник по Главе 36 ГК РФ"

        - pattern: "(?i)бесплатн[оаяые]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Явное указание на бесплатный характер пользования"

        - pattern: "(?i)без\\s+взиман[ияию]\\s+плат[ыуы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прямой запрет взимания платы за пользование"

        - pattern: "(?i)вернуть\\s+ту\\s+же\\s+вещ[ьию]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Обязанность вернуть ту же вещь в том же состоянии (с учётом износа)"

      medium:
        - pattern: "(?i)нормальн[ыо]й\\s+износ"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Нормальный износ — ключевая категория по Гл. 36 ГК РФ"

        - pattern: "(?i)расход[ыо]\\s+на\\s+содержани[ея]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Расходы на содержание предмета — обычно возлагаются на ссудополучателя"

        - pattern: "(?i)текущ[иоя]+\\s+и\\s+капитальн[ыо]й\\s+ремонт"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Текущий и капитальный ремонт за счёт ссудополучателя"

        - pattern: "(?i)риск\\s+случайн[оа]й\\s+гибел[ии]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Распределение риска случайной гибели предмета"

        - pattern: "(?i)передать\\s+безвозмездно"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Безвозмездная передача вещи во временное пользование"

        - pattern: "(?i)в\\s+том\\s+же\\s+состояни[ии]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Обязанность возврата в том же состоянии"

        - pattern: "(?i)временн[оа]е\\s+пользовани[ея]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Указание на временный характер пользования"

      low:
        - pattern: "(?i)\\bоборудовани[ея]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Оборудование как возможный предмет ссуды"

        - pattern: "(?i)транспортн[оеая]\\s+средств[оа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Транспортное средство как возможный предмет ссуды"

        - pattern: "(?i)\\bпомещени[ея]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Помещение как возможный предмет безвозмездного пользования"

        - pattern: "(?i)внереализационн[ыо]й\\s+доход"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Налоговый эффект у ссудополучателя-юрлица (ст. 250 НК РФ)"

        - pattern: "(?i)рыночн[а-яё]+\\s+стоимост[ьи]\\s+аренд[ыы]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Оценка рыночной стоимости аренды для налоговых целей"

        - pattern: "(?i)аффилированн[ыо]е\\s+лиц[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание аффилированных лиц — важно для запрета ст. 690 ГК РФ"

    exclusions:
      - pattern: "(?i)арендн[а-яё]+\\s+плат[аа]"
        severity: hard
        weight: -1.0
        description: "Наличие арендной платы означает возмездный характер (аренда, не ссуда)"

      - pattern: "(?i)ежемесячн[ыо]й\\s+плат[её]ж"
        severity: hard
        weight: -1.0
        description: "Регулярные платежи за пользование характерны для аренды/лизинга, не ссуды"

      - pattern: "(?i)плат[аа]\\s+за\\s+пользовани[ея]"
        severity: hard
        weight: -1.0
        description: "Любая плата за пользование исключает безвозмездный характер договора"

      - pattern: "(?i)за[её]м\\s+денежн[ыо]х\\s+средств"
        severity: hard
        weight: -1.0
        description: "Договор займа денежных средств — иной тип обязательства"

      - pattern: "(?i)денежн[а-яё]+\\s+ссуд[аа]"
        severity: hard
        weight: -1.0
        description: "Денежная ссуда — договор займа, не безвозмездное пользование вещью"

      - pattern: "(?i)переходит\\s+в\\s+собственност[ььи]"
        severity: hard
        weight: -1.0
        description: "Переход в собственность указывает на дарение или куплю-продажу, а не ссуду"

      - pattern: "(?i)\\bдарени[ея]\\b"
        severity: hard
        weight: -1.0
        description: "Дарение — безвозмездная передача в собственность, не временное пользование"

      - pattern: "(?i)безвозмездн[а-яё]+\\s+передач[аа]\\s+в\\s+собственност[ььи]"
        severity: hard
        weight: -1.0
        description: "Безвозмездная передача в собственность — дарение, не договор ссуды"

      # ── Soft exclusions

      - pattern: "(?i)договор\\s+аренд[ыыу]"
        severity: soft
        weight: -0.35
        description: "Прямое упоминание договора аренды рядом с безвозмездным пользованием"

      - pattern: "(?i)лизинг[ауы]?"
        severity: soft
        weight: -0.4
        description: "Упоминание лизинга указывает на финансовую аренду, а не ссуду"

      - pattern: "(?i)плат[ауы]\\s+за\\s+на[её]м"
        severity: soft
        weight: -0.35
        description: "Плата за найм жилья тянет к договору жилищного найма (contract_2.5_residential_lease)"

# ════════════════════════════════════════════════════════════════════════════
