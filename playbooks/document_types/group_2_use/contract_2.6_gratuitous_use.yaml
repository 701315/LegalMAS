# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_pattern: "(?i)ИНН\\s*:?\\s*\\d{10,12}"
  ogrn_pattern: "(?i)ОГРН\\s*:?\\s*\\d{13,15}"
  term_pattern: "(?i)на\\s+срок\\s+\\d+\\s*(?:дн[ея]|месяц(?:ев|а)?|лет?)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "founder_director_loan_prohibition"
    name: "Запрет ссуды учредителю/руководителю коммерческой организации (ст. 690 п.2 ГК РФ)"
    description: |
      Коммерческая организация НЕ ВПРАВЕ передавать имущество в безвозмездное пользование:
      - лицу, являющемуся её учредителем (участником)
      - руководителю организации
      - членам органов управления или контроля
      Такой договор НИЧТОЖЕН.
    legal_base: "ст. 690 п. 2 ГК РФ"
    required_triggers: ["corporate_lender", "founder_director_transfer"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "hybrid"
    rules:
      keywords:
        - "учредитель"
        - "участник общества"
        - "директор"
        - "генеральный директор"
        - "член совета директоров"
        - "член правления"
        - "руководитель"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь, не является ли ссудополучатель лицом, которому ЗАПРЕЩЕНО передавать имущество 
        по ст. 690 п.2 ГК РФ.

        ЗАПРЕЩЕНО передавать имущество коммерческой организации:
        - учредителю/участнику этой организации
        - руководителю (директору, генеральному директору)
        - членам органов управления или контроля

        Ответь строго в JSON:
        {
          "lender_is_commercial_org": "<yes / no / unclear>",
          "borrower_is_founder": "<yes / no / unclear>",
          "borrower_is_director": "<yes / no / unclear>",
          "borrower_is_board_member": "<yes / no / unclear>",
          "prohibition_violated": "<yes / no / unclear>",
          "evidence_snippet": "<цитата или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      boost_keywords:
        - "ссудодатель"
        - "ссудополучатель"
        - "учредитель"
        - "директор"
        - "ООО"
        - "АО"
      rerank: true

  - id: "payment_converts_to_lease"
    name: "Переквалификация в аренду при наличии платы"
    description: "Если в договоре предусмотрена плата за пользование, это договор аренды, а не ссуды"
    legal_base: "ст. 689 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "reclassify"
    reclassify_to: "contract_2.1"
    detector_type: "rules"
    rules:
      keywords:
        - "арендная плата"
        - "плата за пользование"
        - "ежемесячный платёж"
        - "вознаграждение"
        - "оплата"
        - "рублей в месяц"
      keyword_mode: "any"
      negative_keywords:
        - "безвозмездно"
        - "бесплатно"
        - "без взимания платы"
      regex_patterns:
        - "(?i)плат(а|у)\\s+за\\s+пользован"
        - "(?i)\\d+.*руб.*в\\s+месяц"
    retrieval:
      context_k: 5
      boost_keywords:
        - "плата"
        - "оплата"
        - "безвозмездно"
      rerank: true

  - id: "ownership_transfer_converts_to_gift"
    name: "Переквалификация в дарение при переходе собственности"
    description: "Если предусмотрен переход права собственности, это дарение, а не ссуда"
    legal_base: "ст. 572, 689 ГК РФ"
    required_triggers: []
    severity: "critical"
