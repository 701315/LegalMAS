    name: "Право на отказ от бессрочного договора (ст. 699 ГК)"
    description: "Проверяет условия об отказе с уведомлением"
    legal_base: "ст. 699 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["indefinite_term"]
    rules:
      keywords:
        - "отказаться от договора"
        - "предупредив за 1 месяц"
        - "за один месяц"
        - "уведомление о расторжении"
        - "в любое время"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вправе.*отказаться.*предупредив.*за.*месяц"

  - id: "defects_liability_clause"
    name: "Ответственность за недостатки вещи (ст. 693 ГК)"
    description: "Проверяет условия об ответственности за скрытые дефекты"
    legal_base: "ст. 693 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "отвечает за недостатки"
        - "скрытые недостатки"
        - "умышленно не оговорил"
        - "грубая неосторожность"
        - "возместить реальный ущерб"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ссудодатель.*отвечает.*за.*недостатки"

  - id: "normal_wear_protection"
    name: "Защита от претензий по нормальному износу"
    description: "Проверяет исключение нормального износа из оснований ответственности"
    legal_base: "ст. 689 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "нормальный износ"
        - "естественный износ"
        - "не является основанием"
        - "с учётом износа"
        - "не подлежит возмещению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нормальн.*износ.*не.*является.*основанием"
        - "(?i)с.*учётом.*нормальн.*износ"

  - id: "tax_consequences_warning"
    name: "Предупреждение о налоговых последствиях (ст. 250 НК)"
    description: "Проверяет наличие информации о налоговых рисках для юрлиц"
    legal_base: "ст. 250 НК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["corporate_borrower"]
    rules:
      keywords:
        - "налоговые последствия"
        - "внереализационный доход"
        - "рыночная стоимость аренды"
        - "налог на прибыль"
        - "ст. 250 НК РФ"
        - "налоговые риски"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)внереализационн.*доход"
        - "(?i)рыночн.*стоимост.*аренд"

  - id: "handover_act_required"
    name: "Акт приёма-передачи имущества"
    description: "Проверяет требование об акте передачи"
    legal_base: "ГК РФ (общие положения)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "акт приёма-передачи"
        - "передаточный акт"
        - "передача оформляется актом"
        - "состояние имущества"
        - "фотофиксация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*прием.*передач"
        - "(?i)передач.*оформляется.*актом"

  - id: "return_procedure_specified"
    name: "Порядок возврата имущества"
    description: "Проверяет условия возврата"
    legal_base: "ст. 689, 692 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "порядок возврата"
        - "акт возврата"
        - "в том же состоянии"
        - "срок возврата"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*имуществ"
        - "(?i)в.*том.*же.*состоянии"

  - id: "improvements_clause"
    name: "Условия об улучшениях имущества (ст. 623 ГК по аналогии)"
    description: "Проверяет регулирование произведённых улучшений"
    legal_base: "ст. 623 ГК РФ (по аналогии)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "улучшения"
        - "неотделимые улучшения"
        - "отделимые улучшения"
        - "компенсация улучшений"
        - "с согласия ссудодателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неотделим.*улучшен"
        - "(?i)компенсац.*улучшен"

  - id: "liability_for_damage"
    name: "Ответственность за повреждение/утрату имущества"
    description: "Проверяет условия ответственности за ущерб"
    legal_base: "ст. 696, 1064 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возмещение ущерба"
        - "ответственность за повреждение"
        - "ответственность за утрату"
        - "компенсация стоимости"
        - "восстановительный ремонт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возмещ.*ущерб"
        - "(?i)ответственност.*за.*(поврежден|утрат)"

  - id: "insurance_clause"
    name: "Страхование имущества"
    description: "Проверяет условия о страховании"
    legal_base: "ГК РФ (общие положения)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "застраховать"
        - "выгодоприобретатель"
        - "страховое покрытие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован"

  - id: "lender_early_return_grounds"
    name: "Основания для досрочного истребования вещи (ст. 698 ГК РФ)"
    description: "Проверяет наличие перечня оснований для досрочного возврата имущества ссудодателю"
    legal_base: "ст. 698 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "досрочный возврат"
        - "потребовать возврата"
        - "использование не по назначению"
        - "существенное ухудшение"
        - "не выполняет обязанность по содержанию"
        - "передача третьим лицам без согласия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ссудодатель.*вправе.*потребовать.*возврат"
        - "(?i)ст\\.?\\s*698\\s+ГК\\s+РФ"

  - id: "ownership_change_preservation"
    name: "Сохранение ссуды при смене собственника (ст. 700 ГК РФ)"
    description: "При отчуждении вещи права и обязанности ссудодателя переходят к новому собственнику"
    legal_base: "ст. 700 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "смена собственника"
        - "переход права собственности"
        - "новый собственник"
        - "отчуждение вещи"
        - "права и обязанности переходят"
        - "ст. 700 ГК"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переход.*права.*собственности.*не.*прекращает"
        - "(?i)ст\\.?\\s*700\\s+ГК\\s+РФ"

  - id: "force_majeure_clause"
    name: "Форс-мажор: определение и последствия (ст. 401 ГК РФ)"
    description: "Проверяет наличие форс-мажорной оговорки"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "освобождение от ответственности"
        - "уведомление о форс-мажоре"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[\\s\\-]?мажор"
        - "(?i)непреодолим(ой|ая)\\s+сил"

  - id: "dispute_resolution"
    name: "Разрешение споров: претензионный порядок и подсудность"
    description: "Проверяет наличие претензионного порядка и подсудности"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "претензионный порядок"
        - "арбитражный суд"
        - "подсудность"
        - "суд общей юрисдикции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионн(ый|ого)\\s+порядк"
        - "(?i)арбитражн(ый|ого)\\s+суд"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  loan_subject_identification:
    text: >
      Просим предоставить полные данные о предмете ссуды по {doc_names}:
      наименование, индивидуальные признаки (серийный/инвентарный номер, VIN, кадастровый номер),
      техническое состояние, комплектация, оценочная стоимость.
    addressee: "Ссудодатель"

  gratuitous_nature_verification:
    text: >
      Просим подтвердить безвозмездный характер договора {doc_names}:
      убедиться, что отсутствуют скрытые платежи, компенсации или иные возмездные элементы,
      которые могут привести к переквалификации в аренду.
    addressee: "Юридический советник"

  parties_identification:
    text: >
      Просим предоставить полные реквизиты сторон по {doc_names}:
      наименование/ФИО, ИНН, ОГРН, адрес, документы уполномоченных лиц,
      а также информацию об аффилированности сторон.
    addressee: "Обе стороны"

  tax_consequences_analysis:
    text: >
      ВНИМАНИЕ: Для ссудополучателя-юрлица по {doc_names} возникает внереализационный доход,
      облагаемый налогом на прибыль по рыночной стоимости аренды (п. 8 ст. 250 НК РФ).
      Просим предоставить: (а) расчёт рыночной стоимости аренды аналогичного имущества;
      (б) подтверждение отражения дохода в налоговом учёте.
    addressee: "Налоговый консультант / Главный бухгалтер ссудополучателя"

  tax_consequences_warning:
    text: >
      Просим добавить в {doc_names} предупреждение о налоговых последствиях:
      ссудополучатель-организация признаёт внереализационный доход по рыночной стоимости 
      аренды аналогичного имущества (ст. 250 НК РФ).
    addressee: "Юридический советник"

  related_parties_analysis:
    text: >
      КРИТИЧЕСКИЙ РИСК по {doc_names}: проверка на аффилированность сторон.
      Просим предоставить: (а) информацию о взаимозависимости сторон (учредители, руководители);
      (б) подтверждение, что ссудополучатель НЕ является учредителем/директором ссудодателя
      (запрет по ст. 690 п.2 ГК РФ); (в) экономическое обоснование безвозмездности (если стороны взаимозависимы).
    addressee: "Юридический советник обеих сторон"

  founder_director_loan_prohibition:
    text: >
      КРИТИЧЕСКАЯ ПРОВЕРКА по {doc_names}: по ст. 690 п.2 ГК РФ коммерческая организация
      НЕ ВПРАВЕ передавать имущество в ссуду своему учредителю/директору/члену органов управления.
      Просим подтвердить, что ссудополучатель не относится к указанным категориям.
      При нарушении договор НИЧТОЖЕН.
    addressee: "Юридический советник ссудодателя"

  maintenance_expenses_allocation:
    text: >
      Просим уточнить по {doc_names} распределение расходов на содержание:
      (а) кто несёт расходы на текущий ремонт; (б) кто несёт расходы на капитальный ремонт;
      (в) соответствует ли это ст. 695 ГК РФ (по умолчанию — всё на ссудополучателе).
    addressee: "Юридический советник"

  maintenance_obligation_clear:
    text: >
      Просим явно указать в {doc_names}, что ссудополучатель несёт ВСЕ расходы
      на содержание имущества, включая текущий и капитальный ремонт,
      эксплуатационные расходы, коммунальные платежи (если применимо)
      в соответствии со ст. 695 ГК РФ.
    addressee: "Юридический советник ссудодателя"

  loan_term_analysis:
    text: >
      Просим уточнить в {doc_names}: (а) определённый или неопределённый срок;
      (б) конкретные даты (начало/окончание); (в) условия автопролонгации;
      (г) срок уведомления об отказе — по умолчанию 1 месяц (ст. 699 ГК РФ),
      для недвижимости — 3 месяца.
    addressee: "Обе стороны"

  accidental_loss_risk_analysis:
    text: >
      Просим уточнить в {doc_names} распределение риска случайной гибели (ст. 696 ГК РФ):
      (а) по умолчанию риск на ссудодателе; (б) переход риска при: использовании
      не по назначению, передаче третьим лицам, непредотвращении гибели;
      (в) страхование имущества.
    addressee: "Юридический советник"

  defects_liability_analysis:
    text: >
      Просим уточнить в {doc_names} ответственность за недостатки (ст. 693 ГК РФ):
      (а) наличие оговорки «как есть»; (б) ответственность за умышленное сокрытие
      дефектов; (в) средства защиты ссудополучателя (устранение/возмещение/расторжение).
    addressee: "Юридический советник"

  third_party_transfer_prohibition:
    text: >
      Просим уточнить в {doc_names}: (а) запрет или разрешение передачи третьим лицам;
      (б) процедура получения согласия; (в) последствия несанкционированной передачи
      (переход риска гибели — ст. 696 ГК РФ).
    addressee: "Юридический советник"

  return_procedure_analysis:
    text: >
      Просим уточнить в {doc_names}: (а) срок возврата после прекращения договора;
      (б) место возврата; (в) необходимость акта возврата с фиксацией состояния;
      (г) исключение нормального износа из оснований претензий;
      (д) кто несёт расходы на доставку при возврате.
    addressee: "Обе стороны"

  improvements_compensation_analysis:
    text: >
      Просим уточнить в {doc_names}: (а) требуется ли согласие на улучшения;
      (б) судьба отделимых улучшений (собственность ссудополучателя);
      (в) компенсация неотделимых улучшений (по умолчанию — нет, если без согласия);
      (г) порядок согласования стоимости (ст. 623 ГК РФ по аналогии).
    addressee: "Юридический советник"

  early_termination_rights_analysis:
    text: >
      Просим уточнить в {doc_names}: (а) основания для досрочного возврата
      ссудодателем (ст. 698 ГК РФ — 4 основания); (б) право ссудополучателя
      на досрочный отказ; (в) срок уведомления; (г) порядок возврата
      и фиксации состояния при досрочном прекращении.
    addressee: "Юридический советник"

  subject_identification_required:
    text: >
      Просим включить в {doc_names} полное описание предмета ссуды:
      наименование, индивидуальные признаки, техническое состояние,
      комплектация, оценочная стоимость (ст. 689, 607 ГК РФ).
    addressee: "Ссудодатель"

  gratuitous_nature_explicit:
    text: >
      Просим явно указать в {doc_names} безвозмездный характер пользования
      и отсутствие каких-либо платежей за пользование (ст. 689 ГК РФ).
    addressee: "Юридический советник"

  risk_transfer_conditions:
    text: >
      Просим включить в {doc_names} условия перехода риска случайной гибели
      на ссудополучателя (ст. 696 ГК РФ): использование не по назначению,
      передача третьим лицам, непредотвращение гибели.
    addressee: "Юридический советник ссудодателя"

  third_party_prohibition:
    text: >
      Просим включить в {doc_names} явный запрет на передачу имущества третьим
      лицам без письменного согласия ссудодателя (ст. 696 ГК РФ).
    addressee: "Юридический советник ссудодателя"

  designated_use_specified:
    text: >
      Просим указать в {doc_names} целевое назначение использования имущества.
      Нарушение целевого назначения — основание для досрочного возврата (ст. 698 ГК РФ).
    addressee: "Обе стороны"

  termination_notice_right:
    text: >
      Просим включить в {doc_names} право на отказ от бессрочного договора
      с уведомлением за 1 месяц (ст. 699 ГК РФ). Для недвижимости — за 3 месяца.
    addressee: "Юридический советник"

  defects_liability_clause:
    text: >
      Просим включить в {doc_names} условия об ответственности ссудодателя
      за скрытые недостатки (ст. 693 ГК РФ): умышленное сокрытие,
      средства защиты ссудополучателя.
    addressee: "Юридический советник"

  normal_wear_protection:
    text: >
      Просим включить в {doc_names} оговорку: нормальный (естественный) износ
      не является основанием для претензий при возврате (ст. 689 ГК РФ).
    addressee: "Юридический советник ссудополучателя"

  handover_act_required:
    text: >
      Просим предусмотреть в {doc_names} обязательный акт приёма-передачи
      с описанием состояния, комплектации и фотофиксацией имущества.
    addressee: "Обе стороны"

  return_procedure_specified:
    text: >
      Просим включить в {doc_names}: порядок возврата имущества (акт возврата),
      срок, место, расходы на транспортировку, порядок фиксации состояния.
    addressee: "Обе стороны"

  improvements_clause:
    text: >
      Просим включить в {doc_names}: порядок согласования улучшений,
      правила компенсации неотделимых улучшений, принадлежность отделимых
      (ст. 623 ГК РФ по аналогии).
    addressee: "Юридический советник"

  liability_for_damage:
    text: >
      Просим уточнить в {doc_names}: условия ответственности ссудополучателя
      за повреждение/утрату имущества, порядок оценки ущерба, сроки возмещения.
    addressee: "Юридический советник"

  insurance_clause:
    text: >
      Просим уточнить в {doc_names}: обязанность по страхованию, кто страхует,
      страховая сумма, выгодоприобретатель, срок предоставления полиса.
    addressee: "Обе стороны"

  lender_early_return_grounds:
    text: >
      Просим включить в {doc_names} основания для досрочного возврата (ст. 698 ГК РФ):
      (а) использование не по назначению; (б) невыполнение обязанности по содержанию;
      (в) существенное ухудшение; (г) передача третьему лицу без согласия.
    addressee: "Юридический советник ссудодателя"

  ownership_change_preservation:
    text: >
      Просим включить в {doc_names} оговорку: при смене собственника (продаже,
      дарении) имущества права и обязанности ссудодателя переходят к новому
      собственнику, ссуда не прекращается (ст. 700 ГК РФ).
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок уведомления, последствия (приостановка/расторжение).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим уточнить в {doc_names}: претензионный порядок (срок),
      подсудность, возможность медиации.
    addressee: "Юридический советник"

  gratuitous_between_commercial_orgs_donation_risk:
    text: >
      ВНИМАНИЕ: в {doc_names} обе стороны — коммерческие организации.
      Ссуда между коммерческими юрлицами может быть оспорена как дарение
      (ст. 575 п. 4 ГК РФ — запрет дарения между коммерческими орг-ями).
      Просим предоставить: (а) экономическое обоснование безвозмездности
      (деловая цель); (б) подтверждение, что сделка не является притворной
      (ст. 170 ГК РФ).
    addressee: "Юридический советник обеих сторон"

  payment_converts_to_lease:
    text: >
      ВНИМАНИЕ: в {doc_names} обнаружены признаки возмездности (платежи за пользование).
      Если предусмотрена плата — это договор аренды, а не ссуды (ст. 689 ГК РФ).
      Просим уточнить: являются ли указанные платежи оплатой за пользование
      или компенсацией расходов на содержание.
    addressee: "Юридический советник"

  ownership_transfer_converts_to_gift:
    text: >
      ВНИМАНИЕ: в {doc_names} обнаружены признаки перехода права собственности.
      Если предусмотрена передача в собственность — это дарение, а не ссуда
      (ст. 572, 689 ГК РФ). Просим уточнить правовую природу сделки.
    addressee: "Юридический советник"

  money_as_subject_converts_to_loan:
    text: >
      ВНИМАНИЕ: в {doc_names} предметом являются денежные средства.
      Ссуда денег — это договор займа (ст. 807 ГК РФ), а не безвозмездное
      пользование (ст. 689 ГК РФ). Просим переквалифицировать договор.
    addressee: "Юридический советник"

   # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    