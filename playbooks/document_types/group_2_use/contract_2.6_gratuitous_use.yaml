      - "(?i)\\bПАО\\b"
      - "(?i)\\bЗАО\\b"
      - "(?i)\\bобществ[оа]\\b"
      - "(?i)\\bорганизаци[яи]\\b"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)в\\s+лице\\s+генеральн[оа]го\\s+директор[аа]"
      - "(?i)действующ[еёа-я]+\\s+на\\s+основани[ии]\\s+устав[аа]"

  corporate_borrower:
