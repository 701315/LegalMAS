        - "передаётся в собственность"
        - "право собственности переходит"
        - "дарение"
        - "безвозмездная передача в собственность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "собственность"
        - "переходит"
        - "передача"
      rerank: true

  - id: "money_as_subject_converts_to_loan"
    name: "Переквалификация в заём при денежном предмете"
    description: "Если предмет — денежные средства, это договор займа"
    legal_base: "ст. 807, 689 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "reclassify"
    reclassify_to: "contract_4.3"
    detector_type: "rules"
    rules:
