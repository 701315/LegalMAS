  - id: early_termination_rights_analysis
    name: "Право ссудодателя на досрочный возврат и расторжение (ст. 698, 699 ГК РФ)"
    description: |
      Проверяет наличие и полноту оснований для досрочного истребования имущества
      ссудодателем. По ст. 698 ГК РФ ссудодатель вправе потребовать возврата, если:
      1) вещь используется не по назначению
      2) не выполняется обязанность по содержанию
      3) состояние вещи существенно ухудшилось
      4) вещь передана третьему лицу без согласия
      Для бессрочных договоров: право отказа с уведомлением за 1 месяц (ст. 699).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "досрочный возврат"
        - "досрочное расторжение"
        - "потребовать возврата"
        - "использование не по назначению"
        - "существенное ухудшение"
        - "не выполняет обязанность по содержанию"
        - "ст. 698 ГК"
        - "ст. 699 ГК"
        - "предупредив за"
        - "уведомив за 1 месяц"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ссудодатель.*вправе.*потребовать.*досрочн.*возврат"
        - "(?i)ст\\.?\\s*(698|699)\\s+ГК\\s+РФ"
        - "(?i)предупредив.*за\\s+(один|1)\\s+месяц"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор безвозмездного пользования (ссуды).
        Проверь условия досрочного возврата и расторжения (ст. 698, 699 ГК РФ).

        По закону ссудодатель вправе потребовать досрочного возврата при:
        1) использовании не по назначению
        2) невыполнении обязанности по содержанию/ремонту
        3) существенном ухудшении состояния
        4) передаче третьему лицу без согласия

        Для бессрочных: отказ с уведомлением за 1 месяц (недвижимость — 3 месяца).

        Ответь строго в JSON:
        {
          "lender_early_return_right": "<explicit / implied / absent / not_found>",
          "early_return_grounds_listed": "<yes / no / not_found>",
          "grounds_match_law": "<full / partial / absent / not_found>",
          "borrower_early_return_right": "<yes / no / not_found>",
          "notice_period_specified": "<yes / no / not_found>",
          "notice_period_duration": "<срок или not_found>",
          "termination_snippet": "<цитата или not_found>"
        }

        - "full" — все 4 основания из ст. 698 указаны
        - "partial" — указаны не все основания

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "досрочный возврат"
        - "расторжение"
        - "потребовать возврата"
        - "ст. 698"
        - "ст. 699"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lender_early_return_right"
          type: "string"
          allowed_values: ["explicit", "implied", "absent", "not_found"]
          description: "Право ссудодателя на досрочный возврат"
        - name: "grounds_match_law"
          type: "string"
          allowed_values: ["full", "partial", "absent", "not_found"]
          description: "Полнота оснований для досрочного возврата"
      store_payload: true

