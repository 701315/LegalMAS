        - "бронирование"
        - "гостиничные"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: premises_identification
    name: "Идентификация жилого помещения (ст. 673 ГК РФ)"
    description: "Извлекает адрес, площадь, кадастровый номер и характеристики жилого помещения"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "жилое помещение"
        - "квартира"
        - "комната"
        - "жилой дом"
        - "адрес"
        - "площадь"
        - "кадастровый номер"
        - "этаж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)(кв\\.|квартира)\\s*№?\\s*\\d+"
        - "(?i)площадь.*?\\d+[,.]?\\d*\\s*(кв\\.?\\s*м|м2|м²)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор найма жилого помещения.
        Найди в тексте данные о предмете договора — жилом помещении.

        Ответь строго в JSON-формате:
        {
          "premises_type": "<apartment / room / house / not_found>",
          "full_address": "<полный адрес или not_found>",
          "apartment_number": "<номер квартиры или not_found>",
          "floor": "<этаж или not_found>",
          "total_area_sqm": "<площадь в кв.м или not_found>",
          "rooms_count": "<количество комнат или not_found>",
          "cadastral_number": "<кадастровый номер или not_found>"
        }

        ВАЖНО: Возвращай только то, что явно указано в тексте. Если значение не найдено — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет договора"
        - "жилое помещение"
        - "квартира"
        - "адрес"
        - "площадь"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "premises_type"
          type: "string"
          allowed_values: ["apartment", "room", "house", "not_found"]
          description: "Тип жилого помещения"
        - name: "full_address"
          type: "string"
          keyword_hints: ["адрес", "расположен", "находится по адресу"]
          description: "Полный адрес"
        - name: "total_area_sqm"
          type: "number"
          keyword_hints: ["площадь", "кв.м", "м²"]
          unit: "sq_m"
          description: "Общая площадь"
        - name: "cadastral_number"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
          description: "Кадастровый номер"
      store_payload: true

  - id: lease_term_analysis
    name: "Срок договора и тип найма (ст. 683, 684 ГК РФ)"
    description: "Определяет срок договора и тип найма (краткосрочный/долгосрочный), анализирует последствия"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок найма"
        - "срок действия"
        - "заключен на срок"
        - "месяцев"
        - "лет"
        - "краткосрочный"
        - "долгосрочный"
        - "до"
        - "по"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)на\\s+срок\\s+(\\d+)\\s*(месяц|год|лет)"
        - "(?i)с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}.*по\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)(11|одиннадцать)\\s*месяц"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор найма жилого помещения.
        Определи срок договора и тип найма.

        ВАЖНО по ст. 683 ГК РФ:
        - Краткосрочный наем: до 1 года (включительно) — упрощённый режим
        - Долгосрочный наем: более 1 года ИЛИ срок не указан (по умолчанию 5 лет)

        Ответь строго в JSON:
        {
          "term_specified": "<yes / no>",
          "term_months": "<число месяцев или not_found>",
          "start_date": "<дата начала или not_found>",
          "end_date": "<дата окончания или not_found>",
          "lease_type": "<short_term / long_term / unspecified>",
          "auto_renewal_mentioned": "<yes / no / not_found>",
          "risk_assessment": "<описание рисков для сторон>"
        }

        Если срок не указан — lease_type = "long_term" (по умолчанию 5 лет по ст. 683 ГК РФ).
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "срок"
        - "действие договора"
        - "месяцев"
        - "лет"
        - "продление"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "term_months"
          type: "number"
          keyword_hints: ["срок", "месяцев", "на период"]
          description: "Срок в месяцах"
        - name: "lease_type"
          type: "string"
          allowed_values: ["short_term", "long_term", "unspecified"]
          description: "Тип найма"
        - name: "auto_renewal_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["автоматическое продление", "пролонгация", "продлевается"]
          description: "Упоминание автопродления"
      store_payload: true

  - id: rent_payment_terms
    name: "Плата за наем: размер, порядок, сроки (ст. 682 ГК РФ)"
    description: "Извлекает условия оплаты найма — существенное условие договора"
    triggers: {}
    severity: "critical"
