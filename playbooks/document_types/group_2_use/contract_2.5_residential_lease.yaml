  term_months: "(?i)\\b\\d{1,2}\\s*(?:месяц|месяца|месяцев|мес\\.)\\b"
  passport_data: "(?i)паспорт.*серия.*\\d{4}.*№.*\\d{6}"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "legal_entity_as_tenant_prohibition"
    name: "Запрет юрлица в качестве нанимателя (ст. 671 ГК РФ)"
    description: "Нанимателем по договору найма жилого помещения может быть только гражданин. Юридические лица заключают договор аренды."
    legal_base: "ст. 671 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "reclassify"
    reclassify_to: "contract_2.1"
    detector_type: "rules"
    rules:
      keywords:
        - "ООО"
        - "ОАО"
