type: contract_2.5_residential_lease
name: "Договор найма жилого помещения"

description: |
  Договор возмездного временного пользования жилым помещением (квартира, комната, жилой дом)
  для проживания граждан. Регулируется специальными нормами Главы 35 ГК РФ.

  Ключевые особенности:
  - Нанимателем может быть ТОЛЬКО гражданин (для юрлиц — аренда по § 1 Гл. 34 ГК РФ)
  - Сильная социальная защита нанимателя: ограничение выселения, преимущественное право на продление
  - Краткосрочный наем (до 1 года): упрощённый режим, меньше прав у нанимателя
  - Долгосрочный наем (5 лет по умолчанию): максимальная защита нанимателя
  - Выселение — только через суд, даже при неуплате
  - Капитальный ремонт — обязанность наймодателя, текущий — нанимателя (ст. 681 ГК РФ)

version: 4.0
parent: class_2_transfer_for_use

