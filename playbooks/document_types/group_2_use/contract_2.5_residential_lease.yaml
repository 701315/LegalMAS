    name: "Признаки посуточной аренды / гостиничных услуг"
    description: >
      Посуточная сдача жилья не является наймом по Гл. 35 ГК РФ. С 01.10.2019 (ФЗ-59)
      запрещено оказание гостиничных услуг в жилых помещениях МКД.
      При обнаружении признаков — реклассификация.
