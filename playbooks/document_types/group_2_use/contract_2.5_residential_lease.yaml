        - "по решению суда"
    retrieval:
      context_k: 5
      boost_keywords:
        - "выселение"
        - "расторжение"
        - "освобождение"
      rerank: true

  - id: "mortgaged_premises_consent_required"
    name: "Согласие залогодержателя на сдачу в наем (ст. 346 ГК РФ, ст. 40 ФЗ-102)"
    description: >
      Если жилое помещение находится в ипотеке, сдача в наем допускается только с согласия
      залогодержателя, если иное не предусмотрено договором об ипотеке.
      Нарушение может повлечь досрочное истребование кредита.
    legal_base: "ст. 346 ГК РФ, ст. 40 ФЗ «Об ипотеке» № 102-ФЗ"
    required_triggers: ["mortgage_on_premises"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ипотека"
        - "залог"
        - "обременение"
        - "залогодержатель"
        - "банк"
        - "кредит"
      keyword_mode: "any"
      negative_keywords:
        - "согласие залогодержателя получено"
        - "согласие банка на сдачу"
