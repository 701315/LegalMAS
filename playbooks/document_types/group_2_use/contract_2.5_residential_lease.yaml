          "payment_method": "<direct_to_providers / to_landlord / included / not_found>",
          "meter_readings_procedure": "<процедура снятия показаний или not_found>"
        }

        По умолчанию (ст. 678 ГК РФ) коммунальные услуги оплачивает наниматель.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
