          description: "Кто оплачивает ЖКУ"
        - name: "utilities_included_in_rent"
          type: "string"
          allowed_values: ["yes", "no", "partially", "not_found"]
          description: "Включены ли ЖКУ в плату за наем"
      store_payload: true

  - id: residents_and_family_members
    name: "Список проживающих и члены семьи (ст. 677, 679 ГК РФ)"
    description: "Извлекает информацию о проживающих лицах и правилах вселения"
    triggers:
      any: ["family_members_involved", "temporary_residents"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "совместно проживают"
        - "члены семьи"
        - "супруг"
        - "дети"
        - "родители"
        - "вселение"
        - "временные жильцы"
        - "без права вселения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)совместно.*проживают.*следующие.*лица"
        - "(?i)члены.*семьи.*нанимател"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор найма жилого помещения.
        Найди информацию о проживающих лицах.

        По закону (ст. 677, 679 ГК РФ):
        - Супруг, дети, родители нанимателя могут вселяться БЕЗ согласия наймодателя
        - Другие лица — только С СОГЛАСИЯ наймодателя
        - Временные жильцы — до 6 месяцев с уведомлением

        Ответь строго в JSON:
        {
          "residents_list_present": "<yes / no>",
          "residents_names": ["<список ФИО>"],
          "family_members_mentioned": "<yes / no>",
          "third_party_consent_required": "<yes / no / not_specified>",
          "temporary_residents_allowed": "<yes / no / with_consent / not_specified>",
          "max_residents_limit": "<число или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "проживающие"
        - "члены семьи"
        - "вселение"
        - "жильцы"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "residents_list_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Указан ли список проживающих"
        - name: "third_party_consent_required"
