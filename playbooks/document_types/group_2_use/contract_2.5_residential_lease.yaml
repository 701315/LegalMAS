  - id: "unilateral_eviction_void"
    name: "Ничтожность условий о внесудебном выселении (ст. 687 ГК РФ)"
    description: "Условия договора, позволяющие наймодателю выселить нанимателя без суда, ничтожны как противоречащие закону"
    legal_base: "ст. 687 ГК РФ, ст. 168 ГК РФ"
    required_triggers: ["eviction_clauses"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
