      keyword_mode: "any"
      regex_patterns:
        - "(?i)пожарн(ая|ой)\\s+безопасност"

  - id: "insurance_of_premises"
    name: "Страхование помещения и имущества"
    description: "Проверяет наличие условий о страховании — практический риск для обеих сторон"
    legal_base: "ГК РФ (общие положения), свобода договора"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "страхование ответственности"
        - "страхование имущества"
        - "застраховать"
        - "выгодоприобретатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ой\\s+полис)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "insurance_required"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          keyword_hints: ["обязан застраховать", "страхование обязательно"]
          description: "Обязательность страхования"
      store_payload: true

  - id: "force_majeure_clause"
    name: "Форс-мажор и обстоятельства непреодолимой силы"
    description: "Проверяет наличие оговорки о форс-мажоре"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "обстоятельства непреодолимой силы"
        - "стихийное бедствие"
        - "чрезвычайные обстоятельства"
        - "освобождение от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"

  - id: "dispute_resolution"
    name: "Порядок разрешения споров"
    description: "Проверяет наличие условий о досудебном урегулировании и подсудности"
    legal_base: "ГПК РФ, ст. 421 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "претензионный порядок"
        - "досудебное урегулирование"
        - "подсудность"
        - "по месту нахождения"
        - "медиация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионн(ый|ого)\\s+порядк"
        - "(?i)досудебн(ое|ого)\\s+урегулирован"

  - id: "penalty_for_late_payment"
    name: "Неустойка/пеня за просрочку оплаты"
    description: "Проверяет наличие и соразмерность неустойки за просрочку платежей"
    legal_base: "ст. 330, 333 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "процент за просрочку"
        - "за каждый день просрочки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*\\d+.*%"
        - "(?i)пен(я|и|ю).*за.*каждый.*день"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "penalty_rate"
          type: "string"
          keyword_hints: ["% за каждый день", "в размере", "неустойка"]
          description: "Ставка неустойки"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  premises_identification:
    text: >
      Просим предоставить полные данные о жилом помещении по {doc_names}:
      точный адрес (включая номер квартиры/комнаты, этаж), площадь,
      кадастровый номер, количество комнат, актуальную выписку ЕГРН.
    addressee: "Наймодатель"

  address_required:
    text: >
      В {doc_names} не указан точный адрес жилого помещения, что делает предмет договора
      неопределённым (ст. 673 ГК РФ). Просим указать полный адрес: город, улица, дом,
      корпус (если есть), квартира, этаж.
    addressee: "Наймодатель"

  rent_amount_required:
    text: >
      В {doc_names} не указан размер платы за наем. Это существенное условие (ст. 682 ГК РФ),
      без которого договор считается незаключённым. Просим указать: сумму ежемесячной платы
      цифрами и прописью, валюту, порядок оплаты.
    addressee: "Обе стороны"

  parties_identification:
    text: >
      Просим подтвердить полные данные сторон по {doc_names}: ФИО, паспортные данные,
      адрес регистрации, контактные данные наймодателя и нанимателя.
    addressee: "Обе стороны"

  lease_term_analysis:
    text: >
      Просим уточнить в {doc_names}: точный срок найма (дата начала и окончания),
      тип найма (краткосрочный до 1 года / долгосрочный), условия продления/пролонгации.
      Напоминаем: если срок не указан, по умолчанию он составляет 5 лет (ст. 683 ГК РФ).
    addressee: "Обе стороны"

  short_term_lease_preferred:
    text: >
      Просим подтвердить, что срок найма по {doc_names} составляет менее 1 года
      (краткосрочный наем). При краткосрочном найме не действуют нормы о преимущественном
      праве нанимателя (ст. 684 ГК РФ) и ограничения на вселение.
    addressee: "Юридический советник наймодателя"

  renewal_notice_procedure:
    text: >
      Для {doc_names} (долгосрочный наем) просим включить условие об уведомлении
      наймодателем нанимателя за 3 месяца до окончания срока о продлении
      или отказе от продления (ст. 684 ГК РФ).
    addressee: "Юридический советник"

  preemptive_right_on_renewal:
    text: >
      Просим подтвердить для {doc_names}, что преимущественное право нанимателя
      на продление (ст. 684 ГК РФ) соблюдено: наймодатель уведомил за 3 месяца,
      предложил те же или иные условия, получил ответ нанимателя.
    addressee: "Наймодатель / Юридический советник"

  rent_payment_terms:
    text: >
      Просим уточнить в {doc_names}: точный размер платы за наем (цифрами и прописью),
      порядок и сроки оплаты (до какого числа), способ оплаты (наличные/перевод),
      реквизиты для перечисления, условия первого платежа.
    addressee: "Обе стороны"

  security_deposit_terms:
    text: >
      Просим уточнить в {doc_names}: размер страхового депозита, назначение,
      условия и сроки возврата (в днях), основания для удержания, явное исключение
      естественного износа из оснований удержания, порядок сверки при возврате.
    addressee: "Обе стороны"

  deposit_return_conditions:
    text: >
      В {doc_names} не указаны условия возврата страхового депозита.
      Просим включить: срок возврата (обычно 7-14 дней), перечень оснований удержания,
      исключение естественного износа, порядок фиксации состояния помещения при выезде.
    addressee: "Юридический советник"

  rent_increase_limitations:
    text: >
      Просим уточнить в {doc_names} условия изменения размера платы: частоту (не чаще 1 раза
      в год по ст. 682 ГК РФ), порядок уведомления (за 3 месяца), формулу индексации
      (если есть), право нанимателя на отказ при несогласии.
    addressee: "Юридический советник"

  rent_increase_limited:
    text: >
      В {doc_names} выявлены условия о повышении платы, потенциально противоречащие
      ст. 682 ГК РФ. Просим привести в соответствие: не чаще 1 раза в год,
      с уведомлением за разумный срок, без одностороннего произвольного повышения.
    addressee: "Юридический советник наймодателя"

  penalty_for_late_payment:
    text: >
      Просим уточнить в {doc_names} размер неустойки за просрочку оплаты и проверить
      её соразмерность (ст. 333 ГК РФ). Чрезмерная неустойка может быть снижена судом.
    addressee: "Юридический советник"

  utilities_allocation:
    text: >
      Просим уточнить в {doc_names}: какие коммунальные услуги оплачивает наниматель,
      какие включены в плату за наем, порядок передачи показаний счётчиков,
      порядок оплаты (напрямую УК или через наймодателя).
    addressee: "Обе стороны"

  utilities_allocation_clear:
    text: >
      В {doc_names} нечётко распределена оплата ЖКУ. По ст. 678 ГК РФ коммунальные
      услуги по умолчанию оплачивает наниматель. Просим уточнить перечень и порядок.
    addressee: "Обе стороны"

  residents_and_family_members:
    text: >
      Просим предоставить по {doc_names}: полный список лиц, которые будут проживать
      совместно с нанимателем (ФИО, степень родства), условия вселения третьих лиц,
      порядок уведомления наймодателя.
    addressee: "Наниматель"

  residents_control:
    text: >
      В {doc_names} не указан список проживающих лиц. Просим включить: перечень лиц
      с правом проживания, ограничения на вселение третьих лиц, условия для временных
      жильцов (до 6 месяцев по ст. 680 ГК РФ).
    addressee: "Обе стороны"

  ownership_verification_check:
    text: >
      Просим предоставить по {doc_names}: актуальную выписку ЕГРН (не старше 30 дней),
      подтверждающую право собственности наймодателя и отсутствие обременений.
      Это критическая проверка для защиты от мошенничества.
    addressee: "Наймодатель"

  ownership_proof:
    text: >
      В {doc_names} отсутствует ссылка на правоустанавливающие документы наймодателя.
      Просим предоставить: выписку ЕГРН, реквизиты свидетельства/записи о праве.
    addressee: "Наймодатель"

  mortgage_encumbrance_on_premises:
    text: >
      Выявлены признаки ипотеки на помещение в {doc_names}. Просим предоставить:
      (а) согласие залогодержателя (банка) на сдачу в наем;
      (б) выписку из договора ипотеки о допустимости передачи в наем;
      (в) актуальную выписку ЕГРН с разделом об обременениях.
      Нарушение ст. 346 ГК РФ / ст. 40 ФЗ-102 может повлечь досрочное истребование кредита.
    addressee: "Наймодатель / Банк-залогодержатель"

  termination_and_eviction_analysis:
    text: >
      Просим проверить условия расторжения в {doc_names} на соответствие ст. 687 ГК РФ:
      наймодатель может расторгнуть договор ТОЛЬКО через суд. Условия о внесудебном
      выселении ничтожны. Просим также указать: срок предупреждения нанимателем (не менее
      3 месяцев), основания расторжения наймодателем, порядок возврата депозита.
    addressee: "Юридический советник"

  eviction_grounds_judicial:
    text: >
      В {doc_names} необходимо указать, что выселение нанимателя возможно ТОЛЬКО
      в судебном порядке (ст. 687 ГК РФ). Просим убрать условия о внесудебном
      выселении, если они есть, — они ничтожны.
    addressee: "Юридический советник наймодателя"

  landlord_access_rights:
    text: >
      Просим уточнить в {doc_names} порядок посещения помещения наймодателем:
      предварительное уведомление (за сколько дней), присутствие нанимателя,
      ограничение частоты, исключения для экстренных ситуаций.
      Напоминаем: жилище неприкосновенно (ст. 25 Конституции РФ).
    addressee: "Обе стороны"

  landlord_access_regulated:
    text: >
      В {doc_names} не регламентирован порядок доступа наймодателя в помещение.
      Просим включить: предварительное согласование, ограничение частоты,
      присутствие нанимателя, экстренные случаи.
    addressee: "Юридический советник"

  registration_procedure:
    text: >
      Просим уточнить в {doc_names}: обязан ли наймодатель содействовать временной
      регистрации нанимателя по месту пребывания, в какой срок, какие документы
      предоставляет. Отказ в содействии может повлечь штраф (ФЗ № 5242-1).
    addressee: "Наймодатель"

  registration_assistance:
    text: >
      В {doc_names} отсутствует обязательство наймодателя по содействию в регистрации.
      Просим включить: обязательство предоставить документы, срок, порядок.
    addressee: "Юридический советник"

  foreign_tenant_migration_check:
    text: >
      Наниматель по {doc_names} — иностранный гражданин. Просим уточнить:
      (а) обязательство наймодателя как принимающей стороны по уведомлению о прибытии
      (ФЗ-109, срок 7 рабочих дней); (б) документы нанимателя (паспорт, миграционная
      карта, РВП/ВНЖ); (в) порядок продления миграционного учёта.
    addressee: "Наймодатель / Юридический советник"

  sublease_prohibition_check:
    text: >
      Просим уточнить в {doc_names} позицию по поднайму (ст. 685 ГК РФ):
      запрещён / допускается с согласия наймодателя. Если допускается — условия.
    addressee: "Обе стороны"

  sublease_prohibition:
    text: >
      В {doc_names} не урегулирован вопрос поднайма. По ст. 685 ГК РФ поднаем допускается
      с согласия наймодателя. Просим включить явный запрет или условия.
    addressee: "Юридический советник"

  handover_act_requirements:
    text: >
      Просим уточнить в {doc_names}: требуется ли акт приема-передачи, опись имущества
      (для меблированного жилья), фотофиксация, фиксация показаний счётчиков,
      зеркальный акт при возврате помещения.
    addressee: "Обе стороны"

  handover_act_presence:
    text: >
      В {doc_names} не предусмотрен акт приема-передачи. Просим включить требование
      о составлении акта с описанием состояния помещения и показаний счётчиков.
    addressee: "Юридический советник"

  current_and_capital_repair_allocation:
    text: >
      Просим уточнить в {doc_names} распределение ремонтных обязанностей:
      текущий ремонт (по умолчанию — наниматель), капитальный ремонт
      (по умолчанию — наймодатель, ст. 681 ГК РФ). Если капремонт переложен
      на нанимателя — просим обосновать и согласовать компенсацию.
    addressee: "Обе стороны"

  pet_policy:
    text: >
      Просим уточнить в {doc_names} условия содержания домашних животных:
      допускается / запрещено, виды животных, ограничения, дополнительный депозит.
    addressee: "Обе стороны"

  smoking_policy:
    text: >
      Просим уточнить в {doc_names} условия о курении: запрет / разрешение,
      штрафные санкции за нарушение, порядок проветривания.
    addressee: "Обе стороны"

  renovation_restrictions:
    text: >
      Просим уточнить в {doc_names} ограничения на ремонт/перепланировку:
      что допускается без согласия, что требует согласования, запрет на перепланировку.
    addressee: "Обе стороны"

  liability_for_damage:
    text: >
      Просим уточнить в {doc_names} ответственность за повреждение имущества:
      порядок фиксации ущерба, оценка, порядок возмещения (из депозита / сверх),
      исключение естественного износа.
    addressee: "Юридический советник"

  fire_safety_clause:
    text: >
      Просим включить в {doc_names} обязательство нанимателя по соблюдению правил
      пожарной безопасности, запрет хранения легковоспламеняющихся веществ,
      обязанность не блокировать эвакуационные выходы.
    addressee: "Юридический советник"

  insurance_of_premises:
    text: >
      Просим уточнить в {doc_names}: предусмотрено ли страхование помещения
      и/или имущества, кто оплачивает полис, выгодоприобретатель, минимальная
      страховая сумма.
    addressee: "Обе стороны"

  force_majeure_clause:
    text: >
      Просим включить в {doc_names} оговорку о форс-мажоре: перечень обстоятельств,
      порядок уведомления, последствия для обязательств сторон, срок приостановки.
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим уточнить в {doc_names}: порядок разрешения споров (претензионный порядок,
      срок ответа на претензию), подсудность (по месту нахождения помещения / по месту
      жительства ответчика).
    addressee: "Юридический советник"

  legal_entity_as_tenant_prohibition:
    text: >
      Внимание: в {doc_names} нанимателем указано юридическое лицо. По ст. 671 ГК РФ
      нанимателем может быть только гражданин. Для юридических лиц необходимо заключать
      договор аренды (§ 1 Гл. 34 ГК РФ). Просим переоформить.
    addressee: "Юридический советник"

  non_residential_premises_prohibition:
    text: >
      Внимание: в {doc_names} предметом найма указано нежилое помещение (апартаменты/офис).
      По ст. 673 ГК РФ предметом найма может быть только жилое помещение.
      Просим переквалифицировать в договор аренды.
    addressee: "Юридический советник"

  unilateral_eviction_void:
    text: >
      Внимание: в {doc_names} выявлены условия о внесудебном выселении нанимателя.
      Такие условия ничтожны (ст. 687 ГК РФ, ст. 168 ГК РФ). Просим исключить
      и заменить на судебный порядок расторжения.
    addressee: "Юридический советник наймодателя"

  mortgaged_premises_consent_required:
    text: >
      Внимание: помещение в {doc_names} может находиться в ипотеке.
      Без согласия залогодержателя сдача в наем может быть оспорена (ст. 346 ГК РФ).
      Просим предоставить согласие банка или выписку из договора ипотеки.
    addressee: "Наймодатель"

  daily_rental_reclassify:
    text: >
      Внимание: в {doc_names} выявлены признаки посуточной аренды / гостиничных услуг.
      Это не является наймом жилого помещения по Гл. 35 ГК РФ. С 01.10.2019 (ФЗ-59)
