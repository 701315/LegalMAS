    detector_type: "hybrid"
    rules:
      keywords:
        - "плата за наем"
        - "плата за найм"
        - "арендная плата"
        - "ежемесячная плата"
        - "рублей в месяц"
        - "оплата"
        - "до числа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)плата.*составляет.*\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽).*в\\s*месяц"
        - "(?i)до\\s+(\\d{1,2})[-го]*\\s*(числа|дня)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор найма жилого помещения.
        Найди условия оплаты найма.

        Ответь строго в JSON:
        {
          "rent_amount": "<сумма в рублях или not_found>",
          "payment_frequency": "<monthly / quarterly / annually / not_found>",
          "payment_due_date": "<до какого числа или not_found>",
          "payment_method": "<cash / bank_transfer / card / not_specified / not_found>",
          "first_payment_terms": "<условия первого платежа или not_found>",
          "rent_increase_conditions": "<условия повышения или not_found>"
        }

        ВАЖНО: Если размер платы не указан, договор может быть признан незаключённым (ст. 682 ГК РФ).
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "плата"
        - "оплата"
        - "рублей"
        - "ежемесячно"
        - "до числа"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "rent_amount"
          type: "number"
          keyword_hints: ["плата", "составляет", "рублей"]
          unit: "RUB"
          description: "Размер платы за наем"
        - name: "payment_due_date"
          type: "string"
          keyword_hints: ["до", "числа", "ежемесячно"]
          description: "Срок оплаты"
      store_payload: true

  - id: security_deposit_terms
    name: "Страховой депозит: сумма, условия возврата"
    description: "Анализирует условия депозита — частый источник споров"
    triggers:
      any: ["security_deposit_present"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страховой депозит"
        - "залог"
        - "обеспечительный платеж"
        - "депозит в размере"
        - "возврат депозита"
        - "удержание"
        - "естественный износ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)депозит.*\\d+.*руб"
        - "(?i)залог.*в.*размере"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор найма жилого помещения.
        Найди условия страхового депозита (залога).

        Ответь строго в JSON:
        {
          "deposit_amount": "<сумма или not_found>",
          "deposit_purpose": "<описание назначения или not_found>",
          "return_conditions": "<условия возврата или not_found>",
          "return_deadline_days": "<срок возврата в днях или not_found>",
          "natural_wear_excluded": "<yes / no / not_specified / not_found>",
          "deduction_grounds": "<основания удержания или not_found>"
        }

        ВАЖНО: Частый риск — удержание депозита под предлогом "естественного износа",
        что незаконно. Проверь, исключён ли естественный износ из оснований удержания.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "депозит"
        - "залог"
        - "возврат"
        - "удержание"
        - "износ"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "deposit_amount"
          type: "number"
          keyword_hints: ["депозит", "залог", "в размере"]
          unit: "RUB"
          description: "Сумма депозита"
        - name: "natural_wear_excluded"
          type: "string"
          allowed_values: ["yes", "no", "not_specified", "not_found"]
          description: "Исключён ли естественный износ из оснований удержания"
      store_payload: true

  - id: utilities_allocation
    name: "Коммунальные услуги: распределение и порядок оплаты (ст. 678 ГК РФ)"
    description: "Анализирует распределение оплаты ЖКУ между сторонами"
    triggers:
