      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим[оа]е\\s+прав"
        - "(?i)injunctive\\s+relief"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA) (ст. 99 АПК РФ; ст. 139 ГПК РФ).
        Проверяется только один вопрос: применимое право, разрешение споров
        и обеспечительные меры.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Применимое право.
        2. Способ разрешения споров (суд / арбитраж / переговоры).
        3. Подсудность / юрисдикция.
        4. Претензионный порядок и срок ответа.
        5. Право на обеспечительные меры (injunctive relief).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящее соглашение регулируется правом Российской Федерации.
        Все споры подлежат рассмотрению в Арбитражном суде г. Москвы.
        Стороны обязаны соблюдать претензионный порядок: срок ответа — 15 дней.
        Раскрывающая сторона вправе требовать обеспечительных мер в виде
        судебного запрета на использование конфиденциальной информации."

        Ответ:
