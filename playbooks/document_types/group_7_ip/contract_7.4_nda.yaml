      negative_keywords:
        - "исключения"
        - "не является конфиденциальной"
        - "общедоступная"
        - "была известна"
        - "независимо разработана"
        - "срок действия"
        - "штраф"
        - "неустойка"
        - "возврат"
        - "уничтожение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
