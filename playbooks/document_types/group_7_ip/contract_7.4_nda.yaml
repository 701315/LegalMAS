      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о сторонах, типе NDA
        (односторонний/двусторонний) и цели раскрытия информации.
        Не анализируй определение конфиденциальной информации, исключения,
        меры защиты, ответственность или срок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. disclosing_party_status — "defined" или "not_defined".
        2. disclosing_party_details — наименование и реквизиты раскрывающей стороны.
        3. receiving_party_status — "defined" или "not_defined".
        4. receiving_party_details — наименование и реквизиты получающей стороны.
        5. nda_type — "unilateral" / "mutual" / "not_defined".
        6. nda_type_details — описание типа NDA.
        7. purpose_status — "defined" или "not_defined".
        8. purpose_details — цель раскрытия информации.
        9. use_restriction_status — "defined" или "not_defined".
        10. use_restriction_details — ограничение использования информации.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - nda_type: "unilateral" — если информация раскрывается только одной стороной;
          "mutual" — если обе стороны обмениваются информацией;
          "not_defined" — если тип прямо не указан.
        - Верни только JSON.
        </rules>
      fields:
        - name: "disclosing_party_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации раскрывающей стороны."
          required: true
        - name: "disclosing_party_details"
          type: "string"
          presentation: "fact"
          label: "Раскрывающая сторона"
          description: "Наименование и реквизиты раскрывающей стороны."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "receiving_party_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации получающей стороны."
          required: true
        - name: "receiving_party_details"
          type: "string"
          presentation: "fact"
          label: "Получающая сторона"
          description: "Наименование и реквизиты получающей стороны."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "nda_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["unilateral", "mutual", "not_defined"]
          description: "Тип NDA."
          required: true
        - name: "nda_type_details"
          type: "string"
          presentation: "fact"
          label: "Тип NDA"
          description: "Описание типа NDA."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "purpose_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания цели раскрытия."
          required: true
        - name: "purpose_details"
          type: "string"
          presentation: "fact"
          label: "Цель раскрытия"
          description: "Цель раскрытия конфиденциальной информации."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "use_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничения использования."
          required: false
        - name: "use_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение использования"
          description: "Ограничение использования информации целью."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Определение конфиденциальной информации
  # ──────────────────────────────────────────────────────────────────────────
  - id: confidential_info_definition_check
    name: "Определение конфиденциальной информации и проверка на catch-all"
    description: >
      Фактографическая проверка определения конфиденциальной информации:
      категории, конкретный перечень, примеры, требование маркировки,
      а также выявление чрезмерно широких catch-all формулировок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
        - "категории информации"
        - "любая информация"
        - "вся информация"
        - "в любой форме"
        - "без ограничений"
        - "маркировка"
        - "пометка"
        - "гриф"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциальн[а-яё]+\\s+информац"
        - "(?i)(любая|вся)\\s+информаци"
        - "(?i)в\\s+любой\\s+форме"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA) (ФЗ-98 ст. 3; ст. 1465 ГК РФ).
        Проверяется только один вопрос: определение конфиденциальной информации.

        Нормативный ориентир:
        - ФЗ-98 ст. 3 — понятие коммерческой тайны
        - ст. 1465 ГК РФ — секрет производства (ноу-хау)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Фиксируй наличие catch-all формулировок как факт, не как оценку.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие определения конфиденциальной информации.
        2. Тип определения (категории / конкретный перечень / оба / неясно).
        3. Перечень категорий информации.
        4. Примеры конфиденциальной информации.
        5. Требование маркировки «Конфиденциально».
        6. Наличие catch-all формулировок («любая информация», «в любой форме»).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — определение с категориями:
        Фрагмент:
        "Конфиденциальная информация означает любую информацию, раскрытую
        Раскрывающей стороной, включая: (а) технические данные, ноу-хау,
        рецептуры; (б) финансовые показатели; (в) клиентскую базу;
        (г) бизнес-планы. Информация должна быть помечена грифом
        «Конфиденциально»."

        Ответ:
        {
          "definition_status": "defined",
          "definition_type": "both",
          "definition_type_details": "категории и примеры: технические данные, ноу-хау, рецептуры; финансовые показатели; клиентская база; бизнес-планы",
          "categories_status": "defined",
          "categories_details": "технические данные, ноу-хау, рецептуры; финансовые показатели; клиентская база; бизнес-планы",
          "examples_status": "defined",
          "examples_details": "технические данные, ноу-хау, рецептуры",
          "marking_required_status": "defined",
          "marking_required_details": "помечена грифом «Конфиденциально»",
          "catch_all_phrases_status": "defined",
          "catch_all_phrases_details": "любую информацию, раскрытую Раскрывающей стороной",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Конфиденциальная информация означает любую информацию, раскрытую Раскрывающей стороной, включая: (а) технические данные, ноу-хау, рецептуры..."
            }
          ]
        }

        Пример 2 — определение отсутствует:
        Фрагмент:
        "Стороны обязуются не разглашать информацию."

        Ответ:
        {
          "definition_status": "not_defined",
          "definition_type": "not_defined",
          "definition_type_details": "Данные не определены",
          "categories_status": "not_defined",
          "categories_details": "Данные не определены",
          "examples_status": "not_defined",
          "examples_details": "Данные не определены",
          "marking_required_status": "not_defined",
          "marking_required_details": "Данные не определены",
          "catch_all_phrases_status": "not_defined",
          "catch_all_phrases_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с определением конфиденциальной информации.
        2. Определи тип определения (категории / перечень / оба).
        3. Найди прямую цитату о маркировке.
        4. Найди прямые catch-all формулировки.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "definition_status": "<defined / not_defined>",
          "definition_type": "<categories / specific_list / both / unclear / not_defined>",
          "definition_type_details": "<текст или 'Данные не определены'>",
          "categories_status": "<defined / not_defined>",
          "categories_details": "<текст или 'Данные не определены'>",
          "examples_status": "<defined / not_defined>",
          "examples_details": "<текст или 'Данные не определены'>",
          "marking_required_status": "<defined / not_defined>",
          "marking_required_details": "<текст или 'Данные не определены'>",
          "catch_all_phrases_status": "<defined / not_defined>",
          "catch_all_phrases_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "конфиденциальная информация определение включает не ограничиваясь категории информации любая информация вся информация в любой форме без ограничений маркировка пометка гриф Конфиденциально but not limited to including"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
