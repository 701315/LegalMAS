  - id: liability_breach_notification_check
    name: "Ответственность за нарушение и уведомление об утечке"
    description: >
      Фактографическая проверки штрафных санкций за нарушение NDA,
      возмещения убытков и обязанности уведомления о нарушении/утечке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штраф"
        - "неустойка"
        - "штрафные санкции"
        - "компенсация убытков"
        - "ответственность за нарушение"
        - "penalty"
        - "liquidated damages"
        - "уведомление о нарушении"
        - "уведомление об утечке"
        - "breach notification"
        - "немедленное уведомление"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф.*?\\d[\\d\\s]*(?:руб|USD|EUR)"
        - "(?i)неустойка.*?\\d+[.,]?\\d*\\s*%"
        - "(?i)уведомлени[ея].*?(нарушени|утечк)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA) (ст. 330, 393 ГК РФ).
        Проверяется только один вопрос: ответственность за нарушение
        и уведомление об утечке.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие штрафной неустойки за нарушение.
        2. Размер штрафа.
        3. Право на возмещение убытков.
        4. Обязанность уведомления о нарушении/утечке.
        5. Срок уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За нарушение обязательств конфиденциальности Получающая сторона
        уплачивает штраф в размере 5 000 000 рублей. Уплата штрафа не
        освобождает от возмещения убытков. Получающая сторона обязана
        уведомить Раскрывающую сторону о любом нарушении или утечке
        в течение 24 часов."

        Ответ:
        {
          "penalty_clause_status": "defined",
          "penalty_clause_details": "штраф в размере 5 000 000 рублей",
          "penalty_amount_status": "defined",
          "penalty_amount_details": "5 000 000 рублей",
          "damages_status": "defined",
          "damages_details": "уплата штрафа не освобождает от возмещения убытков",
          "breach_notification_status": "defined",
          "breach_notification_details": "уведомить в течение 24 часов",
          "evidence": [{"clause_ref": "п. 6.1", "quote": "За нарушение обязательств конфиденциальности Получающая сторона уплачивает штраф в размере 5 000 000 рублей."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством."

        Ответ:
        {
          "penalty_clause_status": "not_defined",
          "penalty_clause_details": "Данные не определены",
          "penalty_amount_status": "not_defined",
          "penalty_amount_details": "Данные не определены",
          "damages_status": "not_defined",
          "damages_details": "Данные не определены",
          "breach_notification_status": "not_defined",
          "breach_notification_details": "Данные не определены",
