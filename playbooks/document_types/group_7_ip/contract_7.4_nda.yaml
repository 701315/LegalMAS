          "perpetual_details": "<текст или 'Данные не определены'>",
          "survival_clause_status": "<defined / not_defined>",
          "survival_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
