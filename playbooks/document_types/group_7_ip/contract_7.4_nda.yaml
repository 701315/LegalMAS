type: contract_7.4_nda
name: "Соглашение о неразглашении конфиденциальной информации (NDA)"
version: 6.0
parent: class_7_intellectual_property
description: |
  Соглашение, по которому одна или обе стороны обязуются сохранять конфиденциальность
  информации, полученной в ходе переговоров, сотрудничества или иного взаимодействия.
  Может быть ОДНОСТОРОННИМ (только одна сторона раскрывает) или ДВУСТОРОННИМ/ВЗАИМНЫМ
  (обе стороны обмениваются конфиденциальной информацией).
  Цель — защита коммерческой тайны, ноу-хау, персональных данных и иных ценных сведений
  от несанкционированного разглашения.
  Ключевой инструмент при M&A, инвестициях, партнёрствах, IT-разработке.
  Регулируется ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422.
metadata:
  category: agreement
  subcategory: intellectual_property
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422"
  doc_types_supported:
    - "соглашение о неразглашении"
    - "соглашение о конфиденциальности"
    - "договор о неразглашении"
    - "соглашение о защите коммерческой тайны"
    - "двустороннее соглашение о конфиденциальности"
    - "соглашение о защите информации"
    - "NDA"
    - "Non-Disclosure Agreement"
    - "Confidential Disclosure Agreement"
    - "non-disclosure agreement"
    - "NDCA"
    - "confidentiality agreement"
    - "confidential information agreement"
    - "proprietary information agreement"
    - "secrecy agreement"
    - "confidentiality deed"
    - "mutual NDA"
    - "MNDA"
    - "unilateral NDA"
    - "CDA"
    - "confidentiality and non-use agreement"
    - "non-circumvention agreement"

