  # CHECK 10: Применимое право, разрешение споров, обеспечительные меры
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_resolution_check
    name: "Применимое право, разрешение споров и обеспечительные меры"
    description: >
      Фактографическая проверка применимого права, порядка разрешения споров
