        - "меры защиты"
        - "срок действия"
        - "штраф"
        - "неустойка"
        - "возврат информации"
        - "уничтожение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 7
