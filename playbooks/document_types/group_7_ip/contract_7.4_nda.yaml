type: contract_7.4_nda
name: "Соглашение о неразглашении конфиденциальной информации (NDA)"

description: |
  Соглашение, по которому одна или обе стороны обязуются сохранять конфиденциальность
  информации, полученной в ходе переговоров, сотрудничества или иного взаимодействия.
  Может быть ОДНОСТОРОННИМ (только одна сторона раскрывает) или ДВУСТОРОННИМ/ВЗАИМНЫМ
  (обе стороны обмениваются конфиденциальной информацией).
  Цель — защита коммерческой тайны, ноу-хау, персональных данных и иных ценных сведений
  от несанкционированного разглашения.
  Ключевой инструмент при M&A, инвестициях, партнёрствах, IT-разработке.
  Регулируется ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422.

version: 4.0
parent: class_7_intellectual_property

metadata:
  category: agreement
  subcategory: intellectual_property
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422"
  doc_types_supported:
    - "соглашение о неразглашении"
    - "соглашение о конфиденциальности"
    - "договор о неразглашении"
    - "соглашение о защите коммерческой тайны"
    - "двустороннее соглашение о конфиденциальности"
    - "соглашение о защите информации"

    - "NDA"
    - "Non-Disclosure Agreement"
    - "Confidential Disclosure Agreement"
    - "non-disclosure agreement"
    - "NDA"
    - "NDCA"
    - "confidentiality agreement"
    - "confidential information agreement"
    - "proprietary information agreement"
    - "secrecy agreement"
    - "confidentiality deed"
    - "mutual NDA"
    - "MNDA"
    - "unilateral NDA"
    - "CDA"
    - "confidentiality and non-use agreement"
    - "non-circumvention agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.78
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.17
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*неразглашени[яи]\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование соглашения о неразглашении

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*конфиденциальност[аи]\\b"
        kind: specific_subject
        weight: 0.98
        # Соглашение о конфиденциальности — прямой русский маркер NDA

      - pattern: "(?i)\\bдоговор[\\s_.-]*о[\\s_.-]*неразглашени[яи]\\b"
        kind: specific_subject
        weight: 0.97
        # Договор о неразглашении — из supported types

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*защит[а-я]*[\\s_.-]*(?:коммерческ[а-я]*[\\s_.-]*тайн[а-я]*|информаци[яи])\\b"
        kind: specific_subject
        weight: 0.96
        # Защита коммерческой тайны / защита информации — из supported types

      - pattern: "(?i)\\b(?:двустороннее|взаимное)[\\s_.-]*соглашени[ея][\\s_.-]*о[\\s_.-]*конфиденциальност[аи]\\b"
        kind: specific_subject
        weight: 0.97
        # Двустороннее / взаимное NDA — из supported types

      - pattern: "(?i)\\bнеразглашени[яи]\\b"
        kind: specific_subject
        weight: 0.88
        # Базовый русский маркер неразглашения; достаточно специфичен в документарном контексте

      - pattern: "(?i)(?<![A-Za-z])NDA(?![A-Za-z])"
        kind: specific_subject
        weight: 0.96
        # NDA — прямая и общепринятая аббревиатура; очень специфична

      - pattern: "(?i)(?<![A-Za-z])MNDA(?![A-Za-z])"
        kind: specific_subject
        weight: 0.96
        # MNDA — mutual NDA, из supported types

      - pattern: "(?i)(?<![A-Za-z])NDCA(?![A-Za-z])"
        kind: specific_subject
        weight: 0.90
        # NDCA — Non-Disclosure and Confidentiality Agreement, из supported types

      - pattern: "(?i)\\bnon[\\s_.-]*disclosure[\\s_.-]*(?:agreement|contract|deed)?\\b"
        kind: specific_subject
        weight: 0.98
        # Non-disclosure agreement — полная английская форма NDA

      - pattern: "(?i)\\bconfidentiality[\\s_.-]*(?:agreement|deed|contract)\\b"
        kind: specific_subject
        weight: 0.96
        # Confidentiality agreement / deed — прямой маркер NDA

      - pattern: "(?i)\\bconfidential[\\s_.-]*(?:disclosure|information)[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.96
        # Confidential Disclosure Agreement / CDA с раскрытием — из supported types

      - pattern: "(?i)\\b(?:mutual|unilateral)[\\s_.-]*(?:non[\\s_.-]*disclosure|NDA|confidentiality)[\\s_.-]*(?:agreement|deed)?\\b"
        kind: specific_subject
        weight: 0.96
        # Mutual / unilateral NDA — из supported types, важные режимные маркеры

      - pattern: "(?i)\\bsecrecy[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.90
        # Secrecy agreement — из supported types, прямой синоним NDA

      - pattern: "(?i)\\bproprietary[\\s_.-]*information[\\s_.-]*(?:agreement|contract)?\\b"
        kind: specific_subject
        weight: 0.84
        # Proprietary information agreement — из supported types; чуть ниже — может входить в IP/employment пакет

      - pattern: "(?i)\\bconfidentiality[\\s_.-]*and[\\s_.-]*non[\\s_.-]*use[\\s_.-]*(?:agreement|contract)?\\b"
        kind: specific_subject
        weight: 0.92
        # Confidentiality and non-use agreement — из supported types, расширенная NDA-форма

      - pattern: "(?i)(?<![A-Za-z])CDA(?![A-Za-z])"
        kind: generic_form
        weight: 0.62
        # CDA — из supported types, но короткая аббревиатура с риском коллизии (Commercial Development Agreement и др.)

      - pattern: "(?i)\\bnon[\\s_.-]*circumvention[\\s_.-]*(?:agreement|contract)?\\b"
        kind: generic_form
        weight: 0.52
        # Non-circumvention — из supported types, но отдельное обязательство; часто идёт в пакете NCNDA

      - pattern: "(?i)\\bconfidential\\b"
        kind: context
        weight: 0.18
        # Confidential без agreement/NDA-квалификатора: confidential memo, confidential report и т.п.

      - pattern: "(?i)\\bконфиденциальн[а-я]*\\b"
        kind: context
        weight: 0.16
        # Конфиденциальный без соглашение-квалификатора слишком широко


    folder_patterns:
      - pattern: "(?i)(?:соглашени[ея]|договор)[_\\s-]*(?:о[_\\s-]*)?(?:неразглашени[яи]|конфиденциальност[аи])"
        kind: specific_subject
        weight: 0.88
        # Прямые русскоязычные NDA-папки

      - pattern: "(?i)(?<![A-Za-z])NDA(?![A-Za-z])|(?<![A-Za-z])MNDA(?![A-Za-z])|(?<![A-Za-z])NDCA(?![A-Za-z])"
        kind: specific_subject
        weight: 0.90
        # NDA / MNDA / NDCA — явные аббревиатурные folder-markers

      - pattern: "(?i)non[_\\s-]*disclosure[_\\s-]*(?:agreement)?|confidentiality[_\\s-]*(?:agreement|deed)?"
        kind: specific_subject
        weight: 0.86
        # Прямые англоязычные NDA folder-markers

      - pattern: "(?i)(?:mutual|unilateral)[_\\s-]*(?:nda|non[_\\s-]*disclosure|confidentiality)"
        kind: specific_subject
        weight: 0.86
        # Режимные NDA папки — mutual / unilateral

      - pattern: "(?i)secrecy[_\\s-]*agreement|proprietary[_\\s-]*information[_\\s-]*(?:agreement)?|confidentiality[_\\s-]*and[_\\s-]*non[_\\s-]*use"
        kind: specific_subject
        weight: 0.82
        # Поддерживаемые NDA-формы в taxonomy папок

      - pattern: "(?i)защит[а-я]*[_\\s-]*(?:коммерческ[а-я]*[_\\s-]*тайн|информаци[яи])|коммерческ[а-я]*[_\\s-]*тайн"
        kind: specific_subject
        weight: 0.82
        # Защита коммерческой тайны / информации в taxonomy

      - pattern: "(?i)non[_\\s-]*circumvention|(?<![A-Za-z])CDA(?![A-Za-z])"
        kind: generic_form
        weight: 0.48
        # Non-circumvention / CDA: полезны в NDA-контексте, но шире или короче чистого NDA

      - pattern: "(?i)confidential|конфиденциальн"
        kind: context
        weight: 0.22
        # Confidential / конфиденциальный без NDA-уточнения слишком широкий folder-marker

      - pattern: "(?i)(?:intellectual[_\\s-]*property|IP|интеллектуальн[а-я]*[_\\s-]*собственност)"
        kind: context
        weight: 0.18
        # IP/ИС контекст: NDA часто живёт в IP-папке, но сама по себе не IP-сделка

    keywords:

      high:
        - pattern: "(?i)соглашен[иея]\\s+о\\s+неразглашен[иии]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Базовое русское название NDA в заголовке"

        - pattern: "(?i)договор\\s+о\\s+неразглашен[иии]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Альтернативная форма — договор о неразглашении"

        - pattern: "(?i)соглашен[иея]\\s+о\\s+конфиденциал[ьннойой\\s]*информац[иии]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Соглашение о конфиденциальной информации"

        - pattern: "(?i)соглашен[иея]\\s+о\\s+защит[еы]\\s+коммерческ[ойой]\\s+тайн[ыеи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Соглашение о защите коммерческой тайны"

        - pattern: "(?i)коммерческ[аяое]\\s+тайн[аеи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Коммерческая тайна как предмет защиты NDA"

        - pattern: "(?i)non-?disclosure\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Англоязычное название NDA"

        - pattern: "(?i)confidential\\s+disclosure\\s+agreement"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "CDA — синоним NDA"

        - pattern: "(?i)\\bnda\\b"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Аббревиатура NDA"

        - pattern: "(?i)неразглашен[иеи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Обязательство неразглашения информации"

        - pattern: "(?i)конфиденциал[ьннаяость]+"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Ссылки на конфиденциальность и конфиденциальную информацию"

        - pattern: "(?i)режим\\s+конфиденциал[ьнности]+"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Установление режима конфиденциальности"

        - pattern: "(?i)конфиденциал[ьннаяая]\\s+информац[ияи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Определение конфиденциальной информации"

        - pattern: "(?i)фз-?98\\b"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Прямая ссылка на ФЗ-98 «О коммерческой тайне»"

      medium:
        - pattern: "(?i)\\bdisclosing\\s+party\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Disclosing Party — раскрывающая сторона в англоязычном NDA"

        - pattern: "(?i)\\breceiving\\s+party\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Receiving Party — получающая сторона в англоязычном NDA"

        - pattern: "(?i)раскрывающ[а-яё]+\\s+сторон[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Раскрывающая сторона"

        - pattern: "(?i)получающ[а-яё]+\\s+сторон[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Получающая сторона"

        - pattern: "(?i)\\bноу-?хау\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Ноу-хау как типичный объект, защищаемый NDA"

        - pattern: "(?i)секрет\\s+производств[аа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Секрет производства / trade secret"

        - pattern: "(?i)исключени[яя]\\s+из\\s+конфиденциальност[ии]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Перечень исключений из режима конфиденциальности"

      low:
        - pattern: "(?i)\\bConfidential\\s+Disclosure\\s+Agreement\\b"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Полное написание CDA"

        - pattern: "(?i)возврат\\s+информаци[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Возврат предоставленных материалов после прекращения NDA"

        - pattern: "(?i)персональн[ыо]е\\s+данн[ыо]е"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Персональные данные могут входить в объем конфиденциальной информации"

        - pattern: "(?i)служебн[а-яё]+\\s+тайн[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Служебная тайна как один из режимов защищаемой информации"

        - pattern: "(?i)уничтожени[яя]\\s+информаци[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Обязанность уничтожения информации вместо возврата"

        - pattern: "(?i)\\bresiduals\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Residuals clause — оговорка о неизбежных остаточных знаниях"

    exclusions:
      - pattern: "(?i)трудов[оа]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Упор на трудовой договор с отдельной конфиденциальностью — ближе к employment, а не standalone NDA"

      - pattern: "(?i)договор\\s+коммерческ[оа]й\\s+концесси[ии]"
        severity: hard
        weight: -1.0
        description: "Коммерческая концессия с условиями конфиденциальности — отдельный тип contract_7.3_franchise"

      - pattern: "(?i)лицензионн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Лицензионный договор с конфиденциальностью — тип contract_7.2_license"

      # ── Soft exclusion

      - pattern: "(?i)только\\s+как\\s+част[ььи]\\s+друг[оа]го\\s+договор[аа]"
        severity: soft
        weight: -0.35
        description: "Формулировка, что NDA действует лишь как часть иного договора, снижает уверенность в standalone-типе"

