# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: nda_parties_and_type_check
    name: "Стороны, тип NDA (односторонний/двусторонний) и цель раскрытия"
    description: >
      Фактографическая проверка идентификации раскрывающей и получающей сторон,
      типа NDA (односторонний/двусторонний/многосторонний) и цели раскрытия информации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "раскрывающая сторона"
        - "получающая сторона"
        - "disclosing party"
        - "receiving party"
        - "одностороннее"
        - "двустороннее"
        - "взаимное"
        - "многостороннее"
        - "цель раскрытия"
        - "для целей"
        - "в связи с"
        - "due diligence"
        - "M&A"
        - "инвестиции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(раскрывающ|получающ)[а-яё]+\\s+сторон"
        - "(?i)(односторонн|двусторонн|взаимн|многосторонн)[а-яё]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении конфиденциальной информации (NDA)
        (ФЗ-98 «О коммерческой тайне»; ГК РФ ст. 421, 422, 432; ст. 1465–1472).
        Проверяется только один вопрос: стороны, тип NDA и цель раскрытия.

        Нормативный ориентир:
        - ст. 432 ГК РФ — существенные условия договора.
        - ФЗ-98 ст. 3 — понятие коммерческой тайны и режима её охраны.
        - ГК РФ ст. 1465 — понятие секрета производства (ноу-хау).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентификация раскрывающей стороны (наименование, реквизиты).
        2. Идентификация получающей стороны.
        3. Тип NDA (односторонний / двусторонний / многосторонний / не указан).
        4. Цель раскрытия информации.
        5. Ограничение использования информации указанной целью.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к приложению, спецификации или
           иному документу («согласно Приложению №1», «в рамках проекта, описанного
           в Дополнительном соглашении») — это считается "defined", в details укажи
           ссылку (например, «определяется по Приложению №1»).
        4. Если данные не указаны в тексте прямо и нет отсылки — статус = "not_defined",
           текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — односторонний NDA с явной целью:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001), именуемое «Раскрывающая сторона»,
        и ООО «Бета» (ИНН 7700000002), именуемое «Получающая сторона».
        Информация раскрывается исключительно для целей проведения
        due diligence в связи с потенциальной сделкой M&A."

        Ответ:
        {
          "disclosing_party_status": "defined",
          "disclosing_party_details": "ООО «Альфа», ИНН 7700000001",
          "receiving_party_status": "defined",
          "receiving_party_details": "ООО «Бета», ИНН 7700000002",
          "nda_type_code": "unilateral",
          "nda_type_details": "одностороннее: ООО «Альфа» раскрывает, ООО «Бета» получает",
          "purpose_status": "defined",
          "purpose_details": "для целей проведения due diligence в связи с потенциальной сделкой M&A",
          "use_restriction_status": "defined",
          "use_restriction_details": "исключительно для целей due diligence",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001), именуемое «Раскрывающая сторона», и ООО «Бета» (ИНН 7700000002), именуемое «Получающая сторона». Информация раскрывается исключительно для целей проведения due diligence в связи с потенциальной сделкой M&A."
            }
          ]
        }

        Пример 2 — двусторонний NDA с отсылкой к приложению:
        Фрагмент:
        "Стороны — ООО «Гамма» (ИНН 7700000003) и АО «Дельта» (ИНН 7700000004) —
        взаимно обмениваются конфиденциальной информацией в рамках проекта,
        описанного в Приложении №1 к настоящему Соглашению. Полученная информация
        может использоваться исключительно в целях данного проекта."

        Ответ:
        {
          "disclosing_party_status": "defined",
          "disclosing_party_details": "ООО «Гамма», ИНН 7700000003 (в роли раскрывающей и получающей стороны одновременно)",
          "receiving_party_status": "defined",
          "receiving_party_details": "АО «Дельта», ИНН 7700000004 (в роли раскрывающей и получающей стороны одновременно)",
          "nda_type_code": "mutual",
          "nda_type_details": "двусторонний: обе стороны обмениваются информацией",
          "purpose_status": "defined",
          "purpose_details": "в рамках проекта, определяется по Приложению №1",
          "use_restriction_status": "defined",
          "use_restriction_details": "исключительно в целях проекта, описанного в Приложении №1",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Стороны — ООО «Гамма» (ИНН 7700000003) и АО «Дельта» (ИНН 7700000004) — взаимно обмениваются конфиденциальной информацией в рамках проекта, описанного в Приложении №1 к настоящему Соглашению."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящее соглашение о неразглашении."

        Ответ:
        {
          "disclosing_party_status": "not_defined",
          "disclosing_party_details": "Данные не определены",
          "receiving_party_status": "not_defined",
          "receiving_party_details": "Данные не определены",
          "nda_type_code": "not_defined",
          "nda_type_details": "Данные не определены",
          "purpose_status": "not_defined",
          "purpose_details": "Данные не определены",
          "use_restriction_status": "not_defined",
          "use_restriction_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата с идентификацией раскрывающей стороны?
        2. Найдена ли прямая цитата с идентификацией получающей стороны?
        3. Определён ли тип NDA (unilateral / mutual / multilateral / not_defined)?
        4. Найдена ли прямая цитата о цели раскрытия (или отсылка к приложению)?
        5. Найдена ли прямая цитата об ограничении использования?
        6. Все ли статус-поля содержат только значения из allowed_values?
        7. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosing_party_status": "<defined / not_defined>",
          "disclosing_party_details": "<текст или 'Данные не определены'>",
          "receiving_party_status": "<defined / not_defined>",
          "receiving_party_details": "<текст или 'Данные не определены'>",
          "nda_type_code": "<unilateral / mutual / multilateral / not_defined>",
          "nda_type_details": "<текст или 'Данные не определены'>",
          "purpose_status": "<defined / not_defined>",
          "purpose_details": "<текст или 'Данные не определены'>",
          "use_restriction_status": "<defined / not_defined>",
          "use_restriction_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "раскрывающая сторона получающая сторона принимающая сторона раскрывающую сторону принимающую сторону disclosing party receiving party именуемое именуемый именуемая именуемые заключили настоящий договор заключили настоящее соглашение в лице действующего действующей на основании доверенность доверенности устав устава представитель представителя подписант преамбула стороны сторон реквизиты одностороннее двустороннее взаимное многостороннее NDA цель раскрытия для целей в связи с due diligence M&A инвестиции ограничение использования"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - confidentiality
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      boost_keywords:
        - "именуем"
        - "именуемый"
        - "именуемая"
        - "именуемое"
        - "заключили"
        - "в лице"
        - "действующего на основании"
        - "принимающая сторона"
        - "раскрывающая сторона"
        - "представитель"
        - "доверенност"
        - "устав"
        - "преамбула"
      negative_keywords:
        - "исключения из конфиденциальной информации"
        - "меры защиты"
        - "срок действия соглашения"
        - "штраф"
        - "неустойка"
        - "возврат информации"
        - "уничтожение носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.4
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2500

      compact_output: false

      presence_signal:
        field: "nda_parties_and_type_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о сторонах, типе NDA
        (односторонний / двусторонний / многосторонний) и цели раскрытия информации.
        Не анализируй определение конфиденциальной информации, исключения,
        меры защиты, ответственность или срок действия.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей + evidence (всего 12 ключей):

        0. nda_parties_and_type_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disclosing_party_status, receiving_party_status, nda_type_code,
              purpose_status, use_restriction_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disclosing_party_status = "not_defined";
           - receiving_party_status = "not_defined";
           - nda_type_code = "not_defined";
           - purpose_status = "not_defined";
           - use_restriction_status = "not_defined";
           - disclosing_party_details, receiving_party_details = "Данные не определены";
           - nda_type_details, purpose_details, use_restriction_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. disclosing_party_status — "defined" или "not_defined".
        2. disclosing_party_details — наименование и реквизиты раскрывающей стороны.
        3. receiving_party_status — "defined" или "not_defined".
        4. receiving_party_details — наименование и реквизиты получающей стороны.
        5. nda_type_code — "unilateral" / "mutual" / "multilateral" / "not_defined".
        6. nda_type_details — описание типа NDA.
        7. purpose_status — "defined" или "not_defined".
        8. purpose_details — цель раскрытия информации.
        9. use_restriction_status — "defined" или "not_defined".
        10. use_restriction_details — ограничение использования информации указанной целью.

        Если данные отсутствуют в тексте и нет отсылки к приложению:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если параметр определяется через отсылку к приложению/спецификации:
        - статус = "defined"
        - в details укажи ссылку (например, «определяется по Приложению №1»).
        </task>

        <context_rules>
        - Перед остальными полями заполни nda_parties_and_type_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - nda_type_code:
          * "unilateral" — если информация раскрывается только одной стороной.
            Ключевой признак: в преамбуле одна сторона названа «Раскрывающей»
            (Disclosing Party), другая — «Принимающей» (Receiving Party).
            ВАЖНО: если получающая сторона обязуется обеспечивать конфиденциальность
            и не использовать информацию — это unilateral, а НЕ mutual.
            Mutual = только если ОБЕ стороны одновременно выступают и раскрывающей,
            и получающей (фразы «взаимно», «обмениваются», «каждая из Сторон
            раскрывает и получает»).
          * "mutual" — если две стороны обмениваются информацией взаимно.
            Ключевой признак: преамбула использует «взаимно», «Стороны обмениваются»,
            или обе стороны поименованы и как раскрывающие, и как получающие.
          * "multilateral" — если сторон три и более и они обмениваются информацией между собой;
          * "not_defined" — если тип прямо не указан и не следует из контекста.
        - В receiving_party_details при mutual/multilateral указывай контрагента(-ов),
          не совпадающего с disclosing_party_details, и отмечай двойную роль.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - use_restriction_status:
          * "defined" — если в документе указано, для каких целей можно использовать
            информацию (например: «для целей due diligence», «для формирования
            предмета и предложения о его приобретении», «исключительно для…»).
          * "not_defined" — если такой формулировки нет.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их ролей, ни типа NDA, ни цели раскрытия.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Стороны указаны, но тип NDA прямо не следует из текста;
           или тип указан, но цель раскрытия не определена.
           → presence = "present";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы NDA или разные стороны
           в одной и той же роли.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Отсылка на внешний документ.
           Цель раскрытия определяется через приложение / проект / дополнительное
           соглашение.
           → presence = "present";
             purpose_status = "defined";
             purpose_details содержит формулировку вида
             «определяется по Приложению №1».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для nda_parties_and_type_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для nda_type_code используй только:
          "unilateral", "mutual", "multilateral", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "nda_parties_and_type_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / типа NDA / цели раскрытия. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disclosing_party_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации раскрывающей стороны. Внутреннее enum-поле."
          required: true

        - name: "disclosing_party_details"
          type: "string"
          presentation: "fact"
          label: "Раскрывающая сторона"
          description: >
            Наименование и реквизиты раскрывающей стороны. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "receiving_party_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации получающей стороны. Внутреннее enum-поле."
          required: true

        - name: "receiving_party_details"
          type: "string"
          presentation: "fact"
          label: "Получающая сторона"
          description: >
            Наименование и реквизиты получающей стороны. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "nda_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["unilateral", "mutual", "multilateral", "not_defined"]
          display_in_grid: false
          description: "Тип NDA: односторонний, двусторонний, многосторонний или не определён. Внутреннее enum-поле."
          required: true

        - name: "nda_type_details"
          type: "string"
          presentation: "fact"
          label: "Тип NDA"
          description: >
            Описание типа NDA и распределения ролей раскрытия/получения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "purpose_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания цели раскрытия конфиденциальной информации. Внутреннее enum-поле."
          required: true

        - name: "purpose_details"
          type: "string"
          presentation: "fact"
          label: "Цель раскрытия"
          description: >
            Цель раскрытия конфиденциальной информации (принцип purpose limitation). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "use_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия ограничения использования информации указанной целью. Внутреннее enum-поле."
          required: true

        - name: "use_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение использования"
          description: >
            Формулировка ограничения использования конфиденциальной информации целью раскрытия. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: confidential_info_definition_check
    name: "Определение конфиденциальной информации и проверка на catch-all"
    description: >
      Фактографическая проверка определения конфиденциальной информации:
      тип определения (категории/перечень/оба), состав категорий, примеры,
      требование маркировки «Конфиденциально» и выявление чрезмерно широких
      catch-all формулировок, размывающих объём защищаемой информации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
        - "including but not limited to"
        - "категории информации"
        - "любая информация"
        - "вся информация"
        - "в любой форме"
        - "без ограничений"
        - "маркировка"
        - "пометка"
        - "гриф"
        - "Конфиденциально"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциальн[а-яё]+\\s+информац"
        - "(?i)(любая|вся)\\s+информаци"
        - "(?i)в\\s+любой\\s+форме"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 3, 10; ГК РФ ст. 1465, 432).
        Проверяется только один вопрос: определение конфиденциальной информации.

        Нормативный ориентир:
        - ФЗ-98 ст. 3 — понятие коммерческой тайны и информации, её составляющей.
        - ФЗ-98 ст. 10 — режим коммерческой тайны, включая маркировку «Коммерческая тайна».
        - ГК РФ ст. 1465 — секрет производства (ноу-хау).
        - ГК РФ ст. 432 — существенные условия договора.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Фиксируй наличие catch-all формулировок как факт, а не как оценку.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие определения конфиденциальной информации.
        2. Тип определения (общие категории / конкретный перечень / оба / размытое / отсутствует).
        3. Перечень категорий информации (общие типы: технические, финансовые, коммерческие и т.п.).
        4. Конкретные примеры внутри категорий (например, «список клиентов ООО X», «EBITDA за 2024»).
        5. Требование маркировки «Конфиденциально» / «Коммерческая тайна».
        6. Наличие catch-all формулировок («любая информация», «в любой форме», «без ограничений»).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к приложению, спецификации или
           иному документу («перечень приведён в Приложении №1») — это считается
           "defined", в details укажи ссылку (например, «определяется по Приложению №1»).
        4. Если данные не указаны в тексте прямо и нет отсылки — статус = "not_defined",
           текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. Различай "категории" (общие типы информации) и "примеры" (конкретные
           экземпляры внутри категорий). Если приведены только общие типы —
           это "categories", не "both".
        7. Для catch_all_phrases: "present" — если в тексте прямо присутствуют
           размывающие формулировки; "absent" — если определение конкретное;
           "not_defined" — если самого определения нет.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один валидный JSON-объект со всеми 12 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — определение с общими категориями и catch-all:
        Фрагмент:
        "Конфиденциальная информация означает любую информацию, раскрытую
        Раскрывающей стороной, включая, но не ограничиваясь: (а) технические
        данные и ноу-хау; (б) финансовые показатели; (в) клиентскую базу;
        (г) бизнес-планы. Информация должна быть помечена грифом «Конфиденциально»."

        Ответ:
        {
          "definition_status": "defined",
          "definition_type_code": "categories",
          "definition_type_details": "определены общие категории информации без указания конкретных экземпляров",
          "categories_status": "defined",
          "categories_details": "технические данные и ноу-хау; финансовые показатели; клиентская база; бизнес-планы",
          "examples_status": "not_defined",
          "examples_details": "Данные не определены",
          "marking_required_status": "defined",
          "marking_required_details": "информация должна быть помечена грифом «Конфиденциально»",
          "catch_all_phrases_code": "present",
          "catch_all_phrases_details": "«любую информацию, раскрытую Раскрывающей стороной»; «включая, но не ограничиваясь»",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Конфиденциальная информация означает любую информацию, раскрытую Раскрывающей стороной, включая, но не ограничиваясь: (а) технические данные и ноу-хау; (б) финансовые показатели; (в) клиентская база; (г) бизнес-планы. Информация должна быть помечена грифом «Конфиденциально»."
            }
          ]
        }

        Пример 2 — определение с конкретным перечнем (specific_list), без catch-all:
        Фрагмент:
        "Конфиденциальной информацией по настоящему Соглашению признаётся
        исключительно: (1) исходный код программы «ProdCore v.4.2»;
        (2) финансовая модель на 2024–2026 гг. (файл finmodel_2024.xlsx);
        (3) список клиентов из ТОП-20 (Приложение №2). Иная информация
        конфиденциальной не признаётся."

        Ответ:
        {
          "definition_status": "defined",
          "definition_type_code": "specific_list",
          "definition_type_details": "закрытый конкретный перечень из трёх элементов; иная информация конфиденциальной не признаётся",
          "categories_status": "not_defined",
          "categories_details": "Данные не определены",
          "examples_status": "defined",
          "examples_details": "исходный код «ProdCore v.4.2»; финансовая модель finmodel_2024.xlsx; список клиентов ТОП-20 (определяется по Приложению №2)",
          "marking_required_status": "not_defined",
          "marking_required_details": "Данные не определены",
          "catch_all_phrases_code": "absent",
          "catch_all_phrases_details": "определение закрытое: «исключительно», «иная информация конфиденциальной не признаётся»",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Конфиденциальной информацией по настоящему Соглашению признаётся исключительно: (1) исходный код программы «ProdCore v.4.2»; (2) финансовая модель на 2024–2026 гг. (файл finmodel_2024.xlsx); (3) список клиентов из ТОП-20 (Приложение №2). Иная информация конфиденциальной не признаётся."
            }
          ]
        }

        Пример 3 — определение отсутствует:
        Фрагмент:
        "Стороны обязуются не разглашать информацию, полученную в ходе переговоров."

        Ответ:
        {
          "definition_status": "not_defined",
          "definition_type_code": "not_defined",
          "definition_type_details": "Данные не определены",
          "categories_status": "not_defined",
          "categories_details": "Данные не определены",
          "examples_status": "not_defined",
          "examples_details": "Данные не определены",
          "marking_required_status": "not_defined",
          "marking_required_details": "Данные не определены",
          "catch_all_phrases_code": "not_defined",
          "catch_all_phrases_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата с определением конфиденциальной информации?
        2. Правильно ли выбран definition_type_code (categories / specific_list / both / unclear / not_defined)?
        3. Различены ли категории (общие типы) и примеры (конкретные экземпляры)?
        4. Найдена ли прямая цитата о требовании маркировки?
        5. Правильно ли выбран catch_all_phrases_code (present / absent / not_defined)?
        6. Все ли статус-поля содержат только значения из allowed_values?
        7. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "definition_status": "<defined / not_defined>",
          "definition_type_code": "<categories / specific_list / both / unclear / not_defined>",
          "definition_type_details": "<текст или 'Данные не определены'>",
          "categories_status": "<defined / not_defined>",
          "categories_details": "<текст или 'Данные не определены'>",
          "examples_status": "<defined / not_defined>",
          "examples_details": "<текст или 'Данные не определены'>",
          "marking_required_status": "<defined / not_defined>",
          "marking_required_details": "<текст или 'Данные не определены'>",
          "catch_all_phrases_code": "<present / absent / not_defined>",
          "catch_all_phrases_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "конфиденциальная информация определение означает признаётся включает не ограничиваясь категории любая вся информация в любой форме без ограничений маркировка пометка гриф Конфиденциально Коммерческая тайна confidential information means includes but not limited to"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - definition
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "исключения из конфиденциальной информации"
        - "не является конфиденциальной"
        - "общедоступная информация"
        - "была известна получающей стороне"
        - "независимо разработана"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "возврат носителей"
        - "уничтожение материалов"
      position_bias:
        preferred_range: [0.05, 0.40]
        boost: 0.35
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2200

      compact_output: false

      presence_signal:
        field: "confidential_info_definition_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA определение конфиденциальной
        информации: тип определения, категории, конкретные примеры, требование
        маркировки, наличие catch-all формулировок.
        Не анализируй исключения из конфиденциальности, меры защиты,
        ответственность или срок действия соглашения.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. confidential_info_definition_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - definition_status = "not_defined";
          - definition_type_code = "not_defined";
          - categories_status = "not_defined";
          - examples_status = "not_defined";
          - marking_required_status = "not_defined";
          - catch_all_phrases_code = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. definition_status:
          - "defined" — если в тексте прямо есть определение конфиденциальной информации
            или отсылка к приложению/спецификации;
          - "not_defined" — если определения нет.

        2. definition_type_code:
          - "categories" — если даны только общие категории/типы информации;
          - "specific_list" — если дан конкретный закрытый перечень;
          - "both" — если приведены и категории, и конкретный перечень внутри них;
          - "unclear" — если определение размыто и невозможно классифицировать;
          - "not_defined" — если определения нет.

        3. definition_type_details:
          Краткое описание типа определения на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        4. categories_status:
          - "defined" — если в тексте прямо указаны общие категории информации;
          - "not_defined" — если категории не указаны.

        5. categories_details:
          Перечень общих категорий (типов) конфиденциальной информации на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. examples_status:
          - "defined" — если в тексте прямо указаны конкретные примеры (названия, номера, файлы);
          - "not_defined" — если примеры не указаны.

        7. examples_details:
          Конкретные экземпляры конфиденциальной информации на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        8. marking_required_status:
          - "defined" — если в тексте прямо указано требование маркировки
            «Конфиденциально» / «Коммерческая тайна»;
          - "not_defined" — если требование маркировки не указано.

        9. marking_required_details:
          Формулировка требования маркировки на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        10. catch_all_phrases_code:
            - "present" — если присутствуют формулировки «любая информация»,
              «вся информация», «в любой форме», «без ограничений»,
              «including but not limited to» и аналогичные;
            - "absent" — если определение закрытое, чётко ограниченное;
            - "not_defined" — если самого определения нет.

        11. catch_all_phrases_details:
            Выявленные catch-all формулировки или описание закрытости определения
            на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни confidential_info_definition_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай:
          * категории = общие типы («технические данные», «финансовая информация»);
          * примеры = конкретные экземпляры («исходный код ProdCore», «клиент ООО X»).
        - Если параметр определяется через отсылку к приложению/спецификации,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - catch_all_phrases_code = "present" только при прямом наличии размывающих формулировок.
        - catch_all_phrases_code = "absent" только при закрытом, чётко ограниченном определении.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни определения, ни отсылки к приложению.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Определение только через отсылку к приложению.
          "Перечень конфиденциальной информации приведён в Приложении №1".
          → presence = "present";
            definition_status = "defined";
            definition_type_details = "Определяется по Приложению №1".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные перечни категорий.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Catch-all без конкретики.
          "Конфиденциальная информация — это любая информация, раскрытая Раскрывающей стороной".
          → presence = "present";
            definition_status = "defined";
            definition_type_code = "unclear";
            catch_all_phrases_code = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для confidential_info_definition_check_presence используй только: "present", "missing", "unclear".
        - Для definition_status, categories_status, examples_status, marking_required_status используй только: "defined", "not_defined".
        - Для definition_type_code используй только: "categories", "specific_list", "both", "unclear", "not_defined".
        - Для catch_all_phrases_code используй только: "present", "absent", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "confidential_info_definition_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по определению конфиденциальной информации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "definition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия определения конфиденциальной информации. Внутреннее enum-поле."
          required: true

        - name: "definition_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["categories", "specific_list", "both", "unclear", "not_defined"]
          display_in_grid: false
          description: "Тип определения: категории / перечень / оба / размытое / отсутствует. Внутреннее enum-поле."
          required: true

        - name: "definition_type_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Определение"
          description: >
            Описание типа определения конфиденциальной информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "categories_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия перечня общих категорий информации. Внутреннее enum-поле."
          required: true

        - name: "categories_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Категории информации"
          description: >
            Перечень общих категорий (типов) конфиденциальной информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "examples_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия конкретных примеров конфиденциальной информации. Внутреннее enum-поле."
          required: true

        - name: "examples_details"
          type: "string"
          presentation: "fact"
          label: "Конкретные примеры"
          description: >
            Конкретные экземпляры конфиденциальной информации (названия, номера, файлы).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "marking_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия требования маркировки информации. Внутреннее enum-поле."
          required: true

        - name: "marking_required_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Маркировка"
          description: >
            Формулировка требования маркировки «Конфиденциально» / «Коммерческая тайна».
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "catch_all_phrases_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие catch-all формулировок. Внутреннее enum-поле."
          required: true

        - name: "catch_all_phrases_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Catch-all формулировки"
          description: >
            Выявленные catch-all формулировки или описание закрытости определения.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: exceptions_check
    name: "Исключения из конфиденциальности"
    description: >
      Фактографическая проверка наличия пяти стандартных исключений из режима
      конфиденциальности: общедоступная информация, известная до раскрытия,
      полученная от третьих лиц, независимо разработанная, раскрытие по
      требованию закона/суда/госоргана. Отсутствие исключений создаёт риск
      для получающей стороны; чрезмерно широкие — обесценивают NDA для раскрывающей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
        - "publicly available"
        - "prior knowledge"
        - "стала общедоступной"
        - "раскрытие по закону"
        - "по требованию суда"
        - "по требованию государственного органа"
        - "independently developed"
        - "third party"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+являетс[яьа]\\s+конфиденциальн"
        - "(?i)исключени[яя]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 3, 6; ГК РФ ст. 1465).
        Проверяется только один вопрос: исключения из конфиденциальности.

        Нормативный ориентир:
        - ФЗ-98 ст. 3 — понятие коммерческой тайны.
        - ФЗ-98 ст. 6 — правомерное получение информации, составляющей
          коммерческую тайну (основания, при которых информация не считается
          полученной незаконно).
        - ГК РФ ст. 1465 — секрет производства (ноу-хау).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Фиксируй наличие или отсутствие каждого из 5 стандартных исключений.

        [ЗАДАЧА]
        Найди в тексте договора следующие 5 стандартных исключений:
        1. Информация стала общедоступной не по вине получающей стороны.
        2. Информация была известна получающей стороне до момента раскрытия.
        3. Информация получена от третьих лиц без нарушения обязательств.
        4. Информация независимо разработана получающей стороной.
        5. Раскрытие по требованию закона, суда или государственного органа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к приложению или иному
           документу («перечень исключений приведён в Приложении №2») — это
           считается "defined", в details укажи ссылку.
        4. Если исключение не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все 5 исключений присутствуют:
        Фрагмент:
        "Не является конфиденциальной информация, которая: (а) стала общедоступной
        не по вине Получающей стороны; (б) была известна Получающей стороне
        до раскрытия, что подтверждается письменными записями; (в) получена
        от третьих лиц, не связанных обязательствами конфиденциальности;
        (г) независимо разработана Получающей стороной без использования
        Конфиденциальной информации; (д) подлежит раскрытию по требованию
        суда или государственного органа при условии предварительного
        уведомления Раскрывающей стороны."

        Ответ:
        {
          "public_domain_status": "defined",
          "public_domain_details": "стала общедоступной не по вине Получающей стороны",
          "prior_knowledge_status": "defined",
          "prior_knowledge_details": "была известна Получающей стороне до раскрытия, подтверждается письменными записями",
          "third_party_lawful_status": "defined",
          "third_party_lawful_details": "получена от третьих лиц, не связанных обязательствами конфиденциальности",
          "independent_development_status": "defined",
          "independent_development_details": "независимо разработана Получающей стороной без использования Конфиденциальной информации",
          "government_required_status": "defined",
          "government_required_details": "подлежит раскрытию по требованию суда или государственного органа при условии предварительного уведомления Раскрывающей стороны",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Не является конфиденциальной информация, которая: (а) стала общедоступной не по вине Получающей стороны; (б) была известна Получающей стороне до раскрытия, что подтверждается письменными записями; (в) получена от третьих лиц, не связанных обязательствами конфиденциальности; (г) независимо разработана Получающей стороной без использования Конфиденциальной информации; (д) подлежит раскрытию по требованию суда или государственного органа при условии предварительного уведомления Раскрывающей стороны."
            }
          ]
        }

        Пример 2 — только часть исключений:
        Фрагмент:
        "Обязательства по настоящему Соглашению не распространяются на
        информацию, которая стала общедоступной не по вине Получающей стороны
        или была известна ей до даты раскрытия."

        Ответ:
        {
          "public_domain_status": "defined",
          "public_domain_details": "стала общедоступной не по вине Получающей стороны",
          "prior_knowledge_status": "defined",
          "prior_knowledge_details": "была известна Получающей стороне до даты раскрытия",
          "third_party_lawful_status": "not_defined",
          "third_party_lawful_details": "Данные не определены",
          "independent_development_status": "not_defined",
          "independent_development_details": "Данные не определены",
          "government_required_status": "not_defined",
          "government_required_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Обязательства по настоящему Соглашению не распространяются на информацию, которая стала общедоступной не по вине Получающей стороны или была известна ей до даты раскрытия."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата об общедоступности?
        2. Найдена ли прямая цитата о предшествующем знании?
        3. Найдена ли прямая цитата о получении от третьих лиц?
        4. Найдена ли прямая цитата о независимой разработке?
        5. Найдена ли прямая цитата о раскрытии по закону/суду/госоргану?
        6. Все ли статус-поля содержат только значения из allowed_values?
        7. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "public_domain_status": "<defined / not_defined>",
          "public_domain_details": "<текст или 'Данные не определены'>",
          "prior_knowledge_status": "<defined / not_defined>",
          "prior_knowledge_details": "<текст или 'Данные не определены'>",
          "third_party_lawful_status": "<defined / not_defined>",
          "third_party_lawful_details": "<текст или 'Данные не определены'>",
          "independent_development_status": "<defined / not_defined>",
          "independent_development_details": "<текст или 'Данные не определены'>",
          "government_required_status": "<defined / not_defined>",
          "government_required_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не является конфиденциальной исключения общедоступная стала общедоступной была известна до раскрытия получена от третьих лиц независимо разработана раскрытие по закону по требованию суда государственный орган publicly available prior knowledge independently developed third party"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "exceptions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA стандартные исключения из режима
        конфиденциальности: общедоступность, предшествующее знание, получение
        от третьих лиц, независимая разработка, раскрытие по закону/суду/госоргану.
        Не анализируй определение конфиденциальной информации, меры защиты,
        ответственность или срок действия соглашения.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exceptions_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - public_domain_status = "not_defined";
          - prior_knowledge_status = "not_defined";
          - third_party_lawful_status = "not_defined";
          - independent_development_status = "not_defined";
          - government_required_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. public_domain_status:
          - "defined" — если в тексте прямо указано исключение об общедоступности;
          - "not_defined" — если исключение не указано.

        2. public_domain_details:
          Формулировка исключения об общедоступности на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. prior_knowledge_status:
          - "defined" — если в тексте прямо указано исключение о предшествующем знании;
          - "not_defined" — если исключение не указано.

        4. prior_knowledge_details:
          Формулировка исключения о предшествующем знании на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. third_party_lawful_status:
          - "defined" — если в тексте прямо указано исключение о получении от третьих лиц;
          - "not_defined" — если исключение не указано.

        6. third_party_lawful_details:
          Формулировка исключения о получении от третьих лиц на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. independent_development_status:
          - "defined" — если в тексте прямо указано исключение о независимой разработке;
          - "not_defined" — если исключение не указано.

        8. independent_development_details:
          Формулировка исключения о независимой разработке на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. government_required_status:
          - "defined" — если в тексте прямо указано исключение о раскрытии по закону/суду/госоргану;
          - "not_defined" — если исключение не указано.

        10. government_required_details:
            Формулировка исключения о раскрытии по закону/суду/госоргану на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни exceptions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Для каждого из 5 исключений ищи отдельную формулировку.
        - Если все 5 перечислены в одном пункте (список (а)–(д)) — извлеки каждое отдельно.
        - government_required: учитывай формулировки «по требованию суда»,
          «по требованию государственного органа», «в соответствии с законодательством»,
          «по запросу регулятора».
        - Если параметр определяется через отсылку к приложению/иному документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни одного из 5 стандартных исключений.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только часть исключений.
          Указаны только 2 из 5 стандартных исключений.
          → presence = "present";
            соответствующие *_status = "defined";
            остальные *_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные формулировки одного исключения.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Исключения через отсылку к приложению.
          "Перечень исключений приведён в Приложении №2".
          → presence = "present";
            все *_status = "defined";
            *_details содержат ссылку на приложение.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exceptions_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exceptions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по исключениям из конфиденциальности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "public_domain_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения об общедоступности информации. Внутреннее enum-поле."
          required: true

        - name: "public_domain_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Общедоступность"
          description: >
            Формулировка исключения: информация стала общедоступной не по вине получающей стороны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "prior_knowledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения о предшествующем знании. Внутреннее enum-поле."
          required: true

        - name: "prior_knowledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Предшествующее знание"
          description: >
            Формулировка исключения: информация была известна получающей стороне до раскрытия.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "third_party_lawful_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения о правомерном получении от третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "third_party_lawful_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Третьи лица"
          description: >
            Формулировка исключения: информация получена от третьих лиц без нарушения обязательств.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "independent_development_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения о независимой разработке. Внутреннее enum-поле."
          required: true

        - name: "independent_development_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Независимая разработка"
          description: >
            Формулировка исключения: информация независимо разработана получающей стороной.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "government_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения о раскрытии по требованию закона, суда или госоргана. Внутреннее enum-поле."
          required: true

        - name: "government_required_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Раскрытие по закону"
          description: >
            Формулировка исключения: раскрытие по требованию закона, суда или государственного органа.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: obligations_protection_check
    name: "Меры защиты информации и распространение на консультантов"
    description: >
      Фактографическая проверка конкретных обязательств по защите информации:
      стандарт защиты (reasonable care / «не ниже мер для собственной»),
      ограничение доступа (need-to-know), разрешение раскрытия аффилированным
      лицам и консультантам, требование подписания NDA консультантами,
      ответственность получающей стороны за действия третьих лиц.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "меры защиты"
        - "ограничение доступа"
        - "не ниже мер для собственной информации"
        - "надлежащая защита"
        - "разумная степень заботливости"
        - "физическая безопасность"
        - "информационная безопасность"
        - "need-to-know"
        - "аффилированные лица"
        - "консультанты"
        - "юристы"
        - "аудиторы"
        - "инвесторы"
        - "подрядчики"
        - "обязательство о неразглашении"
        - "связывание третьих лиц"
        - "reasonable care"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+ниже\\s+мер"
        - "(?i)need-?to-?know"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 10; ГК РФ ст. 1465, 401).
        Проверяется только один вопрос: меры защиты информации
        и распространение обязательств на консультантов и третьих лиц.

        Нормативный ориентир:
        - ФЗ-98 ст. 10 — режим коммерческой тайны, включая ограничение
          доступа и учёт лиц, получивших доступ.
        - ГК РФ ст. 401 — основания ответственности, стандарт
          «разумной степени заботливости».
        - ГК РФ ст. 1465 — секрет производства (ноу-хау).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Стандарт защиты (не ниже мер для собственной информации /
           reasonable care / конкретный стандарт / не указан).
        2. Ограничение доступа (need-to-know / «только сотрудникам, которым
           необходимо знать» / не указано).
        3. Разрешение раскрытия консультантам / аффилированным лицам.
        4. Требование подписания NDA (или аналогичного обязательства)
           консультантами и третьими лицами.
        5. Ответственность получающей стороны за действия консультантов
           и третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к приложению, политике
           безопасности или иному документу («в соответствии с Политикой
           информационной безопасности, Приложение №3») — это считается
           "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них
           применяй "not_defined" для статусов и "Данные не определены"
           для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
           пригодный для парсинга через json.loads без предварительной
           обработки. Без markdown, без ```json, без комментариев, без
           текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор мер защиты:
        Фрагмент:
        "Получающая сторона обязуется защищать Конфиденциальную информацию
        с применением мер не ниже тех, которые она применяет для защиты
        собственной конфиденциальной информации, но в любом случае не ниже
        разумной степени заботливости. Доступ предоставляется только
        сотрудникам, которым это необходимо для выполнения обязательств
        по настоящему Соглашению (принцип need-to-know). Раскрытие
        консультантам, аудиторам и аффилированным лицам допускается
        при условии подписания ими обязательства о неразглашении,
        по содержанию не менее строгого, чем настоящее Соглашение.
        Получающая сторона несёт ответственность за действия указанных
        лиц как за свои собственные."

        Ответ:
        {
          "protection_standard_status": "defined",
          "protection_standard_details": "не ниже мер для собственной конфиденциальной информации, но не ниже разумной степени заботливости",
          "access_restriction_status": "defined",
          "access_restriction_details": "только сотрудникам, которым это необходимо (принцип need-to-know)",
          "advisor_disclosure_status": "defined",
          "advisor_disclosure_details": "консультантам, аудиторам и аффилированным лицам допускается",
          "advisor_nda_binding_status": "defined",
          "advisor_nda_binding_details": "при условии подписания обязательства о неразглашении, не менее строгого, чем настоящее Соглашение",
          "advisor_liability_status": "defined",
          "advisor_liability_details": "ответственность за действия указанных лиц как за свои собственные",
          "evidence": [
            {
              "clause_ref": "п. 4.1–4.3",
              "quote": "Получающая сторона обязуется защищать Конфиденциальную информацию с применением мер не ниже тех, которые она применяет для защиты собственной конфиденциальной информации, но в любом случае не ниже разумной степени заботливости. Доступ предоставляется только сотрудникам, которым это необходимо для выполнения обязательств по настоящему Соглашению (принцип need-to-know)."
            }
          ]
        }

        Пример 2 — минимальные обязательства, без консультантов:
        Фрагмент:
        "Получающая сторона обязуется хранить Конфиденциальную информацию
        в тайне и не передавать её третьим лицам без письменного согласия
        Раскрывающей стороны."

        Ответ:
        {
          "protection_standard_status": "not_defined",
          "protection_standard_details": "Данные не определены",
          "access_restriction_status": "not_defined",
          "access_restriction_details": "Данные не определены",
          "advisor_disclosure_status": "defined",
          "advisor_disclosure_details": "запрет передачи третьим лицам без письменного согласия Раскрывающей стороны",
          "advisor_nda_binding_status": "not_defined",
          "advisor_nda_binding_details": "Данные не определены",
          "advisor_liability_status": "not_defined",
          "advisor_liability_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Получающая сторона обязуется хранить Конфиденциальную информацию в тайне и не передавать её третьим лицам без письменного согласия Раскрывающей стороны."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о стандарте защиты?
        2. Найдена ли прямая цитата об ограничении доступа (need-to-know)?
        3. Найдена ли прямая цитата о раскрытии консультантам/аффилированным?
        4. Найдена ли прямая цитата о требовании NDA для консультантов?
        5. Найдена ли прямая цитата об ответственности за консультантов?
        6. Все ли статус-поля содержат только значения из allowed_values?
        7. Если прямой цитаты и отсылки нет — статус = "not_defined",
           details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "protection_standard_status": "<defined / not_defined>",
          "protection_standard_details": "<текст или 'Данные не определены'>",
          "access_restriction_status": "<defined / not_defined>",
          "access_restriction_details": "<текст или 'Данные не определены'>",
          "advisor_disclosure_status": "<defined / not_defined>",
          "advisor_disclosure_details": "<текст или 'Данные не определены'>",
          "advisor_nda_binding_status": "<defined / not_defined>",
          "advisor_nda_binding_details": "<текст или 'Данные не определены'>",
          "advisor_liability_status": "<defined / not_defined>",
          "advisor_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "меры защиты ограничение доступа не ниже мер для собственной информации надлежащая защита разумная степень заботливости need-to-know аффилированные лица консультанты юристы аудиторы подрядчики обязательство о неразглашении связывание третьих лиц ответственность за действия третьих лиц reasonable care"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "общедоступная информация"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2000

      compact_output: false

      presence_signal:
        field: "obligations_protection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA обязательства по защите
        информации: стандарт защиты, ограничение доступа, раскрытие
        консультантам и аффилированным лицам, требование NDA для
        консультантов, ответственность за действия третьих лиц.
        Не анализируй определение конфиденциальной информации, исключения,
        ответственность за нарушение (штрафы/неустойки) или срок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. obligations_protection_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - protection_standard_status = "not_defined";
          - access_restriction_status = "not_defined";
          - advisor_disclosure_status = "not_defined";
          - advisor_nda_binding_status = "not_defined";
          - advisor_liability_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. protection_standard_status:
          - "defined" — если в тексте прямо указан стандарт защиты
            (reasonable care / «не ниже мер для собственной» / конкретный стандарт);
          - "not_defined" — если стандарт не указан.

        2. protection_standard_details:
          Стандарт защиты на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. access_restriction_status:
          - "defined" — если в тексте прямо указано ограничение доступа (need-to-know);
          - "not_defined" — если ограничение не указано.

        4. access_restriction_details:
          Формулировка ограничения доступа на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. advisor_disclosure_status:
          - "defined" — если в тексте прямо указаны условия раскрытия консультантам/аффилированным;
          - "not_defined" — если условия не указаны.

        6. advisor_disclosure_details:
          Условия раскрытия информации консультантам на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. advisor_nda_binding_status:
          - "defined" — если в тексте прямо указано требование подписания NDA консультантами;
          - "not_defined" — если требование не указано.

        8. advisor_nda_binding_details:
          Требование подписания NDA или back-to-back обязательства на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. advisor_liability_status:
          - "defined" — если в тексте прямо указана ответственность получающей стороны за действия консультантов;
          - "not_defined" — если ответственность не указана.

        10. advisor_liability_details:
            Формулировка ответственности за действия консультантов и третьих лиц на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни obligations_protection_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - protection_standard: ищи формулировки «не ниже мер для собственной»,
          «reasonable care», «разумная степень заботливости», «надлежащие технические и организационные меры».
        - access_restriction: ищи «need-to-know», «только сотрудникам, которым необходимо знать»,
          «ограниченный круг лиц».
        - advisor_disclosure: учитывай как разрешение («допускается при условии»),
          так и запрет («не передавать третьим лицам»).
        - advisor_nda_binding: ищи «подписание NDA», «обязательство о неразглашении»,
          «соглашение о конфиденциальности», «back-to-back обязательства».
        - advisor_liability: ищи «как за свои собственные», «несёт ответственность за действия»,
          «отвечает за нарушение».
        - Если параметр определяется через отсылку к приложению/политике,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни стандарта защиты, ни ограничений доступа, ни условий раскрытия.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Общая фраза о защите без конкретики.
          "Получающая сторона обязуется хранить информацию в тайне".
          → presence = "present";
            protection_standard_status = "not_defined";
            protection_standard_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частх договора указаны разные стандарты защиты.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Раскрытие консультантам без требования NDA.
          "Раскрытие консультантам допускается", но нет требования подписания NDA.
          → presence = "present";
            advisor_disclosure_status = "defined";
            advisor_nda_binding_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для obligations_protection_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "obligations_protection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по мерам защиты информации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "protection_standard_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия стандарта защиты конфиденциальной информации. Внутреннее enum-поле."
          required: true

        - name: "protection_standard_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Стандарт защиты"
          description: >
            Формулировка стандарта защиты (reasonable care / «не ниже мер для собственной» / конкретный стандарт).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "access_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия ограничения доступа к информации. Внутреннее enum-поле."
          required: true

        - name: "access_restriction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ограничение доступа"
          description: >
            Формулировка ограничения доступа (need-to-know / ограниченный круг лиц).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "advisor_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условий раскрытия консультантам и аффилированным лицам. Внутреннее enum-поле."
          required: true

        - name: "advisor_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Раскрытие консультантам"
          description: >
            Условия раскрытия информации консультантам, аудиторам, аффилированным лицам (разрешение или запрет).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "advisor_nda_binding_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования подписания NDA или аналогичного обязательства консультантами. Внутреннее enum-поле."
          required: true

        - name: "advisor_nda_binding_details"
          type: "string"
          presentation: "fact"
          label: "NDA для консультантов"
          description: >
            Требование подписания NDA или back-to-back обязательства консультантами и третьими лицами.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "advisor_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности получающей стороны за действия консультантов. Внутреннее enum-поле."
          required: true

        - name: "advisor_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ответственность за третьих лиц"
          description: >
            Формулировка ответственности получающей стороны за действия консультантов и третьих лиц.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: term_survival_check
    name: "Срок действия NDA, срок конфиденциальности и survival clause"
    description: >
      Фактографическая проверка срока действия самого NDA (периода раскрытия),
      срока действия обязательств конфиденциальности (post-termination),
      наличия условий о бессрочной охране и survival clause (сохранение силы
      обязательств после прекращения соглашения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок действия"
        - "срок конфиденциальности"
        - "период действия"
        - "бессрочная конфиденциальность"
        - "на весь срок"
        - "бессрочно"
        - "survival"
        - "переживает прекращение"
        - "сохраняют силу"
        - "после прекращения"
        - "действует до"
        - "в течение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок.*?(\\d+\\s+(лет|год|года|месяц))"
        - "(?i)действует\\s+до\\s+\\d{2}\\.\\d{2}\\.\\d{4}"
        - "(?i)бессрочн"
        - "(?i)(сохраня|пережива)[а-яё]+\\s+силу"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ст. 190–194, ст. 425 ГК РФ; ФЗ-98 «О коммерческой тайне» ст. 10).
        Проверяется только один вопрос: срок действия NDA, срок конфиденциальности
        и оговорка о сохранении обязательств (survival clause).

        Нормативный ориентир:
        - ст. 425 ГК РФ — действие договора во времени.
        - ст. 190–194 ГК РФ — исчисление сроков (календарная дата, период, событие).
        - ФЗ-98 ст. 10 — срок действия режима коммерческой тайны.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Различай:
          1) Срок действия NDA (период, в течение которого стороны вправе передавать информацию);
          2) Срок конфиденциальности (период, в течение которого получатель обязан хранить тайну);
          3) Survival clause (условие о том, что обязательства сохраняют силу после расторжения/истечения NDA).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок действия самого соглашения NDA (период раскрытия).
        2. Срок действия обязательств по сохранению конфиденциальности.
        3. Наличие условия о бессрочной конфиденциальности (perpetual).
        4. Наличие оговорки о сохранении обязательств после прекращения NDA (survival clause).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к основному договору, проекту
           или приложению («до момента прекращения Договора поставки №1») — это
           считается "defined", в details укажи точную формулировку со ссылкой.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — раздельный срок соглашения и срок охраны (survival clause):
        Фрагмент:
        "Настоящее Соглашение вступает в силу с даты подписания и действует
        в течение 2 (двух) лет. Обязательства Получающей стороны по сохранению
        конфиденциальности информации сохраняют силу в течение 5 (пяти) лет
        с момента прекращения или расторжения настоящего Соглашения."

        Ответ:
        {
          "nda_term_status": "defined",
          "nda_term_details": "2 года с даты подписания",
          "confidentiality_term_status": "defined",
          "confidentiality_term_details": "5 лет с момента прекращения или расторжения Соглашения",
          "perpetual_status": "not_defined",
          "perpetual_details": "Данные не определены",
          "survival_clause_status": "defined",
          "survival_clause_details": "обязательства сохраняют силу в течение 5 лет с момента прекращения или расторжения Соглашения",
          "evidence": [
            {
              "clause_ref": "п. 6.1–6.2",
              "quote": "Настоящее Соглашение вступает в силу с даты подписания и действует в течение 2 (двух) лет. Обязательства Получающей стороны по сохранению конфиденциальности информации сохраняют силу в течение 5 (пяти) лет с момента прекращения или расторжения настоящего Соглашения."
            }
          ]
        }

        Пример 2 — бессрочная конфиденциальность:
        Фрагмент:
        "Соглашение действует в течение 1 года. Обязательства по неразглашению
        носят бессрочный характер и действуют до момента, пока информация
        не станет общедоступной в соответствии с настоящим Соглашением."

        Ответ:
        {
          "nda_term_status": "defined",
          "nda_term_details": "1 год с момента заключения",
          "confidentiality_term_status": "defined",
          "confidentiality_term_details": "бессрочно (до перехода информации в общественный доступ)",
          "perpetual_status": "defined",
          "perpetual_details": "обязательства по неразглашению носят бессрочный характер",
          "survival_clause_status": "defined",
          "survival_clause_details": "бессрочные обязательства действуют после истечения 1 года действия соглашения",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Соглашение действует в течение 1 года. Обязательства по неразглашению носят бессрочный характер и действуют до момента, пока информация не станет общедоступной в соответствии с настоящим Соглашением."
            }
          ]
        }

        Пример 3 — данные о сроках отсутствуют:
        Фрагмент:
        "Стороны заключили настоящее соглашение о конфиденциальности."

        Ответ:
        {
          "nda_term_status": "not_defined",
          "nda_term_details": "Данные не определены",
          "confidentiality_term_status": "not_defined",
          "confidentiality_term_details": "Данные не определены",
          "perpetual_status": "not_defined",
          "perpetual_details": "Данные не определены",
          "survival_clause_status": "not_defined",
          "survival_clause_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о сроке действия самого соглашения NDA?
        2. Найдена ли прямая цитата о сроке охраны конфиденциальности?
        3. Проверено ли условие о бессрочности (perpetual)?
        4. Найдена ли оговорка о сохранении обязательств (survival clause)?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "nda_term_status": "<defined / not_defined>",
          "nda_term_details": "<текст или 'Данные не определены'>",
          "confidentiality_term_status": "<defined / not_defined>",
          "confidentiality_term_details": "<текст или 'Данные не определены'>",
          "perpetual_status": "<defined / not_defined>",
          "perpetual_details": "<текст или 'Данные не определены'>",
          "survival_clause_status": "<defined / not_defined>",
          "survival_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок действия срок конфиденциальности период действия бессрочная конфиденциальность бессрочно на весь срок survival переживает прекращение сохраняют силу после прекращения расторжения действует до лет года месяца"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - termination_provision
        - effective_date
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "неустойка"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.55, 0.98]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "term_survival_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о сроке действия
        соглашения, сроке охраны конфиденциальности, бессрочности и
        наличии survival clause (сохранение силы обязательств после
        прекращения соглашения).
        Не анализируй определение конфиденциальной информации, исключения,
        меры защиты или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. term_survival_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - nda_term_status = "not_defined";
          - confidentiality_term_status = "not_defined";
          - perpetual_status = "not_defined";
          - survival_clause_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. nda_term_status:
          - "defined" — если в тексте прямо указан срок действия самого соглашения NDA;
          - "not_defined" — если срок не указан.

        2. nda_term_details:
          Срок действия соглашения (период правомерного раскрытия информации) на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. confidentiality_term_status:
          - "defined" — если в тексте прямо указан срок действия обязательств конфиденциальности;
          - "not_defined" — если срок не указан.

        4. confidentiality_term_details:
          Срок действия обязательств по сохранению конфиденциальности на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. perpetual_status:
          - "defined" — если в тексте прямо указано условие о бессрочной охране;
          - "not_defined" — если условие не указано.

        6. perpetual_details:
          Формулировка условия о бессрочной конфиденциальности на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. survival_clause_status:
          - "defined" — если в тексте прямо указана оговорка о сохранении обязательств после прекращения;
          - "not_defined" — если оговорка не указана.

        8. survival_clause_details:
          Формулировка survival clause на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни term_survival_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай:
          * nda_term: срок действия соглашения в целом (например, «действует 1 год»);
          * confidentiality_term: срок обязанности сохранять тайну (например, «в течение 3 лет после прекращения»);
          * perpetual: прямое указание на бессрочность («бессрочно», «в течение неограниченного срока»);
          * survival_clause: условие о том, что обязательства переживают прекращение NDA («сохраняют силу после расторжения»).
        - Если параметр определяется через отсылку к другому документу/событию,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни срока действия NDA, ни срока конфиденциальности, ни survival clause.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только срок действия NDA без срока конфиденциальности.
          "Соглашение действует в течение 1 года", но нет условия о сроке охраны.
          → presence = "present";
            nda_term_status = "defined";
            confidentiality_term_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки действия.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Бессрочная конфиденциальность.
          "Обязательства по неразглашению носят бессрочный характер".
          → presence = "present";
            perpetual_status = "defined";
            perpetual_details = "обязательства по неразглашению носят бессрочный характер".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для term_survival_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "term_survival_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по срокам действия и survival clause. Внутреннее агрегатное signal-поле."
          required: true

        - name: "nda_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока действия самого соглашения NDA. Внутреннее enum-поле."
          required: true

        - name: "nda_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок действия NDA"
          description: >
            Срок действия соглашения (период правомерного раскрытия информации).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "confidentiality_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока охраны конфиденциальности. Внутреннее enum-поле."
          required: true

        - name: "confidentiality_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок конфиденциальности"
          description: >
            Срок действия обязательств по сохранению конфиденциальности (в т.ч. post-termination).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "perpetual_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о бессрочной охране конфиденциальности. Внутреннее enum-поле."
          required: true

        - name: "perpetual_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Бессрочность"
          description: >
            Формулировка условия о бессрочной конфиденциальности (если предусмотрена).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "survival_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о сохранении обязательств после прекращения соглашения. Внутреннее enum-поле."
          required: true

        - name: "survival_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Survival clause"
          description: >
            Формулировка survival clause (сохранение силы обязательств после прекращения/расторжения NDA).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: liability_breach_notification_check
    name: "Ответственность за нарушение и уведомление об утечке"
    description: >
      Фактографическая проверка штрафных санкций за нарушение NDA (размера и характера неустойки),
      права на возмещение убытков (включая соотношение неустойки и убытков по ст. 394 ГК РФ),
      а также обязанности и сроков немедленного уведомления о факте утечки или несанкционированного доступа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штраф"
        - "неустойка"
        - "штрафные санкции"
        - "компенсация убытков"
        - "возмещение убытков"
        - "ответственность за нарушение"
        - "убытки в полном объёме"
        - "реальный ущерб"
        - "упущенная выгода"
        - "penalty"
        - "liquidated damages"
        - "уведомление о нарушении"
        - "уведомление об утечке"
        - "breach notification"
        - "немедленное уведомление"
        - "сообщить об утечке"
        - "факт разглашения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф.*?\\d[\\d\\s]*(?:руб|USD|EUR)"
        - "(?i)неустойка.*?\\d+[.,]?\\d*\\s*%"
        - "(?i)уведомлени[ея].*?(нарушени|утечк)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 15, 330, 393, 394; ФЗ-98 «О коммерческой тайне»).
        Проверяется только один вопрос: ответственность за нарушение конфиденциальности
        и обязанность уведомления об утечке информации.

        Нормативный ориентир:
        - ст. 330 ГК РФ — понятие неустойки (штрафа, пени).
        - ст. 393 ГК РФ — обязанность должника возместить убытки.
        - ст. 394 ГК РФ — сочетание неустойки и убытков (по умолчанию неустойка является
          зачётной, если иное не предусмотрено договором; для NDA критически важно
          согласовать штрафную неустойку — убытки сверх штрафа в полном объёме).
        - ст. 15 ГК РФ — реальный ущерб и упущенная выгода.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Сфокусируйся на конкретных суммах/процентах штрафа и соотношении штрафа с убытками.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие фиксированного штрафа или неустойки за факт нарушения.
        2. Конкретный размер штрафа (сумма в валюте или процент).
        3. Порядок возмещения убытков (в полном объёме, только реальный ущерб,
           сверх неустойки/штрафа или зачётом неустойки).
        4. Наличие обязанности получателя незамедлительно уведомить раскрывающего
           о факте утечки, несанкционированного доступа или угрозы разглашения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу («размер
           штрафа определяется в соответствии со Спецификацией №1») — это считается
           "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — фиксированный штраф и убытки сверх неустойки (штрафная неустойка):
        Фрагмент:
        "За каждый факт нарушения обязательств конфиденциальности Получающая
        сторона уплачивает Раскрывающей стороне штраф в размере 1 000 000 рублей
        в течение 5 рабочих дней с даты предъявления требования. Раскрывающая
        сторона также вправе требовать возмещения причинённых убытков в полном
        объёме сверх суммы уплаченного штрафа. Получающая сторона обязуется
        письменно уведомить о факте утечки в течение 12 часов с момента обнаружения."

        Ответ:
        {
          "penalty_clause_status": "defined",
          "penalty_clause_details": "штраф за каждый факт нарушения обязательств конфиденциальности",
          "penalty_amount_status": "defined",
          "penalty_amount_details": "1 000 000 рублей за каждый факт нарушения",
          "damages_status": "defined",
          "damages_details": "возмещение убытков в полном объёме сверх суммы уплаченного штрафа (штрафная неустойка)",
          "breach_notification_status": "defined",
          "breach_notification_details": "письменно уведомить о факте утечки в течение 12 часов с момента обнаружения",
          "evidence": [
            {
              "clause_ref": "п. 5.1–5.2",
              "quote": "За каждый факт нарушения обязательств конфиденциальности Получающая сторона уплачивает Раскрывающей стороне штраф в размере 1 000 000 рублей... Раскрывающая сторона также вправе требовать возмещения причинённых убытков в полном объёме сверх суммы уплаченного штрафа."
            }
          ]
        }

        Пример 2 — зачётная неустойка (или усечённая ответственность) без штрафа:
        Фрагмент:
        "В случае неисполнения обязательств Стороны несут ответственность в виде
        возмещения доказанного реального ущерба. Упущенная выгода возмещению не
        подлежит. Обязанность уведомлять об утечках Соглашением не предусмотрена."

        Ответ:
        {
          "penalty_clause_status": "not_defined",
          "penalty_clause_details": "Данные не определены",
          "penalty_amount_status": "not_defined",
          "penalty_amount_details": "Данные не определены",
          "damages_status": "defined",
          "damages_details": "возмещение доказанного реального ущерба, упущенная выгода исключена",
          "breach_notification_status": "not_defined",
          "breach_notification_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "В случае неисполнения обязательств Стороны несут ответственность в виде возмещения доказанного реального ущерба. Упущенная выгода возмещению не подлежит."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "За нарушение Соглашения Стороны несут ответственность по закону РФ."

        Ответ:
        {
          "penalty_clause_status": "not_defined",
          "penalty_clause_details": "Данные не определены",
          "penalty_amount_status": "not_defined",
          "penalty_amount_details": "Данные не определены",
          "damages_status": "not_defined",
          "damages_details": "Данные не определены",
          "breach_notification_status": "not_defined",
          "breach_notification_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата об ответственности/неустойке?
        2. Найдена ли прямая цитата о конкретном размере штрафа?
        3. Определён ли порядок возмещения убытков (особенно их соотношение с неустойкой по ст. 394 ГК РФ)?
        4. Найдена ли прямая цитата об обязанности уведомления об утечке/нарушении?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "penalty_clause_status": "<defined / not_defined>",
          "penalty_clause_details": "<текст или 'Данные не определены'>",
          "penalty_amount_status": "<defined / not_defined>",
          "penalty_amount_details": "<текст или 'Данные не определены'>",
          "damages_status": "<defined / not_defined>",
          "damages_details": "<текст или 'Данные не определены'>",
          "breach_notification_status": "<defined / not_defined>",
          "breach_notification_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "штраф неустойка штрафные санкции компенсация убытков возмещение убытков в полном объёме реальный ущерб сверх неустойки penalty liquidated damages уведомление о нарушении утечке breach notification незамедлительно сообщить"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2200

      compact_output: false

      presence_signal:
        field: "liability_breach_notification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA условия об ответственности за нарушение
        и обязанности уведомления об утечке информации:
        наличие и размер штрафа/неустойки, порядок возмещения убытков
        (особенно их соотношение со штрафом по ст. 394 ГК РФ),
        обязанность и сроки уведомления об утечке.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты или срок действия соглашения.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_breach_notification_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - penalty_clause_status = "not_defined";
          - penalty_amount_status = "not_defined";
          - damages_status = "not_defined";
          - breach_notification_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. penalty_clause_status:
          - "defined" — если в тексте прямо указан штраф/неустойка за нарушение NDA
            или прямо указано, что неустойка не применяется;
          - "not_defined" — если условие о штрафе не указано.

        2. penalty_clause_details:
          Описание условия о штрафе/неустойке за нарушение на русском языке.
          Если данных нет — "Данные не определены".
          Если прямо указано, что неустойка не применяется — "Неустойка не предусмотрена".
          Если данные противоречивы — "Не удалось определить".

        3. penalty_amount_status:
          - "defined" — если в тексте прямо указан конкретный размер штрафа
            (сумма в валюте или процент);
          - "not_defined" — если размер не указан.

        4. penalty_amount_details:
          Конкретный размер штрафа на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. damages_status:
          - "defined" — если в тексте прямо указан порядок возмещения убытков
            (в полном объёме, только реальный ущерб, сверх неустойки, зачётом неустойки);
          - "not_defined" — если порядок возмещения убытков не указан.

        6. damages_details:
          Порядок возмещения убытков и их соотношение со штрафом на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. breach_notification_status:
          - "defined" — если в тексте прямо указана обязанность уведомления об утечке
            или несанкционированном доступе;
          - "not_defined" — если обязанность уведомления не указана.

        8. breach_notification_details:
          Обязанность, сроки и порядок уведомления об утечке на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_breach_notification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи ответственность из общих норм закона — только то, что прямо согласовано сторонами.
        - penalty_clause: фиксируй сам факт установления штрафа.
        - penalty_amount: извлекай конкретные численные значения или формулу расчёта.
        - damages: анализируй, исключена ли упущенная выгода («только реальный ущерб»),
          и как убытки соотносятся со штрафом (штрафная неустойка — убытки сверх штрафа
          в полном объёме; зачётная неустойка — убытки в части, не покрытой штрафом).
        - breach_notification: ищи условия о незамедлительном информировании раскрывающей
          стороны при утечке и сроки (например, «в течение 24 часов», «немедленно»).
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни штрафа, ни убытков, ни уведомления об утечке.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Общая ссылка на закон без конкретных санкций.
          "Стороны несут ответственность в соответствии с законодательством РФ".
          → presence = "present";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные размеры штрафа.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Прямой отказ от неустойки.
          "Неустойка по настоящему Соглашению не применяется".
          → presence = "present";
            penalty_clause_status = "defined";
            penalty_clause_details = "Неустойка не предусмотрена";
            penalty_amount_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_breach_notification_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при прямом отказе от неустойки:
          * penalty_clause_details → "Неустойка не предусмотрена".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_breach_notification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности и уведомлению об утечке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласования штрафа за нарушение конфиденциальности. Внутреннее enum-поле."
          required: true

        - name: "penalty_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Штраф/неустойка"
          description: >
            Условие о штрафе/неустойке за нарушение обязательств конфиденциальности.
            Fallback: "Данные не определены" / "Неустойка не предусмотрена" / "Не удалось определить".
          required: true

        - name: "penalty_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания размера штрафа. Внутреннее enum-поле."
          required: true

        - name: "penalty_amount_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Размер штрафа"
          description: >
            Конкретный размер штрафа за нарушение конфиденциальности.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "damages_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возмещения убытков. Внутреннее enum-поле."
          required: true

        - name: "damages_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Возмещение убытков"
          description: >
            Порядок возмещения убытков и их соотношение с неустойкой/штрафом (ст. 394 ГК РФ).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "breach_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности уведомления о нарушении/утечке. Внутреннее enum-поле."
          required: true

        - name: "breach_notification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Уведомление об утечке"
          description: >
            Обязанность, срок и порядок уведомления раскрывающей стороны об утечке или несанкционированном доступе.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: return_destruction_check
    name: "Порядок возврата или уничтожения информации"
    description: >
      Фактографическая проверка порядка возврата или уничтожения носителей
      конфиденциальной информации по окончании срока действия NDA или по требованию
      раскрывающей стороны, включая сроки, требование предоставления акта/сертификата
      об уничтожении и исключения для обязательных архивных копий (backup).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат информации"
        - "уничтожение информации"
        - "срок возврата"
        - "подтверждение уничтожения"
        - "сертификат об уничтожении"
        - "акт об уничтожении"
        - "право сохранять копии"
        - "архивные копии"
        - "удаление носителей"
        - "резервные копии"
        - "backup"
        - "удалить"
        - "стереть"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*информаци"
        - "(?i)уничтожени.*информаци"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 10; ГК РФ ст. 450.1, 453).
        Проверяется только один вопрос: порядок возврата или уничтожения информации.

        Нормативный ориентир:
        - ФЗ-98 ст. 10 — меры по охране конфиденциальности информации (включая контроль
          прекращения доступа при прекращении правоотношений).
        - ГК РФ ст. 453 — последствия прекращения и расторжения договора (судьба переданного
          имущества и носителей информации).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Различай:
          1) Факт обязанности вернуть или уничтожить носители (или право выбора получателя);
          2) Конкретный срок (период времени) для возврата или уничтожения;
          3) Обязанность предоставить письменный документ-подтверждение (акт, сертификат);
          4) Разрешённые исключения для архивных копий (для целей резервного копирования
             ИБ-систем или соблюдения требований законодательства РФ о хранении документов).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность вернуть или уничтожить материальные/электронные носители информации.
        2. Конкретный срок исполнения этой обязанности.
        3. Требование предоставления письменного подтверждения уничтожения (акт, сертификат).
        4. Наличие исключения, позволяющего получателю законно сохранить архивные или
           резервные (backup) копии.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу («порядок возврата
           определяется согласно Регламенту (Приложение №3)») — это считается "defined",
           в details укажи точную формулировку со ссылкой.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок возврата, уничтожения и архивное исключение:
        Фрагмент:
        "При прекращении настоящего Соглашения или по первому требованию
        Раскрывающей стороны Получающая сторона обязуется по своему выбору
        вернуть или уничтожить все оригиналы и копии документов, содержащих
        Конфиденциальную информацию, в течение 15 (пятнадцати) рабочих дней.
        Уничтожение должно быть подтверждено письменным актом, подписанным
        уполномоченным лицом Получающей стороны и направленным Раскрывающей
        стороне в течение 5 дней после уничтожения. Получающая сторона вправе
        сохранить архивные копии в объёме, строго необходимом для соблюдения
        требований применимого законодательства РФ."

        Ответ:
        {
          "return_or_destruction_status": "defined",
          "return_or_destruction_details": "по своему выбору вернуть или уничтожить все оригиналы и копии документов",
          "deadline_status": "defined",
          "deadline_details": "в течение 15 рабочих дней с момента прекращения Соглашения или требования",
          "certification_status": "defined",
          "certification_details": "письменный акт, подписанный уполномоченным лицом и направленный в течение 5 дней",
          "backup_exception_status": "defined",
          "backup_exception_details": "вправе сохранить архивные копии в объёме, необходимом для соблюдения требований законодательства РФ",
          "evidence": [
            {
              "clause_ref": "п. 8.1–8.2",
              "quote": "При прекращении настоящего Соглашения или по первому требованию Раскрывающей стороны Получающая сторона обязуется по своему выбору вернуть или уничтожить все оригиналы и копии документов... Уничтожение должно быть подтверждено письменным актом..."
            }
          ]
        }

        Пример 2 — минимальное условие без акта и без исключений:
        Фрагмент:
        "Получающая сторона обязана вернуть все полученные документы по окончании
        срока действия Соглашения."

        Ответ:
        {
          "return_or_destruction_status": "defined",
          "return_or_destruction_details": "обязана вернуть все полученные документы",
          "deadline_status": "defined",
          "deadline_details": "по окончании срока действия Соглашения (конкретный срок в днях не указан)",
          "certification_status": "not_defined",
          "certification_details": "Данные не определены",
          "backup_exception_status": "not_defined",
          "backup_exception_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Получающая сторона обязана вернуть все полученные документы по окончании срока действия Соглашения."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязаны добросовестно исполнять свои обязательства."

        Ответ:
        {
          "return_or_destruction_status": "not_defined",
          "return_or_destruction_details": "Данные не определены",
          "deadline_status": "not_defined",
          "deadline_details": "Данные не определены",
          "certification_status": "not_defined",
          "certification_details": "Данные не определены",
          "backup_exception_status": "not_defined",
          "backup_exception_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата об обязанности возврата или уничтожения?
        2. Найдена ли прямая цитата о сроке (или указание на момент)?
        3. Предусмотрено ли предоставление акта/сертификата об уничтожении?
        4. Разрешено ли сохранение архивных/резервных (backup) копий?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "return_or_destruction_status": "<defined / not_defined>",
          "return_or_destruction_details": "<текст или 'Данные не определены'>",
          "deadline_status": "<defined / not_defined>",
          "deadline_details": "<текст или 'Данные не определены'>",
          "certification_status": "<defined / not_defined>",
          "certification_details": "<текст или 'Данные не определены'>",
          "backup_exception_status": "<defined / not_defined>",
          "backup_exception_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат информации уничтожение информации срок возврата подтверждение уничтожения сертификат об уничтожении акт об уничтожении право сохранять копии архивные копии backup резервное копирование удаление носителей"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2200

      compact_output: false

      presence_signal:
        field: "return_destruction_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA порядок возврата или уничтожения
        конфиденциальной информации по окончании срока или по требованию:
        обязанность вернуть/уничтожить носители, конкретные сроки,
        требование акта/сертификата об уничтожении, исключения для архивных копий.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. return_destruction_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - return_or_destruction_status = "not_defined";
          - deadline_status = "not_defined";
          - certification_status = "not_defined";
          - backup_exception_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. return_or_destruction_status:
          - "defined" — если в тексте прямо указана обязанность вернуть или уничтожить
            носители информации (или право выбора получателя);
          - "not_defined" — если обязанность не указана.

        2. return_or_destruction_details:
          Порядок возврата или уничтожения носителей на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. deadline_status:
          - "defined" — если в тексте прямо указан конкретный срок возврата или уничтожения;
          - "not_defined" — если срок не указан.

        4. deadline_details:
          Конкретные сроки возврата или уничтожения на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. certification_status:
          - "defined" — если в тексте прямо указано требование предоставить
            письменное подтверждение уничтожения (акт, сертификат);
          - "not_defined" — если требование не указано.

        6. certification_details:
          Требование письменного акта или сертификата об уничтожении на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. backup_exception_status:
          - "defined" — если в тексте прямо указано наличие исключений для архивных
            или резервных (backup) копий;
          - "not_defined" — если исключения не указаны.

        8. backup_exception_details:
          Наличие и условия исключений для архивных или резервных копий на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни return_destruction_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - return_or_destruction: ищи обязанности вернуть, стереть, уничтожить, прекратить использование,
          изъять материальные носители.
        - deadline: извлекай конкретные периоды (например, «в течение 10 дней», «немедленно по первому требованию»).
        - certification: фиксируй требования выдать «акт об уничтожении», «письменное подтверждение»,
          «сертификат за подписью уполномоченного лица».
        - backup_exception: проверяй формулировки, разрешающие сохранять копии «в архивных целях»,
          «для соблюдения императивных требований законодательства РФ»,
          «в автоматических системах резервного копирования (backup)».
        - Если параметр определяется через отсылку к другому документу/приложению,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни обязанности возврата, ни уничтожения.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только обязанность вернуть без срока и акта.
          "Получающая сторона обязана вернуть все полученные документы по окончании срока действия Соглашения".
          → presence = "present";
            return_or_destruction_status = "defined";
            deadline_status = "not_defined";
            certification_status = "not_defined";
            backup_exception_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки возврата.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Отсылка на регламент или приложение.
          "Порядок возврата определяется согласно Регламенту (Приложение №3)".
          → presence = "present";
            return_or_destruction_status = "defined";
            return_or_destruction_details = "Определяется согласно Регламенту (Приложение №3)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для return_destruction_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "return_destruction_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по возврату/уничтожению информации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_or_destruction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возврата или уничтожения информации. Внутреннее enum-поле."
          required: true

        - name: "return_or_destruction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Возврат/уничтожение"
          description: >
            Порядок возврата или уничтожения носителей конфиденциальной информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока возврата/уничтожения. Внутреннее enum-поле."
          required: true

        - name: "deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок возврата/уничтожения"
          description: >
            Срок возврата или уничтожения конфиденциальной информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "certification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения факта уничтожения информации. Внутреннее enum-поле."
          required: true

        - name: "certification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подтверждение уничтожения"
          description: >
            Требование письменного акта или сертификата об уничтожении информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "backup_exception_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия исключений для архивных/резервных копий. Внутреннее enum-поле."
          required: true

        - name: "backup_exception_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Архивные копии"
          description: >
            Наличие и условия исключений для архивных или резервных копий (backup).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: government_disclosure_check
    name: "Порядок раскрытия по требованию государственных органов"
    description: >
      Фактографическая проверка процедурных условий раскрытия конфиденциальной
      информации по законному требованию суда или государственных органов:
      обязанность предварительного уведомления раскрывающей стороны,
      оказание содействия в оспаривании запроса или ограничении объёма,
      а также раскрытие строго в минимально необходимом объёме.
    triggers:
      any:
        - government_disclosure
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "раскрытие по требованию суда"
        - "по требованию государственных органов"
        - "обязательное раскрытие"
        - "уведомление о запросе"
        - "предварительное уведомление"
        - "минимально необходимый объём"
        - "судебный запрос"
        - "налоговые органы"
        - "содействие в ограничении"
        - "защитный судебный приказ"
        - "protective order"
        - "мотивированное требование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)по\\s+требовани[юю].*?(суд|государственн|орган)"
        - "(?i)обязательн[оа]е\\s+раскрыти"
        - "(?i)предварительн[а-яё]+\\s+уведом"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 6; ГК РФ ст. 1465).
        Проверяется только один вопрос: процессуальный порядок раскрытия информации
        по требованию государственных органов и суда.

        Нормативный ориентир:
        - ФЗ-98 ст. 6 ч. 3 — обязанность обладателя коммерческой тайны и её получателя
          предоставить информацию по мотивированному требованию органа государственной
          власти, иного государственного органа, органа местного самоуправления.
        - Различай: само право на раскрытие по закону (исключение из конфиденциальности)
          и процедурные обязанности получателя при таком раскрытии (предварительное
          уведомление, минимизация объёма, помощь в защите).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Разрешение/порядок раскрытия по требованию суда, правоохранительных или
           иных уполномоченных государственных органов.
        2. Обязанность получателя уведомить раскрывающую сторону о поступившем запросе
           (особенно важно: предварительно до раскрытия или постфактум).
        3. Обязанность оказать содействие раскрывающей стороне в оспаривании запроса
           или получении обеспечительных мер / закрытого режима заседания.
        4. Требование раскрывать информацию строго в минимально необходимом объёме.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу или регламенту —
           это считается "defined", в details укажи точную ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный комплекс процессуальных гарантий:
        Фрагмент:
        "В случае получения обязательного для исполнения запроса суда или
        уполномоченного государственного органа Получающая сторона вправе раскрыть
        Конфиденциальную информацию при условии, что она незамедлительно (но не
        позднее 3 рабочих дней до момента раскрытия) письменно уведомит об этом
        Раскрывающую сторону. Получающая сторона обязана оказать разумное содействие
        Раскрывающей стороне в законном предотвращении такого раскрытия или ограничении
        его объёма, а в случае неизбежности раскрытия — предоставить информацию
        строго в минимально требуемом законом объёме с сохранением грифа конфиденциальности."

        Ответ:
        {
          "government_disclosure_status": "defined",
          "government_disclosure_details": "вправе раскрыть при получении обязательного для исполнения запроса суда или госоргана",
          "notification_status": "defined",
          "notification_details": "незамедлительное письменное уведомление (не позднее 3 рабочих дней до момента раскрытия)",
          "cooperation_status": "defined",
          "cooperation_details": "обязана оказать разумное содействие в предотвращении раскрытия или ограничении его объёма",
          "minimum_disclosure_status": "defined",
          "minimum_disclosure_details": "строго в минимально требуемом законом объёме с сохранением грифа конфиденциальности",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "В случае получения обязательного для исполнения запроса суда или уполномоченного государственного органа Получающая сторона вправе раскрыть Конфиденциальную информацию при условии, что она незамедлительно (но не позднее 3 рабочих дней до момента раскрытия) письменно уведомит об этом Раскрывающую сторону."
            }
          ]
        }

        Пример 2 — раскрытие разрешено, процедура не урегулирована:
        Фрагмент:
        "Обязательства по неразглашению не действуют при раскрытии информации
        государственным органам по закону."

        Ответ:
        {
          "government_disclosure_status": "defined",
          "government_disclosure_details": "раскрытие информации государственным органам по закону",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "cooperation_status": "not_defined",
          "cooperation_details": "Данные не определены",
          "minimum_disclosure_status": "not_defined",
          "minimum_disclosure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Обязательства по неразглашению не действуют при раскрытии информации государственным органам по закону."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны сохраняют конфиденциальность всех сведений."

        Ответ:
        {
          "government_disclosure_status": "not_defined",
          "government_disclosure_details": "Данные не определены",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "cooperation_status": "not_defined",
          "cooperation_details": "Данные не определены",
          "minimum_disclosure_status": "not_defined",
          "minimum_disclosure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о раскрытии по запросу суда/госорганов?
        2. Предусмотрено ли предварительное или последующее уведомление о запросе?
        3. Содержит ли договор обязанность содействия в защите/ограничении раскрытия?
        4. Зафиксировано ли ограничение объёма раскрытия минимально необходимым?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "government_disclosure_status": "<defined / not_defined>",
          "government_disclosure_details": "<текст или 'Данные не определены'>",
          "notification_status": "<defined / not_defined>",
          "notification_details": "<текст или 'Данные не определены'>",
          "cooperation_status": "<defined / not_defined>",
          "cooperation_details": "<текст или 'Данные не определены'>",
          "minimum_disclosure_status": "<defined / not_defined>",
          "minimum_disclosure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "раскрытие по требованию суда по требованию государственных органов обязательное раскрытие мотивированное требование предварительное уведомление о запросе минимально необходимый объём содействие в ограничении protective order судебный запрос налоговые органы"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - notice
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "общедоступная информация"
        - "была известна до раскрытия"
        - "независимо разработана"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "government_disclosure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA процессуальный порядок и условия
        раскрытия информации по законному требованию государственных органов или суда:
        разрешение/порядок раскрытия, обязанность уведомления раскрывающей стороны,
        содействие в оспаривании запроса, требование минимального объёма раскрытия.
        Не анализируй определение конфиденциальной информации, общие исключения, меры защиты, штрафы или срок действия соглашения.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. government_disclosure_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - government_disclosure_status = "not_defined";
          - notification_status = "not_defined";
          - cooperation_status = "not_defined";
          - minimum_disclosure_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. government_disclosure_status:
          - "defined" — если в тексте прямо указано разрешение/порядок раскрытия
            по обязательному требованию суда или госорганов;
          - "not_defined" — если условие не указано.

        2. government_disclosure_details:
          Условия раскрытия по обязательному требованию суда/госорганов на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. notification_status:
          - "defined" — если в тексте прямо указана обязанность уведомить раскрывающую
            сторону о поступившем запросе;
          - "not_defined" — если обязанность уведомления не указана.

        4. notification_details:
          Обязанность и сроки уведомления раскрывающей стороны о запросе на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. cooperation_status:
          - "defined" — если в тексте прямо указана обязанность содействия раскрывающей
            стороне в оспаривании запроса или ограничении раскрытия;
          - "not_defined" — если обязанность содействия не указана.

        6. cooperation_details:
          Обязанность содействия в оспаривании запроса или ограничении объёма раскрытия
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. minimum_disclosure_status:
          - "defined" — если в тексте прямо указано требование раскрывать информацию
            строго в минимально необходимом объёме;
          - "not_defined" — если требование не указано.

        8. minimum_disclosure_details:
          Обязанность предоставить сведения строго в минимально необходимом объёме
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни government_disclosure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - government_disclosure: ищи условия о праве/обязанности предоставить сведения
          по запросу судов, налоговых органов, ФАС, правоохранительных органов.
        - notification: фиксируй обязанность уведомить раскрывающую сторону,
          обращая внимание на указание срока («немедленно», «до момента раскрытия», «в течение 3 дней»).
        - cooperation: ищи условия о сотрудничестве сторон в целях защиты информации
          («оказать содействие в получении защитного приказа», «не препятствовать обжалованию запроса»).
        - minimum_disclosure: ищи требования предоставить «только минимально требуемую часть»,
          «строго в объёме запроса», «с сохранением грифа конфиденциальности».
        - Если параметр определяется через отсылку к другому документу/регламенту,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни разрешения раскрыть, ни процедурных условий.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только разрешение раскрыть по закону без процедуры.
          "Обязательства по неразглашению не действуют при раскрытии информации государственным органам по закону".
          → presence = "present";
            government_disclosure_status = "defined";
            notification_status = "not_defined";
            cooperation_status = "not_defined";
            minimum_disclosure_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки уведомления о запросе.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный комплекс процессуальных гарантий.
          Уведомление за 3 дня + содействие в ограничении + минимальный объём.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для government_disclosure_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "government_disclosure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по раскрытию по требованию госорганов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "government_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о раскрытии по обязательному требованию суда/госорганов. Внутреннее enum-поле."
          required: true

        - name: "government_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Раскрытие по требованию"
          description: >
            Условия раскрытия информации по запросу суда или государственных органов.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности уведомления раскрывающей стороны о запросе. Внутреннее enum-поле."
          required: true

        - name: "notification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Уведомление о запросе"
          description: >
            Обязанность и сроки уведомления раскрывающей стороны о поступившем государственном/судебном запросе.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "cooperation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус содействия в ограничении объёма раскрытия или оспаривании запроса. Внутреннее enum-поле."
          required: true

        - name: "cooperation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Содействие в ограничении"
          description: >
            Обязанность содействия раскрывающей стороне в оспаривании запроса или ограничении объёма раскрытия.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "minimum_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования о минимально необходимом объёме раскрытия. Внутреннее enum-поле."
          required: true

        - name: "minimum_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Минимальный объём"
          description: >
            Обязанность предоставить сведения строго в минимально необходимом объёме с сохранением конфиденциальности.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: special_clauses_check
    name: "Специальные оговорки: residuals, no-warranty, non-solicitation, non-compete"
    description: >
      Фактографическая проверка наличия в NDA скрытых и специальных ограничительных
      оговорок: оговорка о «неосязаемых остатках» / памяти сотрудников (residuals clause),
      отказ от гарантий достоверности и полноты («как есть» / as-is disclaimer),
      запрет переманивания сотрудников или клиентов (non-solicitation),
      а также запрет конкурирующей деятельности (non-compete).
    triggers:
      any:
        - residuals_clause
        - non_compete_linked
        - ma_context
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "residuals"
        - "неосязаемые остатки"
        - "общие знания и навыки"
        - "запомненная информация"
        - "память сотрудников"
        - "unaided memory"
        - "без гарантий"
        - "как есть"
        - "as is"
        - "отказ от гарантий"
        - "не гарантирует полноту"
        - "не гарантирует достоверность"
        - "disclaimer"
        - "запрет переманивания"
        - "non-solicitation"
        - "не переманивать"
        - "не привлекать сотрудников"
        - "не привлекать клиентов"
        - "запрет конкуренции"
        - "non-compete"
        - "не конкурировать"
        - "ограничение конкуренции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bresiduals\\b"
        - "(?i)as\\s+is"
        - "(?i)non[\\s-]?solicitation"
        - "(?i)non[\\s-]?compete"
        - "(?i)переманиван"
        - "(?i)неосязаем[а-яё]+\\s+остат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 10, 421, 431.2; ФЗ-135 «О защите конкуренции»).
        Проверяется только один вопрос: наличие специальных и ограничительных оговорок
        (residuals, no-warranty, non-solicitation, non-compete).

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора и включение непоименованных условий.
        - ст. 431.2 ГК РФ — заверения об обстоятельствах и отказ от предоставления гарантий (дисклеймер «as is»).
        - ст. 10 ГК РФ, ст. 37 Конституции РФ, ФЗ-135 «О защите конкуренции» — правовой режим
          и риски условий о запрете конкуренции (non-compete) и переманивания (non-solicitation).
        - Residuals clause — оговорка, разрешающая использовать нематериальные остаточные знания
          и опыт, сохранившиеся в памяти сотрудников без обращения к материальным носителям (unaided memory).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай юридическую действительность условий (например, non-compete), фиксируй их наличие как факт.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Residuals clause (разрешение использовать информацию, сохранившуюся в памяти без обращения к документам).
        2. Отказ от гарантий полноты, точности и пригодности информации («как есть» / as-is disclaimer).
        3. Запрет переманивания сотрудников, подрядчиков или клиентов (non-solicitation).
        4. Запрет конкуренции или ведения аналогичной коммерческой деятельности (non-compete).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу («в соответствии с Соглашением о сотрудничестве») —
           это считается "defined", в details укажи точную ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — наличие специальных оговорок:
        Фрагмент:
        "Информация передаётся на условиях «как есть» (as is), Раскрывающая сторона
        не предоставляет никаких явных или подразумеваемых гарантий её полноты,
        точности или пригодности для конкретных целей. Настоящее Соглашение не
        ограничивает право Получающей стороны использовать общие идеи, концепции
        и ноу-хау, сохранившиеся в памяти сотрудников, работавших с информацией
        (оговорка об остаточных знаниях — residuals clause). В течение 2 (двух) лет
        с даты подписания Получающая сторона обязуется не переманивать и не нанимать
        работников Раскрывающей стороны без её предварительного письменного согласия."

        Ответ:
        {
          "residuals_clause_status": "defined",
          "residuals_clause_details": "разрешено использовать общие идеи, концепции и ноу-хау, сохранившиеся в памяти сотрудников (residuals)",
          "no_warranty_status": "defined",
          "no_warranty_details": "передаётся «как есть» (as is), без гарантий полноты, точности и пригодности",
          "non_solicitation_status": "defined",
          "non_solicitation_details": "запрет переманивать и нанимать работников в течение 2 лет без согласия",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1–9.3",
              "quote": "Информация передаётся на условиях «как есть» (as is), Раскрывающая сторона не предоставляет никаких явных или подразумеваемых гарантий... В течение 2 (двух) лет с даты подписания Получающая сторона обязуется не переманивать и не нанимать работников..."
            }
          ]
        }

        Пример 2 — включён прямой запрет конкуренции (non-compete):
        Фрагмент:
        "Получающая сторона обязуется в течение срока действия настоящего Соглашения
        и 1 года после его прекращения не осуществлять конкурирующую деятельность
        в сфере разработки аналогичного программного обеспечения на территории РФ."

        Ответ:
        {
          "residuals_clause_status": "not_defined",
          "residuals_clause_details": "Данные не определены",
          "no_warranty_status": "not_defined",
          "no_warranty_details": "Данные не определены",
          "non_solicitation_status": "not_defined",
          "non_solicitation_details": "Данные не определены",
          "non_compete_status": "defined",
          "non_compete_details": "запрет осуществлять конкурирующую деятельность в сфере разработки аналогичного ПО на территории РФ в течение срока NDA и 1 года после",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "Получающая сторона обязуется в течение срока действия настоящего Соглашения и 1 года после его прекращения не осуществлять конкурирующую деятельность в сфере разработки аналогичного программного обеспечения на территории РФ."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны согласовали условия конфиденциальности."

        Ответ:
        {
          "residuals_clause_status": "not_defined",
          "residuals_clause_details": "Данные не определены",
          "no_warranty_status": "not_defined",
          "no_warranty_details": "Данные не определены",
          "non_solicitation_status": "not_defined",
          "non_solicitation_details": "Данные не определены",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Проверена ли оговорка об остаточных знаниях/памяти сотрудников (residuals clause)?
        2. Проверен ли отказ от гарантий полноты/точности информации (as-is disclaimer)?
        3. Проверен ли запрет переманивания сотрудников или контрагентов (non-solicitation)?
        4. Проверен ли запрет конкурирующей деятельности (non-compete)?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "residuals_clause_status": "<defined / not_defined>",
          "residuals_clause_details": "<текст или 'Данные не определены'>",
          "no_warranty_status": "<defined / not_defined>",
          "no_warranty_details": "<текст или 'Данные не определены'>",
          "non_solicitation_status": "<defined / not_defined>",
          "non_solicitation_details": "<текст или 'Данные не определены'>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "residuals неосязаемые остатки общие знания и навыки unaided memory без гарантий as is отказ от гарантий не гарантирует полноту достоверность дисклеймер disclaimer non-solicitation переманивание сотрудников non-compete запрет конкуренции конкурирующая деятельность"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
        - warranty
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
        - boilerplate
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "общедоступная информация"
        - "была известна до раскрытия"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.35, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "special_clauses_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о специальных и ограничительных оговорках:
        residuals clause (неосязаемые остатки / память сотрудников),
        отказ от гарантий («как есть» / as-is disclaimer),
        запрет переманивания (non-solicitation) и запрет конкуренции (non-compete).
        Не анализируй определение конфиденциальной информации, общие исключения, меры защиты или ответственность за нарушение.
        Не оценивай юридическую действительность условий (например, non-compete) — фиксируй их наличие как факт.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. special_clauses_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - residuals_clause_status = "not_defined";
          - no_warranty_status = "not_defined";
          - non_solicitation_status = "not_defined";
          - non_compete_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. residuals_clause_status:
          - "defined" — если в тексте прямо указана оговорка о праве использовать
            знания, сохранившиеся в памяти сотрудников (residuals / unaided memory);
          - "not_defined" — если оговорка не указана.

        2. residuals_clause_details:
          Оговорка о неосязаемых остаточных знаниях на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. no_warranty_status:
          - "defined" — если в тексте прямо указан отказ от гарантий полноты,
            точности и пригодности информации («как есть» / as-is disclaimer);
          - "not_defined" — если отказ от гарантий не указан.

        4. no_warranty_details:
          Отказ от предоставления гарантий на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. non_solicitation_status:
          - "defined" — если в тексте прямо указан запрет переманивания
            и найма работников или привлечения клиентов;
          - "not_defined" — если запрет не указан.

        6. non_solicitation_details:
          Условие о запрете переманивания и найма работников или клиентов на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. non_compete_status:
          - "defined" — если в тексте прямо указан запрет конкуренции
            и ведения аналогичного бизнеса;
          - "not_defined" — если запрет не указан.

        8. non_compete_details:
          Условие о запрете конкуренции и осуществления аналогичной коммерческой деятельности
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни special_clauses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не оценивай юридическую действительность условий (например, non-compete) —
          фиксируй их наличие как факт.
        - residuals_clause: ищи оговорки о праве использовать знания, сохранившиеся в памяти
          сотрудников без намеренного заучивания («unaided memory», «общие навыки и идеи»,
          «остаточные знания»).
        - no_warranty: ищи формулировки «как есть», «as is», «без каких-либо гарантий полноты
          или достоверности», «раскрывающая сторона не гарантирует точность».
        - non_solicitation: фиксируй обязательства не нанимать, не склонять к увольнению
          сотрудников, не переманивать заказчиков/клиентов.
        - non_compete: фиксируй обязательства не создавать конкурирующие продукты,
          не вести конкурирующую деятельность, не входить в состав конкурентов.
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни одной из 4 специальных оговорок.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Наличие только одной из 4 оговорок.
          Есть только non-compete, остальные оговорки отсутствуют.
          → presence = "present";
            non_compete_status = "defined";
            residuals_clause_status = no_warranty_status = non_solicitation_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки non-compete.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Отсылка на внешний документ.
          "Условия non-solicitation определяются в соответствии с Соглашением о сотрудничестве".
          → presence = "present";
            non_solicitation_status = "defined";
            non_solicitation_details = "Определяется в соответствии с Соглашением о сотрудничестве".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для special_clauses_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "special_clauses_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по специальным оговоркам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "residuals_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки о неосязаемых остаточных знаниях (residuals clause). Внутреннее enum-поле."
          required: true

        - name: "residuals_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Residuals clause"
          description: >
            Оговорка о праве использования общих остаточных знаний в памяти сотрудников (residuals).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "no_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отказа от гарантий полноты и достоверности информации (as is). Внутреннее enum-поле."
          required: true

        - name: "no_warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отказ от гарантий"
          description: >
            Отказ от предоставления гарантий полноты, точности и пригодности информации («как есть» / as-is disclaimer).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "non_solicitation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета переманивания сотрудников или клиентов (non-solicitation). Внутреннее enum-поле."
          required: true

        - name: "non_solicitation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Non-solicitation"
          description: >
            Условие о запрете переманивания и найма работников или клиентов раскрывающей стороны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета конкурирующей деятельности (non-compete). Внутреннее enum-поле."
          required: true

        - name: "non_compete_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Non-compete"
          description: >
            Условие о запрете конкуренции и осуществления аналогичной коммерческой деятельности.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: dispute_resolution_check
    name: "Применимое право, разрешение споров и обеспечительные меры"
    description: >
      Фактографическая проверка применимого материального права, способа разрешения споров
      (государственный суд / коммерческий арбитраж / переговоры), договорной подсудности,
      сроков претензионного порядка, а также специального для NDA права на незамедлительное
      получение обеспечительных мер и судебного запрета (injunctive relief).
    triggers:
      any:
        - international_parties
        - injunctive_relief
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "применимое право"
        - "регулируется правом"
        - "подсудность"
        - "разрешение споров"
        - "арбитраж"
        - "третейский суд"
        - "обеспечительные меры"
        - "судебный запрет"
        - "injunctive relief"
        - "запретительные меры"
        - "претензионный порядок"
        - "срок рассмотрения претензии"
        - "governing law"
        - "jurisdiction"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим[оа]е\\s+прав"
        - "(?i)регулируетс[яь]\\s+прав"
        - "(?i)injunctive\\s+relief"
        - "(?i)обеспечительн[а-яё]+\\s+мер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 1210, 1211; АПК РФ ст. 90–99; ГПК РФ ст. 139, 140; ст. 452 ГК РФ).
        Проверяется только один вопрос: применимое право, порядок разрешения споров,
        подсудность, претензионный порядок и оговорка об обеспечительных мерах (injunctive relief).

        Нормативный ориентир:
        - ст. 1210 ГК РФ — выбор применимого права сторонами договора.
        - ст. 35–37 АПК РФ / ст. 32 ГПК РФ — договорная подсудность.
        - ч. 5 ст. 4 АПК РФ — обязательный досудебный (претензионный) порядок.
        - ст. 90–99 АПК РФ — обеспечительные меры (включая предварительные обеспечительные меры
          и судебные запреты на использование/распространение информации).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Для NDA особое значение имеет право стороны обратиться за обеспечительными мерами
          (injunctive relief) без соблюдения длительного претензионного порядка.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Применимое право (материальное право страны/юрисдикции).
        2. Способ разрешения споров (государственный суд / коммерческий арбитраж / переговоры / смешанный).
        3. Договорная подсудность или конкретный арбитражный институт/место арбитража.
        4. Претензионный порядок (наличие обязанности направления претензии и срок ответа).
        5. Наличие права требовать применения обеспечительных мер / судебного запрета (injunctive relief).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к основному договору или регламенту
           («в соответствии с разделом о разрешении споров Генерального соглашения») —
           это считается "defined", в details укажи точную ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный блок разрешения споров с injunctive relief:
        Фрагмент:
        "Настоящее Соглашение регулируется и толкуется в соответствии с материальным
        правом Российской Федерации. Все споры подлежат разрешению в Арбитражном суде
        города Москвы после соблюдения обязательного претензионного порядка со сроком
        ответа на претензию 10 (десять) рабочих дней. Стороны признают, что нарушение
        конфиденциальности может причинить непоправимый вред, в связи с чем Раскрывающая
        сторона имеет право обращаться в любой компетентный суд за получением срочных
        обеспечительных мер (судебного запрета / injunctive relief) до и без соблюдения
        претензионного порядка."

        Ответ:
        {
          "governing_law_status": "defined",
          "governing_law_details": "материальное право Российской Федерации",
          "dispute_method_code": "court",
          "dispute_method_details": "государственный арбитражный суд",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "Арбитражный суд города Москвы",
          "pretrial_status": "defined",
          "pretrial_details": "обязательный претензионный порядок, срок ответа — 10 рабочих дней",
          "injunctive_relief_status": "defined",
          "injunctive_relief_details": "право обращаться за срочными обеспечительными мерами (судебным запретом) без соблюдения претензионного порядка",
          "evidence": [
            {
              "clause_ref": "п. 10.1–10.3",
              "quote": "Настоящее Соглашение регулируется и толкуется в соответствии с материальным правом Российской Федерации. Все споры подлежат разрешению в Арбитражном суде города Москвы... Раскрывающая сторона имеет право обращаться в любой компетентный суд за получением срочных обеспечительных мер..."
            }
          ]
        }

        Пример 2 — арбитражная оговорка без обеспечительных мер:
        Фрагмент:
        "Право Англии и Уэльса. Споры разрешаются в Международном арбитражном суде при ТПП РФ
        (МКАС) в соответствии с его регламентом. Место арбитража — г. Москва."

        Ответ:
        {
          "governing_law_status": "defined",
          "governing_law_details": "право Англии и Уэльса",
          "dispute_method_code": "arbitration",
          "dispute_method_details": "третейский суд / коммерческий арбитраж (МКАС при ТПП РФ)",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "МКАС при ТПП РФ, место арбитража — г. Москва",
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "injunctive_relief_status": "not_defined",
          "injunctive_relief_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Право Англии и Уэльса. Споры разрешаются в Международном арбитражном суде при ТПП РФ (МКАС) в соответствии с его регламентом. Место арбитража — г. Москва."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны добросовестно исполняют обязательства."

        Ответ:
        {
          "governing_law_status": "not_defined",
          "governing_law_details": "Данные не определены",
          "dispute_method_code": "not_defined",
          "dispute_method_details": "Данные не определены",
          "jurisdiction_status": "not_defined",
          "jurisdiction_details": "Данные не определены",
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "injunctive_relief_status": "not_defined",
          "injunctive_relief_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о применимом праве?
        2. Правильно ли определён код dispute_method_code (court / arbitration / negotiation / mixed / not_defined)?
        3. Найдена ли подсудность или арбитражное учреждение?
        4. Зафиксирован ли претензионный порядок и срок ответа?
        5. Проверено ли наличие специальной оговорки об обеспечительных мерах (injunctive relief)?
        6. Все ли статус-поля содержат только значения из allowed_values?
        7. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "governing_law_status": "<defined / not_defined>",
          "governing_law_details": "<текст или 'Данные не определены'>",
          "dispute_method_code": "<court / arbitration / negotiation / mixed / not_defined>",
          "dispute_method_details": "<текст или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<текст или 'Данные не определены'>",
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Данные не определены'>",
          "injunctive_relief_status": "<defined / not_defined>",
          "injunctive_relief_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "применимое право регулируется правом подсудность разрешение споров арбитраж третейский суд обеспечительные меры судебный запрет injunctive relief претензионный порядок governing law jurisdiction срок рассмотрения претензии"
      retrieval_profile: "dispute_resolution_check"
      preferred_unit_types:
        - governing_law
        - jurisdiction
        - dispute_resolution
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
        - remedies
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "dispute_resolution_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA положения о применимом праве,
        порядке разрешения споров, подсудности, претензионном порядке и праве
        на обеспечительные меры (injunctive relief).
        Не анализируй определение конфиденциальной информации, исключения, меры защиты или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dispute_resolution_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - governing_law_status = "not_defined";
          - dispute_method_code = "not_defined";
          - jurisdiction_status = "not_defined";
          - pretrial_status = "not_defined";
          - injunctive_relief_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. governing_law_status:
          - "defined" — если в тексте прямо указано применимое материальное право;
          - "not_defined" — если применимое право не указано.

        2. governing_law_details:
          Применимое материальное право на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. dispute_method_code:
          - "court" — государственный арбитражный суд или суд общей юрисдикции;
          - "arbitration" — коммерческий арбитраж / третейский суд (МКАС, РСПП, LCIA, ICC и др.);
          - "negotiation" — только переговоры;
          - "mixed" — комбинация (например, переговоры + суд/арбитраж);
          - "not_defined" — способ не определён.

        4. dispute_method_details:
          Описание согласованного порядка и способа разрешения споров на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. jurisdiction_status:
          - "defined" — если в тексте прямо указана договорная подсудность или арбитражный орган;
          - "not_defined" — если подсудность не указана.

        6. jurisdiction_details:
          Договорная подсудность или конкретное арбитражное учреждение на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. pretrial_status:
          - "defined" — если в тексте прямо указан претензионный порядок и срок ответа;
          - "not_defined" — если претензионный порядок не указан.

        8. pretrial_details:
          Условия претензионного порядка и срок ответа на претензию на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. injunctive_relief_status:
          - "defined" — если в тексте прямо указано право на обеспечительные меры / судебный запрет;
          - "not_defined" — если право на обеспечительные меры не указано.

        10. injunctive_relief_details:
            Право стороны на получение экстренных обеспечительных мер и судебного запрета
            на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни dispute_resolution_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - dispute_method_code:
          * "court" — государственный арбитражный суд или суд общей юрисдикции;
          * "arbitration" — коммерческий арбитраж / третейский суд (МКАС, РСПП, LCIA, ICC и др.);
          * "negotiation" — только переговоры;
          * "mixed" — комбинация (например, переговоры + суд/арбитраж);
          * "not_defined" — способ не определён.
        - injunctive_relief: ищи условия о праве стороны обратиться в суд за обеспечительными мерами,
          наложением ареста или судебного запрета без ожидания истечения срока на ответ по претензии.
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни применимого права, ни порядка разрешения споров, ни подсудности.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только общая ссылка на закон.
          "Споры разрешаются в соответствии с законодательством РФ".
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные подсудности.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный блок с injunctive relief.
          Указаны применимое право, подсудность, претензионный порядок и право на обеспечительные меры.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dispute_resolution_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для dispute_method_code используй только: "court", "arbitration", "negotiation", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dispute_resolution_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по разрешению споров. Внутреннее агрегатное signal-поле."
          required: true

        - name: "governing_law_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания применимого права. Внутреннее enum-поле."
          required: true

        - name: "governing_law_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Применимое право"
          description: >
            Применимое материальное право к соглашению о неразглашении.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "dispute_method_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["court", "arbitration", "negotiation", "mixed", "not_defined"]
          display_in_grid: false
          description: "Способ разрешения споров (государственный суд / арбитраж / переговоры). Внутреннее enum-поле."
          required: true

        - name: "dispute_method_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Разрешение споров"
          description: >
            Описание согласованного порядка и способа разрешения споров.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "jurisdiction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания подсудности / места арбитража. Внутреннее enum-поле."
          required: true

        - name: "jurisdiction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подсудность"
          description: >
            Договорная подсудность или конкретное арбитражное учреждение.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "pretrial_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия обязательного претензионного порядка. Внутреннее enum-поле."
          required: true

        - name: "pretrial_details"
          type: "string"
          presentation: "fact"
          label: "Претензионный порядок"
          description: >
            Условия обязательного досудебного (претензионного) порядка и срок рассмотрения претензии.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "injunctive_relief_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус специальной оговорки об обеспечительных мерах (injunctive relief). Внутреннее enum-поле."
          required: true

        - name: "injunctive_relief_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Обеспечительные меры"
          description: >
            Право стороны на получение экстренных обеспечительных мер и судебного запрета (injunctive relief).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: ip_rights_preservation_check
    name: "Сохранение IP-прав и отсутствие передачи лицензии через NDA"
    description: >
      Фактографическая проверка оговорок о сохранении интеллектуальных прав
      за раскрывающей стороной, отсутствии передачи какой-либо лицензии через
      сам факт раскрытия информации, а также запрета на регистрацию объектов
      IP на основе раскрытых сведений. Критически важно для M&A, IT и R&D сделок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "интеллектуальная собственность"
        - "исключительные права"
        - "не передаёт прав"
        - "не является лицензией"
        - "no license"
        - "сохраняет все права"
        - "право собственности на информацию"
        - "товарный знак"
        - "патент"
        - "ноу-хау"
        - "секрет производства"
        - "исходный код"
        - "запрет регистрации"
        - "не вправе регистрировать"
        - "intellectual property"
        - "proprietary rights"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+(являетс|передаёт|предоставля)[а-яё]+\\s+(лицензи|прав)"
        - "(?i)no\\s+license"
        - "(?i)сохраняет\\s+(все|исключительные)\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и интеллектуальной собственности.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ часть IV, ст. 1225–1551; ст. 1465–1472 — ноу-хау;
        ФЗ-98 «О коммерческой тайне»).
        Проверяется только один вопрос: сохранение IP-прав раскрывающей стороны
        и отсутствие передачи лицензии через факт раскрытия информации.

        Нормативный ориентир:
        - ст. 1233–1237 ГК РФ — распоряжение исключительным правом, лицензионный договор.
        - ст. 1465–1472 ГК РФ — секрет производства (ноу-хау), права обладателя.
        - ст. 1467 ГК РФ — исключительное право на секрет производства действует до
          тех пор, пока сохраняется конфиденциальность; раскрытие по NDA не должно
          прекращать это право.
        - ст. 1229 ГК РФ — исключительное право на результат интеллектуальной деятельности.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Ключевой вопрос: содержит ли NDA явную оговорку о том, что раскрытие
          информации НЕ является передачей лицензии и НЕ передаёт IP-прав?

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оговорку о сохранении всех IP-прав за раскрывающей стороной.
        2. Явное указание, что NDA не является лицензией и не передаёт прав на IP.
        3. Запрет получателю регистрировать объекты IP (товарные знаки, патенты,
           доменные имена) на основе раскрытой информации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный IP-блок:
        Фрагмент:
        "Все исключительные права на Конфиденциальную информацию, включая
        права на объекты интеллектуальной собственности (ноу-хау, изобретения,
        программное обеспечение, товарные знаки), остаются за Раскрывающей
        стороной. Настоящее Соглашение не предоставляет Получающей стороне
        какой-либо лицензии, явной или подразумеваемой, на использование
        Конфиденциальной информации за пределами цели раскрытия. Получающая
        сторона обязуется не подавать заявки на регистрацию каких-либо объектов
        интеллектуальной собственности на основе полученной информации."

        Ответ:
        {
          "ip_retention_status": "defined",
          "ip_retention_details": "все исключительные права на КИ, включая ноу-хау, изобретения, ПО, товарные знаки, остаются за Раскрывающей стороной",
          "no_license_status": "defined",
          "no_license_details": "не предоставляет какой-либо лицензии, явной или подразумеваемой, за пределами цели раскрытия",
          "ip_registration_prohibition_status": "defined",
          "ip_registration_prohibition_details": "обязуется не подавать заявки на регистрацию объектов IP на основе полученной информации",
          "evidence": [
            {
              "clause_ref": "п. 5.1–5.2",
              "quote": "Все исключительные права на Конфиденциальную информацию, включая права на объекты интеллектуальной собственности, остаются за Раскрывающей стороной. Настоящее Соглашение не предоставляет Получающей стороне какой-либо лицензии..."
            }
          ]
        }

        Пример 2 — IP-права не урегулированы:
        Фрагмент:
        "Получающая сторона обязуется хранить Конфиденциальную информацию в тайне."

        Ответ:
        {
          "ip_retention_status": "not_defined",
          "ip_retention_details": "Данные не определены",
          "no_license_status": "not_defined",
          "no_license_details": "Данные не определены",
          "ip_registration_prohibition_status": "not_defined",
          "ip_registration_prohibition_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найдена ли оговорка о сохранении IP-прав за раскрывающей стороной?
        2. Найдено ли явное указание, что NDA не является лицензией?
        3. Найдён ли запрет на регистрацию объектов IP на основе раскрытой информации?
        4. Все ли статус-поля содержат только значения из allowed_values?
        5. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "ip_retention_status": "<defined / not_defined>",
          "ip_retention_details": "<текст или 'Данные не определены'>",
          "no_license_status": "<defined / not_defined>",
          "no_license_details": "<текст или 'Данные не определены'>",
          "ip_registration_prohibition_status": "<defined / not_defined>",
          "ip_registration_prohibition_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "интеллектуальная собственность исключительные права не передаёт прав не является лицензией no license сохраняет все права право собственности товарный знак патент ноу-хау секрет производства исходный код запрет регистрации proprietary rights intellectual property"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - warranty
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "ip_rights_preservation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA оговорки о сохранении интеллектуальных прав
        раскрывающей стороны, отсутствии передачи лицензии и запрете регистрации IP
        на основе раскрытой информации.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты, срок или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_rights_preservation_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - ip_retention_status = "not_defined";
          - no_license_status = "not_defined";
          - ip_registration_prohibition_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. ip_retention_status:
          - "defined" — если в тексте прямо указано, что все IP-права остаются за раскрывающей стороной;
          - "not_defined" — если оговорка не указана.

        2. ip_retention_details:
          Оговорка о сохранении всех исключительных прав на информацию и объекты IP
          за раскрывающей стороной на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. no_license_status:
          - "defined" — если в тексте прямо указано, что NDA не является лицензией и не передаёт прав;
          - "not_defined" — если оговорка не указана.

        4. no_license_details:
          Явное указание, что NDA не является лицензией и не передаёт прав на использование IP
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. ip_registration_prohibition_status:
          - "defined" — если в тексте прямо указан запрет регистрации объектов IP на основе раскрытой информации;
          - "not_defined" — если запрет не указан.

        6. ip_registration_prohibition_details:
          Запрет получателю регистрировать товарные знаки, патенты, доменные имена
          на основе раскрытой информации на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_rights_preservation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - ip_retention: ищи «исключительные права остаются за», «все права собственности сохраняются»,
          «proprietary rights remain with».
        - no_license: ищи «не является лицензией», «не передаёт прав», «no license granted»,
          «не предоставляет права использования».
        - ip_registration_prohibition: ищи «не вправе регистрировать», «запрет на подачу заявок»,
          «не подавать заявки на патент/товарный знак».
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни оговорки о сохранении IP-прав, ни указания об отсутствии лицензии, ни запрета регистрации.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только общая фраза о конфиденциальности без IP-оговорок.
          "Получающая сторона обязуется хранить Конфиденциальную информацию в тайне".
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия о IP-правах.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный IP-блок.
          Указаны сохранение прав, отсутствие лицензии и запрет регистрации.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_rights_preservation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_rights_preservation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сохранению IP-прав. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_retention_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки о сохранении IP-прав за раскрывающей стороной. Внутреннее enum-поле."
          required: true

        - name: "ip_retention_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Сохранение IP-прав"
          description: >
            Оговорка о сохранении всех исключительных прав на информацию и объекты IP за раскрывающей стороной.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "no_license_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки об отсутствии передачи лицензии через NDA. Внутреннее enum-поле."
          required: true

        - name: "no_license_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отсутствие лицензии"
          description: >
            Явное указание, что NDA не является лицензией и не передаёт прав на использование IP.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "ip_registration_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета на регистрацию объектов IP на основе раскрытой информации. Внутреннее enum-поле."
          required: true

        - name: "ip_registration_prohibition_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Запрет регистрации IP"
          description: >
            Запрет получателю регистрировать товарные знаки, патенты, доменные имена на основе раскрытой информации.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: audit_compliance_check
    name: "Право на аудит соблюдения конфиденциальности"
    description: >
      Фактографическая проверка наличия у раскрывающей стороны права на аудит
      (проверку) соблюдения получателем режима конфиденциальности, включая
      объём аудита, частоту, порядок уведомления и распределение расходов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "аудит"
        - "проверка соблюдения"
        - "право на проверку"
        - "инспекция"
        - "доступ к помещениям"
        - "журналы доступа"
        - "независимый аудитор"
        - "audit right"
        - "compliance audit"
        - "inspection"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прав[оа]\\s+(на\\s+)?(аудит|проверк|инспекц)"
        - "(?i)audit\\s+right"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 421, 431.2; ФЗ-98 «О коммерческой тайне» ст. 10).
        Проверяется только один вопрос: право раскрывающей стороны на аудит
        соблюдения получателем режима конфиденциальности.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора (право на аудит — договорное условие).
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (аудит как механизм проверки
          заверений о соблюдении режима).
        - ФЗ-98 ст. 10 — обладатель коммерческой тайны вправе требовать соблюдения
          условий охраны (аудит — инструмент контроля).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Право на аудит — важный инструмент для раскрывающей стороны, позволяющий
          выявить нарушения до момента утечки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие права раскрывающей стороны на аудит/проверку соблюдения
           режима конфиденциальности.
        2. Объём и предмет аудита (документы, ИТ-системы, помещения, журналы).
        3. Частота и порядок проведения (плановый/внеплановый, уведомление).
        4. Распределение расходов на аудит.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное право на аудит:
        Фрагмент:
        "Раскрывающая сторона имеет право не чаще одного раза в год проводить
        аудит соблюдения Получающей стороной условий настоящего Соглашения.
        Аудит проводится с предварительным уведомлением за 10 рабочих дней
        и может включать проверку документов, ИТ-систем и журналов доступа.
        Расходы на аудит несёт Раскрывающая сторона, за исключением случаев
        выявления существенных нарушений, когда расходы возлагаются на
        Получающую сторону."

        Ответ:
        {
          "audit_right_status": "defined",
          "audit_right_details": "право проводить аудит соблюдения условий NDA",
          "audit_scope_status": "defined",
          "audit_scope_details": "проверка документов, ИТ-систем и журналов доступа",
          "audit_frequency_status": "defined",
          "audit_frequency_details": "не чаще одного раза в год, с уведомлением за 10 рабочих дней",
          "audit_costs_status": "defined",
          "audit_costs_details": "расходы на Раскрывающей стороне; при выявлении нарушений — на Получающей",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Раскрывающая сторона имеет право не чаще одного раза в год проводить аудит соблюдения Получающей стороной условий настоящего Соглашения."
            }
          ]
        }

        Пример 2 — аудит не предусмотрен:
        Фрагмент:
        "Получающая сторона обязуется соблюдать конфиденциальность."

        Ответ:
        {
          "audit_right_status": "not_defined",
          "audit_right_details": "Данные не определены",
          "audit_scope_status": "not_defined",
          "audit_scope_details": "Данные не определены",
          "audit_frequency_status": "not_defined",
          "audit_frequency_details": "Данные не определены",
          "audit_costs_status": "not_defined",
          "audit_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о праве на аудит?
        2. Определён ли объём/предмет аудита?
        3. Указана ли частота и порядок проведения?
        4. Распределены ли расходы на аудит?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "audit_right_status": "<defined / not_defined>",
          "audit_right_details": "<текст или 'Данные не определены'>",
          "audit_scope_status": "<defined / not_defined>",
          "audit_scope_details": "<текст или 'Данные не определены'>",
          "audit_frequency_status": "<defined / not_defined>",
          "audit_frequency_details": "<текст или 'Данные не определены'>",
          "audit_costs_status": "<defined / not_defined>",
          "audit_costs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аудит проверка соблюдения право на проверку инспекция доступ к помещениям журналы доступа независимый аудитор audit right compliance audit inspection"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "штраф за разглашение"
        - "возврат носителей"
        - "уничтожение материалов"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "audit_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о праве раскрывающей стороны
        на аудит соблюдения режима конфиденциальности: наличие права, объём, частота, расходы.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты, срок или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. audit_compliance_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - audit_right_status = "not_defined";
          - audit_scope_status = "not_defined";
          - audit_frequency_status = "not_defined";
          - audit_costs_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. audit_right_status:
          - "defined" — если в тексте прямо указано право раскрывающей стороны на аудит;
          - "not_defined" — если право на аудит не указано.

        2. audit_right_details:
          Общая характеристика права раскрывающей стороны на аудит соблюдения режима конфиденциальности
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. audit_scope_status:
          - "defined" — если в тексте прямо указан объём и предмет аудита;
          - "not_defined" — если объём не указан.

        4. audit_scope_details:
          Объём и предмет аудита (документы, ИТ-системы, помещения, журналы доступа) на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. audit_frequency_status:
          - "defined" — если в тексте прямо указана частота и порядок проведения аудита;
          - "not_defined" — если частота не указана.

        6. audit_frequency_details:
          Частота, плановость и порядок уведомления о проведении аудита на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. audit_costs_status:
          - "defined" — если в тексте прямо указано распределение расходов на аудит;
          - "not_defined" — если распределение не указано.

        8. audit_costs_details:
          Распределение расходов на проведение аудита между сторонами на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни audit_compliance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - audit_right: ищи «право на аудит», «право на проверку», «audit right», «inspection right».
        - audit_scope: ищи перечень проверяемых объектов (документы, серверы, журналы, помещения, сотрудники).
        - audit_frequency: ищи периодичность («не чаще раза в год», «по запросу», «внепланово»).
        - audit_costs: ищи распределение расходов («за счёт Раскрывающей», «за счёт Получающей при нарушениях»).
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни права на аудит, ни объёма, ни частоты, ни расходов.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только общая фраза о соблюдении конфиденциальности.
          "Получающая сторона обязуется соблюдать конфиденциальность".
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия аудита.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полное право на аудит.
          Указаны право, объём, частота и распределение расходов.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для audit_compliance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "audit_compliance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по праву на аудит. Внутреннее агрегатное signal-поле."
          required: true

        - name: "audit_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия права на аудит соблюдения конфиденциальности. Внутреннее enum-поле."
          required: true

        - name: "audit_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на аудит"
          description: >
            Общая характеристика права раскрывающей стороны на аудит соблюдения режима конфиденциальности.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "audit_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения объёма и предмета аудита. Внутреннее enum-поле."
          required: true

        - name: "audit_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Объём аудита"
          description: >
            Объём и предмет аудита (документы, ИТ-системы, помещения, журналы доступа).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "audit_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания частоты и порядка проведения аудита. Внутреннее enum-поле."
          required: true

        - name: "audit_frequency_details"
          type: "string"
          presentation: "fact"
          label: "Частота аудита"
          description: >
            Частота, плановость и порядок уведомления о проведении аудита.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "audit_costs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения расходов на аудит. Внутреннее enum-поле."
          required: true

        - name: "audit_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на аудит"
          description: >
            Распределение расходов на проведение аудита между сторонами.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: amendment_termination_check
    name: "Порядок изменения и расторжения NDA"
    description: >
      Фактографическая проверка процедурного механизма изменения и расторжения NDA:
      требование письменной формы изменений (ст. 452 ГК РФ), право на одностороннее
      расторжение (ст. 450.1 ГК РФ), основания автоматического прекращения
      (банкротство, ликвидация, реорганизация) и судьба обязательств конфиденциальности
      после расторжения (отдельно от survival clause).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение соглашения"
        - "дополнительное соглашение"
        - "письменная форма"
        - "расторжение"
        - "одностороннее расторжение"
        - "отказ от исполнения"
        - "прекращение действия"
        - "автоматическое прекращение"
        - "банкротство"
        - "ликвидация"
        - "реорганизация"
        - "amendment"
        - "termination"
        - "early termination"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[ея].*?(письменн|дополнительн)"
        - "(?i)(односторонн|досрочн)[а-яё]+\\s+(расторжени|отказ)"
        - "(?i)(банкротств|ликвидац|реорганизац)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 450, 450.1, 452, 453; ФЗ-127 «О несостоятельности (банкротстве)»).
        Проверяется только один вопрос: порядок изменения и расторжения NDA.

        Нормативный ориентир:
        - ст. 452 ГК РФ — изменение и расторжение договора совершаются в той же форме,
          в которой был заключён договор (по общему правилу — письменная).
        - ст. 450 ГК РФ — изменение и расторжение по соглашению сторон; по требованию
          одной из сторон — через суд при существенном нарушении.
        - ст. 450.1 ГК РФ — право на односторонний отказ от исполнения договора
          (если предусмотрено законом или договором).
        - ст. 453 ГК РФ — последствия расторжения: обязательства прекращаются, но
          для NDA критично, сохраняются ли обязательства конфиденциальности.
        - ст. 61–64 ГК РФ — ликвидация юридического лица.
        - ФЗ-127 — последствия банкротства для действующих договоров.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Различай: механизм расторжения (процедура) и последствия расторжения
          (судьба обязательств) — survival clause проверяется отдельным чеком,
          здесь фиксируй только прямые указания на судьбу обязательств при расторжении.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок внесения изменений (требование письменной формы, доп. соглашение).
        2. Право на одностороннее расторжение / отказ от исполнения (ст. 450.1 ГК РФ).
        3. Основания автоматического прекращения (банкротство, ликвидация, реорганизация).
        4. Прямые указания на судьбу обязательств конфиденциальности при расторжении
           (отдельно от survival clause — здесь только если явно указано в контексте
           расторжения).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный блок изменения и расторжения:
        Фрагмент:
        "Изменения и дополнения к настоящему Соглашению действительны только
        при условии их оформления в письменной форме и подписания обеими Сторонами.
        Каждая из Сторон вправе расторгнуть настоящее Соглашение в одностороннем
        порядке, письменно уведомив другую Сторону не менее чем за 30 (тридцать)
        календарных дней. Соглашение автоматически прекращается в случае ликвидации
        или признания банкротом любой из Сторон. При расторжении Соглашения
        обязательства по сохранению конфиденциальности сохраняют силу в течение
        срока, указанного в п. 6.2."

        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "изменения действительны только в письменной форме за подписью обеих Сторон",
          "unilateral_termination_status": "defined",
          "unilateral_termination_details": "каждая Сторона вправе расторгнуть в одностороннем порядке с уведомлением за 30 календарных дней",
          "auto_termination_status": "defined",
          "auto_termination_details": "автоматическое прекращение при ликвидации или банкротстве любой из Сторон",
          "termination_consequences_status": "defined",
          "termination_consequences_details": "обязательства по сохранению конфиденциальности сохраняют силу (отсылка к п. 6.2)",
          "evidence": [
            {
              "clause_ref": "п. 11.1–11.3",
              "quote": "Изменения и дополнения к настоящему Соглашению действительны только при условии их оформления в письменной форме и подписания обеими Сторонами. Каждая из Сторон вправе расторгнуть настоящее Соглашение в одностороннем порядке..."
            }
          ]
        }

        Пример 2 — минимальные условия:
        Фрагмент:
        "Соглашение может быть расторгнуто по взаимному согласию Сторон."

        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_details": "Данные не определены",
          "unilateral_termination_status": "not_defined",
          "unilateral_termination_details": "Данные не определены",
          "auto_termination_status": "not_defined",
          "auto_termination_details": "Данные не определены",
          "termination_consequences_status": "not_defined",
          "termination_consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Соглашение может быть расторгнуто по взаимному согласию Сторон."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о порядке внесения изменений?
        2. Найдена ли прямая цитата о праве на одностороннее расторжение?
        3. Найдены ли основания автоматического прекращения?
        4. Найдены ли прямые указания на судьбу обязательств при расторжении?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
          "unilateral_termination_status": "<defined / not_defined>",
          "unilateral_termination_details": "<текст или 'Данные не определены'>",
          "auto_termination_status": "<defined / not_defined>",
          "auto_termination_details": "<текст или 'Данные не определены'>",
          "termination_consequences_status": "<defined / not_defined>",
          "termination_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение соглашения дополнительное соглашение письменная форма расторжение одностороннее расторжение отказ от исполнения прекращение действия автоматическое прекращение банкротство ликвидация реорганизация amendment termination"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - amendment
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "amendment_termination_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA порядок изменения и расторжения соглашения:
        процедура изменений, одностороннее расторжение, автоматическое прекращение, последствия для обязательств.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты, срок действия или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. amendment_termination_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - amendment_procedure_status = "not_defined";
          - unilateral_termination_status = "not_defined";
          - auto_termination_status = "not_defined";
          - termination_consequences_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. amendment_procedure_status:
          - "defined" — если в тексте прямо указан порядок внесения изменений (письменная форма, доп. соглашение);
          - "not_defined" — если порядок не указан.

        2. amendment_procedure_details:
          Процедура внесения изменений (письменная форма, дополнительное соглашение) на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. unilateral_termination_status:
          - "defined" — если в тексте прямо указано право на одностороннее расторжение / отказ от исполнения;
          - "not_defined" — если право не указано.

        4. unilateral_termination_details:
          Условия и сроки одностороннего расторжения / отказа от исполнения на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. auto_termination_status:
          - "defined" — если в тексте прямо указаны основания автоматического прекращения (банкротство, ликвидация);
          - "not_defined" — если основания не указаны.

        6. auto_termination_details:
          Основания автоматического прекращения (банкротство, ликвидация, реорганизация) на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. termination_consequences_status:
          - "defined" — если в тексте прямо указаны указания на судьбу обязательств при расторжении;
          - "not_defined" — если указания не указаны.

        8. termination_consequences_details:
          Судьба обязательств конфиденциальности при расторжении NDA на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни amendment_termination_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - amendment_procedure: ищи «изменения в письменной форме», «дополнительное соглашение»,
          «подписывается обеими сторонами», «amendment in writing».
        - unilateral_termination: ищи «одностороннее расторжение», «отказ от исполнения»,
          «расторгнуть по уведомлению», «early termination», «terminate for convenience».
        - auto_termination: ищи «автоматически прекращается», «в случае ликвидации», «при банкротстве»,
          «реорганизация», «change of control».
        - termination_consequences: ищи прямые указания на судьбу обязательств при расторжении
          («обязательства сохраняют силу», «прекращаются полностью»).
          Не дублируй survival clause — фиксируй только если явно в контексте расторжения.
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни порядка изменений, ни расторжения, ни последствий.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только расторжение по соглашению сторон.
          "Соглашение может быть расторгнуто по взаимному согласию Сторон".
          → presence = "present";
            termination_consequences_status = "not_defined";
            termination_consequences_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия расторжения.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный блок изменения и расторжения.
          Указаны порядок изменений, одностороннее расторжение, автопрекращение и последствия.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendment_termination_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendment_termination_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изменению и расторжению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка внесения изменений в NDA. Внутреннее enum-поле."
          required: true

        - name: "amendment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок изменений"
          description: >
            Процедура внесения изменений (письменная форма, дополнительное соглашение, ст. 452 ГК РФ).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "unilateral_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на одностороннее расторжение NDA. Внутреннее enum-поле."
          required: true

        - name: "unilateral_termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Одностороннее расторжение"
          description: >
            Условия и сроки одностороннего расторжения / отказа от исполнения (ст. 450.1 ГК РФ).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "auto_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оснований автоматического прекращения NDA. Внутреннее enum-поле."
          required: true

        - name: "auto_termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Автопрекращение"
          description: >
            Основания автоматического прекращения (банкротство, ликвидация, реорганизация).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "termination_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указаний на судьбу обязательств при расторжении. Внутреннее enum-поле."
          required: true

        - name: "termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: >
            Судьба обязательств конфиденциальности при расторжении NDA (отдельно от survival clause).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: notices_check
    name: "Порядок уведомлений (notices) и юридически значимых сообщений"
    description: >
      Фактографическая проверка порядка направления юридически значимых сообщений
      (notices) по NDA: адреса и реквизиты сторон, допустимые способы доставки
      (почта, email, курьер), момент получения (deemed received), обязанность
      уведомления о смене реквизитов. Критично для enforceability всех процедурных
      сроков NDA (ст. 165.1 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомления"
        - "порядок направления"
        - "юридически значимые сообщения"
        - "адрес для уведомлений"
        - "способ доставки"
        - "заказное письмо"
        - "электронная почта"
        - "курьерская доставка"
        - "момент получения"
        - "смена реквизитов"
        - "notices"
        - "deemed received"
        - "notice address"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени[яе].*?(направл|вруч|достав)"
        - "(?i)notices"
        - "(?i)deemed\\s+received"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 165.1, 434; АПК РФ ст. 123).
        Проверяется только один вопрос: порядок направления уведомлений (notices).

        Нормативный ориентир:
        - ст. 165.1 ГК РФ — юридически значимые сообщения: сообщение считается
          доставленным и в тех случаях, если оно поступило лицу, которому направлено,
          но по обстоятельствам, зависящим от него, не было ему вручено или лицо
          не ознакомилось с ним.
        - ст. 434 ГК РФ — форма договора и порядок обмена документами.
        - Практика: при отсутствии в договоре чёткого порядка уведомлений суды
          применяют общие правила ст. 165.1, что создаёт неопределённость для
          процедурных сроков (претензия, уведомление об утечке, расторжение).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Порядок уведомлений влияет на все процедурные сроки NDA: уведомление
          об утечке, претензия, одностороннее расторжение, запрос на возврат.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общий порядок направления уведомлений (формальные требования).
        2. Адреса и реквизиты для уведомлений (юридический адрес, email, контактное лицо).
        3. Допустимые способы доставки (заказное письмо, курьер, email, факс).
        4. Момент получения (deemed received) и обязанность уведомления о смене реквизитов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный блок уведомлений:
        Фрагмент:
        "Все уведомления по настоящему Соглашению направляются в письменной форме
        по адресам, указанным в преамбуле, заказным письмом с уведомлением о вручении
        или курьерской службой. Уведомления по электронной почте допускаются при
        условии последующего направления оригинала в течение 3 рабочих дней.
        Уведомление считается полученным: при доставке курьером — в день вручения;
        при отправке заказным письмом — на 5-й рабочий день после отправки;
        при отправке по email — в день отправки при наличии подтверждения прочтения.
        Сторона обязана уведомить другую Сторону о смене реквизитов в течение
        5 рабочих дней."

        Ответ:
        {
          "notice_procedure_status": "defined",
          "notice_procedure_details": "в письменной форме, заказным письмом с уведомлением о вручении или курьерской службой",
          "notice_addresses_status": "defined",
          "notice_addresses_details": "по адресам, указанным в преамбуле",
          "notice_delivery_methods_status": "defined",
          "notice_delivery_methods_details": "заказное письмо, курьерская служба, email с последующим направлением оригинала",
          "notice_deemed_received_status": "defined",
          "notice_deemed_received_details": "курьер — день вручения; заказное письмо — 5-й рабочий день; email — день отправки при подтверждении прочтения; смена реквизитов — уведомление за 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 12.1–12.3",
              "quote": "Все уведомления по настоящему Соглашению направляются в письменной форме по адресам, указанным в преамбуле, заказным письмом с уведомлением о вручении или курьерской службой."
            }
          ]
        }

        Пример 2 — уведомления не урегулированы:
        Фрагмент:
        "Стороны обмениваются информацией в рабочем порядке."

        Ответ:
        {
          "notice_procedure_status": "not_defined",
          "notice_procedure_details": "Данные не определены",
          "notice_addresses_status": "not_defined",
          "notice_addresses_details": "Данные не определены",
          "notice_delivery_methods_status": "not_defined",
          "notice_delivery_methods_details": "Данные не определены",
          "notice_deemed_received_status": "not_defined",
          "notice_deemed_received_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о порядке направления уведомлений?
        2. Указаны ли адреса/реквизиты для уведомлений?
        3. Перечислены ли допустимые способы доставки?
        4. Определён ли момент получения (deemed received)?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "notice_procedure_status": "<defined / not_defined>",
          "notice_procedure_details": "<текст или 'Данные не определены'>",
          "notice_addresses_status": "<defined / not_defined>",
          "notice_addresses_details": "<текст или 'Данные не определены'>",
          "notice_delivery_methods_status": "<defined / not_defined>",
          "notice_delivery_methods_details": "<текст или 'Данные не определены'>",
          "notice_deemed_received_status": "<defined / not_defined>",
          "notice_deemed_received_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомления порядок направления юридически значимые сообщения адрес для уведомлений способ доставки заказное письмо электронная почта курьер момент получения смена реквизитов notices deemed received notice address"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - notice
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.70, 1.0]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2200

      compact_output: false

      presence_signal:
        field: "notices_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA порядок направления уведомлений (notices):
        процедура, адреса, способы доставки, момент получения.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты, срок или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. notices_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - notice_procedure_status = "not_defined";
          - notice_addresses_status = "not_defined";
          - notice_delivery_methods_status = "not_defined";
          - notice_deemed_received_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. notice_procedure_status:
          - "defined" — если в тексте прямо указан общий порядок направления уведомлений;
          - "not_defined" — если порядок не указан.

        2. notice_procedure_details:
          Общий порядок направления юридически значимых сообщений на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. notice_addresses_status:
          - "defined" — если в тексте прямо указаны адреса и реквизиты для уведомлений;
          - "not_defined" — если адреса не указаны.

        4. notice_addresses_details:
          Адреса, email и контактные лица для направления уведомлений на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. notice_delivery_methods_status:
          - "defined" — если в тексте прямо указаны допустимые способы доставки;
          - "not_defined" — если способы не указаны.

        6. notice_delivery_methods_details:
          Допустимые способы доставки уведомлений (почта, курьер, email) на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. notice_deemed_received_status:
          - "defined" — если в тексте прямо указаны правила определения момента получения;
          - "not_defined" — если правила не указаны.

        8. notice_deemed_received_details:
          Правила определения момента получения (deemed received) и обязанность уведомления
          о смене реквизитов на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notices_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - notice_procedure: ищи «уведомления направляются», «в письменной форме», «all notices shall be in writing».
        - notice_addresses: ищи конкретные адреса, email, ФИО контактных лиц, «по адресам в преамбуле».
        - notice_delivery_methods: ищи «заказное письмо», «курьер», «электронная почта», «факс»,
          «registered mail», «courier».
        - notice_deemed_received: ищи «считается полученным», «deemed received», «в день вручения»,
          «на N-й день после отправки», «смена реквизитов».
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни порядка уведомлений, ни адресов, ни способов доставки.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только общая фраза о рабочем порядке.
          "Стороны обмениваются информацией в рабочем порядке".
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные способы доставки.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный блок уведомлений.
          Указаны порядок, адреса, способы доставки и момент получения.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notices_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notices_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по уведомлениям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notice_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка направления уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notice_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок уведомлений"
          description: >
            Общий порядок направления юридически значимых сообщений (ст. 165.1 ГК РФ).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "notice_addresses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания адресов для уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notice_addresses_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Адреса уведомлений"
          description: >
            Адреса, email и контактные лица для направления уведомлений.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "notice_delivery_methods_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня допустимых способов доставки. Внутреннее enum-поле."
          required: true

        - name: "notice_delivery_methods_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Способы доставки"
          description: >
            Допустимые способы доставки уведомлений (почта, курьер, email).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "notice_deemed_received_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента получения уведомления. Внутреннее enum-поле."
          required: true

        - name: "notice_deemed_received_details"
          type: "string"
          presentation: "fact"
          label: "Момент получения"
          description: >
            Правила определения момента получения (deemed received) и обязанность уведомления о смене реквизитов.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: entire_agreement_check
    name: "Полнота соглашения, приоритет и конфликт договоров"
    description: >
      Фактографическая проверки оговорки о полноте соглашения (entire agreement /
      merger clause), статуса устных договорённостей, приоритета NDA по отношению
      к основному договору (при наличии), а также интеграции приложений и спецификаций.
      Критично для определения объёма обязательств и предотвращения ссылок на
      преддоговорные переговоры.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "полное соглашение"
        - "полнота соглашения"
        - "исчерпывающий характер"
        - "заменяет все предыдущие"
        - "устные договорённости"
        - "преддоговорные переговоры"
        - "приоритет"
        - "в случае противоречия"
        - "приложения являются неотъемлемой частью"
        - "entire agreement"
        - "merger clause"
        - "integration clause"
        - "supersedes"
        - "prevail"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)полн[оа]е\\s+соглашени"
        - "(?i)entire\\s+agreement"
        - "(?i)заменяет\\s+(все|любые)\\s+предыдущ"
        - "(?i)в\\s+случае\\s+противоречи"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 431, 431.2, 450; ФЗ-98 «О коммерческой тайне»).
        Проверяется только один вопрос: полнота соглашения, приоритет и конфликт договоров.

        Нормативный ориентир:
        - ст. 431 ГК РФ — толкование договора (буквальное значение слов и выражений).
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (включая заверения о полноте
          и достоверности предоставленной информации).
        - ст. 450 ГК РФ — основания изменения и расторжения (включая ссылку на
          преддоговорные обстоятельства).
        - Оговорка о полноте соглашения (entire agreement / merger clause) ограничивает
          возможность сторон ссылаться на преддоговорные переговоры, устные обещания
          и предыдущие версии соглашений.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Для NDA оговорка о полноте критична: без неё сторона может ссылаться
          на устные обещания о «неформальном» раскрытии или «устном согласии»
          на использование информации.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оговорку о полноте соглашения (entire agreement / merger clause).
        2. Приоритет NDA по отношению к основному договору (при наличии коллизии).
        3. Статус устных договорённостей и преддоговорных переговоров.
        4. Интеграцию приложений и спецификаций (являются ли они частью NDA).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный блок полноты и приоритета:
        Фрагмент:
        "Настоящее Соглашение составляет полное соглашение Сторон по предмету
        конфиденциальности и заменяет все предыдущие устные и письменные
        договорённости, переговоры и соглашения по данному вопросу. Все приложения
        и спецификации, подписанные Сторонами в рамках настоящего Соглашения,
        являются его неотъемлемой частью. В случае противоречия между условиями
        настоящего Соглашения и Основного договора приоритет имеют условия
        настоящего Соглашения в части, касающейся конфиденциальности."

        Ответ:
        {
          "entire_agreement_status": "defined",
          "entire_agreement_details": "полное соглашение, заменяет все предыдущие устные и письменные договорённости",
          "priority_over_main_status": "defined",
          "priority_over_main_details": "приоритет NDA над Основным договором в части конфиденциальности",
          "oral_amendments_status": "defined",
          "oral_amendments_details": "устные договорённости и преддоговорные переговоры не имеют силы (заменены NDA)",
          "annexes_integration_status": "defined",
          "annexes_integration_details": "приложения и спецификации являются неотъемлемой частью Соглашения",
          "evidence": [
            {
              "clause_ref": "п. 13.1–13.2",
              "quote": "Настоящее Соглашение составляет полное соглашение Сторон по предмету конфиденциальности и заменяет все предыдущие устные и письменные договорённости..."
            }
          ]
        }

        Пример 2 — полнота не урегулирована:
        Фрагмент:
        "Стороны подписали настоящее Соглашение в двух экземплярах."

        Ответ:
        {
          "entire_agreement_status": "not_defined",
          "entire_agreement_details": "Данные не определены",
          "priority_over_main_status": "not_defined",
          "priority_over_main_details": "Данные не определены",
          "oral_amendments_status": "not_defined",
          "oral_amendments_details": "Данные не определены",
          "annexes_integration_status": "not_defined",
          "annexes_integration_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найдена ли оговорка о полноте соглашения (entire agreement)?
        2. Определён ли приоритет NDA vs основного договора?
        3. Указан ли статус устных договорённостей?
        4. Зафиксирована ли интеграция приложений?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "entire_agreement_status": "<defined / not_defined>",
          "entire_agreement_details": "<текст или 'Данные не определены'>",
          "priority_over_main_status": "<defined / not_defined>",
          "priority_over_main_details": "<текст или 'Данные не определены'>",
          "oral_amendments_status": "<defined / not_defined>",
          "oral_amendments_details": "<текст или 'Данные не определены'>",
          "annexes_integration_status": "<defined / not_defined>",
          "annexes_integration_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "полное соглашение полнота соглашения исчерпывающий характер заменяет все предыдущие устные договорённости преддоговорные переговоры приоритет в случае противоречия приложения неотъемлемая часть entire agreement merger clause supersedes prevail"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - entire_agreement
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.70, 1.0]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "entire_agreement_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA оговорки о полноте соглашения, приоритете над основным договором,
        статусе устных договорённостей и интеграции приложений.
        Не анализируй определение конфиденциальной информации, исключения, меры защиты, срок или ответственность за нарушение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. entire_agreement_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "missing" — если фрагментов по теме в тексте нет вообще
            (следствие: все содержательные поля = "not_defined");
          - "present" — если фрагменты по теме есть: либо хотя бы одно
            содержательное поле ≠ "not_defined", либо тема упомянута,
            но прямо исключена / отложена на будущее / раскрыта только общей фразой;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - entire_agreement_status = "not_defined";
          - priority_over_main_status = "not_defined";
          - oral_amendments_status = "not_defined";
          - annexes_integration_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. entire_agreement_status:
          - "defined" — если в тексте прямо указана оговорка о полноте соглашения (merger clause);
          - "not_defined" — если оговорка не указана.

        2. entire_agreement_details:
          Оговорка о том, что NDA составляет полное соглашение и заменяет все предыдущие договорённости
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. priority_over_main_status:
          - "defined" — если в тексте прямо указан приоритет NDA над основным договором;
          - "not_defined" — если приоритет не указан.

        4. priority_over_main_details:
          Правило приоритета NDA над основным договором при коллизии условий на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. oral_amendments_status:
          - "defined" — если в тексте прямо указан статус устных договорённостей и преддоговорных переговоров;
          - "not_defined" — если статус не указан.

        6. oral_amendments_details:
          Статус устных договорённостей и преддоговорных переговоров (имеют / не имеют юридическую силу)
          на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. annexes_integration_status:
          - "defined" — если в тексте прямо указана интеграция приложений и спецификаций в NDA;
          - "not_defined" — если интеграция не указана.

        8. annexes_integration_details:
          Интеграция приложений, спецификаций и дополнительных соглашений в состав NDA на русском языке.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни entire_agreement_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - entire_agreement: ищи «полное соглашение», «заменяет все предыдущие», «entire agreement»,
          «supersedes all prior».
        - priority_over_main: ищи «в случае противоречия», «приоритет имеет», «prevail over»,
          «in case of conflict».
        - oral_amendments: ищи «устные договорённости не имеют силы», «преддоговорные переговоры не учитываются»,
          «no oral modification».
        - annexes_integration: ищи «приложения являются неотъемлемой частью», «annexes form an integral part».
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни оговорки о полноте, ни приоритета, ни устных договорённостей, ни интеграции приложений.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        2. Только общая фраза о подписании в двух экземплярах.
          "Стороны подписали настоящее Соглашение в двух экземплярах".
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия о приоритете.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            *_details = "Не удалось определить".

        4. Полный блок полноты и приоритета.
          Указаны полнота соглашения, приоритет NDA, статус устных договорённостей и интеграция приложений.
          → presence = "present";
            все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для entire_agreement_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "entire_agreement_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по полноте соглашения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "entire_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки о полноте соглашения (entire agreement / merger clause). Внутреннее enum-поле."
          required: true

        - name: "entire_agreement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Полнота соглашения"
          description: >
            Оговорка о том, что NDA составляет полное соглашение и заменяет все предыдущие договорённости.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "priority_over_main_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения приоритета NDA по отношению к основному договору. Внутреннее enum-поле."
          required: true

        - name: "priority_over_main_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Приоритет NDA"
          description: >
            Правило приоритета NDA над основным договором при коллизии условий.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "oral_amendments_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус устных договорённостей и преддоговорных переговоров. Внутреннее enum-поле."
          required: true

        - name: "oral_amendments_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Устные договорённости"
          description: >
            Статус устных договорённостей и преддоговорных переговоров (имеют / не имеют юридическую силу).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "annexes_integration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус интеграции приложений и спецификаций в NDA. Внутреннее enum-поле."
          required: true

        - name: "annexes_integration_details"
          type: "string"
          presentation: "fact"
          label: "Приложения"
          description: >
            Интеграция приложений, спецификаций и дополнительных соглашений в состав NDA.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: nda_self_confidentiality_check
    name: "Конфиденциальность самого NDA (условия и факт заключения)"
    description: >
      Фактографическая проверка наличия в NDA оговорки о конфиденциальности
      самого соглашения: защищён ли факт заключения NDA, его условия и содержание
      переговоров; предусмотрены ли исключения из этой конфиденциальности
      (раскрытие по закону, аудиторам, аффилированным лицам). Критично для
      M&A-контекста: утечка факта NDA может сорвать сделку и раскрыть
      стратегические намерения сторон.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "конфиденциальность настоящего соглашения"
        - "факт заключения"
        - "условия соглашения конфиденциальны"
        - "само соглашение"
        - "существование соглашения"
        - "не раскрывать факт"
        - "confidentiality of this agreement"
        - "terms of this agreement"
        - "existence of this agreement"
        - "negotiations confidential"
        - "переговоры конфиденциальны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)настоящ[а-яё]+\\s+соглашени[ея].*?конфиденциальн"
        - "(?i)факт\\s+(заключения|существования)"
        - "(?i)условия\\s+настоящего\\s+соглашения"
        - "(?i)confidentiality\\s+of\\s+this\\s+agreement"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 421, 432; ФЗ-98 «О коммерческой тайне»).
        Проверяется только один вопрос: содержит ли NDA оговорку
        о конфиденциальности самого соглашения (факта заключения,
        условий, содержания переговоров).

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора (стороны вправе установить
          режим конфиденциальности для любых сведений, включая сам договор).
        - ФЗ-98 ст. 3 — понятие коммерческой тайны (не распространяется
          автоматически на текст договора, только по прямому указанию).
        - Практика M&A: оговорка о конфиденциальности NDA — стандарт,
          предотвращающий утечку факта переговоров и стратегических намерений.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Различай:
          1) Защита факта заключения NDA;
          2) Защита условий NDA (текст, сумма, стороны);
          3) Защита содержания преддоговорных переговоров;
          4) Исключения (раскрытие по закону, аудиторам, аффилированным лицам).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие оговорки о конфиденциальности самого NDA (факт и/или условия).
        2. Что именно защищено (факт заключения / условия / переговоры).
        3. Наличие исключений из этой конфиденциальности.
        4. Формулировки исключений (по закону, аудиторам, аффилированным).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу — это
           считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка:
        Фрагмент:
        "Настоящее Соглашение и факт его заключения являются конфиденциальной
        информацией. Стороны обязуются не раскрывать третьим лицам содержание
        настоящего Соглашения, за исключением случаев, предусмотренных законом,
        а также раскрытия профессиональным консультантам и аудиторам, связанным
        обязательствами конфиденциальности."

        Ответ:
        {
          "nda_self_confidentiality_status": "defined",
          "nda_self_confidentiality_details": "настоящее Соглашение и факт его заключения являются конфиденциальной информацией",
          "nda_self_confidentiality_exceptions_status": "defined",
          "nda_self_confidentiality_exceptions_details": "раскрытие по закону; раскрытие консультантам и аудиторам, связанным обязательствами конфиденциальности",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Настоящее Соглашение и факт его заключения являются конфиденциальной информацией. Стороны обязуются не раскрывать третьим лицам содержание настоящего Соглашения..."
            }
          ]
        }

        Пример 2 — оговорка отсутствует:
        Фрагмент:
        "Стороны обязуются хранить в тайне коммерческую информацию друг друга."

        Ответ:
        {
          "nda_self_confidentiality_status": "not_defined",
          "nda_self_confidentiality_details": "Данные не определены",
          "nda_self_confidentiality_exceptions_status": "not_defined",
          "nda_self_confidentiality_exceptions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON:
        1. Найдена ли оговорка о конфиденциальности самого NDA?
        2. Определено ли, что именно защищено?
        3. Найдены ли исключения из этой конфиденциальности?
        4. Все ли статус-поля содержат только значения из allowed_values?
        5. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "nda_self_confidentiality_status": "<defined / not_defined>",
          "nda_self_confidentiality_details": "<текст или 'Данные не определены'>",
          "nda_self_confidentiality_exceptions_status": "<defined / not_defined>",
          "nda_self_confidentiality_exceptions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "конфиденциальность настоящего соглашения факт заключения условия соглашения существование соглашения не раскрывать факт переговоры конфиденциальны confidentiality of this agreement terms of this agreement existence of this agreement negotiations"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "nda_self_confidentiality_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о конфиденциальности
        самого соглашения: защищён ли факт заключения, условия, содержание
        переговоров; предусмотрены ли исключения из этой конфиденциальности.
        Не анализируй определение конфиденциальной информации, общие исключения
        из режима, меры защиты, ответственность или срок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        0. nda_self_confidentiality_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (nda_self_confidentiality_status,
              nda_self_confidentiality_exceptions_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - nda_self_confidentiality_status = "not_defined";
           - nda_self_confidentiality_exceptions_status = "not_defined";
           - соответствующие *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. nda_self_confidentiality_status — "defined" или "not_defined".
           - "defined" — если в тексте прямо указано, что NDA и/или факт его
             заключения и/или его условия являются конфиденциальной информацией;
           - "not_defined" — если такой оговорки нет.

        2. nda_self_confidentiality_details — что именно защищено:
           - факт заключения NDA;
           - условия NDA;
           - содержание переговоров;
           - возможна любая комбинация.
           Если данных нет — "Данные не определены".

        3. nda_self_confidentiality_exceptions_status — "defined" или "not_defined".
           - "defined" — если прямо указаны исключения из конфиденциальности
             самого NDA (по закону, аудиторам, аффилированным лицам и т.п.);
           - "not_defined" — если исключений нет.

        4. nda_self_confidentiality_exceptions_details — формулировка исключений.

        Если условие отсутствует в тексте и нет отсылки к документу:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни nda_self_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - Ищи формулировки: «настоящее Соглашение конфиденциально», «факт заключения
          конфиденциальный», «условия Соглашения не подлежат раскрытию», «существование
          Соглашения», «confidentiality of this agreement», «existence of this agreement».
        - Различай защиту факта заключения (существование) и защиту содержания (условия).
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет оговорки о конфиденциальности самого NDA.
           → presence = "missing";
             nda_self_confidentiality_status = "not_defined";
             nda_self_confidentiality_exceptions_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        2. Оговорка есть, но без исключений.
           Указано, что NDA конфиденциален, но исключения не перечислены.
           → presence = "present";
             nda_self_confidentiality_status = "defined";
             nda_self_confidentiality_exceptions_status = "not_defined";
             nda_self_confidentiality_exceptions_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что NDA конфиденциален,
           в другом — что стороны вправе раскрывать факт его заключения.
           → presence = "unclear";
             nda_self_confidentiality_status = "not_defined";
             nda_self_confidentiality_details = "Не удалось определить".

        4. Защита только факта, но не условий.
           Указано, что факт заключения NDA конфиденциален,
           но текст NDA может раскрываться.
           → presence = "present";
             nda_self_confidentiality_status = "defined";
             nda_self_confidentiality_details = "защищён только факт заключения NDA".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для nda_self_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "nda_self_confidentiality_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие оговорки о конфиденциальности самого NDA. Внутреннее агрегатное signal-поле."
          required: true

        - name: "nda_self_confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о конфиденциальности самого NDA. Внутреннее enum-поле."
          required: true

        - name: "nda_self_confidentiality_details"
          type: "string"
          presentation: "fact"
          label: "Конфиденциальность NDA"
          description: >
            Что именно защищено: факт заключения, условия NDA, содержание переговоров. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "nda_self_confidentiality_exceptions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия исключений из конфиденциальности самого NDA. Внутреннее enum-поле."
          required: true

        - name: "nda_self_confidentiality_exceptions_details"
          type: "string"
          presentation: "fact"
          label: "Исключения"
          description: >
            Формулировка исключений из конфиденциальности самого NDA (по закону, аудиторам, аффилированным лицам). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: severability_check
    name: "Делимость положений (severability)"
    description: >
      Фактографическая проверка наличия оговорки о делимости положений NDA
      (severability clause): сохранение силы остальных условий при признании
      отдельного положения недействительным, а также возможной оговорки
      о переформулировании недействительного условия (reformation clause).
      Критично для NDA с ограничительными оговорками (non-compete,
      non-solicitation), риск признания которых недействительными повышен.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "делимость положений"
        - "недействительность отдельного положения"
        - "сохраняют силу остальные"
        - "severability"
        - "если какое-либо положение"
        - "признание недействительным"
        - "остальные положения остаются"
        - "reformation clause"
        - "переформулирование"
        - "invalid provision"
        - "remaining provisions"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)делимост[ьи]\\s+положени"
        - "(?i)недействительн[а-яё]+\\s+(положени|услови)"
        - "(?i)остальн[а-яё]+\\s+положени[яй]\\s+(сохраня|остают)"
        - "(?i)severab(le|ility)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 166–181, 422, 168; Постановление Пленума ВС РФ №25 от 23.06.2015).
        Проверяется только один вопрос: содержит ли NDA оговорку о делимости
        положений (severability) и оговорку о переформулировании (reformation).

        Нормативный ориентир:
        - ст. 166–168 ГК РФ — оспоримые и ничтожные сделки; недействительность
          части сделки.
        - ст. 180 ГК РФ — недействительность части сделки не влечёт
          недействительности прочих её частей, если можно предположить,
          что сделка была бы совершена и без включения недействительной части.
        - Постановление Пленума ВС РФ №25 — практика применения ст. 180 ГК РФ.
        - Severability clause — договорная оговорка, конкретизирующая
          применение ст. 180 ГК РФ и устраняющая неопределённость.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Severability особенно критична для NDA с оговорками non-compete
          и non-solicitation, риск признания которых недействительными повышен
          (ФЗ-135, ст. 37 Конституции РФ).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие оговорки о делимости (severability clause).
        2. Формулировку: что происходит с остальными положениями при
           недействительности одного из них.
        3. Наличие оговорки о переформулировании (reformation clause) —
           обязанности сторон или суда заменить недействительное условие
           на действительное, наиболее близкое по смыслу.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка с reformation:
        Фрагмент:
        "Если какое-либо положение настоящего Соглашения будет признано
        недействительным или неисполнимым, это не затрагивает действительности
        остальных положений, которые продолжают действовать в полном объёме.
        Стороны обязуются заменить недействительное положение действительным,
        наиболее близким по смыслу и экономическому результату."

        Ответ:
        {
          "severability_status": "defined",
          "severability_details": "признание отдельного положения недействительным не затрагивает остальные положения, которые продолжают действовать",
          "reformation_status": "defined",
          "reformation_details": "стороны обязуются заменить недействительное положение действительным, наиболее близким по смыслу и экономическому результату",
          "evidence": [
            {
              "clause_ref": "п. 14.3",
              "quote": "Если какое-либо положение настоящего Соглашения будет признано недействительным или неисполнимым, это не затрагивает действительности остальных положений, которые продолжают действовать в полном объёме."
            }
          ]
        }

        Пример 2 — оговорка отсутствует:
        Фрагмент:
        "Стороны согласовали условия конфиденциальности."

        Ответ:
        {
          "severability_status": "not_defined",
          "severability_details": "Данные не определены",
          "reformation_status": "not_defined",
          "reformation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON:
        1. Найдена ли оговорка о делимости (severability)?
        2. Определена ли судьба остальных положений?
        3. Найдена ли оговорка о переформулировании (reformation)?
        4. Все ли статус-поля содержат только значения из allowed_values?
        5. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "severability_status": "<defined / not_defined>",
          "severability_details": "<текст или 'Данные не определены'>",
          "reformation_status": "<defined / not_defined>",
          "reformation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "делимость положений недействительность отдельного положения сохраняют силу остальные severability недействительное условие invalid provision remaining provisions reformation clause переформулирование"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - general_provision
        - boilerplate
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "исключения из конфиденциальности"
        - "меры защиты информации"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.75, 1.0]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "severability_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA оговорки о делимости положений
        (severability) и о переформулировании недействительных условий
        (reformation).
        Не анализируй определение конфиденциальной информации, исключения,
        меры защиты, ответственность, срок или порядок разрешения споров.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        0. severability_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (severability_status, reformation_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - severability_status = "not_defined";
           - reformation_status = "not_defined";
           - соответствующие *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. severability_status — "defined" или "not_defined".
           - "defined" — если прямо указано, что недействительность
             отдельного положения не затрагивает остальные;
           - "not_defined" — если такой оговорки нет.

        2. severability_details — формулировка (что происходит с остальными
           положениями).

        3. reformation_status — "defined" или "not_defined".
           - "defined" — если прямо указано, что стороны (или суд) обязуются
             заменить недействительное условие на действительное, наиболее
             близкое по смыслу;
           - "not_defined" — если такой оговорки нет.

        4. reformation_details — формулировка оговорки о переформулировании.

        Если условие отсутствует в тексте и нет отсылки к документу:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни severability_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - severability: ищи «если какое-либо положение будет признано недействительным»,
          «не затрагивает действительности остальных положений», «остальные положения
          сохраняют силу», «severability», «remaining provisions survive».
        - reformation: ищи «заменить недействительное положение действительным»,
          «reformation», «closest economic result», «наиболее близкое по смыслу».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оговорки о делимости, ни оговорки о переформулировании.
           → presence = "missing";
             severability_status = "not_defined";
             reformation_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        2. Только делимость, без reformation.
           Есть оговорка о сохранении остальных положений,
           но нет оговорки о замене недействительного условия.
           → presence = "present";
             severability_status = "defined";
             reformation_status = "not_defined";
             reformation_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что недействительность части не влияет
           на остальные; в другом — что недействительность любой части
           влечёт прекращение Соглашения.
           → presence = "unclear";
             severability_status = "not_defined";
             severability_details = "Не удалось определить".

        4. Отсылка на применимое право.
           Указано, что делимость определяется в соответствии
           с применимым правом без прямого регулирования.
           → presence = "present";
             severability_status = "defined";
             severability_details содержит формулировку вида
             «делимость определяется применимым правом».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для severability_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "severability_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие оговорки о делимости положений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "severability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о делимости положений (severability). Внутреннее enum-поле."
          required: true

        - name: "severability_details"
          type: "string"
          presentation: "fact"
          label: "Делимость положений"
          description: >
            Формулировка оговорки о делимости: судьба остальных положений при недействительности одного. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "reformation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о переформулировании (reformation clause). Внутреннее enum-поле."
          required: true

        - name: "reformation_details"
          type: "string"
          presentation: "fact"
          label: "Переформулирование"
          description: >
            Оговорка о замене недействительного условия на действительное, наиболее близкое по смыслу. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: access_logging_check
    name: "Учёт лиц, получивших доступ к конфиденциальной информации"
    description: >
      Фактографическая проверка наличия в NDA обязанности получающей стороны
      вести учёт лиц, получивших доступ к конфиденциальной информации
      (ФЗ-98 «О коммерческой тайне» ст. 10 ч. 1 п. 3), включая круг
      учитываемых лиц, форму и порядок учёта, сроки хранения данных учёта.
      Критично для признания режима коммерческой тайны введённым
      и возможности судебной защиты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "учёт лиц"
        - "журнал доступа"
        - "реестр доступа"
        - "список лиц с доступом"
        - "фиксация доступа"
        - "регистрация доступа"
        - "сведения о лицах, получивших доступ"
        - "круг лиц, имеющих доступ"
        - "access log"
        - "access register"
        - "record of access"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уч[её]т[а-яё]*\\s+лиц"
        - "(?i)журнал[а-яё]*\\s+доступ"
        - "(?i)реестр[а-яё]*\\s+доступ"
        - "(?i)access\\s+(log|register|record)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 10 ч. 1 п. 3; ГК РФ ст. 1465, 1467).
        Проверяется только один вопрос: содержит ли NDA обязанность
        получающей стороны вести учёт лиц, получивших доступ
        к конфиденциальной информации.

        Нормативный ориентир:
        - ФЗ-98 ст. 10 ч. 1 п. 3 — для установления режима коммерческой тайны
          обладатель информации обязан вести учёт лиц, получивших доступ
          к информации, составляющей коммерческую тайну.
        - ФЗ-98 ст. 10 ч. 1 п. 4 — регулировать отношения по использованию
          информации работниками на основании трудовых договоров
          и контрактов подрядчиков.
        - ГК РФ ст. 1467 — исключительное право на секрет производства
          действует, пока сохраняется конфиденциальность.
        - Судебная практика: при отсутствии учёта лиц суды часто отказывают
          в защите режима КТ (Постановление Пленума ВС РФ № 25, обзоры
          практики по коммерческой тайне).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Учёт доступа — императивное требование ФЗ-98 для обладателя КТ;
          в NDA оно конкретизируется как обязанность получателя.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность получающей стороны вести учёт лиц, получивших доступ
           к конфиденциальной информации.
        2. Круг учитываемых лиц (сотрудники, консультанты, подрядчики).
        3. Форму и порядок учёта (журнал, реестр, электронная система).
        4. Сроки хранения данных учёта, если указаны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу
           (политике ИБ, регламенту) — это считается "defined",
           в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка об учёте:
        Фрагмент:
        "Получающая сторона обязуется вести учёт всех лиц, получивших доступ
        к Конфиденциальной информации, включая сотрудников, консультантов
        и подрядчиков. Учёт ведётся в форме реестра доступа с указанием
        ФИО, должности, даты предоставления доступа и объёма раскрытой
        информации. Реестр хранится в течение 3 лет после прекращения
        настоящего Соглашения."

        Ответ:
        {
          "access_logging_status": "defined",
          "access_logging_details": "обязанность вести учёт всех лиц, получивших доступ к Конфиденциальной информации",
          "access_logging_scope_status": "defined",
          "access_logging_scope_details": "сотрудники, консультанты, подрядчики; реестр с ФИО, должностью, датой предоставления доступа и объёмом раскрытой информации",
          "access_logging_retention_status": "defined",
          "access_logging_retention_details": "реестр хранится 3 года после прекращения Соглашения",
          "evidence": [
            {
              "clause_ref": "п. 4.4",
              "quote": "Получающая сторона обязуется вести учёт всех лиц, получивших доступ к Конфиденциальной информации, включая сотрудников, консультантов и подрядчиков."
            }
          ]
        }

        Пример 2 — оговорка отсутствует:
        Фрагмент:
        "Получающая сторона обязуется не разглашать информацию третьим лицам."

        Ответ:
        {
          "access_logging_status": "not_defined",
          "access_logging_details": "Данные не определены",
          "access_logging_scope_status": "not_defined",
          "access_logging_scope_details": "Данные не определены",
          "access_logging_retention_status": "not_defined",
          "access_logging_retention_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата об обязанности вести учёт лиц?
        2. Определён ли круг учитываемых лиц?
        3. Указана ли форма учёта?
        4. Указаны ли сроки хранения?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "access_logging_status": "<defined / not_defined>",
          "access_logging_details": "<текст или 'Данные не определены'>",
          "access_logging_scope_status": "<defined / not_defined>",
          "access_logging_scope_details": "<текст или 'Данные не определены'>",
          "access_logging_retention_status": "<defined / not_defined>",
          "access_logging_retention_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "учёт лиц журнал доступа реестр доступа список лиц с доступом фиксация доступа регистрация доступа сведения о лицах получивших доступ круг лиц имеющих доступ access log access register record of access"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - procedures
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "общедоступная информация"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "access_logging_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения об обязанности
        получающей стороны вести учёт лиц, получивших доступ
        к конфиденциальной информации (ФЗ-98 ст. 10 ч. 1 п. 3).
        Не анализируй определение конфиденциальной информации, исключения,
        общие меры защиты, ответственность, срок или порядок разрешения споров.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. access_logging_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (access_logging_status, access_logging_scope_status,
              access_logging_retention_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - access_logging_status = "not_defined";
           - access_logging_scope_status = "not_defined";
           - access_logging_retention_status = "not_defined";
           - соответствующие *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. access_logging_status — "defined" или "not_defined".
           - "defined" — если в тексте прямо указана обязанность вести учёт
             лиц, получивших доступ к конфиденциальной информации;
           - "not_defined" — если такой обязанности нет.

        2. access_logging_details — формулировка обязанности.

        3. access_logging_scope_status — "defined" или "not_defined".
           - "defined" — если прямо указан круг учитываемых лиц
             и/или форма учёта (журнал, реестр, электронная система);
           - "not_defined" — если объём учёта не раскрыт.

        4. access_logging_scope_details — круг лиц и форма учёта.

        5. access_logging_retention_status — "defined" или "not_defined".
           - "defined" — если прямо указан срок хранения данных учёта;
           - "not_defined" — если срок не указан.

        6. access_logging_retention_details — срок хранения данных учёта.

        Если условие отсутствует в тексте и нет отсылки к документу:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни access_logging_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - access_logging: ищи «вести учёт лиц», «фиксировать доступ», «вести реестр
          доступа», «журнал доступа», «access log», «record of access».
        - access_logging_scope: ищи перечень категорий лиц (сотрудники, консультанты,
          подрядчики) и форму учёта (реестр, журнал, электронная система).
        - access_logging_retention: ищи срок хранения учёта («в течение N лет после
          прекращения», «до уничтожения носителей»).
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности вести учёт, ни перечня учитываемых лиц,
           ни формы учёта, ни срока хранения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Есть только общая обязанность без деталей.
           Указано «вести учёт лиц, получивших доступ» без указания круга лиц,
           формы учёта и срока хранения.
           → presence = "present";
             access_logging_status = "defined";
             access_logging_scope_status = "not_defined";
             access_logging_retention_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано вести реестр, в другом — учёт не требуется.
           → presence = "unclear";
             access_logging_status = "not_defined";
             access_logging_details = "Не удалось определить".

        4. Отсылка на политику ИБ / регламент.
           Порядок учёта определяется Политикой информационной безопасности
           или приложением к NDA.
           → presence = "present";
             access_logging_status = "defined";
             access_logging_details содержит формулировку вида
             «порядок учёта определяется Политикой ИБ (Приложение №N)».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для access_logging_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "access_logging_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие обязанности вести учёт лиц, получивших доступ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "access_logging_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности вести учёт лиц, получивших доступ. Внутреннее enum-поле."
          required: true

        - name: "access_logging_details"
          type: "string"
          presentation: "fact"
          label: "Учёт доступа"
          description: >
            Формулировка обязанности вести учёт лиц, получивших доступ к конфиденциальной информации. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "access_logging_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия круга лиц и формы учёта. Внутреннее enum-поле."
          required: true

        - name: "access_logging_scope_details"
          type: "string"
          presentation: "fact"
          label: "Круг лиц и форма учёта"
          description: >
            Круг учитываемых лиц (сотрудники, консультанты, подрядчики) и форма учёта (журнал, реестр, электронная система). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "access_logging_retention_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока хранения данных учёта. Внутреннее enum-поле."
          required: true

        - name: "access_logging_retention_details"
          type: "string"
          presentation: "fact"
          label: "Срок хранения учёта"
          description: >
            Срок хранения данных учёта лиц, получивших доступ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: kt_regime_compliance_check
    name: "Соответствие определения КТ и режима коммерческой тайны требованиям ФЗ-98"
    description: >
      Фактографическая проверка соответствия NDA требованиям ФЗ-98
      «О коммерческой тайне»: соответствует ли определение конфиденциальной
      информации определению коммерческой тайны (ст. 3 ФЗ-98), вводится ли
      режим КТ и его элементы (ст. 10 ФЗ-98), включая ознакомление
      работников с перечнем КТ (ст. 11 ФЗ-98). Критично для судебной защиты
      режима КТ и права на возмещение убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "коммерческая тайна"
        - "режим коммерческой тайны"
        - "ФЗ-98"
        - "ФЗ о коммерческой тайне"
        - "секрет производства"
        - "ноу-хау"
        - "конфиденциальность информации"
        - "перечень коммерческой тайны"
        - "ознакомление работников"
        - "trade secret"
        - "режим КТ"
        - "обладатель информации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)коммерческ[а-яё]+\\s+тай[нн]"
        - "(?i)режим[а-яё]*\\s+коммерческой\\s+тайны"
        - "(?i)ФЗ[-\\s]?98"
        - "(?i)секрет[а-яё]*\\s+производства"
        - "(?i)trade\\s+secret"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ФЗ-98 «О коммерческой тайне» ст. 3, 10, 11, 12; ГК РФ ст. 1465–1472).
        Проверяется только один вопрос: соответствует ли NDA требованиям
        ФЗ-98 в части определения коммерческой тайны и введения режима КТ.

        Нормативный ориентир:
        - ФЗ-98 ст. 3 — определение коммерческой тайны (информация, имеющая
          действительную или потенциальную коммерческую ценность в силу
          неизвестности её третьим лицам, к которой нет свободного доступа
          на законном основании, и в отношении которой обладателем введён
          режим коммерческой тайны).
        - ФЗ-98 ст. 10 — меры по охране конфиденциальности (определение перечня
          КТ, ограничение доступа, учёт лиц, регулирование отношений с работниками
          и контрагентами, нанесение грифа).
        - ФЗ-98 ст. 11 — ознакомление работников с установленным режимом КТ
          под расписку.
        - ГК РФ ст. 1465 — секрет производства (ноу-хау).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Ключевой вопрос: содержит ли NDA явную отсылку к режиму КТ
          и его элементам, или это лишь договорная конфиденциальность
          без признаков КТ-режима?
        - Различай:
          1) Соответствие определения ст. 3 ФЗ-98 (три признака КТ);
          2) Введение режима КТ (ст. 10 ФЗ-98);
          3) Ознакомление работников с перечнем КТ (ст. 11 ФЗ-98).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание «коммерческой тайны» и/или отсылку к ФЗ-98.
        2. Соответствие определения признакам КТ по ст. 3 ФЗ-98
           (неизвестность третьим лицам, отсутствие свободного доступа,
           коммерческая ценность).
        3. Введение режима КТ (перечень КТ, ограничение доступа, гриф).
        4. Требование ознакомления работников получателя с перечнем КТ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное соответствие ФЗ-98:
        Фрагмент:
        "Информация, передаваемая по настоящему Соглашению, является
        коммерческой тайной в смысле ФЗ-98 «О коммерческой тайне»:
        она не известна третьим лицам, не находится в свободном доступе
        и имеет коммерческую ценность. Раскрывающая сторона ввела в отношении
        неё режим коммерческой тайны, включая утверждение перечня КТ
        (Приложение №1), ограничение доступа, нанесение грифа «Коммерческая
        тайна» на материальные носители и ознакомление работников
        с перечнем под расписку."

        Ответ:
        {
          "kt_regime_definition_status": "defined",
          "kt_regime_definition_details": "информация является коммерческой тайной по ФЗ-98: не известна третьим лицам, не в свободном доступе, имеет коммерческую ценность",
          "kt_regime_introduced_status": "defined",
          "kt_regime_introduced_details": "введён режим КТ: перечень КТ (Приложение №1), ограничение доступа, гриф «Коммерческая тайна»",
          "kt_regime_employee_acknowledgment_status": "defined",
          "kt_regime_employee_acknowledgment_details": "ознакомление работников с перечнем КТ под расписку",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Информация, передаваемая по настоящему Соглашению, является коммерческой тайной в смысле ФЗ-98 «О коммерческой тайне»..."
            }
          ]
        }

        Пример 2 — договорная конфиденциальность без КТ:
        Фрагмент:
        "Стороны обязуются хранить информацию в тайне."

        Ответ:
        {
          "kt_regime_definition_status": "not_defined",
          "kt_regime_definition_details": "Данные не определены",
          "kt_regime_introduced_status": "not_defined",
          "kt_regime_introduced_details": "Данные не определены",
          "kt_regime_employee_acknowledgment_status": "not_defined",
          "kt_regime_employee_acknowledgment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON:
        1. Есть ли упоминание коммерческой тайны / ФЗ-98?
        2. Соответствует ли определение признакам КТ по ст. 3 ФЗ-98?
        3. Введён ли режим КТ (перечень, ограничение доступа, гриф)?
        4. Есть ли требование ознакомления работников?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "kt_regime_definition_status": "<defined / not_defined>",
          "kt_regime_definition_details": "<текст или 'Данные не определены'>",
          "kt_regime_introduced_status": "<defined / not_defined>",
          "kt_regime_introduced_details": "<текст или 'Данные не определены'>",
          "kt_regime_employee_acknowledgment_status": "<defined / not_defined>",
          "kt_regime_employee_acknowledgment_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "коммерческая тайна режим коммерческой тайны ФЗ-98 секрет производства ноу-хау перечень коммерческой тайны ознакомление работников обладатель информации trade secret"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - definition
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - boilerplate
      negative_keywords:
        - "исключения из конфиденциальности"
        - "общедоступная информация"
        - "независимо разработана"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.35
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "kt_regime_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о соответствии
        договора требованиям ФЗ-98 «О коммерческой тайне»: определение КТ
        (ст. 3), введение режима КТ (ст. 10) и ознакомление работников (ст. 11).
        Не анализируй общие исключения из конфиденциальности, меры защиты
        (в широком смысле), ответственность, срок или порядок разрешения споров.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. kt_regime_compliance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (kt_regime_definition_status, kt_regime_introduced_status,
              kt_regime_employee_acknowledgment_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - kt_regime_definition_status = "not_defined";
           - kt_regime_introduced_status = "not_defined";
           - kt_regime_employee_acknowledgment_status = "not_defined";
           - соответствующие *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. kt_regime_definition_status — "defined" или "not_defined".
           - "defined" — если в тексте прямо указано, что информация является
             коммерческой тайной в смысле ФЗ-98, и/или приведены признаки КТ
             по ст. 3 (неизвестность третьим лицам, отсутствие свободного
             доступа, коммерческая ценность);
           - "not_defined" — если признаков КТ нет.

        2. kt_regime_definition_details — формулировка признаков КТ.

        3. kt_regime_introduced_status — "defined" или "not_defined".
           - "defined" — если в тексте прямо указано введение режима КТ
             и/или его элементов (перечень КТ, ограничение доступа, гриф);
           - "not_defined" — если режим КТ не вводится.

        4. kt_regime_introduced_details — формулировка элементов режима КТ.

        5. kt_regime_employee_acknowledgment_status — "defined" или "not_defined".
           - "defined" — если прямо указано требование ознакомления работников
             получателя с перечнем КТ под расписку (ст. 11 ФЗ-98);
           - "not_defined" — если такого требования нет.

        6. kt_regime_employee_acknowledgment_details — формулировка требования.

        Если условие отсутствует в тексте и нет отсылки к документу:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни kt_regime_compliance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - kt_regime_definition: ищи прямые формулировки признаков КТ по ст. 3
          ФЗ-98 («не известна третьим лицам», «нет свободного доступа»,
          «коммерческая ценность», «в смысле ФЗ-98»).
        - kt_regime_introduced: ищи введение режима КТ («введён режим КТ»,
          «утверждён перечень КТ», «нанесение грифа», «ограничение доступа»).
        - kt_regime_employee_acknowledgment: ищи «ознакомление работников
          под расписку», «ознакомить сотрудников с перечнем КТ».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания коммерческой тайны, ни отсылки к ФЗ-98,
           ни признаков КТ, ни режима КТ.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Упоминание КТ без введения режима.
           Указано, что информация является коммерческой тайной,
           но не перечислены элементы режима КТ (ст. 10 ФЗ-98).
           → presence = "present";
             kt_regime_definition_status = "defined";
             kt_regime_introduced_status = "not_defined";
             kt_regime_employee_acknowledgment_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что информация является КТ,
           в другом — что она не подпадает под режим КТ.
           → presence = "unclear";
             kt_regime_definition_status = "not_defined";
             kt_regime_definition_details = "Не удалось определить".

        4. Полное соответствие ФЗ-98.
           Присутствуют все элементы: определение КТ, режим КТ,
           ознакомление работников.
           → presence = "present";
             все три *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для kt_regime_compliance_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "kt_regime_compliance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие соответствия NDA требованиям ФЗ-98 (определение КТ + режим КТ). Внутреннее агрегатное signal-поле."
          required: true

        - name: "kt_regime_definition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус соответствия определения конфиденциальной информации признакам КТ по ст. 3 ФЗ-98. Внутреннее enum-поле."
          required: true

        - name: "kt_regime_definition_details"
          type: "string"
          presentation: "fact"
          label: "Определение КТ"
          description: >
            Формулировка признаков КТ (неизвестность третьим лицам, отсутствие свободного доступа, коммерческая ценность) и/или отсылки к ФЗ-98. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "kt_regime_introduced_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус введения режима КТ и его элементов (ст. 10 ФЗ-98). Внутреннее enum-поле."
          required: true

        - name: "kt_regime_introduced_details"
          type: "string"
          presentation: "fact"
          label: "Режим КТ"
          description: >
            Перечень элементов режима КТ: перечень КТ, ограничение доступа, гриф «Коммерческая тайна». Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "kt_regime_employee_acknowledgment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования ознакомления работников с перечнем КТ (ст. 11 ФЗ-98). Внутреннее enum-поле."
          required: true

        - name: "kt_regime_employee_acknowledgment_details"
          type: "string"
          presentation: "fact"
          label: "Ознакомление работников"
          description: >
            Формулировка требования ознакомления работников получателя с перечнем КТ под расписку. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: negotiation_confidentiality_check
    name: "Конфиденциальность процесса переговоров и промежуточных договорённостей"
    description: >
      Фактографическая проверка наличия в NDA оговорки о конфиденциальности
      самого процесса переговоров: защищён ли факт их ведения, содержание,
      обмен документами (term sheets, LOI, drafts), промежуточные условия
      и результаты. Отдельно от конфиденциальности самого NDA. Критично
      для M&A, инвестиционных сделок и стратегических партнёрств: утечка
      факта переговоров может сорвать сделку, привести к появлению
      конкурирующего покупателя и нанести репутационный вред.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "переговоры конфиденциальны"
        - "факт переговоров"
        - "содержание переговоров"
        - "ход переговоров"
        - "преддоговорные переговоры"
        - "преддоговорные отношения"
        - "промежуточные договорённости"
        - "term sheet"
        - "letter of intent"
        - "LOI конфиденциально"
        - "проект договора конфиденциально"
        - "drafts confidential"
        - "negotiations confidential"
        - "course of negotiations"
        - "discussions confidential"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(факт|ход|содержани[ея])\\s+переговоро"
        - "(?i)преддоговорн[а-яё]+\\s+отношени"
        - "(?i)term\\s+sheet"
        - "(?i)letter\\s+of\\s+intent"
        - "(?i)negotiations?\\s+(shall\\s+be\\s+)?confidential"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA)
        (ГК РФ ст. 434.1 «Переговоры о заключении договора»; ФЗ-98 «О коммерческой
        тайне»; ст. 421 ГК РФ).
        Проверяется только один вопрос: содержит ли NDA оговорку
        о конфиденциальности процесса переговоров, отдельно от конфиденциальности
        самого NDA и от конфиденциальности передаваемой информации.

        Нормативный ориентир:
        - ст. 434.1 ГК РФ — специальная норма о преддоговорных переговорах.
          П. 4: сторона, получившая в ходе переговоров конфиденциальную
          информацию, обязана не раскрывать и не использовать её для своих
          целей независимо от того, был ли заключён договор.
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (распространяется
          на преддоговорные заверения).
        - ст. 421 ГК РФ — свобода договора: стороны вправе прямо установить
          режим конфиденциальности переговоров, включая сам факт их ведения.
        - В M&A и инвестиционной практике оговорка о конфиденциальности
          переговоров (negotiation confidentiality) — стандарт, предотвращающий
          утечку факта сделки.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.
        - Различай три самостоятельных предмета:
          1) Конфиденциальность переговоров (факт, ход, содержание, документы);
          2) Конфиденциальность самого NDA (факт заключения, условия) —
             проверяется отдельным чеком;
          3) Конфиденциальность передаваемой информации — тоже отдельно.
        - В этом чеке фиксируется ТОЛЬКО пункт 1.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие оговорки о конфиденциальности процесса переговоров.
        2. Объём защиты: что именно защищено (факт ведения переговоров,
           содержание, обмен документами, промежуточные договорённости,
           условия term sheet / LOI / draft).
        3. Срок действия обязательств по конфиденциальности переговоров
           (может отличаться от срока NDA).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через отсылку к иному документу —
           это считается "defined", в details укажи ссылку.
        4. Если условие не указано в тексте прямо и нет отсылки —
           статус = "not_defined", текст = "Данные не определены".
        5. Не используй "None", "null" или пустые строки — вместо них применяй
           "not_defined" для статусов и "Данные не определены" для текстовых полей.
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка:
        Фрагмент:
        "Стороны обязуются не раскрывать третьим лицам факт ведения, содержание
        и ход переговоров о заключении настоящего Соглашения, а также любые
        промежуточные договорённости, условия term sheet, letter of intent
        и проекты договоров, подготовленные в ходе переговоров. Указанные
        обязательства действуют в течение 3 (трёх) лет с момента прекращения
        переговоров независимо от того, было ли достигнуто соглашение."

        Ответ:
        {
          "negotiation_confidentiality_status": "defined",
          "negotiation_confidentiality_details": "обязанность не раскрывать третьим лицам факт ведения, содержание и ход переговоров, промежуточные договорённости, term sheet, LOI, проекты договоров",
          "negotiation_scope_status": "defined",
          "negotiation_scope_details": "факт ведения переговоров; содержание и ход; промежуточные договорённости; term sheet; letter of intent; проекты договоров",
          "negotiation_duration_status": "defined",
          "negotiation_duration_details": "3 года с момента прекращения переговоров независимо от того, было ли достигнуто соглашение",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Стороны обязуются не раскрывать третьим лицам факт ведения, содержание и ход переговоров о заключении настоящего Соглашения, а также любые промежуточные договорённости, условия term sheet, letter of intent и проекты договоров..."
            }
          ]
        }

        Пример 2 — оговорка отсутствует (есть только защита информации):
        Фрагмент:
        "Стороны обязуются не разглашать конфиденциальную информацию, полученную
        в рамках настоящего Соглашения."

        Ответ:
        {
          "negotiation_confidentiality_status": "not_defined",
          "negotiation_confidentiality_details": "Данные не определены",
          "negotiation_scope_status": "not_defined",
          "negotiation_scope_details": "Данные не определены",
          "negotiation_duration_status": "not_defined",
          "negotiation_duration_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о конфиденциальности переговоров?
        2. Определён ли объём защиты (факт / содержание / документы)?
        3. Указан ли срок действия обязательств?
        4. Отличается ли эта оговорка от конфиденциальности самого NDA
           и от защиты передаваемой информации?
        5. Все ли статус-поля содержат только значения из allowed_values?
        6. Если прямой цитаты и отсылки нет — статус = "not_defined", details = "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "negotiation_confidentiality_status": "<defined / not_defined>",
          "negotiation_confidentiality_details": "<текст или 'Данные не определены'>",
          "negotiation_scope_status": "<defined / not_defined>",
          "negotiation_scope_details": "<текст или 'Данные не определены'>",
          "negotiation_duration_status": "<defined / not_defined>",
          "negotiation_duration_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переговоры конфиденциальны факт переговоров содержание переговоров ход переговоров преддоговорные переговоры преддоговорные отношения промежуточные договорённости term sheet letter of intent LOI проект договора drafts negotiations confidential course of negotiations"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "меры защиты информации"
        - "срок действия соглашения"
        - "штраф за разглашение"
        - "неустойка"
        - "возврат носителей"
        - "в целях настоящего Соглашения понимается"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.30
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "negotiation_confidentiality_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA сведения о конфиденциальности
        процесса переговоров (факт, ход, содержание, документы) — отдельно
        от конфиденциальности самого NDA и от защиты передаваемой информации.
        Не анализируй определение конфиденциальной информации, общие исключения
        из режима, меры защиты, ответственность или срок действия NDA.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. negotiation_confidentiality_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (negotiation_confidentiality_status, negotiation_scope_status,
              negotiation_duration_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - negotiation_confidentiality_status = "not_defined";
           - negotiation_scope_status = "not_defined";
           - negotiation_duration_status = "not_defined";
           - соответствующие *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. negotiation_confidentiality_status — "defined" или "not_defined".
           - "defined" — если в тексте прямо указана обязанность не раскрывать
             факт ведения переговоров и/или их содержание и/или промежуточные
             документы;
           - "not_defined" — если такой оговорки нет.

        2. negotiation_confidentiality_details — формулировка обязанности.

        3. negotiation_scope_status — "defined" или "not_defined".
           - "defined" — если прямо указано, что именно защищено
             (факт, содержание, ход, документы, промежуточные условия);
           - "not_defined" — если объём защиты не раскрыт.

        4. negotiation_scope_details — перечень защищаемых элементов.

        5. negotiation_duration_status — "defined" или "not_defined".
           - "defined" — если прямо указан срок действия обязательств
             по конфиденциальности переговоров (может отличаться от срока NDA);
           - "not_defined" — если срок не указан.

        6. negotiation_duration_details — формулировка срока.

        Если условие отсутствует в тексте и нет отсылки к документу:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни negotiation_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - negotiation_confidentiality: ищи «не раскрывать факт переговоров»,
          «содержание переговоров конфиденциально», «ход переговоров»,
          «преддоговорные отношения конфиденциальны», «negotiations shall be confidential».
        - negotiation_scope: ищи перечень — «факт», «содержание», «ход»,
          «term sheet», «letter of intent», «LOI», «проекты договоров», «drafts».
        - negotiation_duration: ищи срок действия именно этой оговорки
          («в течение N лет после прекращения переговоров», «независимо
          от того, был ли заключён договор»).
        - Не путай с конфиденциальностью самого NDA (факт заключения) —
          это отдельная тема и отдельный check.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет оговорки о конфиденциальности переговоров
           (защищена только передаваемая информация).
           → presence = "missing";
             все три *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Защищён только факт переговоров без деталей.
           Указано «факт переговоров конфиденциален», но не определены
           содержание, документы и срок.
           → presence = "present";
             negotiation_confidentiality_status = "defined";
             negotiation_scope_status = "not_defined";
             negotiation_duration_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что переговоры конфиденциальны,
           в другом — что стороны вправе публично упоминать факт
           переговоров без раскрытия содержания.
           → presence = "unclear";
             negotiation_confidentiality_status = "not_defined";
             negotiation_confidentiality_details = "Не удалось определить".

        4. Отсылка на отдельный документ / регламент.
           Конфиденциальность переговоров определяется отдельным
           соглашением о ведении переговоров (например, term sheet
           с оговоркой о конфиденциальности).
           → presence = "present";
             negotiation_confidentiality_status = "defined";
             negotiation_confidentiality_details содержит формулировку вида
             «определяется Соглашением о ведении переговоров».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для negotiation_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "negotiation_confidentiality_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие оговорки о конфиденциальности переговоров. Внутреннее агрегатное signal-поле."
          required: true

        - name: "negotiation_confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о конфиденциальности переговоров. Внутреннее enum-поле."
          required: true

        - name: "negotiation_confidentiality_details"
          type: "string"
          presentation: "fact"
          label: "Конфиденциальность переговоров"
          description: >
            Формулировка обязанности не раскрывать факт, содержание, ход переговоров и промежуточные документы. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "negotiation_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия объёма защищаемых элементов (факт, содержание, документы, промежуточные условия). Внутреннее enum-поле."
          required: true

        - name: "negotiation_scope_details"
          type: "string"
          presentation: "fact"
          label: "Объём защиты"
          description: >
            Перечень защищаемых элементов переговоров: факт, содержание, ход, term sheet, LOI, drafts, промежуточные договорённости. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "negotiation_duration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока действия обязательств по конфиденциальности переговоров. Внутреннее enum-поле."
          required: true

        - name: "negotiation_duration_details"
          type: "string"
          presentation: "fact"
          label: "Срок конфиденциальности переговоров"
          description: >
            Срок действия обязательств по конфиденциальности переговоров (может отличаться от срока самого NDA). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  nda_parties_and_type_check:
    text: >
      Просим предоставить по {doc_names}: полные реквизиты раскрывающей
      и получающей сторон, тип NDA (односторонний/двусторонний),
      цель раскрытия информации и ограничение использования целью.
    addressee: "Обе стороны"

  confidential_info_definition_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить чёткое определение конфиденциальной
      информации по {doc_names}: (а) категории; (б) конкретный перечень;
      (в) примеры; (г) требование маркировки «Конфиденциально»;
      (д) выявление и устранение catch-all формулировок.
      Без определения NDA неработоспособно.
    addressee: "Юридический отдел раскрывающей стороны"

  exceptions_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим включить в {doc_names} стандартные исключения:
      (а) общедоступная; (б) известна ранее; (в) от третьих лиц;
      (г) независимо разработана; (д) по закону/суду.
      Без исключений получающая сторона в ловушке.
    addressee: "Юридический отдел получающей стороны"

  obligations_protection_check:
    text: >
      Просим согласовать для {doc_names}: (а) стандарт защиты (не ниже мер
      для собственной информации / reasonable care); (б) ограничение доступа
      (need-to-know); (в) право раскрытия консультантам и аффилированным лицам;
      (г) обязательность NDA для консультантов; (д) ответственность получающей
      стороны за действия консультантов.
    addressee: "Обе стороны"

  term_survival_check:
    text: >
      Просим уточнить для {doc_names}: (а) срок действия NDA; (б) срок
      конфиденциальности; (в) бессрочность (для ноу-хау); (г) survival clause.
    addressee: "Обе стороны"

  liability_breach_notification_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим включить в {doc_names}: (а) фиксированный штраф
      за нарушение конфиденциальности; (б) право на возмещение убытков сверх штрафа;
      (в) обязанность немедленного уведомления о нарушении или утечке (24 часа).
      Без штрафов доказать ущерб крайне сложно.
    addressee: "Юридический отдел раскрывающей стороны"

  return_destruction_check:
    text: >
      Просим согласовать для {doc_names}: (а) срок возврата/уничтожения
      информации (обычно 30 дней); (б) способ возврата/уничтожения;
      (в) сертификат об уничтожении; (г) исключения для архивных копий.
    addressee: "Обе стороны"

  government_disclosure_check:
    text: >
      Просим согласовать для {doc_names} порядок раскрытия по требованию
      госорганов: (а) уведомление раскрывающей стороны о запросе;
      (б) содействие в ограничении объёма раскрытия; (в) раскрытие
      только в минимально необходимом объёме.
    addressee: "Юридический отдел"

  special_clauses_check:
    text: >
      Просим согласовать для {doc_names} специальные оговорки:
      (а) residuals clause (общие знания и навыки);
      (б) отказ от гарантий полноты/достоверности информации (as-is);
      (в) запрет переманивания сотрудников/клиентов (non-solicitation);
      (г) запрет конкуренции (non-compete) — при наличии.
    addressee: "Юридический отдел"

  dispute_resolution_check:
    text: >
      Просим согласовать для {doc_names}: (а) применимое право; (б) подсудность;
      (в) претензионный порядок и срок ответа; (г) право на обеспечительные меры
      (injunctive relief) при нарушении.
    addressee: "Юридический отдел"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
