      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA определение конфиденциальной
        информации: тип определения, категории, примеры, маркировку,
        catch-all формулировки.
        Не анализируй исключения, меры защиты, ответственность или срок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. definition_status — "defined" или "not_defined".
        2. definition_type — categories / specific_list / both / unclear / not_defined.
        3. definition_type_details — описание типа определения.
        4. categories_status — "defined" или "not_defined".
        5. categories_details — перечень категорий.
        6. examples_status — "defined" или "not_defined".
        7. examples_details — примеры конфиденциальной информации.
        8. marking_required_status — "defined" или "not_defined".
        9. marking_required_details — требование маркировки.
        10. catch_all_phrases_status — "defined" или "not_defined".
        11. catch_all_phrases_details — выявленные catch-all формулировки.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - definition_type: "categories" — если даны общие категории;
          "specific_list" — если дан конкретный перечень;
          "both" — если и категории, и перечень;
          "unclear" — если определение размыто;
          "not_defined" — если определения нет.
        - catch_all_phrases_status = "defined" только если в тексте прямо
          присутствуют формулировки типа «любая информация», «вся информация»,
          «в любой форме», «без ограничений».
        - Верни только JSON.
        </rules>
      fields:
        - name: "definition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения конфиденциальной информации."
          required: true
        - name: "definition_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["categories", "specific_list", "both", "unclear", "not_defined"]
          description: "Тип определения."
          required: true
        - name: "definition_type_details"
          type: "string"
          presentation: "fact"
          label: "Определение"
          description: "Описание типа определения конфиденциальной информации."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "categories_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня категорий."
          required: false
        - name: "categories_details"
          type: "string"
          presentation: "fact"
          label: "Категории информации"
          description: "Перечень категорий конфиденциальной информации."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "examples_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус примеров."
          required: false
        - name: "examples_details"
          type: "string"
          presentation: "fact"
          label: "Примеры информации"
          description: "Примеры конфиденциальной информации."
          required: false
          display_in_grid: false
        - name: "marking_required_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования маркировки."
          required: false
        - name: "marking_required_details"
          type: "string"
          presentation: "fact"
          label: "Маркировка"
          description: "Требование маркировки «Конфиденциально»."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "catch_all_phrases_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия catch-all формулировок."
          required: false
        - name: "catch_all_phrases_details"
          type: "string"
          presentation: "fact"
          label: "Catch-all формулировки"
          description: "Выявленные catch-all формулировки."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Исключения из конфиденциальности
  # ──────────────────────────────────────────────────────────────────────────
  - id: exceptions_check
    name: "Исключения из конфиденциальности"
    description: >
      Фактографическая проверка наличия стандартных исключений из режима
      конфиденциальности: общедоступная информация, известная до раскрытия,
      полученная от третьих лиц, независимо разработанная, раскрытие по закону.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
        - "publicly available"
        - "prior knowledge"
        - "стала общедоступной"
        - "раскрытие по закону"
        - "по требованию суда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+являетс[яьа]\\s+конфиденциальн"
        - "(?i)исключени[яя]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA) (ФЗ-98 ст. 3).
        Проверяется только один вопрос: исключения из конфиденциальности.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Исключение: информация стала общедоступной не по вине получающей стороны.
        2. Исключение: информация была известна получающей стороне до раскрытия.
        3. Исключение: информация получена от третьих лиц без нарушения обязательств.
        4. Исключение: информация независимо разработана получающей стороной.
        5. Исключение: раскрытие по требованию закона/суда/госоргана.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если исключение не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — исключения присутствуют:
        Фрагмент:
        "Не является конфиденциальной информация, которая: (а) стала общедоступной
        не по вине Получающей стороны; (б) была известна Получающей стороне
        до раскрытия; (в) получена от третьих лиц без нарушения обязательств;
        (г) независимо разработана Получающей стороной."

        Ответ:
        {
          "public_domain_status": "defined",
          "public_domain_details": "стала общедоступной не по вине Получающей стороны",
          "prior_knowledge_status": "defined",
          "prior_knowledge_details": "была известна Получающей стороне до раскрытия",
          "third_party_lawful_status": "defined",
          "third_party_lawful_details": "получена от третьих лиц без нарушения обязательств",
          "independent_development_status": "defined",
          "independent_development_details": "независимо разработана Получающей стороной",
          "government_required_status": "not_defined",
          "government_required_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Не является конфиденциальной информация, которая: (а) стала общедоступной не по вине Получающей стороны..."
            }
          ]
        }

        Пример 2 — исключения отсутствуют:
        Фрагмент:
        "Получающая сторона обязуется не разглашать конфиденциальную информацию."

        Ответ:
        {
          "public_domain_status": "not_defined",
          "public_domain_details": "Данные не определены",
          "prior_knowledge_status": "not_defined",
          "prior_knowledge_details": "Данные не определены",
          "third_party_lawful_status": "not_defined",
          "third_party_lawful_details": "Данные не определены",
          "independent_development_status": "not_defined",
          "independent_development_details": "Данные не определены",
          "government_required_status": "not_defined",
          "government_required_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об общедоступности.
        2. Найди прямую цитату о предшествующем знании.
        3. Найди прямую цитату о получении от третьих лиц.
        4. Найди прямую цитату о независимой разработке.
        5. Найди прямую цитату о раскрытии по закону/суду.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "public_domain_status": "<defined / not_defined>",
          "public_domain_details": "<текст или 'Данные не определены'>",
          "prior_knowledge_status": "<defined / not_defined>",
          "prior_knowledge_details": "<текст или 'Данные не определены'>",
          "third_party_lawful_status": "<defined / not_defined>",
          "third_party_lawful_details": "<текст или 'Данные не определены'>",
          "independent_development_status": "<defined / not_defined>",
          "independent_development_details": "<текст или 'Данные не определены'>",
          "government_required_status": "<defined / not_defined>",
          "government_required_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не является конфиденциальной исключения общедоступная была известна до раскрытия получена от третьих лиц независимо разработана раскрытие по закону по требованию суда государственные органы publicly available prior knowledge"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "конфиденциальная информация означает"
        - "определение конфиденциальной информации"
        - "меры защиты"
        - "срок действия"
        - "штраф"
        - "неустойка"
        - "возврат"
        - "уничтожение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из NDA стандартные исключения из режима
        конфиденциальности: общедоступность, предшествующее знание, получение
        от третьих лиц, независимая разработка, раскрытие по закону.
        Не анализируй определение конфиденциальной информации, меры защиты,
        ответственность или срок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. public_domain_status — "defined" или "not_defined".
        2. public_domain_details — исключение об общедоступности.
        3. prior_knowledge_status — "defined" или "not_defined".
        4. prior_knowledge_details — исключение о предшествующем знании.
        5. third_party_lawful_status — "defined" или "not_defined".
        6. third_party_lawful_details — исключение о получении от третьих лиц.
        7. independent_development_status — "defined" или "not_defined".
        8. independent_development_details — исключение о независимой разработке.
        9. government_required_status — "defined" или "not_defined".
        10. government_required_details — исключение о раскрытии по закону/суду.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи исключения из норм закона — только из текста договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "public_domain_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения об общедоступности."
          required: true
        - name: "public_domain_details"
          type: "string"
          presentation: "fact"
          label: "Общедоступность"
          description: "Исключение: информация стала общедоступной."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "prior_knowledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения о предшествующем знании."
          required: true
        - name: "prior_knowledge_details"
          type: "string"
          presentation: "fact"
          label: "Предшествующее знание"
          description: "Исключение: информация была известна до раскрытия."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "third_party_lawful_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения о получении от третьих лиц."
          required: true
        - name: "third_party_lawful_details"
          type: "string"
          presentation: "fact"
          label: "Получение от третьих лиц"
          description: "Исключение: информация получена от третьих лиц."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "independent_development_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения о независимой разработке."
          required: true
        - name: "independent_development_details"
          type: "string"
          presentation: "fact"
          label: "Независимая разработка"
          description: "Исключение: информация независимо разработана."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "government_required_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения о раскрытии по закону/суду."
          required: false
        - name: "government_required_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие по закону"
          description: "Исключение: раскрытие по требованию закона/суда/госоргана."
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Обязательства по защите и распространение на консультантов
  # ──────────────────────────────────────────────────────────────────────────
  - id: obligations_protection_check
    name: "Меры защиты информации и распространение на консультантов"
    description: >
      Фактографическая проверка конкретных обязательств по защите информации:
      стандарт защиты, ограничение доступа (need-to-know), распространение
      обязательств на аффилированных лиц и консультантов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "меры защиты"
        - "ограничение доступа"
        - "не ниже мер для собственной информации"
        - "надлежащая защита"
        - "физическая безопасность"
        - "информационная безопасность"
        - "need-to-know"
        - "аффилированные лица"
        - "консультанты"
        - "юристы"
        - "аудиторы"
        - "инвесторы"
        - "подрядчики"
        - "обязательство о неразглашении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+ниже\\s+мер"
        - "(?i)need-?to-?know"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении (NDA) (ФЗ-98 ст. 10).
        Проверяется только один вопрос: меры защиты информации
        и распространение обязательств на консультантов.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Стандарт защиты (не ниже мер для собственной информации / reasonable care / конкретный стандарт).
        2. Ограничение доступа (need-to-know basis).
        3. Разрешение раскрытия консультантам/аффилированным лицам.
        4. Требование подписания NDA консультантами.
        5. Ответственность получающей стороны за действия консультантов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получающая сторона обязуется защищать Конфиденциальную информацию
        с применением мер не ниже тех, которые она применяет для защиты
        собственной конфиденциальной информации. Доступ предоставляется
        только на основе need-to-know. Раскрытие консультантам допускается
        при условии подписания ими NDA. Получающая сторона несёт
        ответственность за действия консультантов как за свои собственные."

        Ответ:
        {
          "protection_standard_status": "defined",
          "protection_standard_details": "не ниже мер для защиты собственной конфиденциальной информации",
          "access_restriction_status": "defined",
          "access_restriction_details": "на основе need-to-know",
          "advisor_disclosure_status": "defined",
          "advisor_disclosure_details": "при условии подписания ими NDA",
          "advisor_nda_binding_status": "defined",
          "advisor_nda_binding_details": "подписание NDA консультантами",
          "advisor_liability_status": "defined",
          "advisor_liability_details": "ответственность за действия консультантов как за свои собственные",
          "evidence": [{"clause_ref": "п. 3.1", "quote": "Получающая сторона обязуется защищать Конфиденциальную информацию с применением мер не ниже тех..."}]
        }

        Пример 2:
        Фрагмент:
        "Получающая сторона не разглашает информацию."

        Ответ:
        {
          "protection_standard_status": "not_defined",
          "protection_standard_details": "Данные не определены",
          "access_restriction_status": "not_defined",
          "access_restriction_details": "Данные не определены",
          "advisor_disclosure_status": "not_defined",
          "advisor_disclosure_details": "Данные не определены",
          "advisor_nda_binding_status": "not_defined",
          "advisor_nda_binding_details": "Данные не определены",
          "advisor_liability_status": "not_defined",
          "advisor_liability_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о стандарте защиты.
        2. Найди прямую цитату об ограничении доступа.
        3. Найди прямую цитату о раскрытии консультантам.
        4. Найди прямую цитату о NDA для консультантов.
