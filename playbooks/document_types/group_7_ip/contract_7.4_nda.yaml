          "governing_law_status": "defined",
          "governing_law_details": "право Российской Федерации",
          "dispute_method": "court",
          "dispute_method_details": "Арбитражный суд г. Москвы",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "Арбитражный суд г. Москвы",
          "pretrial_status": "defined",
