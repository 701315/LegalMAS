# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, тип NDA и цель раскрытия
  # ──────────────────────────────────────────────────────────────────────────
  - id: nda_parties_and_type_check
    name: "Стороны, тип NDA (односторонний/двусторонний) и цель раскрытия"
    description: >
      Фактографическая проверка идентификации раскрывающей и получающей сторон,
      типа NDA (односторонний/двусторонний) и цели раскрытия информации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "раскрывающая сторона"
        - "получающая сторона"
        - "disclosing party"
        - "receiving party"
        - "одностороннее"
        - "двустороннее"
        - "взаимное"
        - "цель раскрытия"
        - "для целей"
        - "в связи с"
        - "due diligence"
        - "M&A"
        - "инвестиции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(раскрывающ|получающ)[а-яё]+\\s+сторон"
        - "(?i)(односторонн|двусторонн|взаимн)[а-яё]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение о неразглашении конфиденциальной информации (NDA)
        (ФЗ-98 «О коммерческой тайне»; ГК РФ ст. 421, 422).
        Проверяется только один вопрос: стороны, тип NDA и цель раскрытия.

        Нормативный ориентир:
        - ст. 432 ГК РФ — существенные условия
        - ФЗ-98 ст. 3 — понятие коммерческой тайны

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентификация раскрывающей стороны (наименование, реквизиты).
        2. Идентификация получающей стороны.
        3. Тип NDA (односторонний / двусторонний / не указан).
        4. Цель раскрытия информации.
        5. Ограничение использования информации целью.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — односторонний NDA с целью:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001), именуемое «Раскрывающая сторона»,
        и ООО «Бета» (ИНН 7700000002), именуемое «Получающая сторона».
        Информация раскрывается исключительно для целей проведения
        due diligence в связи с потенциальной сделкой M&A."

        Ответ:
        {
          "disclosing_party_status": "defined",
          "disclosing_party_details": "ООО «Альфа», ИНН 7700000001",
          "receiving_party_status": "defined",
          "receiving_party_details": "ООО «Бета», ИНН 7700000002",
          "nda_type": "unilateral",
          "nda_type_details": "одностороннее: ООО «Альфа» раскрывает, ООО «Бета» получает",
          "purpose_status": "defined",
          "purpose_details": "для целей проведения due diligence в связи с потенциальной сделкой M&A",
          "use_restriction_status": "defined",
          "use_restriction_details": "исключительно для целей due diligence",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001), именуемое «Раскрывающая сторона», и ООО «Бета» (ИНН 7700000002), именуемое «Получающая сторона»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящее соглашение."

        Ответ:
        {
          "disclosing_party_status": "not_defined",
          "disclosing_party_details": "Данные не определены",
          "receiving_party_status": "not_defined",
          "receiving_party_details": "Данные не определены",
          "nda_type": "not_defined",
          "nda_type_details": "Данные не определены",
          "purpose_status": "not_defined",
          "purpose_details": "Данные не определены",
          "use_restriction_status": "not_defined",
          "use_restriction_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией раскрывающей стороны.
        2. Найди прямую цитату с идентификацией получающей стороны.
        3. Определи тип NDA из текста (односторонний/двусторонний).
        4. Найди прямую цитату о цели раскрытия.
        5. Найди прямую цитату об ограничении использования.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosing_party_status": "<defined / not_defined>",
          "disclosing_party_details": "<текст или 'Данные не определены'>",
          "receiving_party_status": "<defined / not_defined>",
          "receiving_party_details": "<текст или 'Данные не определены'>",
          "nda_type": "<unilateral / mutual / not_defined>",
          "nda_type_details": "<текст или 'Данные не определены'>",
          "purpose_status": "<defined / not_defined>",
          "purpose_details": "<текст или 'Данные не определены'>",
          "use_restriction_status": "<defined / not_defined>",
          "use_restriction_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "раскрывающая сторона получающая сторона disclosing party receiving party одностороннее двустороннее взаимное NDA цель раскрытия для целей в связи с due diligence M&A инвестиции ограничение использования"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
