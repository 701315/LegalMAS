      - "(?i)обеспечительн[ыо]е\\s+мер[ыа]"
      - "(?i)судебн[ыо]й\\s+запрет"
      - "(?i)\\binjunctive\\s+relief\\b"
      - "(?i)запретительн[ыо]е\\s+мер[ыа]"
      - "(?i)предварительн[ыо]е\\s+обеспечительн[ыо]е\\s+мер[ыа]"

  employee_nda:
    any_keywords:
      - "(?i)\\bработник\\b"
      - "(?i)\\bсотрудник\\b"
      - "(?i)трудов[оа]й\\s+договор"
      - "(?i)должностн[а-яё]+\\s+инструкци[яяи]"
      - "(?i)при\\s+увольнени[ии]"
      - "(?i)после\\s+прекращени[яя]\\s+трудов[ыо]х\\s+отношени[йя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  term_pattern: "(?i)\\b\\d+\\s+(лет|год|года|месяц|месяцев|дней)\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|USD|EUR)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  fz_ref: "(?i)ФЗ[-]?\\d+"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "confidential_info_definition_mandatory"
    name: "Определение конфиденциальной информации обязательно (ФЗ-98 ст. 3)"
    description: |
      NDA без чёткого определения конфиденциальной информации неработоспособно.
      Стороны не могут доказать нарушение. Определение должно включать
      категории или конкретный перечень информации.
    legal_base: "ФЗ-98 ст. 3, ст. 1465 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
      keyword_mode: "any"
    retrieval:
      context_k: 6
      boost_keywords:
        - "конфиденциальная информация"
        - "определение"
        - "включает"
      rerank: true

  - id: "standard_exceptions_required"
    name: "Стандартные исключения из конфиденциальности (защита получающей стороны)"
    description: |
      Без исключений получающая сторона несёт ответственность за информацию,
      известную ранее, полученную от третьих лиц, ставшую общедоступной или
      разработанную независимо.
    legal_base: "ФЗ-98 ст. 3, международная практика"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "исключения"
        - "не является конфиденциальной"
        - "общедоступная"
      rerank: true

  - id: "personal_data_protection_compliance"
    name: "Защита персональных данных (ФЗ-152)"
    description: |
      Если конфиденциальная информация включает персональные данные,
      получающая сторона обязана соблюдать ФЗ-152.
    legal_base: "ФЗ-152 «О персональных данных»"
    required_triggers: ["personal_data_included"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "персональные данные"
        - "ФЗ-152"
        - "согласие субъекта"
        - "Роскомнадзор"
        - "меры защиты ПДн"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "персональные данные"
        - "ФЗ-152"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: confidential_info_extraction
    name: "Определение конфиденциальной информации"
    description: |
      Извлекает определение конфиденциальной информации:
      категории, конкретный перечень, примеры, требование маркировки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
        - "категории информации"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Определи, как определена конфиденциальная информация.

        Ответь строго в JSON:
        {
          "definition_present": "<yes / vague / no>",
          "definition_type": "<categories / specific_list / both / unclear>",
          "categories": "<перечень категорий или not_found>",
          "examples": "<примеры или not_found>",
          "marking_required": "<yes / no / unclear>"
        }

        ВАЖНО: Чёткое определение критично для применения NDA.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 12
      retrieval_profile: "confidentiality_check"
      boost_keywords:
        - "конфиденциальная информация"
        - "определение"
        - "включает"
        - "категории"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 60
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "definition_present"
          type: "string"
          allowed_values: ["yes", "vague", "no"]
          keyword_hints: ["конфиденциальная информация", "определение", "означает"]
          description: "Наличие чёткого определения"
        - name: "definition_type"
          type: "string"
          allowed_values: ["categories", "specific_list", "both", "unclear"]
          description: "Тип определения"
        - name: "marking_required"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["маркировка", "пометка", "гриф", "Конфиденциально"]
          description: "Требуется ли маркировка"
      store_payload: true

  - id: overbroad_definition_check
    name: "Проверка на чрезмерно широкое определение (catch-all)"
    description: |
      Чрезмерно широкое определение («любая информация, переданная в любой форме»)
      создаёт неоправданные риски для получающей стороны и может быть оспорено в суде.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "любая информация"
        - "вся информация"
        - "в любой форме"
        - "без ограничений"
        - "включая, но не ограничиваясь"
        - "any and all information"
      keyword_mode: "any"
      negative_keywords:
        - "конкретный перечень"
        - "категории информации"
        - "за исключением"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Оцени, не является ли определение конфиденциальной информации чрезмерно широким.

        Ответь строго в JSON:
        {
          "overbroad_risk": "<high / medium / low / none>",
          "catch_all_phrases": ["<выявленные catch-all формулировки>"],
          "narrowing_provisions": "<есть ли ограничительные оговорки или not_found>"
        }

        ВАЖНО: Определение «любая информация» без ограничений — рискованно и потенциально неисполнимо.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      retrieval_profile: "confidentiality_check"
      boost_keywords:
        - "любая информация"
        - "вся информация"
        - "без ограничений"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "overbroad_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "none"]
          description: "Уровень риска чрезмерно широкого определения"
      store_payload: true

  - id: purpose_of_disclosure
    name: "Цель раскрытия информации"
    description: "Для каких целей информация передаётся и может использоваться"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цель раскрытия"
        - "purpose of disclosure"
        - "для целей"
        - "в связи с"
        - "ограничение использования"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Определи цель раскрытия конфиденциальной информации.

        Ответь строго в JSON:
        {
          "purpose": "<цель или not_found>",
          "use_restriction": "<ограничение использования или not_found>"
        }

        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      retrieval_profile: "confidentiality_check"
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "цель"
        - "для целей"
        - "использование"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "purpose"
          type: "string"
          keyword_hints: ["цель", "для целей", "в связи с"]
          description: "Цель раскрытия информации"
      store_payload: true

  - id: exceptions_extraction
    name: "Исключения из конфиденциальности (стандартные)"
    description: |
      Общедоступная, известна ранее, получена от третьих лиц, независимо разработана,
      раскрытие по закону/суду.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
        - "publicly available"
        - "prior knowledge"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Проверь наличие стандартных исключений из конфиденциальности.

        Ответь строго в JSON:
        {
          "public_domain": "<yes / no>",
          "prior_knowledge": "<yes / no>",
          "third_party_lawful": "<yes / no>",
          "independent_development": "<yes / no>",
          "government_required": "<yes / no>"
        }

        ВАЖНО: Без исключений получающая сторона в ловушке.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      retrieval_profile: "confidentiality_check"
      boost_keywords:
        - "исключения"
        - "не является конфиденциальной"
        - "общедоступная"
        - "независимо разработана"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "public_domain"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["общедоступная", "публичная", "общеизвестная"]
          description: "Исключение: общедоступная информация"
        - name: "prior_knowledge"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["была известна", "до раскрытия", "ранее"]
          description: "Исключение: известна до раскрытия"
        - name: "independent_development"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["независимо разработана", "самостоятельно создана"]
          description: "Исключение: независимо разработана"
      store_payload: true

  - id: term_and_confidentiality_period
    name: "Срок действия NDA и срок конфиденциальности"
    description: "Срок действия соглашения и срок режима конфиденциальности (могут различаться)"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "срок конфиденциальности"
        - "период действия"
        - "бессрочная конфиденциальность"
        - "на весь срок"
        - "survival"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок.*?(\\d+\\s+(лет|год|года|месяц))"
        - "(?i)действует\\s+до\\s+\\d{2}\\.\\d{2}\\.\\d{4}"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Определи срок действия NDA и срок конфиденциальности.

        Ответь строго в JSON:
        {
          "nda_term": "<срок действия NDA или not_found>",
          "confidentiality_term": "<срок конфиденциальности или not_found>",
          "perpetual": "<yes / no / unclear>",
          "survival_clause": "<yes / no / unclear>"
        }

        ВАЖНО: Срок должен соответствовать ценности информации (обычно 3–5 лет).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      retrieval_profile: "term_and_renewal_check"
      boost_keywords:
        - "срок"
        - "действует"
        - "конфиденциальность"
        - "survival"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "nda_term"
          type: "string"
          keyword_hints: ["срок действия", "действует до", "заключён на"]
          description: "Срок действия NDA"
        - name: "confidentiality_term"
          type: "string"
          keyword_hints: ["срок конфиденциальности", "режим конфиденциальности"]
          description: "Срок конфиденциальности"
        - name: "perpetual"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Бессрочная конфиденциальность"
      store_payload: true

  - id: protection_obligations
    name: "Меры защиты конфиденциальной информации"
    description: |
      Конкретные обязательства: ограничение доступа, хранение, уровень защиты,
      не просто «не разглашать».
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "меры защиты"
        - "ограничение доступа"
        - "не ниже мер для собственной информации"
        - "надлежащая защита"
        - "физическая безопасность"
        - "информационная безопасность"
        - "need-to-know basis"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Проверь конкретность обязательств по защите информации.

        Ответь строго в JSON:
        {
          "protection_standard": "<конкретный стандарт или not_found>",
          "access_restriction": "<yes / no / unclear>",
          "need_to_know": "<yes / no / unclear>",
          "reasonable_care": "<yes / no / unclear>"
        }

        ВАЖНО: Общее обязательство «не разглашать» недостаточно.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      retrieval_profile: "confidentiality_check"
      boost_keywords:
        - "меры защиты"
        - "ограничение доступа"
        - "не разглашать"
        - "need-to-know"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "protection_standard"
          type: "string"
          keyword_hints: ["не ниже мер", "стандарт защиты", "reasonable care"]
          description: "Стандарт защиты информации"
        - name: "access_restriction"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["ограничение доступа", "need-to-know"]
          description: "Ограничение доступа"
      store_payload: true

  - id: affiliate_advisor_binding
    name: "Распространение обязательств на аффилированных лиц и консультантов"
    description: |
      Без обязательности NDA для консультантов/аудиторов — риск разглашения.
    triggers:
      any: ["consultant_disclosure", "ma_context"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "аффилированные лица"
        - "консультанты"
        - "юристы"
        - "аудиторы"
        - "инвесторы"
        - "подрядчики"
        - "обязательство о неразглашении"
        - "связывание третьих лиц"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Проверь условия о раскрытии информации консультантам/аффилированным лицам.

        Ответь строго в JSON:
        {
          "disclosure_to_advisors_allowed": "<yes / no / unclear>",
          "binding_nda_required": "<yes / no / unclear>",
          "liability_for_breach": "<получающая сторона отвечает или not_found>"
        }

        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      retrieval_profile: "confidentiality_check"
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "консультанты"
        - "аффилированные"
        - "раскрытие"
        - "обязательство"
      rerank: true
      filters: {}
    evidence:
      required: false
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "disclosure_to_advisors_allowed"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["консультанты", "аффилированные", "раскрытие"]
          description: "Разрешено ли раскрытие консультантам"
      store_payload: true

  - id: government_disclosure_procedure
    name: "Порядок раскрытия по требованию государственных органов"
    description: |
      Получающая сторона может быть обязана раскрыть информацию по запросу суда.
      Без порядка — конфликт юридических обязанностей.
    triggers:
