        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о пост-терминальных обязательствах: уничтожение/возврат копий, переходный
        период, сертификат уничтожения. Не анализируй общие основания расторжения,
        вознаграждение, сублицензию или гарантии.
