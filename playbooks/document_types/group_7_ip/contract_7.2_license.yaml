dd_request_templates:
  license_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные данные об объекте ИС
      (вид, регистрационные данные, описание), вид лицензии (исключительная/
      неисключительная), исчерпывающий перечень способов использования
      (существенное условие ст. 1235 п. 1 ГК РФ), территорию и срок.
    addressee: "Лицензиар / Юридический советник"

  consideration_royalty_check:
    text: >
      Просим предоставить по {doc_names}: вид и размер лицензионного
      вознаграждения, ставку роялти, паушальный платёж, минимальные
      гарантированные платежи, график платежей, порядок отчётности
      лицензиата и право лицензиара на аудит.
    addressee: "Финансовый отдел / Юридический советник"

  warranties_validity_defense_check:
    text: >
      Просим предоставить по {doc_names}: письменные гарантии лицензиара
      о наличии и действительности исключительного права (актуальная выписка
      из Роспатента), обязательство поддерживать право в силе, распределение
      пошлин, обязанность защищать право от нарушителей и право лицензиата
      самостоятельно предъявлять иски.
    addressee: "Лицензиар"

  quality_improvements_sublicense_check:
    text: >
      Просим согласовать по {doc_names}: контроль качества (для ТЗ),
      права на улучшения и производные произведения, grant-back,
      условия сублицензирования (по умолчанию запрещена — ст. 1238 ГК РФ).
    addressee: "Обе стороны / Юридический советник"

  exclusive_license_scope_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит исключительную лицензию. Просим чётко
      определить: (а) вправе ли лицензиар сам использовать объект ИС;
      (б) вправе ли лицензиар выдавать лицензии другим лицам;
      (в) территорию и срок ограничений. По п. 1.1 ст. 1236 ГК РФ лицензиар
      МОЖЕТ использовать объект сам, если не запрещено.
    addressee: "Юридический советник"

  termination_bankruptcy_check:
    text: >
      Просим согласовать для {doc_names}: основания расторжения, порядок
      (уведомление, cure period), последствия расторжения, условия
      о банкротстве/ликвидации лицензиара и судьбу лицензии при прекращении
      исключительного права.
    addressee: "Юридический советник"

  indemnification_liability_check:
    text: >
      Просим согласовать для {doc_names}: indemnity-оговорку при IP-претензиях
      третьих лиц, ограничение ответственности (cap), исключение косвенных
      убытков, исключения из ограничения.
    addressee: "Юридический советник"

  registration_cross_border_check:
    text: >
      Для {doc_names} просим согласовать: (а) государственную регистрацию
      в Роспатенте (для регистрируемых объектов — без регистрации договор
      НЕДЕЙСТВИТЕЛЕН); (б) валютный контроль и паспорт сделки (при трансграничных
      роялти); (в) налог у источника; (г) экспортный контроль (для ПО).
    addressee: "Обе стороны / Финансовый отдел / Юридический советник"

  software_data_check:
    text: >
      Для {doc_names} (ПО/база данных) просим согласовать: (а) депонирование
      исходного кода (escrow) и условия передачи; (б) роли сторон по ФЗ-152
      (оператор/обработчик); (в) локализацию данных на территории РФ;
      (г) трансграничную передачу данных.
    addressee: "IT-отдел / DPO / Юридический советник"

  change_of_control_dispute_check:
    text: >
      Просим согласовать для {doc_names}: условия о смене контроля (уведомление,
