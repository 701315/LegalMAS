        2. Частичное раскрытие (только обязанность уничтожить, без переходного периода и сертификата). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (разные сроки уничтожения в разных разделах). → presence = "unclear"
