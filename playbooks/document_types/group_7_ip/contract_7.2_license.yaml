    retrieval:
      retrieval_profile: "license_scope_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на переработку модификация адаптация локализация производное произведение доработка кастомизация внесение изменений указание авторства атрибуция сохранение товарного знака"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - rights
        - obligations
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "rights"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о праве Лицензиата на переработку, модификацию, адаптацию объекта ИС
        и требованиях к атрибуции. Не анализируй вознаграждение, сублицензию,
        расторжение или общие гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. modification_right_status — "defined" или "not_defined".
        2. modification_right_details — формулировка права на модификацию.
        3. modification_scope_code — any_modification / limited_modification / no_modification / not_defined.
        4. modification_scope_details — конкретные ограничения или разрешения.
        5. attribution_status — "defined" или "not_defined".
        6. attribution_details — формулировка требования к указанию авторства.

        Если данные отсутствуют:
        - signal-поля (modification_right_status, modification_scope_code, attribution_status) → "not_defined";
        - fact-поля (modification_right_details, modification_scope_details,
          attribution_details) → "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - modification_scope_code: "any_modification" — любые изменения;
          "limited_modification" — только определённые; "no_modification" — запрещено;
          "not_defined" — не указано.
        - Не выводи право на переработку из норм ГК РФ.
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

      fields:
        - name: "modification_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на модификацию."
          required: true

        - name: "modification_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на модификацию"
          description: "Формулировка права на переработку/модификацию объекта ИС."
          required: false

        - name: "modification_scope_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["any_modification", "limited_modification", "no_modification", "not_defined"]
          description: "Объём права на модификацию."
          required: true

        - name: "modification_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Объём модификации"
          description: "Конкретные ограничения или разрешения на модификацию."
          required: false

        - name: "attribution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования атрибуции."
          required: true

        - name: "attribution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Атрибуция"
          description: "Требования к указанию авторства при модификации."
          required: false

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  license_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные данные об объекте ИС
      (вид, регистрационные данные, описание), вид лицензии (исключительная/
      неисключительная), исчерпывающий перечень способов использования
      (существенное условие ст. 1235 п. 1 ГК РФ), территорию и срок.
    addressee: "Лицензиар / Юридический советник"

  consideration_royalty_check:
    text: >
      Просим предоставить по {doc_names}: вид и размер лицензионного
      вознаграждения, ставку роялти, паушальный платёж, минимальные
      гарантированные платежи, график платежей, порядок отчётности
      лицензиата и право лицензиара на аудит.
    addressee: "Финансовый отдел / Юридический советник"

  warranties_validity_defense_check:
    text: >
      Просим предоставить по {doc_names}: письменные гарантии лицензиара
      о наличии и действительности исключительного права (актуальная выписка
      из Роспатента), обязательство поддерживать право в силе, распределение
      пошлин, обязанность защищать право от нарушителей и право лицензиата
      самостоятельно предъявлять иски.
    addressee: "Лицензиар"

  quality_improvements_sublicense_check:
    text: >
      Просим согласовать по {doc_names}: контроль качества (для ТЗ),
      права на улучшения и производные произведения, grant-back,
      условия сублицензирования (по умолчанию запрещена — ст. 1238 ГК РФ).
    addressee: "Обе стороны / Юридический советник"

  exclusive_license_scope_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит исключительную лицензию. Просим чётко
      определить: (а) вправе ли лицензиар сам использовать объект ИС;
      (б) вправе ли лицензиар выдавать лицензии другим лицам;
      (в) территорию и срок ограничений. По п. 1.1 ст. 1236 ГК РФ лицензиар
      МОЖЕТ использовать объект сам, если не запрещено.
    addressee: "Юридический советник"

  termination_bankruptcy_check:
    text: >
      Просим согласовать для {doc_names}: основания расторжения, порядок
      (уведомление, cure period), последствия расторжения, условия
      о банкротстве/ликвидации лицензиара и судьбу лицензии при прекращении
      исключительного права.
    addressee: "Юридический советник"

  indemnification_liability_check:
    text: >
      Просим согласовать для {doc_names}: indemnity-оговорку при IP-претензиях
      третьих лиц, ограничение ответственности (cap), исключение косвенных
      убытков, исключения из ограничения.
    addressee: "Юридический советник"

  registration_cross_border_check:
    text: >
      Для {doc_names} просим согласовать: (а) государственную регистрацию
      в Роспатенте (для регистрируемых объектов — без регистрации договор
      НЕДЕЙСТВИТЕЛЕН); (б) валютный контроль и паспорт сделки (при трансграничных
      роялти); (в) налог у источника; (г) экспортный контроль (для ПО).
    addressee: "Обе стороны / Финансовый отдел / Юридический советник"

  software_data_check:
    text: >
      Для {doc_names} (ПО/база данных) просим согласовать: (а) депонирование
      исходного кода (escrow) и условия передачи; (б) роли сторон по ФЗ-152
      (оператор/обработчик); (в) локализацию данных на территории РФ;
      (г) трансграничную передачу данных.
    addressee: "IT-отдел / DPO / Юридический советник"

  change_of_control_dispute_check:
    text: >
      Просим согласовать для {doc_names}: условия о смене контроля (уведомление,
      согласие, право на расторжение), уступку прав лицензиата, порядок разрешения
      споров (претензионный порядок, арбитраж/суд), применимое право.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

