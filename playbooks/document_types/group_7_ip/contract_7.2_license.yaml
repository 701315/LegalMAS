          description: "Обязанность предоставить сертификат/акт уничтожения."
          required: false
          display_in_grid: true
          display_priority: 3

  - id: oss_dependencies_check
    name: "Гарантии относительно открытого ПО (Open Source) и зависимости"
    description: >
      Фактографическая проверка наличия гарантий об отсутствии «вирусных»
      OSS-компонентов (GPL, AGPL и т.п.), наличия реестра OSS-компонентов
      и условий их использования. Специфично для лицензирования ПО.
    triggers:
      any:
        - software_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "открытое ПО"
        - "open source"
        - "OSS"
        - "свободное ПО"
        - "GPL"
        - "AGPL"
        - "LGPL"
        - "MIT"
        - "Apache"
        - "вирусная лицензия"
        - "copyleft"
        - "реестр компонентов"
        - "список компонентов"
        - "SBOM"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)open[\\s-]*source"
        - "(?i)свободн\\w+\\s+по"
        - "(?i)реестр.*компонент"
        - "(?i)список.*компонент"
        - "(?i)GPL|AGPL|LGPL|MIT|Apache"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор на ПО. Проверяется только один
        специфичный для ПО вопрос: открытое ПО (OSS) и зависимости.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - OSS — это компоненты с открытыми лицензиями (GPL, MIT, Apache и т.п.).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. oss_presence_status — статус упоминания OSS.
        2. oss_presence_details — формулировка об OSS.
        3. oss_registry_status — статус реестра/приложения с OSS.
        4. oss_registry_details — ссылка на реестр/приложение.
        5. viral_license_warranty_status — статус гарантии отсутствия вирусных лицензий.
        6. viral_license_warranty_details — формулировка гарантии.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (oss_presence_status, oss_registry_status,
           viral_license_warranty_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (oss_presence_details, oss_registry_details,
           viral_license_warranty_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Лицензиар гарантирует, что ПО не содержит компонентов с лицензиями
        GPL или AGPL, требующих раскрытия исходного кода. Полный перечень
        используемых компонентов с открытым исходным кодом приведён в
        Приложении №3 (SBOM)."

        Ответ:
        {
          "oss_presence_status": "defined",
          "oss_presence_details": "используются компоненты с открытым исходным кодом",
          "oss_registry_status": "defined",
          "oss_registry_details": "Приложение №3 (SBOM)",
          "viral_license_warranty_status": "defined",
          "viral_license_warranty_details": "гарантирует, что ПО не содержит компонентов с лицензиями GPL или AGPL",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Лицензиар гарантирует, что ПО не содержит компонентов с лицензиями GPL или AGPL, требующих раскрытия исходного кода."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "oss_presence_status": "not_defined",
          "oss_presence_details": "Данные не определены",
          "oss_registry_status": "not_defined",
          "oss_registry_details": "Данные не определены",
          "viral_license_warranty_status": "not_defined",
          "viral_license_warranty_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (только реестр):
        Фрагмент:
        "Список компонентов с открытым исходным кодом приведён в Приложении №2
        к настоящему договору. Об отсутствии вирусных лицензий стороны не договорились."

        Ответ:
        {
          "oss_presence_status": "defined",
          "oss_presence_details": "список компонентов с открытым исходным кодом",
          "oss_registry_status": "defined",
          "oss_registry_details": "Приложение №2",
          "viral_license_warranty_status": "not_defined",
          "viral_license_warranty_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Список компонентов с открытым исходным кодом приведён в Приложении №2 к настоящему договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату об упоминании открытого ПО.
        2. Найди прямую цитату о реестре/приложении с OSS.
        3. Найди прямую цитату о гарантии отсутствия вирусных лицензий.
        4. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "oss_presence_status": "<defined / not_defined>",
          "oss_presence_details": "<текст или 'Данные не определены'>",
          "oss_registry_status": "<defined / not_defined>",
          "oss_registry_details": "<текст или 'Данные не определены'>",
          "viral_license_warranty_status": "<defined / not_defined>",
          "viral_license_warranty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "открытое ПО open source OSS свободное ПО GPL AGPL LGPL MIT Apache вирусная лицензия copyleft реестр компонентов список компонентов SBOM приложение с компонентами"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора на ПО
        сведения об открытом ПО (OSS), реестре компонентов и гарантиях отсутствия
        вирусных лицензий. Не анализируй вознаграждение, сублицензию, расторжение
        или общие гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. oss_presence_status — "defined" или "not_defined".
        2. oss_presence_details — формулировка об OSS.
        3. oss_registry_status — "defined" или "not_defined".
        4. oss_registry_details — ссылка на реестр/приложение.
        5. viral_license_warranty_status — "defined" или "not_defined".
        6. viral_license_warranty_details — формулировка гарантии.

        Если данные отсутствуют:
        - signal-поля (oss_presence_status, oss_registry_status,
          viral_license_warranty_status) → "not_defined";
        - fact-поля (oss_presence_details, oss_registry_details,
          viral_license_warranty_details) → "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи условия из норм ГК РФ.
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

      fields:
        - name: "oss_presence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания OSS."
          required: true

        - name: "oss_presence_details"
          type: "string"
          presentation: "fact"
          label: "Открытое ПО"
          description: "Формулировка об использовании открытого ПО."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "oss_registry_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус реестра/приложения с OSS."
          required: true

        - name: "oss_registry_details"
          type: "string"
          presentation: "fact"
          label: "Реестр OSS"
          description: "Ссылка на реестр/приложение с OSS-компонентами."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "viral_license_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантии отсутствия вирусных лицензий."
          required: true

        - name: "viral_license_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия отсутствия вирусных лицензий"
          description: "Гарантия отсутствия GPL, AGPL и иных вирусных лицензий."
          required: false
          display_in_grid: true
          display_priority: 3

  - id: ip_modification_adaptation_check
    name: "Право на переработку, адаптацию и модификацию объекта ИС"
    description: >
      Фактографическая проверка явного предоставления Лицензиату права
      на модификацию, адаптацию, локализацию или создание производных
      произведений (ст. 1270 ГК РФ). Без явного предоставления такие
      действия считаются нарушением исключительного права.
    triggers:
      any:
        - software_license
        - copyright_license
        - content_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право на переработку"
        - "модификация"
        - "адаптация"
        - "локализация"
        - "производное произведение"
        - "доработка"
        - "кастомизация"
