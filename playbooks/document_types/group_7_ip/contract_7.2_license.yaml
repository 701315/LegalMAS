        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать объект ИС в соответствии с условиями договора."

        Ответ:
        {
          "ip_indemnity_scope": "not_defined",
          "ip_indemnity_details": "Данные не определены",
          "non_infringement_warranty_status": "not_defined",
          "non_infringement_warranty_details": "Данные не определены",
