      - "(?i)секрет\\s+производств[аа]"
      - "(?i)коммерческ[а-яё]+\\s+тайн[аа]"
      - "(?i)конфиденциальн[а-яё]+\\s+информаци[яя]"
      - "(?i)\\bтехнологи[яя]\\b"
      - "(?i)\\bметодик[аа]\\b"
      - "(?i)\\bрецептур[аа]\\b"

  saas_cloud:
    any_keywords:
      - "(?i)\\bSaaS\\b"
      - "(?i)облачн[ыо]й\\s+сервис"
      - "(?i)\\bcloud\\b"
      - "(?i)\\bподписк[ааеиу]\\b"
      - "(?i)доступ\\s+к\\s+сервис[уу]"
