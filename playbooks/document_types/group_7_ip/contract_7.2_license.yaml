shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|USD|EUR|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  registration_number: "(?i)\\b№?\\s*\\d{4,}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  territory_pattern: "(?i)(территори[ия]|РФ|Российск[ая]\\s+Федераци[ия]|весь\\s+мир|worldwide)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: license_subject_extraction
    name: "Предмет лицензии: объект ИС, вид лицензии, способы, территория, срок"
    description: >
      Фактографическая проверка идентификации объекта ИС, вида лицензии
      (исключительная/неисключительная), способов использования (существенное
      условие ст. 1235 ГК РФ), территории и срока действия лицензии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензиар"
        - "лицензиат"
        - "объект интеллектуальной собственности"
        - "предмет лицензии"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "способы использования"
        - "исключительная лицензия"
        - "неисключительная лицензия"
        - "простая лицензия"
        - "территория"
        - "срок действия"
        - "регистрационный номер"
        - "свидетельство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)патент\\s+№?\\s*\\d+"
        - "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"
        - "(?i)свидетельств\\w+\\s+№?\\s*\\d+"
        - "(?i)лицензиат\\s+вправе.*?(воспроизводить|распространять|использовать)"
        - "(?i)территори[ия].*?(РФ|Россий|весь\\s+мир)"
        - "(?i)срок.*?(\\d+\\s+(лет|год|месяц))"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1235-1238 ГК РФ).
        Проверяется только один вопрос: предмет лицензии — объект ИС,
        вид лицензии, способы использования, территория и срок.

        Нормативные ориентиры:
        - ст. 1235 ГК РФ — лицензионный договор (способы использования — существенное условие).
        - ст. 1236 ГК РФ — виды лицензии (исключительная / неисключительная).
        - п. 5 ст. 1235 ГК РФ — при отсутствии условия о виде лицензии она предполагается неисключительной.
        - ст. 1270 ГК РФ — способы использования произведений (для программ для ЭВМ — ст. 1280).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Права, не указанные явно, считаются НЕпредоставленными.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 12 полей + evidence
        (всего 13 ключей):
        1. licensor_details — лицензиар (наименование, реквизиты).
        2. licensee_details — лицензиат (наименование, реквизиты).
        3. ip_object_type — вид объекта ИС.
        4. ip_object_details — объект ИС с регистрационными данными.
        5. license_type_code — вид лицензии.
        6. license_type_details — формулировка вида лицензии.
        7. permitted_uses_status — статус перечня способов использования.
        8. permitted_uses_details — перечень способов использования.
        9. territory_status — статус указания территории.
        10. territory_details — территория действия лицензии.
        11. term_status — статус указания срока.
        12. term_details — срок действия лицензии.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (ip_object_type, license_type_code, permitted_uses_status,
           territory_status, term_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (licensor_details, licensee_details, ip_object_details,
           license_type_details, permitted_uses_details, territory_details, term_details)
           при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Вид лицензии:
           - "exclusive" — если прямо указано "исключительная";
           - "non_exclusive" — если прямо указано "неисключительная" или "простая";
           - "not_defined" — если вид не указан прямо. При этом в license_type_details
             укажи: "Вид лицензии не указан. По п. 5 ст. 1235 ГК РФ лицензия предполагается неисключительной."
        8. permitted_uses_status = "defined" только если приведён конкретный перечень
           способов использования. Формулировки типа "любые способы, не запрещённые
           законом", "любые способы использования" — это not_defined (перечень
           не конкретизирован), а в permitted_uses_details — точная цитата из договора.
        9. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 13 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён:
        Фрагмент:
        "Лицензиар — ООО «Альфа», ИНН 7700000001, предоставляет Лицензиату —
        ООО «Бета», ИНН 7700000002, неисключительную лицензию на использование
        программы для ЭВМ «Система Х», свидетельство о государственной регистрации
        № 2024600001 от 15.01.2024. Лицензиат вправе: воспроизводить, распространять,
        модифицировать. Территория — РФ. Срок — 3 года."

        Ответ:
        {
          "licensor_details": "ООО «Альфа», ИНН 7700000001",
          "licensee_details": "ООО «Бета», ИНН 7700000002",
          "ip_object_type": "software",
          "ip_object_details": "программа для ЭВМ «Система Х», свидетельство № 2024600001 от 15.01.2024",
          "license_type_code": "non_exclusive",
          "license_type_details": "неисключительная лицензия",
          "permitted_uses_status": "defined",
          "permitted_uses_details": "воспроизводить, распространять, модифицировать",
          "territory_status": "defined",
          "territory_details": "РФ",
          "term_status": "defined",
          "term_details": "3 года",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Лицензиар — ООО «Альфа», ИНН 7700000001, предоставляет Лицензиату — ООО «Бета», ИНН 7700000002, неисключительную лицензию на использование программы для ЭВМ «Система Х»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий лицензионный договор."

        Ответ:
        {
          "licensor_details": "Данные не определены",
          "licensee_details": "Данные не определены",
          "ip_object_type": "not_defined",
          "ip_object_details": "Данные не определены",
          "license_type_code": "not_defined",
          "license_type_details": "Вид лицензии не указан. По п. 5 ст. 1235 ГК РФ лицензия предполагается неисключительной.",
          "permitted_uses_status": "not_defined",
          "permitted_uses_details": "Данные не определены",
          "territory_status": "not_defined",
          "territory_details": "Данные не определены",
          "term_status": "not_defined",
          "term_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (территория и срок указаны; вид лицензии не указан):
        Фрагмент:
        "Лицензиар предоставляет Лицензиату право использования изобретения
        по патенту № 2800000 на территории Российской Федерации. Срок действия — 5 лет."

        Ответ:
        {
          "licensor_details": "Данные не определены",
          "licensee_details": "Данные не определены",
          "ip_object_type": "patent",
          "ip_object_details": "изобретение по патенту № 2800000",
          "license_type_code": "not_defined",
          "license_type_details": "Вид лицензии не указан. По п. 5 ст. 1235 ГК РФ лицензия предполагается неисключительной.",
          "permitted_uses_status": "not_defined",
          "permitted_uses_details": "Данные не определены",
          "territory_status": "defined",
          "territory_details": "Российская Федерация",
          "term_status": "defined",
          "term_details": "5 лет",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Лицензиар предоставляет Лицензиату право использования изобретения по патенту № 2800000 на территории Российской Федерации. Срок действия — 5 лет."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о лицензиаре и лицензиате.
        2. Найди прямую цитату об объекте ИС.
        3. Найди прямую цитату о виде лицензии.
        4. Найди прямую цитату о способах использования.
        5. Найди прямую цитату о территории.
        6. Найди прямую цитату о сроке.
        7. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 13 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "licensor_details": "<текст или 'Данные не определены'>",
          "licensee_details": "<текст или 'Данные не определены'>",
          "ip_object_type": "<patent / trademark / copyright / software / know_how / industrial_design / database / other / not_defined>",
          "ip_object_details": "<текст или 'Данные не определены'>",
          "license_type_code": "<exclusive / non_exclusive / not_defined>",
          "license_type_details": "<текст или 'Данные не определены'>",
          "permitted_uses_status": "<defined / not_defined>",
          "permitted_uses_details": "<текст или 'Данные не определены'>",
          "territory_status": "<defined / not_defined>",
          "territory_details": "<текст или 'Данные не определены'>",
          "term_status": "<defined / not_defined>",
          "term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет лицензии лицензиар лицензиат объект интеллектуальной собственности патент товарный знак программа для ЭВМ база данных ноу-хау изобретение полезная модель промышленный образец способы использования исключительная неисключительная простая лицензия территория действия срок свидетельство регистрационный номер"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "паушальный"
        - "расторжение"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии"
        - "indemnity"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "license_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Твоя задача — извлечь из лицензионного договора предмет: стороны, объект ИС, вид лицензии, способы использования, территорию и срок.
        Не анализируй вознаграждение, сублицензию, расторжение или гарантии.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. license_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_object_type, license_type_code, permitted_uses_status,
              territory_status, term_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ip_object_type = "not_defined";
           - license_type_code = "not_defined";
           - permitted_uses_status = "not_defined";
           - territory_status = "not_defined";
           - term_status = "not_defined";
           - licensor_details, licensee_details = "Данные не определены";
           - ip_object_details, license_type_details = "Данные не определены";
           - permitted_uses_details, territory_details, term_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. licensor_details:
           Наименование и реквизиты лицензиара.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        2. licensee_details:
           Наименование и реквизиты лицензиата.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. ip_object_type:
           Используй только одно из значений:
           - "patent" — изобретение, полезная модель, патент;
           - "trademark" — товарный знак, знак обслуживания;
           - "copyright" — произведение науки, литературы, искусства;
           - "software" — программа для ЭВМ;
           - "know_how" — секрет производства (ноу-хау);
           - "industrial_design" — промышленный образец;
           - "database" — база данных;
           - "other" — иной объект ИС, прямо названный в договоре;
           - "not_defined" — если объект не идентифицирован.

        4. ip_object_details:
           Описание объекта ИС с регистрационными данными (номер патента/свидетельства, дата, наименование).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. license_type_code:
           - "exclusive" — если прямо указано "исключительная лицензия";
           - "non_exclusive" — если прямо указано "неисключительная" или "простая";
           - "not_defined" — если вид не указан прямо.

        6. license_type_details:
           Формулировка вида лицензии.
           Если license_type_code = "not_defined", укажи:
           "Вид лицензии не указан. По п. 5 ст. 1235 ГК РФ лицензия предполагается неисключительной."
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. permitted_uses_status:
           - "defined" — если приведён конкретный перечень способов использования;
           - "not_defined" — если перечень не конкретизирован или отсутствует.
           Формулировки типа "любые способы, не запрещённые законом" — это "not_defined".

        8. permitted_uses_details:
           Перечень способов использования объекта ИС.
           Если данных нет — "Данные не определены".
           Если данных противоречивы — "Не удалось определить".

        9. territory_status:
           - "defined" — если территория прямо указана;
           - "not_defined" — если территория не указана.

        10. territory_details:
            Территория действия лицензии.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. term_status:
            - "defined" — если срок прямо указан;
            - "not_defined" — если срок не указан.

        12. term_details:
            Срок действия лицензии.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни license_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выводи способы использования из норм ГК РФ.
        - Права, не указанные явно в договоре, считаются НЕпредоставленными.
        - permitted_uses_status = "defined" только при конкретном перечне способов. Общие формулировки ("любые способы") = "not_defined".
        - license_type_code = "not_defined" при отсутствии прямого указания; в license_type_details отрази презумпцию п. 5 ст. 1235 ГК РФ.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: signal → "not_defined", fact → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни объекта ИС, ни вида лицензии, ни способов, ни территории, ни срока.
           → presence = "missing";
             все signal-поля = "not_defined";
             все fact-поля = "Данные не определены".

        2. Объект указан, но вид лицензии не раскрыт.
           Договор называет объект ИС, но не указывает, исключительная или неисключительная лицензия.
           → presence = "present";
             license_type_code = "not_defined";
             license_type_details = "Вид лицензии не указан. По п. 5 ст. 1235 ГК РФ лицензия предполагается неисключительной.";
             остальные поля — по факту наличия.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные объекты ИС или противоречащие сроки.
           → presence = "unclear";
             соответствующие signal-поля = "not_defined";
             соответствующие fact-поля = "Не удалось определить".

        4. Отсылка на внешний документ.
           Способы использования или объект определяются по приложению, спецификации или иному документу.
           → presence = "present";
             соответствующие signal-поля = "defined";
             соответствующие fact-поля содержат формулировку вида "Определяется Приложением №1".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для license_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для ip_object_type используй только: "patent", "trademark", "copyright", "software", "know_how", "industrial_design", "database", "other", "not_defined".
        - Для license_type_code используй только: "exclusive", "non_exclusive", "not_defined".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * licensor_details, licensee_details → "Данные не определены";
          * ip_object_details, license_type_details → "Данные не определены";
          * permitted_uses_details, territory_details, term_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "license_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету лицензии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "licensor_details"
          type: "string"
          presentation: "fact"
          label: "Лицензиар"
          description: >
            Наименование и реквизиты лицензиара. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "licensee_details"
          type: "string"
          presentation: "fact"
          label: "Лицензиат"
          description: >
            Наименование и реквизиты лицензиата. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["patent", "trademark", "copyright", "software", "know_how", "industrial_design", "database", "other", "not_defined"]
          display_in_grid: false
          description: "Вид объекта ИС. Внутреннее enum-поле."
          required: true

        - name: "ip_object_details"
          type: "string"
          presentation: "fact"
          label: "Объект ИС"
          description: >
            Описание объекта ИС с регистрационными данными. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "license_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["exclusive", "non_exclusive", "not_defined"]
          display_in_grid: false
          description: "Вид лицензии. Внутреннее enum-поле."
          required: true

        - name: "license_type_details"
          type: "string"
          presentation: "fact"
          label: "Вид лицензии"
          description: >
            Формулировка вида лицензии либо указание на презумпцию неисключительной лицензии (п. 5 ст. 1235 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "permitted_uses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня способов использования. Внутреннее enum-поле."
          required: true

        - name: "permitted_uses_details"
          type: "string"
          presentation: "fact"
          label: "Способы использования"
          description: >
            Перечень способов использования объекта ИС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

        - name: "territory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания территории. Внутреннее enum-поле."
          required: true

        - name: "territory_details"
          type: "string"
          presentation: "fact"
          label: "Территория"
          description: >
            Территория действия лицензии. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 6

        - name: "term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока. Внутреннее enum-поле."
          required: true

        - name: "term_details"
          type: "string"
          presentation: "fact"
          label: "Срок лицензии"
          description: >
            Срок действия лицензии. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 7

      store_payload: true

  - id: consideration_royalty_check
    name: "Лицензионное вознаграждение, роялти, мингарантия, отчётность и аудит"
    description: >
      Фактографическая проверка вида и размера вознаграждения, структуры роялти,
      минимальных гарантированных платежей, отчётности лицензиата и права аудита.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение"
        - "роялти"
        - "паушальный платеж"
        - "лицензионный платеж"
        - "безвозмездно"
        - "отчётность лицензиата"
        - "отчёт о продажах"
        - "право аудита"
        - "проверка бухгалтерии"
        - "минимальный платёж"
        - "минимальное роялти"
        - "гарантированный платёж"
        - "minimum guarantee"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознаграждени\\w+.*?\\d[\\d\\s]*(?:руб|USD|EUR|%)"
        - "(?i)роялти.*?\\d+[.,]?\\d*\\s*%"
        - "(?i)минимальн\\w+\\s+платёж.*?\\d"
        - "(?i)лицензиат\\s+обязан\\s+представлять\\s+отчёт"
        - "(?i)лицензиар\\s+вправе\\s+проводить\\s+аудит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1235 п. 5 ГК РФ).
        Проверяется только один вопрос: лицензионное вознаграждение, роялти,
        мингарантия, отчётность и аудит.

        Нормативные ориентиры:
        - ст. 1235 п. 5 ГК РФ — лицензионное вознаграждение.
        - ст. 1237 ГК РФ — отчётность лицензиата.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 12 полей + evidence
        (всего 13 ключей):
        1. consideration_type — вид вознаграждения.
        2. royalty_rate_status — статус ставки роялти.
        3. royalty_rate_details — ставка роялти.
        4. lump_sum_status — статус паушального платежа.
        5. lump_sum_details — паушальный платёж.
        6. payment_schedule_status — статус графика платежей.
        7. payment_schedule_details — график платежей.
        8. minimum_guarantee_status — статус мингарантии.
        9. minimum_guarantee_details — минимальные гарантированные платежи.
        10. reporting_status — статус отчётности лицензиата.
        11. reporting_details — отчётность лицензиата.
        12. audit_right_status — статус права аудита.
        13. audit_right_details — право аудита лицензиара.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (consideration_type, royalty_rate_status, lump_sum_status,
           payment_schedule_status, minimum_guarantee_status, reporting_status, audit_right_status)
           при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (royalty_rate_details, lump_sum_details, payment_schedule_details,
           minimum_guarantee_details, reporting_details, audit_right_details)
           при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. consideration_type:
           - "royalty" — если только периодические платежи (роялти);
           - "lump_sum" — если только единовременный платёж (паушальный);
           - "combined" — если сочетание роялти и паушального;
           - "gratuitous" — если прямо указано "безвозмездно";
           - "not_defined" — если вид не указан прямо.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 14 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — вознаграждение определено:
        Фрагмент:
        "Лицензионное вознаграждение состоит из паушального платежа 500 000 рублей
        и роялти в размере 5% от выручки лицензиата. Минимальный гарантированный
        платёж — 100 000 рублей в квартал. Лицензиат представляет отчёт ежеквартально
        до 10-го числа месяца, следующего за отчётным кварталом. Лицензиар вправе
        проводить аудит 1 раз в год."

        Ответ:
        {
          "consideration_type": "combined",
          "royalty_rate_status": "defined",
          "royalty_rate_details": "5% от выручки лицензиата",
          "lump_sum_status": "defined",
          "lump_sum_details": "паушальный платёж 500 000 рублей",
          "payment_schedule_status": "defined",
          "payment_schedule_details": "ежеквартально до 10-го числа месяца, следующего за отчётным кварталом",
          "minimum_guarantee_status": "defined",
          "minimum_guarantee_details": "100 000 рублей в квартал",
          "reporting_status": "defined",
          "reporting_details": "ежеквартально до 10-го числа месяца, следующего за отчётным кварталом",
          "audit_right_status": "defined",
          "audit_right_details": "1 раз в год",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Лицензионное вознаграждение состоит из паушального платежа 500 000 рублей и роялти в размере 5% от выручки лицензиата."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат использует объект ИС."

        Ответ:
        {
          "consideration_type": "not_defined",
          "royalty_rate_status": "not_defined",
          "royalty_rate_details": "Данные не определены",
          "lump_sum_status": "not_defined",
          "lump_sum_details": "Данные не определены",
          "payment_schedule_status": "not_defined",
          "payment_schedule_details": "Данные не определены",
          "minimum_guarantee_status": "not_defined",
          "minimum_guarantee_details": "Данные не определены",
          "reporting_status": "not_defined",
          "reporting_details": "Данные не определены",
          "audit_right_status": "not_defined",
          "audit_right_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 14 ключей (13 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о виде вознаграждения.
        2. Найди прямую цитату о ставке роялти.
        3. Найди прямую цитату о паушальном платеже.
        4. Найди прямую цитату о графике платежей.
        5. Найди прямую цитату о мингарантии.
        6. Найди прямую цитату об отчётности.
        7. Найди прямую цитату о праве аудита.
        8. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 14 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "consideration_type": "<royalty / lump_sum / combined / gratuitous / not_defined>",
          "royalty_rate_status": "<defined / not_defined>",
          "royalty_rate_details": "<текст или 'Данные не определены'>",
          "lump_sum_status": "<defined / not_defined>",
          "lump_sum_details": "<текст или 'Данные не определены'>",
          "payment_schedule_status": "<defined / not_defined>",
          "payment_schedule_details": "<текст или 'Данные не определены'>",
          "minimum_guarantee_status": "<defined / not_defined>",
          "minimum_guarantee_details": "<текст или 'Данные не определены'>",
          "reporting_status": "<defined / not_defined>",
          "reporting_details": "<текст или 'Данные не определены'>",
          "audit_right_status": "<defined / not_defined>",
          "audit_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вознаграждение роялти паушальный платеж лицензионный платеж безвозмездно отчётность лицензиата отчёт о продажах право аудита проверка бухгалтерии минимальный платёж минимальное роялти гарантированный платёж minimum guarantee график платежей"
      retrieval_profile: "royalty_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "предмет лицензии"
        - "способы использования"
        - "территория"
        - "срок"
        - "расторжение"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.25
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "consideration_royalty_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Твоя задача — извлечь из лицензионного договора сведения о вознаграждении: вид, роялти, паушальный платёж, график, мингарантия, отчётность, аудит.
        Не анализируй предмет лицензии, сублицензию, расторжение или гарантии.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. consideration_royalty_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (consideration_type, royalty_rate_status, lump_sum_status,
              payment_schedule_status, minimum_guarantee_status,
              reporting_status, audit_right_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - consideration_type = "not_defined";
           - royalty_rate_status = "not_defined";
           - lump_sum_status = "not_defined";
           - payment_schedule_status = "not_defined";
           - minimum_guarantee_status = "not_defined";
           - reporting_status = "not_defined";
           - audit_right_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. consideration_type:
           - "royalty" — только периодические платежи (роялти);
           - "lump_sum" — только единовременный платёж (паушальный);
           - "combined" — сочетание роялти и паушального;
           - "gratuitous" — прямо указано "безвозмездно";
           - "not_defined" — если вид не указан прямо.

        2. royalty_rate_status:
           - "defined" — если ставка роялти прямо указана;
           - "not_defined" — если не указана.

        3. royalty_rate_details:
           Ставка роялти (процент, база расчёта).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. lump_sum_status:
           - "defined" — если паушальный платёж прямо указан;
           - "not_defined" — если не указан.

        5. lump_sum_details:
           Размер паушального платежа.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. payment_schedule_status:
           - "defined" — если график/сроки платежей прямо указаны;
           - "not_defined" — если не указаны.

        7. payment_schedule_details:
           График платежей.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. minimum_guarantee_status:
           - "defined" — если минимальный гарантированный платёж прямо указан;
           - "not_defined" — если не указан.

        9. minimum_guarantee_details:
           Минимальные гарантированные платежи.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. reporting_status:
            - "defined" — если отчётность лицензиата прямо предусмотрена;
            - "not_defined" — если не предусмотрена.

        11. reporting_details:
            Периодичность и форма отчётности.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        12. audit_right_status:
            - "defined" — если право аудита лицензиара прямо предусмотрено;
            - "not_defined" — если не предусмотрено.

        13. audit_right_details:
            Условия и периодичность аудита.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни consideration_royalty_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выводи вознаграждение из норм ГК РФ.
        - consideration_type = "gratuitous" только при прямом указании "безвозмездно".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: signal → "not_defined", fact → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вознаграждения, ни роялти, ни паушального платежа, ни отчётности, ни аудита.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_details = "Данные не определены".

        2. Безвозмездная лицензия.
           Прямо указано, что лицензия предоставляется безвозмездно.
           → presence = "present";
             consideration_type = "gratuitous";
             royalty_rate_status = lump_sum_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие в суммах или ставках.
           В разных частях договора указаны разные ставки роялти или суммы.
           → presence = "unclear";
             соответствующие signal-поля = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Отсылка на отдельное соглашение о вознаграждении.
           Вознаграждение определяется отдельным договором или приложением.
           → presence = "present";
             consideration_type = "not_defined" (если вид не ясен из основного текста);
             соответствующие *_details содержат формулировку вида "Определяется Приложением №2".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для consideration_royalty_check_presence используй только: "present", "missing", "unclear".
        - Для consideration_type используй только: "royalty", "lump_sum", "combined", "gratuitous", "not_defined".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "consideration_royalty_check_presence"
