        Ответ:
        {
          "ip_indemnity_scope": "IP claims only",
          "ip_indemnity_details": "возместить убытки, причинённые претензиями третьих лиц о нарушении их патентных прав или авторских прав",
          "non_infringement_warranty_status": "defined",
          "non_infringement_warranty_details": "Объект не нарушает исключительные права третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Лицензиар гарантирует, что Объект не нарушает исключительные права третьих лиц."
            }
          ]
