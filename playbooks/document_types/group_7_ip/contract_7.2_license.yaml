      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "расторжение"
        - "гарантии лицензиара"
        - "indemnity"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
