# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|USD|EUR|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  registration_number: "(?i)\\b№?\\s*\\d{4,}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  territory_pattern: "(?i)(территори[ия]|РФ|Российск[ая]\\s+Федераци[ия]|весь\\s+мир|worldwide)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Предмет лицензии — объект, вид, способы, территория, срок
  # ──────────────────────────────────────────────────────────────────────────
  - id: license_subject_extraction
    name: "Предмет лицензии: объект ИС, вид лицензии, способы, территория, срок"
    description: >
      Фактографическая проверка идентификации объекта ИС, вида лицензии
      (исключительная/неисключительная), способов использования (существенное
      условие ст. 1235 ГК РФ), территории и срока действия лицензии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензиар"
        - "лицензиат"
        - "объект интеллектуальной собственности"
        - "предмет лицензии"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "способы использования"
        - "исключительная лицензия"
        - "неисключительная лицензия"
        - "простая лицензия"
        - "территория"
        - "срок действия"
        - "регистрационный номер"
        - "свидетельство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)патент\\s+№?\\s*\\d+"
        - "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"
        - "(?i)свидетельств\\w+\\s+№?\\s*\\d+"
        - "(?i)лицензиат\\s+вправе.*?(воспроизводить|распространять|использовать)"
        - "(?i)территори[ия].*?(РФ|Россий|весь\\s+мир)"
        - "(?i)срок.*?(\\d+\\s+(лет|год|месяц))"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1235-1238 ГК РФ).
        Проверяется только один вопрос: предмет лицензии — объект ИС,
        вид лицензии, способы использования, территория и срок.

        Нормативный ориентир:
        - ст. 1235 ГК РФ — лицензионный договор
        - ст. 1236 ГК РФ — виды лицензии
        - ст. 1270 ГК РФ — способы использования произведений

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Способы использования — существенное условие (ст. 1235 п. 1 ГК РФ).
        - Права, не указанные явно, считаются НЕпредоставленными.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Лицензиар (наименование, реквизиты).
        2. Лицензиат (наименование, реквизиты).
        3. Вид объекта ИС и регистрационные данные.
        4. Вид лицензии (исключительная / неисключительная).
        5. Перечень способов использования.
        6. Территория действия лицензии.
        7. Срок действия лицензии.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён:
        Фрагмент:
        "Лицензиар — ООО «Альфа», ИНН 7700000001, предоставляет Лицензиату —
        ООО «Бета», ИНН 7700000002, неисключительную лицензию на использование
        программы для ЭВМ «Система Х», свидетельство о государственной регистрации
        № 2024600001 от 15.01.2024. Лицензиат вправе: воспроизводить, распространять,
        модифицировать. Территория — РФ. Срок — 3 года."

        Ответ:
        {
          "licensor_details": "ООО «Альфа», ИНН 7700000001",
          "licensee_details": "ООО «Бета», ИНН 7700000002",
          "ip_object_type": "software",
          "ip_object_details": "программа для ЭВМ «Система Х», свидетельство № 2024600001 от 15.01.2024",
          "license_type_code": "non_exclusive",
          "license_type_details": "неисключительная лицензия",
          "permitted_uses_status": "defined",
          "permitted_uses_details": "воспроизводить, распространять, модифицировать",
          "territory_status": "defined",
          "territory_details": "РФ",
          "term_status": "defined",
          "term_details": "3 года",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Лицензиар — ООО «Альфа», ИНН 7700000001, предоставляет Лицензиату — ООО «Бета», ИНН 7700000002, неисключительную лицензию на использование программы для ЭВМ «Система Х»."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий лицензионный договор."

        Ответ:
        {
          "licensor_details": "Данные не определены",
          "licensee_details": "Данные не определены",
          "ip_object_type": "not_defined",
          "ip_object_details": "Данные не определены",
          "license_type_code": "not_defined",
          "license_type_details": "Данные не определены",
          "permitted_uses_status": "not_defined",
          "permitted_uses_details": "Данные не определены",
          "territory_status": "not_defined",
          "territory_details": "Данные не определены",
          "term_status": "not_defined",
          "term_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лицензиаре и лицензиате.
        2. Найди прямую цитату об объекте ИС.
        3. Найди прямую цитату о виде лицензии.
        4. Найди прямую цитату о способах использования.
        5. Найди прямую цитату о территории.
        6. Найди прямую цитату о сроке.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "licensor_details": "<текст или 'Данные не определены'>",
          "licensee_details": "<текст или 'Данные не определены'>",
          "ip_object_type": "<patent / trademark / copyright / software / know_how / industrial_design / database / other / not_defined>",
          "ip_object_details": "<текст или 'Данные не определены'>",
          "license_type_code": "<exclusive / non_exclusive / not_defined>",
          "license_type_details": "<текст или 'Данные не определены'>",
          "permitted_uses_status": "<defined / not_defined>",
          "permitted_uses_details": "<текст или 'Данные не определены'>",
          "territory_status": "<defined / not_defined>",
          "territory_details": "<текст или 'Данные не определены'>",
          "term_status": "<defined / not_defined>",
          "term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензиар лицензиат объект интеллектуальной собственности предмет лицензии патент товарный знак произведение программа для ЭВМ ноу-хау способы использования исключительная лицензия неисключительная лицензия простая лицензия территория срок действия регистрационный номер свидетельство"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "паушальный"
        - "расторжение"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии"
        - "indemnity"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора предмет:
        стороны, объект ИС, вид лицензии, способы использования, территорию, срок.
        Не анализируй вознаграждение, сублицензию, расторжение или гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. licensor_details — лицензиар.
        2. licensee_details — лицензиат.
        3. ip_object_type — patent / trademark / copyright / software / know_how / industrial_design / database / other / not_defined.
        4. ip_object_details — описание объекта ИС с регистрационными данными.
        5. license_type_code — exclusive / non_exclusive / not_defined.
        6. license_type_details — формулировка вида лицензии.
        7. permitted_uses_status — "defined" или "not_defined".
        8. permitted_uses_details — перечень способов использования.
        9. territory_status — "defined" или "not_defined".
        10. territory_details — территория действия лицензии.
        11. term_status — "defined" или "not_defined".
        12. term_details — срок действия лицензии.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - license_type_code: "exclusive" — если прямо указано "исключительная";
          "non_exclusive" — если прямо указано "неисключительная" или "простая";
          "not_defined" — если вид не указан.
        - permitted_uses_status = "defined" только если есть конкретный перечень
          способов использования.
        - Не выводи способы использования из норм ГК.
        - Верни только JSON.
        </rules>
      fields:
        - name: "licensor_details"
          type: "string"
          presentation: "fact"
          label: "Лицензиар"
          description: "Наименование и реквизиты лицензиара."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "licensee_details"
          type: "string"
          presentation: "fact"
          label: "Лицензиат"
          description: "Наименование и реквизиты лицензиата."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["patent", "trademark", "copyright", "software", "know_how", "industrial_design", "database", "other", "not_defined"]
          description: "Вид объекта ИС."
          required: true
        - name: "ip_object_details"
          type: "string"
          presentation: "fact"
          label: "Объект ИС"
          description: "Описание объекта ИС с регистрационными данными."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "license_type_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["exclusive", "non_exclusive", "not_defined"]
          description: "Вид лицензии."
          required: true
        - name: "license_type_details"
          type: "string"
          presentation: "fact"
          label: "Вид лицензии"
          description: "Формулировка вида лицензии."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "permitted_uses_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня способов использования."
          required: true
        - name: "permitted_uses_details"
          type: "string"
          presentation: "fact"
          label: "Способы использования"
          description: "Перечень способов использования объекта ИС."
          required: false
          display_in_grid: true
          display_priority: 5
        - name: "territory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания территории."
          required: false
        - name: "territory_details"
          type: "string"
          presentation: "fact"
          label: "Территория"
          description: "Территория действия лицензии."
          required: false
          display_in_grid: true
          display_priority: 6
        - name: "term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока."
          required: false
        - name: "term_details"
          type: "string"
          presentation: "fact"
          label: "Срок лицензии"
          description: "Срок действия лицензии."
          required: false
          display_in_grid: true
          display_priority: 7
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Вознаграждение, роялти, мингарантия, отчётность
  # ──────────────────────────────────────────────────────────────────────────
  - id: consideration_royalty_check
    name: "Лицензионное вознаграждение, роялти, мингарантия, отчётность и аудит"
    description: >
      Фактографическая проверка вида и размера вознаграждения, структуры роялти,
      минимальных гарантированных платежей, отчётности лицензиата и права аудита.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение"
        - "роялти"
        - "паушальный платеж"
        - "лицензионный платеж"
        - "безвозмездно"
        - "отчётность лицензиата"
        - "отчёт о продажах"
        - "право аудита"
        - "проверка бухгалтерии"
        - "минимальный платёж"
        - "минимальное роялти"
        - "гарантированный платёж"
        - "minimum guarantee"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознаграждени\\w+.*?\\d[\\d\\s]*(?:руб|USD|EUR|%)"
        - "(?i)роялти.*?\\d+[.,]?\\d*\\s*%"
        - "(?i)минимальн\\w+\\s+платёж.*?\\d"
        - "(?i)лицензиат\\s+обязан\\s+представлять\\s+отчёт"
        - "(?i)лицензиар\\s+вправе\\s+проводить\\s+аудит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1235 п. 5 ГК РФ).
        Проверяется только один вопрос: лицензионное вознаграждение, роялти,
        мингарантия, отчётность и аудит.

        Нормативный ориентир:
        - ст. 1235 п. 5 ГК РФ — лицензионное вознаграждение
        - ст. 1237 ГК РФ — отчётность

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид вознаграждения (роялти / паушальный / комбинированный / безвозмездно).
        2. Ставку роялти.
        3. Размер паушального платежа.
        4. График платежей.
        5. Минимальные гарантированные платежи.
        6. Обязательность и периодичность отчётности лицензиата.
        7. Право лицензиара на аудит.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
