        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общие основания и порядок расторжения НЕ проверяются (это global checks).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 4 поля + evidence
        (всего 5 ключей):
        1. bankruptcy_status — статус условий о банкротстве/ликвидации лицензиара.
        2. bankruptcy_details — условия о судьбе лицензии при банкротстве/ликвидации лицензиара.
        3. ip_termination_status — статус условий о прекращении исключительного права.
        4. ip_termination_details — судьба лицензии при прекращении исключительного права.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (bankruptcy_status, ip_termination_status) при отсутствии
           данных возвращай строго "not_defined".
        4. Для fact-полей (bankruptcy_details, ip_termination_details) при отсутствии
           данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не проверяй общие основания расторжения — это не входит в задачу.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 5 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — оба условия определены:
        Фрагмент:
        "В случае банкротства или ликвидации Лицензиара настоящая лицензия
        сохраняет силу до истечения срока её действия. При прекращении
        исключительного права на Объект по любым основаниям Лицензиат вправе
        требовать расторжения договора и возмещения убытков."

        Ответ:
        {
          "bankruptcy_status": "defined",
          "bankruptcy_details": "в случае банкротства или ликвидации Лицензиара лицензия сохраняет силу до истечения срока её действия",
          "ip_termination_status": "defined",
          "ip_termination_details": "при прекращении исключительного права на Объект Лицензиат вправе требовать расторжения договора и возмещения убытков",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "В случае банкротства или ликвидации Лицензиара настоящая лицензия сохраняет силу до истечения срока её действия."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать объект ИС в соответствии с условиями договора."

        Ответ:
        {
          "bankruptcy_status": "not_defined",
          "bankruptcy_details": "Данные не определены",
          "ip_termination_status": "not_defined",
          "ip_termination_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (только банкротство):
        Фрагмент:
        "При реорганизации или ликвидации Лицензиара права и обязанности по договору
        переходят к правопреемнику. О прекращении исключительного права стороны
        не договорились."

        Ответ:
        {
          "bankruptcy_status": "defined",
          "bankruptcy_details": "при реорганизации или ликвидации Лицензиара права и обязанности по договору переходят к правопреемнику",
          "ip_termination_status": "not_defined",
          "ip_termination_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.2",
              "quote": "При реорганизации или ликвидации Лицензиара права и обязанности по договору переходят к правопреемнику."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о судьбе лицензии при банкротстве/ликвидации лицензиара.
        2. Найди прямую цитату о судьбе лицензии при прекращении исключительного права.
        3. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "bankruptcy_status": "<defined / not_defined>",
          "bankruptcy_details": "<текст или 'Данные не определены'>",
          "ip_termination_status": "<defined / not_defined>",
          "ip_termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "банкротство лицензиара ликвидация лицензиара несостоятельность прекращение исключительного права судьба лицензии сохранение лицензии переход исключительного права правопреемник реорганизация лицензиара"
      retrieval_profile: "termination_check"
