      самостоятельно используя объект ИС (п. 1.1 ст. 1236 ГК РФ допускает это
      по умолчанию). Без явного запрета — лицензиат платит за «монополию»,
      которой фактически нет.
    triggers:
      any: ["exclusive_license"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "лицензиар не вправе использовать"
        - "запрет использования лицензиаром"
        - "лицензиар обязуется не использовать"
        - "лицензиар воздерживается"
        - "full exclusive"
      keyword_mode: "any"
      negative_keywords:
        - "лицензиар сохраняет право использовать"
        - "лицензиар вправе использовать"
      regex_patterns:
        - "(?i)лицензиар\\s+(не\\s+вправе|обязуется\\s+не)\\s+использовать"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Лицензия указана как ИСКЛЮЧИТЕЛЬНАЯ.
        Проверь, запрещено ли лицензиару самому использовать объект ИС.

        Ответь строго в JSON:
        {
          "licensor_own_use_prohibited": "<yes / no / unclear / not_found>",
          "licensor_competing_activity_prohibited": "<yes / no / unclear / not_found>",
          "non_compete_territory": "<территория запрета или not_found>",
          "non_compete_period": "<срок или not_found>"
        }

        ВАЖНО: По п. 1.1 ст. 1236 ГК РФ лицензиар МОЖЕТ использовать объект сам,
        если это явно не запрещено в договоре. Молчание = разрешено.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "лицензиар не вправе"
        - "запрет использования"
        - "исключительная лицензия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "licensor_own_use_prohibited"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Запрет лицензиару на собственное использование"
      store_payload: true

  - id: indemnification_ip_claims
    name: "Возмещение убытков при IP-претензиях третьих лиц"
    description: |
      Если третье лицо предъявит претензию о том, что объект ИС нарушает его права
      (патент, авторское право), лицензиат может понести убытки.
      Без indemnity-оговорки лицензиат несёт риск самостоятельно.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возмещение убытков"
        - "indemnification"
        - "indemnity"
        - "претензии третьих лиц"
        - "иски о нарушении прав"
        - "гарантия ненарушения"
        - "non-infringement warranty"
        - "лицензиар обязуется возместить"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиар\\s+обязуется\\s+возместить.*убытки"
        - "(?i)(indemnif|возмещени).*третьи.*лица"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие оговорки о возмещении убытков при IP-претензиях третьих лиц.

        Ответь строго в JSON:
        {
          "indemnification_present": "<yes / no / not_found>",
          "indemnifying_party": "<licensor / licensee / mutual / not_found>",
          "scope": "<IP claims only / all claims / not_found>",
          "cap": "<ограничение суммы или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "возмещение убытков"
        - "indemnification"
        - "претензии третьих лиц"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "indemnification_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие indemnity-оговорки"
      store_payload: true

  - id: most_favored_licensee
    name: "Оговорка о наиболее благоприятных условиях (MFN)"
    description: |
      При неисключительной лицензии лицензиар может предоставить другим лицензиатам
      более выгодные условия. MFN-оговорка защищает первого лицензиата.
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наиболее благоприятные условия"
        - "most favored"
        - "MFN"
        - "не менее выгодные"
        - "равные условия"
        - "лицензиар обязуется не предоставлять более выгодные"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(наиболее\\s+благоприятн|most\\s+favored|MFN)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие MFN-оговорки (most favored licensee).

        Ответь строго в JSON:
        {
          "mfn_clause_present": "<yes / no / not_found>",
          "mfn_scope": "<описание или not_found>"
