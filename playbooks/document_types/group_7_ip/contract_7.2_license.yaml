      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "mfn_clause_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие MFN-оговорки"
      store_payload: true

  - id: change_of_control_clause
    name: "Смена контроля над лицензиаром/лицензиатом"
    description: |
      При смене контроля (продажа доли, M&A) лицензия может перейти к конкуренту.
      Без оговорки — риск потери контроля над использованием объекта ИС.
