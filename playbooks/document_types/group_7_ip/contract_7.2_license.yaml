  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Расторжение, банкротство, последствия
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_bankruptcy_check
    name: "Расторжение, банкротство лицензиара и последствия"
    description: >
      Фактографическая проверка оснований досрочного расторжения, последствий
      банкротства/ликвидации лицензиара, порядка прекращения лицензии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "досрочное прекращение"
        - "отказ от договора"
        - "основания расторжения"
        - "последствия расторжения"
        - "банкротство лицензиара"
        - "ликвидация"
        - "несостоятельность"
        - "прекращение исключительного права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторжение.*в\\s+случае"
        - "(?i)лицензиар\\s+вправе\\s+отказаться"
        - "(?i)в\\s+случае\\s+(банкротства|ликвидации).*лицензиар"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 450-453, 1237 ГК РФ).
        Проверяется только один вопрос: расторжение, банкротство лицензиара
        и последствия прекращения лицензии.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания досрочного расторжения.
        2. Порядок расторжения (уведомление, cure period).
        3. Последствия расторжения.
        4. Условия о банкротстве/ликвидации лицензиара.
        5. Судьба лицензии при прекращении права.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лицензиар вправе расторгнуть договор при неуплате вознаграждения более
        2 месяцев подряд. Лицензиат вправе расторгнуть договор при прекращении
        исключительного права. В случае банкротства лицензиара лицензия сохраняется
        до истечения срока. При расторжении лицензиат прекращает использование объекта."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "неуплата вознаграждения более 2 месяцев подряд; прекращение исключительного права",
          "termination_procedure_status": "not_defined",
          "termination_procedure_details": "Данные не определены",
          "termination_consequences_status": "defined",
          "termination_consequences_details": "лицензиат прекращает использование объекта",
          "bankruptcy_status": "defined",
          "bankruptcy_details": "в случае банкротства лицензиара лицензия сохраняется до истечения срока",
          "ip_termination_status": "defined",
          "ip_termination_details": "при прекращении исключительного права лицензиат вправе расторгнуть договор",
          "evidence": [{"clause_ref": "п. 7.1", "quote": "Лицензиар вправе расторгнуть договор при неуплате вознаграждения более 2 месяцев подряд."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату о порядке расторжения.
        3. Найди прямую цитату о последствиях.
        4. Найди прямую цитату о банкротстве.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "termination_procedure_status": "<defined / not_defined>",
          "termination_procedure_details": "<текст или 'Данные не определены'>",
          "termination_consequences_status": "<defined / not_defined>",
          "termination_consequences_details": "<текст или 'Данные не определены'>",
          "bankruptcy_status": "<defined / not_defined>",
          "bankruptcy_details": "<текст или 'Данные не определены'>",
          "ip_termination_status": "<defined / not_defined>",
          "ip_termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение досрочное прекращение отказ от договора основания расторжения последствия расторжения банкротство лицензиара ликвидация несостоятельность прекращение исключительного права переход прав cure period срок на устранение нарушений"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "indemnity"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о расторжении, банкротстве лицензиара и последствиях прекращения лицензии.
        Не анализируй вознаграждение, сублицензию или гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. termination_grounds_status — "defined" или "not_defined".
        2. termination_grounds_details — основания досрочного расторжения.
        3. termination_procedure_status — "defined" или "not_defined".
        4. termination_procedure_details — порядок расторжения.
        5. termination_consequences_status — "defined" или "not_defined".
        6. termination_consequences_details — последствия расторжения.
        7. bankruptcy_status — "defined" или "not_defined".
        8. bankruptcy_details — условия о банкротстве лицензиара.
        9. ip_termination_status — "defined" или "not_defined".
        10. ip_termination_details — судьба лицензии при прекращении права.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи последствия расторжения из норм ГК.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения."
          required: true
        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "Основания досрочного расторжения."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "termination_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка расторжения."
          required: false
        - name: "termination_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок расторжения"
          description: "Порядок расторжения (уведомление, cure period)."
          required: false
          display_in_grid: false
        - name: "termination_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий расторжения."
          required: false
        - name: "termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: "Последствия расторжения."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "bankruptcy_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий о банкротстве лицензиара."
          required: false
        - name: "bankruptcy_details"
          type: "string"
          presentation: "fact"
          label: "Банкротство лицензиара"
