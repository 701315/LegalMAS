        0. ip_wind_down_destruction_check_presence: "present" / "missing" / "unclear".
        1. destruction_obligation_status — "defined" или "not_defined".
        2. destruction_obligation_details — формулировка обязанности уничтожить/вернуть.
        3. wind_down_period_status — "defined" или "not_defined".
