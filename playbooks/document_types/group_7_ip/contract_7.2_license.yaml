    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяется только один
        специфичный для ИС вопрос: право Лицензиата на переработку,
        модификацию, адаптацию или создание производных произведений.

        Нормативные ориентиры:
        - ст. 1270 ГК РФ — переработка как самостоятельный способ использования.
        - ст. 1266 ГК РФ — защита от искажения (для произведений).
        - ст. 1280 ГК РФ — специальные права пользователя программы для ЭВМ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - По умолчанию право на переработку НЕ предоставлено, если прямо не указано.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. modification_right_status — статус права на модификацию.
        2. modification_right_details — формулировка права на модификацию.
        3. modification_scope_code — объём права (any / limited / no / not_defined).
        4. modification_scope_details — конкретные ограничения или разрешения.
        5. attribution_status — статус требования атрибуции.
        6. attribution_details — формулировка требования к указанию авторства.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (modification_right_status, modification_scope_code,
           attribution_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (modification_right_details, modification_scope_details,
           attribution_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. modification_scope_code:
           - "any_modification" — если разрешены любые изменения без ограничений;
           - "limited_modification" — если разрешены только определённые изменения;
           - "no_modification" — если прямо запрещено изменять объект;
           - "not_defined" — если объём не указан.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право на модификацию предоставлено с ограничениями:
        Фрагмент:
        "Лицензиат вправе адаптировать, локализовать и модифицировать ПО
        для собственных внутренних нужд. При распространении модифицированных
        версий Лицензиат обязан сохранять указание на первоначального правообладателя."

        Ответ:
        {
          "modification_right_status": "defined",
          "modification_right_details": "вправе адаптировать, локализовать и модифицировать ПО для собственных внутренних нужд",
          "modification_scope_code": "limited_modification",
          "modification_scope_details": "только для собственных внутренних нужд",
          "attribution_status": "defined",
          "attribution_details": "обязан сохранять указание на первоначального правообладателя",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Лицензиат вправе адаптировать, локализовать и модифицировать ПО для собственных внутренних нужд."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "modification_right_status": "not_defined",
          "modification_right_details": "Данные не определены",
          "modification_scope_code": "not_defined",
          "modification_scope_details": "Данные не определены",
          "attribution_status": "not_defined",
          "attribution_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — модификация прямо запрещена:
        Фрагмент:
        "Лицензиату запрещается вносить любые изменения в Объект, декомпилировать,
        создавать производные произведения. Любое использование допускается только
        в неизменном виде."

        Ответ:
        {
          "modification_right_status": "defined",
          "modification_right_details": "запрещается вносить любые изменения в Объект",
          "modification_scope_code": "no_modification",
          "modification_scope_details": "любое использование допускается только в неизменном виде",
          "attribution_status": "not_defined",
          "attribution_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Лицензиату запрещается вносить любые изменения в Объект, декомпилировать, создавать производные произведения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
