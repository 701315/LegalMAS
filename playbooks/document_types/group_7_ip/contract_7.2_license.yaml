  - id: dispute_resolution_license
    name: "Порядок разрешения споров"
    description: "Выбор юрисдикции, арбитраж vs суд, медиация, претензионный порядок"
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
