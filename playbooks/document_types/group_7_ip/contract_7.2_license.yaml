        - sublicense_regime: "allowed" — если прямо разрешена без условий;
          "prohibited" — если прямо запрещена;
          "allowed_with_consent" — если требуется согласие лицензиара;
          "not_defined" — если не упомянута.
        - Не выводи режим сублицензии из нормы ст. 1238 ГК РФ.
        - Верни только JSON.
        </rules>
      fields:
