  - id: warranties_validity_defense_check
    name: "Гарантии лицензиара, действительность права и защита от нарушителей"
    description: >
      Фактографическая проверка гарантий лицензиара о наличии и действительности
      исключительного права, обязанности поддерживать право в силе и защиты
      от нарушений третьими лицами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензиар гарантирует"
        - "исключительное право действительно"
        - "отсутствие обременений"
        - "поддерживать патент в силе"
        - "уплата патентных пошлин"
        - "обязанность защищать право"
        - "защита от нарушителей"
        - "пресечение нарушений"
        - "иск к нарушителям"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиар\\s+гарантирует.*является\\s+правообладател"
        - "(?i)лицензиар\\s+обязуется\\s+поддерживать.*действительность"
        - "(?i)лицензиар\\s+обязуется\\s+пресекать\\s+нарушения"
        - "(?i)лицензиат\\s+вправе\\s+предъявлять\\s+иски"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1235 ГК РФ).
        Проверяется только один вопрос: гарантии лицензиара, действительность
        права и защита от нарушителей.

        Нормативные ориентиры:
        - ст. 1235 ГК РФ — лицензионный договор.
        - ст. 1237 ГК РФ — обязанности лицензиара и лицензиата.
        - ст. 1254 ГК РФ — патентные пошлины.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 12 полей + evidence
        (всего 13 ключей):
        1. ownership_warranty_status — статус гарантии наличия права.
        2. ownership_warranty_details — гарантия наличия исключительного права.
        3. validity_warranty_status — статус гарантии действительности.
        4. validity_warranty_details — гарантия действительности права.
        5. maintenance_obligation_status — статус обязанности поддерживать право.
        6. maintenance_obligation_details — обязанность поддерживать право в силе.
        7. fee_payment_status — статус распределения пошлин.
        8. fee_payment_details — кто платит пошлины.
        9. licensor_defense_status — статус обязанности лицензиара защищать право.
        10. licensor_defense_details — обязанность лицензиара защищать право.
        11. licensee_defense_status — статус права лицензиата защищать право.
        12. licensee_defense_details — право лицензиата защищать право.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (ownership_warranty_status, validity_warranty_status,
           maintenance_obligation_status, fee_payment_status, licensor_defense_status,
           licensee_defense_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (ownership_warranty_details, validity_warranty_details,
           maintenance_obligation_details, fee_payment_details, licensor_defense_details,
           licensee_defense_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. fee_payment_details: укажи роль, уплачивающую пошлины
           ("лицензиар", "лицензиат", "стороны совместно") или "не распределено".
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 13 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Лицензиар гарантирует, что является единственным правообладателем
        исключительного права на Объект, право действительно на дату заключения
        договора и не обременено правами третьих лиц. Лицензиар обязуется
        поддерживать патент в силе и уплачивать патентные пошлины. Лицензиар
        обязуется за свой счёт пресекать нарушения третьих лиц."

        Ответ:
        {
          "ownership_warranty_status": "defined",
          "ownership_warranty_details": "является единственным правообладателем исключительного права",
          "validity_warranty_status": "defined",
          "validity_warranty_details": "право действительно и не обременено правами третьих лиц",
          "maintenance_obligation_status": "defined",
          "maintenance_obligation_details": "поддерживать патент в силе",
          "fee_payment_status": "defined",
          "fee_payment_details": "лицензиар",
          "licensor_defense_status": "defined",
          "licensor_defense_details": "за свой счёт пресекать нарушения третьих лиц",
          "licensee_defense_status": "not_defined",
          "licensee_defense_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Лицензиар гарантирует, что является единственным правообладателем исключительного права на Объект, право действительно на дату заключения договора и не обременено правами третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать объект ИС в соответствии с условиями договора."

        Ответ:
        {
          "ownership_warranty_status": "not_defined",
          "ownership_warranty_details": "Данные не определены",
          "validity_warranty_status": "not_defined",
          "validity_warranty_details": "Данные не определены",
          "maintenance_obligation_status": "not_defined",
          "maintenance_obligation_details": "Данные не определены",
          "fee_payment_status": "not_defined",
          "fee_payment_details": "Данные не определены",
          "licensor_defense_status": "not_defined",
          "licensor_defense_details": "Данные не определены",
          "licensee_defense_status": "not_defined",
          "licensee_defense_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (гарантии есть, защита не распределена):
        Фрагмент:
        "Лицензиар гарантирует наличие исключительного права. Патентные пошлины
        уплачивает лицензиат. О защите от нарушителей стороны не договорились."

        Ответ:
        {
          "ownership_warranty_status": "defined",
          "ownership_warranty_details": "наличие исключительного права",
          "validity_warranty_status": "not_defined",
          "validity_warranty_details": "Данные не определены",
          "maintenance_obligation_status": "not_defined",
          "maintenance_obligation_details": "Данные не определены",
          "fee_payment_status": "defined",
          "fee_payment_details": "лицензиат",
          "licensor_defense_status": "not_defined",
          "licensor_defense_details": "Данные не определены",
          "licensee_defense_status": "not_defined",
          "licensee_defense_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Лицензиар гарантирует наличие исключительного права. Патентные пошлины уплачивает лицензиат."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о гарантии наличия права.
        2. Найди прямую цитату о гарантии действительности права.
        3. Найди прямую цитату об обязанности поддерживать право в силе.
        4. Найди прямую цитату о распределении пошлин.
        5. Найди прямую цитату об обязанности лицензиара защищать право.
        6. Найди прямую цитату о праве лицензиата защищать право.
        7. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 13 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "ownership_warranty_status": "<defined / not_defined>",
          "ownership_warranty_details": "<текст или 'Данные не определены'>",
          "validity_warranty_status": "<defined / not_defined>",
          "validity_warranty_details": "<текст или 'Данные не определены'>",
          "maintenance_obligation_status": "<defined / not_defined>",
          "maintenance_obligation_details": "<текст или 'Данные не определены'>",
          "fee_payment_status": "<defined / not_defined>",
          "fee_payment_details": "<текст или 'Данные не определены'>",
          "licensor_defense_status": "<defined / not_defined>",
          "licensor_defense_details": "<текст или 'Данные не определены'>",
          "licensee_defense_status": "<defined / not_defined>",
          "licensee_defense_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензиар гарантирует исключительное право действительно отсутствие обременений поддерживать патент в силе уплата патентных пошлин обязанность защищать право защита от нарушителей пресечение нарушений иск к нарушителям"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "расторжение"
        - "контроль качества"
        - "улучшения"
        - "indemnity"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "warranties_validity_defense_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Твоя задача — извлечь из лицензионного договора гарантии лицензиара: наличие и действительность права, поддержание в силе, распределение пошлин, защиту от нарушителей.
        Не анализируй вознаграждение, сублицензию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. warranties_validity_defense_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ownership_warranty_status, validity_warranty_status,
              maintenance_obligation_status, fee_payment_status,
              licensor_defense_status, licensee_defense_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ownership_warranty_status = "not_defined";
           - validity_warranty_status = "not_defined";
           - maintenance_obligation_status = "not_defined";
           - fee_payment_status = "not_defined";
           - licensor_defense_status = "not_defined";
           - licensee_defense_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. ownership_warranty_status:
           - "defined" — если лицензиар прямо гарантирует наличие исключительного права;
           - "not_defined" — если такой гарантии нет.

        2. ownership_warranty_details:
           Краткое описание гарантии наличия права.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. validity_warranty_status:
           - "defined" — если лицензиар прямо гарантирует действительность права
             и/или отсутствие обременений;
           - "not_defined" — если такой гарантии нет.

        4. validity_warranty_details:
           Краткое описание гарантии действительности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. maintenance_obligation_status:
           - "defined" — если прямо предусмотрена обязанность поддерживать право в силе;
           - "not_defined" — если не предусмотрена.

        6. maintenance_obligation_details:
           Краткое описание обязанности поддерживать право.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. fee_payment_status:
           - "defined" — если прямо указано, кто уплачивает патентные пошлины;
           - "not_defined" — если не указано.

        8. fee_payment_details:
           Роль, уплачивающая пошлины: "лицензиар", "лицензиат", "стороны совместно" или "не распределено".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. licensor_defense_status:
           - "defined" — если прямо предусмотрена обязанность лицензиара защищать право;
           - "not_defined" — если не предусмотрена.

        10. licensor_defense_details:
            Краткое описание обязанности лицензиара защищать право.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. licensee_defense_status:
            - "defined" — если прямо предусмотрено право лицензиата защищать право;
            - "not_defined" — если не предусмотрено.

        12. licensee_defense_details:
            Краткое описание права лицензиата защищать право.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни warranties_validity_defense_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выводи гарантии из норм ГК РФ.
        - fee_payment_details: укажи конкретную роль ("лицензиар", "лицензиат", "стороны совместно") или "не распределено".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: signal → "not_defined", fact → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий, ни пошлин, ни защиты от нарушителей.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_details = "Данные не определены".

        2. Прямое исключение гарантий.
           Договор прямо указывает, что лицензиар не даёт гарантий
           (например: «Лицензия предоставляется «как есть», без гарантий»).
           → presence = "present";
             ownership_warranty_status = "not_defined";
             ownership_warranty_details содержит дословную цитату об исключении.

        3. Противоречие между фрагментами.
           В одной части договора лицензиар гарантирует действительность,
           в другой — ограничивает гарантии.
           → presence = "unclear";
             соответствующие signal-поля = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Частичное покрытие.
           Гарантии наличия и действительности есть, но защита от нарушителей
           и распределение пошлин не урегулированы.
           → presence = "present";
             ownership_warranty_status = validity_warranty_status = "defined";
             fee_payment_status = licensor_defense_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для warranties_validity_defense_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "warranties_validity_defense_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантиям и защите. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ownership_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии наличия права. Внутреннее enum-поле."
          required: true

        - name: "ownership_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия права"
          description: >
            Гарантия лицензиара о наличии исключительного права. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "validity_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии действительности. Внутреннее enum-поле."
          required: true

        - name: "validity_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия действительности"
          description: >
            Гарантия действительности исключительного права. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "maintenance_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности поддерживать право. Внутреннее enum-поле."
          required: true

        - name: "maintenance_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Поддержание права"
          description: >
            Обязанность лицензиара поддерживать право в силе. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "fee_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения пошлин. Внутреннее enum-поле."
          required: true

        - name: "fee_payment_details"
          type: "string"
          presentation: "fact"
          label: "Пошлины"
          description: >
            Роль, уплачивающая пошлины за поддержание права (лицензиар / лицензиат / стороны совместно / не распределено). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "licensor_defense_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности лицензиара защищать право. Внутреннее enum-поле."
          required: true

        - name: "licensor_defense_details"
          type: "string"
          presentation: "fact"
          label: "Защита лицензиара"
          description: >
            Обязанность лицензиара защищать право от нарушителей. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "licensee_defense_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права лицензиата защищать право. Внутреннее enum-поле."
          required: true

        - name: "licensee_defense_details"
          type: "string"
          presentation: "fact"
          label: "Защита лицензиата"
          description: >
            Право лицензиата самостоятельно защищать право. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: quality_improvements_sublicense_check
    name: "Контроль качества ТЗ, улучшения и производные, сублицензия"
    description: >
      Фактографическая проверка контроля качества (для ТЗ), прав на улучшения
      и производные произведения, условий сублицензирования.
    triggers:
      any:
        - trademark_license
        - improvements_clause
        - sublicense_allowed
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "контроль качества"
        - "стандарты качества"
        - "требования к продукции"
        - "инспекция качества"
        - "руководство по бренду"
        - "улучшения"
        - "модификации"
        - "производные произведения"
        - "grant-back"
        - "обратная лицензия"
        - "сублицензия"
        - "право предоставлять сублицензию"
        - "сублицензионный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиат\\s+обязан\\s+соблюдать\\s+стандарты"
        - "(?i)лицензиар\\s+вправе\\s+контролировать\\s+качество"
        - "(?i)права\\s+на\\s+улучшения.*принадлежат"
        - "(?i)лицензиат\\s+(не\\s+)?вправе\\s+предоставлять\\s+сублицензию"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1238, 1489 ГК РФ).
        Проверяется только один вопрос: контроль качества ТЗ, улучшения
        и производные произведения, сублицензия.

        Нормативные ориентиры:
        - ст. 1238 ГК РФ — сублицензия.
        - ст. 1489 ГК РФ — контроль качества для товарных знаков.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 13 полей + evidence
        (всего 14 ключей):
        1. quality_control_status — статус контроля качества.
        2. quality_control_details — стандарты качества.
        3. inspection_status — статус права инспекции.
        4. inspection_details — право лицензиара на инспекцию.
        5. improvements_allowed_status — статус разрешения на улучшения.
        6. improvements_allowed_details — разрешение на создание улучшений.
        7. improvements_ownership_status — статус принадлежности прав на улучшения.
        8. improvements_ownership_details — кому принадлежат права на улучшения.
        9. grant_back_status — статус grant-back оговорки.
        10. grant_back_details — grant-back оговорка.
        11. sublicense_status — статус сублицензии.
        12. sublicense_regime — режим сублицензии.
        13. sublicense_details — условия сублицензирования.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (quality_control_status, inspection_status,
           improvements_allowed_status, improvements_ownership_status, grant_back_status,
           sublicense_status, sublicense_regime) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (quality_control_details, inspection_details,
           improvements_allowed_details, improvements_ownership_details, grant_back_details,
           sublicense_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. sublicense_regime:
           - "allowed" — если прямо разрешена без условий;
           - "prohibited" — если прямо запрещена;
           - "allowed_with_consent" — если требуется согласие лицензиара;
           - "not_defined" — если сублицензия не упомянута.
        8. Не выводи режим сублицензии из нормы ст. 1238 ГК РФ.
        9. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 14 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Лицензиат обязан соблюдать стандарты качества, утверждённые Лицензиаром.
        Лицензиар вправе проводить инспекции качества. Лицензиат вправе создавать
        производные произведения. Права на производные принадлежат Лицензиату.
        Сублицензирование допускается с письменного согласия Лицензиара."

        Ответ:
        {
          "quality_control_status": "defined",
          "quality_control_details": "соблюдать стандарты качества, утверждённые Лицензиаром",
          "inspection_status": "defined",
          "inspection_details": "вправе проводить инспекции качества",
          "improvements_allowed_status": "defined",
          "improvements_allowed_details": "вправе создавать производные произведения",
          "improvements_ownership_status": "defined",
          "improvements_ownership_details": "права на производные принадлежат Лицензиату",
          "grant_back_status": "not_defined",
          "grant_back_details": "Данные не определены",
          "sublicense_status": "defined",
          "sublicense_regime": "allowed_with_consent",
          "sublicense_details": "с письменного согласия Лицензиара",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Лицензиат обязан соблюдать стандарты качества, утверждённые Лицензиаром."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать объект ИС в соответствии с условиями договора."

        Ответ:
        {
          "quality_control_status": "not_defined",
          "quality_control_details": "Данные не определены",
          "inspection_status": "not_defined",
          "inspection_details": "Данные не определены",
          "improvements_allowed_status": "not_defined",
          "improvements_allowed_details": "Данные не определены",
          "improvements_ownership_status": "not_defined",
          "improvements_ownership_details": "Данные не определены",
          "grant_back_status": "not_defined",
          "grant_back_details": "Данные не определены",
          "sublicense_status": "not_defined",
          "sublicense_regime": "not_defined",
          "sublicense_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (улучшения разрешены, сублицензия запрещена):
        Фрагмент:
        "Лицензиат вправе создавать улучшения и модификации. Права на улучшения
        принадлежат Лицензиару. Сублицензирование запрещено."

        Ответ:
        {
          "quality_control_status": "not_defined",
          "quality_control_details": "Данные не определены",
          "inspection_status": "not_defined",
          "inspection_details": "Данные не определены",
          "improvements_allowed_status": "defined",
          "improvements_allowed_details": "вправе создавать улучшения и модификации",
          "improvements_ownership_status": "defined",
          "improvements_ownership_details": "права на улучшения принадлежат Лицензиару",
          "grant_back_status": "not_defined",
          "grant_back_details": "Данные не определены",
          "sublicense_status": "defined",
          "sublicense_regime": "prohibited",
          "sublicense_details": "сублицензирование запрещено",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Лицензиат вправе создавать улучшения и модификации. Права на улучшения принадлежат Лицензиару. Сублицензирование запрещено."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 14 ключей (13 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о контроле качества.
        2. Найди прямую цитату о праве инспекции.
        3. Найди прямую цитату о разрешении на улучшения.
        4. Найди прямую цитату о принадлежности прав на улучшения.
        5. Найди прямую цитату о grant-back оговорке.
        6. Найди прямую цитату о сублицензии.
        7. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 14 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "quality_control_status": "<defined / not_defined>",
          "quality_control_details": "<текст или 'Данные не определены'>",
          "inspection_status": "<defined / not_defined>",
          "inspection_details": "<текст или 'Данные не определены'>",
          "improvements_allowed_status": "<defined / not_defined>",
          "improvements_allowed_details": "<текст или 'Данные не определены'>",
          "improvements_ownership_status": "<defined / not_defined>",
          "improvements_ownership_details": "<текст или 'Данные не определены'>",
          "grant_back_status": "<defined / not_defined>",
          "grant_back_details": "<текст или 'Данные не определены'>",
          "sublicense_status": "<defined / not_defined>",
          "sublicense_regime": "<allowed / prohibited / allowed_with_consent / not_defined>",
          "sublicense_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "контроль качества стандарты качества требования к продукции инспекция качество руководство по бренду улучшения модификации производные произведения grant-back обратная лицензия сублицензия право предоставлять сублицензию сублицензионный договор передача прав третьим лицам"
      retrieval_profile: "sublicensing_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "расторжение"
        - "гарантии лицензиара"
        - "indemnity"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "quality_improvements_sublicense_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Твоя задача — извлечь из лицензионного договора сведения о контроле качества ТЗ, улучшениях и производных, сублицензии.
        Не анализируй вознаграждение, расторжение или гарантии.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. quality_improvements_sublicense_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (quality_control_status, inspection_status,
              improvements_allowed_status, improvements_ownership_status,
              grant_back_status, sublicense_status, sublicense_regime) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - quality_control_status = "not_defined";
           - inspection_status = "not_defined";
           - improvements_allowed_status = "not_defined";
           - improvements_ownership_status = "not_defined";
           - grant_back_status = "not_defined";
           - sublicense_status = "not_defined";
           - sublicense_regime = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. quality_control_status:
           - "defined" — если прямо предусмотрен контроль качества лицензиаром;
           - "not_defined" — если не предусмотрен.

        2. quality_control_details:
           Стандарты и требования к качеству.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. inspection_status:
           - "defined" — если прямо предусмотрено право лицензиара на инспекцию;
           - "not_defined" — если не предусмотрено.

        4. inspection_details:
           Условия и периодичность инспекций.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. improvements_allowed_status:
           - "defined" — если прямо указано, разрешены ли улучшения/модификации;
           - "not_defined" — если не указано.

        6. improvements_allowed_details:
           Разрешение на создание улучшений и производных.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. improvements_ownership_status:
           - "defined" — если прямо указано, кому принадлежат права на улучшения;
           - "not_defined" — если не указано.

        8. improvements_ownership_details:
           Кому принадлежат права на улучшения (лицензиар / лицензиат / совместно).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. grant_back_status:
           - "defined" — если прямо предусмотрена grant-back оговорка;
           - "not_defined" — если не предусмотрена.

        10. grant_back_details:
            Условия grant-back (обратная лицензия на улучшения).
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. sublicense_status:
            - "defined" — если сублицензия прямо упомянута;
            - "not_defined" — если не упомянута.

        12. sublicense_regime:
            - "allowed" — если прямо разрешена без условий;
            - "prohibited" — если прямо запрещена;
            - "allowed_with_consent" — если требуется согласие лицензиара;
            - "not_defined" — если сублицензия не упомянута.
            Не выводи режим из нормы ст. 1238 ГК РФ.

        13. sublicense_details:
            Условия сублицензирования.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_improvements_sublicense_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выводи режим сублицензии из нормы ст. 1238 ГК РФ.
        - sublicense_regime = "prohibited" при прямом запрете; "allowed_with_consent" при требовании согласия; "allowed" только при прямом разрешении без условий.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: signal → "not_defined", fact → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни контроля качества, ни улучшений, ни сублицензии.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_details = "Данные не определены".

        2. Сублицензия прямо запрещена, улучшения не урегулированы.
           Договор содержит прямой запрет сублицензирования, но молчит об улучшениях.
           → presence = "present";
             sublicense_status = "defined";
             sublicense_regime = "prohibited";
             improvements_allowed_status = improvements_ownership_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одной части договора улучшения разрешены, в другой — запрещены.
           → presence = "unclear";
             соответствующие signal-поля = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Улучшения разрешены, но принадлежность не определена.
           Лицензиат вправе создавать улучшения, но договор молчит о том, кому они принадлежат.
           → presence = "present";
             improvements_allowed_status = "defined";
             improvements_ownership_status = "not_defined";
             improvements_ownership_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_improvements_sublicense_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для sublicense_regime используй только: "allowed", "prohibited", "allowed_with_consent", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_improvements_sublicense_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по качеству/улучшениям/сублицензии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "quality_control_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус контроля качества. Внутреннее enum-поле."
          required: true

        - name: "quality_control_details"
          type: "string"
          presentation: "fact"
          label: "Контроль качества"
          description: >
            Стандарты качества. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "inspection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права инспекции. Внутреннее enum-поле."
          required: true

        - name: "inspection_details"
          type: "string"
          presentation: "fact"
          label: "Инспекция"
          description: >
            Право лицензиара на инспекцию. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "improvements_allowed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус разрешения на улучшения. Внутреннее enum-поле."
          required: true

        - name: "improvements_allowed_details"
          type: "string"
          presentation: "fact"
          label: "Улучшения"
          description: >
            Разрешение на создание улучшений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "improvements_ownership_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус принадлежности прав на улучшения. Внутреннее enum-поле."
          required: true

        - name: "improvements_ownership_details"
          type: "string"
          presentation: "fact"
          label: "Права на улучшения"
          description: >
            Кому принадлежат права на улучшения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "grant_back_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус grant-back оговорки. Внутреннее enum-поле."
          required: true

        - name: "grant_back_details"
          type: "string"
          presentation: "fact"
          label: "Grant-back"
          description: >
            Grant-back оговорка. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "sublicense_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус сублицензии. Внутреннее enum-поле."
          required: true

        - name: "sublicense_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["allowed", "prohibited", "allowed_with_consent", "not_defined"]
          display_in_grid: false
          description: "Режим сублицензии. Внутреннее enum-поле."
          required: true

        - name: "sublicense_details"
          type: "string"
          presentation: "fact"
          label: "Сублицензия"
          description: >
            Условия сублицензирования. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: exclusive_license_scope_check
    name: "Объём исключительной лицензии и запрет конкуренции лицензиара"
    description: >
      Фактографическая проверка объёма исключительной лицензии: вправе ли лицензиар
      сам использовать объект, запрещена ли выдача лицензий другим, non-compete.
    triggers:
      any:
        - exclusive_license
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительная лицензия"
        - "лицензиар не вправе использовать"
        - "запрет использования лицензиаром"
        - "лицензиар обязуется не использовать"
        - "лицензиар сохраняет право использовать"
        - "лицензиар вправе использовать"
        - "full exclusive"
        - "лицензиар не вправе предоставлять лицензии другим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиар\\s+(не\\s+вправе|обязуется\\s+не)\\s+использовать"
        - "(?i)лицензиар\\s+сохраняет\\s+право\\s+использовать"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор с исключительной лицензией
        (п. 1.1 ст. 1236 ГК РФ; п. 14 ПП ВС РФ № 10 от 23.04.2019).
        Проверяется только один вопрос: объём исключительной лицензии
        и запрет конкуренции лицензиара.

        Нормативные ориентиры:
        - п. 1.1 ст. 1236 ГК РФ — исключительная лицензия.
        - п. 14 ПП ВС РФ № 10 от 23.04.2019 — разъяснения по исключительной лицензии.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - По п. 1.1 ст. 1236 ГК РФ лицензиар МОЖЕТ использовать объект сам,
          если это явно не запрещено в договоре.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 10 полей + evidence
        (всего 11 ключей):
        1. licensor_own_use_prohibited_status — статус запрета собственного использования.
        2. licensor_own_use_prohibited_details — запрет лицензиару самому использовать объект ИС.
        3. other_licenses_prohibited_status — статус запрета выдачи лицензий другим лицам.
        4. other_licenses_prohibited_details — запрет лицензиару выдавать лицензии другим лицам.
        5. competing_activity_prohibited_status — статус запрета конкурирующей деятельности.
        6. competing_activity_prohibited_details — запрет лицензиару конкурирующей деятельности.
        7. non_compete_territory_status — статус территории ограничений.
        8. non_compete_territory_details — территория ограничений лицензиара.
        9. non_compete_period_status — статус срока ограничений.
        10. non_compete_period_details — срок ограничений лицензиара.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (licensor_own_use_prohibited_status, other_licenses_prohibited_status,
           competing_activity_prohibited_status, non_compete_territory_status,
           non_compete_period_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (licensor_own_use_prohibited_details, other_licenses_prohibited_details,
           competing_activity_prohibited_details, non_compete_territory_details,
           non_compete_period_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не выводи запрет из нормы п. 1.1 ст. 1236 ГК РФ — только прямые формулировки договора.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 11 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
