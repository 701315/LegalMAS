        - "(?i)права\\s+на\\s+улучшения.*принадлежат"
        - "(?i)лицензиат\\s+(не\\s+)?вправе\\s+предоставлять\\s+сублицензию"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1238, 1489 ГК РФ).
        Проверяется только один вопрос: контроль качества ТЗ, улучшения
        и производные произведения, сублицензия.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Контроль качества (для ТЗ): стандарты, инспекция, санкции.
        2. Разрешение на создание улучшений/производных.
        3. Принадлежность прав на улучшения.
        4. Наличие grant-back оговорки.
        5. Разрешена ли сублицензия.
        6. Требуется ли согласие лицензиара на сублицензию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лицензиат обязан соблюдать стандарты качества, утверждённые Лицензиаром.
        Лицензиар вправе проводить инспекции. Лицензиат вправе создавать производные
        произведения. Права на производные принадлежат Лицензиату.
        Сублицензирование допускается с письменного согласия Лицензиара."

        Ответ:
        {
          "quality_control_status": "defined",
          "quality_control_details": "соблюдать стандарты качества, утверждённые Лицензиаром",
          "inspection_status": "defined",
          "inspection_details": "вправе проводить инспекции",
          "improvements_allowed_status": "defined",
          "improvements_allowed_details": "вправе создавать производные произведения",
          "improvements_ownership_status": "defined",
          "improvements_ownership_details": "права на производные принадлежат Лицензиату",
          "grant_back_status": "not_defined",
          "grant_back_details": "Данные не определены",
          "sublicense_status": "defined",
          "sublicense_regime": "allowed_with_consent",
          "sublicense_details": "с письменного согласия Лицензиара",
          "evidence": [{"clause_ref": "п. 5.1", "quote": "Лицензиат обязан соблюдать стандарты качества, утверждённые Лицензиаром."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о контроле качества.
        2. Найди прямую цитату об улучшениях.
        3. Найди прямую цитату о сублицензии.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quality_control_status": "<defined / not_defined>",
          "quality_control_details": "<текст или 'Данные не определены'>",
          "inspection_status": "<defined / not_defined>",
          "inspection_details": "<текст или 'Данные не определены'>",
          "improvements_allowed_status": "<defined / not_defined>",
          "improvements_allowed_details": "<текст или 'Данные не определены'>",
          "improvements_ownership_status": "<defined / not_defined>",
          "improvements_ownership_details": "<текст или 'Данные не определены'>",
          "grant_back_status": "<defined / not_defined>",
          "grant_back_details": "<текст или 'Данные не определены'>",
          "sublicense_status": "<defined / not_defined>",
          "sublicense_regime": "<allowed / prohibited / allowed_with_consent / not_defined>",
          "sublicense_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "контроль качества стандарты качества требования к продукции инспекция качество руководство по бренду улучшения модификации производные произведения grant-back обратная лицензия сублицензия право предоставлять сублицензию сублицензионный договор передача прав третьим лицам"
      retrieval_profile: "sublicensing_check"
