        - auto_renewal_code: "automatic" — без действий сторон; "by_notice" — по уведомлению;
          "by_agreement" — по доп. соглашению; "no_renewal" — продление исключено;
          "not_defined" — не указано.
        - Не путай продление со сроком действия (term) лицензии.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие упоминания продления или возобновления. → presence = "missing"
        2. Частичное раскрытие (есть автопродление, но срок уведомления или изменение условий не указаны). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (в одном разделе — автопродление, в другом — продление только по соглашению). → presence = "unclear"
        4. Прямое исключение продления («договор не продлевается»). → presence = "present", auto_renewal_code = "no_renewal"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "license_renewal_conditions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий о продлении лицензии."
          required: true

        - name: "renewal_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус механизма продления. Внутреннее enum-поле."
          required: true

        - name: "renewal_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Продление"
          description: >
            Формулировка механизма продления лицензии. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "auto_renewal_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["automatic", "by_notice", "by_agreement", "no_renewal", "not_defined"]
          display_in_grid: false
          description: "Тип продления. Внутреннее enum-поле."
          required: true

        - name: "renewal_notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус срока уведомления о продлении/непродлении. Внутреннее enum-поле."
          required: true

        - name: "renewal_notice_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: >
            Срок и порядок уведомления о продлении/непродлении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "renewal_terms_change_details"
          type: "string"
          presentation: "fact"
          label: "Изменение условий при продлении"
          description: >
            Изменение условий (роялти, объём) при продлении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: survival_post_termination_rights_check
    name: "Сохранение прав Лицензиата после прекращения договора"
    description: >
      Фактографическая проверка условий о сохранении прав лицензиата после
      прекращения договора: право на использование уже созданных копий,
      производных произведений, встроенных компонентов. Не дублирует проверку
      обязанности уничтожения (ip_wind_down_destruction_check).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "сохраняет право"
        - "survival"
        - "survive"
        - "продолжает использовать"
        - "ранее созданные копии"
        - "существующие копии"
        - "уже созданные"
        - "встроенные компоненты"
        - "производные произведения"
        - "вечная лицензия"
        - "perpetual license"
        - "неотзывная лицензия"
        - "сохранить право использования"
        - "конечные пользователи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сохраня\\w+\\s+прав"
        - "(?i)survival|survive"
        - "(?i)продолжа\\w+\\s+использова"
        - "(?i)ранее\\s+создан\\w+\\s+копи"
        - "(?i)вечн\\w+\\s+лицензи"
        - "(?i)perpetual"
        - "(?i)неотзывн\\w+\\s+лицензи"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяется только один
        специфичный для ИС вопрос: сохранение прав лицензиата после
        прекращения договора.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - НЕ проверяй обязанность уничтожить копии — это делает другой чек.
        - Проверяй только ПРАВА, которые сохраняются после прекращения.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. existing_copies_survival_status — статус права на существующие копии.
        2. existing_copies_survival_details — право использовать копии, созданные до прекращения.
        3. derivative_works_survival_status — статус права на производные произведения.
        4. derivative_works_survival_details — право на производные произведения после прекращения.
        5. embedded_components_survival_status — статус права на встроенные компоненты.
        6. embedded_components_survival_details — право использовать компонент, встроенный в продукт лицензиата.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (existing_copies_survival_status, derivative_works_survival_status,
           embedded_components_survival_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (existing_copies_survival_details, derivative_works_survival_details,
           embedded_components_survival_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не путай с обязанностью уничтожить (это противоположный аспект).
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все права сохраняются:
        Фрагмент:
        "После прекращения настоящего Договора Лицензиат сохраняет право
        использовать копии ПО, предоставленные конечным пользователям до даты
        прекращения, в течение их жизненного цикла. Производные произведения,
        созданные Лицензиатом в период действия Договора, остаются в собственности
        Лицензиата. Компоненты, встроенные Лицензиатом в его собственные продукты,
        могут продолжать использоваться в составе этих продуктов."

        Ответ:
        {
          "existing_copies_survival_status": "defined",
          "existing_copies_survival_details": "сохраняет право использовать копии ПО, предоставленные конечным пользователям до даты прекращения, в течение их жизненного цикла",
          "derivative_works_survival_status": "defined",
          "derivative_works_survival_details": "производные произведения остаются в собственности Лицензиата",
          "embedded_components_survival_status": "defined",
          "embedded_components_survival_details": "встроенные компоненты могут продолжать использоваться в составе продуктов Лицензиата",
          "evidence": [
            {
              "clause_ref": "п. 13.4",
              "quote": "После прекращения настоящего Договора Лицензиат сохраняет право использовать копии ПО, предоставленные конечным пользователям до даты прекращения."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "При расторжении договора Лицензиат обязан прекратить использование ПО."

        Ответ:
        {
          "existing_copies_survival_status": "not_defined",
          "existing_copies_survival_details": "Данные не определены",
          "derivative_works_survival_status": "not_defined",
          "derivative_works_survival_details": "Данные не определены",
          "embedded_components_survival_status": "not_defined",
          "embedded_components_survival_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично (только копии для конечных пользователей):
        Фрагмент:
        "Прекращение Договора не затрагивает прав конечных пользователей,
        получивших лицензии от Лицензиата до даты прекращения."

        Ответ:
        {
          "existing_copies_survival_status": "defined",
          "existing_copies_survival_details": "прекращение Договора не затрагивает прав конечных пользователей, получивших лицензии до даты прекращения",
          "derivative_works_survival_status": "not_defined",
          "derivative_works_survival_details": "Данные не определены",
          "embedded_components_survival_status": "not_defined",
          "embedded_components_survival_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 12.5",
              "quote": "Прекращение Договора не затрагивает прав конечных пользователей, получивших лицензии от Лицензиата до даты прекращения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о праве на существующие копии после прекращения.
        2. Найди прямую цитату о праве на производные произведения.
        3. Найди прямую цитату о праве на встроенные компоненты.
        4. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "existing_copies_survival_status": "<defined / not_defined>",
          "existing_copies_survival_details": "<текст или 'Данные не определены'>",
          "derivative_works_survival_status": "<defined / not_defined>",
          "derivative_works_survival_details": "<текст или 'Данные не определены'>",
          "embedded_components_survival_status": "<defined / not_defined>",
          "embedded_components_survival_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "сохраняет право survival survive продолжает использовать ранее созданные копии существующие копии уже созданные встроенные компоненты производные произведения вечная лицензия perpetual license неотзывная лицензия сохранить право использования конечные пользователи"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - rights
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "indemnity"
        - "форс-мажор"
        - "основания расторжения"
        - "уничтожить копии"
        - "вернуть носители"
        - "сертификат уничтожения"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.70, 1.0]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "rights"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false   # [CONSIDER] 6 полей + evidence — можно true

      presence_signal:
        field: "survival_post_termination_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о сохранении прав Лицензиата после прекращения договора: право на
        существующие копии, производные произведения и встроенные компоненты.
        Не анализируй обязанность уничтожить копии, вознаграждение или
        общие основания расторжения.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. survival_post_termination_rights_check_presence: "present" / "missing" / "unclear".
        1. existing_copies_survival_status — "defined" или "not_defined".
        2. existing_copies_survival_details — право на существующие копии после прекращения.
        3. derivative_works_survival_status — "defined" или "not_defined".
        4. derivative_works_survival_details — право на производные произведения.
        5. embedded_components_survival_status — "defined" или "not_defined".
        6. embedded_components_survival_details — право на встроенные компоненты.
        </task>

        <context_rules>
        - Перед остальными полями заполни survival_post_termination_rights_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни survival_post_termination_rights_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент о сохранении прав, вечной лицензии, правах конечных пользователей или производных произведениях после прекращения;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Не путай с обязанностью уничтожить копии (это противоположный аспект).
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие упоминания сохранения прав после прекращения. → presence = "missing"
        2. Частичное раскрытие (только права конечных пользователей, без встроенных компонентов). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (в одном разделе — сохранение прав, в другом — полное прекращение использования). → presence = "unclear"
        4. Общая оговорка о прекращении всех прав без исключений («все права лицензиата прекращаются»). → presence = "present", все статусы = "defined", details = "права прекращаются полностью"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "survival_post_termination_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий о сохранении прав Лицензиата после прекращения."
          required: true

        - name: "existing_copies_survival_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на существующие копии после прекращения. Внутреннее enum-поле."
          required: true

        - name: "existing_copies_survival_details"
          type: "string"
          presentation: "fact"
          label: "Права на существующие копии"
          description: >
            Право использовать копии, созданные/распространённые до прекращения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "derivative_works_survival_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на производные произведения после прекращения. Внутреннее enum-поле."
          required: true

        - name: "derivative_works_survival_details"
          type: "string"
          presentation: "fact"
          label: "Производные произведения"
          description: >
            Право на производные произведения после прекращения договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "embedded_components_survival_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на встроенные компоненты. Внутреннее enum-поле."
          required: true

        - name: "embedded_components_survival_details"
          type: "string"
          presentation: "fact"
          label: "Встроенные компоненты"
          description: >
            Право использовать компоненты, встроенные в продукты лицензиата. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: reverse_engineering_restrictions_check
    name: "Ограничения на декомпиляцию и reverse engineering (ПО)"
    description: >
      Фактографическая проверка договорных ограничений на декомпиляцию,
      дизассемблирование, reverse engineering ПО и наличие исключений для
      достижения совместимости (ст. 1280 ГК РФ).
    triggers:
      any:
        - software_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "декомпиляция"
        - "декомпилировать"
        - "дизассемблирование"
        - "дизассемблировать"
        - "reverse engineering"
        - "обратная разработка"
        - "обратное проектирование"
        - "исследование кода"
        - "анализ кода"
        - "совместимость"
        - "interoperability"
        - "взаимодействие программ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)декомпилир"
        - "(?i)дизассемблир"
        - "(?i)reverse[\\s-]*engineering"
        - "(?i)обратн\\w+\\s+разработк"
        - "(?i)обратн\\w+\\s+проектирован"
        - "(?i)совместимост"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор на ПО. Проверяется только один
        специфичный для ПО вопрос: ограничения на декомпиляцию и reverse
        engineering, а также исключения для совместимости.

        Нормативные ориентиры:
        - ст. 1280 ГК РФ — право пользователя ПО на декомпиляцию для совместимости.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Ст. 1280 ГК разрешает декомпиляцию для достижения совместимости — проверяй,
          сохранено ли это право в договоре.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. decompilation_restriction_status — статус запрета/разрешения декомпиляции.
        2. decompilation_restriction_details — формулировка условия о декомпиляции.
        3. reverse_engineering_regime_code — режим (prohibited / allowed / allowed_with_conditions / not_defined).
        4. reverse_engineering_regime_details — формулировка режима reverse engineering.
        5. interoperability_exception_status — статус исключения для совместимости.
        6. interoperability_exception_details — формулировка исключения для совместимости.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (decompilation_restriction_status, reverse_engineering_regime_code,
           interoperability_exception_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (decompilation_restriction_details, reverse_engineering_regime_details,
           interoperability_exception_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. reverse_engineering_regime_code:
           - "prohibited" — прямой запрет reverse engineering;
           - "allowed" — прямо разрешено;
           - "allowed_with_conditions" — разрешено с условиями (например, только для совместимости);
           - "not_defined" — режим не указан.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запрет с исключением для совместимости:
        Фрагмент:
        "Лицензиату запрещается декомпилировать, дизассемблировать или иным образом
        осуществлять обратную разработку ПО, за исключением случаев, прямо
        предусмотренных ст. 1280 ГК РФ (достижение совместимости с иными программами
        при соблюдении установленных условий)."

        Ответ:
        {
          "decompilation_restriction_status": "defined",
          "decompilation_restriction_details": "запрещается декомпилировать, дизассемблировать",
          "reverse_engineering_regime_code": "allowed_with_conditions",
          "reverse_engineering_regime_details": "запрещено, кроме случаев по ст. 1280 ГК РФ",
          "interoperability_exception_status": "defined",
          "interoperability_exception_details": "достижение совместимости с иными программами при соблюдении установленных условий ст. 1280 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Лицензиату запрещается декомпилировать, дизассемблировать или иным образом осуществлять обратную разработку ПО."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "decompilation_restriction_status": "not_defined",
          "decompilation_restriction_details": "Данные не определены",
          "reverse_engineering_regime_code": "not_defined",
          "reverse_engineering_regime_details": "Данные не определены",
          "interoperability_exception_status": "not_defined",
          "interoperability_exception_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — абсолютный запрет без исключений:
        Фрагмент:
        "Любые действия по декомпиляции, дизассемблированию и исследованию
        исходного кода ПО категорически запрещены независимо от целей."

        Ответ:
        {
          "decompilation_restriction_status": "defined",
          "decompilation_restriction_details": "любые действия по декомпиляции, дизассемблированию и исследованию исходного кода категорически запрещены",
          "reverse_engineering_regime_code": "prohibited",
          "reverse_engineering_regime_details": "запрещены независимо от целей",
          "interoperability_exception_status": "not_defined",
          "interoperability_exception_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Любые действия по декомпиляции, дизассемблированию и исследованию исходного кода ПО категорически запрещены независимо от целей."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о декомпиляции/дизассемблировании.
        2. Определи режим reverse engineering (запрет / разрешение / с условиями).
        3. Найди прямую цитату об исключении для совместимости (ст. 1280 ГК).
        4. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "decompilation_restriction_status": "<defined / not_defined>",
          "decompilation_restriction_details": "<текст или 'Данные не определены'>",
          "reverse_engineering_regime_code": "<prohibited / allowed / allowed_with_conditions / not_defined>",
          "reverse_engineering_regime_details": "<текст или 'Данные не определены'>",
          "interoperability_exception_status": "<defined / not_defined>",
          "interoperability_exception_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "декомпиляция декомпилировать дизассемблирование дизассемблировать reverse engineering обратная разработка обратное проектирование исследование кода анализ кода совместимость interoperability взаимодействие программ"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - rights
        - obligations
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "rights"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false   # [CONSIDER] 6 полей + evidence — можно true

      presence_signal:
        field: "reverse_engineering_restrictions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора на ПО
        сведения об ограничениях декомпиляции, reverse engineering и исключениях
        для совместимости по ст. 1280 ГК РФ. Не анализируй вознаграждение,
        сублицензию, расторжение или общие гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. reverse_engineering_restrictions_check_presence: "present" / "missing" / "unclear".
        1. decompilation_restriction_status — "defined" или "not_defined".
        2. decompilation_restriction_details — формулировка условия о декомпиляции.
        3. reverse_engineering_regime_code — prohibited / allowed / allowed_with_conditions / not_defined.
        4. reverse_engineering_regime_details — формулировка режима.
        5. interoperability_exception_status — "defined" или "not_defined".
        6. interoperability_exception_details — исключение для совместимости.
        </task>

        <context_rules>
        - Перед остальными полями заполни reverse_engineering_restrictions_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни reverse_engineering_restrictions_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент о декомпиляции, дизассемблировании, reverse engineering или исключении для совместимости;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - reverse_engineering_regime_code: "prohibited" — прямой запрет;
          "allowed" — прямо разрешено; "allowed_with_conditions" — разрешено с условиями;
          "not_defined" — режим не указан.
        - Не выводи право на декомпиляцию из ст. 1280 ГК — только из текста договора.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие упоминания декомпиляции и reverse engineering. → presence = "missing"
        2. Частичное раскрытие (есть запрет декомпиляции, но без упоминания исключения по ст. 1280 ГК). → presence = "present", interoperability_exception = "not_defined"
        3. Противоречие между фрагментами (в одном разделе — прямой запрет, в другом — разрешение для совместимости). → presence = "unclear"
        4. Прямая ссылка на ст. 1280 ГК с сохранением исключения для совместимости. → presence = "present", regime_code = "allowed_with_conditions"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reverse_engineering_restrictions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий о декомпиляции или reverse engineering."
          required: true

        - name: "decompilation_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета/разрешения декомпиляции. Внутреннее enum-поле."
          required: true

        - name: "decompilation_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Декомпиляция"
          description: >
            Формулировка условия о декомпиляции и дизассемблировании. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "reverse_engineering_regime_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["prohibited", "allowed", "allowed_with_conditions", "not_defined"]
          display_in_grid: false
          description: "Режим reverse engineering. Внутреннее enum-поле."
          required: true

        - name: "reverse_engineering_regime_details"
          type: "string"
          presentation: "fact"
          label: "Режим reverse engineering"
          description: >
            Формулировка режима reverse engineering. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "interoperability_exception_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исключения для совместимости (ст. 1280 ГК). Внутреннее enum-поле."
          required: true

        - name: "interoperability_exception_details"
          type: "string"
          presentation: "fact"
          label: "Исключение для совместимости"
          description: >
            Формулировка исключения для достижения совместимости по ст. 1280 ГК. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  license_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные данные об объекте ИС
      (вид, регистрационные данные, описание), вид лицензии (исключительная/
      неисключительная), исчерпывающий перечень способов использования
      (существенное условие ст. 1235 п. 1 ГК РФ), территорию и срок.
    addressee: "Лицензиар / Юридический советник"

  consideration_royalty_check:
    text: >
      Просим предоставить по {doc_names}: вид и размер лицензионного
      вознаграждения, ставку роялти, паушальный платёж, минимальные
      гарантированные платежи, график платежей, порядок отчётности
      лицензиата и право лицензиара на аудит.
    addressee: "Финансовый отдел / Юридический советник"

  warranties_validity_defense_check:
    text: >
      Просим предоставить по {doc_names}: письменные гарантии лицензиара
      о наличии и действительности исключительного права (актуальная выписка
      из Роспатента), обязательство поддерживать право в силе, распределение
      пошлин, обязанность защищать право от нарушителей и право лицензиата
      самостоятельно предъявлять иски.
    addressee: "Лицензиар"

  quality_improvements_sublicense_check:
    text: >
      Просим согласовать по {doc_names}: контроль качества (для ТЗ),
      права на улучшения и производные произведения, grant-back,
      условия сублицензирования (по умолчанию запрещена — ст. 1238 ГК РФ).
    addressee: "Обе стороны / Юридический советник"

  exclusive_license_scope_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит исключительную лицензию. Просим чётко
      определить: (а) вправе ли лицензиар сам использовать объект ИС;
      (б) вправе ли лицензиар выдавать лицензии другим лицам;
      (в) территорию и срок ограничений. По п. 1.1 ст. 1236 ГК РФ лицензиар
      МОЖЕТ использовать объект сам, если не запрещено.
    addressee: "Юридический советник"

  termination_bankruptcy_check:
    text: >
      Просим согласовать для {doc_names}: основания расторжения, порядок
      (уведомление, cure period), последствия расторжения, условия
      о банкротстве/ликвидации лицензиара и судьбу лицензии при прекращении
      исключительного права.
    addressee: "Юридический советник"

  indemnification_liability_check:
    text: >
      Просим согласовать для {doc_names}: indemnity-оговорку при IP-претензиях
      третьих лиц, ограничение ответственности (cap), исключение косвенных
      убытков, исключения из ограничения.
    addressee: "Юридический советник"

  registration_cross_border_check:
    text: >
      Для {doc_names} просим согласовать: (а) государственную регистрацию
      в Роспатенте (для регистрируемых объектов — без регистрации договор
      НЕДЕЙСТВИТЕЛЕН); (б) валютный контроль и паспорт сделки (при трансграничных
      роялти); (в) налог у источника; (г) экспортный контроль (для ПО).
    addressee: "Обе стороны / Финансовый отдел / Юридический советник"

  software_data_check:
    text: >
      Для {doc_names} (ПО/база данных) просим согласовать: (а) депонирование
      исходного кода (escrow) и условия передачи; (б) роли сторон по ФЗ-152
      (оператор/обработчик); (в) локализацию данных на территории РФ;
      (г) трансграничную передачу данных.
    addressee: "IT-отдел / DPO / Юридический советник"

  change_of_control_dispute_check:
    text: >
      Просим согласовать для {doc_names}: условия о смене контроля (уведомление,
      согласие, право на расторжение), уступку прав лицензиата, порядок разрешения
      споров (претензионный порядок, арбитраж/суд), применимое право.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

