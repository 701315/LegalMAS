          "renewal_mechanism_details": "может быть продлён на новый срок по письменному соглашению Сторон",
          "auto_renewal_code": "by_agreement",
          "renewal_notice_period_status": "not_defined",
          "renewal_notice_period_details": "Данные не определены",
