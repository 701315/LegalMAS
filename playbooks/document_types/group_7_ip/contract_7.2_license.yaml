      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "escrow"
        - "депонирование"
        - "исходный код"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "escrow_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие escrow исходного кода"
      store_payload: true

  - id: liability_cap_and_limitation
    name: "Ограничение ответственности сторон"
    description: |
      Без явного ограничения ответственности сторона может нести неограниченную
      ответственность за убытки. Критично для обеих сторон, особенно при
      лицензировании ПО (downtime, потеря данных).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ограничение ответственности"
        - "limitation of liability"
        - "предельная сумма"
        - "не несёт ответственности за"
        - "упущенная выгода"
        - "косвенные убытки"
        - "непредвиденные убытки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ограничен(ие|а)\\s+ответственност"
        - "(?i)не\\s+несёт\\s+ответственност.*за\\s+(косвенн|упущенн)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие и условия ограничения ответственности сторон.

        Ответь строго в JSON:
        {
          "liability_cap_present": "<yes / no / not_found>",
          "cap_amount": "<сумма или формула или not_found>",
          "indirect_damages_excluded": "<yes / no / unclear / not_found>",
          "exceptions_to_cap": "<исключения или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "ограничение ответственности"
        - "упущенная выгода"
        - "косвенные убытки"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "liability_cap_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие ограничения ответственности"
        - name: "indirect_damages_excluded"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Исключены ли косвенные убытки"
