        - "лицензиар не вправе предоставлять лицензии другим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиар\\s+(не\\s+вправе|обязуется\\s+не)\\s+использовать"
        - "(?i)лицензиар\\s+сохраняет\\s+право\\s+использовать"

