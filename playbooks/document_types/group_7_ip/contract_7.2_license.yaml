        и порядок передачи.

        Нормативные ориентиры:
        - ст. 1465 ГК РФ — ноу-хау (секрет производства).
        - ст. 1466–1472 ГК РФ — права на ноу-хау и распоряжение.
        - ФЗ-98 «О коммерческой тайне».

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общая конфиденциальность НЕ проверяется (это global checks).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. knowhow_identification_status — статус идентификации как ноу-хау.
        2. knowhow_identification_details — формулировка идентификации.
        3. trade_secret_regime_status — статус ссылки на режим коммерческой тайны.
        4. trade_secret_regime_details — формулировка режима.
        5. transfer_protocol_status — статус порядка передачи.
        6. transfer_protocol_details — формулировка порядка передачи.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (knowhow_identification_status, trade_secret_regime_status,
           transfer_protocol_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (knowhow_identification_details, trade_secret_regime_details,
           transfer_protocol_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не проверяй общую конфиденциальность — это не входит в задачу.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Передаваемые сведения составляют ноу-хау (секрет производства) Лицензиара
        и охраняются режимом коммерческой тайны в соответствии с ФЗ-98. Передача
        осуществляется по актам с грифом «Секретно» с ограничением доступа."

        Ответ:
        {
          "knowhow_identification_status": "defined",
          "knowhow_identification_details": "передаваемые сведения составляют ноу-хау (секрет производства) Лицензиара",
