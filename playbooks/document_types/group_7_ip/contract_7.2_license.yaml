      - "(?i)процент\\s+от\\s+продаж"
      - "(?i)периодическ[иие]+\\s+платеж[ии]"
      - "(?i)\\bотчислени[яя]\\b"
      - "(?i)переменн[оа]е\\s+вознаграждени[ея]"

  trademark_license:
