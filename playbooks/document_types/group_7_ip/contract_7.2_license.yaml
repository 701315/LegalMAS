  - id: software_data_check
    name: "Escrow исходного кода ПО (специфика ПО)"
    description: >
      Фактографическая проверка депонирования исходного кода ПО (escrow):
      наличие escrow-агента, условия передачи исходного кода.
      Обработка персональных данных проверяется global checks.
    triggers:
      any:
        - software_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "депонирование"
        - "escrow"
        - "исходный код"
        - "source code"
        - "условия передачи исходного кода"
        - "нотариальное хранение"
        - "доступ к исходному коду"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(escrow|депониров).*исходн\\w+\\s+код"
        - "(?i)исходн\\w+\\s+код.*депон"
        - "(?i)нотариальн\\w+.*хранени.*код"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор на ПО. Проверяется только один
        специфичный для ПО вопрос: escrow (депонирование) исходного кода.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Обработка персональных данных НЕ проверяется (это global checks).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. escrow_status — статус escrow исходного кода.
        2. escrow_details — депонирование исходного кода.
        3. escrow_agent_status — статус escrow-агента.
        4. escrow_agent_details — escrow-агент (нотариус, специализированная организация).
        5. escrow_release_status — статус условий передачи исходного кода.
        6. escrow_release_details — условия передачи исходного кода лицензиату.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (escrow_status, escrow_agent_status, escrow_release_status)
           при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (escrow_details, escrow_agent_details, escrow_release_details)
           при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не проверяй персональные данные — это не входит в задачу.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Исходный код ПО депонируется у нотариуса. При банкротстве Лицензиара
        или прекращении технической поддержки Лицензиат получает доступ
        к исходному коду для самостоятельной поддержки."

        Ответ:
        {
          "escrow_status": "defined",
          "escrow_details": "исходный код ПО депонируется у нотариуса",
          "escrow_agent_status": "defined",
          "escrow_agent_details": "нотариус",
          "escrow_release_status": "defined",
          "escrow_release_details": "при банкротстве Лицензиара или прекращении технической поддержки Лицензиат получает доступ к исходному коду",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Исходный код ПО депонируется у нотариуса."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "escrow_status": "not_defined",
          "escrow_details": "Данные не определены",
          "escrow_agent_status": "not_defined",
          "escrow_agent_details": "Данные не определены",
          "escrow_release_status": "not_defined",
          "escrow_release_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (только escrow без агента):
        Фрагмент:
        "Исходный код ПО передаётся Лицензиату в случае прекращения поддержки."

        Ответ:
        {
          "escrow_status": "defined",
          "escrow_details": "исходный код ПО передаётся Лицензиату",
          "escrow_agent_status": "not_defined",
          "escrow_agent_details": "Данные не определены",
          "escrow_release_status": "defined",
          "escrow_release_details": "в случае прекращения поддержки",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Исходный код ПО передаётся Лицензиату в случае прекращения поддержки."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о депонировании исходного кода.
        2. Найди прямую цитату об escrow-агенте.
        3. Найди прямую цитату об условиях передачи исходного кода.
        4. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "escrow_status": "<defined / not_defined>",
          "escrow_details": "<текст или 'Данные не определены'>",
          "escrow_agent_status": "<defined / not_defined>",
          "escrow_agent_details": "<текст или 'Данные не определены'>",
          "escrow_release_status": "<defined / not_defined>",
          "escrow_release_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "депонирование escrow исходный код source code условия передачи исходного кода нотариальное хранение доступ к исходному коду"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "персональные данные"
        - "оператор персональных данных"
        - "локализация данных"
        - "трансграничная передача"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false   # [CONSIDER] 6 полей + evidence — можно true

      presence_signal:
        field: "software_data_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора на ПО
        сведения о депонировании (escrow) исходного кода. Не анализируй
        вознаграждение, сублицензию, расторжение или персональные данные.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. software_data_check_presence: "present" / "missing" / "unclear".
        1. escrow_status — "defined" или "not_defined".
        2. escrow_details — депонирование исходного кода.
        3. escrow_agent_status — "defined" или "not_defined".
        4. escrow_agent_details — escrow-агент (нотариус, специализированная организация).
        5. escrow_release_status — "defined" или "not_defined".
        6. escrow_release_details — условия передачи исходного кода лицензиату.
        </task>

        <context_rules>
        - Перед остальными полями заполни software_data_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни software_data_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент об escrow, депонировании или передаче исходного кода;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Не проверяй персональные данные.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы escrow / депонирования исходного кода. → presence = "missing"
        2. Частичное раскрытие (escrow упомянут, но агент или условия передачи не указаны). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (разные условия передачи в разных разделах). → presence = "unclear"
        4. Упоминание исходного кода в контексте поставки, но без escrow-механизма. → presence = "missing"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "software_data_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий об escrow / депонировании исходного кода."
          required: true

        - name: "escrow_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус escrow исходного кода. Внутреннее enum-поле."
          required: true

        - name: "escrow_details"
          type: "string"
          presentation: "fact"
          label: "Escrow"
          description: >
            Депонирование исходного кода. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "escrow_agent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус escrow-агента. Внутреннее enum-поле."
          required: true

        - name: "escrow_agent_details"
          type: "string"
          presentation: "fact"
          label: "Escrow-агент"
          description: >
            Escrow-агент (нотариус, специализированная организация). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "escrow_release_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условий передачи исходного кода. Внутреннее enum-поле."
          required: true

        - name: "escrow_release_details"
          type: "string"
          presentation: "fact"
          label: "Условия передачи кода"
          description: >
            Условия передачи исходного кода лицензиату. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: knowhow_trade_secret_link_check
    name: "Режим коммерческой тайны для передаваемого Ноу-хау"
    description: >
      Фактографическая проверка явной идентификации передаваемых сведений
