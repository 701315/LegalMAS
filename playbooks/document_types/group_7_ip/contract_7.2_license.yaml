        - "смена участников"
        - "реорганизация"
        - "слияние"
        - "поглощение"
        - "M&A"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смен(а|е|у)\\s+контрол"
        - "(?i)change\\s+of\\s+control"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие условий о последствиях смены контроля.

        Ответь строго в JSON:
        {
          "change_of_control_clause": "<yes / no / not_found>",
          "notification_required": "<yes / no / unclear>",
          "consent_required": "<yes / no / unclear>",
