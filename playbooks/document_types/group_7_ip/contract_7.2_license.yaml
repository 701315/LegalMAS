          display_in_grid: false
          description: "Статус гарантии отсутствия вирусных лицензий. Внутреннее enum-поле."
          required: true

        - name: "viral_license_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия отсутствия вирусных лицензий"
          description: >
            Гарантия отсутствия GPL, AGPL и иных вирусных лицензий. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: ip_modification_adaptation_check
    name: "Право на переработку, адаптацию и модификацию объекта ИС"
    description: >
      Фактографическая проверка явного предоставления Лицензиату права
      на модификацию, адаптацию, локализацию или создание производных
      произведений (ст. 1270 ГК РФ). Без явного предоставления такие
      действия считаются нарушением исключительного права.
    triggers:
      any:
        - software_license
        - copyright_license
        - content_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право на переработку"
        - "модификация"
        - "адаптация"
        - "локализация"
        - "производное произведение"
        - "доработка"
        - "кастомизация"
        - "внесение изменений"
        - "указание авторства"
        - "атрибуция"
        - "сохранение товарного знака"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право.*переработ"
        - "(?i)вправе.*модифициров"
        - "(?i)вправе.*адаптиров"
        - "(?i)производн\\w+\\s+произведени"
        - "(?i)локализаци[ия]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяется только один
        специфичный для ИС вопрос: право Лицензиата на переработку,
        модификацию, адаптацию или создание производных произведений.

        Нормативные ориентиры:
        - ст. 1270 ГК РФ — переработка как самостоятельный способ использования.
        - ст. 1266 ГК РФ — защита от искажения (для произведений).
        - ст. 1280 ГК РФ — специальные права пользователя программы для ЭВМ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - По умолчанию право на переработку НЕ предоставлено, если прямо не указано.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. modification_right_status — статус права на модификацию.
        2. modification_right_details — формулировка права на модификацию.
        3. modification_scope_code — объём права (any / limited / no / not_defined).
        4. modification_scope_details — конкретные ограничения или разрешения.
        5. attribution_status — статус требования атрибуции.
        6. attribution_details — формулировка требования к указанию авторства.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (modification_right_status, modification_scope_code,
           attribution_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (modification_right_details, modification_scope_details,
           attribution_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. modification_scope_code:
           - "any_modification" — если разрешены любые изменения без ограничений;
           - "limited_modification" — если разрешены только определённые изменения;
           - "no_modification" — если прямо запрещено изменять объект;
           - "not_defined" — если объём не указан.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право на модификацию предоставлено с ограничениями:
        Фрагмент:
        "Лицензиат вправе адаптировать, локализовать и модифицировать ПО
        для собственных внутренних нужд. При распространении модифицированных
        версий Лицензиат обязан сохранять указание на первоначального правообладателя."

        Ответ:
        {
          "modification_right_status": "defined",
          "modification_right_details": "вправе адаптировать, локализовать и модифицировать ПО для собственных внутренних нужд",
          "modification_scope_code": "limited_modification",
          "modification_scope_details": "только для собственных внутренних нужд",
          "attribution_status": "defined",
          "attribution_details": "обязан сохранять указание на первоначального правообладателя",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Лицензиат вправе адаптировать, локализовать и модифицировать ПО для собственных внутренних нужд."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "modification_right_status": "not_defined",
          "modification_right_details": "Данные не определены",
          "modification_scope_code": "not_defined",
          "modification_scope_details": "Данные не определены",
          "attribution_status": "not_defined",
          "attribution_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — модификация прямо запрещена:
        Фрагмент:
        "Лицензиату запрещается вносить любые изменения в Объект, декомпилировать,
        создавать производные произведения. Любое использование допускается только
        в неизменном виде."

        Ответ:
        {
          "modification_right_status": "defined",
          "modification_right_details": "запрещается вносить любые изменения в Объект",
          "modification_scope_code": "no_modification",
          "modification_scope_details": "любое использование допускается только в неизменном виде",
          "attribution_status": "not_defined",
          "attribution_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Лицензиату запрещается вносить любые изменения в Объект, декомпилировать, создавать производные произведения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о праве на модификацию/переработку.
        2. Найди прямую цитату об объёме разрешённых изменений.
        3. Найди прямую цитату о требовании атрибуции/указания авторства.
        4. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "modification_right_status": "<defined / not_defined>",
          "modification_right_details": "<текст или 'Данные не определены'>",
          "modification_scope_code": "<any_modification / limited_modification / no_modification / not_defined>",
          "modification_scope_details": "<текст или 'Данные не определены'>",
          "attribution_status": "<defined / not_defined>",
          "attribution_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "license_scope_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на переработку модификация адаптация локализация производное произведение доработка кастомизация внесение изменений указание авторства атрибуция сохранение товарного знака"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - rights
        - obligations
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "rights"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false   # [CONSIDER] 6 полей + evidence — можно true

      presence_signal:
        field: "ip_modification_adaptation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о праве Лицензиата на переработку, модификацию, адаптацию объекта ИС
        и требованиях к атрибуции. Не анализируй вознаграждение, сублицензию,
        расторжение или общие гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. ip_modification_adaptation_check_presence: "present" / "missing" / "unclear".
        1. modification_right_status — "defined" или "not_defined".
        2. modification_right_details — формулировка права на модификацию.
        3. modification_scope_code — any_modification / limited_modification / no_modification / not_defined.
        4. modification_scope_details — конкретные ограничения или разрешения.
        5. attribution_status — "defined" или "not_defined".
        6. attribution_details — формулировка требования к указанию авторства.
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_modification_adaptation_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни ip_modification_adaptation_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент о праве на модификацию/переработку, объёме изменений или атрибуции;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - modification_scope_code: "any_modification" — любые изменения;
          "limited_modification" — только определённые; "no_modification" — запрещено;
          "not_defined" — не указано.
        - Не выводи право на переработку из норм ГК РФ — только из текста договора.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие упоминания модификации, переработки и атрибуции. → presence = "missing"
        2. Частичное раскрытие (право на модификацию есть, но объём или атрибуция не указаны). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (в одном разделе — разрешение, в другом — запрет модификации). → presence = "unclear"
        4. Прямой запрет модификации без упоминания атрибуции. → presence = "present", scope = "no_modification", attribution = "not_defined"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_modification_adaptation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий о праве на модификацию/переработку или атрибуции."
          required: true

        - name: "modification_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права на модификацию. Внутреннее enum-поле."
          required: true

        - name: "modification_right_details"
          type: "string"
          presentation: "fact"
          label: "Право на модификацию"
          description: >
            Формулировка права на переработку/модификацию объекта ИС. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "modification_scope_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["any_modification", "limited_modification", "no_modification", "not_defined"]
          display_in_grid: false
          description: "Объём права на модификацию. Внутреннее enum-поле."
          required: true

        - name: "modification_scope_details"
          type: "string"
          presentation: "fact"
          label: "Объём модификации"
          description: >
            Конкретные ограничения или разрешения на модификацию. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "attribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования атрибуции. Внутреннее enum-поле."
          required: true

        - name: "attribution_details"
          type: "string"
          presentation: "fact"
          label: "Атрибуция"
          description: >
            Требования к указанию авторства при модификации. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: support_updates_maintenance_check
    name: "Техническая поддержка, обновления и сопровождение ПО"
    description: >
      Фактографическая проверка обязательств лицензиара по технической поддержке,
      предоставлению обновлений и исправлений ошибок, сроку поддержки и последствиям
      её прекращения. Применимо к лицензиям на ПО.
    triggers:
      any:
        - software_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "техническая поддержка"
        - "сопровождение"
        - "обновления"
        - "updates"
        - "patches"
        - "исправление ошибок"
        - "bug fixes"
        - "новые версии"
        - "релизы"
        - "SLA"
        - "service level"
        - "срок поддержки"
        - "end of life"
        - "EOL"
        - "прекращение поддержки"
        - "горячая линия"
        - "техподдержка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ\\w+\\s+поддержк"
        - "(?i)сопровожден\\w+"
        - "(?i)обновлени[яй]"
        - "(?i)исправлен\\w+\\s+ошибок"
        - "(?i)SLA|service\\s+level"
        - "(?i)срок.*поддержк"
        - "(?i)end[\\s-]*of[\\s-]*life|EOL"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор на ПО. Проверяется только один
        специфичный для ПО вопрос: обязательства по технической поддержке,
        обновлениям и сопровождению.

        Нормативные ориентиры:
        - ст. 1235 ГК РФ — лицензионный договор.
        - ст. 1280 ГК РФ — специальные права пользователя ПО (адаптация, исправление ошибок).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общие сервисные обязательства по иным услугам НЕ проверяются.

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 8 полей + evidence
        (всего 9 ключей):
        1. support_obligation_status — статус обязанности предоставлять поддержку.
        2. support_obligation_details — формулировка обязанности по поддержке.
        3. updates_provision_status — статус обязанности предоставлять обновления.
        4. updates_provision_details — объём и условия предоставления обновлений.
        5. support_term_status — статус срока поддержки.
        6. support_term_details — длительность и условия срока поддержки.
        7. support_termination_consequences_status — статус последствий прекращения поддержки.
        8. support_termination_consequences_details — последствия для лицензиата (escrow, права и т.д.).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (support_obligation_status, updates_provision_status,
           support_term_status, support_termination_consequences_status) при отсутствии
           данных возвращай строго "not_defined".
        4. Для fact-полей (support_obligation_details, updates_provision_details,
           support_term_details, support_termination_consequences_details) при отсутствии
           данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 9 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Лицензиар обязуется в течение срока действия лицензии предоставлять
        техническую поддержку (горячая линия, время отклика — 24 часа) и обновления
        ПО, включая исправления ошибок и новые версии. Срок поддержки — 3 года
        с момента предоставления лицензии. По истечении срока поддержки Лицензиар
        передаёт Лицензиату исходный код из escrow."

        Ответ:
        {
          "support_obligation_status": "defined",
          "support_obligation_details": "предоставлять техническую поддержку (горячая линия, время отклика — 24 часа)",
          "updates_provision_status": "defined",
          "updates_provision_details": "обновления ПО, включая исправления ошибок и новые версии",
          "support_term_status": "defined",
          "support_term_details": "3 года с момента предоставления лицензии",
          "support_termination_consequences_status": "defined",
          "support_termination_consequences_details": "Лицензиар передаёт Лицензиату исходный код из escrow",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Лицензиар обязуется в течение срока действия лицензии предоставлять техническую поддержку и обновления ПО."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат обязуется использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "support_obligation_status": "not_defined",
          "support_obligation_details": "Данные не определены",
          "updates_provision_status": "not_defined",
          "updates_provision_details": "Данные не определены",
          "support_term_status": "not_defined",
          "support_term_details": "Данные не определены",
          "support_termination_consequences_status": "not_defined",
          "support_termination_consequences_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (только поддержка без срока):
        Фрагмент:
        "Лицензиар оказывает Лицензиату техническую поддержку по электронной почте.
        Об обновлениях и сроке поддержки стороны не договорились."

        Ответ:
        {
          "support_obligation_status": "defined",
          "support_obligation_details": "техническая поддержка по электронной почте",
          "updates_provision_status": "not_defined",
          "updates_provision_details": "Данные не определены",
          "support_term_status": "not_defined",
          "support_term_details": "Данные не определены",
          "support_termination_consequences_status": "not_defined",
          "support_termination_consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Лицензиар оказывает Лицензиату техническую поддержку по электронной почте."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату об обязанности предоставлять поддержку.
        2. Найди прямую цитату об обязанности предоставлять обновления.
        3. Найди прямую цитату о сроке поддержки.
        4. Найди прямую цитату о последствиях прекращения поддержки.
        5. Если прямой цитаты нет — верни "not_defined" (для signal) или
           "Данные не определены" (для fact).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный
        для парсинга через json.loads без предварительной обработки. Без markdown,
        без ```json, без комментариев, без текста до или после. Начни ответ сразу
        с { и закончи }.

        {
          "support_obligation_status": "<defined / not_defined>",
          "support_obligation_details": "<текст или 'Данные не определены'>",
          "updates_provision_status": "<defined / not_defined>",
          "updates_provision_details": "<текст или 'Данные не определены'>",
          "support_term_status": "<defined / not_defined>",
          "support_term_details": "<текст или 'Данные не определены'>",
          "support_termination_consequences_status": "<defined / not_defined>",
          "support_termination_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "техническая поддержка сопровождение обновления updates patches исправление ошибок bug fixes новые версии релизы SLA service level срок поддержки end of life EOL прекращение поддержки горячая линия техподдержка"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "эксклюзивность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false   # [CONSIDER] 8 полей + evidence — можно true

      presence_signal:
        field: "support_updates_maintenance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора на ПО
        сведения о технической поддержке, обновлениях, сроке поддержки
        и последствиях её прекращения. Не анализируй вознаграждение, сублицензию,
        расторжение или общие гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. support_updates_maintenance_check_presence: "present" / "missing" / "unclear".
        1. support_obligation_status — "defined" или "not_defined".
        2. support_obligation_details — формулировка обязанности по поддержке.
        3. updates_provision_status — "defined" или "not_defined".
        4. updates_provision_details — объём и условия обновлений.
        5. support_term_status — "defined" или "not_defined".
        6. support_term_details — длительность и условия срока поддержки.
        7. support_termination_consequences_status — "defined" или "not_defined".
        8. support_termination_consequences_details — последствия прекращения поддержки.
        </task>

        <context_rules>
        - Перед остальными полями заполни support_updates_maintenance_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни support_updates_maintenance_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент о технической поддержке, обновлениях, сроке поддержки или её прекращении;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Не выводи обязанность поддержки из норм ГК РФ — только из текста договора.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие упоминания поддержки, обновлений и сопровождения. → presence = "missing"
        2. Частичное раскрытие (поддержка упомянута, но без срока или без описания обновлений). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (в одном разделе — пожизненная поддержка, в другом — 1 год). → presence = "unclear"
        4. Отсылка к отдельному соглашению об SLA без включения его условий. → presence = "present", details = "по отдельному SLA (условия не раскрыты в договоре)"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 10 ключами (9 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "support_updates_maintenance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре условий о поддержке, обновлениях или сопровождении."
          required: true

        - name: "support_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности предоставлять техническую поддержку. Внутреннее enum-поле."
          required: true

        - name: "support_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Техническая поддержка"
          description: >
            Формулировка обязанности лицензиара по технической поддержке. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "updates_provision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности предоставлять обновления. Внутреннее enum-поле."
          required: true

        - name: "updates_provision_details"
          type: "string"
          presentation: "fact"
          label: "Обновления"
          description: >
            Объём и условия предоставления обновлений, исправлений ошибок, новых версий. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "support_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус срока поддержки. Внутреннее enum-поле."
          required: true

        - name: "support_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок поддержки"
          description: >
            Длительность и условия срока поддержки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "support_termination_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус последствий прекращения поддержки. Внутреннее enum-поле."
          required: true

        - name: "support_termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Прекращение поддержки"
          description: >
            Последствия прекращения поддержки для лицензиата (escrow, права и т.д.). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: field_of_use_restrictions_check
    name: "Целевые и отраслевые ограничения использования (field of use)"
    description: >
      Фактографическая проверка ограничений использования объекта ИС по сфере,
      цели, отрасли, продукту или типу пользователей (field of use). Не дублирует
      проверку способов использования по ст. 1270 ГК (это делает license_subject_extraction).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "только для"
        - "исключительно для"
        - "в целях"
        - "для внутренних нужд"
        - "для собственных нужд"
        - "запрещается использовать"
        - "не вправе использовать"
        - "сфера использования"
        - "цель использования"
        - "field of use"
        - "для коммерческого использования"
        - "для некоммерческого использования"
        - "в составе продукта"
        - "для оказания услуг"
        - "ограниченное использование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)только\\s+для"
        - "(?i)исключительно\\s+для"
        - "(?i)для\\s+(внутренн|собственн)\\w+\\s+нужд"
        - "(?i)field\\s+of\\s+use"
        - "(?i)сфер\\w+\\s+использован"
        - "(?i)цел[ьи].*использован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяется только один
        специфичный для ИС вопрос: ограничения использования по сфере,
        цели, отрасли или типу пользователей (field of use).

        Нормативные ориентиры:
        - ст. 1235 ГК РФ — условия лицензионного договора.
        - ст. 1236 ГК РФ — виды лицензий.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - НЕ проверяй способы использования по ст. 1270 ГК (воспроизведение, распространение
          и т.п.) — это делает другой чек.
        - Field of use — это ограничения по СФЕРЕ/ЦЕЛИ (а не по способу).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 6 полей + evidence
        (всего 7 ключей):
        1. field_of_use_status — статус ограничений по сфере использования.
        2. field_of_use_details — формулировка ограничений по сфере.
        3. purpose_restriction_status — статус ограничений по цели.
        4. purpose_restriction_details — формулировка ограничений по цели (коммерческое/внутреннее).
        5. user_type_restriction_status — статус ограничений по типу пользователей.
        6. user_type_restriction_details — ограничения по типу пользователей (аффилиаты, подрядчики).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (field_of_use_status, purpose_restriction_status,
           user_type_restriction_status) при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (field_of_use_details, purpose_restriction_details,
           user_type_restriction_details) при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
        7. Не путай field of use со способами использования по ст. 1270 ГК.
        8. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 7 ключами).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия определены:
        Фрагмент:
        "Лицензия предоставляется исключительно для использования в сфере медицинской
        диагностики. Лицензиат вправе использовать ПО только для собственных внутренних
        нужд и не вправе предоставлять доступ к ПО третьим лицам, кроме своих аффилированных
        компаний и подрядчиков, оказывающих услуги Лицензиату."

        Ответ:
        {
          "field_of_use_status": "defined",
          "field_of_use_details": "исключительно для использования в сфере медицинской диагностики",
          "purpose_restriction_status": "defined",
          "purpose_restriction_details": "только для собственных внутренних нужд",
          "user_type_restriction_status": "defined",
          "user_type_restriction_details": "аффилированные компании и подрядчики, оказывающие услуги Лицензиату",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Лицензия предоставляется исключительно для использования в сфере медицинской диагностики."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Лицензиат вправе использовать ПО в соответствии с условиями договора."

        Ответ:
        {
          "field_of_use_status": "not_defined",
          "field_of_use_details": "Данные не определены",
          "purpose_restriction_status": "not_defined",
          "purpose_restriction_details": "Данные не определены",
          "user_type_restriction_status": "not_defined",
          "user_type_restriction_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 — частично определённые данные (только цель):
        Фрагмент:
        "ПО может использоваться Лицензиатом только для некоммерческого
        исследовательского использования."

        Ответ:
        {
          "field_of_use_status": "not_defined",
          "field_of_use_details": "Данные не определены",
          "purpose_restriction_status": "defined",
          "purpose_restriction_details": "только для некоммерческого исследовательского использования",
          "user_type_restriction_status": "not_defined",
          "user_type_restriction_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "ПО может использоваться Лицензиатом только для некоммерческого исследовательского использования."
            }
          ]
