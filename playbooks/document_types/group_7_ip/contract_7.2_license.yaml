        Не анализируй вознаграждение, расторжение или гарантии.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. quality_control_status — "defined" или "not_defined".
        2. quality_control_details — стандарты качества.
        3. inspection_status — "defined" или "not_defined".
        4. inspection_details — право инспекции.
        5. improvements_allowed_status — "defined" или "not_defined".
        6. improvements_allowed_details — разрешение на улучшения.
        7. improvements_ownership_status — "defined" или "not_defined".
        8. improvements_ownership_details — кому принадлежат права на улучшения.
        9. grant_back_status — "defined" или "not_defined".
