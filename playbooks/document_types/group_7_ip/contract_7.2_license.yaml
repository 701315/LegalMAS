          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре упоминания OSS, реестра компонентов или гарантий по вирусным лицензиям."
          required: true

        - name: "oss_presence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
