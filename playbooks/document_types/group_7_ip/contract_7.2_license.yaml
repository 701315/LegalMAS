          required: false
          display_in_grid: true
          display_priority: 3
        - name: "ip_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий о прекращении права."
          required: false
        - name: "ip_termination_details"
          type: "string"
          presentation: "fact"
          label: "Прекращение права"
          description: "Судьба лицензии при прекращении исключительного права."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Indemnity, ограничение ответственности
  # ──────────────────────────────────────────────────────────────────────────
  - id: indemnification_liability_check
    name: "Indemnity, ограничение ответственности и cap"
    description: >
      Фактографическая проверка indemnity-оговорки при IP-претензиях третьих лиц,
      ограничения ответственности (cap), исключения косвенных убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возмещение убытков"
        - "indemnification"
        - "indemnity"
        - "претензии третьих лиц"
        - "иски о нарушении прав"
        - "гарантия ненарушения"
        - "non-infringement warranty"
        - "лицензиар обязуется возместить"
        - "ограничение ответственности"
        - "limitation of liability"
        - "предельная сумма"
        - "не несёт ответственности за"
        - "упущенная выгода"
        - "косвенные убытки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиар\\s+обязуется\\s+возместить.*убытки"
        - "(?i)(indemnif|возмещени).*третьи.*лица"
        - "(?i)ограничен(ие|а)\\s+ответственност"
        - "(?i)не\\s+несёт\\s+ответственност.*за\\s+(косвенн|упущенн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор.
        Проверяется только один вопрос: indemnity-оговорка и ограничение ответственности.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие indemnity-оговорки.
        2. Кто возмещает убытки.
        3. Объём возмещения (IP-претензии / все претензии).
        4. Наличие ограничения ответственности (cap).
        5. Исключение косвенных убытков.
        6. Исключения из ограничения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лицензиар обязуется возместить Лицензиату убытки, причинённые претензиями
        третьих лиц о нарушении их исключительных прав. Общая ответственность
        ограничена суммой лицензионных платежей за 12 месяцев. Косвенные убытки
        и упущенная выгода не возмещаются."

        Ответ:
        {
          "indemnification_status": "defined",
          "indemnification_details": "возместить убытки, причинённые претензиями третьих лиц о нарушении их исключительных прав",
          "indemnifying_party": "licensor",
          "indemnification_scope": "IP claims only",
          "liability_cap_status": "defined",
          "liability_cap_details": "сумма лицензионных платежей за 12 месяцев",
          "indirect_damages_excluded_status": "defined",
          "indirect_damages_excluded_details": "косвенные убытки и упущенная выгода не возмещаются",
          "exceptions_to_cap_status": "not_defined",
          "exceptions_to_cap_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 8.1", "quote": "Лицензиар обязуется возместить Лицензиату убытки, причинённые претензиями третьих лиц."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об indemnity.
        2. Найди прямую цитату об ограничении ответственности.
        3. Найди прямую цитату об исключении косвенных убытков.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "indemnification_status": "<defined / not_defined>",
          "indemnification_details": "<текст или 'Данные не определены'>",
          "indemnifying_party": "<licensor / licensee / mutual / not_defined>",
          "indemnification_scope": "<IP claims only / all claims / not_defined>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "indirect_damages_excluded_status": "<defined / not_defined>",
          "indirect_damages_excluded_details": "<текст или 'Данные не определены'>",
          "exceptions_to_cap_status": "<defined / not_defined>",
          "exceptions_to_cap_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возмещение убытков indemnification indemnity претензии третьих лиц иски о нарушении прав гарантия ненарушения non-infringement warranty лицензиар обязуется возместить ограничение ответственности limitation of liability предельная сумма не несёт ответственности за упущенная выгода косвенные убытки непредвиденные убытки"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "расторжение"
