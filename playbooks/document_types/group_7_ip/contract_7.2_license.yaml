  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Escrow ПО, персональные данные
  # ──────────────────────────────────────────────────────────────────────────
  - id: software_data_check
    name: "Escrow исходного кода ПО и защита персональных данных"
    description: >
      Фактографическая проверка депонирования исходного кода ПО (escrow)
      и условий обработки персональных данных при лицензировании ПО/БД.
    triggers:
      any:
        - software_license
        - database_license
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "депонирование"
        - "escrow"
        - "исходный код"
        - "source code"
        - "условия передачи исходного кода"
        - "нотариальное хранение"
        - "персональные данные"
        - "оператор персональных данных"
        - "обработчик"
        - "ФЗ-152"
        - "GDPR"
        - "согласие на обработку"
        - "трансграничная передача"
        - "локализация данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(escrow|депониров).*исходн\\w+\\s+код"
        - "(?i)персональн\\w+\\s+данн"
        - "(?i)(ФЗ-152|GDPR|152-ФЗ)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор на ПО/базу данных.
        Проверяется только один вопрос: escrow исходного кода и защита
        персональных данных.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие escrow исходного кода.
        2. Escrow-агент.
        3. Условия передачи исходного кода.
        4. Наличие условий о персональных данных.
        5. Роли сторон (оператор/обработчик).
        6. Локализация данных на территории РФ.
        7. Трансграничная передача данных.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Исходный код ПО депонируется у нотариуса. При банкротстве Лицензиара
        или прекращении поддержки Лицензиат получает доступ к исходному коду.
        Лицензиат является оператором персональных данных и обеспечивает
        локализацию данных на территории РФ."

        Ответ:
        {
          "escrow_status": "defined",
          "escrow_details": "депонируется у нотариуса",
          "escrow_agent_status": "defined",
          "escrow_agent_details": "нотариус",
          "escrow_release_status": "defined",
          "escrow_release_details": "при банкротстве Лицензиара или прекращении поддержки",
          "pd_processing_status": "defined",
          "pd_processing_details": "Лицензиат является оператором персональных данных",
          "data_localization_status": "defined",
          "data_localization_details": "локализация данных на территории РФ",
          "cross_border_transfer_status": "not_defined",
          "cross_border_transfer_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 10.1", "quote": "Исходный код ПО депонируется у нотариуса."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об escrow.
        2. Найди прямую цитату об escrow-агенте.
        3. Найди прямую цитату о персональных данных.
        4. Найди прямую цитату о локализации.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "escrow_status": "<defined / not_defined>",
          "escrow_details": "<текст или 'Данные не определены'>",
          "escrow_agent_status": "<defined / not_defined>",
          "escrow_agent_details": "<текст или 'Данные не определены'>",
