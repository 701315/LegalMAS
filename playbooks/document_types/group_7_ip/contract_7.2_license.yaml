      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора на ноу-хау
        сведения об идентификации ноу-хау, режиме коммерческой тайны и порядке
        передачи. Не анализируй общую конфиденциальность, вознаграждение, сублицензию
        или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. knowhow_trade_secret_link_check_presence: "present" / "missing" / "unclear".
        1. knowhow_identification_status — "defined" или "not_defined".
        2. knowhow_identification_details — формулировка идентификации как ноу-хау.
        3. trade_secret_regime_status — "defined" или "not_defined".
        4. trade_secret_regime_details — формулировка режима коммерческой тайны.
        5. transfer_protocol_status — "defined" или "not_defined".
        6. transfer_protocol_details — формулировка порядка передачи.
        </task>

        <context_rules>
        - Перед остальными полями заполни knowhow_trade_secret_link_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни knowhow_trade_secret_link_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент об идентификации ноу-хау, режиме коммерческой тайны или порядке передачи;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Не проверяй общую конфиденциальность (это global check).
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие тем ноу-хау, коммерческой тайны и порядка передачи. → presence = "missing"
        2. Частичное раскрытие (ноу-хау идентифицировано, но режим КТ или порядок передачи не описан). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (разные режимы секретности в разных разделах). → presence = "unclear"
        4. Общая оговорка о конфиденциальности без явной идентификации сведений как ноу-хау. → presence = "missing" (общая конфиденциальность — global check)
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 8 ключами (7 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

