  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Регистрация, валютный контроль, экспортный контроль
  # ──────────────────────────────────────────────────────────────────────────
  - id: registration_cross_border_check
    name: "Регистрация, валютный контроль и экспортный контроль"
    description: >
      Фактографическая проверки условий о государственной регистрации лицензионного
      договора (для регистрируемых объектов), валютного контроля при трансграничных
      роялти и экспортного контроля ПО.
    triggers:
      any:
        - registered_ip
        - cross_border
        - software_license
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "Роспатент"
        - "подлежит регистрации"
        - "регистрация в течение"
        - "паспорт сделки"
        - "валютный контроль"
        - "налог у источника"
        - "withholding tax"
        - "СОИДН"
        - "экспортный контроль"
        - "технологии двойного назначения"
        - "шифрование"
        - "криптография"
        - "санкции"
        - "ФСТЭК"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)Роспатент"
        - "(?i)паспорт\\s+сделк"
        - "(?i)валютн\\w+\\s+контрол"
        - "(?i)налог\\s+у\\s+источник"
        - "(?i)экспортн\\w+\\s+контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор (ст. 1232, 1235 ГК РФ; ФЗ-173; ФЗ-183).
        Проверяется только один вопрос: регистрация, валютный контроль
        и экспортный контроль.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о государственной регистрации (для регистрируемых объектов).
        2. Кто отвечает за подачу заявления на регистрацию.
        3. Срок регистрации.
        4. Распределение расходов на регистрацию.
        5. Упоминание валютного контроля / паспорта сделки.
        6. Упоминание налога у источника.
        7. Упоминание экспортного контроля.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящий договор подлежит государственной регистрации в Роспатенте.
        Заявление подаёт Лицензиар в течение 30 дней. Расходы на регистрацию
        несёт Лицензиат. При выплате роялти нерезиденту Лицензиат удерживает
        налог у источника по ставке, предусмотренной СОИДН."

        Ответ:
        {
          "registration_clause_status": "defined",
          "registration_clause_details": "подлежит государственной регистрации в Роспатенте",
          "registration_applicant_status": "defined",
          "registration_applicant_details": "Лицензиар в течение 30 дней",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы несёт Лицензиат",
          "currency_control_status": "not_defined",
          "currency_control_details": "Данные не определены",
          "withholding_tax_status": "defined",
          "withholding_tax_details": "удерживает налог у источника по ставке, предусмотренной СОИДН",
          "export_control_status": "not_defined",
          "export_control_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 9.1", "quote": "Настоящий договор подлежит государственной регистрации в Роспатенте."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о регистрации.
        2. Найди прямую цитату о валютном контроле.
        3. Найди прямую цитату о налоге у источника.
        4. Найди прямую цитату об экспортном контроле.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "registration_clause_status": "<defined / not_defined>",
          "registration_clause_details": "<текст или 'Данные не определены'>",
          "registration_applicant_status": "<defined / not_defined>",
          "registration_applicant_details": "<текст или 'Данные не определены'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Данные не определены'>",
          "currency_control_status": "<defined / not_defined>",
          "currency_control_details": "<текст или 'Данные не определены'>",
          "withholding_tax_status": "<defined / not_defined>",
          "withholding_tax_details": "<текст или 'Данные не определены'>",
          "export_control_status": "<defined / not_defined>",
          "export_control_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация Роспатент подлежит регистрации регистрация в течение паспорт сделки валютный контроль налог у источника withholding tax СОИДН двойное налогообложение экспортный контроль технологии двойного назначения шифрование криптография санкции ФСТЭК"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
