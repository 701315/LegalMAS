    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "контроль качества"
        - "стандарты качества"
        - "требования к продукции"
        - "инспекция качества"
        - "руководство по бренду"
        - "улучшения"
        - "модификации"
        - "производные произведения"
        - "grant-back"
        - "обратная лицензия"
        - "сублицензия"
        - "право предоставлять сублицензию"
        - "сублицензионный договор"
