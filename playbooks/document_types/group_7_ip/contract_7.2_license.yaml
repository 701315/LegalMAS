        7. currency_control_status — статус валютного контроля.
        8. currency_control_details — условия валютного контроля (учёт, резервирование).
        9. withholding_tax_status — статус налога у источника.
        10. withholding_tax_details — условия налога у источника (СИДН/СОИДН).
        11. export_control_status — статус экспортного контроля.
