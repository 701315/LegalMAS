          "renewal_mechanism_status": "not_defined",
          "renewal_mechanism_details": "Данные не определены",
          "auto_renewal_code": "not_defined",
          "renewal_notice_period_status": "not_defined",
          "renewal_notice_period_details": "Данные не определены",
          "renewal_terms_change_details": "Данные не определены",
          "evidence": []
