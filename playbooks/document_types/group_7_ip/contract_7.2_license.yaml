    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор с исключительной лицензией
        (п. 1.1 ст. 1236 ГК РФ; п. 14 ПП ВС РФ № 10 от 23.04.2019).
        Проверяется только один вопрос: объём исключительной лицензии
        и запрет конкуренции лицензиара.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - По п. 1.1 ст. 1236 ГК РФ лицензиар МОЖЕТ использовать объект сам,
          если это явно не запрещено в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Запрещено ли лицензиару самому использовать объект ИС.
        2. Запрещена ли лицензиару выдача лицензий другим лицам.
        3. Запрещена ли лицензиару конкурирующая деятельность.
        4. Территория и срок ограничений (если есть).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лицензия является исключительной. Лицензиар не вправе использовать Объект
        на территории РФ в течение срока действия лицензии. Лицензиар не вправе
        предоставлять лицензии другим лицам."

        Ответ:
        {
          "licensor_own_use_prohibited_status": "defined",
          "licensor_own_use_prohibited_details": "не вправе использовать Объект на территории РФ в течение срока действия лицензии",
          "other_licenses_prohibited_status": "defined",
