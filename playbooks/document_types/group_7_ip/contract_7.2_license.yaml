          display_priority: 1

        - name: "oss_registry_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус реестра/приложения с OSS. Внутреннее enum-поле."
          required: true

        - name: "oss_registry_details"
          type: "string"
          presentation: "fact"
          label: "Реестр OSS"
          description: >
            Ссылка на реестр/приложение с OSS-компонентами. Fallback: "Не установлено" / "Не удалось определить".
          required: false
