        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительная лицензия лицензиар не вправе использовать запрет использования лицензиаром лицензиар обязуется не использовать лицензиар сохраняет право использовать full exclusive лицензиар не вправе предоставлять лицензии другим лицам non-compete запрет конкуренции территория запрет срок запрет"
      retrieval_profile: "non_compete_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
