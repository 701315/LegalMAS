  - id: exclusive_license_scope_check
    name: "Объём исключительной лицензии и запрет конкуренции лицензиара"
    description: >
      Фактографическая проверка объёма исключительной лицензии: вправе ли лицензиар
      сам использовать объект, запрещена ли выдача лицензий другим, non-compete.
