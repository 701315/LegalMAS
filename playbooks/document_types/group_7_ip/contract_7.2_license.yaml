        - Перед остальными полями заполни registration_cross_border_check_presence по правилу из пункта 0 task.
        - Перед остальными полями заполни registration_cross_border_check_presence:
          "present" — если в тексте есть хотя бы один фрагмент о регистрации, валютном контроле, налоге у источника или экспортном контроле;
          "missing" — если таких фрагментов нет вообще;
          "unclear" — если формулировки противоречат друг другу.
        - Если фрагментов по теме нет — presence = "missing", все signal = "not_defined", все fact = "Данные не определены".
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Не выводи необходимость регистрации из норм ГК — только из текста договора.
        - Используй только текст договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие тем регистрации, валютного контроля, налога у источника и экспортного контроля. → presence = "missing"
        2. Частичное раскрытие (например, только регистрация без валютного контроля). → presence = "present", отсутствующие части = "not_defined" / "Данные не определены"
        3. Противоречие между фрагментами (разные стороны указаны как ответственные за регистрацию). → presence = "unclear"
        4. Упоминание регистрации в контексте вступления в силу, но без деталей процедуры. → presence = "present", applicant/costs = "not_defined"
        </edge_cases>

        <output_expectations>
        - Верни ровно один JSON-объект с 14 ключами (13 полей + evidence).
        - Для signal-полей при отсутствии данных — "not_defined".
        - Для fact-полей при отсутствии данных — "Данные не определены".
        - В evidence — только точные цитаты из текста договора.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
