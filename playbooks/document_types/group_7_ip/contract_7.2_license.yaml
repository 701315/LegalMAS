        Проверяется только один вопрос: объём исключительной лицензии
        и запрет конкуренции лицензиара.

        Нормативные ориентиры:
        - п. 1.1 ст. 1236 ГК РФ — исключительная лицензия.
        - п. 14 ПП ВС РФ № 10 от 23.04.2019 — разъяснения по исключительной лицензии.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
