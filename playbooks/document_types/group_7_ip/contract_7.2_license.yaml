        - "арбитражный суд"
        - "третейский суд"
        - "медиация"
        - "претензионный порядок"
        - "досудебное урегулирование"
        - "подсудность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)спор(ы|ов).*рассматривают"
        - "(?i)претензионн\\w+\\s+порядок"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь порядок разрешения споров.

        Ответь строго в JSON:
        {
          "dispute_resolution_method": "<court / arbitration / mediation / mixed / not_found>",
          "court_or_arbitration_name": "<наименование суда или not_found>",
          "pretrial_procedure_required": "<yes / no / unclear>",
          "pretrial_period_days": "<срок в днях или not_found>",
          "governing_law": "<применимое право или not_found>"
        }
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "разрешение споров"
        - "арбитражный суд"
        - "претензионный порядок"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "dispute_resolution_method"
          type: "string"
          allowed_values: ["court", "arbitration", "mediation", "mixed", "not_found"]
