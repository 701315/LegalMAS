  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Смена контроля, уступка, споры
  # ──────────────────────────────────────────────────────────────────────────
  - id: change_of_control_dispute_check
    name: "Смена контроля, уступка прав, споры и применимое право"
    description: >
      Фактографическая проверка условий о смене контроля, уступке прав,
      порядке разрешения споров и применимом праве.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "смена контроля"
        - "change of control"
        - "продажа доли"
        - "реорганизация"
        - "слияние"
        - "поглощение"
        - "уступка прав"
        - "переуступка"
        - "перевод долга"
        - "правопреемник"
        - "согласие на уступку"
        - "разрешение споров"
        - "арбитражный суд"
        - "третейский суд"
        - "медиация"
        - "претензионный порядок"
        - "досудебное урегулирование"
        - "подсудность"
        - "применимое право"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смен(а|е|у)\\s+контрол"
        - "(?i)change\\s+of\\s+control"
        - "(?i)уступ(ка|ить).*без\\s+согласия"
        - "(?i)спор(ы|ов).*рассматривают"
        - "(?i)претензионн\\w+\\s+порядок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор.
        Проверяется только один вопрос: смена контроля, уступка прав,
        споры и применимое право.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о смене контроля.
        2. Необходимость уведомления при смене контроля.
        3. Необходимость согласия при смене контроля.
        4. Уступка прав лицензиата.
        5. Способ разрешения споров.
        6. Претензионный порядок.
        7. Применимое право.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "При смене контроля над Лицензиатом Лицензиар вправе расторгнуть договор.
        Уступка прав Лицензиата допускается только с письменного согласия Лицензиара.
        Споры рассматриваются в Арбитражном суде г. Москвы после соблюдения
        претензионного порядка (30 дней). Применимое право — право РФ."

        Ответ:
        {
          "change_of_control_status": "defined",
          "change_of_control_details": "при смене контроля над Лицензиатом Лицензиар вправе расторгнуть договор",
          "coc_notification_status": "not_defined",
          "coc_notification_details": "Данные не определены",
          "coc_consent_status": "not_defined",
          "coc_consent_details": "Данные не определены",
          "assignment_status": "defined",
          "assignment_details": "уступка прав Лицензиата допускается только с письменного согласия Лицензиара",
          "dispute_method": "court",
          "dispute_details": "Арбитражный суд г. Москвы",
          "pretrial_status": "defined",
          "pretrial_details": "претензионный порядок, 30 дней",
          "governing_law_status": "defined",
          "governing_law_details": "право РФ",
          "evidence": [{"clause_ref": "п. 11.1", "quote": "При смене контроля над Лицензиатом Лицензиар вправе расторгнуть договор."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о смене контроля.
        2. Найди прямую цитату об уступке прав.
        3. Найди прямую цитату о спорах.
        4. Найди прямую цитату о применимом праве.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "change_of_control_status": "<defined / not_defined>",
          "change_of_control_details": "<текст или 'Данные не определены'>",
          "coc_notification_status": "<defined / not_defined>",
          "coc_notification_details": "<текст или 'Данные не определены'>",
          "coc_consent_status": "<defined / not_defined>",
          "coc_consent_details": "<текст или 'Данные не определены'>",
          "assignment_status": "<defined / not_defined>",
          "assignment_details": "<текст или 'Данные не определены'>",
          "dispute_method": "<court / arbitration / mediation / mixed / not_defined>",
          "dispute_details": "<текст или 'Данные не определены'>",
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Данные не определены'>",
          "governing_law_status": "<defined / not_defined>",
          "governing_law_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "смена контроля change of control продажа доли смена участников реорганизация слияние поглощение M&A уступка прав переуступка перевод долга правопреемник согласие на уступку разрешение споров арбитражный суд третейский суд медиация претензионный порядок досудебное урегулирование подсудность применимое право"
      retrieval_profile: "change_of_control_check"
      preferred_unit_types:
        - general_provision
        - termination_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - remedies
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "роялти"
        - "сублицензия"
        - "контроль качества"
        - "улучшения"
        - "гарантии лицензиара"
        - "indemnity"
        - "расторжение"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из лицензионного договора сведения
        о смене контроля, уступке прав, спорах и применимом праве.
        Не анализируй вознаграждение, сублицензию или гарантии.
        </role>

        <context>
