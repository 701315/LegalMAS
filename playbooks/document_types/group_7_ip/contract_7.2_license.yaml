  - id: knowhow_trade_secret_link_check
    name: "Режим коммерческой тайны для передаваемого Ноу-хау"
    description: >
      Фактографическая проверка явной идентификации передаваемых сведений
      как ноу-хау (коммерческой тайны), ссылки на режим коммерческой тайны
      и порядка передачи (ст. 1465–1472 ГК РФ). Без этого лицензия на
      ноу-хау может быть признана незаключённой.
    triggers:
      any:
        - knowhow_license
    ui_mode: "field_extraction"
