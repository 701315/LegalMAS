  database_license:
    any_keywords:
      - "(?i)баз[аа]\\s+данн[ыо]х"
      - "(?i)\\bБД\\b"
      - "(?i)\\bdatabase\\b"
      - "(?i)персональн[ыо]е\\s+данн[ыо]е"
      - "(?i)оператор\\s+персональн[ыо]х\\s+данн[ыо]х"
      - "(?i)обработк[аа]\\s+данн[ыо]х"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|USD|EUR|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  registration_number: "(?i)\\b№?\\s*\\d{4,}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  territory_pattern: "(?i)(территори[ия]|РФ|Российск[ая]\\s+Федераци[ия]|весь\\s+мир|worldwide)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "registration_mandatory_for_registered_ip"
    name: "Обязательная регистрация лицензии на регистрируемые объекты (ст. 1232, 1235 ГК РФ)"
    description: |
      Лицензионный договор на патент, товарный знак, НМПТ или промышленный образец
      подлежит обязательной государственной регистрации в Роспатенте.
      Без регистрации договор считается НЕДЕЙСТВИТЕЛЬНЫМ (п. 2 ст. 1235 ГК РФ).
    legal_base: "п. 2 ст. 1235, ст. 1232 ГК РФ, Приказ Минэкономразвития № 707 от 30.09.2015"
    required_triggers: ["registered_ip"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "hybrid"
    rules:
      keywords:
        - "государственная регистрация"
        - "Роспатент"
        - "подлежит регистрации"
        - "регистрация в течение"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие условия об обязательной государственной регистрации
        (для патентов, товарных знаков, НМПТ, промышленных образцов).

        Ответь строго в JSON:
        {
          "registration_clause_present": "<yes / no / not_found>",
          "responsible_party": "<licensor / licensee / joint / not_specified>",
          "deadline": "<срок регистрации или not_found>",
          "cost_allocation": "<кто несёт расходы или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      boost_keywords:
        - "регистрация"
        - "Роспатент"
        - "государственная пошлина"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "currency_control_cross_border_royalty"
    name: "Валютный контроль при выплате роялти нерезидентам (ФЗ-173)"
    description: |
      При выплате роялти иностранному лицензиару российский лицензиат обязан:
      (а) оформить паспорт сделки (если сумма ≥ 3 млн руб.);
      (б) удержать налог у источника (обычно 20%, если нет СОИДН);
      (в) соблюсти требования валютного законодательства.
    legal_base: "ФЗ-173 «О валютном регулировании», НК РФ ст. 309, 310, 312"
    required_triggers: ["cross_border", "royalty_based"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "паспорт сделки"
        - "валютный контроль"
        - "налог у источника"
        - "withholding tax"
        - "СОИДН"
        - "двойное налогообложение"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "валютный контроль"
        - "паспорт сделки"
        - "налог у источника"
      rerank: true

  - id: "transfer_pricing_related_parties"
    name: "Трансфертное ценообразование при роялти между взаимозависимыми (НК РФ ст. 105.3)"
    description: |
      Роялти между взаимозависимыми лицами подлежат контролю ФНС на соответствие рыночным условиям.
      Завышенные/заниженные ставки роялти могут быть переквалифицированы налоговым органом.
    legal_base: "НК РФ ст. 105.3, 105.14, 105.15, 105.16"
    required_triggers: ["related_parties", "royalty_based"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "трансфертное ценообразование"
        - "контролируемая сделка"
        - "рыночный уровень"
        - "уведомление ФНС"
        - "сопоставимость условий"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "трансфертное ценообразование"
        - "взаимозависимые лица"
      rerank: true

  - id: "gratuitous_license_commercial_suspicious"
    name: "Безвозмездная лицензия между коммерческими лицами (риск притворности)"
    description: |
      Безвозмездная лицензия между коммерческими организациями подозрительна:
      (а) может быть признана притворной сделкой (ст. 170 ГК РФ);
      (б) риск доначисления НДС и налога на прибыль;
      (в) нарушение запрета дарения между коммерческими организациями (ст. 575 ГК РФ).
    legal_base: "ст. 170, 575, 1235 п. 5 ГК РФ, НК РФ ст. 146, 247, 250"
    required_triggers: ["commercial_parties"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "безвозмездно"
        - "без вознаграждения"
        - "безвозмездная лицензия"
        - "вознаграждение не предусмотрено"
      keyword_mode: "any"
      negative_keywords:
        - "роялти"
        - "паушальный платеж"
        - "вознаграждение"
        - "оплата"
    retrieval:
      context_k: 3
      boost_keywords:
        - "безвозмездно"
        - "вознаграждение"
      rerank: true

  - id: "exclusive_license_without_clear_scope"
    name: "Исключительная лицензия без чёткого определения ограничений лицензиара"
    description: |
      При исключительной лицензии лицензиар не вправе выдавать лицензии другим лицам,
      но МОЖЕТ сам использовать объект ИС, если иное не предусмотрено договором
      (п. 1.1 ст. 1236 ГК РФ). На практике это приводит к спорам: лицензиат считает,
      что получил «монополию», а лицензиар конкурирует с ним.
      П. 14 ПП ВС РФ № 10 от 23.04.2019 подтверждает необходимость чёткого определения.
    legal_base: "п. 1.1 ст. 1236 ГК РФ, п. 14 ПП ВС РФ № 10 от 23.04.2019"
    required_triggers: ["exclusive_license"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исключительная лицензия"
        - "лицензиар не вправе использовать"
        - "лицензиар сохраняет право использовать"
        - "лицензиар вправе использовать"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Лицензия указана как ИСКЛЮЧИТЕЛЬНАЯ.
        Проверь, чётко ли определены ограничения лицензиара.

        Ответь строго в JSON:
        {
          "licensor_own_use_prohibited": "<yes / no / unclear / not_found>",
          "licensor_other_licenses_prohibited": "<yes / no / unclear / not_found>",
          "scope_clearly_defined": "<yes / no>"
        }

        ВАЖНО: По п. 1.1 ст. 1236 ГК РФ лицензиар МОЖЕТ использовать объект сам,
        если это явно не запрещено. Если договор молчит — scope нечёткий.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      boost_keywords:
        - "исключительная лицензия"
        - "лицензиар не вправе"
        - "лицензиар вправе"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "software_license_export_control"
    name: "Экспортный контроль при трансграничном лицензировании ПО (ФЗ-183)"
    description: |
      Лицензирование ПО нерезидентам может подпадать под экспортный контроль
      (ФЗ-183 «Об экспортном контроле»), особенно для:
      — шифровальных средств (криптография);
      — технологий двойного назначения;
      — ПО для критической инфраструктуры.
      Санкционные ограничения (EU/US) могут запрещать лицензирование в определённые страны.
    legal_base: "ФЗ-183 «Об экспортном контроле», Указ Президента РФ № 580"
    required_triggers: ["software_license", "cross_border"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "экспортный контроль"
        - "технологии двойного назначения"
        - "шифрование"
        - "криптография"
        - "санкции"
        - "ограничения на экспорт"
        - "ФСТЭК"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "экспортный контроль"
        - "шифрование"
        - "санкции"
      rerank: true

  - id: "knowhow_loss_of_secrecy"
    name: "Утрата конфиденциальности ноу-хау прекращает исключительное право (ст. 1467 ГК РФ)"
    description: |
      Исключительное право на ноу-хау ПРЕКРАЩАЕТСЯ, если конфиденциальность
      утрачена (ст. 1467 ГК РФ). Это означает автоматическое прекращение лицензии.
      Критично: обязательство сторон по сохранению конфиденциальности,
      последствия утраты, ответственность за разглашение.
    legal_base: "ст. 1467, 1469 ГК РФ"
    required_triggers: ["knowhow_license"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "утрата конфиденциальности"
        - "разглашение ноу-хау"
        - "прекращение исключительного права"
        - "обязанность сохранять конфиденциальность"
        - "режим коммерческой тайны"
      keyword_mode: "any"
      negative_keywords:
        - "конфиденциальность обеспечена"
        - "режим коммерческой тайны установлен"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ноу-хау"
        - "конфиденциальность"
        - "утрата"
        - "прекращение права"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: ip_object_extraction
    name: "Предмет лицензии: идентификация объекта ИС"
    description: |
      Извлекает: вид объекта ИС (патент/ТЗ/произведение/ПО/ноу-хау),
      регистрационные данные (для регистрируемых), описание объекта.
    triggers:
      any: ["exclusive_license", "registered_ip"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "объект интеллектуальной собственности"
        - "предмет лицензии"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "регистрационный номер"
        - "свидетельство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)патент\\s+№?\\s*\\d+"
        - "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"
        - "(?i)свидетельств\\w+\\s+№?\\s*\\d+"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Найди сведения об объекте интеллектуальной собственности (предмете лицензии).

        Ответь строго в JSON:
        {
          "ip_object_type": "<patent / trademark / copyright / software / know_how / industrial_design / other / not_found>",
          "registration_number": "<номер патента/свидетельства или not_found>",
          "registration_date": "<дата регистрации или not_found>",
          "ip_object_description": "<описание объекта или not_found>",
          "validity_period": "<срок действия права или not_found>"
        }

        ВАЖНО: Возвращай только то, что явно указано в тексте.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет лицензии"
        - "объект ИС"
        - "патент"
        - "товарный знак"
        - "регистрационный номер"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ip_object_type"
          type: "string"
          allowed_values: ["patent", "trademark", "copyright", "software", "know_how", "industrial_design", "other", "not_found"]
          description: "Вид объекта ИС"
        - name: "registration_number"
          type: "string"
          regex_patterns:
            - "(?i)№?\\s*\\d{4,}"
          description: "Регистрационный номер"
        - name: "registration_date"
          type: "string"
          keyword_hints: ["дата регистрации", "зарегистрирован"]
          description: "Дата регистрации"
        - name: "validity_period"
          type: "string"
          keyword_hints: ["срок действия права", "действует до", "истекает"]
          description: "Срок действия исключительного права"
      store_payload: true

  - id: permitted_uses_check
    name: "Способы использования — СУЩЕСТВЕННОЕ УСЛОВИЕ (ст. 1235 п. 1 ГК РФ)"
    description: |
      Способы использования — существенное условие лицензионного договора.
      Права, не указанные явно, считаются НЕпредоставленными.
      Отсутствие чёткого перечня → риск незаключённости договора.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "способы использования"
        - "право на использование"
        - "действия, которые вправе совершать"
        - "воспроизведение"
        - "распространение"
        - "публичный показ"
        - "переработка"
        - "продажа"
        - "сдача в аренду"
        - "импорт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиат\\s+вправе.*?(воспроизводить|распространять|использовать)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Проверь наличие и полноту указания **способов использования** объекта ИС.
        Это СУЩЕСТВЕННОЕ УСЛОВИЕ по ст. 1235 п. 1 ГК РФ.

        Ответь строго в JSON:
        {
          "permitted_uses_present": "<yes / vague / no>",
          "permitted_uses_list": "<перечень способов или not_found>",
          "exclusivity_of_list": "<exhaustive / open_ended / unclear>"
        }

        - "yes" — чёткий исчерпывающий перечень
        - "vague" — есть упоминание, но размыто
        - "no" — отсутствует
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "способы использования"
        - "право на использование"
        - "действия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "permitted_uses_present"
          type: "string"
          allowed_values: ["yes", "vague", "no"]
          description: "Наличие чёткого перечня способов использования"
        - name: "permitted_uses_list"
          type: "string"
          description: "Перечень способов использования"
      store_payload: true

  - id: license_type_identification
    name: "Вид лицензии: исключительная/неисключительная (ст. 1236 ГК РФ)"
    description: |
      При отсутствии указания на вид лицензия считается простой (неисключительной).
      Для исключительной лицензии критично чёткое определение объёма ограничений лицензиара.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исключительная лицензия"
        - "неисключительная лицензия"
        - "простая лицензия"
        - "exclusive license"
        - "non-exclusive license"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Определи вид лицензии.

        Ответь строго в JSON:
        {
          "license_type": "<exclusive / non_exclusive / not_specified>",
          "licensor_use_restriction": "<prohibited / allowed / unclear / not_applicable>",
          "other_licenses_prohibition": "<yes / no / unclear / not_applicable>"
        }

        ВАЖНО:
        - Если вид не указан — "not_specified" (по умолчанию = простая по п. 3 ст. 1236 ГК РФ)
        - Для исключительной: проверь, запрещено ли лицензиару выдавать другие лицензии и самому использовать
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "исключительная"
        - "неисключительная"
        - "простая"
        - "лицензиар не вправе"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "license_type"
          type: "string"
          allowed_values: ["exclusive", "non_exclusive", "not_specified"]
          description: "Вид лицензии"
        - name: "licensor_use_restriction"
          type: "string"
          allowed_values: ["prohibited", "allowed", "unclear", "not_applicable"]
          description: "Ограничено ли право лицензиара на собственное использование"
      store_payload: true

  - id: territory_extraction
    name: "Территория использования (ст. 1235 п. 3 ГК РФ)"
    description: "При отсутствии — вся территория РФ по умолчанию"
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "территория"
        - "территория действия"
        - "территория использования"
        - "РФ"
        - "Российская Федерация"
        - "весь мир"
        - "worldwide"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)территори[ия].*?(РФ|Россий|весь\\s+мир)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Найди указание на территорию, на которой лицензиат вправе использовать объект ИС.

        Ответь строго в JSON:
        {
          "territory": "<территория или not_found>",
          "territory_type": "<worldwide / RF / specific_region / not_specified>"
        }

        ВАЖНО: Если территория не указана — "not_specified" (по умолчанию = вся РФ по п. 3 ст. 1235 ГК РФ)
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 200
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "территория"
        - "использование"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "territory"
          type: "string"
          description: "Территория использования"
        - name: "territory_type"
          type: "string"
          allowed_values: ["worldwide", "RF", "specific_region", "not_specified"]
          description: "Тип территории"
      store_payload: true

  - id: term_extraction
    name: "Срок действия лицензии (ст. 1235 п. 4 ГК РФ)"
    description: "При отсутствии — 5 лет (или меньше, если срок действия права короче)"
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "срок лицензии"
        - "действует до"
        - "на срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок.*?(\\d+\\s+(лет|год|месяц))"
        - "(?i)действует\\s+до\\s+\\d{2}\\.\\d{2}\\.\\d{4}"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор.
        Найди срок действия лицензии.

        Ответь строго в JSON:
        {
          "term": "<срок или not_found>",
          "term_type": "<fixed_date / duration / perpetual / not_specified>",
          "linked_to_ip_validity": "<yes / no / unclear>"
        }

        ВАЖНО: Если срок не указан — "not_specified" (по умолчанию = 5 лет по п. 4 ст. 1235 ГК РФ)
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 200
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "срок"
        - "действует"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "term"
          type: "string"
          description: "Срок действия лицензии"
        - name: "term_type"
          type: "string"
          allowed_values: ["fixed_date", "duration", "perpetual", "not_specified"]
          description: "Тип срока"
      store_payload: true

  - id: consideration_extraction
    name: "Лицензионное вознаграждение (ст. 1235 п. 5 ГК РФ)"
    description: |
      Размер вознаграждения или порядок его определения.
      Для возмездного договора — существенное условие.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вознаграждение"
        - "роялти"
