        Пример 3 — частично определённые данные (только гарантия ненарушения):
        Фрагмент:
        "Лицензиар заверяет, что на дату заключения договора Объект не нарушает
        права интеллектуальной собственности третьих лиц. Об indemnity стороны
        не договорились."

        Ответ:
        {
          "ip_indemnity_scope": "not_defined",
          "ip_indemnity_details": "Данные не определены",
          "non_infringement_warranty_status": "defined",
          "non_infringement_warranty_details": "Объект не нарушает права интеллектуальной собственности третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Лицензиар заверяет, что на дату заключения договора Объект не нарушает права интеллектуальной собственности третьих лиц."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
        и соответствуют [ФОРМАТ ОТВЕТА].
        1. Найди прямую цитату о возмещении при IP-претензиях третьих лиц.
        2. Найди прямую цитату о гарантии ненарушения исключительных прав.
