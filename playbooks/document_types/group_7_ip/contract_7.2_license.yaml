        - "основания расторжения"
        - "досрочное расторжение"
        - "односторонний отказ"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
