type: contract_7.2_license
name: "Лицензионный договор"

description: |
  Соглашение, по которому правообладатель (лицензиар) предоставляет право использования
  результата интеллектуальной деятельности или средства индивидуализации в установленных
  пределах. Исключительное право НЕ отчуждается. Лицензия бывает исключительной
  (лицензиар ограничен в выдаче других лицензий и собственном использовании)
  и неисключительной (простой). Для регистрируемых объектов (патенты, товарные знаки)
  договор подлежит обязательной государственной регистрации в Роспатенте.

version: 4.1
parent: class_7_intellectual_property

metadata:
  category: contract
  subcategory: intellectual_property
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "ГК РФ ч. 4: § 6 Гл. 69, § 5 Гл. 71, § 5 Гл. 72 (ст. 1235-1238, 1286, 1367, 1489, 1469)"
  doc_types_supported:
    - "лицензионный договор"
    - "лицензионное соглашение"
    - "договор о предоставлении права использования"
    - "патентная лицензия"
    - "лицензия на товарный знак"
    - "авторский лицензионный договор"
    - "лицензия на программное обеспечение"
    - "лицензия на ноу-хау"
    - "SaaS-лицензия"
    - "лицензия на базу данных"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  # Параметры scoring для L2
  scoring:
    accept_threshold: 0.81
    strong_signal_threshold: 0.9
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)лицензи"
      - "(?i)license"
      - "(?i)право.*использован"

    folder_patterns:
      - "(?i)IP"
      - "(?i)интеллектуальн"
      - "(?i)лицензи"

    keywords:

      high:
        # ── Прямые названия и конструкции лицензионного договора ──

        - pattern: "(?i)лицензионн[ыйое]\\s+договор"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название лицензионного договора"

        - pattern: "(?i)лицензионн[оеое]\\s+соглашен[иеия]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Лицензионное соглашение"

        - pattern: "(?i)лицензи[яи]\\b"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Общий маркер лицензии в IP-контексте"

        - pattern: "(?i)договор\\s+о\\s+предоставлен[иии]\\s+прав[ао]\\s+использован[ияия]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Ключевая формула предоставления права использования"

        - pattern: "(?i)патентн[аяое]\\s+лицензи[яи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Патентная лицензия"

        - pattern: "(?i)лицензи[яи]\\s+на\\s+товарн[ыйое]\\s+знак"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лицензия на товарный знак"

        - pattern: "(?i)авторск[ийое]\\s+лицензионн[ыйое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Авторский лицензионный договор"

        - pattern: "(?i)лицензи[яи]\\s+на\\s+программн[оеое]\\s+обеспечени[еия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лицензия на программное обеспечение"

        - pattern: "(?i)лицензи[яи]\\s+на\\s+ноу-?хау"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лицензия на ноу-хау"

        - pattern: "(?i)saas-?лицензи[яи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "SaaS-лицензия"

        - pattern: "(?i)лицензи[яи]\\s+на\\s+баз[уы]\\s+данн[ыхые]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Лицензия на базу данных"

        # ── Стороны и типы лицензий ──

        - pattern: "(?i)лицензиар[а-я]*"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лицензиар как сторона договора"

        - pattern: "(?i)лицензиат[а-я]*"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лицензиат как сторона договора"

        - pattern: "(?i)прав[оа]\\s+использован[ияия]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Предоставление права использования, не отчуждая право"

        - pattern: "(?i)предоставлен[иеия]\\s+прав[ао]\\s+использован[ияия]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Ключевая конструкция лицензионного договора"

        - pattern: "(?i)исключительн[аяое]\\s+лицензи[яи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Исключительная лицензия"

        - pattern: "(?i)неисключительн[аяое]\\s+лицензи[яи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Неисключительная (простая) лицензия"

        - pattern: "(?i)прост[аяое]\\s+лицензи[яи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Простая лицензия"

      medium:
        - pattern: "(?i)\\bсублицензи[яяи]\\b"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Сублицензия как производная от основной лицензии"

        - pattern: "(?i)\\bроялти\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Роялти как форма лицензионного вознаграждения"

        - pattern: "(?i)паушальн[ыо]й\\s+плат[её]ж"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Паушальный платеж в структуре лицензионного вознаграждения"

        - pattern: "(?i)территори[яя]\\s+действи[яя]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Территория действия лицензии"

        - pattern: "(?i)способ[ыа]\\s+использовани[яя]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Ограниченный перечень способов использования объекта"

        - pattern: "(?i)срок\\s+действи[яя]\\s+лицензи[ии]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Срок действия лицензии"

        - pattern: "(?i)\\bотч[её]тност[ьи]\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Отчетность лицензиата по использованию"

        - pattern: "(?i)контрол[ья]\\s+качеств[аа]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Контроль качества товаров/услуг лицензиата"

        - pattern: "(?i)\\bРоспатент\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Роспатент как орган регистрации лицензионного договора для регистрируемых объектов"

        - pattern: "(?i)государственн[а-яё]+\\s+регистраци[яя]\\s+лицензи[ии]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Госрегистрация лицензионного договора"

      low:
        - pattern: "(?i)лицензионн[оа]е\\s+вознаграждени[ея]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Лицензионное вознаграждение"

        - pattern: "(?i)минимальн[ыо]е\\s+гарантированн[ыо]е\\s+платеж[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Минимально гарантированный платеж (мингарантия)"

        - pattern: "(?i)прав[оо]\\s+на\\s+инспекци[юю]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Право инспектировать использование объекта"

        - pattern: "(?i)отзыв\\s+лицензи[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Отзыв или прекращение лицензии"

        - pattern: "(?i)производн[ыо]е\\s+произведени[яя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Производные произведения и их правовой режим"

        - pattern: "(?i)\\bулучшени[яя]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Улучшения объекта и их принадлежность"

        - pattern: "(?i)\\bgrant-back\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Grant-back оговорка в лицензионном договоре"

    exclusions:
      # ── Hard exclusions — отчуждение и комплексные режимы владения ИС ──

      - pattern: "(?i)договор\\s+об\\s+отчуждени[ии]\\s+исключительн[оа]го\\s+прав[аа]"
        severity: hard
        weight: -1.0
        description: "Отчуждение исключительного права влечет полный переход права, а не лицензию"

      - pattern: "(?i)полн[а-яё]+\\s+передач[аа]\\s+прав[аа]"
        severity: hard
        weight: -1.0
        description: "Полная передача права ближе к договору отчуждения, а не к лицензии"

      - pattern: "(?i)договор\\s+коммерческ[оа]й\\s+концесси[ии]"
        severity: hard
        weight: -1.0
        description: "Коммерческая концессия включает комплекс лицензионных и иных прав, является отдельным типом"

      # ── Soft exclusions — соседние конструкции и посредничество ──

      - pattern: "(?i)\\bфранчайзинг\\b"
        severity: soft
        weight: -0.35
        description: "Упоминание франчайзинга тянет к концессионной модели, а не к чистой лицензии"

      - pattern: "(?i)договор\\s+авторск[оа]го\\s+заказ[аа]"
        severity: soft
        weight: -0.3
        description: "Авторский заказ относится к созданию произведения, а не к предоставлению права использования уже созданного"

      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: soft
        weight: -0.3
        description: "Агентский договор — посредническая конструкция, не тождественная лицензированию"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  exclusive_license:
    any_keywords:
      - "(?i)исключительн[а-яё]+\\s+лицензи[яя]"
      - "(?i)эксклюзивн[а-яё]+\\s+лицензи[яя]"
      - "(?i)\\bexclusive\\s+license\\b"
      - "(?i)лицензиар\\s+не\\s+вправе\\s+предоставлять\\s+лицензи[ии]\\s+другим\\s+лицам"
      - "(?i)только\\s+лицензиат\\s+вправе\\s+использовать"

  registered_ip:
    any_keywords:
      - "(?i)\\bпатент\\b"
      - "(?i)товарн[ыо]й\\s+знак"
      - "(?i)полезн[а-яё]+\\s+модел[ьяи]"
      - "(?i)промышленн[ыо]й\\s+образец"
