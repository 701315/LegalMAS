      mode: "hybrid"
      fields:
        - name: "change_of_control_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие оговорки о смене контроля"
      store_payload: true

  - id: escrow_source_code
    name: "Депонирование исходного кода ПО (escrow)"
    description: |
      При лицензировании ПО лицензиат зависит от лицензиара в поддержке и развитии.
      Если лицензиар обанкротится или прекратит поддержку — лицензиат «заперт»
      без исходного кода. Escrow исходного кода — стандартная защита.
    triggers:
      any: ["software_license"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "депонирование"
        - "escrow"
        - "исходный код"
        - "source code"
        - "условия передачи исходного кода"
        - "нотариальное хранение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(escrow|депониров).*исходн\\w+\\s+код"
        - "(?i)исходн\\w+\\s+код.*передаётся.*при\\s+(банкротстве|прекращении)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор на ПО.
        Проверь наличие условий о депонировании (escrow) исходного кода.

        Ответь строго в JSON:
        {
          "escrow_present": "<yes / no / not_found>",
          "escrow_agent": "<агент или not_found>",
          "release_conditions": "<условия передачи или not_found>",
          "source_code_access_on_termination": "<yes / no / unclear / not_found>"
