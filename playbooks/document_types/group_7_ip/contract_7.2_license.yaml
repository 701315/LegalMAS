        - ст. 1232 ГК РФ — государственная регистрация перехода прав и договоров.
        - ФЗ-173 «О валютном регулировании и валютном контроле» (учет договоров).
        - ФЗ-183 «Об экспортном контроле» (шифрование, ПО).

