  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_improvements_sublicense_check
    name: "Контроль качества ТЗ, улучшения и производные, сублицензия"
    description: >
      Фактографическая проверка контроля качества (для ТЗ), прав на улучшения
      и производные произведения, условий сублицензирования.
