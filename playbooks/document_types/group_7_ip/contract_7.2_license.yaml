        - name: "competing_activity_prohibited_details"
          type: "string"
          presentation: "fact"
          label: "Запрет конкуренции"
          description: >
            Запрет лицензиару конкурирующей деятельности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "non_compete_territory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус территории ограничений. Внутреннее enum-поле."
          required: true

        - name: "non_compete_territory_details"
          type: "string"
          presentation: "fact"
          label: "Территория запрета"
          description: >
            Территория ограничений лицензиара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "non_compete_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус срока ограничений. Внутреннее enum-поле."
          required: true

        - name: "non_compete_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок запрета"
          description: >
            Срок ограничений лицензиара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: termination_bankruptcy_check
    name: "Банкротство лицензиара и прекращение исключительного права (специфика ИС)"
    description: >
      Фактографическая проверка условий о банкротстве/ликвидации лицензиара
      и судьбе лицензии при прекращении исключительного права.
      Общие основания и порядок расторжения проверяются global checks.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банкротство лицензиара"
        - "ликвидация лицензиара"
        - "несостоятельность"
        - "прекращение исключительного права"
        - "судьба лицензии"
        - "сохранение лицензии"
        - "переход исключительного права"
        - "правопреемник"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+случае\\s+(банкротства|ликвидации|несостоятельности).*лицензиар"
        - "(?i)при\\s+прекращении\\s+исключительного\\s+права"
        - "(?i)лицензия\\s+сохраняется.*при.*банкротстве"
        - "(?i)переход\\s+исключительного\\s+права.*лицензия"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяются только два специфичных
        для ИС вопроса: (1) судьба лицензии при банкротстве/ликвидации лицензиара,
        (2) судьба лицензии при прекращении исключительного права.

        Нормативные ориентиры:
        - п. 3 ст. 1238 ГК РФ — судьба сублицензии при прекращении лицензии.
        - ст. 1241 ГК РФ — переход исключительного права к другому лицу.
        - Федеральный закон «О несостоятельности (банкротстве)» — общие правила.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общие основания и порядок расторжения НЕ проверяются (это global checks).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 4 поля + evidence
        (всего 5 ключей):
        1. bankruptcy_status — статус условий о банкротстве/ликвидации лицензиара.
        2. bankruptcy_details — условия о судьбе лицензии при банкротстве/ликвидации лицензиара.
        3. ip_termination_status — статус условий о прекращении исключительного права.
        4. ip_termination_details — судьба лицензии при прекращении исключительного права.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
