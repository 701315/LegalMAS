           - "all claims" — если возмещение при любых претензиях (включая IP);
           - "not_defined" — если объём не указан.
        8. Не проверяй общие indemnity, cap и исключения — это не входит в задачу.
        9. Формат ответа — строго по [ФОРМАТ ОТВЕТА] (ровно один валидный JSON-объект
           со всеми 5 ключами).

