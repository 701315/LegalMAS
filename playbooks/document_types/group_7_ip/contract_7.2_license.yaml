    description: >
      Фактографическая проверка IP-специфичных аспектов ответственности:
      объём возмещения при IP-претензиях третьих лиц и гарантия ненарушения.
      Общие indemnity, cap и исключения косвенных убытков проверяются global checks.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "претензии третьих лиц"
        - "иски о нарушении прав"
        - "гарантия ненарушения"
        - "non-infringement warranty"
        - "лицензиар обязуется возместить"
        - "IP-претензии"
        - "патентные претензии"
        - "авторско-правовые претензии"
