        <rules>
        - Используй только текст договора.
        - Не выводи необходимость регистрации из норм ГК.
        - Верни только JSON.
        </rules>
      fields:
        - name: "registration_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о регистрации."
