    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "exclusive_license_scope_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Твоя задача — извлечь из лицензионного договора с исключительной лицензией сведения об объёме ограничений лицензиара: собственное использование, выдача лицензий другим, конкурирующая деятельность, территория и срок.
        Не анализируй вознаграждение, сублицензию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exclusive_license_scope_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (licensor_own_use_prohibited_status, other_licenses_prohibited_status,
              competing_activity_prohibited_status, non_compete_territory_status,
              non_compete_period_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - licensor_own_use_prohibited_status = "not_defined";
           - other_licenses_prohibited_status = "not_defined";
           - competing_activity_prohibited_status = "not_defined";
           - non_compete_territory_status = "not_defined";
           - non_compete_period_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. licensor_own_use_prohibited_status:
           - "defined" — если прямо указано, что лицензиар не вправе использовать объект ИС;
           - "not_defined" — если такого запрета нет или лицензиар сохраняет право использования.

        2. licensor_own_use_prohibited_details:
           Краткое описание запрета собственного использования лицензиаром.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. other_licenses_prohibited_status:
           - "defined" — если прямо указано, что лицензиар не вправе выдавать лицензии другим лицам;
           - "not_defined" — если такого запрета нет.

        4. other_licenses_prohibited_details:
           Краткое описание запрета выдачи лицензий третьим лицам.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. competing_activity_prohibited_status:
           - "defined" — если прямо запрещена конкурирующая деятельность лицензиара;
           - "not_defined" — если такого запрета нет.

        6. competing_activity_prohibited_details:
           Краткое описание запрета конкурирующей деятельности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. non_compete_territory_status:
           - "defined" — если прямо указана территория ограничений лицензиара;
           - "not_defined" — если территория не указана.

        8. non_compete_territory_details:
           Территория ограничений.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. non_compete_period_status:
           - "defined" — если прямо указан срок ограничений лицензиара;
           - "not_defined" — если срок не указан.

        10. non_compete_period_details:
            Срок ограничений.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни exclusive_license_scope_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выводи запрет из нормы п. 1.1 ст. 1236 ГК РФ — только прямые формулировки договора.
        - Если лицензиар прямо сохраняет право использования, это не запрет: licensor_own_use_prohibited_status = "not_defined".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: signal → "not_defined", fact → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета использования, ни запрета выдачи лицензий, ни non-compete.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_details = "Данные не определены".

        2. Исключительная лицензия без ограничений лицензиара.
           Лицензия названа исключительной, но лицензиар сохраняет право использования
           и не ограничен в выдаче лицензий.
           → presence = "present";
             licensor_own_use_prohibited_status = "not_defined";
             licensor_own_use_prohibited_details = "Данные не определены";
             остальные поля — по факту наличия.

        3. Противоречие между фрагментами.
           В одной части договора лицензиару запрещено использование,
           в другой — он сохраняет право использования.
           → presence = "unclear";
             соответствующие signal-поля = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Частичное покрытие.
           Запрет использования и выдачи лицензий есть, но территория и срок не определены.
           → presence = "present";
             licensor_own_use_prohibited_status = other_licenses_prohibited_status = "defined";
             non_compete_territory_status = non_compete_period_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exclusive_license_scope_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exclusive_license_scope_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по объёму исключительной лицензии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "licensor_own_use_prohibited_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета собственного использования лицензиаром. Внутреннее enum-поле."
          required: true

        - name: "licensor_own_use_prohibited_details"
          type: "string"
          presentation: "fact"
          label: "Запрет использования лицензиаром"
          description: >
            Запрет лицензиару самому использовать объект ИС. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "other_licenses_prohibited_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета выдачи лицензий другим лицам. Внутреннее enum-поле."
          required: true

        - name: "other_licenses_prohibited_details"
          type: "string"
          presentation: "fact"
          label: "Запрет других лицензий"
          description: >
            Запрет лицензиару выдавать лицензии другим лицам. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "competing_activity_prohibited_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета конкурирующей деятельности. Внутреннее enum-поле."
