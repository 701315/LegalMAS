          "non_compete_period_status": "defined",
          "non_compete_period_details": "в течение срока действия лицензии",
          "evidence": [{"clause_ref": "п. 2.1", "quote": "Лицензиар не вправе использовать Объект на территории РФ в течение срока действия лицензии."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о запрете использования лицензиаром.
        2. Найди прямую цитату о запрете выдачи лицензий другим.
        3. Найди прямую цитату о территории и сроке.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "licensor_own_use_prohibited_status": "<defined / not_defined>",
          "licensor_own_use_prohibited_details": "<текст или 'Данные не определены'>",
          "other_licenses_prohibited_status": "<defined / not_defined>",
          "other_licenses_prohibited_details": "<текст или 'Данные не определены'>",
          "competing_activity_prohibited_status": "<defined / not_defined>",
