  - id: data_protection_license
    name: "Защита персональных данных при лицензировании ПО/БД"
    description: |
      При лицензировании ПО или баз данных может возникнуть обработка персональных данных.
      Необходимо определить роли (оператор/обработчик), порядок обработки, трансграничную
      передачу, соответствие ФЗ-152 и (при кросс-бордер) GDPR.
    triggers:
      any: ["software_license", "database_license"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "персональные данные"
        - "оператор персональных данных"
        - "обработчик"
        - "ФЗ-152"
        - "GDPR"
        - "согласие на обработку"
        - "трансграничная передача"
        - "локализация данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн\\w+\\s+данн"
        - "(?i)(ФЗ-152|GDPR|152-ФЗ)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий лицензионный договор на ПО/базу данных.
        Проверь наличие условий о защите персональных данных.

        Ответь строго в JSON:
        {
          "pd_processing_present": "<yes / no / not_found>",
          "operator_role": "<licensor / licensee / both / not_specified>",
          "processor_role": "<licensor / licensee / not_specified>",
          "data_localization": "<yes / no / unclear / not_applicable>",
          "cross_border_transfer": "<yes / no / unclear / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "персональные данные"
        - "ФЗ-152"
        - "GDPR"
        - "обработка данных"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "pd_processing_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие условий о персональных данных"
        - name: "data_localization"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_applicable"]
          description: "Локализация данных на территории РФ"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны: лицензиар и лицензиат"
    description: "Проверка наличия и идентификации сторон"
    legal_base: "ст. 432, 1235 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "лицензиар"
        - "лицензиат"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(лицензиар|лицензиат).*именуем"

  - id: "subject_ip_object"
    name: "Предмет лицензии: объект ИС"
    description: "Проверка наличия чёткого указания на объект ИС"
    legal_base: "ст. 1235 п. 1 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "объект интеллектуальной собственности"
        - "предмет лицензии"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
      keyword_mode: "any"

  - id: "permitted_uses_mandatory"
    name: "Способы использования — СУЩЕСТВЕННОЕ УСЛОВИЕ"
    description: "Без чёткого перечня способов использования договор может быть незаключённым"
    legal_base: "ст. 1235 п. 1 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "способы использования"
        - "право на использование"
        - "воспроизведение"
        - "распространение"
        - "публичный показ"
        - "переработка"
        - "продажа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензиат\\s+вправе.*?(воспроизводить|распространять)"

  - id: "license_type_check"
    name: "Вид лицензии (исключительная/неисключительная)"
    description: "При отсутствии указания считается простой по п. 3 ст. 1236 ГК РФ"
    legal_base: "п. 3 ст. 1236 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "исключительная лицензия"
        - "неисключительная лицензия"
        - "простая лицензия"
      keyword_mode: "any"

  - id: "consideration_required"
    name: "Лицензионное вознаграждение (размер или порядок определения)"
    description: "Для возмездного договора — существенное условие"
    legal_base: "п. 5 ст. 1235 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "вознаграждение"
        - "роялти"
        - "паушальный платёж"
        - "лицензионный платёж"
        - "безвозмездно"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознаграждени\\w+.*?\\d"
        - "(?i)роялти.*?\\d+[.,]?\\d*\\s*%"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "consideration_type"
          type: "string"
          allowed_values: ["royalty", "lump_sum", "combined", "gratuitous", "unclear"]
          keyword_hints: ["роялти", "паушальный", "безвозмездно"]
          description: "Вид вознаграждения"
      store_payload: true

  - id: "registration_clause"
    name: "Условие о государственной регистрации (для регистрируемых объектов)"
    description: "Обязательная регистрация для патентов, ТЗ, НМПТ, промышленных образцов"
    legal_base: "ст. 1232, 1235 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["registered_ip"]
    rules:
      keywords:
        - "государственная регистрация"
        - "Роспатент"
        - "подлежит регистрации"
        - "регистрация в течение"
      keyword_mode: "any"

  - id: "quality_control_clause"
    name: "Контроль качества (для товарных знаков)"
    description: "Обязательное условие для лицензии на товарный знак"
    legal_base: "ст. 1489 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["trademark_license"]
    rules:
      keywords:
        - "контроль качества"
        - "стандарты качества"
        - "требования к продукции"
        - "соответствие стандартам"
      keyword_mode: "any"

  - id: "reporting_clause_royalty"
    name: "Отчётность лицензиата (при роялти)"
    description: "Необходима для контроля правильности расчёта роялти"
    legal_base: "ст. 1235, 1237 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["royalty_based"]
    rules:
      keywords:
        - "отчётность"
        - "отчёт о продажах"
        - "отчёт об использовании"
        - "периодические отчёты"
      keyword_mode: "any"

  - id: "minimum_guarantee_clause"
    name: "Минимальные гарантированные платежи"
    description: "Защита лицензиара при низкой активности лицензиата"
    legal_base: "ст. 1235 п. 5 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["royalty_based"]
    rules:
      keywords:
        - "минимальный платёж"
        - "минимальное роялти"
        - "гарантированный платёж"
        - "minimum guarantee"
      keyword_mode: "any"

  - id: "improvements_clause"
    name: "Права на улучшения и модификации"
    description: "Урегулирование прав на производные произведения и улучшения"
    legal_base: "ст. 1259, 1260, 1358 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["improvements_clause"]
    rules:
      keywords:
        - "улучшения"
        - "модификации"
        - "производные произведения"
        - "grant-back"
        - "обратная лицензия"
      keyword_mode: "any"

  - id: "termination_clause"
    name: "Основания и порядок расторжения"
    description: "Критично для защиты прав обеих сторон"
    legal_base: "ст. 450-453 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение"
        - "досрочное прекращение"
        - "отказ от договора"
        - "основания расторжения"
      keyword_mode: "any"

  - id: "force_majeure_license"
    name: "Форс-мажор (обстоятельства непреодолимой силы)"
    description: "Проверка наличия и полноты условий о форс-мажоре"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "непредвиденные обстоятельства"
        - "пандемия"
        - "санкции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)непреодолим\\w+\\s+сил"

  - id: "governing_law_license"
    name: "Применимое право и подсудность"
    description: "Особенно важно для кросс-бордер лицензий"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "подсудность"
        - "арбитражный суд"
        - "третейский суд"
        - "законодательство Российской Федерации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим\\w+\\s+прав"

  - id: "assignment_license"
    name: "Уступка прав / перемена лиц (ст. 1235 п. 7 ГК РФ)"
    description: |
      Переход исключительного права к новому правообладателю не является основанием
      для прекращения лицензии (п. 7 ст. 1235 ГК РФ). Но уступка прав лицензиата
      третьему лицу требует согласия лицензиара.
    legal_base: "ст. 1235 п. 7 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка прав"
        - "переуступка"
        - "перевод долга"
        - "переход прав"
        - "правопреемник"
        - "согласие на уступку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступ(ка|ить).*без\\s+согласия"

  - id: "confidentiality_clause_license"
    name: "Конфиденциальность"
    description: "Особенно критично для ноу-хау (ст. 1467 ГК РФ) и ПО (исходный код)"
    legal_base: "ст. 1467, 1469 ГК РФ, ФЗ-98"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "NDA"
        - "запрет раскрытия"
        - "режим конфиденциальности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "notices_clause"
    name: "Порядок уведомлений между сторонами"
    description: "Адреса, способы доставки, момент вступления уведомлений в силу"
    legal_base: "ГК РФ (общие положения)"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уведомления"
        - "порядок уведомлений"
        - "адрес для уведомлений"
        - "считается доставленным"
        - "заказное письмо"
        - "электронная почта"
      keyword_mode: "any"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  ip_object_extraction:
    text: >
      Просим предоставить полные данные об объекте интеллектуальной собственности по {doc_names}:
      (а) вид объекта (патент/товарный знак/произведение/ПО/ноу-хау);
      (б) регистрационные данные (номер, дата, орган регистрации) для регистрируемых объектов;
      (в) описание объекта; (г) срок действия исключительного права.
    addressee: "Лицензиар / Юридический отдел лицензиара"

  permitted_uses_check:
    text: >
      В {doc_names} не указан исчерпывающий перечень способов использования объекта ИС,
      что является СУЩЕСТВЕННЫМ УСЛОВИЕМ по ст. 1235 п. 1 ГК РФ.
      Просим незамедлительно уточнить и дополнить договор чётким перечнем действий,
      которые лицензиат вправе совершать. Права, не указанные в договоре, считаются НЕпредоставленными.
    addressee: "Юридический отдел лицензиара"

  license_type_identification:
    text: >
      Просим уточнить вид лицензии по {doc_names} (исключительная/неисключительная).
      При отсутствии явного указания лицензия считается простой по п. 3 ст. 1236 ГК РФ.
      Если лицензия исключительная — просим чётко определить:
      (а) вправе ли лицензиар сам использовать объект ИС;
      (б) вправе ли лицензиар выдавать лицензии другим лицам.
    addressee: "Юридический отдел"

  territory_extraction:
    text: >
      Просим уточнить территорию использования объекта ИС по {doc_names}.
      При отсутствии указания — по умолчанию вся территория РФ (п. 3 ст. 1235 ГК РФ).
    addressee: "Обе стороны"

  term_extraction:
    text: >
      Просим уточнить срок действия лицензии по {doc_names}.
      При отсутствии — по умолчанию 5 лет (п. 4 ст. 1235 ГК РФ).
    addressee: "Обе стороны"

  consideration_extraction:
    text: >
      Просим предоставить полные данные о лицензионном вознаграждении по {doc_names}:
      (а) вид вознаграждения; (б) размер и порядок расчёта; (в) валюта; (г) график платежей.
    addressee: "Финансовый отдел / Юридический отдел"

  royalty_reporting_and_audit:
    text: >
      Для {doc_names} с роялти просим согласовать:
      (а) обязательность и периодичность отчётности лицензиата;
      (б) право лицензиара проводить аудит бухгалтерии;
      (в) порядок доступа к документам; (г) санкции за недостоверную отчётность.
    addressee: "Обе стороны"

  minimum_royalty_guarantee:
    text: >
      Для {doc_names} с роялти рекомендуем включить минимальные гарантированные платежи.
    addressee: "Юридический отдел лицензиара"

  warranties_and_ip_validity:
    text: >
      Просим предоставить по {doc_names}:
      (а) письменные гарантии лицензиара о наличии исключительного права;
      (б) подтверждение действительности права (актуальная выписка из Роспатента);
      (в) обязательство поддерживать право в силе; (г) обязательство уведомлять о рисках.
    addressee: "Лицензиар"

  defense_against_infringement:
    text: >
      Просим включить в {doc_names} условия о защите права от нарушителей:
      (а) обязанность лицензиара пресекать нарушения;
      (б) право лицензиата самостоятельно защищать право;
      (в) порядок распределения расходов и компенсации.
    addressee: "Юридический отдел"

  quality_control_trademark:
    text: >
      Для {doc_names} (лицензия на товарный знак) просим согласовать контроль качества:
      (а) стандарты качества; (б) право инспекции; (в) одобрение образцов;
      (г) санкции за нарушение стандартов.
    addressee: "Обе стороны"

  improvements_and_derivatives:
    text: >
      Просим урегулировать в {doc_names} права на улучшения и производные произведения:
      (а) разрешение на создание; (б) принадлежность прав; (в) grant-back;
      (г) использование после прекращения лицензии.
    addressee: "Юридический отдел"

  sublicense_conditions:
    text: >
      Просим уточнить условия сублицензирования в {doc_names}.
      По умолчанию сублицензия ЗАПРЕЩЕНА (п. 1 ст. 1238 ГК РФ).
    addressee: "Обе стороны"

  termination_conditions:
    text: >
      Просим согласовать для {doc_names}: основания расторжения, cure period, последствия.
    addressee: "Юридический отдел"

  bankruptcy_licensor_risk:
    text: >
      Просим включить в {doc_names} условия о последствиях банкротства/ликвидации лицензиара.
      Без урегулирования — риск потери прав использования (ст. 1237 ГК РФ).
    addressee: "Юридический отдел"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}.
    addressee: "Обе стороны"

  subject_ip_object:
    text: >
      Просим чётко идентифицировать объект ИС в {doc_names}.
    addressee: "Лицензиар"

  permitted_uses_mandatory:
    text: >
      КРИТИЧЕСКОЕ ЗАМЕЧАНИЕ: В {doc_names} отсутствует перечень способов использования.
      Это СУЩЕСТВЕННОЕ УСЛОВИЕ. Просим дополнить.
    addressee: "Юридический отдел лицензиара"

  license_type_check:
    text: >
      Просим явно указать вид лицензии в {doc_names}.
    addressee: "Юридический отдел"

  consideration_required:
    text: >
      Просим указать размер лицензионного вознаграждения в {doc_names}.
    addressee: "Финансовый отдел"

  registration_clause:
    text: >
      Для {doc_names} (регистрируемый объект) просим согласовать порядок регистрации
      в Роспатенте. Без регистрации договор НЕДЕЙСТВИТЕЛЕН.
    addressee: "Обе стороны"

  quality_control_clause:
    text: >
      Для {doc_names} (товарный знак) просим согласовать стандарты качества и контроль.
    addressee: "Обе стороны"

  reporting_clause_royalty:
    text: >
      Для {doc_names} с роялти просим согласовать порядок отчётности.
    addressee: "Финансовый отдел"

  minimum_guarantee_clause:
    text: >
      Для {doc_names} с роялти рекомендуем рассмотреть минимальные гарантированные платежи.
    addressee: "Финансовый отдел лицензиара"

  improvements_clause:
    text: >
      Просим урегулировать права на улучшения в {doc_names}.
    addressee: "Юридический отдел"

  termination_clause:
    text: >
      Просим согласовать основания и порядок расторжения для {doc_names}.
    addressee: "Юридический отдел"

  registration_mandatory_for_registered_ip:
    text: >
      ВНИМАНИЕ: {doc_names} — лицензия на регистрируемый объект ИС.
      Подлежит ОБЯЗАТЕЛЬНОЙ регистрации в Роспатенте.
      Без регистрации договор НЕДЕЙСТВИТЕЛЕН (п. 2 ст. 1235 ГК РФ).
    addressee: "Обе стороны / Роспатент"

  currency_control_cross_border_royalty:
    text: >
      ВНИМАНИЕ: {doc_names} — трансграничная лицензия с роялти нерезиденту.
      Просим обеспечить соблюдение валютного контроля и налогового законодательства.
    addressee: "Финансовый отдел лицензиата / Налоговый консультант"

  transfer_pricing_related_parties:
    text: >
      ВНИМАНИЕ: {doc_names} — лицензия с роялти между взаимозависимыми лицами.
      Просим обеспечить соблюдение требований трансфертного ценообразования.
    addressee: "Финансовый отдел / Налоговый консультант"

  gratuitous_license_commercial_suspicious:
    text: >
      ВНИМАНИЕ: {doc_names} — безвозмездная лицензия между коммерческими организациями.
      Просим обосновать безвозмездность и получить налоговое заключение.
    addressee: "Юридический отдел / Налоговый консультант"

  exclusive_license_without_clear_scope:
    text: >
      ВНИМАНИЕ: {doc_names} содержит исключительную лицензию, но не определяет чётко,
      вправе ли лицензиар сам использовать объект ИС.
      По п. 1.1 ст. 1236 ГК РФ лицензиар МОЖЕТ использовать объект сам, если не запрещено.
      Просим явно определить: (а) запрещено ли лицензиару собственное использование;
      (б) запрещена ли выдача лицензий другим лицам; (в) территорию и срок ограничений.
    addressee: "Юридический отдел"

  software_license_export_control:
    text: >
      ВНИМАНИЕ: {doc_names} — трансграничная лицензия на ПО.
      Просим проверить: (а) подпадает ли ПО под экспортный контроль (ФЗ-183);
      (б) содержит ли ПО криптографию; (в) санкционные ограничения для конечного пользователя;
      (г) необходимость лицензии ФСТЭК/ФСБ.
    addressee: "Юридический отдел / Комплаенс"

  knowhow_loss_of_secrecy:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: {doc_names} — лицензия на ноу-хау.
      Просим включить: (а) обязательства обеих сторон по сохранению конфиденциальности;
      (б) последствия утраты конфиденциальности (ст. 1467 ГК РФ — прекращение права!);
      (в) ответственность за разглашение; (г) порядок уведомления об утрате конфиденциальности.
    addressee: "Юридический отдел"

  non_compete_licensor:
    text: >
      Просим уточнить для {doc_names} (исключительная лицензия):
      (а) вправе ли лицензиар самостоятельно использовать объект ИС;
      (б) вправе ли лицензиар конкурировать с лицензиатом;
      (в) если запрет — территория и срок; (г) санкции за нарушение.
    addressee: "Юридический отдел"

  indemnification_ip_claims:
    text: >
      Просим включить в {doc_names} indemnity-оговорку:
      (а) обязательство лицензиара возместить убытки при IP-претензиях третьих лиц;
      (б) порядок уведомления и совместной защиты;
      (в) ограничение суммы возмещения (cap); (г) исключения.
    addressee: "Юридический отдел"

  most_favored_licensee:
    text: >
      Для {doc_names} (неисключительная лицензия) рекомендуем рассмотреть MFN-оговорку:
      лицензиар обязуется не предоставлять другим лицензиатам более выгодные условия.
    addressee: "Юридический отдел лицензиата"

  change_of_control_clause:
    text: >
      Просим согласовать для {doc_names} условия о смене контроля:
      (а) обязательность уведомления; (б) необходимость согласия;
      (в) право на расторжение при смене контроля.
    addressee: "Юридический отдел"

  escrow_source_code:
    text: >
      Для {doc_names} (лицензия на ПО) просим согласовать депонирование исходного кода:
      (а) escrow-агент; (б) условия передачи исходного кода лицензиату
      (банкротство, прекращение поддержки, расторжение);
      (в) порядок обновления депонированного кода.
    addressee: "IT-отдел / Юридический отдел"

  liability_cap_and_limitation:
    text: >
      Просим согласовать для {doc_names} ограничение ответственности:
      (а) предельная сумма (cap); (б) исключение косвенных убытков;
      (в) исключения из ограничения (IP-нарушение, конфиденциальность, умысел).
    addressee: "Юридический отдел"

  dispute_resolution_license:
    text: >
      Просим согласовать для {doc_names} порядок разрешения споров:
      (а) претензионный порядок; (б) арбитраж vs суд;
      (в) место рассмотрения; (г) применимое право.
    addressee: "Юридический отдел"

  data_protection_license:
    text: >
      Для {doc_names} (ПО/база данных) просим согласовать условия обработки
      персональных данных: (а) роли сторон (оператор/обработчик);
      (б) порядок обработки; (в) локализация данных на территории РФ;
      (г) трансграничная передача; (д) соответствие ФЗ-152.
    addressee: "DPO / Юридический отдел"

  force_majeure_license:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре.
    addressee: "Юридический отдел"

  governing_law_license:
    text: >
      Просим согласовать применимое право и подсудность для {doc_names}.
    addressee: "Юридический отдел"

  assignment_license:
    text: >
      Просим уточнить для {doc_names} условия уступки прав и перемены лиц.
      Обратите внимание: переход исключительного права к новому правообладателю
      не прекращает лицензию (п. 7 ст. 1235 ГК РФ).
    addressee: "Юридический отдел"

  confidentiality_clause_license:
    text: >
      Просим согласовать условия конфиденциальности для {doc_names}.
      Для ноу-хау — критично: утрата конфиденциальности прекращает право (ст. 1467 ГК РФ).
    addressee: "Юридический отдел"

  notices_clause:
    text: >
      Просим согласовать порядок уведомлений для {doc_names}.
    addressee: "Юридический отдел"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
