        - "(?i)гаранти[ея].*ненарушени[ея]"
        - "(?i)ip[\\s-]*claims?\\s+indemnif"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется лицензионный договор. Проверяются только два
        IP-специфичных вопроса: (1) объём возмещения при IP-претензиях
        третьих лиц, (2) гарантия ненарушения исключительных прав.

        Нормативные ориентиры:
        - ст. 1235 ГК РФ — лицензионный договор.
        - ст. 1254 ГК РФ — патентные пошлины и ответственность.
        - ст. 1515 ГК РФ — ответственность за незаконное использование ТЗ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Общие indemnity, cap и исключения косвенных убытков НЕ проверяются
          (это global checks).

        [ЗАДАЧА]
        Найди в тексте договора и заполни строго следующие 4 поля + evidence
        (всего 5 ключей):
        1. ip_indemnity_scope — объём возмещения при IP-претензиях.
        2. ip_indemnity_details — формулировка IP-индемнити.
        3. non_infringement_warranty_status — статус гарантии ненарушения.
        4. non_infringement_warranty_details — формулировка гарантии ненарушения.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не оценивай серьёзность риска.
        3. Для signal-полей (ip_indemnity_scope, non_infringement_warranty_status)
           при отсутствии данных возвращай строго "not_defined".
        4. Для fact-полей (ip_indemnity_details, non_infringement_warranty_details)
           при отсутствии данных возвращай строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только точные цитаты из текста договора.
