  - id: pre_contractual_disclosure
    name: "Преддоговорное раскрытие информации (Disclosure Document / FDD)"
    description: |
      Франчайзер должен раскрыть франчайзи информацию о себе, финансовом положении,
      количестве действующих/закрытых точек, судебных спорах, реальных показателях бизнеса.
      Критично для защиты франчайзи от мошеннических схем.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "преддоговорное раскрытие"
        - "disclosure document"
        - "FDD"
        - "информация о франчайзере"
        - "история франшизы"
        - "количество точек"
        - "финансовые показатели"
        - "судебные споры"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+предоставил.*информаци"
        - "(?i)до\\s+заключения.*ознакомлен"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь наличие условий о преддоговорном раскрытии информации (Disclosure Document).

        Ответь строго в JSON:
        {
          "disclosure_present": "<yes / partial / no>",
          "disclosed_info_types": "<список раскрытой информации или not_found>",
          "financial_statements": "<yes / no / not_found>",
          "litigation_history": "<yes / no / not_found>",
          "franchisee_count": "<количество точек или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "преддоговорное раскрытие"
        - "информация о франчайзере"
        - "disclosure"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "disclosure_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Наличие преддоговорного раскрытия"
      store_payload: true

  - id: territory_protection
    name: "Защита территории (эксклюзивность)"
    description: |
      Без территориальной защиты франчайзер может открыть собственные точки
      или выдать франшизу другим на той же территории → каннибализация рынка.
    triggers:
      any: ["territory_exclusive"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "эксклюзивная территория"
        - "защита территории"
        - "запрет открытия точек"
        - "радиус защиты"
        - "монопольное право на территории"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+обязуется\\s+не\\s+предоставлять.*на\\s+территории"
        - "(?i)территори\\w+.*эксклюзивн"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь наличие защиты территории для франчайзи.

        Ответь строго в JSON:
        {
          "territory_exclusive": "<yes / no / unclear>",
          "franchisor_prohibited_from_opening": "<yes / no / unclear>",
          "franchisor_prohibited_from_granting_others": "<yes / no / unclear>",
          "radius_km": "<радиус защиты в км или not_found>"
