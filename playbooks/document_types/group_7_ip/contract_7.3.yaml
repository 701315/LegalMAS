        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "контроль качества"
        - "инспекции"
        - "проверки"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "quality_control_right"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Право франчайзера контролировать качество"
      store_payload: true

  - id: knowhow_confidentiality
    name: "Защита ноу-хау и конфиденциальности (ст. 1032, 1469 ГК РФ)"
    description: |
      Ноу-хау — ключевой актив франчайзера.
      После прекращения договора франчайзи может использовать знания для конкурирующего бизнеса.
    triggers:
      any: ["knowhow_transfer"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ноу-хау"
        - "секрет производства"
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "запрет раскрытия"
        - "ответственность за разглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+обязуется\\s+не\\s+разглашать"
        - "(?i)конфиденциальность.*после\\s+прекращения"
