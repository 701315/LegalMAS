# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "registration_mandatory_franchise"
    name: "Обязательная регистрация в Роспатенте (ст. 1028 ГК РФ)"
    description: |
      Договор коммерческой концессии подлежит ОБЯЗАТЕЛЬНОЙ государственной регистрации в Роспатенте.
      Без регистрации договор считается НЕДЕЙСТВИТЕЛЬНЫМ (п. 2 ст. 1028 ГК РФ).
    legal_base: "п. 2 ст. 1028 ГК РФ, Приказ Минэкономразвития № 707"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "hybrid"
    rules:
      keywords:
        - "государственная регистрация"
        - "Роспатент"
        - "подлежит регистрации"
        - "регистрация договора"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии (франчайзинга).
        Проверь наличие условия об обязательной государственной регистрации.

        Ответь строго в JSON:
        {
          "registration_clause_present": "<yes / no / not_found>",
          "responsible_party": "<franchisor / franchisee / joint / not_specified>",
          "deadline": "<срок регистрации или not_found>",
          "cost_allocation": "<кто несёт расходы или not_found>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      boost_keywords:
        - "регистрация"
        - "Роспатент"
        - "государственная пошлина"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "trademark_mandatory_in_complex"
    name: "Товарный знак/коммерческое обозначение обязательны в комплексе прав (ст. 1027 ГК РФ)"
    description: |
      Комплекс исключительных прав ОБЯЗАТЕЛЬНО должен включать право на использование
      товарного знака или коммерческого обозначения.
      Без этого договор НЕ является коммерческой концессией.
    legal_base: "п. 1 ст. 1027 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "товарный знак"
        - "торговая марка"
        - "коммерческое обозначение"
        - "бренд"
        - "знак обслуживания"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "товарный знак"
        - "комплекс прав"
        - "средства индивидуализации"
      rerank: true

  - id: "commercial_parties_mandatory"
    name: "Обе стороны должны быть коммерческими организациями/ИП (ст. 1027 ГК РФ)"
    description: |
      Сторонами договора коммерческой концессии могут быть только коммерческие организации
      и индивидуальные предприниматели.
      Некоммерческие организации и физические лица (не ИП) не могут быть сторонами.
    legal_base: "п. 3 ст. 1027 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "ООО"
        - "АО"
        - "ПАО"
        - "ИП"
        - "индивидуальный предприниматель"
        - "коммерческая организация"
      keyword_mode: "any"
      negative_keywords:
        - "физическое лицо"
        - "гражданин"
        - "некоммерческая организация"
        - "НКО"
    retrieval:
      context_k: 3
      boost_keywords:
        - "франчайзер"
        - "франчайзи"
        - "коммерческая организация"
      rerank: true

  - id: "antitrust_restrictive_conditions"
    name: "Антимонопольные ограничения (ФЗ-135 'О защите конкуренции')"
    description: |
      Ограничительные условия (территориальная эксклюзивность, non-compete,
      обязательные закупки у франчайзера) могут быть признаны недействительными
      по антимонопольному законодательству, если ограничивают конкуренцию.
      Особенно критично для крупных сетей с долей рынка > 35%.
    legal_base: "ФЗ-135 'О защите конкуренции', ст. 10, 11, 16"
    required_triggers: ["antitrust_risks", "territory_exclusive"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "территориальная эксклюзивность"
        - "запрет конкуренции"
        - "обязательные закупки"
        - "рекомендованные поставщики"
        - "минимальный объём закупок"
        - "запрет работы с конкурентами"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "эксклюзивность"
        - "конкуренция"
        - "закупки"
      rerank: true

  - id: "transfer_pricing_franchise_royalty"
    name: "Трансфертное ценообразование при роялти между взаимозависимыми (НК РФ ст. 105.3)"
    description: |
      Роялти между взаимозависимыми лицами (франчайзер и франчайзи в одной группе)
      подлежат контролю ФНС на соответствие рыночным условиям.
      Завышенные ставки роялти могут быть переквалифицированы налоговым органом.
    legal_base: "НК РФ ст. 105.3, 105.14, 105.15"
    required_triggers: ["related_parties", "royalty_based"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "трансфертное ценообразование"
        - "контролируемая сделка"
        - "рыночный уровень"
        - "уведомление ФНС"
        - "взаимозависимые лица"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "роялти"
        - "взаимозависимые"
        - "трансфертное ценообразование"
      rerank: true

  - id: "franchise_without_registered_trademark"
    name: "Франшиза без зарегистрированного товарного знака (мошенническая схема)"
    description: |
      Распространённая мошенническая схема: «франчайзер» продаёт франшизу на бренд,
      товарный знак которого НЕ зарегистрирован или зарегистрирован на другое лицо.
      В этом случае договор не может быть зарегистрирован в Роспатенте,
      франчайзи не получает правовой защиты, а паушальный взнос фактически потерян.
      Обзор судебной практики ВС РФ 2023 г. — п. 3.1.
    legal_base: "ст. 1027, 1028 ГК РФ, Обзор ВС РФ 2023"
    required_triggers: ["registered_trademark"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товарный знак"
        - "свидетельство на товарный знак"
        - "регистрационный номер"
        - "дата приоритета"
        - "срок действия регистрации"
        - "заявка на регистрацию"
      keyword_mode: "any"
      negative_keywords:
        - "заявка на регистрацию товарного знака"
        - "ожидается регистрация"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь, зарегистрирован ли товарный знак франчайзера.

        Ответь строго в JSON:
        {
          "trademark_registration_status": "<registered / pending / not_specified / not_found>",
          "trademark_registration_number": "<номер свидетельства или not_found>",
          "trademark_owner_matches_franchisor": "<yes / no / unclear / not_found>",
          "trademark_validity_date": "<дата окончания действия или not_found>"
        }

        КРИТИЧНО: Если товарный знак не зарегистрирован или зарегистрирован на третье лицо,
        договор не может быть зарегистрирован в Роспатенте и фактически ничтожен.
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      boost_keywords:
        - "товарный знак"
        - "свидетельство"
        - "регистрационный номер"
        - "Роспатент"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "withholding_tax_cross_border_royalty"
    name: "Налог у источника при трансграничном роялти (НК РФ ст. 309, 310)"
    description: |
      При выплате роялти иностранному франчайзеру российский франчайзи обязан
      удержать налог у источника (по умолчанию 20%, может быть снижен по СОИДН).
      Без правильного структурирования — двойное налогообложение.
    legal_base: "НК РФ ст. 309, 310; СОИДН"
    required_triggers: ["cross_border", "royalty_based"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "налог у источника"
        - "withholding tax"
        - "удержание налога"
        - "СОИДН"
        - "соглашение об избежании двойного налогообложения"
        - "нерезидент"
        - "валютный контроль"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "налог у источника"
        - "нерезидент"
        - "роялти"
        - "СОИДН"
      rerank: true

  - id: "consumer_rights_subsidiary_liability_extended"
    name: "Расширенная субсидиарная ответственность (ст. 1034 ГК + ФЗ-2300-1)"
    description: |
      Помимо субсидиарной ответственности по ст. 1034 ГК РФ, франчайзер может нести
      солидарную ответственность по ФЗ «О защите прав потребителей» за ненадлежащее
      качество товаров/услуг, особенно если потребитель воспринимает франчайзи как
      филиал франчайзера (единый бренд, единые стандарты).
    legal_base: "ст. 1034 ГК РФ, ФЗ-2300-1, п. 32 ПП ВС РФ от 28.06.2012 № 17"
    required_triggers: ["liability_for_quality"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "субсидиарная ответственность"
        - "солидарная ответственность"
        - "защита прав потребителей"
        - "ненадлежащее качество"
        - "претензии потребителей"
        - "товары ненадлежащего качества"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "субсидиарная ответственность"
        - "потребитель"
        - "качество"
      rerank: true
      
# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: rights_complex_extraction
    name: "Комплекс исключительных прав: состав и полнота"
    description: |
      Извлекает состав комплекса: товарный знак/коммерческое обозначение (обязательно!),
      ноу-хау, коммерческая тайна, патенты, произведения, программы для ЭВМ.
      Проверяет наличие обязательных элементов.
    triggers:
      any: ["business_system_complete", "registered_trademark"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "комплекс исключительных прав"
        - "товарный знак"
        - "коммерческое обозначение"
        - "ноу-хау"
        - "секрет производства"
        - "коммерческая тайна"
        - "патент"
        - "произведение"
        - "программа для ЭВМ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"
        - "(?i)комплекс.*включает"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии (франчайзинга).
        Определи состав комплекса исключительных прав.

        Ответь строго в JSON:
        {
          "trademark_present": "<yes / no>",
          "trademark_registration_number": "<номер или not_found>",
          "commercial_designation_present": "<yes / no>",
          "knowhow_present": "<yes / no>",
          "knowhow_description": "<описание ноу-хау или not_found>",
          "other_rights": "<список других прав или not_found>",
          "complex_complete": "<yes / incomplete / unclear>"
        }

        КРИТИЧНО: Комплекс ОБЯЗАТЕЛЬНО должен включать товарный знак/коммерческое обозначение (ст. 1027 ГК РФ).
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 10
      boost_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "состав прав"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 60
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "trademark_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие товарного знака"
        - name: "knowhow_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие ноу-хау"
        - name: "complex_complete"
          type: "string"
          allowed_values: ["yes", "incomplete", "unclear"]
          description: "Полнота комплекса прав"
      store_payload: true

  - id: business_activity_sphere
    name: "Сфера предпринимательской деятельности"
    description: |
      Конкретные виды товаров/работ/услуг, в отношении которых используется комплекс прав.
      Существенное условие договора.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сфера деятельности"
        - "предпринимательская деятельность"
        - "виды товаров"
        - "виды услуг"
        - "ассортимент"
        - "предмет договора"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Определи сферу предпринимательской деятельности франчайзи.

        Ответь строго в JSON:
        {
          "business_sphere": "<сфера деятельности или not_found>",
          "goods_services_specified": "<yes / vague / no>",
          "assortment_restrictions": "<ограничения ассортимента или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "сфера деятельности"
        - "виды товаров"
        - "ассортимент"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "business_sphere"
          type: "string"
          description: "Сфера предпринимательской деятельности"
        - name: "goods_services_specified"
          type: "string"
          allowed_values: ["yes", "vague", "no"]
          description: "Чёткость определения товаров/услуг"
      store_payload: true

  - id: remuneration_structure
    name: "Структура вознаграждения (паушальный взнос + роялти + рекламные отчисления)"
    description: |
      Извлекает все компоненты вознаграждения франчайзера:
      паушальный взнос (lump sum), роялти (royalty), рекламные отчисления, прочие платежи.
    triggers:
      any: ["lump_sum_payment", "royalty_based"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вознаграждение"
        - "паушальный взнос"
        - "роялти"
        - "рекламные отчисления"
        - "процент от выручки"
        - "franchise fee"
        - "единовременный платёж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)паушальн\\w+.*?\\d[\\d\\s]*(?:руб|USD|EUR)"
        - "(?i)роялти.*?\\d+[.,]?\\d*\\s*%"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Определи структуру вознаграждения франчайзера.

        Ответь строго в JSON:
        {
          "lump_sum_present": "<yes / no>",
          "lump_sum_amount": "<сумма или not_found>",
          "royalty_present": "<yes / no>",
          "royalty_rate": "<ставка роялти или not_found>",
          "royalty_base": "<база расчёта (выручка/прибыль/продажи) или not_found>",
          "advertising_fee_present": "<yes / no>",
          "advertising_fee_rate": "<ставка или not_found>",
          "other_payments": "<прочие платежи или not_found>"
        }
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 10
      boost_keywords:
        - "вознаграждение"
        - "паушальный"
        - "роялти"
        - "рекламные отчисления"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lump_sum_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие паушального взноса"
        - name: "lump_sum_amount"
          type: "number"
          keyword_hints: ["паушальный взнос", "вступительный взнос"]
          unit: "RUB"
          description: "Размер паушального взноса"
        - name: "royalty_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие роялти"
        - name: "royalty_rate"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+[.,]?\\d*\\s*%"
          description: "Ставка роялти"
      store_payload: true

  - id: territory_and_term
    name: "Территория и срок действия договора"
    description: "Территориальные рамки и срок действия концессии"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "территория"
        - "срок действия"
        - "эксклюзивная территория"
        - "радиус защиты"
        - "действует до"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Определи территорию и срок действия.

        Ответь строго в JSON:
        {
