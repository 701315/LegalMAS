type: contract_7.3_franchise
name: "Договор коммерческой концессии (франчайзинг)"

description: |
  Комплексное соглашение, по которому правообладатель (франчайзер) предоставляет
  пользователю (франчайзи) за вознаграждение КОМПЛЕКС исключительных прав
  (обязательно: товарный знак/коммерческое обозначение + ноу-хау) для использования
  в предпринимательской деятельности с соблюдением правил и стандартов франчайзера.
  Модель "клонирования бизнеса" под единым брендом с системой обучения и поддержки.
  Подлежит ОБЯЗАТЕЛЬНОЙ государственной регистрации в Роспатенте.
  Франчайзер несёт субсидиарную ответственность за качество товаров/услуг франчайзи.

version: 4.1
parent: class_7_intellectual_property

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: intellectual_property
  complexity: very_high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ГК РФ Глава 54 (ст. 1027-1040)"
  doc_types_supported:
    - "договор коммерческой концессии"
    - "франчайзинг"
    - "франшиза"
    - "договор франчайзинга"
    - "сетевой лицензионный договор"
    - "мастер-франчайзинг"
    - "субконцессия"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

