    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "контроль качества"
        - "инспекции"
        - "проверки точек"
        - "соблюдение стандартов"
        - "аудит качества"
        - "тайный покупатель"
        - "право доступа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+вправе\\s+проводить\\s+проверки"
        - "(?i)франчайзи\\s+обязан\\s+допускать.*для\\s+инспекции"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь условия о контроле качества.

