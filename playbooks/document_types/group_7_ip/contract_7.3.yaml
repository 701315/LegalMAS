          "revenue_guarantee": "<yes / no / not_found>",
          "disclaimer_present": "<yes / no>",
          "franchisor_liability_for_forecast": "<yes / no / unclear>"
        }

        ВНИМАНИЕ: Гарантия дохода / нереалистичный прогноз — красный флаг мошеннической франшизы.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "окупаемость"
        - "финансовый прогноз"
        - "бизнес-план"
        - "гарантированный доход"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
