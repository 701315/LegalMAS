        - "защита территории"
        - "запрет открытия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "territory_exclusive"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Эксклюзивность территории"
      store_payload: true

  - id: renewal_preferential_right
    name: "Право на продление и преимущественное право (ст. 1035 ГК РФ)"
    description: |
      По окончании срока франчайзи может потерять все инвестиции.
      Статья 1035 ГК РФ даёт преимущественное право, но условия могут быть изменены.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продление договора"
        - "преимущественное право"
        - "возобновление"
        - "новый срок"
        - "условия продления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+имеет\\s+преимущественное\\s+право"
        - "(?i)продление.*на\\s+условиях"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь условия о продлении договора.

        Ответь строго в JSON:
        {
          "renewal_clause_present": "<yes / no>",
          "preferential_right": "<yes / no / unclear>",
          "renewal_conditions": "<условия продления или not_found>",
          "notice_period": "<срок уведомления или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "продление"
        - "преимущественное право"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "renewal_clause_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие условия о продлении"
      store_payload: true

  - id: standards_change_limitation
    name: "Ограничение на односторонние изменения стандартов"
    description: |
      Франчайзер может в одностороннем порядке менять стандарты, требуя дорогостоящего ремонта.
      Без ограничений или компенсации — риск непредвиденных затрат для франчайзи.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "изменение стандартов"
        - "уведомление об изменениях"
        - "срок на внедрение"
        - "компенсация затрат"
        - "существенные изменения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+вправе\\s+изменять.*с\\s+уведомлением"
        - "(?i)при\\s+существенных\\s+изменениях.*вправе"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор коммерческой концессии.
        Проверь условия об изменении стандартов.

        Ответь строго в JSON:
        {
          "standards_change_allowed": "<yes / no / unclear>",
          "notice_period": "<срок уведомления или not_found>",
          "implementation_period": "<срок на внедрение или not_found>",
          "cost_compensation": "<компенсация затрат или not_found>",
          "termination_right_on_major_changes": "<yes / no / unclear>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "изменение стандартов"
        - "уведомление"
        - "компенсация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "standards_change_allowed"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Право франчайзера изменять стандарты"
      store_payload: true

  - id: quality_control_rights
    name: "Право контроля качества и инспекций (ст. 1031, 1034 ГК РФ)"
    description: |
      Франчайзер несёт субсидиарную ответственность за качество товаров/услуг франчайзи.
      Без права контроля и инспекций — риск ущерба репутации бренда.
