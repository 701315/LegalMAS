  - id: "assignment_franchise"
    name: "Уступка прав / смена контроля (ст. 1038 ГК РФ)"
    description: "Ограничения на уступку прав по договору и смену контроля над франчайзи"
    legal_base: "ст. 1038 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка прав"
        - "переуступка"
        - "перевод долга"
        - "смена контроля"
        - "продажа бизнеса"
        - "смена участников"
        - "согласие франчайзера"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступ(ка|ить).*без\\s+согласия"
        - "(?i)смен(а|у)\\s+контрол"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "assignment_restriction"
          type: "string"
          allowed_values: ["prohibited", "with_consent", "allowed", "unclear", "not_found"]
          keyword_hints: ["запрещается уступка", "с согласия франчайзера", "без ограничений"]
          description: "Ограничения на уступку прав"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  rights_complex_extraction:
    text: >
      Просим предоставить полный перечень объектов интеллектуальной собственности,
      входящих в комплекс исключительных прав по {doc_names}:
      (а) товарный знак (регистрационный номер, дата регистрации, срок действия);
      (б) ноу-хау и коммерческая тайна (описание);
      (в) другие объекты (патенты, произведения, программы для ЭВМ).
      Просим подтвердить, что комплекс включает ОБЯЗАТЕЛЬНЫЕ элементы (товарный знак/коммерческое обозначение).
    addressee: "Франчайзер / Юридический отдел франчайзера"

  business_activity_sphere:
    text: >
      Просим чётко определить сферу предпринимательской деятельности по {doc_names}:
      конкретные виды товаров/работ/услуг, ассортимент, ограничения.
    addressee: "Обе стороны"

  remuneration_structure:
    text: >
      Просим предоставить полную структуру вознаграждения по {doc_names}:
      (а) паушальный взнос (размер, порядок уплаты);
      (б) роялти (ставка, база расчёта, периодичность);
      (в) рекламные отчисления (ставка, целевое использование);
      (г) прочие платежи (если есть).
    addressee: "Финансовый отдел"

  territory_and_term:
    text: >
      Просим уточнить территорию и срок действия концессии по {doc_names}:
      (а) территория использования (эксклюзивность, радиус защиты);
      (б) срок действия договора;
      (в) условия продления.
    addressee: "Обе стороны"

  pre_contractual_disclosure:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить Disclosure Document (FDD) по {doc_names}:
      (а) информацию о франчайзере (финансовое положение, судебные споры, история компании);
      (б) количество действующих и закрытых точек (по годам);
      (в) реальные финансовые показатели существующих франчайзи;
      (г) списки существующих франчайзи (для контакта и проверки);
      (д) все раскрытия, требуемые законодательством.
      Без полного раскрытия франчайзи принимает решение вслепую.
    addressee: "Франчайзер / Юридический отдел франчайзера"

  territory_protection:
    text: >
      Просим включить в {doc_names} чёткую защиту территории франчайзи:
      (а) эксклюзивность территории (франчайзер не вправе открывать собственные точки и выдавать франшизы другим);
      (б) радиус защиты (в км);
      (в) санкции за нарушение;
      (г) право франчайзи требовать закрытия нарушающих точек.
    addressee: "Юридический отдел франчайзера"

  renewal_preferential_right:
    text: >
      Просим согласовать для {doc_names} условия продления договора:
      (а) преимущественное право франчайзи на заключение договора на новый срок (ст. 1035 ГК РФ);
      (б) условия продления (изменения вознаграждения, стандартов);
      (в) срок уведомления о намерении продлить;
      (г) последствия отказа франчайзера от продления (компенсация инвестиций франчайзи?).
    addressee: "Юридический отдел"

  standards_change_limitation:
    text: >
      Просим ограничить право франчайзера на односторонние изменения стандартов в {doc_names}:
      (а) срок уведомления об изменениях (не менее 6-12 месяцев);
      (б) срок на внедрение изменений;
      (в) компенсация затрат франчайзи на внедрение существенных изменений;
      (г) право франчайзи расторгнуть договор при существенных изменениях без штрафов.
    addressee: "Юридический отдел франчайзера"

  quality_control_rights:
    text: >
      Просим согласовать для {doc_names} право франчайзера на контроль качества:
      (а) регулярные инспекции (периодичность);
      (б) право доступа к точкам франчайзи без предупреждения;
      (в) программы "тайный покупатель";
      (г) аудит качества продукции/услуг;
      (д) санкции за несоблюдение стандартов (штрафы, приостановка деятельности, расторжение).
    addressee: "Обе стороны"

  knowhow_confidentiality:
    text: >
      Просим включить в {doc_names} строгие условия о защите ноу-хау:
      (а) обязательство неразглашения ноу-хау и коммерческой тайны;
      (б) срок конфиденциальности (включая период после прекращения договора);
      (в) запрет использования ноу-хау для собственного конкурирующего бизнеса;
      (г) санкции за разглашение (неустойка, возмещение убытков);
      (д) обязательство франчайзи подписать отдельное соглашение о неразглашении (NDA).
    addressee: "Юридический отдел франчайзера"

  rebranding_post_termination:
    text: >
      Просим согласовать для {doc_names} обязательства франчайзи по ребрендингу после прекращения:
      (а) срок на демонтаж вывесок и прекращение использования бренда (обычно 30-60 дней);
      (б) удаление упоминаний из интернета (сайт, соцсети, рекламные площадки);
      (в) возврат материалов франчайзера (руководства, программное обеспечение);
      (г) штраф за продолжение использования бренда.
    addressee: "Юридический отдел"

  subfranchising_control:
    text: >
      Если в {doc_names} предусмотрена субконцессия (мастер-франчайзинг), просим согласовать:
      (а) обязательность письменного согласия франчайзера на каждого субфранчайзи;
      (б) критерии одобрения субфранчайзи;
      (в) право франчайзера контролировать субфранчайзи напрямую;
      (г) ответственность франчайзи (мастер-франчайзи) за действия субфранчайзи;
      (д) порядок распределения вознаграждения.
    addressee: "Обе стороны"

  training_and_support:
    text: >
      Просим согласовать для {doc_names} обязанности франчайзера по обучению и поддержке:
      (а) первоначальное обучение (длительность, место проведения, кто оплачивает расходы);
      (б) обучение персонала франчайзи;
      (в) постоянная консультационная поддержка (форма, доступность);
      (г) помощь в открытии точки (подбор помещения, дизайн, поставка оборудования);
      (д) маркетинговая поддержка (реклама, продвижение).
      Это ОБЯЗАННОСТЬ франчайзера по ст. 1031 ГК РФ.
    addressee: "Франчайзер"

  liability_for_quality_consumers:
    text: >
      ВНИМАНИЕ: По ст. 1034 ГК РФ франчайзер несёт СУБСИДИАРНУЮ ответственность
      за качество товаров/услуг франчайзи перед потребителями.
      Просим согласовать для {doc_names}:
      (а) обязательность немедленного уведомления франчайзера о претензиях потребителей;
      (б) порядок совместного рассмотрения претензий;
      (в) обязательство франчайзи возместить франчайзеру расходы, понесённые в связи с ответственностью;
      (г) право франчайзера самостоятельно рассматривать претензии и взыскивать с франчайзи.
    addressee: "Юридический отдел"

  termination_conditions_franchise:
    text: >
      Просим согласовать для {doc_names}:
      (а) исчерпывающий перечень оснований досрочного расторжения для каждой стороны;
      (б) cure period (срок на устранение нарушений);
      (в) последствия расторжения (возврат вознаграждения, штрафы, компенсация инвестиций);
      (г) порядок уведомления и односторонний отказ.
    addressee: "Юридический отдел"

  post_termination_obligations:
    text: >
      Просим согласовать для {doc_names} пост-контрактные обязательства:
      (а) неконкуренция (срок, территория, виды деятельности);
      (б) возврат материалов франчайзера;
      (в) прекращение использования всех элементов комплекса прав;
      (г) продолжение конфиденциальности ноу-хау (бессрочно);
      (д) штрафы за нарушение пост-контрактных обязательств.
    addressee: "Юридический отдел"

  parties_identification_franchise:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}:
      франчайзера и франчайзи (обе стороны должны быть коммерческими организациями/ИП).
    addressee: "Обе стороны"

  rights_complex_mandatory:
    text: >
      Просим предоставить детальное описание комплекса исключительных прав по {doc_names}.
    addressee: "Франчайзер"

  trademark_mandatory:
    text: >
      КРИТИЧЕСКОЕ ЗАМЕЧАНИЕ: В {doc_names} должен быть указан товарный знак или коммерческое обозначение.
      Без этого договор НЕ является коммерческой концессией (п. 1 ст. 1027 ГК РФ).
      Просим незамедлительно дополнить договор.
    addressee: "Юридический отдел франчайзера"

  business_sphere_mandatory:
    text: >
      Просим указать сферу предпринимательской деятельности в {doc_names}.
    addressee: "Обе стороны"

  remuneration_mandatory_franchise:
    text: >
      Просим указать размер и порядок выплаты вознаграждения в {doc_names}.
    addressee: "Финансовый отдел"

  registration_clause_franchise:
    text: >
      ВНИМАНИЕ: {doc_names} подлежит ОБЯЗАТЕЛЬНОЙ государственной регистрации в Роспатенте.
      Без регистрации договор НЕДЕЙСТВИТЕЛЕН (п. 2 ст. 1028 ГК РФ).
      Просим согласовать: (а) ответственную сторону; (б) срок подачи заявления;
      (в) распределение расходов на государственную пошлину.
    addressee: "Обе стороны / Роспатент"

  quality_control_clause_franchise:
    text: >
      Просим согласовать условия контроля качества для {doc_names}.
    addressee: "Обе стороны"

  training_support_clause_franchise:
    text: >
      Просим согласовать условия обучения и поддержки для {doc_names} (обязанность франчайзера по ст. 1031 ГК РФ).
    addressee: "Франчайзер"

  confidentiality_clause_franchise:
    text: >
      Просим согласовать условия конфиденциальности и защиты ноу-хау для {doc_names}.
    addressee: "Обе стороны"

  subfranchising_clause:
    text: >
      Просим уточнить условия субконцессии (субфранчайзинга) для {doc_names}.
    addressee: "Обе стороны"

  termination_clause_franchise:
    text: >
      Просим согласовать основания и порядок досрочного расторжения для {doc_names}.
    addressee: "Юридический отдел"

  registration_mandatory_franchise:
    text: >
      ВНИМАНИЕ: {doc_names} — договор коммерческой концессии.
      Подлежит ОБЯЗАТЕЛЬНОЙ регистрации в Роспатенте (ст. 1028 ГК РФ).
      Без регистрации договор НЕДЕЙСТВИТЕЛЕН.
      Просим незамедлительно организовать подачу заявления.
    addressee: "Обе стороны / Роспатент"

  trademark_mandatory_in_complex:
    text: >
      КРИТИЧЕСКОЕ ЗАМЕЧАНИЕ: Комплекс прав по {doc_names} ОБЯЗАТЕЛЬНО должен включать товарный знак
      или коммерческое обозначение (п. 1 ст. 1027 ГК РФ).
      Без этого договор НЕ является коммерческой концессией.
      Просим дополнить договор.
    addressee: "Юридический отдел франчайзера"

  commercial_parties_mandatory:
    text: >
      ВНИМАНИЕ: Сторонами договора коммерческой концессии могут быть только коммерческие организации
      и индивидуальные предприниматели (п. 3 ст. 1027 ГК РФ).
      Просим подтвердить коммерческий статус обеих сторон по {doc_names}.
    addressee: "Обе стороны"

  antitrust_restrictive_conditions:
    text: >
      ВНИМАНИЕ: В {doc_names} содержатся ограничительные условия (территориальная эксклюзивность,
      обязательные закупки, non-compete).
      Просим получить правовое заключение о соответствии антимонопольному законодательству (ФЗ-135).
      Особенно критично для крупных сетей с долей рынка > 35%.
    addressee: "Юридический отдел / Антимонопольный консультант"

  transfer_pricing_franchise_royalty:
    text: >
      ВНИМАНИЕ: {doc_names} — роялти между взаимозависимыми лицами.
      Просим обеспечить соблюдение требований трансфертного ценообразования (НК РФ ст. 105.3):
      (а) обоснование рыночного уровня роялти;
      (б) подготовка документации по ТЦО;
      (в) уведомление ФНС о контролируемой сделке.
    addressee: "Финансовый отдел / Налоговый консультант"

  franchise_without_registered_trademark:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить по {doc_names}:
      (а) свидетельство о регистрации товарного знака в Роспатенте;
      (б) подтверждение того, что правообладатель ТЗ = франчайзер;
      (в) дату окончания действия регистрации ТЗ;
      (г) информацию обо всех поданных третьими лицами возражениях против ТЗ.
      Без зарегистрированного ТЗ договор не может быть зарегистрирован в Роспатенте,
      а франчайзи не получает правовой защиты бренда.
    addressee: "Франчайзер / Патентный поверенный"

  withholding_tax_cross_border_royalty:
    text: >
      ВНИМАНИЕ: {doc_names} предусматривает выплату роялти нерезиденту.
      Просим предоставить:
      (а) правовое заключение о применимой ставке налога у источника (НК РФ ст. 309, 310);
      (б) подтверждение применимости СОИДН (сертификат резидентства франчайзера);
      (в) механизм валютного контроля;
      (г) gross-up оговорку или распределение налогового бремени.
    addressee: "Налоговый консультант / Финансовый отдел"

  consumer_rights_subsidiary_liability_extended:
    text: >
      По {doc_names}: франчайзер несёт субсидиарную (а возможно, и солидарную)
      ответственность перед потребителями. Просим согласовать:
      (а) порядок страхования ответственности франчайзи;
      (б) порядок уведомления о претензиях;
      (в) механизм регресса между сторонами;
      (г) создание резервного фонда для покрытия потребительских претензий.
    addressee: "Юридический отдел"

  minimum_purchase_obligations:
    text: >
      Просим уточнить для {doc_names} условия обязательных закупок:
      (а) перечень товаров/услуг, подлежащих закупке у франчайзера/одобренных поставщиков;
      (б) механизм ценообразования (рыночные цены или диктуемые франчайзером?);
      (в) минимальный объём закупок и санкции за невыполнение;
      (г) право франчайзи предлагать альтернативных поставщиков;
      (д) антимонопольное заключение (при необходимости).
    addressee: "Юридический отдел / Антимонопольный консультант"

  advertising_fund_transparency:
    text: >
      Просим согласовать для {doc_names} прозрачность рекламного фонда:
      (а) порядок формирования и управления фондом;
      (б) право франчайзи на отчёт о расходовании (ежеквартально);
      (в) право аудита рекламного фонда;
      (г) гарантия, что средства расходуются на продвижение бренда в целом, а не только корпоративных точек;
      (д) право франчайзи на локальную рекламу за свой счёт.
    addressee: "Финансовый отдел / Юридический отдел"

  ip_validity_and_maintenance:
    text: >
      Просим предоставить по {doc_names}:
      (а) актуальное свидетельство о регистрации ТЗ с датой окончания действия;
      (б) обязательство франчайзера продлевать регистрацию ТЗ в течение всего срока договора;
      (в) порядок уведомления франчайзи в случае оспаривания ТЗ третьими лицами;
      (г) последствия для сторон в случае утраты ТЗ (возврат паушального взноса, расторжение без штрафов);
      (д) обязательство франчайзера защищать ТЗ от нарушений третьими лицами.
    addressee: "Франчайзер / Патентный поверенный"

  investment_forecast_and_payback:
    text: >
      Просим предоставить по {doc_names}:
      (а) финансовый прогноз/бизнес-план с обоснованием (методология, источники данных);
      (б) реальные финансовые показатели существующих франчайзи (выручка, прибыль, окупаемость);
      (в) оговорку об ответственности франчайзера за достоверность прогноза;
      (г) если прогноз не предоставляется — причины.
      ВНИМАНИЕ: Гарантии дохода без обоснования — признак мошеннической франшизы.
    addressee: "Франчайзер / Финансовый консультант"

  insurance_requirements_franchise:
    text: >
      Просим согласовать для {doc_names} требования к страхованию:
      (а) виды обязательного страхования (ответственность, имущество, перерыв в деятельности);
      (б) минимальные страховые суммы;
