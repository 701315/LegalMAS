      Если франчайзер предоставил финансовый прогноз, он должен быть обоснованным.
      Завышенный прогноз может быть основанием для расторжения по ст. 178 ГК РФ (заблуждение)
      или взыскания убытков по ст. 434.1 ГК РФ (недобросовестное ведение переговоров).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
