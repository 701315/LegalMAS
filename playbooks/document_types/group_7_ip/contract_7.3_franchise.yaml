          "electronic_communication_status": "not_defined",
          "delivery_moment_status": "not_defined",
          "addresses_change_procedure_status": "not_defined",
          "notices_addresses_details": "Данные не определены",
          "edo_system_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о порядке уведомлений.
        2. Найди прямую цитату об адресах.
        3. Найди прямую цитату о каналах связи.
        4. Найди прямую цитату о моменте доставки.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

