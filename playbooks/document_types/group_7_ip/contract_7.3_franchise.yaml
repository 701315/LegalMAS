    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: режим ответственности сторон.

        Нормативный ориентир:
        - ст. 330, 333, 393, 394, 431.2 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общий режим ответственности.
        2. Ключевые неустойки и штрафы.
        3. Ограничение ответственности (лимиты).
        4. Исключение косвенных убытков и упущенной выгоды.
        5. Соотношение неустойки и убытков (зачётная / штрафная).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За нарушение сроков оплаты Франчайзи уплачивает пеню 0,1% в день.
        Ответственность Франчайзера ограничена суммой 1 000 000 рублей.
        Косвенные убытки и упущенная выгода не возмещаются."

        Ответ:
        {
          "liability_regime_status": "defined",
          "penalties_status": "defined",
          "liability_cap_status": "defined",
          "consequential_damages_exclusion_status": "defined",
          "damages_offset_status": "not_defined",
          "key_penalties_details": "пеня 0,1% в день за просрочку оплаты",
          "liability_cap_details": "1 000 000 рублей",
          "evidence": [{"clause_ref": "п. 7.2", "quote": "Ответственность Франчайзера ограничена суммой 1 000 000 рублей."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "liability_regime_status": "not_defined",
          "penalties_status": "not_defined",
          "liability_cap_status": "not_defined",
          "consequential_damages_exclusion_status": "not_defined",
          "damages_offset_status": "not_defined",
          "key_penalties_details": "Данные не определены",
          "liability_cap_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о режиме ответственности.
        2. Найди прямую цитату о неустойках/штрафах.
        3. Найди прямую цитату о лимите ответственности.
        4. Найди прямую цитату об исключении убытков.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_regime_status": "<defined / not_defined>",
          "penalties_status": "<defined / not_defined>",
          "liability_cap_status": "<defined / not_defined>",
          "consequential_damages_exclusion_status": "<defined / not_defined>",
          "damages_offset_status": "<defined / not_defined>",
          "key_penalties_details": "<текст или 'Данные не определены'>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
