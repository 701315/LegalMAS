          "notices_procedure_status": "defined",
          "notices_addresses_status": "defined",
          "electronic_communication_status": "defined",
          "delivery_moment_status": "defined",
          "addresses_change_procedure_status": "defined",
          "notices_addresses_details": "по адресам сторон из реквизитов",
          "edo_system_details": "email + оператор ЭДО «Диадок»",
          "evidence": [{"clause_ref": "п. 9.1", "quote": "Уведомления направляются по адресам сторон, указанным в реквизитах."}]
        }

