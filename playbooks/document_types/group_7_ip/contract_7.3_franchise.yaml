           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. edo_system_details:
           Краткое user-facing описание электронных каналов
           (например: "email + оператор ЭДО «Диадок»").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notices_edo_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай общий порядок уведомлений с процедурой направления конкретных уведомлений (например, о расторжении — это тема другого check'а).
        - Если в разных фрагментах указаны противоречивые адреса или порядок — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка уведомлений, ни адресов,
           ни электронных каналов, ни момента доставки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Стороны обмениваются информацией"
              без конкретных адресов и каналов.
              → presence = "present";
                notices_procedure_status = "not_defined".
           б) Прямо указано, что уведомления по email не считаются
              надлежащими — только бумажные.
              → presence = "present";
                electronic_communication_status = "not_defined";
                соответствующие поля содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные адреса для уведомлений.
           → presence = "unclear";
             notices_addresses_status = "not_defined";
             notices_addresses_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Адреса, каналы и момент доставки описаны в одном разделе
           договора.
           → presence = "present";
             все соответствующие *_status = "defined";
             все *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notices_edo_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * notices_addresses_details, edo_system_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notices_edo_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
