    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "liability_cap_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        общий режим ответственности сторон: неустойки, штрафы, лимиты,
        исключения убытков.
        Не анализируй отдельные санкции за разглашение, расторжение
        или нарушение стандартов (это темы других check'ов).
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_cap_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (liability_regime_status, penalties_status,
              liability_cap_status, consequential_damages_exclusion_status,
              damages_offset_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - key_penalties_details, liability_cap_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. liability_regime_status:
           - "defined" — если в тексте прямо указан общий режим
             ответственности сторон (сверх простой ссылки на закон);
           - "not_defined" — иначе.

        2. penalties_status:
           - "defined" — если прямо указаны неустойки, штрафы или пени
             за нарушения по договору;
           - "not_defined" — иначе.

        3. liability_cap_status:
           - "defined" — если прямо указан лимит (предел) ответственности
             для одной или обеих сторон;
           - "not_defined" — иначе.

        4. consequential_damages_exclusion_status:
           - "defined" — если прямо указано, что косвенные убытки
             и/или упущенная выгода не возмещаются;
           - "not_defined" — иначе.

        5. damages_offset_status:
           - "defined" — если прямо указано соотношение неустойки
             и убытков (зачётная, штрафная, исключительная);
           - "not_defined" — иначе.

        6. key_penalties_details:
           Краткое user-facing перечисление ключевых неустоек и штрафов.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. liability_cap_details:
           Краткое user-facing описание лимита ответственности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_cap_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о санкциях за разглашение ноу-хау, за нарушение стандартов или о пост-контрактных ограничениях — это темы других check'ов.
        - Общая ссылка "ответственность по законодательству РФ" без конкретики — это liability_regime_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые лимиты или санкции — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустоек, ни лимитов, ни исключений убытков.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Стороны несут ответственность в соответствии
              с законодательством РФ" без конкретных санкций.
              → presence = "present";
                liability_regime_status = "not_defined".
           б) Прямо указано, что неустойка не применяется
              (например, только возмещение убытков).
              → presence = "present";
                penalties_status = "not_defined";
                соответствующие поля содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые лимиты
           ответственности или разные санкции за одно нарушение.
           → presence = "unclear";
             соответствующий *_status = "not_defined".

        4. Комбинированная ситуация.
           Несколько видов санкций и лимит ответственности описаны
           в одном разделе договора.
           → presence = "present";
             все соответствующие *_status = "defined";
             все *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_cap_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * key_penalties_details, liability_cap_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_cap_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности сторон. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_regime_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус режима ответственности. Внутреннее enum-поле."
          required: true

        - name: "penalties_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия неустоек и штрафов. Внутреннее enum-поле."
          required: true

        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус лимита ответственности. Внутреннее enum-поле."
          required: true

        - name: "consequential_damages_exclusion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения косвенных убытков. Внутреннее enum-поле."
          required: true

        - name: "damages_offset_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус соотношения неустойки и убытков. Внутреннее enum-поле."
          required: true

        - name: "key_penalties_details"
          type: "string"
          presentation: "fact"
          label: "Ключевые неустойки"
          description: >
            Ключевые неустойки и штрафы по договору. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "liability_cap_details"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности"
          description: >
            Ограничение ответственности сторон. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

