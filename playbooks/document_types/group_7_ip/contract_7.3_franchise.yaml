          description: >
            Срок действия ограничений конкуренции. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: representations_warranties_check
    name: "Заверения об обстоятельствах (ст. 431.2 ГК РФ)"
    description: >
      Фактографическая проверка наличия и содержания заверений сторон
      об обстоятельствах (R&W), права полагаться на заверения,
      ответственности за недостоверные заверения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "заверяет"
        - "гарантирует"
        - "подтверждает"
        - "представляет заверения"
        - "достоверность заверений"
        - "недостоверные заверения"
        - "ответственность за заверения"
        - "полагается на заверения"
        - "representations and warranties"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(франчайзер|франчайзи)\\s+(заверяет|гарантирует|подтверждает)"
        - "(?i)заверени[яй]\\s+об\\s+обстоятельств"
        - "(?i)недостоверн\\w+\\s+заверени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор коммерческой концессии (ст. 431.2 ГК РФ).
        Проверяется только один вопрос: заверения об обстоятельствах (R&W).

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Блок заверений об обстоятельствах.
        2. Заверения франчайзера.
        3. Заверения франчайзи.
        4. Право стороны полагаться на заверения.
        5. Ответственность за недостоверные заверения.
        6. Срок действия заверений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер заверяет, что является правообладателем товарного знака,
        не обременённого арестами. Франчайзи заверяет, что имеет все необходимые
        лицензии. Стороны полагаются на заверения и несут ответственность
        за недостоверность в соответствии со ст. 431.2 ГК РФ."

        Ответ:
        {
          "representations_status": "defined",
          "franchisor_representations_status": "defined",
          "franchisee_representations_status": "defined",
          "reliance_on_representations_status": "defined",
          "misrepresentation_liability_status": "defined",
          "representations_list_details": "правообладание товарным знаком, отсутствие арестов, наличие лицензий",
          "misrepresentation_remedies_details": "ответственность по ст. 431.2 ГК РФ",
          "evidence": [{"clause_ref": "п. 2.1", "quote": "Франчайзер заверяет, что является правообладателем товарного знака, не обременённого арестами."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "representations_status": "not_defined",
          "franchisor_representations_status": "not_defined",
          "franchisee_representations_status": "not_defined",
          "reliance_on_representations_status": "not_defined",
          "misrepresentation_liability_status": "not_defined",
          "representations_list_details": "Данные не определены",
          "misrepresentation_remedies_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о заверениях.
        2. Найди прямую цитату о заверениях франчайзера.
        3. Найди прямую цитату о заверениях франчайзи.
        4. Найди прямую цитату об ответственности за недостоверность.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "representations_status": "<defined / not_defined>",
          "franchisor_representations_status": "<defined / not_defined>",
          "franchisee_representations_status": "<defined / not_defined>",
          "reliance_on_representations_status": "<defined / not_defined>",
          "misrepresentation_liability_status": "<defined / not_defined>",
          "representations_list_details": "<текст или 'Данные не определены'>",
          "misrepresentation_remedies_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверения об обстоятельствах заверяет гарантирует подтверждает достоверность заверений недостоверные заверения ответственность за заверения полагается на заверения representations warranties"
      retrieval_profile: "representations_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "комплекс прав"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "representations_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        сведения о заверениях об обстоятельствах (ст. 431.2 ГК РФ):
        наличие блока R&W, заверения сторон, право полагаться, ответственность.
        Не анализируй вознаграждение, территорию, контроль качества или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. representations_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (representations_status, franchisor_representations_status,
              franchisee_representations_status,
              reliance_on_representations_status,
              misrepresentation_liability_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - representations_list_details, misrepresentation_remedies_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. representations_status:
           - "defined" — если в тексте прямо присутствует блок заверений
             об обстоятельствах (заверения, гарантии, R&W);
           - "not_defined" — иначе.

        2. franchisor_representations_status:
           - "defined" — если прямо указаны заверения со стороны
             франчайзера (правообладание ТЗ, отсутствие обременений и т.п.);
           - "not_defined" — иначе.

        3. franchisee_representations_status:
           - "defined" — если прямо указаны заверения со стороны
             франчайзи (наличие лицензий, полномочия подписантов и т.п.);
           - "not_defined" — иначе.

        4. reliance_on_representations_status:
           - "defined" — если прямо указано, что стороны полагаются
             на заверения, или это следует из формулировки;
           - "not_defined" — иначе.

        5. misrepresentation_liability_status:
           - "defined" — если прямо указана ответственность
             за недостоверные заверения (убытки, неустойка, право отказа);
           - "not_defined" — иначе.

        6. representations_list_details:
           Краткое user-facing перечисление заверений
           (например: "правообладание ТЗ, отсутствие арестов, наличие лицензий").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. misrepresentation_remedies_details:
           Краткое user-facing описание последствий недостоверности
           (например: "возмещение убытков по ст. 431.2 ГК РФ").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни representations_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай заверения с гарантиями качества (это отдельные темы).
        - Если в разных фрагментах указаны противоречивые заверения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений, ни гарантий об обстоятельствах,
           ни ответственности за их недостоверность.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Стороны подтверждают свою правоспособность"
              без отдельного блока R&W.
              → presence = "present";
                representations_status = "not_defined".
           б) Прямо указано, что стороны не дают заверений
              и не полагаются на них.
              → presence = "present";
                reliance_on_representations_status = "not_defined";
                соответствующие поля содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые заверения
           или противоречивые условия об ответственности.
           → presence = "unclear";
             соответствующий *_status = "not_defined".

        4. Комбинированная ситуация.
           Заверения сторон, право полагаться и ответственность
           описаны в одном разделе договора.
           → presence = "present";
             все соответствующие *_status = "defined";
             все *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для representations_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * representations_list_details, misrepresentation_remedies_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "representations_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по заверениям об обстоятельствах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия блока заверений. Внутреннее enum-поле."
          required: true

        - name: "franchisor_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверений франчайзера. Внутреннее enum-поле."
          required: true

        - name: "franchisee_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверений франчайзи. Внутреннее enum-поле."
          required: true

        - name: "reliance_on_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права полагаться на заверения. Внутреннее enum-поле."
          required: true

        - name: "misrepresentation_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за недостоверные заверения. Внутреннее enum-поле."
          required: true

        - name: "representations_list_details"
          type: "string"
          presentation: "fact"
          label: "Заверения"
          description: >
            Перечень заверений сторон. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "misrepresentation_remedies_details"
          type: "string"
          presentation: "fact"
          label: "Последствия недостоверности"
          description: >
            Последствия недостоверных заверений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: liability_cap_check
    name: "Ответственность сторон: неустойки, штрафы, лимиты ответственности"
    description: >
      Фактографическая проверка общего режима ответственности сторон:
      наличие неустоек и штрафов, ограничение ответственности (лимиты),
      исключение косвенных убытков, соотношение неустойки и убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность сторон"
        - "неустойка"
        - "штраф"
        - "пеня"
