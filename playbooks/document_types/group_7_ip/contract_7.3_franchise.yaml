        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Договор может быть изменён в установленном
              порядке" без конкретики.
              → presence = "present";
                amendment_procedure_status = "not_defined".
           б) Прямо указано, что односторонние изменения не допускаются.
              → presence = "present";
                unilateral_amendment_status = "not_defined";
                соответствующие поля содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые требования
           к форме изменений.
           → presence = "unclear";
             written_form_status = "not_defined";
             amendment_scope_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Порядок изменений, односторонние изменения и оговорка
           о поглощении описаны в одном разделе.
           → presence = "present";
             все соответствующие *_status = "defined";
             все *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendment_procedure_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * amendment_scope_details, unilateral_amendment_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendment_procedure_check_presence"
