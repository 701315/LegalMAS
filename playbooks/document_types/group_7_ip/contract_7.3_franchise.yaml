        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор условий:
        Фрагмент:
        "Франчайзер вправе проводить аудит финансовой отчётности Франчайзи
        не реже 1 раза в квартал с доступом к POS-терминалам. В случае
        ликвидации или смерти Франчайзи договор может быть переоформлен
