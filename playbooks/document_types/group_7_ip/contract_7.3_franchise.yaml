          "notices_procedure_status": "<defined / not_defined>",
          "notices_addresses_status": "<defined / not_defined>",
          "electronic_communication_status": "<defined / not_defined>",
          "delivery_moment_status": "<defined / not_defined>",
          "addresses_change_procedure_status": "<defined / not_defined>",
