          description: "Наличие регулирования по порядку изменения договора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка изменения договора. Внутреннее enum-поле."
          required: true

        - name: "written_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
