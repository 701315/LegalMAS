      - "(?i)индивидуальн[ыо]й\\s+предпринимател[ья]"
      - "(?i)коммерческ[а-яё]+\\s+организаци[яя]"
      - "(?i)юридическ[оеая]\\s+лиц[оо]"

  digital_systems:
    any_keywords:
      - "(?i)\\bCRM\\b"
      - "(?i)\\bPOS\\b"
      - "(?i)программн[оа]е\\s+обеспечени[ея]"
      - "(?i)личн[ыо]й\\s+кабинет"
      - "(?i)IT-?систем[аа]"
      - "(?i)информационн[а-яё]+\\s+систем[аа]"
      - "(?i)мобильн[оа]е\\s+приложени[ея]"
      - "(?i)сайт\\s+франчайз[ии]"
      - "(?i)интернет-?магазин"
      - "(?i)баз[аа]\\s+данн[ыо]х\\s+клиент[оо]в"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|USD|EUR|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  territory_pattern: "(?i)(территори[ия]|РФ|Российск[ая]\\s+Федераци[ия]|регион|город|область)"
  trademark_number: "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: franchise_subject_extraction
    name: "Стороны, комплекс исключительных прав и сфера деятельности"
    description: >
      Фактографическая проверка идентификации франчайзера и франчайзи,
      состава комплекса исключительных прав (обязательность товарного знака),
      сферы предпринимательской деятельности и регистрации товарного знака.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "франчайзер"
        - "франчайзи"
        - "комплекс исключительных прав"
        - "товарный знак"
        - "коммерческое обозначение"
        - "ноу-хау"
        - "секрет производства"
        - "сфера деятельности"
        - "предпринимательская деятельность"
        - "виды товаров"
        - "виды услуг"
        - "свидетельство"
        - "регистрационный номер"
        - "ООО"
        - "ИП"
        - "коммерческая организация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн\\w+\\s+знак\\s+№?\\s*\\d+"
        - "(?i)комплекс.*включает"
        - "(?i)(франчайзер|франчайзи).*именуем"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (франчайзинга)
        (Глава 54 ГК РФ, ст. 1027–1028).
        Проверяется только один вопрос: стороны, состав комплекса
        исключительных прав и сфера предпринимательской деятельности.

        Нормативный ориентир:
        - ст. 1027 ГК РФ — понятие договора коммерческой концессии
        - ст. 1028 ГК РФ — форма и регистрация договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Комплекс ОБЯЗАТЕЛЬНО должен включать товарный знак или
          коммерческое обозначение (п. 1 ст. 1027 ГК РФ).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Франчайзер (наименование, реквизиты, коммерческий статус).
        2. Франчайзи (наименование, реквизиты, коммерческий статус).
        3. Наличие товарного знака / коммерческого обозначения в комплексе.
        4. Регистрационный номер товарного знака.
        5. Наличие ноу-хау в комплексе.
        6. Иные объекты в комплексе (патенты, произведения, ПО).
        7. Сфера предпринимательской деятельности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        4. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null" или пустые строки.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 12 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — комплекс определён:
        Фрагмент:
        "Франчайзер — ООО «Бренд-Групп», ИНН 7707083893, предоставляет
        Франчайзи — ИП Иванову А.А., ОГРНИП 304770000123456, комплекс
        исключительных прав, включающий: товарный знак «ВкусноФФ»,
        свидетельство № 876543, зарегистрированный в Роспатенте 15.03.2020;
        ноу-хау (рецептуры, технологические карты); коммерческое обозначение.
        Сфера деятельности — общественное питание (кафе, рестораны)."

        Ответ:
        {
          "franchisor_details": "ООО «Бренд-Групп», ИНН 7707083893",
          "franchisee_details": "ИП Иванов А.А., ОГРНИП 304770000123456",
          "parties_commercial_status": "defined",
          "trademark_status": "defined",
          "trademark_registration_number": "876543",
          "knowhow_status": "defined",
          "knowhow_details": "рецептуры, технологические карты",
          "other_rights_status": "defined",
          "other_rights_details": "коммерческое обозначение",
          "business_sphere_status": "defined",
          "business_sphere_details": "общественное питание (кафе, рестораны)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Франчайзер — ООО «Бренд-Групп», ИНН 7707083893, предоставляет Франчайзи — ИП Иванову А.А. комплекс исключительных прав, включающий товарный знак «ВкусноФФ», свидетельство № 876543."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "franchisor_details": "Данные не определены",
          "franchisee_details": "Данные не определены",
          "parties_commercial_status": "not_defined",
          "trademark_status": "not_defined",
          "trademark_registration_number": "Данные не определены",
          "knowhow_status": "not_defined",
          "knowhow_details": "Данные не определены",
          "other_rights_status": "not_defined",
          "other_rights_details": "Данные не определены",
          "business_sphere_status": "not_defined",
          "business_sphere_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о франчайзере и франчайзи.
        2. Найди прямую цитату о товарном знаке с номером.
        3. Найди прямую цитату о ноу-хау.
        4. Найди прямую цитату о сфере деятельности.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "franchisor_details": "<текст или 'Данные не определены'>",
          "franchisee_details": "<текст или 'Данные не определены'>",
          "parties_commercial_status": "<defined / not_defined>",
          "trademark_status": "<defined / not_defined>",
          "trademark_registration_number": "<номер или 'Данные не определены'>",
          "knowhow_status": "<defined / not_defined>",
          "knowhow_details": "<текст или 'Данные не определены'>",
          "other_rights_status": "<defined / not_defined>",
          "other_rights_details": "<текст или 'Данные не определены'>",
          "business_sphere_status": "<defined / not_defined>",
          "business_sphere_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "франчайзер франчайзи комплекс исключительных прав товарный знак коммерческое обозначение ноу-хау секрет производства сфера деятельности предпринимательская деятельность виды товаров виды услуг свидетельство регистрационный номер"
      retrieval_profile: "license_scope_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "роялти"
        - "паушальный"
        - "рекламные отчисления"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "franchise_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора коммерческой концессии
        сведения о сторонах, составе комплекса исключительных прав и сфере
        предпринимательской деятельности.
        Не анализируй вознаграждение, территорию, контроль качества или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. franchise_subject_extraction_presence:
           Агрегатное signal-поле — наличие сведений о сторонах, комплексе
           исключительных прав и сфере деятельности.
           - "present" — если хотя бы одно из содержательных полей
             (parties_commercial_status, trademark_status, knowhow_status,
              other_rights_status, business_sphere_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - parties_commercial_status = "not_defined";
           - trademark_status = "not_defined";
           - knowhow_status = "not_defined";
           - other_rights_status = "not_defined";
           - business_sphere_status = "not_defined";
           - franchisor_details, franchisee_details = "Данные не определены";
           - trademark_registration_number = "Данные не определены";
           - knowhow_details, other_rights_details, business_sphere_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. franchisor_details:
           Наименование и краткие реквизиты франчайзера (правообладателя):
           организационно-правовая форма, наименование/ФИО, ИНН/ОГРН/ОГРНИП,
           если они прямо указаны. Не включай банковские реквизиты.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        2. franchisee_details:
           Наименование и краткие реквизиты франчайзи (пользователя) по тем же
           правилам, что и для франчайзера.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. parties_commercial_status:
           - "defined" — только если обе стороны прямо идентифицированы как
             коммерческие организации или ИП (для физлица без статуса ИП —
             "not_defined");
           - "not_defined" — иначе.

        4. trademark_status:
           - "defined" — если в комплексе прямо указан товарный знак
             (или знак обслуживания) либо коммерческое обозначение;
           - "not_defined" — если ни товарный знак, ни коммерческое обозначение
             прямо не указаны.

        5. trademark_registration_number:
           Регистрационный номер товарного знака (номер свидетельства),
           если прямо указан.
           Если не указан — "Данные не определены".
           Если указаны разные номера во фрагментах — "Не удалось определить".

        6. knowhow_status:
           - "defined" — если прямо указано ноу-хау / секрет производства
             в составе комплекса;
           - "not_defined" — иначе.

        7. knowhow_details:
           Краткое описание ноу-хау / секрета производства по тексту
           (например: "рецептуры, технологические карты", "база знаний,
           методики обучения").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. other_rights_status:
           - "defined" — если прямо указаны иные объекты в комплексе
             (патенты, произведения, ПО, коммерческое обозначение и др.);
           - "not_defined" — иначе.

        9. other_rights_details:
           Краткое перечисление иных объектов в комплексе.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. business_sphere_status:
            - "defined" — если прямо указана сфера предпринимательской
              деятельности франчайзи (виды товаров/услуг, отрасль);
            - "not_defined" — иначе.

        11. business_sphere_details:
            Краткое user-facing описание сферы предпринимательской
            деятельности франчайзи (например: "общественное питание
            (кафе, рестораны)", "розничная продажа одежды").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни franchise_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вознаграждении, территории, контроле качества, обучении, расторжении, субконцессии и иных нерелевантных темах.
        - Не смешивай сведения о франчайзере и франчайзи.
        - parties_commercial_status = "defined" только если обе стороны прямо идентифицированы как коммерческие организации или ИП.
        - trademark_status = "defined" только если товарный знак или коммерческое обозначение прямо указаны в комплексе.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни идентификации сторон, ни описания комплекса
           исключительных прав, ни сферы деятельности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Комплекс описан общими словами ("комплекс исключительных прав")
              без перечня объектов; стороны названы, но без реквизитов.
              → presence = "present"; соответствующие *_status = "defined"
                или "not_defined" по конкретике; соответствующие *_details
                = "Данные не определены".
           б) Прямо указано, что товарный знак или коммерческое обозначение
              не передаются.
              → presence = "present"; trademark_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные стороны, разные номера
           товарного знака или разные сферы деятельности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Отсылка на приложение / перечень.
           Комплекс исключительных прав определяется по приложению или
           перечню, прямо названному в договоре.
           → presence = "present";
             соответствующие *_status = "defined";
             *_details содержит формулировку вида
             "Согласно Приложению №1" / "По перечню объектов (Приложение №2)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для franchise_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * franchisor_details, franchisee_details → "Данные не определены";
          * trademark_registration_number → "Данные не определены";
          * knowhow_details, other_rights_details, business_sphere_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details и *_registration_number → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "franchise_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о сторонах, комплексе исключительных прав и сфере деятельности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "franchisor_details"
          type: "string"
          presentation: "fact"
          label: "Франчайзер"
          description: >
            Наименование и реквизиты франчайзера. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "franchisee_details"
          type: "string"
          presentation: "fact"
          label: "Франчайзи"
          description: >
            Наименование и реквизиты франчайзи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "parties_commercial_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения коммерческого статуса сторон. Внутреннее enum-поле."
          required: true

        - name: "trademark_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия товарного знака в комплексе. Внутреннее enum-поле."
          required: true

        - name: "trademark_registration_number"
          type: "string"
          presentation: "fact"
          label: "Номер ТЗ"
          description: >
            Регистрационный номер товарного знака. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "knowhow_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия ноу-хау в комплексе. Внутреннее enum-поле."
          required: true

        - name: "knowhow_details"
          type: "string"
          presentation: "fact"
          label: "Ноу-хау"
          description: >
            Описание ноу-хау. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "other_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус иных объектов в комплексе. Внутреннее enum-поле."
          required: true

        - name: "other_rights_details"
          type: "string"
          presentation: "fact"
          label: "Иные объекты"
          description: >
            Иные объекты в комплексе прав. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "business_sphere_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения сферы деятельности. Внутреннее enum-поле."
          required: true

        - name: "business_sphere_details"
          type: "string"
          presentation: "fact"
          label: "Сфера деятельности"
          description: >
            Сфера предпринимательской деятельности франчайзи. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: remuneration_structure_check
    name: "Структура вознаграждения: паушальный взнос, роялти, рекламные отчисления"
    description: >
      Фактографическая проверка всех компонентов вознаграждения франчайзера:
      паушальный взнос, роялти (ставка, база), рекламные отчисления,
      прочие платежи и порядок их уплаты.
    triggers:
      any:
        - lump_sum_payment
        - royalty_based
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение"
        - "паушальный взнос"
        - "роялти"
        - "рекламные отчисления"
        - "процент от выручки"
        - "франчайзинговый сбор"
        - "единовременный платёж"
        - "ежемесячные платежи"
        - "база расчёта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)паушальн\\w+.*?\\d[\\d\\s]*(?:рубл|руб|USD|EUR)"
        - "(?i)роялти.*?\\d+[.,]?\\d*\\s*%"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1030 ГК РФ).
        Проверяется только один вопрос: структура вознаграждения франчайзера.

        Нормативный ориентир:
        - ст. 1030 ГК РФ — вознаграждение по договору коммерческой концессии

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Паушальный (вступительный) взнос — размер и порядок уплаты.
        2. Роялти — ставка, база расчёта, периодичность.
        3. Рекламные отчисления — ставка и целевое назначение.
        4. Прочие платежи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Паушальный взнос — 500 000 рублей, уплачивается в течение 5 дней
        с даты подписания. Роялти — 5% от валовой выручки ежемесячно.
        Рекламные отчисления — 2% от выручки в рекламный фонд сети."

        Ответ:
        {
          "lump_sum_status": "defined",
          "lump_sum_details": "500 000 рублей, в течение 5 дней с даты подписания",
          "royalty_status": "defined",
          "royalty_rate": "5%",
          "royalty_base": "валовая выручка",
          "royalty_period": "ежемесячно",
          "advertising_fee_status": "defined",
          "advertising_fee_details": "2% от выручки в рекламный фонд сети",
          "other_payments_status": "not_defined",
          "other_payments_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 3.1", "quote": "Паушальный взнос — 500 000 рублей..."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи уплачивает вознаграждение в порядке, согласованном сторонами."

        Ответ:
        {
          "lump_sum_status": "not_defined",
          "lump_sum_details": "Данные не определены",
          "royalty_status": "not_defined",
          "royalty_rate": "Данные не определены",
          "royalty_base": "Данные не определены",
          "royalty_period": "Данные не определены",
          "advertising_fee_status": "not_defined",
          "advertising_fee_details": "Данные не определены",
          "other_payments_status": "not_defined",
          "other_payments_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о паушальном взносе.
        2. Найди прямую цитату о роялти (ставка, база, период).
        3. Найди прямую цитату о рекламных отчислениях.
        4. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "lump_sum_status": "<defined / not_defined>",
          "lump_sum_details": "<текст или 'Данные не определены'>",
          "royalty_status": "<defined / not_defined>",
          "royalty_rate": "<ставка или 'Данные не определены'>",
          "royalty_base": "<база или 'Данные не определены'>",
          "royalty_period": "<периодичность или 'Данные не определены'>",
          "advertising_fee_status": "<defined / not_defined>",
          "advertising_fee_details": "<текст или 'Данные не определены'>",
          "other_payments_status": "<defined / not_defined>",
          "other_payments_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вознаграждение паушальный взнос роялти рекламные отчисления процент от выручки франчайзинговый сбор единовременный платёж ежемесячные платежи база расчёта порядок уплаты"
      retrieval_profile: "royalty_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "территория"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "remuneration_structure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        структуру вознаграждения: паушальный взнос, роялти, рекламные отчисления,
        прочие платежи.
        Не анализируй комплекс прав, территорию, контроль качества или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. remuneration_structure_check_presence:
           Агрегатное signal-поле — наличие сведений о структуре вознаграждения.
           - "present" — если хотя бы одно из содержательных полей
             (lump_sum_status, royalty_status, advertising_fee_status,
              other_payments_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lump_sum_status = "not_defined";
           - royalty_status = "not_defined";
           - advertising_fee_status = "not_defined";
           - other_payments_status = "not_defined";
           - lump_sum_details, royalty_rate, royalty_base, royalty_period = "Данные не определены";
           - advertising_fee_details, other_payments_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. lump_sum_status:
           - "defined" — если прямо указан размер паушального (вступительного)
             взноса или прямо назван порядок его определения;
           - "not_defined" — иначе.

        2. lump_sum_details:
           Краткое user-facing описание паушального взноса: размер, валюта,
           порядок уплаты (например: "500 000 рублей, в течение 5 дней
           с даты подписания").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. royalty_status:
           - "defined" — если прямо указана ставка роялти, база его расчёта
             или периодичность платежа;
           - "not_defined" — иначе.

        4. royalty_rate:
           Ставка роялти по тексту (например: "5%", "100 000 руб./мес").
           Если не указана — "Данные не определены".
           Если противоречива — "Не удалось определить".

        5. royalty_base:
           База расчёта роялти (например: "валовая выручка", "оборот",
           "прибыль", "фиксированная сумма"). Кратко.
           Если не указана — "Данные не определены".
           Если противоречива — "Не удалось определить".

        6. royalty_period:
           Периодичность уплаты роялти (например: "ежемесячно",
           "ежеквартально", "ежегодно").
           Если не указана — "Данные не определены".
           Если противоречива — "Не удалось определить".

        7. advertising_fee_status:
           - "defined" — если прямо указаны рекламные отчисления (ставка
             и/или целевое назначение);
           - "not_defined" — иначе.

        8. advertising_fee_details:
           Краткое user-facing описание рекламных отчислений (например:
           "2% от выручки в рекламный фонд сети").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. other_payments_status:
           - "defined" — если прямо указаны прочие платежи помимо
             паушального взноса, роялти и рекламных отчислений
             (например: плата за обучение, за ПО, за аудит);
           - "not_defined" — иначе.

        10. other_payments_details:
            Краткое перечисление прочих платежей.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_structure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details / *_rate / *_base / *_period = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, территории, контроле качества, обучении, расторжении, субконцессии и иных нерелевантных темах.
        - Не смешивай паушальный взнос с роялти и рекламными отчислениями.
        - royalty_status = "defined" только если прямо указана хотя бы одна из характеристик: ставка, база или периодичность.
        - Если в разных фрагментах указаны разные суммы/ставки и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни паушального взноса, ни роялти, ни рекламных отчислений.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details / *_rate / *_base / *_period = "Данные не определены".

        2. Модель не раскрыта (общая фраза).
           "Вознаграждение уплачивается в порядке, согласованном сторонами"
           или "по согласованию сторон" без конкретики.
           → presence = "present";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры паушального взноса,
           разные ставки роялти или разные базы расчёта.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details / *_rate / *_base = "Не удалось определить".

        4. Комбинированная ситуация.
           Несколько компонентов вознаграждения описаны в одном пункте
           (паушальный взнос + роялти + рекламные отчисления).
           → presence = "present";
             все соответствующие *_status = "defined";
             все соответствующие *_details заполнены.

           Либо: в договоре прямо указано, что вознаграждение не взимается
           (безвозмездная модель).
           → presence = "present";
             все *_status = "not_defined";
             все *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_structure_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * lump_sum_details, royalty_rate, royalty_base, royalty_period,
            advertising_fee_details, other_payments_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details / *_rate / *_base / *_period → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_structure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о структуре вознаграждения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lump_sum_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус паушального взноса. Внутреннее enum-поле."
          required: true

        - name: "lump_sum_details"
          type: "string"
          presentation: "fact"
          label: "Паушальный взнос"
          description: >
            Размер и порядок уплаты паушального взноса. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "royalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус роялти. Внутреннее enum-поле."
          required: true

        - name: "royalty_rate"
          type: "string"
          presentation: "fact"
          label: "Ставка роялти"
          description: >
            Ставка роялти. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "royalty_base"
          type: "string"
          presentation: "fact"
          label: "База роялти"
          description: >
            База расчёта роялти. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "royalty_period"
          type: "string"
          presentation: "fact"
          label: "Периодичность роялти"
          description: >
            Периодичность уплаты роялти. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "advertising_fee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус рекламных отчислений. Внутреннее enum-поле."
          required: true

        - name: "advertising_fee_details"
          type: "string"
          presentation: "fact"
          label: "Рекламные отчисления"
          description: >
            Ставка и целевое назначение рекламных отчислений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "other_payments_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прочих платежей. Внутреннее enum-поле."
          required: true

        - name: "other_payments_details"
          type: "string"
          presentation: "fact"
          label: "Прочие платежи"
          description: >
            Прочие платежи по договору. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: territory_term_renewal_check
    name: "Территория, срок, эксклюзивность и преимущественное право на продление"
    description: >
      Фактографическая проверка территории использования, срока действия,
      территориальной эксклюзивности (защита от каннибализации) и условий
      продления / преимущественного права (ст. 1035 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "территория"
        - "срок действия"
        - "эксклюзивная территория"
        - "радиус защиты"
        - "запрет открытия точек"
        - "продление договора"
        - "преимущественное право"
        - "возобновление"
        - "новый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+обязуется\\s+не\\s+предоставлять.*на\\s+территории"
        - "(?i)территори\\w+.*эксклюзивн"
        - "(?i)франчайзи\\s+имеет\\s+преимущественное\\s+право"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1035 ГК РФ).
        Проверяется только один вопрос: территория, срок, эксклюзивность
        и продление договора.

        Нормативный ориентир:
        - ст. 1035 ГК РФ — преимущественное право на заключение договора на новый срок

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Территория использования комплекса прав.
        2. Эксклюзивность территории (запрет франчайзеру открывать точки /
           выдавать франшизы другим на этой территории).
        3. Радиус защиты.
        4. Срок действия договора.
        5. Преимущественное право франчайзи на продление.
        6. Условия и порядок продления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Территория использования — г. Екатеринбург. Франчайзер обязуется
        не предоставлять права другим лицам и не открывать собственные точки
        в радиусе 3 км от точки Франчайзи. Срок договора — 5 лет.
        Франчайзи имеет преимущественное право на продление при соблюдении
        стандартов сети. Уведомление о продлении — за 6 месяцев."

        Ответ:
        {
          "territory_status": "defined",
          "territory_details": "г. Екатеринбург",
          "territory_exclusive_status": "defined",
          "territory_exclusive_details": "не предоставлять права другим лицам и не открывать собственные точки в радиусе 3 км",
          "term_status": "defined",
          "term_details": "5 лет",
          "renewal_right_status": "defined",
          "renewal_right_details": "преимущественное право при соблюдении стандартов, уведомление за 6 месяцев",
          "evidence": [{"clause_ref": "п. 2.1", "quote": "Территория использования — г. Екатеринбург."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует комплекс прав в предпринимательской деятельности."

        Ответ:
        {
          "territory_status": "not_defined",
          "territory_details": "Данные не определены",
          "territory_exclusive_status": "not_defined",
          "territory_exclusive_details": "Данные не определены",
          "term_status": "not_defined",
          "term_details": "Данные не определены",
          "renewal_right_status": "not_defined",
          "renewal_right_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о территории.
        2. Найди прямую цитату об эксклюзивности / радиусе защиты.
        3. Найди прямую цитату о сроке.
        4. Найди прямую цитату о продлении / преимущественном праве.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "territory_status": "<defined / not_defined>",
          "territory_details": "<текст или 'Данные не определены'>",
          "territory_exclusive_status": "<defined / not_defined>",
          "territory_exclusive_details": "<текст или 'Данные не определены'>",
          "term_status": "<defined / not_defined>",
          "term_details": "<текст или 'Данные не определены'>",
          "renewal_right_status": "<defined / not_defined>",
          "renewal_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "территория срок действия эксклюзивная территория радиус защиты запрет открытия точек монопольное право на территории продление договора преимущественное право возобновление новый срок условия продления уведомление о продлении"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "territory_term_renewal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        территорию, срок, эксклюзивность и условия продления.
        Не анализируй комплекс прав, вознаграждение, контроль качества или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. territory_term_renewal_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (territory_status, territory_exclusive_status,
              term_status, renewal_right_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - territory_status = "not_defined";
           - territory_exclusive_status = "not_defined";
           - term_status = "not_defined";
           - renewal_right_status = "not_defined";
           - territory_details, territory_exclusive_details,
             term_details, renewal_right_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. territory_status:
           - "defined" — если прямо указана территория использования
             (город, регион, адрес, район);
           - "not_defined" — иначе.

        2. territory_details:
           Краткое user-facing описание территории (например:
           "г. Екатеринбург", "г. Москва, ЦАО", "Краснодарский край").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. territory_exclusive_status:
           - "defined" — если прямо указана эксклюзивность территории
             для франчайзи (запрет франчайзеру открывать собственные точки
             или предоставлять права другим лицам на этой территории),
             либо прямо указан радиус защиты;
           - "not_defined" — если эксклюзивность прямо не установлена
             или по тексту не следует.

        4. territory_exclusive_details:
           Краткое user-facing описание эксклюзивности и радиуса защиты
           (например: "не предоставлять права другим лицам и не открывать
           собственные точки в радиусе 3 км").
           Если эксклюзивность прямо исключена — приведи дословную
           формулировку исключения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. term_status:
           - "defined" — если прямо указан срок действия договора
             (в годах, месяцах, датами) или указано, что договор
             бессрочный;
           - "not_defined" — иначе.

        6. term_details:
           Краткое user-facing описание срока (например: "5 лет",
           "с 01.01.2025 по 31.12.2029", "бессрочный").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. renewal_right_status:
           - "defined" — если прямо указано преимущественное право
             франчайзи на заключение договора на новый срок,
             либо прямо описаны условия и порядок продления;
           - "not_defined" — если в тексте договора об этом прямо
             не сказано.

        8. renewal_right_details:
           Краткое user-facing описание преимущественного права
           и условий продления (например: "преимущественное право
           при соблюдении стандартов сети, уведомление за 6 месяцев").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни territory_term_renewal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи преимущественное право из нормы ст. 1035 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, контроле качества, обучении, расторжении, субконцессии и иных нерелевантных темах.
        - territory_exclusive_status = "defined" только при прямом указании эксклюзивности, запрета на открытие точек франчайзера или радиуса защиты.
        - Если в разных фрагментах указаны разные территории, сроки или условия продления и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни территории, ни срока, ни эксклюзивности,
           ни условий продления.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           а) Территория указана общими словами ("на территории Российской
              Федерации") без конкретики — territory_status = "defined",
              territory_details = "Российская Федерация".
           б) Эксклюзивность прямо исключена ("Франчайзер вправе открывать
              собственные точки без ограничений").
              → presence = "present";
                territory_exclusive_status = "not_defined";
                territory_exclusive_details содержит дословную формулировку
                исключения.
           в) Срок не указан, но договор содержит иные условия темы.
              → term_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные территории, разные сроки
           или противоречивые условия эксклюзивности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Продление через механизм пролонгации.
           Указано, что договор автоматически продлевается на тот же срок,
           если ни одна из сторон не заявит о прекращении за N дней.
           → presence = "present";
             renewal_right_status = "defined";
             renewal_right_details содержит описание механизма
             (срок, порядок уведомления).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для territory_term_renewal_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * territory_details, territory_exclusive_details,
            term_details, renewal_right_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "territory_term_renewal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по территории, сроку, эксклюзивности и продлению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "territory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения территории. Внутреннее enum-поле."
          required: true

        - name: "territory_details"
          type: "string"
          presentation: "fact"
          label: "Территория"
          description: >
            Территория использования комплекса прав. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "territory_exclusive_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус эксклюзивности территории. Внутреннее enum-поле."
          required: true

        - name: "territory_exclusive_details"
          type: "string"
          presentation: "fact"
          label: "Эксклюзивность территории"
          description: >
            Условия эксклюзивности и радиус защиты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока. Внутреннее enum-поле."
          required: true

        - name: "term_details"
          type: "string"
          presentation: "fact"
          label: "Срок действия"
          description: >
            Срок действия договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "renewal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус преимущественного права на продление. Внутреннее enum-поле."
          required: true

        - name: "renewal_right_details"
          type: "string"
          presentation: "fact"
          label: "Продление"
          description: >
            Условия продления и преимущественное право. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: quality_control_training_check
    name: "Контроль качества, инспекции, обучение и поддержка (ст. 1031, 1034 ГК РФ)"
    description: >
      Фактографическая проверка права франчайзера на контроль качества и инспекции,
      обязанности по обучению и консультационной поддержке (ст. 1031 ГК РФ),
      а также субсидиарной ответственности за качество (ст. 1034 ГК РФ).
    triggers:
      any:
        - quality_control_clause
        - training_support_clause
        - liability_for_quality
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "контроль качества"
        - "инспекции"
        - "проверки точек"
        - "соблюдение стандартов"
        - "аудит качества"
        - "тайный покупатель"
        - "обучение"
        - "первоначальное обучение"
        - "тренинг"
        - "консультационная поддержка"
        - "техническое содействие"
        - "помощь в открытии"
        - "маркетинговая поддержка"
        - "субсидиарная ответственность"
        - "ответственность за качество"
        - "претензии потребителей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+вправе\\s+проводить\\s+проверки"
        - "(?i)франчайзи\\s+обязан\\s+допускать.*для\\s+инспекции"
        - "(?i)франчайзер\\s+обязуется\\s+оказывать.*поддержк"
        - "(?i)франчайзер\\s+несёт\\s+субсидиарную"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1031, 1034 ГК РФ).
        Проверяется только один вопрос: контроль качества, обучение, поддержка
        и субсидиарная ответственность франчайзера.

        Нормативный ориентир:
        - ст. 1031 ГК РФ — обязанности франчайзера (контроль, содействие)
        - ст. 1034 ГК РФ — субсидиарная ответственность франчайзера

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право франчайзера на контроль качества и инспекции.
        2. Периодичность инспекций.
        3. Право доступа к точкам франчайзи.
        4. Обязанность франчайзера по первоначальному обучению.
        5. Постоянная консультационная поддержка.
        6. Помощь в открытии точки.
        7. Маркетинговая поддержка.
        8. Субсидиарная ответственность франчайзера за качество.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 13 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер вправе проводить инспекции точек Франчайзи не реже 1 раза
        в квартал. Франчайзер обеспечивает первоначальное обучение персонала
        (5 дней) и постоянную консультационную поддержку. Франчайзер несёт
        субсидиарную ответственность по требованиям потребителей к качеству."

        Ответ:
        {
          "quality_control_status": "defined",
          "quality_control_details": "инспекции не реже 1 раза в квартал",
          "initial_training_status": "defined",
          "initial_training_details": "первоначальное обучение персонала (5 дней)",
          "ongoing_support_status": "defined",
          "ongoing_support_details": "постоянная консультационная поддержка",
          "opening_assistance_status": "not_defined",
          "opening_assistance_details": "Данные не определены",
          "marketing_support_status": "not_defined",
          "marketing_support_details": "Данные не определены",
          "subsidiary_liability_status": "defined",
          "subsidiary_liability_details": "субсидиарная ответственность по требованиям потребителей к качеству",
          "evidence": [{"clause_ref": "п. 4.1", "quote": "Франчайзер вправе проводить инспекции точек Франчайзи не реже 1 раза в квартал."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует комплекс прав самостоятельно."

        Ответ:
        {
          "quality_control_status": "not_defined",
          "quality_control_details": "Данные не определены",
          "initial_training_status": "not_defined",
          "initial_training_details": "Данные не определены",
          "ongoing_support_status": "not_defined",
          "ongoing_support_details": "Данные не определены",
          "opening_assistance_status": "not_defined",
          "opening_assistance_details": "Данные не определены",
          "marketing_support_status": "not_defined",
          "marketing_support_details": "Данные не определены",
          "subsidiary_liability_status": "not_defined",
          "subsidiary_liability_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о контроле качества и инспекциях.
        2. Найди прямую цитату об обучении.
        3. Найди прямую цитату о поддержке.
        4. Найди прямую цитату о субсидиарной ответственности.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quality_control_status": "<defined / not_defined>",
          "quality_control_details": "<текст или 'Данные не определены'>",
          "initial_training_status": "<defined / not_defined>",
          "initial_training_details": "<текст или 'Данные не определены'>",
          "ongoing_support_status": "<defined / not_defined>",
          "ongoing_support_details": "<текст или 'Данные не определены'>",
          "opening_assistance_status": "<defined / not_defined>",
          "opening_assistance_details": "<текст или 'Данные не определены'>",
          "marketing_support_status": "<defined / not_defined>",
          "marketing_support_details": "<текст или 'Данные не определены'>",
          "subsidiary_liability_status": "<defined / not_defined>",
          "subsidiary_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
