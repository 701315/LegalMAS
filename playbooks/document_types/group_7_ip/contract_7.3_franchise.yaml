    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "quality_control_training_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия контроля качества, обучения, поддержки и субсидиарной
        ответственности франчайзера.
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. quality_control_training_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (quality_control_status, initial_training_status,
              ongoing_support_status, opening_assistance_status,
              marketing_support_status, subsidiary_liability_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - quality_control_details, initial_training_details,
             ongoing_support_details, opening_assistance_details,
             marketing_support_details, subsidiary_liability_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. quality_control_status:
           - "defined" — если прямо указано право франчайзера на контроль
             качества, инспекции, проверки соблюдения стандартов, аудит;
           - "not_defined" — иначе.

        2. quality_control_details:
           Краткое user-facing описание права контроля и инспекций
           (например: "инспекции не реже 1 раза в квартал", "право проверки
           соблюдения стандартов без предварительного уведомления").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. initial_training_status:
           - "defined" — если прямо указана обязанность франчайзера провести
             первоначальное обучение франчайзи и/или его персонала;
           - "not_defined" — иначе.

        4. initial_training_details:
           Краткое описание первоначального обучения (объём, срок, формат).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. ongoing_support_status:
           - "defined" — если прямо указана постоянная консультационная,
             техническая или иная поддержка со стороны франчайзера;
           - "not_defined" — иначе.

        6. ongoing_support_details:
           Краткое описание постоянной поддержки.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. opening_assistance_status:
           - "defined" — если прямо указана помощь в открытии точки
             (подбор помещения, обучение на старте, поддержка запуска);
           - "not_defined" — иначе.

        8. opening_assistance_details:
           Краткое описание помощи в открытии.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. marketing_support_status:
           - "defined" — если прямо указана маркетинговая поддержка
             (реклама, промо, брендинг, маркетинговые материалы);
           - "not_defined" — иначе.

        10. marketing_support_details:
            Краткое описание маркетинговой поддержки.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. subsidiary_liability_status:
            - "defined" — если прямо указана субсидиарная ответственность
              франчайзера по требованиям к качеству товаров/услуг франчайзи
              (в т.ч. перед потребителями), либо иная прямая формулировка
              ответственности франчайзера за качество;
            - "not_defined" — если прямого указания нет.

        12. subsidiary_liability_details:
            Краткое user-facing описание субсидиарной ответственности
            (например: "субсидиарная ответственность по требованиям
            потребителей к качеству").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_control_training_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи обязанность обучения или субсидиарную ответственность из норм ст. 1031 и 1034 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, расторжении, субконцессии и иных нерелевантных темах.
        - Не смешивай право контроля качества с обязанностью поддержки.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни контроля качества, ни обучения, ни поддержки,
           ни субсидиарной ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы или прямое исключение.
           а) Общая фраза: "Франчайзер оказывает содействие" без конкретики.
              → presence = "present";
                соответствующие *_status = "not_defined";
                соответствующие *_details = "Данные не определены".
           б) Прямо указано, что франчайзер не несёт ответственности
              за качество товаров франчайзи.
              → presence = "present";
                subsidiary_liability_status = "not_defined";
                subsidiary_liability_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           контроля, обучения или ответственности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Комбинированная ситуация — несколько условий в одном пункте.
           Несколько условий темы описаны в одном пункте договора
           (например, контроль качества + обучение + поддержка).
           → presence = "present";
             все соответствующие *_status = "defined";
             все соответствующие *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_control_training_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_control_training_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по контролю качества, обучению, поддержке и субсидиарной ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "quality_control_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права контроля качества. Внутреннее enum-поле."
          required: true

        - name: "quality_control_details"
          type: "string"
          presentation: "fact"
          label: "Контроль качества"
          description: >
            Право контроля качества и инспекций. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "initial_training_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус первоначального обучения. Внутреннее enum-поле."
          required: true

        - name: "initial_training_details"
          type: "string"
          presentation: "fact"
          label: "Первоначальное обучение"
          description: >
            Условия первоначального обучения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "ongoing_support_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус постоянной поддержки. Внутреннее enum-поле."
          required: true

        - name: "ongoing_support_details"
          type: "string"
          presentation: "fact"
          label: "Постоянная поддержка"
          description: >
            Условия постоянной консультационной поддержки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "opening_assistance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус помощи в открытии. Внутреннее enum-поле."
          required: true

        - name: "opening_assistance_details"
          type: "string"
          presentation: "fact"
          label: "Помощь в открытии"
          description: >
            Условия помощи в открытии точки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "marketing_support_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус маркетинговой поддержки. Внутреннее enum-поле."
          required: true

        - name: "marketing_support_details"
          type: "string"
          presentation: "fact"
          label: "Маркетинговая поддержка"
          description: >
            Условия маркетинговой поддержки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "subsidiary_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус субсидиарной ответственности. Внутреннее enum-поле."
          required: true

        - name: "subsidiary_liability_details"
          type: "string"
          presentation: "fact"
          label: "Субсидиарная ответственность"
          description: >
            Условия субсидиарной ответственности франчайзера. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: knowhow_confidentiality_check
    name: "Защита ноу-хау и конфиденциальности (ст. 1032, 1469 ГК РФ)"
    description: >
      Фактографическая проверка условий о неразглашении ноу-хау,
      сроке конфиденциальности, пост-контрактных ограничениях
      и санкциях за разглашение.
    triggers:
      any:
        - knowhow_transfer
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ноу-хау"
        - "секрет производства"
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "запрет раскрытия"
        - "ответственность за разглашение"
        - "NDA"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+обязуется\\s+не\\s+разглашать"
        - "(?i)конфиденциальность.*после\\s+прекращения"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1032, 1469 ГК РФ).
        Проверяется только один вопрос: защита ноу-хау и конфиденциальность.

        Нормативный ориентир:
        - ст. 1032 ГК РФ — обязанности франчайзи (неразглашение)
        - ст. 1469 ГК РФ — срок действия исключительного права на ноу-хау

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязательство неразглашения ноу-хау.
        2. Срок конфиденциальности (включая пост-контрактный период).
        3. Запрет использования ноу-хау для конкурирующего бизнеса.
        4. Санкции за разглашение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзи обязуется не разглашать ноу-хау и коммерческую тайну
        Франчайзера в течение срока действия договора и 5 лет после его
        прекращения. Запрещается использовать ноу-хау для конкурирующего
        бизнеса. Штраф за разглашение — 5 000 000 рублей."

        Ответ:
        {
          "confidentiality_status": "defined",
          "confidentiality_details": "не разглашать ноу-хау и коммерческую тайну",
          "confidentiality_period_status": "defined",
          "confidentiality_period_details": "в течение срока действия договора и 5 лет после прекращения",
          "competing_use_prohibition_status": "defined",
          "competing_use_prohibition_details": "запрещается использовать ноу-хау для конкурирующего бизнеса",
          "disclosure_sanctions_status": "defined",
          "disclosure_sanctions_details": "штраф 5 000 000 рублей",
          "evidence": [{"clause_ref": "п. 5.1", "quote": "Франчайзи обязуется не разглашать ноу-хау и коммерческую тайну Франчайзера."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует ноу-хау в деятельности."

        Ответ:
        {
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "confidentiality_period_status": "not_defined",
          "confidentiality_period_details": "Данные не определены",
          "competing_use_prohibition_status": "not_defined",
          "competing_use_prohibition_details": "Данные не определены",
          "disclosure_sanctions_status": "not_defined",
          "disclosure_sanctions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о неразглашении.
        2. Найди прямую цитату о сроке конфиденциальности.
        3. Найди прямую цитату о запрете конкурирующего использования.
        4. Найди прямую цитату о санкциях.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_details": "<текст или 'Данные не определены'>",
          "confidentiality_period_status": "<defined / not_defined>",
          "confidentiality_period_details": "<текст или 'Данные не определены'>",
          "competing_use_prohibition_status": "<defined / not_defined>",
          "competing_use_prohibition_details": "<текст или 'Данные не определены'>",
          "disclosure_sanctions_status": "<defined / not_defined>",
          "disclosure_sanctions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ноу-хау секрет производства конфиденциальность неразглашение коммерческая тайна запрет раскрытия ответственность за разглашение NDA запрет использования для конкурирующего бизнеса штраф за разглашение срок конфиденциальности после прекращения"
      retrieval_profile: "confidentiality_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия договора"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "knowhow_confidentiality_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия защиты ноу-хау: неразглашение, срок конфиденциальности,
        запрет конкурирующего использования, санкции за разглашение.
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. knowhow_confidentiality_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (confidentiality_status, confidentiality_period_status,
              competing_use_prohibition_status, disclosure_sanctions_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - confidentiality_status = "not_defined";
           - confidentiality_period_status = "not_defined";
           - competing_use_prohibition_status = "not_defined";
           - disclosure_sanctions_status = "not_defined";
           - confidentiality_details, confidentiality_period_details,
             competing_use_prohibition_details, disclosure_sanctions_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. confidentiality_status:
           - "defined" — если прямо указана обязанность франчайзи
             не разглашать ноу-хау / секрет производства / коммерческую
             тайну франчайзера;
           - "not_defined" — иначе.

        2. confidentiality_details:
           Краткое user-facing описание обязательства неразглашения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. confidentiality_period_status:
           - "defined" — если прямо указан срок конфиденциальности,
             включая пост-контрактный период;
           - "not_defined" — иначе.

        4. confidentiality_period_details:
           Краткое user-facing описание срока конфиденциальности
           (например: "в течение срока действия договора и 5 лет
           после прекращения").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. competing_use_prohibition_status:
           - "defined" — если прямо указан запрет использования ноу-хау
             для конкурирующего бизнеса, а также иные аналогичные
             ограничения (не открывать конкурирующие точки, не передавать
             ноу-хау третьим лицам);
           - "not_defined" — иначе.

        6. competing_use_prohibition_details:
           Краткое user-facing описание запрета конкурирующего
           использования.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. disclosure_sanctions_status:
           - "defined" — если прямо указаны санкции за разглашение
             (штраф, неустойка, право на расторжение, возмещение убытков);
           - "not_defined" — если прямого указания нет.

        8. disclosure_sanctions_details:
           Краткое user-facing описание санкций за разглашение
           (например: "штраф 5 000 000 рублей").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни knowhow_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи обязанность неразглашения или её срок из ст. 1032, 1469 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке договора, контроле качества, обучении, расторжении, субконцессии и иных нерелевантных темах.
        - Не смешивай обязательство неразглашения со сроком конфиденциальности.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязательства неразглашения, ни срока
           конфиденциальности, ни запрета конкурирующего использования,
           ни санкций за разглашение.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзи обязуется соблюдать
              конфиденциальность" без указания предмета и срока.
              → presence = "present";
                confidentiality_status = "defined";
                confidentiality_period_status = "not_defined".
           б) Прямо указано, что ноу-хау или отдельные сведения
              не являются конфиденциальными (публично доступны).
              → presence = "present";
                confidentiality_status = "not_defined";
                confidentiality_details содержит дословную формулировку
                исключения.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки
           конфиденциальности или противоречивые условия о санкциях.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Отсылка на отдельное соглашение / NDA.
           Указано, что условия конфиденциальности регулируются отдельным
           NDA или приложением, прямо названным в договоре.
           → presence = "present";
             confidentiality_status = "defined";
             confidentiality_details содержит формулировку вида
             "Согласно NDA (Приложение №3)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для knowhow_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "knowhow_confidentiality_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по защите ноу-хау и конфиденциальности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязательства неразглашения. Внутреннее enum-поле."
          required: true

        - name: "confidentiality_details"
          type: "string"
          presentation: "fact"
          label: "Неразглашение"
          description: >
            Обязательство неразглашения ноу-хау. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "confidentiality_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока конфиденциальности. Внутреннее enum-поле."
          required: true

        - name: "confidentiality_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок конфиденциальности"
          description: >
            Срок конфиденциальности, включая пост-контрактный. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "competing_use_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета конкурирующего использования. Внутреннее enum-поле."
          required: true

        - name: "competing_use_prohibition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет конкурирующего использования"
          description: >
            Запрет использования ноу-хау для конкурирующего бизнеса. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "disclosure_sanctions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус санкций за разглашение. Внутреннее enum-поле."
          required: true

        - name: "disclosure_sanctions_details"
          type: "string"
          presentation: "fact"
          label: "Санкции за разглашение"
          description: >
            Санкции за разглашение ноу-хау. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: termination_rebranding_check
    name: "Расторжение, ребрендинг и пост-контрактные обязательства"
    description: >
      Фактографическая проверка оснований и порядка досрочного расторжения,
      обязательств по ребрендингу (демонтаж вывесок, удаление из интернета),
      неконкуренции и возврата материалов после прекращения договора.
    triggers:
      any:
        - post_termination_obligations
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "досрочное прекращение"
        - "отказ от договора"
        - "основания расторжения"
        - "ребрендинг"
        - "демонтаж вывесок"
        - "прекращение использования бренда"
        - "удаление из интернета"
        - "срок на ребрендинг"
        - "неконкуренция"
        - "возврат материалов"
        - "запрет конкурирующей деятельности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+течение\\s+\\d+\\s+дней.*демонтировать"
        - "(?i)прекратить\\s+использование.*товарного\\s+знака"
        - "(?i)после\\s+прекращения.*франчайзи\\s+обязан"
        - "(?i)неконкуренция.*в\\s+течение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1037, 1040 ГК РФ).
        Проверяется только один вопрос: расторжение, ребрендинг и
        пост-контрактные обязательства.

        Нормативный ориентир:
        - ст. 1037 ГК РФ — прекращение договора коммерческой концессии
        - ст. 1040 ГК РФ — последствия прекращения договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания досрочного расторжения для каждой стороны.
        2. Срок на устранение нарушений (cure period).
        3. Обязанность ребрендинга и срок.
        4. Демонтаж вывесок и удаление из интернета.
        5. Неконкуренция (срок, территория).
        6. Возврат материалов франчайзера.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер вправе расторгнуть договор при нарушении стандартов качества.
        Срок на устранение нарушений — 30 дней. После прекращения Франчайзи обязан в течение
        30 дней демонтировать вывески, удалить упоминания бренда из интернета,
        вернуть все материалы. Запрет конкурирующей деятельности — 2 года
        на территории договора."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "при нарушении стандартов качества",
          "cure_period_status": "defined",
          "cure_period_details": "30 дней",
          "rebranding_status": "defined",
          "rebranding_details": "в течение 30 дней демонтировать вывески, удалить упоминания бренда из интернета",
          "non_compete_status": "defined",
          "non_compete_details": "2 года на территории договора",
          "materials_return_status": "defined",
          "materials_return_details": "вернуть все материалы",
          "evidence": [{"clause_ref": "п. 8.1", "quote": "Франчайзер вправе расторгнуть договор при нарушении стандартов качества."}]
        }

        Пример 2:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "по соглашению сторон",
          "cure_period_status": "not_defined",
          "cure_period_details": "Данные не определены",
          "rebranding_status": "not_defined",
          "rebranding_details": "Данные не определены",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "materials_return_status": "not_defined",
          "materials_return_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 8.1", "quote": "Договор может быть расторгнут по соглашению сторон."}]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату о сроке на устранение нарушений.
        3. Найди прямую цитату о ребрендинге и сроке.
        4. Найди прямую цитату о неконкуренции.
        5. Найди прямую цитату о возврате материалов.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "cure_period_status": "<defined / not_defined>",
          "cure_period_details": "<текст или 'Данные не определены'>",
          "rebranding_status": "<defined / not_defined>",
          "rebranding_details": "<текст или 'Данные не определены'>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "materials_return_status": "<defined / not_defined>",
          "materials_return_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение досрочное прекращение отказ от договора основания расторжения последствия расторжения срок на устранение нарушений ребрендинг демонтаж вывесок прекращение использования бренда удаление из интернета срок на ребрендинг неконкуренция возврат материалов запрет конкурирующей деятельности после прекращения"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "субконцессия"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "termination_rebranding_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия расторжения, ребрендинга и пост-контрактных обязательств.
        Не анализируй комплекс прав, вознаграждение, территорию или контроль качества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_rebranding_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_status, cure_period_status,
              rebranding_status, non_compete_status,
              materials_return_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_grounds_status = "not_defined";
           - cure_period_status = "not_defined";
           - rebranding_status = "not_defined";
           - non_compete_status = "not_defined";
           - materials_return_status = "not_defined";
           - termination_grounds_details, cure_period_details,
             rebranding_details, non_compete_details,
             materials_return_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_grounds_status:
           - "defined" — если прямо указаны основания досрочного расторжения
             договора хотя бы для одной стороны (нарушение условий,
             существенное нарушение, немотивированный отказ и т.п.);
           - "not_defined" — иначе.

        2. termination_grounds_details:
           Краткое user-facing описание оснований расторжения
           (например: "при нарушении стандартов качества",
           "при существенном нарушении условий", "по соглашению сторон").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. cure_period_status:
           - "defined" — если прямо указан срок на устранение нарушений
             (cure period) перед расторжением;
           - "not_defined" — иначе.

        4. cure_period_details:
           Краткое user-facing описание срока на устранение нарушений
           (например: "30 дней").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. rebranding_status:
           - "defined" — если прямо указана обязанность ребрендинга
             после прекращения договора: демонтаж вывесок, удаление
             упоминаний бренда из интернета, прекращение использования
             товарного знака и т.п., включая сроки;
           - "not_defined" — иначе.

        6. rebranding_details:
           Краткое user-facing описание обязанности и срока ребрендинга
           (например: "в течение 30 дней демонтировать вывески, удалить
           упоминания бренда из интернета").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. non_compete_status:
           - "defined" — если прямо указан запрет конкурирующей
             деятельности после прекращения договора (неконкуренция),
             включая срок и/или территорию;
           - "not_defined" — иначе.

        8. non_compete_details:
           Краткое user-facing описание неконкуренции
           (например: "2 года на территории договора").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. materials_return_status:
           - "defined" — если прямо указана обязанность вернуть материалы
             франчайзера после прекращения договора;
           - "not_defined" — иначе.

        10. materials_return_details:
            Краткое user-facing описание обязанности возврата материалов.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_rebranding_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи последствия расторжения из норм ст. 1037, 1040 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, контроле качества, обучении, субконцессии, конфиденциальности и иных нерелевантных темах.
        - Не смешивай основания расторжения со сроком на устранение нарушений.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оснований расторжения, ни срока на устранение
           нарушений, ни ребрендинга, ни неконкуренции, ни возврата материалов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Договор может быть расторгнут в порядке,
              предусмотренном законом", без конкретных оснований.
              → presence = "present";
                termination_grounds_status = "not_defined".
           б) Прямо указано, что после прекращения франчайзи не несёт
              пост-контрактных ограничений (в т.ч. неконкуренции).
              → presence = "present";
                non_compete_status = "not_defined";
                non_compete_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки cure period,
           разные сроки ребрендинга или противоречивые условия неконкуренции.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Соглашение сторон как основание расторжения.
           Указано, что договор может быть расторгнут по соглашению сторон
           (без указания иных оснований).
           → presence = "present";
             termination_grounds_status = "defined";
             termination_grounds_details = "по соглашению сторон".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_rebranding_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_rebranding_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по расторжению, ребрендингу и пост-контрактным обязательствам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения. Внутреннее enum-поле."
          required: true

        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: >
            Основания досрочного расторжения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "cure_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока на устранение нарушений. Внутреннее enum-поле."
          required: true

        - name: "cure_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок на устранение нарушений"
          description: >
            Срок на устранение нарушений перед расторжением. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "rebranding_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности ребрендинга. Внутреннее enum-поле."
          required: true

        - name: "rebranding_details"
          type: "string"
          presentation: "fact"
          label: "Ребрендинг"
          description: >
            Обязанность и срок ребрендинга, демонтаж вывесок. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неконкуренции. Внутреннее enum-поле."
          required: true

        - name: "non_compete_details"
          type: "string"
          presentation: "fact"
          label: "Неконкуренция"
          description: >
            Условия неконкуренции (срок, территория). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "materials_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус возврата материалов. Внутреннее enum-поле."
          required: true

        - name: "materials_return_details"
          type: "string"
          presentation: "fact"
          label: "Возврат материалов"
          description: >
            Обязанность возврата материалов франчайзера. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: subfranchising_check
    name: "Субконцессия (субфранчайзинг): допустимость, согласие, контроль (ст. 1029 ГК РФ)"
    description: >
      Фактографическая проверка условий субконцессии: допустимость,
      обязательность согласия франчайзера, критерии одобрения,
      ответственность франчайзи за субфранчайзи.
    triggers:
      any:
        - subfranchising_allowed
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субконцессия"
        - "субфранчайзинг"
        - "согласие на субконцессию"
        - "мастер-франчайзи"
        - "контроль субфранчайзи"
        - "субфраншиза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субконцессия.*только\\s+с\\s+согласия"
        - "(?i)франчайзер\\s+вправе\\s+одобрять"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1029 ГК РФ).
        Проверяется только один вопрос: условия субконцессии.

        Нормативный ориентир:
        - ст. 1029 ГК РФ — субконцессия

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Разрешена или запрещена субконцессия.
        2. Требуется ли письменное согласие франчайзера.
        3. Критерии одобрения субфранчайзи.
        4. Ответственность франчайзи за субфранчайзи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Субконцессия допускается только с письменного согласия Франчайзера.
        Франчайзи несёт ответственность за действия субфранчайзи как за свои."

        Ответ:
        {
          "subfranchising_status": "defined",
          "subfranchising_regime": "allowed_with_consent",
          "consent_required_status": "defined",
          "consent_required_details": "письменное согласие Франчайзера",
          "approval_criteria_status": "not_defined",
          "approval_criteria_details": "Данные не определены",
          "liability_for_subfranchisee_status": "defined",
          "liability_for_subfranchisee_details": "несёт ответственность за действия субфранчайзи как за свои",
          "evidence": [{"clause_ref": "п. 6.1", "quote": "Субконцессия допускается только с письменного согласия Франчайзера."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует комплекс прав самостоятельно."

        Ответ:
        {
          "subfranchising_status": "not_defined",
          "subfranchising_regime": "not_defined",
          "consent_required_status": "not_defined",
          "consent_required_details": "Данные не определены",
          "approval_criteria_status": "not_defined",
          "approval_criteria_details": "Данные не определены",
          "liability_for_subfranchisee_status": "not_defined",
          "liability_for_subfranchisee_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о субконцессии.
        2. Найди прямую цитату о согласии.
        3. Найди прямую цитату об ответственности.
        4. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subfranchising_status": "<defined / not_defined>",
          "subfranchising_regime": "<allowed / prohibited / allowed_with_consent / not_defined>",
          "consent_required_status": "<defined / not_defined>",
          "consent_required_details": "<текст или 'Данные не определены'>",
          "approval_criteria_status": "<defined / not_defined>",
          "approval_criteria_details": "<текст или 'Данные не определены'>",
          "liability_for_subfranchisee_status": "<defined / not_defined>",
          "liability_for_subfranchisee_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субконцессия субфранчайзинг согласие на субконцессию мастер-франчайзи контроль субфранчайзи субфраншиза ответственность за субфранчайзи критерии одобрения"
      retrieval_profile: "sublicensing_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "subfranchising_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия субконцессии: допустимость, согласие, критерии, ответственность.
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subfranchising_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subfranchising_status, subfranchising_regime,
              consent_required_status, approval_criteria_status,
              liability_for_subfranchisee_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subfranchising_status = "not_defined";
           - subfranchising_regime = "not_defined";
           - consent_required_status = "not_defined";
           - approval_criteria_status = "not_defined";
           - liability_for_subfranchisee_status = "not_defined";
           - consent_required_details, approval_criteria_details,
             liability_for_subfranchisee_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subfranchising_status:
           - "defined" — если в тексте прямо выражено отношение к субконцессии
             (разрешена, запрещена, разрешена с условиями);
           - "not_defined" — если о субконцессии прямо не сказано.

        2. subfranchising_regime:
           Используй только одно из значений:
           - "allowed" — если субконцессия прямо разрешена без обязательного
             согласия франчайзера;
           - "prohibited" — если субконцессия прямо запрещена;
           - "allowed_with_consent" — если субконцессия допускается только
             с согласия франчайзера (письменного или иного);
           - "not_defined" — если о субконцессии прямо не сказано.

        3. consent_required_status:
           - "defined" — если прямо указано требование получить согласие
             франчайзера на субконцессию (письменное или иное);
           - "not_defined" — иначе.

        4. consent_required_details:
           Краткое user-facing описание условий согласия
           (например: "письменное согласие Франчайзера").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. approval_criteria_status:
           - "defined" — если прямо указаны критерии одобрения субфранчайзи
             (требования к кандидату, порядок проверки, стандарты отбора);
           - "not_defined" — иначе.

        6. approval_criteria_details:
           Краткое описание критериев одобрения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. liability_for_subfranchisee_status:
           - "defined" — если прямо указана ответственность франчайзи
             за действия субфранчайзи (солидарная, субсидиарная, «как за свои»);
           - "not_defined" — иначе.

        8. liability_for_subfranchisee_details:
           Краткое user-facing описание ответственности
           (например: "несёт ответственность за действия субфранчайзи
           как за свои").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subfranchising_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи режим субконцессии из нормы ст. 1029 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, контроле качества, обучении, расторжении, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - subfranchising_regime = "prohibited" только при прямом запрете субконцессии в тексте.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни разрешения, ни запрета субконцессии, ни условий
           согласия, ни ответственности за субфранчайзи.
           → presence = "missing";
             все *_status = "not_defined";
             subfranchising_regime = "not_defined";
             все *_details = "Данные не определены".

        2. Прямой запрет или прямое исключение.
           а) Прямо указано: "Субконцессия не допускается" / "Франчайзи
              не вправе заключать договоры субконцессии".
              → presence = "present";
                subfranchising_status = "defined";
                subfranchising_regime = "prohibited";
                consent_required_status = "not_defined".
           б) Прямо указано, что франчайзи не несёт ответственности
              за действия субфранчайзи.
              → presence = "present";
                liability_for_subfranchisee_status = "not_defined";
                liability_for_subfranchisee_details содержит дословную
                формулировку исключения.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           субконцессии (например, в одном месте разрешена без согласия,
           в другом — только с согласия).
           → presence = "unclear";
             subfranchising_regime = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Субконцессия разрешена без согласия.
           Указано, что франчайзи вправе заключать договоры субконцессии
           без получения согласия франчайзера.
           → presence = "present";
             subfranchising_status = "defined";
             subfranchising_regime = "allowed";
             consent_required_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subfranchising_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для subfranchising_regime используй только:
          "allowed", "prohibited", "allowed_with_consent", "not_defined".
        - Fallback при отсутствии данных:
          * consent_required_details, approval_criteria_details,
            liability_for_subfranchisee_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subfranchising_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования субконцессии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subfranchising_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования субконцессии. Внутреннее enum-поле."
          required: true

        - name: "subfranchising_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["allowed", "prohibited", "allowed_with_consent", "not_defined"]
          description: "Режим субконцессии. Внутреннее enum-поле."
          required: true

        - name: "consent_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования согласия. Внутреннее enum-поле."
          required: true

        - name: "consent_required_details"
          type: "string"
          presentation: "fact"
          label: "Согласие на субконцессию"
          description: >
            Условия согласия франчайзера на субконцессию. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "approval_criteria_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус критериев одобрения. Внутреннее enum-поле."
          required: true

        - name: "approval_criteria_details"
          type: "string"
          presentation: "fact"
          label: "Критерии одобрения"
          description: >
            Критерии одобрения субфранчайзи. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "liability_for_subfranchisee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за субфранчайзи. Внутреннее enum-поле."
          required: true

        - name: "liability_for_subfranchisee_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность за субфранчайзи"
          description: >
            Ответственность франчайзи за действия субфранчайзи. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: standards_change_check
    name: "Ограничение на односторонние изменения стандартов"
    description: >
      Фактографическая проверка условий об изменении стандартов франчайзером:
      право изменения, срок уведомления, срок на внедрение, компенсация затрат,
      право франчайзи на расторжение при существенных изменениях.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение стандартов"
        - "уведомление об изменениях"
        - "срок на внедрение"
        - "компенсация затрат"
        - "существенные изменения"
        - "одностороннее изменение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+вправе\\s+изменять.*с\\s+уведомлением"
        - "(?i)при\\s+существенных\\s+изменениях.*вправе"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: условия об изменении стандартов.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право франчайзера изменять стандарты.
        2. Срок уведомления об изменениях.
        3. Срок на внедрение изменений.
        4. Компенсация затрат франчайзи на внедрение.
        5. Право франчайзи расторгнуть договор при существенных изменениях.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер вправе изменять стандарты сети с уведомлением за 6 месяцев.
        Срок на внедрение — 3 месяца. При существенных изменениях Франчайзи
        вправе расторгнуть договор без штрафов."

        Ответ:
        {
          "standards_change_status": "defined",
          "standards_change_details": "вправе изменять стандарты сети",
          "notice_period_status": "defined",
          "notice_period_details": "уведомление за 6 месяцев",
          "implementation_period_status": "defined",
          "implementation_period_details": "срок на внедрение — 3 месяца",
          "cost_compensation_status": "not_defined",
          "cost_compensation_details": "Данные не определены",
          "termination_on_major_changes_status": "defined",
          "termination_on_major_changes_details": "вправе расторгнуть договор без штрафов",
          "evidence": [{"clause_ref": "п. 4.5", "quote": "Франчайзер вправе изменять стандарты сети с уведомлением за 6 месяцев."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи обязан соблюдать стандарты сети."

        Ответ:
        {
          "standards_change_status": "not_defined",
          "standards_change_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "implementation_period_status": "not_defined",
          "implementation_period_details": "Данные не определены",
          "cost_compensation_status": "not_defined",
          "cost_compensation_details": "Данные не определены",
          "termination_on_major_changes_status": "not_defined",
          "termination_on_major_changes_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о праве изменения стандартов.
        2. Найди прямую цитату о сроке уведомления.
        3. Найди прямую цитату о сроке на внедрение.
        4. Найди прямую цитату о компенсации затрат.
        5. Найди прямую цитату о праве расторжения при существенных изменениях.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "standards_change_status": "<defined / not_defined>",
          "standards_change_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "implementation_period_status": "<defined / not_defined>",
          "implementation_period_details": "<текст или 'Данные не определены'>",
          "cost_compensation_status": "<defined / not_defined>",
          "cost_compensation_details": "<текст или 'Данные не определены'>",
          "termination_on_major_changes_status": "<defined / not_defined>",
          "termination_on_major_changes_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение стандартов уведомление об изменениях срок на внедрение компенсация затрат существенные изменения одностороннее изменение право франчайзера изменять стандарты право франчайзи расторгнуть при изменениях"
      retrieval_profile: "notice_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "standards_change_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об изменении стандартов: право изменения, уведомление,
        внедрение, компенсация, право расторжения.
        Не анализируй комплекс прав, вознаграждение, территорию или субконцессию.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. standards_change_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (standards_change_status, notice_period_status,
              implementation_period_status, cost_compensation_status,
              termination_on_major_changes_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - standards_change_status = "not_defined";
           - notice_period_status = "not_defined";
           - implementation_period_status = "not_defined";
           - cost_compensation_status = "not_defined";
           - termination_on_major_changes_status = "not_defined";
           - standards_change_details, notice_period_details,
             implementation_period_details, cost_compensation_details,
             termination_on_major_changes_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. standards_change_status:
           - "defined" — если прямо указано право франчайзера изменять
             стандарты сети (односторонне или в определённом порядке);
           - "not_defined" — иначе.

        2. standards_change_details:
           Краткое user-facing описание права изменения стандартов.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. notice_period_status:
           - "defined" — если прямо указан срок уведомления франчайзи
             об изменении стандартов (например, "за 6 месяцев",
             "не позднее чем за 30 дней");
           - "not_defined" — иначе.

        4. notice_period_details:
           Краткое user-facing описание срока уведомления
           (например: "уведомление за 6 месяцев").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. implementation_period_status:
           - "defined" — если прямо указан срок на внедрение изменений
             (например, "3 месяца с даты уведомления");
           - "not_defined" — иначе.

        6. implementation_period_details:
           Краткое user-facing описание срока на внедрение
           (например: "срок на внедрение — 3 месяца").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. cost_compensation_status:
           - "defined" — если прямо указана компенсация затрат франчайзи
             на внедрение изменений (полная, частичная, через скидки
             на роялти и т.п.);
           - "not_defined" — иначе.

        8. cost_compensation_details:
           Краткое user-facing описание компенсации затрат.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. termination_on_major_changes_status:
           - "defined" — если прямо указано право франчайзи расторгнуть
             договор при существенных изменениях стандартов;
           - "not_defined" — иначе.

        10. termination_on_major_changes_details:
            Краткое user-facing описание права расторжения
            (например: "вправе расторгнуть договор без штрафов").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни standards_change_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке договора, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай право изменения стандартов с обязанностью франчайзи их соблюдать.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права изменения стандартов, ни срока уведомления,
           ни срока на внедрение, ни компенсации, ни права расторжения
           при существенных изменениях.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзер вправе изменять стандарты" без
              указания срока уведомления или внедрения.
              → presence = "present";
                standards_change_status = "defined";
                notice_period_status = "not_defined";
                implementation_period_status = "not_defined".
           б) Прямо указано, что затраты франчайзи на внедрение изменений
              не компенсируются.
              → presence = "present";
                cost_compensation_status = "not_defined";
                cost_compensation_details содержит дословную формулировку
                исключения.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сроки уведомления,
           сроки на внедрение или противоречивые условия компенсации.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Изменения через дополнительное соглашение.
           Указано, что изменения стандартов вносятся только по соглашению
           сторон или через дополнительное соглашение.
           → presence = "present";
             standards_change_status = "defined";
             standards_change_details содержит описание порядка
             ("только по соглашению сторон" / "через дополнительное
             соглашение").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для standards_change_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "standards_change_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изменению стандартов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "standards_change_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права изменения стандартов. Внутреннее enum-поле."
          required: true

        - name: "standards_change_details"
          type: "string"
          presentation: "fact"
          label: "Изменение стандартов"
          description: >
            Право франчайзера изменять стандарты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока уведомления. Внутреннее enum-поле."
          required: true

        - name: "notice_period_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление об изменениях"
          description: >
            Срок уведомления об изменениях стандартов. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "implementation_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока на внедрение. Внутреннее enum-поле."
          required: true

        - name: "implementation_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок на внедрение"
          description: >
            Срок на внедрение изменений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "cost_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус компенсации затрат. Внутреннее enum-поле."
          required: true

        - name: "cost_compensation_details"
          type: "string"
          presentation: "fact"
          label: "Компенсация затрат"
          description: >
            Компенсация затрат франчайзи на внедрение. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "termination_on_major_changes_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права расторжения при существенных изменениях. Внутреннее enum-поле."
          required: true

        - name: "termination_on_major_changes_details"
          type: "string"
          presentation: "fact"
          label: "Расторжение при изменениях"
          description: >
            Право франчайзи расторгнуть договор при существенных изменениях. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: disclosure_check
    name: "Преддоговорное раскрытие информации (Disclosure Document / FDD)"
    description: >
      Фактографическая проверка наличия условий о преддоговорном раскрытии
      информации франчайзером: финансовое положение, количество точек,
      судебные споры, реальные показатели бизнеса.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "преддоговорное раскрытие"
        - "disclosure document"
        - "FDD"
        - "информация о франчайзере"
        - "история франшизы"
        - "количество точек"
        - "финансовые показатели"
        - "судебные споры"
        - "ознакомлен до заключения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+предоставил.*информаци"
        - "(?i)до\\s+заключения.*ознакомлен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: преддоговорное раскрытие информации.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание преддоговорного раскрытия / Disclosure Document.
        2. Перечень раскрытой информации.
        3. Финансовые показатели.
        4. История судебных споров.
        5. Количество действующих и закрытых точек.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер предоставил Франчайзи Disclosure Document, содержащий:
        финансовую отчётность за 3 года, информацию о 120 действующих и
        15 закрытых точках, сведения о 3 судебных спорах."

        Ответ:
        {
          "disclosure_status": "defined",
          "disclosure_details": "Disclosure Document предоставлен",
          "disclosed_info_types_status": "defined",
          "disclosed_info_types_details": "финансовая отчётность за 3 года, 120 действующих и 15 закрытых точек, 3 судебных спора",
          "financial_statements_status": "defined",
          "litigation_history_status": "defined",
          "franchisee_count_status": "defined",
          "franchisee_count_details": "120 действующих и 15 закрытых точек",
          "evidence": [{"clause_ref": "п. 1.5", "quote": "Франчайзер предоставил Франчайзи Disclosure Document."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "disclosure_status": "not_defined",
          "disclosure_details": "Данные не определены",
          "disclosed_info_types_status": "not_defined",
          "disclosed_info_types_details": "Данные не определены",
          "financial_statements_status": "not_defined",
          "litigation_history_status": "not_defined",
          "franchisee_count_status": "not_defined",
          "franchisee_count_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о Disclosure Document.
        2. Найди прямую цитату о перечне информации.
        3. Найди прямую цитату о финансовых показателях.
        4. Найди прямую цитату о судебных спорах.
        5. Найди прямую цитату о количестве точек.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosure_status": "<defined / not_defined>",
          "disclosure_details": "<текст или 'Данные не определены'>",
          "disclosed_info_types_status": "<defined / not_defined>",
          "disclosed_info_types_details": "<текст или 'Данные не определены'>",
          "financial_statements_status": "<defined / not_defined>",
          "litigation_history_status": "<defined / not_defined>",
          "franchisee_count_status": "<defined / not_defined>",
          "franchisee_count_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преддоговорное раскрытие disclosure document FDD информация о франчайзере история франшизы количество точек финансовые показатели судебные споры ознакомлен до заключения"
      retrieval_profile: "definitions_check"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "disclosure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        сведения о преддоговорном раскрытии информации (Disclosure Document).
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. disclosure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disclosure_status, disclosed_info_types_status,
              financial_statements_status, litigation_history_status,
              franchisee_count_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disclosure_status = "not_defined";
           - disclosed_info_types_status = "not_defined";
           - financial_statements_status = "not_defined";
           - litigation_history_status = "not_defined";
           - franchisee_count_status = "not_defined";
           - disclosure_details, disclosed_info_types_details,
             franchisee_count_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. disclosure_status:
           - "defined" — если прямо указано преддоговорное раскрытие
             информации франчайзером (Disclosure Document, FDD,
             информационный меморандум, иной прямо названный документ);
           - "not_defined" — иначе.

        2. disclosure_details:
           Краткое user-facing описание документа раскрытия
           (например: "Disclosure Document предоставлен",
           "Информационный меморандум (Приложение №1)").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. disclosed_info_types_status:
           - "defined" — если прямо указан перечень раскрытой информации
             (конкретные категории: финпоказатели, количество точек,
             судебные споры и т.п.);
           - "not_defined" — иначе.

        4. disclosed_info_types_details:
           Краткое user-facing перечисление раскрытой информации.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. financial_statements_status:
           - "defined" — если прямо указано раскрытие финансовых показателей
             (отчётность, оборот, прибыль, бухгалтерский баланс);
           - "not_defined" — иначе.

        6. litigation_history_status:
           - "defined" — если прямо указано раскрытие сведений о судебных
             спорах франчайзера (текущих или завершённых);
           - "not_defined" — иначе.

        7. franchisee_count_status:
           - "defined" — если прямо указано количество действующих
             и/или закрытых точек сети, число франчайзи;
           - "not_defined" — иначе.

        8. franchisee_count_details:
           Краткое user-facing описание количества точек
           (например: "120 действующих и 15 закрытых точек").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни disclosure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Если раскрытие информации оформлено отдельным документом (FDD, Disclosure Document, приложение), прямо названным в договоре — это presence = "present", disclosure_status = "defined".
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания преддоговорного раскрытия,
           ни перечня раскрытой информации, ни финпоказателей,
           ни судебных споров, ни количества точек.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзер раскрыл информацию о бизнесе"
              без указания перечня и предмета раскрытия.
              → presence = "present";
                disclosure_status = "defined";
                disclosed_info_types_status = "not_defined".
           б) Прямо указано, что франчайзер не предоставляет финансовую
              отчётность или сведения о судебных спорах.
              → presence = "present";
                соответствующий *_status = "not_defined";
                disclosure_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые перечни
           раскрытой информации или разные количества точек.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Раскрытие через отдельный документ / приложение.
           Указано, что Disclosure Document / FDD / информационный
           меморандум передан франчайзи и является приложением к договору.
           → presence = "present";
             disclosure_status = "defined";
             disclosure_details содержит формулировку вида
             "Согласно Disclosure Document (Приложение №1)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для disclosure_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * disclosure_details, disclosed_info_types_details,
            franchisee_count_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "disclosure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования преддоговорного раскрытия информации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус преддоговорного раскрытия. Внутреннее enum-поле."
          required: true

        - name: "disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Преддоговорное раскрытие"
          description: >
            Упоминание преддоговорного раскрытия. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "disclosed_info_types_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня раскрытой информации. Внутреннее enum-поле."
          required: true

        - name: "disclosed_info_types_details"
          type: "string"
          presentation: "fact"
          label: "Перечень информации"
          description: >
            Перечень раскрытой информации. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "financial_statements_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус финансовых показателей. Внутреннее enum-поле."
          required: true

        - name: "litigation_history_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус истории судебных споров. Внутреннее enum-поле."
          required: true

        - name: "franchisee_count_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус количества точек. Внутреннее enum-поле."
          required: true

        - name: "franchisee_count_details"
          type: "string"
          presentation: "fact"
          label: "Количество точек"
          description: >
            Количество действующих и закрытых точек. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: purchasing_advertising_check
    name: "Обязательные закупки и прозрачность рекламного фонда"
    description: >
      Фактографическая проверка условий об обязательных закупках у франчайзера
      или одобренных поставщиков (антимонопольный риск) и прозрачности
      рекламного фонда (отчётность, аудит, целевое использование).
    triggers:
      any:
        - antitrust_risks
        - royalty_based
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обязательные закупки"
        - "минимальный объём закупок"
        - "одобренные поставщики"
        - "рекомендованные поставщики"
        - "закупка у франчайзера"
        - "эксклюзивные поставщики"
        - "запрет закупок у третьих лиц"
        - "рекламный фонд"
        - "рекламные отчисления"
        - "маркетинговый фонд"
        - "рекламный бюджет"
        - "отчёт о расходовании"
        - "целевое использование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+обязан\\s+закупать"
        - "(?i)минимальн\\w+\\s+объём\\s+закупок"
        - "(?i)только\\s+у\\s+одобренн"
        - "(?i)рекламн\\w+\\s+(фонд|отчислен|бюджет)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: обязательные закупки и рекламный фонд.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязательные закупки у франчайзера или одобренных поставщиков.
        2. Минимальный объём закупок.
        3. Право франчайзи предлагать альтернативных поставщиков.
        4. Наличие рекламного фонда.
        5. Ставка рекламных отчислений.
        6. Отчётность перед франчайзи о расходовании фонда.
        7. Право аудита рекламного фонда.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 13 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзи обязан закупать сырьё только у одобренных поставщиков
        из перечня Приложения № 3. Минимальный объём закупок — 100 000 руб./мес.
        Рекламные отчисления — 2% от выручки в рекламный фонд сети.
        Франчайзер предоставляет ежеквартальный отчёт о расходовании фонда."

        Ответ:
        {
          "mandatory_purchases_status": "defined",
          "mandatory_purchases_details": "закупать сырьё только у одобренных поставщиков из перечня Приложения № 3",
          "minimum_purchase_volume_status": "defined",
          "minimum_purchase_volume_details": "100 000 руб./мес.",
          "alternative_suppliers_status": "not_defined",
          "alternative_suppliers_details": "Данные не определены",
          "advertising_fund_status": "defined",
          "advertising_fund_details": "2% от выручки в рекламный фонд сети",
          "fund_reporting_status": "defined",
          "fund_reporting_details": "ежеквартальный отчёт о расходовании фонда",
          "fund_audit_status": "not_defined",
          "fund_audit_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 5.1", "quote": "Франчайзи обязан закупать сырьё только у одобренных поставщиков."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи самостоятельно организует закупки."

        Ответ:
        {
          "mandatory_purchases_status": "not_defined",
          "mandatory_purchases_details": "Данные не определены",
          "minimum_purchase_volume_status": "not_defined",
          "minimum_purchase_volume_details": "Данные не определены",
          "alternative_suppliers_status": "not_defined",
          "alternative_suppliers_details": "Данные не определены",
          "advertising_fund_status": "not_defined",
          "advertising_fund_details": "Данные не определены",
          "fund_reporting_status": "not_defined",
          "fund_reporting_details": "Данные не определены",
          "fund_audit_status": "not_defined",
          "fund_audit_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату об обязательных закупках.
        2. Найди прямую цитату о минимальном объёме.
        3. Найди прямую цитату об альтернативных поставщиках.
        4. Найди прямую цитату о рекламном фонде.
        5. Найди прямую цитату об отчётности.
        6. Найди прямую цитату о праве аудита.
        7. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "mandatory_purchases_status": "<defined / not_defined>",
          "mandatory_purchases_details": "<текст или 'Данные не определены'>",
          "minimum_purchase_volume_status": "<defined / not_defined>",
          "minimum_purchase_volume_details": "<текст или 'Данные не определены'>",
          "alternative_suppliers_status": "<defined / not_defined>",
          "alternative_suppliers_details": "<текст или 'Данные не определены'>",
          "advertising_fund_status": "<defined / not_defined>",
          "advertising_fund_details": "<текст или 'Данные не определены'>",
          "fund_reporting_status": "<defined / not_defined>",
          "fund_reporting_details": "<текст или 'Данные не определены'>",
          "fund_audit_status": "<defined / not_defined>",
          "fund_audit_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обязательные закупки минимальный объём закупок одобренные поставщики рекомендованные поставщики закупка у франчайзера эксклюзивные поставщики запрет закупок у третьих лиц рекламный фонд рекламные отчисления маркетинговый фонд рекламный бюджет отчёт о расходовании целевое использование аудит рекламного фонда"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "purchasing_advertising_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об обязательных закупках и рекламном фонде.
        Не анализируй комплекс прав, территорию, контроль качества или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. purchasing_advertising_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (mandatory_purchases_status, minimum_purchase_volume_status,
              alternative_suppliers_status, advertising_fund_status,
              fund_reporting_status, fund_audit_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - mandatory_purchases_status = "not_defined";
           - minimum_purchase_volume_status = "not_defined";
           - alternative_suppliers_status = "not_defined";
           - advertising_fund_status = "not_defined";
           - fund_reporting_status = "not_defined";
           - fund_audit_status = "not_defined";
           - mandatory_purchases_details, minimum_purchase_volume_details,
             alternative_suppliers_details, advertising_fund_details,
             fund_reporting_details, fund_audit_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. mandatory_purchases_status:
           - "defined" — если прямо указана обязанность франчайзи закупать
             товары/сырьё/материалы у франчайзера или у одобренных
             (рекомендованных, эксклюзивных) поставщиков;
           - "not_defined" — иначе.

        2. mandatory_purchases_details:
           Краткое user-facing описание условий обязательных закупок
           (например: "закупать сырьё только у одобренных поставщиков
           из перечня Приложения № 3").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. minimum_purchase_volume_status:
           - "defined" — если прямо указан минимальный объём закупок
             (в денежном или натуральном выражении, за период);
           - "not_defined" — иначе.

        4. minimum_purchase_volume_details:
           Краткое user-facing описание минимального объёма
           (например: "100 000 руб./мес.").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. alternative_suppliers_status:
           - "defined" — если прямо указано право франчайзи предлагать
             альтернативных поставщиков (с их одобрением франчайзером);
           - "not_defined" — иначе.

        6. alternative_suppliers_details:
           Краткое user-facing описание права предлагать альтернативных
           поставщиков.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. advertising_fund_status:
           - "defined" — если прямо указан рекламный (маркетинговый) фонд
             и/или ставка рекламных отчислений;
           - "not_defined" — иначе.

        8. advertising_fund_details:
           Краткое user-facing описание рекламного фонда
           (например: "2% от выручки в рекламный фонд сети").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. fund_reporting_status:
           - "defined" — если прямо указана обязанность франчайзера
             отчитываться перед франчайзи о расходовании рекламного фонда
             (отчёт, раскрытие);
           - "not_defined" — иначе.

        10. fund_reporting_details:
            Краткое user-facing описание отчётности
            (например: "ежеквартальный отчёт о расходовании фонда").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. fund_audit_status:
            - "defined" — если прямо указано право франчайзи на аудит
              рекламного фонда или на проверку его расходования;
            - "not_defined" — иначе.

        12. fund_audit_details:
            Краткое user-facing описание права аудита.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни purchasing_advertising_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении (кроме рекламного фонда), территории, сроке, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай обязательные закупки с рекламным фондом.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязательных закупок, ни минимального объёма,
           ни альтернативных поставщиков, ни рекламного фонда,
           ни отчётности, ни аудита.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзи обязан закупать товары у надёжных
              поставщиков" без указания конкретных поставщиков
              или перечня.
              → presence = "present";
                mandatory_purchases_status = "not_defined".
           б) Прямо указано, что франчайзи не ограничен в выборе
              поставщиков (свободные закупки).
              → presence = "present";
                mandatory_purchases_status = "not_defined";
                mandatory_purchases_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           закупок или противоречивые ставки рекламных отчислений.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Несколько условий темы описаны в одном пункте договора
           (обязательные закупки + минимальный объём + рекламный фонд
           + отчётность).
           → presence = "present";
             все соответствующие *_status = "defined";
             все соответствующие *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для purchasing_advertising_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "purchasing_advertising_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обязательным закупкам и рекламному фонду. Внутреннее агрегатное signal-поле."
          required: true

        - name: "mandatory_purchases_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязательных закупок. Внутреннее enum-поле."
          required: true

        - name: "mandatory_purchases_details"
          type: "string"
          presentation: "fact"
          label: "Обязательные закупки"
          description: >
            Условия обязательных закупок. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "minimum_purchase_volume_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус минимального объёма закупок. Внутреннее enum-поле."
          required: true

        - name: "minimum_purchase_volume_details"
          type: "string"
          presentation: "fact"
          label: "Минимальный объём закупок"
          description: >
            Минимальный объём закупок. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "alternative_suppliers_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права предлагать альтернативных поставщиков. Внутреннее enum-поле."
          required: true

        - name: "alternative_suppliers_details"
          type: "string"
          presentation: "fact"
          label: "Альтернативные поставщики"
          description: >
            Право франчайзи предлагать альтернативных поставщиков. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "advertising_fund_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус рекламного фонда. Внутреннее enum-поле."
          required: true

        - name: "advertising_fund_details"
          type: "string"
          presentation: "fact"
          label: "Рекламный фонд"
          description: >
            Рекламный фонд и ставка отчислений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "fund_reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отчётности о расходовании фонда. Внутреннее enum-поле."
          required: true

        - name: "fund_reporting_details"
          type: "string"
          presentation: "fact"
          label: "Отчётность по фонду"
          description: >
            Отчётность перед франчайзи о расходовании фонда. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "fund_audit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права аудита фонда. Внутреннее enum-поле."
          required: true

        - name: "fund_audit_details"
          type: "string"
          presentation: "fact"
          label: "Аудит фонда"
          description: >
            Право аудита рекламного фонда. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: ip_validity_registration_check
    name: "Действительность ТЗ, обязанность продления и регистрация договора в Роспатенте"
    description: >
      Фактографическая проверка срока действия регистрации товарного знака,
      обязанности франчайзера продлевать регистрацию, условия регистрации
      договора в Роспатенте (ст. 1028 ГК РФ) и последствий утраты ТЗ.
    triggers:
      any:
        - registered_trademark
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок действия товарного знака"
        - "продление регистрации"
        - "действительность товарного знака"
        - "оспаривание товарного знака"
        - "аннулирование регистрации"
        - "обязанность поддерживать регистрацию"
        - "государственная регистрация"
        - "Роспатент"
        - "подлежит регистрации"
        - "регистрация договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн\\w+\\s+знак.*действ(ует|ителен)\\s+до"
        - "(?i)обязуется\\s+продл(ить|евать)\\s+регистрацию"
        - "(?i)государственн(ая|ой)\\s+регистрац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (ст. 1028 ГК РФ).
        Проверяется только один вопрос: действительность ТЗ, обязанность
        продления и регистрация договора в Роспатенте.

        Нормативный ориентир:
        - ст. 1028 ГК РФ — форма и регистрация договора
        - ст. 1491 ГК РФ — срок действия исключительного права на ТЗ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Дата окончания действия регистрации ТЗ.
        2. Обязанность франчайзера продлевать регистрацию.
        3. Уведомление франчайзи при оспаривании ТЗ.
        4. Последствия утраты ТЗ.
        5. Условие о государственной регистрации договора в Роспатенте.
        6. Кто подаёт заявление на регистрацию и распределение расходов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Товарный знак действует до 15.03.2030. Франчайзер обязуется продлевать
        регистрацию в течение всего срока договора. Договор подлежит
        государственной регистрации в Роспатенте. Заявление подаёт Франчайзер,
        расходы несёт Франчайзи."

        Ответ:
        {
          "tm_validity_date_status": "defined",
          "tm_validity_date_details": "до 15.03.2030",
          "renewal_obligation_status": "defined",
          "renewal_obligation_details": "продлевать регистрацию в течение всего срока договора",
          "challenge_notification_status": "not_defined",
          "challenge_notification_details": "Данные не определены",
          "tm_loss_consequences_status": "not_defined",
          "tm_loss_consequences_details": "Данные не определены",
          "contract_registration_status": "defined",
          "contract_registration_details": "подлежит государственной регистрации в Роспатенте, заявление подаёт Франчайзер, расходы несёт Франчайзи",
          "evidence": [{"clause_ref": "п. 1.3", "quote": "Товарный знак действует до 15.03.2030."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзер предоставляет право использования товарного знака."

        Ответ:
        {
          "tm_validity_date_status": "not_defined",
          "tm_validity_date_details": "Данные не определены",
          "renewal_obligation_status": "not_defined",
          "renewal_obligation_details": "Данные не определены",
          "challenge_notification_status": "not_defined",
          "challenge_notification_details": "Данные не определены",
          "tm_loss_consequences_status": "not_defined",
          "tm_loss_consequences_details": "Данные не определены",
          "contract_registration_status": "not_defined",
          "contract_registration_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о дате действия ТЗ.
        2. Найди прямую цитату о продлении регистрации.
        3. Найди прямую цитату об уведомлении при оспаривании ТЗ.
        4. Найди прямую цитату о последствиях утраты ТЗ.
        5. Найди прямую цитату о регистрации договора в Роспатенте.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "tm_validity_date_status": "<defined / not_defined>",
          "tm_validity_date_details": "<текст или 'Данные не определены'>",
          "renewal_obligation_status": "<defined / not_defined>",
          "renewal_obligation_details": "<текст или 'Данные не определены'>",
          "challenge_notification_status": "<defined / not_defined>",
          "challenge_notification_details": "<текст или 'Данные не определены'>",
          "tm_loss_consequences_status": "<defined / not_defined>",
          "tm_loss_consequences_details": "<текст или 'Данные не определены'>",
          "contract_registration_status": "<defined / not_defined>",
          "contract_registration_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок действия товарного знака продление регистрации действительность товарного знака оспаривание товарного знака аннулирование регистрации обязанность поддерживать регистрацию государственная регистрация Роспатент подлежит регистрации регистрация договора"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "ip_validity_registration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        сведения о действительности ТЗ, продлении регистрации, последствиях
        утраты ТЗ и регистрации договора в Роспатенте.
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_validity_registration_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tm_validity_date_status, renewal_obligation_status,
              challenge_notification_status, tm_loss_consequences_status,
              contract_registration_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tm_validity_date_status = "not_defined";
           - renewal_obligation_status = "not_defined";
           - challenge_notification_status = "not_defined";
           - tm_loss_consequences_status = "not_defined";
           - contract_registration_status = "not_defined";
           - tm_validity_date_details, renewal_obligation_details,
             challenge_notification_details, tm_loss_consequences_details,
             contract_registration_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. tm_validity_date_status:
           - "defined" — если прямо указана дата окончания действия
             регистрации товарного знака или срок его действия;
           - "not_defined" — иначе.

        2. tm_validity_date_details:
           Краткое user-facing описание даты/срока действия ТЗ
           (например: "до 15.03.2030").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. renewal_obligation_status:
           - "defined" — если прямо указана обязанность франчайзера
             продлевать регистрацию товарного знака или поддерживать
             её действительность в течение срока договора;
           - "not_defined" — иначе.

        4. renewal_obligation_details:
           Краткое user-facing описание обязанности продления
           (например: "продлевать регистрацию в течение всего срока
           договора").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. challenge_notification_status:
           - "defined" — если прямо указана обязанность франчайзера
             уведомлять франчайзи об оспаривании ТЗ или о претензиях
             третьих лиц к товарному знаку;
           - "not_defined" — иначе.

        6. challenge_notification_details:
           Краткое user-facing описание порядка уведомления
           (срок, форма, ответственные).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. tm_loss_consequences_status:
           - "defined" — если прямо указаны последствия утраты
             товарного знака для договора (право расторжения,
             пересмотр условий, компенсация и т.п.);
           - "not_defined" — иначе.

        8. tm_loss_consequences_details:
           Краткое user-facing описание последствий утраты ТЗ.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. contract_registration_status:
           - "defined" — если прямо указано, что договор подлежит
             государственной регистрации в Роспатенте, и/или указан
             порядок подачи заявления и распределения расходов;
           - "not_defined" — иначе.

        10. contract_registration_details:
            Краткое user-facing описание условий регистрации
            (например: "подлежит государственной регистрации в Роспатенте,
            заявление подаёт Франчайзер, расходы несёт Франчайзи").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_validity_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи обязанность регистрации из нормы ст. 1028 ГК РФ — только из прямого текста договора.
        - Не выводи обязанность продления из нормы ст. 1491 ГК РФ — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай срок действия ТЗ с обязанностью продления и с регистрацией договора.
        - Если в разных фрагментах указаны противоречивые даты или условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока действия ТЗ, ни обязанности продления,
           ни уведомления при оспаривании, ни последствий утраты,
           ни условия о регистрации договора в Роспатенте.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзер предоставляет право использования
              товарного знака" без указания срока, обязанности продления
              или регистрации.
              → presence = "present";
                соответствующие *_status = "not_defined".
           б) Прямо указано, что договор не подлежит государственной
              регистрации в Роспатенте, либо что стороны отказываются
              от продления ТЗ.
              → presence = "present";
                соответствующий *_status = "not_defined";
                соответствующий *_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые даты действия ТЗ
           или противоречивые условия регистрации.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — утрата или оспаривание ТЗ.
           Прямо указано, что при утрате ТЗ (аннулирование, оспаривание,
           отказ в продлении) договор прекращается или изменяется,
           либо установлен порядок уведомления франчайзи.
           → presence = "present";
             tm_loss_consequences_status = "defined" и/или
             challenge_notification_status = "defined";
             соответствующий *_details заполнен.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_validity_registration_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_validity_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по действительности ТЗ и регистрации договора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tm_validity_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус даты действия ТЗ. Внутреннее enum-поле."
          required: true

        - name: "tm_validity_date_details"
          type: "string"
          presentation: "fact"
          label: "Срок действия ТЗ"
          description: >
            Дата окончания действия регистрации ТЗ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "renewal_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности продлевать ТЗ. Внутреннее enum-поле."
          required: true

        - name: "renewal_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Продление ТЗ"
          description: >
            Обязанность франчайзера продлевать регистрацию ТЗ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "challenge_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус уведомления при оспаривании ТЗ. Внутреннее enum-поле."
          required: true

        - name: "challenge_notification_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление при оспаривании"
          description: >
            Уведомление франчайзи при оспаривании ТЗ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "tm_loss_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий утраты ТЗ. Внутреннее enum-поле."
          required: true

        - name: "tm_loss_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия утраты ТЗ"
          description: >
            Последствия утраты товарного знака. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "contract_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регистрации договора в Роспатенте. Внутреннее enum-поле."
          required: true

        - name: "contract_registration_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация договора"
          description: >
            Условия регистрации договора в Роспатенте. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: digital_assets_check
    name: "IT-системы и цифровые активы (CRM, POS, сайт, приложение, база клиентов)"
    description: >
      Фактографическая проверка условий об IT-системах: перечень предоставляемых
      систем, принадлежность базы данных клиентов, домена, аккаунтов в соцсетях,
      порядок доступа к данным после расторжения.
    triggers:
      any:
        - digital_systems
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "CRM"
        - "POS"
        - "программное обеспечение"
        - "личный кабинет"
        - "IT-система"
        - "база данных клиентов"
        - "домен"
        - "сайт франчайзи"
        - "мобильное приложение"
        - "аккаунт в социальных сетях"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(CRM|POS|ERP)\\s*(систем|терминал)"
        - "(?i)баз(а|у|ы)\\s+данных\\s+клиент"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: IT-системы и цифровые активы.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень предоставляемых IT-систем.
        2. Принадлежность базы данных клиентов.
        3. Принадлежность домена и аккаунтов в соцсетях.
        4. Порядок доступа к данным после расторжения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзер предоставляет доступ к CRM-системе и POS-терминалам.
        База данных клиентов принадлежит Франчайзеру. Домен и аккаунты
        в социальных сетях контролируются Франчайзером. После расторжения
        Франчайзи обязан прекратить доступ к системам в течение 3 дней."

        Ответ:
        {
          "it_systems_status": "defined",
          "it_systems_details": "CRM-система и POS-терминалы",
          "customer_db_ownership_status": "defined",
          "customer_db_ownership_details": "принадлежит Франчайзеру",
          "domain_ownership_status": "defined",
          "domain_ownership_details": "домен и аккаунты контролируются Франчайзером",
          "data_access_termination_status": "defined",
          "data_access_termination_details": "прекратить доступ в течение 3 дней",
          "evidence": [{"clause_ref": "п. 7.1", "quote": "Франчайзер предоставляет доступ к CRM-системе и POS-терминалам."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует комплекс прав в деятельности."

        Ответ:
        {
          "it_systems_status": "not_defined",
          "it_systems_details": "Данные не определены",
          "customer_db_ownership_status": "not_defined",
          "customer_db_ownership_details": "Данные не определены",
          "domain_ownership_status": "not_defined",
          "domain_ownership_details": "Данные не определены",
          "data_access_termination_status": "not_defined",
          "data_access_termination_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату об IT-системах.
        2. Найди прямую цитату о базе клиентов.
        3. Найди прямую цитату о домене и соцсетях.
        4. Найди прямую цитату о доступе после расторжения.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "it_systems_status": "<defined / not_defined>",
          "it_systems_details": "<текст или 'Данные не определены'>",
          "customer_db_ownership_status": "<defined / not_defined>",
          "customer_db_ownership_details": "<текст или 'Данные не определены'>",
          "domain_ownership_status": "<defined / not_defined>",
          "domain_ownership_details": "<текст или 'Данные не определены'>",
          "data_access_termination_status": "<defined / not_defined>",
          "data_access_termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "CRM POS программное обеспечение личный кабинет IT-система база данных клиентов домен сайт франчайзи мобильное приложение аккаунт в социальных сетях принадлежность базы порядок доступа после расторжения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "digital_assets_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об IT-системах и цифровых активах.
        Не анализируй комплекс прав, вознаграждение, территорию или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. digital_assets_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (it_systems_status, customer_db_ownership_status,
              domain_ownership_status, data_access_termination_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - it_systems_status = "not_defined";
           - customer_db_ownership_status = "not_defined";
           - domain_ownership_status = "not_defined";
           - data_access_termination_status = "not_defined";
           - it_systems_details, customer_db_ownership_details,
             domain_ownership_details, data_access_termination_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. it_systems_status:
           - "defined" — если прямо указан перечень предоставляемых
             IT-систем (CRM, POS, ERP, ПО, личный кабинет, мобильное
             приложение, иные названные системы);
           - "not_defined" — иначе.

        2. it_systems_details:
           Краткое user-facing перечисление IT-систем
           (например: "CRM-система и POS-терминалы").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. customer_db_ownership_status:
           - "defined" — если прямо указано, кому принадлежит база данных
             клиентов (франчайзеру, франчайзи, совместно);
           - "not_defined" — иначе.

        4. customer_db_ownership_details:
           Краткое user-facing описание принадлежности базы
           (например: "принадлежит Франчайзеру").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. domain_ownership_status:
           - "defined" — если прямо указано, кому принадлежит домен,
             сайт или аккаунты в социальных сетях;
           - "not_defined" — иначе.

        6. domain_ownership_details:
           Краткое user-facing описание принадлежности
           (например: "домен и аккаунты контролируются Франчайзером").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. data_access_termination_status:
           - "defined" — если прямо указан порядок доступа к данным
             (или прекращения доступа) после расторжения договора;
           - "not_defined" — иначе.

        8. data_access_termination_details:
           Краткое user-facing описание порядка
           (например: "прекратить доступ в течение 3 дней").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни digital_assets_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай перечень IT-систем с принадлежностью цифровых активов.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни перечня IT-систем, ни принадлежности базы
           клиентов, ни домена/соцсетей, ни порядка доступа после
           расторжения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзер оказывает IT-поддержку"
              без перечня конкретных систем.
              → presence = "present";
                it_systems_status = "not_defined".
           б) Прямо указано, что база данных клиентов принадлежит
              франчайзи (а не франчайзеру) — это присутствие регулирования,
              а не его отсутствие.
              → presence = "present";
                customer_db_ownership_status = "defined";
                customer_db_ownership_details = "принадлежит Франчайзи".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сведения
           о принадлежности базы или домена.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Несколько условий темы описаны в одном пункте договора
           (перечень систем + принадлежность базы + порядок доступа
           после расторжения).
           → presence = "present";
             все соответствующие *_status = "defined";
             все соответствующие *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для digital_assets_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "digital_assets_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по IT-системам и цифровым активам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "it_systems_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня IT-систем. Внутреннее enum-поле."
          required: true

        - name: "it_systems_details"
          type: "string"
          presentation: "fact"
          label: "IT-системы"
          description: >
            Перечень предоставляемых IT-систем. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "customer_db_ownership_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус принадлежности базы клиентов. Внутреннее enum-поле."
          required: true

        - name: "customer_db_ownership_details"
          type: "string"
          presentation: "fact"
          label: "База клиентов"
          description: >
            Принадлежность базы данных клиентов. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "domain_ownership_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус принадлежности домена. Внутреннее enum-поле."
          required: true

        - name: "domain_ownership_details"
          type: "string"
          presentation: "fact"
          label: "Домен и соцсети"
          description: >
            Принадлежность домена и аккаунтов в соцсетях. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "data_access_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка доступа после расторжения. Внутреннее enum-поле."
          required: true

        - name: "data_access_termination_details"
          type: "string"
          presentation: "fact"
          label: "Доступ после расторжения"
          description: >
            Порядок доступа к данным после расторжения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: antitrust_pricing_check
    name: "Антимонопольные ограничения: ценообразование (ст. 1033 ГК РФ)"
    description: >
      Фактографическая проверка условий о ценах на товары и услуги франчайзи.
      Выявление ничтожных условий о фиксации цен или запрете на их снижение
      (риск штрафов ФАС). Допускаются только рекомендованные цены.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "рекомендованные цены"
        - "фиксированная цена"
        - "обязательная цена"
        - "минимальная цена"
        - "максимальная цена"
        - "розничная цена"
        - "прайс-лист"
        - "запрет на снижение цен"
        - "обязан устанавливать цену"
        - "ценовая политика"
        - "единые цены сети"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+обязан\\s+(устанавливать|соблюдать).*цен"
        - "(?i)запрещ(ается|ено)\\s+(снижать|уменьшать).*цен"
        - "(?i)рекомендованн\\w+\\s+цен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности и антимонопольному праву.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: условия ценообразования (ст. 1033 ГК РФ).

        Нормативный ориентир:
        - п. 2 ст. 1033 ГК РФ — ничтожность условий о фиксации цен

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай "рекомендованные цены" (законно) и "обязательные/фиксированные
          цены" (ничтожно).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим ценообразования (рекомендованный / обязательный / отсутствует).
        2. Формулировки о ценах (точные цитаты).
        3. Наличие риска ничтожности (фиксация цен).
        4. Условие о прайс-листах и их обновлении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — законная формулировка:
        Фрагмент:
        "Франчайзер направляет Франчайзи рекомендованные розничные цены.
        Франчайзи вправе устанавливать собственные цены с учётом региональных
        особенностей. Прайс-лист обновляется ежемесячно."

        Ответ:
        {
          "pricing_regime_status": "defined",
          "pricing_regime_details": "рекомендованные розничные цены",
          "price_fixing_risk_status": "low_risk",
          "price_fixing_risk_details": "формулировка 'рекомендованные цены', право устанавливать собственные цены",
          "recommended_prices_status": "defined",
          "recommended_prices_details": "прайс-лист обновляется ежемесячно",
          "evidence": [{"clause_ref": "п. 3.2", "quote": "Франчайзер направляет Франчайзи рекомендованные розничные цены."}]
        }

        Пример 2 — ничтожная формулировка:
        Фрагмент:
        "Франчайзи обязан устанавливать цены согласно единому прайс-листу
        Франчайзера. Снижение цен ниже установленного уровня запрещено."

        Ответ:
        {
          "pricing_regime_status": "defined",
          "pricing_regime_details": "обязательные цены согласно единому прайс-листу",
          "price_fixing_risk_status": "high_risk",
          "price_fixing_risk_details": "обязан устанавливать цены, запрещено снижение — ничтожно по п. 2 ст. 1033 ГК РФ",
          "recommended_prices_status": "not_defined",
          "recommended_prices_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 3.2", "quote": "Франчайзи обязан устанавливать цены согласно единому прайс-листу Франчайзера."}]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Франчайзи самостоятельно определяет ассортимент."

        Ответ:
        {
          "pricing_regime_status": "not_defined",
          "pricing_regime_details": "Данные не определены",
          "price_fixing_risk_status": "not_defined",
          "price_fixing_risk_details": "Данные не определены",
          "recommended_prices_status": "not_defined",
          "recommended_prices_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о режиме ценообразования.
        2. Найди прямую цитату о фиксации или рекомендации цен.
        3. Найди прямую цитату о прайс-листах.
        4. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pricing_regime_status": "<defined / not_defined>",
          "pricing_regime_details": "<текст или 'Данные не определены'>",
          "price_fixing_risk_status": "<high_risk / low_risk / not_defined>",
          "price_fixing_risk_details": "<текст или 'Данные не определены'>",
          "recommended_prices_status": "<defined / not_defined>",
          "recommended_prices_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "рекомендованные цены фиксированная цена обязательная цена минимальная цена максимальная цена розничная цена прайс-лист запрет на снижение цен обязан устанавливать цену ценовая политика единые цены сети"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "antitrust_pricing_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по антимонопольному праву. Извлеки из договора
        коммерческой концессии условия о ценообразовании: режим цен, риск
        ничтожности по ст. 1033 ГК РФ, прайс-листы.
        Не анализируй вознаграждение, территорию или расторжение.
        Не оценивай риски сверх прямой квалификации условия.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. antitrust_pricing_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pricing_regime_status, price_fixing_risk_status,
              recommended_prices_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pricing_regime_status = "not_defined";
           - price_fixing_risk_status = "not_defined";
           - recommended_prices_status = "not_defined";
           - pricing_regime_details, price_fixing_risk_details,
             recommended_prices_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pricing_regime_status:
           - "defined" — если в тексте прямо указан режим ценообразования
             (рекомендованные цены, обязательные цены, фиксированные цены,
             прайс-лист, ценовая политика сети);
           - "not_defined" — иначе.

        2. pricing_regime_details:
           Краткое user-facing описание режима ценообразования
           (например: "рекомендованные розничные цены",
           "обязательные цены согласно единому прайс-листу").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. price_fixing_risk_status:
           Используй только одно из значений:
           - "high_risk" — если в тексте прямо указано, что франчайзи
             обязан устанавливать цены по указанию франчайзера, соблюдать
             единый прайс-лист как обязательный, либо содержится запрет
             на снижение цен ниже установленного уровня;
           - "low_risk" — если в тексте прямо указаны только рекомендованные
             цены, либо прямо сохранено право франчайзи устанавливать
             собственные цены;
           - "not_defined" — если условий о ценах в тексте нет.

        4. price_fixing_risk_details:
           Краткое user-facing обоснование риска с дословной формулировкой
           из договора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. recommended_prices_status:
           - "defined" — если прямо указано условие о рекомендованных ценах
             или о прайс-листах и их обновлении;
           - "not_defined" — иначе.

        6. recommended_prices_details:
           Краткое user-facing описание условия о прайс-листах
           (например: "прайс-лист обновляется ежемесячно").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни antitrust_pricing_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - «Рекомендованные цены» — это законное регулирование, а не отсутствие условия. Они дают price_fixing_risk_status = "low_risk".
        - «Обязан устанавливать цены», «единый прайс-лист как обязательный», «запрещено снижать цены» дают price_fixing_risk_status = "high_risk".
        - Не смешивай режим ценообразования с риском фиксации и с прайс-листами.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни режима ценообразования, ни условий о фиксации
           или рекомендации цен, ни прайс-листов.
           → presence = "missing";
             все *_status = "not_defined";
             price_fixing_risk_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Цены определяются сторонами" без конкретики
              о режиме.
              → presence = "present";
                pricing_regime_status = "not_defined".
           б) Прямо указано, что франчайзи самостоятельно устанавливает
              цены (свободное ценообразование) — это регулирование,
              а не его отсутствие.
              → presence = "present";
                pricing_regime_status = "defined";
                price_fixing_risk_status = "low_risk";
                pricing_regime_details содержит описание
                ("свободное ценообразование").

        3. Противоречие между фрагментами.
           В одном пункте указаны рекомендованные цены, в другом —
           обязательный прайс-лист.
           → presence = "unclear";
             price_fixing_risk_status = "not_defined";
             price_fixing_risk_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Условие о ценах и прайс-листах описано в одном пункте
           договора.
           → presence = "present";
             pricing_regime_status = "defined";
             recommended_prices_status = "defined";
             price_fixing_risk_status = "low_risk" или "high_risk"
             в зависимости от формулировки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для antitrust_pricing_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status (pricing_regime_status, recommended_prices_status) используй только: "defined", "not_defined".
        - Для price_fixing_risk_status используй только:
          "high_risk", "low_risk", "not_defined".
        - Fallback при отсутствии данных:
          * pricing_regime_details, price_fixing_risk_details,
            recommended_prices_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "antitrust_pricing_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ценообразованию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pricing_regime_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус режима ценообразования. Внутреннее enum-поле."
          required: true

        - name: "pricing_regime_details"
          type: "string"
          presentation: "fact"
          label: "Режим ценообразования"
          description: >
            Режим ценообразования (рекомендованный / обязательный). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "price_fixing_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high_risk", "low_risk", "not_defined"]
          description: "Статус риска ничтожности условия о фиксации цен. Внутреннее enum-поле."
          required: true

        - name: "price_fixing_risk_details"
          type: "string"
          presentation: "fact"
          label: "Риск фиксации цен"
          description: >
            Обоснование риска ничтожности (точная формулировка). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "recommended_prices_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о рекомендованных ценах. Внутреннее enum-поле."
          required: true

        - name: "recommended_prices_details"
          type: "string"
          presentation: "fact"
          label: "Прайс-листы"
          description: >
            Условие о прайс-листах и их обновлении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: revenue_audit_succession_check
    name: "Аудит выручки и правопреемство при ликвидации / смерти франчайзи"
    description: >
      Фактографическая проверка права франчайзера на аудит финансовой
      отчётности франчайзи (для контроля роялти) и условий перехода прав
      в случае ликвидации или смерти франчайзи (наличие льготного периода
      для правопреемников).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "аудит выручки"
        - "аудиторская проверка"
        - "проверка кассовой дисциплины"
        - "отчётность о выручке"
        - "доступ к POS"
        - "доступ к CRM"
        - "правопреемник"
        - "ликвидация франчайзи"
        - "смерть франчайзи"
        - "наследник"
        - "льготный период"
        - "переход прав"
        - "реорганизация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзер\\s+вправе\\s+проводить\\s+аудит"
        - "(?i)проверк\\w+\\s+(финансов|кассов|отчётн)"
        - "(?i)в\\s+случае\\s+(ликвидаци|смерт).*франчайзи"
        - "(?i)правопреемник.*льготн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии.
        Проверяются только два вопроса:
        1) право франчайзера на аудит финансовой отчётности франчайзи;
        2) условия перехода прав при ликвидации или смерти франчайзи.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право франчайзера на аудит выручки и финансовой отчётности.
        2. Периодичность и порядок аудита.
        3. Доступ к POS / CRM для целей аудита.
        4. Условия перехода прав при ликвидации или смерти франчайзи.
        5. Льготный период для правопреемников.
        6. Условия прекращения договора при отсутствии правопреемника.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор условий:
        Фрагмент:
        "Франчайзер вправе проводить аудит финансовой отчётности Франчайзи
        не реже 1 раза в квартал с доступом к POS-терминалам. В случае
        ликвидации или смерти Франчайзи договор может быть переоформлен
        на правопреемника в течение 6 месяцев при соблюдении стандартов сети."

        Ответ:
        {
          "revenue_audit_right_status": "defined",
          "revenue_audit_right_details": "аудит финансовой отчётности не реже 1 раза в квартал с доступом к POS-терминалам",
          "audit_frequency_status": "defined",
          "audit_frequency_details": "не реже 1 раза в квартал",
          "pos_crm_access_status": "defined",
          "pos_crm_access_details": "доступ к POS-терминалам",
          "succession_terms_status": "defined",
          "succession_terms_details": "переоформление на правопреемника в течение 6 месяцев при соблюдении стандартов",
          "grace_period_status": "defined",
          "grace_period_details": "6 месяцев",
          "evidence": [{"clause_ref": "п. 6.1", "quote": "Франчайзер вправе проводить аудит финансовой отчётности Франчайзи не реже 1 раза в квартал."}]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Франчайзи ведёт финансовую отчётность в соответствии с законодательством."

        Ответ:
        {
          "revenue_audit_right_status": "not_defined",
          "revenue_audit_right_details": "Данные не определены",
          "audit_frequency_status": "not_defined",
          "audit_frequency_details": "Данные не определены",
          "pos_crm_access_status": "not_defined",
          "pos_crm_access_details": "Данные не определены",
          "succession_terms_status": "not_defined",
          "succession_terms_details": "Данные не определены",
          "grace_period_status": "not_defined",
          "grace_period_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о праве на аудит выручки.
        2. Найди прямую цитату о периодичности аудита.
        3. Найди прямую цитату о доступе к POS / CRM.
        4. Найди прямую цитату о правопреемниках или ликвидации.
        5. Найди прямую цитату о льготном периоде.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "revenue_audit_right_status": "<defined / not_defined>",
          "revenue_audit_right_details": "<текст или 'Данные не определены'>",
          "audit_frequency_status": "<defined / not_defined>",
          "audit_frequency_details": "<текст или 'Данные не определены'>",
          "pos_crm_access_status": "<defined / not_defined>",
          "pos_crm_access_details": "<текст или 'Данные не определены'>",
          "succession_terms_status": "<defined / not_defined>",
          "succession_terms_details": "<текст или 'Данные не определены'>",
          "grace_period_status": "<defined / not_defined>",
          "grace_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аудит выручки аудиторская проверка проверка кассовой дисциплины отчётность о выручке доступ к POS доступ к CRM правопреемник ликвидация франчайзи смерть франчайзи наследник льготный период переход прав реорганизация"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "рекламный фонд"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "revenue_audit_succession_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об аудите выручки (для контроля роялти) и правопреемстве
        при ликвидации или смерти франчайзи.
        Не анализируй комплекс прав, территорию или контроль качества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. revenue_audit_succession_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (revenue_audit_right_status, audit_frequency_status,
              pos_crm_access_status, succession_terms_status,
              grace_period_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - revenue_audit_right_status = "not_defined";
           - audit_frequency_status = "not_defined";
           - pos_crm_access_status = "not_defined";
           - succession_terms_status = "not_defined";
           - grace_period_status = "not_defined";
           - revenue_audit_right_details, audit_frequency_details,
             pos_crm_access_details, succession_terms_details,
             grace_period_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. revenue_audit_right_status:
           - "defined" — если прямо указано право франчайзера проводить
             аудит финансовой отчётности, выручки, кассовой дисциплины
             франчайзи;
           - "not_defined" — иначе.

        2. revenue_audit_right_details:
           Краткое user-facing описание права на аудит
           (например: "аудит финансовой отчётности не реже 1 раза
           в квартал с доступом к POS-терминалам").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. audit_frequency_status:
           - "defined" — если прямо указана периодичность аудита
             (раз в квартал, ежегодно, по требованию);
           - "not_defined" — иначе.

        4. audit_frequency_details:
           Краткое user-facing описание периодичности
           (например: "не реже 1 раза в квартал").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. pos_crm_access_status:
           - "defined" — если прямо указан доступ франчайзера
             к POS-терминалам, CRM-системе или иным системам франчайзи
             для целей аудита;
           - "not_defined" — иначе.

        6. pos_crm_access_details:
           Краткое user-facing описание доступа
           (например: "доступ к POS-терминалам").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. succession_terms_status:
           - "defined" — если прямо указаны условия перехода прав
             при ликвидации, реорганизации или смерти франчайзи
             (переоформление на правопреемника, наследника);
           - "not_defined" — иначе.

        8. succession_terms_details:
           Краткое user-facing описание условий правопреемства
           (например: "переоформление на правопреемника в течение
           6 месяцев при соблюдении стандартов").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. grace_period_status:
           - "defined" — если прямо указан льготный период
             для правопреемников (срок на переоформление договора);
           - "not_defined" — иначе.

        10. grace_period_details:
            Краткое user-facing описание льготного периода
            (например: "6 месяцев").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни revenue_audit_succession_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи условия аудита или правопреемства из норм закона — только из прямого текста договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, сроке договора, контроле качества, обучении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай две подтемы: право на аудит (revenue_audit_right_status, audit_frequency_status, pos_crm_access_status) и правопреемство (succession_terms_status, grace_period_status).
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на аудит, ни периодичности, ни доступа
           к POS/CRM, ни условий правопреемства, ни льготного периода.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзер вправе проверять деятельность
              Франчайзи" без конкретики по предмету, периодичности
              и доступу к системам.
              → presence = "present";
                revenue_audit_right_status = "defined";
                audit_frequency_status = "not_defined";
                pos_crm_access_status = "not_defined".
           б) Прямо указано, что при отсутствии правопреемника договор
              прекращается без льготного периода.
              → presence = "present";
                grace_period_status = "not_defined";
                grace_period_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сроки льготного
           периода или противоречивые условия аудита.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Условия аудита и правопреемства описаны в одном разделе
           договора.
           → presence = "present";
             все соответствующие *_status = "defined";
             все соответствующие *_details заполнены.

           Либо: правопреемство описано только для одного типа событий
           (например, для смерти, но не для ликвидации).
           → succession_terms_status = "defined";
             succession_terms_details уточняет область действия.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для revenue_audit_succession_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "revenue_audit_succession_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по аудиту выручки и правопреемству. Внутреннее агрегатное signal-поле."
          required: true

        - name: "revenue_audit_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на аудит выручки. Внутреннее enum-поле."
          required: true

        - name: "revenue_audit_right_details"
          type: "string"
          presentation: "fact"
          label: "Аудит выручки"
          description: >
            Право франчайзера на аудит финансовой отчётности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "audit_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус периодичности аудита. Внутреннее enum-поле."
          required: true

        - name: "audit_frequency_details"
          type: "string"
          presentation: "fact"
          label: "Периодичность аудита"
          description: >
            Периодичность проведения аудита. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "pos_crm_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус доступа к POS / CRM. Внутреннее enum-поле."
          required: true

        - name: "pos_crm_access_details"
          type: "string"
          presentation: "fact"
          label: "Доступ к POS / CRM"
          description: >
            Доступ к POS / CRM для целей аудита. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "succession_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий правопреемства. Внутреннее enum-поле."
          required: true

        - name: "succession_terms_details"
          type: "string"
          presentation: "fact"
          label: "Правопреемство"
          description: >
            Условия перехода прав при ликвидации или смерти франчайзи. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "grace_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус льготного периода для правопреемников. Внутреннее enum-поле."
          required: true

        - name: "grace_period_details"
          type: "string"
          presentation: "fact"
          label: "Льготный период"
          description: >
            Льготный период для переоформления договора на правопреемника. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: competitive_restrictions_check
    name: "Ограничения конкуренции (кроме цен): запрет конкурирующей деятельности, других брендов, аналогичных франшиз"
    description: >
      Фактографическая проверка условий договора о неконкуренции и иных
      ограничениях, прямо предусмотренных п. 1 ст. 1033 ГК РФ: запрет
      конкурирующей деятельности, работы под другими брендами, получения
      аналогичных прав у конкурентов франчайзера. Проверка не касается
      ценообразования (см. отдельный check).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неконкуренция"
        - "конкурирующая деятельность"
        - "запрет конкурировать"
        - "запрет работы под другими брендами"
        - "аналогичные права у конкурентов"
        - "запрет открывать аналогичный бизнес"
        - "ограничения конкуренции"
        - "конкурентная деятельность"
        - "не вправе конкурировать"
        - "отказ от конкуренции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франчайзи\\s+(обязуется|не\\s+вправе)\\s+не\\s+конкурир"
        - "(?i)запрещ(ается|ено)\\s+осуществлять\\s+конкурирующ"
        - "(?i)не\\s+вправе\\s+(получать|приобретать)\\s+аналогичн"
        - "(?i)запрет\\s+.*под\\s+другими\\s+(бренд|торговыми\\s+марк)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор коммерческой концессии (п. 1 ст. 1033 ГК РФ).
        Проверяется только один вопрос: ограничения конкуренции (кроме цен).

        Нормативный ориентир:
        - п. 1 ст. 1033 ГК РФ — допустимые ограничения конкуренции

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Ценообразование и фиксация цен — НЕ тема этого check (см. отдельный check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Запрет франчайзи на конкурирующую деятельность в период действия договора.
        2. Запрет работы под другими брендами (вне сети франчайзера).
        3. Запрет получать аналогичные права у конкурентов франчайзера.
        4. Территорию и срок действия ограничений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзи обязуется не осуществлять конкурирующую деятельность на территории
        действия договора, не работать под другими товарными знаками и не приобретать
        аналогичные права у конкурентов Франчайзера в течение срока договора."

        Ответ:
        {
          "competitive_restrictions_status": "defined",
          "competing_business_prohibition_status": "defined",
          "other_brands_prohibition_status": "defined",
          "competitor_franchise_prohibition_status": "defined",
          "restrictions_scope_status": "defined",
          "restrictions_scope_details": "на территории действия договора, в течение срока договора",
          "restrictions_duration_details": "в течение срока договора",
          "evidence": [{"clause_ref": "п. 4.2", "quote": "Франчайзи обязуется не осуществлять конкурирующую деятельность на территории действия договора."}]
        }

        Пример 2:
        Фрагмент:
        "Франчайзи использует комплекс прав в деятельности."

        Ответ:
        {
          "competitive_restrictions_status": "not_defined",
          "competing_business_prohibition_status": "not_defined",
          "other_brands_prohibition_status": "not_defined",
          "competitor_franchise_prohibition_status": "not_defined",
          "restrictions_scope_status": "not_defined",
          "restrictions_scope_details": "Данные не определены",
          "restrictions_duration_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о запрете конкурирующей деятельности.
        2. Найди прямую цитату о запрете других брендов.
        3. Найди прямую цитату о запрете аналогичных франшиз.
        4. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "competitive_restrictions_status": "<defined / not_defined>",
          "competing_business_prohibition_status": "<defined / not_defined>",
          "other_brands_prohibition_status": "<defined / not_defined>",
          "competitor_franchise_prohibition_status": "<defined / not_defined>",
          "restrictions_scope_status": "<defined / not_defined>",
          "restrictions_scope_details": "<текст или 'Данные не определены'>",
          "restrictions_duration_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неконкуренция конкурирующая деятельность запрет конкурировать ограничения конкуренции запрет работы под другими брендами аналогичные права у конкурентов запрет открывать аналогичный бизнес"
      retrieval_profile: "competitive_restrictions_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория договора"
        - "срок действия договора"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "цена"
        - "прайс-лист"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "competitive_restrictions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об ограничениях конкуренции (кроме цен): запрет конкурирующей
        деятельности, работы под другими брендами, получения аналогичных
        прав у конкурентов.
        Не анализируй ценообразование, вознаграждение, территорию договора
        или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. competitive_restrictions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (competitive_restrictions_status,
              competing_business_prohibition_status,
              other_brands_prohibition_status,
              competitor_franchise_prohibition_status,
              restrictions_scope_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - competitive_restrictions_status = "not_defined";
           - competing_business_prohibition_status = "not_defined";
           - other_brands_prohibition_status = "not_defined";
           - competitor_franchise_prohibition_status = "not_defined";
           - restrictions_scope_status = "not_defined";
           - restrictions_scope_details, restrictions_duration_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. competitive_restrictions_status:
           - "defined" — если в тексте прямо указаны хотя бы какие-либо
             ограничения конкуренции для франчайзи;
           - "not_defined" — иначе.

        2. competing_business_prohibition_status:
           - "defined" — если прямо указан запрет франчайзи осуществлять
             конкурирующую деятельность в период действия договора;
           - "not_defined" — иначе.

        3. other_brands_prohibition_status:
           - "defined" — если прямо указан запрет франчайзи работать
             под другими товарными знаками / брендами вне сети франчайзера;
           - "not_defined" — иначе.

        4. competitor_franchise_prohibition_status:
           - "defined" — если прямо указан запрет франчайзи получать
             аналогичные права (заключать аналогичные договоры)
             у конкурентов франчайзера;
           - "not_defined" — иначе.

        5. restrictions_scope_status:
           - "defined" — если прямо указаны территория и/или срок
             действия ограничений конкуренции;
           - "not_defined" — иначе.

        6. restrictions_scope_details:
           Краткое user-facing описание сферы действия ограничений
           (например: "на территории действия договора").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. restrictions_duration_details:
           Краткое user-facing описание срока действия ограничений
           (например: "в течение срока договора", "2 года после расторжения").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни competitive_restrictions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о ценообразовании, вознаграждении, территории договора, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай ограничения конкуренции с пост-контрактной неконкуренцией (это отдельный аспект, если он относится к последствиям расторжения — учитывай только прямое указание в этом check).
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета конкурирующей деятельности,
           ни запрета других брендов, ни запрета аналогичных франшиз.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзи соблюдает стандарты сети"
              без указания ограничений конкуренции.
              → presence = "present";
                competitive_restrictions_status = "not_defined".
           б) Прямо указано, что франчайзи вправе осуществлять иную
              деятельность без ограничений.
              → presence = "present";
                competitive_restrictions_status = "not_defined";
                соответствующие поля содержат дословную формулировку
                отсутствия ограничений.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           об ограничениях конкуренции.
           → presence = "unclear";
             соответствующий *_status = "not_defined".

        4. Комбинированная ситуация.
           Несколько видов ограничений конкуренции указаны в одном пункте.
           → presence = "present";
             все соответствующие *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для competitive_restrictions_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * restrictions_scope_details, restrictions_duration_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "competitive_restrictions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ограничениям конкуренции. Внутреннее агрегатное signal-поле."
          required: true

        - name: "competitive_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия ограничений конкуренции. Внутреннее enum-поле."
          required: true

        - name: "competing_business_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета конкурирующей деятельности. Внутреннее enum-поле."
          required: true

        - name: "other_brands_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета работы под другими брендами. Внутреннее enum-поле."
          required: true

        - name: "competitor_franchise_prohibition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета получать аналогичные права у конкурентов. Внутреннее enum-поле."
          required: true

        - name: "restrictions_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения территории и срока ограничений. Внутреннее enum-поле."
          required: true

        - name: "restrictions_scope_details"
          type: "string"
          presentation: "fact"
          label: "Сфера ограничений"
          description: >
            Территория действия ограничений конкуренции. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "restrictions_duration_details"
          type: "string"
          presentation: "fact"
