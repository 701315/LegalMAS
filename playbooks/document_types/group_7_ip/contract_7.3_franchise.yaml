        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о праве на аудит выручки.
        2. Найди прямую цитату о периодичности аудита.
        3. Найди прямую цитату о доступе к POS / CRM.
        4. Найди прямую цитату о правопреемниках или ликвидации.
        5. Найди прямую цитату о льготном периоде.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "revenue_audit_right_status": "<defined / not_defined>",
          "revenue_audit_right_details": "<текст или 'Данные не определены'>",
          "audit_frequency_status": "<defined / not_defined>",
          "audit_frequency_details": "<текст или 'Данные не определены'>",
          "pos_crm_access_status": "<defined / not_defined>",
          "pos_crm_access_details": "<текст или 'Данные не определены'>",
          "succession_terms_status": "<defined / not_defined>",
          "succession_terms_details": "<текст или 'Данные не определены'>",
          "grace_period_status": "<defined / not_defined>",
          "grace_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аудит выручки аудиторская проверка проверка кассовой дисциплины отчётность о выручке доступ к POS доступ к CRM правопреемник ликвидация франчайзи смерть франчайзи наследник льготный период переход прав реорганизация"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "рекламный фонд"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об аудите выручки (для контроля роялти) и правопреемстве
        при ликвидации или смерти франчайзи.
        Не анализируй комплекс прав, территорию или контроль качества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 ключей (6 полей + evidence):

        1. revenue_audit_right_status — "defined" или "not_defined".
        2. revenue_audit_right_details — право на аудит финансовой отчётности.
        3. audit_frequency_status — "defined" или "not_defined".
        4. audit_frequency_details — периодичность аудита.
        5. pos_crm_access_status — "defined" или "not_defined".
        6. pos_crm_access_details — доступ к POS / CRM для целей аудита.
        7. succession_terms_status — "defined" или "not_defined".
        8. succession_terms_details — условия перехода прав при ликвидации / смерти.
        9. grace_period_status — "defined" или "not_defined".
        10. grace_period_details — льготный период для правопреемников.
        11. evidence — массив цитат из договора.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный для
        парсинга через json.loads без предварительной обработки. Без markdown,
        без комментариев, без текста до или после. Начни ответ сразу с { и
        закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи условия аудита или правопреемства из норм закона.
        </rules>

      fields:
        - name: "revenue_audit_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на аудит выручки."
          required: true
        - name: "revenue_audit_right_details"
          type: "string"
          presentation: "fact"
          label: "Аудит выручки"
          description: "Право франчайзера на аудит финансовой отчётности."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "audit_frequency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус периодичности аудита."
          required: true
        - name: "audit_frequency_details"
          type: "string"
          presentation: "fact"
          label: "Периодичность аудита"
          description: "Периодичность проведения аудита."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "pos_crm_access_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус доступа к POS / CRM."
          required: true
        - name: "pos_crm_access_details"
          type: "string"
          presentation: "fact"
          label: "Доступ к POS / CRM"
          description: "Доступ к POS / CRM для целей аудита."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "succession_terms_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий правопреемства."
          required: true
        - name: "succession_terms_details"
          type: "string"
          presentation: "fact"
          label: "Правопреемство"
          description: "Условия перехода прав при ликвидации или смерти франчайзи."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "grace_period_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус льготного периода для правопреемников."
          required: true
        - name: "grace_period_details"
          type: "string"
          presentation: "fact"
          label: "Льготный период"
          description: "Льготный период для переоформления договора на правопреемника."
          required: false
          display_in_grid: true
          display_priority: 5

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  franchise_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты франчайзера
      и франчайзи (обе стороны должны быть коммерческими организациями/ИП);
      (б) полный перечень объектов ИС в комплексе прав с регистрационными
      данными (товарный знак — номер свидетельства, дата, срок действия);
      (в) описание ноу-хау; (г) сферу предпринимательской деятельности.
      Комплекс ОБЯЗАТЕЛЬНО должен включать товарный знак или коммерческое
      обозначение (п. 1 ст. 1027 ГК РФ).
    addressee: "Франчайзер / Юридический советник"

  remuneration_structure_check:
    text: >
      Просим предоставить полную структуру вознаграждения по {doc_names}:
      (а) паушальный взнос (размер, порядок уплаты);
      (б) роялти (ставка, база расчёта, периодичность);
      (в) рекламные отчисления (ставка, целевое использование);
      (г) прочие платежи.
    addressee: "Финансовый отдел"

  territory_term_renewal_check:
    text: >
      Просим уточнить по {doc_names}: (а) территорию использования
      (эксклюзивность, радиус защиты); (б) срок действия договора;
      (в) преимущественное право франчайзи на продление (ст. 1035 ГК РФ);
      (г) условия и порядок продления; (д) последствия отказа от продления.
    addressee: "Обе стороны / Юридический советник"

  quality_control_training_check:
    text: >
      Просим согласовать для {doc_names}: (а) право франчайзера на контроль
      качества и инспекции (периодичность, доступ, тайный покупатель);
      (б) обязанности по обучению (первоначальное, периодическое);
      (в) постоянную консультационную поддержку;
      (г) помощь в открытии точки;
      (д) маркетинговую поддержку;
      (е) субсидиарную ответственность франчайзера за качество (ст. 1034 ГК РФ).
    addressee: "Обе стороны"

  knowhow_confidentiality_check:
    text: >
      Просим включить в {doc_names} строгие условия защиты ноу-хау:
      (а) обязательство неразглашения; (б) срок конфиденциальности
      (включая пост-контрактный период); (в) запрет использования ноу-хау
      для конкурирующего бизнеса; (г) санкции за разглашение;
      (д) отдельное NDA.
    addressee: "Юридический советник франчайзера"

  termination_rebranding_check:
    text: >
      Просим согласовать для {doc_names}: (а) исчерпывающий перечень оснований
      досрочного расторжения для каждой стороны; (б) cure period;
      (в) обязательства по ребрендингу (срок демонтажа вывесок, удаление
      из интернета); (г) неконкуренцию (срок, территория);
      (д) возврат материалов франчайзера; (е) штрафы за нарушение
      пост-контрактных обязательств.
    addressee: "Юридический советник"

  subfranchising_check:
    text: >
      Если в {doc_names} предусмотрена субконцессия, просим согласовать:
      (а) обязательность письменного согласия франчайзера на каждого
      субфранчайзи; (б) критерии одобрения; (в) право франчайзера
      контролировать субфранчайзи напрямую; (г) ответственность франчайзи
      за действия субфранчайзи; (д) порядок распределения вознаграждения.
    addressee: "Обе стороны"

  standards_change_check:
    text: >
      Просим ограничить право франчайзера на односторонние изменения стандартов
      в {doc_names}: (а) срок уведомления (не менее 6-12 месяцев);
      (б) срок на внедрение; (в) компенсация затрат франчайзи;
      (г) право франчайзи расторгнуть договор при существенных изменениях
      без штрафов.
    addressee: "Юридический советник франчайзера"

  disclosure_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить Disclosure Document (FDD)
      по {doc_names}: (а) информацию о франчайзере (финансовое положение,
      судебные споры, история компании); (б) количество действующих и закрытых
      точек (по годам); (в) реальные финансовые показатели существующих
      франчайзи; (г) списки существующих франчайзи (для контакта и проверки).
      Без полного раскрытия франчайзи принимает решение вслепую.
    addressee: "Франчайзер / Юридический советник франчайзера"

  purchasing_advertising_check:
    text: >
      Просим уточнить для {doc_names}: (а) перечень товаров/услуг, подлежащих
      закупке у франчайзера/одобренных поставщиков; (б) механизм ценообразования;
      (в) минимальный объём закупок и санкции; (г) право франчайзи предлагать
      альтернативных поставщиков; (д) прозрачность рекламного фонда:
      порядок формирования, отчётность, право аудита, целевое использование.
    addressee: "Юридический советник / Финансовый отдел"

  ip_validity_registration_check:
    text: >
      Просим предоставить по {doc_names}: (а) актуальное свидетельство
      о регистрации ТЗ с датой окончания действия; (б) подтверждение,
      что правообладатель ТЗ = франчайзер; (в) обязательство франчайзера
      продлевать регистрацию ТЗ; (г) порядок уведомления при оспаривании ТЗ;
      (д) последствия утраты ТЗ; (е) условия регистрации договора в Роспатенте
      (ответственная сторона, срок, расходы). Без зарегистрированного ТЗ
      договор не может быть зарегистрирован в Роспатенте.
    addressee: "Франчайзер / Патентный поверенный"

  digital_assets_check:
    text: >
      Просим согласовать для {doc_names} условия использования IT-систем:
      (а) перечень предоставляемых IT-систем (CRM, POS, мобильное приложение,
      сайт); (б) принадлежность базы данных клиентов (критично!);
      (в) принадлежность домена и аккаунтов в соцсетях; (г) порядок доступа
      к данным после расторжения; (д) обязанность франчайзера по техподдержке;
      (е) SLA (время реакции на сбои).
    addressee: "IT-отдел / Юридический советник"

  dispute_insurance_check:
    text: >
      Просим согласовать для {doc_names}: (а) претензионный порядок (сроки,
      форма); (б) медиация как обязательный этап; (в) арбитраж vs
      государственный суд; (г) место рассмотрения споров; (д) применимое право
      (для кросс-бордер франшиз); (е) требования к страхованию ответственности
      франчайзи (виды, минимальные суммы, выгодоприобретатель).
    addressee: "Юридический советник / Страховой брокер"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

