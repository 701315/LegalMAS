      required_kind: "legal_unit"
      retrieval_query: "контроль качества инспекции проверки точек соблюдение стандартов аудит качества тайный покупатель обучение первоначальное обучение тренинг консультационная поддержка техническое содействие помощь в открытии маркетинговая поддержка субсидиарная ответственность ответственность за качество претензии потребителей"
      retrieval_profile: "liability_cap_check"
