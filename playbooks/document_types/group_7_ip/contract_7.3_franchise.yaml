           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - improvements_scope_details, ownership_allocation_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. ip_improvements_status:
           - "defined" — если в тексте прямо упомянуты улучшения,
             модификации, производные объекты, создаваемые франчайзи;
           - "not_defined" — иначе.

        2. improvements_ownership_status:
           - "defined" — если прямо указано, кому принадлежат права
             на улучшения (франчайзеру, франчайзи, совместно);
           - "not_defined" — иначе.

        3. transfer_obligation_status:
           - "defined" — если прямо указана обязанность франчайзи
             передать улучшения франчайзеру;
           - "not_defined" — иначе.

