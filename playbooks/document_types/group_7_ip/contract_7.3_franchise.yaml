  - id: amendment_procedure_check
    name: "Порядок изменения договора и приоритет документов"
    description: >
      Фактографическая проверка общего порядка изменения договора:
      письменная форма, односторонние изменения, приоритет документов
      (оговорка о поглощении), порядок заключения дополнительных соглашений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение договора"
        - "дополнительное соглашение"
        - "письменная форма"
        - "одностороннее изменение"
        - "изменение в одностороннем порядке"
        - "приоритет документов"
        - "оговорка о поглощении"
        - "entire agreement"
        - "недействительность предыдущих договорённостей"
        - "существенное изменение обстоятельств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[яй]\\s+.*(?:только\\s+)?письменн"
        - "(?i)дополнительн\\w+\\s+соглашени"
        - "(?i)(приоритет|поглощени).*договор"
        - "(?i)односторонн\\w+\\s+порядк.*измен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: порядок изменения договора.

        Нормативный ориентир:
        - ст. 450–453 ГК РФ — изменение и расторжение договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Изменение стандартов сети — отдельная тема (см. соответствующий check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общий порядок изменения договора.
        2. Требование письменной формы.
        3. Односторонние изменения.
        4. Приоритет документов (оговорка о поглощении).
        5. Порядок работы с доп. соглашениями.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Все изменения оформляются дополнительными соглашениями в письменной
        форме. Франчайзер вправе в одностороннем порядке изменять
        операционные стандарты с уведомлением за 30 дней. Настоящий договор
        заменяет все предыдущие договорённости сторон (оговорка о поглощении)."

        Ответ:
        {
          "amendment_procedure_status": "defined",
          "written_form_status": "defined",
          "unilateral_amendment_status": "defined",
          "entire_agreement_status": "defined",
          "amendment_scope_details": "дополнительные соглашения в письменной форме",
          "unilateral_amendment_details": "операционные стандарты, уведомление за 30 дней",
          "evidence": [{"clause_ref": "п. 10.1", "quote": "Все изменения оформляются дополнительными соглашениями в письменной форме."}]
        }

        Пример 2:
        Фрагмент:
        "Договор действует с момента подписания."

        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "written_form_status": "not_defined",
          "unilateral_amendment_status": "not_defined",
          "entire_agreement_status": "not_defined",
          "amendment_scope_details": "Данные не определены",
          "unilateral_amendment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату о порядке изменений.
        2. Найди прямую цитату о письменной форме.
        3. Найди прямую цитату об односторонних изменениях.
        4. Найди прямую цитату о приоритете документов.
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "written_form_status": "<defined / not_defined>",
          "unilateral_amendment_status": "<defined / not_defined>",
          "entire_agreement_status": "<defined / not_defined>",
          "amendment_scope_details": "<текст или 'Данные не определены'>",
          "unilateral_amendment_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение договора дополнительное соглашение письменная форма одностороннее изменение изменение в одностороннем порядке приоритет документов оговорка о поглощении entire agreement недействительность предыдущих договорённостей"
      retrieval_profile: "amendment_procedure_check"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "стандарты сети"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "amendment_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        общий порядок изменения договора: форма, односторонние изменения,
        приоритет документов.
        Не анализируй изменение стандартов сети — это отдельная тема.
        Не оценивай риски.
        Анализируй только текст договора.
