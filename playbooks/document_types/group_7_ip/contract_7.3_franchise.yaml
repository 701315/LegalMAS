        - name: "unilateral_amendment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус односторонних изменений. Внутреннее enum-поле."
          required: true

        - name: "entire_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки о поглощении. Внутреннее enum-поле."
          required: true

        - name: "amendment_scope_details"
          type: "string"
          presentation: "fact"
          label: "Порядок изменений"
          description: >
            Порядок изменения договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "unilateral_amendment_details"
          type: "string"
          presentation: "fact"
          label: "Односторонние изменения"
          description: >
            Односторонние изменения договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: security_measures_check
    name: "Обеспечительные меры: задаток, обеспечительный платёж, гарантия, поручительство"
    description: >
      Фактографическая проверка условий об обеспечительных мерах по договору:
      обеспечительный платёж (депозит), задаток, банковская гарантия,
      поручительство учредителей, порядок возврата и удержания.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обеспечительный платёж"
        - "обеспечительный взнос"
        - "депозит"
        - "задаток"
        - "банковская гарантия"
        - "поручительство"
        - "гарантия учредителей"
        - "обеспечение исполнения"
        - "возврат обеспечительного платежа"
        - "удержание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеспечительн\\w+\\s+(платёж|взнос|депозит)"
        - "(?i)(банковск\\w+\\s+гаранти|поручительств)"
        - "(?i)задаток\\s+в\\s+размере"
        - "(?i)возврат\\s+обеспечительн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор коммерческой концессии.
        Проверяется только один вопрос: обеспечительные меры.

        Нормативный ориентир:
        - ст. 380–381 ГК РФ — задаток
        - ст. 368–379 ГК РФ — независимая гарантия
        - ст. 361–367 ГК РФ — поручительство

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не смешивай с неустойками и штрафами — это тема другого check'а.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Виды обеспечительных мер.
        2. Обеспечительный платёж (депозит).
        3. Банковскую гарантию.
        4. Поручительство (в т.ч. учредителей).
        5. Порядок возврата и условия удержания.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для статусных полей (enum): если данные не указаны прямо — возвращай "not_defined".
        3. Для текстовых полей: если значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только прямые цитаты из текста договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга через json.loads без предварительной обработки. Без markdown, без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Франчайзи вносит обеспечительный платёж 500 000 рублей. Возврат —
        через 30 дней после прекращения договора при отсутствии задолженности.
        Обеспечительный платёж может быть удержан в счёт штрафов. Гарантию
        предоставляют учредители Франчайзи в форме поручительства."

        Ответ:
        {
          "security_measures_status": "defined",
          "security_deposit_status": "defined",
          "bank_guarantee_status": "not_defined",
          "personal_guarantee_status": "defined",
          "security_return_status": "defined",
          "security_amount_details": "500 000 рублей",
          "security_return_conditions_details": "возврат через 30 дней после прекращения при отсутствии задолженности, возможен зачёт штрафов",
          "evidence": [{"clause_ref": "п. 3.5", "quote": "Франчайзи вносит обеспечительный платёж 500 000 рублей."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор без обеспечительных мер."

        Ответ:
        {
          "security_measures_status": "defined",
          "security_deposit_status": "not_defined",
          "bank_guarantee_status": "not_defined",
          "personal_guarantee_status": "not_defined",
          "security_return_status": "not_defined",
          "security_amount_details": "Данные не определены",
          "security_return_conditions_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 3.5", "quote": "Стороны заключили настоящий договор без обеспечительных мер."}]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Франчайзи использует комплекс прав в деятельности."

        Ответ:
        {
          "security_measures_status": "not_defined",
          "security_deposit_status": "not_defined",
          "bank_guarantee_status": "not_defined",
          "personal_guarantee_status": "not_defined",
          "security_return_status": "not_defined",
          "security_amount_details": "Данные не определены",
          "security_return_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Найди прямую цитату об обеспечительных мерах.
        2. Найди прямую цитату об обеспечительном платеже.
        3. Найди прямую цитату о банковской гарантии.
        4. Найди прямую цитату о поручительстве.
        5. Найди прямую цитату о возврате.
        6. Если прямой цитаты нет — верни "not_defined" для статусных полей и "Данные не определены" для текстовых.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "security_measures_status": "<defined / not_defined>",
          "security_deposit_status": "<defined / not_defined>",
          "bank_guarantee_status": "<defined / not_defined>",
          "personal_guarantee_status": "<defined / not_defined>",
          "security_return_status": "<defined / not_defined>",
          "security_amount_details": "<текст или 'Данные не определены'>",
          "security_return_conditions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 9
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обеспечительный платёж обеспечительный взнос депозит задаток банковская гарантия независимая гарантия поручительство гарантия учредителей обеспечение исполнения возврат обеспечительного платежа удержание"
      retrieval_profile: "security_measures_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "комплекс прав"
        - "товарный знак"
        - "ноу-хау"
        - "роялти"
        - "паушальный"
        - "территория"
        - "срок действия"
        - "контроль качества"
        - "обучение"
        - "расторжение"
        - "субконцессия"
        - "конфиденциальность"
        - "ребрендинг"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.25
        scope: segment
      context_k: 9
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "security_measures_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора коммерческой концессии
        условия об обеспечительных мерах: обеспечительный платёж,
        банковская гарантия, поручительство, порядок возврата.
        Не анализируй неустойки и штрафы как таковые.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. security_measures_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (security_measures_status, security_deposit_status,
              bank_guarantee_status, personal_guarantee_status,
              security_return_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - security_amount_details, security_return_conditions_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. security_measures_status:
           - "defined" — если в тексте прямо указано наличие или прямое
             отсутствие обеспечительных мер по договору;
           - "not_defined" — иначе.

        2. security_deposit_status:
           - "defined" — если прямо указан обеспечительный платёж,
             обеспечительный взнос, депозит или задаток;
           - "not_defined" — иначе.

        3. bank_guarantee_status:
           - "defined" — если прямо указана банковская или независимая
             гарантия как обеспечение;
           - "not_defined" — иначе.

        4. personal_guarantee_status:
           - "defined" — если прямо указано поручительство физического
             лица (учредителя, руководителя) или иной личный гарант;
           - "not_defined" — иначе.

        5. security_return_status:
           - "defined" — если прямо указан порядок возврата обеспечительного
             платежа или условия его удержания;
           - "not_defined" — иначе.

        6. security_amount_details:
           Краткое user-facing описание суммы и вида обеспечения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. security_return_conditions_details:
           Краткое user-facing описание порядка возврата и удержания.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни security_measures_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о комплексе прав, вознаграждении, территории, контроле качества, обучении, расторжении, субконцессии, конфиденциальности, ребрендинге и иных нерелевантных темах.
        - Не смешивай обеспечительные меры с неустойками и штрафами (это тема другого check'а). Обеспечительный платёж, из которого удерживаются штрафы, остаётся обеспечительной мерой.
        - Если в разных фрагментах указаны противоречивые суммы или условия — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обеспечительных мер, ни возврата,
           ни упоминания их отсутствия.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Франчайзи предоставляет обеспечение"
              без конкретики по видам и суммам.
              → presence = "present";
                security_measures_status = "defined";
                security_deposit_status = "not_defined".
           б) Прямо указано, что обеспечительные меры по договору
              не применяются.
              → presence = "present";
                security_measures_status = "defined";
                соответствующие поля содержат дословную формулировку
                отсутствия.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые суммы
           обеспечительного платежа или условия возврата.
           → presence = "unclear";
             security_deposit_status = "not_defined";
             security_amount_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Несколько видов обеспечения (платёж, поручительство,
           гарантия) указаны в одном пункте договора.
           → presence = "present";
             все соответствующие *_status = "defined";
             все *_details заполнены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для security_measures_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * security_amount_details, security_return_conditions_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "security_measures_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обеспечительным мерам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "security_measures_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обеспечительных мер. Внутреннее enum-поле."
          required: true

        - name: "security_deposit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обеспечительного платежа. Внутреннее enum-поле."
          required: true

        - name: "bank_guarantee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус банковской гарантии. Внутреннее enum-поле."
          required: true

        - name: "personal_guarantee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус поручительства физических лиц. Внутреннее enum-поле."
          required: true

        - name: "security_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата. Внутреннее enum-поле."
          required: true

        - name: "security_amount_details"
          type: "string"
          presentation: "fact"
          label: "Обеспечительные меры"
          description: >
            Сумма и виды обеспечения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "security_return_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Возврат обеспечения"
          description: >
            Порядок возврата и удержания обеспечения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  franchise_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты франчайзера
      и франчайзи (обе стороны должны быть коммерческими организациями/ИП);
      (б) полный перечень объектов ИС в комплексе прав с регистрационными
      данными (товарный знак — номер свидетельства, дата, срок действия);
      (в) описание ноу-хау; (г) сферу предпринимательской деятельности.
      Комплекс ОБЯЗАТЕЛЬНО должен включать товарный знак или коммерческое
      обозначение (п. 1 ст. 1027 ГК РФ).
    addressee: "Франчайзер / Юридический советник"

  remuneration_structure_check:
    text: >
      Просим предоставить полную структуру вознаграждения по {doc_names}:
      (а) паушальный взнос (размер, порядок уплаты);
      (б) роялти (ставка, база расчёта, периодичность);
      (в) рекламные отчисления (ставка, целевое использование);
      (г) прочие платежи.
    addressee: "Финансовый отдел"

  territory_term_renewal_check:
    text: >
      Просим уточнить по {doc_names}: (а) территорию использования
      (эксклюзивность, радиус защиты); (б) срок действия договора;
      (в) преимущественное право франчайзи на продление (ст. 1035 ГК РФ);
      (г) условия и порядок продления; (д) последствия отказа от продления.
    addressee: "Обе стороны / Юридический советник"

  quality_control_training_check:
    text: >
      Просим согласовать для {doc_names}: (а) право франчайзера на контроль
      качества и инспекции (периодичность, доступ, тайный покупатель);
      (б) обязанности по обучению (первоначальное, периодическое);
      (в) постоянную консультационную поддержку;
      (г) помощь в открытии точки;
      (д) маркетинговую поддержку;
      (е) субсидиарную ответственность франчайзера за качество (ст. 1034 ГК РФ).
    addressee: "Обе стороны"

  knowhow_confidentiality_check:
    text: >
      Просим включить в {doc_names} строгие условия защиты ноу-хау:
      (а) обязательство неразглашения; (б) срок конфиденциальности
      (включая пост-контрактный период); (в) запрет использования ноу-хау
      для конкурирующего бизнеса; (г) санкции за разглашение;
      (д) отдельное NDA.
    addressee: "Юридический советник франчайзера"

  termination_rebranding_check:
    text: >
      Просим согласовать для {doc_names}: (а) исчерпывающий перечень оснований
      досрочного расторжения для каждой стороны; (б) cure period;
      (в) обязательства по ребрендингу (срок демонтажа вывесок, удаление
      из интернета); (г) неконкуренцию (срок, территория);
      (д) возврат материалов франчайзера; (е) штрафы за нарушение
      пост-контрактных обязательств.
    addressee: "Юридический советник"

  subfranchising_check:
    text: >
      Если в {doc_names} предусмотрена субконцессия, просим согласовать:
      (а) обязательность письменного согласия франчайзера на каждого
      субфранчайзи; (б) критерии одобрения; (в) право франчайзера
      контролировать субфранчайзи напрямую; (г) ответственность франчайзи
      за действия субфранчайзи; (д) порядок распределения вознаграждения.
    addressee: "Обе стороны"

  standards_change_check:
    text: >
      Просим ограничить право франчайзера на односторонние изменения стандартов
      в {doc_names}: (а) срок уведомления (не менее 6-12 месяцев);
      (б) срок на внедрение; (в) компенсация затрат франчайзи;
      (г) право франчайзи расторгнуть договор при существенных изменениях
      без штрафов.
    addressee: "Юридический советник франчайзера"

  disclosure_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить Disclosure Document (FDD)
      по {doc_names}: (а) информацию о франчайзере (финансовое положение,
      судебные споры, история компании); (б) количество действующих и закрытых
      точек (по годам); (в) реальные финансовые показатели существующих
      франчайзи; (г) списки существующих франчайзи (для контакта и проверки).
      Без полного раскрытия франчайзи принимает решение вслепую.
    addressee: "Франчайзер / Юридический советник франчайзера"

  purchasing_advertising_check:
    text: >
      Просим уточнить для {doc_names}: (а) перечень товаров/услуг, подлежащих
      закупке у франчайзера/одобренных поставщиков; (б) механизм ценообразования;
      (в) минимальный объём закупок и санкции; (г) право франчайзи предлагать
      альтернативных поставщиков; (д) прозрачность рекламного фонда:
      порядок формирования, отчётность, право аудита, целевое использование.
    addressee: "Юридический советник / Финансовый отдел"

  ip_validity_registration_check:
    text: >
      Просим предоставить по {doc_names}: (а) актуальное свидетельство
      о регистрации ТЗ с датой окончания действия; (б) подтверждение,
      что правообладатель ТЗ = франчайзер; (в) обязательство франчайзера
      продлевать регистрацию ТЗ; (г) порядок уведомления при оспаривании ТЗ;
      (д) последствия утраты ТЗ; (е) условия регистрации договора в Роспатенте
      (ответственная сторона, срок, расходы). Без зарегистрированного ТЗ
      договор не может быть зарегистрирован в Роспатенте.
    addressee: "Франчайзер / Патентный поверенный"

  digital_assets_check:
    text: >
      Просим согласовать для {doc_names} условия использования IT-систем:
      (а) перечень предоставляемых IT-систем (CRM, POS, мобильное приложение,
      сайт); (б) принадлежность базы данных клиентов (критично!);
      (в) принадлежность домена и аккаунтов в соцсетях; (г) порядок доступа
      к данным после расторжения; (д) обязанность франчайзера по техподдержке;
      (е) SLA (время реакции на сбои).
    addressee: "IT-отдел / Юридический советник"

  dispute_insurance_check:
    text: >
      Просим согласовать для {doc_names}: (а) претензионный порядок (сроки,
      форма); (б) медиация как обязательный этап; (в) арбитраж vs
      государственный суд; (г) место рассмотрения споров; (д) применимое право
      (для кросс-бордер франшиз); (е) требования к страхованию ответственности
      франчайзи (виды, минимальные суммы, выгодоприобретатель).
    addressee: "Юридический советник / Страховой брокер"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

