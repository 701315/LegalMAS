    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "применимое право"
        - "разрешение споров"
        - "юрисдикция"
      rerank: true
      filters: {}
    evidence:
      required: false
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "governing_law"
          type: "string"
          keyword_hints: ["применимое право", "законодательство", "governing law"]
          description: "Применимое право"
        - name: "dispute_resolution"
          type: "string"
          allowed_values: ["court", "arbitration", "negotiation", "not_found"]
          keyword_hints: ["разрешение споров", "подсудность", "арбитраж"]
          description: "Способ разрешения споров"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification_nda"
    name: "Стороны: раскрывающая и получающая (или обе в mutual NDA)"
    description: "Проверка идентификации сторон"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "раскрывающая сторона"
        - "получающая сторона"
        - "disclosing party"
        - "receiving party"
        - "стороны"
      keyword_mode: "any"
      regex_patterns: []

  - id: "confidential_info_definition"
    name: "Определение конфиденциальной информации (обязательно)"
    description: "Без определения NDA неработоспособно"
    legal_base: "ФЗ-98 ст. 3, ст. 1465 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
      keyword_mode: "any"
      regex_patterns: []

  - id: "purpose_clause"
    name: "Цель раскрытия информации (обязательна)"
    description: "Ограничение использования информации"
    legal_base: "ст. 421 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цель раскрытия"
        - "для целей"
        - "в связи с"
        - "ограничение использования"
      keyword_mode: "any"
      regex_patterns: []

  - id: "exceptions_clause"
    name: "Исключения из конфиденциальности (обязательны)"
    description: "Защита получающей стороны"
    legal_base: "ФЗ-98 ст. 3"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна"
      keyword_mode: "any"
      regex_patterns: []

  - id: "term_clause"
    name: "Срок действия обязательств (обязателен)"
    description: "Обычно 3–5 лет"
    legal_base: "ст. 425 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "срок конфиденциальности"
        - "период действия"
        - "бессрочная"
      keyword_mode: "any"
      regex_patterns: []

  - id: "protection_measures_clause"
    name: "Конкретные меры защиты информации"
    description: "Не просто «не разглашать», а конкретные меры"
    legal_base: "ФЗ-98 ст. 10"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "меры защиты"
        - "ограничение доступа"
        - "не ниже мер"
        - "надлежащая защита"
      keyword_mode: "any"
      regex_patterns: []

  - id: "liability_clause_nda"
    name: "Ответственность за нарушение (штрафы, неустойка)"
    description: "Упрощение доказывания и взыскания"
    legal_base: "ст. 330, 393 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "штраф"
        - "неустойка"
        - "штрафные санкции"
        - "ответственность за нарушение"
      keyword_mode: "any"
      regex_patterns: []

  - id: "return_destruction_clause"
    name: "Возврат или уничтожение информации"
    description: "Порядок возврата/уничтожения по окончании срока"
    legal_base: "ФЗ-98 ст. 10"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возврат информации"
        - "уничтожение информации"
        - "срок возврата"
        - "подтверждение уничтожения"
      keyword_mode: "any"
      regex_patterns: []

  - id: "non_compete_restriction"
    name: "Ограничение конкуренции (non-compete) в NDA"
    description: "Проверка наличия условий о запрете конкуренции"
    legal_base: "ст. 421 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["non_compete_linked"]
    rules:
      keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "ограничение конкуренции"
        - "не конкурировать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)non[\\s-]?compete"

  - id: "injunctive_relief_clause"
    name: "Право на обеспечительные меры (injunctive relief)"
    description: "Право на судебный запрет при нарушении"
    legal_base: "ст. 99 АПК РФ, ст. 139 ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "обеспечительные меры"
        - "судебный запрет"
        - "injunctive relief"
        - "запретительные меры"
        - "предварительные обеспечительные меры"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)injunctive\\s+relief"

  - id: "amendment_procedure"
    name: "Порядок внесения изменений в NDA"
    description: "Процедура изменения условий"
    legal_base: "ст. 450 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "изменение соглашения"
        - "дополнения"
        - "поправки"
        - "в письменной форме"
        - "по согласию сторон"
      keyword_mode: "any"
      regex_patterns: []

  - id: "assignment_restriction"
    name: "Запрет уступки прав по NDA"
    description: "Ограничение на передачу прав и обязанностей"
    legal_base: "ст. 382–392 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка"
        - "переуступка"
        - "передача прав"
        - "без согласия"
        - "запрет уступки"
      keyword_mode: "any"
      regex_patterns: []

  - id: "entire_agreement"
    name: "Оговорка о полноте соглашения (entire agreement)"
    description: "NDA заменяет все предшествующие договорённости по предмету"
    legal_base: "ст. 431.2 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "полнота соглашения"
        - "entire agreement"
        - "заменяет все предшествующие"
        - "полное и окончательное"
        - "все предыдущие договорённости"
      keyword_mode: "any"
      regex_patterns: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  confidential_info_extraction:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить чёткое определение конфиденциальной
      информации по {doc_names}: (а) категории; (б) конкретный перечень;
      (в) примеры; (г) требуется ли маркировка «Конфиденциально».
      Без определения NDA неработоспособно.
    addressee: "Юридический отдел раскрывающей стороны"

  overbroad_definition_check:
    text: >
      ВНИМАНИЕ: В {doc_names} определение конфиденциальной информации может быть
      чрезмерно широким (catch-all). Просим: (а) сузить до конкретных категорий;
      (б) добавить ограничительные оговорки; (в) исключить общеизвестные сведения.
      Чрезмерно широкое определение — рискованно и потенциально неисполнимо.
    addressee: "Юридический отдел получающей стороны"

  purpose_of_disclosure:
    text: >
      Просим уточнить в {doc_names} цель раскрытия и ограничения использования.
    addressee: "Обе стороны"

  exceptions_extraction:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим включить в {doc_names} стандартные исключения:
      (а) общедоступная; (б) известна ранее; (в) от третьих лиц;
      (г) независимо разработана; (д) по закону/суду.
      Без исключений получающая сторона в ловушке.
    addressee: "Юридический отдел получающей стороны"

  term_and_confidentiality_period:
    text: >
      Просим уточнить для {doc_names}: (а) срок NDA; (б) срок конфиденциальности;
      (в) бессрочность (для ноу-хау); (г) survival clause.
    addressee: "Обе стороны"

  protection_obligations:
    text: >
      Просим согласовать для {doc_names}: (а) need-to-know; (б) физическая безопасность;
      (в) информационная безопасность; (г) стандарт «не ниже собственной».
    addressee: "Обе стороны"

  affiliate_advisor_binding:
    text: >
      Просим согласовать для {doc_names}: (а) право раскрытия консультантам;
      (б) обязательность NDA для них; (в) ответственность получающей стороны.
    addressee: "Обе стороны"

  government_disclosure_procedure:
    text: >
      Просим согласовать для {doc_names}: (а) уведомление раскрывающей стороны;
      (б) содействие в ограничении объёма; (в) минимально необходимый объём.
    addressee: "Юридический отдел"

  breach_liability_penalties:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим включить в {doc_names}: (а) фиксированный штраф;
      (б) право на убытки; (в) упрощённое доказывание.
      Без штрафов доказать ущерб крайне сложно.
    addressee: "Юридический отдел раскрывающей стороны"

  breach_notification_obligation:
    text: >
      Просим включить в {doc_names}: (а) немедленное уведомление об утечке;
      (б) уведомление о запросах третьих лиц; (в) срок (24 часа).
    addressee: "Обе стороны"

  return_destruction_procedure:
    text: >
      Просим согласовать для {doc_names}: (а) срок возврата/уничтожения (30 дней);
      (б) способ; (в) сертификат об уничтожении; (г) исключения (архивные копии).
    addressee: "Обе стороны"

  residuals_clause_check:
    text: >
      Просим рассмотреть включение в {doc_names} residuals clause:
      общие знания и навыки сотрудников не нарушают NDA при условии
      неиспользования записей. Важно в IT и R&D.
    addressee: "Юридический отдел получающей стороны"

  no_warranty_accuracy:
    text: >
      Просим включить в {doc_names} disclaimer: информация «as is»,
      без гарантий полноты и достоверности.
    addressee: "Юридический отдел раскрывающей стороны"

  non_solicitation_check:
    text: >
      Просим согласовать для {doc_names} условия о запрете переманивания:
      (а) объём (сотрудники/клиенты/оба); (б) срок действия;
      (в) санкции за нарушение.
    addressee: "Юридический отдел"

  governing_law_dispute_resolution:
    text: >
      Просим согласовать для {doc_names}: (а) применимое право;
      (б) подсудность; (в) претензионный порядок;
      (г) право на обеспечительные меры.
    addressee: "Юридический отдел"

  parties_identification_nda:
    text: >
      Просим подтвердить реквизиты сторон по {doc_names}.
    addressee: "Обе стороны"

  confidential_info_definition:
    text: >
      КРИТИЧНО: В {doc_names} нет определения конфиденциальной информации.
      NDA НЕРАБОТОСПОСОБНО. Незамедлительно дополнить.
    addressee: "Юридический отдел раскрывающей стороны"

  purpose_clause:
    text: >
      Просим указать цель раскрытия в {doc_names}.
    addressee: "Обе стороны"

  exceptions_clause:
    text: >
      КРИТИЧНО: В {doc_names} нет исключений из конфиденциальности.
      Незамедлительно дополнить стандартными исключениями.
    addressee: "Юридический отдел получающей стороны"

  term_clause:
    text: >
      Просим указать срок обязательств для {doc_names}.
    addressee: "Обе стороны"

  protection_measures_clause:
    text: >
      Просим согласовать меры защиты для {doc_names}.
    addressee: "Обе стороны"

  liability_clause_nda:
    text: >
      Просим включить в {doc_names} штрафы/неустойку за нарушение.
    addressee: "Юридический отдел"

  return_destruction_clause:
    text: >
      Просим согласовать порядок возврата/уничтожения для {doc_names}.
    addressee: "Обе стороны"

  non_compete_restriction:
    text: >
      В {doc_names} выявлено условие о запрете конкуренции (non-compete).
      Просим уточнить: (а) объём; (б) территорию; (в) срок;
      (г) компенсацию за ограничение (если применимо).
    addressee: "Юридический отдел"

  injunctive_relief_clause:
    text: >
      Просим рассмотреть включение в {doc_names} оговорки о праве
      на обеспечительные меры (injunctive relief) при нарушении.
    addressee: "Юридический отдел"

  amendment_procedure:
    text: >
      Просим согласовать порядок внесения изменений в {doc_names}.
    addressee: "Юридический отдел"

  assignment_restriction:
    text: >
      Просим включить в {doc_names} запрет уступки прав без согласия
      другой стороны.
    addressee: "Юридический отдел"

  entire_agreement:
    text: >
      Просим включить в {doc_names} оговорку о полноте соглашения
      (entire agreement).
    addressee: "Юридический отдел"

  confidential_info_definition_mandatory:
    text: >
      ВНИМАНИЕ: {doc_names} — NDA без определения конфиденциальной информации.
      Такое NDA НЕРАБОТОСПОСОБНО (ФЗ-98 ст. 3). Незамедлительно дополнить.
    addressee: "Юридический отдел раскрывающей стороны"

  standard_exceptions_required:
    text: >
      ВНИМАНИЕ: В {doc_names} нет стандартных исключений.
      Неоправданные риски для получающей стороны.
      Незамедлительно дополнить.
    addressee: "Юридический отдел получающей стороны"

  personal_data_protection_compliance:
    text: >
      ВНИМАНИЕ: {doc_names} включает персональные данные.
      Необходимо: (а) согласие субъектов; (б) меры защиты;
      (в) уведомление Роскомнадзора.
    addressee: "Юридический отдел / DPO"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический консультант"