type: contract_7.4_nda
name: "Соглашение о неразглашении конфиденциальной информации (NDA)"

description: |
  Соглашение, по которому одна или обе стороны обязуются сохранять конфиденциальность
  информации, полученной в ходе переговоров, сотрудничества или иного взаимодействия.
  Может быть ОДНОСТОРОННИМ (только одна сторона раскрывает) или ДВУСТОРОННИМ/ВЗАИМНЫМ
  (обе стороны обмениваются конфиденциальной информацией).
  Цель — защита коммерческой тайны, ноу-хау, персональных данных и иных ценных сведений
  от несанкционированного разглашения.
  Ключевой инструмент при M&A, инвестициях, партнёрствах, IT-разработке.
  Регулируется ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422.

version: 4.0
parent: class_7_intellectual_property

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: agreement
  subcategory: intellectual_property
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "ФЗ-98 «О коммерческой тайне», ГК РФ ст. 1465–1472, ст. 421, 422"
  doc_types_supported:
    - "соглашение о неразглашении"
    - "NDA"
    - "Non-Disclosure Agreement"
    - "соглашение о конфиденциальности"
    - "Confidential Disclosure Agreement"
    - "договор о неразглашении"
    - "соглашение о защите коммерческой тайны"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)NDA"
      - "(?i)неразглашен"
      - "(?i)конфиденциальн[а-яё]*\\s*(соглашени|договор)"
      - "(?i)confidential"
      - "(?i)non[\\s_-]?disclosure"

    folder_patterns:
      - "(?i)NDA"
      - "(?i)confidential"
      - "(?i)конфиденциальн"

    keywords:

      high:
        - "неразглашение"
        - "конфиденциальность"
        - "конфиденциальная информация"
        - "соглашение о неразглашении"
        - "NDA"
        - "коммерческая тайна"
        - "режим конфиденциальности"
        - "Non-Disclosure Agreement"
        - "ФЗ-98"

      medium:
        - "одностороннее соглашение"
        - "двустороннее соглашение"
        - "взаимное соглашение"
        - "disclosing party"
        - "receiving party"
        - "раскрывающая сторона"
        - "получающая сторона"
        - "ноу-хау"
        - "секрет производства"
        - "исключения из конфиденциальности"

      low:
        - "Confidential Disclosure Agreement"
        - "возврат информации"
        - "персональные данные"
        - "служебная тайна"
        - "уничтожение информации"
        - "residuals"

    exclusions:
      - "трудовой договор"
      - "договор коммерческой концессии"
      - "лицензионный договор"
      - "только как часть другого договора"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

  trigger_definitions:

    unilateral_nda:
      any_keywords:
        - "одностороннее соглашение"
        - "одностороннее NDA"
        - "только раскрывающая сторона"
        - "unilateral"
        - "одна сторона раскрывает"

    mutual_nda:
      any_keywords:
        - "двустороннее соглашение"
        - "взаимное соглашение"
        - "mutual NDA"
        - "обе стороны обмениваются"
        - "взаимное раскрытие"
        - "bilateral"

    trade_secret_protection:
      any_keywords:
        - "коммерческая тайна"
        - "режим коммерческой тайны"
        - "ФЗ-98"
        - "trade secret"
        - "перечень информации, составляющей коммерческую тайну"

    knowhow_transfer:
      any_keywords:
        - "ноу-хау"
        - "секрет производства"
        - "know-how"
        - "технология"
        - "методика"
        - "рецептура"

    personal_data_included:
      any_keywords:
        - "персональные данные"
        - "ПДн"
        - "ФЗ-152"
        - "personal data"
        - "данные субъектов"

    ma_context:
      any_keywords:
        - "due diligence"
        - "M&A"
        - "слияния и поглощения"
        - "инвестиции"
        - "оценка бизнеса"
        - "потенциальная сделка"

    international_parties:
      any_keywords:
        - "иностранная сторона"
        - "нерезидент"
        - "применимое право"
        - "governing law"
        - "юрисдикция"
        - "международный арбитраж"

    consultant_disclosure:
      any_keywords:
        - "раскрытие консультантам"
        - "юристы"
        - "аудиторы"
        - "инвесторы"
        - "советники"
        - "need-to-know basis"

    residuals_clause:
      any_keywords:
        - "residuals"
        - "неосязаемые остатки"
        - "общие знания и навыки"
        - "запомненная информация"
        - "unaided memory"

    government_disclosure:
      any_keywords:
        - "раскрытие по требованию суда"
        - "по требованию государственных органов"
        - "обязательное раскрытие"
        - "судебный запрос"
        - "налоговые органы"

    perpetual_confidentiality:
      any_keywords:
        - "бессрочная конфиденциальность"
        - "без ограничения срока"
        - "perpetual"
        - "на весь срок действия права"

    standalone_nda:
      any_keywords:
        - "самостоятельное соглашение"
        - "standalone NDA"
        - "отдельное соглашение"
        - "не является приложением"

    non_compete_linked:
      any_keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "ограничение конкуренции"
        - "не конкурировать"
        - "конкурирующая деятельность"

    injunctive_relief:
      any_keywords:
        - "обеспечительные меры"
        - "судебный запрет"
        - "injunctive relief"
        - "запретительные меры"
        - "предварительные обеспечительные меры"

    employee_nda:
      any_keywords:
        - "работник"
        - "сотрудник"
        - "трудовой договор"
        - "должностная инструкция"
        - "при увольнении"
        - "после прекращения трудовых отношений"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  term_pattern: "(?i)\\b\\d+\\s+(лет|год|года|месяц|месяцев|дней)\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|USD|EUR)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  fz_ref: "(?i)ФЗ[-]?\\d+"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "confidential_info_definition_mandatory"
    name: "Определение конфиденциальной информации обязательно (ФЗ-98 ст. 3)"
    description: |
      NDA без чёткого определения конфиденциальной информации неработоспособно.
      Стороны не могут доказать нарушение. Определение должно включать
      категории или конкретный перечень информации.
    legal_base: "ФЗ-98 ст. 3, ст. 1465 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
      keyword_mode: "any"
    retrieval:
      context_k: 6
      boost_keywords:
        - "конфиденциальная информация"
        - "определение"
        - "включает"
      rerank: true

  - id: "standard_exceptions_required"
    name: "Стандартные исключения из конфиденциальности (защита получающей стороны)"
    description: |
      Без исключений получающая сторона несёт ответственность за информацию,
      известную ранее, полученную от третьих лиц, ставшую общедоступной или
      разработанную независимо.
    legal_base: "ФЗ-98 ст. 3, международная практика"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "исключения"
        - "не является конфиденциальной"
        - "общедоступная"
      rerank: true

  - id: "personal_data_protection_compliance"
    name: "Защита персональных данных (ФЗ-152)"
    description: |
      Если конфиденциальная информация включает персональные данные,
      получающая сторона обязана соблюдать ФЗ-152.
    legal_base: "ФЗ-152 «О персональных данных»"
    required_triggers: ["personal_data_included"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "персональные данные"
        - "ФЗ-152"
        - "согласие субъекта"
        - "Роскомнадзор"
        - "меры защиты ПДн"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "персональные данные"
        - "ФЗ-152"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: confidential_info_extraction
    name: "Определение конфиденциальной информации"
    description: |
      Извлекает определение конфиденциальной информации:
      категории, конкретный перечень, примеры, требование маркировки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "конфиденциальная информация"
        - "confidential information"
        - "определение"
        - "включает"
        - "не ограничиваясь"
        - "категории информации"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Определи, как определена конфиденциальная информация.

        Ответь строго в JSON:
        {
          "definition_present": "<yes / vague / no>",
          "definition_type": "<categories / specific_list / both / unclear>",
          "categories": "<перечень категорий или not_found>",
          "examples": "<примеры или not_found>",
          "marking_required": "<yes / no / unclear>"
        }

        ВАЖНО: Чёткое определение критично для применения NDA.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "конфиденциальная информация"
        - "определение"
        - "включает"
        - "категории"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 60
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "definition_present"
          type: "string"
          allowed_values: ["yes", "vague", "no"]
          keyword_hints: ["конфиденциальная информация", "определение", "означает"]
          description: "Наличие чёткого определения"
        - name: "definition_type"
          type: "string"
          allowed_values: ["categories", "specific_list", "both", "unclear"]
          description: "Тип определения"
        - name: "marking_required"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["маркировка", "пометка", "гриф", "Конфиденциально"]
          description: "Требуется ли маркировка"
      store_payload: true

  - id: overbroad_definition_check
    name: "Проверка на чрезмерно широкое определение (catch-all)"
    description: |
      Чрезмерно широкое определение («любая информация, переданная в любой форме»)
      создаёт неоправданные риски для получающей стороны и может быть оспорено в суде.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "любая информация"
        - "вся информация"
        - "в любой форме"
        - "без ограничений"
        - "включая, но не ограничиваясь"
        - "any and all information"
      keyword_mode: "any"
      negative_keywords:
        - "конкретный перечень"
        - "категории информации"
        - "за исключением"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Оцени, не является ли определение конфиденциальной информации чрезмерно широким.

        Ответь строго в JSON:
        {
          "overbroad_risk": "<high / medium / low / none>",
          "catch_all_phrases": ["<выявленные catch-all формулировки>"],
          "narrowing_provisions": "<есть ли ограничительные оговорки или not_found>"
        }

        ВАЖНО: Определение «любая информация» без ограничений — рискованно и потенциально неисполнимо.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "любая информация"
        - "вся информация"
        - "без ограничений"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "overbroad_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "none"]
          description: "Уровень риска чрезмерно широкого определения"
      store_payload: true

  - id: purpose_of_disclosure
    name: "Цель раскрытия информации"
    description: "Для каких целей информация передаётся и может использоваться"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цель раскрытия"
        - "purpose of disclosure"
        - "для целей"
        - "в связи с"
        - "ограничение использования"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Определи цель раскрытия конфиденциальной информации.

        Ответь строго в JSON:
        {
          "purpose": "<цель или not_found>",
          "use_restriction": "<ограничение использования или not_found>"
        }

        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "цель"
        - "для целей"
        - "использование"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "purpose"
          type: "string"
          keyword_hints: ["цель", "для целей", "в связи с"]
          description: "Цель раскрытия информации"
      store_payload: true

  - id: exceptions_extraction
    name: "Исключения из конфиденциальности (стандартные)"
    description: |
      Общедоступная, известна ранее, получена от третьих лиц, независимо разработана,
      раскрытие по закону/суду.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не является конфиденциальной"
        - "исключения"
        - "общедоступная"
        - "была известна до раскрытия"
        - "получена от третьих лиц"
        - "независимо разработана"
        - "publicly available"
        - "prior knowledge"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий NDA.
        Проверь наличие стандартных исключений из конфиденциальности.

        Ответь строго в JSON:
        {
          "public_domain": "<yes / no>",
          "prior_knowledge": "<yes / no>",
          "third_party_lawful": "<yes / no>",
          "independent_development": "<yes / no>",
          "government_required": "<yes / no>"
        }

        ВАЖНО: Без исключений получающая сторона в ловушке.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "исключения"
        - "не является конфиденциальной"
        - "общедоступная"
        - "независимо разработана"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "public_domain"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["общедоступная", "публичная", "общеизвестная"]
          description: "Исключение: общедоступная информация"
        - name: "prior_knowledge"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["была известна", "до раскрытия", "ранее"]
          description: "Исключение: известна до раскрытия"
        - name: "independent_development"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["независимо разработана", "самостоятельно создана"]
          description: "Исключение: независимо разработана"
      store_payload: true

  - id: term_and_confidentiality_period
    name: "Срок действия NDA и срок конфиденциальности"
    description: "Срок действия соглашения и срок режима конфиденциальности (могут различаться)"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
