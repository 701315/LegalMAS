    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик"
        - "исполнитель"
        - "авторский заказ"
        - "фрилансер"
        - "по договору подряда"
        - "по заказу"
        - "НИОКР"
        - "уступка от подрядчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(по\\s+договору\\s+(авторского\\s+)?заказа|подряда|НИОКР)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: урегулирована ли цепочка прав, если
        объект создан не работником (подрядчик / фрилансер).

        Нормативный ориентир:
        - ст. 1296 ГК РФ — произведение по заказу; исключительное право
          принадлежит заказчику, если иное не предусмотрено
        - ст. 1297 ГК РФ — РИД, созданный при выполнении НИОКР
        - ст. 1288 ГК РФ — договор авторского заказа

        Важно:
        - Для произведений по заказу исключительное право по умолчанию у
          заказчика; но для НИОКР / подряда может быть у исполнителя.
        - Разрыв в цепочке прав — критический риск.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Признаке создания объекта не работником (подрядчик, заказ, НИОКР).
        2. Наличии уступки исключительного права от подрядчика / исполнителя.
        3. Урегулировании вознаграждения подрядчика.
        4. Отсутствии открытых обязательств перед подрядчиком.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если объект создан подрядчиком И есть прямая
           уступка от него.
        4. verdict = "not_applicable" (в verdict не используется) — вместо
           этого verdict = "pass" при явном указании, что объект создан
           самим правообладателем.
        5. verdict = "unclear" — если создание подрядчиком упомянуто, но
           цепочка прав не раскрыта.
        6. verdict = "fail" — если объект создан подрядчиком без уступки.
