  - id: "force_majeure_ip"
    name: "Форс-мажор"
    description: "Обстоятельства непреодолимой силы"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "непредвиденные обстоятельства"
