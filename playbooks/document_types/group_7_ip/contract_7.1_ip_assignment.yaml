        "Передаётся исключительное право на секрет производства."

        Ответ:
        {
          "confidentiality_regime_status": "not_defined",
          "confidentiality_regime_details": "Данные не определены",
          "seller_obligations_status": "not_defined",
          "seller_obligations_details": "Данные не определены",
          "transfer_method_status": "not_defined",
          "transfer_method_details": "Данные не определены",
          "third_party_access_status": "not_defined",
          "third_party_access_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
