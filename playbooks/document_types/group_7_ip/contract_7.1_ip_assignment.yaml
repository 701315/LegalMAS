        осуществляется по акту приёма-передачи. Продавец обязуется не разглашать
        сведения третьим лицам в течение 5 лет."

        Ответ:
        {
          "confidentiality_regime_status": "defined",
          "confidentiality_regime_details": "обязуются сохранять конфиденциальность",
          "seller_obligations_status": "defined",
          "seller_obligations_details": "не разглашать сведения третьим лицам в течение 5 лет",
          "transfer_method_status": "defined",
          "transfer_method_details": "по акту приёма-передачи",
          "third_party_access_status": "defined",
          "third_party_access_details": "ограничение доступа третьих лиц",
          "evidence": [{"clause_ref": "п. 3.1", "quote": "Стороны обязуются сохранять конфиденциальность ноу-хау."}]
        }

        Пример 2:
