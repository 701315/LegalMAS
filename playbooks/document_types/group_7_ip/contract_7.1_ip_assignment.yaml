  - id: cross_border_and_tax_check
    name: "Международный элемент и НДС при отчуждении ИС"
    description: >
      Проверяет международный элемент сделки (иностранная сторона, территория
      действия права, валюта расчётов и валютная оговорка) и налоговую оговорку
      по НДС с учётом применимости льготы пп. 26 п. 2 ст. 149 НК РФ (только
      для ПО, БД, топологий ИМС, изобретений, ПМ, ноу-хау — не для ТЗ и
      произведений). Применимое право проверяется global check
      governing_law_and_forum. Специфика doc-type contract_7.1_ip_assignment.
    triggers:
      any:
        - cross_border_ip
        - registered_ip_patent
        - copyright_objects
        - know_how_trade_secret
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "иностранное лицо"
        - "нерезидент"
        - "территория действия"
        - "иностранная валюта"
        - "USD"
        - "EUR"
        - "НДС"
        - "освобождение от НДС"
        - "не облагается НДС"
        - "пп. 26 п. 2 ст. 149"
        - "без НДС"
        - "в том числе НДС"
        - "налоговый агент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожден\\w+\\s+от\\s+НДС"
