        - "переходный период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(запрет|обязуется\\s+не).*конкурир"
        - "(?i)non[- ]?compete"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: расторжение, non-compete, обратная лицензия
        и transition support.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания и последствия расторжения.
        2. Non-compete оговорку.
        3. Обратную лицензию для отчуждателя.
        4. Обязательства по содействию в переходе.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец обязуется не создавать конкурирующие объекты ИС в течение 3 лет.
        Приобретатель предоставляет Продавцу неисключительную лицензию на использование
        объекта для внутренних нужд. Продавец передаёт техническую документацию
        и оказывает содействие в течение 30 дней."

        Ответ:
