        - name: "asset_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия стоимости активов."
          required: true

        - name: "asset_value_details"
          type: "string"
          presentation: "fact"
          label: "Стоимость активов"
          description: "Стоимость отчуждаемых активов (для порогов ФАС)."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "conditions_precedent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус отлагательных условий."
          required: true

        - name: "conditions_precedent_details"
          type: "string"
          presentation: "fact"
          label: "Отлагательные условия"
          description: "Условия, связанные с согласованием ФАС."
          required: false
          display_in_grid: false

      store_payload: true

  - id: author_succession_check
    name: "Наследники автора: правопреемство и цепочка прав"
    description: >
      Проверяет правопреемство исключительного права, если автор умер до
      заключения сделки. Исключительное право переходит к наследникам
