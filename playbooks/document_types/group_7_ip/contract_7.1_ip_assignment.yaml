          "verdict": "pass",
          "reason": "Раскрыт состав соавторов, подтверждено уведомление и отсутствие претензий, урегулировано распределение вознаграждения.",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Произведение создано в соавторстве Ивановым И.И. и Петровым П.П."}
          ]
        }

        Пример 2 — о соавторстве не упомянуто (fail):
        Фрагмент:
        "Правообладатель передаёт исключительное право на произведение."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Не раскрыт состав авторов; для произведения возможно соавторство, отсутствие раскрытия — риск.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Раскрыт ли состав авторов / соавторов?
        3. Подтверждено ли отсутствие притязаний соавторов?
        4. Урегулировано ли распределение вознаграждения?

