# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  patent_number: "(?i)\\b(патент|patent)\\s*(№|#|N)?\\s*\\d{5,}"
  trademark_number: "(?i)\\b(свидетельство|certificate)\\s*(№|#|N)?\\s*\\d{5,}"
  registration_number: "(?i)\\b(регистраци\\w+\\s+)?№?\\s*\\d{4,}[\\s/-]?\\d{0,6}"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  inn_pattern: "(?i)ИНН\\s*:?\\s*\\d{10,12}"
  ogrn_pattern: "(?i)ОГРН\\s*:?\\s*\\d{13,15}"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовое извлечение структуры договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: ip_assignment_subject_extraction
    name: "Базовое извлечение: стороны, объект, модель передачи, вознаграждение"
    description: >
      Извлекает правообладателя, приобретателя, тип объекта ИС, модель передачи
      (полный объём vs лицензия), вознаграждение и момент перехода права.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правообладатель"
        - "приобретатель"
        - "отчуждатель"
        - "исключительное право"
        - "в полном объеме"
        - "вознаграждение"
        - "момент перехода"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(правообладатель|приобретатель).*именуем"
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: базовые параметры договора.

        Нормативный ориентир:
        - ст. 1234 ГК РФ — договор об отчуждении исключительного права
        - ст. 1228 ГК РФ — автор результата интеллектуальной деятельности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Правообладатель (наименование/ФИО, реквизиты).
        2. Приобретатель (наименование/ФИО, реквизиты).
        3. Тип объекта ИС.
        4. Модель передачи (полный объём / иное).
        5. Вознаграждение (размер, тип).
        6. Момент перехода права.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель —
        ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение
        по патенту RU 2700000 в полном объёме. Вознаграждение — 5 000 000 рублей,
        единовременно. Право переходит с момента государственной регистрации."

        Ответ:
        {
          "rightsholder_details": "ООО «Альфа», ИНН 7700000001",
          "acquirer_details": "ООО «Бета», ИНН 7700000002",
          "ip_object_type": "patent",
          "transfer_scope": "full_assignment",
          "remuneration_status": "defined",
          "remuneration_details": "5 000 000 рублей, единовременно",
          "transfer_moment": "upon_registration",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель — ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение по патенту RU 2700000 в полном объёме."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "rightsholder_details": "Данные не определены",
          "acquirer_details": "Данные не определены",
          "ip_object_type": "not_defined",
          "transfer_scope": "not_defined",
          "remuneration_status": "not_defined",
          "remuneration_details": "Данные не определены",
          "transfer_moment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о правообладателе.
        2. Найди прямую цитату о приобретателе.
        3. Найди прямую цитату о типе объекта.
        4. Найди прямую цитату о полном объёме передачи.
        5. Найди прямую цитату о вознаграждении.
        6. Найди прямую цитату о моменте перехода.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "rightsholder_details": "<текст или 'Данные не определены'>",
          "acquirer_details": "<текст или 'Данные не определены'>",
          "ip_object_type": "<patent / utility_model / industrial_design / trademark / software / database / work / know_how / other / not_defined>",
          "transfer_scope": "<full_assignment / partial / unclear / not_defined>",
          "remuneration_status": "<defined / gratuitous / not_defined>",
          "remuneration_details": "<текст или 'Данные не определены'>",
          "transfer_moment": "<upon_signing / upon_payment / upon_registration / custom / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правообладатель приобретатель отчуждатель исключительное право в полном объеме вознаграждение момент перехода патент товарный знак произведение программа для ЭВМ ноу-хау база данных"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "обратная лицензия"
        - "non-compete"
        - "конфиденциальность"
        - "форс-мажор"
        - "расторжение"
        - "споры"
        - "подсудность"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Извлеки из договора
        об отчуждении исключительного права базовые параметры: стороны, объект,
        модель передачи, вознаграждение и момент перехода.
        Не анализируй обременения, споры, расторжение или конфиденциальность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. rightsholder_details — правообладатель.
        2. acquirer_details — приобретатель.
        3. ip_object_type — "patent" / "utility_model" / "industrial_design" /
           "trademark" / "software" / "database" / "work" / "know_how" / "other" / "not_defined".
        4. transfer_scope — "full_assignment" / "partial" / "unclear" / "not_defined".
        5. remuneration_status — "defined" / "gratuitous" / "not_defined".
        6. remuneration_details — размер и тип вознаграждения.
        7. transfer_moment — "upon_signing" / "upon_payment" / "upon_registration" /
           "custom" / "not_defined".

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - transfer_scope: "full_assignment" — если прямо указано "в полном объёме"
          или "отчуждает исключительное право"; "partial" — если передаётся часть прав;
          "unclear" — если формулировка неоднозначна.
        - remuneration_status: "gratuitous" — если прямо указано "безвозмездно".
        - transfer_moment: "upon_registration" — если право переходит с момента
          государственной регистрации; "upon_payment" — после полной оплаты;
          "upon_signing" — с момента подписания договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "rightsholder_details"
          type: "string"
          presentation: "fact"
          label: "Правообладатель"
          description: "Наименование и реквизиты правообладателя."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "acquirer_details"
          type: "string"
          presentation: "fact"
          label: "Приобретатель"
          description: "Наименование и реквизиты приобретателя."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["patent", "utility_model", "industrial_design", "trademark", "software", "database", "work", "know_how", "other", "not_defined"]
          description: "Тип объекта ИС."
          required: true
        - name: "transfer_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["full_assignment", "partial", "unclear", "not_defined"]
          description: "Модель передачи права."
          required: true
        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "gratuitous", "not_defined"]
          description: "Статус вознаграждения."
          required: true
        - name: "remuneration_details"
          type: "string"
          presentation: "fact"
          label: "Вознаграждение"
          description: "Размер и тип вознаграждения."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_signing", "upon_payment", "upon_registration", "custom", "not_defined"]
          description: "Момент перехода исключительного права."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Идентификация объекта ИС
  # ──────────────────────────────────────────────────────────────────────────
  - id: ip_object_identification_check
    name: "Идентификация объекта ИС: регистрационные данные, описание, срок"
    description: >
      Проверяет достаточность идентификации объекта ИС: регистрационный номер,
      дата регистрации/приоритета, срок действия, описание, орган регистрации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "патент"
        - "свидетельство"
        - "регистрационный номер"
        - "дата регистрации"
        - "дата приоритета"
        - "срок действия"
        - "Роспатент"
        - "ФИПС"
        - "программа для ЭВМ"
        - "база данных"
        - "произведение"
        - "ноу-хау"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(патент|свидетельство)\\s*(№|#|N)?\\s*\\d{5,}"
        - "(?i)регистрационн[ыо]й\\s+номер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: идентификация объекта ИС.

        Нормативный ориентир:
        - ст. 1234 ГК РФ — предмет договора
        - ст. 1354 ГК РФ — патент на изобретение
        - ст. 1481 ГК РФ — товарный знак

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип объекта ИС.
        2. Регистрационный номер (патента/свидетельства).
        3. Дату регистрации или приоритета.
        4. Дату окончания срока действия.
        5. Описание объекта.
        6. Орган регистрации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Исключительное право на изобретение «Способ обработки данных»,
