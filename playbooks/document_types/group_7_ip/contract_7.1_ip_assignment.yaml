        претензий о нарушении исключительных прав осуществляется в порядке,
        предусмотренном разделом 6 настоящего договора."

        Ответ:
        {
          "validity_warranty_status": "not_defined",
          "validity_warranty_details": "Данные не определены",
          "no_infringement_warranty_status": "not_defined",
