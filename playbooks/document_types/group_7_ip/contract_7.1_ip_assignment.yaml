  - id: trademark_assignment_restrictions_check
    name: "Отчуждение товарного знака: ограничения ст. 1488 ГК РФ"
    description: >
      Проверяет специфические ограничения при отчуждении товарного знака:
      риск введения в заблуждение потребителя (абз. 2 п. 2 ст. 1488 ГК РФ),
      частичная уступка по части классов МКТУ, тождество с фирменным
      наименованием / НМПТ. Активируется при типе объекта = trademark.
      Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "товарный знак"
        - "свидетельство на товарный знак"
        - "знак обслуживания"
        - "МКТУ"
        - "классы МКТУ"
        - "фирменное наименование"
        - "НМПТ"
        - "введение в заблуждение"
        - "частичная уступка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн\\w+\\s+знак"
        - "(?i)(класс|классы)\\s+МКТУ"
        - "(?i)введени\\w+\\s+в\\s+заблуждение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права на товарный знак.
        Проверяется только один вопрос: соблюдены ли ограничения ст. 1488 ГК РФ.

        Нормативный ориентир:
        - ст. 1488 п. 2 ГК РФ — не допускается отчуждение ТЗ, если оно может
          стать причиной введения потребителя в заблуждение относительно
          товара или его изготовителя
        - ст. 1488 п. 2 ГК РФ — отчуждение ТЗ по части товаров / услуг;
          при этом часть товаров, для которых сохраняется право, не должна
          быть однородной с отчуждаемой
        - ст. 1474 ГК РФ — фирменное наименование не отчуждается
        - ст. 1519 ГК РФ — НМПТ не отчуждается

        Важно:
        - Тождество ТЗ с фирменным наименованием правообладателя — риск
          введения в заблуждение.
        - Тождество ТЗ с НМПТ — запрет отчуждения.
        - Частичная уступка — допустима, но с ограничениями.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Отсутствии риска введения потребителя в заблуждение.
        2. Характере уступки (полная / частичная по классам МКТУ).
        3. Отсутствии тождества с фирменным наименованием / НМПТ.
        4. Перечне товаров и услуг (классов МКТУ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если ограничения ст. 1488 учтены.
        4. verdict = "unclear" — если характер уступки или объём классов
           раскрыт не полностью.
        5. verdict = "fail" — если есть прямой риск введения в заблуждение
           или тождество с НМПТ / фирменным наименованием.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная уступка без ограничений (pass):
        Фрагмент:
        "Отчуждается исключительное право на товарный знак «Альфа»
        (свидетельство № 123456) в отношении всех товаров и услуг, для
        которых он зарегистрирован (классы МКТУ 09, 35, 42). Товарный знак
        не тождественен фирменному наименованию Правообладателя."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Полная уступка по всем классам МКТУ, отсутствие тождества с фирменным наименованием.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Отчуждается исключительное право на товарный знак «Альфа» (свидетельство № 123456) в отношении всех товаров и услуг."}
          ]
        }

        Пример 2 — частичная уступка с риском (unclear):
        Фрагмент:
        "Отчуждается исключительное право на товарный знак по классу МКТУ 09.
        Право по классу МКТУ 35 сохраняется за Правообладателем."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Частичная уступка по классам МКТУ. Требуется проверка однородности сохраняемых и отчуждаемых товаров / услуг по ст. 1488 п. 2 ГК РФ.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Отчуждается исключительное право на товарный знак по классу МКТУ 09. Право по классу МКТУ 35 сохраняется."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Указан ли объём уступки (полная / частичная)?
        3. Указан ли перечень классов МКТУ?
        4. Есть ли риск введения в заблуждение?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
