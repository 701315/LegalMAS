          "oss_license_types_status": "defined",
          "oss_license_types_details": "MIT, BSD, Apache 2.0 (permissive)",
          "copyleft_risk_status": "not_applicable",
          "copyleft_risk_details": "copyleft-компоненты отсутствуют",
          "oss_disclosure_status": "defined",
          "oss_disclosure_details": "перечень компонентов в Приложении № 4 (SBOM)",
          "evidence": [
            {"clause_ref": "п. 5.2", "quote": "Программа включает OSS-компоненты под лицензиями MIT, BSD, Apache 2.0."}
          ]
        }

        Пример 2 — copyleft-риск:
        Фрагмент:
        "Программа включает компонент под GPL-3.0."

        Ответ:
        {
          "oss_presence_status": "defined",
          "oss_presence_details": "OSS-компонент",
          "oss_license_types_status": "defined",
          "oss_license_types_details": "GPL-3.0 (copyleft)",
          "copyleft_risk_status": "defined",
          "copyleft_risk_details": "GPL-3.0 — copyleft: производное произведение должно распространяться под GPL, что может блокировать отчуждение",
          "oss_disclosure_status": "not_defined",
          "oss_disclosure_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 5.2", "quote": "Программа включает компонент под GPL-3.0."}
          ]
        }

        Пример 3:
        Фрагмент:
        "Передаётся исключительное право на программу для ЭВМ."

        Ответ:
        {
          "oss_presence_status": "not_defined",
          "oss_presence_details": "Данные не определены",
          "oss_license_types_status": "not_defined",
          "oss_license_types_details": "Данные не определены",
          "copyleft_risk_status": "not_defined",
          "copyleft_risk_details": "Данные не определены",
          "oss_disclosure_status": "not_defined",
          "oss_disclosure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 9 ключей (8 полей + evidence) присутствуют в JSON?
        2. Раскрыто ли наличие OSS?
        3. Указан ли тип лицензий?
        4. Есть ли copyleft-риск?

        Не выводи шаги проверки. Верни только JSON.

