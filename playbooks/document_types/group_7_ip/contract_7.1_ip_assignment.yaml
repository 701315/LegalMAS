      keyword_mode: "any"

  - id: "vat_tax_clause"
    name: "НДС и налоговые аспекты"
    description: "Налоговые оговорки"
    legal_base: "НК РФ ст. 149 п. 2 пп. 26"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "НДС"
