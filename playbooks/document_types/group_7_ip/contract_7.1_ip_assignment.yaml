        - "соправообладатель"
        - "совместно"
        - "долевая собственность"
        - "доля в праве"
        - "принадлежит совместно"
        - "нескольким лицам"
        - "согласие соправообладателей"
        - "преимущественное право"
        - "преимущественное право покупки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(совместн|долев\\w+\\s+собственност)\\w+"
        - "(?i)соправообладател\\w+"
        - "(?i)преимущественн\\w+\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: не нарушены ли права соправообладателей
        при отчуждении исключительного права.

        Нормативный ориентир:
        - п. 2, 3 ст. 1229 ГК РФ — распоряжение исключительным правом,
          принадлежащим нескольким лицам, осуществляется совместно.
        - ст. 1348 ГК РФ — при отчуждении доли в исключительном праве на
          изобретение другие соправообладатели имеют преимущественное право
          покупки.
        - п. 3 ст. 1348 ГК РФ — преимущественное право покупки доли.

        Важно:
        - Соправообладатели — это не соавторы-физлица (это покрыто в
          co_authorship_check), а владельцы права на момент сделки (юрлица,
          ИП, правопреемники).
        - Отчуждение доли без уведомления соправообладателей — оспоримая сделка.

        [ЗАДАЧА]
        Определи, содержит ли договор:
        1. Указание на совместное владение исключительным правом.
        2. Раскрытие состава соправообладателей.
        3. Наличие согласия всех соправообладателей на отчуждение.
        4. Соблюдение преимущественного права покупки (для патентов).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если право принадлежит одному лицу или
           получено согласие всех соправообладателей.
        4. verdict = "unclear" — если есть признаки совместного владения,
           но согласие не раскрыто.
        5. verdict = "fail" — если отчуждается доля или всё право без
           согласия соправообладателей.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — согласие получено (pass):
        Фрагмент:
        "Исключительное право на изобретение принадлежит Правообладателю и
        ООО «Союз» в равных долях. Согласие ООО «Союз» на отчуждение доли
        Правообладателя получено (письмо № 12 от 01.03.2024). Преимущественное
        право покупки не реализовано."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Совместное владение раскрыто, согласие соправообладателя получено, преимущественное право учтено.",
          "evidence": [
            {"clause_ref": "п. 4.2", "quote": "Исключительное право на изобретение принадлежит Правообладателю и ООО «Союз» в равных долях. Согласие ООО «Союз» на отчуждение доли Правообладателя получено."}
          ]
        }

        Пример 2 — согласие не получено (unclear):
        Фрагмент:
        "Исключительное право на патент получено Правообладателем в результате
        совместной разработки с ООО «Союз»."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Есть признаки совместного владения, но согласие соправообладателя на отчуждение не раскрыто.",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Исключительное право на патент получено Правообладателем в результате совместной разработки с ООО «Союз»."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Указано ли совместное владение?
        3. Раскрыт ли состав соправообладателей?
        4. Есть ли согласие на отчуждение?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "соправообладатели совместно долевая собственность доля в праве согласие соправообладателей преимущественное право покупки совместная разработка"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [warranty, obligation, general_provision]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [representations, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "лицензии третьих лиц", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["representations", "obligations"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "co_ownership_and_joint_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения о
        совместном владении исключительным правом и правах соправообладателей.
        Не анализируй вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. co_ownership_and_joint_rights_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (co_ownership_status, co_owners_list_status,
              consent_status, preemptive_rights_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. co_ownership_status — "defined" / "not_applicable" / "not_defined".
        2. co_ownership_details — указание на совместное владение.
        3. co_owners_list_status — "defined" / "not_applicable" / "not_defined".
        4. co_owners_list_details — состав соправообладателей.
        5. consent_status — "defined" / "not_applicable" / "not_defined".
        6. consent_details — согласие всех соправообладателей на отчуждение.
        7. preemptive_rights_status — "defined" / "not_applicable" / "not_defined".
        8. preemptive_rights_details — преимущественное право покупки доли.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни co_ownership_and_joint_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи совместное владение из молчания договора.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает соправообладателей, совместное владение или доли в праве.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано, что право получено в результате совместной разработки, но не раскрыт состав соправообладателей и отсутствует согласие на отчуждение.
           → presence = "present";
             co_ownership_status = "defined";
             consent_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указан один правообладатель, а в заверениях — что право принадлежит нескольким лицам.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Специфика темы: согласие получено.
           В договоре прямо указано, что согласие всех соправообладателей получено и преимущественное право покупки не реализовано.
           → presence = "present";
             consent_status = "defined";
             preemptive_rights_status = "defined";
             соответствующие *_details фиксируют факт.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для co_ownership_and_joint_rights_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "co_ownership_and_joint_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о совместном владении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "co_ownership_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус совместного владения."
          required: true

        - name: "co_ownership_details"
          type: "string"
          presentation: "fact"
          label: "Совместное владение"
          description: "Указание на совместное владение исключительным правом."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "co_owners_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус раскрытия состава соправообладателей."
          required: true

        - name: "co_owners_list_details"
          type: "string"
          presentation: "fact"
          label: "Состав соправообладателей"
          description: "Состав соправообладателей исключительного права."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус согласия всех соправообладателей на отчуждение."
          required: true

        - name: "consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие соправообладателей"
          description: "Согласие всех соправообладателей на отчуждение."
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "preemptive_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус преимущественного права покупки доли."
          required: true

        - name: "preemptive_rights_details"
          type: "string"
          presentation: "fact"
          label: "Преимущественное право"
          description: "Преимущественное право покупки доли в исключительном праве."
          required: false
          display_in_grid: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  ip_assignment_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты правообладателя и приобретателя,
      тип объекта ИС, модель передачи (полный объём vs лицензия), размер вознаграждения
      и момент перехода исключительного права.
    addressee: "Обе стороны"

  ip_object_identification_check:
    text: >
      Просим предоставить по {doc_names}: копию патента/свидетельства, выписку из реестра
      Роспатента, подтверждение регистрационного номера, даты регистрации/приоритета
      и срока действия объекта ИС.
    addressee: "Правообладатель"

  full_transfer_and_registration_check:
    text: >
      Просим подтвердить по {doc_names}: (а) передачу исключительного права в полном объёме;
      (б) обязанность регистрации перехода в Роспатенте; (в) кто подаёт заявление;
      (г) распределение расходов на регистрацию.
    addressee: "Обе стороны / Патентный поверенный"

  encumbrances_licenses_check:
    text: >
      Просим раскрыть по {doc_names} все обременения исключительного права:
      залог, действующие лицензии (ст. 1235 п. 7 ГК РФ), споры и судебные разбирательства.
    addressee: "Правообладатель"

  service_invention_rights_check:
    text: >
      По {doc_names} — служебный РИД. Просим предоставить подтверждение урегулирования
      прав автора-работника: выплату вознаграждения, согласие автора, подтверждение
      прав работодателя.
    addressee: "Правообладатель (работодатель)"

  author_moral_rights_check:
    text: >
      По {doc_names} — просим включить явное подтверждение сохранения за автором
      личных неимущественных прав (авторство, имя, неприкосновенность).
      Такие права неотчуждаемы (ст. 1265 ГК РФ).
    addressee: "Юридический советник"

  know_how_confidentiality_check:
    text: >
      По {doc_names} (ноу-хау) просим уточнить: режим конфиденциальности после передачи,
      обязанности продавца по неразглашению, способ передачи информации,
      ограничения доступа третьих лиц.
    addressee: "Обе стороны"

  representations_warranties_indemnity_check:
    text: >
      По {doc_names} — просим расширить заверения правообладателя:
      (а) принадлежность права; (б) действительность; (в) отсутствие обременений;
      (г) отсутствие споров; (д) ненарушение прав третьих лиц; (е) индемнити-оговорку.
    addressee: "Юридический советник правообладателя"

  cross_border_and_tax_check:
    text: >
      По {doc_names} — просим уточнить: территорию действия, применимое право,
      валюту расчётов, налоговые последствия (НДС, льгота по пп. 26 п. 2 ст. 149 НК РФ),
      валютный контроль (при оплате нерезиденту).
    addressee: "Юридический советник / Налоговый консультант"

  termination_and_post_transfer_check:
    text: >
      По {doc_names} — просим согласовать: основания расторжения, non-compete оговорку,
      обратную лицензию для отчуждателя (при необходимости), обязательства по передаче
      документации и содействию в переходе.
    addressee: "Обе стороны / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

  