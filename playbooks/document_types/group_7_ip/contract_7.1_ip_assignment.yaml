      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права на секрет производства (ноу-хау) сведения
        о режиме коммерческой тайны, порядке передачи информации, сроке
        обязательств по неразглашению и запрете на воссоздание.
        Не анализируй вознаграждение, обременения или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. know_how_confidentiality_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (trade_secret_regime_status, transfer_method_status,
              confidentiality_period_status, non_compete_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. trade_secret_regime_status — "defined" / "not_defined".
        2. trade_secret_regime_details — формулировка о режиме КТ и мерах охраны.
        3. transfer_method_status — "defined" / "not_defined".
        4. transfer_method_details — порядок и способ передачи информации.
        5. confidentiality_period_status — "defined" / "not_defined".
        6. confidentiality_period_details — срок обязательств по неразглашению.
        7. non_compete_status — "defined" / "not_applicable" / "not_defined".
        8. non_compete_details — запрет правообладателю на воссоздание или использование.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни know_how_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - trade_secret_regime_status = "defined" только если прямо установлен режим коммерческой тайны (не просто общая «конфиденциальность» без привязки к ноу-хау и мерам охраны).
        - Срок обязательств по неразглашению: если в договоре прямо указано «бессрочно» — так и отражай; если не указан — "Данные не определены".
        - non_compete_status = "not_applicable" — только если договор ПРЯМО допускает воссоздание / повторное использование / передачу третьим лицам правообладателем.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не содержит положений о режиме коммерческой тайны применительно к передаваемому ноу-хау.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (общая формулировка).
           Есть только общая фраза о конфиденциальности, но не раскрыт порядок передачи информации, срок обязательств или запрет на воссоздание.
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе указан срок неразглашения 3 года, а в другом — бессрочно.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Отсылка на внешний документ.
           Порядок передачи или меры охраны отсылают к Положению о коммерческой тайне или отдельному NDA.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "в соответствии с Положением о КТ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для know_how_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
