  - id: gratuitous_transfer_risk_check
    name: "Безвозмездное отчуждение: запрет дарения между коммерческими лицами (п. 3 ст. 575 ГК РФ)"
    description: >
      Проверяет, не является ли договор отчуждения исключительного права
      безвозмездным между коммерческими организациями. Безвозмездное отчуждение
      (дарение) между коммерческими организациями запрещено п. 3 ст. 575 ГК РФ;
      такая сделка ничтожна. Также проверяется соответствие презумпции
      возмездности по п. 3 ст. 1234 ГК РФ. Специфика doc-type
      contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "безвозмездно"
        - "безвозмездный"
        - "без вознаграждения"
        - "дарение"
        - "дарит"
        - "в дар"
        - "0 рублей"
        - "ноль рублей"
        - "без оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безвозмездн\\w+"
        - "(?i)(дарение|дарит|в\\s+дар)"
        - "(?i)0\\s*(руб|рублей)"
        - "(?i)без\\s+(оплаты|вознаграждения)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: является ли договор безвозмездным
        и не нарушает ли это запрет дарения между коммерческими организациями.

        Нормативный ориентир:
        - п. 3 ст. 575 ГК РФ — дарение между коммерческими организациями
          запрещено. Сделка, нарушающая этот запрет, ничтожна.
        - п. 3 ст. 1234 ГК РФ — договор об отчуждении исключительного права
          предполагается возмездным, если прямо не предусмотрено иное.
        - ст. 1234 п. 3 ГК РФ — при отсутствии условия о вознаграждении
          договор считается незаключённым (кроме безвозмездного).

        Важно:
        - Внутрихолдинговые передачи IP часто оформляют «безвозмездно» для
          оптимизации. Это критический налоговый и правовой риск.
        - Безвозмездное отчуждение между физлицом и юрлицом допустимо.
        - Безвозмездное отчуждение между двумя ООО/АО — ничтожная сделка.

        [ЗАДАЧА]
        Определи, содержит ли договор:
        1. Условие о безвозмездности отчуждения.
        2. Статус сторон (обе коммерческие / одна некоммерческая / физлицо).
        3. Риск ничтожности по п. 3 ст. 575 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "fail" — если безвозмездное отчуждение между двумя
           коммерческими организациями.
        4. verdict = "pass" — если отчуждение возмездное или безвозмездность
           между допустимыми субъектами (например, физлицо — юрлицо).
        5. verdict = "unclear" — если статус сторон не ясен.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — безвозмездно между ООО (fail):
        Фрагмент:
        "Правообладатель — ООО «Альфа» передаёт Приобретателю — ООО «Бета»
        исключительное право на программу для ЭВМ безвозмездно."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Безвозмездное отчуждение между двумя коммерческими организациями запрещено п. 3 ст. 575 ГК РФ; сделка ничтожна.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель — ООО «Альфа» передаёт Приобретателю — ООО «Бета» исключительное право на программу для ЭВМ безвозмездно."}
          ]
        }

        Пример 2 — возмездно (pass):
        Фрагмент:
        "Вознаграждение за отчуждение исключительного права составляет
        1 500 000 рублей."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Договор является возмездным; риск запрета дарения отсутствует.",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Вознаграждение за отчуждение исключительного права составляет 1 500 000 рублей."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Указана ли безвозмездность?
        3. Ясны ли статусы сторон?
        4. Есть ли риск ничтожности?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "безвозмездно безвозмездный дарение в дар без вознаграждения 0 рублей ноль рублей без оплаты коммерческая организация"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [obligation, general_provision, payment_term]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [obligations, representations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "лицензии третьих лиц", "регистрация перехода", "расторжение"]
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["obligations", "representations"]
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "gratuitous_transfer_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
