          "third_party_access_status": "<defined / not_defined>",
          "third_party_access_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
