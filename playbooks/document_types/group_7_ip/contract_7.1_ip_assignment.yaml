  - id: open_source_components_check
    name: "Open Source: компоненты и copyleft-риски при отчуждении ПО"
    description: >
      Проверяет наличие OSS-компонентов в составе отчуждаемого ПО, тип лицензий
      (copyleft / permissive), совместимость с отчуждением исключительного права
      и раскрытие информации (SBOM). Активируется для ПО. Специфика doc-type
      contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "open source"
        - "открытый исходный код"
        - "OSS"
        - "GPL"
        - "LGPL"
        - "AGPL"
        - "MIT"
        - "Apache"
        - "BSD"
        - "copyleft"
        - "SBOM"
        - "сторонние компоненты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(GPL|LGPL|AGPL|MIT|Apache|BSD)\\b"
        - "(?i)(open[- ]?source|открыт\\w+\\s+исходн\\w+\\s+код)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права на ПО.
        Проверяется только один вопрос: урегулированы ли OSS-компоненты
        и copyleft-риски.

        Нормативный ориентир:
        - ст. 1233, 1234 ГК РФ — распоряжение исключительным правом
        - ст. 1235 ГК РФ — лицензионные конструкции
        - OSS-лицензии (GPL-2.0/3.0, LGPL, AGPL, MIT, Apache 2.0, BSD) —
          действуют как лицензионные соглашения по ст. 1286, 1235 ГК РФ

        Важно:
        - Copyleft-лицензии (GPL, AGPL) — производные произведения должны
          распространяться под той же лицензией; это может блокировать
          исключительное отчуждение.
        - AGPL — триггер по сетевому использованию (SaaS).
        - Отсутствие раскрытия OSS в договоре — критический риск для
          приобретателя.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Наличии OSS-компонентов.
        2. Типе OSS-лицензий (copyleft / permissive / смешанные).
        3. Copyleft-рисках (GPL / AGPL) для отчуждаемого ПО.
        4. Раскрытии OSS (SBOM / перечень компонентов).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если OSS раскрыты и copyleft-рисков нет.
        4. verdict = "unclear" — если OSS упомянуты, но тип лицензий не
           раскрыт.
        5. verdict = "fail" — если ПО содержит OSS, но раскрытия нет;
           либо есть copyleft (GPL/AGPL), несовместимый с отчуждением.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — OSS раскрыты, copyleft нет (pass):
        Фрагмент:
        "Программа для ЭВМ включает сторонние компоненты под лицензиями MIT,
        BSD и Apache 2.0. Полный перечень компонентов и лицензий приведён
        в Приложении № 4 (SBOM). Copyleft-компоненты отсутствуют."

        Ответ:
        {
          "verdict": "pass",
          "reason": "OSS-компоненты раскрыты, указаны permissive-лицензии, copyleft отсутствует.",
          "evidence": [
            {"clause_ref": "п. 5.2", "quote": "Программа для ЭВМ включает сторонние компоненты под лицензиями MIT, BSD и Apache 2.0. Полный перечень компонентов и лицензий приведён в Приложении № 4 (SBOM)."}
          ]
        }

        Пример 2 — copyleft-риск (fail):
        Фрагмент:
        "Программа для ЭВМ включает компонент под лицензией GPL-3.0."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Наличие GPL-компонента создаёт copyleft-риск: производное произведение должно распространяться под GPL, что несовместимо с отчуждением исключительного права.",
          "evidence": [
            {"clause_ref": "п. 5.2", "quote": "Программа для ЭВМ включает компонент под лицензией GPL-3.0."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Раскрыто ли наличие OSS-компонентов?
        3. Указан ли тип лицензий?
        4. Есть ли copyleft-риск (GPL / AGPL)?
        5. Раскрыт ли SBOM / перечень компонентов?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "open source открытый исходный код OSS GPL LGPL AGPL MIT Apache BSD copyleft SBOM сторонние компоненты перечень компонентов лицензии"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [warranty, obligation, general_provision]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [representations, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "лицензии третьих лиц", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["price_list", "invoice"]
      preferred_clause_functions: ["representations", "obligations"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "open_source_components_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения об
        OSS-компонентах и copyleft-рисках в отчуждаемом ПО.
        Не анализируй вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. open_source_components_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (oss_presence_status, oss_license_types_status,
              copyleft_risk_status, oss_disclosure_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. oss_presence_status — "defined" / "not_applicable" / "not_defined".
        2. oss_presence_details — раскрытие наличия OSS.
        3. oss_license_types_status — "defined" / "not_defined".
        4. oss_license_types_details — типы лицензий (GPL, LGPL, AGPL, MIT, Apache, BSD и др.).
        5. copyleft_risk_status — "defined" / "not_applicable" / "not_defined".
        6. copyleft_risk_details — copyleft-компоненты (GPL, AGPL) и их влияние.
        7. oss_disclosure_status — "defined" / "not_defined".
        8. oss_disclosure_details — SBOM / перечень компонентов и лицензий.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни open_source_components_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи наличие / отсутствие OSS из молчания договора.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает открытое ПО, сторонние компоненты или лицензии.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Есть общая фраза о сторонних компонентах, но не указаны типы лицензий или отсутствует ссылка на SBOM.
           → presence = "present";
             oss_presence_status = "defined";
             oss_license_types_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В заверениях указано отсутствие OSS, а в приложениях или спецификациях — наличие компонентов под MIT.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Специфика темы: выявление copyleft-риска.
           В договоре прямо указано наличие компонента под лицензией GPL / AGPL.
           → presence = "present";
             copyleft_risk_status = "defined";
             copyleft_risk_details фиксирует факт наличия лицензии и её влияние на отчуждение.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для open_source_components_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "open_source_components_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений об OSS-компонентах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "oss_presence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус наличия OSS-компонентов."
          required: true

        - name: "oss_presence_details"
          type: "string"
          presentation: "fact"
          label: "OSS-компоненты"
          description: "Наличие / отсутствие OSS-компонентов в составе ПО."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "oss_license_types_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия типов лицензий."
          required: true

        - name: "oss_license_types_details"
          type: "string"
          presentation: "fact"
          label: "Типы OSS-лицензий"
          description: "Типы лицензий OSS-компонентов."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "copyleft_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус copyleft-риска."
          required: true

        - name: "copyleft_risk_details"
          type: "string"
          presentation: "fact"
          label: "Copyleft-риск"
          description: "Copyleft-компоненты и их влияние на отчуждение."
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "oss_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия SBOM."
          required: true

        - name: "oss_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие OSS"
          description: "SBOM / перечень OSS-компонентов и лицензий."
          required: false
          display_in_grid: false

      store_payload: true

