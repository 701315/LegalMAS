          "transfer_moment": "custom",
          "evidence": [
            {"clause_ref": "п. 1.1–1.3", "quote": "Правообладатель — ИП Иванов И.И. передаёт Приобретателю — ООО «Гамма» исключительное право на программу для ЭВМ «УчётСклад v.3.0». Вознаграждение определяется согласно Приложению № 1."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
