        - "свидетельство о праве на наследство"
        - "автор умер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(наследник|наследств|правопреемник)\\w*"
        - "(?i)автор\\s+умер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: урегулировано ли правопреемство,
        если автор умер.

        Нормативный ориентир:
        - ст. 1110 ГК РФ — наследственное правопреемство
        - ст. 1112 ГК РФ — состав наследства, включая исключительные права
        - ст. 1281 ГК РФ — срок действия исключительного права автора
          (70 лет после смерти)
        - ст. 1228 п. 2 ГК РФ — личные неимущественные права не наследуются

        Важно:
        - Исключительное право автора переходит к наследникам, личные
          неимущественные права — нет.
        - Отчуждение без раскрытия наследников — критический риск.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Том, жив ли автор.
        2. Наследниках (если автор умер).
        3. Наличии документов о правопреемстве.
        4. Отсутствии притязаний наследников.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если правопреемство раскрыто (или автор жив).
        4. verdict = "unclear" — если есть признаки наследования, но
           детали не раскрыты.
        5. verdict = "fail" — если автор умер, но наследники не раскрыты.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — правопреемство раскрыто (pass):
        Фрагмент:
        "Исключительное право на произведение принадлежит Правообладателю
        на основании свидетельства о праве на наследство № 77 АА 1234567,
        выданного наследникам автора Иванова И.И. Притязаний иных наследников
        не имеется."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Раскрыто правопреемство по наследству, указано свидетельство, подтверждено отсутствие притязаний.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Исключительное право на произведение принадлежит Правообладателю на основании свидетельства о праве на наследство № 77 АА 1234567."}
          ]
        }

        Пример 2 — автор жив (pass):
        Фрагмент:
        "Автор — Иванов И.И., передаёт исключительное право лично."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Автор — сторона договора, наследование не применяется.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Автор — Иванов И.И., передаёт исключительное право лично."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Раскрыт ли статус автора (жив / умер)?
        3. Раскрыты ли наследники?
        4. Есть ли документы о правопреемстве?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "наследник наследство наследодатель правопреемник свидетельство о праве на наследство автор умер"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [warranty, obligation, general_provision]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [representations, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "лицензии", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["representations", "obligations"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения о
        правопреемстве исключительного права (наследование).
        Не анализируй обременения, регистрацию или вознаграждение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        1. author_alive_status — "defined" (автор жив / сторона договора) /
           "not_applicable" (автор умер) / "not_defined".
        2. author_alive_details — сведения о статусе автора. Если нет —
           "Данные не определены".
        3. successors_status — "defined" (наследники раскрыты) /
           "not_applicable" (автор жив) / "not_defined".
        4. successors_details — состав наследников. Если нет —
           "Данные не определены".
        5. succession_documents_status — "defined" / "not_applicable" /
           "not_defined".
        6. succession_documents_details — документы о правопреемстве
           (свидетельство о праве на наследство). Если нет —
           "Данные не определены".

        При отсутствии данных: статус = "not_defined" / "not_applicable",
        текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - successors_status = "not_applicable" только если прямо указано,
          что автор жив.
        - Верни только JSON.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Исключительное право принадлежит наследникам автора на основании
        свидетельства о праве на наследство № 77 АА 1234567."

        Ответ:
        {
          "author_alive_status": "not_applicable",
          "author_alive_details": "автор умер, право перешло к наследникам",
          "successors_status": "defined",
          "successors_details": "наследники автора",
          "succession_documents_status": "defined",
          "succession_documents_details": "свидетельство о праве на наследство № 77 АА 1234567",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Исключительное право принадлежит наследникам автора на основании свидетельства о праве на наследство № 77 АА 1234567."}
          ]
        }

        Пример 2:
        Фрагмент:
        "Автор — Иванов И.И., передаёт исключительное право лично."

        Ответ:
        {
          "author_alive_status": "defined",
          "author_alive_details": "автор жив, сторона договора",
          "successors_status": "not_applicable",
          "successors_details": "Данные не определены",
          "succession_documents_status": "not_applicable",
          "succession_documents_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Автор — Иванов И.И., передаёт исключительное право лично."}
          ]
        }

        Пример 3:
        Фрагмент:
        "Передаётся исключительное право."

        Ответ:
        {
          "author_alive_status": "not_defined",
          "author_alive_details": "Данные не определены",
          "successors_status": "not_defined",
          "successors_details": "Данные не определены",
          "succession_documents_status": "not_defined",
          "succession_documents_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 7 ключей (6 полей + evidence) присутствуют в JSON?
        2. Раскрыт ли статус автора?
        3. Раскрыты ли наследники (если автор умер)?
        4. Есть ли документы о правопреемстве?

        Не выводи шаги проверки. Верни только JSON.

      fields:
        - name: "author_alive_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус автора (жив / умер)."
          required: true
        - name: "author_alive_details"
          type: "string"
          presentation: "fact"
          label: "Статус автора"
          description: "Сведения о статусе автора (жив / умер)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "successors_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус раскрытия наследников."
          required: true
        - name: "successors_details"
          type: "string"
          presentation: "fact"
          label: "Наследники"
          description: "Состав наследников автора."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "succession_documents_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус документов о правопреемстве."
          required: true
        - name: "succession_documents_details"
          type: "string"
          presentation: "fact"
          label: "Документы о правопреемстве"
          description: "Свидетельство о праве на наследство и др."
          required: false
          display_in_grid: false

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  ip_assignment_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты правообладателя и приобретателя,
      тип объекта ИС, модель передачи (полный объём vs лицензия), размер вознаграждения
      и момент перехода исключительного права.
    addressee: "Обе стороны"

  ip_object_identification_check:
    text: >
      Просим предоставить по {doc_names}: копию патента/свидетельства, выписку из реестра
      Роспатента, подтверждение регистрационного номера, даты регистрации/приоритета
      и срока действия объекта ИС.
    addressee: "Правообладатель"

  full_transfer_and_registration_check:
    text: >
      Просим подтвердить по {doc_names}: (а) передачу исключительного права в полном объёме;
      (б) обязанность регистрации перехода в Роспатенте; (в) кто подаёт заявление;
      (г) распределение расходов на регистрацию.
    addressee: "Обе стороны / Патентный поверенный"

  encumbrances_licenses_check:
    text: >
      Просим раскрыть по {doc_names} все обременения исключительного права:
      залог, действующие лицензии (ст. 1235 п. 7 ГК РФ), споры и судебные разбирательства.
    addressee: "Правообладатель"

  service_invention_rights_check:
    text: >
      По {doc_names} — служебный РИД. Просим предоставить подтверждение урегулирования
      прав автора-работника: выплату вознаграждения, согласие автора, подтверждение
      прав работодателя.
    addressee: "Правообладатель (работодатель)"

  author_moral_rights_check:
    text: >
      По {doc_names} — просим включить явное подтверждение сохранения за автором
      личных неимущественных прав (авторство, имя, неприкосновенность).
      Такие права неотчуждаемы (ст. 1265 ГК РФ).
    addressee: "Юридический советник"

  know_how_confidentiality_check:
    text: >
      По {doc_names} (ноу-хау) просим уточнить: режим конфиденциальности после передачи,
      обязанности продавца по неразглашению, способ передачи информации,
      ограничения доступа третьих лиц.
    addressee: "Обе стороны"

  representations_warranties_indemnity_check:
    text: >
      По {doc_names} — просим расширить заверения правообладателя:
      (а) принадлежность права; (б) действительность; (в) отсутствие обременений;
      (г) отсутствие споров; (д) ненарушение прав третьих лиц; (е) индемнити-оговорку.
    addressee: "Юридический советник правообладателя"

  cross_border_and_tax_check:
    text: >
      По {doc_names} — просим уточнить: территорию действия, применимое право,
      валюту расчётов, налоговые последствия (НДС, льгота по пп. 26 п. 2 ст. 149 НК РФ),
      валютный контроль (при оплате нерезиденту).
    addressee: "Юридический советник / Налоговый консультант"

  termination_and_post_transfer_check:
    text: >
      По {doc_names} — просим согласовать: основания расторжения, non-compete оговорку,
      обратную лицензию для отчуждателя (при необходимости), обязательства по передаче
      документации и содействию в переходе.
    addressee: "Обе стороны / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

  