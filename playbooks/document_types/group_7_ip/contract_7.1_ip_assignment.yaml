        риска по п. 3 ст. 575 ГК РФ.
        Не анализируй обременения, регистрацию или будущие права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. gratuitous_transfer_risk_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (remuneration_gratuitous_status, commercial_parties_status,
              donation_ban_risk_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. remuneration_gratuitous_status — "defined" / "not_applicable" / "not_defined".
        2. remuneration_gratuitous_details — указание на безвозмездность отчуждения.
        3. commercial_parties_status — "defined" / "not_applicable" / "not_defined".
        4. commercial_parties_details — статус сторон (обе коммерческие / одна некоммерческая).
        5. donation_ban_risk_status — "defined" / "not_applicable" / "not_defined".
        6. donation_ban_risk_details — риск ничтожности по п. 3 ст. 575 ГК РФ.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни gratuitous_transfer_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи безвозмездность из молчания договора.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает безвозмездность, дарение или отсутствие вознаграждения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано «безвозмездно», но статус сторон (коммерческие/некоммерческие) не раскрыт.
           → presence = "present";
             remuneration_gratuitous_status = "defined";
             commercial_parties_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В предмете указано «безвозмездно», а в разделе о расчётах — «вознаграждение 0 рублей с отлагательным условием».
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Специфика темы: безвозмездность между коммерческими лицами.
           В договоре прямо указано, что обе стороны — ООО/АО, и отчуждение производится безвозмездно.
           → presence = "present";
             donation_ban_risk_status = "defined";
             donation_ban_risk_details фиксирует риск ничтожности по п. 3 ст. 575 ГК РФ.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для gratuitous_transfer_risk_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
