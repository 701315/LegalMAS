shared_patterns:
  patent_number: "(?i)\\b(патент|patent)\\s*(№|#|N)?\\s*\\d{5,}"
  trademark_number: "(?i)\\b(свидетельство|certificate)\\s*(№|#|N)?\\s*\\d{5,}"
