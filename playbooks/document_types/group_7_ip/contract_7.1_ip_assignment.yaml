  - id: in_aliable_ip_objects_check
    name: "Неотчуждаемые объекты ИС: НМПТ, фирменное наименование, коммерческое обозначение"
    description: >
      Проверяет, не предпринимается ли попытка отчуждения объекта, который
      по закону неотчуждаем (НМПТ — ст. 1519 ГК РФ, фирменное наименование —
      ст. 1474 ГК РФ) или отчуждается с ограничениями (коммерческое
      обозначение — только с предприятием, ст. 1539 ГК РФ). Специфика
      doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "НМПТ"
        - "наименование места происхождения товара"
        - "фирменное наименование"
        - "коммерческое обозначение"
        - "географическое указание"
        - "ГУ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(НМПТ|наименование\\s+места\\s+происхождения)"
        - "(?i)(фирменн\\w+\\s+наименование|коммерческ\\w+\\s+обозначение)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: не предпринимается ли попытка
        отчуждения неотчуждаемого объекта.

        Нормативный ориентир:
        - ст. 1474 ГК РФ — фирменное наименование не отчуждается
        - ст. 1519 ГК РФ — НМПТ не отчуждается
        - ст. 1539 ГК РФ — коммерческое обозначение может переходить
          только в составе предприятия
        - ст. 1229 п. 4 ГК РФ — неотчуждаемые объекты

        Важно:
        - Отчуждение НМПТ — ничтожная сделка.
        - Отчуждение фирменного наименования — ничтожная сделка.
        - Отчуждение коммерческого обозначения без предприятия — ничтожно.

        [ЗАДАЧА]
        Определи, содержит ли договор признаки попытки отчуждения:
        1. Неотчуждаемого объекта ИС (НМПТ, фирменное наименование).
        2. Коммерческого обозначения без предприятия.
        3. Иного объекта с ограничениями на отчуждение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если объект отчуждаем и ограничений нет.
        4. verdict = "unclear" — если есть признаки ограничений, но неясность.
        5. verdict = "fail" — если предпринимается попытка отчуждения
           неотчуждаемого объекта.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отчуждаемый объект (pass):
        Фрагмент:
        "Отчуждается исключительное право на товарный знак «Альфа»."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Товарный знак — отчуждаемый объект; ограничений не выявлено.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Отчуждается исключительное право на товарный знак «Альфа»."}
          ]
        }

        Пример 2 — попытка отчуждения НМПТ (fail):
        Фрагмент:
        "Отчуждается исключительное право на наименование места
        происхождения товара «Альфа»."

