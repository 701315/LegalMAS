    legal_base: "ст. 1235 п. 7, 1234 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "действующие лицензии"
        - "лицензионные договоры"
        - "перечень лицензий"
        - "отсутствие лицензий"
      keyword_mode: "any"

  - id: "liability_for_warranty_breach"
    name: "Ответственность за нарушение гарантий"
    description: "Последствия нарушения заверений правообладателя"
    legal_base: "ст. 431.2, 393 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "нарушение гарантий"
        - "нарушение заверений"
        - "недостоверность"
        - "возмещение убытков"
        - "расторжение договора"
        - "неустойка"
      keyword_mode: "any"

  - id: "payment_default_consequences"
    name: "Последствия просрочки/неоплаты"
    description: "Санкции за неисполнение обязанности по оплате"
    legal_base: "ст. 330, 395 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
