        - "(?i)(патент|свидетельство)\\s*(№|#)?\\s*\\d+"

  - id: "full_transfer_scope_required"
    name: "Полный объём передачи права (отличие от лицензии)"
    description: "Проверяет явное указание на передачу в полном объёме"
    legal_base: "ст. 1234 п. 1 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в полном объеме"
        - "полностью"
        - "исключительное право передается"
        - "исключительное право переходит"
        - "отчуждает исключительное право"
        - "утрачивает право"
      keyword_mode: "any"
      negative_keywords:
        - "право использования"
        - "неисключительная лицензия"
        - "исключительная лицензия"
        - "на срок"
        - "на территории"
      regex_patterns:
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"

  - id: "remuneration_required"
    name: "Вознаграждение — существенное условие возмездного договора"
    description: "Проверяет наличие условия о размере/порядке определения вознаграждения"
    legal_base: "ст. 1234 п. 3 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "вознаграждение"
        - "цена"
        - "стоимость"
        - "оплата"
        - "паушальный платеж"
        - "рублей"
        - "безвозмездно"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознагражден\\w+.*\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "remuneration_amount"
          type: "number"
          keyword_hints: ["вознаграждение", "цена", "стоимость", "рублей"]
          unit: "RUB"
          description: "Сумма вознаграждения"
        - name: "payment_type"
          type: "string"
          allowed_values: ["lump_sum", "installments", "royalty", "gratuitous", "unclear"]
          keyword_hints: ["единовременно", "поэтапно", "рассрочка", "безвозмездно"]
          description: "Тип оплаты"
      store_payload: true

  - id: "transfer_moment_specified"
    name: "Момент перехода исключительного права"
    description: "Проверяет указание момента перехода права"
    legal_base: "ст. 1234 п. 4 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "момент перехода"
        - "право переходит"
        - "с момента"
        - "после оплаты"
        - "после регистрации"
        - "при подписании"
        - "переход права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прав\\w+\\s+переходит.*с\\s+момента"

  - id: "registration_obligation_clause"
    name: "Обязанность регистрации перехода права"
    description: "Для регистрируемых объектов"
    legal_base: "ст. 1232, 1234 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["registered_ip_patent", "registered_ip_trademark"]
    rules:
      keywords:
        - "государственная регистрация"
        - "регистрация перехода права"
        - "Роспатент"
        - "ФИПС"
        - "заявление о регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)регистраци\\w+\\s+(перехода\\s+)?прав"

  - id: "registration_costs_allocation"
    name: "Распределение расходов на регистрацию"
    description: "Кто несёт расходы на регистрацию"
    legal_base: "ст. 1232 ГК РФ"
    severity: "high"
