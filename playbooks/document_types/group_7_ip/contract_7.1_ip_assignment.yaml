  - id: termination_and_post_transfer_check
    name: "Расторжение, non-compete, обратная лицензия и transition support"
    description: >
      Проверяет основания расторжения, non-compete оговорку, обратную лицензию
      для отчуждателя и обязательства по содействию в переходе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
