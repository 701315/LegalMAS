          "ip_indemnity_status": "defined",
          "ip_indemnity_details": "возмещение убытков и самостоятельное урегулирование претензий при нарушении исключительных прав",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право на изобретение по патенту RU 2700000 является действительным, патент не оспорен. Объект не нарушает исключительных прав третьих лиц."}
