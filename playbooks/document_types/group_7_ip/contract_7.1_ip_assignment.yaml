      regex_patterns:
        - "(?i)освобожден\\w+\\s+от\\s+НДС"
        - "(?i)не\\s+облагается\\s+НДС"
        - "(?i)пп\\.?\\s*26\\s+п\\.?\\s*2\\s+ст\\.?\\s*149"

