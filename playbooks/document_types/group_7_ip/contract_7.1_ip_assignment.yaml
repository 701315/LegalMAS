          label: "Содействие в переходе"
          description: "Состав, срок и распределение расходов по содействию."
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: title_chain_check
    name: "Цепочка прав: титул правообладателя и ограничения на отчуждение"
    description: >
      Проверяет происхождение исключительного права у правообладателя (создание /
      уступка / наследование / служебный РИД) и отсутствие ограничений на дальнейшее
      отчуждение (ст. 1238 ГК РФ — сублицензия; ограничения из предыдущего договора).
      Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "приобрел"
        - "получил исключительное право"
        - "создан"
        - "уступлен"
        - "перешло по наследству"
        - "служебное"
        - "по договору"
        - "сублицензия"
        - "с согласия лицензиара"
        - "без права отчуждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(приобрел|получил|создан|уступлен|перешло)\\s+(исключительное\\s+право|право)"
        - "(?i)без\\s+права\\s+(отчуждения|уступки)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: раскрыта ли цепочка прав правообладателя
        и отсутствуют ли ограничения на отчуждение.

        Нормативный ориентир:
        - ст. 1234 ГК РФ — отчуждение исключительного права
        - ст. 1238 ГК РФ — сублицензия недопустима без согласия лицензиара
        - ст. 1229 ГК РФ — правообладатель вправе распоряжаться правом
        - ст. 1296, 1297 ГК РФ — РИД по заказу / НИОКР

        Важно:
        - Титул правообладателя = основание, по которому право у него возникло.
        - Ограничения на отчуждение могут вытекать из предыдущей лицензии
          (сублицензия), из договора авторского заказа (ст. 1296), из
          служебного РИД (права работодателя).

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Происхождении исключительного права у правообладателя (создание /
           уступка / наследование / служебный РИД / РИД по заказу).
        2. Отсутствии ограничений на дальнейшее отчуждение.
        3. Отсутствии обязательств перед третьими лицами (лицензиаром,
           подрядчиком, автором), блокирующих отчуждение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если титул раскрыт и ограничений нет.
        4. verdict = "unclear" — если титул раскрыт частично или есть
           неопределённость в основаниях.
        5. verdict = "fail" — если титул не раскрыт вовсе.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул раскрыт (pass):
        Фрагмент:
        "Исключительное право на изобретение принадлежит Правообладателю
        на основании патента RU 2700000, выданного по его собственной заявке.
        Право не отягощено обязательствами перед третьими лицами."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указано основание возникновения права (собственная заявка, патент) и подтверждено отсутствие ограничений.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Исключительное право на изобретение принадлежит Правообладателю на основании патента RU 2700000."}
          ]
        }

        Пример 2 — титул не раскрыт (fail):
        Фрагмент:
        "Правообладатель передаёт исключительное право на произведение."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Не указано, каким образом исключительное право возникло у правообладателя.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Раскрыто ли основание возникновения права?
        3. Указано ли отсутствие ограничений на отчуждение?
        4. Соответствует ли verdict критериям pass / unclear / fail?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "приобрел получил исключительное право создан уступлен перешло по наследству служебное основание возникновения права ограничения на отчуждение сублицензия согласие лицензиара"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [obligation, warranty, general_provision]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [representations, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["representations", "obligations"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "title_chain_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права сведения о титуле правообладателя и ограничениях
        на отчуждение.
        Не анализируй обременения, споры или вознаграждение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. title_chain_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (title_origin_status, restriction_on_alienation_status,
              third_party_chain_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. title_origin_status — "defined" / "not_defined".
        2. title_origin_details — основание возникновения права.
        3. restriction_on_alienation_status — "defined" / "not_applicable" / "not_defined".
        4. restriction_on_alienation_details — наличие / отсутствие ограничений на отчуждение.
        5. third_party_chain_status — "defined" / "not_applicable" / "not_defined".
        6. third_party_chain_details — обязательства перед третьими лицами, блокирующие отчуждение.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни title_chain_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - title_origin_status = "defined" только если прямо указано основание (создание, уступка, наследство, служебный РИД, заказ).
        - restriction_on_alienation_status = "not_applicable" — если в договоре прямо указано отсутствие ограничений на отчуждение.
        - third_party_chain_status = "not_applicable" — если прямо указано отсутствие обязательств перед третьими лицами.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не раскрывает, каким образом право возникло у правообладателя, и не упоминает ограничения или обязательства перед третьими лицами.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указан патент (титул), но ничего не сказано об ограничениях на отчуждение или обязательствах перед лицензиаром/автором.
           → presence = "present";
             title_origin_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указано, что право создано самим правообладателем, а в заверениях — что получено по договору уступки без указания реквизитов.
           → presence = "unclear";
             title_origin_status = "not_defined";
             title_origin_details = "Не удалось определить".

        4. Прямое указание на ограничение отчуждения.
           Договор прямо содержит запрет на отчуждение, необходимость согласия лицензиара или ссылку на сублицензию.
           → presence = "present";
             restriction_on_alienation_status = "defined";
             restriction_on_alienation_details фиксирует конкретное ограничение.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для title_chain_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "title_chain_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о титуле и цепочке прав. Внутреннее агрегатное signal-поле."
          required: true

        - name: "title_origin_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия основания возникновения права."
          required: true

        - name: "title_origin_details"
          type: "string"
          presentation: "fact"
          label: "Основание права"
          description: "Основание возникновения исключительного права."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "restriction_on_alienation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус ограничений на отчуждение."
          required: true

        - name: "restriction_on_alienation_details"
          type: "string"
          presentation: "fact"
          label: "Ограничения на отчуждение"
          description: "Наличие / отсутствие ограничений на дальнейшее отчуждение."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "third_party_chain_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус обязательств перед третьими лицами."
          required: true

        - name: "third_party_chain_details"
          type: "string"
          presentation: "fact"
          label: "Обязательства перед третьими лицами"
          description: "Обязательства перед лицензиаром / подрядчиком / автором."
          required: false
          display_in_grid: false

