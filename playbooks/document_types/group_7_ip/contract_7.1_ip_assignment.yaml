  - id: full_transfer_and_registration_check
    name: "Полный объём передачи и регистрация перехода права"
    description: >
      Проверяет явное указание на передачу исключительного права в полном объёме
      (отличие от лицензионных конструкций по ст. 1234 и 1235 ГК РФ), обязанность
      государственной регистрации перехода права в патентном ведомстве (ст. 1232 ГК РФ),
      распределение обязанностей по подаче заявления и расходов на пошлины.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в полном объеме"
        - "в полном объёме"
        - "полностью"
        - "исключительное право передается"
        - "исключительное право переходит"
        - "отчуждает исключительное право"
        - "государственная регистрация"
        - "регистрация перехода права"
        - "Роспатент"
        - "ФИПС"
        - "заявление о регистрации"
        - "расходы на регистрацию"
        - "государственная пошлина"
        - "патентная пошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)регистраци\\w+\\s+(перехода\\s+)?прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1232, 1234; ст. 333.30 НК РФ).
        Проверяется только один вопрос: явно ли указан полный объём передачи права
        (отчуждение) и урегулирован ли порядок государственной регистрации перехода права.

        Нормативный ориентир:
        - ст. 1234 п. 1 ГК РФ — по договору об отчуждении исключительного права
          правообладатель передаёт или обязуется передать исключительное право
          в полном объёме. Использование слов «предоставляет право», «разрешает
          использовать» указывает на лицензию (ст. 1235 ГК РФ) и является дефектом
          для договора отчуждения.
        - ст. 1232 п. 2 ГК РФ — в случаях, когда объект ИС подлежит государственной
          регистрации, переход исключительного права по договору также подлежит
          государственной регистрации. Без регистрации переход права считается несостоявшимся.
        - ст. 1234 п. 4 ГК РФ — момент перехода права (при регистрации — в момент регистрации).
        - ст. 333.30 НК РФ — государственные пошлины за регистрацию перехода права.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, содержит ли текст договора одновременно:
        1. Явное указание на передачу в полном объёме («отчуждает», «передаёт
           исключительное право в полном объёме»), исключающее лицензионную модель.
        2. Условия о государственной регистрации перехода права (подлежит регистрации,
           кто подаёт заявление, как распределяются расходы/пошлины) — либо
           прямое обоснованное указание, что регистрация не требуется (например,
           для произведений литературы, музыки, ноу-хау).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если указан полный объём передачи И урегулирована
           регистрация (прямо — подлежит или прямо — не требуется).
        4. verdict = "unclear" — если объём указан неявно или регистрация
           упомянута без деталей (без указания подающей стороны или расходов).
        5. verdict = "fail" — если объём передачи не указан или указан как
           ограниченный (лицензионная модель).
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный объём и регистрация урегулированы (pass):
        Фрагмент:
        "Правообладатель отчуждает Приобретателю исключительное право в полном
        объёме. Переход права подлежит государственной регистрации в Роспатенте.
        Заявление подаёт Приобретатель. Расходы на регистрацию несёт Приобретатель."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Полный объём передачи указан явно; регистрация перехода урегулирована с указанием подающей стороны и распределения расходов.",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Правообладатель отчуждает Приобретателю исключительное право в полном объёме. Переход права подлежит государственной регистрации в Роспатенте."}
          ]
        }

        Пример 2 — объём не указан (fail):
        Фрагмент:
        "Правообладатель предоставляет приобретателю право использования патента."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Договор сформулирован по лицензионному типу («предоставляет право использования»), а не как полное отчуждение. Регистрация перехода не упомянута.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель предоставляет приобретателю право использования патента."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указан ли полный объём передачи явно?
        3. Урегулирована ли регистрация перехода (подлежит / не требуется)?
        4. Указана ли подающая сторона или распределение расходов?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчуждение исключительного права в полном объеме государственная регистрация перехода права Роспатент ФИПС заявление о регистрации расходы на регистрацию государственная пошлина патентная пошлина"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - title_transfer
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "обременения"
        - "залог исключительных прав"
        - "лицензии третьим лицам"
        - "разрешение споров"
        - "досрочное расторжение"
        - "конфиденциальность информации"
        - "форс-мажор"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения о полном объёме передачи и государственной регистрации перехода права.
        Не анализируй вознаграждение, обременения, споры или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        1. full_transfer_status — "defined" / "not_defined".
        2. full_transfer_details — формулировка о полном объёме передачи исключительного права.
        3. registration_obligation_status — "defined" / "not_defined".
        4. registration_obligation_details — обязанность государственной регистрации перехода права или указание, что она не требуется.
        5. registration_applicant_status — "defined" / "not_defined".
        6. registration_applicant_details — указание стороны, подающей заявление на государственную регистрацию.
        7. registration_costs_status — "defined" / "not_defined".
        8. registration_costs_details — порядок распределения расходов и уплаты пошлин за регистрацию.

        Если данные отсутствуют в тексте договора:
        - статусное/enum-поле = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - full_transfer_status: "defined" только если прямо указано «в полном объёме», «отчуждает исключительное право» без ограничений. Если указано «предоставляет право» — это лицензия, ставь "not_defined".
        - registration_obligation_status: "defined" как в случае прямого указания на обязательность Роспатента, так и при прямом обоснованном указании, что регистрация не требуется (для произведений, ноу-хау).
        - registration_applicant: ищи указания на то, какая сторона (Правообладатель, Приобретатель или обе совместно) готовит и подаёт документы в Роспатент.
        - registration_costs: фиксируй, кто уплачивает патентные/государственные пошлины за регистрацию перехода права (по ст. 333.30 НК РФ) и покрывает сопутствующие расходы.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами, без markdown, без комментариев, без текста до или после.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все данные определены:
        Фрагмент:
        "Правообладатель отчуждает Приобретателю исключительное право в полном
        объёме. Переход права подлежит государственной регистрации в Роспатенте.
        Заявление подаёт Приобретатель. Расходы на регистрацию несёт Приобретатель."

        Ответ:
        {
          "full_transfer_status": "defined",
          "full_transfer_details": "отчуждает исключительное право в полном объёме",
          "registration_obligation_status": "defined",
          "registration_obligation_details": "переход права подлежит государственной регистрации в Роспатенте",
          "registration_applicant_status": "defined",
          "registration_applicant_details": "заявление подаёт Приобретатель",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы на регистрацию несёт Приобретатель",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Правообладатель отчуждает Приобретателю исключительное право в полном объёме. Переход права подлежит государственной регистрации в Роспатенте."}
          ]
        }

        Пример 2 — регистрация не требуется по закону:
        Фрагмент:
        "Правообладатель обязуется передать Приобретателю исключительное право
        на базу данных в полном объёме. Государственная регистрация перехода
        права на базу данных сторонами не проводится, право переходит в момент
        подписания настоящего Договора."

        Ответ:
        {
          "full_transfer_status": "defined",
          "full_transfer_details": "передать исключительное право на базу данных в полном объёме",
          "registration_obligation_status": "defined",
          "registration_obligation_details": "государственная регистрация перехода права сторонами не проводится",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.3", "quote": "Государственная регистрация перехода права на базу данных сторонами не проводится, право переходит в момент подписания настоящего Договора."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Правообладатель обязуется предоставить право использования произведения."

        Ответ:
        {
          "full_transfer_status": "not_defined",
          "full_transfer_details": "Данные не определены",
          "registration_obligation_status": "not_defined",
          "registration_obligation_details": "Данные не определены",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Значения enum — строго из allowed_values?
        2. Текстовые поля при отсутствии данных = "Данные не определены"?
        3. Статусные поля при отсутствии данных = "not_defined"?
        4. Если регистрация не требуется — registration_obligation_status = "defined"?
        5. Все ли 4 статус-поля имеют значение в JSON?

        Не выводи шаги проверки. Верни только JSON.

      fields:
        - name: "full_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на полный объём передачи исключительного права."
          required: true
        - name: "full_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Полный объём передачи"
          description: "Формулировка о передаче исключительного права в полном объёме."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "registration_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания обязанности государственной регистрации перехода исключительного права."
          required: true
        - name: "registration_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация перехода"
          description: "Условия регистрации перехода права или указание, что регистрация не требуется."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "registration_applicant_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания стороны, ответственной за подачу документов в Роспатент."
          required: true
        - name: "registration_applicant_details"
          type: "string"
          presentation: "fact"
          label: "Кто регистрирует"
          description: "Сторона, ответственная за подготовку и подачу заявления о государственной регистрации."
          required: true
          display_in_grid: false
        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка распределения расходов на государственную регистрацию."
          required: true
        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на регистрацию"
          description: "Условия распределения пошлин и расходов на регистрацию перехода исключительного права."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: encumbrances_licenses_check
    name: "Обременения, действующие лицензии и споры (ст. 1235 п. 7 ГК РФ)"
    description: >
      Проверяет раскрытие в договоре об отчуждении исключительного права информации
