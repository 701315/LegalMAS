    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "арбитражный суд"
        - "суд по интеллектуальным правам"
        - "подсудность"
        - "медиация"
      keyword_mode: "any"

  - id: "confidentiality_clause"
    name: "Конфиденциальность условий договора"
