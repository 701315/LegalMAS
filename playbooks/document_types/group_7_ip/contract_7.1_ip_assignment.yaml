      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения о соавторстве
        и цепочке прав соавторов.
        Не анализируй вознаграждение за отчуждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. co_authorship_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (co_authorship_status, co_authors_claims_status,
              co_authors_notification_status, co_authors_remuneration_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. co_authorship_status — "defined" / "not_applicable" / "not_defined".
        2. co_authorship_details — состав соавторов или указание на единственного автора.
        3. co_authors_claims_status — "defined" / "not_applicable" / "not_defined".
        4. co_authors_claims_details — подтверждение отсутствия / наличия притязаний.
        5. co_authors_notification_status — "defined" / "not_applicable" / "not_defined".
        6. co_authors_notification_details — уведомление соавторов об отчуждении.
        7. co_authors_remuneration_status — "defined" / "not_applicable" / "not_defined".
        8. co_authors_remuneration_details — распределение вознаграждения между соавторами.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни co_authorship_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - co_authorship_status = "not_applicable" только если прямо указан один автор.
        - Если соавторство указано (defined), но один из сопутствующих блоков (притязания, уведомление, вознаграждение) не урегулирован — ставь "not_defined" в соответствующем статусе.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
