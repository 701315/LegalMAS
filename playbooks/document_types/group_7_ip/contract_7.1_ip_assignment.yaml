      административных спорах в Роспатенте и судебных разбирательствах.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обременения"
        - "залог"
        - "залог исключительного права"
        - "лицензии"
        - "лицензионные договоры"
