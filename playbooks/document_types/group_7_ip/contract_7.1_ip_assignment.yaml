  - id: "governing_law"
    name: "Применимое право"
    description: "Выбор применимого права"
    legal_base: "ст. 1210 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["cross_border_ip"]
    rules:
