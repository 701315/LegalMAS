        - "не нарушает прав"
        - "не оспаривается"
        - "претензии третьих лиц"
        - "индемнити"
        - "возмещение убытков"
      keyword_mode: "any"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: заверения, гарантии и индемнити.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах
        - ст. 393 ГК РФ — возмещение убытков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантию принадлежности права.
        2. Гарантию действительности права.
        3. Гарантию отсутствия обременений.
        4. Гарантию отсутствия споров.
        5. Гарантию ненарушения прав третьих лиц.
        6. Индемнити-оговорку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Правообладатель гарантирует, что является единственным правообладателем,
        право действительно, не обременено, не оспаривается и не нарушает прав
        третьих лиц. При предъявлении претензий третьих лиц Правообладатель
        обязуется возместить Приобретателю все убытки."

        Ответ:
        {
          "ownership_warranty_status": "defined",
          "ownership_warranty_details": "является единственным правообладателем",
          "validity_warranty_status": "defined",
          "validity_warranty_details": "право действительно",
          "no_encumbrances_warranty_status": "defined",
          "no_encumbrances_warranty_details": "не обременено",
          "no_disputes_warranty_status": "defined",
          "no_disputes_warranty_details": "не оспаривается",
          "no_infringement_warranty_status": "defined",
          "no_infringement_warranty_details": "не нарушает прав третьих лиц",
          "indemnity_status": "defined",
          "indemnity_details": "обязуется возместить Приобретателю все убытки",
          "evidence": [{"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что является единственным правообладателем..."}]
        }

        Пример 2:
        Фрагмент:
        "Правообладатель передаёт исключительное право."

        Ответ:
        {
          "ownership_warranty_status": "not_defined",
          "ownership_warranty_details": "Данные не определены",
          "validity_warranty_status": "not_defined",
