  # CHECK 3: Полный объём передачи и регистрация перехода
  # ──────────────────────────────────────────────────────────────────────────
  - id: full_transfer_and_registration_check
    name: "Полный объём передачи и регистрация перехода права"
    description: >
      Проверяет явное указание на передачу в полном объёме (отличие от лицензии),
      обязанность регистрации перехода и распределение расходов на регистрацию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в полном объеме"
        - "полностью"
        - "исключительное право передается"
        - "исключительное право переходит"
        - "отчуждает исключительное право"
        - "государственная регистрация"
        - "регистрация перехода права"
        - "Роспатент"
        - "ФИПС"
        - "заявление о регистрации"
        - "расходы на регистрацию"
        - "государственная пошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)регистраци\\w+\\s+(перехода\\s+)?прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: полный объём передачи и регистрация перехода.

        Нормативный ориентир:
        - ст. 1234 п. 1 ГК РФ — отчуждение в полном объёме
        - ст. 1232 ГК РФ — государственная регистрация
        - ст. 1234 п. 4 ГК РФ — момент перехода права

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Явное указание на передачу в полном объёме.
        2. Обязанность регистрации перехода права.
        3. Кто подаёт заявление на регистрацию.
        4. Распределение расходов на регистрацию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Правообладатель отчуждает Приобретателю исключительное право в полном объёме.
        Переход права подлежит государственной регистрации в Роспатенте.
        Заявление подаёт Приобретатель. Расходы на регистрацию несёт Приобретатель."

        Ответ:
        {
          "full_transfer_status": "defined",
          "full_transfer_details": "отчуждает исключительное право в полном объёме",
          "registration_obligation_status": "defined",
          "registration_obligation_details": "подлежит государственной регистрации в Роспатенте",
          "registration_applicant_status": "defined",
          "registration_applicant_details": "заявление подаёт Приобретатель",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы несёт Приобретатель",
          "evidence": [{"clause_ref": "п. 2.1", "quote": "Правообладатель отчуждает Приобретателю исключительное право в полном объёме."}]
        }

        Пример 2:
        Фрагмент:
        "Правообладатель передаёт право."

        Ответ:
        {
          "full_transfer_status": "not_defined",
          "full_transfer_details": "Данные не определены",
          "registration_obligation_status": "not_defined",
          "registration_obligation_details": "Данные не определены",
          "registration_applicant_status": "not_defined",
          "registration_applicant_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о полном объёме.
        2. Найди прямую цитату о регистрации.
        3. Найди прямую цитату о том, кто подаёт заявление.
        4. Найди прямую цитату о расходах.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "full_transfer_status": "<defined / not_defined>",
          "full_transfer_details": "<текст или 'Данные не определены'>",
          "registration_obligation_status": "<defined / not_defined>",
          "registration_obligation_details": "<текст или 'Данные не определены'>",
          "registration_applicant_status": "<defined / not_defined>",
          "registration_applicant_details": "<текст или 'Данные не определены'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "в полном объеме полностью отчуждает исключительное право государственная регистрация регистрация перехода права Роспатент ФИПС заявление о регистрации расходы на регистрацию государственная пошлина"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "обременения"
        - "залог"
        - "лицензии"
        - "споры"
        - "вознаграждение"
        - "оплата"
        - "расторжение"
        - "конфиденциальность"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения о полном объёме передачи и регистрации перехода.
        Не анализируй вознаграждение, обременения или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. full_transfer_status — "defined" или "not_defined".
        2. full_transfer_details — формулировка о полном объёме.
        3. registration_obligation_status — "defined" или "not_defined".
        4. registration_obligation_details — обязанность регистрации.
        5. registration_applicant_status — "defined" или "not_defined".
        6. registration_applicant_details — кто подаёт заявление.
        7. registration_costs_status — "defined" или "not_defined".
        8. registration_costs_details — распределение расходов.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - full_transfer_status = "defined" только если прямо указано "в полном объёме"
          или "отчуждает исключительное право" без ограничений.
        - Не выводи необходимость регистрации из типа объекта — только из текста.
        - Верни только JSON.
        </rules>
      fields:
        - name: "full_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на полный объём передачи."
          required: true
        - name: "full_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Полный объём передачи"
          description: "Формулировка о передаче в полном объёме."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "registration_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности регистрации."
