        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если состав соавторов раскрыт и подтверждено
           отсутствие притязаний.
        4. verdict = "unclear" — если состав раскрыт, но нет подтверждения
           отсутствия притязаний.
        5. verdict = "fail" — если о соавторстве не упоминается, хотя объект
           по природе может иметь нескольких авторов.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — соавторство раскрыто (pass):
        Фрагмент:
