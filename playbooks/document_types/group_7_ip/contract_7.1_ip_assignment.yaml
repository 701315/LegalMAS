  - id: termination_and_post_transfer_check
    name: "Пост-отчуждательные обязательства: запрет конкуренции, обратная лицензия, содействие (ст. 421, 1234 п. 5 ГК РФ)"
    description: >
      Проверяет IP-специфичные пост-отчуждательные обязательства: запрет конкуренции
      для отчуждателя, обратную лицензию для его собственных нужд и обязанность
      содействия в переходе (документация, обучение). Общие основания расторжения
      проверяются global checks termination_grounds и termination_consequences.
      Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет конкуренции"
        - "не конкурировать"
        - "неконкуренция"
        - "не создавать конкурирующие"
        - "обратная лицензия"
        - "право использования сохраняется"
        - "передача документации"
        - "обучение"
        - "содействие"
        - "переходный период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(запрет|обязуется\\s+не).*конкурир"
        - "(?i)не\\s+создавать\\s+конкурирующ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: пост-отчуждательные обязательства —
        запрет конкуренции, обратная лицензия, содействие в переходе.

        Нормативный ориентир:
        - ст. 1234 п. 5 ГК РФ — последствия расторжения договора об отчуждении
          (возврат права)
        - ст. 421 ГК РФ — свобода договора (база для non-compete)
        - ст. 14.6 ФЗ-135 «О защите конкуренции» — недобросовестная конкуренция
        - ст. 1033 ГК РФ — ограничения по аналогии (коммерческая концессия)
        - ст. 1235 ГК РФ — лицензионные конструкции (для обратной лицензии)

        Важно:
        - Общие основания расторжения проверяются в global checks
          termination_grounds и termination_consequences — здесь не дублируются.
        - Non-compete в IP-assignment прямо не урегулирован; применяется через
          свободу договора, но ограничен антимонопольным законодательством:
          не может быть бессрочным и запрещать деятельность целиком.

        [ЗАДАЧА]
        Определи, содержит ли договор:
        1. Запрет конкуренции для отчуждателя — с указанием срока, сферы и
           территории.
        2. Обратную лицензию для отчуждателя — исключительная / неисключительная,
