  - id: title_chain_check
    name: "Цепочка прав: титул правообладателя и ограничения на отчуждение"
    description: >
      Проверяет происхождение исключительного права у правообладателя (создание /
      уступка / наследование / служебный РИД) и отсутствие ограничений на дальнейшее
      отчуждение (ст. 1238 ГК РФ — сублицензия; ограничения из предыдущего договора).
      Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "приобрел"
        - "получил исключительное право"
        - "создан"
        - "уступлен"
        - "перешло по наследству"
        - "служебное"
        - "по договору"
        - "сублицензия"
        - "с согласия лицензиара"
        - "без права отчуждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(приобрел|получил|создан|уступлен|перешло)\\s+(исключительное\\s+право|право)"
        - "(?i)без\\s+права\\s+(отчуждения|уступки)"

