  - id: ip_object_identification_check
    name: "Идентификация объекта ИС: регистрационные данные, описание, срок"
    description: >
      Проверяет достаточность идентификации объекта ИС в договоре об отчуждении
      исключительного права: тип объекта, регистрационный номер, дата регистрации
      и приоритета, срок действия, краткое описание, орган регистрации.
      Недостаточная идентификация — основание для признания договора незаключённым
      (ст. 1234 п. 1 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "патент"
        - "свидетельство"
        - "регистрационный номер"
        - "дата регистрации"
        - "дата приоритета"
        - "срок действия"
        - "Роспатент"
        - "ФИПС"
        - "программа для ЭВМ"
        - "база данных"
        - "произведение"
        - "ноу-хау"
        - "секрет производства"
        - "полезная модель"
        - "промышленный образец"
        - "товарный знак"
        - "селекционное достижение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(патент|свидетельство)\\s*(№|#|N)?\\s*\\d{5,}"
        - "(?i)регистрационн[ыо]й\\s+номер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1234, 1353, 1354, 1363, 1481, 1491).
        Проверяется только один вопрос: достаточно ли идентифицирован объект ИС
        в тексте договора.

        Нормативный ориентир:
        - ст. 1234 п. 1 ГК РФ — предмет договора об отчуждении (объект должен
          быть идентифицирован так, чтобы исключить смешение с иным объектом).
        - ст. 1354 ГК РФ — патент на изобретение, полезную модель, промышленный
          образец (номер, дата приоритета, срок действия).
        - ст. 1363 ГК РФ — сроки действия патентов (изобретение — 20 лет,
          полезная модель — 10 лет, промышленный образец — 5 лет с продлением).
        - ст. 1481 ГК РФ — свидетельство на товарный знак.
        - ст. 1491 ГК РФ — срок действия исключительного права на товарный знак
          (10 лет с возможностью продления).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, идентифицирован ли объект ИС в тексте договора — так, чтобы
        исключить его смешение с иным объектом того же правообладателя.

        Критерии достаточной идентификации:
        - для регистрируемых объектов (patent, utility_model, industrial_design,
          trademark, software, database, selection_achievement, topology):
          необходим хотя бы один из признаков — регистрационный номер, дата
          регистрации/приоритета, ссылка на приложение с реестром;
        - для нерегистрируемых объектов (work, know_how, commercial_designation,
          firm_name): необходимо описание объекта или отсылка к приложению.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если объект идентифицирован по указанным критериям.
        4. verdict = "unclear" — если идентификация минимальна или формулировка
           неоднозначна (например, только «патент на изобретение» без номера).
        5. verdict = "fail" — если объект не идентифицирован вовсе.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — объект идентифицирован (pass):
        Фрагмент:
        "Исключительное право на изобретение «Способ обработки данных»,
        патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован
        в Роспатенте 01.06.2021, действует до 15.03.2040."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указан тип объекта, регистрационный номер патента, даты регистрации и приоритета, срок действия и орган регистрации.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Исключительное право на изобретение «Способ обработки данных», патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован в Роспатенте 01.06.2021, действует до 15.03.2040."}
          ]
        }

        Пример 2 — минимальная идентификация (unclear):
        Фрагмент:
        "Передаётся исключительное право на изобретение."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Указан только тип объекта («изобретение») без регистрационного номера, дат и описания. Идентификация недостаточна для однозначного отнесения к конкретному патенту.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Передаётся исключительное право на изобретение."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указан ли тип объекта ИС?
        3. Есть ли регистрационный номер / дата / отсылка к приложению?
        4. Есть ли описание объекта?
        5. Соответствует ли verdict критериям достаточной идентификации?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "патент свидетельство регистрационный номер дата регистрации дата приоритета срок действия Роспатент ФИПС изобретение полезная модель промышленный образец товарный знак программа для ЭВМ база данных произведение ноу-хау селекционное достижение топология интегральной микросхемы"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - title_transfer
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "обременения"
        - "залог"
        - "лицензии третьим лицам"
        - "разрешение споров"
        - "вознаграждение за отчуждение"
        - "оплата по договору"
        - "расторжение договора"
        - "конфиденциальность"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права данные об идентификации объекта: тип, регистрационный номер, даты,
        срок действия, описание, орган регистрации.
        Не анализируй вознаграждение, обременения, споры или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        1. ip_object_type — тип объекта ИС: "patent" (изобретение) / "utility_model"
           (полезная модель) / "industrial_design" (промышленный образец) /
           "trademark" (товарный знак) / "software" (программа для ЭВМ) /
           "database" (база данных) / "work" (произведение) / "know_how"
           (секрет производства) / "selection_achievement" (селекционное
           достижение) / "topology" (топология интегральной микросхемы) /
           "commercial_designation" (коммерческое обозначение) / "firm_name"
           (фирменное наименование) / "other" / "not_defined".
        2. registration_number_status — "defined" / "not_defined".
        3. registration_number_value — номер патента/свидетельства (например,
           «RU 2700000», «№ 123456»). Если нет — "Данные не определены".
        4. registration_date_status — "defined" / "not_defined".
        5. registration_date_value — дата регистрации. Если нет — "Данные не определены".
        6. priority_date_status — "defined" / "not_defined".
        7. priority_date_value — дата приоритета. Если нет — "Данные не определены".
        8. expiry_date_status — "defined" / "not_defined".
        9. expiry_date_value — дата окончания срока действия. Если нет —
           "Данные не определены".
        10. object_description_status — "defined" / "not_defined".
        11. object_description_value — краткое описание объекта или отсылка
            к приложению. Если нет — "Данные не определены".
        12. registration_authority — "rospatent" (Роспатент/ФИПС) / "other"
            (иной орган) / "not_required" (объект не подлежит регистрации) /
            "not_defined".

        Если данные отсутствуют:
        - статусное поле = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Для нерегистрируемых объектов (work, know_how, commercial_designation,
          firm_name):
          * registration_number_status = "not_defined"
          * registration_date_status = "not_defined"
          * priority_date_status = "not_defined"
          * registration_authority = "not_required"
        - Для регистрируемых объектов (patent, utility_model, industrial_design,
          trademark, software, database, selection_achievement, topology):
          * registration_authority = "rospatent" (по умолчанию для РФ), если
            не указан иной орган.
        - Если значение определяется через приложение / реестр / спецификацию —
          это валидный факт, укажи отсылку (например, «согласно Приложению № 2»).
        - Не выводи данные из контекста — только если прямо написаны в договоре.
        - Верни РОВНО один валидный JSON-объект со всеми 13 ключами,
          без markdown, без комментариев, без текста до или после.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все данные определены (регистрируемый объект):
        Фрагмент:
        "Исключительное право на изобретение «Способ обработки данных»,
        патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован
        в Роспатенте 01.06.2021, действует до 15.03.2040."

        Ответ:
        {
          "ip_object_type": "patent",
          "registration_number_status": "defined",
          "registration_number_value": "RU 2700000",
          "registration_date_status": "defined",
          "registration_date_value": "01.06.2021",
          "priority_date_status": "defined",
          "priority_date_value": "15.03.2020",
          "expiry_date_status": "defined",
          "expiry_date_value": "15.03.2040",
          "object_description_status": "defined",
          "object_description_value": "Способ обработки данных",
          "registration_authority": "rospatent",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Исключительное право на изобретение «Способ обработки данных», патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован в Роспатенте 01.06.2021, действует до 15.03.2040."}
          ]
        }

        Пример 2 — нерегистрируемый объект с отсылкой к приложению:
        Фрагмент:
        "Отчуждается исключительное право на произведения, перечень и описание
        которых приведены в Приложении № 2 (реестр РИД)."

        Ответ:
        {
          "ip_object_type": "work",
          "registration_number_status": "not_defined",
          "registration_number_value": "Данные не определены",
          "registration_date_status": "not_defined",
          "registration_date_value": "Данные не определены",
          "priority_date_status": "not_defined",
          "priority_date_value": "Данные не определены",
          "expiry_date_status": "not_defined",
          "expiry_date_value": "Данные не определены",
          "object_description_status": "defined",
          "object_description_value": "согласно Приложению № 2 (реестр РИД)",
          "registration_authority": "not_required",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Отчуждается исключительное право на произведения, перечень и описание которых приведены в Приложении № 2 (реестр РИД)."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Передаётся исключительное право на произведение."

        Ответ:
        {
          "ip_object_type": "work",
          "registration_number_status": "not_defined",
          "registration_number_value": "Данные не определены",
          "registration_date_status": "not_defined",
          "registration_date_value": "Данные не определены",
          "priority_date_status": "not_defined",
          "priority_date_value": "Данные не определены",
          "expiry_date_status": "not_defined",
          "expiry_date_value": "Данные не определены",
          "object_description_status": "not_defined",
          "object_description_value": "Данные не определены",
          "registration_authority": "not_required",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON:
        1. Значения enum — строго из allowed_values?
        2. Текстовые поля при отсутствии данных = "Данные не определены"?
        3. Статусные поля при отсутствии данных = "not_defined"?
        4. Для нерегистрируемых объектов registration_authority = "not_required"?
        5. Для регистрируемых объектов registration_authority = "rospatent" или "other"?

        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["patent", "utility_model", "industrial_design", "trademark", "software", "database", "work", "know_how", "selection_achievement", "topology", "commercial_designation", "firm_name", "other", "not_defined"]
          description: "Тип объекта интеллектуальной собственности."
          required: true
        - name: "registration_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия регистрационного номера объекта ИС."
          required: true
        - name: "registration_number_value"
          type: "string"
          presentation: "fact"
          label: "Регистрационный номер"
          description: "Номер патента/свидетельства (RU 2700000, № 123456 и т.д.)."
