  - id: author_moral_rights_check
    name: "Сохранение личных неимущественных прав автора (ст. 1228, 1265, 1266 ГК РФ)"
    description: >
      Проверяет отсутствие в договоре ничтожных условий об отчуждении, ограничении
      или отказе от личных неимущественных прав автора. По п. 2 ст. 1228 ГК РФ
      право авторства, право на имя и право на неприкосновенность произведения
      неотчуждаемы и непередаваемы; отказ от них ничтожен. Специфика doc-type
      contract_7.1_ip_assignment.
    triggers:
      any:
        - author_is_party
        - copyright_objects
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право авторства"
        - "право на имя"
        - "личные неимущественные"
        - "неотчуждаемые права"
        - "автор сохраняет"
        - "указание имени автора"
        - "право на неприкосновенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автор\\s+сохраняет.*прав(о|а)"
        - "(?i)неотчуждаем\\w+.*прав"
        - "(?i)автор\\s+(отказывается|отчуждает)\\s+от\\s+(права\\s+)?авторств"
        - "(?i)право\\s+авторства\\s+(переходит|отчуждается)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: содержит ли договор ничтожные условия
        об отчуждении, ограничении или отказе от личных неимущественных прав автора.

        Нормативный ориентир:
        - ст. 1228 п. 2 ГК РФ — личные неимущественные права автора неотчуждаемы
          и непередаваемы иными способами; отказ от них ничтожен
        - ст. 1265 ГК РФ — право авторства, право на имя
        - ст. 1266 ГК РФ — право на неприкосновенность произведения и защиту
          от искажений

        Важно:
        - Сохранение личных неимущественных прав — по закону. Отсутствие
          упоминания в договоре — НОРМА (не основание для fail).
        - Отчуждение / ограничение / отказ от этих прав — ничтожное условие
          (п. 2 ст. 1228 ГК РФ), это критический красный флаг.

        [ЗАДАЧА]
        Определи, содержит ли договор формулировки, отчуждающие, ограничивающие
        или отменяющие личные неимущественные права автора:
        1. Отчуждение / переход / отказ от права авторства.
        2. Отчуждение / отказ от права на имя или от указания авторства.
        3. Ограничение права на неприкосновенность произведения или защиту
           от искажений.
        4. Иные условия, противоречащие п. 2 ст. 1228 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "fail" — если в договоре есть формулировка об отчуждении,
           ограничении или отказе от личных неимущественных прав автора
           (ничтожное условие по п. 2 ст. 1228 ГК РФ).
        4. verdict = "pass" — если таких формулировок нет (по умолчанию права
           сохраняются за автором в силу закона).
        5. verdict = "unclear" — если формулировка неоднозначна, но потенциально
           ограничивает личные права автора.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — подтверждение сохранения прав (pass):
        Фрагмент:
        "Автор сохраняет за собой право авторства, право на имя и иные личные
        неимущественные права, которые являются неотчуждаемыми и непередаваемыми."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Личные неимущественные права прямо подтверждены как сохраняющиеся за автором; ничтожных условий нет.",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Автор сохраняет за собой право авторства, право на имя и иные личные неимущественные права, которые являются неотчуждаемыми и непередаваемыми."}
          ]
        }

        Пример 2 — договор о личных правах молчит (pass):
        Фрагмент:
        "Передаётся исключительное право на произведение в полном объёме."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Отчуждение исключительного права не затрагивает личные неимущественные права автора; ничтожных условий нет. По п. 2 ст. 1228 ГК РФ права автора сохраняются в силу закона.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Передаётся исключительное право на произведение в полном объёме."}
          ]
        }

        Пример 3 — ничтожное условие (fail):
        Фрагмент:
        "Автор отказывается от права авторства и права на имя в пользу
        Правообладателя и не вправе возражать против внесения изменений
        в произведение."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Договор содержит условие об отказе автора от права авторства и права на имя, а также ограничение права на неприкосновенность произведения. По п. 2 ст. 1228 ГК РФ такие условия ничтожны.",
          "evidence": [
            {"clause_ref": "п. 5.2", "quote": "Автор отказывается от права авторства и права на имя в пользу Правообладателя и не вправе возражать против внесения изменений в произведение."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Есть ли в договоре формулировка об отчуждении / отказе / ограничении
           права авторства?
        3. Есть ли аналогичная формулировка о праве на имя?
        4. Есть ли ограничение права на неприкосновенность произведения?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

