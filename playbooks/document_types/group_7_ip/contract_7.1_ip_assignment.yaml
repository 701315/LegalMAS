  - id: termination_and_post_transfer_check
    name: "Пост-отчуждательные обязательства: запрет конкуренции, обратная лицензия, содействие (ст. 421, 1234 п. 5 ГК РФ)"
    description: >
      Проверяет IP-специфичные пост-отчуждательные обязательства: запрет конкуренции
      для отчуждателя, обратную лицензию для его собственных нужд и обязанность
      содействия в переходе (документация, обучение). Общие основания расторжения
      проверяются global checks termination_grounds и termination_consequences.
      Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет конкуренции"
        - "не конкурировать"
        - "неконкуренция"
        - "не создавать конкурирующие"
        - "обратная лицензия"
        - "право использования сохраняется"
        - "передача документации"
        - "обучение"
        - "содействие"
        - "переходный период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(запрет|обязуется\\s+не).*конкурир"
        - "(?i)не\\s+создавать\\s+конкурирующ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: пост-отчуждательные обязательства —
        запрет конкуренции, обратная лицензия, содействие в переходе.

        Нормативный ориентир:
        - ст. 1234 п. 5 ГК РФ — последствия расторжения договора об отчуждении
          (возврат права)
        - ст. 421 ГК РФ — свобода договора (база для non-compete)
        - ст. 14.6 ФЗ-135 «О защите конкуренции» — недобросовестная конкуренция
        - ст. 1033 ГК РФ — ограничения по аналогии (коммерческая концессия)
        - ст. 1235 ГК РФ — лицензионные конструкции (для обратной лицензии)

        Важно:
        - Общие основания расторжения проверяются в global checks
          termination_grounds и termination_consequences — здесь не дублируются.
        - Non-compete в IP-assignment прямо не урегулирован; применяется через
          свободу договора, но ограничен антимонопольным законодательством:
          не может быть бессрочным и запрещать деятельность целиком.

        [ЗАДАЧА]
        Определи, содержит ли договор:
        1. Запрет конкуренции для отчуждателя — с указанием срока, сферы и
           территории.
        2. Обратную лицензию для отчуждателя — исключительная / неисключительная,
           scope, term, для каких нужд.
        3. Обязанность содействия в переходе — состав (документация, обучение,
           сопровождение), срок, кто несёт расходы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если урегулированы как минимум обратная лицензия
           и содействие в переходе.
        4. verdict = "unclear" — если условия есть, но не раскрыты существенные
           параметры (срок non-compete, состав transition support).
        5. verdict = "fail" — если ни одно из пост-отчуждательных обязательств
           не урегулировано.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все блоки определены (pass):
        Фрагмент:
        "Правообладатель обязуется не создавать конкурирующие объекты ИС
        в сфере промышленной автоматизации на территории РФ в течение 3 лет.
        Приобретатель предоставляет Правообладателю неисключительную лицензию
        на использование отчуждённого объекта для внутренних нужд сроком на 5 лет.
        Правообладатель передаёт техническую документацию и оказывает содействие
        в течение 30 дней с даты подписания акта."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы запрет конкуренции с указанием сферы, территории и срока; обратная лицензия с параметрами; обязанность содействия с составом и сроком.",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Правообладатель обязуется не создавать конкурирующие объекты ИС в сфере промышленной автоматизации на территории РФ в течение 3 лет."}
          ]
        }

        Пример 2 — неполное покрытие (unclear):
        Фрагмент:
        "Правообладатель обязуется передать техническую документацию."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Указано только содействие в виде передачи документации без состава, срока и распределения расходов; обратная лицензия и запрет конкуренции не урегулированы.",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Правообладатель обязуется передать техническую документацию."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Есть ли запрет конкуренции со сроком / сферой / территорией?
        3. Есть ли обратная лицензия с параметрами (exclusivity, scope, term)?
        4. Есть ли обязанность содействия с составом и сроком?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
