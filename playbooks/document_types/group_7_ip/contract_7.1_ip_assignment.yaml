          display_in_grid: true
          display_priority: 1

        - name: "nmpt_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус НМПТ как объекта отчуждения."
          required: true

        - name: "nmpt_details"
          type: "string"
          presentation: "fact"
          label: "НМПТ"
          description: "Сведения о НМПТ как объекте отчуждения."
          required: false
