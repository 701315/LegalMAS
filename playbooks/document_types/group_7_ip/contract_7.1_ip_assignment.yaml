type: contract_7.1_ip_assignment
name: "Договор об отчуждении исключительного права"

description: |
  Соглашение, по которому правообладатель передаёт или обязуется передать принадлежащее ему
  исключительное право на результат интеллектуальной деятельности (РИД) или средство
  индивидуализации в полном объёме приобретателю.

  Ключевые особенности:
  • Является «продажей права» — влечёт безвозвратную утрату права первоначальным обладателем
  • Для регистрируемых объектов (патенты, ТЗ, ПМ, ПО) переход права подлежит регистрации в Роспатенте
  • Автор сохраняет неотчуждаемые личные неимущественные права (право авторства, право на имя)
  • Безвозмездное отчуждение между коммерческими организациями запрещено

  Регулируется ст. 1234 ГК РФ (общие положения), а также специальными нормами для отдельных
  объектов: ст. 1285 (произведения), ст. 1365 (изобретения, ПМ, ПО), ст. 1488 (товарные знаки),
  ст. 1468 (ноу-хау).

version: 4.1
parent: class_7_intellectual_property

