  - id: author_moral_rights_check
    name: "Сохранение личных неимущественных прав автора (ст. 1228, 1265 ГК РФ)"
    description: >
      Проверяет подтверждение сохранения за автором неотчуждаемых личных
      неимущественных прав: право авторства, право на имя, право на неприкосновенность.
    triggers:
      any:
        - author_is_party
        - copyright_objects
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право авторства"
        - "право на имя"
        - "личные неимущественные"
        - "неотчуждаемые права"
        - "автор сохраняет"
        - "указание имени автора"
        - "право на неприкосновенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автор\\s+сохраняет.*прав(о|а)"
        - "(?i)неотчуждаем\\w+.*прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: сохранение личных неимущественных прав автора.

        Нормативный ориентир:
        - ст. 1265 ГК РФ — право авторства и право на имя
        - ст. 1228 ГК РФ — автор результата интеллектуальной деятельности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Право авторства и право на имя НЕОТЧУЖДАЕМЫ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Подтверждение сохранения права авторства.
        2. Подтверждение сохранения права на имя.
        3. Подтверждение сохранения права на неприкосновенность.
        4. Указание на неотчуждаемость личных прав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Автор сохраняет за собой право авторства, право на имя и иные личные
        неимущественные права, которые являются неотчуждаемыми и непередаваемыми."

        Ответ:
        {
          "authorship_right_status": "defined",
