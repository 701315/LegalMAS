      preferred_clause_functions: [representations, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["representations", "obligations"]
