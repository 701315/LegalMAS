      compact_output: false

      presence_signal:
        field: "author_succession_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения о
        правопреемстве исключительного права (наследование).
        Не анализируй обременения, регистрацию или вознаграждение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. author_succession_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (author_alive_status, successors_status,
              succession_documents_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. author_alive_status — "defined" / "not_applicable" / "not_defined".
        2. author_alive_details — сведения о статусе автора (жив / умер).
        3. successors_status — "defined" / "not_applicable" / "not_defined".
        4. successors_details — состав наследников автора.
        5. succession_documents_status — "defined" / "not_applicable" / "not_defined".
        6. succession_documents_details — документы о правопреемстве (свидетельство о праве на наследство).

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни author_succession_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - author_alive_status = "defined" если прямо указано, что автор жив и является стороной договора.
        - successors_status = "not_applicable" только если прямо указано, что автор жив.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает статус автора (жив/умер), наследников или правопреемство.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано, что право перешло по наследству, но не раскрыт состав наследников и отсутствуют реквизиты свидетельства о праве на наследство.
           → presence = "present";
             author_alive_status = "not_applicable";
             successors_status / succession_documents_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указано, что правообладатель действует на основании доверенности от автора, а в заверениях — что автор умер и правообладатель является наследником.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Автор жив (тема рассмотрена, но неприменима).
           В договоре прямо указано, что автор жив и передаёт исключительное право лично.
           → presence = "present";
             author_alive_status = "defined";
             successors_status = "not_applicable";
             succession_documents_status = "not_applicable".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для author_succession_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "author_succession_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о правопреемстве автора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "author_alive_status"
