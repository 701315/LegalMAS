          required: false
          display_in_grid: true
          display_priority: 2

        - name: "transition_support_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус содействия в переходе."
