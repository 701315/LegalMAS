          "termination_status": "not_defined",
          "termination_details": "Данные не определены",
          "non_compete_status": "defined",
          "non_compete_details": "не создавать конкурирующие объекты ИС в течение 3 лет",
          "reverse_license_status": "defined",
          "reverse_license_details": "неисключительная лицензия для внутренних нужд",
          "transition_support_status": "defined",
          "transition_support_details": "передаёт техническую документацию и оказывает содействие в течение 30 дней",
          "evidence": [{"clause_ref": "п. 6.1", "quote": "Продавец обязуется не создавать конкурирующие объекты ИС в течение 3 лет."}]
        }

        Пример 2:
        Фрагмент:
        "Передаётся исключительное право."

        Ответ:
        {
          "termination_status": "not_defined",
          "termination_details": "Данные не определены",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "reverse_license_status": "not_defined",
          "reverse_license_details": "Данные не определены",
          "transition_support_status": "not_defined",
          "transition_support_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о расторжении.
        2. Найди прямую цитату о non-compete.
        3. Найди прямую цитату об обратной лицензии.
        4. Найди прямую цитату о transition support.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_status": "<defined / not_defined>",
          "termination_details": "<текст или 'Данные не определены'>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "reverse_license_status": "<defined / not_defined>",
          "reverse_license_details": "<текст или 'Данные не определены'>",
          "transition_support_status": "<defined / not_defined>",
          "transition_support_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение отказ от договора запрет конкуренции non-compete неконкуренция обратная лицензия право использования сохраняется передача документации обучение содействие переходный период"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "обременения"
        - "залог"
        - "лицензии третьих лиц"
        - "вознаграждение"
        - "оплата"
        - "регистрация"
        - "конфиденциальность"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения о расторжении, non-compete, обратной лицензии и transition support.
        Не анализируй вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. termination_status / termination_details — основания и последствия расторжения.
        2. non_compete_status / non_compete_details — non-compete оговорка.
        3. reverse_license_status / reverse_license_details — обратная лицензия.
        4. transition_support_status / transition_support_details — содействие в переходе.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи условия из молчания договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения."
          required: false
        - name: "termination_details"
          type: "string"
          presentation: "fact"
          label: "Расторжение"
          description: "Основания и последствия расторжения."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус non-compete оговорки."
          required: false
        - name: "non_compete_details"
          type: "string"
          presentation: "fact"
          label: "Non-compete"
          description: "Non-compete оговорка."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "reverse_license_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обратной лицензии."
          required: false
        - name: "reverse_license_details"
          type: "string"
          presentation: "fact"
          label: "Обратная лицензия"
          description: "Обратная лицензия для отчуждателя."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "transition_support_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус содействия в переходе."
          required: false
        - name: "transition_support_details"
          type: "string"
          presentation: "fact"
          label: "Transition support"
          description: "Обязательства по содействию в переходе."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  ip_assignment_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты правообладателя и приобретателя,
      тип объекта ИС, модель передачи (полный объём vs лицензия), размер вознаграждения
      и момент перехода исключительного права.
    addressee: "Обе стороны"

  ip_object_identification_check:
    text: >
      Просим предоставить по {doc_names}: копию патента/свидетельства, выписку из реестра
      Роспатента, подтверждение регистрационного номера, даты регистрации/приоритета
      и срока действия объекта ИС.
    addressee: "Правообладатель"

  full_transfer_and_registration_check:
    text: >
      Просим подтвердить по {doc_names}: (а) передачу исключительного права в полном объёме;
      (б) обязанность регистрации перехода в Роспатенте; (в) кто подаёт заявление;
      (г) распределение расходов на регистрацию.
    addressee: "Обе стороны / Патентный поверенный"

  encumbrances_licenses_check:
    text: >
      Просим раскрыть по {doc_names} все обременения исключительного права:
      залог, действующие лицензии (ст. 1235 п. 7 ГК РФ), споры и судебные разбирательства.
    addressee: "Правообладатель"

  service_invention_rights_check:
    text: >
      По {doc_names} — служебный РИД. Просим предоставить подтверждение урегулирования
      прав автора-работника: выплату вознаграждения, согласие автора, подтверждение
      прав работодателя.
    addressee: "Правообладатель (работодатель)"

  author_moral_rights_check:
    text: >
      По {doc_names} — просим включить явное подтверждение сохранения за автором
      личных неимущественных прав (авторство, имя, неприкосновенность).
      Такие права неотчуждаемы (ст. 1265 ГК РФ).
    addressee: "Юридический советник"

  know_how_confidentiality_check:
    text: >
      По {doc_names} (ноу-хау) просим уточнить: режим конфиденциальности после передачи,
      обязанности продавца по неразглашению, способ передачи информации,
      ограничения доступа третьих лиц.
    addressee: "Обе стороны"

  representations_warranties_indemnity_check:
    text: >
      По {doc_names} — просим расширить заверения правообладателя:
      (а) принадлежность права; (б) действительность; (в) отсутствие обременений;
      (г) отсутствие споров; (д) ненарушение прав третьих лиц; (е) индемнити-оговорку.
    addressee: "Юридический советник правообладателя"

  cross_border_and_tax_check:
    text: >
      По {doc_names} — просим уточнить: территорию действия, применимое право,
      валюту расчётов, налоговые последствия (НДС, льгота по пп. 26 п. 2 ст. 149 НК РФ),
      валютный контроль (при оплате нерезиденту).
    addressee: "Юридический советник / Налоговый консультант"

  termination_and_post_transfer_check:
    text: >
      По {doc_names} — просим согласовать: основания расторжения, non-compete оговорку,
      обратную лицензию для отчуждателя (при необходимости), обязательства по передаче
      документации и содействию в переходе.
    addressee: "Обе стороны / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


    