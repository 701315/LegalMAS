        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права сведения о международном элементе и налогах.
        Не анализируй обременения, споры, регистрацию или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cross_border_and_tax_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (foreign_party_status, territory_status,
              currency_status, vat_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. foreign_party_status — "defined" / "not_applicable" / "not_defined".
        2. foreign_party_details — наименование иностранной стороны, её резидентство и роль.
        3. territory_status — "defined" / "not_applicable" / "not_defined".
        4. territory_details — территория действия исключительного права.
        5. currency_status — "defined" / "not_defined".
        6. currency_details — валюта обязательства и платежа, валютная оговорка.
        7. vat_status — "defined" / "not_applicable" / "not_defined".
        8. vat_details — налоговая оговорка по НДС с учётом применимости льготы.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни cross_border_and_tax_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи применимое право — это в global check governing_law_and_forum.
        - foreign_party_status = "not_applicable" — только если в договоре прямо указано, что обе стороны — резиденты РФ.
        - Льгота пп. 26 п. 2 ст. 149 НК РФ применима ТОЛЬКО к отчуждению исключительных прав на: программы для ЭВМ, базы данных, топологии ИМС, изобретения, полезные модели, промышленные образцы, секреты производства (ноу-хау). НЕ применима к: товарным знакам, произведениям (кроме ПО), коммерческим обозначениям, фирменным наименованиям.
        - Если объект не входит в льготный перечень, а договор ссылается на пп. 26 п. 2 ст. 149 НК РФ — отрази это в vat_details как некорректное применение.
        - При иностранной стороне-правообладателе НДС удерживается налоговым агентом-приобретателем (ст. 161 НК РФ), если льгота не применяется.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не содержит сведений об иностранной стороне, территории, валюте или НДС.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (частичное покрытие).
           Указана только валюта расчётов, но отсутствуют сведения об иностранной стороне, территории или НДС.
           → presence = "present";
             currency_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указано, что обе стороны — резиденты РФ, а в разделе о расчётах — иностранная валюта и налоговый агент.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Некорректное применение льготы по НДС.
           Договор ссылается на льготу пп. 26 п. 2 ст. 149 НК РФ для объекта, не входящего в льготный перечень (например, товарный знак).
           → presence = "present";
             vat_status = "defined";
             vat_details прямо фиксирует некорректное применение льготы и указывает на обязанность налогового агента.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cross_border_and_tax_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
