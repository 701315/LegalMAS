  - id: service_invention_rights_check
    name: "Служебные РИД: урегулирование прав автора (ст. 1295, 1370 ГК РФ)"
    description: >
      Проверяет урегулирование отношений с автором-работником при отчуждении
      служебного результата интеллектуальной деятельности: служебный характер,
      основание принадлежности прав работодателю (ст. 1295 п. 1, ст. 1370 п. 2 ГК РФ),
      выплату авторского вознаграждения (ст. 1295 п. 2, ст. 1370 п. 4 ГК РФ,
      ПП РФ № 512) и отсутствие претензий автора.
    triggers:
      any:
        - service_invention
    ui_mode: "field_extraction"
