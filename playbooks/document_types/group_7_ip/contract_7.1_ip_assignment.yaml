           В преамбуле указан один автор, а в разделе о вознаграждении — распределение между несколькими соавторами.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Единственный автор (тема рассмотрена, но неприменима).
           В договоре прямо указано, что объект создан единственным автором.
           → presence = "present";
             все *_status = "not_applicable";
             co_authorship_details содержит указание на единственного автора.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для co_authorship_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "co_authorship_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о соавторстве. Внутреннее агрегатное signal-поле."
          required: true

