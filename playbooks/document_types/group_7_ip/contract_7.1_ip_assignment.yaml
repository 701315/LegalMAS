compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: ip_assignment_subject_extraction
    name: "Базовое извлечение: стороны, объект, модель передачи, вознаграждение"
    description: >
      Извлекает правообладателя, приобретателя, тип объекта ИС, модель передачи
      (полный объём vs частичная), вознаграждение (статус + детали) и момент перехода
      исключительного права. Проверяет наличие базовых существенных условий договора
      об отчуждении исключительного права (ст. 1234 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правообладатель"
        - "приобретатель"
        - "отчуждатель"
        - "исключительное право"
        - "в полном объеме"
        - "в полном объёме"
        - "вознаграждение"
        - "момент перехода"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "секрет производства"
        - "полезная модель"
        - "промышленный образец"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(правообладатель|приобретатель).*именуем"
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1228, 1232, 1234).
        Проверяется только один вопрос: содержит ли договор базовые
        существенные параметры отчуждения.

        Нормативный ориентир:
        - ст. 1234 ГК РФ — договор об отчуждении исключительного права:
          существенные условия (предмет, вознаграждение или безвозмездность).
        - ст. 1232 ГК РФ — государственная регистрация отчуждения исключительного
          права (для патентов, товарных знаков, селекционных достижений, топологий).
        - ст. 1228 ГК РФ — автор результата интеллектуальной деятельности.
        - ст. 1234 п. 3 ГК РФ — при отсутствии условия о вознаграждении договор
          считается незаключённым (кроме безвозмездного).
        - ст. 1234 п. 4 ГК РФ — момент перехода исключительного права.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, содержит ли текст договора сведения хотя бы по трём из шести
        базовых параметров отчуждения:
        1. Правообладатель (наименование/ФИО, реквизиты).
        2. Приобретатель (наименование/ФИО, реквизиты).
        3. Тип объекта ИС (патент, товарный знак, произведение, ПО и т.д.).
        4. Модель передачи (полный объём / частичная / иная).
        5. Вознаграждение (размер, тип, или признак безвозмездности).
        6. Момент перехода права (заключение / регистрация / оплата / иной).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если найдено ≥ 3 параметра.
        4. verdict = "unclear" — если найдено 1–2 параметра или формулировки
           неоднозначны.
        5. verdict = "fail" — если базовые параметры отсутствуют.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 8 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры присутствуют (pass):
        Фрагмент:
        "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель —
        ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение
        по патенту RU 2700000 в полном объёме. Вознаграждение — 5 000 000 рублей,
        единовременно. Право переходит с момента государственной регистрации."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указаны стороны, объект, полный объём передачи, вознаграждение и момент перехода.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель — ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение по патенту RU 2700000 в полном объёме."}
          ]
        }

        Пример 2 — параметры отсутствуют (fail):
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В тексте нет указаний на стороны, объект ИС, объём передачи, вознаграждение и момент перехода права.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указаны ли правообладатель и приобретатель?
        3. Указан ли объект ИС и объём передачи?
        4. Указано ли вознаграждение (или признак безвозмездности)?
        5. Определён ли момент перехода права?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правообладатель приобретатель отчуждатель отчуждение исключительного права в полном объёме вознаграждение момент перехода патент товарный знак изобретение полезная модель промышленный образец программа для ЭВМ база данных ноу-хау произведение селекционное достижение государственная регистрация"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - title_transfer
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "обратная лицензия"
        - "non-compete"
        - "конфиденциальность"
        - "форс-мажор"
        - "расторжение договора"
        - "разрешение споров"
        - "подсудность"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.30
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1500
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Извлеки из договора
        об отчуждении исключительного права базовые параметры: стороны, объект,
        модель передачи, вознаграждение и момент перехода.
        Не анализируй обременения, споры, расторжение или конфиденциальность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        1. rightsholder_details — правообладатель (наименование/ФИО и реквизиты).
        2. acquirer_details — приобретатель (наименование/ФИО и реквизиты).
        3. ip_object_type — тип объекта ИС: "patent" (изобретение) / "utility_model"
           (полезная модель) / "industrial_design" (промышленный образец) /
           "trademark" (товарный знак) / "software" (программа для ЭВМ) /
           "database" (база данных) / "work" (произведение) / "know_how"
           (секрет производства) / "selection_achievement" (селекционное
           достижение) / "topology" (топология ИМС) / "commercial_designation"
           (коммерческое обозначение) / "other" / "not_defined".
        4. transfer_scope — модель передачи: "full_assignment" / "partial" /
           "unclear" / "not_defined".
        5. remuneration_status — статус вознаграждения: "defined" / "gratuitous" /
           "not_defined".
        6. remuneration_details — размер и тип вознаграждения (или указание
           приложения / спецификации / графика платежей).
        7. transfer_moment — момент перехода: "upon_contract_conclusion" (с момента
           заключения договора) / "upon_registration" (с момента государственной
           регистрации) / "upon_payment" (после полной оплаты) / "custom" (иной
           момент) / "not_defined".

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное/enum-поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - transfer_scope:
          * "full_assignment" — если прямо указано «в полном объёме» или
            «отчуждает исключительное право» без оговорок;
          * "partial" — если передаётся часть прав или ограниченный объём;
          * "unclear" — если формулировка неоднозначна.
        - remuneration_status:
          * "defined" — если указан размер, порядок или отсылка к приложению;
          * "gratuitous" — если прямо указано «безвозмездно» (ст. 1234 п. 3 ГК РФ);
          * "not_defined" — если о вознаграждении ничего не сказано.
        - transfer_moment:
          * "upon_registration" — для объектов, требующих гос. регистрации
            (патенты, товарные знаки, селекционные достижения, топологии);
          * "upon_contract_conclusion" — для объектов, не требующих регистрации
            (ноу-хау, произведения, ПО), если иное не указано;
          * "upon_payment" — если право переходит после полной оплаты;
          * "custom" — иной момент, указанный в договоре.
        - ip_object_type: если в договоре отчуждается несколько объектов разного
          типа — укажи основной или "other" с пояснением в remuneration_details.
          Фирменное наименование (firm_name) не отчуждаемо по закону (ст. 1474 ГК РФ),
          но если договор содержит такую формулировку — зафиксируй как факт.
        - Если значение определяется через приложение / спецификацию / график
          платежей — это валидный факт, укажи отсылку.
        - Верни РОВНО один валидный JSON-объект со всеми 8 ключами,
          без markdown, без комментариев, без текста до или после.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель —
        ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение
        по патенту RU 2700000 в полном объёме. Вознаграждение — 5 000 000 рублей,
        единовременно. Право переходит с момента государственной регистрации."

        Ответ:
        {
          "rightsholder_details": "ООО «Альфа», ИНН 7700000001",
          "acquirer_details": "ООО «Бета», ИНН 7700000002",
          "ip_object_type": "patent",
          "transfer_scope": "full_assignment",
          "remuneration_status": "defined",
          "remuneration_details": "5 000 000 рублей, единовременно",
          "transfer_moment": "upon_registration",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель — ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение по патенту RU 2700000 в полном объёме."}
          ]
        }

        Пример 2 — отсылка к приложению:
        Фрагмент:
        "Правообладатель — ИП Иванов И.И. передаёт Приобретателю — ООО «Гамма»
        исключительное право на программу для ЭВМ «УчётСклад v.3.0» (свидетельство
        Роспатента № 2023612345) в полном объёме. Вознаграждение определяется
        согласно Приложению № 1 (график платежей) и составляет не менее
        1 200 000 рублей. Право переходит с момента подписания акта приёма-передачи."

        Ответ:
        {
