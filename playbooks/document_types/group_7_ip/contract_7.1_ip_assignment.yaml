  - id: representations_warranties_indemnity_check
    name: "Заверения о действительности права, ненарушении и возмещение потерь (ст. 431.2, 406.1 ГК РФ)"
    description: >
      Проверяет IP-специфичные заверения правообладателя: действительность
      исключительного права (патент/свидетельство не оспорены, срок не истёк)
      и ненарушение прав третьих лиц, а также наличие оговорки о возмещении
      потерь (ст. 406.1 ГК РФ) при предъявлении претензий о нарушении ИС.
      Специфика doc-type contract_7.1_ip_assignment. Общие R&W (принадлежность,
      отсутствие обременений и споров) покрываются global checks.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантирует"
        - "заверяет"
        - "действительность"
        - "патент действителен"
        - "не оспорен"
        - "не нарушает прав третьих лиц"
        - "претензии третьих лиц"
        - "возмещение потерь"
        - "возмещение убытков"
      keyword_mode: "any"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: содержит ли договор IP-специфичные заверения
        и оговорку о возмещении потерь.

        Нормативный ориентир:
        - ст. 431.2 п. 1 ГК РФ — заверения об обстоятельствах
        - ст. 406.1 ГК РФ — возмещение потерь, не связанных с нарушением обязательства
        - ст. 15 ГК РФ — убытки
        - ст. 393 ГК РФ — возмещение убытков
        - ст. 1252 ГК РФ — способы защиты исключительных прав

        Важно:
        - Проверяются только IP-специфичные заверения. Общие R&W (принадлежность,
          отсутствие обременений, отсутствие судебных споров) проверяются в global
          checks и в других чеках пакета.
        - Заверение о ненарушении чужих исключительных прав — критично для
          приобретателя, так как использование РИД может повлечь претензии третьих лиц.

        [ЗАДАЧА]
        Определи, содержит ли договор:
        1. Заверение о действительности исключительного права (патент/свидетельство
           не оспорены, срок не истёк, право действительно).
        2. Заверение о том, что объект не нарушает исключительных прав третьих лиц.
        3. Оговорку о возмещении потерь (ст. 406.1 ГК РФ) при предъявлении
           третьими лицами претензий о нарушении исключительных прав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если присутствуют как минимум заверения о
           действительности и о ненарушении, а также оговорка о возмещении потерь.
        4. verdict = "unclear" — если присутствует только часть блоков.
        5. verdict = "fail" — если договор IP-специфичных заверений и оговорки
           о возмещении потерь не содержит.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все блоки определены (pass):
        Фрагмент:
        "Правообладатель гарантирует, что исключительное право на изобретение
        по патенту RU 2700000 является действительным, патент не оспорен,
        срок действия не истёк. Объект не нарушает исключительных прав третьих
        лиц. При предъявлении третьими лицами претензий о нарушении исключительных
        прав Правообладатель обязуется возместить Приобретателю все убытки
        и самостоятельно урегулировать такие претензии."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Предоставлены заверения о действительности права и ненарушении прав третьих лиц, а также оговорка о возмещении потерь с обязанностью урегулировать претензии.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право на изобретение по патенту RU 2700000 является действительным, патент не оспорен, срок действия не истёк. Объект не нарушает исключительных прав третьих лиц."}
          ]
        }

        Пример 2 — частичное покрытие (unclear):
        Фрагмент:
        "Правообладатель гарантирует, что исключительное право является
        действительным."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Присутствует только заверение о действительности права; отсутствуют заверение о ненарушении прав третьих лиц и оговорка о возмещении потерь.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право является действительным."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Есть ли заверение о действительности исключительного права?
        3. Есть ли заверение о ненарушении прав третьих лиц?
        4. Есть ли оговорка о возмещении потерь при претензиях о нарушении ИС?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантирует заверяет действительность исключительного права патент действителен не оспорен не нарушает исключительных прав третьих лиц претензии третьих лиц возмещение потерь возмещение убытков защита от претензий"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - remedies
      negative_keywords:
        - "в целях настоящего"
        - "вознаграждение за отчуждение"
        - "оплата"
        - "регистрация перехода"
        - "расторжение"
        - "конфиденциальность"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.25
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "representations_warranties_indemnity_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права IP-специфичные заверения правообладателя
        и оговорку о возмещении потерь.
        Не анализируй принадлежность, обременения, споры (это в global checks),
        вознаграждение, регистрацию или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. representations_warranties_indemnity_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (validity_warranty_status, no_infringement_warranty_status,
              ip_indemnity_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. validity_warranty_status — "defined" / "not_defined".
        2. validity_warranty_details — заверение о действительности исключительного права.
        3. no_infringement_warranty_status — "defined" / "not_applicable" / "not_defined".
        4. no_infringement_warranty_details — заверение о ненарушении исключительных прав третьих лиц.
        5. ip_indemnity_status — "defined" / "not_applicable" / "not_defined".
        6. ip_indemnity_details — оговорка о возмещении потерь при претензиях третьих лиц.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни representations_warranties_indemnity_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи заверения из молчания договора.
        - "not_applicable" для no_infringement_warranty_* — только если объект создан самим правообладателем с нуля и по природе не может нарушать чужих исключительных прав.
        - ip_indemnity_* охватывает: возмещение убытков, возмещение потерь (ст. 406.1 ГК РФ), обязанность defend (урегулировать претензии), hold harmless (освободить от ответственности).
        - Если ip_indemnity определяется через отдельный раздел договора — укажи отсылку в details.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не содержит IP-специфичных заверений и оговорки о возмещении потерь.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (частичное покрытие).
           Присутствует только заверение о действительности права, но отсутствуют заверение о ненарушении прав третьих лиц и оговорка о возмещении потерь.
           → presence = "present";
             validity_warranty_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе есть заверение о ненарушении прав, а в разделе об ответственности — исключение ответственности за нарушение прав третьих лиц.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Отсылка на внешний документ / отдельный раздел.
           Возмещение потерь или заверения отсылают к отдельному разделу договора (например, "в порядке, предусмотренном разделом 6").
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку-отсылку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для representations_warranties_indemnity_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "representations_warranties_indemnity_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие IP-специфичных заверений и оговорки о возмещении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "validity_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения о действительности исключительного права."
          required: true

        - name: "validity_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Действительность права"
          description: "Заверение о действительности исключительного права."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "no_infringement_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус заверения о ненарушении прав третьих лиц."
          required: true

        - name: "no_infringement_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Ненарушение прав третьих лиц"
          description: "Заверение о том, что объект не нарушает чужих исключительных прав."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "ip_indemnity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус оговорки о возмещении потерь (ст. 406.1 ГК РФ)."
          required: true

        - name: "ip_indemnity_details"
          type: "string"
          presentation: "fact"
          label: "Возмещение потерь"
          description: "Оговорка о возмещении потерь при претензиях о нарушении ИС."
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: cross_border_and_tax_check
    name: "Международный элемент и НДС при отчуждении ИС"
    description: >
      Проверяет международный элемент сделки (иностранная сторона, территория
      действия права, валюта расчётов и валютная оговорка) и налоговую оговорку
      по НДС с учётом применимости льготы пп. 26 п. 2 ст. 149 НК РФ (только
      для ПО, БД, топологий ИМС, изобретений, ПМ, ноу-хау — не для ТЗ и
      произведений). Применимое право проверяется global check
      governing_law_and_forum. Специфика doc-type contract_7.1_ip_assignment.
    triggers:
      any:
        - cross_border_ip
        - registered_ip_patent
        - copyright_objects
        - know_how_trade_secret
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "иностранное лицо"
        - "нерезидент"
        - "территория действия"
        - "иностранная валюта"
        - "USD"
        - "EUR"
        - "НДС"
        - "освобождение от НДС"
        - "не облагается НДС"
        - "пп. 26 п. 2 ст. 149"
        - "без НДС"
        - "в том числе НДС"
        - "налоговый агент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожден\\w+\\s+от\\s+НДС"
        - "(?i)не\\s+облагается\\s+НДС"
        - "(?i)пп\\.?\\s*26\\s+п\\.?\\s*2\\s+ст\\.?\\s*149"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: международный элемент сделки и
        налоговая оговорка по НДС.

        Нормативный ориентир:
        - ст. 317 ГК РФ — валютные обязательства и валютная оговорка
        - ст. 1211 ГК РФ — право, применимое к договору (при отсутствии выбора)
        - пп. 26 п. 2 ст. 149 НК РФ — освобождение от НДС для отчуждения
          исключительных прав на ПО, БД, топологии ИМС, изобретения, ПМ,
          ноу-хау. НЕ применяется к товарным знакам, произведениям,
          коммерческим обозначениям, фирменным наименованиям
        - ст. 161 НК РФ — НДС-агент при приобретении у иностранного лица
        - ФЗ-173 «О валютном регулировании»

        Важно:
        - Применимое право проверяется в global check governing_law_and_forum —
          здесь не дублируется.
        - Льгота пп. 26 п. 2 ст. 149 НК РФ — только для определённых типов
          объектов ИС. Для остальных НДС облагается по стандартной ставке.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Иностранной стороне (правообладатель / приобретатель — нерезидент).
        2. Территории действия исключительного права.
        3. Валюте расчётов и валютной оговорке (ст. 317 ГК РФ).
        4. Налоговой оговорке по НДС с учётом применимости льготы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если урегулированы валюта и налоговая оговорка;
           при наличии иностранной стороны — также территория.
        4. verdict = "unclear" — если присутствует только часть сведений.
        5. verdict = "fail" — если международный элемент очевиден (иностранная
           сторона, иностранная валюта), но валюта и налоговый режим не
           урегулированы.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — cross-border с корректной льготой (pass):
        Фрагмент:
        "Правообладатель — иностранная компания Alpha Inc. (США).
        Исключительное право на программу для ЭВМ действует на территории
