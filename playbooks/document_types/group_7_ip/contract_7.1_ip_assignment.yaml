  - id: contractor_ip_chain_check
    name: "Подрядчики и фрилансеры: цепочка прав от создателя-не-работника"
    description: >
      Проверяет цепочку прав, когда объект создан не работником (подрядчиком
      по договору авторского заказа / подряда, фрилансером). Требуется прямая
      уступка от подрядчика (ст. 1296, 1297 ГК РФ). Специфика doc-type
      contract_7.1_ip_assignment.
    triggers: {}
