        Не анализируй обременения, регистрацию или вознаграждение за отчуждение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. contractor_ip_chain_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contractor_creation_status, contractor_assignment_status,
              contractor_remuneration_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. contractor_creation_status — "defined" / "not_applicable" / "not_defined".
        2. contractor_creation_details — формулировка о создании подрядчиком.
        3. contractor_assignment_status — "defined" / "not_applicable" / "not_defined".
        4. contractor_assignment_details — уступка исключительного права от подрядчика.
        5. contractor_remuneration_status — "defined" / "not_applicable" / "not_defined".
        6. contractor_remuneration_details — вознаграждение подрядчика и отсутствие открытых обязательств.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни contractor_ip_chain_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - contractor_creation_status = "not_applicable" только если прямо указано, что объект создан самим правообладателем (без привлечения подрядчиков).
        - Если объект создан подрядчиком (defined), но уступка от него не раскрыта — contractor_assignment_status = "not_defined".
