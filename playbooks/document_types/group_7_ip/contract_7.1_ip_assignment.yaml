    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: урегулированы ли права соавторов.

        Нормативный ориентир:
        - ст. 1228, 1258 ГК РФ — соавторство; право используется совместно
        - ст. 1229 ГК РФ — распоряжение правом совместно всеми соавторами
        - ст. 1295 п. 2, 1370 п. 4 ГК РФ — вознаграждение авторов

        Важно:
        - При соавторстве распоряжение исключительным правом осуществляется
          совместно всеми соавторами (если иное не предусмотрено соглашением).
        - Отчуждение без раскрытия состава соавторов — существенный риск.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Наличии / отсутствии соавторства.
        2. Составе авторов / соавторов.
        3. Отсутствии притязаний соавторов.
        4. Уведомлении соавторов об отчуждении.
        5. Распределении вознаграждения между соавторами.

