      - "(?i)\\bPCT\\b"
      - "(?i)Мадридск[иоя]+\\s+протокол"
      - "(?i)евразийск[иоя]+\\s+патент"
      - "(?i)\\bЕАПО\\b"
      - "(?i)иностранн[а-яё]+\\s+валют[аа]"
      - "(?i)применим[оа]е\\s+прав[оо]"

  deferred_payment:
    description: "Отложенная или поэтапная оплата"
    any_keywords:
      - "(?i)\\bрассрочк[аа]\\b"
      - "(?i)поэтапн[а-яё]+\\s+оплат[аа]"
      - "(?i)в\\s+течени[ее]"
      - "(?i)после\\s+регистраци[ии]"
      - "(?i)отсрочк[аа]\\s+платеж[аа]"
      - "(?i)\\bроялти\\b"

  gratuitous_transfer:
    description: "Безвозмездная передача"
    any_keywords:
      - "(?i)\\bбезвозмездно\\b"
      - "(?i)без\\s+вознаграждени[яя]"
      - "(?i)\\bдарени[ее]\\b"
      - "(?i)на\\s+безвозмездн[оа]й\\s+основ[ее]"

  multiple_ip_objects:
    description: "Сделка с портфелем/несколькими объектами ИС"
    any_keywords:
      - "(?i)портфель\\s+патент[оо]в"
      - "(?i)комплекс\\s+прав"
      - "(?i)несколько\\s+объект[оо]в"
      - "(?i)переч[её]нь\\s+объект[оо]в"
      - "(?i)приложени[ее]\\s*№"
      - "(?i)групп[аа]\\s+патент[оо]в"
      - "(?i)семейств[оо]\\s+патент[оо]в"

  author_is_party:
    description: "Автор является стороной договора"
    any_keywords:
      - "(?i)автор\\s+переда[её]т"
      - "(?i)автор\\s+отчуждает"
      - "(?i)автор\\s*[—-]\\s*правообладател[ьь]"
      - "(?i)создател[ья]\\s+произведени[яя]"
      - "(?i)прав[оо]\\s+авторств[аа]"
      - "(?i)прав[оо]\\s+на\\s+им[яя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  patent_number: "(?i)\\b(патент|patent)\\s*(№|#|N)?\\s*\\d{5,}"
  trademark_number: "(?i)\\b(свидетельство|certificate)\\s*(№|#|N)?\\s*\\d{5,}"
  registration_number: "(?i)\\b(регистраци\\w+\\s+)?№?\\s*\\d{4,}[\\s/-]?\\d{0,6}"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  inn_pattern: "(?i)ИНН\\s*:?\\s*\\d{10,12}"
  ogrn_pattern: "(?i)ОГРН\\s*:?\\s*\\d{13,15}"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "gratuitous_between_commercial_prohibited"
    name: "Запрет безвозмездного отчуждения между коммерческими организациями"
    description: |
      Безвозмездное отчуждение исключительного права между коммерческими организациями
      не допускается (п. 3 ст. 1234, ст. 575 ГК РФ).
    legal_base: "п. 3 ст. 1234, ст. 575 ГК РФ"
    required_triggers: ["commercial_parties", "gratuitous_transfer"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "hybrid"
    rules:
      keywords:
        - "безвозмездно"
        - "без вознаграждения"
        - "дарение"
        - "коммерческая организация"
        - "юридическое лицо"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Проанализируй договор об отчуждении исключительного права.
        Определи:
        1. Являются ли обе стороны коммерческими организациями?
        2. Предусмотрено ли вознаграждение?

        Ответь в JSON:
        {
          "seller_is_commercial": "<yes / no / unclear>",
          "buyer_is_commercial": "<yes / no / unclear>",
          "remuneration_present": "<yes / no / unclear>",
          "gratuitous_indicators": "<yes / no / unclear>",
          "violation_risk": "<high / medium / low / none>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      boost_keywords:
        - "безвозмездно"
        - "вознаграждение"
        - "ООО"
        - "АО"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "unregistered_transfer_void"
    name: "Отсутствие регистрации перехода права на регистрируемые объекты"
    description: |
      Для регистрируемых объектов переход права без регистрации в Роспатенте
      не состоится (ст. 1232, 1234 ГК РФ).
    legal_base: "ст. 1232, 1234 ГК РФ"
    required_triggers: ["registered_ip_patent"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "патент"
        - "товарный знак"
        - "полезная модель"
        - "промышленный образец"
        - "регистрация"
        - "Роспатент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)регистраци\\w+\\s+(перехода\\s+)?права"
        - "(?i)подлежит\\s+регистрации"
    retrieval:
      context_k: 5
      boost_keywords:
        - "государственная регистрация"
        - "Роспатент"
        - "переход права"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

  - id: "trademark_assignment_goodwill_risk"
    name: "Уступка ТЗ для товаров иного рода → введение в заблуждение (ст. 1488 п. 2 ГК РФ)"
    description: |
      Отчуждение товарного знака не допускается, если оно может ввести потребителя
      в заблуждение относительно товара или его изготовителя.
      Роспатент может отказать в регистрации перехода.
    legal_base: "ст. 1488 п. 2 ГК РФ"
    required_triggers: ["registered_ip_trademark"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "введение в заблуждение"
        - "однородные товары"
        - "перечень товаров и услуг"
        - "класс МКТУ"
        - "Роспатент отказал"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "товарный знак"
        - "введение в заблуждение"
        - "МКТУ"
      rerank: true

  - id: "partial_trademark_assignment_confusion"
    name: "Частичная уступка ТЗ с риском смешения (ст. 1488 п. 3 ГК РФ)"
    description: |
      Не допускается отчуждение ТЗ в отношении части товаров, если это порождает
      вероятность смешения товаров и услуг (сходные ТЗ остаются у разных лиц).
    legal_base: "ст. 1488 п. 3 ГК РФ"
    required_triggers: ["registered_ip_trademark"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "частичная уступка"
        - "в отношении части товаров"
        - "часть перечня"
        - "сходные товарные знаки"
        - "вероятность смешения"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "частичная уступка"
        - "смешение"
        - "часть товаров"
      rerank: true

  - id: "currency_control_cross_border_ip"
    name: "Валютный контроль при трансграничном отчуждении ИС (ФЗ-173, НК РФ ст. 309-310)"
    description: |
      При оплате иностранному правообладателю необходимо:
      (а) оформить паспорт сделки (если сумма ≥ 3 млн руб.);
      (б) удержать налог у источника (20%, если нет СОИДН);
      (в) соблюсти валютное законодательство.
    legal_base: "ФЗ-173, НК РФ ст. 309, 310, 312"
    required_triggers: ["cross_border_ip"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "паспорт сделки"
        - "валютный контроль"
        - "налог у источника"
        - "withholding tax"
        - "СОИДН"
        - "нерезидент"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "валютный контроль"
        - "нерезидент"
        - "налог у источника"
      rerank: true

  - id: "author_moral_rights_inalienable"
    name: "Неотчуждаемость личных неимущественных прав автора (ст. 1265 ГК РФ)"
    description: |
      Договор НЕ может передавать право авторства и право на имя —
      они неотчуждаемы и непередаваемы (ст. 1265 ГК РФ).
      Условия договора, ограничивающие эти права, НИЧТОЖНЫ.
    legal_base: "ст. 1265, 1228 ГК РФ"
    required_triggers: ["author_is_party"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "передача права авторства"
        - "отказ от авторства"
        - "передача права на имя"
        - "анонимность"
        - "псевдоним переходит"
      keyword_mode: "any"
      negative_keywords:
        - "сохраняет право авторства"
        - "неотчуждаемые права"
        - "личные неимущественные права"
    retrieval:
      context_k: 4
      boost_keywords:
        - "право авторства"
        - "право на имя"
        - "неотчуждаемые"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: ip_object_extraction
    name: "Извлечение данных об объекте интеллектуальной собственности"
    description: "Извлекает тип объекта ИС, регистрационные данные, описание, срок действия"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "патент"
        - "товарный знак"
        - "изобретение"
        - "полезная модель"
        - "промышленный образец"
        - "программа для ЭВМ"
        - "произведение"
        - "ноу-хау"
        - "регистрационный номер"
        - "свидетельство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(патент|свидетельство)\\s*(№|#|N)?\\s*\\d{5,}"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор об отчуждении исключительного права.
        Найди в тексте сведения об объекте интеллектуальной собственности.

        Ответь строго в JSON:
        {
          "ip_object_type": "<patent / utility_model / industrial_design / trademark / software / database / work / know_how / other / not_found>",
          "registration_number": "<номер патента/свидетельства или not_found>",
          "registration_date": "<дата регистрации или not_found>",
          "expiry_date": "<дата окончания срока действия или not_found>",
          "object_description": "<краткое описание объекта или not_found>",
          "registration_authority": "<Роспатент / иной орган / not_applicable / not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "патент"
        - "товарный знак"
        - "регистрационный номер"
        - "свидетельство"
        - "срок действия"
        - "объект"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ip_object_type"
          type: "string"
          allowed_values: ["patent", "utility_model", "industrial_design", "trademark", "software", "database", "work", "know_how", "other", "not_found"]
          description: "Тип объекта ИС"
        - name: "registration_number"
          type: "string"
          regex_patterns:
            - "(?i)\\b(патент|свидетельство)\\s*(№|#|N)?\\s*\\d{5,}"
          description: "Номер регистрации"
        - name: "registration_date"
          type: "string"
          keyword_hints: ["дата регистрации", "зарегистрирован", "дата приоритета"]
          description: "Дата регистрации"
        - name: "expiry_date"
          type: "string"
          keyword_hints: ["срок действия", "действует до", "истекает"]
          description: "Дата окончания срока действия"
      store_payload: true

  - id: patent_validity_check
    name: "Проверка действительности патента/свидетельства"
    description: "Проверяет срок действия, уплату пошлин, отсутствие досрочного прекращения"
    triggers:
      any: ["registered_ip_patent", "registered_ip_trademark"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "действующий патент"
        - "срок действия"
        - "патент действует"
        - "поддержание в силе"
        - "пошлина уплачена"
        - "не прекращен"
        - "не аннулирован"
        - "не оспорен"
      keyword_mode: "any"
      negative_keywords:
        - "прекращен"
        - "аннулирован"
        - "истек"
        - "недействителен"
    llm:
      prompt_template: |
        Проанализируй договор об отчуждении патента/товарного знака.
        Определи, содержит ли договор подтверждение действительности права:

        Ответь в JSON:
        {
          "validity_confirmed": "<yes / no / unclear>",
          "expiry_date_specified": "<yes / no>",
          "maintenance_fees_paid": "<confirmed / not_mentioned / unclear>",
          "no_invalidation_proceedings": "<confirmed / not_mentioned / unclear>",
          "validity_snippet": "<цитата или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "действующий"
        - "срок действия"
        - "пошлина"
        - "поддержание в силе"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "validity_confirmed"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Подтверждена ли действительность права"
        - name: "maintenance_fees_paid"
          type: "string"
          allowed_values: ["confirmed", "not_mentioned", "unclear"]
          description: "Уплачены ли пошлины за поддержание"
      store_payload: true

  - id: encumbrances_licenses_check
    name: "Проверка обременений и действующих лицензий (ст. 1235 п. 7 ГК РФ)"
    description: "Проверяет раскрытие информации о залоге, лицензиях, спорах"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обременения"
        - "залог"
        - "лицензии"
        - "лицензионные договоры"
        - "права третьих лиц"
        - "споры"
        - "судебные разбирательства"
        - "свободен от обременений"
        - "отсутствие лицензий"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Проанализируй договор об отчуждении исключительного права.
        Найди информацию об обременениях:

        Ответь в JSON:
        {
          "encumbrances_disclosed": "<yes_none / yes_exist / not_disclosed>",
          "pledge_status": "<no_pledge / pledged / not_mentioned>",
          "licenses_status": "<no_licenses / licenses_exist / not_mentioned>",
          "license_details": "<описание лицензий или not_found>",
          "disputes_status": "<no_disputes / disputes_exist / not_mentioned>",
          "encumbrances_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Лицензии сохраняют силу при переходе права (ст. 1235 п. 7 ГК РФ).
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "обременения"
        - "залог"
        - "лицензии"
        - "третьи лица"
        - "споры"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "encumbrances_disclosed"
          type: "string"
          allowed_values: ["yes_none", "yes_exist", "not_disclosed"]
          description: "Раскрыты ли обременения"
        - name: "pledge_status"
          type: "string"
          allowed_values: ["no_pledge", "pledged", "not_mentioned"]
          description: "Статус залога"
        - name: "licenses_status"
          type: "string"
          allowed_values: ["no_licenses", "licenses_exist", "not_mentioned"]
          description: "Статус лицензий"
      store_payload: true

  - id: service_invention_rights_check
    name: "Служебные РИД: урегулирование прав автора (ст. 1295, 1370 ГК РФ)"
    description: "Проверяет урегулирование прав работника-автора на вознаграждение"
    triggers:
      any: ["service_invention"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "служебное"
        - "создано работником"
        - "трудовые обязанности"
        - "работодатель"
        - "вознаграждение автору"
        - "согласие автора"
        - "права автора урегулированы"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Проанализируй договор об отчуждении исключительного права на служебный РИД.
        Определи, урегулированы ли права автора-работника:

        Ответь в JSON:
        {
          "service_work_indicated": "<yes / no / unclear>",
          "author_remuneration_settled": "<confirmed / not_mentioned / unclear>",
          "author_consent_present": "<yes / no / not_applicable / unclear>",
          "employer_rights_confirmed": "<yes / no / unclear>",
          "service_work_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Автор служебного РИД сохраняет право на вознаграждение (ст. 1295, 1370 ГК РФ).
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "служебное"
        - "работник"
        - "автор"
        - "вознаграждение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "service_work_indicated"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Указано ли, что РИД служебный"
        - name: "author_remuneration_settled"
          type: "string"
          allowed_values: ["confirmed", "not_mentioned", "unclear"]
          description: "Урегулировано ли вознаграждение автора"
      store_payload: true

  - id: know_how_confidentiality_check
    name: "Ноу-хау: режим конфиденциальности и передача информации"
    description: "Проверяет сохранение режима коммерческой тайны и порядок передачи"
    triggers:
      any: ["know_how_trade_secret"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ноу-хау"
        - "секрет производства"
        - "коммерческая тайна"
        - "конфиденциальность"
        - "режим секретности"
