        - "трудовые обязанности"
        - "служебное задание"
        - "работодатель"
        - "вознаграждение автору"
        - "авторское вознаграждение"
        - "уведомление автора"
        - "права автора урегулированы"
        - "претензии автора отсутствуют"
      keyword_mode: "any"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права на служебный
        результат интеллектуальной деятельности (РИД).
        Проверяется только один вопрос: урегулированы ли отношения с автором-работником.

        Нормативный ориентир:
        - ст. 1295 п. 1, 2 ГК РФ — служебное произведение; исключительное право
          принадлежит работодателю; автору выплачивается вознаграждение.
        - ст. 1370 п. 2, 4 ГК РФ — служебное изобретение, полезная модель, промышленный образец;
          принадлежность работодателю; уведомление автора о подаче заявки и сохранении
          конфиденциальности; вознаграждение автору.
        - ПП РФ от 04.06.2014 № 512 — правила выплаты вознаграждения за служебные
          изобретения, полезные модели, промышленные образцы.
        - ст. 1228 ГК РФ — авторство и личные неимущественные права неотчуждаемы
          и сохраняются за работником.

        Важно:
        - Согласие автора на отчуждение исключительного права работодателем
          НЕ требуется — право принадлежит работодателю в силу закона и трудового договора.
        - Юридически значимо: подтверждение служебного статуса, выплата вознаграждения,
          уведомление автора, отсутствие претензий автора к работодателю.

        [ЗАДАЧА]
        Определи, урегулированы ли в договоре отношения с автором-работником.
        Регулирование считается достаточным, если присутствует хотя бы одно из:
        - прямое указание на служебный характер РИД и основание принадлежности работодателю;
        - указание на урегулирование/выплату вознаграждения автору (или ссылка на
          локальный акт / трудовой договор / соглашение с автором);
        - указание на уведомление автора о подаче заявки и о конфиденциальности;
        - прямое указание на отсутствие претензий автора к работодателю на дату сделки;
        - прямое обоснованное указание, что объект является неслужебным.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери строго из договора.
        3. verdict = "pass" — если отношения с автором урегулированы по указанным
           критериям (или объект прямо неслужебный с обоснованием).
        4. verdict = "unclear" — если есть указание на служебный характер без
           деталей урегулирования (например, только фраза «служебное изобретение»).
        5. verdict = "fail" — если договор о служебном характере и об отношениях
           с автором молчит при явно созданном работниками объекте.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отношения с автором урегулированы (pass):
        Фрагмент:
        "Объект создан работником Правообладателя в рамках трудовых обязанностей.
        Вознаграждение автору выплачено в полном объёме. Автор уведомлён о подаче
        заявки в Роспатент и о сохранении конфиденциальности. Претензий автора
        к Правообладателю нет."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указан служебный характер РИД, подтверждена выплата вознаграждения автору, уведомление о заявке и отсутствие претензий к работодателю.",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Объект создан работником Правообладателя в рамках трудовых обязанностей. Вознаграждение автору выплачено в полном объёме. Автор уведомлён о подаче заявки в Роспатент и о сохранении конфиденциальности. Претензий автора к Правообладателю нет."}
          ]
        }

        Пример 2 — служебный характер без раскрытия деталей (unclear):
        Фрагмент:
        "Передаётся исключительное право на служебное изобретение."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Указан служебный характер РИД, но в договоре не раскрыты сведения о выплате вознаграждения автору, уведомлении автора и отсутствии споров.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Передаётся исключительное право на служебное изобретение."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указан ли служебный характер РИД?
        3. Урегулировано ли вознаграждение автора?
        4. Есть ли уведомление автора (ст. 1370 п. 4 ГК РФ)?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "служебное изобретение служебное произведение создано работником трудовые обязанности работодатель вознаграждение автору авторское вознаграждение уведомление автора права автора урегулированы претензии автора отсутствуют"
