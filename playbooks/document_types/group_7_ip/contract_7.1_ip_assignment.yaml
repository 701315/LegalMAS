        - Не оценивай серьёзность риска.
        - При разглашении ноу-хау исключительное право прекращается.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим конфиденциальности после передачи.
        2. Обязанности продавца по неразглашению.
        3. Способ передачи информации.
        4. Ограничения доступа третьих лиц.

        [ПРАВИЛА]
