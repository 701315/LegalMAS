        field: "termination_and_post_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права пост-отчуждательные обязательства: запрет
        конкуренции, обратную лицензию, содействие в переходе.
        Не анализируй основания расторжения (это в global checks),
        вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_post_transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_competition_status, reverse_license_status,
              transition_support_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. non_competition_status — "defined" / "not_applicable" / "not_defined".
        2. non_competition_details — запрет конкуренции: срок, сфера, территория.
        3. reverse_license_status — "defined" / "not_applicable" / "not_defined".
        4. reverse_license_details — обратная лицензия: тип, объём, срок, нужды.
        5. transition_support_status — "defined" / "not_applicable" / "not_defined".
        6. transition_support_details — состав содействия, срок, распределение расходов.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_post_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи условия из молчания договора.
        - non_competition_status = "not_applicable" — только если в договоре прямо указано, что отчуждатель не ведёт деятельности в соответствующей сфере, либо стороны явно отказались от non-compete.
        - Non-compete в российском праве: не может быть бессрочным; не может запрещать деятельность целиком; ограничен сферой / территорией / сроком (ст. 14.6 ФЗ-135). Если в договоре бессрочный / всеобъемлющий запрет — отрази это в non_competition_details как факт.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не содержит ни одного пост-отчуждательного обязательства.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (частичное покрытие).
           Указано только содействие в виде передачи документации, но без состава, срока и распределения расходов; обратная лицензия и запрет конкуренции не урегулированы.
           → presence = "present";
             transition_support_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе указан запрет конкуренции на 3 года, а в другом — бессрочный запрет.
           → presence = "unclear";
             non_competition_status = "not_defined";
             non_competition_details = "Не удалось определить".

        4. Бессрочный или всеобъемлющий non-compete.
           Договор содержит бессрочный запрет на всю деятельность отчуждателя без ограничения сферы или территории.
           → presence = "present";
             non_competition_status = "defined";
             non_competition_details фиксирует факт бессрочности/всеобъемлющего характера.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_post_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_post_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие пост-отчуждательных обязательств. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_competition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус оговорки о запрете конкуренции."
          required: true

        - name: "non_competition_details"
          type: "string"
          presentation: "fact"
          label: "Запрет конкуренции"
          description: "Запрет конкуренции: срок, сфера, территория."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "reverse_license_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус обратной лицензии."
          required: true

        - name: "reverse_license_details"
          type: "string"
