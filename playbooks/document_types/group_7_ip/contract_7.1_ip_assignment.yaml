    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения об обременениях: залог, действующие лицензии, притязания
        третьих лиц и споры.
        Не анализируй вознаграждение, регистрацию перехода или расторжение договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        1. encumbrances_status — "defined" / "not_defined".
        2. encumbrances_details — раскрытие обременений в целом (перечень или указание на их отсутствие).
        3. pledge_status — "defined" / "not_applicable" / "not_defined".
        4. pledge_details — сведения о залоге исключительного права (наличие, отсутствие, залогодержатель, регистрация в Роспатенте).
        5. licenses_status — "defined" / "not_applicable" / "not_defined".
        6. licenses_details — сведения о действующих лицензиях третьих лиц или обратных лицензиях правообладателю (ст. 1235 п. 7 ГК РФ).
        7. disputes_status — "defined" / "not_applicable" / "not_defined".
        8. disputes_details — сведения о притязаниях третьих лиц, административных спорах в Палате по патентным спорам Роспатента или судах (СИП).

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable" (см. правила)
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи отсутствие обременений из молчания договора.
        - Статус "defined" — если договор прямо раскрывает соответствующий аспект (наличие ИЛИ прямое отсутствие).
        - Статус "not_applicable" — если по природе объекта обременение невозможно (например, лицензии для только что созданного произведения, ещё не введённого в оборот).
        - Статус "not_defined" — если договор об этом аспекте молчит, но аспект в принципе применим.
        - Если договор предусматривает сохранение лицензий третьих лиц или предоставление обратной лицензии Правообладателю (grant-back) — отрази это в licenses_details.
        - Для залога исключительного права ориентируйся на ст. 1232 п. 2 и ст. 358.18 ГК РФ.
        - disputes_details охватывает: претензии третьих лиц, споры в Палате по патентным спорам, Суде по интеллектуальным правам (СИП), арбитражных судах.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами, без markdown, без комментариев, без текста до или после.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обременения полностью раскрыты:
        Фрагмент:
        "Правообладатель гарантирует, что исключительное право не заложено,
        не обременено правами третьих лиц, не оспаривается. Действующие
        лицензионные договоры отсутствуют."

        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "не заложено, не обременено правами третьих лиц, не оспаривается, действующие лицензионные договоры отсутствуют",
          "pledge_status": "defined",
          "pledge_details": "не заложено",
          "licenses_status": "defined",
          "licenses_details": "действующие лицензионные договоры отсутствуют",
          "disputes_status": "defined",
          "disputes_details": "не оспаривается",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право не заложено, не обременено правами третьих лиц, не оспаривается. Действующие лицензионные договоры отсутствуют."}
          ]
        }

        Пример 2 — раскрытие через приложение (валидный факт):
        Фрагмент:
        "Сведения о действующих неисключительных лицензиях и обременениях
        отчуждаемого исключительного права приведены в Приложении № 3 к настоящему Договору."

        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "сведения о лицензиях и обременениях приведены в Приложении № 3",
          "pledge_status": "not_defined",
          "pledge_details": "Данные не определены",
          "licenses_status": "defined",
          "licenses_details": "действующие неисключительные лицензии указаны в Приложении № 3",
          "disputes_status": "not_defined",
          "disputes_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 3.4", "quote": "Сведения о действующих неисключительных лицензиях и обременениях отчуждаемого исключительного права приведены в Приложении № 3 к настоящему Договору."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Правообладатель передаёт исключительное право Приобретателю."

        Ответ:
        {
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Данные не определены",
          "pledge_status": "not_defined",
          "pledge_details": "Данные не определены",
          "licenses_status": "not_defined",
          "licenses_details": "Данные не определены",
          "disputes_status": "not_defined",
          "disputes_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON:
        1. Значения enum — строго из allowed_values?
        2. Текстовые поля при отсутствии данных = "Данные не определены"?
        3. Статусные поля = "defined" / "not_applicable" / "not_defined"?
        4. Отражены ли обратные лицензии в licenses_details, если они есть?
        5. Все ли 4 signal-поля имеют значение в JSON?

        Не выводи шаги проверки. Верни только JSON.

      fields:
        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
