      keyword_mode: "any"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: раскрыты ли в договоре обременения
        (залог, действующие лицензии, притязания третьих лиц, споры).

        Нормативный ориентир:
        - ст. 1235 п. 7 ГК РФ — переход исключительного права на результат интеллектуальной
          деятельности или на средство индивидуализации к новому правообладателю не является
          основанием для изменения или расторжения лицензионного договора, заключенного
          предшествующим правообладателем (лицензии «следуют» за объектом).
        - ст. 358.18 ГК РФ — залог исключительных прав.
        - ст. 1232 п. 2 ГК РФ — залог исключительного права в отношении регистрируемых
          объектов подлежит государственной регистрации в Роспатенте.
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (включая чистоту прав и отсутствие притязаний).
        - ст. 460 ГК РФ — обязанность передать имущество свободным от прав третьих лиц.

        [ЗАДАЧА]
        Определи, раскрывает ли договор информацию об обременениях отчуждаемого
        исключительного права. Раскрытие считается достаточным, если в тексте
        договора присутствует хотя бы одно из:
        - прямое указание на отсутствие обременений / залога / лицензий / споров;
        - перечень обременений, сохраняющихся после отчуждения;
        - отсылка к приложению / выписке из реестра, где обременения раскрыты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для юридической квалификации, но факты и цитаты бери строго из договора.
        3. verdict = "pass" — если обременения раскрыты (отсутствие указано прямо
           либо приведён перечень / отсылка к реестру).
        4. verdict = "unclear" — если есть общая декларативная фраза («право свободно от прав третьих лиц»)
           без детализации по залогам, лицензиям и спорам, либо информация неполная.
        5. verdict = "fail" — если договор об обременениях, залогах и лицензиях полностью молчит.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обременения раскрыты (pass):
        Фрагмент:
        "Правообладатель гарантирует, что исключительное право не заложено,
        не обременено правами третьих лиц, не оспаривается. Действующие
        лицензионные договоры отсутствуют."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Обременения раскрыты прямо: подтверждено отсутствие залога, прав третьих лиц, судебных споров и действующих лицензий.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право не заложено, не обременено правами третьих лиц, не оспаривается. Действующие лицензионные договоры отсутствуют."}
          ]
        }

        Пример 2 — обременения не раскрыты (fail):
        Фрагмент:
        "Правообладатель обязуется передать исключительное право на изобретение Приобретателю."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Договор не содержит заверений и сведений об обременениях, залогах, действующих лицензиях или спорах в отношении объекта ИС.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Раскрыты ли залог / лицензии / притязания третьих лиц / споры?
        3. Указано ли отсутствие обременений прямо или через отсылку?
        4. Есть ли в тексте обратная лицензия правообладателю?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

