        <task>
        Заполни строго следующие поля:

        0. service_invention_rights_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (service_rid_status, author_remuneration_status,
              author_notification_status, employer_rights_status)
             имеет значение "defined", "not_service" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. service_rid_status — "defined" (прямо указан служебный характер) /
           "not_service" (прямо указано, что объект неслужебный) / "not_defined".
        2. service_rid_details — формулировка о служебном характере объекта или об его отсутствии.
        3. author_remuneration_status — "defined" / "not_applicable" / "not_defined".
        4. author_remuneration_details — размер и порядок выплаты вознаграждения автору.
        5. author_notification_status — "defined" / "not_applicable" / "not_defined".
        6. author_notification_details — сведения об уведомлении автора (ст. 1370 п. 4 ГК РФ).
        7. employer_rights_status — "defined" / "not_applicable" / "not_defined".
        8. employer_rights_details — основание принадлежности исключительного права работодателю.

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable" (см. правила)
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни service_invention_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - service_rid_status = "not_service" — только если в договоре ПРЯМО указано основание, отличное от служебного (авторский заказ, договор разработки с подрядчиком, приобретение у третьего лица).
        - Для полей author_remuneration_*, author_notification_*, employer_rights_* ставь "not_applicable", если service_rid_status = "not_service".
        - Согласие автора на отчуждение права работодателем НЕ является обязательным условием — не требуй его.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор полностью молчит о служебном характере РИД и об отношениях с автором.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано только «служебное изобретение», но не раскрыты детали вознаграждения, уведомления или прав работодателя.
           → presence = "present";
             service_rid_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указано, что объект создан по договору авторского заказа (неслужебный), а в заверениях — что это служебный РИД работника.
           → presence = "unclear";
             service_rid_status = "not_defined";
             service_rid_details = "Не удалось определить".

        4. Отсылка на внешний документ.
           Выплата вознаграждения или порядок уведомления автора отсылают к Положению о служебных РИД или трудовому договору.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "в соответствии с Положением № 2".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для service_invention_rights_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_service", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

