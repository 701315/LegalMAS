           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. future_ip_mention_status — "defined" / "not_applicable" / "not_defined".
        2. future_ip_mention_details — упоминание будущих РИД (обновления, модификации, новые версии).
        3. future_ip_transfer_model_status — "defined" / "not_applicable" / "not_defined".
        4. future_ip_transfer_model_details — модель передачи прав на будущие объекты (отчуждение / лицензия).
        5. voidness_risk_status — "defined" / "not_applicable" / "not_defined".
        6. voidness_risk_details — риск ничтожности условия об отчуждении будущих прав.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни future_ip_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи упоминание будущих прав из молчания договора.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает будущие РИД, обновления, модификации или новые версии.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Упомянуты «будущие обновления», но не указана модель передачи (отчуждение или лицензия).
           → presence = "present";
             future_ip_mention_status = "defined";
             future_ip_transfer_model_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе указано, что будущие версии отчуждаются, а в другом — что на них предоставляется лицензия.
           → presence = "unclear";
             future_ip_transfer_model_status = "not_defined";
             future_ip_transfer_model_details = "Не удалось определить".

        4. Специфика темы: прямое отчуждение будущих прав.
           В договоре прямо указано отчуждение исключительных прав на будущие РИД (обновления, модификации, ещё не созданные объекты).
           → presence = "present";
             future_ip_transfer_model_status = "defined";
             future_ip_transfer_model_details фиксирует отчуждение;
             voidness_risk_status = "defined";
             voidness_risk_details фиксирует риск ничтожности по п. 5 ст. 1233 ГК РФ.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для future_ip_rights_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

