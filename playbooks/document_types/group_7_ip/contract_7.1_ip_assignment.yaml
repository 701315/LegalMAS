  - id: antitrust_clearance_check
    name: "Антимонопольное согласование ФАС при отчуждении ИС"
    description: >
      Проверяет необходимость и наличие согласования сделки с ФАС России
      по ст. 28 ФЗ-135 (приобретение прав на нематериальные активы свыше
      пороговых значений). Специфика doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ФАС"
        - "антимонопольное согласование"
        - "согласие ФАС"
        - "одобрение ФАС"
        - "ст. 28 ФЗ-135"
        - "пороговые значения"
        - "суммарная стоимость активов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(ФАС|антимонопольн)\\w+.*(соглас|одобрен)"
        - "(?i)ст\\.?\\s*28\\s+ФЗ[- ]?135"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права.
        Проверяется только один вопрос: требуется ли согласование с ФАС
        и урегулировано ли оно.

        Нормативный ориентир:
        - ст. 28 ФЗ-135 «О защите конкуренции» — согласование сделок с
          нематериальными активами при превышении пороговых значений
          (суммарная стоимость активов > 7 млрд руб. и др.)
        - ст. 29 ФЗ-135 — согласование сделок по приобретению акций / долей
        - Постановление Правительства РФ № 1428 — перечень случаев
          согласования

        Важно:
        - Отчуждение крупных портфелей патентов / ТЗ может требовать
          согласования с ФАС.
        - Отсутствие согласования — риск оспаривания сделки.

        [ЗАДАЧА]
        Определи, содержит ли договор сведения о:
        1. Необходимости согласования с ФАС.
        2. Наличии / отсутствии согласования.
        3. Стоимости отчуждаемых активов (для оценки порогов).
        4. Условиях согласования (сроки, отлагательные условия).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для квалификации, но цитаты бери из договора.
        3. verdict = "pass" — если согласование получено или явно не требуется.
        4. verdict = "unclear" — если вопрос согласования не урегулирован,
           но стоимость активов может требовать согласования.
        5. verdict = "fail" — если согласование требуется, но не урегулировано.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — согласование получено (pass):
        Фрагмент:
        "Сделка совершается с предварительного согласия ФАС России
        (решение № 5/12345 от 01.02.2024)."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Согласование ФАС получено.",
          "evidence": [
            {"clause_ref": "п. 9.1", "quote": "Сделка совершается с предварительного согласия ФАС России (решение № 5/12345 от 01.02.2024)."}
          ]
        }

        Пример 2 — согласование не урегулировано (unclear):
        Фрагмент:
        "Отчуждается портфель из 500 патентов на общую стоимость
        8 000 000 000 рублей."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Стоимость активов превышает пороговые значения ст. 28 ФЗ-135, но согласование с ФАС не урегулировано.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Отчуждается портфель из 500 патентов на общую стоимость 8 000 000 000 рублей."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа присутствуют в JSON?
        2. Указана ли стоимость активов?
        3. Требуется ли согласование ФАС?
        4. Урегулировано ли согласование?

        [ФОРМАТ ОТВЕТА]
        Верни РОВНО один валидный JSON-объект со всеми 7 ключами (verdict, reason, evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "ФАС антимонопольное согласование согласие ФАС одобрение ФАС ст. 28 ФЗ-135 пороговые значения стоимость активов отлагательные условия"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types: [obligation, general_provision, conditions_precedent]
      excluded_unit_types: [definition, structural_anchor, technical_fragment]
      preferred_clause_functions: [boilerplate, procedures, obligations]
      negative_keywords: ["в целях настоящего", "обременения", "залог", "лицензии", "вознаграждение", "оплата", "регистрация перехода"]
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list", "invoice"]
      preferred_clause_functions: ["boilerplate", "procedures", "obligations"]
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "antitrust_clearance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения об
        антимонопольном согласовании сделки с ФАС России.
        Не анализируй вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. antitrust_clearance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (antitrust_clearance_status, asset_value_status,
              conditions_precedent_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. antitrust_clearance_status — "defined" / "not_applicable" / "not_defined".
        2. antitrust_clearance_details — сведения о согласовании ФАС или об отсутствии необходимости.
        3. asset_value_status — "defined" / "not_defined".
        4. asset_value_details — стоимость отчуждаемых активов.
        5. conditions_precedent_status — "defined" / "not_applicable" / "not_defined".
        6. conditions_precedent_details — отлагательные условия, связанные с согласованием ФАС.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни antitrust_clearance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - antitrust_clearance_status = "not_applicable" только если прямо указано отсутствие необходимости согласования с ФАС.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не упоминает ФАС, антимонопольное согласование или стоимость активов в контексте пороговых значений.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указана крупная стоимость активов, превышающая пороги ст. 28 ФЗ-135, но вопрос согласования с ФАС не урегулирован.
           → presence = "present";
             asset_value_status = "defined";
             antitrust_clearance_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В заверениях указано, что сделка не требует согласования, а в условиях заключения договора стоит отлагательное условие на получение одобрения ФАС.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Прямое указание на статус согласования.
           В договоре прямо указано на получение предварительного согласия ФАС (с реквизитами решения) или прямо заверено, что согласование не требуется.
           → presence = "present";
             antitrust_clearance_status = "defined" (или "not_applicable");
             antitrust_clearance_details фиксирует соответствующий факт.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для antitrust_clearance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "antitrust_clearance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
