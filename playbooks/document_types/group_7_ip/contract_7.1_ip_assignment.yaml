      compact_output: false

      presence_signal:
        field: "in_aliable_ip_objects_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора сведения о типе
        отчуждаемого объекта и наличии признаков неотчуждаемости.
        Не анализируй вознаграждение, обременения или регистрацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. in_aliable_ip_objects_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (object_aliability_status, nmpt_status, firm_name_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. object_aliability_status — "defined" / "not_defined".
        2. object_aliability_details — оценка отчуждаемости объекта.
        3. nmpt_status — "defined" / "not_applicable" / "not_defined".
        4. nmpt_details — сведения о НМПТ (наименование, свидетельство).
        5. firm_name_status — "defined" / "not_applicable" / "not_defined".
        6. firm_name_details — сведения о фирменном наименовании / коммерческом обозначении и наличии предприятия.

        При отсутствии данных:
        - статус = "not_defined" / "not_applicable"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни in_aliable_ip_objects_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Используй только текст договора.
        - Не выводи тип объекта или признаки неотчуждаемости из молчания договора.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор не раскрывает тип отчуждаемого объекта.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано коммерческое обозначение, но не раскрыто наличие предприятия как условия его перехода.
           → presence = "present";
             firm_name_status = "defined";
             firm_name_details фиксирует отсутствие сведений о предприятии.

        3. Противоречие между фрагментами.
           В предмете договора указано товарное обозначение, а в заверениях или приложениях — НМПТ.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Специфика темы: прямое указание на неотчуждаемый объект.
           В договоре прямо указан НМПТ или фирменное наименование как объект отчуждения.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details фиксирует факт указания (даже если это влечёт ничтожность сделки).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для in_aliable_ip_objects_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "in_aliable_ip_objects_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о неотчуждаемых объектах. Внутреннее агрегатное signal-поле."
