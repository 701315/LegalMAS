  inn_pattern: "(?i)ИНН\\s*:?\\s*\\d{10,12}"
  ogrn_pattern: "(?i)ОГРН\\s*:?\\s*\\d{13,15}"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: ip_assignment_subject_extraction
    name: "Базовое извлечение: стороны, объект, модель передачи, вознаграждение"
    description: >
      Извлекает правообладателя, приобретателя, тип объекта ИС, модель передачи
      (полный объём vs частичная), вознаграждение (статус + детали) и момент перехода
      исключительного права. Проверяет наличие базовых существенных условий договора
      об отчуждении исключительного права (ст. 1234 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правообладатель"
        - "приобретатель"
        - "отчуждатель"
        - "исключительное право"
        - "в полном объеме"
        - "в полном объёме"
        - "вознаграждение"
        - "момент перехода"
        - "патент"
        - "товарный знак"
        - "произведение"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "секрет производства"
        - "полезная модель"
        - "промышленный образец"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(правообладатель|приобретатель).*именуем"
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1228, 1232, 1234).
        Проверяется только один вопрос: содержит ли договор базовые
        существенные параметры отчуждения.

        Нормативный ориентир:
        - ст. 1234 ГК РФ — договор об отчуждении исключительного права:
          существенные условия (предмет, вознаграждение или безвозмездность).
        - ст. 1232 ГК РФ — государственная регистрация отчуждения исключительного
          права (для патентов, товарных знаков, селекционных достижений, топологий).
        - ст. 1228 ГК РФ — автор результата интеллектуальной деятельности.
        - ст. 1234 п. 3 ГК РФ — при отсутствии условия о вознаграждении договор
          считается незаключённым (кроме безвозмездного).
        - ст. 1234 п. 4 ГК РФ — момент перехода исключительного права.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, содержит ли текст договора сведения хотя бы по трём из шести
        базовых параметров отчуждения:
        1. Правообладатель (наименование/ФИО, реквизиты).
        2. Приобретатель (наименование/ФИО, реквизиты).
        3. Тип объекта ИС (патент, товарный знак, произведение, ПО и т.д.).
        4. Модель передачи (полный объём / частичная / иная).
        5. Вознаграждение (размер, тип, или признак безвозмездности).
        6. Момент перехода права (заключение / регистрация / оплата / иной).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если найдено ≥ 3 параметра.
        4. verdict = "unclear" — если найдено 1–2 параметра или формулировки
           неоднозначны.
        5. verdict = "fail" — если базовые параметры отсутствуют.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 8 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры присутствуют (pass):
        Фрагмент:
        "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель —
        ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение
        по патенту RU 2700000 в полном объёме. Вознаграждение — 5 000 000 рублей,
        единовременно. Право переходит с момента государственной регистрации."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указаны стороны, объект, полный объём передачи, вознаграждение и момент перехода.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель — ООО «Альфа», ИНН 7700000001, передаёт, а Приобретатель — ООО «Бета», ИНН 7700000002, принимает исключительное право на изобретение по патенту RU 2700000 в полном объёме."}
          ]
        }

        Пример 2 — параметры отсутствуют (fail):
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В тексте нет указаний на стороны, объект ИС, объём передачи, вознаграждение и момент перехода права.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указаны ли правообладатель и приобретатель?
        3. Указан ли объект ИС и объём передачи?
        4. Указано ли вознаграждение (или признак безвозмездности)?
        5. Определён ли момент перехода права?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правообладатель приобретатель отчуждатель отчуждение исключительного права в полном объёме вознаграждение момент перехода патент товарный знак изобретение полезная модель промышленный образец программа для ЭВМ база данных ноу-хау произведение селекционное достижение государственная регистрация"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - title_transfer
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "обратная лицензия"
        - "non-compete"
        - "конфиденциальность"
        - "форс-мажор"
        - "расторжение договора"
        - "разрешение споров"
        - "подсудность"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.30
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "ip_assignment_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по интеллектуальной собственности. Извлеки из договора
        об отчуждении исключительного права базовые параметры: стороны, объект,
        модель передачи, вознаграждение и момент перехода.
        Не анализируй обременения, споры, расторжение или конфиденциальность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_assignment_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rightsholder_details, acquirer_details, ip_object_type,
              transfer_scope, remuneration_status, transfer_moment)
             имеет значение, отличное от "not_defined" или "Данные не определены";
           - "missing" — если все перечисленные содержательные поля = "not_defined"
             или "Данные не определены";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rightsholder_details, acquirer_details, remuneration_details = "Данные не определены";
           - ip_object_type, transfer_scope, remuneration_status, transfer_moment = "not_defined";
           - не выполняй остальные шаги.

        1. rightsholder_details — правообладатель (наименование/ФИО и реквизиты).
        2. acquirer_details — приобретатель (наименование/ФИО и реквизиты).
        3. ip_object_type — тип объекта ИС: "patent" / "utility_model" /
           "industrial_design" / "trademark" / "software" / "database" /
           "work" / "know_how" / "selection_achievement" / "topology" /
           "commercial_designation" / "other" / "not_defined".
        4. transfer_scope — модель передачи: "full_assignment" / "partial" /
           "unclear" / "not_defined".
        5. remuneration_status — статус вознаграждения: "defined" / "gratuitous" /
           "not_defined".
        6. remuneration_details — размер и тип вознаграждения (или указание
           приложения / спецификации / графика платежей).
        7. transfer_moment — момент перехода: "upon_contract_conclusion" /
           "upon_registration" / "upon_payment" / "custom" / "not_defined".

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное/enum-поле = "not_defined"
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_assignment_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Используй только текст договора.
        - transfer_scope = "full_assignment" только при прямом указании «в полном объёме» или «отчуждает исключительное право» без оговорок.
        - remuneration_status = "gratuitous" только при прямом указании «безвозмездно».
        - Если значение определяется через приложение / спецификацию / график платежей — это валидный факт, укажи отсылку.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет указаний на стороны, объект ИС, объём передачи, вознаграждение и момент перехода.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано только "передаем права" или "объект ИС" без конкретики (номера, описания) или без указания вознаграждения.
           → presence = "present";
             соответствующие поля = "not_defined" / "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указан один объект или сторона, а в предмете договора — другие.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             текстовое поле = "Не удалось определить".

        4. Отсылка на внешний документ.
           Объект или вознаграждение определены в Приложении, Спецификации или Реестре.
           → presence = "present";
             соответствующий *_status = "defined";
             текстовое поле содержит формулировку вида "Определяется согласно Приложению № 1".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_assignment_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "gratuitous" или "not_defined".
        - Для enum-полей используй только значения из списка allowed_values.
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_assignment_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие базовых существенных условий отчуждения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rightsholder_details"
          type: "string"
          presentation: "fact"
          label: "Правообладатель"
          description: "Наименование/ФИО и реквизиты правообладателя (отчуждателя)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "acquirer_details"
          type: "string"
          presentation: "fact"
          label: "Приобретатель"
          description: "Наименование/ФИО и реквизиты приобретателя исключительного права."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["patent", "utility_model", "industrial_design", "trademark", "software", "database", "work", "know_how", "selection_achievement", "topology", "commercial_designation", "other", "not_defined"]
          description: "Тип объекта интеллектуальной собственности, исключительное право на который отчуждается."
          required: true

        - name: "transfer_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full_assignment", "partial", "unclear", "not_defined"]
          description: "Модель передачи: полный объём / частичная / неясно."
          required: true

        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "gratuitous", "not_defined"]
          description: "Статус вознаграждения: определено / безвозмездно / не указано (ст. 1234 п. 3 ГК РФ)."
          required: true

        - name: "remuneration_details"
          type: "string"
          presentation: "fact"
          label: "Вознаграждение"
          description: "Размер и тип вознаграждения или отсылка к приложению/графику платежей."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["upon_contract_conclusion", "upon_registration", "upon_payment", "custom", "not_defined"]
          description: "Момент перехода исключительного права к приобретателю (ст. 1234 п. 4 ГК РФ)."
          required: true

      store_payload: true

  - id: ip_object_identification_check
    name: "Идентификация объекта ИС: регистрационные данные, описание, срок"
    description: >
      Проверяет достаточность идентификации объекта ИС в договоре об отчуждении
      исключительного права: тип объекта, регистрационный номер, дата регистрации
      и приоритета, срок действия, краткое описание, орган регистрации.
      Недостаточная идентификация — основание для признания договора незаключённым
      (ст. 1234 п. 1 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "патент"
        - "свидетельство"
        - "регистрационный номер"
        - "дата регистрации"
        - "дата приоритета"
        - "срок действия"
        - "Роспатент"
        - "ФИПС"
        - "программа для ЭВМ"
        - "база данных"
        - "произведение"
        - "ноу-хау"
        - "секрет производства"
        - "полезная модель"
        - "промышленный образец"
        - "товарный знак"
        - "селекционное достижение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(патент|свидетельство)\\s*(№|#|N)?\\s*\\d{5,}"
        - "(?i)регистрационн[ыо]й\\s+номер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1234, 1353, 1354, 1363, 1481, 1491).
        Проверяется только один вопрос: достаточно ли идентифицирован объект ИС
        в тексте договора.

        Нормативный ориентир:
        - ст. 1234 п. 1 ГК РФ — предмет договора об отчуждении (объект должен
          быть идентифицирован так, чтобы исключить смешение с иным объектом).
        - ст. 1354 ГК РФ — патент на изобретение, полезную модель, промышленный
          образец (номер, дата приоритета, срок действия).
        - ст. 1363 ГК РФ — сроки действия патентов (изобретение — 20 лет,
          полезная модель — 10 лет, промышленный образец — 5 лет с продлением).
        - ст. 1481 ГК РФ — свидетельство на товарный знак.
        - ст. 1491 ГК РФ — срок действия исключительного права на товарный знак
          (10 лет с возможностью продления).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, идентифицирован ли объект ИС в тексте договора — так, чтобы
        исключить его смешение с иным объектом того же правообладателя.

        Критерии достаточной идентификации:
        - для регистрируемых объектов (patent, utility_model, industrial_design,
          trademark, software, database, selection_achievement, topology):
          необходим хотя бы один из признаков — регистрационный номер, дата
          регистрации/приоритета, ссылка на приложение с реестром;
        - для нерегистрируемых объектов (work, know_how, commercial_designation,
          firm_name): необходимо описание объекта или отсылка к приложению.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если объект идентифицирован по указанным критериям.
        4. verdict = "unclear" — если идентификация минимальна или формулировка
           неоднозначна (например, только «патент на изобретение» без номера).
        5. verdict = "fail" — если объект не идентифицирован вовсе.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — объект идентифицирован (pass):
        Фрагмент:
        "Исключительное право на изобретение «Способ обработки данных»,
        патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован
        в Роспатенте 01.06.2021, действует до 15.03.2040."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Указан тип объекта, регистрационный номер патента, даты регистрации и приоритета, срок действия и орган регистрации.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Исключительное право на изобретение «Способ обработки данных», патент RU № 2700000, дата приоритета 15.03.2020, зарегистрирован в Роспатенте 01.06.2021, действует до 15.03.2040."}
          ]
        }

        Пример 2 — минимальная идентификация (unclear):
        Фрагмент:
        "Передаётся исключительное право на изобретение."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Указан только тип объекта («изобретение») без регистрационного номера, дат и описания. Идентификация недостаточна для однозначного отнесения к конкретному патенту.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Передаётся исключительное право на изобретение."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указан ли тип объекта ИС?
        3. Есть ли регистрационный номер / дата / отсылка к приложению?
        4. Есть ли описание объекта?
        5. Соответствует ли verdict критериям достаточной идентификации?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "патент свидетельство регистрационный номер дата регистрации дата приоритета срок действия Роспатент ФИПС изобретение полезная модель промышленный образец товарный знак программа для ЭВМ база данных произведение ноу-хау селекционное достижение топология интегральной микросхемы"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - title_transfer
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "обременения"
        - "залог"
        - "лицензии третьим лицам"
        - "разрешение споров"
        - "вознаграждение за отчуждение"
        - "оплата по договору"
        - "расторжение договора"
        - "конфиденциальность"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1700

      compact_output: false

      presence_signal:
        field: "ip_object_identification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права данные об идентификации объекта: тип, регистрационный номер, даты,
        срок действия, описание, орган регистрации.
        Не анализируй вознаграждение, обременения, споры или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_object_identification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_object_type, registration_number_status, registration_date_status,
              priority_date_status, expiry_date_status, object_description_status)
             ≠ "not_defined";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_value = "Данные не определены";
           - registration_authority = "not_defined";
           - не выполняй остальные шаги.

        1. ip_object_type — тип объекта ИС: "patent" / "utility_model" /
           "industrial_design" / "trademark" / "software" / "database" /
           "work" / "know_how" / "selection_achievement" / "topology" /
           "commercial_designation" / "firm_name" / "other" / "not_defined".
        2. registration_number_status — "defined" / "not_defined".
        3. registration_number_value — номер патента/свидетельства (например,
           «RU 2700000», «№ 123456»). Если нет — "Данные не определены".
        4. registration_date_status — "defined" / "not_defined".
        5. registration_date_value — дата регистрации. Если нет — "Данные не определены".
        6. priority_date_status — "defined" / "not_defined".
        7. priority_date_value — дата приоритета. Если нет — "Данные не определены".
        8. expiry_date_status — "defined" / "not_defined".
        9. expiry_date_value — дата окончания срока действия. Если нет —
           "Данные не определены".
        10. object_description_status — "defined" / "not_defined".
        11. object_description_value — краткое описание объекта или отсылка
            к приложению. Если нет — "Данные не определены".
        12. registration_authority — "rospatent" / "other" / "not_required" /
            "not_defined".

        Если данные отсутствуют:
        - статусное поле = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_object_identification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Используй только текст договора.
        - Для нерегистрируемых объектов (work, know_how, commercial_designation, firm_name):
          registration_number_status, registration_date_status, priority_date_status = "not_defined";
          registration_authority = "not_required".
        - Для регистрируемых объектов (patent, utility_model, industrial_design, trademark, software, database, selection_achievement, topology):
          registration_authority = "rospatent" (по умолчанию для РФ), если не указан иной орган.
        - Если значение определяется через приложение / реестр / спецификацию — это валидный факт, укажи отсылку.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания объекта ИС, его типа или описания.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Неполное раскрытие темы.
           Указан только тип объекта (например, "изобретение" или "программа для ЭВМ") без регистрационного номера, дат или описания, исключающего смешение.
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных разделах договора указаны разные регистрационные номера или описания одного и того же объекта.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Идентификация объекта (номер, описание) содержится в Приложении или Реестре, на который есть прямая ссылка в тексте.
           → presence = "present";
             соответствующий *_status = "defined";
             *_value содержит формулировку вида "согласно Приложению № 2".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_object_identification_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для enum-полей используй только значения из списка allowed_values.
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_object_identification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие достаточной идентификации объекта ИС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_object_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["patent", "utility_model", "industrial_design", "trademark", "software", "database", "work", "know_how", "selection_achievement", "topology", "commercial_designation", "firm_name", "other", "not_defined"]
          description: "Тип объекта интеллектуальной собственности."
          required: true

        - name: "registration_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия регистрационного номера объекта ИС."
          required: true

        - name: "registration_number_value"
          type: "string"
          presentation: "fact"
          label: "Регистрационный номер"
          description: "Номер патента/свидетельства (RU 2700000, № 123456 и т.д.)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "registration_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия даты регистрации."
          required: true

        - name: "registration_date_value"
          type: "string"
          presentation: "fact"
          label: "Дата регистрации"
          description: "Дата государственной регистрации объекта ИС."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "priority_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия даты приоритета."
          required: true

        - name: "priority_date_value"
          type: "string"
          presentation: "fact"
          label: "Дата приоритета"
          description: "Дата приоритета объекта ИС (для патентов и товарных знаков)."
          required: false
          display_in_grid: false

        - name: "expiry_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия даты окончания срока действия."
          required: true

        - name: "expiry_date_value"
          type: "string"
          presentation: "fact"
          label: "Срок действия"
          description: "Дата окончания срока действия исключительного права."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "object_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия описания объекта ИС."
          required: true

        - name: "object_description_value"
          type: "string"
          presentation: "fact"
          label: "Описание объекта"
          description: "Краткое описание объекта ИС или отсылка к приложению/реестру."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "registration_authority"
          type: "string"
          presentation: "fact"
          label: "Орган регистрации"
          description: "Орган регистрации: Роспатент/ФИПС / иной / не требуется."
          allowed_values: ["rospatent", "other", "not_required", "not_defined"]
          required: true
          display_in_grid: false

      store_payload: true

  - id: full_transfer_and_registration_check
    name: "Полный объём передачи и регистрация перехода права"
    description: >
      Проверяет явное указание на передачу исключительного права в полном объёме
      (отличие от лицензионных конструкций по ст. 1234 и 1235 ГК РФ), обязанность
      государственной регистрации перехода права в патентном ведомстве (ст. 1232 ГК РФ),
      распределение обязанностей по подаче заявления и расходов на пошлины.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в полном объеме"
        - "в полном объёме"
        - "полностью"
        - "исключительное право передается"
        - "исключительное право переходит"
        - "отчуждает исключительное право"
        - "государственная регистрация"
        - "регистрация перехода права"
        - "Роспатент"
        - "ФИПС"
        - "заявление о регистрации"
        - "расходы на регистрацию"
        - "государственная пошлина"
        - "патентная пошлина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн\\w+\\s+прав\\w+.*в\\s+полном\\s+объем"
        - "(?i)регистраци\\w+\\s+(перехода\\s+)?прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права
        (ГК РФ часть IV, ст. 1232, 1234; ст. 333.30 НК РФ).
        Проверяется только один вопрос: явно ли указан полный объём передачи права
        (отчуждение) и урегулирован ли порядок государственной регистрации перехода права.

        Нормативный ориентир:
        - ст. 1234 п. 1 ГК РФ — по договору об отчуждении исключительного права
          правообладатель передаёт или обязуется передать исключительное право
          в полном объёме. Использование слов «предоставляет право», «разрешает
          использовать» указывает на лицензию (ст. 1235 ГК РФ) и является дефектом
          для договора отчуждения.
        - ст. 1232 п. 2 ГК РФ — в случаях, когда объект ИС подлежит государственной
          регистрации, переход исключительного права по договору также подлежит
          государственной регистрации. Без регистрации переход права считается несостоявшимся.
        - ст. 1234 п. 4 ГК РФ — момент перехода права (при регистрации — в момент регистрации).
        - ст. 333.30 НК РФ — государственные пошлины за регистрацию перехода права.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не подставляй нормы вместо текста.

        [ЗАДАЧА]
        Определи, содержит ли текст договора одновременно:
        1. Явное указание на передачу в полном объёме («отчуждает», «передаёт
           исключительное право в полном объёме»), исключающее лицензионную модель.
        2. Условия о государственной регистрации перехода права (подлежит регистрации,
           кто подаёт заявление, как распределяются расходы/пошлины) — либо
           прямое обоснованное указание, что регистрация не требуется (например,
           для произведений литературы, музыки, ноу-хау).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если указан полный объём передачи И урегулирована
           регистрация (прямо — подлежит или прямо — не требуется).
        4. verdict = "unclear" — если объём указан неявно или регистрация
           упомянута без деталей (без указания подающей стороны или расходов).
        5. verdict = "fail" — если объём передачи не указан или указан как
           ограниченный (лицензионная модель).
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict,
           reason, evidence), пригодный для парсинга через json.loads без
           предварительной обработки. Без markdown, без ```json, без комментариев,
           без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный объём и регистрация урегулированы (pass):
        Фрагмент:
        "Правообладатель отчуждает Приобретателю исключительное право в полном
        объёме. Переход права подлежит государственной регистрации в Роспатенте.
        Заявление подаёт Приобретатель. Расходы на регистрацию несёт Приобретатель."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Полный объём передачи указан явно; регистрация перехода урегулирована с указанием подающей стороны и распределения расходов.",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Правообладатель отчуждает Приобретателю исключительное право в полном объёме. Переход права подлежит государственной регистрации в Роспатенте."}
          ]
        }

        Пример 2 — объём не указан (fail):
        Фрагмент:
        "Правообладатель предоставляет приобретателю право использования патента."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Договор сформулирован по лицензионному типу («предоставляет право использования»), а не как полное отчуждение. Регистрация перехода не упомянута.",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Правообладатель предоставляет приобретателю право использования патента."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Указан ли полный объём передачи явно?
        3. Урегулирована ли регистрация перехода (подлежит / не требуется)?
        4. Указана ли подающая сторона или распределение расходов?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчуждение исключительного права в полном объеме государственная регистрация перехода права Роспатент ФИПС заявление о регистрации расходы на регистрацию государственная пошлина патентная пошлина"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - title_transfer
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "обременения"
        - "залог исключительных прав"
        - "лицензии третьим лицам"
        - "разрешение споров"
        - "досрочное расторжение"
        - "конфиденциальность информации"
        - "форс-мажор"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "full_transfer_and_registration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения о полном объёме передачи и государственной регистрации перехода права.
        Не анализируй вознаграждение, обременения, споры или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. full_transfer_and_registration_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (full_transfer_status, registration_obligation_status,
              registration_applicant_status, registration_costs_status)
             ≠ "not_defined";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. full_transfer_status — "defined" / "not_defined".
        2. full_transfer_details — формулировка о полном объёме передачи исключительного права.
        3. registration_obligation_status — "defined" / "not_defined".
        4. registration_obligation_details — обязанность государственной регистрации перехода права или указание, что она не требуется.
        5. registration_applicant_status — "defined" / "not_defined".
        6. registration_applicant_details — указание стороны, подающей заявление на государственную регистрацию.
        7. registration_costs_status — "defined" / "not_defined".
        8. registration_costs_details — порядок распределения расходов и уплаты пошлин за регистрацию.

        Если данные отсутствуют в тексте договора:
        - статусное/enum-поле = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни full_transfer_and_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - full_transfer_status = "defined" только если прямо указано «в полном объёме», «отчуждает исключительное право» без ограничений. Если указано «предоставляет право» — это лицензия, ставь "not_defined".
        - registration_obligation_status = "defined" как в случае прямого указания на обязательность Роспатента, так и при прямом обоснованном указании, что регистрация не требуется (для произведений, ноу-хау).
        - Если значение определяется через приложение / реестр / спецификацию — это валидный факт, укажи отсылку.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет указаний ни на объём передачи, ни на регистрацию перехода права.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (лицензионная модель).
           Использованы формулировки «предоставляет право использования», «разрешает использовать» без указания на полное отчуждение.
           → presence = "present";
             full_transfer_status = "not_defined";
             full_transfer_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указано «отчуждение в полном объёме», а в разделе о регистрации — условия, характерные для лицензии, или наоборот.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Регистрация не требуется по закону.
           Объект не подлежит регистрации (например, программа для ЭВМ, ноу-хау), и в договоре прямо указано, что переход права не требует государственной регистрации.
           → presence = "present";
             registration_obligation_status = "defined";
             registration_obligation_details содержит прямое указание на отсутствие необходимости регистрации.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для full_transfer_and_registration_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "full_transfer_and_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по полному объёму передачи и регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "full_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на полный объём передачи исключительного права."
          required: true

        - name: "full_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Полный объём передачи"
          description: "Формулировка о передаче исключительного права в полном объёме."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "registration_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания обязанности государственной регистрации перехода исключительного права."
          required: true

        - name: "registration_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация перехода"
          description: "Условия регистрации перехода права или указание, что регистрация не требуется."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "registration_applicant_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания стороны, ответственной за подачу документов в Роспатент."
          required: true

        - name: "registration_applicant_details"
          type: "string"
          presentation: "fact"
          label: "Кто регистрирует"
          description: "Сторона, ответственная за подготовку и подачу заявления о государственной регистрации."
          required: true
          display_in_grid: false

        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка распределения расходов на государственную регистрацию."
          required: true

        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на регистрацию"
          description: "Условия распределения пошлин и расходов на регистрацию перехода исключительного права."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: encumbrances_licenses_check
    name: "Обременения, действующие лицензии и споры (ст. 1235 п. 7 ГК РФ)"
    description: >
      Проверяет раскрытие в договоре об отчуждении исключительного права информации
      о залоге (ст. 358.18, 1232 п. 2 ГК РФ), действующих лицензиях, сохраняющих силу
      при переходе права к приобретателю (ст. 1235 п. 7 ГК РФ), а также притязаниях третьих лиц,
      административных спорах в Роспатенте и судебных разбирательствах.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обременения"
        - "залог"
        - "залог исключительного права"
        - "лицензии"
        - "лицензионные договоры"
        - "действующие лицензии"
        - "права третьих лиц"
        - "притязания третьих лиц"
        - "споры"
        - "судебные разбирательства"
        - "свободен от обременений"
        - "отсутствие лицензий"
        - "не оспаривается"
        - "обратная лицензия"
      keyword_mode: "any"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор об отчуждении исключительного права (ст. 1234 ГК РФ).
        Проверяется только один вопрос: раскрыты ли в договоре обременения
        (залог, действующие лицензии, притязания третьих лиц, споры).

        Нормативный ориентир:
        - ст. 1235 п. 7 ГК РФ — переход исключительного права на результат интеллектуальной
          деятельности или на средство индивидуализации к новому правообладателю не является
          основанием для изменения или расторжения лицензионного договора, заключенного
          предшествующим правообладателем (лицензии «следуют» за объектом).
        - ст. 358.18 ГК РФ — залог исключительных прав.
        - ст. 1232 п. 2 ГК РФ — залог исключительного права в отношении регистрируемых
          объектов подлежит государственной регистрации в Роспатенте.
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (включая чистоту прав и отсутствие притязаний).
        - ст. 460 ГК РФ — обязанность передать имущество свободным от прав третьих лиц.

        [ЗАДАЧА]
        Определи, раскрывает ли договор информацию об обременениях отчуждаемого
        исключительного права. Раскрытие считается достаточным, если в тексте
        договора присутствует хотя бы одно из:
        - прямое указание на отсутствие обременений / залога / лицензий / споров;
        - перечень обременений, сохраняющихся после отчуждения;
        - отсылка к приложению / выписке из реестра, где обременения раскрыты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Нормы применяй для юридической квалификации, но факты и цитаты бери строго из договора.
        3. verdict = "pass" — если обременения раскрыты (отсутствие указано прямо
           либо приведён перечень / отсылка к реестру).
        4. verdict = "unclear" — если есть общая декларативная фраза («право свободно от прав третьих лиц»)
           без детализации по залогам, лицензиям и спорам, либо информация неполная.
        5. verdict = "fail" — если договор об обременениях, залогах и лицензиях полностью молчит.
        6. evidence — не более 3 самых релевантных цитат.
        7. Не используй "None", "null" или пустые строки.
        8. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (verdict, reason, evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обременения раскрыты (pass):
        Фрагмент:
        "Правообладатель гарантирует, что исключительное право не заложено,
        не обременено правами третьих лиц, не оспаривается. Действующие
        лицензионные договоры отсутствуют."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Обременения раскрыты прямо: подтверждено отсутствие залога, прав третьих лиц, судебных споров и действующих лицензий.",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Правообладатель гарантирует, что исключительное право не заложено, не обременено правами третьих лиц, не оспаривается. Действующие лицензионные договоры отсутствуют."}
          ]
        }

        Пример 2 — обременения не раскрыты (fail):
        Фрагмент:
        "Правообладатель обязуется передать исключительное право на изобретение Приобретателю."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Договор не содержит заверений и сведений об обременениях, залогах, действующих лицензиях или спорах в отношении объекта ИС.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 3 ключа (verdict, reason, evidence) присутствуют в JSON?
        2. Раскрыты ли залог / лицензии / притязания третьих лиц / споры?
        3. Указано ли отсутствие обременений прямо или через отсылку?
        4. Есть ли в тексте обратная лицензия правообладателю?
        5. Соответствует ли verdict критериям pass / unclear / fail?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "verdict": "<pass | fail | unclear>",
          "reason": "<краткое обоснование>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обременения залог исключительного права лицензионные договоры действующие лицензии права третьих лиц притязания споры судебные разбирательства свободен от обременений не оспаривается выписка из реестра Роспатент обратная лицензия"
