      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении
        исключительного права сведения о международном элементе и налогах.
        Не анализируй обременения, споры, регистрацию или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        1. foreign_party_status — "defined" / "not_applicable" (обе стороны
           — резиденты РФ) / "not_defined".
        2. foreign_party_details — наименование иностранной стороны, её
           резидентство и роль (правообладатель / приобретатель / обе стороны).
           Если нет — "Данные не определены".
        3. territory_status — "defined" / "not_applicable" / "not_defined".
        4. territory_details — территория действия исключительного права
           (РФ / все страны мира / конкретные страны). Если нет —
           "Данные не определены".
        5. currency_status — "defined" / "not_defined".
        6. currency_details — валюта обязательства и валюта платежа, валютная
           оговорка (ст. 317 ГК РФ). Если нет — "Данные не определены".
        7. vat_status — "defined" / "not_applicable" / "not_defined".
           "not_applicable" — если сделка между резидентами РФ и не требует
           специальной налоговой оговорки.
        8. vat_details — налоговая оговорка по НДС: ставка (без НДС / 20% /
           с НДС), применение льготы пп. 26 п. 2 ст. 149 НК РФ с обоснованием
           применимости к типу объекта ИС, роль налогового агента (ст. 161
           НК РФ) при иностранной стороне. Если нет — "Данные не определены".

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable" (см. правила)
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи применимое право — это в global check governing_law_and_forum.
        - foreign_party_status = "not_applicable" — только если в договоре
          прямо указано, что обе стороны — резиденты РФ.
        - Льгота пп. 26 п. 2 ст. 149 НК РФ применима ТОЛЬКО к отчуждению
          исключительных прав на:
            • программы для ЭВМ,
            • базы данных,
            • топологии интегральных микросхем,
            • изобретения,
            • полезные модели,
            • промышленные образцы,
            • секреты производства (ноу-хау).
          НЕ применима к: товарным знакам, произведениям (кроме ПО),
          коммерческим обозначениям, фирменным наименованиям.
        - Если объект не входит в льготный перечень, а договор ссылается
          на пп. 26 п. 2 ст. 149 НК РФ — отрази это в vat_details как
          некорректное применение.
        - При иностранной стороне-правообладателе НДС удерживается налоговым
          агентом-приобретателем (ст. 161 НК РФ), если льгота не применяется.
        - Верни только JSON.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — cross-border с корректной льготой:
        Фрагмент:
        "Правообладатель — иностранная компания Alpha Inc. (США). Исключительное
        право на программу для ЭВМ действует на территории всех стран мира.
        Расчёты производятся в долларах США. Вознаграждение не облагается НДС
        на основании пп. 26 п. 2 ст. 149 НК РФ."

        Ответ:
        {
          "foreign_party_status": "defined",
          "foreign_party_details": "правообладатель — Alpha Inc. (США, нерезидент)",
          "territory_status": "defined",
          "territory_details": "все страны мира",
          "currency_status": "defined",
          "currency_details": "доллары США (USD)",
          "vat_status": "defined",
          "vat_details": "не облагается НДС на основании пп. 26 п. 2 ст. 149 НК РФ (программа для ЭВМ входит в льготный перечень)",
          "evidence": [
            {"clause_ref": "п. 8.1", "quote": "Вознаграждение не облагается НДС на основании пп. 26 п. 2 ст. 149 НК РФ."}
          ]
        }

        Пример 2 — льгота неприменима (ТЗ):
        Фрагмент:
        "Правообладатель — иностранная компания Beta Ltd. Отчуждается
        исключительное право на товарный знак. Вознаграждение не облагается НДС."

        Ответ:
        {
          "foreign_party_status": "defined",
          "foreign_party_details": "иностранная компания Beta Ltd.",
          "territory_status": "not_defined",
          "territory_details": "Данные не определены",
          "currency_status": "not_defined",
          "currency_details": "Данные не определены",
          "vat_status": "defined",
          "vat_details": "указано освобождение от НДС, но льгота пп. 26 п. 2 ст. 149 НК РФ не применяется к товарным знакам; при иностранной стороне НДС удерживается налоговым агентом (ст. 161 НК РФ)",
          "evidence": [
            {"clause_ref": "п. 1.1–3.2", "quote": "Правообладатель — иностранная компания Beta Ltd. Отчуждается исключительное право на товарный знак. Вознаграждение не облагается НДС."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Передаётся исключительное право."

        Ответ:
        {
          "foreign_party_status": "not_defined",
          "foreign_party_details": "Данные не определены",
          "territory_status": "not_defined",
          "territory_details": "Данные не определены",
          "currency_status": "not_defined",
          "currency_details": "Данные не определены",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 9 ключей (8 полей + evidence) присутствуют в JSON?
        2. Значения enum — строго из allowed_values?
        3. Текстовые поля при отсутствии данных = "Данные не определены"?
        4. Проверена ли применимость льготы пп. 26 п. 2 ст. 149 НК РФ к типу
           объекта ИС?
        5. Отражена ли роль налогового агента при иностранной стороне?

        Не выводи шаги проверки. Верни только JSON.

