      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"

  - id: "entire_agreement_clause"
    name: "Оговорка о полноте договора (entire agreement)"
    description: "Договор заменяет все предыдущие договорённости"
