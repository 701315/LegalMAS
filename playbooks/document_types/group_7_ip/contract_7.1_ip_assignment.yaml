  - id: co_ownership_and_joint_rights_check
    name: "Совместное владение: права соправообладателей и преимущественное право (ст. 1229, 1348 ГК РФ)"
    description: >
      Проверяет, не принадлежит ли исключительное право нескольким
      соправообладателям (долевая или совместная собственность). При
      отчуждении требуется согласие всех соправообладателей или соблюдение
      преимущественного права покупки (ст. 1348 п. 3 ГК РФ). Специфика
      doc-type contract_7.1_ip_assignment.
    triggers: {}
    ui_mode: "field_extraction"
