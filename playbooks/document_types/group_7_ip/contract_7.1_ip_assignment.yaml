        - "передача знаний"
        - "переходный период"
        - "transition"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передач(а|у)\\s+документац"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН/ОГРНИП, адрес, документы уполномоченных лиц.
    addressee: "Обе стороны"

  subject_ip_object_required:
    text: >
      Просим предоставить полную информацию об объекте ИС по {doc_names}:
      тип объекта, регистрационный номер, дата регистрации, срок действия, описание.
    addressee: "Правообладатель"

  ip_object_extraction:
    text: >
      Просим предоставить документы, подтверждающие идентификацию объекта ИС
      по {doc_names}: копию патента/свидетельства, выписку из реестра Роспатента.
    addressee: "Правообладатель"

  full_transfer_scope_required:
    text: >
      Просим подтвердить, что по {doc_names} передаётся исключительное право
      в полном объёме (а не лицензия).
    addressee: "Юридический советник"

  remuneration_required:
    text: >
      Просим уточнить по {doc_names}: размер вознаграждения, порядок оплаты,
      валюту, включение НДС, реквизиты.
    addressee: "Обе стороны"

  transfer_moment_specified:
    text: >
      Просим уточнить момент перехода исключительного права по {doc_names}.
    addressee: "Юридический советник"

  registration_obligation_clause:
    text: >
      Объект по {doc_names} подлежит регистрации. Просим подтвердить план
      регистрации, ответственную сторону, сроки.
    addressee: "Обе стороны / Патентный поверенный"

  registration_costs_allocation:
    text: >
      Просим уточнить, кто несёт расходы на регистрацию по {doc_names}.
    addressee: "Юридический советник"

  rightsholder_warranties:
    text: >
      Просим предоставить по {doc_names}: подтверждение действительности права,
      заверения об отсутствии обременений, перечень лицензий.
    addressee: "Правообладатель"

  patent_validity_check:
    text: >
      Просим предоставить по {doc_names}: выписку из реестра Роспатента,
      подтверждение уплаты пошлин, справку об отсутствии оспаривания.
    addressee: "Правообладатель / Патентный поверенный"

  encumbrances_licenses_check:
    text: >
      Просим раскрыть все обременения по {doc_names}: лицензии, залог, споры.
    addressee: "Правообладатель"

  third_party_claims_indemnity:
    text: >
      Просим включить в {doc_names} indemnity-оговорку для защиты приобретателя
      от претензий третьих лиц.
    addressee: "Юридический советник правообладателя"

  license_disclosure:
    text: >
      Просим предоставить перечень действующих лицензий по {doc_names}.
      Лицензии сохраняют силу при переходе права (ст. 1235 п. 7 ГК РФ).
    addressee: "Правообладатель"

  service_invention_rights_check:
    text: >
      По {doc_names} — служебный РИД. Просим предоставить подтверждение
      урегулирования прав автора-работника и выплаты вознаграждения.
    addressee: "Правообладатель (работодатель)"

  know_how_confidentiality_check:
    text: >
      По {doc_names} (ноу-хау) просим уточнить порядок передачи информации
      и обязанности по сохранению конфиденциальности.
    addressee: "Обе стороны"

  cross_border_ip_check:
    text: >
      По {doc_names} — международный элемент. Просим уточнить территорию,
      применимое право, валюту, налоговые последствия.
    addressee: "Юридический советник / Налоговый консультант"

  reverse_license_check:
    text: >
      Если по {doc_names} правообладателю нужно продолжить использование,
      просим согласовать обратную лицензию.
    addressee: "Обе стороны"

  payment_security:
    text: >
      Просим согласовать по {doc_names} механизм обеспечения оплаты.
    addressee: "Обе стороны"

  retention_until_payment:
    text: >
      Просим подтвердить: переход права по {doc_names} — только после полной оплаты.
    addressee: "Юридический советник"

  liability_for_warranty_breach:
    text: >
      Просим уточнить по {doc_names} последствия нарушения гарантий.
    addressee: "Юридический советник"

  payment_default_consequences:
    text: >
      Просим уточнить по {doc_names} санкции за просрочку/неоплату.
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать по {doc_names} порядок разрешения споров.
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности.
    addressee: "Юридический советник"

  vat_tax_clause:
    text: >
      Просим уточнить по {doc_names} налоговые аспекты (НДС, льгота по пп. 26
      п. 2 ст. 149 НК РФ).
    addressee: "Налоговый консультант"

  governing_law:
    text: >
      Просим указать применимое право по {doc_names}.
    addressee: "Юридический советник"

  gratuitous_between_commercial_prohibited:
    text: >
      ВНИМАНИЕ: по {doc_names} выявлены признаки безвозмездного отчуждения
      между коммерческими организациями (запрещено по п. 3 ст. 1234, ст. 575 ГК РФ).
    addressee: "Юридический советник правообладателя"

  unregistered_transfer_void:
    text: >
      ВНИМАНИЕ: объект по {doc_names} подлежит регистрации. Без регистрации
      переход права не состоится.
    addressee: "Обе стороны / Патентный поверенный"

  trademark_assignment_goodwill_risk:
    text: >
      По {doc_names} — уступка товарного знака. Просим проверить:
      (а) не введёт ли передача потребителей в заблуждение (ст. 1488 п. 2 ГК РФ);
      (б) перечень товаров/услуг (классы МКТУ);
      (в) позицию Роспатента по допустимости передачи.
    addressee: "Патентный поверенный"

  partial_trademark_assignment_confusion:
    text: >
      По {doc_names} — частичная уступка ТЗ. Просим предоставить:
      (а) перечень передаваемых классов МКТУ;
      (б) подтверждение отсутствия вероятности смешения;
      (в) заключение патентного поверенного.
    addressee: "Патентный поверенный"

  currency_control_cross_border_ip:
    text: >
      По {doc_names} — оплата иностранному правообладателю. Просим обеспечить:
      (а) валютный контроль (ФЗ-173); (б) удержание налога у источника;
      (в) сертификат резидентства (для СОИДН).
    addressee: "Финансовый отдел / Налоговый консультант"

  author_moral_rights_inalienable:
    text: >
      По {doc_names} — просим проверить, не содержит ли договор условий
      о передаче неотчуждаемых прав автора (право авторства, право на имя).
      Такие условия НИЧТОЖНЫ (ст. 1265 ГК РФ).
    addressee: "Юридический советник"

  author_moral_rights_preserved:
    text: >
      По {doc_names} — просим включить явное подтверждение сохранения
      за автором личных неимущественных прав (авторство, имя, неприкосновенность).
    addressee: "Юридический советник"

  ip_due_diligence_completeness:
    text: >
      По {doc_names} — просим предоставить полную историю переходов права:
      (а) первоначальный правообладатель; (б) основание приобретения;
      (в) все промежуточные передачи с документами; (г) отсутствие разрывов.
    addressee: "Правообладатель / Патентный поверенный"

  non_compete_seller:
    text: >
      Рекомендуем включить в {doc_names} оговорку о неконкуренции продавца:
      запрет создания/использования аналогичных объектов ИС на определённой
      территории и в течение определённого срока.
    addressee: "Юридический советник приобретателя"

  escrow_registration_mechanism:
    text: >
      По {doc_names} — просим согласовать escrow/аккредитив механизм
      для синхронизации оплаты и регистрации перехода права:
      (а) банк/агент; (б) условия раскрытия; (в) порядок при отказе в регистрации.
    addressee: "Обе стороны / Банк"

  representations_and_warranties_scope:
    text: >
      По {doc_names} — просим расширить заверения правообладателя:
      (а) принадлежность права; (б) действительность; (в) отсутствие обременений;
      (г) отсутствие споров; (д) ненарушение прав третьих лиц;
      (е) полномочия на отчуждение; (ж) отсутствие предыдущих передач.
    addressee: "Юридический советник правообладателя"

  tax_exemption_nds_check:
    text: >
      По {doc_names} — просим уточнить применимость льготы по НДС
      (пп. 26 п. 2 ст. 149 НК РФ) и правильно оформить документацию
      для подтверждения освобождения.
    addressee: "Налоговый консультант"

  force_majeure_ip:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре.
    addressee: "Юридический советник"

  entire_agreement_clause:
    text: >
      Рекомендуем включить в {doc_names} оговорку о полноте договора
      (entire agreement).
    addressee: "Юридический советник"

  successor_obligations:
    text: >
      Просим уточнить для {doc_names} обязательность для правопреемников.
    addressee: "Юридический советник"

  transition_support:
    text: >
      По {doc_names} — просим согласовать обязательства продавца по передаче
      документации, знаний, обучению персонала приобретателя.
    addressee: "Правообладатель"

  assignment_prohibition:
    text: >
      Просим уточнить для {doc_names} ограничения на уступку прав по договору.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"