        - Перед остальными полями заполни author_moral_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Не выводи сохранение прав из молчания договора — статус "not_defined".
        - "not_applicable" — если объект по природе не имеет автора-физлица (товарные знаки, коммерческие обозначения, фирменные наименования).
        - Если в договоре есть формулировка об отчуждении / отказе / ограничении личных неимущественных прав автора — отрази её в соответствующем *_details, даже если формулировка ничтожна по п. 2 ст. 1228 ГК РФ.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор вообще не упоминает личные неимущественные права автора (норма по закону, но тема не раскрыта в явном виде).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Упомянуто только право авторства, но ничего не сказано о праве на имя или неприкосновенности.
           → presence = "present";
             authorship_right_status = "defined";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном разделе указано, что автор сохраняет все права, а в другом — что автор отказывается от права на имя.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Ничтожное условие (отказ от прав).
           Договор содержит условие об отчуждении, отказе или ограничении личных неимущественных прав (ничтожно по п. 2 ст. 1228 ГК РФ).
           → presence = "present";
             соответствующий *_status = "defined";
             *_details прямо фиксирует ничтожное условие (например, "автор отказывается от права авторства").
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для author_moral_rights_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "author_moral_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие явного упоминания моральных прав автора в тексте. Внутреннее агрегатное signal-поле."
