    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ноу-хау"
        - "секрет производства"
        - "коммерческая тайна"
        - "режим конфиденциальности"
        - "режим секретности"
        - "неразглашение"
        - "передача информации"
        - "носители информации"
