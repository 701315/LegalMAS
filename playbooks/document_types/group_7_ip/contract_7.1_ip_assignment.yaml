  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Заверения и гарантии
  # ──────────────────────────────────────────────────────────────────────────
  - id: representations_warranties_indemnity_check
    name: "Заверения, гарантии и индемнити"
    description: >
      Проверяет полноту заверений правообладателя и наличие индемнити-оговорки
      для защиты приобретателя от претензий третьих лиц.
