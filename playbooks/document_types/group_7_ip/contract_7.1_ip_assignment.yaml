        2. Найди прямую цитату об обязанностях продавца.
        3. Найди прямую цитату о способе передачи.
        4. Найди прямую цитату об ограничениях доступа.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "confidentiality_regime_status": "<defined / not_defined>",
          "confidentiality_regime_details": "<текст или 'Данные не определены'>",
          "seller_obligations_status": "<defined / not_defined>",
          "seller_obligations_details": "<текст или 'Данные не определены'>",
          "transfer_method_status": "<defined / not_defined>",
