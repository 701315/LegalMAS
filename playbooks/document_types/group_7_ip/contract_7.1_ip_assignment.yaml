        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора об отчуждении исключительного
        права сведения об обременениях: залог, действующие лицензии, притязания
        третьих лиц и споры.
        Не анализируй вознаграждение, регистрацию перехода или расторжение договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. encumbrances_licenses_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (encumbrances_status, pledge_status, licenses_status, disputes_status)
             имеет значение "defined" или "not_applicable";
           - "missing" — если все перечисленные содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. encumbrances_status — "defined" / "not_defined".
        2. encumbrances_details — раскрытие обременений в целом (перечень или указание на их отсутствие).
        3. pledge_status — "defined" / "not_applicable" / "not_defined".
        4. pledge_details — сведения о залоге исключительного права (наличие, отсутствие, залогодержатель, регистрация в Роспатенте).
        5. licenses_status — "defined" / "not_applicable" / "not_defined".
        6. licenses_details — сведения о действующих лицензиях третьих лиц или обратных лицензиях правообладателю (ст. 1235 п. 7 ГК РФ).
        7. disputes_status — "defined" / "not_applicable" / "not_defined".
        8. disputes_details — сведения о притязаниях третьих лиц, административных спорах в Палате по патентным спорам Роспатента или судах (СИП).

        Если данных нет:
        - статусное поле = "not_defined" или "not_applicable" (см. правила)
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни encumbrances_licenses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" или "Данные не определены".
        - Статус "defined" — если договор прямо раскрывает соответствующий аспект (наличие ИЛИ прямое отсутствие).
        - Статус "not_applicable" — если по природе объекта обременение невозможно (например, лицензии для только что созданного произведения, ещё не введённого в оборот).
        - Статус "not_defined" — если договор об этом аспекте молчит, но аспект в принципе применим.
        - Если договор предусматривает сохранение лицензий третьих лиц или предоставление обратной лицензии Правообладателю (grant-back) — отрази это в licenses_details.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "not_defined" для статуса и "Не удалось определить" для текстового поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор полностью молчит об обременениях, залогах, лицензиях и спорах.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы (общая декларация).
           Есть общая фраза «право свободно от прав третьих лиц» без детализации по залогам, лицензиям и спорам.
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_details = "Данные не определены" или "Не удалось определить".

        3. Противоречие между фрагментами.
           В одном разделе указано отсутствие лицензий, а в приложении или другом разделе перечислены действующие лицензии.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Раскрытие через отсылку к приложению/реестру.
           Сведения об обременениях, залогах или лицензиях прямо отсылают к Приложению или выписке из реестра.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "сведения приведены в Приложении № 3".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для encumbrances_licenses_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_applicable" или "not_defined".
        - Fallback при отсутствии данных: текстовые поля = "Данные не определены", статусные = "not_defined".
        - Fallback при противоречии или неоднозначности: текстовые поля = "Не удалось определить", статусные = "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "encumbrances_licenses_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
