              "quote": "Предмет дарения свободен от залогов, обременений и арестов."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель передаёт предмет дарения Одаряемому."

        Ответ:
        {
          "encumbrances_warranty_status": "not_defined",
