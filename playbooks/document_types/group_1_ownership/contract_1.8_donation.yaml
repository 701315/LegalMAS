#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  passport_pattern: "(?i)\\b\\d{2}\\s?\\d{2}\\s?\\d{6}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_authority_and_capacity
    name: "Стороны договора дарения: идентификация, полномочия, дееспособность, корпоративное одобрение"
    description: >
      Фактографическая проверка наличия в договоре данных о дарителе и одаряемом,
      полномочий подписантов, корпоративного одобрения для юридических лиц,
      дееспособности сторон, участия органов опеки при несовершеннолетних.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "даритель"
        - "одаряемый"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
        - "дата рождения"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "право хозяйственного ведения"
        - "согласие собственника"
        - "малолетний"
        - "несовершеннолетний"
        - "недееспособный"
        - "орган опеки"
        - "законный представитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(даритель|одаряемый).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а).*собрани"
        - "(?i)орган\\s+опек"
        - "(?i)несовершеннолетн"
        - "(?i)недееспособн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572-582;
        ст. 432, 182-185 ГК РФ; ст. 28, 29, 37 ГК РФ; ст. 575, 576 ГК РФ;
        ФЗ-14 ст. 45-46; ФЗ-208 ст. 78-84).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов,
        дееспособность сторон, корпоративное одобрение.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Дарителя (ИНН, ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Дарителя (юридическое лицо / ИП / физическое лицо).
        3. Кто подписывает от Дарителя и на каком основании.
        4. Наименование и реквизиты Одаряемого.
        5. Тип Одаряемого.
        6. Кто подписывает от Одаряемого и на каком основании.
        7. Корпоративное одобрение или заверение о его ненужности.
        8. Признаки несовершеннолетних или недееспособных участников.
        9. Согласие органа опеки (при наличии признаков).
        10. Согласие собственника при праве хозяйственного ведения/оперативного управления.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_defined", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель — ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена решением единственного участника от 01.03.2026.
        Одаряемый — гражданин Петров Б.Б., паспорт серия 45 00 № 123456."

        Ответ:
        {
          "donor_details_status": "defined",
          "donor_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "donor_type": "legal_entity",
          "donor_signatory": "Генеральный директор Иванов А.А.",
          "donor_signatory_basis": "charter",
          "donee_details_status": "defined",
          "donee_details_value": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "donee_type": "individual",
          "donee_signatory": "Петров Б.Б.",
          "donee_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "решение единственного участника от 01.03.2026",
          "capacity_issues_status": "not_defined",
          "guardianship_consent_status": "not_defined",
          "owner_consent_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Даритель — ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001, в лице Генерального директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между дарителем и одаряемым."

        Ответ:
        {
          "donor_details_status": "not_defined",
          "donor_details_value": "Данные не определены",
          "donor_type": "not_defined",
          "donor_signatory": "Данные не определены",
          "donor_signatory_basis": "not_defined",
          "donee_details_status": "not_defined",
          "donee_details_value": "Данные не определены",
          "donee_type": "not_defined",
          "donee_signatory": "Данные не определены",
          "donee_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "capacity_issues_status": "not_defined",
          "guardianship_consent_status": "not_defined",
          "owner_consent_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с ИНН/ОГРН Дарителя?
        2. Есть ли прямая цитата с ИНН/ОГРН или паспортом Одаряемого?
        3. Указан ли подписант и документ-основание?
        4. Упомянуто ли корпоративное одобрение?
        5. Есть ли признаки несовершеннолетних или недееспособных?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "donor_details_status": "<defined / not_defined>",
          "donor_details_value": "<реквизиты или 'Данные не определены'>",
          "donor_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "donor_signatory": "<ФИО или 'Данные не определены'>",
          "donor_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "donee_details_status": "<defined / not_defined>",
          "donee_details_value": "<реквизиты или 'Данные не определены'>",
          "donee_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "donee_signatory": "<ФИО или 'Данные не определены'>",
          "donee_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "capacity_issues_status": "<defined / not_defined>",
          "guardianship_consent_status": "<defined / not_defined>",
          "owner_consent_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 620
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "даритель одаряемый именуем в лице действующего на основании ИНН ОГРН ОГРНИП паспорт дата рождения крупная сделка сделка с заинтересованностью одобрение общего собрания одобрение совета директоров решение единственного участника право хозяйственного ведения согласие собственника малолетний несовершеннолетний недееспособный орган опеки законный представитель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "безвозмездно"
        - "в дар"
        - "предмет дарения"
        - "встречное предоставление"
        - "обещание дарения"
        - "отмена дарения"
        - "обременения"
        - "залог"
        - "арест"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1550

      compact_output: false

      presence_signal:
        field: "parties_authority_and_capacity_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения
        данные о сторонах: реквизиты, тип, подписанты, основания полномочий,
        корпоративное одобрение, дееспособность и согласие органа опеки.
        Не анализируй предмет дарения, налоги, обременения или отмену дарения.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_authority_and_capacity_presence:
           Агрегатное signal-поле — наличие регулирования по теме сторон.
           - "present" — если хотя бы одно из содержательных полей
             (donor_details_status, donee_details_status,
              donor_signatory_basis, donee_signatory_basis)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - donor_details_status = donee_details_status = "not_defined";
           - donor_signatory_basis = donee_signatory_basis = "not_defined";
           - donor_type = donee_type = "not_defined";
           - donor_details_value, donee_details_value = "Данные не определены";
           - donor_signatory, donee_signatory = "Данные не определены";
           - corporate_approval_status = capacity_issues_status =
             guardianship_consent_status = owner_consent_status = "not_defined";
           - corporate_approval_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. donor_details_status:
           - "defined" — если Даритель прямо идентифицируется по тексту хотя бы по наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если Даритель прямо не идентифицируется.

        2. donor_details_value:
           Краткая идентификация Дарителя на русском языке:
           - для юрлица: наименование + ИНН + ОГРН, если прямо указаны;
           - для ИП: ИП + ФИО + ИНН + ОГРНИП, если прямо указаны;
           - для физлица: ФИО + паспортные данные, если прямо указаны.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. donor_type:
           - "legal_entity" — юридическое лицо;
           - "individual_entrepreneur" — ИП;
           - "individual" — физическое лицо;
           - "not_defined" — тип не указан или не определён.

        4. donor_signatory:
           ФИО и должность лица, подписывающего от Дарителя.
           Если Даритель-физлицо подписывает лично — укажи его ФИО.
           Если данных нет — "Данные не определены".

        5. donor_signatory_basis:
           - "charter" — на основании устава;
           - "poa" — по доверенности;
           - "order" — на основании приказа;
           - "personal" — физлицо подписывает лично за себя;
           - "other" — иное основание;
           - "not_defined" — не указано.

        6. donee_details_status:
           - "defined" — если Одаряемый прямо идентифицируется;
           - "not_defined" — если не идентифицируется.

        7. donee_details_value:
           Краткая идентификация Одаряемого по тем же правилам, что и для Дарителя.

        8. donee_type:
           - "legal_entity" / "individual_entrepreneur" / "individual" / "not_defined".

        9. donee_signatory:
           ФИО подписанта от Одаряемого. Если данных нет — "Данные не определены".

        10. donee_signatory_basis:
            По тем же правилам, что и donor_signatory_basis.

        11. corporate_approval_status:
            - "defined" — если корпоративное одобрение прямо упомянуто (решение собрания, совета директоров, единственного участника) или прямо указано, что одобрение не требуется;
            - "not_defined" — если корпоративное одобрение не упомянуто.

        12. corporate_approval_details:
            Текст корпоративного одобрения или указание «Одобрение не требуется».
            Если данных нет — "Данные не определены".

        13. capacity_issues_status:
            - "defined" — если в тексте есть прямые признаки несовершеннолетия, малолетия или недееспособности участника;
            - "not_defined" — если таких признаков нет.

        14. guardianship_consent_status:
            - "defined" — если согласие органа опеки прямо упомянуто;
            - "not_defined" — если не упомянуто.

        15. owner_consent_status:
            - "defined" — если согласие собственника при праве хозяйственного ведения или оперативного управления прямо указано;
            - "not_defined" — если не указано.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_authority_and_capacity_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_details = "Данные не определены", все *_type = "not_defined".
        - Используй только текст договора.
        - Не делай предположений о дееспособности.
        - charter = действует на основании устава.
        - poa = действует на основании доверенности.
        - order = действует на основании приказа.
        - personal = физлицо, подписывающее лично за себя.
        - owner_consent_status = defined только если согласие собственника при праве хозяйственного ведения или оперативного управления прямо указано.
        - Не смешивай сведения о Дарителе и Одаряемом.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а в status используй "not_defined".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их реквизитов, ни подписантов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_type = "not_defined";
             все *_value/*_details = "Данные не определены".

        2. Частичная идентификация.
           Указан только Даритель или только Одаряемый, вторая сторона не идентифицирована.
           → presence = "present";
             определённая сторона: *_status = "defined";
             неопределённая сторона: *_status = "not_defined", *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные реквизиты или подписанты для одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Специфика дарения: малолетний/недееспособный даритель.
           В тексте прямо указано, что Даритель — малолетний или недееспособный (ст. 575 ГК РФ).
           → presence = "present";
             capacity_issues_status = "defined";
             guardianship_consent_status = "defined" (если согласие упомянуто) или "not_defined";
             donor_details_status = "defined" (если реквизиты есть).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_authority_and_capacity_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для *_type используй только: "legal_entity", "individual_entrepreneur", "individual", "not_defined".
        - Для *_signatory_basis используй только: "charter", "poa", "order", "personal", "other", "not_defined".
        - Fallback при отсутствии данных:
          * donor_details_value, donee_details_value → "Данные не определены";
          * donor_signatory, donee_signatory → "Данные не определены";
          * corporate_approval_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_authority_and_capacity_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие данных о сторонах дарения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "donor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения реквизитов Дарителя."
          required: true

        - name: "donor_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Даритель: реквизиты"
          description: >
            Наименование и реквизиты Дарителя: ИНН/ОГРН для ЮЛ, паспорт для физлица.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "donor_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          display_in_grid: false
          description: "Тип Дарителя."
          required: true

        - name: "donor_signatory"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Даритель: подписант"
          description: >
            Подписант от Дарителя: ФИО и должность.
            Fallback: "Данные не определены".
          required: false

        - name: "donor_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          display_in_grid: false
          description: "Основание полномочий подписанта Дарителя."
          required: true

        - name: "donee_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения реквизитов Одаряемого."
          required: true

        - name: "donee_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Одаряемый: реквизиты"
          description: >
            Наименование и реквизиты Одаряемого.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "donee_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          display_in_grid: false
          description: "Тип Одаряемого."
          required: true

        - name: "donee_signatory"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Одаряемый: подписант"
          description: >
            Подписант от Одаряемого: ФИО и должность.
            Fallback: "Данные не определены".
          required: false

        - name: "donee_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          display_in_grid: false
          description: "Основание полномочий подписанта Одаряемого."
          required: true

        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия корпоративного одобрения."
          required: true

        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Корпоративное одобрение"
          description: >
            Корпоративное одобрение сделки или указание, что оно не требуется.
            Fallback: "Данные не определены".
          required: false

        - name: "capacity_issues_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
