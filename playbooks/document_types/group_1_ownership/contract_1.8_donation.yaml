      regex_patterns:
        - "(?i)(перечень|список)\\s+лиц"
        - "(?i)зарегистрированн(ые|ых)\\s+лиц"

  - id: "minor_guardianship_risk"
    name: "Несовершеннолетние / недееспособные: проверка законности участия"
    description: "Проверяет наличие признаков ограниченной дееспособности и связанных согласований"
