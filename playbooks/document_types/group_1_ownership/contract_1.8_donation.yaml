      store_payload: true

  - id: transfer_procedure_and_ownership
    name: "Порядок передачи дара, акт приёма-передачи, момент перехода права (ст. 224, 574 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий о порядке и моменте передачи дара,
      акта приёма-передачи и момента перехода права собственности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "передача дара"
        - "передаточный акт"
        - "акт приёма-передачи"
        - "с момента передачи"
        - "вручение"
        - "передаётся"
        - "право собственности переходит"
        - "момент перехода права"
        - "с момента подписания"
        - "с момента регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)с\\s+момента\\s+передач"
        - "(?i)право\\s+собственности.*переходит"
        - "{{ date_pattern }}"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ; ст. 224, 574 ГК РФ).
        Проверяется только один вопрос: порядок и момент передачи дара,
        акт приёма-передачи, момент перехода права.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок и момент передачи дара (дата, место).
        2. Наличие акта приёма-передачи (предусмотрен / нет).
        3. Момент перехода права собственности.
        4. Место передачи.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель передаёт автомобиль Одаряемому 15.04.2026 по адресу: г. Москва,
        ул. Ленина, д. 1. Передача оформляется подписанием акта приёма-передачи.
        Право собственности переходит к Одаряемому с момента подписания настоящего
        договора."

        Ответ:
        {
          "transfer_procedure_status": "defined",
          "transfer_date_status": "defined",
          "transfer_date_details": "15.04.2026",
          "transfer_act_status": "defined",
          "transfer_location_status": "defined",
          "transfer_location_details": "г. Москва, ул. Ленина, д. 1",
          "ownership_transfer_status": "defined",
          "ownership_transfer_moment": "upon_signing",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Даритель передаёт автомобиль Одаряемому 15.04.2026 по адресу: г. Москва, ул. Ленина, д. 1."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель безвозмездно передаёт имущество одаряемому."

        Ответ:
        {
          "transfer_procedure_status": "not_defined",
          "transfer_date_status": "not_defined",
          "transfer_date_details": "Данные не определены",
          "transfer_act_status": "not_defined",
          "transfer_location_status": "not_defined",
          "transfer_location_details": "Данные не определены",
          "ownership_transfer_status": "not_defined",
          "ownership_transfer_moment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли дата или срок передачи?
        2. Упомянут ли акт приёма-передачи?
        3. Указан ли момент перехода права?
        4. Для недвижимости — это регистрация; для движимого — вручение.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_procedure_status": "<defined / not_defined>",
          "transfer_date_status": "<defined / not_defined>",
          "transfer_date_details": "<дата/срок или 'Данные не определены'>",
          "transfer_act_status": "<defined / not_defined>",
          "transfer_location_status": "<defined / not_defined>",
          "transfer_location_details": "<место или 'Данные не определены'>",
          "ownership_transfer_status": "<defined / not_defined>",
          "ownership_transfer_moment": "<upon_handover / upon_registration / upon_signing / custom / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача дара передаточный акт акт приёма-передачи с момента передачи вручение передаётся право собственности переходит момент перехода права с момента подписания с момента регистрации место передачи дата передачи"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "государственная регистрация перехода права на недвижимость"
        - "госпошлина"
        - "зарегистрированные лица"
        - "обременения"
        - "отмена дарения"
        - "встречное предоставление"
        - "НДФЛ"
        - "пожертвование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "transfer_procedure_and_ownership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения условия
        о порядке и моменте передачи дара: дата, место, акт приёма-передачи,
        момент перехода права собственности.
        Не анализируй стороны, предмет дарения, обременения или отмену дарения.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. transfer_procedure_and_ownership_presence:
           Агрегатное signal-поле — наличие регулирования по теме передачи дара.
           - "present" — если хотя бы одно из содержательных полей
             (transfer_procedure_status, transfer_act_status,
              ownership_transfer_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - transfer_procedure_status = "not_defined";
           - transfer_act_status = "not_defined";
           - ownership_transfer_status = "not_defined";
           - transfer_date_status = transfer_location_status = "not_defined";
           - ownership_transfer_moment = "not_defined";
           - transfer_date_details, transfer_location_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. transfer_procedure_status:
           - "defined" — если порядок передачи дара прямо описан
             (указан способ, последовательность действий, условия передачи);
           - "not_defined" — если порядок передачи не описан.

        2. transfer_date_status:
           - "defined" — если дата или срок передачи прямо указаны
             (конкретная дата, "в течение N дней", "не позднее ...");
           - "not_defined" — если дата/срок не указаны.

        3. transfer_date_details:
           Краткое user-facing описание даты или срока передачи на русском языке.
           Примеры: "15.04.2026", "в течение 10 дней с момента подписания",
           "не позднее 01.06.2026".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. transfer_act_status:
           - "defined" — если акт приёма-передачи прямо предусмотрен
             ("передача оформляется актом", "подписание передаточного акта");
           - "not_defined" — если акт не упомянут.

        5. transfer_location_status:
           - "defined" — если место передачи прямо указано;
           - "not_defined" — если место не указано.

        6. transfer_location_details:
           Краткое user-facing описание места передачи на русском языке.
           Примеры: "г. Москва, ул. Ленина, д. 1", "по месту нахождения Дарителя".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. ownership_transfer_status:
           - "defined" — если момент перехода права собственности прямо указан;
           - "not_defined" — если момент перехода не указан.

        8. ownership_transfer_moment:
           - "upon_handover" — право переходит с момента вручения / фактической передачи;
           - "upon_registration" — право переходит с момента государственной регистрации (недвижимость);
           - "upon_signing" — право переходит с момента подписания договора;
           - "custom" — иной момент, прямо указанный в договоре;
           - "not_defined" — момент не указан.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни transfer_procedure_and_ownership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", ownership_transfer_moment = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - Для недвижимости момент перехода = регистрация (upon_registration), но только если это прямо написано в договоре.
        - Для движимого имущества = вручение (upon_handover), но только если это прямо написано в договоре.
        - Не выводи момент перехода из закона, если в договоре он не указан.
        - Если в разных фрагментах указаны разные моменты перехода и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка передачи, ни акта, ни момента перехода права.
           → presence = "missing";
             все *_status = "not_defined";
             ownership_transfer_moment = "not_defined";
             все *_details = "Данные не определены".

        2. Частичное регулирование: есть порядок, но нет момента перехода.
           "Передача дара оформляется актом приёма-передачи" без указания
           момента перехода права собственности.
           → presence = "present";
             transfer_procedure_status = "defined";
             transfer_act_status = "defined";
             ownership_transfer_status = "not_defined";
             ownership_transfer_moment = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "право переходит с момента подписания",
           в другом — "с момента государственной регистрации".
           → presence = "unclear";
             ownership_transfer_status = "not_defined";
             ownership_transfer_moment = "not_defined".

        4. Специфика: недвижимость с регистрацией в ЕГРН.
           "Право собственности на квартиру переходит к Одаряемому
           с момента государственной регистрации в ЕГРН."
           → presence = "present";
             ownership_transfer_status = "defined";
             ownership_transfer_moment = "upon_registration".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transfer_procedure_and_ownership_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для ownership_transfer_moment используй только: "upon_handover", "upon_registration", "upon_signing", "custom", "not_defined".
        - Fallback при отсутствии данных:
          * transfer_date_details, transfer_location_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * transfer_date_details, transfer_location_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transfer_procedure_and_ownership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме передачи дара и перехода права. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transfer_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка передачи дара."
          required: true

        - name: "transfer_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения даты или срока передачи дара."
          required: true

        - name: "transfer_date_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дата/срок передачи дара"
          description: >
            Конкретная дата или срок передачи предмета дарения.
            Примеры: "15.04.2026", "в течение 10 дней с момента подписания".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об акте приёма-передачи дара."
          required: true

        - name: "transfer_location_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения места передачи дара."
          required: true

        - name: "transfer_location_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Место передачи дара"
          description: >
            Адрес или описание места передачи предмета дарения.
            Примеры: "г. Москва, ул. Ленина, д. 1", "по месту нахождения Дарителя".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "ownership_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента перехода права собственности."
          required: true

        - name: "ownership_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["upon_handover", "upon_registration", "upon_signing", "custom", "not_defined"]
          display_in_grid: true
          display_priority: 3
          label: "Момент перехода права"
          description: "Момент перехода права собственности на предмет дарения."
          required: true

      store_payload: true

  - id: donation_revocation_and_refusal_check
    name: "Отмена дарения, отказ от исполнения обещания, права сторон (ст. 573, 577-579 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об отмене дарения, отказе дарителя
      от исполнения обещания, ограничениях на отмену, возврате дара в натуре
      и правах одаряемого на отказ от дара (ст. 573, 577-579 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отмена дарения"
        - "отказ от исполнения"
        - "даритель вправе отменить"
        - "даритель вправе отказаться"
        - "ст. 578"
        - "ст. 577"
        - "ст. 579"
        - "покушение на жизнь"
        - "угроза безвозвратной утраты"
        - "имущественное положение дарителя"
        - "смерть одаряемого"
        - "возврат дара"
        - "возврат в натуре"
        - "отказ от принятия дара"
        - "одаряемый вправе отказаться"
        - "ограничения отмены"
        - "отмена не допускается"
        - "снижение уровня жизни"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен(а|ить)\\s+дарени"
        - "(?i)отказ\\s+от\\s+исполнен"
        - "(?i)даритель\\s+вправе"
        - "(?i)смерть\\s+одаряемого"
        - "(?i)одаряем[ыо]й\\s+вправе\\s+отказ"
        - "(?i)возврат\\s+в\\s+натур"
        - "(?i)отмен[ае]\\s+не\\s+допускает"
        - "(?i)снижени[ея]\\s+уровн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 573, 577-579 ГК РФ).
        Проверяется наличие условий об отмене дарения, отказе от исполнения
        обещания, ограничениях на отмену и правах сторон при прекращении.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия об отмене дарения (ст. 578 ГК РФ).
        2. Условия об отказе дарителя от исполнения обещания (ст. 577 ГК РФ).
        3. Условие о возврате дара при смерти одаряемого ранее дарителя.
        4. Права одаряемого отказаться от принятия дара (ст. 573 ГК РФ).
        5. Ограничения на отмену дарения (ст. 579 ГК РФ).
        6. Условие о возврате дара в натуре при отмене (ст. 578 п. 5 ГК РФ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель вправе отменить дарение в случае покушения Одаряемого на его жизнь.
        Даритель вправе отказаться от исполнения обещания, если его имущественное
        положение существенно ухудшилось. В случае смерти Одаряемого ранее Дарителя
        подаренная вещь возвращается Дарителю. При отмене дарения Одаряемый обязан
        возвратить дар в натуре. Одаряемый вправе отказаться от принятия дара до
        его передачи. Отмена дарения не допускается, если дарение совершено
        в общеполезных целях."

        Ответ:
        {
          "revocation_clause_status": "defined",
          "revocation_grounds_status": "defined",
          "revocation_grounds_lawful": "yes",
          "donor_refusal_promise_status": "defined",
          "donee_death_reversion_status": "defined",
          "donee_refusal_right_status": "defined",
          "revocation_restrictions_status": "defined",
          "return_in_kind_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Даритель вправе отменить дарение в случае покушения Одаряемого на его жизнь."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель вправе отменить дарение по своему усмотрению в любое время."

        Ответ:
        {
          "revocation_clause_status": "defined",
          "revocation_grounds_status": "defined",
          "revocation_grounds_lawful": "no",
          "donor_refusal_promise_status": "not_defined",
          "donee_death_reversion_status": "not_defined",
          "donee_refusal_right_status": "not_defined",
          "revocation_restrictions_status": "not_defined",
          "return_in_kind_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Даритель вправе отменить дарение по своему усмотрению в любое время."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об отмене дарения?
        2. Соответствуют ли основания ст. 577-578 ГК (не произвольные)?
        3. Есть ли условие о возврате при смерти одаряемого?
        4. Есть ли право одаряемого отказаться от дара?
        5. Упомянуты ли ограничения на отмену или возврат в натуре?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "revocation_clause_status": "<defined / not_defined>",
          "revocation_grounds_status": "<defined / not_defined>",
          "revocation_grounds_lawful": "<yes / no / unclear / not_defined>",
          "donor_refusal_promise_status": "<defined / not_defined>",
          "donee_death_reversion_status": "<defined / not_defined>",
          "donee_refusal_right_status": "<defined / not_defined>",
          "revocation_restrictions_status": "<defined / not_defined>",
          "return_in_kind_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отмена дарения отказ от исполнения даритель вправе отменить даритель вправе отказаться ст. 578 ГК РФ ст. 577 ГК РФ ст. 579 ГК РФ покушение на жизнь угроза безвозвратной утраты имущественное положение дарителя снижение уровня жизни смерть одаряемого возврат дара возврат в натуре отказ от принятия дара одаряемый вправе отказаться ограничения отмены отмена не допускается"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
