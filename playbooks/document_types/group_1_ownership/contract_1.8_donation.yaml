      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения данные
        о режиме собственности на предмет дарения, согласии сособственников
        и согласии супруга.
        Не анализируй стороны, предмет дарения, обременения, налоги или передачу.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. ownership_regime_status — "defined" если режим собственности прямо
           указан, иначе "not_defined".
        2. ownership_regime_code — "sole" (единоличная) / "joint" (совместная) /
           "shared" (долевая) / "not_defined".
        3. co_owner_consent_status — "defined" если согласие сособственников
           или заверение об единоличной собственности прямо указано,
           иначе "not_defined".
        4. co_owner_consent_code — "obtained" (согласие получено) /
           "not_required_stated" (заявлено, что не требуется) / "not_defined".
        5. spousal_consent_status — "defined" если согласие супруга или
           подтверждение отсутствия брака прямо указано, иначе "not_defined".
        6. spousal_consent_code — "consent_present" / "not_married_confirmed" /
           "prenuptial" / "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений о семейном положении.
        - sole = прямо указана единоличная собственность.
        - joint = прямо указана совместная собственность.
        - shared = прямо указана долевая собственность.
        - obtained = согласие сособственников прямо получено.
        - not_required_stated = прямо указано, что согласие не требуется или имущество единоличное.
        - consent_present = нотариальное согласие супруга прямо указано.
        - not_married_confirmed = прямо указано, что даритель не состоит в браке.
        - prenuptial = прямо есть ссылка на брачный договор.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
