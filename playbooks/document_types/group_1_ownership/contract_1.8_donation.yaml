        Проверь условия об отмене дарения и отказе от исполнения.

        Ответь строго в JSON:
        {
          "revocation_clause_present": "<yes / no / partial>",
          "lawful_revocation_grounds_referenced": "<yes / no / partial>",
          "excessive_revocation_rights": "<yes / no / unclear>",
          "donee_death_reversion_clause": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если договор даёт дарителю произвольное право забрать дар обратно без законных оснований — это риск.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "отмена дарения"
        - "отказ от исполнения"
        - "ст. 578"
        - "право дарителя"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "revocation_clause_present"
