        - "государственная регистрация"
        - "Росреестр"
        - "основание права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"

  - id: "encumbrances_warranty"
    name: "Гарантия отсутствия обременений и прав третьих лиц"
    description: "Проверяет наличие заверений дарителя об отсутствии обременений"
    legal_base: "ст. 460 ГК РФ по аналогии, ст. 572 ГК РФ"
