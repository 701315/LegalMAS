  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Отмена дарения и отказ от исполнения
  # ──────────────────────────────────────────────────────────────────────────
  - id: donation_revocation_and_refusal_check
    name: "Отмена дарения, отказ от исполнения обещания, права сторон (ст. 573, 577-578 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об отмене дарения, отказе от исполнения
      обещания и правах одаряемого на отказ от дара.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отмена дарения"
        - "отказ от исполнения"
        - "даритель вправе отменить"
        - "ст. 578"
        - "покушение на жизнь"
        - "угроза безвозвратной утраты"
        - "имущественное положение дарителя"
        - "смерть одаряемого"
        - "возврат дара"
        - "отказ от принятия дара"
        - "одаряемый вправе отказаться"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен(а|ить)\\s+дарени"
        - "(?i)отказ\\s+от\\s+исполнен"
        - "(?i)даритель\\s+вправе"
        - "(?i)смерть\\s+одаряемого"
        - "(?i)одаряем[ыо]й\\s+вправе\\s+отказ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 573, 577-578 ГК РФ).
        Проверяется наличие условий об отмене дарения и правах сторон при прекращении.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия об отмене дарения (ст. 578 ГК РФ).
        2. Условия об отказе дарителя от обещания (ст. 577 ГК РФ).
        3. Условие о возврате дара при смерти одаряемого ранее дарителя.
        4. Права одаряемого отказаться от принятия дара (ст. 573 ГК РФ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель вправе отменить дарение в случае покушения Одаряемого на его жизнь.
        В случае смерти Одаряемого ранее Дарителя подаренная вещь возвращается Дарителю.
        Одаряемый вправе отказаться от принятия дара до его передачи."

        Ответ:
        {
          "revocation_clause_status": "defined",
          "revocation_grounds_status": "defined",
          "revocation_grounds_lawful": "yes",
          "donee_death_reversion_status": "defined",
          "donee_refusal_right_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Даритель вправе отменить дарение в случае покушения Одаряемого на его жизнь."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель вправе отменить дарение по своему усмотрению в любое время."

        Ответ:
        {
          "revocation_clause_status": "defined",
          "revocation_grounds_status": "defined",
          "revocation_grounds_lawful": "no",
          "donee_death_reversion_status": "not_defined",
          "donee_refusal_right_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Даритель вправе отменить дарение по своему усмотрению в любое время."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об отмене дарения?
        2. Соответствуют ли основания ст. 577-578 ГК (не произвольные)?
        3. Есть ли условие о возврате при смерти одаряемого?
        4. Есть ли право одаряемого отказаться от дара?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "revocation_clause_status": "<defined / not_defined>",
          "revocation_grounds_status": "<defined / not_defined>",
          "revocation_grounds_lawful": "<yes / no / unclear / not_defined>",
          "donee_death_reversion_status": "<defined / not_defined>",
          "donee_refusal_right_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отмена дарения отказ от исполнения даритель вправе отменить ст. 578 ГК РФ ст. 577 ГК РФ покушение на жизнь угроза безвозвратной утраты имущественное положение дарителя смерть одаряемого возврат дара отказ от принятия дара одаряемый вправе отказаться"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "в обмен на"
        - "оплата"
        - "компенсация"
        - "встречное предоставление"
        - "обременения"
        - "залог"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "передача дара"
        - "акт приёма-передачи"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 550

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения условия
        об отмене дарения, отказе от исполнения обещания и правах одаряемого
        на отказ от принятия дара (ст. 573, 577-578 ГК РФ).
        Не анализируй стороны, предмет дарения, обременения, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. revocation_clause_status — "defined" если условие об отмене дарения
           прямо присутствует, иначе "not_defined".
        2. revocation_grounds_status — "defined" если основания отмены прямо
           перечислены, иначе "not_defined".
        3. revocation_grounds_lawful — соответствуют ли основания ст. 577-578
           ГК РФ: "yes" / "no" / "unclear" / "not_defined".
        4. donee_death_reversion_status — "defined" если условие о возврате
           дара при смерти одаряемого раньше дарителя прямо предусмотрено,
           иначе "not_defined".
        5. donee_refusal_right_status — "defined" если право одаряемого
           отказаться от принятия дара прямо предусмотрено, иначе "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - revocation_grounds_lawful = "yes" только если основания совпадают
          со ст. 577-578 ГК (ухудшение имущественного положения, покушение
          на жизнь, смерть одаряемого раньше). Не домысливай.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "revocation_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия об отмене дарения."
          required: true
        - name: "revocation_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечисления оснований для отмены дарения."
          required: false
        - name: "revocation_grounds_lawful"
          type: "string"
          presentation: "signal"
          label: "Основания отмены соответствуют ГК РФ"
          allowed_values: ["yes", "no", "unclear", "not_defined"]
          description: "Соответствие оснований отмены ст. 577-578 ГК РФ."
          required: false
