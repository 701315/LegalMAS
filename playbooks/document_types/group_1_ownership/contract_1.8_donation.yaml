  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Встречное предоставление — детектор
  # ──────────────────────────────────────────────────────────────────────────
  - id: counter_performance_check
    name: "Встречное предоставление: риск переквалификации и притворности (ст. 572, 170 ГК РФ)"
    description: >
      Детекторная проверка наличия признаков встречного предоставления, несовместимых
      с дарением. Не оценивает "насколько это плохо" — только фиксирует факты.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "компенсация"
        - "вознаграждение"
        - "встречное предоставление"
        - "в обмен на"
        - "содержание"
        - "уход"
        - "обязуется выплачивать"
        - "цена"
        - "ежемесячные платежи"
        - "арендная плата"
        - "рента"
        - "обязанности одаряемого"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+обмен\\s+на"
        - "(?i)обязуется\\s+содержать"
        - "(?i)цен[аыуеой]"
        - "(?i)оплат(а|ить|ы)"
        - "(?i)ежемесячн(ые|ых)\\s+платеж"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572 ГК РФ).
        Проверяется только один вопрос: наличие признаков встречного предоставления.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Твоя задача — НЕ оценивать серьёзность риска.
        - Твоя задача — найти в тексте конкретные формулировки, которые указывают
          на встречное предоставление (плату, обязательства одаряемого).
        - Если таких формулировок нет — counter_performance_found = "no".

        [ЗАДАЧА]
        Найди в тексте договора прямые признаки:
        1. Обязательства одаряемого перед дарителем (оплата, содержание, уход, услуги).
        2. Формулировки "в обмен на", "при условии", "взамен".
        3. Цену или компенсацию за передаваемое имущество.
        4. Ежемесячные/регулярные платежи от одаряемого к дарителю.
        5. Признаки ренты (пожизненное содержание, иждивение).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если признаков нет — "no" и пустой массив.
        3. Если признаки есть — "yes" с конкретными цитатами.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — признаки найдены:
        Фрагмент:
        "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется
        ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."

        Ответ:
        {
          "counter_performance_found": "yes",
          "counter_performance_types": ["ежемесячные платежи", "условие пожизненных выплат"],
          "reclassification_target": "annuity",
          "protective_clause_present": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."
            }
          ]
        }

        Пример 2 — признаков нет:
        Фрагмент:
        "Даритель безвозмездно передаёт в дар Одаряемому автомобиль.
        Одаряемый не несёт никаких обязательств перед Дарителем."

        Ответ:
        {
          "counter_performance_found": "no",
          "counter_performance_types": [],
          "reclassification_target": "not_applicable",
          "protective_clause_present": "defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли любая фраза об обязательствах одаряемого?
        2. Есть ли слова "в обмен на", "взамен", "при условии"?
        3. Есть ли упоминание цены, суммы, платежей от одаряемого?
        4. Есть ли признаки ренты (уход, содержание, иждивение)?
        5. Если ничего нет — "no" и пустой массив.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "counter_performance_found": "<yes / no>",
          "counter_performance_types": ["<тип1>", "<тип2>"],
          "reclassification_target": "<sale / exchange / annuity / sham / not_applicable>",
          "protective_clause_present": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "встречное предоставление"
        - "оплата"
        - "компенсация"
        - "уход"
        - "содержание"
        - "цена"
        - "притворная сделка"
        - "переквалификация"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "counter_performance_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Верни 'yes', если признаки встречного предоставления прямо обнаружены. Иначе 'no'."
        - name: "reclassification_target"
          type: "string"
          allowed_values: ["sale", "exchange", "annuity", "sham", "not_applicable"]
          description: "Тип возможной переквалификации."
        - name: "protective_clause_present"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если заверение об отсутствии встречного предоставления прямо есть. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
