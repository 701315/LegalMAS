      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 550

      compact_output: false

      presence_signal:
        field: "donee_tax_consequences_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения налоговые
        оговорки: НДФЛ для одаряемого, статус родства сторон, освобождение
        для близких родственников, обязанность подачи декларации
        (ст. 217 п. 18.1 НК РФ).
        Не анализируй стороны, предмет дарения, обременения или передачу.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. donee_tax_consequences_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме налоговых последствий.
           - "present" — если хотя бы одно из содержательных полей
             (tax_warning_status, close_relative_status_stated,
              close_relative_exemption_status, tax_declaration_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tax_warning_status = "not_defined";
           - close_relative_status_stated = "not_defined";
           - close_relative_status = "not_defined";
           - close_relative_exemption_status = "not_defined";
           - tax_declaration_status = "not_defined";
           - не выполняй остальные шаги.

        1. tax_warning_status:
           - "defined" — если налоговая оговорка об НДФЛ прямо присутствует
             ("Одаряемый самостоятельно уплачивает налог", "доход облагается НДФЛ",
              "стороны уведомлены о налоговых последствиях");
           - "not_defined" — если налоговая оговорка отсутствует.

        2. close_relative_status_stated:
           - "defined" — если статус родства сторон прямо указан в договоре;
           - "not_defined" — если родство не обсуждается.

        3. close_relative_status:
           - "confirmed" — в договоре прямо подтверждено, что стороны являются
             близкими родственниками (супруги, родители, дети, дедушка, бабушка,
             внуки, братья, сестры);
           - "not_confirmed" — в договоре прямо указано, что стороны не являются
             близкими родственниками;
           - "not_stated" — статус родства в тексте не упомянут;
           - "not_defined" — при отсутствии данных.

        4. close_relative_exemption_status:
           - "defined" — если освобождение от НДФЛ для близких родственников
             прямо упомянуто (ссылка на ст. 217 п. 18.1 НК РФ или прямая
             формулировка об освобождении от налога);
           - "not_defined" — если освобождение не упомянуто.

        5. tax_declaration_status:
           - "defined" — если обязанность (или освобождение от обязанности)
             подачи декларации 3-НДФЛ прямо указана;
           - "not_defined" — если подача декларации не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни donee_tax_consequences_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", close_relative_status = "not_defined".
        - Используй только текст договора.
        - Не применяй нормы НК РФ по умолчанию — только прямые формулировки из договора.
        - Если в преамбуле указаны родственные отношения (например, "Даритель — отец, Одаряемый — сын"), это считается прямым указанием на родство (close_relative_status_stated = "defined", close_relative_status = "confirmed").
        - Если в разных фрагментах указаны противоречивые данные (в одном — "близкие родственники", в другом — "налог уплачивается по ставке 13% ввиду отсутствия родства"), верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания НДФЛ, ни статуса родства,
           ни налоговой декларации.
           → presence = "missing";
             все *_status = "not_defined";
             close_relative_status = "not_defined".

        2. Общее предупреждение без указания родства.
           "Одаряемый самостоятельно несёт налоговые последствия,
           связанные с получением дара."
           → presence = "present";
             tax_warning_status = "defined";
             close_relative_status_stated = "not_defined";
             close_relative_status = "not_stated";
             close_relative_exemption_status = "not_defined";
             tax_declaration_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "освобождается от НДФЛ как близкие родственники",
           в другом — "Одаряемый обязуется подать декларацию 3-НДФЛ и уплатить налог".
           → presence = "unclear";
             tax_warning_status = "defined";
             close_relative_status = "not_defined".

        4. Близкие родственники с освобождением по п. 18.1 ст. 217 НК РФ.
           "Стороны являются близкими родственниками (отец и сын).
           Доход освобождается от НДФЛ по п. 18.1 ст. 217 НК РФ."
           → presence = "present";
             tax_warning_status = "defined";
             close_relative_status_stated = "defined";
             close_relative_status = "confirmed";
             close_relative_exemption_status = "defined";
             tax_declaration_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для donee_tax_consequences_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для close_relative_status используй только: "confirmed", "not_confirmed", "not_stated", "not_defined".
        - Fallback при отсутствии данных:
          * все *_status → "not_defined";
          * close_relative_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * donee_tax_consequences_check_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "donee_tax_consequences_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие налоговых оговорок в договоре дарения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tax_warning_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия налоговой оговорки об НДФЛ в договоре."
          required: true

        - name: "close_relative_status_stated"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия прямого указания на родство сторон в договоре."
          required: true

        - name: "close_relative_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["confirmed", "not_confirmed", "not_stated", "not_defined"]
          display_in_grid: true
          display_priority: 1
          label: "Статус родства сторон"
          description: "Статус родства дарителя и одаряемого по тексту договора."
          required: true

        - name: "close_relative_exemption_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия указания на освобождение от НДФЛ для близких родственников (ст. 217 п. 18.1 НК РФ)."
          required: true

        - name: "tax_declaration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия указания на обязанность подачи декларации 3-НДФЛ одаряемым."
          required: true

      store_payload: true

  - id: share_gift_compliance_check
