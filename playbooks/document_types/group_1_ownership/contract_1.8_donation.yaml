  - id: share_gift_compliance_check
    name: "Дарение доли в ООО: нотариальная форма, ЕГРЮЛ, преимущественное право"
    description: >
      При дарении доли в ООО обязательны нотариальное удостоверение,
      проверка устава на наличие запрета/ограничений дарения и соблюдение
      преимущественного права участников (если предусмотрено уставом).
