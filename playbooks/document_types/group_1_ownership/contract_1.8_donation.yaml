        - "пожертвование"
        - "кадастровый номер"
        - "передача дара"
        - "акт приёма-передачи"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "donation_revocation_and_refusal_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения условия
        об отмене дарения, отказе дарителя от исполнения обещания,
        ограничениях на отмену, возврате дара в натуре и правах одаряемого
        на отказ от принятия дара (ст. 573, 577-579 ГК РФ).
        Не анализируй стороны, предмет дарения, обременения, налоги или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. donation_revocation_and_refusal_presence:
           Агрегатное signal-поле — наличие регулирования по теме отмены и отказа.
           - "present" — если хотя бы одно из содержательных полей
             (revocation_clause_status, donor_refusal_promise_status,
              donee_death_reversion_status, donee_refusal_right_status,
              revocation_restrictions_status, return_in_kind_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - revocation_clause_status = "not_defined";
           - revocation_grounds_status = "not_defined";
           - revocation_grounds_lawful = "not_defined";
           - donor_refusal_promise_status = "not_defined";
           - donee_death_reversion_status = "not_defined";
           - donee_refusal_right_status = "not_defined";
           - revocation_restrictions_status = "not_defined";
           - return_in_kind_status = "not_defined";
           - не выполняй остальные шаги.

        1. revocation_clause_status:
           - "defined" — если условие об отмене дарения прямо присутствует
             ("Даритель вправе отменить дарение", "дарение может быть отменено");
           - "not_defined" — если отмена дарения не обсуждается.

        2. revocation_grounds_status:
           - "defined" — если основания отмены прямо перечислены
             (покушение на жизнь, умышленное причинение вреда, ухудшение
              имущественного положения, небрежное обращение);
           - "not_defined" — если основания не перечислены или отмена
             сформулирована как произвольная ("по усмотрению Дарителя").

        3. revocation_grounds_lawful:
           - "yes" — если основания совпадают со ст. 577-578 ГК РФ
             (покушение на жизнь, умышленное причинение вреда здоровью,
              угроза безвозвратной утраты, существенное ухудшение
              имущественного положения, смерть одаряемого ранее дарителя);
           - "no" — если основания выходят за рамки ст. 577-578 ГК РФ
             ("по усмотрению Дарителя", "в любое время без объяснения причин");
           - "unclear" — если основания сформулированы неоднозначно
             и их соответствие закону нельзя определить по тексту;
           - "not_defined" — если основания не перечислены.

        4. donor_refusal_promise_status:
           - "defined" — если право дарителя отказаться от исполнения
             обещания дарения прямо предусмотрено (ст. 577 п. 2-3 ГК РФ):
             * изменение имущественного или семейного положения дарителя,
               приводящее к существенному снижению уровня жизни;
             * ухудшение состояния здоровья дарителя;
             * основания, дающие право отменить дарение (ст. 578);
           - "not_defined" — если отказ дарителя от обещания не обсуждается.

        5. donee_death_reversion_status:
           - "defined" — если условие о возврате дара при смерти одаряемого
             ранее дарителя прямо предусмотрено;
           - "not_defined" — если такое условие не предусмотрено.

        6. donee_refusal_right_status:
           - "defined" — если право одаряемого отказаться от принятия дара
             прямо предусмотрено ("Одаряемый вправе отказаться от дара");
           - "not_defined" — если такое право не упомянуто.

        7. revocation_restrictions_status:
           - "defined" — если в договоре прямо указаны ограничения
             на отмену дарения (ст. 579 ГК РФ):
             * запрет отмены пожертвования;
             * иные договорные ограничения на отмену;
           - "not_defined" — если ограничения на отмену не обсуждаются.

        8. return_in_kind_status:
           - "defined" — если условие о возврате дара в натуре при отмене
             дарения прямо предусмотрено (ст. 578 п. 5 ГК РФ):
             * "Одаряемый обязан возвратить дар в натуре";
             * "возврату подлежит переданная вещь";
           - "not_defined" — если возврат в натуре не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни donation_revocation_and_refusal_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", revocation_grounds_lawful = "not_defined".
        - Используй только текст договора.
        - revocation_grounds_lawful = "yes" только если основания совпадают со ст. 577-578 ГК РФ (ухудшение имущественного положения, покушение на жизнь, смерть одаряемого раньше). Не домысливай.
        - "По усмотрению Дарителя", "в любое время без объяснения причин" — это "no" (не соответствует ст. 578 ГК РФ).
        - Если отмена сформулирована, но основания не перечислены — revocation_clause_status = "defined", revocation_grounds_status = "not_defined", revocation_grounds_lawful = "not_defined".
        - Не оценивай, насколько основания «справедливы» — только их соответствие тексту ст. 577-578 ГК РФ.
        - donor_refusal_promise_status = "defined" при любом прямом упоминании права дарителя отказаться от исполнения обещания: как по ст. 577 п. 2 (изменение положения), так и по ст. 577 п. 3 (основания ст. 578).
        - revocation_restrictions_status = "defined" при прямом указании на ограничения: "отмена не допускается", "дарение не может быть отменено", "за исключением случаев, предусмотренных законом".
        - return_in_kind_status = "defined" при прямом указании на возврат вещи в натуре. Не выводи из общих фраз о возврате.
        - Если в разных фрагментах указаны противоречивые условия отмены, верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни отмены дарения, ни отказа, ни возврата,
           ни ограничений.
           → presence = "missing";
             все *_status = "not_defined";
             revocation_grounds_lawful = "not_defined".

        2. Произвольная отмена без ограничений и возврата.
           "Даритель вправе отменить дарение по своему усмотрению в любое время."
           → presence = "present";
             revocation_clause_status = "defined";
             revocation_grounds_status = "defined";
             revocation_grounds_lawful = "no";
             donor_refusal_promise_status = "not_defined";
             donee_death_reversion_status = "not_defined";
             donee_refusal_right_status = "not_defined";
             revocation_restrictions_status = "not_defined";
             return_in_kind_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "отмена по основаниям ст. 578 ГК РФ",
           в другом — "Даритель вправе отменить в любое время".
           → presence = "unclear";
             revocation_clause_status = "defined";
             revocation_grounds_lawful = "unclear".

        4. Полный комплект: законные основания + ограничения + возврат.
           "Даритель вправе отменить дарение в случае покушения Одаряемого
           на его жизнь. Даритель вправе отказаться от обещания при
           существенном ухудшении имущественного положения. При отмене
           Одаряемый обязан возвратить дар в натуре. Одаряемый вправе
           отказаться от дара до передачи. Отмена не допускается,
           если дарение совершено в общеполезных целях."
           → presence = "present";
             revocation_clause_status = "defined";
             revocation_grounds_status = "defined";
             revocation_grounds_lawful = "yes";
             donor_refusal_promise_status = "defined";
             donee_refusal_right_status = "defined";
             revocation_restrictions_status = "defined";
             return_in_kind_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для donation_revocation_and_refusal_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для revocation_grounds_lawful используй только: "yes", "no", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * все *_status → "not_defined";
          * revocation_grounds_lawful → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * revocation_grounds_lawful → "unclear";
          * donation_revocation_and_refusal_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "donation_revocation_and_refusal_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме отмены дарения и отказа. Внутреннее агрегатное signal-поле."
          required: true

        - name: "revocation_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об отмене дарения."
          required: true

        - name: "revocation_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечисления оснований для отмены дарения."
          required: true

        - name: "revocation_grounds_lawful"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "unclear", "not_defined"]
          display_in_grid: true
          display_priority: 1
          label: "Основания отмены соответствуют ГК РФ"
          description: "Соответствие оснований отмены ст. 577-578 ГК РФ."
          required: true

        - name: "donor_refusal_promise_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 2
          label: "Отказ дарителя от обещания"
          description: >
            Статус наличия условия о праве дарителя отказаться от исполнения
            обещания дарения (ст. 577 п. 2-3 ГК РФ): при существенном ухудшении
            имущественного/семейного положения, состояния здоровья, или по
            основаниям ст. 578 ГК РФ.
          required: true

        - name: "donee_death_reversion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о возврате дара при смерти одаряемого ранее дарителя."
          required: true

        - name: "donee_refusal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия права одаряемого отказаться от принятия дара."
          required: true

        - name: "revocation_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 3
          label: "Ограничения на отмену дарения"
          description: >
            Статус наличия ограничений на отмену дарения (ст. 579 ГК РФ):
            запрет отмены пожертвования, иные договорные ограничения.
          required: true

        - name: "return_in_kind_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 4
          label: "Возврат дара в натуре"
          description: >
            Статус наличия условия о возврате дара в натуре при отмене
            дарения (ст. 578 п. 5 ГК РФ).
          required: true

      store_payload: true

  - id: encumbrances_bankruptcy_and_sham_risk
    name: "Обременения предмета дарения, банкротный риск и непритворность (ст. 460 ГК РФ, ФЗ-127)"
    description: >
      Фактографическая проверка наличия заверений дарителя об отсутствии обременений,
      банкротного статуса, признаков неплатёжеспособности, невозможности оспаривания
      по ст. 61.2–61.3 ФЗ-127 и о непритворности сделки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не обременён"
        - "отсутствие обременений"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "не заложен"
        - "отсутствие признаков банкротства"
        - "не находится в процедуре банкротства"
        - "не нарушает права кредиторов"
        - "кредиторы"
        - "не является притворной сделкой"
        - "безвозмездный характер"
        - "неплатёжеспособность"
        - "оспаривание сделки"
        - "период подозрительности"
        - "ст. 61.2"
        - "ст. 61.3"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+обременен|не\\s+обременён|свободен\\s+от.*прав)"
        - "(?i)не\\s+находится\\s+под\\s+арест"
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"
        - "(?i)не\\s+является\\s+притворн(ой|ою)\\s+сделк"
        - "(?i)неплатёжеспособн"
        - "(?i)оспаривани"
        - "(?i)период\\s+подозрительност"
        - "(?i)ст\\.\\s*61\\.[23]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ; ст. 460 ГК РФ; ФЗ-127 ст. 61.2-61.3).
        Проверяется наличие заверений об отсутствии обременений, банкротстве и непритворности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение об отсутствии обременений на предмет дарения.
        2. Заверение об отсутствии залога.
        3. Заверение об отсутствии ареста.
        4. Заверение о чистоте прав третьих лиц.
        5. Заверение о банкротном статусе дарителя.
        6. Заверение о ненарушении прав кредиторов.
        7. Заверение о непритворности сделки.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если заверение не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет дарения свободен от залогов, обременений и арестов.
        Права третьих лиц на имущество отсутствуют.
        Даритель не находится в процедуре банкротства и не имеет признаков
        несостоятельности. Дарение не нарушает права кредиторов.
        Настоящий договор не является притворной сделкой."

        Ответ:
        {
          "encumbrances_warranty_status": "defined",
          "encumbrances_warranty_details": "предмет дарения свободен от залогов, обременений и арестов",
          "pledge_absence_status": "defined",
          "arrest_absence_status": "defined",
          "third_party_rights_status": "defined",
          "bankruptcy_warranty_status": "defined",
          "creditors_not_harmed_status": "defined",
          "sham_prevention_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Предмет дарения свободен от залогов, обременений и арестов."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель передаёт предмет дарения Одаряемому."

        Ответ:
        {
          "encumbrances_warranty_status": "not_defined",
          "encumbrances_warranty_details": "Данные не определены",
          "pledge_absence_status": "not_defined",
          "arrest_absence_status": "not_defined",
          "third_party_rights_status": "not_defined",
          "bankruptcy_warranty_status": "not_defined",
          "creditors_not_harmed_status": "not_defined",
          "sham_prevention_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямые заверения "не обременён", "свободен от прав третьих лиц"?
        2. Упомянуто ли банкротство или неплатёжеспособность?
        3. Есть ли защитная оговорка о непритворности?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "encumbrances_warranty_status": "<defined / not_defined>",
          "encumbrances_warranty_details": "<текст или 'Данные не определены'>",
          "pledge_absence_status": "<defined / not_defined>",
          "arrest_absence_status": "<defined / not_defined>",
          "third_party_rights_status": "<defined / not_defined>",
          "bankruptcy_warranty_status": "<defined / not_defined>",
          "creditors_not_harmed_status": "<defined / not_defined>",
          "sham_prevention_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не обременён отсутствие обременений не находится под арестом свободен от прав третьих лиц не заложен отсутствие признаков банкротства не находится в процедуре банкротства не нарушает права кредиторов кредиторы не является притворной сделкой ФЗ-127 ст. 61.2 ст. 61.3 неплатёжеспособность оспаривание сделки период подозрительности"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "государственная регистрация"
        - "зарегистрированные лица"
        - "право пользования"
        - "госпошлина"
        - "НДФЛ"
        - "пожертвование"
        - "отмена дарения"
        - "встречное предоставление"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050

      compact_output: false

      presence_signal:
        field: "encumbrances_bankruptcy_and_sham_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения заверения
        дарителя об отсутствии обременений на предмет дарения, его банкротном
        статусе, признаках неплатёжеспособности, невозможности оспаривания
        по ст. 61.2–61.3 ФЗ-127, ненарушении прав кредиторов и непритворности сделки.
        Не анализируй стороны, передачу, налоги или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. encumbrances_bankruptcy_and_sham_presence:
           Агрегатное signal-поле — наличие регулирования по теме обременений,
           банкротства и непритворности.
           - "present" — если хотя бы одно из содержательных полей
             (encumbrances_warranty_status, bankruptcy_warranty_status,
              insolvency_signs_warranty_status, bankruptcy_clawback_warranty_status,
              sham_prevention_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - encumbrances_warranty_status = "not_defined";
           - bankruptcy_warranty_status = "not_defined";
           - insolvency_signs_warranty_status = "not_defined";
           - bankruptcy_clawback_warranty_status = "not_defined";
           - sham_prevention_status = "not_defined";
           - pledge_absence_status = arrest_absence_status =
             third_party_rights_status = creditors_not_harmed_status = "not_defined";
           - encumbrances_warranty_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. encumbrances_warranty_status:
           - "defined" — если заверение об отсутствии обременений прямо указано
             ("свободен от обременений", "не обременён", "отсутствие обременений");
           - "not_defined" — если заверение об обременениях не указано.

        2. encumbrances_warranty_details:
           Краткое user-facing описание заверения об отсутствии обременений
           на русском языке.
           Примеры: "свободен от залогов, обременений и арестов",
           "не обременён правами третьих лиц".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. pledge_absence_status:
           - "defined" — если отсутствие залога прямо подтверждено
             ("не заложен", "свободен от залогов");
           - "not_defined" — если залог не обсуждается.

        4. arrest_absence_status:
           - "defined" — если отсутствие ареста прямо подтверждено
             ("не находится под арестом", "аресты отсутствуют");
           - "not_defined" — если арест не обсуждается.

        5. third_party_rights_status:
           - "defined" — если заверение об отсутствии прав третьих лиц
             прямо указано ("свободен от прав третьих лиц");
           - "not_defined" — если права третьих лиц не обсуждаются.

        6. bankruptcy_warranty_status:
           - "defined" — если заверение о банкротном статусе дарителя
             прямо указано ("не находится в процедуре банкротства",
             "не имеет признаков несостоятельности", "не является банкротом");
           - "not_defined" — если банкротство не обсуждается.

        7. insolvency_signs_warranty_status:
           - "defined" — если заверение об отсутствии признаков
             неплатёжеспособности дарителя прямо указано
             ("не имеет признаков неплатёжеспособности",
              "не прекращал исполнение обязательств перед кредиторами",
              "не допускает просрочку платежей");
           - "not_defined" — если признаки неплатёжеспособности не обсуждаются.

        8. bankruptcy_clawback_warranty_status:
           - "defined" — если заверение о невозможности оспаривания
             сделки по ст. 61.2–61.3 ФЗ-127 прямо указано
             ("сделка не может быть оспорена по основаниям ст. 61.2 ФЗ-127",
              "дарение совершено вне периода подозрительности",
              "не подлежит оспариванию в деле о банкротстве");
           - "not_defined" — если оспаривание по ФЗ-127 не обсуждается.

        9. creditors_not_harmed_status:
           - "defined" — если заверение о ненарушении прав кредиторов
             прямо указано ("не нарушает права кредиторов",
             "дарение не ущемляет интересы кредиторов",
             "не совершено в ущерб кредиторам");
           - "not_defined" — если права кредиторов не обсуждаются.

        10. sham_prevention_status:
            - "defined" — если заверение о непритворности сделки прямо
              указано ("не является притворной сделкой",
              "не прикрывает иную сделку");
            - "not_defined" — если непритворность не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни encumbrances_bankruptcy_and_sham_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", encumbrances_warranty_details = "Данные не определены".
        - Используй только текст договора.
        - Общая фраза "предмет дарения свободен от обременений" покрывает pledge и arrest одновременно.
        - Не применяй нормы ФЗ-127 по умолчанию — только если прямо упомянуты в тексте.
        - Если в тексте прямо указано, что имущество находится в залоге или под арестом, это тоже "defined" для соответствующего поля (заверение может быть отрицательным).
        - insolvency_signs_warranty_status = "defined" только при прямом упоминании неплатёжеспособности, просрочки, прекращения исполнения обязательств. Не выводи из общих фраз о финансовом положении.
        - bankruptcy_clawback_warranty_status = "defined" только при прямой ссылке на ст. 61.2–61.3 ФЗ-127, период подозрительности или оспаривание в деле о банкротстве. Не выводи из общих фраз о банкротстве.
        - Если в разных фрагментах указаны противоречивые данные (в одном — "свободен от обременений", в другом — "имущество в залоге"), верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений об обременениях, ни упоминания
           банкротства, ни оговорки о непритворности.
           → presence = "missing";
             все *_status = "not_defined";
             encumbrances_warranty_details = "Данные не определены".

        2. Частичное регулирование: только обременения, без банкротства.
           "Предмет дарения свободен от залогов и арестов."
           Без упоминания банкротства и непритворности.
           → presence = "present";
             encumbrances_warranty_status = "defined";
             pledge_absence_status = "defined";
             arrest_absence_status = "defined";
             bankruptcy_warranty_status = "not_defined";
             insolvency_signs_warranty_status = "not_defined";
             bankruptcy_clawback_warranty_status = "not_defined";
             sham_prevention_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "свободен от обременений",
           в другом — "имущество находится в залоге у банка".
           → presence = "unclear";
             encumbrances_warranty_status = "not_defined";
             pledge_absence_status = "not_defined";
             encumbrances_warranty_details = "Не удалось определить".

        4. Полный комплект банкротных заверений.
           "Даритель не находится в процедуре банкротства, не имеет
           признаков неплатёжеспособности. Настоящая сделка совершена
           вне периода подозрительности и не может быть оспорена
           по ст. 61.2–61.3 ФЗ-127. Дарение не нарушает права кредиторов."
           → presence = "present";
             bankruptcy_warranty_status = "defined";
             insolvency_signs_warranty_status = "defined";
             bankruptcy_clawback_warranty_status = "defined";
             creditors_not_harmed_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для encumbrances_bankruptcy_and_sham_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * encumbrances_warranty_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * encumbrances_warranty_details → "Не удалось определить";
          * encumbrances_bankruptcy_and_sham_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "encumbrances_bankruptcy_and_sham_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений об обременениях, банкротстве и непритворности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "encumbrances_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия заверения об отсутствии обременений на предмет дарения."
          required: true

        - name: "encumbrances_warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Заверение об отсутствии обременений"
          description: >
            Текст заверения дарителя об отсутствии обременений на предмет дарения.
            Примеры: "свободен от залогов, обременений и арестов".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "pledge_absence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии залога на предмет дарения."
          required: true

        - name: "arrest_absence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии ареста на предмет дарения."
          required: true

        - name: "third_party_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
