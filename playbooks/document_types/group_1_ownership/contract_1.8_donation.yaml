        - "(?i)не\\s+находится\\s+под\\s+арест"

  - id: "residents_list_for_residential_gift"
    name: "Жилое помещение: перечень лиц, сохраняющих право пользования"
    description: "Проверяет раскрытие информации о проживающих/зарегистрированных лицах"
    legal_base: "ст. 292 ГК РФ, практика по сделкам с жильём"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
