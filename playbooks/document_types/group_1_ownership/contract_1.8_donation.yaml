        - "ЕГРЮЛ"
        - "преимущественное право"
        - "устав общества"
        - "запрет дарения"
        - "согласие участников"
        - "запрет отчуждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дол(я|и|ю)\\s+в\\s+уставн"
        - "(?i)нотариальн(ое|ой)\\s+удостоверен"
        - "(?i)ЕГРЮЛ"
        - "(?i)преимущест(венное|во)\\s+право"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор дарения доли в ООО.
        Проверь соблюдение специальных требований к дарению доли.

        Ответь строго в JSON:
        {
          "notarization_present": "<yes / no / not_found>",
          "egrul_procedure_described": "<yes / no / not_found>",
          "charter_restrictions_addressed": "<yes / no / not_found>",
          "preemptive_right_addressed": "<complied / not_applicable / not_addressed / not_found>",
          "participants_consent_required": "<yes / no / not_found>",
          "share_size": "<размер доли или not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "preemptive_right_addressed": при дарении преимущественное право по умолчанию
          не применяется (п. 2 ст. 21 ФЗ-14), но устав может устанавливать иное.
        - Если устав требует согласия участников на дарение — это must-check.

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
