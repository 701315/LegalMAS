      keyword_mode: "any"
      negative_keywords:
        - "встречное предоставление"
        - "оплата"
        - "компенсация"
        - "обмен"
      regex_patterns:
        - "(?i)не\\s+является\\s+притворн(ой|ою)\\s+сделк"
        - "(?i)безвозмездн(ый|ая|ого)\\s+характер"

  - id: "donee_tax_warning"
    name: "Налоговые последствия для одаряемого (НДФЛ)"
    description: "Проверяет наличие предупреждения о НДФЛ и исключении для близких родственников"
