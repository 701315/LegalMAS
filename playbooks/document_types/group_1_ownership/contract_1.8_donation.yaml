      - "(?i)\\bкомнат[аеиу]\\b"
      - "(?i)нежил[оаоеые]+\\s+помещени[ея]"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bсооружени[ея]\\b"
