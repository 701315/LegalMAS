        - "претензионный порядок"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "confidentiality"
    name: "Конфиденциальность"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "не раскрывать третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "force_majeure"
    name: "Форс-мажор / обстоятельства непреодолимой силы"
    description: "Проверяет наличие оговорки о форс-мажоре, если она включена"
    legal_base: "ст. 401 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "обстоятельства непреодолимой силы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[\\s-]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"

  - id: "corporate_approval_for_donor"
    name: "Корпоративное одобрение дарения юридическим лицом (ст. 576 п. 1, ФЗ-14, ФЗ-208)"
    description: "Проверяет наличие одобрения крупной сделки / сделки с заинтересованностью при дарении от юрлица"
    legal_base: "ст. 576 п. 1 ГК РФ, ФЗ-14, ФЗ-208"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["commercial_entity_party"]
    rules:
      keywords:
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "право хозяйственного ведения"
        - "право оперативного управления"
        - "согласие собственника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"

  - id: "share_gift_notarization"
    name: "Дарение доли в ООО: нотариальная форма и ЕГРЮЛ"
    description: "Проверяет нотариальное удостоверение при дарении доли в ООО и порядок внесения изменений в ЕГРЮЛ"
    legal_base: "ст. 21 ФЗ-14 «Об ООО»"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["share_gift"]
    rules:
      keywords:
        - "доля в уставном капитале"
        - "доля в ООО"
        - "нотариальное удостоверение"
        - "нотариус"
        - "ЕГРЮЛ"
        - "лист записи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дол(я|и|ю)\\s+в\\s+уставн"
        - "(?i)нотариальн(ое|ой)\\s+удостоверен"
        - "(?i)ЕГРЮЛ"

  - id: "co_owner_consent_clause"
    name: "Согласие сособственников при дарении общего имущества (ст. 576 п. 2, 246, 253 ГК РФ)"
    description: "Проверяет наличие согласия всех сособственников или подтверждения единоличной собственности"
    legal_base: "ст. 576 п. 2, 246, 253 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["joint_property_gift"]
    rules:
      keywords:
        - "согласие сособственников"
        - "согласие всех участников"
        - "общая собственность"
        - "совместная собственность"
        - "долевая собственность"
        - "единоличная собственность"
        - "принадлежит лично"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+(всех\\s+)?(участник|сособственник)"
        - "(?i)общ(ая|ей)\\s+(совместн|долев)"

  - id: "governing_law"
    name: "Применимое право"
    description: "Проверяет указание применимого права"
    legal_base: "ст. 1210, 1211 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "законодательство Российской Федерации"
        - "регулируется правом"
        - "право Российской Федерации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав"
        - "(?i)регулируется.*прав(ом|о)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}:
      ФИО/наименование, паспортные данные или ИНН/ОГРН, адрес,
      а также полномочия подписантов.
    addressee: "Обе стороны"

  gratuitousness_required:
    text: >
      Просим прямо зафиксировать в {doc_names}, что передача осуществляется
      безвозмездно и не предусматривает никакого встречного предоставления,
      оплаты, компенсации, услуг, ухода или иных обязательств одаряемого.
    addressee: "Юридический советник"

  subject_identification:
    text: >
      Просим уточнить в {doc_names} предмет дарения: конкретное имущество,
      имущественное право или освобождаемую обязанность, с достаточной
      индивидуализацией предмета.
    addressee: "Даритель / Юридический советник"

  donation_subject_and_gratuitousness_extraction:
    text: >
      Просим предоставить по {doc_names}: точное описание предмета дарения,
      подтверждение безвозмездности и пояснение, отсутствуют ли любые
      встречные обязательства одаряемого.
    addressee: "Обе стороны"

  counter_performance_check:
    text: >
      В {doc_names} необходимо исключить любые формулировки, которые могут
      трактоваться как встречное предоставление: оплату, компенсацию,
      содержание, уход, обязательство совершить действия в пользу дарителя.
    addressee: "Юридический советник"

  promise_of_gift_form_and_specificity:
    text: >
      Если {doc_names} содержит обещание дарения, просим подтвердить:
      (а) письменную форму; (б) конкретный предмет дарения;
      (в) отсутствие формулировок вроде «всё имущество» или иного
      неопределённого описания дара.
    addressee: "Юридический советник"

  written_form_for_promise:
    text: >
      Просим уточнить в {doc_names}, что обещание дарения оформлено письменно
      и содержит конкретный, индивидуализированный предмет дарения.
    addressee: "Юридический советник"

  donation_revocation_and_refusal_check:
    text: >
      Просим уточнить в {doc_names}: основания отмены дарения и отказа
      от исполнения, с приведением их в соответствие со ст. 577-578 ГК РФ,
      без произвольного расширения прав дарителя.
    addressee: "Юридический советник"

  donation_revocation_clause:
    text: >
      Просим уточнить в {doc_names}: ссылки на законные основания отмены
      дарения/отказа от исполнения, а также наличие/отсутствие условия
      о возврате дара при смерти одаряемого.
    addressee: "Юридический советник"

  charitable_donation_target_use_check:
    text: >
      Для {doc_names} (пожертвование) просим определить:
      (а) общеполезную цель; (б) режим целевого использования;
      (в) отчётность одаряемого; (г) порядок изменения цели использования.
    addressee: "Одаряемый / Юридический советник"

  charitable_donation_target_use:
    text: >
      Просим включить в {doc_names} точную цель пожертвования и порядок
      контроля за целевым использованием имущества/средств.
    addressee: "Юридический советник"

  real_estate_gift_specifics_check:
    text: >
      Для {doc_names} (дарение недвижимости) просим предоставить:
      кадастровый номер, выписку ЕГРН, правоустанавливающие документы,
      подтверждение отсутствия обременений, перечень зарегистрированных лиц,
      порядок подачи документов на регистрацию в Росреестр.
    addressee: "Даритель / Юридический советник"

  real_estate_registration_and_title:
    text: >
      Просим предоставить по {doc_names}: актуальную выписку ЕГРН,
      документ-основание права дарителя, кадастровые данные объекта
      и порядок регистрации перехода права собственности.
    addressee: "Даритель"

  encumbrances_warranty:
    text: >
      Просим предоставить по {doc_names}: заверения дарителя об отсутствии
      арестов, залогов, сервитутов, иных обременений и прав третьих лиц.
    addressee: "Даритель"

  residents_list_for_residential_gift:
    text: >
      Просим уточнить в {doc_names}: перечень зарегистрированных и проживающих
      лиц, сохраняющих право пользования жилым помещением, либо прямое
      подтверждение их отсутствия.
    addressee: "Даритель"

  donee_tax_consequences_check:
    text: >
      Просим уточнить в {doc_names}: налоговые последствия для одаряемого,
      в том числе применяется ли освобождение от НДФЛ в связи со статусом
      близких родственников.
    addressee: "Налоговый консультант / Юридический советник"

  donee_tax_warning:
    text: >
      Просим включить в {doc_names} предупреждение о налоговых последствиях
      для одаряемого и, при необходимости, указание на освобождение от НДФЛ
      для близких родственников по ст. 217 НК РФ.
    addressee: "Юридический советник"

  spousal_consent_check:
    text: >
      Просим предоставить по {doc_names}: нотариальное согласие супруга
      дарителя либо подтверждение, что имущество является личной собственностью
      / даритель не состоит в браке / действует брачный договор.
    addressee: "Даритель"

  bankruptcy_risk_disclosure:
    text: >
      Просим подтвердить по {doc_names}, что даритель не находится в процедуре
      банкротства, не обладает признаками неплатежеспособности и сделка
      не совершается в ущерб кредиторам.
    addressee: "Даритель / Юридический советник"

  simulated_transaction_prevention:
    text: >
      Просим включить в {doc_names} заверение сторон о том, что договор
      не является притворной сделкой, не прикрывает куплю-продажу, мену,
      ренту или иную возмездную передачу.
    addressee: "Юридический советник"

  transfer_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок передачи дара, дату/момент
      фактической передачи, необходимость подписания акта приёма-передачи.
    addressee: "Обе стороны"

  commercial_gift_restriction_check:
    text: >
      Внимание: {doc_names} может подпадать под запрет дарения между
      коммерческими организациями по ст. 575 ГК РФ. Просим предоставить
      правовое заключение о допустимости сделки либо рассмотреть иную
      договорную конструкцию.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность споров, наличие претензионного
      порядка и применимый процессуальный режим.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} условия о конфиденциальности:
      перечень конфиденциальных сведений, исключения, срок действия.
    addressee: "Юридический советник"

  force_majeure:
    text: >
      Если стороны хотят сохранить оговорку о форс-мажоре в {doc_names},
      просим уточнить перечень обстоятельств, порядок уведомления и последствия.
    addressee: "Юридический советник"

  minor_guardianship_risk:
    text: >
      Просим предоставить по {doc_names}: документы, подтверждающие
      дееспособность сторон либо законность участия законного представителя,
      а также согласования органа опеки (если применимо).
    addressee: "Законный представитель / Юридический советник"

  commercial_entities_gift_prohibition:
    text: >
      Внимание: дарение между коммерческими организациями по {doc_names}
      может быть ничтожным по ст. 575 ГК РФ. Просим подтвердить структуру сторон,
      стоимость передаваемого имущества и допустимость выбранной конструкции.
    addressee: "Юридический советник"

  counter_performance_reclassification_risk:
    text: >
      Внимание: в {doc_names} выявлен риск переквалификации дарения из-за
      признаков встречного предоставления. Просим удалить такие условия
      либо выбрать иную правовую конструкцию.
    addressee: "Юридический советник"

  bankruptcy_challenge_risk:
    text: >
      Внимание: {doc_names} содержит риск оспаривания в рамках банкротства дарителя.
      Просим предоставить сведения о финансовом состоянии дарителя, отсутствии
      процедуры банкротства и анализе риска оспаривания по ФЗ-127.
    addressee: "Юридический советник / Финансовый консультант"

  minor_incapacitated_gift_restriction:
    text: >
      Внимание: {doc_names} содержит признаки участия малолетнего /
      недееспособного лица. Просим подтвердить допустимость сделки,
      объём полномочий представителя и наличие обязательных согласований.
    addressee: "Юридический советник"

  share_gift_compliance_check:
    text: >
      Для {doc_names} (дарение доли в ООО) просим предоставить:
      (а) устав общества — для проверки запретов/ограничений на дарение доли;
      (б) подтверждение нотариального удостоверения сделки (ст. 21 ФЗ-14);
      (в) сведения о необходимости согласия участников на дарение доли;
      (г) порядок внесения изменений в ЕГРЮЛ.
    addressee: "Даритель / Нотариус / Юридический советник"

  share_gift_notarization:
    text: >
      Просим подтвердить по {doc_names}: нотариальную форму договора дарения
      доли, контактные данные нотариуса и порядок подачи в ЕГРЮЛ.
    addressee: "Нотариус / Юридический советник"

  co_ownership_consent_check:
    text: >
      Просим предоставить по {doc_names}: (а) документы, подтверждающие
      режим собственности на предмет дарения (единоличная / совместная / долевая);
      (б) нотариальное согласие сособственников или супруга (ст. 576 п. 2, 253 ГК РФ,
      ст. 35 СК РФ); (в) при единоличной собственности — подтверждение оснований.
    addressee: "Даритель / Юридический советник"

  co_owner_consent_clause:
    text: >
      Просим включить в {doc_names}: подтверждение режима собственности,
      согласие всех сособственников (если общая собственность) либо заверение
      о принадлежности имущества на праве единоличной собственности.
    addressee: "Юридический советник"

  corporate_approval_for_donor:
    text: >
      Просим предоставить по {doc_names}: протокол/решение об одобрении
      дарения (крупная сделка / сделка с заинтересованностью) либо заключение,
      что одобрение не требуется. При дарении имущества на праве хозяйственного
      ведения — согласие собственника (ст. 576 п. 1 ГК РФ).
    addressee: "Юридический советник дарителя"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право.
    addressee: "Юридический советник"

  public_official_gift_prohibition:
    text: >
      Внимание: {doc_names} может подпадать под запрет дарения по ст. 575 п. 2-3 ГК РФ.
      Просим подтвердить: (а) статус одаряемого (госслужащий / работник образования,
      медицины, соцслужб); (б) связь дарения с исполнением должностных обязанностей;
      (в) стоимость дара (обычный подарок до 3000 руб. — исключение из запрета).
    addressee: "Юридический советник"

  joint_property_consent_required:
    text: >
      Внимание: {doc_names} содержит признаки дарения общего имущества.
      По ст. 576 п. 2, 253 ГК РФ требуется согласие всех сособственников.
      Просим предоставить: нотариальное согласие сособственников или
      документы, подтверждающие единоличную собственность дарителя.
    addressee: "Даритель / Юридический советник"
    
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"