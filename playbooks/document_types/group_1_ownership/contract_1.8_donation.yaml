        - "НДФЛ"
        - "пожертвование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
