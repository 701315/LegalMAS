        - "благотворительные цели"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)целев(ое|ого)\\s+использован"
        - "(?i)пожертвовани"

  - id: "real_estate_registration_and_title"
    name: "Дарение недвижимости: регистрация и титул дарителя"
    description: "Проверяет идентификацию объекта, титул дарителя и порядок регистрации перехода права"
    legal_base: "ст. 131, 574 ГК РФ, ФЗ-218"
