        дарителя об отсутствии обременений на предмет дарения, его банкротном
        статусе, ненарушении прав кредиторов и непритворности сделки.
        Не анализируй стороны, передачу, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. encumbrances_warranty_status — "defined" если заверение об
           отсутствии обременений прямо указано, иначе "not_defined".
        2. encumbrances_warranty_details — текст заверения об отсутствии
           обременений.
        3. pledge_absence_status — "defined" если отсутствие залога прямо
           подтверждено, иначе "not_defined".
        4. arrest_absence_status — "defined" если отсутствие ареста прямо
