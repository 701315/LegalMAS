        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "promise_of_gift_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если обещание дарения прямо присутствует. Иначе 'not_defined'."
        - name: "subject_specificity"
          type: "string"
