      any: ["promise_of_gift"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обещает подарить"
        - "обязуется передать"
        - "в будущем"
        - "после наступления условия"
        - "обещание дарения"
        - "после"
        - "впоследствии"
        - "письменная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеща(ет|ние)\\s+подар"
        - "(?i)обязуется\\s+передать"
        - "(?i)в\\s+будущем"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор, содержащий обещание дарения (ст. 572 ч. 2, ст. 574 ГК РФ).
        Проверяется только один вопрос: признаки обещания дарения, форма и определённость.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признаки обещания дарения (передача в будущем, "обязуется передать").
        2. Соблюдение письменной формы.
        3. Конкретность предмета обещания (не "всё имущество" или неопределённый дар).
        4. Условие, при наступлении которого обещание вступает в силу.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель обязуется передать Одаряемому в будущем автомобиль Toyota Camry,
        VIN XW7BF4FK30S123456, после окончания обучения Одаряемого."

        Ответ:
        {
          "promise_of_gift_status": "defined",
          "written_form_status": "defined",
          "subject_specificity_status": "defined",
          "subject_specificity_code": "specific",
          "triggering_condition_status": "defined",
          "triggering_condition_details": "после окончания обучения Одаряемого",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель обязуется передать Одаряемому в будущем автомобиль Toyota Camry, VIN XW7BF4FK30S123456, после окончания обучения Одаряемого."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель обещает подарить Одаряемому всё своё имущество в будущем."

        Ответ:
        {
          "promise_of_gift_status": "defined",
          "written_form_status": "defined",
          "subject_specificity_status": "defined",
          "subject_specificity_code": "all_property",
          "triggering_condition_status": "not_defined",
          "triggering_condition_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель обещает подарить Одаряемому всё своё имущество в будущем."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слова "обещает подарить", "обязуется передать в будущем"?
        2. Конкретен ли предмет или написано "всё имущество"?
        3. Есть ли условие вступления в силу?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "promise_of_gift_status": "<defined / not_defined>",
          "written_form_status": "<defined / not_defined>",
          "subject_specificity_status": "<defined / not_defined>",
          "subject_specificity_code": "<specific / vague / all_property / not_defined>",
          "triggering_condition_status": "<defined / not_defined>",
          "triggering_condition_details": "<текст условия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обещает подарить обязуется передать в будущем после наступления условия обещание дарения впоследствии письменная форма всё имущество ст. 572 ГК РФ ч. 2 ст. 574 ГК РФ условие вступления в силу определённость предмета"
      preferred_unit_types:
