        - "неплатежеспособность"
        - "не нарушает права кредиторов"
        - "кредиторы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"

  - id: "charitable_donation_target_use"
    name: "Пожертвование: целевое использование"
