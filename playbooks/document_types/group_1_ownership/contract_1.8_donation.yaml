    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Найди прямые признаки встречного предоставления
        в договоре дарения.
        </role>

        <context>{context}</context>

        <task>
        Заполни строго следующие поля:

        1. counter_performance_found — "yes" если прямые признаки встречного предоставления найдены, иначе "no".
        2. counter_performance_types — список типов встречного предоставления, найденных в тексте (массив строк). Пустой массив если признаков нет.
        3. reclassification_target — наиболее вероятная альтернативная квалификация: sale / exchange / annuity / sham / not_applicable.
        4. protective_clause_present — "defined" если прямо сказано, что одаряемый не несёт встречных обязательств, иначе "not_defined".

        Если признаков нет:
        - counter_performance_found = "no"
        - counter_performance_types = []
        - reclassification_target = "not_applicable"
        </task>

        <rules>
        - Только текст договора.
        - counter_performance_found = "yes" только если в тексте есть прямые признаки встречного предоставления.
        - sale = встречное предоставление выглядит как оплата или цена.
        - exchange = встречное предоставление выглядит как встречная передача имущества.
        - annuity = встречное предоставление выглядит как содержание, уход, регулярные выплаты.
        - sham = текст указывает на иную притворную конструкцию, но без ясной альтернативной модели.
        - not_applicable = признаков встречного предоставления нет.
        - protective_clause_present = defined только если прямо сказано, что одаряемый не несёт встречных обязательств.
        - Верни только JSON.
        </rules>
      fields:
        - name: "counter_performance_types"
          type: "string_list"
          presentation: "fact"
          label: "Признаки встречного предоставления"
          description: "Типы встречного предоставления, прямо найденные в тексте договора."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "reclassification_target"
          type: "string"
          presentation: "signal"
          allowed_values: ["sale", "exchange", "annuity", "sham", "not_applicable"]
          description: "Наиболее вероятная альтернатива квалификации сделки при наличии встречного предоставления."
          required: false
        - name: "protective_clause_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия защитной оговорки об отсутствии обязательств одаряемого."
          required: false
      store_payload: true

