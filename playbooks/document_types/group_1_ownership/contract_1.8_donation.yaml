        2. Упомянуто ли банкротство или неплатёжеспособность?
        3. Есть ли защитная оговорка о непритворности?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "encumbrances_warranty_status": "<defined / not_defined>",
