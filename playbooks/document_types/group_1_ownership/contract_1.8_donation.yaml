        - "угроза утраты"
        - "имущественное положение дарителя"
        - "право дарителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен(а|ить)\\s+дарени"
        - "(?i)отказ\\s+от\\s+исполнен"

  - id: "simulated_transaction_prevention"
    name: "Подтверждение отсутствия притворности / скрытой возмездности"
    description: "Проверяет наличие заверений о реальной безвозмездности сделки"
    legal_base: "ст. 170, 572 ГК РФ"
