          description: "Статус наличия согласия собственника при хозяйственном ведении/оперативном управлении."
          required: true

      store_payload: true

  - id: donation_subject_and_gratuitousness_extraction
    name: "Предмет дарения, безвозмездность и отсутствие притворности (ст. 572 ГК РФ)"
    description: >
      Фактографическая проверка наличия определённого предмета дарения и явного
      выражения безвозмездности. Критически важно: безвозмездность — квалифицирующий
      признак дарения; её отсутствие или противоречие влечёт переквалификацию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "даритель"
        - "одаряемый"
        - "безвозмездно"
        - "в дар"
        - "предмет дарения"
        - "имущественное право"
        - "освобождение от обязанности"
        - "предмет договора"
        - "имущество"
        - "передаёт в дар"
        - "объект дарения"
        - "не является притворной сделкой"
        - "безвозмездный характер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безвозмездн"
        - "(?i)в\\s+дар"
        - "(?i)переда[её]т\\s+в\\s+дар"
        - "(?i)предмет\\s+договор"
        - "(?i)не\\s+является\\s+притворн(ой|ою)\\s+сделк"
        - "(?i)безвозмездн(ый|ая|ого)\\s+характер"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572 ГК РФ; ст. 432 ГК РФ).
        Проверяется только один вопрос: предмет дарения и безвозмездность.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Безвозмездность — обязательный квалифицирующий признак дарения по ст. 572 ГК РФ.
        - Если в договоре есть встречное предоставление — сделка НЕ является дарением.
        - Предмет дарения: вещь / имущественное право / освобождение от обязанности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Конкретное описание предмета дарения (что именно передаётся).
        2. Тип предмета (вещь / имущественное право / освобождение от долга / иное).
        3. Явное указание на безвозмездность передачи.
        4. Признаки встречного предоставления (оплата, компенсация, обязательства одаряемого).
        5. Заверение о непритворности сделки.
        6. Момент передачи: немедленная передача или обещание в будущем.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — корректное дарение:
        Фрагмент:
        "Даритель безвозмездно передаёт в дар Одаряемому ноутбук Apple MacBook Pro
        серийный номер C02X12345, а Одаряемый принимает указанный дар.
        Настоящий договор не является притворной сделкой. Одаряемый не принимает
        на себя никаких обязательств перед Дарителем."

        Ответ:
        {
          "donation_subject_status": "defined",
          "donation_subject_value": "ноутбук Apple MacBook Pro серийный номер C02X12345",
          "donation_subject_type": "thing",
          "subject_specificity": "specific",
          "gratuitousness_status": "defined",
          "gratuitousness_explicitness": "explicit",
          "counter_performance_signs": "not_defined",
          "sham_prevention_status": "defined",
          "transfer_timing": "immediate",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель безвозмездно передаёт в дар Одаряемому ноутбук Apple MacBook Pro серийный номер C02X12345."
            }
          ]
        }

        Пример 2 — подозрительные формулировки:
        Фрагмент:
        "Даритель передаёт имущество Одаряемому в обмен на добросовестное отношение
        и уход."

        Ответ:
        {
          "donation_subject_status": "not_defined",
          "donation_subject_value": "Данные не определены",
          "donation_subject_type": "not_defined",
          "subject_specificity": "not_defined",
          "gratuitousness_status": "not_defined",
          "gratuitousness_explicitness": "contradicted",
          "counter_performance_signs": "defined",
          "sham_prevention_status": "not_defined",
          "transfer_timing": "immediate",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель передаёт имущество Одаряемому в обмен на добросовестное отношение и уход."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Описан ли предмет дарения конкретно с индивидуализирующими признаками?
        2. Есть ли слово "безвозмездно" или "в дар" — прямо написано?
        3. Есть ли любое упоминание обязательств одаряемого перед дарителем?
        4. "В обмен на", "при условии", "за уход" — это признаки встречного предоставления.
        5. Есть ли заверение о непритворности?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "donation_subject_status": "<defined / not_defined>",
          "donation_subject_value": "<описание предмета или 'Данные не определены'>",
          "donation_subject_type": "<thing / right / debt_release / mixed / not_defined>",
          "subject_specificity": "<specific / vague / not_defined>",
          "gratuitousness_status": "<defined / not_defined>",
          "gratuitousness_explicitness": "<explicit / implied / contradicted / not_defined>",
          "counter_performance_signs": "<defined / not_defined>",
          "sham_prevention_status": "<defined / not_defined>",
          "transfer_timing": "<immediate / future_promise / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "безвозмездно в дар предмет дарения имущественное право освобождение от обязанности передаёт в дар объект дарения не является притворной сделкой безвозмездный характер даритель одаряемый ст. 572 ГК РФ немедленная передача обещание дарения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "отмена дарения"
        - "отмена"
        - "обременения"
        - "залог"
        - "арест"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "ЕГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "donation_subject_and_gratuitousness_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения
        предмет дарения, его тип и признаки безвозмездности.
        Не анализируй отмену дарения, стороны и налоги.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. donation_subject_and_gratuitousness_presence:
           Агрегатное signal-поле — наличие регулирования по теме предмета и безвозмездности.
           - "present" — если хотя бы одно из содержательных полей
             (donation_subject_status, gratuitousness_status,
              counter_performance_signs)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - donation_subject_status = "not_defined";
           - gratuitousness_status = "not_defined";
           - counter_performance_signs = "not_defined";
           - donation_subject_type = subject_specificity =
             gratuitousness_explicitness = sham_prevention_status =
             transfer_timing = "not_defined";
           - donation_subject_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. donation_subject_status:
           - "defined" — если предмет дарения прямо описан с индивидуализирующими признаками
             или прямо указано, что предмет определяется по приложению, спецификации, акту;
           - "not_defined" — если предмет не описан, описан слишком абстрактно
             ("имущество" без конкретизации) или его нельзя надёжно определить.

        2. donation_subject_value:
           Краткое user-facing описание предмета дарения на русском языке.
           - если предмет конкретен: "ноутбук Apple MacBook Pro", "квартира по адресу ...";
           - если определяется через документ: "По Приложению №1", "Согласно Акту приёма-передачи";
           - если данных нет — "Данные не определены";
           - если противоречивы — "Не удалось определить".

        3. donation_subject_type:
           - "thing" — дарится вещь (движимое/недвижимое имущество);
           - "right" — дарится имущественное право (требование, право пользования);
           - "debt_release" — даритель освобождает одаряемого от обязанности;
           - "mixed" — в тексте прямо смешаны несколько объектов разных типов;
           - "not_defined" — тип не определён.

        4. subject_specificity:
           - "specific" — предмет индивидуализирован конкретно (серийный номер, адрес, кадастровый номер);
           - "vague" — предмет описан расплывчато без индивидуализации ("имущество", "вещи");
           - "not_defined" — предмет не описан.

        5. gratuitousness_status:
           - "defined" — если безвозмездность прямо выражена или прямо опровергнута;
           - "not_defined" — если безвозмездность не обсуждается в тексте.

        6. gratuitousness_explicitness:
           - "explicit" — прямо использованы слова "безвозмездно", "в дар", "без какого-либо встречного предоставления";
           - "implied" — безвозмездность следует из формулировки дарения, но без прямого слова;
           - "contradicted" — есть признаки встречного предоставления или встречных обязательств одаряемого;
           - "not_defined" — не определено.

        7. counter_performance_signs:
           - "defined" — если в тексте есть прямые признаки встречного предоставления
             ("в обмен на", "при условии", "за уход", "обязуется оплатить");
           - "not_defined" — если таких признаков нет.

        8. sham_prevention_status:
           - "defined" — если оговорка о непритворности прямо присутствует
             ("не является притворной сделкой", "не прикрывает иную сделку");
           - "not_defined" — если такой оговорки нет.

        9. transfer_timing:
           - "immediate" — дар передаётся при подписании / немедленно / сейчас;
           - "future_promise" — дарение обещано в будущем (ст. 572 п. 2 ГК РФ);
           - "not_defined" — момент передачи не указан.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни donation_subject_and_gratuitousness_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все enum-поля = "not_defined", donation_subject_value = "Данные не определены".
        - Только текст договора.
        - Не делай правовых выводов о переквалификации.
        - thing = дарится вещь.
        - right = дарится имущественное право.
        - debt_release = даритель освобождает одаряемого от обязанности.
        - mixed = в тексте прямо смешаны несколько объектов дарения разных типов.
        - specific = предмет индивидуализирован конкретно.
        - vague = предмет описан расплывчато без индивидуализации.
        - explicit = безвозмездность прямо названа словами "безвозмездно", "в дар".
        - implied = безвозмездность следует из формулировки дарения, но без прямого слова "безвозмездно".
        - contradicted = есть признаки встречного предоставления или встречных обязательств одаряемого.
        - immediate = дар передаётся сейчас / при подписании / немедленно.
        - future_promise = дарение обещано в будущем.
        - Если предмет определяется через приложение, спецификацию или акт — это "defined", не "not_defined".
        - "В обмен на", "при условии", "за уход" — признаки встречного предоставления (counter_performance_signs = "defined").
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни предмета дарения, ни указания на безвозмездность.
           → presence = "missing";
             все *_status = "not_defined";
             все enum-поля = "not_defined";
             donation_subject_value = "Данные не определены".

        2. Неполное раскрытие: общая формулировка без конкретизации.
           "Даритель передаёт в дар Одаряемому имущество" без описания,
           что именно. Безвозмездность прямо не названа.
           → presence = "present";
             donation_subject_status = "not_defined";
             subject_specificity = "vague";
             gratuitousness_explicitness = "implied";
             donation_subject_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте — "безвозмездно", в другом — "в обмен на уход".
           → presence = "unclear";
             gratuitousness_status = "not_defined";
             gratuitousness_explicitness = "contradicted";
             counter_performance_signs = "defined".

        4. Обещание дарения в будущем с отлагательным условием.
           "Даритель обязуется передать в дар после достижения Одаряемым 18 лет."
           → presence = "present";
             donation_subject_status = "defined" (если предмет описан);
             transfer_timing = "future_promise";
             gratuitousness_explicitness = "explicit".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для donation_subject_and_gratuitousness_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для donation_subject_type используй только: "thing", "right", "debt_release", "mixed", "not_defined".
        - Для subject_specificity используй только: "specific", "vague", "not_defined".
        - Для gratuitousness_explicitness используй только: "explicit", "implied", "contradicted", "not_defined".
        - Для counter_performance_signs и sham_prevention_status используй только: "defined" или "not_defined".
        - Для transfer_timing используй только: "immediate", "future_promise", "not_defined".
        - Fallback при отсутствии данных:
          * donation_subject_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * donation_subject_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "donation_subject_and_gratuitousness_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету и безвозмездности дарения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "donation_subject_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения предмета дарения."
          required: true

        - name: "donation_subject_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Предмет дарения"
          description: >
            Конкретное описание предмета дарения или user-facing указание на способ
            его определения, например: "ноутбук Apple MacBook Pro",
            "квартира по адресу ...", "По Приложению №1".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "donation_subject_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["thing", "right", "debt_release", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип предмета дарения."
          required: true

        - name: "subject_specificity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specific", "vague", "not_defined"]
          display_in_grid: false
          description: "Степень определённости предмета дарения."
          required: true

        - name: "gratuitousness_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о безвозмездности."
          required: true

        - name: "gratuitousness_explicitness"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["explicit", "implied", "contradicted", "not_defined"]
          display_in_grid: false
          description: "Способ выражения безвозмездности в тексте договора."
          required: true

        - name: "counter_performance_signs"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия признаков встречного предоставления."
          required: true

        - name: "sham_prevention_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о непритворности."
          required: true

        - name: "transfer_timing"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["immediate", "future_promise", "not_defined"]
          display_in_grid: false
          description: "Характер передачи дара: немедленно или в будущем."
          required: true

      store_payload: true

  - id: counter_performance_check
    name: "Встречное предоставление: риск переквалификации и притворности (ст. 572, 170 ГК РФ)"
    description: >
      Детекторная проверка наличия признаков встречного предоставления, несовместимых
      с дарением. Не оценивает "насколько это плохо" — только фиксирует факты.
    triggers: {}
    ui_mode: "risk_detection"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "компенсация"
        - "вознаграждение"
        - "встречное предоставление"
        - "в обмен на"
        - "содержание"
        - "уход"
        - "обязуется выплачивать"
        - "цена"
        - "ежемесячные платежи"
        - "арендная плата"
        - "рента"
        - "обязанности одаряемого"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+обмен\\s+на"
        - "(?i)обязуется\\s+содержать"
        - "(?i)цен[аыуеой]"
        - "(?i)оплат(а|ить|ы)"
        - "(?i)ежемесячн(ые|ых)\\s+платеж"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572 ГК РФ).
        Проверяется только один вопрос: наличие признаков встречного предоставления.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Твоя задача — НЕ оценивать серьёзность риска.
        - Твоя задача — найти в тексте конкретные формулировки, которые указывают
          на встречное предоставление (плату, обязательства одаряемого).
        - Если таких формулировок нет — counter_performance_found = "no".

        [ЗАДАЧА]
        Найди в тексте договора прямые признаки:
        1. Обязательства одаряемого перед дарителем (оплата, содержание, уход, услуги).
        2. Формулировки "в обмен на", "при условии", "взамен".
        3. Цену или компенсацию за передаваемое имущество.
        4. Ежемесячные/регулярные платежи от одаряемого к дарителю.
        5. Признаки ренты (пожизненное содержание, иждивение).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если признаков нет — "no" и пустой массив.
        3. Если признаки есть — "yes" с конкретными цитатами.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — признаки найдены:
        Фрагмент:
        "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется
        ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."

        Ответ:
        {
          "counter_performance_found": "yes",
          "counter_performance_types": ["ежемесячные платежи", "условие пожизненных выплат"],
          "reclassification_target": "annuity",
          "protective_clause_present": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."
            }
          ]
        }

        Пример 2 — признаков нет:
        Фрагмент:
        "Даритель безвозмездно передаёт в дар Одаряемому автомобиль.
        Одаряемый не несёт никаких обязательств перед Дарителем."

        Ответ:
        {
          "counter_performance_found": "no",
          "counter_performance_types": [],
          "reclassification_target": "not_applicable",
          "protective_clause_present": "defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли любая фраза об обязательствах одаряемого?
        2. Есть ли слова "в обмен на", "взамен", "при условии"?
        3. Есть ли упоминание цены, суммы, платежей от одаряемого?
        4. Есть ли признаки ренты (уход, содержание, иждивение)?
        5. Если ничего нет — "no" и пустой массив.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "counter_performance_found": "<yes / no>",
          "counter_performance_types": ["<тип1>", "<тип2>"],
          "reclassification_target": "<sale / exchange / annuity / sham / not_applicable>",
          "protective_clause_present": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата компенсация вознаграждение встречное предоставление в обмен на содержание уход обязуется выплачивать цена ежемесячные платежи рента обязанности одаряемого взамен при условии притворная сделка переквалификация ст. 170 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "безвозмездно"
        - "в дар"
        - "не является притворной"
        - "одаряемый не несёт обязательств"
        - "отмена дарения"
        - "обременения"
        - "залог"
        - "арест"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 550

      compact_output: false

      presence_signal:
        field: "counter_performance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Найди прямые признаки встречного предоставления
        в договоре дарения.
        Не оценивай риски и серьёзность последствий. Только фиксируй факты.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. counter_performance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме встречного предоставления.
           - "present" — если reclassification_target ∈ {sale, exchange, annuity, sham}
             ИЛИ protective_clause_present = "defined"
             ИЛИ counter_performance_types содержит хотя бы один элемент;
           - "missing" — если reclassification_target = "not_applicable"
             И protective_clause_present = "not_defined"
             И counter_performance_types = [];
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - reclassification_target = "not_applicable";
           - protective_clause_present = "not_defined";
           - counter_performance_types = [];
           - не выполняй остальные шаги.

        1. counter_performance_types:
           Список типов встречного предоставления, прямо найденных в тексте договора.
           Примеры элементов: "ежемесячные платежи", "содержание", "уход",
           "оплата", "компенсация", "встречная передача имущества",
           "обязательство по уходу", "пожизненное содержание".
           Если признаков нет — пустой массив [].

        2. reclassification_target:
           Наиболее вероятная альтернативная квалификация сделки:
           - "sale" — встречное предоставление выглядит как оплата или цена;
           - "exchange" — встречное предоставление выглядит как встречная передача имущества;
           - "annuity" — встречное предоставление выглядит как содержание, уход, регулярные выплаты;
           - "sham" — текст указывает на иную притворную конструкцию, но без ясной альтернативной модели;
           - "not_applicable" — признаков встречного предоставления нет.

        3. protective_clause_present:
           - "defined" — если прямо сказано, что одаряемый не несёт встречных обязательств
             ("Одаряемый не несёт никаких обязательств перед Дарителем",
              "без какого-либо встречного предоставления");
           - "not_defined" — если такой оговорки нет.

        Если признаков встречного предоставления нет:
        - counter_performance_types = []
        - reclassification_target = "not_applicable"
        </task>

        <context_rules>
        - Перед остальными полями заполни counter_performance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — reclassification_target = "not_applicable", protective_clause_present = "not_defined", counter_performance_types = [].
        - Только текст договора.
        - counter_performance_types непуст только если в тексте есть прямые признаки встречного предоставления (оплата, содержание, уход, "в обмен на").
        - sale = встречное предоставление выглядит как оплата или цена.
        - exchange = встречное предоставление выглядит как встречная передача имущества.
        - annuity = встречное предоставление выглядит как содержание, уход, регулярные выплаты.
        - sham = текст указывает на иную притворную конструкцию, но без ясной альтернативной модели.
        - not_applicable = признаков встречного предоставления нет.
        - protective_clause_present = defined только если прямо сказано, что одаряемый не несёт встречных обязательств.
        - "В обмен на", "при условии", "взамен", "за уход", "обязуется содержать" — прямые признаки встречного предоставления.
        - Если в разных фрагментах указаны противоречивые данные (в одном — "безвозмездно", в другом — "в обмен на"), верни presence = "unclear".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания встречного предоставления, ни защитной оговорки.
           → presence = "missing";
             reclassification_target = "not_applicable";
             protective_clause_present = "not_defined";
             counter_performance_types = [].

        2. Защитная оговорка без признаков встречного предоставления.
           "Одаряемый не несёт никаких обязательств перед Дарителем."
           → presence = "present";
             reclassification_target = "not_applicable";
             protective_clause_present = "defined";
             counter_performance_types = [].

        3. Противоречие между фрагментами.
           В одном пункте — "безвозмездно", в другом — "в обмен на уход и содержание".
           → presence = "unclear";
             reclassification_target = "not_applicable";
             counter_performance_types содержит найденные признаки.

        4. Признаки ренты / пожизненного содержания.
           "Одаряемый обязуется пожизненно содержать Дарителя и выплачивать
           ежемесячно 20 000 рублей."
           → presence = "present";
             reclassification_target = "annuity";
             counter_performance_types = ["пожизненное содержание", "ежемесячные платежи"].
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для counter_performance_check_presence используй только: "present", "missing", "unclear".
        - Для reclassification_target используй только: "sale", "exchange", "annuity", "sham", "not_applicable".
        - Для protective_clause_present используй только: "defined" или "not_defined".
        - Для counter_performance_types используй массив строк на русском языке (пустой массив при отсутствии признаков).
        - Fallback при отсутствии данных:
          * counter_performance_types → [];
          * reclassification_target → "not_applicable";
          * protective_clause_present → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * counter_performance_check_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "counter_performance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие темы встречного предоставления в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "counter_performance_types"
          type: "string_list"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Признаки встречного предоставления"
          description: >
            Типы встречного предоставления, прямо найденные в тексте договора.
            Примеры: "ежемесячные платежи", "содержание", "уход", "оплата".
            Fallback: пустой массив [].
          required: false

        - name: "reclassification_target"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["sale", "exchange", "annuity", "sham", "not_applicable"]
          display_in_grid: false
          description: "Наиболее вероятная альтернатива квалификации сделки при наличии встречного предоставления."
          required: true

        - name: "protective_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия защитной оговорки об отсутствии обязательств одаряемого."
          required: true

      store_payload: true

  - id: promise_of_gift_form_and_specificity
    name: "Обещание дарения: форма, определённость предмета, допустимость (ст. 572, 574, 581 ГК РФ)"
    description: >
      Фактографическая проверка признаков обещания дарения: письменная форма,
      конкретность предмета, допустимость условия вступления в силу,
      наследственные последствия обещания (ст. 581 ГК РФ).
    triggers:
      any: ["promise_of_gift"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обещает подарить"
        - "обязуется передать"
        - "в будущем"
        - "после наступления условия"
        - "обещание дарения"
        - "после"
        - "впоследствии"
        - "письменная форма"
        - "наследники"
        - "смерть дарителя"
        - "смерть одаряемого"
        - "переходит к наследникам"
        - "прекращается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеща(ет|ние)\\s+подар"
        - "(?i)обязуется\\s+передать"
        - "(?i)в\\s+будущем"
        - "(?i)наследник"
        - "(?i)смерт[ьи]\\s+(дарителя|одаряемого)"
        - "(?i)переходит\\s+к\\s+наследник"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор, содержащий обещание дарения (ст. 572 ч. 2, ст. 574, ст. 581 ГК РФ).
        Проверяется только один вопрос: признаки обещания дарения, форма, определённость
        и наследственные последствия.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признаки обещания дарения (передача в будущем, "обязуется передать").
        2. Соблюдение письменной формы.
        3. Конкретность предмета обещания (не "всё имущество" или неопределённый дар).
        4. Условие, при наступлении которого обещание вступает в силу.
        5. Оговорку о переходе обязанности к наследникам дарителя или о прекращении
           обещания при смерти одаряемого (ст. 581 ГК РФ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель обязуется передать Одаряемому в будущем автомобиль Toyota Camry,
        VIN XW7BF4FK30S123456, после окончания обучения Одаряемого.
        В случае смерти Дарителя до передачи дара обязанность переходит к его наследникам."

        Ответ:
        {
          "promise_of_gift_status": "defined",
          "written_form_status": "defined",
          "subject_specificity_status": "defined",
          "subject_specificity_code": "specific",
          "triggering_condition_status": "defined",
          "triggering_condition_details": "после окончания обучения Одаряемого",
          "heir_succession_clause_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель обязуется передать Одаряемому в будущем автомобиль Toyota Camry, VIN XW7BF4FK30S123456, после окончания обучения Одаряемого."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель обещает подарить Одаряемому всё своё имущество в будущем."

        Ответ:
        {
          "promise_of_gift_status": "defined",
          "written_form_status": "defined",
          "subject_specificity_status": "defined",
          "subject_specificity_code": "all_property",
          "triggering_condition_status": "not_defined",
          "triggering_condition_details": "Данные не определены",
          "heir_succession_clause_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель обещает подарить Одаряемому всё своё имущество в будущем."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слова "обещает подарить", "обязуется передать в будущем"?
        2. Конкретен ли предмет или написано "всё имущество"?
        3. Есть ли условие вступления в силу?
        4. Упомянуты ли наследники или последствия смерти сторон?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "promise_of_gift_status": "<defined / not_defined>",
          "written_form_status": "<defined / not_defined>",
          "subject_specificity_status": "<defined / not_defined>",
          "subject_specificity_code": "<specific / vague / all_property / not_defined>",
          "triggering_condition_status": "<defined / not_defined>",
          "triggering_condition_details": "<текст условия или 'Данные не определены'>",
          "heir_succession_clause_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обещает подарить обязуется передать в будущем после наступления условия обещание дарения впоследствии письменная форма всё имущество ст. 572 ГК РФ ч. 2 ст. 574 ГК РФ ст. 581 ГК РФ условие вступления в силу определённость предмета наследники смерть дарителя смерть одаряемого переходит к наследникам прекращается"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "безвозмездно передаёт в дар немедленно"
        - "оплата"
        - "компенсация"
        - "в обмен на"
        - "отмена дарения"
        - "обременения"
        - "залог"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "promise_of_gift_form_and_specificity_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения признаки
        обещания дарения в будущем: форма, конкретность предмета, условие
        вступления в силу, наследственные последствия (ст. 581 ГК РФ).
        Не анализируй стороны, безвозмездность, передачу или отмену дарения.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. promise_of_gift_form_and_specificity_presence:
           Агрегатное signal-поле — наличие регулирования по теме обещания дарения.
           - "present" — если хотя бы одно из содержательных полей
             (promise_of_gift_status, written_form_status,
              subject_specificity_status, triggering_condition_status,
              heir_succession_clause_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - promise_of_gift_status = "not_defined";
           - written_form_status = "not_defined";
           - subject_specificity_status = "not_defined";
           - subject_specificity_code = "not_defined";
           - triggering_condition_status = "not_defined";
           - heir_succession_clause_status = "not_defined";
           - triggering_condition_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. promise_of_gift_status:
           - "defined" — если обещание дарения в будущем прямо присутствует
             ("обязуется передать", "обещает подарить", "передаст в будущем");
           - "not_defined" — если обещание дарения не упомянуто или передача
             описана как немедленная.

        2. written_form_status:
           - "defined" — если соблюдение письменной формы прямо подтверждено
             (договор подписан в письменной форме, есть указание на ст. 574 ГК РФ);
           - "not_defined" — если письменная форма не обсуждается.

        3. subject_specificity_status:
           - "defined" — если предмет обещания конкретно описан или прямо
             определяется через приложение, спецификацию, акт;
           - "not_defined" — если предмет не описан или описан слишком абстрактно.

        4. subject_specificity_code:
           - "specific" — предмет индивидуализирован конкретно (VIN, адрес,
             кадастровый номер, серийный номер);
           - "vague" — предмет описан расплывчато ("имущество", "вещи")
             без индивидуализации;
           - "all_property" — фраза типа "всё своё имущество" (ничтожно
             по ст. 572 п. 4 ГК РФ, но фиксируй как есть);
           - "not_defined" — предмет не описан.

        5. triggering_condition_status:
           - "defined" — если условие вступления обещания в силу прямо указано
             ("после окончания обучения", "по достижении 18 лет",
              "после смерти Дарителя");
           - "not_defined" — если условие не указано.

        6. triggering_condition_details:
           Краткое user-facing описание условия вступления в силу на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. heir_succession_clause_status:
           - "defined" — если в договоре прямо урегулированы наследственные
             последствия обещания дарения (ст. 581 ГК РФ):
             * переход обязанности к наследникам дарителя при его смерти
               до передачи дара ("обязанность переходит к наследникам Дарителя");
             * прекращение обещания при смерти одаряемого до принятия дара
               ("обещание прекращается в случае смерти Одаряемого");
             * прямое исключение перехода к наследникам
               ("обязанность не переходит к наследникам Дарителя");
           - "not_defined" — если наследственные последствия не обсуждаются.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни promise_of_gift_form_and_specificity_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", subject_specificity_code = "not_defined", triggering_condition_details = "Данные не определены".
        - Используй только текст договора.
        - "all_property" = фраза типа "всё своё имущество" — это ничтожно по ст. 572 ГК РФ, фиксируй как есть.
        - Не анализируй, является ли условие законным.
        - Если предмет определяется через приложение, спецификацию или акт — это "defined", не "not_defined".
        - heir_succession_clause_status = "defined" при любом прямом упоминании наследственных последствий: как при переходе к наследникам, так и при исключении перехода, так и при прекращении обещания. Фиксируй факт наличия оговорки, не оценивай её содержание.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обещания дарения, ни указания на будущую передачу,
           ни наследственных последствий.
           → presence = "missing";
             все *_status = "not_defined";
             subject_specificity_code = "not_defined";
             triggering_condition_details = "Данные не определены".

        2. Немедленная передача без обещания.
           "Даритель безвозмездно передаёт в дар Одаряемому автомобиль"
           без указания на будущую передачу и без наследственных оговорок.
           → promise_of_gift_status = "not_defined";
             если все пять содержательных полей = "not_defined"
             → presence = "missing".

        3. Противоречие между фрагментами.
           В одном пункте — "передаёт немедленно", в другом — "обязуется
           передать после регистрации".
           → presence = "unclear";
             promise_of_gift_status = "not_defined";
             triggering_condition_details = "Не удалось определить".

        4. Обещание «всего имущества» с наследственной оговоркой.
           "Даритель обещает подарить Одаряемому всё своё имущество.
           В случае смерти Дарителя обязанность переходит к его наследникам."
           → presence = "present";
             promise_of_gift_status = "defined";
             subject_specificity_status = "defined";
             subject_specificity_code = "all_property";
             heir_succession_clause_status = "defined";
             triggering_condition_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для promise_of_gift_form_and_specificity_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для subject_specificity_code используй только: "specific", "vague", "all_property", "not_defined".
        - Fallback при отсутствии данных:
          * triggering_condition_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * triggering_condition_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "promise_of_gift_form_and_specificity_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме обещания дарения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "promise_of_gift_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия обещания дарения в будущем."
          required: true

        - name: "written_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус соблюдения письменной формы обещания."
          required: true

        - name: "subject_specificity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определённости предмета обещания дарения."
          required: true

        - name: "subject_specificity_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specific", "vague", "all_property", "not_defined"]
