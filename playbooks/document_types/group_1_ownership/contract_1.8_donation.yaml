        - "с момента передачи"
        - "вручение"
        - "передаётся"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)с\\s+момента\\s+передач"

  - id: "donation_revocation_clause"
    name: "Отмена дарения и отказ от исполнения"
    description: "Проверяет наличие законных оснований отмены дарения/отказа от исполнения"
    legal_base: "ст. 577-578 ГК РФ"
