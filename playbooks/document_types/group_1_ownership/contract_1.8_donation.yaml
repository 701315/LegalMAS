      - "(?i)близк[иоя]+\\s+родственник[ии]\\s+отсутствуют"
      - "(?i)\\bНДФЛ\\b"
      - "(?i)налог\\s+на\\s+дарени[ея]"
      - "(?i)одаряем[ыо]й\\s+уплачивает\\s+налог"

  bankruptcy_risk_donor:
    any_keywords:
      - "(?i)\\bбанкротств[оа]\\b"
      - "(?i)\\bнесостоятельност[ьи]\\b"
      - "(?i)\\bкредитор[ыаов]\\b"
      - "(?i)конкурсн[а-яё]+\\s+масс[аа]"
      - "(?i)оспаривани[ея]\\s+сделк[ии]"
      - "(?i)арбитражн[а-яё]+\\s+управляющ[иаяй]"
      - "(?i)признак[ии]\\s+неплатежеспособност[ии]"

  minor_or_incapacitated_party:
    any_keywords:
      - "(?i)\\bмалолетн[иияё]+\\b"
      - "(?i)\\bнесовершеннолетн[иияё]+\\b"
      - "(?i)\\bнедееспособн[а-яё]+\\b"
      - "(?i)ограниченн[оа]\\s+дееспособн[а-яё]+"
      - "(?i)законн[ыо]й\\s+представител[ья]"
      - "(?i)орган\\s+опек[ии]"
      - "(?i)\\bопекун\\b"
      - "(?i)\\bпопечител[ья]\\b"

  share_gift:
    any_keywords:
      - "(?i)дарени[ея]\\s+дол[ии]"
      - "(?i)дол[яьи]\\s+в\\s+уставн[оа]м\\s+капитал[ее]"
      - "(?i)дол[яьи]\\s+в\\s+ООО"
      - "(?i)передать\\s+дол[юьи]\\s+безвозмездно"
      - "(?i)подарить\\s+дол[юьи]"
      - "(?i)нотариальн[а-яё]+\\s+удостоверени[ея]\\s+дол[ии]"
      - "(?i)\\bЕГРЮЛ\\b"

  monetary_gift:
    any_keywords:
      - "(?i)денежн[ыа]е\\s+средств[аа]"
      - "(?i)денежн[а-яё]+\\s+сумм[аа]"
      - "(?i)передать\\s+деньг[ии]"
      - "(?i)подарить\\s+деньг[ии]"
      - "(?i)безвозмездн[а-яё]+\\s+передач[аи]\\s+денег"
      - "(?i)дарени[ея]\\s+денежн[ыа]х\\s+средств"

  government_official_donee:
    any_keywords:
      - "(?i)государственн[ыо]й\\s+служащ[иаяй]"
      - "(?i)муниципальн[ыо]й\\s+служащ[иаяй]"
      - "(?i)должностн[оа]е\\s+лиц[оа]"
      - "(?i)работник\\s+образовательн[оа]й\\s+организаци[ии]"
      - "(?i)работник\\s+медицинск[оа]й\\s+организаци[ии]"
      - "(?i)работник\\s+социальн[оа]й\\s+служб[ыы]"
      - "(?i)лиц[оа],?\\s+замещающ[еёа-я]+\\s+государственн[уо]ю\\s+должност[ььи]"
      - "(?i)\\bчиновник\\b"

  joint_property_gift:
    any_keywords:
      - "(?i)общ[а-яё]+\\s+собственност[ьи]"
      - "(?i)совместн[а-яё]+\\s+собственност[ьи]"
      - "(?i)долев[а-яё]+\\s+собственност[ьи]"
      - "(?i)согласи[ея]\\s+сособственник[оа]в"
      - "(?i)согласи[ея]\\s+всех\\s+участник[оа]в"
      - "(?i)общ[ео]е\\s+имуществ[оа]"
      - "(?i)дол[яьи]\\s+в\\s+праве\\s+общей\\s+собственност[ьи]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  passport_pattern: "(?i)\\b\\d{2}\\s?\\d{2}\\s?\\d{6}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "commercial_entities_gift_prohibition"
    name: "Запрет дарения между коммерческими организациями (ст. 575 ГК РФ)"
    description: >
      Дарение между коммерческими организациями запрещено, кроме обычных подарков
      небольшой стоимости. При формальном оформлении договора дарения между двумя
      коммерческими организациями существует высокий риск ничтожности сделки.
    legal_base: "ст. 575 ГК РФ"
    required_triggers: ["commercial_entities_both"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "дарение"
        - "безвозмездно"
        - "даритель"
        - "одаряемый"
        - "ООО"
        - "АО"
        - "коммерческая организация"
      keyword_mode: "any"
      negative_keywords:
        - "обычный подарок"
        - "до 3000 рублей"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ст. 575 ГК РФ"
        - "коммерческая организация"
        - "дарение"
      rerank: true

  - id: "counter_performance_reclassification_risk"
    name: "Риск переквалификации дарения при встречном предоставлении"
    description: >
      Наличие цены, компенсации, ухода, содержания, обязательства передать имущество
      в ответ или иного встречного предоставления несовместимо с дарением и создаёт
      риск переквалификации сделки либо признания её притворной.
    legal_base: "ст. 572, 170 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warning" 
    detector_type: "rules"
    rules:
      keywords:
        - "встречное предоставление"
        - "оплата"
        - "компенсация"
        - "вознаграждение"
        - "в обмен на"
        - "содержание"
        - "уход"
        - "обязуется выплачивать"
        - "цена"
        - "ежемесячные платежи"
        - "стоимость"
        - "арендная плата"
        - "рента"
      keyword_mode: "any"
      negative_keywords:
        - "не предусматривает встречного предоставления"
        - "безвозмездно"
        - "без какого-либо встречного"
        - "без оплаты"
        - "без компенсации"
        - "стороны подтверждают безвозмездный характер"
    retrieval:
      context_k: 6
      boost_keywords:
        - "встречное предоставление"
        - "оплата"
        - "компенсация"
        - "притворная сделка"
      rerank: true

  - id: "bankruptcy_challenge_risk"
    name: "Риск оспаривания дарения при банкротстве дарителя"
    description: >
      Безвозмездные сделки дарителя могут быть оспорены в банкротстве как причиняющие
      вред имущественным правам кредиторов либо как подозрительные сделки.
    legal_base: "ФЗ № 127-ФЗ «О несостоятельности (банкротстве)», ст. 61.2-61.3"
    required_triggers: ["bankruptcy_risk_donor"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "кредиторы"
        - "конкурсная масса"
        - "оспаривание сделки"
        - "неплатежеспособность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "банкротство"
        - "кредиторы"
        - "оспаривание сделки"
      rerank: true

  - id: "minor_incapacitated_gift_restriction"
    name: "Запрет/ограничения дарения от имени малолетних и недееспособных"
    description: >
      Дарение от имени малолетних и граждан, признанных недееспособными,
      в общем случае запрещено; сделки с их участием требуют повышенной проверки.
    legal_base: "ст. 575, 576 ГК РФ, ст. 28, 29, 37 ГК РФ"
    required_triggers: ["minor_or_incapacitated_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "малолетний"
        - "несовершеннолетний"
        - "недееспособный"
        - "опекун"
        - "попечитель"
        - "законный представитель"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "малолетний"
        - "недееспособный"
        - "опекун"
      rerank: true

  - id: "public_official_gift_prohibition"
    name: "Запрет дарения госслужащим, работникам образования, медицины, соцслужб (ст. 575 п. 2-3 ГК РФ)"
    description: >
      Не допускается дарение (за исключением обычных подарков до 3000 руб.):
      работникам образовательных, медицинских, социальных организаций — от лиц,
      находящихся на их содержании/лечении/воспитании; лицам, замещающим
      государственные и муниципальные должности, — в связи с исполнением
      должностных обязанностей. Нарушение влечёт ничтожность.
    legal_base: "ст. 575 п. 2-3 ГК РФ, ФЗ-79 «О госслужбе»"
    required_triggers: ["government_official_donee"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "государственный служащий"
        - "муниципальный служащий"
        - "должностное лицо"
        - "работник образовательной организации"
        - "работник медицинской организации"
        - "работник социальной службы"
        - "в связи с должностными обязанностями"
      keyword_mode: "any"
      negative_keywords:
        - "обычный подарок"
        - "до 3000 рублей"
        - "протокольное мероприятие"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ст. 575 ГК"
        - "государственный служащий"
        - "должностное лицо"
        - "запрет дарения"
      rerank: true

  - id: "joint_property_consent_required"
    name: "Дарение общего имущества: согласие всех сособственников (ст. 576 п. 2, 253 ГК РФ)"
    description: >
      Дарение имущества, находящегося в общей совместной собственности, допускается
      по согласию всех участников. Дарение доли в общей долевой собственности
      допускается с соблюдением правил. Отсутствие согласия создаёт риск
      оспаривания сделки.
    legal_base: "ст. 576 п. 2, 246, 253 ГК РФ"
    required_triggers: ["joint_property_gift"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "общая собственность"
        - "совместная собственность"
        - "согласие сособственников"
        - "согласие всех участников"
        - "долевая собственность"
        - "согласие участников общей собственности"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "общая собственность"
        - "согласие сособственников"
        - "ст. 576 ГК"
        - "ст. 253 ГК"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: donation_subject_and_gratuitousness_extraction
    name: "Дарение: извлечение предмета и подтверждение безвозмездности"
    description: >
      Извлекает предмет дарения, тип дара, сведения о сторонах и проверяет,
      выражена ли безвозмездность явно и недвусмысленно.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "даритель"
        - "одаряемый"
        - "безвозмездно"
        - "в дар"
        - "предмет дарения"
        - "имущественное право"
        - "освобождение от обязанности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дарител[ья].*одаряем"
        - "(?i)безвозмездн"
        - "(?i)в\\s+дар"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор дарения.
        Найди в тексте предмет дарения и проверь, выражена ли безвозмездность.

        Ответь строго в JSON:
        {
          "donation_subject": "<описание предмета дарения или not_found>",
          "donation_subject_type": "<thing / right / debt_release / mixed / not_found>",
          "gratuitousness_status": "<explicit / implied / contradicted / not_found>",
          "counter_performance_signs": ["<признак1>", "<признак2>"],
          "transfer_timing": "<immediate / future_promise / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "explicit" — безвозмездность прямо указана
        - "implied" — дарение прослеживается, но формулировки слабы
        - "contradicted" — есть признаки встречного предоставления
        - "not_found" — не найдено

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "безвозмездно"
        - "в дар"
        - "даритель"
        - "одаряемый"
        - "предмет дарения"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "donation_subject"
          type: "string"
          keyword_hints: ["предмет", "в дар", "имущество", "право требования", "освобождение от обязанности"]
          description: "Предмет дарения"
        - name: "donation_subject_type"
          type: "string"
          allowed_values: ["thing", "right", "debt_release", "mixed", "not_found"]
          description: "Тип предмета дарения"
        - name: "gratuitousness_status"
          type: "string"
          allowed_values: ["explicit", "implied", "contradicted", "not_found"]
          description: "Статус безвозмездности"
        - name: "transfer_timing"
          type: "string"
          allowed_values: ["immediate", "future_promise", "not_found"]
          description: "Дарение сейчас или обещание в будущем"
      store_payload: true

  - id: counter_performance_check
    name: "Дарение: отсутствие встречного предоставления (ст. 572 ГК РФ)"
    description: >
      Проверяет, не содержатся ли в договоре элементы, несовместимые с дарением:
      оплата, содержание, уход, компенсация, встречная передача имущества или услуг.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "компенсация"
        - "вознаграждение"
        - "встречное предоставление"
        - "в обмен на"
        - "содержание"
        - "уход"
        - "обязуется выплачивать"
        - "цена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+обмен\\s+на"
        - "(?i)обязуется\\s+содержать"
        - "(?i)цен[аыуеой]"
        - "(?i)оплат(а|ить|ы)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор дарения.
        Проверь наличие признаков встречного предоставления, несовместимых с дарением.

        Ответь строго в JSON:
        {
          "counter_performance_detected": "<yes / no / unclear>",
          "counter_performance_types": ["<тип1>", "<тип2>"],
          "reclassification_risk": "<gift_valid / sham_or_reclassify / unclear>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если встречное предоставление явно не обнаружено — пиши "no".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "встречное предоставление"
        - "оплата"
        - "компенсация"
        - "уход"
        - "содержание"
        - "цена"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "counter_performance_detected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Выявлено ли встречное предоставление"
        - name: "reclassification_risk"
          type: "string"
          allowed_values: ["gift_valid", "sham_or_reclassify", "unclear"]
          description: "Риск переквалификации"
      store_payload: true

  - id: promise_of_gift_form_and_specificity
    name: "Обещание дарения: форма и определённость предмета (ст. 572, 574 ГК РФ)"
    description: >
      Проверяет, соблюдены ли требования к обещанию дарения:
      письменная форма, конкретный предмет, отсутствие обещания подарить всё имущество.
    triggers:
      any: ["promise_of_gift"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обещает подарить"
        - "обязуется передать"
        - "в будущем"
        - "после наступления условия"
        - "обещание дарения"
        - "после"
        - "впоследствии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеща(ет|ние)\\s+подар"
        - "(?i)обязуется\\s+передать"
        - "(?i)в\\s+будущем"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор дарения.
        Проверь, является ли документ обещанием дарения и соблюдены ли требования к нему.

        Ответь строго в JSON:
        {
          "promise_of_gift_present": "<yes / no>",
          "written_form_observed": "<yes / no / unclear>",
          "subject_specificity": "<specific / vague / all_property / not_found>",
          "invalidity_risk": "<high / medium / low>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Обещание подарить всё имущество или неопределённый дар — высокий риск недействительности.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "обещание дарения"
        - "обязуется передать"
        - "в будущем"
        - "всё имущество"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "promise_of_gift_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Есть ли обещание дарения"
        - name: "subject_specificity"
          type: "string"
          allowed_values: ["specific", "vague", "all_property", "not_found"]
          description: "Определённость предмета обещания"
        - name: "invalidity_risk"
          type: "string"
          allowed_values: ["high", "medium", "low"]
          description: "Риск недействительности обещания"
      store_payload: true

  - id: donation_revocation_and_refusal_check
    name: "Отмена дарения / отказ от исполнения (ст. 577-578 ГК РФ)"
    description: >
