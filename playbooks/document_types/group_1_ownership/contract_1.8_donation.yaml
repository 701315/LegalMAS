        - "нотариальное удостоверение"
        - "ЕГРЮЛ"
        - "устав"
        - "преимущественное право"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "notarization_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Нотариальная форма"
        - name: "charter_restrictions_addressed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Учтены ли уставные ограничения"
        - name: "preemptive_right_addressed"
          type: "string"
          allowed_values: ["complied", "not_applicable", "not_addressed", "not_found"]
          description: "Статус преимущественного права"
      store_payload: true


  - id: co_ownership_consent_check
    name: "Дарение общего/совместного имущества: согласие сособственников (ст. 576 п. 2, 253 ГК РФ)"
    description: >
      Проверяет, урегулирован ли вопрос согласия сособственников или супруга
      при дарении имущества, находящегося в общей (совместной или долевой) собственности.
    triggers:
      any: ["joint_property_gift", "spousal_consent_relevant"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "общая собственность"
        - "совместная собственность"
        - "долевая собственность"
        - "согласие сособственников"
        - "согласие всех участников"
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "личная собственность"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+(всех\\s+)?участник"
        - "(?i)согласи(е|я)\\s+сособственник"
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)общ(ая|ей)\\s+(совместн|долев)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор дарения.
        Проверь, урегулирован ли вопрос согласия при дарении общего имущества
        или совместно нажитого имущества (ст. 576 п. 2, 253 ГК РФ, ст. 35 СК РФ).

        Ответь строго в JSON:
        {
          "ownership_regime": "<sole / joint / shared / unclear / not_found>",
          "co_owner_consent_status": "<obtained / not_required_stated / not_addressed / not_found>",
          "spousal_consent_status": "<consent_present / not_married_confirmed / not_addressed / not_found>",
          "consent_risk": "<high / medium / low>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "sole" — единоличная собственность
        - "joint" — совместная собственность (без определения долей)
        - "shared" — долевая собственность
        - "obtained" — согласие получено
        - "not_required_stated" — прямо указано, что согласие не требуется (личная собственность)

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "общая собственность"
        - "согласие сособственников"
        - "согласие супруга"
        - "ст. 576 ГК"
        - "ст. 253 ГК"
        - "ст. 35 СК"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ownership_regime"
          type: "string"
          allowed_values: ["sole", "joint", "shared", "unclear", "not_found"]
          description: "Режим собственности"
        - name: "co_owner_consent_status"
          type: "string"
          allowed_values: ["obtained", "not_required_stated", "not_addressed", "not_found"]
          description: "Статус согласия сособственников"
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["consent_present", "not_married_confirmed", "not_addressed", "not_found"]
          description: "Статус согласия супруга"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора: идентификация дарителя и одаряемого"
    description: "Проверяет наличие и достаточность идентификации сторон"
    legal_base: "ст. 432, 572 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "даритель"
        - "одаряемый"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(даритель|одаряемый).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "donor_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип дарителя"
        - name: "donee_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип одаряемого"
      store_payload: true

  - id: "gratuitousness_required"
    name: "Безвозмездность — обязательный квалифицирующий признак дарения (ст. 572 ГК РФ)"
    description: "Проверяет наличие прямого указания на безвозмездный характер передачи"
    legal_base: "ст. 572 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "безвозмездно"
        - "в дар"
        - "безвозмездная передача"
        - "не предусматривает встречного предоставления"
        - "дарение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безвозмездн"
        - "(?i)в\\s+дар"

  - id: "subject_identification"
    name: "Предмет дарения: определённость и индивидуализация (ст. 572 ГК РФ)"
    description: "Проверяет наличие определённого предмета дарения — вещи, права или освобождения от обязанности"
    legal_base: "ст. 572 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "предмет договора"
        - "имущество"
        - "имущественное право"
        - "освобождение от обязанности"
        - "передаёт в дар"
        - "объект дарения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переда[её]т\\s+в\\s+дар"
        - "(?i)предмет\\s+договор"

  - id: "written_form_for_promise"
    name: "Письменная форма для обещания дарения (ст. 574 ГК РФ)"
    description: "Проверяет соблюдение письменной формы и определённости предмета при обещании дарения"
    legal_base: "ст. 572, 574 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["promise_of_gift"]
    rules:
      keywords:
        - "обещание дарения"
        - "обязуется передать"
        - "обещает подарить"
        - "в будущем"
        - "письменная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеща(ет|ние)\\s+подар"
        - "(?i)обязуется\\s+передать"

  - id: "commercial_gift_restriction_check"
    name: "Ограничение дарения между коммерческими организациями (ст. 575 ГК РФ)"
    description: "Проверяет наличие признаков запрещённого дарения между коммерческими организациями"
    legal_base: "ст. 575 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["commercial_entities_both"]
    rules:
      keywords:
        - "ООО"
        - "АО"
        - "коммерческая организация"
        - "безвозмездно"
        - "даритель"
        - "одаряемый"
        - "обычный подарок"
        - "3000 рублей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(ООО|АО|ПАО|ЗАО)"
        - "(?i)дарени|безвозмездн"

  - id: "spousal_consent_check"
    name: "Согласие супруга / подтверждение личного режима имущества (ст. 35 СК РФ)"
    description: "Проверяет наличие нотариального согласия супруга или подтверждения личной собственности"
    legal_base: "ст. 35 СК РФ, ст. 576 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["spousal_consent_relevant"]
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "личная собственность"
        - "брачный договор"
        - "имущество нажито до брака"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"

  - id: "transfer_procedure"
    name: "Порядок передачи дара"
    description: "Проверяет наличие порядка и момента фактической передачи дара"
