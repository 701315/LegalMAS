      retrieval_query: "НДФЛ близкие родственники освобождение от налога налоговая декларация одаряемый уплачивает налог ст. 217 НК РФ налоговые последствия рыночная стоимость дара декларация 3-НДФЛ п. 18.1 НК РФ"
