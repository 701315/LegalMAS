          required: false
        - name: "donee_refusal_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия права одаряемого отказаться от принятия дара."
          required: false
      store_payload: true

