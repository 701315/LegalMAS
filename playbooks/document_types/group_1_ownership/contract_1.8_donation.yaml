        - "налоговая декларация"
        - "одаряемый уплачивает налог"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДФЛ\\b"
        - "(?i)близк(ие|их)\\s+родственник"

  - id: "bankruptcy_risk_disclosure"
    name: "Подтверждение отсутствия признаков банкротства дарителя"
    description: "Проверяет наличие заверений дарителя об отсутствии банкротных рисков"
    legal_base: "ФЗ-127, ст. 61.2-61.3"
    severity: "high"
