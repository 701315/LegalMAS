          description: "Статус заверения об отсутствии прав третьих лиц на предмет дарения."
          required: true

        - name: "bankruptcy_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 2
          label: "Заверение об отсутствии банкротства"
          description: "Статус наличия заверения о банкротном статусе дарителя."
          required: true

        - name: "insolvency_signs_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия заверения об отсутствии признаков неплатёжеспособности дарителя."
          required: true

        - name: "bankruptcy_clawback_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 3
          label: "Оспаривание по ст. 61.2–61.3 ФЗ-127"
          description: >
            Статус наличия заверения о невозможности оспаривания дарения
            по основаниям ст. 61.2–61.3 ФЗ-127 (период подозрительности,
