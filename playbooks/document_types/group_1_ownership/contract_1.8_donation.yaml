      и не включены ли незаконные или чрезмерно расширенные основания отмены.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отмена дарения"
        - "отказ от исполнения"
        - "даритель вправе отменить"
        - "ст. 578"
        - "покушение на жизнь"
        - "угроза безвозвратной утраты"
        - "имущественное положение дарителя"
      keyword_mode: "any"
