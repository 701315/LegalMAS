        4. reporting_frequency_status — "defined" если периодичность
           отчётности прямо указана, иначе "not_defined".
        5. reporting_frequency_details — периодичность (ежегодно, ежеквартально
           и т.п.).
        6. change_of_purpose_consent_status — "defined" если порядок изменения
           цели использования прямо определён, иначе "not_defined".
        7. non_target_use_consequences_status — "defined" если последствия
           нецелевого использования прямо указаны, иначе "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не применяй ст. 582 ГК РФ по умолчанию.
        - Только прямые формулировки из договора.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "target_use_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения целевого использования пожертвованного имущества."
          required: true
        - name: "target_use_details"
          type: "string"
          presentation: "fact"
          label: "Цель пожертвования"
          description: "Конкретная общеполезная цель использования пожертвованного имущества."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "reporting_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обязанности одаряемого отчитываться перед жертвователем."
          required: false
        - name: "reporting_frequency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности отчётности."
          required: false
        - name: "reporting_frequency_details"
          type: "string"
          presentation: "fact"
          label: "Периодичность отчётности"
          description: "Периодичность предоставления отчётов об использовании пожертвования."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "change_of_purpose_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка изменения цели использования пожертвования."
          required: false
        - name: "non_target_use_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий нецелевого использования пожертвованного имущества."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Дарение недвижимости — специальные условия
  # ──────────────────────────────────────────────────────────────────────────
  - id: real_estate_gift_specifics_check
    name: "Дарение недвижимости: идентификация, регистрация, обременения, проживающие лица"
    description: >
      Фактографическая проверка наличия специальных условий для дарения недвижимого
      имущества: кадастровый номер, выписка ЕГРН, регистрация, перечень проживающих.
    triggers:
      any: ["real_estate_gift"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "Росреестр"
        - "государственная регистрация"
        - "обременение"
        - "право пользования"
        - "зарегистрированные лица"
        - "жилое помещение"
        - "передаточный акт"
        - "выписка из ЕГРН"
        - "право собственности"
        - "основание права"
        - "проживающие лица"
        - "снят с регистрационного учёта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)зарегистрированн(ые|ых)\\s+лиц"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения недвижимого имущества (ст. 574 ГК РФ;
        ст. 131, 551, 556, 558 ГК РФ; ФЗ-218).
        Проверяется наличие специальных условий для дарения недвижимости.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер объекта (формат NN:NN:NNNNNNN:N).
        2. Ссылку на выписку ЕГРН.
        3. Основание права дарителя.
        4. Гарантию отсутствия обременений.
        5. Порядок государственной регистрации перехода права.
        6. Распределение расходов на госпошлину.
        7. Перечень лиц, сохраняющих право пользования (ст. 558 ГК РФ).
        8. Передаточный акт.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель передаёт в дар квартиру, кадастровый номер 77:06:0001001:123.
        Право собственности Дарителя подтверждено выпиской из ЕГРН от 01.03.2026.
        Основание права — договор купли-продажи от 15.06.2015.
        Объект не обременён и не заложен.
        Регистрация перехода права производится в Росреестре. Расходы несёт Одаряемый.
        Лиц, сохраняющих право пользования, нет.
        Передача — по передаточному акту."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "egrn_extract_status": "defined",
          "donor_title_basis_status": "defined",
          "donor_title_basis_details": "договор купли-продажи от 15.06.2015",
          "encumbrances_status": "defined",
          "encumbrances_details": "не обременён и не заложен",
          "registration_procedure_status": "defined",
          "registration_cost_status": "defined",
          "residents_list_status": "defined",
          "residents_list_regime": "explicitly_none",
          "transfer_act_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель передаёт в дар квартиру, кадастровый номер 77:06:0001001:123."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель безвозмездно передаёт Одаряемому объект недвижимости."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "egrn_extract_status": "not_defined",
          "donor_title_basis_status": "not_defined",
          "donor_title_basis_details": "Данные не определены",
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Данные не определены",
          "registration_procedure_status": "not_defined",
          "registration_cost_status": "not_defined",
          "residents_list_status": "not_defined",
          "residents_list_regime": "not_defined",
          "transfer_act_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Кадастровый номер — только в формате XX:XX:XXXXXXX:X.
        2. Упомянута ли выписка ЕГРН?
        3. Описан ли порядок регистрации?
        4. Перечень проживающих — listed / explicitly_none / not_defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<номер или 'Данные не определены'>",
          "egrn_extract_status": "<defined / not_defined>",
          "donor_title_basis_status": "<defined / not_defined>",
          "donor_title_basis_details": "<основание или 'Данные не определены'>",
          "encumbrances_status": "<defined / not_defined>",
          "encumbrances_details": "<текст или 'Данные не определены'>",
          "registration_procedure_status": "<defined / not_defined>",
          "registration_cost_status": "<defined / not_defined>",
          "residents_list_status": "<defined / not_defined>",
          "residents_list_regime": "<listed / explicitly_none / not_defined>",
          "transfer_act_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кадастровый номер ЕГРН Росреестр государственная регистрация перехода права дарения обременение право пользования зарегистрированные лица жилое помещение передаточный акт выписка из ЕГРН право собственности основание права проживающие лица снят с регистрационного учёта госпошлина ст. 558 ГК РФ"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - warranty
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "обременения в общем смысле без ЕГРН"
        - "залог движимого имущества"
        - "арест движимого имущества"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "встречное предоставление"
        - "отмена дарения"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1250

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения недвижимого
        имущества специальные условия: кадастровый номер, выписка ЕГРН,
        основание права дарителя, обременения, госрегистрация, зарегистрированные
        лица, передаточный акт.
        Не анализируй стороны, безвозмездность, налоги, отмену дарения или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. cadastral_number_status — "defined" если кадастровый номер объекта
           прямо указан, иначе "not_defined".
        2. cadastral_number_value — кадастровый номер в формате NN:NN:NNNNNNN:N.
        3. egrn_extract_status — "defined" если ссылка на выписку ЕГРН
           прямо указана, иначе "not_defined".
        4. donor_title_basis_status — "defined" если основание права
           собственности дарителя прямо указано, иначе "not_defined".
        5. donor_title_basis_details — текст об основании права дарителя
           (договор купли-продажи, наследство, приватизация и т.п.).
        6. encumbrances_status — "defined" если заверение об отсутствии
           обременений прямо указано, иначе "not_defined".
        7. encumbrances_details — текст заверения об обременениях.
        8. registration_procedure_status — "defined" если порядок
           государственной регистрации перехода права прямо описан,
           иначе "not_defined".
        9. registration_cost_status — "defined" если распределение расходов
           на госпошлину прямо указано, иначе "not_defined".
        10. residents_list_status — "defined" если перечень лиц, сохраняющих
            право пользования, или заверение об их отсутствии прямо указано,
            иначе "not_defined".
        11. residents_list_regime — "listed" (перечислены конкретные лица) /
            "explicitly_none" (явно указано, что таких лиц нет) / "not_defined".
        12. transfer_act_status — "defined" если передаточный акт прямо
            предусмотрен, иначе "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Кадастровый номер — строго в формате NN:NN:NNNNNNN:N.
        - Не домысливай основание права дарителя.
        - listed = конкретные лица, сохраняющие право пользования, прямо перечислены.
        - explicitly_none = прямо указано, что таких лиц нет.
        - not_defined = вопрос не урегулирован прямо.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия кадастрового номера объекта дарения."
          required: true
        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер объекта"
          description: "Кадастровый номер объекта недвижимости в формате NN:NN:NNNNNNN:N."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "egrn_extract_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия ссылки на выписку из ЕГРН."
          required: false
        - name: "donor_title_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения основания права собственности дарителя."
          required: false
        - name: "donor_title_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание права дарителя"
          description: "Правоустанавливающий документ или иное основание права собственности дарителя на объект."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия заверения об отсутствии обременений на объект дарения."
          required: false
        - name: "encumbrances_details"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии обременений"
          description: "Текст заверения об отсутствии обременений, залога, ареста на объект недвижимости."
          required: false
          display_in_grid: false
        - name: "registration_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка государственной регистрации перехода права собственности."
          required: false
        - name: "registration_cost_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения расходов на госпошлину."
          required: false
        - name: "residents_list_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия перечня лиц, сохраняющих право пользования объектом после дарения."
          required: false
        - name: "residents_list_regime"
          type: "string"
          presentation: "signal"
          label: "Сохраняющие право пользования лица"
          allowed_values: ["listed", "explicitly_none", "not_defined"]
          description: "Режим указания лиц, сохраняющих право пользования подаренным объектом недвижимости."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о передаточном акте при дарении недвижимости."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Налоговые последствия для одаряемого
  # ──────────────────────────────────────────────────────────────────────────
  - id: donee_tax_consequences_check
    name: "Налоговые последствия для одаряемого: НДФЛ и освобождение (ст. 217 НК РФ)"
    description: >
      Фактографическая проверка наличия налоговых оговорок: НДФЛ, освобождение
      для близких родственников, обязанность подачи декларации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДФЛ"
        - "близкие родственники"
        - "освобождение от налога"
        - "налоговая декларация"
        - "одаряемый уплачивает налог"
        - "ст. 217"
        - "налоговые последствия"
        - "рыночная стоимость дара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДФЛ\\b"
        - "(?i)близк(ие|их)\\s+родственник"
        - "(?i)освобожд(ает|ается).*от\\s+налог"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ; ст. 217 п. 18.1 НК РФ).
        Проверяется наличие налоговых оговорок для одаряемого.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Налоговую оговорку о НДФЛ.
        2. Статус родства сторон (близкие родственники / иные).
        3. Ссылку на освобождение для близких родственников (ст. 217 п. 18.1 НК РФ).
        4. Обязанность подачи декларации 3-НДФЛ.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель и Одаряемый являются близкими родственниками.
        Доход в виде дара освобождается от НДФЛ в соответствии с п. 18.1 ст. 217 НК РФ.
        Декларация 3-НДФЛ не подаётся."

        Ответ:
        {
          "tax_warning_status": "defined",
          "close_relative_status_stated": "defined",
          "close_relative_status": "confirmed",
          "close_relative_exemption_status": "defined",
          "tax_declaration_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Даритель и Одаряемый являются близкими родственниками."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Одаряемый самостоятельно несёт налоговые последствия, связанные с получением дара."

        Ответ:
        {
          "tax_warning_status": "defined",
          "close_relative_status_stated": "not_defined",
          "close_relative_status": "not_stated",
          "close_relative_exemption_status": "not_defined",
          "tax_declaration_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Одаряемый самостоятельно несёт налоговые последствия, связанные с получением дара."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написано ли прямо про НДФЛ или освобождение?
        2. Указан ли статус родства?
        3. Упомянута ли налоговая декларация?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "tax_warning_status": "<defined / not_defined>",
          "close_relative_status_stated": "<defined / not_defined>",
