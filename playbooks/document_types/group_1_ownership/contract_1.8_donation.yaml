  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет дарения и безвозмездность
  # ──────────────────────────────────────────────────────────────────────────
  - id: donation_subject_and_gratuitousness_extraction
    name: "Предмет дарения, безвозмездность и отсутствие притворности (ст. 572 ГК РФ)"
    description: >
      Фактографическая проверка наличия определённого предмета дарения и явного
      выражения безвозмездности. Критически важно: безвозмездность — квалифицирующий
      признак дарения; её отсутствие или противоречие влечёт переквалификацию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "даритель"
        - "одаряемый"
        - "безвозмездно"
        - "в дар"
        - "предмет дарения"
        - "имущественное право"
        - "освобождение от обязанности"
        - "предмет договора"
        - "имущество"
        - "передаёт в дар"
        - "объект дарения"
        - "не является притворной сделкой"
        - "безвозмездный характер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безвозмездн"
        - "(?i)в\\s+дар"
        - "(?i)переда[её]т\\s+в\\s+дар"
        - "(?i)предмет\\s+договор"
        - "(?i)не\\s+является\\s+притворн(ой|ою)\\s+сделк"
        - "(?i)безвозмездн(ый|ая|ого)\\s+характер"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572 ГК РФ; ст. 432 ГК РФ).
        Проверяется только один вопрос: предмет дарения и безвозмездность.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Безвозмездность — обязательный квалифицирующий признак дарения по ст. 572 ГК РФ.
        - Если в договоре есть встречное предоставление — сделка НЕ является дарением.
        - Предмет дарения: вещь / имущественное право / освобождение от обязанности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Конкретное описание предмета дарения (что именно передаётся).
        2. Тип предмета (вещь / имущественное право / освобождение от долга / иное).
        3. Явное указание на безвозмездность передачи.
        4. Признаки встречного предоставления (оплата, компенсация, обязательства одаряемого).
        5. Заверение о непритворности сделки.
        6. Момент передачи: немедленная передача или обещание в будущем.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — корректное дарение:
        Фрагмент:
        "Даритель безвозмездно передаёт в дар Одаряемому ноутбук Apple MacBook Pro
        серийный номер C02X12345, а Одаряемый принимает указанный дар.
        Настоящий договор не является притворной сделкой. Одаряемый не принимает
        на себя никаких обязательств перед Дарителем."

        Ответ:
        {
          "donation_subject_status": "defined",
          "donation_subject_value": "ноутбук Apple MacBook Pro серийный номер C02X12345",
          "donation_subject_type": "thing",
          "subject_specificity": "specific",
          "gratuitousness_status": "defined",
          "gratuitousness_explicitness": "explicit",
          "counter_performance_signs": "not_defined",
          "sham_prevention_status": "defined",
          "transfer_timing": "immediate",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель безвозмездно передаёт в дар Одаряемому ноутбук Apple MacBook Pro серийный номер C02X12345."
            }
          ]
        }

        Пример 2 — подозрительные формулировки:
        Фрагмент:
        "Даритель передаёт имущество Одаряемому в обмен на добросовестное отношение
        и уход."

        Ответ:
        {
          "donation_subject_status": "not_defined",
          "donation_subject_value": "Данные не определены",
          "donation_subject_type": "not_defined",
          "subject_specificity": "not_defined",
          "gratuitousness_status": "not_defined",
          "gratuitousness_explicitness": "contradicted",
          "counter_performance_signs": "defined",
          "sham_prevention_status": "not_defined",
          "transfer_timing": "immediate",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель передаёт имущество Одаряемому в обмен на добросовестное отношение и уход."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Описан ли предмет дарения конкретно с индивидуализирующими признаками?
        2. Есть ли слово "безвозмездно" или "в дар" — прямо написано?
        3. Есть ли любое упоминание обязательств одаряемого перед дарителем?
        4. "В обмен на", "при условии", "за уход" — это признаки встречного предоставления.
        5. Есть ли заверение о непритворности?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "donation_subject_status": "<defined / not_defined>",
          "donation_subject_value": "<описание предмета или 'Данные не определены'>",
          "donation_subject_type": "<thing / right / debt_release / mixed / not_defined>",
          "subject_specificity": "<specific / vague / not_defined>",
          "gratuitousness_status": "<defined / not_defined>",
          "gratuitousness_explicitness": "<explicit / implied / contradicted / not_defined>",
          "counter_performance_signs": "<defined / not_defined>",
          "sham_prevention_status": "<defined / not_defined>",
          "transfer_timing": "<immediate / future_promise / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "безвозмездно в дар предмет дарения имущественное право освобождение от обязанности передаёт в дар объект дарения не является притворной сделкой безвозмездный характер даритель одаряемый ст. 572 ГК РФ немедленная передача обещание дарения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "отмена дарения"
        - "отмена"
        - "обременения"
        - "залог"
        - "арест"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "ЕГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения
        предмет дарения, его тип и признаки безвозмездности.
        Не анализируй отмену дарения, стороны и налоги.
        </role>

        <context>{context}</context>

        <task>
        Заполни строго следующие поля:

        1. donation_subject_status — "defined" или "not_defined".
        2. donation_subject_value — конкретное описание предмета дарения.
        3. donation_subject_type — thing / right / debt_release / mixed / not_defined.
        4. subject_specificity — specific / vague / not_defined.
        5. gratuitousness_status — "defined" или "not_defined".
        6. gratuitousness_explicitness — explicit / implied / contradicted / not_defined.
        7. counter_performance_signs — "defined" если в тексте есть прямые признаки встречного предоставления, иначе "not_defined".
        8. sham_prevention_status — "defined" если оговорка о непритворности прямо присутствует, иначе "not_defined".
        9. transfer_timing — immediate / future_promise / not_defined.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Только текст договора.
        - Не делай правовых выводов.
        - thing = дарится вещь.
        - right = дарится имущественное право.
        - debt_release = даритель освобождает одаряемого от обязанности.
        - mixed = в тексте прямо смешаны несколько объектов дарения разных типов.
        - specific = предмет индивидуализирован конкретно.
        - vague = предмет описан расплывчато без индивидуализации.
        - explicit = безвозмездность прямо названа словами "безвозмездно", "в дар".
        - implied = безвозмездность следует из формулировки дарения, но без прямого слова "безвозмездно".
        - contradicted = есть признаки встречного предоставления или встречных обязательств одаряемого.
        - immediate = дар передаётся сейчас / при подписании / немедленно.
        - future_promise = дарение обещано в будущем.
        - Верни только JSON.
        </rules>
      fields:
        - name: "donation_subject_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения предмета дарения."
          required: true
        - name: "donation_subject_value"
          type: "string"
          presentation: "fact"
          label: "Предмет дарения"
          description: "Конкретное описание предмета дарения."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "donation_subject_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["thing", "right", "debt_release", "mixed", "not_defined"]
          description: "Тип предмета дарения."
          required: false
        - name: "subject_specificity"
          type: "string"
          presentation: "signal"
          allowed_values: ["specific", "vague", "not_defined"]
          description: "Степень определённости предмета дарения."
          required: false
        - name: "gratuitousness_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о безвозмездности."
          required: true
        - name: "gratuitousness_explicitness"
          type: "string"
          presentation: "signal"
          allowed_values: ["explicit", "implied", "contradicted", "not_defined"]
          description: "Способ выражения безвозмездности в тексте договора."
          required: false
        - name: "counter_performance_signs"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия признаков встречного предоставления."
          required: false
        - name: "sham_prevention_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия оговорки о непритворности."
          required: false
        - name: "transfer_timing"
          type: "string"
          presentation: "signal"
          allowed_values: ["immediate", "future_promise", "not_defined"]
          description: "Характер передачи дара: немедленно или в будущем."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Встречное предоставление — детектор
  # ──────────────────────────────────────────────────────────────────────────
  - id: counter_performance_check
    name: "Встречное предоставление: риск переквалификации и притворности (ст. 572, 170 ГК РФ)"
    description: >
      Детекторная проверка наличия признаков встречного предоставления, несовместимых
      с дарением. Не оценивает "насколько это плохо" — только фиксирует факты.
    triggers: {}
    ui_mode: "risk_detection"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "компенсация"
        - "вознаграждение"
        - "встречное предоставление"
        - "в обмен на"
        - "содержание"
        - "уход"
        - "обязуется выплачивать"
        - "цена"
        - "ежемесячные платежи"
        - "арендная плата"
        - "рента"
        - "обязанности одаряемого"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+обмен\\s+на"
        - "(?i)обязуется\\s+содержать"
        - "(?i)цен[аыуеой]"
        - "(?i)оплат(а|ить|ы)"
        - "(?i)ежемесячн(ые|ых)\\s+платеж"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 572 ГК РФ).
        Проверяется только один вопрос: наличие признаков встречного предоставления.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Твоя задача — НЕ оценивать серьёзность риска.
        - Твоя задача — найти в тексте конкретные формулировки, которые указывают
          на встречное предоставление (плату, обязательства одаряемого).
        - Если таких формулировок нет — counter_performance_found = "no".

        [ЗАДАЧА]
        Найди в тексте договора прямые признаки:
        1. Обязательства одаряемого перед дарителем (оплата, содержание, уход, услуги).
        2. Формулировки "в обмен на", "при условии", "взамен".
        3. Цену или компенсацию за передаваемое имущество.
        4. Ежемесячные/регулярные платежи от одаряемого к дарителю.
        5. Признаки ренты (пожизненное содержание, иждивение).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если признаков нет — "no" и пустой массив.
        3. Если признаки есть — "yes" с конкретными цитатами.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — признаки найдены:
        Фрагмент:
        "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется
        ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."

        Ответ:
        {
          "counter_performance_found": "yes",
          "counter_performance_types": ["ежемесячные платежи", "условие пожизненных выплат"],
          "reclassification_target": "annuity",
          "protective_clause_present": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Даритель передаёт квартиру Одаряемому в обмен на то, что Одаряемый обязуется ежемесячно уплачивать Дарителю 15 000 рублей до конца его жизни."
            }
          ]
        }

        Пример 2 — признаков нет:
        Фрагмент:
        "Даритель безвозмездно передаёт в дар Одаряемому автомобиль.
        Одаряемый не несёт никаких обязательств перед Дарителем."

        Ответ:
        {
          "counter_performance_found": "no",
          "counter_performance_types": [],
          "reclassification_target": "not_applicable",
          "protective_clause_present": "defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли любая фраза об обязательствах одаряемого?
        2. Есть ли слова "в обмен на", "взамен", "при условии"?
        3. Есть ли упоминание цены, суммы, платежей от одаряемого?
        4. Есть ли признаки ренты (уход, содержание, иждивение)?
        5. Если ничего нет — "no" и пустой массив.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "counter_performance_found": "<yes / no>",
          "counter_performance_types": ["<тип1>", "<тип2>"],
          "reclassification_target": "<sale / exchange / annuity / sham / not_applicable>",
          "protective_clause_present": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата компенсация вознаграждение встречное предоставление в обмен на содержание уход обязуется выплачивать цена ежемесячные платежи рента обязанности одаряемого взамен при условии притворная сделка переквалификация ст. 170 ГК РФ"
      preferred_unit_types:
