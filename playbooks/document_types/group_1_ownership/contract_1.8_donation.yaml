        - "обременения"
        - "залог"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения признаки
        обещания дарения в будущем: форма, конкретность предмета, условие
        вступления в силу.
        Не анализируй стороны, безвозмездность, передачу или отмену дарения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. promise_of_gift_status — "defined" если обещание дарения в будущем
           прямо присутствует ("обязуется передать", "обещает подарить"),
           иначе "not_defined".
        2. written_form_status — "defined" если соблюдение письменной формы
           прямо подтверждено, иначе "not_defined".
        3. subject_specificity_status — "defined" если предмет обещания
           конкретно описан, иначе "not_defined".
        4. subject_specificity_code — "specific" / "vague" / "all_property" /
           "not_defined".
        5. triggering_condition_status — "defined" если условие вступления
           в силу обещания прямо указано, иначе "not_defined".
        6. triggering_condition_details — текст условия вступления в силу.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - "all_property" = фраза типа "всё своё имущество" — это ничтожно
          по ст. 572 ГК РФ, фиксируй как есть.
        - Не анализируй, является ли условие законным.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "promise_of_gift_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обещания дарения в будущем."
          required: true
        - name: "written_form_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус соблюдения письменной формы обещания."
          required: false
        - name: "subject_specificity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определённости предмета обещания дарения."
