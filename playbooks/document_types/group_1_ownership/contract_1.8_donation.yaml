          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_code": "<complied / not_applicable / not_addressed / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доля в уставном капитале доля в ООО нотариальное удостоверение нотариус ЕГРЮЛ преимущественное право устав общества запрет дарения согласие участников размер доли номинальная стоимость ст. 21 ФЗ-14 уставные ограничения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - representations
      negative_keywords:
        - "согласие участников как сособственников недвижимости"
        - "ЕГРН"
        - "кадастровый номер"
        - "государственная регистрация перехода права на недвижимость"
        - "обременения"
        - "залог"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "отмена дарения"
        - "встречное предоставление"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.80]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050

      compact_output: false

      presence_signal:
        field: "share_gift_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения доли
        в уставном капитале ООО специальные условия: нотариальная форма,
        размер и номинальная стоимость доли, ЕГРЮЛ, уставные ограничения,
        согласие участников, преимущественное право (ст. 21 ФЗ-14).
        Не анализируй стороны, безвозмездность, обременения, налоги или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. share_gift_compliance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме дарения доли в ООО.
           - "present" — если хотя бы одно из содержательных полей
             (notarization_status, share_size_status,
              egrul_procedure_status, charter_restrictions_status,
              participants_consent_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notarization_status = "not_defined";
           - share_size_status = "not_defined";
           - share_nominal_value_status = "not_defined";
           - egrul_procedure_status = "not_defined";
           - charter_restrictions_status = "not_defined";
           - participants_consent_status = "not_defined";
           - preemptive_right_status = "not_defined";
           - preemptive_right_code = "not_defined";
           - share_size_value, share_nominal_value_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. notarization_status:
           - "defined" — если нотариальная форма удостоверения прямо
             подтверждена ("договор удостоверяется нотариусом", "нотариальная форма");
           - "not_defined" — если нотариальное удостоверение не упомянуто.

        2. share_size_status:
           - "defined" — если размер даримой доли прямо указан в процентах или дробях;
           - "not_defined" — если размер доли не указан.

        3. share_size_value:
           Краткое user-facing значение размера доли (например, "25%", "1/4", "100%").
           Если данных нет — "Данные не определены".

        4. share_nominal_value_status:
           - "defined" — если номинальная стоимость доли прямо указана в рублях;
           - "not_defined" — если номинальная стоимость не указана.

        5. share_nominal_value_value:
           Краткое user-facing значение номинальной стоимости (например, "250 000 рублей").
           Если данных нет — "Данные не определены".

        6. egrul_procedure_status:
           - "defined" — если порядок внесения изменений в ЕГРЮЛ прямо описан
             ("нотариус подаёт заявление в регистрирующий орган", "внесение записи в ЕГРЮЛ");
           - "not_defined" — если регистрация в ЕГРЮЛ не обсуждается.

        7. charter_restrictions_status:
           - "defined" — если уставные ограничения прямо упомянуты
             ("устав не содержит запрета", "согласно уставу дарение разрешено");
           - "not_defined" — если уставные ограничения не обсуждаются.

        8. participants_consent_status:
           - "defined" — если согласие участников общества прямо получено
             или указано, что согласие не требуется;
           - "not_defined" — если согласие участников не обсуждается.

        9. preemptive_right_status:
           - "defined" — если вопрос о преимущественном праве участников прямо рассмотрен;
           - "not_defined" — если вопрос преимущественного права не обсуждается.

        10. preemptive_right_code:
            - "complied" — преимущественное право соблюдено (отказы получены);
            - "not_applicable" — преимущественное право не применяется к дарению
              (по уставу / закону);
            - "not_addressed" — вопрос прямо упомянут, но статус не разрешён;
            - "not_defined" — вопрос не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни share_gift_compliance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", preemptive_right_code = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Не применяй нормы ФЗ-14 по умолчанию — только прямые формулировки из договора.
        - Нотариальное удостоверение обязательно по ст. 21 ФЗ-14, но фиксируй только то, что прямо написано в тексте договора.
        - Если в разных фрагментах указаны противоречивые размеры доли или номиналы, верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания доли в ООО, ни нотариуса,
           ни согласия участников, ни ЕГРЮЛ.
           → presence = "missing";
             все *_status = "not_defined";
             preemptive_right_code = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное: доля названа, но нет нотариуса и ЕГРЮЛ.
           "Даритель передаёт в дар Одаряемому долю 50% в ООО «Ромашка»."
           Без упоминания нотариуса, устава и ЕГРЮЛ.
           → presence = "present";
             share_size_status = "defined";
             share_size_value = "50%";
             notarization_status = "not_defined";
             egrul_procedure_status = "not_defined".

        3. Противоречие между фрагментами.
           В п. 1 — "доля 25% номиналом 250 000 руб.",
           в п. 4 — "доля 50% номиналом 500 000 руб.".
           → presence = "unclear";
             share_size_status = "not_defined";
             share_size_value = "Не удалось определить".

        4. Полный комплект корпоративного оформления.
           "Доля 25% номиналом 250 000 руб. Нотариальное удостоверение.
           Согласие участников получено. Нотариус направляет заявление в ЕГРЮЛ."
           → presence = "present";
             notarization_status = "defined";
             share_size_status = "defined";
             share_size_value = "25%";
             share_nominal_value_status = "defined";
             share_nominal_value_value = "250 000 рублей";
             egrul_procedure_status = "defined";
             participants_consent_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для share_gift_compliance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для preemptive_right_code используй только: "complied", "not_applicable", "not_addressed", "not_defined".
        - Fallback при отсутствии данных:
          * share_size_value, share_nominal_value_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * share_size_value, share_nominal_value_value → "Не удалось определить";
          * share_gift_compliance_check_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "share_gift_compliance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме дарения доли в ООО. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notarization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия нотариальной формы удостоверения договора дарения доли."
          required: true

        - name: "share_size_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения размера даримой доли в уставном капитале ООО."
          required: true

        - name: "share_size_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Размер даримой доли"
          description: >
            Размер доли в уставном капитале ООО, передаваемой в дар (в процентах или дробях).
            Примеры: "25%", "1/4", "100%".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "share_nominal_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения номинальной стоимости даримой доли."
          required: true

        - name: "share_nominal_value_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Номинальная стоимость доли"
          description: >
            Номинальная стоимость даримой доли в уставном капитале ООО в рублях.
            Примеры: "250 000 рублей", "10 000 рублей".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "egrul_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка внесения изменений в ЕГРЮЛ после дарения доли."
          required: true

        - name: "charter_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания уставных ограничений на дарение доли в ООО."
          required: true

        - name: "participants_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия согласия участников общества на дарение доли."
          required: true

        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус рассмотрения вопроса о преимущественном праве участников при дарении доли."
          required: true

        - name: "preemptive_right_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["complied", "not_applicable", "not_addressed", "not_defined"]
          display_in_grid: true
          display_priority: 3
          label: "Преимущественное право"
          description: "Статус соблюдения преимущественного права участников ООО при дарении доли."
          required: true

      store_payload: true

  - id: donation_prohibitions_check
    name: "Запреты дарения: ничтожность по ст. 575 ГК РФ"
    description: >
      Фактографическая проверка наличия в договоре признаков нарушения запретов
      на дарение, установленных ст. 575 ГК РФ: дарение от имени малолетних
      и недееспособных, дарение работникам учреждений, дарение госслужащим,
      дарение между коммерческими организациями. Нарушение любого из запретов
      влечёт ничтожность сделки (ст. 168 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "малолетний"
        - "недееспособный"
        - "от имени"
        - "законный представитель"
        - "опекун"
        - "образовательная организация"
        - "медицинская организация"
        - "социальная организация"
        - "на лечении"
        - "на содержании"
        - "на обучении"
        - "государственный служащий"
        - "муниципальный служащий"
        - "должностное лицо"
        - "служащий Банка России"
        - "коммерческая организация"
        - "между коммерческими"
        - "три тысячи"
        - "3000"
        - "запрет дарения"
        - "не допускается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)малолетн"
        - "(?i)недееспособн"
        - "(?i)от\\s+имени"
        - "(?i)государственн(ый|ого)\\s+служащ"
        - "(?i)муниципальн(ый|ого)\\s+служащ"
        - "(?i)коммерческ(ая|ие|их)\\s+организаци"
        - "(?i)3\\s*000|три\\s+тысяч"
        - "(?i)образовательн(ая|ого)\\s+организаци"
        - "(?i)медицинск(ая|ого)\\s+организаци"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 575 ГК РФ).
        Проверяется наличие признаков нарушения запретов на дарение.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - Ст. 575 ГК РФ устанавливает исчерпывающий перечень ситуаций,
          в которых дарение запрещено (ничтожно по ст. 168 ГК РФ).
        - Твоя задача — НЕ оценивать серьёзность риска.
        - Твоя задача — только зафиксировать факты, указывающие на возможное
          нарушение запретов ст. 575 ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора признаки каждого из четырёх запретов:
        1. Дарение совершается от имени малолетнего (до 14 лет) или
           недееспособного гражданина (п. 1 ст. 575).
        2. Дарение совершается в пользу работников образовательных,
           медицинских, социальных организаций от лиц, находящихся
           в этих организациях на лечении, содержании или обучении (п. 2).
        3. Дарение совершается в пользу лиц, замещающих государственные
           или муниципальные должности, государственных или муниципальных
           служащих, служащих Банка России в связи с их должностным
           положением (п. 3).
        4. Дарение совершается между коммерческими организациями,
           и стоимость дара превышает 3 000 рублей (п. 4).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если признаков запрета нет — "no_violation".
        3. Если признаки есть — "violation_detected" с цитатами.
        4. Если текст не позволяет сделать вывод — "not_defined".
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — запрет не нарушен:
        Фрагмент:
        "Даритель — Иванов Иван Иванович, совершеннолетний, дееспособный,
        действует от своего имени. Одаряемый — Петров Пётр Петрович.
        Стороны не являются коммерческими организациями."

        Ответ:
        {
          "minor_incapacitated_donor_status": "no_violation",
          "institutional_worker_status": "no_violation",
          "public_official_status": "no_violation",
          "commercial_entity_status": "no_violation",
          "prohibition_violation_status": "no_violation",
          "prohibition_violation_details": "Признаков нарушения запретов ст. 575 ГК РФ не выявлено",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Даритель — Иванов Иван Иванович, совершеннолетний, дееспособный, действует от своего имени."
            }
          ]
        }

        Пример 2 — нарушение п. 4:
        Фрагмент:
        "Даритель — ООО «Альфа». Одаряемый — ООО «Бета».
        Даритель передаёт в дар Одаряемому оборудование стоимостью
        500 000 рублей."

        Ответ:
        {
          "minor_incapacitated_donor_status": "not_defined",
          "institutional_worker_status": "not_defined",
          "public_official_status": "not_defined",
          "commercial_entity_status": "violation_detected",
          "prohibition_violation_status": "violation_detected",
          "prohibition_violation_details": "Дарение между коммерческими организациями (ООО «Альфа» → ООО «Бета»), стоимость дара 500 000 руб. превышает 3 000 руб. (п. 4 ст. 575 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Даритель — ООО «Альфа». Одаряемый — ООО «Бета»."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Даритель действует от своего имени или от имени малолетнего/недееспособного?
        2. Одаряемый — работник учреждения, в котором даритель находится?
        3. Одаряемый — госслужащий, муниципальный служащий, служащий ЦБ?
        4. Обе стороны — коммерческие организации? Если да, какова стоимость дара?
        5. Если ни один запрет не нарушен — "no_violation" во всех полях.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "minor_incapacitated_donor_status": "<no_violation / violation_detected / not_defined>",
          "institutional_worker_status": "<no_violation / violation_detected / not_defined>",
          "public_official_status": "<no_violation / violation_detected / not_defined>",
          "commercial_entity_status": "<no_violation / violation_detected / not_defined>",
          "prohibition_violation_status": "<no_violation / violation_detected / not_defined>",
          "prohibition_violation_details": "<описание или 'Признаков нарушения не выявлено' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "малолетний недееспособный от имени законный представитель опекун образовательная организация медицинская организация социальная организация на лечении на содержании на обучении государственный служащий муниципальный служащий должностное лицо служащий Банка России коммерческая организация запрет дарения не допускается ст. 575 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "безвозмездно"
        - "в дар"
        - "предмет дарения"
        - "обременения"
        - "залог"
        - "арест"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "ЕГРН"
        - "отмена дарения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "donation_prohibitions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения признаки
        нарушения запретов на дарение по ст. 575 ГК РФ.
        Не анализируй предмет дарения, безвозмездность, передачу, налоги или споры.
        Не оценивай риски и последствия — только фиксируй факты.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. donation_prohibitions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме запретов дарения.
           - "present" — если хотя бы одно из содержательных полей
             (minor_incapacitated_donor_status, institutional_worker_status,
              public_official_status, commercial_entity_status)
             ∈ {no_violation, violation_detected};
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - minor_incapacitated_donor_status = "not_defined";
           - institutional_worker_status = "not_defined";
           - public_official_status = "not_defined";
           - commercial_entity_status = "not_defined";
           - prohibition_violation_status = "not_defined";
           - prohibition_violation_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. minor_incapacitated_donor_status (п. 1 ст. 575 ГК РФ):
           - "no_violation" — даритель действует от своего имени, является
             совершеннолетним и дееспособным, либо прямо указано, что дарение
             совершается не от имени малолетнего/недееспособного;
           - "violation_detected" — дарение совершается от имени малолетнего
             (до 14 лет) или недееспособного гражданина (например, "от имени
             малолетнего Иванова И.И. действует его законный представитель");
           - "not_defined" — возраст и дееспособность дарителя не обсуждаются.

        2. institutional_worker_status (п. 2 ст. 575 ГК РФ):
           - "no_violation" — одаряемый не является работником образовательной,
             медицинской или социальной организации, в которой даритель находится
             на лечении, содержании или обучении;
           - "violation_detected" — одаряемый является работником такого
             учреждения и даритель находится в нём на лечении, содержании
             или обучении;
           - "not_defined" — статус одаряемого как работника учреждения
             не обсуждается.

        3. public_official_status (п. 3 ст. 575 ГК РФ):
           - "no_violation" — одаряемый не является лицом, замещающим
             государственную или муниципальную должность, государственным
             или муниципальным служащим, служащим Банка России;
           - "violation_detected" — одаряемый является таким лицом и дарение
             связано с его должностным положением;
           - "not_defined" — должностной статус одаряемого не обсуждается.

        4. commercial_entity_status (п. 4 ст. 575 ГК РФ):
           - "no_violation" — хотя бы одна из сторон не является коммерческой
             организацией, либо обе стороны — коммерческие организации,
             но стоимость дара не превышает 3 000 рублей;
           - "violation_detected" — обе стороны являются коммерческими
             организациями и стоимость дара превышает 3 000 рублей;
           - "not_defined" — организационно-правовая форма сторон или
             стоимость дара не позволяют сделать вывод.

        5. prohibition_violation_status (агрегат):
           - "no_violation" — все четыре поля = "no_violation";
           - "violation_detected" — хотя бы одно поле = "violation_detected";
           - "not_defined" — если все поля = "not_defined" или данные
             недостаточны для вывода.

        6. prohibition_violation_details:
           Краткое user-facing описание результата проверки на русском языке.
           Примеры:
           - "Признаков нарушения запретов ст. 575 ГК РФ не выявлено";
           - "Дарение между коммерческими организациями (ООО «Альфа» → ООО «Бета»),
             стоимость 500 000 руб. > 3 000 руб. (п. 4 ст. 575)";
           - "Дарение от имени малолетнего (п. 1 ст. 575)".
           Если данных нет — "Данные не определены".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни donation_prohibitions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", prohibition_violation_details = "Данные не определены".
        - Используй только текст договора.
        - Не применяй ст. 575 ГК РФ по умолчанию — только если факты прямо следуют из текста.
        - Для п. 4: обе стороны должны быть коммерческими организациями (ООО, АО, ПАО и т.д.). Если хотя бы одна сторона — физлицо, ИП, НКО или государственное учреждение, запрет п. 4 не применяется.
        - Для п. 2: нарушение требует одновременного наличия двух фактов — одаряемый работает в учреждении И даритель находится в этом учреждении на лечении/содержании/обучении.
        - Для п. 3: дарение должно быть связано с должностным положением одаряемого. Дарение госслужащему как родственнику не подпадает под запрет.
        - Если в преамбуле прямо указано "совершеннолетний", "дееспособный", "действует от своего имени" — это "no_violation" для п. 1.
        - Если в разных фрагментах указаны противоречивые данные, верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания возраста, дееспособности,
           должностного статуса, организационно-правовой формы сторон.
           → presence = "missing";
             все *_status = "not_defined";
             prohibition_violation_details = "Данные не определены".

        2. Стандартный договор между физлицами без признаков нарушений.
           "Даритель — Иванов И.И., совершеннолетний, дееспособный.
           Одаряемый — Петров П.П. Стороны не являются коммерческими
           организациями и государственными служащими."
           → presence = "present";
             все четыре поля = "no_violation";
             prohibition_violation_status = "no_violation";
             prohibition_violation_details = "Признаков нарушения запретов ст. 575 ГК РФ не выявлено".

        3. Противоречие между фрагментами.
           В преамбуле — "Даритель действует от своего имени",
           в п. 5 — "законный представитель малолетнего дарителя".
           → presence = "unclear";
             minor_incapacitated_donor_status = "not_defined";
             prohibition_violation_status = "not_defined".

        4. Дарение между коммерческими организациями с высокой стоимостью.
           "Даритель — ООО «Альфа». Одаряемый — ООО «Бета».
           Стоимость дара — 1 500 000 рублей."
           → presence = "present";
             commercial_entity_status = "violation_detected";
             prohibition_violation_status = "violation_detected";
             prohibition_violation_details = "Дарение между коммерческими организациями, стоимость 1 500 000 руб. > 3 000 руб. (п. 4 ст. 575 ГК РФ)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для donation_prohibitions_check_presence используй только: "present", "missing", "unclear".
        - Для всех полей *_status используй только: "no_violation", "violation_detected", "not_defined".
        - Fallback при отсутствии данных:
          * все *_status → "not_defined";
          * prohibition_violation_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * prohibition_violation_details → "Не удалось определить";
          * donation_prohibitions_check_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "donation_prohibitions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие проверки запретов дарения по ст. 575 ГК РФ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "minor_incapacitated_donor_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_violation", "violation_detected", "not_defined"]
          display_in_grid: false
          description: "Статус соблюдения запрета дарения от имени малолетних и недееспособных (п. 1 ст. 575 ГК РФ)."
          required: true

        - name: "institutional_worker_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_violation", "violation_detected", "not_defined"]
          display_in_grid: false
          description: "Статус соблюдения запрета дарения работникам образовательных, медицинских и социальных организаций (п. 2 ст. 575 ГК РФ)."
          required: true

        - name: "public_official_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_violation", "violation_detected", "not_defined"]
          display_in_grid: false
          description: "Статус соблюдения запрета дарения государственным и муниципальным служащим (п. 3 ст. 575 ГК РФ)."
          required: true

        - name: "commercial_entity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_violation", "violation_detected", "not_defined"]
          display_in_grid: false
          description: "Статус соблюдения запрета дарения между коммерческими организациями свыше 3 000 руб. (п. 4 ст. 575 ГК РФ)."
          required: true

        - name: "prohibition_violation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_violation", "violation_detected", "not_defined"]
          display_in_grid: true
          display_priority: 1
          label: "Запреты ст. 575 ГК РФ"
          description: "Агрегатный статус нарушения запретов дарения по ст. 575 ГК РФ."
          required: true

        - name: "prohibition_violation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Детали нарушения запретов"
          description: >
            Краткое описание выявленных нарушений или подтверждение их отсутствия.
            Примеры: "Признаков нарушения не выявлено",
            "Дарение между коммерческими организациями > 3 000 руб. (п. 4 ст. 575)".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

      store_payload: true

  - id: donor_liability_for_defects_check
    name: "Ответственность дарителя за недостатки дара и вред (ст. 580 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре дарения условий о качестве
      и недостатках подаренной вещи, предупреждении о скрытых дефектах,
      принятии дара в состоянии «как есть» и об ответственности дарителя
      за вред, причинённый одаряемому вследствие недостатков вещи (ст. 580 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "недостатки"
        - "дефекты"
        - "вред"
        - "причинённый вред"
        - "качество"
        - "состояние"
        - "как есть"
        - "ст. 580"
        - "предупредил о недостатках"
        - "скрытые недостатки"
        - "претензии по качеству"
        - "возмещение вреда"
        - "техническое состояние"
        - "износ"
        - "явные недостатки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)недостатк"
        - "(?i)дефект"
        - "(?i)ст\\.\\s*580"
        - "(?i)как\\s+есть"
        - "(?i)возмещен(ие|ия)\\s+вред"
        - "(?i)состояни[еи]\\s+вещ"
        - "(?i)скрыт(ые|ых)\\s+недостатк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (гл. 32 ГК РФ, ст. 580 ГК РФ; гл. 59 ГК РФ).
        Проверяется наличие условий о недостатках подаренной вещи и ответственности
        дарителя за причинённый вред.

        ВАЖНО ДЛЯ ПОНИМАНИЯ:
        - По ст. 580 ГК РФ вред, причинённый жизни, здоровью или имуществу одаряемого
          вследствие недостатков вещи, возмещается дарителем, если недостатки возникли
          до передачи, не являются явными, и даритель знал о них, но не предупредил.
        - Твоя задача — не оценивать риски, а установить, что прямо сказано в тексте
          договора о качестве вещи, известных дефектах и ответственности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверения о качестве подаренной вещи или предупреждение о недостатках.
        2. Список известных дефектов/недостатков, о которых даритель уведомил одаряемого.
        3. Оговорку о принятии вещи «как есть» (в текущем техническом состоянии).
        4. Условие об ответственности дарителя за вред или прямую ссылку на ст. 580 ГК РФ.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined" или "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель уведомляет Одаряемого о следующих недостатках автомобиля:
        неисправность датчика АБС, коррозия правого порога. Одаряемый с указанными
        недостатками ознакомлен и принимает вещь в текущем состоянии.
        Даритель не несёт ответственности за недостатки, о которых Одаряемый был предупреждён."

        Ответ:
        {
          "known_defects_disclosed_status": "defined",
          "known_defects_disclosed_details": "неисправность датчика АБС, коррозия правого порога",
          "as_is_condition_clause_status": "defined",
          "donor_liability_clause_status": "defined",
          "donor_liability_clause_display": "Освобождение от ответственности за раскрытые недостатки",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Даритель уведомляет Одаряемого о следующих недостатках автомобиля: неисправность датчика АБС, коррозия правого порога."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель передаёт вещь в собственность Одаряемого безвозмездно."

        Ответ:
        {
          "known_defects_disclosed_status": "not_defined",
          "known_defects_disclosed_details": "Данные не определены",
          "as_is_condition_clause_status": "not_defined",
          "donor_liability_clause_status": "not_defined",
          "donor_liability_clause_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли конкретные дефекты или недостатки?
        2. Есть ли оговорка «в состоянии как есть» / «с состоянием ознакомлен»?
        3. Есть ли пункт об ответственности за вред от недостатков или ссылка на ст. 580 ГК РФ?
        4. Если ничего нет — верни "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "known_defects_disclosed_status": "<defined / not_defined>",
          "known_defects_disclosed_details": "<описание дефектов или 'Данные не определены'>",
          "as_is_condition_clause_status": "<defined / not_defined>",
          "donor_liability_clause_status": "<defined / not_defined>",
          "donor_liability_clause_display": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "liability_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "недостатки дефекты вред причинённый вред качество состояние как есть ст. 580 ГК РФ предупредил о недостатках скрытые недостатки возмещение вреда техническое состояние износ претензии по качеству"
      preferred_unit_types:
        - liability_provision
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - representations
        - obligations
      negative_keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "государственная регистрация"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "встречное предоставление"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "donor_liability_for_defects_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения условия
        о качестве вещи, известных недостатках, принятии дара «как есть»
        и ответственности дарителя за вред вследствие недостатков (ст. 580 ГК РФ).
        Не анализируй стороны, порядок передачи, налоги или отмену дарения.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. donor_liability_for_defects_presence:
           Агрегатное signal-поле — наличие регулирования по теме качества,
           недостатков дара и ответственности за вред.
           - "present" — если хотя бы одно из содержательных полей
             (known_defects_disclosed_status, as_is_condition_clause_status,
              donor_liability_clause_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - known_defects_disclosed_status = "not_defined";
           - as_is_condition_clause_status = "not_defined";
           - donor_liability_clause_status = "not_defined";
           - known_defects_disclosed_details = "Данные не определены";
           - donor_liability_clause_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. known_defects_disclosed_status:
           - "defined" — если в договоре прямо раскрыты конкретные недостатки/дефекты
             подаренной вещи или прямо подтверждено их отсутствие;
           - "not_defined" — если недостатки и состояние вещи не обсуждаются.

        2. known_defects_disclosed_details:
           Краткое user-facing описание раскрытых дефектов или состояния вещи
           на русском языке.
           Примеры: "неисправность датчика АБС, коррозия порога",
           "вещь бывшая в употреблении, имеет эксплуатационный износ",
           "скрытые и явные недостатки отсутствуют".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. as_is_condition_clause_status:
           - "defined" — если прямо включена оговорка о принятии вещи в текущем
             состоянии («как есть», «ознакомлен с техническим состоянием»,
             «претензий к качеству не имеет»);
           - "not_defined" — если оговорка о состоянии отсутствует.

        4. donor_liability_clause_status:
           - "defined" — если в договоре прямо урегулирован вопрос ответственности
             дарителя за вред от недостатков вещи (ссылка на ст. 580 ГК РФ,
             оговорка о возмещении вреда или об освобождении от ответственности);
           - "not_defined" — если ответственность за вред от недостатков
             не обсуждается.

        5. donor_liability_clause_display:
           Краткое user-facing описание режима ответственности дарителя на русском языке.
           Примеры:
           - "По ст. 580 ГК РФ (ответственность за вред от скрытых недостатков)";
           - "Освобождение от ответственности за раскрытые недостатки";
           - "Одаряемый принимает на себя все риски, связанные с состоянием вещи";
           - "Претензии по качеству после передачи не принимаются".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни donor_liability_for_defects_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_display = "Данные не определены".
        - Используй только текст договора.
        - Не применяй ст. 580 ГК РФ по умолчанию — только если условие прямо сформулировано в договоре.
        - Фраза «Одаряемый претензий к качеству не имеет» устанавливает as_is_condition_clause_status = "defined".
        - Прямое перечисление дефектов устанавливает known_defects_disclosed_status = "defined".
        - Если в разных фрагментах указаны противоречивые условия (в одном — «вещь в идеальном состоянии», в другом — «имеются существенные неисправности двигателя»), верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания качества, дефектов, состояния вещи
           или ответственности за вред.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details/*_display = "Данные не определены".

        2. Принятие «как есть» без конкретизации дефектов.
           "Одаряемый ознакомлен с техническим состоянием вещи
           и претензий по качеству не имеет."
           → presence = "present";
             as_is_condition_clause_status = "defined";
             known_defects_disclosed_status = "not_defined";
             donor_liability_clause_status = "not_defined";
             donor_liability_clause_display = "Принятие в текущем состоянии («как есть»)".

        3. Противоречие между фрагментами.
           В одном пункте — "вещь передаётся без недостатков и дефектов",
           в акте — "обнаружены скрытые повреждения проводки".
           → presence = "unclear";
             known_defects_disclosed_status = "not_defined";
             known_defects_disclosed_details = "Не удалось определить".

        4. Полное раскрытие недостатков и распределение ответственности.
           "Даритель уведомил Одаряемого о трещине на лобовом стекле.
           Одаряемый предупреждён и принимает дар. Ответственность Дарителя
           ограничивается рамками ст. 580 ГК РФ."
           → presence = "present";
             known_defects_disclosed_status = "defined";
             known_defects_disclosed_details = "трещина на лобовом стекле";
             as_is_condition_clause_status = "defined";
             donor_liability_clause_status = "defined";
             donor_liability_clause_display = "По ст. 580 ГК РФ с раскрытием дефекта".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для donor_liability_for_defects_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * known_defects_disclosed_details, donor_liability_clause_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * known_defects_disclosed_details, donor_liability_clause_display → "Не удалось определить";
          * donor_liability_for_defects_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "donor_liability_for_defects_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме качества вещи, дефектов и ответственности дарителя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "known_defects_disclosed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия сведений об известных недостатках/дефектах дара."
          required: true

        - name: "known_defects_disclosed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Раскрытые недостатки дара"
          description: >
            Конкретные дефекты или особенности состояния подаренной вещи,
            о которых даритель уведомил одаряемого.
            Примеры: "неисправность датчика АБС", "эксплуатационный износ", "недостатки отсутствуют".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "as_is_condition_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о принятии дара в текущем состоянии («как есть»)."
          required: true

        - name: "donor_liability_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об ответственности дарителя за вред от недостатков (ст. 580 ГК РФ)."
          required: true

        - name: "donor_liability_clause_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ответственность дарителя за вред"
          description: >
            User-facing описание режима ответственности дарителя за вред,
            причинённый недостатками вещи.
            Примеры: "По ст. 580 ГК РФ", "Освобождение от ответственности за раскрытые недостатки".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

      store_payload: true


# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_authority_and_capacity:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты дарителя и одаряемого (ФИО/наименование, ИНН/ОГРН/ОГРНИП,
      паспортные данные для физлиц, адрес);
      (б) полномочия подписантов (устав, доверенность, решение о назначении);
      (в) документы о корпоративном одобрении — протокол общего собрания /
      решение единственного участника / одобрение совета директоров —
      либо заключение о ненужности одобрения;
      (г) при наличии несовершеннолетних или недееспособных — документы законного
      представителя и согласие органа опеки (при необходимости);
      (д) при праве хозяйственного ведения / оперативного управления —
      согласие собственника (ст. 576 п. 1 ГК РФ).
    addressee: "Обе стороны / Юридический советник"

  donation_subject_and_gratuitousness_extraction:
    text: >
      Просим предоставить по {doc_names}:
      (а) точное описание предмета дарения с достаточной индивидуализацией
      (серийный номер, VIN, кадастровый номер, ОГРН и т.п.);
      (б) прямое и недвусмысленное подтверждение безвозмездности передачи;
      (в) заверение сторон о непритворном характере сделки (не прикрывает
      куплю-продажу, мену, ренту или иную возмездную передачу);
      (г) отсутствие каких-либо обязательств одаряемого в пользу дарителя.
    addressee: "Обе стороны / Юридический советник"

  counter_performance_check:
    text: >
      В {doc_names} необходимо устранить формулировки, которые могут трактоваться
      как встречное предоставление. Просим:
      (а) удалить или скорректировать условия об оплате, компенсации, содержании,
      уходе, обязательствах одаряемого перед дарителем;
      (б) добавить защитную оговорку о безвозмездности и отсутствии встречного
      предоставления;
      (в) при наличии элементов ренты — рассмотреть конструкцию договора ренты
      вместо дарения.
    addressee: "Юридический советник"

  promise_of_gift_form_and_specificity:
    text: >
      По {doc_names} (обещание дарения) просим подтвердить:
      (а) письменную форму договора;
      (б) конкретный и индивидуализированный предмет обещания
      (без формулировок «всё имущество» или иных неопределённых описаний);
      (в) допустимость условия, при наступлении которого обещание вступает в силу;
      (г) порядок отказа дарителя при существенном ухудшении его положения (ст. 577 ГК РФ).
    addressee: "Юридический советник"

  transfer_procedure_and_ownership:
    text: >
      Просим уточнить по {doc_names}:
      (а) порядок и момент фактической передачи дара (дата, место, условия);
      (б) необходимость и форму акта приёма-передачи;
      (в) момент перехода права собственности (при вручении / при регистрации);
      (г) порядок действий при отказе одаряемого принять дар.
    addressee: "Обе стороны"

  donation_revocation_and_refusal_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) основания отмены дарения и отказа от исполнения обещания
      — в строгом соответствии со ст. 577-578 ГК РФ;
      (б) наличие/отсутствие условия о возврате дара при смерти одаряемого
      ранее дарителя (ст. 578 ч. 4 ГК РФ);
      (в) права одаряемого на отказ от принятия дара до передачи (ст. 573 ГК РФ);
      (г) отсутствие произвольного расширения права дарителя вернуть дар.
    addressee: "Юридический советник"

  encumbrances_bankruptcy_and_sham_risk:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения дарителя об отсутствии обременений, залогов, арестов,
      сервитутов и прав третьих лиц на предмет дарения;
      (б) заверение дарителя об отсутствии процедуры банкротства,
      признаков неплатёжеспособности и о том, что сделка не нарушает
      права кредиторов (ФЗ-127, ст. 61.2-61.3);
      (в) заверение сторон о непритворном характере сделки.
    addressee: "Даритель / Юридический советник"

  co_ownership_consent_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) документы, подтверждающие режим собственности на предмет дарения
      (единоличная / совместная / долевая);
      (б) нотариальное согласие супруга дарителя (ст. 35 СК РФ) либо
      подтверждение того, что имущество является личной собственностью /
      даритель не состоит в браке / действует брачный договор;
      (в) согласие всех сособственников (ст. 576 п. 2, 253 ГК РФ) либо
      подтверждение единоличной собственности дарителя.
    addressee: "Даритель / Юридический советник"

  charitable_donation_target_use_check:
    text: >
      Для {doc_names} (пожертвование) просим определить:
      (а) точную общеполезную цель пожертвования (ст. 582 ГК РФ);
      (б) режим целевого использования имущества/средств;
      (в) порядок, форму и периодичность отчётности одаряемого перед жертвователем;
      (г) условия и порядок изменения цели использования (с согласия жертвователя);
      (д) последствия нецелевого использования — право жертвователя отменить пожертвование.
    addressee: "Одаряемый / Юридический советник"

  real_estate_gift_specifics_check:
    text: >
      Для {doc_names} (дарение недвижимости) просим предоставить:
      (а) кадастровый номер, адрес и площадь объекта;
      (б) свежую выписку из ЕГРН (не старше 30 дней);
      (в) правоустанавливающий документ дарителя;
      (г) подтверждение отсутствия залогов, арестов, обременений;
      (д) перечень лиц, сохраняющих право пользования жилым помещением,
      или прямое подтверждение их отсутствия (ст. 558 ГК РФ);
      (е) порядок и сроки подачи документов на регистрацию перехода права в Росреестр;
      (ж) распределение расходов на государственную пошлину.
    addressee: "Даритель / Юридический советник"

  donee_tax_consequences_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) статус родства между дарителем и одаряемым (близкие родственники /
      иные лица) для целей применения ст. 217 п. 18.1 НК РФ;
      (б) налоговые последствия для одаряемого — обязанность уплатить НДФЛ
      (13%/15% от рыночной/кадастровой стоимости дара) или освобождение
      при дарении между близкими родственниками;
      (в) необходимость подачи налоговой декларации 3-НДФЛ одаряемым.
    addressee: "Налоговый консультант / Юридический советник"

  share_gift_compliance_check:
    text: >
      Для {doc_names} (дарение доли в ООО) просим предоставить:
      (а) устав общества — для проверки запретов или ограничений на дарение доли;
      (б) подтверждение нотариального удостоверения сделки (обязательно по ст. 21 ФЗ-14);
      (в) сведения о необходимости согласия участников общества на дарение доли;
      (г) размер и номинальную стоимость даримой доли;
      (д) порядок уведомления общества и внесения изменений в ЕГРЮЛ через нотариуса.
    addressee: "Даритель / Нотариус / Юридический советник"

  termination_and_disputes:
    text: >
      Просим уточнить по {doc_names}:
      (а) подсудность споров (арбитражный суд / суд общей юрисдикции /
      третейский суд);
      (б) претензионный порядок с конкретным сроком рассмотрения претензии;
      (в) условия конфиденциальности: перечень охраняемых сведений,
      исключения, срок действия;
      (г) форс-мажорная оговорка (перечень обстоятельств, срок уведомления,
      документальное подтверждение) — актуально для договоров с обещанием дарения;
      (д) подтверждение применимого права (РФ или иное с обоснованием).
    addressee: "Юридический советник"

  commercial_entities_gift_prohibition:
    text: >
      Внимание: дарение между коммерческими организациями по {doc_names}
      может быть ничтожным по ст. 575 ГК РФ (за исключением обычных подарков
      до 3 000 руб.). Просим:
      (а) подтвердить организационно-правовой статус обеих сторон;
      (б) указать стоимость передаваемого имущества;
      (в) предоставить правовое заключение о допустимости выбранной конструкции
      либо рассмотреть иную правовую форму передачи имущества.
    addressee: "Юридический советник"

  counter_performance_reclassification_risk:
    text: >
      Внимание: в {doc_names} выявлены признаки встречного предоставления,
      несовместимые с дарением. Это создаёт риск переквалификации в куплю-продажу,
      мену, ренту или признания сделки притворной (ст. 572, 170 ГК РФ). Просим:
      (а) удалить все условия, допускающие встречные обязательства одаряемого;
      (б) добавить защитную оговорку о безвозмездности;
      (в) при необходимости — выбрать иную правовую конструкцию.
    addressee: "Юридический советник"

  bankruptcy_challenge_risk:
    text: >
      Внимание: {doc_names} содержит риск оспаривания в рамках возможного
      банкротства дарителя (ФЗ-127, ст. 61.2-61.3). Просим предоставить:
      (а) сведения о финансовом состоянии дарителя и отсутствии процедуры банкротства;
      (б) подтверждение того, что сделка не нарушает права кредиторов;
      (в) анализ периода подозрительности (1 год / 3 года до возможного банкротства).
    addressee: "Юридический советник / Финансовый консультант"

  minor_incapacitated_gift_restriction:
    text: >
      Внимание: {doc_names} содержит признаки участия малолетнего или недееспособного
      лица. Дарение от их имени запрещено ст. 575 ГК РФ. Просим:
      (а) подтвердить дееспособность сторон;
      (б) при участии законного представителя — документы его полномочий;
      (в) при необходимости — согласие органа опеки и попечительства (ст. 37 ГК РФ).
    addressee: "Законный представитель / Юридический советник"

  public_official_gift_prohibition:
    text: >
      Внимание: {doc_names} может подпадать под запрет дарения по ст. 575 п. 2-3 ГК РФ.
      Просим подтвердить:
      (а) статус одаряемого (государственный / муниципальный служащий, работник
      образовательной, медицинской или социальной организации);
      (б) связь или отсутствие связи дарения с исполнением должностных обязанностей;
      (в) стоимость дара (обычный подарок до 3 000 руб. — исключение из запрета).
    addressee: "Юридический советник"

  joint_property_consent_required:
    text: >
      Внимание: {doc_names} содержит признаки дарения общего (совместного) имущества.
      По ст. 576 п. 2, 253 ГК РФ требуется согласие всех сособственников. Просим:
      (а) документы, подтверждающие режим собственности;
      (б) нотариальное согласие всех сособственников или подтверждение
      единоличного права собственности дарителя.
    addressee: "Даритель / Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
