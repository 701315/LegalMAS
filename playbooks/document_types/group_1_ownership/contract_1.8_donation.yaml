        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет дарения свободен от залогов, обременений и арестов.
        Права третьих лиц на имущество отсутствуют.
        Даритель не находится в процедуре банкротства и не имеет признаков
        несостоятельности. Дарение не нарушает права кредиторов.
        Настоящий договор не является притворной сделкой."

        Ответ:
