      store_payload: true

  - id: co_ownership_consent_check
    name: "Дарение совместного имущества: согласие супруга и сособственников (ст. 35 СК РФ, ст. 576, 253 ГК РФ)"
    description: >
      Фактографическая проверка наличия согласия супруга и/или сособственников
      при дарении имущества в общей собственности.
    triggers:
      any: ["joint_property_gift", "spousal_consent_relevant"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "общая собственность"
        - "совместная собственность"
        - "долевая собственность"
        - "согласие сособственников"
        - "согласие всех участников"
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "личная собственность"
        - "брачный договор"
        - "единоличная собственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+(всех\\s+)?участник"
        - "(?i)согласи(е|я)\\s+сособственник"
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)общ(ая|ей)\\s+(совместн|долев)"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения (ст. 576 ГК РФ; ст. 35 СК РФ; ст. 253 ГК РФ).
        Проверяется наличие согласия при дарении совместного или долевого имущества.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим собственности на предмет дарения (единоличная / совместная / долевая).
        2. Наличие согласия сособственников или заверение об единоличной собственности.
        3. Наличие нотариального согласия супруга или подтверждение отсутствия брака.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет дарения находится в совместной собственности супругов.
        Нотариальное согласие супруга Дарителя получено. Имущество не является
        долевой собственностью третьих лиц."

        Ответ:
        {
          "ownership_regime_status": "defined",
          "ownership_regime_code": "joint",
          "co_owner_consent_status": "defined",
          "co_owner_consent_code": "not_required_stated",
          "spousal_consent_status": "defined",
          "spousal_consent_code": "consent_present",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Предмет дарения находится в совместной собственности супругов."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель является единственным собственником имущества и в зарегистрированном браке не состоит."

        Ответ:
        {
          "ownership_regime_status": "defined",
          "ownership_regime_code": "sole",
          "co_owner_consent_status": "defined",
          "co_owner_consent_code": "not_required_stated",
          "spousal_consent_status": "defined",
          "spousal_consent_code": "not_married_confirmed",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Даритель является единственным собственником имущества и в зарегистрированном браке не состоит."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написан ли режим собственности прямо?
        2. Упомянуты ли согласие супруга или отсутствие брака?
        3. Упомянуто ли согласие сособственников или единоличная собственность?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "ownership_regime_status": "<defined / not_defined>",
          "ownership_regime_code": "<sole / joint / shared / not_defined>",
          "co_owner_consent_status": "<defined / not_defined>",
          "co_owner_consent_code": "<obtained / not_required_stated / not_defined>",
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_code": "<consent_present / not_married_confirmed / prenuptial / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "общая собственность совместная собственность долевая собственность согласие сособственников согласие всех участников согласие супруга нотариальное согласие не состоит в браке личная собственность брачный договор единоличная собственность ст. 576 ГК РФ ст. 35 СК РФ ст. 253 ГК РФ"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "корпоративное одобрение"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "крупная сделка"
        - "обременения"
        - "залог"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "кадастровый номер"
        - "отмена дарения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "co_ownership_consent_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения данные
        о режиме собственности на предмет дарения, согласии сособственников
        и согласии супруга.
        Не анализируй стороны, предмет дарения, обременения, налоги или передачу.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. co_ownership_consent_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме совместной
           собственности и согласий.
           - "present" — если хотя бы одно из содержательных полей
             (ownership_regime_status, co_owner_consent_status,
              spousal_consent_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ownership_regime_status = "not_defined";
           - ownership_regime_code = "not_defined";
           - co_owner_consent_status = "not_defined";
           - co_owner_consent_code = "not_defined";
           - spousal_consent_status = "not_defined";
           - spousal_consent_code = "not_defined";
           - не выполняй остальные шаги.

        1. ownership_regime_status:
           - "defined" — если режим собственности на предмет дарения прямо
             указан в тексте договора;
           - "not_defined" — если режим собственности не обсуждается.

        2. ownership_regime_code:
           - "sole" — прямо указана единоличная собственность Дарителя
             ("единственный собственник", "личная собственность",
              "принадлежит на праве единоличной собственности");
           - "joint" — прямо указана совместная собственность
             ("совместная собственность супругов", "общая совместная");
           - "shared" — прямо указана долевая собственность
             ("долевая собственность", "доля в праве");
           - "not_defined" — режим не указан.

        3. co_owner_consent_status:
           - "defined" — если согласие сособственников прямо получено
             или прямо указано, что согласие не требуется
             (в силу единоличной собственности);
           - "not_defined" — если вопрос согласия сособственников
             не обсуждается.

        4. co_owner_consent_code:
           - "obtained" — согласие сособственников прямо получено
             ("согласие всех участников долевой собственности получено");
           - "not_required_stated" — прямо указано, что согласие не требуется
             или имущество является единоличной собственностью;
           - "not_defined" — вопрос не обсуждается.

        5. spousal_consent_status:
           - "defined" — если согласие супруга прямо указано,
             подтверждено отсутствие брака или есть ссылка на брачный договор;
           - "not_defined" — если вопрос супружеского согласия не обсуждается.

        6. spousal_consent_code:
           - "consent_present" — нотариальное согласие супруга прямо указано
             ("нотариальное согласие супруга получено");
           - "not_married_confirmed" — прямо указано, что Даритель
             не состоит в зарегистрированном браке;
           - "prenuptial" — прямо есть ссылка на брачный договор,
             регулирующий режим собственности;
           - "not_defined" — вопрос не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни co_ownership_consent_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_code = "not_defined".
        - Используй только текст договора.
        - Не делай предположений о семейном положении.
        - sole = прямо указана единоличная собственность.
        - joint = прямо указана совместная собственность.
        - shared = прямо указана долевая собственность.
        - obtained = согласие сособственников прямо получено.
        - not_required_stated = прямо указано, что согласие не требуется или имущество единоличное.
        - consent_present = нотариальное согласие супруга прямо указано.
        - not_married_confirmed = прямо указано, что даритель не состоит в браке.
        - prenuptial = прямо есть ссылка на брачный договор.
        - Если в разных фрагментах указаны противоречивые данные (в одном — "совместная собственность", в другом — "единоличная"), верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания режима собственности, ни согласия
           супруга, ни согласия сособственников.
           → presence = "missing";
             все *_status = "not_defined";
             все *_code = "not_defined".

        2. Единоличная собственность, даритель не в браке.
           "Даритель является единственным собственником имущества
           и в зарегистрированном браке не состоит."
           → presence = "present";
             ownership_regime_status = "defined";
             ownership_regime_code = "sole";
             co_owner_consent_status = "defined";
             co_owner_consent_code = "not_required_stated";
             spousal_consent_status = "defined";
             spousal_consent_code = "not_married_confirmed".

        3. Противоречие между фрагментами.
           В преамбуле — "Даритель является единственным собственником",
           в п. 3 — "имущество находится в совместной собственности супругов".
           → presence = "unclear";
             ownership_regime_status = "not_defined";
             ownership_regime_code = "not_defined".

        4. Долевая собственность с согласием всех участников.
           "Предмет дарения находится в долевой собственности.
           Согласие всех участников долевой собственности получено
           и оформлено нотариально."
           → presence = "present";
             ownership_regime_status = "defined";
             ownership_regime_code = "shared";
             co_owner_consent_status = "defined";
             co_owner_consent_code = "obtained".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для co_ownership_consent_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для ownership_regime_code используй только: "sole", "joint", "shared", "not_defined".
        - Для co_owner_consent_code используй только: "obtained", "not_required_stated", "not_defined".
        - Для spousal_consent_code используй только: "consent_present", "not_married_confirmed", "prenuptial", "not_defined".
        - Fallback при отсутствии данных:
          * все *_status → "not_defined";
          * все *_code → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * co_ownership_consent_check_presence → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "co_ownership_consent_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме совместной собственности и согласий. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ownership_regime_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения режима собственности на предмет дарения."
          required: true

        - name: "ownership_regime_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["sole", "joint", "shared", "not_defined"]
          display_in_grid: false
          description: "Режим собственности на предмет дарения."
          required: true

        - name: "co_owner_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия согласия сособственников или заверения об его ненужности."
          required: true

        - name: "co_owner_consent_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["obtained", "not_required_stated", "not_defined"]
          display_in_grid: false
          description: "Статус согласия сособственников при дарении из общей собственности."
          required: true

        - name: "spousal_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия согласия супруга или подтверждения отсутствия брака."
          required: true

        - name: "spousal_consent_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["consent_present", "not_married_confirmed", "prenuptial", "not_defined"]
          display_in_grid: false
          description: "Статус согласия супруга дарителя на дарение."
          required: true

      store_payload: true

  - id: charitable_donation_target_use_check
    name: "Пожертвование: общеполезная цель, целевое использование, отчётность (ст. 582 ГК РФ)"
    description: >
      Фактографическая проверка наличия общеполезной цели пожертвования, режима
      целевого использования и обязанности отчётности одаряемого.
    triggers:
      any: ["charitable_donation"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "пожертвование"
        - "общеполезные цели"
        - "целевое использование"
        - "отчёт"
        - "отчётность"
        - "благотворительные цели"
        - "использование по назначению"
        - "изменение цели использования"
        - "пожертвованное имущество"
        - "отмена пожертвования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)целев(ое|ого)\\s+использован"
        - "(?i)общеполезн(ые|ых)\\s+цел"
        - "(?i)отч[её]т"
        - "(?i)пожертвовани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор пожертвования (ст. 582 ГК РФ).
        Проверяется наличие условий о целевом использовании и отчётности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Конкретную общеполезную цель пожертвования.
        2. Режим целевого использования имущества.
        3. Обязанность отчитываться перед жертвователем.
        4. Периодичность отчётности.
        5. Условия и порядок изменения цели.
        6. Последствия нецелевого использования.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Пожертвование осуществляется на цели оснащения школьной библиотеки.
        Одаряемый обязан ежегодно предоставлять отчёт об использовании имущества.
        Изменение цели допускается только с письменного согласия Жертвователя.
        При нецелевом использовании пожертвование подлежит отмене."

        Ответ:
        {
          "target_use_status": "defined",
          "target_use_details": "оснащение школьной библиотеки",
          "reporting_obligation_status": "defined",
          "reporting_frequency_status": "defined",
          "reporting_frequency_details": "ежегодно",
          "change_of_purpose_consent_status": "defined",
          "non_target_use_consequences_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Пожертвование осуществляется на цели оснащения школьной библиотеки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель передаёт имущество Одаряемому безвозмездно."

        Ответ:
        {
          "target_use_status": "not_defined",
          "target_use_details": "Данные не определены",
          "reporting_obligation_status": "not_defined",
          "reporting_frequency_status": "not_defined",
          "reporting_frequency_details": "Данные не определены",
          "change_of_purpose_consent_status": "not_defined",
          "non_target_use_consequences_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли конкретная цель (не просто "благотворительность")?
        2. Упомянута ли обязанность отчитываться?
        3. Что происходит при нецелевом использовании?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "target_use_status": "<defined / not_defined>",
          "target_use_details": "<описание цели или 'Данные не определены'>",
          "reporting_obligation_status": "<defined / not_defined>",
          "reporting_frequency_status": "<defined / not_defined>",
          "reporting_frequency_details": "<периодичность или 'Данные не определены'>",
          "change_of_purpose_consent_status": "<defined / not_defined>",
          "non_target_use_consequences_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "пожертвование общеполезные цели целевое использование отчёт отчётность благотворительные цели использование по назначению изменение цели использования пожертвованное имущество отмена пожертвования ст. 582 ГК РФ нецелевое использование"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "безвозмездно передаёт в дар обычный"
        - "отмена дарения ст. 578"
        - "встречное предоставление"
        - "обременения"
        - "залог"
        - "банкротство"
        - "НДФЛ"
        - "кадастровый номер"
        - "ЕГРН"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "charitable_donation_target_use_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора пожертвования
        данные о целевом использовании имущества, обязанности отчётности
        и последствиях нецелевого использования (ст. 582 ГК РФ).
        Не анализируй стороны, передачу, безвозмездность или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. charitable_donation_target_use_presence:
           Агрегатное signal-поле — наличие регулирования по теме целевого
           использования пожертвования.
           - "present" — если хотя бы одно из содержательных полей
             (target_use_status, reporting_obligation_status,
              non_target_use_consequences_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - target_use_status = "not_defined";
           - reporting_obligation_status = "not_defined";
           - non_target_use_consequences_status = "not_defined";
           - reporting_frequency_status = change_of_purpose_consent_status = "not_defined";
           - target_use_details, reporting_frequency_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. target_use_status:
           - "defined" — если целевое использование прямо определено
             (конкретная общеполезная цель: "оснащение школьной библиотеки",
              "лечение детей", "строительство храма");
           - "not_defined" — если цель не указана или сформулирована
             слишком абстрактно ("благотворительные цели" без конкретизации).

        2. target_use_details:
           Краткое user-facing описание цели пожертвования на русском языке.
           Примеры: "оснащение школьной библиотеки", "лечение детей с ОВЗ",
           "строительство спортивной площадки".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. reporting_obligation_status:
           - "defined" — если обязанность отчитываться перед жертвователем
             прямо предусмотрена ("Одаряемый обязан предоставлять отчёт",
             "Жертвователь вправе требовать отчёт");
           - "not_defined" — если отчётность не обсуждается.

        4. reporting_frequency_status:
           - "defined" — если периодичность отчётности прямо указана
             ("ежегодно", "ежеквартально", "по запросу Жертвователя");
           - "not_defined" — если периодичность не указана.

        5. reporting_frequency_details:
           Краткое user-facing описание периодичности на русском языке.
           Примеры: "ежегодно", "ежеквартально", "по запросу Жертвователя",
           "в течение 30 дней по окончании календарного года".
           Если данных нет — "Данные не определены".

        6. change_of_purpose_consent_status:
           - "defined" — если порядок изменения цели использования прямо
             определён ("изменение цели допускается с письменного согласия
             Жертвователя", "цель не может быть изменена");
           - "not_defined" — если изменение цели не обсуждается.

        7. non_target_use_consequences_status:
           - "defined" — если последствия нецелевого использования прямо
             указаны ("пожертвование подлежит отмене", "Жертвователь вправе
             потребовать возврата имущества");
           - "not_defined" — если последствия нецелевого использования
             не обсуждаются.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни charitable_donation_target_use_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не применяй ст. 582 ГК РФ по умолчанию — только прямые формулировки из договора.
        - "Благотворительные цели" без конкретизации — это "not_defined" для target_use_status.
        - Если цель определена через приложение или отдельный документ, прямо названный в тексте, — это "defined".
        - Если в разных фрагментах указаны разные цели и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни цели пожертвования, ни отчётности,
           ни последствий нецелевого использования.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Цель указана, но без отчётности и последствий.
           "Пожертвование осуществляется на цели оснащения школьной библиотеки."
           Без упоминания отчётности и нецелевого использования.
           → presence = "present";
             target_use_status = "defined";
             reporting_obligation_status = "not_defined";
             non_target_use_consequences_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "целевое использование на лечение детей",
           в другом — "пожертвование на уставные цели Одаряемого".
           → presence = "unclear";
             target_use_status = "not_defined";
             target_use_details = "Не удалось определить".

        4. Полное регулирование: цель + отчётность + последствия + изменение.
           "Пожертвование на оснащение библиотеки. Одаряемый отчитывается
           ежегодно. Изменение цели — с согласия Жертвователя.
           При нецелевом использовании — отмена пожертвования."
           → presence = "present";
             все *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для charitable_donation_target_use_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * target_use_details, reporting_frequency_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * target_use_details, reporting_frequency_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "charitable_donation_target_use_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме целевого использования пожертвования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "target_use_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения целевого использования пожертвованного имущества."
          required: true

        - name: "target_use_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Цель пожертвования"
          description: >
            Конкретная общеполезная цель использования пожертвованного имущества.
            Примеры: "оснащение школьной библиотеки", "лечение детей с ОВЗ".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "reporting_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия обязанности одаряемого отчитываться перед жертвователем."
          required: true

        - name: "reporting_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения периодичности отчётности."
          required: true

        - name: "reporting_frequency_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Периодичность отчётности"
          description: >
            Периодичность предоставления отчётов об использовании пожертвования.
            Примеры: "ежегодно", "ежеквартально", "по запросу Жертвователя".
            Fallback: "Данные не определены".
          required: false

        - name: "change_of_purpose_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка изменения цели использования пожертвования."
          required: true

        - name: "non_target_use_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения последствий нецелевого использования пожертвованного имущества."
          required: true

      store_payload: true

  - id: real_estate_gift_specifics_check
    name: "Дарение недвижимости: идентификация, регистрация, обременения, проживающие лица"
    description: >
      Фактографическая проверка наличия специальных условий для дарения недвижимого
      имущества: кадастровый номер, выписка ЕГРН, регистрация, перечень проживающих,
      право пожизненного проживания дарителя.
    triggers:
      any: ["real_estate_gift"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "Росреестр"
        - "государственная регистрация"
        - "обременение"
        - "право пользования"
        - "зарегистрированные лица"
        - "жилое помещение"
        - "передаточный акт"
        - "выписка из ЕГРН"
        - "право собственности"
        - "основание права"
        - "проживающие лица"
        - "снят с регистрационного учёта"
        - "пожизненное проживание"
        - "пожизненное пользование"
        - "сохраняет право проживания"
        - "право проживания дарителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)зарегистрированн(ые|ых)\\s+лиц"
        - "(?i)пожизненн(ое|ого)\\s+(проживани|пользован)"
        - "(?i)сохраняет\\s+право\\s+проживан"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор дарения недвижимого имущества (ст. 574 ГК РФ;
        ст. 131, 551, 556, 558 ГК РФ; ФЗ-218).
        Проверяется наличие специальных условий для дарения недвижимости.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер объекта (формат NN:NN:NNNNNNN:N).
        2. Ссылку на выписку ЕГРН.
        3. Основание права дарителя.
        4. Гарантию отсутствия обременений.
        5. Порядок государственной регистрации перехода права.
        6. Распределение расходов на госпошлину.
        7. Перечень лиц, сохраняющих право пользования (ст. 558 ГК РФ).
        8. Передаточный акт.
        9. Право пожизненного проживания дарителя в подаренном объекте.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Даритель передаёт в дар квартиру, кадастровый номер 77:06:0001001:123.
        Право собственности Дарителя подтверждено выпиской из ЕГРН от 01.03.2026.
        Основание права — договор купли-продажи от 15.06.2015.
        Объект не обременён и не заложен.
        Регистрация перехода права производится в Росреестре. Расходы несёт Одаряемый.
        Лиц, сохраняющих право пользования, нет.
        Передача — по передаточному акту.
        Даритель сохраняет право пожизненного проживания в подаренной квартире."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "egrn_extract_status": "defined",
          "donor_title_basis_status": "defined",
          "donor_title_basis_details": "договор купли-продажи от 15.06.2015",
          "encumbrances_status": "defined",
          "encumbrances_details": "не обременён и не заложен",
          "registration_procedure_status": "defined",
          "registration_cost_status": "defined",
          "residents_list_status": "defined",
          "residents_list_regime": "explicitly_none",
          "transfer_act_status": "defined",
          "donor_lifetime_residence_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Даритель передаёт в дар квартиру, кадастровый номер 77:06:0001001:123."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Даритель безвозмездно передаёт Одаряемому объект недвижимости."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "egrn_extract_status": "not_defined",
          "donor_title_basis_status": "not_defined",
          "donor_title_basis_details": "Данные не определены",
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Данные не определены",
          "registration_procedure_status": "not_defined",
          "registration_cost_status": "not_defined",
          "residents_list_status": "not_defined",
          "residents_list_regime": "not_defined",
          "transfer_act_status": "not_defined",
          "donor_lifetime_residence_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Кадастровый номер — только в формате XX:XX:XXXXXXX:X.
        2. Упомянута ли выписка ЕГРН?
        3. Описан ли порядок регистрации?
        4. Перечень проживающих — listed / explicitly_none / not_defined.
        5. Есть ли оговорка о пожизненном проживании дарителя?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<номер или 'Данные не определены'>",
          "egrn_extract_status": "<defined / not_defined>",
          "donor_title_basis_status": "<defined / not_defined>",
          "donor_title_basis_details": "<основание или 'Данные не определены'>",
          "encumbrances_status": "<defined / not_defined>",
          "encumbrances_details": "<текст или 'Данные не определены'>",
          "registration_procedure_status": "<defined / not_defined>",
          "registration_cost_status": "<defined / not_defined>",
          "residents_list_status": "<defined / not_defined>",
          "residents_list_regime": "<listed / explicitly_none / not_defined>",
          "transfer_act_status": "<defined / not_defined>",
          "donor_lifetime_residence_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кадастровый номер ЕГРН Росреестр государственная регистрация перехода права дарения обременение право пользования зарегистрированные лица жилое помещение передаточный акт выписка из ЕГРН право собственности основание права проживающие лица снят с регистрационного учёта госпошлина ст. 558 ГК РФ пожизненное проживание пожизненное пользование сохраняет право проживания право проживания дарителя"
      preferred_unit_types:
        - obligation
        - general_provision
        - warranty
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "обременения в общем смысле без ЕГРН"
        - "залог движимого имущества"
        - "арест движимого имущества"
        - "банкротство"
        - "НДФЛ"
        - "пожертвование"
        - "встречное предоставление"
        - "отмена дарения"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1350

      compact_output: false

      presence_signal:
        field: "real_estate_gift_specifics_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора дарения недвижимого
        имущества специальные условия: кадастровый номер, выписка ЕГРН,
        основание права дарителя, обременения, госрегистрация, зарегистрированные
        лица, передаточный акт, право пожизненного проживания дарителя.
        Не анализируй стороны, безвозмездность, налоги, отмену дарения или споры.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. real_estate_gift_specifics_presence:
           Агрегатное signal-поле — наличие регулирования по теме дарения
           недвижимости.
           - "present" — если хотя бы одно из содержательных полей
             (cadastral_number_status, registration_procedure_status,
              residents_list_status, donor_lifetime_residence_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cadastral_number_status = "not_defined";
           - registration_procedure_status = "not_defined";
           - residents_list_status = "not_defined";
           - donor_lifetime_residence_status = "not_defined";
           - egrn_extract_status = donor_title_basis_status =
             encumbrances_status = registration_cost_status =
             transfer_act_status = "not_defined";
           - residents_list_regime = "not_defined";
           - cadastral_number_value, donor_title_basis_details,
             encumbrances_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. cadastral_number_status:
           - "defined" — если кадастровый номер объекта прямо указан
             в формате NN:NN:NNNNNNN:N;
           - "not_defined" — если кадастровый номер не указан.

        2. cadastral_number_value:
           Кадастровый номер в формате NN:NN:NNNNNNN:N.
           Если данных нет — "Данные не определены".

        3. egrn_extract_status:
           - "defined" — если ссылка на выписку из ЕГРН прямо указана
             ("выписка из ЕГРН от ...", "согласно выписке из ЕГРН");
           - "not_defined" — если выписка не упомянута.

        4. donor_title_basis_status:
           - "defined" — если основание права собственности дарителя
             прямо указано (договор купли-продажи, наследство, приватизация,
             решение суда, дарение и т.п.);
           - "not_defined" — если основание не указано.

        5. donor_title_basis_details:
           Краткое user-facing описание основания права на русском языке.
           Примеры: "договор купли-продажи от 15.06.2015",
           "свидетельство о праве на наследство от 01.03.2020",
           "договор приватизации от 10.05.1998".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. encumbrances_status:
           - "defined" — если заверение об отсутствии обременений прямо
             указано ("не обременён", "свободен от прав третьих лиц",
             "залог и арест отсутствуют");
           - "not_defined" — если обременения не обсуждаются.

        7. encumbrances_details:
           Краткое user-facing описание заверения об обременениях.
           Примеры: "не обременён и не заложен", "ипотека в пользу
           ПАО Сбербанк (запись №...)", "арест отсутствует".
           Если данных нет — "Данные не определены".

        8. registration_procedure_status:
           - "defined" — если порядок государственной регистрации перехода
             права прямо описан ("регистрация в Росреестре", "стороны
             обязуются подать документы в МФЦ");
           - "not_defined" — если регистрация не обсуждается.

        9. registration_cost_status:
           - "defined" — если распределение расходов на госпошлину
             прямо указано ("расходы несёт Одаряемый", "расходы делятся
             поровну");
           - "not_defined" — если расходы не обсуждаются.

        10. residents_list_status:
            - "defined" — если перечень лиц, сохраняющих право пользования,
              прямо указан или прямо указано, что таких лиц нет;
            - "not_defined" — если вопрос не урегулирован.

        11. residents_list_regime:
            - "listed" — конкретные лица, сохраняющие право пользования,
              прямо перечислены (ст. 558 ГК РФ);
            - "explicitly_none" — прямо указано, что таких лиц нет
              ("лиц, сохраняющих право пользования, не имеется");
            - "not_defined" — вопрос не урегулирован.

        12. transfer_act_status:
            - "defined" — если передаточный акт прямо предусмотрен
              ("передача по передаточному акту", "акт приёма-передачи
              подписывается сторонами");
            - "not_defined" — если акт не упомянут.

        13. donor_lifetime_residence_status:
            - "defined" — если право пожизненного проживания дарителя
              в подаренном объекте прямо предусмотрено
              ("Даритель сохраняет право пожизненного проживания",
               "Даритель вправе проживать в квартире до конца жизни",
               "за Дарителем сохраняется право пользования жилым помещением");
            - "not_defined" — если право пожизненного проживания
              не обсуждается.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни real_estate_gift_specifics_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", residents_list_regime = "not_defined", все *_value/*_details = "Данные не определены".
        - Используй только текст договора.
        - Кадастровый номер — строго в формате NN:NN:NNNNNNN:N. Не выдумывай номер.
        - Не домысливай основание права дарителя.
        - listed = конкретные лица, сохраняющие право пользования, прямо перечислены.
        - explicitly_none = прямо указано, что таких лиц нет.
        - not_defined = вопрос не урегулирован прямо.
        - Если в тексте прямо указано, что объект обременён (ипотека, арест, сервитут), это тоже "defined" для encumbrances_status — зафиксируй факт.
        - donor_lifetime_residence_status = "defined" при любом прямом упоминании права дарителя проживать в объекте после передачи: "пожизненное проживание", "пожизненное пользование", "сохраняет право проживания", "вправе пользоваться жилым помещением". Не путай с общим перечнем проживающих лиц (residents_list) — это отдельное право дарителя.
        - Если в разных фрагментах указаны противоречивые данные (в одном — "обременений нет", в другом — "ипотека в пользу банка"), верни presence = "unclear".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни кадастрового номера, ни регистрации,
           ни проживающих лиц, ни обременений, ни права проживания.
           → presence = "missing";
             все *_status = "not_defined";
             residents_list_regime = "not_defined";
             все *_value/*_details = "Данные не определены".

        2. Частичное: кадастровый номер есть, но нет регистрации и проживающих.
           "Квартира, кадастровый номер 77:06:0001001:123."
           Без описания порядка регистрации, перечня проживающих
           и права проживания дарителя.
           → presence = "present";
             cadastral_number_status = "defined";
             registration_procedure_status = "not_defined";
             residents_list_status = "not_defined";
             donor_lifetime_residence_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "обременений нет",
           в другом — "объект находится в ипотеке".
           → presence = "unclear";
             encumbrances_status = "not_defined";
             encumbrances_details = "Не удалось определить".

        4. Квартира с правом пожизненного проживания дарителя.
           "Даритель передаёт квартиру Одаряемому. Даритель сохраняет
           право пожизненного проживания в подаренной квартире.
           Лиц, сохраняющих право пользования, кроме Дарителя, нет."
           → presence = "present";
             donor_lifetime_residence_status = "defined";
             residents_list_status = "defined";
             residents_list_regime = "explicitly_none".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для real_estate_gift_specifics_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_status) используй только: "defined" или "not_defined".
        - Для residents_list_regime используй только: "listed", "explicitly_none", "not_defined".
        - Fallback при отсутствии данных:
          * cadastral_number_value, donor_title_basis_details, encumbrances_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * cadastral_number_value, donor_title_basis_details, encumbrances_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "real_estate_gift_specifics_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме дарения недвижимости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия кадастрового номера объекта дарения."
          required: true

        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кадастровый номер объекта"
          description: >
            Кадастровый номер объекта недвижимости в формате NN:NN:NNNNNNN:N.
            Fallback: "Данные не определены".
          required: true

        - name: "egrn_extract_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия ссылки на выписку из ЕГРН."
          required: true

        - name: "donor_title_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения основания права собственности дарителя."
          required: true

        - name: "donor_title_basis_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Основание права дарителя"
          description: >
            Правоустанавливающий документ или иное основание права собственности
            дарителя на объект.
            Примеры: "договор купли-продажи от 15.06.2015",
            "свидетельство о праве на наследство".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия заверения об отсутствии обременений на объект дарения."
          required: true

        - name: "encumbrances_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Заверение об отсутствии обременений"
          description: >
            Текст заверения об отсутствии обременений, залога, ареста
            на объект недвижимости.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "registration_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка государственной регистрации перехода права собственности."
          required: true

        - name: "registration_cost_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения распределения расходов на госпошлину."
          required: true

        - name: "residents_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия перечня лиц, сохраняющих право пользования объектом после дарения."
          required: true

        - name: "residents_list_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["listed", "explicitly_none", "not_defined"]
          display_in_grid: true
          display_priority: 3
          label: "Сохраняющие право пользования лица"
          description: "Режим указания лиц, сохраняющих право пользования подаренным объектом недвижимости."
          required: true

        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о передаточном акте при дарении недвижимости."
          required: true

        - name: "donor_lifetime_residence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: true
          display_priority: 4
          label: "Право пожизненного проживания дарителя"
          description: >
            Статус наличия оговорки о сохранении за дарителем права
            пожизненного проживания (пользования) в подаренном объекте
            недвижимости. Распространена в договорах дарения между
            родственниками. Создаёт обременение для одаряемого.
          required: true

      store_payload: true

  - id: donee_tax_consequences_check
