        - name: "voltage_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если напряжение прямо указано. Иначе 'not_defined'."
        - name: "frequency_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
