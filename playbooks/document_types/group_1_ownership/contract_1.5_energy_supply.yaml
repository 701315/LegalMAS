      keyword_mode: "any"
      regex_patterns:
        - "(?i)для.*промышленных.*потребителей.*гарантируется.*бесперебойная"
        - "(?i)категория.*надежности.*энергоснабжения"
        - "(?i)для.*объектов.*первой.*категории.*надежности.*гарантируется"
        - "(?i)приоритетное.*восстановление.*энергоснабжения"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения промышленного потребителя.
        Проверяется наличие особых условий надёжности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Категорию надёжности (I / II / III).
        2. Требование к резервному питанию.
        3. Приоритетное восстановление подачи.
        4. Компенсацию убытков от простоя.
        5. Запрет полного отключения (для медучреждений / жизнеобеспечения).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — особые условия надёжности раскрыты:
        Фрагмент:
        "Абоненту установлена I категория надёжности электроснабжения.
        ЭСО обеспечивает резервное питание от второго независимого
        источника. Подача энергии восстанавливается в приоритетном
        порядке в течение 2 часов. ЭСО возмещает убытки от простоя
        в размере, определяемом соглашением сторон. Полное отключение
        Абонента не допускается."

        Ответ:
        {
          "reliability_category_status": "defined",
          "reliability_category_code": "I",
          "backup_power_status": "defined",
          "backup_power_details": "второй независимый источник питания",
          "priority_restoration_status": "defined",
          "downtime_compensation_status": "defined",
          "downtime_compensation_details": "в размере, определяемом соглашением сторон",
          "disconnection_prohibition_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Абоненту установлена I категория надёжности электроснабжения. ЭСО обеспечивает резервное питание от второго независимого источника."
            }
          ]
        }

        Пример 2 — особые условия не раскрыты:
        Фрагмент:
        "ЭСО обязуется подавать Абоненту электрическую энергию
        в согласованных объёмах."

        Ответ:
        {
          "reliability_category_status": "not_defined",
          "reliability_category_code": "not_defined",
          "backup_power_status": "not_defined",
          "backup_power_details": "Данные не определены",
          "priority_restoration_status": "not_defined",
          "downtime_compensation_status": "not_defined",
          "downtime_compensation_details": "Данные не определены",
          "disconnection_prohibition_status": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написана категория (I, II, III или первая, вторая, третья)?
        2. Прямо ли написано о резервном питании?
        3. Прямо ли написано о компенсации убытков от простоя?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "reliability_category_status": "<defined / not_defined>",
          "reliability_category_code": "<I / II / III / not_defined>",
          "backup_power_status": "<defined / not_defined>",
          "backup_power_details": "<требования или 'Данные не определены'>",
          "priority_restoration_status": "<defined / not_defined>",
          "downtime_compensation_status": "<defined / not_defined>",
          "downtime_compensation_details": "<условия или 'Данные не определены'>",
          "disconnection_prohibition_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
