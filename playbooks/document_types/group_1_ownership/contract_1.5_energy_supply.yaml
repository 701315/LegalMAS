          label: "Содержание сетей и оборудования"
          description: >
            Обязанности абонента по содержанию энергопринимающего оборудования и внутренних сетей. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "accident_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока уведомления об аварии. Внутреннее enum-поле."
          required: true

        - name: "accident_notification_deadline"
