# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_authority_cluster
    name: "Стороны договора энергоснабжения: идентификация, реквизиты и полномочия"
    description: >
      Фактографическая проверка наличия в договоре данных об энергоснабжающей
      организации и абоненте — реквизиты, тип ЭСО, подписанты и документы,
      подтверждающие полномочия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "энергоснабжающая организация"
        - "сбытовая компания"
        - "сетевая организация"
        - "гарантирующий поставщик"
        - "абонент"
        - "потребитель"
        - "ООО"
        - "ПАО"
        - "АО"
        - "ИНН"
        - "ОГРН"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(энергоснабжающая|сбытовая).*организация.*именуем"
        - "(?i)абонент.*именуем"
        - "(?i)\\b(?:ИНН|ОГРН)\\s*:?\\s*\\d{10,13}\\b"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 432, 539 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, их реквизиты
        и полномочия подписантов.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты энергоснабжающей организации (ЭСО).
        2. Тип ЭСО (гарантирующий поставщик / сбытовая / сетевая организация).
        3. Кто подписывает от ЭСО и на каком основании.
        4. Наименование и реквизиты абонента.
        5. Тип абонента (юрлицо / физлицо / ТСЖ / УК / ИП).
        6. Кто подписывает от абонента и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только цитаты из документа.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Гарантирующий поставщик — ПАО «Мосэнергосбыт», ИНН 7736520080,
        ОГРН 1057746557329, в лице Директора Сидорова А.А., действующего на
        основании Устава. Абонент — ООО «Завод», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Козлова В.В., действующего на основании
        Доверенности № 12 от 01.03.2026."

        Ответ:
        {
          "eso_details_status": "defined",
          "eso_details_value": "ПАО «Мосэнергосбыт», ИНН 7736520080, ОГРН 1057746557329",
          "eso_type": "guaranteeing_supplier",
          "eso_signatory": "Директор Сидоров А.А.",
          "eso_signatory_basis": "charter",
          "subscriber_details_status": "defined",
          "subscriber_details_value": "ООО «Завод», ИНН 7700000001, ОГРН 1027700000001",
          "subscriber_type": "legal_entity",
          "subscriber_signatory": "Генеральный директор Козлов В.В.",
          "subscriber_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Гарантирующий поставщик — ПАО «Мосэнергосбыт», ИНН 7736520080, ОГРН 1057746557329, в лице Директора Сидорова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между поставщиком электроэнергии и потребителем."

        Ответ:
        {
          "eso_details_status": "not_defined",
          "eso_details_value": "Данные не определены",
          "eso_type": "not_defined",
          "eso_signatory": "Данные не определены",
          "eso_signatory_basis": "not_defined",
          "subscriber_details_status": "not_defined",
          "subscriber_details_value": "Данные не определены",
          "subscriber_type": "not_defined",
          "subscriber_signatory": "Данные не определены",
          "subscriber_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с ИНН/ОГРН энергоснабжающей организации?
        2. Явно ли указан тип ЭСО (гарантирующий поставщик / сбытовая / сетевая)?
        3. Есть ли прямая цитата с ИНН/ОГРН абонента?
        4. Указан ли конкретный подписант и документ-основание для каждой стороны?
        5. Если ничего нет — "not_defined" и "Данные не определены".
        6. Evidence — только текст договора.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "eso_details_status": "<defined / not_defined>",
          "eso_details_value": "<реквизиты или 'Данные не определены'>",
          "eso_type": "<guaranteeing_supplier / sales_company / network_org / unclear / not_defined>",
          "eso_signatory": "<ФИО или 'Данные не определены'>",
          "eso_signatory_basis": "<charter / poa / order / other / not_defined>",
          "subscriber_details_status": "<defined / not_defined>",
          "subscriber_details_value": "<реквизиты или 'Данные не определены'>",
          "subscriber_type": "<legal_entity / individual / ip / tszh / uk / not_defined>",
          "subscriber_signatory": "<ФИО или 'Данные не определены'>",
          "subscriber_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "энергоснабжающая организация сбытовая компания сетевая организация гарантирующий поставщик абонент потребитель ИНН ОГРН именуем в лице действующего на основании устава доверенности реквизиты подписант лицензия"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "точка поставки"
        - "граница балансовой принадлежности"
        - "тариф"
        - "оплата"
        - "прибор учёта"
        - "счётчик"
        - "качество энергии"
        - "ограничение подачи"
        - "субабонент"
        - "бездоговорное"
        - "безучётное"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "parties_authority_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        данные об энергоснабжающей организации и абоненте: реквизиты, тип стороны,
        подписанта и основание полномочий.
        Не анализируй предмет договора, тариф, точку поставки, качество энергии
        или порядок расчётов.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. parties_authority_presence:
           Агрегатное signal-поле — наличие регулирования по теме идентификации сторон.
           - "present" — если хотя бы одно из содержательных полей
             (eso_details_status, subscriber_details_status) = "defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - eso_details_status = "not_defined";
           - subscriber_details_status = "not_defined";
           - все enum-поля = "not_defined";
           - все *_value / *_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        Заполни строго следующие поля:

        1. eso_details_status — "defined" или "not_defined".
        2. eso_details_value — наименование и реквизиты ЭСО.
        3. eso_type — guaranteeing_supplier / sales_company / network_org / unclear / not_defined.
        4. eso_signatory — подписант ЭСО.
        5. eso_signatory_basis — charter / poa / order / other / not_defined.
        6. subscriber_details_status — "defined" или "not_defined".
        7. subscriber_details_value — наименование и реквизиты абонента.
        8. subscriber_type — legal_entity / individual / ip / tszh / uk / not_defined.
        9. subscriber_signatory — подписант абонента.
        10. subscriber_signatory_basis — charter / poa / order / other / not_defined.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_authority_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_display = соответствующий fallback.
        - Используй только текст договора.
        - Не делай предположений о типе стороны без прямого текста.
        - Если из текста видно только, что это ЭСО, но не видно её точный тип, используй "unclear".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (стороны не идентифицированы).
           → presence = "missing"; все *_status = "not_defined"; все *_value/*_signatory = "Данные не определены".

        2. Неполное раскрытие темы (есть наименование, но нет реквизитов / подписанта).
           → presence = "present"; соответствующие *_status = "not_defined"; не найденные текстовые поля = "Данные не определены".

        3. Противоречие между фрагментами (разные наименования или реквизиты стороны в разных частях договора).
           → presence = "unclear"; соответствующий *_status = "not_defined"; соответствующие *_value = "Не удалось определить".

        4. Реквизиты вынесены в приложение / отдельный документ, в тексте договора прямой отсылки нет.
           → presence = "present"; соответствующий *_status = "defined"; *_value = "Реквизиты вынесены в приложение".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_authority_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для enum-полей используй только допустимые значения из [ФОРМАТ ОТВЕТА].
        - Fallback при отсутствии данных: "Данные не определены" / "not_defined".
        - Fallback при противоречии или неоднозначности: "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "parties_authority_presence"
