  - id: liability_for_interruptions_check
    name: "Ответственность за перерывы в подаче энергии (ст. 547 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об ответственности ЭСО за перерывы,
      исключений и правильного ограничения реальным ущербом (без упущенной выгоды).
    triggers:
      any: ["energy_supply_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за перерывы"
        - "возмещение ущерба"
        - "простой оборудования"
        - "несанкционированное отключение"
        - "компенсация убытков"
        - "прерывание подачи"
        - "неподача энергии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)энергоснабжающая.*организация.*несет.*ответственность.*за.*перерывы"
        - "(?i)возмещение.*убытков.*при.*перерыве"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 547 ГК РФ).
        Проверяется только один вопрос: ответственность за перерывы в подаче энергии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие ответственности ЭСО за несанкционированные перерывы.
        2. Вид ответственности (реальный ущерб / неустойка).
        3. Исключена ли упущенная выгода (соответствие ст. 547 ГК).
        4. Исключения: форс-мажор, аварии в сетях, плановые ремонты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ответственность и исключения раскрыты:
        Фрагмент:
        "ЭСО несёт ответственность за неисполнение или ненадлежащее
        исполнение обязательств по подаче энергии в виде возмещения
        реального ущерба. Упущенная выгода возмещению не подлежит.
        ЭСО не несёт ответственности за перерывы, вызванные действиями
        непреодолимой силы, авариями в сетях сетевой организации,
        а также плановыми ремонтными работами."

        Ответ:
        {
          "liability_status": "defined",
          "liability_type_status": "defined",
          "liability_type_code": "real_damage",
          "lost_profit_excluded_status": "defined",
          "lost_profit_excluded_code": "yes",
          "exclusions_status": "defined",
          "force_majeure_exclusion_status": "defined",
          "grid_accident_exclusion_status": "defined",
          "interruption_fixation_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "ЭСО несёт ответственность за неисполнение обязательств по подаче энергии в виде возмещения реального ущерба. Упущенная выгода возмещению не подлежит."
            }
          ]
        }

        Пример 2 — только общая отсылка к законодательству:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим
        законодательством РФ."

        Ответ:
        {
          "liability_status": "not_defined",
          "liability_type_status": "not_defined",
          "liability_type_code": "not_defined",
          "lost_profit_excluded_status": "not_defined",
          "lost_profit_excluded_code": "not_defined",
          "exclusions_status": "not_defined",
          "force_majeure_exclusion_status": "not_defined",
          "grid_accident_exclusion_status": "not_defined",
          "interruption_fixation_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Стороны несут ответственность в соответствии с действующим законодательством РФ."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности ЭСО за перерывы?
        2. Написано ли прямо "реальный ущерб" или "упущенная выгода"?
        3. Перечислены ли исключения?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "liability_status": "<defined / not_defined>",
          "liability_type_status": "<defined / not_defined>",
          "liability_type_code": "<real_damage / penalty / both / not_defined>",
          "lost_profit_excluded_status": "<defined / not_defined>",
          "lost_profit_excluded_code": "<yes / no / not_defined>",
          "exclusions_status": "<defined / not_defined>",
          "force_majeure_exclusion_status": "<defined / not_defined>",
          "grid_accident_exclusion_status": "<defined / not_defined>",
          "interruption_fixation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за перерывы в подаче возмещение ущерба простой оборудования несанкционированное отключение компенсация убытков прерывание подачи неподача энергии реальный ущерб упущенная выгода исключение упущенной выгоды авария в сетях фиксация перерыва акт о перерыве"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "ограничение подачи при неоплате"
        - "отключение за долги"
        - "пени за просрочку оплаты"
        - "процедура отключения"
        - "предварительное уведомление об отключении"
        - "поэтапное ограничение"
        - "форс-мажор как основание расторжения"
        - "прибор учёта"
        - "бездоговорное"
        - "безучётное"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.90]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "liability_for_interruptions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        условия об ответственности за перерывы в подаче энергии: наличие ответственности,
        её вид, вопрос упущенной выгоды, исключения и порядок фиксации перерыва.
        Не анализируй порядок ограничения подачи за неоплату, качество энергии,
        форс-мажор в общем виде или санкции за безучётное потребление.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_for_interruptions_presence:
           Агрегатное signal-поле — наличие регулирования по теме ответственности за перерывы.
           - "present" — если хотя бы одно из содержательных полей
             (liability_status, exclusions_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_status = "not_defined";
           - exclusions_status = "not_defined";
           - все enum-поля = "not_defined";
           - не выполняй остальные шаги.

        1. liability_status:
           - "defined" — если прямо указана ответственность ЭСО за перерывы;
           - "not_defined" — если не указана.

        2. liability_type_status:
           - "defined" — если указан вид ответственности;
           - "not_defined" — если не указан.

        3. liability_type_code:
           - "real_damage", "penalty", "both" или "not_defined".

        4. lost_profit_excluded_status:
           - "defined" — если прямо сказано про упущенную выгоду;
           - "not_defined" — если не сказано.

        5. lost_profit_excluded_code:
           - "yes" — если упущенная выгода исключена;
           - "no" — если прямо допускается;
           - "not_defined" — если не указано.

        6. exclusions_status:
           - "defined" — если перечислены исключения из ответственности;
           - "not_defined" — если не перечислены.

        7. force_majeure_exclusion_status:
           - "defined" — если форс-мажор указан как исключение;
           - "not_defined" — если не указан.

        8. grid_accident_exclusion_status:
           - "defined" — если авария в сетях указана как исключение;
           - "not_defined" — если не указана.

        9. interruption_fixation_status:
           - "defined" — если указан порядок фиксации перерыва;
           - "not_defined" — если не указан.
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_for_interruptions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все enum-поля = "not_defined".
        - Используй только текст договора.
        - yes для lost_profit_excluded_code — только если упущенная выгода прямо исключена.
        - no — только если упущенная выгода прямо допускается.
        - Если сказано просто "возмещаются убытки", не делай автоматический вывод об исключении упущенной выгоды.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности за перерывы, ни исключений.
           → presence = "missing";
             все *_status = "not_defined";
             все enum-поля = "not_defined".

        2. Неполное раскрытие темы (только общая ссылка на закон).
           → presence = "present";
             liability_status = "not_defined";
             exclusions_status = "not_defined".

        3. Противоречие между фрагментами (разные виды ответственности).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             enum-поля = "not_defined".

        4. Прямое исключение параметра (например, "ЭСО не несёт ответственности").
           → presence = "present";
             liability_status = "defined";
             liability_type_code = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_for_interruptions_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все enum-поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * все enum-поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_for_interruptions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме ответственности за перерывы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия об ответственности за перерывы. Внутреннее enum-поле."
          required: true

        - name: "liability_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида ответственности за перерывы. Внутреннее enum-поле."
          required: true

        - name: "liability_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Вид ответственности за перерывы"
          allowed_values: ["real_damage", "penalty", "both", "not_defined"]
          description: "Вид ответственности за перерывы в подаче энергии. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "lost_profit_excluded_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прямого условия об упущенной выгоде. Внутреннее enum-поле."
          required: true

        - name: "lost_profit_excluded_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Упущенная выгода исключена"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Исключена ли упущенная выгода. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "exclusions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия исключений из ответственности за перерывы. Внутреннее enum-поле."
          required: true

        - name: "force_majeure_exclusion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания форс-мажора как исключения. Внутреннее enum-поле."
          required: true

        - name: "grid_accident_exclusion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания аварии в сетях как исключения. Внутреннее enum-поле."
          required: true

        - name: "interruption_fixation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка фиксации перерыва в подаче. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: unauthorized_consumption_check
    name: "Ответственность за бездоговорное и безучётное потребление"
    description: >
      Фактографическая проверка наличия условий о бездоговорном/безучётном потреблении,
      методики расчёта, санкций и права немедленного отключения.
    triggers:
      any: ["energy_supply_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "бездоговорное потребление"
        - "безучетное потребление"
        - "несанкционированное подключение"
        - "хищение энергии"
        - "взыскание ущерба"
        - "расчет объема потребления"
        - "неучтенное потребление"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)при.*обнаружении.*бездоговорного.*потребления.*абонент.*обязан"
        - "(?i)безучетное.*потребление.*влечет.*ответственность"
        - "(?i)несанкционированное.*подключение"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения.
        Проверяется наличие условий о бездоговорном и безучётном потреблении.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определение бездоговорного потребления.
        2. Определение безучётного потребления.
        3. Методику расчёта объёма при выявлении нарушения.
        4. Санкции (взыскание + штраф).
        5. Право немедленного отключения без уведомления.
        6. Порядок оформления акта.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — бездоговорное и безучётное потребление раскрыты:
        Фрагмент:
        "Под бездоговорным потреблением понимается потребление энергии
        без заключённого в установленном порядке договора. Под безучётным
        потреблением — потребление с нарушением учёта. Объём бездоговорного
        потребления рассчитывается как произведение мощности и времени
        потребления. Абонент уплачивает штраф в размере 5-кратной стоимости.
        При выявлении нарушения ЭСО вправе немедленно отключить подачу
        без предварительного уведомления. Акт составляется в присутствии
        Абонента либо двух незаинтересованных лиц."

        Ответ:
        {
          "unauthorized_clause_status": "defined",
          "unauthorized_clause_level": "detailed",
          "non_contracted_defined_status": "defined",
          "unmetered_defined_status": "defined",
          "calculation_method_status": "defined",
          "calculation_method_details": "произведение мощности и времени потребления",
          "penalty_status": "defined",
          "immediate_disconnection_status": "defined",
          "act_procedure_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Под бездоговорным потреблением понимается потребление энергии без заключённого в установленном порядке договора."
            }
          ]
        }

        Пример 2 — только право взыскать без раскрытия механики:
        Фрагмент:
        "ЭСО вправе взыскать стоимость бездоговорного потребления."

        Ответ:
        {
          "unauthorized_clause_status": "defined",
          "unauthorized_clause_level": "basic",
          "non_contracted_defined_status": "not_defined",
          "unmetered_defined_status": "not_defined",
          "calculation_method_status": "not_defined",
          "calculation_method_details": "Данные не определены",
          "penalty_status": "not_defined",
          "immediate_disconnection_status": "not_defined",
          "act_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "ЭСО вправе взыскать стоимость бездоговорного потребления."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определён ли "бездоговорное" или "безучётное" прямо?
        2. Есть ли конкретная методика расчёта?
        3. Право немедленного отключения — прямо написано?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "unauthorized_clause_status": "<defined / not_defined>",
          "unauthorized_clause_level": "<detailed / basic / not_defined>",
          "non_contracted_defined_status": "<defined / not_defined>",
          "unmetered_defined_status": "<defined / not_defined>",
          "calculation_method_status": "<defined / not_defined>",
          "calculation_method_details": "<метод или 'Данные не определены'>",
          "penalty_status": "<defined / not_defined>",
          "immediate_disconnection_status": "<defined / not_defined>",
          "act_procedure_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "бездоговорное потребление безучётное потребление несанкционированное подключение хищение энергии взыскание ущерба расчёт объёма потребления неучтённое потребление методика расчёта при нарушении санкции за нарушение учёта немедленное отключение акт о нарушении безучётного потребления"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - procedures
      negative_keywords:
        - "прибор учёта в норме"
        - "передача показаний"
        - "поверка счётчика"
        - "расчёт по нормативу при неисправности"
        - "пломба при штатном использовании"
        - "тариф"
        - "срок оплаты"
        - "пени за просрочку"
        - "ограничение подачи при неоплате"
        - "субабонент"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "unauthorized_consumption_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        условия о бездоговорном и безучётном потреблении: наличие определений,
        методику расчёта, санкции, право немедленного отключения и порядок оформления акта.
        Не анализируй обычный порядок учёта, стандартную процедуру ограничения подачи
        или ответственность за обычную просрочку оплаты.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unauthorized_consumption_presence:
           Агрегатное signal-поле — наличие регулирования по теме несанкционированного потребления.
           - "present" — если хотя бы одно из содержательных полей
             (unauthorized_clause_status, non_contracted_defined_status,
              unmetered_defined_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - unauthorized_clause_status = "not_defined";
           - non_contracted_defined_status = "not_defined";
           - unmetered_defined_status = "not_defined";
           - все *_details = соответствующий fallback;
           - не выполняй остальные шаги.

        1. unauthorized_clause_status:
           - "defined" — если есть упоминание о бездоговорном/безучётном потреблении;
           - "not_defined" — если не упомянуто.

        2. unauthorized_clause_level:
           - "detailed" — если есть определения и процедурные элементы;
           - "basic" — если только общее упоминание;
           - "not_defined" — если не указано.

        3. non_contracted_defined_status:
           - "defined" — если дано определение бездоговорного потребления;
           - "not_defined" — если не дано.

        4. unmetered_defined_status:
           - "defined" — если дано определение безучётного потребления;
           - "not_defined" — если не дано.

        5. calculation_method_status:
           - "defined" — если указана методика расчёта;
           - "not_defined" — если не указана.

        6. calculation_method_details:
           Краткое user-facing описание методики.
           Если данных нет — "Данные не определены".

        7. penalty_status:
           - "defined" — если указаны санкции;
           - "not_defined" — если не указаны.

        8. immediate_disconnection_status:
           - "defined" — если указано право немедленного отключения;
           - "not_defined" — если не указано.

        9. act_procedure_status:
           - "defined" — если указан порядок оформления акта;
           - "not_defined" — если не указан.
        </task>

        <context_rules>
        - Перед остальными полями заполни unauthorized_consumption_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст договора.
        - basic = есть только общее упоминание о запрете или ответственности.
        - detailed = есть определения и хотя бы один процедурный или расчётный элемент.
        - Не подставляй методику из внешнего регулирования.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни определений, ни санкций за несанкционированное потребление.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = соответствующий fallback.

        2. Неполное раскрытие темы (только право взыскать без механики).
           → presence = "present";
             unauthorized_clause_status = "defined";
             unauthorized_clause_level = "basic";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные методики расчёта).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Прямое исключение параметра (например, "штрафы не применяются").
           → presence = "present";
             penalty_status = "defined";
             penalty_details содержит цитату с исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unauthorized_consumption_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * calculation_method_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unauthorized_consumption_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме несанкционированного потребления. Внутреннее агрегатное signal-поле."
          required: true

        - name: "unauthorized_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о бездоговорном или безучётном потреблении. Внутреннее enum-поле."
          required: true

        - name: "unauthorized_clause_level"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["detailed", "basic", "not_defined"]
          description: "Уровень детализации условий о несанкционированном потреблении. Внутреннее enum-поле."
          required: true

        - name: "non_contracted_defined_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия определения бездоговорного потребления. Внутреннее enum-поле."
          required: true

        - name: "unmetered_defined_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия определения безучётного потребления. Внутреннее enum-поле."
          required: true

        - name: "calculation_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения методики расчёта при выявлении нарушения. Внутреннее enum-поле."
          required: true

        - name: "calculation_method_details"
          type: "string"
          presentation: "fact"
          label: "Методика расчёта нарушения"
          description: >
            Методика расчёта объёма или начислений при нарушении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения санкций за нарушение. Внутреннее enum-поле."
          required: true

        - name: "immediate_disconnection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права немедленного отключения. Внутреннее enum-поле."
          required: true

        - name: "act_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка оформления акта о нарушении. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: industrial_consumer_protection_check
    name: "Особые условия для промышленных потребителей и критической инфраструктуры"
    description: >
      Фактографическая проверка наличия категории надёжности, требований к резервному
      питанию, приоритетного восстановления и компенсации убытков от простоя.
    triggers:
      any: ["industrial_consumer", "critical_infrastructure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "промышленный потребитель"
        - "надежность энергоснабжения"
        - "бесперебойная подача"
        - "резервные источники питания"
        - "убытки от простоя"
        - "первая категория надежности"
        - "вторая категория надежности"
