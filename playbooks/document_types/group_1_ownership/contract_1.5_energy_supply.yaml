        требования к качеству подаваемой энергии: уровень детализации, конкретные
        технические параметры, ссылку на ГОСТ или иной нормативный документ, а также
        наличие ответственности за нарушение качества.
        Не анализируй тариф, отключение, учёт потребления или общие условия договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. energy_quality_presence:
           Агрегатное signal-поле — наличие регулирования по теме качества энергии.
           - "present" — если хотя бы одно из содержательных полей
             (quality_requirements_status, liability_for_poor_quality_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - quality_requirements_status = "not_defined";
           - liability_for_poor_quality_status = "not_defined";
           - все *_details = соответствующий fallback;
           - не выполняй остальные шаги.

        1. quality_requirements_status:
           - "defined" — если указаны требования к качеству;
           - "not_defined" — если не указаны.

        2. quality_requirements_level:
           - "detailed" — если есть конкретные параметры или ГОСТ;
           - "basic" — если только общее "надлежащее качество";
           - "not_defined" — если не указано.

        3. voltage_status:
           - "defined" — если указано напряжение;
           - "not_defined" — если не указано.

        4. frequency_status:
           - "defined" — если указана частота;
           - "not_defined" — если не указана.

        5. temperature_status:
           - "defined" — если указана температура;
           - "not_defined" — если не указана.

        6. pressure_status:
           - "defined" — если указано давление;
           - "not_defined" — если не указано.

        7. gost_reference_status:
           - "defined" — если указана ссылка на ГОСТ;
           - "not_defined" — если не указана.

        8. gost_reference_details:
           Краткое user-facing описание ГОСТ.
           Если данных нет — "Данные не определены".

        9. liability_for_poor_quality_status:
           - "defined" — если указана ответственность за нарушение качества;
           - "not_defined" — если не указана.
        </task>

        <context_rules>
        - Перед остальными полями заполни energy_quality_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст договора.
        - basic = есть только общее указание на надлежащее качество.
        - detailed = есть хотя бы один конкретный параметр или нормативная ссылка.
        - Не подставляй ГОСТ или технические требования из внешних норм.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни требований к качеству, ни ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = соответствующий fallback.

        2. Неполное раскрытие темы (только общее "надлежащее качество").
           → presence = "present";
             quality_requirements_status = "defined";
             quality_requirements_level = "basic";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные параметры качества).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Прямое исключение параметра (например, "качество по закону").
           → presence = "present";
             quality_requirements_status = "defined";
             quality_requirements_level = "basic".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для energy_quality_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * gost_reference_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
