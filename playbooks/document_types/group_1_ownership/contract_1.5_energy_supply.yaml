        2. Неполное раскрытие темы (только общее право ограничить).
           → presence = "present";
             limitation_procedure_status = "defined";
             limitation_procedure_level = "basic";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные сроки уведомления).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details/*_days = "Не удалось определить".

        4. Прямое исключение параметра (например, "отключение без уведомления").
           → presence = "present";
             notice_period_status = "defined";
             notice_period_days = "без уведомления".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для limitation_procedure_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * grounds_details, notice_period_days → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_days → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "limitation_procedure_presence"
