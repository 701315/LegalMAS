  - id: mcd_obligations_check
    name: "Разграничение ответственности в МКД и расчёт ОДН"
    description: >
      Фактографическая проверка наличия разграничения балансовой принадлежности,
      порядка расчёта ОДН и ответственности УК/ТСЖ за внутридомовые сети.
    triggers:
      any: ["mcd_subscriber"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "многоквартирный дом"
        - "внутридомовые сети"
        - "общедомовые нужды"
        - "ОДН"
        - "обслуживание общедомового имущества"
        - "граница балансовой принадлежности"
        - "граница эксплуатационной ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в.*многоквартирных.*домах.*обслуживание.*внутридомовых.*сетей"
        - "(?i)граница.*балансовой.*принадлежности"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения многоквартирного дома.
        Проверяется разграничение ответственности и порядок расчёта ОДН.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий специально для МКД.
        2. Границу балансовой принадлежности (вводное устройство / иная).
        3. Ссылку на коллективный прибор учёта (ОДПУ).
        4. Порядок расчёта ОДН.
        5. Ответственность УК/ТСЖ за внутридомовые сети.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В многоквартирном доме граница балансовой принадлежности устанавливается
        по вводному устройству. Общедомовой прибор учёта электрической энергии
        расположен в ВРУ. Расчёт ОДН осуществляется на основании показаний ОДПУ
        и распределяется в порядке, предусмотренном действующим законодательством.
        Ответственность за внутридомовые сети несёт управляющая компания."

        Ответ:
        {
          "mcd_clause_status": "defined",
          "boundary_status": "defined",
          "boundary_details": "граница балансовой принадлежности устанавливается по вводному устройству",
          "collective_meter_status": "defined",
          "collective_meter_details": "Общедомовой прибор учёта электрической энергии расположен в ВРУ",
          "odn_calculation_status": "defined",
          "odn_calculation_details": "расчёт ОДН осуществляется на основании показаний ОДПУ и распределяется в порядке, предусмотренном действующим законодательством",
          "maintenance_responsibility_status": "defined",
          "maintenance_responsibility_code": "tszh_uk",
          "maintenance_responsibility_details": "Ответственность за внутридомовые сети несёт управляющая компания",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "В многоквартирном доме граница балансовой принадлежности устанавливается по вводному устройству."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Поставка электроэнергии осуществляется абоненту в соответствии с условиями настоящего договора."

        Ответ:
        {
          "mcd_clause_status": "not_defined",
          "boundary_status": "not_defined",
          "boundary_details": "Данные не определены",
          "collective_meter_status": "not_defined",
          "collective_meter_details": "Данные не определены",
          "odn_calculation_status": "not_defined",
          "odn_calculation_details": "Данные не определены",
          "maintenance_responsibility_status": "not_defined",
          "maintenance_responsibility_code": "not_defined",
          "maintenance_responsibility_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли раздел или пункт специально про МКД?
        2. Прямо ли описана граница балансовой принадлежности?
        3. Упоминается ли ОДПУ (общедомовой прибор учёта)?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "mcd_clause_status": "<defined / not_defined>",
          "boundary_status": "<defined / not_defined>",
          "boundary_details": "<описание границы или 'Данные не определены'>",
          "collective_meter_status": "<defined / not_defined>",
          "collective_meter_details": "<описание ОДПУ или 'Данные не определены'>",
          "odn_calculation_status": "<defined / not_defined>",
          "odn_calculation_details": "<порядок расчёта ОДН или 'Данные не определены'>",
          "maintenance_responsibility_status": "<defined / not_defined>",
          "maintenance_responsibility_code": "<eso / tszh_uk / not_defined>",
          "maintenance_responsibility_details": "<текст условия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      corpus_scope: "primary_segment"
      levels:
