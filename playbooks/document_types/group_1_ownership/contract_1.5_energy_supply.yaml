        - "(?i)температура.*теплоносителя"
        - "(?i)давление.*газа"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 542 ГК РФ).
