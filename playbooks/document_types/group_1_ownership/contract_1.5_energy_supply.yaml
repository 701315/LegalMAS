  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Общие условия — срок, расторжение, форс-мажор, споры
  # ──────────────────────────────────────────────────────────────────────────
  - id: general_provisions_cluster
    name: "Общие условия: срок, расторжение, форс-мажор, претензионный порядок и конфиденциальность"
    description: >
      Фактографическая проверка наличия срока действия, автоматической пролонгации,
      условий расторжения (с учётом асимметрии прав гражданина и юрлица), форс-мажора,
      претензионного порядка, подсудности и конфиденциальности.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "срок договора"
        - "пролонгация"
        - "автоматически продлевается"
        - "возобновляется на тот же срок"
        - "уведомление о расторжении"
        - "на неопределенный срок"
        - "расторжение договора"
        - "односторонний отказ"
        - "право на отказ"
        - "прекращение договора"
        - "досрочное расторжение"
        - "по решению суда"
        - "форс-мажор"
        - "непреодолимая сила"
        - "авария в сетях"
        - "внеплановый ремонт"
        - "арбитражный суд"
        - "подведомственность"
        - "подсудность"
        - "досудебный порядок"
        - "претензионный порядок"
        - "конфиденциальность"
        - "коммерческая тайна"
        - "персональные данные"
        - "неразглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*действует.*до"
        - "(?i)автоматическ.*продл(евается|ение)"
        - "(?i)на\\s+неопределенн(ый|ого)\\s+срок"
        - "(?i)расторж(ение|ении|ения)\\s+договор"
        - "(?i)одностороннем\\s+порядке"
        - "(?i)форс.*мажор.*энергоснабжен"
        - "(?i)освобождение.*от.*ответственности.*при.*аварии"
        - "(?i)арбитражн.*суд"
        - "(?i)претензионн.*порядок"
        - "(?i)конфиденциал"
        - "(?i)персональные.*данные"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 540, 546 ГК РФ).
        Проверяется только один вопрос: общие условия договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок действия договора (конкретная дата или "на неопределённый срок").
        2. Условие об автоматической пролонгации.
        3. Право абонента на расторжение (одностороннее / с согласия ЭСО / по суду).
        4. Право ЭСО на расторжение (при неоплате / с уведомлением / по суду).
        5. Наличие форс-мажорной оговорки (с указанием специфики энергоснабжения).
        6. Претензионный порядок (срок претензии, срок ответа).
        7. Подсудность (конкретный суд).
        8. Условие о конфиденциальности.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор заключён сроком на 1 год и автоматически пролонгируется, если ни одна
        из сторон не уведомит другую за 30 дней до окончания. Абонент-гражданин
        вправе расторгнуть договор в одностороннем порядке при условии полной оплаты.
        Для юридических лиц — только с согласия ЭСО или по решению суда. Споры
        рассматриваются в Арбитражном суде г. Москвы. Претензионный срок — 30 дней."

        Ответ:
        {
          "contract_term_status": "defined",
          "contract_term_details": "1 год",
          "auto_renewal_status": "defined",
          "auto_renewal_notice_period": "30 дней до окончания",
          "subscriber_termination_status": "defined",
          "subscriber_termination_regime": "unilateral_for_individual_court_for_legal",
          "eso_termination_status": "defined",
          "eso_termination_details": "с согласия или по решению суда",
          "force_majeure_status": "not_defined",
          "force_majeure_details": "Данные не определены",
          "pretrial_status": "defined",
          "pretrial_details": "претензионный срок 30 дней",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "Арбитражный суд г. Москвы",
          "confidentiality_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Договор заключён сроком на 1 год и автоматически пролонгируется, если ни одна из сторон не уведомит другую за 30 дней до окончания."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок договора или "на неопределённый срок"?
        2. Указано ли автопродление с конкретным сроком уведомления?
        3. Разграничены ли права гражданина и юрлица на расторжение?
        4. Есть ли форс-мажор с упоминанием специфики энергетики (аварии в сетях)?
        5. Указаны ли конкретные сроки претензионного порядка?
        6. Назван ли конкретный суд?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<срок или 'Данные не определены'>",
          "auto_renewal_status": "<defined / not_defined>",
          "auto_renewal_notice_period": "<срок или 'Данные не определены'>",
          "subscriber_termination_status": "<defined / not_defined>",
          "subscriber_termination_regime": "<unilateral / mutual_consent / court_only / unilateral_for_individual_court_for_legal / not_defined>",
          "eso_termination_status": "<defined / not_defined>",
          "eso_termination_details": "<условия или 'Данные не определены'>",
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_details": "<текст или 'Данные не определены'>",
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<сроки или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<суд или 'Данные не определены'>",
          "confidentiality_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "срок действия"
        - "пролонгация"
        - "расторжение"
        - "односторонний отказ"
        - "форс-мажор"
        - "авария в сетях"
        - "претензионный порядок"
        - "арбитражный суд"
        - "конфиденциальность"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contract_term_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок действия договора прямо определён. Иначе 'not_defined'."
        - name: "contract_term_details"
          type: "string"
          description: "Срок договора. Если нет — строго 'Данные не определены'."
        - name: "auto_renewal_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если автоматическая пролонгация прямо определена. Иначе 'not_defined'."
        - name: "auto_renewal_notice_period"
          type: "string"
          description: "Срок уведомления о непролонгации. Если нет — строго 'Данные не определены'."
        - name: "subscriber_termination_status"
          type: "string"
