      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Порядок ограничения и прекращения подачи
  # ──────────────────────────────────────────────────────────────────────────
  - id: limitation_procedure_check
    name: "Порядок ограничения и прекращения подачи энергии (ст. 546 ГК РФ)"
    description: >
      Фактографическая проверка наличия процедуры ограничения/отключения:
      основания, срок уведомления, поэтапность, порядок возобновления подачи.
    triggers:
      any: ["energy_supply_contract"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ограничение подачи"
        - "прекращение подачи"
        - "отключение энергии"
        - "предварительное уведомление"
        - "срок для устранения нарушений"
        - "при неоплате"
        - "порядок отключения"
        - "возобновление подачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ограничение.*подачи.*энергии.*допускается.*при.*неоплате"
        - "(?i)предварительное.*уведомление.*об.*отключении"
        - "(?i)отключение.*возможно.*при.*условии"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 546 ГК РФ).
        Проверяется только один вопрос: порядок ограничения и прекращения подачи энергии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания для ограничения/отключения подачи энергии.
        2. Срок предварительного уведомления (конкретное число дней).
        3. Поэтапность введения ограничения (частичное → полное).
        4. Порядок возобновления подачи и кто несёт расходы.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. Общая фраза "вправе ограничить" без оснований и срока — это basic, не detailed.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Перечислены ли конкретные основания ограничения?
        2. Указан ли срок уведомления числом (дней)?
        3. Описана ли поэтапность (частичное → полное)?
        4. Описан ли порядок возобновления?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "limitation_procedure_status": "<defined / not_defined>",
          "limitation_procedure_level": "<detailed / basic / not_defined>",
          "grounds_status": "<defined / not_defined>",
          "grounds_details": "<основания или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_days": "<число дней или 'Данные не определены'>",
          "phased_limitation_status": "<defined / not_defined>",
          "restoration_procedure_status": "<defined / not_defined>",
          "restoration_cost_allocation": "<subscriber / supplier / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "ограничение подачи"
        - "отключение энергии"
        - "предварительное уведомление"
        - "возобновление подачи"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "limitation_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если процедура ограничения прямо определена. Иначе 'not_defined'."
        - name: "limitation_procedure_level"
          type: "string"
          allowed_values: ["detailed", "basic", "not_defined"]
          description: "Уровень детализации процедуры."
        - name: "notice_period_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок уведомления прямо определён. Иначе 'not_defined'."
        - name: "notice_period_days"
          type: "string"
          description: "Срок уведомления. Если нет — строго 'Данные не определены'."
        - name: "phased_limitation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если поэтапность прямо определена. Иначе 'not_defined'."
        - name: "restoration_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок возобновления прямо определён. Иначе 'not_defined'."
        - name: "restoration_cost_allocation"
          type: "string"
          allowed_values: ["subscriber", "supplier", "not_defined"]
          description: "Кто несёт расходы на возобновление."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Ответственность за перерывы в подаче
  # ──────────────────────────────────────────────────────────────────────────
  - id: liability_for_interruptions_check
    name: "Ответственность за перерывы в подаче энергии (ст. 547 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об ответственности ЭСО за перерывы,
      исключений и правильного ограничения реальным ущербом (без упущенной выгоды).
    triggers:
      any: ["energy_supply_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за перерывы"
        - "возмещение ущерба"
        - "простой оборудования"
        - "несанкционированное отключение"
        - "компенсация убытков"
        - "прерывание подачи"
        - "неподача энергии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)энергоснабжающая.*организация.*несет.*ответственность.*за.*перерывы"
        - "(?i)возмещение.*убытков.*при.*перерыве"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 547 ГК РФ).
        Проверяется только один вопрос: ответственность за перерывы в подаче энергии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие ответственности ЭСО за несанкционированные перерывы.
        2. Вид ответственности (реальный ущерб / неустойка).
        3. Исключена ли упущенная выгода (соответствие ст. 547 ГК).
        4. Исключения: форс-мажор, аварии в сетях, плановые ремонты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности ЭСО за перерывы?
        2. Написано ли прямо "реальный ущерб" или "упущенная выгода"?
        3. Перечислены ли исключения?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "liability_status": "<defined / not_defined>",
          "liability_type_status": "<defined / not_defined>",
          "liability_type": "<real_damage / penalty / both / not_defined>",
          "lost_profit_excluded_status": "<defined / not_defined>",
          "lost_profit_excluded": "<yes / no / not_defined>",
          "exclusions_status": "<defined / not_defined>",
          "force_majeure_exclusion_status": "<defined / not_defined>",
          "grid_accident_exclusion_status": "<defined / not_defined>",
          "interruption_fixation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "ответственность за перерывы"
        - "возмещение ущерба"
        - "реальный ущерб"
        - "компенсация убытков"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "liability_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ответственность за перерывы прямо определена. Иначе 'not_defined'."
        - name: "liability_type"
          type: "string"
          allowed_values: ["real_damage", "penalty", "both", "not_defined"]
          description: "Вид ответственности."
        - name: "lost_profit_excluded"
          type: "string"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Верни 'yes', если упущенная выгода явно исключена (правильно по ст. 547 ГК). Иначе 'no' или 'not_defined'."
        - name: "force_majeure_exclusion_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если форс-мажор как исключение прямо указан. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Бездоговорное и безучётное потребление
  # ──────────────────────────────────────────────────────────────────────────
  - id: unauthorized_consumption_check
    name: "Ответственность за бездоговорное и безучётное потребление"
    description: >
      Фактографическая проверка наличия условий о бездоговорном/безучётном потреблении,
      методики расчёта, санкций и права немедленного отключения.
    triggers:
      any: ["energy_supply_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "бездоговорное потребление"
        - "безучетное потребление"
        - "несанкционированное подключение"
        - "хищение энергии"
        - "взыскание ущерба"
        - "расчет объема потребления"
        - "неучтенное потребление"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)при.*обнаружении.*бездоговорного.*потребления.*абонент.*обязан"
        - "(?i)безучетное.*потребление.*влечет.*ответственность"
        - "(?i)несанкционированное.*подключение"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения.
        Проверяется наличие условий о бездоговорном и безучётном потреблении.

        [ЗАДАЧА]
        Найди в тексте договора:
