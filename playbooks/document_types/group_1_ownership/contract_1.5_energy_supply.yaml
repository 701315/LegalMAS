        Найди в тексте договора:
        1. Требования к качеству энергии (общие или конкретные параметры).
        2. Числовые параметры: напряжение, частота (для электро), температура, давление.
        3. Ссылку на ГОСТ или иной нормативный документ по качеству.
        4. Ответственность ЭСО за нарушение параметров качества.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
