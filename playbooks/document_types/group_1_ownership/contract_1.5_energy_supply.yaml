        description: "Договор передачи электроэнергии — услуга сетевой компании, не энергоснабжение потребителя"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+транспортировки\\s+(?:газа|тепла|ресурса)\\b"
        severity: hard
        weight: -1.0
        description: "Транспортировка ресурса — услуга сетевой компании"

      - pattern: "(?i)\\bквартир[аеиу]\\b"
        severity: soft
        weight: -0.30
        description: "Квартира может встречаться в коммунальном контексте, но повышает риск коллизии с real estate"

      - pattern: "(?i)\\bподрядчик\\b|\\bисполнитель\\s+услуг\\b"
        severity: soft
        weight: -0.35
        description: "Ролевая модель услуг или подряда снижает уверенность в энергоснабжении"

