        - "категория надёжности"
        - "промышленный потребитель"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
