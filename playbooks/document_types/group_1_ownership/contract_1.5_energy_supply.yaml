          description: >
            Срок или порядок уведомления ЭСО об аварии. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "eso_inspection_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права ЭСО на проверку оборудования абонента. Внутреннее enum-поле."
