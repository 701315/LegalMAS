    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "industrial_consumer_protection_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        специальные условия для промышленных потребителей и объектов критической
        инфраструктуры: категорию надёжности, резервное питание, приоритетное
        восстановление подачи, компенсацию убытков от простоя и запрет полного отключения.
        Не анализируй стандартные условия обычного абонента, тариф, качество энергии
        или общую процедуру ограничения подачи.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. industrial_consumer_protection_presence:
           Агрегатное signal-поле — наличие регулирования по теме особых условий
           для промышленных потребителей.
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - reliability_category_status = "not_defined";
           - reliability_category_code = "not_defined";
           - backup_power_status = "not_defined";
           - priority_restoration_status = "not_defined";
           - downtime_compensation_status = "not_defined";
           - disconnection_prohibition_status = "not_defined";
           - все *_details/*_code = соответствующий fallback;
           - не выполняй остальные шаги.

        1. reliability_category_status:
           - "defined" — если прямо указана категория надёжности (I, II или III);
           - "not_defined" — если не указана.

        2. reliability_category_code:
           - "I" — первая категория надёжности;
           - "II" — вторая категория надёжности;
           - "III" — третья категория надёжности;
           - "not_defined" — если категория не указана.

        3. backup_power_status:
           - "defined" — если указаны требования к резервному питанию;
           - "not_defined" — если не указаны.

        4. backup_power_details:
           Краткое user-facing описание требований к резервному питанию на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. priority_restoration_status:
           - "defined" — если указано приоритетное восстановление подачи;
           - "not_defined" — если не указано.

        6. downtime_compensation_status:
           - "defined" — если указана компенсация убытков от простоя;
           - "not_defined" — если не указана.

        7. downtime_compensation_details:
           Краткое user-facing описание условий компенсации убытков от простоя на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. disconnection_prohibition_status:
           - "defined" — если указан запрет полного отключения;
           - "not_defined" — если не указан.
        </task>

        <context_rules>
        - Перед остальными полями заполни industrial_consumer_protection_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_code = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не выводи категорию надёжности из характера объекта без прямого указания.
        - Учитывай только специальные условия для промышленных потребителей,
          объектов первой/второй/третьей категории, критической инфраструктуры
          или объектов жизнеобеспечения.
        - Если параметр определяется через отсылку к другому документу,
          это не отсутствие регулирования; отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в status используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни категории надёжности, ни особых условий.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details/*_code = соответствующий fallback.

        2. Неполное раскрытие темы (только категория без деталей).
           Указана только категория надёжности, остальные условия не раскрыты.
           → presence = "present";
             reliability_category_status = "defined";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные категории в разных пунктах).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details/*_code = "Не удалось определить".

        4. Прямое исключение параметра (например, "резервное питание не требуется").
           → presence = "present";
             backup_power_status = "defined";
             backup_power_details содержит цитату с исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для industrial_consumer_protection_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Для reliability_category_code используй только: "I", "II", "III", "not_defined".
        - Fallback при отсутствии данных:
          * backup_power_details, downtime_compensation_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_code → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
