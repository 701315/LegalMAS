        форс-мажорную оговорку.
        Не анализируй подсудность, претензионный порядок или конфиденциальность —
        эти темы проверяются отдельно глобальными проверками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. general_provisions_presence:
           Агрегатное signal-поле — наличие регулирования по теме общих условий.
           - "present" — если хотя бы одно из содержательных полей
             (contract_term_status, subscriber_termination_status,
              eso_termination_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contract_term_status = "not_defined";
           - subscriber_termination_status = "not_defined";
           - eso_termination_status = "not_defined";
           - все *_details = соответствующий fallback;
           - не выполняй остальные шаги.

        1. contract_term_status:
           - "defined" — если указан срок действия или "на неопределённый срок";
           - "not_defined" — если не указан.

        2. contract_term_details:
           Краткое user-facing описание срока.
           Если данных нет — "Данные не определены".

        3. auto_renewal_status:
           - "defined" — если указана автопролонгация;
           - "not_defined" — если не указана.

        4. auto_renewal_notice_period:
           Краткое user-facing описание срока уведомления.
           Если данных нет — "Данные не определены".

        5. subscriber_termination_status:
           - "defined" — если указано право абонента на расторжение;
           - "not_defined" — если не указано.

        6. subscriber_termination_regime:
           - "unilateral", "mutual_consent", "court_only", "unilateral_for_individual_court_for_legal";
           - "not_defined" — если не указано.

        7. eso_termination_status:
           - "defined" — если указано право ЭСО на расторжение;
           - "not_defined" — если не указано.

        8. eso_termination_details:
           Краткое user-facing описание условий расторжения ЭСО.
           Если данных нет — "Данные не определены".

        9. force_majeure_status:
           - "defined" — если указана форс-мажорная оговорка;
           - "not_defined" — если не указана.

        10. force_majeure_details:
            Краткое user-facing описание форс-мажора.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни general_provisions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст договора.
        - Если права расторжения различаются для гражданина и юрлица, используй
          unilateral_for_individual_court_for_legal.
        - Не подставляй нормы ГК без прямого текста договора.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока, ни условий расторжения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = соответствующий fallback.

        2. Неполное раскрытие темы (только общая ссылка на закон).
           → presence = "present";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами (разные сроки или условия).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Прямое исключение параметра (например, "договор бессрочный").
           → presence = "present";
             contract_term_status = "defined";
             contract_term_details содержит цитату с исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для general_provisions_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * contract_term_details, auto_renewal_notice_period, eso_termination_details, force_majeure_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

