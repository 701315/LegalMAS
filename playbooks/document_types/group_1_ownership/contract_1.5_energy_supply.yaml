#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount:   "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern:   "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage:     "(?i)\\d{1,3}(?:[.,]\\d{1,2})?\\s*%"
  tariff_value:   "(?i)\\d+[.,]?\\d*\\s*(?:руб|₽)?\\s*(?:/кВт|/кВт·ч|/Гкал|/м³|/куб\\.м)"
  meter_reading:  "(?i)\\d{1,6}(?:[.,]\\d{1,2})?\\s*(?:кВт·ч|Гкал|м³|куб\\.м)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_authority_cluster
    name: "Стороны договора энергоснабжения: идентификация, реквизиты и полномочия"
    description: >
      Фактографическая проверка наличия в договоре данных об энергоснабжающей
      организации и абоненте — реквизиты, тип ЭСО, подписанты и документы,
      подтверждающие полномочия.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "энергоснабжающая организация"
        - "сбытовая компания"
        - "сетевая организация"
        - "гарантирующий поставщик"
        - "абонент"
        - "потребитель"
        - "ООО"
        - "ПАО"
        - "АО"
        - "ИНН"
        - "ОГРН"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(энергоснабжающая|сбытовая).*организация.*именуем"
        - "(?i)абонент.*именуем"
        - "(?i)\\b(?:ИНН|ОГРН)\\s*:?\\s*\\d{10,13}\\b"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 432, 539 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, их реквизиты
        и полномочия подписантов.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты энергоснабжающей организации (ЭСО).
        2. Тип ЭСО (гарантирующий поставщик / сбытовая / сетевая организация).
        3. Кто подписывает от ЭСО и на каком основании.
        4. Наименование и реквизиты абонента.
        5. Тип абонента (юрлицо / физлицо / ТСЖ / УК / ИП).
        6. Кто подписывает от абонента и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только цитаты из документа.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Гарантирующий поставщик — ПАО «Мосэнергосбыт», ИНН 7736520080,
        ОГРН 1057746557329, в лице Директора Сидорова А.А., действующего на
        основании Устава. Абонент — ООО «Завод», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Козлова В.В., действующего на основании
        Доверенности № 12 от 01.03.2026."

        Ответ:
        {
          "eso_details_status": "defined",
          "eso_details": "ПАО «Мосэнергосбыт», ИНН 7736520080, ОГРН 1057746557329",
          "eso_type": "guaranteeing_supplier",
          "eso_signatory": "Директор Сидоров А.А.",
          "eso_signatory_basis": "charter",
          "subscriber_details_status": "defined",
          "subscriber_details": "ООО «Завод», ИНН 7700000001, ОГРН 1027700000001",
          "subscriber_type": "legal_entity",
          "subscriber_signatory": "Генеральный директор Козлов В.В.",
          "subscriber_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Гарантирующий поставщик — ПАО «Мосэнергосбыт», ИНН 7736520080, ОГРН 1057746557329, в лице Директора Сидорова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между поставщиком электроэнергии и потребителем."

        Ответ:
        {
          "eso_details_status": "not_defined",
          "eso_details": "Данные не определены",
          "eso_type": "not_defined",
          "eso_signatory": "Данные не определены",
          "eso_signatory_basis": "not_defined",
          "subscriber_details_status": "not_defined",
          "subscriber_details": "Данные не определены",
          "subscriber_type": "not_defined",
          "subscriber_signatory": "Данные не определены",
          "subscriber_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с ИНН/ОГРН энергоснабжающей организации?
        2. Явно ли указан тип ЭСО (гарантирующий поставщик / сбытовая / сетевая)?
        3. Есть ли прямая цитата с ИНН/ОГРН абонента?
        4. Указан ли конкретный подписант и документ-основание для каждой стороны?
        5. Если ничего нет — "not_defined" и "Данные не определены".
        6. Evidence — только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "eso_details_status": "<defined / not_defined>",
          "eso_details": "<реквизиты или 'Данные не определены'>",
          "eso_type": "<guaranteeing_supplier / sales_company / network_org / unclear / not_defined>",
          "eso_signatory": "<ФИО или 'Данные не определены'>",
          "eso_signatory_basis": "<charter / poa / order / other / not_defined>",
          "subscriber_details_status": "<defined / not_defined>",
          "subscriber_details": "<реквизиты или 'Данные не определены'>",
          "subscriber_type": "<legal_entity / individual / ip / tszh / uk / not_defined>",
          "subscriber_signatory": "<ФИО или 'Данные не определены'>",
          "subscriber_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "энергоснабжающая организация"
        - "гарантирующий поставщик"
        - "абонент"
        - "ИНН"
        - "ОГРН"
        - "именуем"
        - "действующий на основании"
        - "лицензия"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "eso_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ЭСО прямо определена с реквизитами. Иначе 'not_defined'."
        - name: "eso_details"
          type: "string"
          description: "Реквизиты ЭСО. Если нет — строго 'Данные не определены'."
        - name: "eso_type"
          type: "string"
          allowed_values: ["guaranteeing_supplier", "sales_company", "network_org", "unclear", "not_defined"]
          description: "Тип энергоснабжающей организации."
        - name: "eso_signatory"
          type: "string"
          description: "Подписант от ЭСО. Если нет — строго 'Данные не определены'."
        - name: "eso_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта ЭСО."
        - name: "subscriber_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если абонент прямо определён с реквизитами. Иначе 'not_defined'."
        - name: "subscriber_details"
          type: "string"
          description: "Реквизиты абонента. Если нет — строго 'Данные не определены'."
        - name: "subscriber_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "ip", "tszh", "uk", "not_defined"]
          description: "Тип абонента."
        - name: "subscriber_signatory"
          type: "string"
          description: "Подписант от абонента. Если нет — строго 'Данные не определены'."
        - name: "subscriber_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта абонента."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет — вид энергии, точка поставки, объём и мощность
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_delivery_point_cluster
    name: "Предмет договора: вид энергии, точка поставки, объём и мощность"
    description: >
      Фактографическая проверка наличия в договоре вида энергии, точки поставки,
      акта разграничения балансовой принадлежности, согласованного объёма
      и максимальной мощности.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "электрическая энергия"
        - "электроэнергия"
        - "тепловая энергия"
        - "природный газ"
        - "водоснабжение"
        - "вид энергии"
        - "подача энергии"
        - "точка поставки"
        - "граница балансовой принадлежности"
        - "граница эксплуатационной ответственности"
        - "граница раздела"
        - "вводное устройство"
        - "количество энергии"
        - "объем потребления"
        - "плановое потребление"
        - "лимит потребления"
        - "максимальная мощность"
        - "присоединенная мощность"
        - "договорной объем"
        - "сверхдоговорное потребление"
        - "превышение лимита"
        - "энергопринимающее устройство"
        - "через присоединённую сеть"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вид.*энергии"
        - "(?i)подача.*энергии"
        - "(?i)точка.*поставки"
        - "(?i)граница.*балансовой.*принадлежности"
        - "(?i)количество.*энергии.*составляет"
        - "(?i)максимальн(ая|ой)\\s+мощност"
        - "(?i)присоединенн(ая|ой)\\s+мощност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 539, 541 ГК РФ).
        Проверяется только один вопрос: предмет договора — вид энергии, точка поставки,
        граница балансовой принадлежности, объём и мощность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид энергии (электрическая / тепловая / газ / вода / иное).
        2. Конкретную точку поставки (адрес, технический узел).
        3. Наличие ссылки на акт разграничения балансовой принадлежности.
        4. Согласованный объём потребления (числовое значение с единицей).
        5. Максимальную мощность (числовое значение с единицей).
        6. Последствия превышения согласованного объёма / мощности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет: поставка электрической энергии в точку поставки — г. Москва,
        ул. Заводская, д. 5, ВРУ-0,4 кВ. Договорной объём — 1 200 000 кВт·ч
        в год. Максимальная мощность — 500 кВт. Акт разграничения балансовой
        принадлежности — Приложение № 1. Сверхдоговорное потребление тарифицируется
        с коэффициентом 1,5."

        Ответ:
        {
          "energy_type_status": "defined",
