        Проверяется только один вопрос: обязанности абонента по содержанию оборудования
        и условие о субабоненте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность абонента содержать энергопринимающее оборудование и внутренние сети.
        2. Срок уведомления ЭСО об авариях.
