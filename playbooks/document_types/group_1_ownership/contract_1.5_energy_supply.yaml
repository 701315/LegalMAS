        2. Определение безучётного потребления.
        3. Методику расчёта объёма при выявлении нарушения.
        4. Санкции (взыскание + штраф).
        5. Право немедленного отключения без уведомления.
        6. Порядок оформления акта.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определён ли "бездоговорное" или "безучётное" прямо?
        2. Есть ли конкретная методика расчёта?
        3. Право немедленного отключения — прямо написано?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "unauthorized_clause_status": "<defined / not_defined>",
          "unauthorized_clause_level": "<detailed / basic / not_defined>",
          "non_contracted_defined_status": "<defined / not_defined>",
          "unmetered_defined_status": "<defined / not_defined>",
          "calculation_method_status": "<defined / not_defined>",
          "calculation_method_details": "<метод или 'Данные не определены'>",
          "penalty_status": "<defined / not_defined>",
          "immediate_disconnection_status": "<defined / not_defined>",
          "act_procedure_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "бездоговорное потребление"
        - "безучетное потребление"
        - "несанкционированное подключение"
        - "хищение энергии"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "unauthorized_clause_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условие о неразрешённом потреблении прямо определено. Иначе 'not_defined'."
        - name: "unauthorized_clause_level"
          type: "string"
          allowed_values: ["detailed", "basic", "not_defined"]
          description: "Уровень детализации."
        - name: "calculation_method_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если методика расчёта прямо определена. Иначе 'not_defined'."
        - name: "calculation_method_details"
          type: "string"
          description: "Метод расчёта. Если нет — строго 'Данные не определены'."
        - name: "immediate_disconnection_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если право немедленного отключения прямо определено. Иначе 'not_defined'."
