type: contract_1.5_energy_supply
name: "Договор энергоснабжения"

description: |
  Специализированный вид купли-продажи, регулируемый § 6 Главы 30 ГК РФ, для поставки энергии
  (электрической, тепловой, газа, воды) через присоединённую сеть. Является публичным договором,
  характеризуется особым способом передачи товара и специальными правилами учёта потребления.
  Для граждан дополнительно применяются Правила предоставления коммунальных услуг
  (ПП РФ № 354) и Закон о защите прав потребителей.

