          description: "Верни 'defined', если пени за просрочку прямо определены. Иначе 'not_defined'."
        - name: "penalty_details"
          type: "string"
          description: "Ставка пени. Если нет — строго 'Данные не определены'."
        - name: "disconnection_on_non_payment_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если право отключения при неоплате прямо определено. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Учёт потребления и содержание приборов учёта
  # ──────────────────────────────────────────────────────────────────────────
  - id: metering_cluster
    name: "Учёт потребления и содержание приборов учёта"
    description: >
      Фактографическая проверка наличия условий об учёте потребления,
      реквизитах прибора учёта, порядке расчёта при его отсутствии/неисправности
      и обязанностях абонента по поверке.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "прибор учета"
        - "счетчик"
        - "учет потребления"
        - "показания прибора"
        - "поверка"
        - "пломба"
        - "расчет по нормативу"
        - "содержание приборов учета"
        - "поверка счетчиков"
        - "исправность приборов учета"
        - "обеспечение доступа к счетчикам"
        - "замена приборов учета"
        - "АСКУЭ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прибор.*учета"
        - "(?i)расчеты.*производятся.*на.*основании.*показаний"
        - "(?i)абонент.*обязан.*обеспечивать.*исправность.*приборов.*учета"
        - "(?i)поверка.*приборов.*учета"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 544 ГК РФ).
        Проверяется только один вопрос: порядок учёта потребления, реквизиты
        прибора учёта и обязанности абонента по его содержанию.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описан ли порядок учёта потребления.
        2. Указаны ли реквизиты прибора учёта (тип, номер, дата поверки).
        3. Порядок подачи показаний.
        4. Порядок расчёта при отсутствии/неисправности прибора.
        5. Обязанность абонента обеспечивать поверку прибора.
        6. Последствия повреждения пломбы / несанкционированного вмешательства.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Учёт потребления осуществляется по прибору учёта «Меркурий 230», заводской
        номер 12345678, дата поверки 01.01.2025, следующая поверка 01.01.2029.
        Показания передаются до 25-го числа каждого месяца. При выходе прибора из строя
        расчёт производится по нормативу. Абонент обязан обеспечить доступ для
        проверки прибора. Повреждение пломбы приравнивается к безучётному потреблению."

        Ответ:
        {
          "metering_procedure_status": "defined",
          "meter_details_status": "defined",
          "meter_details": "Меркурий 230, заводской номер 12345678, поверка 01.01.2025",
          "reading_submission_status": "defined",
          "reading_submission_details": "до 25-го числа каждого месяца",
          "calculation_without_meter_status": "defined",
          "calculation_without_meter": "normative",
          "verification_obligation_status": "defined",
          "seal_tampering_status": "defined",
          "seal_tampering_details": "приравнивается к безучётному потреблению",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Учёт потребления осуществляется по прибору учёта «Меркурий 230», заводской номер 12345678, дата поверки 01.01.2025."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Расчёты производятся по данным приборов учёта."

        Ответ:
        {
          "metering_procedure_status": "defined",
          "meter_details_status": "not_defined",
          "meter_details": "Данные не определены",
          "reading_submission_status": "not_defined",
          "reading_submission_details": "Данные не определены",
          "calculation_without_meter_status": "not_defined",
          "calculation_without_meter": "not_defined",
          "verification_obligation_status": "not_defined",
          "seal_tampering_status": "not_defined",
          "seal_tampering_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Расчёты производятся по данным приборов учёта."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли конкретные реквизиты прибора (модель, номер, дата поверки)?
        2. Есть ли конкретный срок передачи показаний?
        3. Что происходит при неисправности прибора — прямо написано?
        4. Есть ли обязанность абонента по поверке?
        5. Что происходит при повреждении пломбы?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "metering_procedure_status": "<defined / not_defined>",
          "meter_details_status": "<defined / not_defined>",
          "meter_details": "<реквизиты или 'Данные не определены'>",
          "reading_submission_status": "<defined / not_defined>",
          "reading_submission_details": "<порядок или 'Данные не определены'>",
