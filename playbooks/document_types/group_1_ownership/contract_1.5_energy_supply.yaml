        - detailed = есть основания и хотя бы один процедурный элемент (срок уведомления / поэтапность / порядок восстановления).
        - Если срок уведомления не указан числом или периодом, не считай его defined.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
