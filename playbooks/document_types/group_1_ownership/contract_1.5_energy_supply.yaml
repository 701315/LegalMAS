        1. limitation_procedure_status:
           - "defined" — если в тексте есть упоминание процедуры ограничения/отключения;
           - "not_defined" — если не упомянуто.

        2. limitation_procedure_level:
           - "detailed" — если есть основания и хотя бы один процедурный элемент;
           - "basic" — если только общее право ограничить;
           - "not_defined" — если не указано.

