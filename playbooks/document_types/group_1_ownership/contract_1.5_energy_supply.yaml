          description: "Режим субабонентского подключения. Внутреннее enum-поле."
          required: true

        - name: "sub_subscriber_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий несогласованного субабонентского подключения. Внутреннее enum-поле."
          required: true

        - name: "sub_subscriber_penalty_details"
