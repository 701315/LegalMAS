      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - limitations
      negative_keywords:
        - "стандартный абонент"
        - "тариф"
        - "срок оплаты"
        - "прибор учёта"
        - "бездоговорное"
