  - id: limitation_procedure_check
    name: "Порядок ограничения и прекращения подачи энергии (ст. 546 ГК РФ)"
    description: >
      Фактографическая проверка наличия процедуры ограничения/отключения:
      основания, срок уведомления, поэтапность, порядок возобновления подачи.
    triggers:
      any: ["energy_supply_contract"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ограничение подачи"
        - "прекращение подачи"
        - "отключение энергии"
        - "предварительное уведомление"
        - "срок для устранения нарушений"
        - "при неоплате"
        - "порядок отключения"
        - "возобновление подачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ограничение.*подачи.*энергии.*допускается.*при.*неоплате"
        - "(?i)предварительное.*уведомление.*об.*отключении"
        - "(?i)отключение.*возможно.*при.*условии"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 546 ГК РФ).
        Проверяется только один вопрос: порядок ограничения и прекращения подачи энергии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания для ограничения/отключения подачи энергии.
        2. Срок предварительного уведомления (конкретное число дней).
        3. Поэтапность введения ограничения (частичное → полное).
        4. Порядок возобновления подачи и кто несёт расходы.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. Общая фраза "вправе ограничить" без оснований и срока — это basic, не detailed.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процедура ограничения раскрыта детально:
        Фрагмент:
        "ЭСО вправе ограничить или прекратить подачу энергии в случае
        неисполнения Абонентом обязательств по оплате. ЭСО обязана
        уведомить Абонента не позднее чем за 10 дней до введения
        ограничения. Ограничение вводится поэтапно: сначала частичное,
        при непогашении задолженности — полное прекращение. Возобновление
        подачи — после полного погашения задолженности и оплаты расходов
        ЭСО на отключение за счёт Абонента."

        Ответ:
        {
          "limitation_procedure_status": "defined",
          "limitation_procedure_level": "detailed",
          "grounds_status": "defined",
          "grounds_details": "неисполнение обязательств по оплате",
          "notice_period_status": "defined",
          "notice_period_days": "10",
          "phased_limitation_status": "defined",
          "restoration_procedure_status": "defined",
          "restoration_cost_allocation": "subscriber",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "ЭСО обязана уведомить Абонента не позднее чем за 10 дней до введения ограничения."
            }
          ]
        }

        Пример 2 — только общая отсылка к закону:
        Фрагмент:
        "ЭСО вправе ограничить подачу энергии в установленных законом случаях."

        Ответ:
        {
          "limitation_procedure_status": "defined",
          "limitation_procedure_level": "basic",
          "grounds_status": "defined",
          "grounds_details": "в установленных законом случаях",
          "notice_period_status": "not_defined",
          "notice_period_days": "Данные не определены",
          "phased_limitation_status": "not_defined",
          "restoration_procedure_status": "not_defined",
          "restoration_cost_allocation": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "ЭСО вправе ограничить подачу энергии в установленных законом случаях."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Перечислены ли конкретные основания ограничения?
        2. Указан ли срок уведомления числом (дней)?
        3. Описана ли поэтапность (частичное → полное)?
        4. Описан ли порядок возобновления?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "limitation_procedure_status": "<defined / not_defined>",
          "limitation_procedure_level": "<detailed / basic / not_defined>",
          "grounds_status": "<defined / not_defined>",
          "grounds_details": "<основания или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_days": "<число дней или 'Данные не определены'>",
          "phased_limitation_status": "<defined / not_defined>",
          "restoration_procedure_status": "<defined / not_defined>",
          "restoration_cost_allocation": "<subscriber / supplier / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ограничение подачи прекращение подачи отключение энергии предварительное уведомление срок для устранения нарушений при неоплате порядок отключения возобновление подачи поэтапное ограничение частичное ограничение полное прекращение расходы на возобновление основания ограничения"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - limitations
      negative_keywords:
        - "тариф"
        - "пени за просрочку оплаты"
        - "ответственность за перерывы в подаче"
        - "реальный ущерб"
        - "упущенная выгода"
        - "форс-мажор"
        - "авария в сетях как исключение из ответственности"
        - "прибор учёта"
        - "субабонент"
        - "бездоговорное"
        - "безучётное"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "limitation_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
