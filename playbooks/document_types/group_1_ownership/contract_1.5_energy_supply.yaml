  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Особые условия для промышленных потребителей
  # ──────────────────────────────────────────────────────────────────────────
  - id: industrial_consumer_protection_check
    name: "Особые условия для промышленных потребителей и критической инфраструктуры"
    description: >
      Фактографическая проверка наличия категории надёжности, требований к резервному
      питанию, приоритетного восстановления и компенсации убытков от простоя.
    triggers:
      any: ["industrial_consumer", "critical_infrastructure"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "промышленный потребитель"
        - "надежность энергоснабжения"
        - "бесперебойная подача"
        - "резервные источники питания"
        - "убытки от простоя"
        - "первая категория надежности"
        - "вторая категория надежности"
        - "особый режим потребления"
        - "приоритетное восстановление"
        - "резервное энергоснабжение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)для.*промышленных.*потребителей.*гарантируется.*бесперебойная"
        - "(?i)категория.*надежности.*энергоснабжения"
        - "(?i)для.*объектов.*первой.*категории.*надежности.*гарантируется"
        - "(?i)приоритетное.*восстановление.*энергоснабжения"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения промышленного потребителя.
        Проверяется наличие особых условий надёжности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Категорию надёжности (I / II / III).
        2. Требование к резервному питанию.
        3. Приоритетное восстановление подачи.
        4. Компенсацию убытков от простоя.
        5. Запрет полного отключения (для медучреждений / жизнеобеспечения).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написана категория (I, II, III или первая, вторая, третья)?
        2. Прямо ли написано о резервном питании?
        3. Прямо ли написано о компенсации убытков от простоя?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "reliability_category_status": "<defined / not_defined>",
          "reliability_category": "<первая / вторая / третья / not_defined>",
          "backup_power_status": "<defined / not_defined>",
          "backup_power_details": "<требования или 'Данные не определены'>",
          "priority_restoration_status": "<defined / not_defined>",
          "downtime_compensation_status": "<defined / not_defined>",
          "downtime_compensation_details": "<условия или 'Данные не определены'>",
          "disconnection_prohibition_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "промышленный потребитель"
        - "категория надежности"
        - "резервное питание"
        - "убытки от простоя"
        - "приоритетное восстановление"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "reliability_category_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если категория надёжности прямо определена. Иначе 'not_defined'."
        - name: "reliability_category"
          type: "string"
          allowed_values: ["первая", "вторая", "третья", "not_defined"]
          description: "Категория надёжности."
        - name: "backup_power_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если требование резервного питания прямо определено. Иначе 'not_defined'."
        - name: "priority_restoration_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если приоритетное восстановление прямо определено. Иначе 'not_defined'."
        - name: "downtime_compensation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если компенсация убытков от простоя прямо определена. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Разграничение ответственности в МКД
  # ──────────────────────────────────────────────────────────────────────────
  - id: mcd_obligations_check
    name: "Разграничение ответственности в МКД и расчёт ОДН"
    description: >
      Фактографическая проверка наличия разграничения балансовой принадлежности,
      порядка расчёта ОДН и ответственности УК/ТСЖ за внутридомовые сети.
    triggers:
      any: ["mcd_subscriber"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "многоквартирный дом"
        - "внутридомовые сети"
        - "общедомовые нужды"
        - "ОДН"
        - "обслуживание общедомового имущества"
        - "граница балансовой принадлежности"
        - "граница эксплуатационной ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в.*многоквартирных.*домах.*обслуживание.*внутридомовых.*сетей"
        - "(?i)граница.*балансовой.*принадлежности"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения многоквартирного дома.
        Проверяется разграничение ответственности и порядок расчёта ОДН.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий специально для МКД.
        2. Границу балансовой принадлежности (вводное устройство / иная).
        3. Ссылку на коллективный прибор учёта (ОДПУ).
        4. Порядок расчёта ОДН.
        5. Ответственность УК/ТСЖ за внутридомовые сети.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли раздел или пункт специально про МКД?
        2. Прямо ли описана граница балансовой принадлежности?
        3. Упоминается ли ОДПУ (общедомовой прибор учёта)?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "mcd_clause_status": "<defined / not_defined>",
          "boundary_status": "<defined / not_defined>",
          "boundary_details": "<описание границы или 'Данные не определены'>",
          "collective_meter_status": "<defined / not_defined>",
          "odn_calculation_status": "<defined / not_defined>",
          "maintenance_responsibility_status": "<defined / not_defined>",
          "maintenance_responsibility": "<eso / tszh_uk / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "многоквартирный дом"
        - "внутридомовые сети"
        - "ОДН"
        - "граница балансовой принадлежности"
        - "общедомовой прибор учёта"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "mcd_clause_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условия для МКД прямо определены. Иначе 'not_defined'."
        - name: "boundary_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если граница балансовой принадлежности прямо определена. Иначе 'not_defined'."
        - name: "boundary_details"
          type: "string"
          description: "Описание границы. Если нет — строго 'Данные не определены'."
        - name: "collective_meter_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если коллективный прибор учёта прямо упомянут. Иначе 'not_defined'."
        - name: "odn_calculation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок расчёта ОДН прямо определён. Иначе 'not_defined'."
        - name: "maintenance_responsibility_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ответственный за внутридомовые сети прямо определён. Иначе 'not_defined'."
        - name: "maintenance_responsibility"
          type: "string"
          allowed_values: ["eso", "tszh_uk", "not_defined"]
          description: "Ответственный за внутридомовые сети."
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_authority_cluster:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}:
      для энергоснабжающей организации — наименование, ИНН, ОГРН, статус
      (гарантирующий поставщик / сбытовая / сетевая), лицензия / решение регулятора
      о присвоении статуса, полномочия подписанта;
      для абонента — тип (юрлицо / физлицо / ТСЖ / УК), полные реквизиты,
      адрес объекта энергоснабжения.
    addressee: "Энергоснабжающая организация / Абонент"

  subject_delivery_point_cluster:
    text: >
      Просим уточнить в {doc_names}:
      (а) конкретный вид энергии (электрическая / тепловая / газ / вода);
      (б) точку поставки с привязкой к адресу и техническому узлу;
      (в) акт разграничения балансовой принадлежности — предоставить или согласовать
      как приложение к договору;
      (г) согласованный объём потребления в кВт·ч / Гкал / м³ и период;
      (д) максимальную мощность в кВт/МВт, последствия превышения.
    addressee: "Сетевая организация / Энергоснабжающая организация"

  tariff_payment_cluster:
    text: >
      Просим уточнить в {doc_names}:
      (а) действующий тариф с указанием регулирующего органа и даты утверждения;
      (б) тип тарифа (одноставочный / двухставочный, плата за мощность);
      (в) расчётный период и конкретную дату оплаты (число месяца);
      (г) пени за просрочку оплаты (ставка, начало начисления);
      (д) порядок и основания ограничения подачи при систематической неоплате.
    addressee: "Энергоснабжающая организация / Юридический советник"

  metering_cluster:
    text: >
      Просим предоставить по {doc_names}:
      (а) сведения о приборе учёта (тип, заводской номер, дата поверки,
      дата следующей поверки);
      (б) порядок и сроки подачи показаний абонентом;
      (в) расчёт при отсутствии или неисправности прибора (норматив / расчётный метод);
      (г) последствия повреждения пломбы / несанкционированного вмешательства;
      (д) право ЭСО на проверку прибора учёта и условия доступа.
    addressee: "Энергоснабжающая организация"

  subscriber_obligations_cluster:
    text: >
      Просим согласовать в {doc_names}:
      (а) перечень обязанностей абонента по содержанию энергопринимающего
      оборудования и внутренних сетей;
      (б) срок уведомления ЭСО об авариях и неисправностях (немедленно / X часов);
      (в) периодичность и порядок проверок оборудования со стороны ЭСО;
      (г) условие о субабоненте: запрет без согласия или процедура согласования;
      (д) последствия несогласованного подключения субабонента.
    addressee: "Технический директор / Юридический советник"

  general_provisions_cluster:
    text: >
      Просим уточнить в {doc_names}:
      (а) срок действия договора, условия и срок уведомления о непролонгации;
      (б) право абонента-гражданина на односторонний отказ (ст. 546 п. 1 ГК РФ)
      vs условия расторжения для абонента-юрлица (согласие ЭСО / суд);
      (в) форс-мажорную оговорку: разграничение аварий в сетях, плановых и
      внеплановых ремонтов, стихийных бедствий;
      (г) претензионный порядок: срок претензии, срок ответа, последствия неответа;
      (д) подсудность: для граждан — по месту жительства; для юрлиц — арбитражный суд;
      (е) конфиденциальность данных абонента: объёмы потребления, персональные данные.
    addressee: "Юридический советник"

  energy_quality_requirements_check:
    text: >
      В {doc_names} не раскрыты или неполно раскрыты требования к качеству энергии.
      Просим согласовать:
      (а) конкретные параметры качества (напряжение, частота — для электроэнергии;
      температура, давление — для тепла/газа);
      (б) ссылку на действующий ГОСТ (ГОСТ 32144-2013 для электроэнергии и др.);
      (в) порядок фиксации нарушений качества: замеры, акты, уведомления;
      (г) ответственность ЭСО за некачественную энергию: перерасчёт / возмещение убытков.
    addressee: "Юридический советник абонента"

  limitation_procedure_check:
    text: >
      В {doc_names} не раскрыт или неполно раскрыт порядок ограничения/отключения энергии.
      Просим согласовать:
      (а) исчерпывающий перечень оснований для ограничения и отключения;
      (б) срок предварительного уведомления (минимум 20 дней по ПП РФ № 442);
      (в) этапность: частичное ограничение → полное прекращение;
      (г) право абонента на досудебное обжалование;
      (д) порядок возобновления подачи: срок, условия, распределение расходов.
    addressee: "Юридический советник абонента"

  liability_for_interruptions_check:
    text: >
      Просим согласовать в {doc_names}:
      (а) ответственность ЭСО за перерывы — реальный ущерб (ст. 547 ГК РФ),
      без упущенной выгоды (это императивное ограничение);
      (б) разграничение ответственности ЭСО и сетевой организации при авариях в сетях;
      (в) исключения: форс-мажор, плановые ремонты с уведомлением;
      (г) порядок фиксации перерыва: акт, уведомление, сроки составления.
    addressee: "Юридический советник"

  unauthorized_consumption_check:
    text: >
      Просим согласовать в {doc_names}:
      (а) определение бездоговорного и безучётного потребления;
      (б) методику расчёта объёма (по максимальной мощности × 8760 ч / нормативу);
      (в) санкции: взыскание стоимости потреблённой энергии + штраф;
      (г) право немедленного отключения без предварительного уведомления;
      (д) форму и порядок составления акта о нарушении.
    addressee: "Юридический советник энергоснабжающей организации"

  industrial_consumer_protection_check:
    text: >
      Для {doc_names} (промышленный потребитель / объект критической инфраструктуры)
      просим согласовать:
      (а) категорию надёжности энергоснабжения (I / II / III);
      (б) требования к резервному / автономному питанию;
      (в) приоритетное восстановление подачи после аварии;
      (г) компенсацию убытков от простоя производства: размер, порядок расчёта;
      (д) для медучреждений и объектов жизнеобеспечения — запрет полного отключения.
    addressee: "Технический директор / Юридический советник"

  mcd_obligations_check:
    text: >
      Для {doc_names} (МКД) просим согласовать:
      (а) границу балансовой принадлежности сетей (вводное устройство / иная граница);
      (б) порядок расчёта ОДН (по коллективному прибору учёта / нормативу по ПП РФ № 354);
      (в) ответственность УК/ТСЖ за обслуживание внутридомовых сетей;
      (г) обязательство по установке коллективного (общедомового) прибора учёта.
    addressee: "Управляющая компания / ТСЖ"

  social_facility_disconnection_prohibition:
    text: >
      Внимание: для {doc_names} (социально значимый объект) применяется запрет
      отключения в отопительный период (ПП РФ № 354, п. 119).
      Просим:
      (а) подтвердить статус объекта как социально значимого;
      (б) включить в договор гарантии неотключения в отопительный период;
      (в) согласовать порядок действий при задолженности (частичное ограничение
      в межотопительный период).
    addressee: "Юридический советник абонента"

  sales_surcharge_requirement:
    text: >
      Для {doc_names} (юридическое лицо) просим подтвердить:
      (а) включение энергосбытовой надбавки в тариф (ПП РФ № 1179);
      (б) расчёт по двухставочному тарифу (плата за энергию + плата за мощность),
      если применимо;
      (в) наличие расшифровки составляющих тарифа.
    addressee: "Финансовый директор / Энергоснабжающая организация"

  two_rate_meter_requirement:
    text: >
      Для {doc_names} (юридическое лицо) просим подтвердить:
      (а) установку прибора учёта с функцией учёта по зонам суток (ФЗ-261, ст. 13);
      (б) при отсутствии такого прибора — предоставить план замены с датами.
    addressee: "Технический директор"

  residential_heat_disconnection_prohibition:
    text: >
      Внимание: для {doc_names} (теплоснабжение жилого МКД) действует запрет
      полного отключения в отопительный период (ПП РФ № 354, ФЗ-190).
      Просим:
      (а) подтвердить, что договор не содержит условий о полном отключении
      в отопительный период;
      (б) согласовать порядок частичного ограничения при задолженности
      (снижение температуры в пределах допустимых норм).
    addressee: "Юридический советник абонента"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


