    triggers:
      any: ["energy_supply_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество энергии"
        - "параметры качества"
        - "соответствие ГОСТ"
        - "напряжение"
        - "частота"
        - "температура"
        - "давление"
        - "технические условия"
        - "ГОСТ 32144"
        - "ГОСТ 30491"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)энергия.*должна.*соответствовать.*требованиям.*качества"
