  - id: subject_delivery_point_cluster
    name: "Предмет договора: вид энергии, точка поставки, объём и мощность"
    description: >
      Фактографическая проверка наличия в договоре вида энергии, точки поставки,
      акта разграничения балансовой принадлежности, согласованного объёма
      и максимальной мощности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "электрическая энергия"
        - "электроэнергия"
        - "тепловая энергия"
        - "природный газ"
        - "водоснабжение"
        - "вид энергии"
        - "подача энергии"
        - "точка поставки"
        - "граница балансовой принадлежности"
        - "граница эксплуатационной ответственности"
        - "граница раздела"
        - "вводное устройство"
        - "количество энергии"
        - "объем потребления"
        - "плановое потребление"
        - "лимит потребления"
        - "максимальная мощность"
        - "присоединенная мощность"
        - "договорной объем"
        - "сверхдоговорное потребление"
        - "превышение лимита"
        - "энергопринимающее устройство"
        - "через присоединённую сеть"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вид.*энергии"
        - "(?i)подача.*энергии"
        - "(?i)точка.*поставки"
        - "(?i)граница.*балансовой.*принадлежности"
        - "(?i)количество.*энергии.*составляет"
        - "(?i)максимальн(ая|ой)\\s+мощност"
        - "(?i)присоединенн(ая|ой)\\s+мощност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 539, 541 ГК РФ).
        Проверяется только один вопрос: предмет договора — вид энергии, точка поставки,
        граница балансовой принадлежности, объём и мощность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид энергии (электрическая / тепловая / газ / вода / иное).
        2. Конкретную точку поставки (адрес, технический узел).
        3. Наличие ссылки на акт разграничения балансовой принадлежности.
        4. Согласованный объём потребления (числовое значение с единицей).
        5. Максимальную мощность (числовое значение с единицей).
        6. Последствия превышения согласованного объёма / мощности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет: поставка электрической энергии в точку поставки — г. Москва,
        ул. Заводская, д. 5, ВРУ-0,4 кВ. Договорной объём — 1 200 000 кВт·ч
        в год. Максимальная мощность — 500 кВт. Акт разграничения балансовой
        принадлежности — Приложение № 1. Сверхдоговорное потребление тарифицируется
        с коэффициентом 1,5."

        Ответ:
        {
          "energy_type_status": "defined",
          "energy_type_code": "electricity",
          "delivery_point_status": "defined",
          "delivery_point_details": "г. Москва, ул. Заводская, д. 5, ВРУ-0,4 кВ",
          "boundary_act_status": "defined",
          "boundary_act_details": "Приложение № 1",
          "agreed_volume_status": "defined",
          "agreed_volume_value": "1 200 000 кВт·ч в год",
          "max_capacity_status": "defined",
          "max_capacity_value": "500 кВт",
          "excess_consumption_status": "defined",
          "excess_consumption_details": "коэффициент 1,5",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "поставка электрической энергии в точку поставки — г. Москва, ул. Заводская, д. 5, ВРУ-0,4 кВ. Договорной объём — 1 200 000 кВт·ч в год."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Поставщик поставляет абоненту электроэнергию."

        Ответ:
        {
          "energy_type_status": "defined",
          "energy_type_code": "electricity",
          "delivery_point_status": "not_defined",
          "delivery_point_details": "Данные не определены",
          "boundary_act_status": "not_defined",
          "boundary_act_details": "Данные не определены",
          "agreed_volume_status": "not_defined",
          "agreed_volume_value": "Данные не определены",
          "max_capacity_status": "not_defined",
          "max_capacity_value": "Данные не определены",
          "excess_consumption_status": "not_defined",
          "excess_consumption_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Поставщик поставляет абоненту электроэнергию."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Явно ли указан вид энергии?
        2. Есть ли конкретная точка поставки с адресом или техническим узлом?
        3. Упоминается ли акт разграничения балансовой принадлежности?
        4. Указан ли объём числом с единицей?
        5. Указана ли мощность числом с единицей?
        6. Что происходит при превышении — прямо ли написано?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "energy_type_status": "<defined / not_defined>",
          "energy_type_code": "<electricity / heat / gas / water / other / not_defined>",
          "delivery_point_status": "<defined / not_defined>",
          "delivery_point_details": "<адрес/узел или 'Данные не определены'>",
          "boundary_act_status": "<defined / not_defined>",
          "boundary_act_details": "<ссылка на акт или 'Данные не определены'>",
          "agreed_volume_status": "<defined / not_defined>",
          "agreed_volume_value": "<объём с единицей или 'Данные не определены'>",
          "max_capacity_status": "<defined / not_defined>",
          "max_capacity_value": "<мощность с единицей или 'Данные не определены'>",
          "excess_consumption_status": "<defined / not_defined>",
          "excess_consumption_details": "<последствия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "электрическая энергия тепловая энергия природный газ вид энергии подача энергии точка поставки граница балансовой принадлежности граница эксплуатационной ответственности граница раздела вводное устройство количество энергии объём потребления плановое потребление лимит потребления максимальная мощность присоединённая мощность договорной объём сверхдоговорное потребление превышение лимита энергопринимающее устройство через присоединённую сеть"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "тариф"
        - "оплата"
        - "срок оплаты"
        - "пени"
        - "прибор учёта"
        - "счётчик"
        - "показания"
        - "поверка"
        - "пломба"
        - "субабонент"
        - "ограничение подачи"
        - "отключение"
        - "качество энергии"
        - "напряжение"
        - "частота"
        - "бездоговорное"
        - "безучётное"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "subject_delivery_point_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        предмет договора: вид энергии, точку поставки, ссылку на акт разграничения
        балансовой принадлежности, согласованный объём, максимальную мощность и
        последствия превышения объёма или мощности.
        Не анализируй тариф, учёт потребления, качество энергии или порядок отключения.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. subject_delivery_point_presence:
           Агрегатное signal-поле — наличие регулирования по теме предмета договора.
           - "present" — если хотя бы одно из содержательных полей
             (energy_type_status, delivery_point_status, agreed_volume_status,
             max_capacity_status) = "defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - energy_type_status = "not_defined";
           - delivery_point_status = "not_defined";
           - agreed_volume_status = "not_defined";
           - max_capacity_status = "not_defined";
           - все enum-поля = "not_defined";
           - все *_details / *_value = "Данные не определены";
           - не выполняй остальные шаги.

        Заполни строго следующие поля:

        1. energy_type_status — "defined" или "not_defined".
        2. energy_type_code — electricity / heat / gas / water / other / not_defined.
        3. delivery_point_status — "defined" или "not_defined".
        4. delivery_point_details — адрес или технический узел точки поставки.
        5. boundary_act_status — "defined" или "not_defined".
        6. boundary_act_details — ссылка на акт разграничения балансовой принадлежности.
        7. agreed_volume_status — "defined" или "not_defined".
        8. agreed_volume_value — согласованный объём потребления с единицей измерения.
        9. max_capacity_status — "defined" или "not_defined".
        10. max_capacity_value — максимальная мощность с единицей измерения.
        11. excess_consumption_status — "defined" или "not_defined".
        12. excess_consumption_details — последствия превышения объёма или мощности.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_delivery_point_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_value = соответствующий fallback.
        - Используй только текст договора.
        - Не подставляй технические нормы.
        - Если вид энергии назван прямо, но остальные параметры отсутствуют, заполняй только найденные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (предмет не раскрыт, только общее «поставка энергии»).
           → presence = "missing"; все *_status = "not_defined"; все *_details / *_value = "Данные не определены".

        2. Неполное раскрытие (вид энергии назван, но точка поставки, объём и мощность не указаны).
           → presence = "present"; energy_type_status = "defined"; остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные объёмы или мощности в разных пунктах / приложениях).
           → presence = "unclear"; соответствующий *_status = "not_defined"; соответствующий *_details / *_value = "Не удалось определить".

        4. Прямое исключение параметра (например, «объём поставки не лимитируется», «точка поставки не определена договором»).
           → presence = "present"; соответствующий *_status = "defined"; соответствующий *_details / *_value = цитата с прямым исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_delivery_point_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для energy_type_code используй только: "electricity", "heat", "gas", "water", "other", "not_defined".
        - Fallback при отсутствии данных: "Данные не определены" / "not_defined".
        - Fallback при противоречии или неоднозначности: "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "subject_delivery_point_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме предмета договора (вид энергии, точка поставки, объём, мощность). Внутреннее агрегатное signal-поле."
          required: true
        - name: "energy_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида энергии. Внутреннее enum-поле."
          required: true
        - name: "energy_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["electricity", "heat", "gas", "water", "other", "not_defined"]
          description: "Вид энергии. Внутреннее enum-поле."
          required: true
        - name: "delivery_point_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения точки поставки. Внутреннее enum-поле."
          required: true
        - name: "delivery_point_details"
          type: "string"
          presentation: "fact"
          label: "Точка поставки"
          description: >
            Конкретная точка поставки энергии. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "boundary_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания акта разграничения балансовой принадлежности. Внутреннее enum-поле."
          required: true
        - name: "boundary_act_details"
          type: "string"
          presentation: "fact"
          label: "Акт разграничения"
          description: >
            Ссылка на акт разграничения балансовой принадлежности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "agreed_volume_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения согласованного объёма. Внутреннее enum-поле."
          required: true
        - name: "agreed_volume_value"
          type: "string"
          presentation: "fact"
          label: "Согласованный объём"
          description: >
            Согласованный объём потребления с единицей измерения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "max_capacity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения максимальной мощности. Внутреннее enum-поле."
          required: true
        - name: "max_capacity_value"
          type: "string"
          presentation: "fact"
          label: "Максимальная мощность"
          description: >
            Максимальная или присоединённая мощность. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "excess_consumption_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий превышения объёма или мощности. Внутреннее enum-поле."
          required: true
        - name: "excess_consumption_details"
          type: "string"
          presentation: "fact"
          label: "Последствия превышения лимита"
          description: >
            Последствия превышения согласованного объёма или мощности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: tariff_payment_cluster
    name: "Тариф, порядок расчётов и пени за просрочку"
    description: >
      Фактографическая проверка наличия в договоре тарифа или ссылки на регулятора,
      типа тарифа, срока оплаты, пеней за просрочку и права на ограничение при неоплате.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "тариф"
        - "цена"
        - "стоимость"
        - "рублей за"
        - "киловатт"
        - "кВт"
        - "гигакалория"
        - "Гкал"
        - "кубометр"
        - "одноставочный тариф"
        - "двухставочный тариф"
        - "плата за мощность"
        - "обязанность оплачивать"
        - "срок оплаты"
        - "ежемесячная оплата"
        - "расчетный период"
        - "пени за просрочку"
        - "неустойка за неоплату"
        - "энергосбытовая надбавка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)тариф.*в.*размере.*\\d"
        - "(?i)цена.*\\d+.*(?:руб|₽).*за"
        - "(?i)абонент.*обязан.*оплачивать.*потребленную.*энергию.*в.*срок"
        - "(?i)срок.*оплаты.*\\d+.*число"
        - "(?i)\\d+[.,]?\\d*\\s*(?:руб|₽)?\\s*(?:/кВт|/кВт·ч|/Гкал|/м³)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 424, 544 ГК РФ).
        Проверяется только один вопрос: тариф, порядок расчётов и ответственность
        за просрочку оплаты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тариф (конкретное значение или ссылка на регулирующий орган).
        2. Тип тарифа (одноставочный / двухставочный / иной).
        3. Конкретный срок оплаты (число месяца или период).
        4. Ставку пени за просрочку оплаты.
        5. Право ЭСО на ограничение/отключение при систематической неоплате.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Тариф на электроэнергию устанавливается Комитетом по тарифам г. Москвы.
        Оплата производится до 20-го числа месяца, следующего за расчётным.
        Пени за просрочку — 1/130 ставки рефинансирования ЦБ РФ за каждый день.
        При задолженности свыше 2 месяцев ЭСО вправе ввести ограничение."

        Ответ:
        {
          "tariff_status": "defined",
          "tariff_type": "regulatory_reference",
          "tariff_details": "устанавливается Комитетом по тарифам г. Москвы",
          "tariff_rate_type_status": "not_defined",
          "tariff_rate_type_code": "not_defined",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "до 20-го числа месяца, следующего за расчётным",
          "penalty_status": "defined",
          "penalty_details": "1/130 ставки рефинансирования ЦБ РФ за каждый день",
          "disconnection_on_non_payment_status": "defined",
          "disconnection_on_non_payment_details": "при задолженности свыше 2 месяцев",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Оплата производится до 20-го числа месяца, следующего за расчётным. Пени за просрочку — 1/130 ставки рефинансирования ЦБ РФ за каждый день."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Оплата производится в соответствии с выставленным счётом."

        Ответ:
        {
          "tariff_status": "not_defined",
          "tariff_type": "not_defined",
          "tariff_details": "Данные не определены",
          "tariff_rate_type_status": "not_defined",
          "tariff_rate_type_code": "not_defined",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "penalty_status": "not_defined",
          "penalty_details": "Данные не определены",
          "disconnection_on_non_payment_status": "not_defined",
          "disconnection_on_non_payment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли тариф числом или ссылкой на конкретный регулирующий орган?
        2. Указан ли тип тарифа (одноставочный / двухставочный)?
        3. Есть ли конкретная дата оплаты (число месяца)?
        4. Указана ли ставка пени (%, 1/130 и т.п.)?
        5. Есть ли прямое условие об отключении при неоплате?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "tariff_status": "<defined / not_defined>",
          "tariff_type": "<fixed_amount / regulatory_reference / not_defined>",
          "tariff_details": "<тариф или ссылка или 'Данные не определены'>",
          "tariff_rate_type_status": "<defined / not_defined>",
          "tariff_rate_type_code": "<single_rate / two_rate / three_rate / not_defined>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "penalty_status": "<defined / not_defined>",
          "penalty_details": "<ставка или 'Данные не определены'>",
          "disconnection_on_non_payment_status": "<defined / not_defined>",
          "disconnection_on_non_payment_details": "<условие или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "тариф цена стоимость рублей за киловатт кВт гигакалория Гкал кубометр одноставочный тариф двухставочный тариф плата за мощность обязанность оплачивать срок оплаты ежемесячная оплата расчётный период пени за просрочку неустойка за неоплату энергосбытовая надбавка"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "точка поставки"
        - "граница балансовой принадлежности"
        - "прибор учёта"
        - "показания"
        - "поверка"
        - "пломба"
        - "процедура ограничения подачи"
        - "порядок ограничения"
        - "предварительное уведомление об отключении"
        - "поэтапное ограничение"
        - "ответственность за перерывы"
        - "реальный ущерб"
        - "упущенная выгода"
        - "субабонент"
        - "бездоговорное"
        - "безучётное"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "tariff_payment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        условия о тарифе, типе тарифа, сроке оплаты, пенях за просрочку и праве
        на ограничение или отключение при неоплате.
        Не анализируй техническую процедуру отключения, качество энергии, учёт
        потребления или предмет договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tariff_payment_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tariff_status, payment_deadline_status, penalty_status,
              disconnection_on_non_payment_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tariff_status = "not_defined";
           - payment_deadline_status = "not_defined";
           - penalty_status = "not_defined";
           - disconnection_on_non_payment_status = "not_defined";
           - tariff_details = "Данные не определены";
           - payment_deadline_details = "Данные не определены";
           - penalty_details = "Данные не определены";
           - disconnection_on_non_payment_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. tariff_status:
           - "defined" — если в тексте прямо указан тариф числом или есть прямая ссылка
             на регулирующий орган (например, "устанавливается Комитетом по тарифам");
           - "not_defined" — если тариф прямо не указан или его нельзя надёжно определить.

        2. tariff_type:
           - "fixed_amount" — если указана фиксированная сумма;
           - "regulatory_reference" — если есть ссылка на регулятора;
           - "not_defined" — если тип не определён.

        3. tariff_details:
           Краткое user-facing описание тарифа или ссылки на регулятор.
           Если данных нет — "Данные не определены".

        4. tariff_rate_type_status:
           - "defined" — если прямо указан тип тарифной структуры (одноставочный, двухставочный и т.д.);
           - "not_defined" — если не указан.

        5. tariff_rate_type_code:
           - "single_rate", "two_rate", "three_rate" — согласно тексту;
           - "not_defined" — если не указан.

        6. payment_deadline_status:
           - "defined" — если прямо указан срок оплаты (число, период);
           - "not_defined" — если не указан.

        7. payment_deadline_details:
           Краткое user-facing описание срока оплаты.
           Если данных нет — "Данные не определены".

        8. penalty_status:
           - "defined" — если прямо указана ставка пени или неустойки за просрочку;
           - "not_defined" — если не указана.

        9. penalty_details:
           Краткое user-facing описание ставки пени.
           Если данных нет — "Данные не определены".

        10. disconnection_on_non_payment_status:
            - "defined" — если прямо указано право ЭСО на ограничение/отключение при неоплате;
            - "not_defined" — если не указано.

        11. disconnection_on_non_payment_details:
            Краткое user-facing описание условия отключения.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни tariff_payment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст договора.
        - Если тариф дан через ссылку на регулятора, не пытайся вычислить конкретную цену.
        - Не смешивай общее право ограничения при неоплате с полной процедурой ограничения — здесь извлекай только сам факт и условие.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни тарифа, ни сроков оплаты, ни пеней.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = соответствующий fallback.

        2. Тариф не раскрыт (ссылка на регулятора без конкретики в договоре).
           → presence = "present";
             tariff_status = "defined";
             tariff_type = "regulatory_reference";
             tariff_details = ссылка из текста.

        3. Противоречие в сроках или пенях.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Общая ссылка на закон вместо конкретных последствий.
           "Стороны несут ответственность в соответствии с законодательством РФ".
           → penalty_status = "not_defined";
             disconnection_on_non_payment_status = "not_defined";
             presence всё равно "present", если другие поля определены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tariff_payment_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * tariff_details → "Данные не определены";
          * payment_deadline_details → "Данные не определены";
          * penalty_details → "Данные не определены";
          * disconnection_on_non_payment_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tariff_payment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по тарифу и оплате. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tariff_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения тарифа. Внутреннее enum-поле."
          required: true

        - name: "tariff_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["fixed_amount", "regulatory_reference", "not_defined"]
          description: "Тип указания тарифа. Внутреннее enum-поле."
          required: true

        - name: "tariff_details"
          type: "string"
          presentation: "fact"
          label: "Тариф"
          description: >
            Тариф или ссылка на регулирующий орган. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "tariff_rate_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения тарифной структуры. Внутреннее enum-поле."
          required: true

        - name: "tariff_rate_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["single_rate", "two_rate", "three_rate", "not_defined"]
          description: "Тип тарифной структуры. Внутреннее enum-поле."
          required: true

        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока оплаты. Внутреннее enum-поле."
          required: true

        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: >
            Срок оплаты потреблённой энергии. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения пени за просрочку оплаты. Внутреннее enum-поле."
          required: true

        - name: "penalty_details"
          type: "string"
          presentation: "fact"
          label: "Пени за просрочку"
          description: >
            Ставка пени за просрочку оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "disconnection_on_non_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения права ограничения или отключения при неоплате. Внутреннее enum-поле."
          required: true

        - name: "disconnection_on_non_payment_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение при неоплате"
          description: >
            Условие ограничения или отключения при неоплате. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: metering_cluster
    name: "Учёт потребления и содержание приборов учёта"
    description: >
      Фактографическая проверка наличия условий об учёте потребления,
      реквизитах прибора учёта, порядке расчёта при его отсутствии/неисправности
      и обязанностях абонента по поверке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "прибор учета"
        - "счетчик"
        - "учет потребления"
        - "показания прибора"
        - "поверка"
        - "пломба"
        - "расчет по нормативу"
        - "содержание приборов учета"
        - "поверка счетчиков"
        - "исправность приборов учета"
        - "обеспечение доступа к счетчикам"
        - "замена приборов учета"
        - "АСКУЭ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прибор.*учета"
        - "(?i)расчеты.*производятся.*на.*основании.*показаний"
        - "(?i)абонент.*обязан.*обеспечивать.*исправность.*приборов.*учета"
        - "(?i)поверка.*приборов.*учета"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор энергоснабжения (§ 6 Главы 30 ГК РФ, ст. 544 ГК РФ).
        Проверяется только один вопрос: порядок учёта потребления, реквизиты
        прибора учёта и обязанности абонента по его содержанию.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описан ли порядок учёта потребления.
        2. Указаны ли реквизиты прибора учёта (тип, номер, дата поверки).
        3. Порядок подачи показаний.
        4. Порядок расчёта при отсутствии/неисправности прибора.
        5. Обязанность абонента обеспечивать поверку прибора.
        6. Последствия повреждения пломбы / несанкционированного вмешательства.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Учёт потребления осуществляется по прибору учёта «Меркурий 230», заводской
        номер 12345678, дата поверки 01.01.2025, следующая поверка 01.01.2029.
        Показания передаются до 25-го числа каждого месяца. При выходе прибора из строя
        расчёт производится по нормативу. Абонент обязан обеспечить доступ для
        проверки прибора. Повреждение пломбы приравнивается к безучётному потреблению."

        Ответ:
        {
          "metering_procedure_status": "defined",
          "meter_details_status": "defined",
          "meter_details_value": "Меркурий 230, заводской номер 12345678, поверка 01.01.2025",
          "reading_submission_status": "defined",
          "reading_submission_details": "до 25-го числа каждого месяца",
          "calculation_without_meter_status": "defined",
          "calculation_without_meter_code": "normative",
          "verification_obligation_status": "defined",
          "seal_tampering_status": "defined",
          "seal_tampering_details": "приравнивается к безучётному потреблению",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Учёт потребления осуществляется по прибору учёта «Меркурий 230», заводской номер 12345678, дата поверки 01.01.2025."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Расчёты производятся по данным приборов учёта."

        Ответ:
        {
          "metering_procedure_status": "defined",
          "meter_details_status": "not_defined",
          "meter_details_value": "Данные не определены",
          "reading_submission_status": "not_defined",
          "reading_submission_details": "Данные не определены",
          "calculation_without_meter_status": "not_defined",
          "calculation_without_meter_code": "not_defined",
          "verification_obligation_status": "not_defined",
          "seal_tampering_status": "not_defined",
          "seal_tampering_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Расчёты производятся по данным приборов учёта."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли конкретные реквизиты прибора (модель, номер, дата поверки)?
        2. Есть ли конкретный срок передачи показаний?
        3. Что происходит при неисправности прибора — прямо написано?
        4. Есть ли обязанность абонента по поверке?
        5. Что происходит при повреждении пломбы?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "metering_procedure_status": "<defined / not_defined>",
          "meter_details_status": "<defined / not_defined>",
          "meter_details_value": "<реквизиты или 'Данные не определены'>",
          "reading_submission_status": "<defined / not_defined>",
          "reading_submission_details": "<порядок или 'Данные не определены'>",
          "calculation_without_meter_status": "<defined / not_defined>",
          "calculation_without_meter_code": "<normative / calculated / not_defined>",
          "verification_obligation_status": "<defined / not_defined>",
          "seal_tampering_status": "<defined / not_defined>",
          "seal_tampering_details": "<последствия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прибор учёта счётчик учёт потребления показания прибора поверка пломба расчёт по нормативу содержание приборов учёта поверка счётчиков исправность приборов учёта обеспечение доступа к счётчикам замена приборов учёта АСКУЭ передача показаний дата поверки следующая поверка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "бездоговорное потребление"
        - "безучётное потребление"
        - "несанкционированное подключение"
        - "хищение энергии"
        - "санкции за нарушение учёта"
        - "немедленное отключение при безучётном"
        - "акт о нарушении"
        - "тариф"
        - "срок оплаты"
        - "пени"
        - "граница балансовой принадлежности"
        - "точка поставки"
        - "ограничение подачи"
        - "ОДН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "metering_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        условия об учёте потребления: порядок учёта, реквизиты прибора, передачу
        показаний, расчёт при отсутствии или неисправности прибора, поверку и
        последствия повреждения пломбы.
        Не анализируй безучётное потребление как нарушение, тариф, качество энергии
        или порядок отключения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. metering_presence:
           Агрегатное signal-поле — наличие регулирования по теме учёта.
           - "present" — если хотя бы одно из содержательных полей
             (metering_procedure_status, meter_details_status, reading_submission_status,
              calculation_without_meter_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - metering_procedure_status = "not_defined";
           - meter_details_status = "not_defined";
           - reading_submission_status = "not_defined";
           - calculation_without_meter_status = "not_defined";
           - все *_details/*_value = соответствующий fallback;
           - не выполняй остальные шаги.

        1. metering_procedure_status:
           - "defined" — если в тексте прямо описан порядок учёта потребления;
           - "not_defined" — если порядок не указан.

        2. meter_details_status:
           - "defined" — если указаны реквизиты прибора (тип, номер, дата поверки);
           - "not_defined" — если не указаны.

        3. meter_details_value:
           Краткое user-facing описание реквизитов прибора.
           Если данных нет — "Данные не определены".

        4. reading_submission_status:
           - "defined" — если указан срок или порядок передачи показаний;
           - "not_defined" — если не указан.

        5. reading_submission_details:
           Краткое user-facing описание порядка передачи показаний.
           Если данных нет — "Данные не определены".

        6. calculation_without_meter_status:
           - "defined" — если указан метод расчёта при отсутствии/неисправности прибора;
           - "not_defined" — если не указан.

        7. calculation_without_meter_code:
           - "normative" — расчёт по нормативу;
           - "calculated" — расчётным способом (по мощности, среднему и т.п.);
           - "not_defined" — если не указан.

        8. verification_obligation_status:
           - "defined" — если указана обязанность абонента по поверке;
           - "not_defined" — если не указана.

        9. verification_obligation_details:
           Краткое user-facing описание обязанности по поверке.
           Если данных нет — "Данные не определены".

        10. seal_tampering_status:
            - "defined" — если указаны последствия повреждения пломбы;
            - "not_defined" — если не указаны.

        11. seal_tampering_details:
            Краткое user-facing описание последствий повреждения пломбы.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни metering_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_value = соответствующий fallback.
        - Используй только текст договора.
        - Если пломба упоминается как нарушение (безучётное потребление, хищение),
          не включай это в ответ — такие случаи анализируются отдельно.
        - Не подставляй правила коммерческого учёта, если их нет в тексте.
        - normative = расчёт по нормативу.
        - calculated = расчётным способом по формуле, мощности, среднему потреблению и т.п.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка учёта, ни реквизитов прибора, ни правил расчёта.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details/*_value = соответствующий fallback.

        2. Неполное раскрытие темы (только общее упоминание "по приборам учёта").
           → presence = "present";
             metering_procedure_status = "defined";
             остальные *_status = "not_defined".

        3. Противоречие между фрагментами (разные методы расчёта или сроки).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details/*_value = "Не удалось определить".

        4. Прямое исключение параметра (например, "расчёт только по нормативу").
           → presence = "present";
             соответствующий *_status = "defined";
             *_details/*_value содержит цитату с исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для metering_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * meter_details_value, reading_submission_details, verification_obligation_details, seal_tampering_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "metering_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме учёта потребления. Внутреннее агрегатное signal-поле."
          required: true

        - name: "metering_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка учёта потребления. Внутреннее enum-поле."
          required: true

        - name: "meter_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания реквизитов прибора учёта. Внутреннее enum-поле."
          required: true

        - name: "meter_details_value"
          type: "string"
          presentation: "fact"
          label: "Прибор учёта"
          description: >
            Тип, номер и иные реквизиты прибора учёта. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "reading_submission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка передачи показаний. Внутреннее enum-поле."
          required: true

        - name: "reading_submission_details"
          type: "string"
          presentation: "fact"
          label: "Передача показаний"
          description: >
            Срок или порядок передачи показаний прибора учёта. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "calculation_without_meter_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения расчёта при отсутствии или неисправности прибора. Внутреннее enum-поле."
          required: true

        - name: "calculation_without_meter_code"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["normative", "calculated", "not_defined"]
          description: "Метод расчёта при отсутствии или неисправности прибора учёта. Внутреннее enum-поле."
          required: true

        - name: "verification_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности по поверке прибора учёта. Внутреннее enum-поле."
          required: true

        - name: "verification_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Условия поверки прибора учёта"
          description: >
            Текст обязанности абонента по поверке прибора учёта. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "seal_tampering_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий повреждения пломбы. Внутреннее enum-поле."
          required: true

        - name: "seal_tampering_details"
          type: "string"
          presentation: "fact"
          label: "Последствия повреждения пломбы"
          description: >
            Последствия повреждения пломбы или несанкционированного вмешательства. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: subscriber_obligations_cluster
    name: "Обязанности абонента по сетям и условие о субабоненте"
    description: >
      Фактографическая проверка наличия условий об обязанности абонента содержать
      оборудование, уведомлять об авариях и запрете/порядке передачи энергии
      субабонентам без согласия ЭСО.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "надлежащее техническое состояние"
        - "энергопринимающее оборудование"
        - "энергопринимающие устройства"
        - "соблюдение режима потребления"
        - "немедленно сообщить"
        - "уведомить об аварии"
        - "неисправность оборудования"
        - "авария"
        - "содержание внутренних сетей"
        - "субабонент"
        - "суб-абонент"
        - "передача энергии третьим лицам"
        - "подключение третьих лиц"
        - "с согласия энергоснабжающей"
        - "транзит энергии"
        - "запрещается передача энергии"
      keyword_mode: "any"
      regex_patterns:
