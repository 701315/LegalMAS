      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора энергоснабжения
        обязанности абонента по содержанию оборудования и внутренних сетей,
        уведомлению об авариях, праву ЭСО на проверку, а также условия о субабоненте.
        Не анализируй учёт потребления, тариф, качество энергии или общие условия расторжения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subscriber_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме обязанностей абонента.
           - "present" — если хотя бы одно из содержательных полей
             (network_maintenance_status, accident_notification_status,
              sub_subscriber_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - network_maintenance_status = "not_defined";
           - accident_notification_status = "not_defined";
           - sub_subscriber_status = "not_defined";
           - все *_details = соответствующий fallback;
           - не выполняй остальные шаги.

        1. network_maintenance_status:
           - "defined" — если прямо указана обязанность содержать оборудование/сети;
           - "not_defined" — если не указана.

        2. network_maintenance_details:
           Краткое user-facing описание обязанности.
           Если данных нет — "Данные не определены".

        3. accident_notification_status:
           - "defined" — если указан срок уведомления об аварии;
           - "not_defined" — если не указан.

        4. accident_notification_deadline:
           Краткое user-facing описание срока уведомления.
           Если данных нет — "Данные не определены".

        5. eso_inspection_right_status:
           - "defined" — если указано право ЭСО на проверку;
           - "not_defined" — если не указано.

        6. sub_subscriber_status:
           - "defined" — если указано условие о субабоненте (запрет/разрешение);
           - "not_defined" — если не указано.

        7. sub_subscriber_regime:
           - "prohibited" — если запрещено;
           - "permitted_with_consent" — если разрешено с согласия;
           - "not_defined" — если не указано.

        8. sub_subscriber_penalty_status:
           - "defined" — если указаны последствия несогласованного подключения;
           - "not_defined" — если не указаны.

        9. sub_subscriber_penalty_details:
           Краткое user-facing описание последствий.
           Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни subscriber_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст договора.
        - "Допускается с согласия ЭСО" = permitted_with_consent.
        - "Запрещается", "не допускается" = prohibited.
        - Не анализируй последствия ограничения подачи — только последствия несогласованного подключения третьих лиц.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанностей по содержанию, ни условий о субабоненте.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = соответствующий fallback.

        2. Неполное раскрытие темы (только общая ссылка на закон).
           → presence = "present";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами (разные условия о субабоненте).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Прямое исключение обязанности (например, "ЭСО само обслуживает сети").
           → presence = "present";
             network_maintenance_status = "defined";
             network_maintenance_details содержит цитату с исключением.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subscriber_obligations_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * network_maintenance_details, accident_notification_deadline, sub_subscriber_penalty_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subscriber_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме обязанностей абонента. Внутреннее агрегатное signal-поле."
          required: true

