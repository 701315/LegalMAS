  - id: warranty_and_defects_rights_check
    name: "Гарантийный срок и права потребителя при недостатках товара"
    description: >
      Фактографическая проверка наличия гарантийного срока, полноты перечня прав
      потребителя при недостатках (ремонт, замена, возврат, уменьшение цены),
      расширенной гарантии и 2-летнего срока предъявления требований.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "недостаток товара"
        - "безвозмездное устранение"
        - "замена товара"
        - "возврат уплаченной суммы"
        - "соразмерное уменьшение"
        - "ремонт"
        - "гарантийное обслуживание"
        - "гарантийный талон"
        - "сервисный центр"
        - "срок службы"
        - "в течение 2 лет"
        - "расширенная гарантия"
        - "дополнительная гарантия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)при\\s+обнаружении\\s+недостатк"
        - "(?i)потребитель\\s+вправе\\s+(потребовать|требовать)"
        - "(?i)гарантия.*?(\\d+\\s*(мес|год|лет|дн))"
        - "(?i)расширенн(ая|ой)\\s+гарант"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: гарантийный срок и права потребителя
        при недостатках товара.

        Нормативный ориентир:
        - ст. 18–24 Закона РФ «О защите прав потребителей»
        - ст. 19 ЗоЗПП (двухлетний срок требований)
        - ст. 470–477 ГК РФ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Гарантийный срок (числовое значение или порядок определения).
        2. Перечень прав потребителя при обнаружении недостатков.
        3. Наличие расширенной (дополнительной) гарантии.
        4. Упоминание 2-летнего срока предъявления требований.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Если гарантийный срок определяется по гарантийному талону,
           документам производителя или иному прямо названному источнику —
           это не отсутствие регулирования; отрази это кратко в user-facing поле.
        3. Общая ссылка "гарантия в соответствии с законодательством" без
           конкретного срока или прямо названного источника — это not_defined.
        4. Если перечень прав неполный (например, только ремонт без права выбора
           замены или возврата) — фиксируй только то, что прямо указано.
        5. Если условие не указано прямо — возвращай "not_defined".
        6. Если данные противоречивы — возвращай "not_defined"
           и "Не удалось определить".
        7. В evidence включай только текст документа.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — гарантийный срок и полный перечень прав:
        Фрагмент:
        "Гарантийный срок составляет 12 месяцев с даты передачи товара.
        При обнаружении недостатков покупатель вправе потребовать ремонта,
        замены товара, возврата уплаченной суммы или соразмерного уменьшения
        цены по своему выбору."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "12 месяцев с даты передачи товара",
          "remedies_listed_status": "defined",
          "remedies_details": "Ремонт, замена товара, возврат уплаченной суммы, соразмерное уменьшение цены — по выбору покупателя",
          "extended_warranty_status": "not_defined",
          "extended_warranty_display": "Не упоминается",
          "two_year_term_status": "not_defined",
          "two_year_term_display": "Не упоминается",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийный срок составляет 12 месяцев с даты передачи товара. При обнаружении недостатков покупатель вправе потребовать ремонта, замены товара, возврата уплаченной суммы или соразмерного уменьшения цены по своему выбору."
            }
          ]
        }

        Пример 2 — гарантия по талону производителя, неполный перечень прав:
        Фрагмент:
        "Гарантийный срок определяется гарантийным талоном производителя.
        При обнаружении недостатков покупатель вправе потребовать безвозмездного
        устранения недостатков (ремонта) в сервисном центре."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "Определяется гарантийным талоном производителя",
          "remedies_listed_status": "defined",
          "remedies_details": "Ремонт (безвозмездное устранение недостатков) в сервисном центре",
          "extended_warranty_status": "not_defined",
          "extended_warranty_display": "Не упоминается",
          "two_year_term_status": "not_defined",
          "two_year_term_display": "Не упоминается",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Гарантийный срок определяется гарантийным талоном производителя. При обнаружении недостатков покупатель вправе потребовать безвозмездного устранения недостатков (ремонта) в сервисном центре."
            }
          ]
        }

        Пример 3 — расширенная гарантия и 2-летний срок:
        Фрагмент:
        "Гарантийный срок — 24 месяца. Покупатель вправе предъявить требования
        в течение 2 лет со дня передачи товара, даже если гарантийный срок истёк.
        Дополнительно доступна расширенная гарантия сроком 36 месяцев за отдельную плату."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "24 месяца",
          "remedies_listed_status": "not_defined",
          "remedies_details": "Не установлены",
          "extended_warranty_status": "defined",
          "extended_warranty_display": "Расширенная гарантия 36 месяцев за отдельную плату",
          "two_year_term_status": "defined",
          "two_year_term_display": "Упоминается: требования могут быть предъявлены в течение 2 лет со дня передачи товара",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Гарантийный срок — 24 месяца. Покупатель вправе предъявить требования в течение 2 лет со дня передачи товара, даже если гарантийный срок истёк."
            }
          ]
        }

        Пример 4 — только ссылка на закон:
        Фрагмент:
        "Гарантия предоставляется в соответствии с законодательством РФ."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Не установлен",
          "remedies_listed_status": "not_defined",
          "remedies_details": "Не установлены",
          "extended_warranty_status": "not_defined",
          "extended_warranty_display": "Не упоминается",
          "two_year_term_status": "not_defined",
          "two_year_term_display": "Не упоминается",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок гарантии или прямо названный источник
           его определения?
        2. Перечислены ли конкретные права при недостатках — не просто
           "в соответствии с законом"?
        3. Упомянута ли расширенная / дополнительная гарантия?
        4. Упомянут ли 2-летний срок предъявления требований?
        5. Нет ли только общей ссылки на законодательство без конкретики?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "warranty_status": "<defined|not_defined>",
          "warranty_details": "<срок или источник | 'Не установлен' | 'Не удалось определить'>",
          "remedies_listed_status": "<defined|not_defined>",
          "remedies_details": "<перечень прав | 'Не установлены' | 'Не удалось определить'>",
          "extended_warranty_status": "<defined|not_defined>",
          "extended_warranty_display": "<текст | 'Не упоминается' | 'Не удалось определить'>",
          "two_year_term_status": "<defined|not_defined>",
          "two_year_term_display": "<текст | 'Не упоминается' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок гарантия недостаток товара безвозмездное устранение замена товара возврат уплаченной суммы соразмерное уменьшение ремонт гарантийное обслуживание гарантийный талон сервисный центр срок службы расширенная гарантия дополнительная гарантия в течение 2 лет"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
        - obligations
      negative_keywords:
        - "возврат товара надлежащего качества"
        - "обмен товара надлежащего качества"
        - "14 дней"
        - "7 дней"
        - "товарный вид"
        - "потребительские свойства"
        - "Перечень 2463"
        - "невозвратные товары"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
        - "доставка"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения
        о гарантийном сроке и правах покупателя при обнаружении недостатков товара.
        Не анализируй возврат товара надлежащего качества, доставку или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. warranty_status:
           - "defined" — если в тексте прямо указан гарантийный срок
             (конкретный период: месяцы, годы) либо прямо сказано, что срок
             определяется гарантийным талоном, документами производителя
             или иным прямо названным источником;
           - "not_defined" — если гарантийный срок прямо не указан
             или надёжно определить нельзя.
           Важно: общая ссылка "гарантия в соответствии с законодательством"
           без конкретного срока и без прямо названного источника — not_defined.

        2. warranty_details:
           Краткое user-facing описание гарантийного срока на русском языке.
           Правила:
           - если срок прямо указан, напиши кратко, например:
             "12 месяцев с даты передачи товара",
             "24 месяца с момента покупки";
           - если срок определяется по прямо названному источнику:
             "Определяется гарантийным талоном производителя",
             "Согласно документации производителя";
           - не копируй длинные абзацы;
           - если не установлен — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        3. remedies_listed_status:
           - "defined" — если в тексте прямо перечислены права покупателя
             при обнаружении недостатков товара (ремонт, замена, возврат денег,
             уменьшение цены или их комбинация);
           - "not_defined" — если права прямо не перечислены
             или указана только общая ссылка на законодательство.

        4. remedies_details:
           Краткое user-facing описание прав при недостатках на русском языке.
           Правила:
           - перечисли права кратко через запятую, например:
             "Ремонт, замена товара, возврат уплаченной суммы,
             соразмерное уменьшение цены — по выбору покупателя",
             "Ремонт (безвозмездное устранение недостатков) в сервисном центре";
           - если права перечислены частично (например, только ремонт) —
             фиксируй только то, что прямо указано, без домысливания;
           - если есть формулировка "по выбору покупателя" или аналог —
             включи её в summary;
           - не копируй длинные абзацы;
           - если не установлены — "Не установлены";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        5. extended_warranty_status:
           - "defined" — если в тексте прямо упомянута расширенная
             или дополнительная гарантия (платная или бесплатная);
           - "not_defined" — если расширенная гарантия не упомянута.

        6. extended_warranty_display:
           Краткое user-facing описание расширенной гарантии на русском языке.
           Правила:
           - если упомянута, верни кратко (1 фраза), например:
             "Расширенная гарантия 36 месяцев за отдельную плату",
             "Дополнительная гарантия — 2 года, включена в стоимость";
           - если не упоминается — "Не упоминается";
           - если данные противоречивы — "Не удалось определить".

        7. two_year_term_status:
           - "defined" — если в тексте прямо упомянут 2-летний срок
             предъявления требований к продавцу при недостатках товара;
           - "not_defined" — если 2-летний срок не упомянут.

        8. two_year_term_display:
           Краткое user-facing описание на русском языке.
           Правила:
           - если упомянут, верни кратко (1 фраза), например:
             "Упоминается: требования предъявляются в течение 2 лет
             со дня передачи товара";
           - если не упоминается — "Не упоминается";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай гарантийные права при недостатках с правом на возврат
          товара надлежащего качества (14 дней / 7 дней) — это разные темы.
        - Если гарантийный срок прямо определяется по гарантийному талону
          или документам производителя — это valid defined, отрази кратко.
        - Если перечень прав неполный (например, только ремонт без замены
          и возврата) — фиксируй только то, что прямо указано в тексте,
          не домысливай остальные права.
        - Общая ссылка на законодательство без конкретного срока или перечня
          — это not_defined.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            warranty_details → "Не установлен"
            remedies_details → "Не установлены"
            extended_warranty_display → "Не упоминается"
            two_year_term_display → "Не упоминается"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения гарантийного срока. Внутреннее enum-поле."
          required: true
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание гарантийного срока
            или указание на источник его определения.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
        - name: "remedies_listed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечисления прав при недостатках. Внутреннее enum-поле."
          required: true
        - name: "remedies_details"
          type: "string"
          presentation: "fact"
          label: "Права при недостатках"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание прав покупателя при обнаружении
            недостатков товара.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true
        - name: "extended_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия расширенной гарантии. Внутреннее enum-поле."
          required: true
        - name: "extended_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Расширенная гарантия"
          display_in_grid: true
          display_priority: 3
          description: >
            Краткое user-facing описание расширенной или дополнительной гарантии.
            Fallback: "Не упоминается" / "Не удалось определить".
          required: true
        - name: "two_year_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания 2-летнего срока требований. Внутреннее enum-поле."
          required: true
        - name: "two_year_term_display"
          type: "string"
          presentation: "fact"
          label: "2-летний срок требований"
          display_in_grid: true
          display_priority: 4
          description: >
            Краткое user-facing описание упоминания 2-летнего срока
            предъявления требований к продавцу.
            Fallback: "Не упоминается" / "Не удалось определить".
          required: true
      store_payload: true

  - id: distance_selling_compliance_check
    name: "Комплаенс дистанционной продажи (ст. 26.1 ЗоЗПП)"
    description: >
      Фактографическая проверка наличия обязательных элементов при дистанционной
      продаже: право отказаться до передачи товара, 7-дневный срок возврата
      после получения, 3-месячный срок при ненадлежащем информировании,
      срок возврата денег.
      Проверка дополняет CHECK 8 и фокусируется на специфических требованиях
      ст. 26.1 ЗоЗПП, не покрытых общим check-ом возврата.
    triggers:
      any: ["distance_selling"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "дистанционный способ"
        - "интернет-магазин"
        - "доставка"
        - "право на отказ"
        - "7 дней"
        - "возврат при дистанционной"
        - "онлайн-заказ"
        - "момент передачи товара"
        - "информация до заключения"
        - "3 месяца"
        - "ненадлежащее информирование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн(ый|ой|ым)\\s+(способ|продаж)"
        - "(?i)отказ(аться)?.*до.*передач"
        - "(?i)в\\s+течение\\s+7\\s+(семи)?\\s*дней"
        - "(?i)3\\s+(тр[её]х)?\\s*месяц"
        - "(?i)ненадлежащ.*информир"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется оферта интернет-магазина / договор дистанционной продажи.
        Проверяются только специфические требования дистанционной продажи
        по ст. 26.1 ЗоЗПП, которые не относятся к общему 14-дневному возврату
        надлежащего качества.

        Нормативный ориентир:
        - ст. 26.1 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 2463

        [ЗАДАЧА]
        Найди в тексте документа только следующие специфические элементы
        дистанционной продажи:
        1. Право отказаться от товара до его передачи (до доставки, до отгрузки).
        2. 7-дневный срок возврата с момента получения товара
           при дистанционной продаже.
        3. 3-месячный срок возврата при ненадлежащем информировании
           покупателя о порядке возврата.
        4. Срок возврата денежных средств при отказе от товара
           при дистанционной продаже.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Не смешивай 7-дневный режим дистанционной продажи
           с общим 14-дневным правом на обмен/возврат надлежащего качества.
           Это разные механизмы. Для этого check интересен только 7-дневный
           срок в контексте дистанционной или интернет-продажи.
        3. Право отказаться до передачи товара может быть описано без слова
           "отказ": через "отмену заказа до отгрузки", "аннулирование заказа
           до передачи в службу доставки" и аналогичные формулировки.
        4. 3-месячный срок может быть описан как срок возврата "при отсутствии
           информации о порядке и сроках возврата" или аналогично.
        5. Срок возврата денег засчитывается как defined при любом прямом
           числовом указании срока (10 дней, 10 рабочих дней и т.п.),
           не только при строгой формулировке "10 дней".
        6. Если порядок возврата определяется через прямо названный внешний
           документ (правила возврата, регламент, страница сайта) — это valid
           defined; отрази это кратко в user-facing поле.
        7. Общая ссылка "в соответствии с законодательством" без конкретных
           сроков — это not_defined.
        8. Если условие не указано прямо — возвращай "not_defined".
        9. Если данные противоречивы — возвращай "not_defined"
           и "Не удалось определить".
        10. В evidence включай только текст документа.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — основные элементы указаны:
        Фрагмент:
        "Покупатель вправе отказаться от товара надлежащего качества в течение
        7 дней с момента его получения, а до момента доставки — в любое время.
        Денежные средства возвращаются в течение 10 дней с момента получения
        заявления об отказе."

        Ответ:
        {
          "pre_delivery_refusal_status": "defined",
          "pre_delivery_refusal_details": "До момента доставки — в любое время",
          "return_7_days_from_receipt_status": "defined",
          "return_7_days_details": "В течение 7 дней с момента получения товара",
          "three_month_term_status": "not_defined",
          "three_month_term_display": "Не упоминается",
          "refund_term_status": "defined",
          "refund_term_details": "В течение 10 дней с момента получения заявления об отказе",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Покупатель вправе отказаться от товара надлежащего качества в течение 7 дней с момента его получения, а до момента доставки — в любое время. Денежные средства возвращаются в течение 10 дней с момента получения заявления об отказе."
            }
          ]
        }

        Пример 2 — 3-месячный срок и отказ через отмену заказа:
        Фрагмент:
        "Покупатель вправе аннулировать заказ до его передачи в службу доставки.
        При отсутствии у покупателя информации о сроках и порядке возврата
        товар может быть возвращён в течение 3 месяцев с момента передачи."

        Ответ:
        {
          "pre_delivery_refusal_status": "defined",
          "pre_delivery_refusal_details": "Аннулирование заказа до передачи в службу доставки",
          "return_7_days_from_receipt_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "three_month_term_status": "defined",
          "three_month_term_display": "При отсутствии информации о порядке возврата — в течение 3 месяцев с момента передачи товара",
          "refund_term_status": "not_defined",
          "refund_term_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Покупатель вправе аннулировать заказ до его передачи в службу доставки. При отсутствии у покупателя информации о сроках и порядке возврата товар может быть возвращён в течение 3 месяцев с момента передачи."
            }
          ]
        }

        Пример 3 — возврат через внешний документ:
        Фрагмент:
        "Порядок и сроки возврата товара при дистанционной продаже определяются
        Правилами возврата, размещёнными на сайте Продавца."

        Ответ:
        {
          "pre_delivery_refusal_status": "not_defined",
          "pre_delivery_refusal_details": "Не установлено",
          "return_7_days_from_receipt_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "three_month_term_status": "not_defined",
          "three_month_term_display": "Не упоминается",
          "refund_term_status": "defined",
          "refund_term_details": "Согласно Правилам возврата, размещённым на сайте Продавца",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Порядок и сроки возврата товара при дистанционной продаже определяются Правилами возврата, размещёнными на сайте Продавца."
            }
          ]
        }

        Пример 4 — только общая ссылка:
        Фрагмент:
        "Возврат товара осуществляется согласно правилам интернет-магазина
        и действующему законодательству."

        Ответ:
        {
          "pre_delivery_refusal_status": "not_defined",
          "pre_delivery_refusal_details": "Не установлено",
          "return_7_days_from_receipt_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "three_month_term_status": "not_defined",
          "three_month_term_display": "Не упоминается",
          "refund_term_status": "not_defined",
          "refund_term_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое право отказаться или аннулировать заказ до передачи?
        2. Есть ли явный 7-дневный срок возврата в контексте дистанционной продажи
           (не путать с 14-дневным общим правом)?
        3. Упомянут ли 3-месячный срок при ненадлежащем информировании?
        4. Указан ли числовой срок возврата денег при отказе?
        5. Нет ли только общей ссылки на закон без конкретики?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "pre_delivery_refusal_status": "<defined|not_defined>",
          "pre_delivery_refusal_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "return_7_days_from_receipt_status": "<defined|not_defined>",
          "return_7_days_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "three_month_term_status": "<defined|not_defined>",
          "three_month_term_display": "<текст | 'Не упоминается' | 'Не удалось определить'>",
          "refund_term_status": "<defined|not_defined>",
          "refund_term_details": "<текст | 'Не установлен' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дистанционный способ продажи интернет-магазин право на отказ 7 дней с момента получения отказаться до передачи товара аннулировать заказ до отгрузки 3 месяца ненадлежащее информирование возврат денег срок возврата денег момент передачи товара"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "14 дней"
        - "возврат надлежащего качества"
        - "обмен надлежащего качества"
        - "товарный вид"
        - "Перечень 2463"
        - "гарантийный срок"
        - "недостаток"
        - "существенный недостаток"
        - "технически сложный"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения
        о специфических требованиях дистанционной продажи по ст. 26.1 ЗоЗПП:
        право отказаться до передачи товара, 7-дневный срок возврата после
        получения, 3-месячный срок при ненадлежащем информировании,
        срок возврата денег.
        Не анализируй общий 14-дневный обмен/возврат надлежащего качества —
        это отдельная тема, уже покрытая в другом check.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. pre_delivery_refusal_status:
           - "defined" — если в тексте прямо указано право покупателя
             отказаться от товара или аннулировать / отменить заказ
             до его передачи / отгрузки / передачи в службу доставки;
           - "not_defined" — если такое право прямо не указано.
           Важно: право отказаться до передачи может быть описано без слова
           "отказ": через "отмену заказа", "аннулирование заказа",
           "отзыв заказа" до момента отгрузки или передачи в доставку.

        2. pre_delivery_refusal_details:
           Краткое user-facing описание права отказаться до передачи товара.
           Правила:
           - верни кратко (1 фраза), например:
             "До момента доставки — в любое время",
             "Аннулирование заказа до передачи в службу доставки";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. return_7_days_from_receipt_status:
           - "defined" — если в тексте прямо указан 7-дневный срок возврата
             товара с момента получения в контексте дистанционной или
             интернет-продажи;
           - "not_defined" — если 7-дневный срок в этом контексте прямо
             не указан.
           Важно: не смешивай с общим 14-дневным правом на обмен/возврат
           надлежащего качества — это разные механизмы.

        4. return_7_days_details:
           Краткое user-facing описание 7-дневного срока возврата.
           Правила:
           - верни кратко (1 фраза), например:
             "В течение 7 дней с момента получения товара",
             "7 дней с даты доставки";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        5. three_month_term_status:
           - "defined" — если в тексте прямо упомянут 3-месячный срок возврата
             при ненадлежащем информировании покупателя о порядке возврата
             (или при отсутствии информации о сроках возврата);
           - "not_defined" — если 3-месячный срок не упомянут.

        6. three_month_term_display:
           Краткое user-facing описание 3-месячного срока.
           Правила:
           - если упомянут, верни кратко (1 фраза), например:
             "При отсутствии информации о порядке возврата — в течение
             3 месяцев с момента передачи товара";
           - если не упоминается — "Не упоминается";
           - если данные противоречивы — "Не удалось определить".

        7. refund_term_status:
           - "defined" — если в тексте прямо указан числовой срок возврата
             денежных средств при отказе от товара при дистанционной продаже
             (10 дней, 10 рабочих дней, не позднее 10 дней и т.п.),
             либо прямо сказано, что срок определяется по названному внешнему
             документу;
           - "not_defined" — если срок прямо не указан.
           Важно: засчитывается любое прямое числовое указание срока возврата
           денег, а не только строго "10 дней".

        8. refund_term_details:
           Краткое user-facing описание срока возврата денег.
           Правила:
           - если срок прямо указан, верни кратко (1 фраза), например:
             "В течение 10 дней с момента получения заявления об отказе",
             "Не позднее 10 рабочих дней";
           - если срок определяется через внешний документ:
             "Согласно Правилам возврата, размещённым на сайте Продавца";
           - не копируй длинные абзацы;
           - если не установлен — "Не установлен";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай 7-дневный режим дистанционной продажи с общим
          14-дневным правом на обмен/возврат надлежащего качества.
          Это принципиально разные механизмы. Для этого check нужен только
          7-дневный срок в контексте дистанционной или интернет-продажи.
        - Право отказаться до передачи товара распознаётся по смыслу:
          "отмена заказа до отгрузки", "аннулирование до передачи в доставку"
          и аналогичные формулировки — это valid defined.
        - 3-месячный срок может быть описан как "при отсутствии информации
          о порядке возврата" без прямого упоминания "ненадлежащего
          информирования".
        - Срок возврата денег засчитывается как defined при любом прямом
          числовом указании, а не только при строгой формулировке "10 дней".
        - Если срок или порядок определяется через прямо названный внешний
          документ (правила возврата, регламент, страница сайта) —
          это valid defined; отрази кратко в user-facing поле.
        - Общая ссылка на закон или "правила интернет-магазина" без конкретных
          сроков — это not_defined.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            pre_delivery_refusal_details → "Не установлено"
            return_7_days_details → "Не установлено"
            three_month_term_display → "Не упоминается"
            refund_term_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "pre_delivery_refusal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права отказаться до передачи товара. Внутреннее enum-поле."
          required: true
        - name: "pre_delivery_refusal_details"
          type: "string"
          presentation: "fact"
          label: "Отказ до передачи товара"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание права покупателя отказаться от товара
            до его передачи / отгрузки.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "return_7_days_from_receipt_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус 7-дневного срока возврата при дистанционной продаже. Внутреннее enum-поле."
          required: true
        - name: "return_7_days_details"
          type: "string"
          presentation: "fact"
          label: "Возврат (7 дней, дистанционная продажа)"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание 7-дневного срока возврата товара
            при дистанционной продаже.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "three_month_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания 3-месячного срока. Внутреннее enum-поле."
          required: true
        - name: "three_month_term_display"
          type: "string"
          presentation: "fact"
          label: "3-месячный срок (ненадлежащее информирование)"
          display_in_grid: true
          display_priority: 3
          description: >
            Краткое user-facing описание 3-месячного срока возврата при
            ненадлежащем информировании покупателя о порядке возврата.
            Fallback: "Не упоминается" / "Не удалось определить".
          required: true
        - name: "refund_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока возврата денег. Внутреннее enum-поле."
          required: true
        - name: "refund_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок возврата денег"
          display_in_grid: true
          display_priority: 4
          description: >
            Краткое user-facing описание срока возврата денежных средств
            при отказе от товара при дистанционной продаже.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
      store_payload: true

  - id: technical_goods_return_rules_check
    name: "Правила возврата технически сложных товаров (ст. 18 ЗоЗПП)"
    description: >
      Фактографическая проверка наличия в документе специального режима возврата ТСТ:
      15-дневный срок для любого недостатка, ссылка на Постановление № 924
      или Перечень технически сложных товаров, условие о существенном недостатке
      после 15 дней.
    triggers:
      any: ["technical_complex_goods"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "технически сложный товар"
        - "в течение 15 дней"
        - "существенный недостаток"
        - "Перечень технически сложных"
        - "Постановление № 924"
        - "ремонт товара"
        - "срок устранения недостатка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)технически\\s+сложн(ый|ого|ых)\\s+товар"
        - "(?i)в\\s+течение\\s+15\\s+(пятнадцати)?\\s*дней"
        - "(?i)существенн(ый|ого)\\s+недостат"
        - "(?i)Постановлени(е|я).*924"
        - "(?i)Перечен(ь|я)\\s+технически\\s+сложн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется оферта / договор купли-продажи с технически сложным товаром.
        Проверяется наличие специального режима возврата ТСТ по ст. 18 ЗоЗПП.

        Нормативный ориентир:
        - ст. 18 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 924

        [ЗАДАЧА]
        Найди в тексте документа только следующие три элемента:
        1. Упоминание 15-дневного срока возврата ТСТ при любом недостатке.
        2. Ссылку на Постановление № 924 или «Перечень технически сложных товаров».
        3. Условие о существенном недостатке как основание для возврата после 15 дней.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Не смешивай специальный режим ТСТ с общим гарантийным режимом
           (ремонт, замена, уменьшение цены без привязки к ТСТ).
        3. Если ТСТ вообще не упоминается в тексте — все поля `not_defined`.
        4. Общая ссылка "в соответствии с законодательством" без конкретных
           сроков или упоминания ТСТ — это not_defined.
        5. Если условие не указано прямо — возвращай "not_defined".
        6. Если данные противоречивы — возвращай "not_defined"
           и "Не удалось определить".
        7. В evidence включай только текст документа.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — всё указано:
        Фрагмент:
        "Технически сложные товары (согласно Постановлению Правительства РФ № 924)
        в течение 15 дней с момента передачи подлежат возврату при обнаружении
        любого недостатка. По истечении 15 дней возврат возможен только при
        наличии существенного недостатка."

        Ответ:
        {
          "tst_15_days_status": "defined",
          "tst_15_days_details": "В течение 15 дней с момента передачи — при любом недостатке",
          "tst_regulation_924_status": "defined",
          "tst_regulation_924_display": "Постановление Правительства РФ № 924",
          "tst_substantial_defect_status": "defined",
          "tst_substantial_defect_display": "После 15 дней — только при существенном недостатке",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Технически сложные товары (согласно Постановлению Правительства РФ № 924) в течение 15 дней с момента передачи подлежат возврату при обнаружении любого недостатка. По истечении 15 дней возврат возможен только при наличии существенного недостатка."
            }
          ]
        }

        Пример 2 — только ссылка на Перечень, без 15 дней:
        Фрагмент:
        "На технически сложные товары в соответствии с Перечнем технически
        сложных товаров распространяются особые правила возврата."

        Ответ:
        {
          "tst_15_days_status": "not_defined",
          "tst_15_days_details": "Не установлен",
          "tst_regulation_924_status": "defined",
          "tst_regulation_924_display": "Перечень технически сложных товаров",
          "tst_substantial_defect_status": "not_defined",
          "tst_substantial_defect_display": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "На технически сложные товары в соответствии с Перечнем технически сложных товаров распространяются особые правила возврата."
            }
          ]
        }

        Пример 3 — ТСТ не упоминается:
        Фрагмент:
        "Возврат товара осуществляется по правилам, установленным
        законодательством Российской Федерации."

        Ответ:
        {
          "tst_15_days_status": "not_defined",
          "tst_15_days_details": "Не установлен",
          "tst_regulation_924_status": "not_defined",
          "tst_regulation_924_display": "Не упоминается",
          "tst_substantial_defect_status": "not_defined",
          "tst_substantial_defect_display": "Не установлено",
          "evidence": []
        }

        Пример 4 — 15 дней без ссылки на Постановление:
        Фрагмент:
        "Технически сложные товары могут быть возвращены в течение 15 дней
        с момента передачи при обнаружении любого недостатка."

        Ответ:
        {
          "tst_15_days_status": "defined",
          "tst_15_days_details": "В течение 15 дней с момента передачи — при любом недостатке",
          "tst_regulation_924_status": "not_defined",
          "tst_regulation_924_display": "Не упоминается",
          "tst_substantial_defect_status": "not_defined",
          "tst_substantial_defect_display": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Технически сложные товары могут быть возвращены в течение 15 дней с момента передачи при обнаружении любого недостатка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Упоминается ли ТСТ прямо в тексте?
        2. Если нет — все поля not_defined.
        3. Есть ли явный 15-дневный срок применительно к ТСТ?
        4. Упомянуто ли Постановление № 924 или Перечень ТСТ?
        5. Есть ли условие о существенном недостатке после 15 дней?
        6. Нет ли только общей ссылки на закон без конкретики?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "tst_15_days_status": "<defined|not_defined>",
          "tst_15_days_details": "<текст | 'Не установлен' | 'Не удалось определить'>",
          "tst_regulation_924_status": "<defined|not_defined>",
          "tst_regulation_924_display": "<текст | 'Не упоминается' | 'Не удалось определить'>",
          "tst_substantial_defect_status": "<defined|not_defined>",
          "tst_substantial_defect_display": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "технически сложный товар в течение 15 дней существенный недостаток Перечень технически сложных Постановление 924 возврат технически сложного товара"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "14 дней"
        - "7 дней"
        - "возврат надлежащего качества"
        - "обмен надлежащего качества"
        - "Перечень 2463"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
        - "доставка"
      position_bias:
        preferred_range: [0.20, 0.90]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения
        о специальном режиме возврата технически сложных товаров (ТСТ)
        по ст. 18 ЗоЗПП.
        Не анализируй общий гарантийный режим, возврат надлежащего качества,
        доставку или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. tst_15_days_status:
           - "defined" — если в тексте прямо указан 15-дневный срок возврата
             применительно к технически сложным товарам;
           - "not_defined" — если 15-дневный срок для ТСТ прямо не указан
             или надёжно определить нельзя.
           Важно: если ТСТ в тексте вообще не упоминается — "not_defined".
           Не смешивай с общим гарантийным сроком без привязки к ТСТ.

        2. tst_15_days_details:
           Краткое user-facing описание 15-дневного срока для ТСТ.
           Правила:
           - если прямо указан, верни кратко (1 фраза), например:
             "В течение 15 дней с момента передачи — при любом недостатке",
             "15 дней с даты покупки при обнаружении любого недостатка";
           - не копируй длинные абзацы;
           - если не установлен — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        3. tst_regulation_924_status:
           - "defined" — если в тексте прямо упомянуто Постановление
             Правительства РФ № 924 или «Перечень технически сложных товаров»;
           - "not_defined" — если эти документы прямо не упоминаются.

        4. tst_regulation_924_display:
           Краткое user-facing описание на русском языке.
           Правила:
           - если упомянуто, верни кратко (1 фраза), например:
             "Постановление Правительства РФ № 924",
             "Перечень технически сложных товаров",
             "Постановление № 924 и Перечень ТСТ";
           - если не упоминается — "Не упоминается";
           - если данные противоречивы — "Не удалось определить".

        5. tst_substantial_defect_status:
           - "defined" — если в тексте прямо указано, что после 15-дневного
             срока возврат ТСТ возможен только при существенном недостатке
             или аналогичном условии;
           - "not_defined" — если такое условие прямо не указано.

        6. tst_substantial_defect_display:
           Краткое user-facing описание условия после 15 дней.
           Правила:
           - если прямо указано, верни кратко (1 фраза), например:
             "После 15 дней — только при существенном недостатке",
             "По истечении 15 дней — при наличии существенного недостатка
             или нарушении срока ремонта";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай специальный режим ТСТ с общим гарантийным режимом
          (ремонт, замена, уменьшение цены без привязки к ТСТ и 15-дневному сроку).
        - Если ТСТ в тексте вообще не упоминается — все status-поля → "not_defined",
          все текстовые поля → соответствующий fallback.
        - Общая ссылка на законодательство без упоминания ТСТ, 15 дней
          или Постановления № 924 — это not_defined.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            tst_15_days_details → "Не установлен"
            tst_regulation_924_display → "Не упоминается"
            tst_substantial_defect_display → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "tst_15_days_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания 15-дневного срока возврата ТСТ. Внутреннее enum-поле."
          required: true
        - name: "tst_15_days_details"
          type: "string"
          presentation: "fact"
          label: "ТСТ — 15 дней"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание 15-дневного срока возврата ТСТ.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
        - name: "tst_regulation_924_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания Постановления № 924 / Перечня ТСТ. Внутреннее enum-поле."
          required: true
        - name: "tst_regulation_924_display"
          type: "string"
          presentation: "fact"
          label: "Перечень ТСТ / Постановление № 924"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание ссылки на Постановление № 924
            или Перечень технически сложных товаров.
            Fallback: "Не упоминается" / "Не удалось определить".
          required: true
        - name: "tst_substantial_defect_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о существенном недостатке после 15 дней. Внутреннее enum-поле."
          required: true
        - name: "tst_substantial_defect_display"
          type: "string"
          presentation: "fact"
          label: "После 15 дней"
          display_in_grid: true
          display_priority: 3
          description: >
            Краткое user-facing описание условия возврата ТСТ после 15-дневного срока.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: marketplace_liability_allocation_check
    name: "Маркетплейс: данные о продавце и распределение ответственности"
    description: >
      Фактографическая проверка наличия в оферте маркетплейса реквизитов реального
      продавца, порядка раскрытия информации и распределения ответственности
      между маркетплейсом и продавцом.
    triggers:
      any: ["marketplace_platform"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "маркетплейс"
        - "агрегатор"
        - "владелец агрегатора"
        - "информационный посредник"
        - "ответственность маркетплейса"
        - "ответственность продавца"
        - "солидарная ответственность"
        - "информация о продавце"
        - "реквизиты продавца"
        - "ОГРН продавца"
        - "адрес продавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)маркетплейс|агрегатор"
        - "(?i)информаци(я|ю)\\s+о\\s+продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется оферта маркетплейса / торговой площадки.
        Проверяется наличие данных о продавце и распределение ответственности.

        Нормативный ориентир:
        - ст. 9, 12.1, 26.1 Закона РФ «О защите прав потребителей»
        - ФЗ от 29.12.2022 № 594-ФЗ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Как и где раскрываются реквизиты реального продавца.
        2. Роль маркетплейса (агрегатор / продавец от своего имени /
           информационный посредник / смешанная роль).
        3. Как распределяется ответственность между маркетплейсом и продавцом.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Если маркетплейс или агрегатор вообще не упоминается в тексте —
           все поля not_defined.
        3. Раскрытие данных продавца засчитывается как defined при любом
           прямо описанном способе:
           - в карточке товара;
           - в чеке / подтверждении заказа;
           - по запросу покупателя;
           - на странице продавца на платформе.
        4. Роль маркетплейса может быть:
           - агрегатор (только площадка, не продавец);
           - продавец от своего имени;
           - информационный посредник;
           - смешанная (для одних товаров — агрегатор, для других — продавец),
             если это прямо указано.
        5. Ответственность может быть:
           - только продавца;
           - только маркетплейса;
           - солидарная;
           - разграниченная по типу нарушения.
        6. Если условие не указано прямо — возвращай "not_defined".
        7. Если данные противоречивы — возвращай "not_defined"
           и "Не удалось определить".
        8. В evidence включай только текст документа.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — агрегатор без ответственности, данные в карточке:
        Фрагмент:
        "Маркетплейс является агрегатором и не несёт ответственности за действия
        продавцов. Информация о продавце (наименование, ОГРН, адрес) доступна
        в карточке товара."

        Ответ:
        {
          "seller_info_disclosure_status": "defined",
          "seller_info_disclosure_details": "В карточке товара: наименование, ОГРН, адрес продавца",
          "marketplace_role_status": "defined",
          "marketplace_role_details": "Агрегатор (не является продавцом)",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "Маркетплейс не несёт ответственности за действия продавцов",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Маркетплейс является агрегатором и не несёт ответственности за действия продавцов. Информация о продавце (наименование, ОГРН, адрес) доступна в карточке товара."
            }
          ]
        }

        Пример 2 — солидарная ответственность:
        Фрагмент:
        "Владелец агрегатора несёт солидарную ответственность с продавцом
        за убытки, причинённые потребителю вследствие предоставления ему
        недостоверной или неполной информации о товаре."

        Ответ:
        {
          "seller_info_disclosure_status": "not_defined",
          "seller_info_disclosure_details": "Не установлено",
          "marketplace_role_status": "defined",
          "marketplace_role_details": "Владелец агрегатора",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "Солидарная ответственность с продавцом за убытки из-за недостоверной информации о товаре",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Владелец агрегатора несёт солидарную ответственность с продавцом за убытки, причинённые потребителю вследствие предоставления ему недостоверной или неполной информации о товаре."
            }
          ]
        }

        Пример 3 — маркетплейс является продавцом:
        Фрагмент:
        "ООО «Маркет» выступает продавцом товаров, представленных на платформе,
        и несёт полную ответственность перед покупателем."

        Ответ:
        {
          "seller_info_disclosure_status": "not_defined",
          "seller_info_disclosure_details": "Не установлено",
          "marketplace_role_status": "defined",
          "marketplace_role_details": "Продавец от своего имени (ООО «Маркет»)",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "Полная ответственность маркетплейса как продавца",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "ООО «Маркет» выступает продавцом товаров, представленных на платформе, и несёт полную ответственность перед покупателем."
            }
          ]
        }

        Пример 4 — разграниченная ответственность:
        Фрагмент:
        "Маркетплейс несёт ответственность за информацию, размещённую на платформе.
        За качество товара и его доставку ответственность несёт продавец."

        Ответ:
        {
          "seller_info_disclosure_status": "not_defined",
          "seller_info_disclosure_details": "Не установлено",
          "marketplace_role_status": "not_defined",
          "marketplace_role_details": "Не установлена",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "Маркетплейс — за информацию на платформе; продавец — за качество товара и доставку",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Маркетплейс несёт ответственность за информацию, размещённую на платформе. За качество товара и его доставку ответственность несёт продавец."
            }
          ]
        }

        Пример 5 — ничего не определено:
        Фрагмент:
        "Платформа обеспечивает возможность совершения покупок."

        Ответ:
        {
          "seller_info_disclosure_status": "not_defined",
          "seller_info_disclosure_details": "Не установлено",
          "marketplace_role_status": "not_defined",
          "marketplace_role_details": "Не установлена",
          "liability_allocation_status": "not_defined",
          "liability_allocation_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Упоминается ли маркетплейс или агрегатор прямо в тексте?
        2. Указано ли, где и как раскрываются данные продавца?
        3. Определена ли роль маркетплейса прямо?
        4. Указано ли, кто и за что несёт ответственность?
        5. Если маркетплейс не упоминается — все поля not_defined.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "seller_info_disclosure_status": "<defined|not_defined>",
          "seller_info_disclosure_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "marketplace_role_status": "<defined|not_defined>",
          "marketplace_role_details": "<текст | 'Не установлена' | 'Не удалось определить'>",
          "liability_allocation_status": "<defined|not_defined>",
          "liability_allocation_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "маркетплейс агрегатор владелец агрегатора информационный посредник ответственность маркетплейса ответственность продавца солидарная ответственность информация о продавце реквизиты продавца ОГРН продавца адрес продавца"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
        - procedures
      negative_keywords:
        - "возврат товара"
        - "обмен товара"
        - "гарантийный срок"
        - "недостаток"
        - "технически сложный"
        - "14 дней"
        - "7 дней"
        - "персональные данные"
        - "доставка"
        - "цена"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты маркетплейса сведения
        о раскрытии данных продавца, роли маркетплейса и распределении
        ответственности между маркетплейсом и продавцом.
        Не анализируй возврат товара, гарантию, доставку или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_info_disclosure_status:
           - "defined" — если в тексте прямо описан способ раскрытия данных
             реального продавца (наименование, ОГРН, адрес или их часть):
             в карточке товара, в чеке, по запросу, на странице продавца
             на платформе или иным прямо описанным способом;
           - "not_defined" — если способ раскрытия данных продавца прямо
             не указан.
           Важно: если маркетплейс сам является продавцом и его данные уже
           указаны в договоре — это тоже valid defined для данного поля.

        2. seller_info_disclosure_details:
           Краткое user-facing описание способа раскрытия данных продавца.
           Правила:
           - верни кратко (1 фраза), например:
             "В карточке товара: наименование, ОГРН, адрес продавца",
             "В подтверждении заказа и чеке",
             "По запросу покупателя",
             "Маркетплейс является продавцом, данные указаны в оферте";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. marketplace_role_status:
           - "defined" — если в тексте прямо указана роль маркетплейса
             (агрегатор, владелец агрегатора, информационный посредник,
             продавец от своего имени, смешанная роль);
           - "not_defined" — если роль прямо не определена.

        4. marketplace_role_details:
           Краткое user-facing описание роли маркетплейса.
           Правила:
           - верни кратко (1 фраза), например:
             "Агрегатор (не является продавцом)",
             "Владелец агрегатора",
             "Продавец от своего имени (ООО «Маркет»)",
             "Информационный посредник",
             "Смешанная роль: агрегатор для сторонних продавцов,
             продавец для собственных товаров";
           - не копируй длинные абзацы;
           - если не установлена — "Не установлена";
           - если данные противоречивы — "Не удалось определить".

        5. liability_allocation_status:
           - "defined" — если в тексте прямо указано распределение
             ответственности между маркетплейсом и продавцом
             (только продавец, только маркетплейс, солидарная,
             разграниченная по типу нарушения);
           - "not_defined" — если распределение ответственности прямо
             не указано.

        6. liability_allocation_details:
           Краткое user-facing описание распределения ответственности.
           Правила:
           - верни кратко (1–2 фразы), например:
             "Маркетплейс не несёт ответственности за действия продавцов",
             "Солидарная ответственность с продавцом за убытки из-за
             недостоверной информации о товаре",
             "Полная ответственность маркетплейса как продавца",
             "Маркетплейс — за информацию на платформе;
             продавец — за качество товара и доставку";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Если маркетплейс или агрегатор в тексте вообще не упоминается —
          все status-поля → "not_defined", все текстовые поля → fallback.
        - Не смешивай ответственность маркетплейса с общей гарантийной
          ответственностью, правом на возврат товара или иными нерелевантными темами.
        - Раскрытие данных продавца засчитывается как defined при любом прямо
          описанном способе: карточка товара, чек, запрос, страница продавца.
        - Если маркетплейс сам является продавцом и его данные указаны в оферте —
          это valid defined для seller_info_disclosure.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            seller_info_disclosure_details → "Не установлено"
            marketplace_role_details → "Не установлена"
            liability_allocation_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "seller_info_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия данных продавца. Внутреннее enum-поле."
          required: true
        - name: "seller_info_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие данных продавца"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание способа раскрытия данных
            реального продавца на платформе.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "marketplace_role_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания роли маркетплейса. Внутреннее enum-поле."
          required: true
        - name: "marketplace_role_details"
          type: "string"
          presentation: "fact"
          label: "Роль маркетплейса"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание роли маркетплейса:
            агрегатор, продавец от своего имени, информационный посредник
            или смешанная роль.
            Fallback: "Не установлена" / "Не удалось определить".
          required: true
        - name: "liability_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения ответственности. Внутреннее enum-поле."
          required: true
        - name: "liability_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Распределение ответственности"
          display_in_grid: true
          display_priority: 3
          description: >
            Краткое user-facing описание распределения ответственности
            между маркетплейсом и продавцом.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  seller_identification_subject_cluster:
    text: >
      В {doc_names} не определены реквизиты продавца и/или предмет договора.
      Просим предоставить: (а) полные реквизиты продавца — наименование, ОГРН/ОГРНИП,
      ИНН, юридический и фактический адрес, контактные данные для претензий
      (ст. 9 ЗоЗПП); (б) описание предмета договора — точное наименование товара,
      основные потребительские свойства, характеристики, комплектацию, артикул.
    addressee: "Продавец / Юридический отдел"

  subject_price_payment_cluster:
    text: >
      В {doc_names} не определены цена и/или порядок расчетов.
      Просим предоставить: (а) цену товара или механизм её определения;
      (б) полный перечень способов оплаты, включая наличный расчёт (ст. 16.1 ЗоЗПП);
      (в) условия предоплаты — размер, срок и порядок возврата при отказе покупателя;
      (г) последствия просрочки оплаты.
    addressee: "Продавец / Бухгалтерия / Юридический отдел"

  order_formation_delivery_cluster:
    text: >
      В {doc_names} не определены условия доставки и/или момент заключения договора.
      Просим предоставить: (а) конкретные сроки и способы доставки, стоимость;
      (б) момент заключения договора (акцепт оферты, подтверждение заказа);
      (в) порядок и условия отмены заказа до передачи товара;
      (г) право продавца удержать расходы на обратную доставку при возврате
      надлежащего качества (п. 4 ст. 26.1 ЗоЗПП).
    addressee: "Продавец / Логистика / Юридический отдел"

  return_exchange_consumer_rights_cluster:
    text: >
      В {doc_names} не определены условия возврата и обмена товара.
      Просим предоставить: (а) право на возврат/обмен в течение 14 дней (ст. 25 ЗоЗПП)
      и 7 дней при дистанционной продаже (ст. 26.1 ЗоЗПП);
      (б) конкретные условия возврата (товарный вид, упаковка, чек);
      (в) срок возврата денег покупателю (не более 10 дней);
      (г) для невозвратных товаров — ссылку на Постановление № 2463 с указанием
      конкретных категорий (не расширять перечень сверх № 2463).
    addressee: "Юридический отдел продавца"

  illegal_restrictions_detection:
    text: >
      В {doc_names} обнаружены формулировки, ограничивающие права потребителя
      (ст. 16, 17 ЗоЗПП). Просим привести соответствующие условия в соответствие
      с ЗоЗПП: убрать запрет на возврат, ограничение «только ремонт», обязательную
      платную экспертизу, условие об исключительной подсудности или обязательном
      третейском суде, навязывание дополнительных товаров/услуг.
    addressee: "Юридический отдел продавца"

  warranty_and_defects_rights_check:
    text: >
      В {doc_names} не определены гарантийные условия.
      Просим предоставить: (а) гарантийный срок и момент его начала;
      (б) полный перечень прав потребителя при недостатках — ремонт, замена,
      возврат, уменьшение цены по выбору потребителя (ст. 18 ЗоЗПП);
      (в) при гарантийном сроке менее 2 лет — указание на 2-летний срок
      предъявления требований (ст. 19 ЗоЗПП).
    addressee: "Юридический отдел продавца / Сервисный отдел"

  personal_data_processing_check:
    text: >
      В {doc_names} не определены условия обработки персональных данных (ФЗ-152).
      Просим предоставить: (а) конкретный механизм получения согласия;
      (б) конкретные цели обработки; (в) порядок отзыва согласия.
    addressee: "DPO / Юридический отдел"

  distance_selling_compliance_check:
    text: >
      В {doc_names} не определены обязательные условия дистанционной продажи.
      Просим предоставить: (а) право отказа в течение 7 дней с момента передачи
      товара (ст. 26.1 ЗоЗПП); (б) право отказаться до передачи в любое время;
      (в) срок до 3 месяцев при ненадлежащем информировании о порядке возврата;
      (г) срок возврата денег — не позднее 10 дней.
    addressee: "Юридический отдел продавца"

  technical_goods_return_rules_check:
    text: >
      В {doc_names} не определены правила возврата технически сложных товаров.
      Просим предоставить: (а) ссылку на Перечень ТСТ (Постановление № 924);
      (б) 15-дневный срок для возврата при любом недостатке;
      (в) права при существенном недостатке после 15 дней.
    addressee: "Юридический отдел продавца"

  marketplace_liability_allocation_check:
    text: >
      В {doc_names} не определены данные о продавце и распределение ответственности.
      Просим предоставить: (а) реквизиты реального продавца (наименование, ОГРН/ОГРНИП,
      адрес — ст. 9 ЗоЗПП) в карточке товара; (б) роль маркетплейса (агрегатор/продавец);
      (в) порядок предъявления претензий потребителем; (г) условия солидарной
      ответственности агрегатора при нераскрытии информации (ст. 12.1 ЗоЗПП, ред. 2022).
    addressee: "Юридический отдел маркетплейса"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический отдел продавца"

