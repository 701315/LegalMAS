  - id: late_payment_consequences_cluster
    name: "Последствия просрочки оплаты покупателем"
    description: >
      Фактографическая проверка наличия специальных последствий
      просрочки оплаты со стороны покупателя.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "просрочка оплаты"
        - "неоплата"
        - "несвоевременная оплата"
        - "пени"
        - "неустойка"
        - "штраф"
        - "аннулирование заказа"
        - "отмена заказа"
        - "приостановка исполнения"
        - "вправе не передавать товар"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)просрочк[аи]\\s+оплат"
        - "(?i)неоплат"
        - "(?i)несвоевременн[а-я]+\\s+оплат"
        - "(?i)неустойк[аи]|пен[яиь]|штраф"
        - '(?i)аннулир\w+\s+заказ'
        - '(?i)отмен\w+\s+заказ'
        - "(?i)вправе\\s+не\\s+передавать\\s+товар"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: специальные последствия просрочки оплаты покупателем.

        Нормативный ориентир:
        - ст. 330 ГК РФ
        - ст. 486, 487 ГК РФ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Указаны ли специальные последствия просрочки оплаты со стороны покупателя.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона и не делай предположений.
        2. Специальными последствиями для этого check считаются, если они прямо указаны:
           - пени, неустойка, штраф;
           - аннулирование / отмена заказа;
           - приостановка исполнения;
           - отказ в передаче товара до оплаты;
           - иные специально описанные последствия неисполнения обязанности по оплате.
        3. Не смешивай последствия просрочки оплаты с общими условиями оплаты,
           предоплатой, ценой товара и способами оплаты.
        4. Общая фраза "стороны несут ответственность по законодательству РФ"
           или "в порядке, предусмотренном законом" без конкретизации
           не является основанием для "defined".
        5. Если последствия определяются по названному внешнему документу
           (регламенту, приложению, правилам оплаты) — это не отсутствие регулирования;
           отрази это в user-facing поле.
        6. Если условие не указано прямо — возвращай "not_defined".
        7. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        8. В evidence включай только текст документа.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — пени:
        Фрагмент:
        "За просрочку оплаты Покупатель уплачивает пеню в размере 0,1%
        от суммы задолженности за каждый день просрочки."

        Ответ:
        {
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_details": "Пеня 0,1% от суммы задолженности за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "За просрочку оплаты Покупатель уплачивает пеню в размере 0,1% от суммы задолженности за каждый день просрочки."
            }
          ]
        }

        Пример 2 — отмена заказа:
        Фрагмент:
        "При неоплате заказа в течение 24 часов с момента оформления
        Продавец вправе аннулировать заказ."

        Ответ:
        {
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_details": "Продавец вправе аннулировать заказ при неоплате в течение 24 часов с момента оформления",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "При неоплате заказа в течение 24 часов с момента оформления Продавец вправе аннулировать заказ."
            }
          ]
        }

        Пример 3 — внешний документ:
        Фрагмент:
        "Последствия просрочки оплаты определяются Правилами оплаты,
        размещёнными на сайте Продавца."

        Ответ:
        {
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_details": "Согласно Правилам оплаты, размещённым на сайте Продавца",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Последствия просрочки оплаты определяются Правилами оплаты, размещёнными на сайте Продавца."
            }
          ]
        }

        Пример 4 — только общая ссылка на закон:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое специальное последствие неоплаты / просрочки оплаты?
        2. Это именно последствие нарушения оплаты, а не просто условие оплаты?
        3. Нет ли только общей ссылки на закон без конкретики?
        4. Если последствие определяется по названному внешнему документу —
           отрази это как user-facing значение.
        5. Если вопрос не урегулирован — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "late_payment_consequences_status": "<defined / not_defined>",
          "late_payment_consequences_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "просрочка оплаты неоплата несвоевременная оплата пени неустойка штраф аннулирование заказа отмена заказа приостановка исполнения вправе не передавать товар"
      preferred_unit_types:
        - liability_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
        - procedures
      negative_keywords:
        - "предоплата"
        - "аванс"
        - "возврат предоплаты"
        - "цена"
        - "стоимость доставки"
        - "способ оплаты"
        - "ОГРН"
        - "ИНН"
      position_bias:
        preferred_range: [0.10, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 550

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты сведения
        только о специальных последствиях просрочки оплаты со стороны покупателя.
        Не анализируй предоплату, цену товара, способы оплаты, доставку,
        возврат товара или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. late_payment_consequences_status:
           - "defined" — если в тексте прямо указаны специальные последствия
             просрочки оплаты / неоплаты со стороны покупателя либо прямо сказано,
             что такие последствия определяются по названному внешнему документу
             (регламенту, приложению, правилам оплаты и т.п.);
           - "not_defined" — если специальные последствия прямо не указаны
             или их нельзя надёжно определить.
           Важно: общая ссылка на законодательство РФ или общая формулировка
           об ответственности без конкретизации последствий не является основанием
           для "defined".

        2. late_payment_consequences_details:
           Краткое user-facing описание последствий просрочки оплаты на русском языке.
           Правила:
           - если последствия прямо описаны, верни краткое summary (1–2 коротких фразы),
             например:
             "Пеня 0,1% от суммы задолженности за каждый день просрочки",
             "Продавец вправе аннулировать заказ при неоплате в течение 24 часов",
             "Передача товара приостанавливается до полной оплаты";
           - если последствия определяются по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Правилам оплаты, размещённым на сайте Продавца",
             "Согласно Приложению №3";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не смешивай последствия просрочки оплаты с предоплатой, ценой,
          способами оплаты, общими условиями оплаты и иными нерелевантными темами.
        - Для этого check релевантны только специально описанные последствия
          нарушения обязанности по оплате: пени, штраф, неустойка, аннулирование заказа,
          приостановка исполнения, отказ в передаче товара до оплаты и аналогичные меры.
        - Общие фразы вроде "в соответствии с законодательством РФ",
          "в порядке, предусмотренном законом" без конкретизации последствий —
          это not_defined, а не defined.
        - Если последствия прямо определяются по названному внешнему документу,
          считай их определёнными и отрази это в user-facing поле.
        - Если в разных фрагментах указаны несовместимые последствия просрочки оплаты
          и конфликт нельзя разрешить по тексту:
          * late_payment_consequences_status → "not_defined";
          * late_payment_consequences_details → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 2 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для late_payment_consequences_status используй только:
          "defined" или "not_defined".
        - Для late_payment_consequences_details при отсутствии данных используй:
          "Не установлены".
        - Для late_payment_consequences_details при неоднозначности или конфликте используй:
          "Не удалось определить".
        </output_expectations>

      fields:
        - name: "late_payment_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения специальных последствий просрочки оплаты. Внутреннее enum-поле."
          required: true
        - name: "late_payment_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия просрочки оплаты"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание специальных последствий просрочки оплаты
            или указание на named external source.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: contract_formation_and_order_cancellation_cluster
    name: "Момент заключения договора и отмена заказа"
    description: >
      Фактографическая проверка наличия условий о моменте заключения договора
      и порядке отмены заказа до передачи товара.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "момент заключения"
        - "акцепт оферты"
        - "оформление заказа"
        - "подтверждение заказа"
        - "выдача чека"
        - "нажатие кнопки"
        - "конклюдентные действия"
        - "отмена заказа"
        - "отказ от заказа"
        - "аннулирование заказа"
