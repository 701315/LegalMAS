            Полное наименование продавца.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "seller_ogrn_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания ОГРН/ОГРНИП. Внутреннее enum-поле."
          required: true
        - name: "seller_ogrn_value"
          type: "string"
          presentation: "fact"
          label: "ОГРН / ОГРНИП"
          display_in_grid: true
          display_priority: 2
          description: >
            Числовой ОГРН или ОГРНИП продавца.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
        - name: "seller_inn_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания ИНН. Внутреннее enum-поле."
          required: true
        - name: "seller_inn_value"
          type: "string"
          presentation: "fact"
          label: "ИНН"
          display_in_grid: true
          display_priority: 3
          description: >
            ИНН продавца.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
        - name: "seller_address_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания адреса продавца. Внутреннее enum-поле."
          required: true
        - name: "seller_address_value"
          type: "string"
          presentation: "fact"
          label: "Адрес продавца"
          display_in_grid: true
          display_priority: 4
          description: >
            Адрес продавца.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
      store_payload: true

  - id: buyer_identification_requirements_cluster
    name: "Идентификация и требования к Покупателю"
    description: >
      Фактографическая проверка требований к правовому статусу покупателя
      (физические лица, ИП, юридические лица), возрастных ограничений,
      а также перечня данных, которые покупатель обязан предоставить для
      заключения и исполнения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "покупатель"
        - "клиент"
        - "пользователь"
        - "потребитель"
        - "физическое лицо"
        - "юридическое лицо"
        - "индивидуальный предприниматель"
        - "возраст"
        - "18 лет"
        - "совершеннолетний"
        - "дееспособность"
        - "резидент"
        - "предоставляет сведения"
        - "регистрация"
        - "личный кабинет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)покупател[еи]м?\\s+может\\s+быть"
        - "(?i)заключать\\s+договор.*?(?:18|восемнадцати)\\s+лет"
        - "(?i)правовой\\s+статус"
        - "(?i)сведения.*?о\\s+покупателе"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: требования к Покупателю и порядок его идентификации.

        Нормативный ориентир:
        - ст. 492 ГК РФ
        - ст. 21, 26, 28 ГК РФ (дееспособность)

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Допустимый правовой статус Покупателя.
        2. Возрастные ограничения.
        3. Данные, которые Покупатель обязан предоставить.
        4. Требуется ли обязательная регистрация / личный кабинет.

        [ПРАВИЛА]
        1. Используй только текст документа. Не делай предположений на основе закона
           или типичной логики розничной торговли.
        2. Не подставляй "физические лица" только потому, что документ похож на
           розничную оферту. Если в тексте нет прямого указания — поле неустановлено.
        3. Если данные покупателя определяются через форму заказа, регистрационную форму,
           личный кабинет или иной названный интерфейс — это допустимый исход,
           отрази его кратко в текстовом поле.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если данные противоречивы — возвращай "not_defined" и "Не удалось определить".
        6. В evidence включай только текст документа.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — всё прямо указано:
        Фрагмент:
        "Покупателем может быть любое физическое лицо, достигшее 18 лет.
        Для оформления заказа необходимо указать ФИО, номер телефона
        и адрес электронной почты. Покупка возможна без регистрации."

        Ответ:
        {
          "buyer_legal_status_status": "defined",
          "buyer_legal_status_details": "Физические лица",
          "buyer_age_restriction_status": "defined",
          "buyer_age_restriction_details": "Не моложе 18 лет",
          "buyer_id_data_status": "defined",
          "buyer_id_data_details": "ФИО, номер телефона, адрес электронной почты",
          "registration_required": "no",
          "registration_required_display": "Нет",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Покупателем может быть любое физическое лицо, достигшее 18 лет. Для оформления заказа необходимо указать ФИО, номер телефона и адрес электронной почты. Покупка возможна без регистрации."
            }
          ]
        }

        Пример 2 — данные через форму, регистрация обязательна:
        Фрагмент:
        "Для оформления заказа Покупатель обязан зарегистрироваться на сайте.
        Сведения, необходимые для регистрации, указываются в регистрационной форме."

        Ответ:
        {
          "buyer_legal_status_status": "not_defined",
          "buyer_legal_status_details": "Не установлено",
          "buyer_age_restriction_status": "not_defined",
          "buyer_age_restriction_details": "Не установлены",
          "buyer_id_data_status": "defined",
          "buyer_id_data_details": "Определяются в регистрационной форме на сайте",
          "registration_required": "yes",
          "registration_required_display": "Да",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Для оформления заказа Покупатель обязан зарегистрироваться на сайте. Сведения, необходимые для регистрации, указываются в регистрационной форме."
            }
          ]
        }

        Пример 3 — ничего не указано:
        Фрагмент:
        "Настоящая оферта регулирует условия продажи товаров интернет-магазина."

        Ответ:
        {
          "buyer_legal_status_status": "not_defined",
          "buyer_legal_status_details": "Не установлено",
          "buyer_age_restriction_status": "not_defined",
          "buyer_age_restriction_details": "Не установлены",
          "buyer_id_data_status": "not_defined",
          "buyer_id_data_details": "Не установлены",
          "registration_required": "not_defined",
          "registration_required_display": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на статус покупателя (физлицо, юрлицо, ИП)?
        2. Есть ли прямое возрастное ограничение?
        3. Перечислены ли данные покупателя или назван источник, где они указываются?
        4. Прямо ли сказано о необходимости или отсутствии необходимости регистрации?
        5. Не подставляю ли я "физлица" по умолчанию без текстового основания?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "buyer_legal_status_status": "<defined|not_defined>",
          "buyer_legal_status_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "buyer_age_restriction_status": "<defined|not_defined>",
          "buyer_age_restriction_details": "<текст | 'Не установлены' | 'Не удалось определить'>",
          "buyer_id_data_status": "<defined|not_defined>",
          "buyer_id_data_details": "<текст | 'Не установлены' | 'Не удалось определить'>",
          "registration_required": "<yes|no|not_defined>",
          "registration_required_display": "<'Да'|'Нет'|'Не установлено'|'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "требования к покупателю правовой статус физическое лицо юридическое лицо ИП возраст 18 лет совершеннолетие сведения о покупателе данные для заказа регистрация личный кабинет"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - procedures
      negative_keywords:
        - "реквизиты продавца"
        - "ИНН продавца"
        - "ОГРН продавца"
        - "доставка"
        - "цена"
        - "возврат"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
      preferred_clause_functions:
        - "definitions"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения о требованиях
        к покупателю: правовой статус, возрастные ограничения, данные покупателя,
        обязательность регистрации.
        Не анализируй реквизиты продавца, предмет товара, цену, доставку или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона и не делай предположений о типе покупателя
        на основе вида договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. buyer_legal_status_status:
           - "defined" — если текст прямо указывает, кто может быть покупателем
             (физическое лицо, юридическое лицо, ИП или их комбинация);
           - "not_defined" — если правовой статус покупателя в тексте не определён.
           Важно: не подставляй "физические лица" по умолчанию, если прямого
           указания нет. Отсутствие ограничений не равно наличию определения.

        2. buyer_legal_status_details:
           Краткое описание допустимого правового статуса покупателя.
           Правила:
           - пиши кратко, например: "Физические лица", "Физические лица и ИП",
             "Юридические лица, ИП и физические лица";
           - если не указано — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. buyer_age_restriction_status:
           - "defined" — если в тексте прямо указан минимальный возраст
             или требование совершеннолетия для заключения договора;
           - "not_defined" — если возрастные ограничения не указаны.

        4. buyer_age_restriction_details:
           Краткое описание возрастного ограничения.
           Правила:
           - пиши кратко, например: "Не моложе 18 лет", "Совершеннолетние";
           - если не указано — "Не установлены";
           - если данные противоречивы — "Не удалось определить".

        5. buyer_id_data_status:
           - "defined" — если текст прямо перечисляет данные покупателя
             или прямо указывает, что они определяются в форме заказа,
             регистрационной форме, личном кабинете или ином названном источнике;
           - "not_defined" — если требуемые данные не определены.

        6. buyer_id_data_details:
           Краткое описание требуемых данных покупателя.
           Правила:
           - если данные перечислены, перечисли кратко через запятую,
             например: "ФИО, номер телефона, адрес электронной почты";
           - если данные определяются через форму / интерфейс, укажи кратко,
             например: "Определяются в форме заказа",
             "Указываются при регистрации в личном кабинете";
           - не копируй длинные абзацы;
           - если не указано — "Не установлены";
           - если данные противоречивы — "Не удалось определить".

        7. registration_required:
           - "yes" — если регистрация / аккаунт / личный кабинет прямо обязательны
             для покупки или оформления заказа;
           - "no" — если текст прямо допускает покупку без регистрации;
           - "not_defined" — если вопрос не урегулирован или надёжный вывод
             сделать нельзя.

        8. registration_required_display:
           - "Да" если registration_required = "yes";
           - "Нет" если registration_required = "no";
           - "Не установлено" если registration_required = "not_defined"
             из-за отсутствия регулирования;
           - "Не удалось определить" если registration_required = "not_defined"
             из-за противоречивого или неясного текста.
        </task>

        <context_rules>
        - Используй только сведения, прямо содержащиеся в тексте контекста.
        - Не используй нормы закона, типовую логику розницы или собственные предположения.
        - Не смешивай требования к покупателю с реквизитами продавца, ценой,
          доставкой или иными нерелевантными темами.
        - Если документ прямо отсылает к форме заказа, регистрационной форме,
          личному кабинету или иному названному интерфейсу как источнику данных —
          это валидный исход для buyer_id_data_details, не not_defined.
        - Если в разных фрагментах указаны разные требования и конфликт нельзя
          разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки, прочерки, null или None.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для registration_required используй только: "yes", "no" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            buyer_legal_status_details → "Не установлено"
            buyer_age_restriction_details → "Не установлены"
            buyer_id_data_details → "Не установлены"
            registration_required_display → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "buyer_legal_status_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания правового статуса покупателя. Внутреннее enum-поле."
          required: true
        - name: "buyer_legal_status_details"
          type: "string"
          presentation: "fact"
          label: "Правовой статус покупателя"
          display_in_grid: true
          display_priority: 1
          description: >
            Кто может выступать покупателем по договору.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "buyer_age_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания возрастных ограничений. Внутреннее enum-поле."
          required: true
        - name: "buyer_age_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Возрастные ограничения"
          display_in_grid: true
          display_priority: 2
          description: >
            Минимальный возраст для заключения договора.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
        - name: "buyer_id_data_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания данных покупателя. Внутреннее enum-поле."
          required: true
        - name: "buyer_id_data_details"
          type: "string"
          presentation: "fact"
          label: "Требуемые данные покупателя"
          display_in_grid: true
          display_priority: 3
          description: >
            Перечень данных, необходимых для оформления заказа,
            или указание на источник их определения.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
        - name: "registration_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Обязательность регистрации. Внутреннее enum-поле."
          required: true
        - name: "registration_required_display"
          type: "string"
          presentation: "fact"
          label: "Требуется регистрация"
          display_in_grid: true
          display_priority: 4
          description: >
            Требуется ли регистрация / личный кабинет для оформления заказа.
            Допустимые значения: "Да", "Нет", "Не установлено", "Не удалось определить".
          required: false
      store_payload: true

  - id: offer_subject_cluster
    name: "Предмет оферты и описание товара"
    description: >
      Фактографическая проверка наличия в оферте конкретного наименования товара
      и его описания.
      Предназначена для табличного вывода по нескольким офертам
      без оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование товара"
        - "описание товара"
        - "предмет договора"
        - "предмет оферты"
        - "товар"
        - "комплектация"
        - "артикул"
        - "характеристики"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+(договора|оферты)"
        - "(?i)наименовани(е|я)\\s+товар"
        - "(?i)артикул|арт\\."
        - "(?i)комплектац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: предмет оферты и описание товара.

        Нормативный ориентир:
        - ст. 432, 455 ГК РФ
        - ст. 495 ГК РФ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Есть ли конкретное наименование товара.
        2. Есть ли описание товара: артикул, комплектация, характеристики,
           или прямая отсылка к источнику, где товар определяется.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Не считай слова "товар", "продукция", "ассортимент", "изделие"
           достаточным определением предмета без конкретного наименования,
           артикула или характеристик.
        3. Если конкретный товар в тексте не назван, но договор прямо отсылает
           к каталогу, карточке товара, заявке, корзине заказа или иному прямо
           названному источнику — это допустимый исход, не отсутствие регулирования.
           subject_status = "defined", в subject_details — краткая формулировка.
        4. Если условие не указано и нет прямой отсылки — возвращай "not_defined".
        5. Если данные противоречивы — возвращай "not_defined"
           и "Не удалось определить".
        6. В evidence включай только текст документа.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — товар прямо назван:
        Фрагмент:
        "Предмет договора: смартфон Samsung Galaxy A55, арт. SM-A556,
        комплектация: телефон, кабель USB-C, документация."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "Смартфон Samsung Galaxy A55, арт. SM-A556; комплектация: телефон, кабель USB-C, документация",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет договора: смартфон Samsung Galaxy A55, арт. SM-A556, комплектация: телефон, кабель USB-C, документация."
            }
          ]
        }

        Пример 2 — товар определяется через карточку / каталог:
        Фрагмент:
        "Продавец обязуется передать Покупателю товар в соответствии с описанием,
        указанным в карточке товара на сайте продавца."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "Определяется по карточке товара на сайте продавца",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец обязуется передать Покупателю товар в соответствии с описанием, указанным в карточке товара на сайте продавца."
            }
          ]
        }

        Пример 3 — общая фраза без конкретики:
        Фрагмент:
        "Настоящая оферта регулирует условия продажи товаров интернет-магазина."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Не установлено",
          "evidence": []
        }

        Пример 4 — ссылка на заявку покупателя:
        Фрагмент:
