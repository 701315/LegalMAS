    retrieval:
      retrieval_profile: "completion_deadline_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доставка срок доставки способ доставки курьер самовывоз пункт выдачи стоимость доставки бесплатная доставка расходы на возврат обратная пересылка"
      preferred_unit_types:
        - obligation
