        - "(?i)момент.*заключения"
        - "(?i)отмен(а|ить)\\s+заказ"
        - "(?i)отказ(аться)?\\s+от\\s+заказ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: момент заключения договора и порядок
        отмены заказа до передачи товара.

        Нормативный ориентир:
        - ст. 493, 494, 497 ГК РФ
        - ст. 26.1 Закона РФ «О защите прав потребителей»

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Момент заключения договора.
        2. Порядок отмены заказа до передачи товара.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Моментом заключения договора могут являться, если это прямо указано:
           - нажатие кнопки "Оформить заказ" или аналогичной;
           - оплата товара;
           - подтверждение заказа продавцом (email, SMS, звонок);
           - выдача кассового чека или иного платёжного документа;
           - совершение конклюдентных действий (начало исполнения заказа).
        3. Общая фраза "заказ оформляется на сайте" без указания момента
           заключения не является основанием для "defined".
        4. Не путай момент заключения договора с моментом оплаты или доставки,
           если текст прямо не связывает их с заключением договора.
        5. Отмена заказа до передачи товара может:
           - допускаться свободно до момента X;
           - требовать уведомления в определённой форме / канале;
           - определяться по названному внешнему документу (правила отмены,
             регламент, личный кабинет);
           - прямо не допускаться.
        6. Не путай отмену заказа до передачи товара с возвратом товара
           после его получения покупателем.
        7. Если порядок отмены определяется по названному внешнему документу
           (правилам отмены, регламенту, инструкции, личному кабинету) —
           это не отсутствие регулирования; отрази это в user-facing поле.
        8. Если условие не указано прямо — возвращай "not_defined".
        9. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        10. В evidence включай только текст документа.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — момент заключения и отмена прямо указаны:
        Фрагмент:
        "Договор считается заключённым с момента подтверждения заказа продавцом.
        Покупатель вправе отменить заказ до момента его передачи в службу доставки."

        Ответ:
        {
          "contract_formation_status": "defined",
          "contract_formation_details": "С момента подтверждения заказа продавцом",
          "cancellation_status": "defined",
          "cancellation_details": "До момента передачи заказа в службу доставки",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Договор считается заключённым с момента подтверждения заказа продавцом. Покупатель вправе отменить заказ до момента его передачи в службу доставки."
            }
          ]
        }

        Пример 2 — момент заключения через оплату, отмена через личный кабинет:
        Фрагмент:
        "Акцептом оферты является оплата товара. Для отмены заказа
        Покупатель направляет уведомление через личный кабинет на сайте
        до момента передачи товара в службу доставки."

        Ответ:
        {
          "contract_formation_status": "defined",
          "contract_formation_details": "Акцепт оферты — оплата товара",
          "cancellation_status": "defined",
          "cancellation_details": "Уведомление через личный кабинет до передачи товара в службу доставки",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Акцептом оферты является оплата товара. Для отмены заказа Покупатель направляет уведомление через личный кабинет на сайте до момента передачи товара в службу доставки."
            }
          ]
        }

        Пример 3 — момент заключения через кнопку, отмена по правилам:
        Фрагмент:
        "Договор заключается в момент нажатия кнопки «Оформить заказ».
        Порядок отмены заказа определяется Правилами отмены заказов,
        размещёнными на сайте Продавца."

        Ответ:
        {
          "contract_formation_status": "defined",
          "contract_formation_details": "В момент нажатия кнопки «Оформить заказ»",
          "cancellation_status": "defined",
          "cancellation_details": "Согласно Правилам отмены заказов, размещённым на сайте Продавца",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Договор заключается в момент нажатия кнопки «Оформить заказ». Порядок отмены заказа определяется Правилами отмены заказов, размещёнными на сайте Продавца."
            }
          ]
        }

        Пример 4 — отмена прямо не допускается:
        Фрагмент:
        "Договор считается заключённым с момента выдачи кассового чека.
        Отмена оформленного заказа не допускается."

        Ответ:
        {
          "contract_formation_status": "defined",
          "contract_formation_details": "С момента выдачи кассового чека",
          "cancellation_status": "defined",
          "cancellation_details": "Отмена оформленного заказа не допускается",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Договор считается заключённым с момента выдачи кассового чека. Отмена оформленного заказа не допускается."
            }
          ]
        }

        Пример 5 — общие фразы без конкретики:
        Фрагмент:
        "Заказ оформляется на сайте. Покупатель вправе отказаться от заказа
        в соответствии с законодательством РФ."

        Ответ:
        {
          "contract_formation_status": "not_defined",
          "contract_formation_details": "Не установлен",
          "cancellation_status": "not_defined",
          "cancellation_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание момента заключения договора?
        2. Не путаю ли я момент заключения с моментом оплаты или доставки?
        3. Есть ли прямой порядок отмены заказа до передачи товара?
        4. Не путаю ли я отмену заказа с возвратом товара после получения?
        5. Если порядок отмены определяется по названному внешнему документу —
           отрази это как user-facing значение.
        6. Если вопрос не урегулирован или есть только общая ссылка на закон —
           верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "contract_formation_status": "<defined|not_defined>",
          "contract_formation_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "cancellation_status": "<defined|not_defined>",
          "cancellation_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "момент заключения договора акцепт оферты оформление заказа подтверждение заказа выдача чека конклюдентные действия отмена заказа отказ от заказа до передачи товара"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "доставка"
        - "стоимость доставки"
        - "срок доставки"
        - "обратная пересылка"
        - "возврат товара"
        - "оплата"
        - "ОГРН"
        - "ИНН"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения
        о моменте заключения договора и порядке отмены заказа до передачи товара.
        Не анализируй доставку, возврат товара после получения, цену,
        оплату или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. contract_formation_status:
           - "defined" — если в тексте прямо указан момент заключения договора,
             например: нажатие кнопки "Оформить заказ", оплата товара,
             подтверждение заказа продавцом (email / SMS / звонок),
             выдача кассового чека, совершение конклюдентных действий
             (начало исполнения заказа);
           - "not_defined" — если момент заключения прямо не указан
             или надёжно определить нельзя.
           Важно: общая фраза "заказ оформляется на сайте" без указания
           момента заключения не является основанием для "defined".
           Не путай момент заключения с моментом оплаты или доставки,
           если текст прямо не связывает их с заключением договора.

        2. contract_formation_details:
           Краткое user-facing описание момента заключения договора
           на русском языке.
           Правила:
           - если момент прямо указан, верни краткое summary (1 короткая фраза),
             например:
             "С момента подтверждения заказа продавцом",
             "Акцепт оферты — оплата товара",
             "В момент нажатия кнопки «Оформить заказ»",
             "С момента выдачи кассового чека";
           - не копируй длинные абзацы;
           - если момент не установлен — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        3. cancellation_status:
           - "defined" — если в тексте прямо указан порядок отмены заказа
             до передачи товара (условия, срок, форма, канал уведомления),
             либо прямо сказано, что отмена не допускается, либо прямо сказано,
             что порядок определяется по названному внешнему документу
             (правилам отмены, регламенту, личному кабинету и т.п.);
           - "not_defined" — если порядок отмены прямо не указан
             или его нельзя надёжно определить.
           Важно: общая ссылка на законодательство без конкретизации порядка
           отмены не является основанием для "defined".
           Не путай отмену заказа до передачи товара с возвратом товара
           после его получения покупателем.

        4. cancellation_details:
           Краткое user-facing описание порядка отмены заказа
           на русском языке.
           Правила:
           - если порядок прямо описан, верни краткое summary (1–2 коротких фразы),
             например:
             "До момента передачи заказа в службу доставки",
             "Уведомление через личный кабинет до передачи товара в доставку",
             "Отмена оформленного заказа не допускается";
           - если порядок определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Правилам отмены заказов, размещённым на сайте Продавца",
             "Согласно Регламенту отмены заказов";
           - не копируй длинные абзацы;
           - если порядок не установлен — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай момент заключения и порядок отмены заказа с доставкой,
          возвратом товара после получения, ценой, оплатой и иными
          нерелевантными темами.
        - Момент заключения договора и момент оплаты — не одно и то же,
          если текст прямо не связывает оплату с заключением договора.
        - Отмена заказа до передачи товара и возврат товара после получения —
          это разные правовые механизмы. Не смешивай их.
        - Если порядок отмены прямо определяется по названному внешнему документу
          (правилам отмены, регламенту, инструкции, личному кабинету),
          считай его определённым и отрази это в user-facing поле.
        - Общие фразы вроде "в соответствии с законодательством РФ",
          "в порядке, предусмотренном законом" без конкретизации порядка —
          это not_defined, а не defined.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            contract_formation_details → "Не установлен"
            cancellation_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "contract_formation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента заключения договора. Внутреннее enum-поле."
          required: true
        - name: "contract_formation_details"
          type: "string"
          presentation: "fact"
          label: "Момент заключения договора"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание момента заключения договора.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
        - name: "cancellation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка отмены заказа. Внутреннее enum-поле."
          required: true
        - name: "cancellation_details"
          type: "string"
          presentation: "fact"
          label: "Отмена заказа"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание порядка отмены заказа до передачи товара,
            или указание на named external source, или "Не допускается".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
      store_payload: true

  - id: delivery_terms_cluster
    name: "Сроки, стоимость и способ доставки"
    description: >
      Фактографическая проверка наличия условий о сроке доставки,
      стоимости доставки, способе передачи товара и удержании расходов
      на обратную доставку при возврате.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доставка"
        - "срок доставки"
        - "способ доставки"
        - "курьер"
        - "самовывоз"
        - "пункт выдачи"
        - "стоимость доставки"
        - "бесплатная доставка"
        - "расходы на доставку"
        - "обратная пересылка"
        - "расходы на возврат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк(а|и|у).*?(в\\s+течение|не\\s+позднее|\\d+\\s+дн)"
        - "(?i)срок\\s+доставк"
        - "(?i)стоимость\\s+доставк|бесплатн[а-я]+\\s+доставк"
        - "(?i)курьер|самовывоз|пункт\\s+выдач"
        - "(?i)расходы.*?(доставк|пересылк|возврат)"
        - "(?i)за\\s+исключением\\s+расходов"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: условия доставки товара.

        Нормативный ориентир:
        - ст. 499 ГК РФ
        - ст. 23.1, 26.1 Закона РФ «О защите прав потребителей»

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Срок доставки.
        2. Стоимость доставки.
        3. Способ передачи товара.
        4. Условие об удержании расходов на обратную доставку при возврате.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Если срок доставки определяется по тарифам или условиям перевозчика /
           службы доставки, и это прямо указано в тексте — это не отсутствие
           регулирования; отрази это кратко в user-facing поле.
        3. Если стоимость доставки зависит от суммы заказа, региона или
           рассчитывается по тарифам, и это прямо указано — это тоже
           допустимый исход, не отсутствие регулирования.
        4. Бесплатная доставка — это тоже определённая стоимость доставки
           (delivery_cost_status = "defined").
        5. Для способа передачи товара:
           - если в тексте есть и курьер, и самовывоз — это "combined";
           - если только курьер / продавец доставляет — "delivery";
           - если только самовывоз / пункт выдачи — "pickup";
           - если только внешний перевозчик / транспортная компания — "carrier";
           - если прямо не указано — "not_defined".
        6. Расходы на обратную доставку при возврате — это отдельное условие.
           Не путай его с условиями доставки товара покупателю.
        7. Если условие не указано прямо — возвращай "not_defined".
        8. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        9. В evidence включай только текст документа.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — курьер, конкретный срок и стоимость:
        Фрагмент:
        "Доставка осуществляется курьером в течение 3 рабочих дней.
        Стоимость доставки — 350 рублей."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "В течение 3 рабочих дней",
          "delivery_cost_status": "defined",
          "delivery_cost_details": "350 рублей",
          "delivery_mode": "delivery",
          "delivery_mode_display": "Курьер",
          "return_delivery_cost_retention_status": "not_defined",
          "return_delivery_cost_retention_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Доставка осуществляется курьером в течение 3 рабочих дней. Стоимость доставки — 350 рублей."
            }
          ]
        }

        Пример 2 — бесплатная доставка от суммы, расходы на возврат за счёт покупателя:
        Фрагмент:
        "Доставка курьером осуществляется в течение 1–5 рабочих дней.
        При сумме заказа от 3 000 рублей доставка бесплатна,
