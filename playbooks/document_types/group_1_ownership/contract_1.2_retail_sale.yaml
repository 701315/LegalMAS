        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дистанционный способ продажи интернет-магазин право на отказ 7 дней с момента получения отказаться до передачи товара 3 месяца ненадлежащее информирование возврат денег 10 дней момент передачи товара информация до заключения договора онлайн-заказ"
      preferred_unit_types:
