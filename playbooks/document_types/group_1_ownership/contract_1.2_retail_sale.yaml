  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Покупатель — правовой статус, требования и идентификация
  # ──────────────────────────────────────────────────────────────────────────
  - id: buyer_identification_requirements_cluster
    name: "Идентификация и требования к Покупателю"
    description: >
      Фактографическая проверка требований к правовому статусу покупателя 
      (физические лица, ИП, юридические лица), возрастных ограничений, 
      а также перечня данных, которые покупатель обязан предоставить для 
      заключения и исполнения договора.
    triggers: {}
    severity: "high"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "покупатель"
        - "клиент"
        - "пользователь"
        - "потребитель"
        - "физическое лицо"
        - "юридическое лицо"
        - "индивидуальный предприниматель"
        - "возраст"
        - "18 лет"
        - "совершеннолетний"
        - "дееспособность"
        - "резидент"
        - "предоставляет сведения"
        - "регистрация"
        - "личный кабинет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)покупател[еи]м?\\s+может\\s+быть"
        - "(?i)заключать\\s+договор.*?(?:18|восемнадцати)\\s+лет"
        - "(?i)правовой\\s+статус"
        - "(?i)сведения.*?о\\s+покупателе"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: требования к Покупателю и порядок его идентификации.

        Нормативный ориентир:
        - ст. 492 ГК РФ (розничная купля-продажа)
        - ст. 21, 26, 28 ГК РФ (дееспособность)
        - ст. 152-ФЗ (в части идентификации)

        Важно:
        - Твоя задача — не оценивать риск, а зафиксировать условия оферты.
        - Если в тексте прямо не указано ограничение по статусу — значит, договор доступен всем (not_restricted).
        - Если возраст не указан — возвращай "not_defined".

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Допустимый правовой статус Покупателя (только физлица, юрлица, ИП или без ограничений).
        2. Наличие возрастных ограничений (например, строго 18+).
        3. Какие данные Покупатель обязан предоставить при акцепте/регистрации (ФИО, телефон, адрес, паспортные данные).
        4. Требуется ли обязательная регистрация / создание личного кабинета.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если статус Покупателя не ограничен специально — пиши "физические лица, ИП и юридические лица".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупателем может быть любое физическое лицо, достигшее 18 лет. Для оформления заказа необходимо указать ФИО, номер телефона и адрес электронной почты."

        Ответ:
        {
          "buyer_legal_status_status": "defined",
          "buyer_legal_status_details": "физические лица",
          "buyer_age_restriction_status": "defined",
          "buyer_age_restriction_details": "достигшее 18 лет",
          "buyer_id_data_status": "defined",
          "buyer_id_data_details": "ФИО, номер телефона, адрес электронной почты",
          "registration_required": "no",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Покупателем может быть любое физическое лицо, достигшее 18 лет. Для оформления заказа необходимо указать ФИО, номер телефона и адрес электронной почты."
            }
          ]
        }

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "buyer_legal_status_status": "<defined / not_defined>",
          "buyer_legal_status_details": "<текст или 'Данные не определены'>",
          "buyer_age_restriction_status": "<defined / not_defined>",
          "buyer_age_restriction_details": "<текст или 'Данные не определены'>",
          "buyer_id_data_status": "<defined / not_defined>",
          "buyer_id_data_details": "<текст или 'Данные не определены'>",
          "registration_required": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "требования к покупателю правовой статус физическое лицо юридическое лицо ИП возраст 18 лет совершеннолетие сведения о покупателе данные для заказа регистрация личный кабинет"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - procedures
      negative_keywords:
        - "реквизиты продавца"
        - "ИНН продавца"
        - "ОГРН продавца"
        - "доставка"
        - "цена"
        - "возврат"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
      preferred_clause_functions:
        - "definitions"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты сведения о правовом статусе Покупателя, возрастных ограничениях и данных, которые он должен предоставить.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни следующие поля:
        1. buyer_legal_status_status — "defined" или "not_defined".
        2. buyer_legal_status_details — кто может быть покупателем (физлица, юрлица, все и т.д.).
        3. buyer_age_restriction_status — "defined" или "not_defined".
        4. buyer_age_restriction_details — возрастные ограничения (например, "18+").
        5. buyer_id_data_status — "defined" или "not_defined".
        6. buyer_id_data_details — список данных, запрашиваемых у покупателя (ФИО, телефон и т.д.).
        7. registration_required — "yes" если нужна регистрация/аккаунт, "no" если покупка возможна без регистрации, "not_defined" если не указано.
        </task>

        <rules>
        - Используй только текст документа.
        - Пиши кратко.
        - Если в тексте нет прямого указания на статус, но подразумевается розница — пиши "физические лица".
        - Верни JSON.
        </rules>
      fields:
        - name: "buyer_legal_status_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания правового статуса покупателя."
          required: true
        - name: "buyer_legal_status_details"
          type: "string"
          presentation: "fact"
          label: "Правовой статус покупателя"
          display_in_grid: true
          display_priority: 1
          description: "Кто может выступать покупателем по договору."
          required: false
        - name: "buyer_age_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания возрастных ограничений."
          required: false
        - name: "buyer_age_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Возрастные ограничения"
          display_in_grid: true
          display_priority: 2
          description: "Минимальный возраст для заключения договора."
          required: false
        - name: "buyer_id_data_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания данных покупателя."
          required: true
        - name: "buyer_id_data_details"
          type: "string"
          presentation: "fact"
          label: "Требуемые данные покупателя"
          display_in_grid: true
          display_priority: 3
          description: "Перечень данных, необходимых для оформления заказа."
          required: false
        - name: "registration_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязательность регистрации на сайте."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Предмет договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: offer_subject_cluster
    name: "Предмет оферты и описание товара"
    description: >
      Фактографическая проверка наличия в оферте конкретного наименования товара
      и его описания.
      Предназначена для табличного вывода по нескольким офертам
      без оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование товара"
        - "описание товара"
        - "предмет договора"
        - "предмет оферты"
        - "товар"
        - "комплектация"
        - "артикул"
        - "характеристики"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+(договора|оферты)"
        - "(?i)наименовани(е|я)\\s+товар"
        - "(?i)артикул|арт\\."
        - "(?i)комплектац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: предмет оферты и описание товара.

        Нормативный ориентир:
        - ст. 432, 455 ГК РФ
        - ст. 495 ГК РФ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Есть ли конкретное наименование товара.
        2. Есть ли описание товара, включая артикул, комплектацию или иные характеристики, если они прямо указаны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
