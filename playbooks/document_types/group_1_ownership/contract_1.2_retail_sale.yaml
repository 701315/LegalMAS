        - "limitations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — найти в тексте оферты конкретные формулировки, которые ущемляют права потребителя.
        Не оценивай степень нарушения. Твоя цель — только зафиксировать факт наличия запрещённых фраз.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. illegal_restrictions_found — "yes", если найдена хотя бы одна прямая запрещённая формулировка, иначе "no".
        2. restriction_return_found — "yes" при прямом запрете на возврат/обмен товара надлежащего качества, иначе "no".
        3. restriction_repair_only_found — "yes", если право выбора покупателя ограничено только ремонтом, иначе "no".
        4. restriction_expertise_found — "yes", если экспертиза прямо возлагается на покупателя как обязательное условие, иначе "no".
        5. restriction_jurisdiction_found — "yes", если навязана подсудность только по месту продавца, иначе "no".
        6. restriction_arbitration_found — "yes", если навязан обязательный третейский суд или арбитраж, иначе "no".
        7. restriction_tying_found — "yes", если покупка товара прямо обусловлена покупкой иных товаров, услуг или страховки, иначе "no".
        8. found_phrases — одна строка:
           - если нарушения найдены, перечисли точные цитаты через "; "
           - если нарушения не найдены, верни пустую строку ""

        Если нарушений нет — все yes/no поля должны быть "no", а found_phrases должно быть пустой строкой "".
        </task>

        <rules>
        - Используй только текст документа.
        - Фиксируй только прямые формулировки. Не интерпретируй общие фразы как нарушения.
        - Если указано "в соответствии с законом" — это НЕ нарушение.
        - Не возвращай массив для found_phrases: это должно быть только строковое поле.
        - Ответ верни только в JSON.
        </rules>
      fields:
        - name: "illegal_restrictions_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Общий признак наличия ущемляющих условий."
          required: true

        - name: "restriction_return_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Запрет возврата надлежащего качества."
          required: true
        - name: "restriction_repair_only_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Ограничение выбора только ремонтом."
          required: false
        - name: "restriction_expertise_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Экспертиза за счёт покупателя."
          required: false
        - name: "restriction_jurisdiction_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Навязанная подсудность."
          required: false
        - name: "restriction_arbitration_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Обязательный третейский суд."
          required: false
        - name: "restriction_tying_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Навязанные доп. услуги/товары."
          required: false
        - name: "found_phrases"
          type: "string"
          presentation: "fact"
          label: "Найденные нарушения"
          display_in_grid: true
          display_priority: 1
          description: "Найденные запрещённые формулировки, перечисленные через '; '. Пустая строка если нарушений нет."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Гарантия и права при недостатках
  # ──────────────────────────────────────────────────────────────────────────
  - id: warranty_and_defects_rights_check
    name: "Гарантийный срок и права потребителя при недостатках товара"
    description: >
      Фактографическая проверка наличия гарантийного срока, полноты перечня прав
      потребителя при недостатках (ремонт, замена, возврат, уменьшение цены)
      и отсутствия незаконных ограничений гарантийного срока.
    triggers: {}
    severity: "high"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "недостаток товара"
        - "безвозмездное устранение"
        - "замена товара"
        - "возврат уплаченной суммы"
        - "соразмерное уменьшение"
        - "ремонт"
        - "гарантийное обслуживание"
        - "гарантийный талон"
        - "сервисный центр"
        - "срок службы"
        - "в течение 2 лет"
        - "расширенная гарантия"
        - "дополнительная гарантия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)при\\s+обнаружении\\s+недостатк"
        - "(?i)потребитель\\s+вправе\\s+(потребовать|требовать)"
        - "(?i)гарантия.*?(\\d+\\s*(мес|год|лет|дн))"
        - "(?i)расширенн(ая|ой)\\s+гарант"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: гарантийный срок и права потребителя при недостатках товара.

        Нормативный ориентир:
        - ст. 18-24 Закона РФ «О защите прав потребителей»
        - ст. 19 ЗоЗПП (двухлетний срок требований)
        - ст. 470-477 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Гарантийный срок (числовое значение).
        2. Перечень прав потребителя при обнаружении недостатков.
        3. Наличие расширенной (дополнительной) гарантии.
        4. Условие о 2-летнем сроке предъявления требований.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Гарантийный срок составляет 12 месяцев с даты передачи товара. При обнаружении
        недостатков покупатель вправе потребовать ремонта, замены товара или возврата
        уплаченной суммы по своему выбору."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "12 месяцев с даты передачи товара",
          "remedies_listed_status": "defined",
          "remedies_details": "ремонт, замена товара, возврат уплаченной суммы по выбору",
          "extended_warranty_status": "not_defined",
          "two_year_term_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийный срок составляет 12 месяцев с даты передачи товара. При обнаружении недостатков покупатель вправе потребовать ремонта, замены товара или возврата уплаченной суммы по своему выбору."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Гарантия предоставляется в соответствии с законодательством."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Данные не определены",
          "remedies_listed_status": "not_defined",
          "remedies_details": "Данные не определены",
          "extended_warranty_status": "not_defined",
          "two_year_term_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли конкретный срок гарантии (месяцы, годы)?
        2. Перечислены ли конкретные права при недостатках (не просто "в соответствии с законом")?
        3. Упомянута ли расширенная/дополнительная гарантия?
        4. Упомянут ли 2-летний срок предъявления требований?
        5. "В соответствии с законодательством" — это NOT defined.
        6. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<срок гарантии или 'Данные не определены'>",
          "remedies_listed_status": "<defined / not_defined>",
          "remedies_details": "<перечень прав или 'Данные не определены'>",
          "extended_warranty_status": "<defined / not_defined>",
          "two_year_term_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок гарантия недостаток товара безвозмездное устранение замена товара возврат уплаченной суммы соразмерное уменьшение ремонт гарантийное обслуживание гарантийный талон сервисный центр срок службы расширенная гарантия дополнительная гарантия в течение 2 лет"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
        - obligations
      negative_keywords:
        - "возврат товара надлежащего качества"
        - "обмен товара надлежащего качества"
        - "14 дней"
        - "7 дней"
        - "товарный вид"
        - "потребительские свойства"
        - "Перечень 2463"
        - "невозвратные товары"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
        - "доставка"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты сведения о гарантийном сроке и правах покупателя при обнаружении недостатков товара.
        Не анализируй возврат товара надлежащего качества. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. warranty_status — "defined", если срок гарантии прямо указан, иначе "not_defined".
        2. warranty_details — конкретный срок гарантии.
        3. remedies_listed_status — "defined", если прямо перечислены права потребителя при недостатках товара, иначе "not_defined".
        4. remedies_details — перечень прямо указанных прав потребителя при недостатках.
        5. extended_warranty_status — "defined", если прямо упомянута дополнительная или расширенная гарантия, иначе "not_defined".
        6. two_year_term_status — "defined", если прямо упомянут 2-летний срок предъявления требований, иначе "not_defined".

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Важно:
        - Для extended_warranty_status и two_year_term_status возвращай только статус.
        - Не пытайся извлекать дополнительные details для этих полей.
        </task>

        <rules>
        - Используй только текст документа.
        - Не подставляй нормы закона.
        - Ссылки на "законодательство РФ" без конкретики — это "not_defined".
        - Не делай предположений.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания гарантийного срока."
          required: true
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          display_in_grid: true
          display_priority: 1
          description: "Срок гарантии на товар."
          required: false
        - name: "remedies_listed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечисления прав при браке."
          required: true
        - name: "remedies_details"
          type: "string"
          presentation: "fact"
          label: "Права при недостатках"
          display_in_grid: true
          display_priority: 2
          description: "Перечень прав покупателя при обнаружении брака."
          required: false
        - name: "extended_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие расширенной гарантии."
          required: false
        - name: "two_year_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Упоминание 2-летнего срока по ЗоЗПП."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Персональные данные (ФЗ-152)
  # ──────────────────────────────────────────────────────────────────────────
  - id: personal_data_processing_check
    name: "Обработка персональных данных покупателя"
    description: >
      Фактографическая проверка наличия механизма согласия на обработку ПД,
      целей обработки, перечня данных и порядка отзыва согласия.
    triggers:
      any: ["distance_selling", "subscription_model", "marketplace_platform"]
    severity: "high"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "персональные данные"
        - "согласие на обработку"
        - "обработка данных"
        - "политика конфиденциальности"
        - "ФЗ-152"
        - "оператор персональных данных"
        - "cookie"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ые|ых)\\s+данн(ые|ых)"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"
        - "(?i)ФЗ[\\s\\-]*152"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: обработка персональных данных покупателя.

        Нормативный ориентир:
        - ФЗ от 27.07.2006 № 152-ФЗ «О персональных данных», ст. 6, 9

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Механизм получения согласия на обработку ПД (галочка, кнопка, отдельная форма).
        2. Цели обработки персональных данных.
        3. Порядок отзыва согласия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Нажимая кнопку «Оформить заказ», покупатель даёт согласие на обработку
        персональных данных в целях исполнения договора и направления уведомлений.
        Отзыв согласия направляется на адрес privacy@shop.ru."

        Ответ:
        {
          "consent_status": "defined",
          "consent_details": "нажатие кнопки «Оформить заказ»",
          "purposes_status": "defined",
          "purposes_details": "исполнение договора и направление уведомлений",
          "withdrawal_status": "defined",
          "withdrawal_details": "направление на адрес privacy@shop.ru",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Нажимая кнопку «Оформить заказ», покупатель даёт согласие на обработку персональных данных в целях исполнения договора и направления уведомлений."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Обработка персональных данных осуществляется в соответствии с ФЗ-152."

        Ответ:
        {
          "consent_status": "not_defined",
          "consent_details": "Данные не определены",
          "purposes_status": "not_defined",
          "purposes_details": "Данные не определены",
          "withdrawal_status": "not_defined",
          "withdrawal_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Указан ли конкретный механизм согласия (не просто "согласен с политикой")?
        2. Перечислены ли конкретные цели обработки (не "в соответствии с законом")?
        3. Указан ли порядок отзыва согласия (email, форма, адрес)?
        4. Ссылка только на ФЗ-152 без деталей — это NOT defined.
        5. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "consent_status": "<defined / not_defined>",
