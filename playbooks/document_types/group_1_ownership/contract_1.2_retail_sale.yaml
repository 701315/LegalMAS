#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Реквизиты Продавца и Предмет договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: seller_identification_subject_cluster
    name: "Идентификация продавца и предмет договора"
    description: >
      Фактографическая проверка наличия реквизитов продавца (наименование, ОГРН/ОГРНИП,
      ИНН, адрес, режим работы) и описания предмета договора (наименование товара,
      характеристики, артикул, комплектация). Предназначена для табличного вывода
      по нескольким офертам без оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "наименование"
        - "ОГРН"
        - "ОГРНИП"
        - "ИНН"
        - "адрес продавца"
        - "юридический адрес"
        - "ИП"
        - "индивидуальный предприниматель"
        - "наименование товара"
        - "описание товара"
        - "предмет договора"
        - "предмет оферты"
        - "количество"
        - "комплектация"
        - "артикул"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bОГРН\\s*:?\\s*\\d{13,15}\\b"
        - "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
        - "(?i)(ООО|АО|ПАО|ИП)\\s+[«\"'].+?[»\"']"
        - "(?i)предмет\\s+(договора|оферты)"
        - "(?i)наименовани(е|я)\\s+товар"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта по § 2 Главы 30 ГК РФ.
        Проверяется только один вопрос: реквизиты продавца и описание предмета договора.

        Нормативный ориентир:
        - ст. 9 Закона РФ «О защите прав потребителей» (ЗоЗПП)
        - ст. 432, 455, 495 ГК РФ
        - Постановление Правительства РФ № 2463

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким офертам.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Наименование продавца.
        2. ОГРН или ОГРНИП продавца.
        3. ИНН продавца.
        4. Адрес продавца.
        5. Наименование и описание товара (предмет договора).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай, хорошая оферта или плохая.
        4. Если данные не указаны прямо — возвращай "not_defined" или "Данные не определены"
           строго по схеме.
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из документа.
        7. Не цитируй закон в evidence.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001, адрес: г. Москва,
        ул. Ленина, д. 1. Предмет: смартфон Samsung Galaxy A55, арт. SM-A556."

        Ответ:
        {
          "seller_name_status": "defined",
          "seller_name": "ООО «Ромашка»",
          "seller_ogrn_status": "defined",
          "seller_ogrn": "1027700000001",
          "seller_inn_status": "defined",
          "seller_inn": "7700000001",
          "seller_address_status": "defined",
          "seller_address": "г. Москва, ул. Ленина, д. 1",
          "subject_status": "defined",
          "subject_details": "смартфон Samsung Galaxy A55, арт. SM-A556",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001, адрес: г. Москва, ул. Ленина, д. 1. Предмет: смартфон Samsung Galaxy A55, арт. SM-A556."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Настоящая оферта регулирует условия продажи товаров."

        Ответ:
        {
          "seller_name_status": "not_defined",
          "seller_name": "Данные не определены",
          "seller_ogrn_status": "not_defined",
          "seller_ogrn": "Данные не определены",
          "seller_inn_status": "not_defined",
          "seller_inn": "Данные не определены",
          "seller_address_status": "not_defined",
          "seller_address": "Данные не определены",
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямое наименование продавца (не просто слово "продавец")?
        2. Есть ли числовой ОГРН или ОГРНИП (13-15 цифр)?
        3. Есть ли числовой ИНН (10-12 цифр)?
        4. Есть ли адрес продавца — конкретный, а не "юридический адрес: см. реквизиты"?
        5. Есть ли наименование конкретного товара (а не просто "товар" или "продукция")?
        6. Если прямого текста нет — возвращай "not_defined" и "Данные не определены".
        7. Убедись, что evidence содержит только текст документа.
        8. Убедись, что значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_name_status": "<defined / not_defined>",
          "seller_name": "<наименование или 'Данные не определены'>",
          "seller_ogrn_status": "<defined / not_defined>",
          "seller_ogrn": "<ОГРН/ОГРНИП или 'Данные не определены'>",
          "seller_inn_status": "<defined / not_defined>",
          "seller_inn": "<ИНН или 'Данные не определены'>",
          "seller_address_status": "<defined / not_defined>",
          "seller_address": "<адрес или 'Данные не определены'>",
          "subject_status": "<defined / not_defined>",
          "subject_details": "<описание товара или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
