        - "(?i)расходы.*?(доставк|пересылк|возврат)"
        - "(?i)за\\s+исключением\\s+расходов"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта по § 2 Главы 30 ГК РФ.
        Проверяется только один вопрос: момент заключения договора, условия доставки и отмена заказа.

