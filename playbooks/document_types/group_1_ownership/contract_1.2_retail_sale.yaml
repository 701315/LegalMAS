           - если способы прямо перечислены, перечисли через запятую, например:
             "Банковская карта, наличные",
             "Банковская карта, СБП, электронный кошелёк";
           - способами оплаты могут быть: банковская карта, наличные,
             безналичный расчёт, СБП, QR-код, электронный кошелёк,
             оплата через платёжный сервис, подарочный сертификат;
           - если способы определяются через интерфейс / форму, напиши кратко,
             например: "Определяются при оформлении заказа",
             "Указываются в интерфейсе сайта";
           - не копируй длинные абзацы;
           - если не установлены — "Не установлены";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только сведения, прямо содержащиеся в тексте контекста.
        - Не используй нормы закона, типовую логику розницы или собственные предположения.
        - Не смешивай инструменты оплаты (карта, наличные, СБП) с условиями оплаты
          (предоплата, аванс, рассрочка, сроки оплаты). Для этого check важны только
          инструменты.
        - Прямая отсылка к карточке / прайс-листу / каталогу / корзине засчитывается
          как "defined" только если источник прямо назван.
          Общая фраза без указания источника — not_defined.
        - Если в разных фрагментах указаны разные цены или разные способы оплаты
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки, прочерки, null или None.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            price_details → "Не установлена"
            payment_methods_details → "Не установлены"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания цены товара. Внутреннее enum-поле."
          required: true
        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена товара"
          display_in_grid: true
          display_priority: 1
          description: >
            Конкретная цена товара или способ её определения.
            Fallback: "Не установлена" / "Не удалось определить".
          required: true
        - name: "payment_methods_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания способов оплаты. Внутреннее enum-поле."
          required: true
        - name: "payment_methods_details"
          type: "string"
          presentation: "fact"
          label: "Способы оплаты"
          display_in_grid: true
          display_priority: 2
          description: >
            Перечень способов оплаты или указание на источник их определения.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

      store_payload: true

  - id: prepayment_and_refund_cluster
    name: "Предоплата и возврат предоплаты"
    description: >
      Фактографическая проверка наличия условий о предоплате
      и порядке возврата предоплаты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предоплата"
        - "аванс"
        - "полная оплата"
        - "частичная оплата"
        - "предварительная оплата"
        - "100% предоплата"
        - "частичная предоплата"
        - "возврат предоплаты"
        - "возврат аванса"
        - "возврат предварительной оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)пред(варительн(ая|ой)|оплат)"
        - "(?i)аванс"
        - "(?i)100\\s*%\\s*предоплат"
        - "(?i)частичн[а-я]+\\s+предоплат"
        - "(?i)возврат.*(предоплат|аван)"
        - "(?i)предварительн[а-я]+\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: предоплата и возврат предоплаты.

        Нормативный ориентир:
        - ст. 487 ГК РФ
        - ст. 23.1 Закона РФ «О защите прав потребителей»

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Предусмотрена ли предоплата — полная или частичная.
        2. Указан ли порядок возврата предоплаты.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона и не делай предположений.
        2. Если текст прямо говорит, что оплата производится до передачи товара,
           до доставки, до исполнения заказа или прямо использует слова
           "предоплата", "аванс", "предварительная оплата" — это достаточное основание
           считать условие о предоплате определённым.
        3. Если текст прямо говорит, что предоплата не требуется, не предусмотрена,
           либо товар оплачивается при получении / после передачи — это тоже
           считается прямым регулированием вопроса о предоплате.
           В user-facing поле отрази это как "Не предусмотрена".
        4. Не путай возврат предоплаты с общим возвратом денежных средств
           за возвращённый товар, если текст прямо не связывает возврат
           с авансом, предоплатой, предварительной оплатой или отменённым заказом.
        5. Если порядок возврата предоплаты определяется по названному внешнему документу
           (заявлению, правилам возврата, приложению, регламенту) —
           это не отсутствие регулирования; отрази это в user-facing поле.
        6. Если условие не указано прямо — возвращай "not_defined".
        7. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        8. В evidence включай только текст документа.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — 100% предоплата и возврат:
        Фрагмент:
        "Покупатель оплачивает заказ на условиях 100% предоплаты.
        Возврат предоплаты осуществляется на банковскую карту,
        с которой был произведён платёж."

        Ответ:
        {
          "prepayment_status": "defined",
          "prepayment_details": "100% предоплата",
          "prepayment_refund_status": "defined",
          "prepayment_refund_details": "Возврат на банковскую карту, с которой произведён платёж",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Покупатель оплачивает заказ на условиях 100% предоплаты. Возврат предоплаты осуществляется на банковскую карту, с которой был произведён платёж."
            }
          ]
        }

        Пример 2 — частичная предоплата, возврат по внешнему документу:
        Фрагмент:
        "Покупатель уплачивает аванс в размере 50% стоимости заказа.
        Порядок возврата аванса определяется Правилами возврата,
        размещёнными на сайте Продавца."

        Ответ:
        {
          "prepayment_status": "defined",
          "prepayment_details": "Аванс 50% стоимости заказа",
          "prepayment_refund_status": "defined",
          "prepayment_refund_details": "Согласно Правилам возврата, размещённым на сайте Продавца",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Покупатель уплачивает аванс в размере 50% стоимости заказа. Порядок возврата аванса определяется Правилами возврата, размещёнными на сайте Продавца."
            }
          ]
        }

        Пример 3 — предоплата прямо не предусмотрена:
        Фрагмент:
        "Оплата товара производится при получении. Предварительная оплата не требуется."

        Ответ:
        {
          "prepayment_status": "defined",
          "prepayment_details": "Не предусмотрена",
          "prepayment_refund_status": "not_defined",
          "prepayment_refund_details": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Оплата товара производится при получении. Предварительная оплата не требуется."
            }
          ]
        }

        Пример 4 — ничего не указано:
        Фрагмент:
        "Покупатель оплачивает товар в порядке, предусмотренном договором."

        Ответ:
        {
          "prepayment_status": "not_defined",
          "prepayment_details": "Не установлена",
          "prepayment_refund_status": "not_defined",
          "prepayment_refund_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о предоплате, авансе или предварительной оплате?
        2. Есть ли прямое указание, что предоплата не требуется / оплата при получении?
        3. Есть ли прямой порядок возврата предоплаты или названный источник,
           где он определяется?
        4. Не путаю ли я возврат предоплаты с обычным возвратом денег за товар?
        5. Если вопрос не урегулирован — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "prepayment_status": "<defined / not_defined>",
          "prepayment_details": "<текст или 'Не предусмотрена' / 'Не установлена' / 'Не удалось определить'>",
          "prepayment_refund_status": "<defined / not_defined>",
          "prepayment_refund_details": "<текст или 'Не применимо' / 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предоплата аванс предварительная оплата 100% предоплата частичная предоплата возврат предоплаты возврат аванса возврат предварительной оплаты"
      preferred_unit_types:
        - payment_term
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "просрочка оплаты"
        - "пени"
        - "неустойка"
        - "штраф"
        - "цена"
        - "стоимость доставки"
        - "доставка"
        - "возврат товара"
        - "ОГРН"
        - "ИНН"
      position_bias:
        preferred_range: [0.10, 0.65]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты сведения
        только о предоплате и порядке возврата предоплаты.
        Не анализируй цену товара, способы оплаты, просрочку оплаты, санкции,
        доставку, возврат товара или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. prepayment_status:
           - "defined" — если в тексте прямо указан порядок оплаты до передачи товара,
             до доставки, до исполнения заказа, либо прямо используются формулировки
             "предоплата", "аванс", "предварительная оплата", а также если текст прямо
             говорит, что предоплата не требуется / не предусмотрена / оплата производится
             при получении или после передачи товара;
           - "not_defined" — если из текста нельзя надёжно установить,
             предусмотрена ли предоплата.
           Важно: общая фраза "оплата производится в соответствии с договором"
           без уточнения момента оплаты не является основанием для "defined".

        2. prepayment_details:
           Краткое user-facing описание условия о предоплате на русском языке.
           Правила:
           - если предоплата предусмотрена, верни краткое summary (1–2 коротких фразы),
             например:
             "100% предоплата",
             "Аванс 50% стоимости заказа",
             "Полная оплата до передачи товара";
           - если текст прямо говорит, что предоплата не требуется или не предусмотрена,
             верни: "Не предусмотрена";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. prepayment_refund_status:
           - "defined" — если в тексте прямо указан порядок возврата предоплаты / аванса /
             предварительной оплаты либо прямо сказано, что он определяется по названному
             внешнему документу (заявлению, правилам возврата, приложению, регламенту);
           - "not_defined" — если порядок возврата предоплаты прямо не указан
             или его нельзя надёжно определить.
           Важно: общий порядок возврата денег за возвращённый товар сам по себе
           не считается порядком возврата предоплаты, если текст прямо не связывает
           его с авансом, предоплатой, предварительной оплатой или отменённым заказом.

        4. prepayment_refund_details:
           Краткое user-facing описание порядка возврата предоплаты на русском языке.
           Правила:
           - если порядок прямо описан, верни краткое summary (1–2 коротких фразы),
             например:
             "Возврат на банковскую карту, с которой произведён платёж",
             "Возврат по заявлению Покупателя в течение 10 дней";
           - если порядок определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Правилам возврата, размещённым на сайте Продавца",
             "Согласно Приложению №2";
           - если предоплата прямо не предусмотрена, верни: "Не применимо";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не смешивай предоплату с ценой товара, способами оплаты, просрочкой оплаты,
          санкциями, возвратом товара и иными нерелевантными темами.
        - Если порядок возврата прямо определяется по названному внешнему документу
          (заявлению, правилам возврата, приложению, регламенту), считай его определённым
          и отрази это в user-facing поле.
        - Общие фразы вроде "в соответствии с законодательством РФ" или
          "в порядке, предусмотренном законом" без конкретизации порядка возврата
          — это not_defined, а не defined.
        - Если в разных фрагментах указаны несовместимые условия о предоплате
          или порядке её возврата и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей используй только следующие fallback-значения:
          * prepayment_details:
            - "Не предусмотрена"
            - "Не установлена"
            - "Не удалось определить"
          * prepayment_refund_details:
            - "Не применимо"
            - "Не установлен"
            - "Не удалось определить"
        </output_expectations>
      fields:
