    - "(?i)\\bпарфюмери[яи]\\b"
    - "(?i)средств[аы]\\s+гигиен[ыи]"
    - "(?i)медицинск[а-яё]+\\s+товар"
    - "(?i)лекарственн[а-яё]+\\s+средств[ао]"
    - "(?i)ювелирн[а-яё]+\\s+издели[яи]"
    - "(?i)\\bживотн[а-яё]+\\b"
    - "(?i)\\bрастени[яи]\\b"

  legal_entity_seller:
    any_keywords:
    - "(?i)\\bООО\\b"
    - "(?i)\\bАО\\b"
    - "(?i)\\bПАО\\b"
    - "(?i)\\bЗАО\\b"
    - "(?i)\\bобществ[оа]\\b"
    - "(?i)\\bОГРН\\b"
    - "(?i)\\bИНН\\b"
    - "(?i)\\bКПП\\b"

  individual_entrepreneur_seller:
    any_keywords:
    - "(?i)\\bИП\\b"
    - "(?i)индивидуальн[а-яё]+\\s+предприниматель"
    - "(?i)\\bОГРНИП\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  phone_pattern: "(?i)\\+?7[\\s\\-]?\\(?\\d{3}\\)?[\\s\\-]?\\d{3}[\\s\\-]?\\d{2}[\\s\\-]?\\d{2}"
  inn_pattern: "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*:?\\s*\\d{13,15}\\b"
  days_period: "(?i)\\b\\d+\\s*(календарн|рабоч)?\\s*(дн|дней|суток)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "alcohol_distance_selling_prohibition"
    name: "Запрет дистанционной продажи алкогольной продукции (ФЗ-171)"
    description: |
      Розничная продажа алкогольной продукции дистанционным способом запрещена.
      Нарушение влечёт административную ответственность (ст. 14.16 КоАП РФ)
      и аннулирование лицензии.
    legal_base: "ФЗ от 22.11.1995 № 171-ФЗ, ст. 16 п. 2 (запрет дистанционной продажи алкоголя)"
    required_triggers: ["alcohol_products", "distance_selling"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "алкогольная продукция"
        - "спиртные напитки"
        - "доставка алкоголя"
        - "заказ алкоголя онлайн"
        - "дистанционная продажа алкоголя"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "алкогольная продукция"
        - "дистанционная продажа"
        - "доставка алкоголя"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: illegal_restrictions_detection
    name: "Выявление ущемляющих условий (ст. 16 ЗоЗПП)"
    description: |
      Обнаружение условий, ограничивающих права потребителя по сравнению с ЗоЗПП.
      Такие условия ничтожны и влекут административную ответственность (ст. 14.8 КоАП РФ).
      Включает: ограничение возврата, сокращение гарантии, отказ от ответственности,
      навязывание подсудности, обязательная платная экспертиза.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат невозможен"
        - "обмену не подлежит"
        - "только ремонт"
        - "претензии принимаются в течение 3 дней"
        - "не принимаются претензии"
        - "гарантия не предоставляется"
        - "ответственность ограничена стоимостью товара"
        - "продавец не несёт ответственности"
        - "экспертиза за счёт покупателя"
        - "обязательный арбитраж"
        - "третейский суд"
        - "товар по акции обмену не подлежит"
        - "возврат товара по акции невозможен"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s*принимаются\\s*претензии.*после.*дней"
        - "(?i)ответственность.*ограничена.*стоимостью"
        - "(?i)возврат.*невозможен|обмену.*не\\s*подлежит"
        - "(?i)гарантия.*не\\s*(предоставляется|распространяется)"
        - "(?i)только\\s+по\\s+месту\\s+нахождения\\s+продавца"
        - "(?i)обязательн.*третейск.*суд"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор розничной купли-продажи / публичную оферту.
        Твоя задача — выявить условия, которые ущемляют права потребителя по сравнению с ЗоЗПП (ст. 16).

        Проверь наличие следующих нарушений:
        1. Ограничение/запрет на возврат/обмен товара надлежащего качества вопреки ст. 25, 26.1 ЗоЗПП
        2. Сокращение сроков предъявления претензий ниже законных
        3. Ограничение выбора способа защиты (только ремонт, без замены/возврата) вопреки ст. 18 ЗоЗПП
        4. Полный или частичный отказ от ответственности продавца за недостатки
        5. Навязывание обязательной подсудности (вопреки ст. 17 ЗоЗПП)
        6. Обязательная платная экспертиза за счёт покупателя
        7. Запрет возврата товаров, купленных по акции/со скидкой
        8. Навязывание дополнительных услуг/товаров (ст. 16 ЗоЗПП)

        Ответь строго в JSON:
        {
          "restrictions_found": true/false,
          "restrictions": [
            {
              "type": "<return_limitation / warranty_limitation / liability_waiver / jurisdiction_limitation / forced_expertise / tying_arrangement / other>",
              "description": "<описание найденного ограничения>",
              "snippet": "<точная цитата из текста>",
              "legal_assessment": "<illegal / borderline / not_found>"
            }
          ],
          "overall_assessment": "<compliant / violations_found / not_found>"
        }

        ВАЖНО: Если ни одного ограничения не найдено — верни restrictions_found: false и пустой массив.
        Не придумывай нарушений — опирайся только на текст.
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 1024
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "возврат"
        - "обмен"
        - "претензия"
        - "гарантия"
        - "ответственность"
        - "подсудность"
        - "экспертиза"
        - "акция"
        - "ст. 16 ЗоЗПП"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "restrictions_found"
          type: "boolean"
          description: "Найдены ли ущемляющие условия"
        - name: "overall_assessment"
          type: "string"
          allowed_values: ["compliant", "violations_found", "not_found"]
          description: "Общая оценка соответствия ЗоЗПП"
      store_payload: true

  - id: product_info_completeness_check
    name: "Полнота информации о товаре (ст. 10 ЗоЗПП)"
    description: |
      Продавец обязан предоставить полную и достоверную информацию о товаре:
      наименование, потребительские свойства, цена, изготовитель, страна происхождения,
      гарантийный срок, срок годности (при наличии), сертификация.
      Нарушение даёт право потребителю на отказ и возврат денег.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование товара"
        - "потребительские свойства"
        - "изготовитель"
        - "производитель"
        - "страна происхождения"
        - "сертификат"
        - "декларация соответствия"
        - "характеристики товара"
        - "описание товара"
        - "комплектация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)потребительск(ие|их)\\s+свойств"
        - "(?i)изготовитель|производитель"
        - "(?i)страна\\s+происхождения"
    llm:
      prompt_template: |
        Ты — юридический ассистент, проверяющий оферту/договор розничной купли-продажи.
        Оцени полноту информации о товаре в соответствии со ст. 10 ЗоЗПП.

        Проверь наличие:
        1. Наименование товара
        2. Основные потребительские свойства / характеристики
        3. Информация об изготовителе / производителе
        4. Страна происхождения
        5. Гарантийный срок (если применимо)
        6. Срок годности (если применимо)
        7. Сведения о сертификации/декларировании
        8. Комплектация

        Ответь строго в JSON:
        {
          "product_name": "<present / not_found>",
          "consumer_properties": "<present / partial / not_found>",
          "manufacturer_info": "<present / not_found>",
          "country_of_origin": "<present / not_found>",
          "warranty_period": "<present / not_applicable / not_found>",
          "expiration_date": "<present / not_applicable / not_found>",
          "certification_info": "<present / not_found>",
          "completeness_score": "<full / partial / insufficient / not_found>"
        }

        ВАЖНО: Если поле не применимо к данному товару — пиши "not_applicable".
        Если явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512

    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "товар"
        - "наименование"
        - "характеристики"
        - "изготовитель"
        - "производитель"
        - "гарантия"
        - "сертификат"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "completeness_score"
          type: "string"
          allowed_values: ["full", "partial", "insufficient", "not_found"]
          description: "Полнота информации о товаре"
        - name: "product_name"
          type: "string"
          keyword_hints: ["наименование", "товар", "продукция"]
          description: "Наименование товара"
        - name: "manufacturer_info"
          type: "string"
          keyword_hints: ["изготовитель", "производитель"]
          description: "Информация об изготовителе"
      store_payload: true

  - id: distance_selling_compliance_check
    name: "Комплаенс дистанционной продажи (ст. 26.1 ЗоЗПП)"
    description: |
      Проверяет соблюдение специальных требований при дистанционной продаже:
      информация о продавце, описание товара, срок возврата (7 дней, до 3 месяцев без уведомления),
      порядок и сроки доставки, способы оплаты, право на отказ до передачи.
    triggers:
      any: ["distance_selling"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "дистанционный способ"
        - "интернет-магазин"
        - "доставка"
        - "право на отказ"
        - "7 дней"
        - "возврат при дистанционной"
        - "онлайн-заказ"
        - "момент передачи товара"
        - "информация до заключения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн(ый|ой|ым)\\s+(способ|продаж)"
        - "(?i)отказ(аться)?.*до.*передач"
        - "(?i)в\\s+течение\\s+7\\s+(семи)?\\s*дней"
        - "(?i)3\\s+(тр[её]х)?\\s*месяц"
    llm:
      prompt_template: |
        Ты — юридический ассистент, проверяющий оферту интернет-магазина / дистанционную продажу.
        Оцени соответствие ст. 26.1 ЗоЗПП и Постановлению № 2463.

        Проверь:
        1. Информация о продавце до заключения договора (наименование, адрес, ОГРН)
        2. Основные потребительские свойства товара доведены до покупателя
        3. Цена, порядок и условия оплаты указаны
        4. Условия и сроки доставки указаны
        5. Срок возврата товара надлежащего качества (по закону — 7 дней с момента передачи)
        6. Указано ли, что без информирования о порядке возврата срок увеличивается до 3 месяцев
        7. Право отказаться от товара до его передачи
        8. Порядок возврата денежных средств (не более 10 дней)

        Ответь строго в JSON:
        {
          "seller_info_before_contract": "<present / partial / not_found>",
          "product_properties_disclosed": "<yes / partial / not_found>",
          "price_and_payment_specified": "<yes / no / not_found>",
          "delivery_terms_specified": "<yes / no / not_found>",
          "return_period_disclosed": "<yes / no / not_found>",
          "return_period_value": "<7_days / 14_days / 3_months / other / not_found>",
          "pre_delivery_refusal_right": "<mentioned / not_mentioned / not_found>",
          "refund_timeline_specified": "<yes / no / not_found>",
          "overall_compliance": "<compliant / partial / non_compliant / not_found>"
        }

        ВАЖНО: Опирайся только на текст. Если не указано — "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "дистанционный"
        - "интернет-магазин"
        - "возврат"
        - "доставка"
        - "право на отказ"
        - "ст. 26.1"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "overall_compliance"
          type: "string"
          allowed_values: ["compliant", "partial", "non_compliant", "not_found"]
          description: "Общая оценка соответствия ст. 26.1 ЗоЗПП"
        - name: "return_period_value"
          type: "string"
          allowed_values: ["7_days", "14_days", "3_months", "other", "not_found"]
          description: "Указанный срок возврата"
      store_payload: true

  - id: technical_goods_return_rules_check
    name: "ТСТ: правила возврата технически сложных товаров (ст. 18 ЗоЗПП)"
    description: |
      Проверяет корректность условий возврата технически сложных товаров:
      15-дневный срок, существенный недостаток, приоритет ремонта,
      ссылка на Перечень ТСТ (Постановление № 924).
    triggers:
      any: ["technical_complex_goods"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "технически сложный товар"
        - "в течение 15 дней"
        - "существенный недостаток"
        - "Перечень технически сложных"
        - "Постановление № 924"
        - "ремонт товара"
        - "45 дней"
        - "срок устранения недостатка"
        - "нарушение сроков ремонта"
        - "неоднократность недостатков"
        - "невозможность использования более 30 дней"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)технически\\s+сложн(ый|ого|ых)\\s+товар"
        - "(?i)в\\s+течение\\s+15\\s+(пятнадцати)?\\s*дней"
        - "(?i)существенн(ый|ого)\\s+недостат"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий оферту/договор с технически сложным товаром.
        Проверь корректность условий возврата по ст. 18 ЗоЗПП.

        Ответь строго в JSON:
        {
          "tst_mentioned": "<yes / no / not_found>",
          "fifteen_day_rule_disclosed": "<correctly_stated / incorrectly_stated / not_found>",
          "substantial_defect_clause": "<present / not_found>",
          "repair_priority_stated": "<yes / no / not_found>",
          "consumer_rights_preserved": "<yes / restricted / not_found>"
        }

        ВАЖНО: Если условие явно не указано — "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "технически сложный товар"
        - "15 дней"
        - "существенный недостаток"
        - "ремонт"
        - "замена"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "fifteen_day_rule_disclosed"
          type: "string"
          allowed_values: ["correctly_stated", "incorrectly_stated", "not_found"]
          description: "Корректность 15-дневного правила"
        - name: "consumer_rights_preserved"
          type: "string"
          allowed_values: ["yes", "restricted", "not_found"]
          description: "Сохранены ли права потребителя"
      store_payload: true

  - id: warranty_and_defects_rights_check
    name: "Гарантия и права при обнаружении недостатков (ст. 18-24 ЗоЗПП)"
    description: |
      Проверяет: указан ли гарантийный срок, разъяснены ли права потребителя при недостатках
      (ремонт, замена, уменьшение цены, возврат денег — по выбору потребителя),
      не ограничены ли эти права вопреки закону.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "недостаток товара"
        - "безвозмездное устранение"
        - "замена товара"
        - "возврат уплаченной суммы"
        - "соразмерное уменьшение"
        - "ремонт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)при\\s+обнаружении\\s+недостатк"
        - "(?i)потребитель\\s+вправе\\s+(потребовать|требовать)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор розничной купли-продажи.
        Проверь условия гарантии и права потребителя при недостатках (ст. 18-24 ЗоЗПП).

        Ответь строго в JSON:
        {
          "warranty_period_specified": "<yes / no / not_found>",
          "warranty_period_value": "<значение или not_found>",
          "defect_remedies_listed": "<full / partial / not_found>",
          "consumer_choice_preserved": "<yes / restricted / not_found>",
          "free_repair_mentioned": "<yes / no / not_found>",
          "replacement_mentioned": "<yes / no / not_found>",
          "refund_mentioned": "<yes / no / not_found>",
          "price_reduction_mentioned": "<yes / no / not_found>"
        }

        - "full" — перечислены все 4 способа защиты (ремонт, замена, возврат, уменьшение цены)
        - "partial" — указаны некоторые
        - "restricted" — право потребителя на выбор ограничено (например, «только ремонт»)
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "гарантия"
        - "недостаток"
        - "ремонт"
        - "замена"
        - "возврат"
        - "уменьшение цены"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "warranty_period_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указан ли гарантийный срок"
        - name: "defect_remedies_listed"
          type: "string"
          allowed_values: ["full", "partial", "not_found"]
          description: "Полнота перечня способов защиты"
        - name: "consumer_choice_preserved"
          type: "string"
          allowed_values: ["yes", "restricted", "not_found"]
          description: "Сохранён ли выбор потребителя"
      store_payload: true

  - id: marketplace_liability_allocation_check
    name: "Маркетплейс: распределение ответственности (ст. 26.1 ЗоЗПП)"
    description: |
      Проверяет распределение ответственности между маркетплейсом и продавцом,
      раскрытие информации о продавце, порядок предъявления претензий потребителем.
    triggers:
      any: ["marketplace_platform"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "маркетплейс"
        - "агрегатор"
        - "владелец агрегатора"
        - "информационный посредник"
        - "ответственность маркетплейса"
        - "ответственность продавца"
        - "солидарная ответственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)маркетплейс|агрегатор"
        - "(?i)ответственность\\s+(маркетплейс|агрегатор|продавц)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий оферту маркетплейса / торговой площадки.
        Проверь распределение ответственности между маркетплейсом и продавцом.

        Ответь строго в JSON:
        {
          "marketplace_role": "<information_intermediary / seller / co_seller / unclear / not_found>",
          "seller_info_disclosure": "<complete / partial / not_found>",
          "liability_allocation": "<marketplace / seller / shared / unclear / not_found>",
          "consumer_complaint_path": "<clear / unclear / not_found>",
          "marketplace_disclaims_all_liability": "<yes / no / not_found>"
        }

        ВАЖНО: Если маркетплейс полностью снимает с себя ответственность — укажи "yes" в marketplace_disclaims_all_liability.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "маркетплейс"
        - "агрегатор"
        - "ответственность"
        - "продавец"
        - "претензия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "marketplace_role"
          type: "string"
          allowed_values: ["information_intermediary", "seller", "co_seller", "unclear", "not_found"]
          description: "Роль маркетплейса"
        - name: "marketplace_disclaims_all_liability"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Полный отказ маркетплейса от ответственности"
      store_payload: true

  - id: personal_data_processing_check
    name: "Обработка персональных данных покупателя (ФЗ-152)"
    description: |
      Проверяет наличие согласия на обработку ПД, указание целей обработки,
      перечня данных, третьих лиц, срока хранения. Особенно критично для
      дистанционной продажи и подписочных моделей.
    triggers:
      any: ["distance_selling", "subscription_model", "marketplace_platform"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "персональные данные"
        - "согласие на обработку"
        - "обработка данных"
        - "политика конфиденциальности"
        - "ФЗ-152"
        - "оператор персональных данных"
        - "cookie"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ые|ых)\\s+данн(ые|ых)"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"
        - "(?i)ФЗ[\\s\\-]*152"
    llm:
      prompt_template: |
        Ты — юридический ассистент, проверяющий оферту на соответствие ФЗ-152 «О персональных данных».
        Оцени корректность положений об обработке ПД покупателя.

        Ответь строго в JSON:
        {
          "consent_mechanism": "<explicit_checkbox / implicit_acceptance / not_found>",
          "purpose_limitation": "<specified / not_specified / not_found>",
          "data_types_listed": "<yes / no / not_found>",
          "third_party_sharing": "<disclosed / not_disclosed / not_found>",
          "retention_period": "<specified / not_specified / not_found>",
          "withdrawal_right": "<mentioned / not_mentioned / not_found>"
        }

        ВАЖНО: Если механизм получения согласия не указан — "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "персональные данные"
        - "согласие"
        - "обработка"
        - "конфиденциальность"
        - "ФЗ-152"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "consent_mechanism"
          type: "string"
          allowed_values: ["explicit_checkbox", "implicit_acceptance", "not_found"]
          description: "Механизм получения согласия"
        - name: "purpose_limitation"
          type: "string"
          allowed_values: ["specified", "not_specified", "not_found"]
          description: "Указание целей обработки"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "price_required"
    name: "Цена товара (ст. 500 ГК РФ)"
    description: "Цена — существенное условие публичного договора розничной купли-продажи. Должна быть указана в рублях."
    legal_base: "ст. 500 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "рублей"
        - "оплата"
        - "итого"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)стоимость.*?\\d"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "price_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["цена", "стоимость", "рублей"]
          description: "Указана ли цена товара"
      store_payload: true

  - id: "seller_identification_required"
    name: "Идентификация продавца (ст. 9 ЗоЗПП)"
    description: |
      Продавец обязан довести до потребителя: наименование (фирменное), адрес,
      ОГРН/ОГРНИП, режим работы. Для ИП — также ФИО.
    legal_base: "ст. 9 ЗоЗПП, ст. 492 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "продавец"
        - "наименование"
        - "ОГРН"
        - "ИНН"
        - "адрес продавца"
        - "юридический адрес"
        - "ИП"
        - "индивидуальный предприниматель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bОГРН\\s*:?\\s*\\d{13,15}\\b"
        - "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
        - "(?i)(ООО|АО|ПАО|ИП)\\s+[«\"'].+?[»\"']"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "seller_name"
          type: "string"
          keyword_hints: ["продавец", "наименование", "ООО", "АО", "ИП"]
          description: "Наименование продавца"
        - name: "seller_ogrn"
          type: "string"
          regex_patterns:
            - "(?i)\\bОГРН\\s*:?\\s*\\d{13,15}\\b"
          description: "ОГРН продавца"
        - name: "seller_inn"
          type: "string"
          regex_patterns:
            - "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
          description: "ИНН продавца"
      store_payload: true

  - id: "subject_description_required"
    name: "Предмет договора: описание товара (ст. 455, 495 ГК РФ)"
    description: "Товар должен быть определён наименованием, количеством и основными потребительскими свойствами."
    legal_base: "ст. 455, 495 ГК РФ, ст. 10 ЗоЗПП"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "наименование товара"
        - "описание товара"
        - "предмет договора"
        - "предмет оферты"
        - "количество"
        - "комплектация"
        - "артикул"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+(договора|оферты)"
        - "(?i)наименовани(е|я)\\s+товар"

  - id: "payment_terms_specified"
    name: "Порядок и способы оплаты"
    description: "Проверяет наличие условий об оплате: способы, сроки, момент исполнения обязанности по оплате."
    legal_base: "ст. 500 ГК РФ, ст. 16.1 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "оплата"
        - "способ оплаты"
        - "банковская карта"
        - "наличный расчёт"
        - "безналичный расчёт"
        - "электронный кошелёк"
        - "онлайн-оплата"
        - "момент оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)способ(ы)?\\s+оплат"
        - "(?i)банковск(ая|ой)\\s+карт"

  - id: "delivery_terms_specified"
    name: "Условия и сроки доставки (ст. 499 ГК РФ, ст. 23.1 ЗоЗПП)"
    description: "Проверяет наличие условий доставки: сроки, способы, стоимость, ответственность за просрочку."
    legal_base: "ст. 499 ГК РФ, ст. 23.1 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["distance_selling"]
    rules:
      keywords:
        - "доставка"
        - "срок доставки"
        - "способ доставки"
        - "курьер"
        - "самовывоз"
        - "пункт выдачи"
        - "стоимость доставки"
        - "бесплатная доставка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк(а|и|у).*?(в\\s+течение|не\\s+позднее|\\d+\\s+дн)"
        - "(?i)срок\\s+доставк"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "delivery_period"
          type: "string"
          keyword_hints: ["срок доставки", "в течение", "рабочих дней"]
          description: "Срок доставки"
        - name: "delivery_cost"
          type: "string"
          keyword_hints: ["стоимость доставки", "бесплатная доставка", "за счёт покупателя"]
          description: "Стоимость доставки"
      store_payload: true

  - id: "order_acceptance_mechanism"
    name: "Момент заключения договора / акцепт оферты"
    description: "Проверяет определённость момента заключения договора: конклюдентные действия, оплата, клик-акцепт."
    legal_base: "ст. 493, 494 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "момент заключения"
        - "акцепт оферты"
        - "оформление заказа"
        - "подтверждение заказа"
        - "выдача чека"
        - "нажатие кнопки"
        - "клик"
        - "конклюдентные действия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*считается.*заключ[её]нн"
        - "(?i)акцепт.*оферт"
        - "(?i)момент.*заключения"

  - id: "prepayment_conditions"
    name: "Условия предоплаты и возврата предоплаты (ст. 487 ГК РФ)"
    description: "Проверяет наличие условий предоплаты, порядок и сроки возврата при отказе от товара."
    legal_base: "ст. 487 ГК РФ, ст. 23.1 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "предоплата"
        - "аванс"
        - "полная оплата"
        - "частичная оплата"
        - "возврат предоплаты"
        - "предварительная оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)пред(варительн(ая|ой)|оплат)"
        - "(?i)возврат.*предоплат"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "prepayment_type"
          type: "string"
          allowed_values: ["full", "partial", "none", "not_found"]
          keyword_hints: ["полная предоплата", "частичная оплата", "100%"]
          description: "Тип предоплаты"
      store_payload: true

  - id: "order_cancellation_terms"
    name: "Отмена заказа: сроки и условия"
    description: "Проверяет условия отмены заказа покупателем до передачи товара."
    legal_base: "ст. 497 ГК РФ, ст. 26.1 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "отмена заказа"
        - "отказ от заказа"
        - "аннулирование заказа"
        - "до передачи товара"
        - "до отгрузки"
        - "до комплектации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен(а|ить)\\s+заказ"
        - "(?i)отказ(аться)?\\s+от\\s+заказ"

  - id: "return_exchange_rights_info"
    name: "Право на возврат/обмен товара надлежащего качества (ст. 25, 26.1 ЗоЗПП)"
    description: |
      Проверяет наличие информации о праве потребителя на возврат/обмен товара
      надлежащего качества в течение 14 дней (ст. 25) или 7 дней (дистанционная продажа, ст. 26.1).
    legal_base: "ст. 25, 26.1 ЗоЗПП"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возврат товара"
        - "обмен товара"
        - "в течение 14 дней"
        - "в течение 7 дней"
        - "надлежащее качество"
        - "право на отказ"
        - "товарный вид"
        - "потребительские свойства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*товар.*надлежащ"
        - "(?i)обмен.*непродовольственн"
        - "(?i)в\\s+течение\\s+(14|7)\\s+дней"

  - id: "quality_guarantee_terms"
    name: "Гарантийный срок и гарантийное обслуживание"
    description: "Проверяет наличие условий о гарантийном сроке, порядке гарантийного обслуживания."
    legal_base: "ст. 470-477 ГК РФ, ст. 5, 6, 18 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "гарантийное обслуживание"
        - "гарантийный талон"
        - "сервисный центр"
        - "срок службы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)гарантия.*?(\\d+\\s*(мес|год|лет|дн))"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "warranty_period"
          type: "string"
          keyword_hints: ["гарантийный срок", "гарантия", "месяцев", "лет"]
          description: "Гарантийный срок"
      store_payload: true

  - id: "penalty_and_liability_terms"
    name: "Неустойка и ответственность продавца (ст. 23, 23.1 ЗоЗПП)"
    description: |
      Проверяет наличие условий об ответственности продавца за нарушение сроков:
      неустойка 1% в день за просрочку удовлетворения требований (ст. 23 ЗоЗПП),
      неустойка 0.5% в день за просрочку доставки предоплаченного товара (ст. 23.1 ЗоЗПП).
    legal_base: "ст. 23, 23.1 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пеня"
        - "1% в день"
        - "0.5% в день"
        - "ответственность продавца"
        - "просрочка"
      keyword_mode: "any"
      negative_keywords:
        - "ответственность продавца ограничена"
        - "продавец не несёт ответственности"
      regex_patterns:
        - "(?i)неустойк(а|у|и).*?\\d+\\s*%"
        - "(?i)(1|0[.,]5)\\s*%.*?(день|сутки)"

  - id: "dispute_resolution_consumer_rights"
    name: "Подсудность: право потребителя на выбор суда (ст. 17 ЗоЗПП)"
    description: |
      Потребитель вправе предъявить иск по своему выбору: по месту жительства,
      по месту нахождения продавца, по месту заключения/исполнения договора.
      Условие об исключительной подсудности по месту продавца — ничтожно.
    legal_base: "ст. 17 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "подсудность"
        - "место рассмотрения спора"
        - "суд по месту"
        - "арбитражный суд"
        - "третейский суд"
        - "место жительства потребителя"
      keyword_mode: "any"
      negative_keywords:
        - "только по месту нахождения продавца"
        - "исключительная подсудность"
        - "обязательный третейский суд"
      regex_patterns:
        - "(?i)только\\s+по\\s+месту\\s+нахождения\\s+(продавца|исполнителя)"
        - "(?i)обязательн.*третейск"

  - id: "tying_prohibition_check"
    name: "Запрет навязывания дополнительных товаров/услуг (ст. 16 ЗоЗПП)"
    description: |
      Запрещено обусловливать приобретение одних товаров обязательным приобретением других.
      Убытки от навязывания подлежат возмещению в полном объёме.
    legal_base: "ст. 16 ЗоЗПП (в ред. ФЗ от 01.05.2022 № 135-ФЗ)"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "обязательное приобретение"
        - "дополнительные услуги обязательны"
        - "в комплекте с"
        - "обязательная страховка"
        - "обязательный сервисный контракт"
        - "навязывание"
      keyword_mode: "any"
      negative_keywords:
        - "по желанию покупателя"
        - "дополнительно по выбору"
        - "опционально"
      regex_patterns:
        - "(?i)обязательн(ое|ая|ый)\\s+(приобретение|покупка|страхов|подключен)"
        - "(?i)только\\s+в\\s+комплекте"

  - id: "non_returnable_goods_reference"
    name: "Перечень невозвратных товаров (Постановление № 2463)"
    description: |
      Информирование покупателя о товарах, не подлежащих обмену/возврату надлежащего качества.
      Без этого продавец рискует получить необоснованные требования о возврате.
    legal_base: "Постановление Правительства РФ № 2463, ст. 25 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["non_returnable_goods_context"]
    rules:
      keywords:
        - "Перечень № 2463"
        - "не подлежат обмену"
        - "не подлежат возврату"
        - "предметы личной гигиены"
        - "парфюмерия"
        - "нижнее белье"
        - "ювелирные изделия"
        - "непродовольственные товары надлежащего качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товары.*не\\s+подлежащ(ие|их)\\s+обмену"
        - "(?i)Постановлени(е|я).*2463"

  - id: "delivery_cost_retention_clause"
    name: "Удержание расходов на доставку при возврате (ст. 26.1 ЗоЗПП)"
    description: |
      При отказе потребителя от товара надлежащего качества при дистанционной продаже
      продавец вправе удержать расходы на обратную доставку. Без этого условия —
      обязан вернуть полную стоимость.
    legal_base: "п. 4 ст. 26.1 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["distance_selling"]
    rules:
      keywords:
        - "расходы на доставку"
        - "за исключением расходов"
        - "обратная пересылка"
        - "расходы на возврат"
        - "стоимость обратной доставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расходы.*?(доставк|пересылк|возврат)"
        - "(?i)за\\s+исключением\\s+расходов"

  - id: "food_expiration_info"
    name: "Продовольствие: срок годности и условия хранения (ст. 5, 10 ЗоЗПП)"
    description: |
      Для продовольственных товаров обязательно указание срока годности и условий хранения.
      Продажа товара с истёкшим сроком годности запрещена.
    legal_base: "ст. 5, 10 ЗоЗПП, ТР ТС 021/2011"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["food_products"]
    rules:
      keywords:
        - "срок годности"
        - "годен до"
        - "употребить до"
        - "условия хранения"
        - "температура хранения"
        - "пищевой продукт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+годност"
        - "(?i)(годен|употребить)\\s+до"

  - id: "preorder_cancellation_right"
    name: "Предзаказ: право на отмену и возврат предоплаты (ст. 23.1 ЗоЗПП)"
    description: |
      При предзаказе покупатель вправе отказаться от товара до его передачи
      с возвратом предоплаты. Неустойка за просрочку — 0.5% в день.
    legal_base: "ст. 23.1 ЗоЗПП, ст. 487 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["preorder_sale"]
    rules:
      keywords:
        - "предзаказ"
        - "предварительный заказ"
        - "отмена предзаказа"
        - "возврат предоплаты"
        - "срок поставки"
        - "неустойка за просрочку"
        - "0.5% в день"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предзаказ|предварительн(ый|ого)\\s+заказ"
        - "(?i)0[.,]5\\s*%.*?день"

  - id: "subscription_auto_renewal_terms"
    name: "Подписка: условия автопродления и отказа"
    description: |
      Проверяет прозрачность условий подписки: автопродление, уведомление о списании,
      порядок отмены, возврат при досрочном отказе.
    legal_base: "ст. 16 ЗоЗПП, ст. 26.1 ЗоЗПП, ст. 497 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["subscription_model"]
    rules:
      keywords:
        - "автопродление"
        - "автоматическое продление"
        - "рекуррентный платёж"
        - "отмена подписки"
        - "отказ от подписки"
        - "уведомление о списании"
        - "абонентская плата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(ое|и)\\s+(продлен|списан)"
        - "(?i)отмен(а|ить)\\s+подписк"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "auto_renewal_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["автопродление", "автоматическое продление"]
          description: "Наличие автопродления"
        - name: "cancellation_procedure"
          type: "string"
          allowed_values: ["clear", "unclear", "not_found"]
          keyword_hints: ["отмена подписки", "отказ от подписки", "для отмены"]
          description: "Порядок отмены подписки"
      store_payload: true

  - id: "installment_credit_disclosure"
    name: "Рассрочка/кредит: раскрытие полной стоимости (ФЗ-353)"
    description: |
      При продаже в кредит/рассрочку продавец обязан раскрыть полную стоимость кредита,
      процентную ставку, порядок возврата.
    legal_base: "ФЗ от 21.12.2013 № 353-ФЗ, ст. 488-489 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["installment_payment"]
    rules:
      keywords:
        - "рассрочка"
        - "кредит"
        - "процентная ставка"
        - "полная стоимость кредита"
        - "ежемесячный платёж"
        - "график платежей"
        - "переплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)полная\\s+стоимость\\s+кредит"
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)график\\s+платеж"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "interest_rate_disclosed"
          type: "string"
          allowed_values: ["yes", "zero", "no", "not_found"]
          keyword_hints: ["процентная ставка", "0%", "без процентов", "переплата"]
          description: "Раскрыта ли процентная ставка"
        - name: "total_cost_disclosed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["полная стоимость", "итого с процентами", "общая сумма"]
          description: "Раскрыта ли полная стоимость кредита"
      store_payload: true

  - id: "digital_goods_return_limitation"
    name: "Цифровые товары: ограничение возврата после предоставления доступа"
    description: |
      Цифровой контент, предоставленный онлайн, может не подлежать возврату
      после начала использования/скачивания. Покупатель должен быть уведомлён об этом.
    legal_base: "ст. 26.1 ЗоЗПП, Постановление № 2463"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["digital_goods"]
    rules:
      keywords:
        - "цифровой контент"
        - "электронная книга"
        - "лицензия"
        - "ключ активации"
        - "после скачивания"
        - "после активации"
        - "возврат невозможен после"
        - "программное обеспечение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)после\\s+(скачивания|активации|предоставления\\s+доступа)"
        - "(?i)цифров(ой|ого)\\s+(контент|товар)"

  - id: "extended_warranty_disclosure"
    name: "Расширенная гарантия: условия и ограничения"
    description: |
      Расширенная гарантия не может подменять законные гарантийные обязательства.
      Проверяет, что условия расширенной гарантии не вводят в заблуждение.
    legal_base: "ст. 5, 18 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["warranty_extended"]
    rules:
      keywords:
        - "расширенная гарантия"
        - "дополнительная гарантия"
        - "сервисный контракт"
        - "программа защиты"
        - "доп. гарантия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расширенн(ая|ой)\\s+гарант"
        - "(?i)дополнительн(ая|ой)\\s+гарант"

  - id: "food_distance_delivery_safety_check"
    name: "Безопасность доставки продовольственных товаров (ТР ТС 021/2011)"
    description: |
      При дистанционной продаже продовольственных товаров продавец обязан обеспечить
      соблюдение температурного режима, сроков доставки скоропортящихся продуктов,
      целостность упаковки. Отсутствие этих условий — риск причинения вреда здоровью
      и административной/уголовной ответственности.
    legal_base: "ТР ТС 021/2011, ст. 7 ЗоЗПП, Постановление № 2463"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      all: ["food_products", "distance_selling"]
    rules:
      keywords:
        - "температурный режим"
        - "холодовая цепь"
        - "условия хранения при доставке"
        - "условия транспортировки пищевых"
        - "скоропортящийся"
        - "срок годности при доставке"
        - "термосумка"
        - "рефрижератор"
        - "ответственность за порчу при доставке"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)температурн(ый|ого)\\s+режим.*доставк"
        - "(?i)условия\\s+(хранения|транспортировки).*пищев"

  - id: "marketplace_seller_info_disclosure"
    name: "Маркетплейс: раскрытие информации о продавце (ст. 9, 12.1 ЗоЗПП)"
    description: |
      Владелец агрегатора обязан довести до потребителя полную информацию о продавце:
      наименование, адрес, ОГРН/ОГРНИП. При отсутствии — маркетплейс несёт
      солидарную ответственность перед потребителем (ст. 12.1 ЗоЗПП в ред. ФЗ-594).
    legal_base: "ст. 9, 12.1, 26.1 ЗоЗПП (в ред. ФЗ от 29.12.2022 № 594-ФЗ)"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["marketplace_platform"]
    rules:
      keywords:
        - "информация о продавце"
        - "наименование продавца"
        - "реквизиты продавца"
        - "ОГРН продавца"
        - "адрес продавца"
        - "контактные данные продавца"
        - "карточка продавца"
        - "ответственность агрегатора"
        - "солидарная ответственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)информаци(я|ю)\\s+о\\s+продавц"
        - "(?i)реквизит(ы|ов)\\s+продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"

  - id: "statutory_claim_period_disclosure"
    name: "Двухлетний срок требований при коротком/отсутствующем гарантийном сроке (ст. 19 ЗоЗПП)"
    description: |
      Если гарантийный срок не установлен или менее 2 лет — потребитель вправе
      предъявить требования в течение 2 лет. Распространённое нарушение:
      ограничение претензий сроком гарантии, что ущемляет право потребителя (ст. 16 ЗоЗПП).
    legal_base: "ст. 19 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в течение 2 лет"
        - "два года"
        - "в пределах гарантийного срока"
        - "только в пределах гарантии"
        - "после истечения гарантии претензии не принимаются"
        - "сроки предъявления требований"
        - "срок обнаружения недостатков"
      keyword_mode: "any"
      negative_keywords:
        - "претензии принимаются только в пределах гарантийного срока"
        - "после истечения гарантии претензии не принимаются"
        - "по истечении гарантийного срока продавец ответственности не несёт"
      regex_patterns:
        - "(?i)претензи.*только.*в\\s+пределах\\s+гарантийного"
        - "(?i)после.*истечения.*гарантии.*не\\s+принимаются"
        - "(?i)по\\s+истечении.*гарантийного.*не\\s+несёт"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  price_required:
    text: >
      Просим подтвердить по {doc_names}: (а) итоговую цену товара цифрами и прописью;
      (б) включает ли цена доставку; (в) порядок изменения цены (если предусмотрен).
    addressee: "Продавец / Юридический отдел"

  seller_identification_required:
    text: >
      Просим предоставить по {doc_names} полные реквизиты продавца: наименование,
      ОГРН/ОГРНИП, ИНН, юридический адрес, фактический адрес, режим работы,
      контактные данные для претензий (ст. 9 ЗоЗПП).
    addressee: "Продавец"

  subject_description_required:
    text: >
      Просим уточнить в {doc_names}: полное наименование товара, основные потребительские
      свойства, характеристики, комплектацию, артикул (ст. 10 ЗоЗПП).
    addressee: "Продавец / Отдел маркетинга"

  illegal_restrictions_detection:
    text: >
      В {doc_names} выявлены условия, потенциально ущемляющие права потребителя (ст. 16 ЗоЗПП).
      Просим пересмотреть: (а) условия возврата/обмена; (б) ограничения ответственности;
      (в) условия подсудности; (г) обязательность дополнительных услуг.
      Ущемляющие условия ничтожны и влекут ответственность по ст. 14.8 КоАП РФ.
    addressee: "Юридический отдел продавца"

  product_info_completeness_check:
    text: >
      Просим дополнить информацию о товаре в {doc_names} в соответствии со ст. 10 ЗоЗПП:
      изготовитель, страна происхождения, сертификаты/декларации соответствия,
      потребительские свойства, комплектация, гарантийный срок.
    addressee: "Продавец / Отдел качества"

  distance_selling_compliance_check:
    text: >
      Просим обеспечить соответствие {doc_names} требованиям ст. 26.1 ЗоЗПП:
      (а) полная информация о продавце до заключения договора; (б) право отказа в течение 7 дней;
      (в) увеличение срока до 3 месяцев при ненадлежащем информировании;
      (г) порядок и срок возврата денег (не более 10 дней); (д) условия доставки.
    addressee: "Юридический отдел продавца"

  technical_goods_return_rules_check:
    text: >
      Просим уточнить в {doc_names} правила возврата технически сложных товаров:
      (а) ссылку на Перечень ТСТ (Постановление № 924); (б) 15-дневный срок;
      (в) права при существенном недостатке; (г) порядок проведения экспертизы.
    addressee: "Юридический отдел продавца"

  warranty_and_defects_rights_check:
    text: >
      Просим уточнить в {doc_names} гарантийные условия: (а) гарантийный срок и его начало;
      (б) полный перечень прав потребителя при недостатках (ремонт, замена, уменьшение цены,
      возврат — по выбору потребителя, ст. 18 ЗоЗПП); (в) порядок обращения с претензией;
      (г) сроки удовлетворения требований.
    addressee: "Юридический отдел продавца"

  marketplace_liability_allocation_check:
    text: >
      Просим уточнить в {doc_names}: (а) роль маркетплейса (информационный посредник или сторона);
      (б) порядок раскрытия информации о продавцах; (в) распределение ответственности
      перед потребителем; (г) порядок предъявления и рассмотрения претензий.
    addressee: "Юридический отдел маркетплейса"

  personal_data_processing_check:
    text: >
      Просим привести положения {doc_names} об обработке персональных данных в соответствие
      с ФЗ-152: (а) конкретные цели обработки; (б) перечень обрабатываемых данных;
      (в) механизм получения согласия; (г) третьи лица — получатели данных;
      (д) срок хранения; (е) порядок отзыва согласия.
    addressee: "DPO / Юридический отдел"

  payment_terms_specified:
    text: >
      Просим уточнить в {doc_names}: способы оплаты (карта, наличные, электронные средства),
      момент исполнения обязанности по оплате, порядок выдачи чека.
    addressee: "Продавец / Бухгалтерия"

  delivery_terms_specified:
    text: >
      Просим уточнить в {doc_names}: конкретные сроки доставки, стоимость,
      ответственность за просрочку (ст. 23.1 ЗоЗПП — неустойка 0.5% в день),
      порядок приёмки товара.
    addressee: "Продавец / Логистика"

  order_acceptance_mechanism:
    text: >
      Просим уточнить в {doc_names}: момент заключения договора (оплата, подтверждение,
      клик-акцепт), порядок подтверждения заказа продавцом.
    addressee: "Юридический отдел продавца"

  prepayment_conditions:
    text: >
      Просим уточнить в {doc_names}: размер и порядок предоплаты, сроки и условия возврата
      при отказе потребителя, ответственность за просрочку возврата.
    addressee: "Продавец / Бухгалтерия"

  order_cancellation_terms:
    text: >
      Просим уточнить в {doc_names}: до какого момента возможна отмена заказа,
      порядок и сроки возврата денег при отмене, удержания (если применимы).
    addressee: "Продавец"

  return_exchange_rights_info:
    text: >
      Просим включить в {doc_names}: (а) право на возврат/обмен надлежащего качества
      в течение 14 дней (ст. 25 ЗоЗПП) / 7 дней при дистанционной продаже (ст. 26.1);
      (б) условия возврата (товарный вид, сохранность упаковки); (в) порядок возврата денег.
    addressee: "Юридический отдел продавца"

  quality_guarantee_terms:
    text: >
      Просим уточнить в {doc_names}: гарантийный срок, момент начала гарантии,
      адрес сервисного центра, порядок обращения за гарантийным обслуживанием.
    addressee: "Продавец / Сервисный отдел"

  penalty_and_liability_terms:
    text: >
      Просим уточнить в {doc_names}: ответственность продавца за нарушение сроков
      (неустойка по ст. 23/23.1 ЗоЗПП), порядок предъявления претензий,
      сроки рассмотрения претензий.
    addressee: "Юридический отдел продавца"

  dispute_resolution_consumer_rights:
    text: >
      Просим привести {doc_names} в соответствие со ст. 17 ЗоЗПП:
      потребитель вправе предъявить иск по месту своего жительства, месту нахождения
      продавца или месту заключения/исполнения договора — по своему выбору.
      Условия об исключительной подсудности ничтожны.
    addressee: "Юридический отдел продавца"

  tying_prohibition_check:
    text: >
      В {doc_names} обнаружены признаки навязывания дополнительных товаров/услуг (ст. 16 ЗоЗПП).
      Просим убрать обязательность приобретения дополнительных товаров/услуг
      или сделать их опциональными с явным указанием «по желанию покупателя».
    addressee: "Юридический отдел продавца"

  non_returnable_goods_reference:
    text: >
      Просим включить в {doc_names} ссылку на Перечень товаров надлежащего качества,
      не подлежащих обмену (Постановление Правительства РФ № 2463), если товар
      входит в этот перечень.
    addressee: "Юридический отдел продавца"

  delivery_cost_retention_clause:
    text: >
      Рекомендуем включить в {doc_names} условие об удержании расходов на обратную доставку
      при возврате товара надлежащего качества (п. 4 ст. 26.1 ЗоЗПП).
    addressee: "Юридический отдел продавца"

  food_expiration_info:
    text: >
      Просим обеспечить в {doc_names}: (а) указание срока годности и условий хранения;
      (б) порядок проверки при получении; (в) ответственность за доставку просроченных
      или испорченных продуктов; (г) соответствие ТР ТС 021/2011.
    addressee: "Продавец / Отдел качества"

  preorder_cancellation_right:
    text: >
      Просим уточнить в {doc_names}: (а) сроки поставки предзаказа; (б) право покупателя
      на отмену и возврат предоплаты; (в) неустойку за просрочку (0.5% в день по ст. 23.1 ЗоЗПП);
      (г) ограничение неустойки суммой предоплаты.
    addressee: "Продавец"

  subscription_auto_renewal_terms:
    text: >
      Просим уточнить в {doc_names}: (а) условия автопродления и уведомление о списании;
      (б) порядок отмены подписки (простой и понятный); (в) возврат денег
      при досрочном отказе; (г) право отказаться от автопродления.
    addressee: "Юридический отдел продавца"

  installment_credit_disclosure:
    text: >
      Просим раскрыть в {doc_names}: (а) полную стоимость кредита/рассрочки;
      (б) процентную ставку; (в) график платежей; (г) последствия просрочки;
      (д) порядок досрочного погашения (ФЗ-353).
    addressee: "Продавец / Кредитный отдел"

  digital_goods_return_limitation:
    text: >
      Просим уточнить в {doc_names}: (а) момент, после которого возврат цифрового товара
      невозможен; (б) уведомление покупателя об ограничении до момента акцепта;
      (в) порядок действий при обнаружении недостатков.
    addressee: "Юридический отдел продавца"

  extended_warranty_disclosure:
    text: >
      Просим уточнить в {doc_names}: (а) чем расширенная гарантия отличается от законной;
      (б) что именно покрывается; (в) стоимость; (г) что расширенная гарантия
      не подменяет и не ограничивает законные права потребителя.
    addressee: "Юридический отдел продавца"

  food_distance_delivery_safety:
    text: >
      Внимание: {doc_names} предусматривает дистанционную продажу продовольственных товаров.
      Просим предоставить: (а) документы о соблюдении температурного режима при доставке;
      (б) порядок проверки срока годности при передаче; (в) ответственность за нарушение
      условий хранения при транспортировке (ТР ТС 021/2011).
    addressee: "Продавец / Логистика / Служба качества"

  marketplace_consumer_info_obligation:
    text: >
      Внимание: {doc_names} предусматривает продажу через маркетплейс/агрегатор.
      Просим обеспечить: (а) полное раскрытие информации о каждом продавце (ст. 9 ЗоЗПП);
      (б) порядок предъявления претензий; (в) указание, кто несёт ответственность
      перед потребителем — маркетплейс или продавец.
    addressee: "Юридический отдел маркетплейса"

  food_distance_delivery_safety_check:
    text: >
      Для {doc_names} (дистанционная продажа продовольствия) просим согласовать:
      (а) требования к температурному режиму при доставке; (б) максимальное время доставки
      скоропортящихся продуктов; (в) условия упаковки и маркировки; (г) ответственность
      за порчу товара при доставке; (д) порядок проверки при получении (ТР ТС 021/2011).
    addressee: "Продавец / Логистика / Служба качества"

  marketplace_seller_info_disclosure:
    text: >
      Для {doc_names} (маркетплейс) просим обеспечить раскрытие информации о каждом
      продавце в соответствии со ст. 9, 12.1 ЗоЗПП: (а) наименование; (б) ОГРН/ОГРНИП;
      (в) адрес; (г) контактные данные для претензий; (д) указание, кто несёт ответственность
      перед потребителем в случае нарушения (солидарная ответственность агрегатора по ст. 12.1).
    addressee: "Юридический отдел маркетплейса"

  statutory_claim_period_disclosure:
    text: >
      Просим проверить {doc_names} на предмет ограничения сроков претензий:
      (а) не сокращён ли срок предъявления требований ниже 2 лет (ст. 19 ЗоЗПП);
      (б) не содержится ли формулировка «претензии принимаются только в пределах гарантийного срока»
      (ничтожна, если гарантия < 2 лет); (в) разъяснено ли, что при гарантии < 2 лет
      потребитель может предъявить требования в течение 2 лет (с бременем доказывания на себе).
    addressee: "Юридический отдел продавца"

  alcohol_distance_selling_prohibition:
    text: >
      Внимание: {doc_names} предусматривает дистанционную продажу алкогольной продукции,
      что ЗАПРЕЩЕНО ФЗ-171 (ст. 16 п. 2). Нарушение влечёт ответственность по ст. 14.16 КоАП РФ
      и аннулирование лицензии. Просим немедленно исключить алкогольную продукцию
      из ассортимента дистанционных продаж или предоставить правовое обоснование
      допустимости (пилотный проект, иное исключение).
    addressee: "Юридический отдел продавца / Комплаенс"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический отдел продавца"
