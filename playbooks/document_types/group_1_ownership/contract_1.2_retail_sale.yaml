        - ст. 493, 494, 497, 499 ГК РФ
        - ст. 23.1, 26.1 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 2463

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Момент заключения договора (акцепт, подтверждение заказа, выдача чека).
        2. Конкретный срок доставки.
        3. Стоимость доставки (конкретная или «бесплатно»).
        4. Способ передачи (курьер, ПВЗ, самовывоз).
        5. Порядок отмены заказа до передачи товара.
        6. Условие об удержании расходов на обратную доставку при возврате.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Договор считается заключённым с момента подтверждения заказа продавцом.
        Доставка осуществляется курьером в течение 3 рабочих дней. Стоимость доставки —
        350 рублей. Покупатель вправе отменить заказ до момента его передачи в службу доставки."

        Ответ:
        {
          "contract_formation_status": "defined",
          "contract_formation_details": "с момента подтверждения заказа продавцом",
          "delivery_term_status": "defined",
          "delivery_term_details": "в течение 3 рабочих дней",
          "delivery_cost_status": "defined",
          "delivery_cost_details": "350 рублей",
          "delivery_mode": "delivery",
          "cancellation_status": "defined",
          "cancellation_details": "до момента передачи в службу доставки",
          "return_delivery_cost_retention_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Договор считается заключённым с момента подтверждения заказа продавцом. Доставка осуществляется курьером в течение 3 рабочих дней."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Доставка осуществляется продавцом."

        Ответ:
        {
          "contract_formation_status": "not_defined",
          "contract_formation_details": "Данные не определены",
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Данные не определены",
          "delivery_cost_status": "not_defined",
          "delivery_cost_details": "Данные не определены",
          "delivery_mode": "not_defined",
          "cancellation_status": "not_defined",
          "cancellation_details": "Данные не определены",
          "return_delivery_cost_retention_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли конкретная формулировка о моменте заключения договора?
        2. Указан ли конкретный срок доставки (числом дней, датой)?
        3. Указана ли стоимость доставки (конкретная сумма или «бесплатно»)?
        4. Назван ли способ передачи (курьер, самовывоз, ПВЗ)?
        5. Указана ли возможность и условия отмены заказа?
        6. Упомянуто ли удержание расходов на обратную доставку при возврате?
        7. Если прямого текста нет — верни "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "contract_formation_status": "<defined / not_defined>",
          "contract_formation_details": "<текст или 'Данные не определены'>",
          "delivery_term_status": "<defined / not_defined>",
          "delivery_term_details": "<срок или 'Данные не определены'>",
          "delivery_cost_status": "<defined / not_defined>",
          "delivery_cost_details": "<стоимость или 'Данные не определены'>",
          "delivery_mode": "<delivery / pickup / carrier / not_defined>",
          "cancellation_status": "<defined / not_defined>",
          "cancellation_details": "<текст или 'Данные не определены'>",
          "return_delivery_cost_retention_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "заключение договора"
        - "акцепт"
        - "подтверждение заказа"
        - "доставка"
        - "срок доставки"
        - "самовывоз"
        - "отмена заказа"
        - "расходы на доставку"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contract_formation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определён момент заключения договора. Иначе 'not_defined'."
        - name: "contract_formation_details"
          type: "string"
          description: "Момент заключения договора. Если данных нет, верни строго: 'Данные не определены'."
        - name: "delivery_term_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определён срок доставки. Иначе 'not_defined'."
        - name: "delivery_term_details"
          type: "string"
          description: "Срок доставки. Если данных нет, верни строго: 'Данные не определены'."
        - name: "delivery_cost_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определена стоимость доставки. Иначе 'not_defined'."
        - name: "delivery_cost_details"
          type: "string"
          description: "Стоимость доставки. Если данных нет, верни строго: 'Данные не определены'."
        - name: "delivery_mode"
          type: "string"
          allowed_values: ["delivery", "pickup", "carrier", "not_defined"]
          description: "Способ передачи товара. Если не указан — 'not_defined'."
        - name: "cancellation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определён порядок отмены заказа. Иначе 'not_defined'."
        - name: "cancellation_details"
          type: "string"
          description: "Условия отмены заказа. Если данных нет, верни строго: 'Данные не определены'."
        - name: "return_delivery_cost_retention_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указано право продавца удержать расходы на обратную доставку. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Право на возврат и обмен товара
  # ──────────────────────────────────────────────────────────────────────────
  - id: return_exchange_consumer_rights_cluster
    name: "Право на возврат и обмен товара надлежащего качества"
    description: >
      Фактографическая проверка наличия информации о праве потребителя на возврат
      и обмен товара (14 дней / 7 дней), условиях возврата, порядке возврата денег
      и перечне невозвратных товаров.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат товара"
        - "обмен товара"
        - "в течение 14 дней"
        - "в течение 7 дней"
        - "надлежащее качество"
        - "право на отказ"
        - "товарный вид"
        - "потребительские свойства"
        - "Перечень № 2463"
        - "не подлежат обмену"
        - "не подлежат возврату"
        - "предметы личной гигиены"
        - "парфюмерия"
        - "нижнее бельё"
        - "ювелирные изделия"
        - "непродовольственные товары надлежащего качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*товар.*надлежащ"
        - "(?i)обмен.*непродовольственн"
        - "(?i)в\\s+течение\\s+(14|7)\\s+дней"
        - "(?i)товары.*не\\s+подлежащ(ие|их)\\s+обмену"
        - "(?i)Постановлени(е|я).*2463"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: право потребителя на возврат и обмен товара.

        Нормативный ориентир:
        - ст. 25, 26.1 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 2463

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Право на обмен или возврат в течение 14 дней (ст. 25 ЗоЗПП).
        2. Право на возврат в течение 7 дней (дистанционная продажа, ст. 26.1 ЗоЗПП).
        3. Условия возврата (товарный вид, сохранность упаковки, чек).
        4. Порядок и срок возврата денег покупателю.
        5. Упоминание о невозвратных товарах (перечень, ссылка на Постановление № 2463).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Покупатель вправе обменять товар надлежащего качества в течение 14 дней.
        При дистанционной продаже — в течение 7 дней с момента получения.
        Возврат денег производится в течение 10 дней. Товары из Перечня
        Постановления № 2463 обмену не подлежат."

        Ответ:
        {
          "return_14_days_status": "defined",
          "return_14_days_details": "в течение 14 дней",
          "return_7_days_status": "defined",
          "return_7_days_details": "в течение 7 дней с момента получения",
          "return_conditions_status": "not_defined",
          "return_conditions_details": "Данные не определены",
          "refund_procedure_status": "defined",
          "refund_procedure_details": "в течение 10 дней",
          "non_returnable_goods_status": "defined",
          "non_returnable_goods_details": "товары из Перечня Постановления № 2463",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Покупатель вправе обменять товар надлежащего качества в течение 14 дней. При дистанционной продаже — в течение 7 дней с момента получения."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Возврат товара осуществляется в соответствии с действующим законодательством."

        Ответ:
        {
          "return_14_days_status": "not_defined",
          "return_14_days_details": "Данные не определены",
          "return_7_days_status": "not_defined",
          "return_7_days_details": "Данные не определены",
          "return_conditions_status": "not_defined",
          "return_conditions_details": "Данные не определены",
          "refund_procedure_status": "not_defined",
          "refund_procedure_details": "Данные не определены",
          "non_returnable_goods_status": "not_defined",
          "non_returnable_goods_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли явный срок «14 дней» для обмена/возврата?
        2. Есть ли явный срок «7 дней» для дистанционной продажи?
        3. Указаны ли конкретные условия возврата (состояние товара, документы)?
        4. Указан ли срок возврата денег покупателю?
        5. Упомянут ли Перечень № 2463 или конкретные категории невозвратных товаров?
        6. Общая ссылка на «законодательство» — это NOT defined.
        7. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "return_14_days_status": "<defined / not_defined>",
          "return_14_days_details": "<текст или 'Данные не определены'>",
          "return_7_days_status": "<defined / not_defined>",
          "return_7_days_details": "<текст или 'Данные не определены'>",
          "return_conditions_status": "<defined / not_defined>",
          "return_conditions_details": "<текст или 'Данные не определены'>",
          "refund_procedure_status": "<defined / not_defined>",
          "refund_procedure_details": "<текст или 'Данные не определены'>",
          "non_returnable_goods_status": "<defined / not_defined>",
          "non_returnable_goods_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "возврат"
        - "обмен"
        - "14 дней"
        - "7 дней"
        - "надлежащее качество"
        - "товарный вид"
        - "невозвратный"
        - "Постановление 2463"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "return_14_days_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указан 14-дневный срок возврата/обмена. Иначе 'not_defined'."
        - name: "return_14_days_details"
          type: "string"
          description: "Условия 14-дневного возврата. Если данных нет, верни строго: 'Данные не определены'."
        - name: "return_7_days_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указан 7-дневный срок возврата при дистанционной продаже. Иначе 'not_defined'."
        - name: "return_7_days_details"
          type: "string"
          description: "Условия 7-дневного возврата. Если данных нет, верни строго: 'Данные не определены'."
        - name: "return_conditions_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определены условия возврата (состояние товара, документы). Иначе 'not_defined'."
        - name: "return_conditions_details"
          type: "string"
          description: "Условия возврата. Если данных нет, верни строго: 'Данные не определены'."
        - name: "refund_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо определён порядок и срок возврата денег. Иначе 'not_defined'."
        - name: "refund_procedure_details"
          type: "string"
          description: "Порядок возврата денег. Если данных нет, верни строго: 'Данные не определены'."
        - name: "non_returnable_goods_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе упомянуты невозвратные товары или ссылка на Постановление № 2463. Иначе 'not_defined'."
        - name: "non_returnable_goods_details"
          type: "string"
          description: "Категории невозвратных товаров. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Ущемляющие условия (детектор фраз)
  # ──────────────────────────────────────────────────────────────────────────
  - id: illegal_restrictions_detection
    name: "Выявление ущемляющих условий (детектор запрещённых фраз)"
    description: >
      Детекторная проверка наличия в тексте конкретных запрещённых формулировок,
      ограничивающих права потребителя (ст. 16, 17 ЗоЗПП). Не оценивает "степень
      нарушения" — только фиксирует факт наличия или отсутствия запрещённых фраз.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат невозможен"
        - "обмену не подлежит"
        - "только ремонт"
        - "претензии принимаются в течение 3 дней"
        - "не принимаются претензии"
        - "гарантия не предоставляется"
        - "ответственность ограничена стоимостью товара"
        - "продавец не несёт ответственности"
        - "экспертиза за счёт покупателя"
        - "обязательный арбитраж"
        - "третейский суд"
        - "товар по акции обмену не подлежит"
        - "возврат товара по акции невозможен"
        - "обязательное приобретение"
        - "дополнительные услуги обязательны"
        - "обязательная страховка"
        - "только в комплекте"
      keyword_mode: "any"
      negative_keywords:
        - "по желанию покупателя"
        - "дополнительно по выбору"
        - "опционально"
      regex_patterns:
        - "(?i)не\\s*принимаются\\s*претензии.*после.*дней"
        - "(?i)ответственность.*ограничена.*стоимостью"
        - "(?i)возврат.*невозможен|обмену.*не\\s*подлежит"
        - "(?i)гарантия.*не\\s*(предоставляется|распространяется)"
        - "(?i)только\\s+по\\s+месту\\s+нахождения\\s+продавца"
        - "(?i)обязательн.*третейск.*суд"
        - "(?i)обязательн(ое|ая|ый)\\s+(приобретение|покупка|страхов|подключен)"
        - "(?i)только\\s+в\\s+комплекте"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: наличие в тексте формулировок, ограничивающих
        права потребителя сверх того, что допускает закон.

        Нормативный ориентир:
        - ст. 16, 17 Закона РФ «О защите прав потребителей»
        - ст. 14.8 КоАП РФ

        Важно:
        - Твоя задача — НЕ оценивать "насколько это плохо".
        - Твоя задача — найти конкретные фразы-маркеры и зафиксировать их наличие.
        - Если таких фраз нет — результат "no".
        - Юрист сам решит, требует ли это правки.

        [ЗАДАЧА]
        Найди в тексте документа явное наличие следующих типов ограничений:
        1. Запрет на возврат или обмен товара надлежащего качества.
        2. Ограничение права потребителя на выбор (только ремонт, без замены или возврата).
        3. Обязательная платная экспертиза за счёт покупателя.
        4. Навязывание подсудности исключительно по месту нахождения продавца.
        5. Обязательный третейский суд или арбитраж для потребительских споров.
        6. Навязывание дополнительных товаров, услуг или страховки как обязательного условия покупки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Фиксируй только прямые формулировки, а не домысливаемые ограничения.
        3. Если ограничение есть — found = "yes", с точной цитатой.
        4. Если ограничений нет — found = "no", found_phrases = [], evidence = [].
        5. В evidence включай только цитаты из документа.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ограничения найдены:
        Фрагмент:
        "Товары, приобретённые в период акции, обмену и возврату не подлежат.
        Гарантийное обслуживание осуществляется только в форме ремонта."

        Ответ:
        {
          "illegal_restrictions_found": "yes",
          "restriction_return_found": "yes",
          "restriction_repair_only_found": "yes",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "no",
          "restriction_tying_found": "no",
          "found_phrases": [
            "Товары, приобретённые в период акции, обмену и возврату не подлежат.",
            "Гарантийное обслуживание осуществляется только в форме ремонта."
          ],
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Товары, приобретённые в период акции, обмену и возврату не подлежат."
            },
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийное обслуживание осуществляется только в форме ремонта."
            }
          ]
        }

        Пример 2 — ограничений не найдено:
        Фрагмент:
        "Потребитель вправе вернуть товар надлежащего качества в течение 14 дней."

        Ответ:
        {
          "illegal_restrictions_found": "no",
          "restriction_return_found": "no",
          "restriction_repair_only_found": "no",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "no",
          "restriction_tying_found": "no",
          "found_phrases": [],
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямая фраза "не подлежит возврату/обмену" (кроме случаев по закону)?
        2. Есть ли слова "только ремонт" без права выбора другого способа?
        3. Есть ли фраза "экспертиза за счёт покупателя" как обязательное условие?
        4. Указан ли конкретный суд по месту продавца как единственный вариант?
        5. Упомянут ли обязательный третейский суд?
        6. Есть ли условие об обязательной страховке или доп. услуге как условии покупки?
        7. Если ни одного из вышеперечисленного нет — illegal_restrictions_found = "no".
        8. Не придумывай ограничения. Фиксируй только то, что прямо написано.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "illegal_restrictions_found": "<yes / no>",
          "restriction_return_found": "<yes / no>",
          "restriction_repair_only_found": "<yes / no>",
          "restriction_expertise_found": "<yes / no>",
          "restriction_jurisdiction_found": "<yes / no>",
          "restriction_arbitration_found": "<yes / no>",
          "restriction_tying_found": "<yes / no>",
          "found_phrases": ["<список найденных фраз или пустой массив []>"],
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "возврат невозможен"
        - "не подлежит"
        - "только ремонт"
        - "обязательный"
        - "третейский"
        - "подсудность"
        - "за счёт покупателя"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "limitations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "illegal_restrictions_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Верни 'yes', если найдена хотя бы одна ущемляющая формулировка. Иначе 'no'."
        - name: "restriction_return_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найден ли запрет на возврат/обмен товара надлежащего качества."
        - name: "restriction_repair_only_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найдено ли ограничение 'только ремонт' без права выбора."
        - name: "restriction_expertise_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найдено ли условие об обязательной экспертизе за счёт покупателя."
        - name: "restriction_jurisdiction_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найдено ли навязывание подсудности по месту продавца."
        - name: "restriction_arbitration_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найден ли обязательный третейский суд или арбитраж."
        - name: "restriction_tying_found"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Найдено ли навязывание доп. товаров/услуг как условия покупки."
        - name: "found_phrases"
          type: "array"
          description: "Список найденных запрещённых формулировок. Если ничего нет — пустой массив []."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Гарантия и права при недостатках
  # ──────────────────────────────────────────────────────────────────────────
  - id: warranty_and_defects_rights_check
    name: "Гарантийный срок и права потребителя при недостатках товара"
    description: >
      Фактографическая проверка наличия гарантийного срока, полноты перечня прав
      потребителя при недостатках (ремонт, замена, возврат, уменьшение цены)
      и отсутствия незаконных ограничений гарантийного срока.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "недостаток товара"
        - "безвозмездное устранение"
        - "замена товара"
        - "возврат уплаченной суммы"
        - "соразмерное уменьшение"
        - "ремонт"
        - "гарантийное обслуживание"
        - "гарантийный талон"
        - "сервисный центр"
        - "срок службы"
        - "в течение 2 лет"
        - "расширенная гарантия"
        - "дополнительная гарантия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)при\\s+обнаружении\\s+недостатк"
        - "(?i)потребитель\\s+вправе\\s+(потребовать|требовать)"
        - "(?i)гарантия.*?(\\d+\\s*(мес|год|лет|дн))"
        - "(?i)расширенн(ая|ой)\\s+гарант"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: гарантийный срок и права потребителя при недостатках товара.

        Нормативный ориентир:
        - ст. 18-24 Закона РФ «О защите прав потребителей»
        - ст. 19 ЗоЗПП (двухлетний срок требований)
        - ст. 470-477 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Гарантийный срок (числовое значение).
        2. Перечень прав потребителя при обнаружении недостатков.
        3. Наличие расширенной (дополнительной) гарантии.
        4. Условие о 2-летнем сроке предъявления требований.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Гарантийный срок составляет 12 месяцев с даты передачи товара. При обнаружении
        недостатков покупатель вправе потребовать ремонта, замены товара или возврата
        уплаченной суммы по своему выбору."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "12 месяцев с даты передачи товара",
          "remedies_listed_status": "defined",
          "remedies_details": "ремонт, замена товара, возврат уплаченной суммы по выбору",
          "extended_warranty_status": "not_defined",
          "two_year_term_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийный срок составляет 12 месяцев с даты передачи товара. При обнаружении недостатков покупатель вправе потребовать ремонта, замены товара или возврата уплаченной суммы по своему выбору."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Гарантия предоставляется в соответствии с законодательством."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Данные не определены",
          "remedies_listed_status": "not_defined",
          "remedies_details": "Данные не определены",
          "extended_warranty_status": "not_defined",
          "two_year_term_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли конкретный срок гарантии (месяцы, годы)?
        2. Перечислены ли конкретные права при недостатках (не просто "в соответствии с законом")?
        3. Упомянута ли расширенная/дополнительная гарантия?
        4. Упомянут ли 2-летний срок предъявления требований?
        5. "В соответствии с законодательством" — это NOT defined.
        6. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<срок гарантии или 'Данные не определены'>",
          "remedies_listed_status": "<defined / not_defined>",
          "remedies_details": "<перечень прав или 'Данные не определены'>",
          "extended_warranty_status": "<defined / not_defined>",
          "two_year_term_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "гарантия"
        - "гарантийный срок"
        - "недостаток"
        - "ремонт"
        - "замена"
        - "возврат"
        - "уменьшение цены"
        - "расширенная гарантия"
        - "2 года"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "warranty_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указан гарантийный срок. Иначе 'not_defined'."
        - name: "warranty_details"
          type: "string"
          description: "Гарантийный срок. Если данных нет, верни строго: 'Данные не определены'."
        - name: "remedies_listed_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо перечислены права потребителя при недостатках. Иначе 'not_defined'."
        - name: "remedies_details"
          type: "string"
          description: "Перечень прав при недостатках. Если данных нет, верни строго: 'Данные не определены'."
        - name: "extended_warranty_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе упомянута расширенная гарантия. Иначе 'not_defined'."
        - name: "two_year_term_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо упомянут 2-летний срок требований. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Персональные данные (ФЗ-152)
  # ──────────────────────────────────────────────────────────────────────────
  - id: personal_data_processing_check
    name: "Обработка персональных данных покупателя"
    description: >
      Фактографическая проверка наличия механизма согласия на обработку ПД,
      целей обработки, перечня данных и порядка отзыва согласия.
    triggers:
      any: ["distance_selling", "subscription_model", "marketplace_platform"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "персональные данные"
        - "согласие на обработку"
        - "обработка данных"
        - "политика конфиденциальности"
        - "ФЗ-152"
        - "оператор персональных данных"
        - "cookie"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ые|ых)\\s+данн(ые|ых)"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"
        - "(?i)ФЗ[\\s\\-]*152"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется публичная оферта / договор розничной купли-продажи.
        Проверяется только один вопрос: обработка персональных данных покупателя.

        Нормативный ориентир:
        - ФЗ от 27.07.2006 № 152-ФЗ «О персональных данных», ст. 6, 9

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Механизм получения согласия на обработку ПД (галочка, кнопка, отдельная форма).
        2. Цели обработки персональных данных.
        3. Порядок отзыва согласия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Нажимая кнопку «Оформить заказ», покупатель даёт согласие на обработку
        персональных данных в целях исполнения договора и направления уведомлений.
        Отзыв согласия направляется на адрес privacy@shop.ru."

        Ответ:
        {
          "consent_status": "defined",
          "consent_details": "нажатие кнопки «Оформить заказ»",
          "purposes_status": "defined",
          "purposes_details": "исполнение договора и направление уведомлений",
          "withdrawal_status": "defined",
          "withdrawal_details": "направление на адрес privacy@shop.ru",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Нажимая кнопку «Оформить заказ», покупатель даёт согласие на обработку персональных данных в целях исполнения договора и направления уведомлений."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Обработка персональных данных осуществляется в соответствии с ФЗ-152."

        Ответ:
        {
          "consent_status": "not_defined",
          "consent_details": "Данные не определены",
          "purposes_status": "not_defined",
          "purposes_details": "Данные не определены",
          "withdrawal_status": "not_defined",
          "withdrawal_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Указан ли конкретный механизм согласия (не просто "согласен с политикой")?
        2. Перечислены ли конкретные цели обработки (не "в соответствии с законом")?
        3. Указан ли порядок отзыва согласия (email, форма, адрес)?
        4. Ссылка только на ФЗ-152 без деталей — это NOT defined.
        5. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "consent_status": "<defined / not_defined>",
          "consent_details": "<механизм согласия или 'Данные не определены'>",
          "purposes_status": "<defined / not_defined>",
          "purposes_details": "<цели обработки или 'Данные не определены'>",
          "withdrawal_status": "<defined / not_defined>",
          "withdrawal_details": "<порядок отзыва или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
