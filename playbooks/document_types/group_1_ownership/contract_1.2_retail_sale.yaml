        2. Не подставляй нормы закона вместо текста документа.
        3. Если данные не указаны прямо — возвращай "not_defined" или "Данные не определены" строго по схеме.
        4. В evidence включай только цитаты из документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001, адрес: г. Москва, ул. Ленина, д. 1."

        Ответ:
        {
          "seller_name_status": "defined",
          "seller_name_value": "ООО «Ромашка»",
          "seller_ogrn_status": "defined",
          "seller_ogrn_value": "1027700000001",
          "seller_inn_status": "defined",
          "seller_inn_value": "7700000001",
          "seller_address_status": "defined",
          "seller_address_value": "г. Москва, ул. Ленина, д. 1",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001, адрес: г. Москва, ул. Ленина, д. 1."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящая оферта регулирует условия продажи товаров."

        Ответ:
        {
          "seller_name_status": "not_defined",
          "seller_name_value": "Данные не определены",
          "seller_ogrn_status": "not_defined",
          "seller_ogrn_value": "Данные не определены",
          "seller_inn_status": "not_defined",
          "seller_inn_value": "Данные не определены",
          "seller_address_status": "not_defined",
          "seller_address_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое наименование продавца?
        2. Есть ли числовой ОГРН/ОГРНИП?
        3. Есть ли числовой ИНН?
        4. Есть ли конкретный адрес продавца?
        5. Если прямого текста нет — верни "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_name_status": "<defined / not_defined>",
          "seller_name_value": "<наименование или 'Данные не определены'>",
          "seller_ogrn_status": "<defined / not_defined>",
          "seller_ogrn_value": "<ОГРН/ОГРНИП или 'Данные не определены'>",
          "seller_inn_status": "<defined / not_defined>",
          "seller_inn_value": "<ИНН или 'Данные не определены'>",
          "seller_address_status": "<defined / not_defined>",
          "seller_address_value": "<адрес или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560
    retrieval:
