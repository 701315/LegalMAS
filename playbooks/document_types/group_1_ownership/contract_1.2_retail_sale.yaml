# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Реквизиты Продавца
  # ──────────────────────────────────────────────────────────────────────────
  - id: seller_identification_cluster
    name: "Идентификация продавца"
    description: >
      Фактографическая проверка наличия реквизитов продавца:
      наименование, ОГРН/ОГРНИП, ИНН и адрес.
      Предназначена для табличного вывода по нескольким офертам
      без оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "ОГРН"
        - "ОГРНИП"
        - "ИНН"
        - "адрес продавца"
