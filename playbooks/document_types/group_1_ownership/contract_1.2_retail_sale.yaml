  - id: illegal_restrictions_detection
    name: "Выявление ущемляющих условий (детектор запрещённых фраз)"
    description: >
      Детекторная проверка наличия в тексте конкретных запрещённых формулировок,
      ограничивающих права потребителя (ст. 16, 17 ЗоЗПП). Не оценивает "степень
      нарушения" — только фиксирует факт наличия или отсутствия запрещённых фраз.
    triggers: {}
    ui_mode: "risk_detection"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат невозможен"
        - "обмену не подлежит"
        - "только ремонт"
        - "претензии принимаются в течение 3 дней"
        - "не принимаются претензии"
        - "гарантия не предоставляется"
        - "ответственность ограничена стоимостью товара"
        - "продавец не несёт ответственности"
        - "экспертиза за счёт покупателя"
        - "обязательный арбитраж"
        - "третейский суд"
        - "товар по акции обмену не подлежит"
        - "возврат товара по акции невозможен"
        - "обязательное приобретение"
        - "дополнительные услуги обязательны"
        - "обязательная страховка"
        - "только в комплекте"
      keyword_mode: "any"
      negative_keywords:
        - "по желанию покупателя"
        - "дополнительно по выбору"
        - "опционально"
      regex_patterns:
        - "(?i)не\\s*принимаются\\s*претензии.*после.*дней"
        - "(?i)ответственность.*ограничена.*стоимостью"
        - "(?i)возврат.*невозможен|обмену.*не\\s*подлежит"
        - "(?i)гарантия.*не\\s*(предоставляется|распространяется)"
        - "(?i)только\\s+по\\s+месту\\s+нахождения\\s+продавца"
        - "(?i)обязательн.*третейск.*суд"
        - "(?i)обязательн(ое|ая|ый)\\s+(приобретение|покупка|страхов|подключен)"
        - "(?i)только\\s+в\\s+комплекте"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: наличие в тексте формулировок,
        ограничивающих права потребителя сверх того, что допускает закон.

        Нормативный ориентир:
        - ст. 16, 17 Закона РФ «О защите прав потребителей»
        - ст. 14.8 КоАП РФ

        Важно:
        - Твоя задача — НЕ оценивать "насколько это плохо".
        - Твоя задача — найти конкретные прямые фразы-маркеры и зафиксировать их наличие.
        - Если таких фраз нет — результат "no".
        - Юрист сам решит, требует ли это правки.

        [ЗАДАЧА]
        Найди в тексте документа прямые формулировки следующих типов ограничений:
        1. Запрет на возврат или обмен товара надлежащего качества
           (кроме законных исключений — товары из Перечня № 2463).
        2. Ограничение права потребителя на выбор способа защиты:
           только ремонт, без права на замену или возврат денег.
        3. Обязательная платная экспертиза за счёт покупателя как условие
           рассмотрения претензии.
        4. Навязывание подсудности исключительно по месту нахождения продавца.
        5. Обязательный третейский суд или арбитраж для потребительских споров.
        6. Навязывание дополнительных товаров, услуг или страховки как
           обязательного условия покупки.

        [ЧТО НЕ ЯВЛЯЕТСЯ НАРУШЕНИЕМ]
        Следующие формулировки не считаются нарушением и не должны
        попадать в found:
        - "не подлежит возврату" применительно к товарам из Перечня
          Постановления № 2463 или иного прямо названного нормативного акта.
        - "только ремонт" применительно к гарантийному обслуживанию,
          если текст прямо ссылается на законный порядок и не лишает
          покупателя права выбора из ст. 18 ЗоЗПП.
        - "в соответствии с законодательством РФ" без дополнительного
          ограничения — это не запрет.
        - Добровольные дополнительные услуги ("по желанию", "опционально",
          "по выбору покупателя") — не навязывание.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Фиксируй только прямые формулировки, а не домысливаемые ограничения.
        3. Если ограничение есть — found = "yes", с точной цитатой.
        4. Если ограничений нет — found = "no".
        5. В evidence включай только цитаты из документа.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — нарушения найдены:
        Фрагмент:
        "Товары, приобретённые в период акции, обмену и возврату не подлежат.
        Гарантийное обслуживание осуществляется только в форме ремонта
        без права покупателя требовать замены товара или возврата денег."

        Ответ:
        {
          "illegal_restrictions_found": "yes",
          "restriction_return_found": "yes",
          "restriction_repair_only_found": "yes",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "no",
          "restriction_tying_found": "no",
          "found_phrases": "Товары, приобретённые в период акции, обмену и возврату не подлежат.; Гарантийное обслуживание осуществляется только в форме ремонта без права покупателя требовать замены товара или возврата денег.",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Товары, приобретённые в период акции, обмену и возврату не подлежат."
            },
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийное обслуживание осуществляется только в форме ремонта без права покупателя требовать замены товара или возврата денег."
            }
          ]
        }

        Пример 2 — законное исключение, нарушения нет:
        Фрагмент:
        "Товары надлежащего качества из Перечня Постановления Правительства РФ
        № 2463 обмену не подлежат."

        Ответ:
        {
          "illegal_restrictions_found": "no",
          "restriction_return_found": "no",
          "restriction_repair_only_found": "no",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "no",
          "restriction_tying_found": "no",
          "found_phrases": "Не выявлено",
          "evidence": []
        }

        Пример 3 — навязывание услуги и арбитраж:
        Фрагмент:
        "Покупка товара возможна только при условии оформления страхового
        полиса. Все споры подлежат рассмотрению в обязательном порядке
        третейским судом."

        Ответ:
        {
          "illegal_restrictions_found": "yes",
          "restriction_return_found": "no",
          "restriction_repair_only_found": "no",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "yes",
          "restriction_tying_found": "yes",
          "found_phrases": "Покупка товара возможна только при условии оформления страхового полиса.; Все споры подлежат рассмотрению в обязательном порядке третейским судом.",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Покупка товара возможна только при условии оформления страхового полиса."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Все споры подлежат рассмотрению в обязательном порядке третейским судом."
            }
          ]
        }

        Пример 4 — нарушений нет:
        Фрагмент:
        "Потребитель вправе вернуть товар надлежащего качества в течение 14 дней.
        Споры разрешаются в соответствии с законодательством РФ."

        Ответ:
        {
          "illegal_restrictions_found": "no",
          "restriction_return_found": "no",
          "restriction_repair_only_found": "no",
          "restriction_expertise_found": "no",
          "restriction_jurisdiction_found": "no",
          "restriction_arbitration_found": "no",
          "restriction_tying_found": "no",
          "found_phrases": "Не выявлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая фраза о запрете возврата/обмена вне законных исключений?
        2. Есть ли ограничение права выбора: только ремонт без замены и возврата?
        3. Есть ли обязательная экспертиза за счёт покупателя?
        4. Есть ли навязанная подсудность только по месту продавца?
        5. Есть ли обязательный третейский суд для потребительских споров?
        6. Есть ли условие об обязательной доп. услуге или страховке?
        7. Если все — нет: illegal_restrictions_found = "no",
           found_phrases = "Не выявлено".
        8. Не придумывай ограничения. Фиксируй только прямые формулировки.
        9. Ссылка на Перечень № 2463 — законное исключение, не нарушение.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "illegal_restrictions_found": "<yes|no>",
          "restriction_return_found": "<yes|no>",
          "restriction_repair_only_found": "<yes|no>",
          "restriction_expertise_found": "<yes|no>",
          "restriction_jurisdiction_found": "<yes|no>",
          "restriction_arbitration_found": "<yes|no>",
          "restriction_tying_found": "<yes|no>",
          "found_phrases": "<цитаты через '; ' | 'Не выявлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат невозможен обмену не подлежит только ремонт претензии не принимаются гарантия не предоставляется ответственность ограничена экспертиза за счёт покупателя обязательный арбитраж третейский суд товар по акции обмену не подлежит обязательная страховка только в комплекте дополнительные услуги обязательны"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - obligations
      negative_keywords:
        - "вправе по своему выбору"
        - "по желанию покупателя"
        - "дополнительно по выбору"
        - "опционально"
        - "в соответствии с законодательством"
        - "в соответствии с законом"
        - "ОГРН"
        - "ИНН"
        - "персональные данные"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Найди в тексте оферты прямые формулировки,
        которые ущемляют права потребителя сверх того, что допускает закон.
        Не оценивай степень нарушения.
        Фиксируй только прямые запрещённые формулировки, а не свои интерпретации.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. illegal_restrictions_found:
           - "yes" — если найдена хотя бы одна прямая запрещённая формулировка;
           - "no" — если таких формулировок не найдено.

        2. restriction_return_found:
           - "yes" — если в тексте есть прямой запрет на возврат или обмен
             товара надлежащего качества вне законных исключений;
           - "no" — в остальных случаях.
           Важно: формулировка "не подлежит возврату" применительно к товарам
           из Перечня Постановления № 2463 или иного прямо названного
           нормативного акта — это законное исключение, а не нарушение.

        3. restriction_repair_only_found:
           - "yes" — если право выбора покупателя прямо ограничено только
             ремонтом без права требовать замены товара или возврата денег;
           - "no" — в остальных случаях.
           Важно: "гарантийный ремонт" или "ремонт в рамках гарантии" без
           прямого лишения покупателя права выбора из ст. 18 ЗоЗПП — не нарушение.

        4. restriction_expertise_found:
           - "yes" — если в тексте прямо установлено, что экспертиза товара
             проводится за счёт покупателя как обязательное условие рассмотрения
             претензии;
           - "no" — в остальных случаях.

        5. restriction_jurisdiction_found:
           - "yes" — если в тексте прямо установлено, что споры рассматриваются
             исключительно по месту нахождения продавца, без альтернативы
             для покупателя;
           - "no" — в остальных случаях.

        6. restriction_arbitration_found:
           - "yes" — если в тексте прямо установлено, что потребительские споры
             в обязательном порядке рассматриваются третейским судом
             или арбитражем;
           - "no" — в остальных случаях.

        7. restriction_tying_found:
           - "yes" — если покупка товара прямо обусловлена обязательным
             приобретением иных товаров, услуг или оформлением страховки;
           - "no" — в остальных случаях.
           Важно: добровольные дополнительные услуги ("по желанию",
           "опционально", "по выбору покупателя") — не нарушение.

        8. found_phrases:
           Строка с найденными нарушениями.
           Правила:
           - если нарушения найдены, перечисли точные краткие цитаты
             через "; ", например:
             "Товары по акции обмену не подлежат.; Покупка возможна только
             при оформлении страхового полиса.";
           - цитаты должны быть краткими и точными — не длиннее 1–2 предложений
             каждая;
           - если нарушений не найдено — "Не выявлено".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Фиксируй только прямые запрещённые формулировки, а не косвенные
          или домысливаемые ограничения.
        - Не интерпретируй нейтральные или законные условия как нарушения.
        - Следующие формулировки не являются нарушением:
          * "не подлежит возврату" применительно к товарам из Перечня № 2463
            или иного прямо названного нормативного акта;
          * "ремонт" или "гарантийный ремонт" без прямого лишения покупателя
            права выбора иного способа защиты;
          * "в соответствии с законодательством РФ" — общая ссылка на закон;
          * добровольные доп. услуги с явным указанием на выбор покупателя.
        - Если ограничение неоднозначно и его нарушающий характер нельзя
          установить по тексту без интерпретации — не считай его нарушением.
        - Если нарушений не найдено:
          * все yes/no поля → "no";
          * found_phrases → "Не выявлено".
        - Не используй пустые строки, null или None.
        - Все значения пиши на русском языке.
        - Даже для полей, помеченных как required: false,
          всегда возвращай ключ с корректным значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для всех yes/no полей используй только: "yes" или "no".
        - Для found_phrases при отсутствии нарушений используй: "Не выявлено".
        - Для found_phrases при наличии нарушений используй строку
          с цитатами через "; ".
        </output_expectations>
      fields:
        - name: "illegal_restrictions_found"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          display_in_grid: false
