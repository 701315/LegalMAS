  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Цена и порядок расчетов
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_price_payment_cluster
    name: "Цена товара и порядок расчетов"
    description: >
      Фактографическая проверка наличия цены, способов оплаты, условий предоплаты
      и последствий просрочки оплаты. Предназначена для табличного вывода
      по нескольким офертам без правовой оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "рублей"
        - "оплата"
        - "итого"
        - "способ оплаты"
        - "банковская карта"
        - "наличный расчёт"
        - "безналичный расчёт"
        - "электронный кошелёк"
        - "онлайн-оплата"
        - "предоплата"
        - "аванс"
        - "полная оплата"
        - "частичная оплата"
        - "возврат предоплаты"
        - "предварительная оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)стоимость.*?\\d"
        - "(?i)способ(ы)?\\s+оплат"
        - "(?i)банковск(ая|ой)\\s+карт"
        - "(?i)пред(варительн(ая|ой)|оплат)"
        - "(?i)возврат.*предоплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта по § 2 Главы 30 ГК РФ.
        Проверяется только один вопрос: цена товара и порядок расчетов.

        Нормативный ориентир:
        - ст. 500 ГК РФ
        - ст. 16.1, 23.1 Закона РФ «О защите прав потребителей»
        - ст. 487 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким офертам.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Указана ли цена товара (конкретная сумма или механизм её определения).
        2. Указаны ли способы оплаты.
        3. Предусмотрена ли предоплата — полная или частичная.
        4. Указан ли порядок возврата предоплаты при отказе покупателя.
        5. Указаны ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Цена товара составляет 3 500 рублей, включая НДС. Оплата производится банковской
        картой или наличными. Предоплата составляет 100% от стоимости заказа."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "3 500 рублей, включая НДС",
          "payment_methods_status": "defined",
          "payment_methods_details": "банковская карта или наличные",
          "prepayment_status": "defined",
          "prepayment_details": "100% от стоимости заказа",
          "prepayment_refund_status": "not_defined",
          "prepayment_refund_details": "Данные не определены",
          "late_payment_consequences_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена товара составляет 3 500 рублей, включая НДС. Оплата производится банковской картой или наличными. Предоплата составляет 100% от стоимости заказа."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Покупатель оплачивает товар в соответствии с условиями, согласованными
        при оформлении заказа."

        Ответ:
        {
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "payment_methods_status": "not_defined",
          "payment_methods_details": "Данные не определены",
          "prepayment_status": "not_defined",
          "prepayment_details": "Данные не определены",
          "prepayment_refund_status": "not_defined",
          "prepayment_refund_details": "Данные не определены",
          "late_payment_consequences_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли конкретная цена (сумма в рублях) или формула её расчёта?
        2. Перечислены ли конкретные способы оплаты?
        3. Указано ли прямо, что оплата производится до передачи товара?
        4. Есть ли условие о том, что происходит с предоплатой при отказе?
        5. Упомянуты ли неустойка или пени за просрочку оплаты?
        6. Если прямого текста нет — верни "not_defined" и "Данные не определены".
        7. Убедись, что evidence содержит только текст документа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "price_status": "<defined / not_defined>",
          "price_details": "<цена или 'Данные не определены'>",
          "payment_methods_status": "<defined / not_defined>",
          "payment_methods_details": "<способы оплаты или 'Данные не определены'>",
          "prepayment_status": "<defined / not_defined>",
          "prepayment_details": "<условия предоплаты или 'Данные не определены'>",
          "prepayment_refund_status": "<defined / not_defined>",
          "prepayment_refund_details": "<порядок возврата или 'Данные не определены'>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "цена"
        - "стоимость"
        - "оплата"
        - "способ оплаты"
        - "предоплата"
        - "аванс"
        - "возврат предоплаты"
        - "банковская карта"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "price_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указана цена товара. Иначе 'not_defined'."
        - name: "price_details"
          type: "string"
          description: "Цена товара. Если данных нет, верни строго: 'Данные не определены'."
        - name: "payment_methods_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо указаны способы оплаты. Иначе 'not_defined'."
        - name: "payment_methods_details"
          type: "string"
          description: "Способы оплаты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "prepayment_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в документе прямо предусмотрена предоплата. Иначе 'not_defined'."
        - name: "prepayment_details"
          type: "string"
          description: "Условия предоплаты. Если данных нет, верни строго: 'Данные не определены'."
