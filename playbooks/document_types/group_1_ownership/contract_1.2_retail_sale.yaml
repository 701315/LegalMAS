          "tst_15_days_status": "defined",
          "tst_15_days_details": "в течение 15 дней при любом недостатке",
          "tst_regulation_924_status": "defined",
          "tst_substantial_defect_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Технически сложные товары (согласно Постановлению № 924) в течение 15 дней подлежат возврату при любом недостатке."
            }
