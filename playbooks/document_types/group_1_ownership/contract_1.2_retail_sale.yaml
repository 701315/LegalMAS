        Анализируется оферта интернет-магазина / договор дистанционной продажи.
        Проверяется только один вопрос: наличие обязательных элементов дистанционной продажи.

        Нормативный ориентир:
        - ст. 26.1 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 2463

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте документа, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Право отказаться от товара в течение 7 дней с момента передачи.
        2. Право отказаться до передачи товара в любое время.
        3. Указание на 3-месячный срок при ненадлежащем информировании о возврате.
        4. Срок возврата денег (по закону — не позднее 10 дней).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста документа.
        3. Не оценивай документ.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст документа.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные найдены:
        Фрагмент:
        "Покупатель вправе отказаться от товара надлежащего качества в течение
        7 дней с момента его получения, а до момента доставки — в любое время.
        Денежные средства возвращаются в течение 10 дней."

        Ответ:
        {
          "return_7_days_from_receipt_status": "defined",
          "return_7_days_details": "в течение 7 дней с момента получения",
          "pre_delivery_refusal_status": "defined",
          "pre_delivery_refusal_details": "до момента доставки в любое время",
          "three_month_term_status": "not_defined",
          "refund_10_days_status": "defined",
          "refund_10_days_details": "в течение 10 дней",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Покупатель вправе отказаться от товара надлежащего качества в течение 7 дней с момента его получения, а до момента доставки — в любое время."
            }
          ]
        }

        Пример 2 — данные не найдены:
        Фрагмент:
        "Возврат товара осуществляется согласно правилам интернет-магазина."

        Ответ:
        {
          "return_7_days_from_receipt_status": "not_defined",
          "return_7_days_details": "Данные не определены",
          "pre_delivery_refusal_status": "not_defined",
          "pre_delivery_refusal_details": "Данные не определены",
          "three_month_term_status": "not_defined",
          "refund_10_days_status": "not_defined",
          "refund_10_days_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли явный срок «7 дней» применительно к дистанционной продаже?
        2. Указано ли право отказаться до передачи товара?
        3. Упомянут ли «3 месяца» при ненадлежащем информировании?
        4. Указан ли конкретный срок возврата денег (10 дней)?
        5. "Согласно правилам" — это NOT defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "return_7_days_from_receipt_status": "<defined / not_defined>",
          "return_7_days_details": "<текст или 'Данные не определены'>",
          "pre_delivery_refusal_status": "<defined / not_defined>",
          "pre_delivery_refusal_details": "<текст или 'Данные не определены'>",
          "three_month_term_status": "<defined / not_defined>",
          "refund_10_days_status": "<defined / not_defined>",
          "refund_10_days_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
