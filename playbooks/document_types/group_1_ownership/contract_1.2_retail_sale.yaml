            }
          ]
        }

        Пример 5 — ничего не определено:
        Фрагмент:
        "Доставка осуществляется продавцом."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Не установлен",
          "delivery_cost_status": "not_defined",
          "delivery_cost_details": "Не установлена",
          "delivery_mode": "not_defined",
