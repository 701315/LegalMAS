type: contract_1.2_retail_sale
name: "Розничная купля-продажа"
version: 6.0
parent: class_1_transfer_of_ownership

description: |
  Специализированный вид купли-продажи (B2C), являющийся публичным договором (ст. 426 ГК РФ).
  Продавец — коммерческая организация или ИП — передаёт покупателю-гражданину товар для личного,
  семейного, домашнего или иного использования, не связанного с предпринимательской деятельностью.
  Регулируется § 2 Главы 30 ГК РФ (ст. 492-505), Законом РФ «О защите прав потребителей»
  (ЗоЗПП), Постановлением Правительства РФ № 2463 (Правила продажи товаров).
  Договор часто заключается конклюдентными действиями (оплата на кассе, акцепт публичной оферты).

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: low
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 30 ГК РФ (ст. 492-505), ЗоЗПП, Постановление № 2463"
  doc_types_supported:
    - "договор розничной купли-продажи"
    - "публичная оферта интернет-магазина"
    - "оферта на продажу товаров"
