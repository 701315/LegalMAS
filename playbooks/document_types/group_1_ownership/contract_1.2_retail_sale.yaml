#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: seller_identification_cluster
    name: "Идентификация продавца"
    description: >
      Фактографическая проверка наличия реквизитов продавца:
      наименование, ОГРН/ОГРНИП, ИНН и адрес.
      Предназначена для табличного вывода по нескольким офертам
      без оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "ОГРН"
        - "ОГРНИП"
        - "ИНН"
        - "адрес продавца"
        - "юридический адрес"
        - "ИП"
        - "индивидуальный предприниматель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bОГРН\\s*:?\\s*\\d{13,15}\\b"
        - "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
        - "(?i)(ООО|АО|ПАО|ИП)\\s+[«\"'].+?[»\"']"
        - "(?i)юридическ[а-я]+\\s+адрес"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта по § 2 Главы 30 ГК РФ.
        Проверяется только один вопрос: идентификация продавца.

        Нормативный ориентир:
        - ст. 9 Закона РФ «О защите прав потребителей»
        - ст. 495 ГК РФ

        [ЗАДАЧА]
        Найди в тексте документа четыре реквизита продавца:
        1. Наименование продавца.
        2. ОГРН или ОГРНИП продавца.
        3. ИНН продавца.
        4. Адрес продавца.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона и не делай предположений.
        2. Определяй именно продавца — не подменяй его владельцем сайта, оператором
           маркетплейса, агрегатором, платёжным агентом или службой доставки.
        3. Если указано несколько адресов, выбирай тот, что прямо отнесён к продавцу
           или указан в разделе реквизитов. Адрес склада, пункта выдачи или доставки
           не подходит, если текст прямо не называет его адресом продавца.
        4. Если документ лишь ссылается на внешний сайт, футер или раздел «О компании»,
           но сами реквизиты в тексте не приведены — считай поле неустановленным.
        5. Если данные отсутствуют — возвращай "not_defined" и "Не установлен(о)".
        6. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        7. В evidence включай только цитаты из документа.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все реквизиты указаны:
        Фрагмент:
        "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001,
        юридический адрес: г. Москва, ул. Ленина, д. 1."

        Ответ:
        {
          "seller_name_status": "defined",
          "seller_name_value": "ООО «Ромашка»",
          "seller_ogrn_status": "defined",
          "seller_ogrn_value": "1027700000001",
          "seller_inn_status": "defined",
          "seller_inn_value": "7700000001",
          "seller_address_status": "defined",
          "seller_address_value": "г. Москва, ул. Ленина, д. 1",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Продавец: ООО «Ромашка», ИНН 7700000001, ОГРН 1027700000001, юридический адрес: г. Москва, ул. Ленина, д. 1."
            }
          ]
        }

        Пример 2 — ИП, ОГРНИП:
        Фрагмент:
        "Продавец: ИП Иванов Иван Иванович, ОГРНИП 304770000123456, ИНН 772000000001,
        адрес: г. Санкт-Петербург, пр. Невский, д. 10."

        Ответ:
        {
          "seller_name_status": "defined",
          "seller_name_value": "ИП Иванов Иван Иванович",
          "seller_ogrn_status": "defined",
          "seller_ogrn_value": "304770000123456",
          "seller_inn_status": "defined",
          "seller_inn_value": "772000000001",
          "seller_address_status": "defined",
          "seller_address_value": "г. Санкт-Петербург, пр. Невский, д. 10",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец: ИП Иванов Иван Иванович, ОГРНИП 304770000123456, ИНН 772000000001, адрес: г. Санкт-Петербург, пр. Невский, д. 10."
            }
          ]
        }

        Пример 3 — наименование есть, реквизиты не указаны:
        Фрагмент:
        "Настоящую оферту размещает ООО «БетаТрейд». Реквизиты доступны
        на странице сайта в разделе «О компании»."

        Ответ:
        {
          "seller_name_status": "defined",
          "seller_name_value": "ООО «БетаТрейд»",
          "seller_ogrn_status": "not_defined",
          "seller_ogrn_value": "Не установлен",
          "seller_inn_status": "not_defined",
          "seller_inn_value": "Не установлен",
          "seller_address_status": "not_defined",
          "seller_address_value": "Не установлен",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Настоящую оферту размещает ООО «БетаТрейд»."
            }
          ]
        }

        Пример 4 — реквизиты не указаны вообще:
        Фрагмент:
        "Настоящая оферта регулирует условия продажи товаров интернет-магазина."

        Ответ:
        {
          "seller_name_status": "not_defined",
          "seller_name_value": "Не установлено",
          "seller_ogrn_status": "not_defined",
          "seller_ogrn_value": "Не установлен",
          "seller_inn_status": "not_defined",
          "seller_inn_value": "Не установлен",
          "seller_address_status": "not_defined",
          "seller_address_value": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое наименование продавца в тексте?
        2. Есть ли числовой ОГРН (13 цифр) или ОГРНИП (15 цифр)?
        3. Есть ли числовой ИНН (10 или 12 цифр)?
        4. Есть ли адрес, прямо отнесённый к продавцу?
        5. Не подменяю ли я продавца другим лицом?
        6. Если реквизиты только на внешнем сайте — поля неустановлены.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "seller_name_status": "<defined|not_defined>",
          "seller_name_value": "<наименование | 'Не установлено' | 'Не удалось определить'>",
          "seller_ogrn_status": "<defined|not_defined>",
          "seller_ogrn_value": "<номер | 'Не установлен' | 'Не удалось определить'>",
          "seller_inn_status": "<defined|not_defined>",
          "seller_inn_value": "<номер | 'Не установлен' | 'Не удалось определить'>",
          "seller_address_status": "<defined|not_defined>",
          "seller_address_value": "<адрес | 'Не установлен' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
