        Пример 2 — не найдено:
        Фрагмент:
        "Возврат осуществляется по правилам, установленным законодательством."

        Ответ:
        {
          "tst_15_days_status": "not_defined",
          "tst_15_days_details": "Данные не определены",
          "tst_regulation_924_status": "not_defined",
          "tst_substantial_defect_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли явная фраза «15 дней» в контексте ТСТ?
        2. Упомянуто ли Постановление № 924 или «технически сложные товары»?
        3. "В соответствии с законодательством" — это NOT defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "tst_15_days_status": "<defined / not_defined>",
          "tst_15_days_details": "<текст или 'Данные не определены'>",
          "tst_regulation_924_status": "<defined / not_defined>",
          "tst_substantial_defect_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "технически сложный товар в течение 15 дней существенный недостаток Перечень технически сложных Постановление 924 ремонт 45 дней срок устранения недостатка неоднократность недостатков возврат технически сложного"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "14 дней"
        - "7 дней"
        - "возврат надлежащего качества"
        - "обмен надлежащего качества"
        - "Перечень 2463"
        - "гарантийный срок общий"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
        - "доставка"
      position_bias:
        preferred_range: [0.20, 0.90]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты сведения о специальном режиме возврата технически сложных товаров (ТСТ).
        Анализируй только условия, связанные с ТСТ.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. tst_15_days_status — "defined" если прямо указан 15-дневный срок возврата ТСТ, иначе "not_defined".
        2. tst_15_days_details — формулировка о 15-дневном сроке.
        3. tst_regulation_924_status — "defined" если прямо упомянуто Постановление № 924 или Перечень технически сложных товаров, иначе "not_defined".
        4. tst_substantial_defect_status — "defined" если после 15 дней прямо упоминается существенный недостаток как условие специального режима, иначе "not_defined".

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст документа.
        - Если ТСТ вообще не упоминается — все поля = "not_defined".
        - Ссылка на "законодательство РФ" без конкретных сроков или специальных правил — это "not_defined".
        - Не смешивай общий гарантийный режим с режимом ТСТ.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "tst_15_days_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания 15-дневного срока возврата ТСТ."
          required: true
        - name: "tst_15_days_details"
          type: "string"
          presentation: "fact"
          label: "ТСТ — 15 дней"
          display_in_grid: true
          display_priority: 1
          description: "Формулировка о 15-дневном сроке возврата."
          required: false
        - name: "tst_regulation_924_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания Постановления № 924."
          required: false
        - name: "tst_substantial_defect_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о существенном недостатке после 15 дней."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Маркетплейс — данные продавца и ответственность
  # ──────────────────────────────────────────────────────────────────────────
  - id: marketplace_liability_allocation_check
    name: "Маркетплейс: данные о продавце и распределение ответственности"
    description: >
      Фактографическая проверка наличия в оферте маркетплейса реквизитов реального
      продавца, порядка раскрытия информации и распределения ответственности
      между маркетплейсом и продавцом.
    triggers:
      any: ["marketplace_platform"]
    severity: "high"
    ui_mode: "field_extraction"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "маркетплейс"
        - "агрегатор"
        - "владелец агрегатора"
        - "информационный посредник"
        - "ответственность маркетплейса"
        - "ответственность продавца"
        - "солидарная ответственность"
        - "информация о продавце"
        - "реквизиты продавца"
        - "ОГРН продавца"
        - "адрес продавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)маркетплейс|агрегатор"
        - "(?i)информаци(я|ю)\\s+о\\s+продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется оферта маркетплейса / торговой площадки.
        Проверяется наличие данных о продавце и распределение ответственности.

        Нормативный ориентир:
        - ст. 9, 12.1, 26.1 Закона РФ «О защите прав потребителей»
        - ФЗ от 29.12.2022 № 594-ФЗ

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Реквизиты реального продавца (наименование, ОГРН, адрес).
        2. Роль маркетплейса (агрегатор / продавец / иное).
        3. Условие о распределении ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. В evidence включай только текст документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — найдено:
        Фрагмент:
        "Маркетплейс является агрегатором и не несёт ответственности за действия
        продавцов. Информация о продавце (наименование, ОГРН, адрес) доступна
        в карточке товара."

        Ответ:
        {
          "seller_info_disclosure_status": "defined",
          "seller_info_disclosure_details": "информация о продавце доступна в карточке товара",
          "marketplace_role_status": "defined",
          "marketplace_role_details": "агрегатор",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "маркетплейс не несёт ответственности за действия продавцов",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Маркетплейс является агрегатором и не несёт ответственности за действия продавцов."
            }
          ]
        }

        Пример 2 — не найдено:
        Фрагмент:
        "Платформа обеспечивает возможность совершения покупок."

        Ответ:
        {
          "seller_info_disclosure_status": "not_defined",
          "seller_info_disclosure_details": "Данные не определены",
          "marketplace_role_status": "not_defined",
          "marketplace_role_details": "Данные не определены",
          "liability_allocation_status": "not_defined",
          "liability_allocation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли реквизиты продавца (хотя бы ссылка на карточку товара)?
        2. Определена ли роль маркетплейса прямо?
        3. Указано ли, кто несёт ответственность перед потребителем?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_info_disclosure_status": "<defined / not_defined>",
          "seller_info_disclosure_details": "<текст или 'Данные не определены'>",
          "marketplace_role_status": "<defined / not_defined>",
          "marketplace_role_details": "<текст или 'Данные не определены'>",
          "liability_allocation_status": "<defined / not_defined>",
          "liability_allocation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "маркетплейс агрегатор владелец агрегатора информационный посредник ответственность маркетплейса ответственность продавца солидарная ответственность информация о продавце реквизиты продавца ОГРН продавца адрес продавца"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
        - procedures
      negative_keywords:
        - "возврат товара"
        - "обмен товара"
        - "гарантийный срок"
        - "недостаток"
        - "технически сложный"
        - "14 дней"
        - "7 дней"
        - "персональные данные"
        - "доставка"
        - "цена"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста оферты маркетплейса сведения о раскрытии данных продавца, роли маркетплейса и распределении ответственности.
        Анализируй только отношения маркетплейса, продавца и потребителя.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_info_disclosure_status — "defined" если прямо указано, где и как раскрывается информация о продавце, иначе "not_defined".
        2. seller_info_disclosure_details — формулировка о раскрытии данных продавца.
        3. marketplace_role_status — "defined" если прямо указана роль маркетплейса (агрегатор / продавец / информационный посредник / иное), иначе "not_defined".
        4. marketplace_role_details — формулировка о роли маркетплейса.
        5. liability_allocation_status — "defined" если прямо указано распределение ответственности между маркетплейсом и продавцом, иначе "not_defined".
        6. liability_allocation_details — формулировка об ответственности.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст документа.
        - Если маркетплейс или агрегатор не упоминается, не делай предположений: все поля = "not_defined".
        - Не делай выводов о юридической квалификации сверх прямого текста.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_info_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия данных продавца."
          required: true
        - name: "seller_info_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие данных продавца"
          display_in_grid: true
          display_priority: 1
          description: "Как раскрываются данные продавца."
          required: false
        - name: "marketplace_role_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания роли маркетплейса."
          required: true
        - name: "marketplace_role_details"
          type: "string"
          presentation: "fact"
          label: "Роль маркетплейса"
          display_in_grid: true
          display_priority: 2
          description: "Роль маркетплейса (агрегатор, продавец и т.п.)."
          required: false
        - name: "liability_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения ответственности."
          required: true
        - name: "liability_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Распределение ответственности"
          display_in_grid: true
          display_priority: 3
          description: "Формулировка о распределении ответственности."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  seller_identification_subject_cluster:
    text: >
      В {doc_names} не определены реквизиты продавца и/или предмет договора.
      Просим предоставить: (а) полные реквизиты продавца — наименование, ОГРН/ОГРНИП,
      ИНН, юридический и фактический адрес, контактные данные для претензий
      (ст. 9 ЗоЗПП); (б) описание предмета договора — точное наименование товара,
      основные потребительские свойства, характеристики, комплектацию, артикул.
    addressee: "Продавец / Юридический отдел"

  subject_price_payment_cluster:
    text: >
      В {doc_names} не определены цена и/или порядок расчетов.
      Просим предоставить: (а) цену товара или механизм её определения;
      (б) полный перечень способов оплаты, включая наличный расчёт (ст. 16.1 ЗоЗПП);
      (в) условия предоплаты — размер, срок и порядок возврата при отказе покупателя;
      (г) последствия просрочки оплаты.
    addressee: "Продавец / Бухгалтерия / Юридический отдел"

  order_formation_delivery_cluster:
    text: >
      В {doc_names} не определены условия доставки и/или момент заключения договора.
      Просим предоставить: (а) конкретные сроки и способы доставки, стоимость;
      (б) момент заключения договора (акцепт оферты, подтверждение заказа);
      (в) порядок и условия отмены заказа до передачи товара;
      (г) право продавца удержать расходы на обратную доставку при возврате
      надлежащего качества (п. 4 ст. 26.1 ЗоЗПП).
    addressee: "Продавец / Логистика / Юридический отдел"

  return_exchange_consumer_rights_cluster:
    text: >
      В {doc_names} не определены условия возврата и обмена товара.
      Просим предоставить: (а) право на возврат/обмен в течение 14 дней (ст. 25 ЗоЗПП)
      и 7 дней при дистанционной продаже (ст. 26.1 ЗоЗПП);
      (б) конкретные условия возврата (товарный вид, упаковка, чек);
      (в) срок возврата денег покупателю (не более 10 дней);
      (г) для невозвратных товаров — ссылку на Постановление № 2463 с указанием
      конкретных категорий (не расширять перечень сверх № 2463).
    addressee: "Юридический отдел продавца"

  illegal_restrictions_detection:
    text: >
      В {doc_names} обнаружены формулировки, ограничивающие права потребителя
      (ст. 16, 17 ЗоЗПП). Просим привести соответствующие условия в соответствие
      с ЗоЗПП: убрать запрет на возврат, ограничение «только ремонт», обязательную
      платную экспертизу, условие об исключительной подсудности или обязательном
      третейском суде, навязывание дополнительных товаров/услуг.
    addressee: "Юридический отдел продавца"

  warranty_and_defects_rights_check:
    text: >
      В {doc_names} не определены гарантийные условия.
      Просим предоставить: (а) гарантийный срок и момент его начала;
      (б) полный перечень прав потребителя при недостатках — ремонт, замена,
      возврат, уменьшение цены по выбору потребителя (ст. 18 ЗоЗПП);
      (в) при гарантийном сроке менее 2 лет — указание на 2-летний срок
      предъявления требований (ст. 19 ЗоЗПП).
    addressee: "Юридический отдел продавца / Сервисный отдел"

  personal_data_processing_check:
    text: >
      В {doc_names} не определены условия обработки персональных данных (ФЗ-152).
      Просим предоставить: (а) конкретный механизм получения согласия;
      (б) конкретные цели обработки; (в) порядок отзыва согласия.
    addressee: "DPO / Юридический отдел"

  distance_selling_compliance_check:
    text: >
      В {doc_names} не определены обязательные условия дистанционной продажи.
      Просим предоставить: (а) право отказа в течение 7 дней с момента передачи
      товара (ст. 26.1 ЗоЗПП); (б) право отказаться до передачи в любое время;
      (в) срок до 3 месяцев при ненадлежащем информировании о порядке возврата;
      (г) срок возврата денег — не позднее 10 дней.
    addressee: "Юридический отдел продавца"

  technical_goods_return_rules_check:
    text: >
      В {doc_names} не определены правила возврата технически сложных товаров.
      Просим предоставить: (а) ссылку на Перечень ТСТ (Постановление № 924);
      (б) 15-дневный срок для возврата при любом недостатке;
      (в) права при существенном недостатке после 15 дней.
    addressee: "Юридический отдел продавца"

  marketplace_liability_allocation_check:
    text: >
      В {doc_names} не определены данные о продавце и распределение ответственности.
      Просим предоставить: (а) реквизиты реального продавца (наименование, ОГРН/ОГРНИП,
