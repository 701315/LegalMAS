    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста оферты только сведения
        о сроке доставки, стоимости доставки, способе передачи товара
        и удержании расходов на обратную доставку при возврате.
        Не анализируй момент заключения договора, отмену заказа, цену товара,
        оплату или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. delivery_term_status:
           - "defined" — если в тексте прямо указан срок доставки (конкретный
             период, диапазон дней, дата) либо прямо сказано, что срок
             определяется по условиям перевозчика / службы доставки, и этот
             источник прямо назван;
           - "not_defined" — если срок доставки прямо не указан
             или надёжно определить нельзя.
           Важно: общая фраза "доставка осуществляется в разумные сроки"
           или "срок доставки согласовывается" без конкретики — not_defined.

        2. delivery_term_details:
           Краткое user-facing описание срока доставки на русском языке.
           Правила:
           - если срок прямо указан, верни кратко, например:
             "В течение 3 рабочих дней",
             "В течение 1–5 рабочих дней",
             "Не позднее 14 дней с момента оплаты";
           - если срок определяется по условиям прямо названного перевозчика,
             верни кратко, например:
             "По условиям перевозчика (СДЭК)",
             "По тарифам службы доставки, отображается при оформлении заказа";
           - не копируй длинные абзацы;
           - если не установлен — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        3. delivery_cost_status:
           - "defined" — если в тексте прямо указана стоимость доставки
             (конкретная сумма, бесплатно, порядок расчёта по тарифам,
             условие бесплатности от суммы заказа);
           - "not_defined" — если стоимость доставки прямо не указана
             или надёжно определить нельзя.
           Важно: бесплатная доставка — это тоже определённая стоимость
           (delivery_cost_status = "defined").

        4. delivery_cost_details:
           Краткое user-facing описание стоимости доставки на русском языке.
           Правила:
           - если стоимость прямо указана, верни кратко, например:
             "350 рублей",
             "Бесплатно",
             "Бесплатно при заказе от 3 000 рублей; 250 рублей при заказе менее 3 000 рублей";
           - если стоимость определяется по тарифам / при оформлении заказа,
             верни кратко, например:
             "По тарифам службы доставки, отображается при оформлении заказа",
             "Рассчитывается по тарифам перевозчика";
           - не копируй длинные абзацы;
           - если не установлена — "Не установлена";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        5. delivery_mode:
           Внутренний код способа передачи товара.
           Правила:
           - "delivery" — если товар доставляется продавцом или курьером,
             и самовывоз в тексте прямо не предусмотрен;
           - "pickup" — если прямо указан только самовывоз или пункт выдачи;
           - "carrier" — если прямо указан только внешний перевозчик
             или транспортная компания;
           - "combined" — если в тексте прямо предусмотрено несколько способов
             (например, и курьер, и самовывоз; и доставка, и пункт выдачи);
           - "not_defined" — если способ передачи прямо не указан.

        6. delivery_mode_display:
           Краткое user-facing описание способа передачи товара на русском языке.
           Правила:
           - формулируй понятно для юриста, например:
             "Курьер",
             "Самовывоз из пункта выдачи",
             "Транспортная компания (СДЭК)",
             "Курьер или самовывоз из пункта выдачи";
           - если способ не указан — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".

        7. return_delivery_cost_retention_status:
           - "defined" — если в тексте прямо указано, кто несёт расходы
             на обратную доставку при возврате товара (покупатель, продавец
             или по ситуации);
           - "not_defined" — если этот вопрос прямо не урегулирован
             или надёжно определить нельзя.
           Важно: не путай расходы на обратную доставку при возврате
           с расходами на доставку товара покупателю.

        8. return_delivery_cost_retention_details:
           Краткое user-facing описание условия об обратной доставке
           на русском языке.
           Правила:
           - если условие прямо описано, верни кратко, например:
             "Расходы на обратную доставку несёт Покупатель",
             "Расходы на возврат несёт Продавец, если товар ненадлежащего качества",
             "Расходы на обратную пересылку — за счёт Покупателя,
             кроме случаев возврата товара ненадлежащего качества";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы или надёжно определить нельзя —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай условия доставки с моментом заключения договора,
          отменой заказа, ценой товара, оплатой и иными нерелевантными темами.
        - Расходы на обратную доставку при возврате и расходы на доставку
          товара покупателю — это разные условия. Не смешивай их.
        - Если срок или стоимость доставки определяются по условиям прямо
          названного перевозчика или службы доставки — это valid defined,
          отрази это кратко в user-facing поле.
        - Бесплатная доставка — это тоже определённая стоимость.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для delivery_mode используй только:
          "delivery", "pickup", "carrier", "combined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            delivery_term_details → "Не установлен"
            delivery_cost_details → "Не установлена"
            delivery_mode_display → "Не установлен"
            return_delivery_cost_retention_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "delivery_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока доставки. Внутреннее enum-поле."
          required: true
        - name: "delivery_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок доставки"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое user-facing описание срока доставки
            или указание на источник его определения.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
        - name: "delivery_cost_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения стоимости доставки. Внутреннее enum-поле."
          required: true
        - name: "delivery_cost_details"
          type: "string"
          presentation: "fact"
          label: "Стоимость доставки"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое user-facing описание стоимости доставки
            или порядка её расчёта.
            Fallback: "Не установлена" / "Не удалось определить".
          required: true
        - name: "delivery_mode"
          type: "string"
          presentation: "signal"
          allowed_values: ["delivery", "pickup", "carrier", "combined", "not_defined"]
          display_in_grid: false
          description: "Внутренний код способа передачи товара. Внутреннее enum-поле."
          required: true
        - name: "delivery_mode_display"
          type: "string"
          presentation: "fact"
          label: "Способ передачи товара"
          display_in_grid: true
          display_priority: 3
          description: >
            Краткое user-facing описание способа передачи товара,
            например: "Курьер", "Самовывоз из пункта выдачи",
            "Транспортная компания (СДЭК)", "Курьер или самовывоз".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
        - name: "return_delivery_cost_retention_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения условия об обратной доставке. Внутреннее enum-поле."
          required: true
        - name: "return_delivery_cost_retention_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на обратную доставку"
          display_in_grid: true
          display_priority: 4
          description: >
            Краткое user-facing описание условия о расходах
            на обратную доставку при возврате товара.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: return_exchange_consumer_rights_cluster
    name: "Право на возврат и обмен товара надлежащего качества"
    description: >
      Фактографическая проверка наличия информации о праве потребителя на возврат
      и обмен товара (14 дней / 7 дней), условиях возврата, порядке возврата денег
      и перечне невозвратных товаров.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат товара"
        - "обмен товара"
        - "в течение 14 дней"
        - "в течение 7 дней"
        - "надлежащее качество"
        - "право на отказ"
        - "товарный вид"
        - "потребительские свойства"
        - "Перечень № 2463"
        - "не подлежат обмену"
        - "не подлежат возврату"
        - "предметы личной гигиены"
        - "парфюмерия"
        - "нижнее бельё"
        - "ювелирные изделия"
        - "непродовольственные товары надлежащего качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*товар.*надлежащ"
        - "(?i)обмен.*непродовольственн"
        - "(?i)в\\s+течение\\s+(14|7)\\s+дней"
        - "(?i)товары.*не\\s+подлежащ(ие|их)\\s+обмену"
        - "(?i)Постановлени(е|я).*2463"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор розничной купли-продажи / публичная оферта.
        Проверяется только один вопрос: право потребителя на возврат и обмен
        товара надлежащего качества.

        Нормативный ориентир:
        - ст. 25, 26.1 Закона РФ «О защите прав потребителей»
        - Постановление Правительства РФ № 2463

        [ЗАДАЧА]
        Найди в тексте документа:
        1. Право на обмен или возврат в течение 14 дней (ст. 25 ЗоЗПП).
        2. Право на возврат в течение 7 дней при дистанционной продаже (ст. 26.1 ЗоЗПП).
        3. Условия возврата (товарный вид, сохранность упаковки, чек).
        4. Порядок и срок возврата денег покупателю.
        5. Перечень невозвратных товаров.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           и не делай предположений.
        2. Не анализируй права при возврате товара ненадлежащего качества
           (брак, дефекты, гарантийные случаи) — это отдельная тема.
        3. Право на 7-дневный возврат распознаётся по смыслу, даже если
           статья 26.1 прямо не упоминается: ориентируйся на формулировки
           "при дистанционной продаже", "при покупке через интернет",
           "при заказе в интернет-магазине", "до получения товара"
           или прямое указание 7-дневного срока для возврата.
        4. Условия возврата могут определяться через внешний документ
           (правила возврата, приложение, регламент, страница сайта) —
           это не отсутствие регулирования; отрази это кратко в user-facing поле.
        5. Перечень невозвратных товаров засчитывается как defined если:
           - прямо перечислены категории товаров;
           - есть ссылка на Постановление № 2463;
           - есть ссылка на иной прямо названный нормативный документ.
        6. Общая ссылка "возврат в соответствии с законодательством" без
           конкретных сроков, условий или перечня — это not_defined.
        7. Если условие не указано прямо — возвращай "not_defined".
        8. Если данные противоречивы и надёжный вывод сделать нельзя —
           возвращай "not_defined" и "Не удалось определить".
        9. В evidence включай только текст документа.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия указаны:
        Фрагмент:
        "Покупатель вправе обменять товар надлежащего качества в течение 14 дней
        с момента покупки. При дистанционной продаже — вправе отказаться от товара
        в течение 7 дней с момента получения.
        Условия возврата: товарный вид сохранён, упаковка не нарушена, чек сохранён.
        Возврат денег производится в течение 10 дней на банковскую карту.
        Товары из Перечня Постановления Правительства РФ № 2463 обмену не подлежат."

        Ответ:
        {
          "return_14_days_status": "defined",
          "return_14_days_details": "Обмен в течение 14 дней с момента покупки",
          "return_7_days_status": "defined",
          "return_7_days_details": "Отказ от товара в течение 7 дней с момента получения",
          "return_conditions_status": "defined",
          "return_conditions_details": "Товарный вид сохранён, упаковка не нарушена, чек сохранён",
          "refund_procedure_status": "defined",
          "refund_procedure_details": "В течение 10 дней на банковскую карту",
          "non_returnable_goods_status": "defined",
          "non_returnable_goods_details": "Товары согласно Перечню Постановления № 2463",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Покупатель вправе обменять товар надлежащего качества в течение 14 дней с момента покупки. При дистанционной продаже — вправе отказаться от товара в течение 7 дней с момента получения."
            }
          ]
        }

        Пример 2 — возврат денег по способу оплаты, конкретный перечень:
        Фрагмент:
        "Покупатель вправе вернуть товар в течение 14 дней.
        При оплате наличными деньги возвращаются в день обращения;
        при оплате картой — в течение 5–10 рабочих дней.
        Не подлежат возврату: предметы личной гигиены, парфюмерно-косметические
        товары, нижнее бельё."

        Ответ:
        {
          "return_14_days_status": "defined",
          "return_14_days_details": "Возврат в течение 14 дней",
          "return_7_days_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "return_conditions_status": "not_defined",
          "return_conditions_details": "Не установлены",
          "refund_procedure_status": "defined",
          "refund_procedure_details": "Наличными — в день обращения; картой — в течение 5–10 рабочих дней",
          "non_returnable_goods_status": "defined",
          "non_returnable_goods_details": "Предметы личной гигиены, парфюмерно-косметические товары, нижнее бельё",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Покупатель вправе вернуть товар в течение 14 дней. При оплате наличными деньги возвращаются в день обращения; при оплате картой — в течение 5–10 рабочих дней."
            }
          ]
        }

        Пример 3 — условия через внешний документ:
        Фрагмент:
        "Возврат товара надлежащего качества осуществляется в соответствии
        с Правилами возврата, размещёнными на сайте Продавца."

        Ответ:
        {
          "return_14_days_status": "not_defined",
          "return_14_days_details": "Не установлено",
          "return_7_days_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "return_conditions_status": "defined",
          "return_conditions_details": "Согласно Правилам возврата, размещённым на сайте Продавца",
          "refund_procedure_status": "defined",
          "refund_procedure_details": "Согласно Правилам возврата, размещённым на сайте Продавца",
          "non_returnable_goods_status": "not_defined",
          "non_returnable_goods_details": "Не установлены",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Возврат товара надлежащего качества осуществляется в соответствии с Правилами возврата, размещёнными на сайте Продавца."
            }
          ]
        }

        Пример 4 — только ссылка на закон:
        Фрагмент:
        "Возврат товара осуществляется в соответствии с действующим
        законодательством Российской Федерации."

        Ответ:
        {
          "return_14_days_status": "not_defined",
          "return_14_days_details": "Не установлено",
          "return_7_days_status": "not_defined",
          "return_7_days_details": "Не установлено",
          "return_conditions_status": "not_defined",
          "return_conditions_details": "Не установлены",
          "refund_procedure_status": "not_defined",
          "refund_procedure_details": "Не установлен",
          "non_returnable_goods_status": "not_defined",
          "non_returnable_goods_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли явный срок 14 дней для обмена/возврата надлежащего товара?
        2. Есть ли явный срок 7 дней или формулировка о дистанционной продаже?
        3. Указаны ли конкретные условия состояния товара при возврате?
        4. Указан ли срок и способ возврата денег покупателю?
        5. Перечислены ли категории невозвратных товаров или есть ссылка
           на Постановление № 2463?
        6. Нет ли только общей ссылки на законодательство без конкретики?
        7. Если условия определяются через внешний документ — отразить это
           как valid defined.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "return_14_days_status": "<defined|not_defined>",
          "return_14_days_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "return_7_days_status": "<defined|not_defined>",
          "return_7_days_details": "<текст | 'Не установлено' | 'Не удалось определить'>",
          "return_conditions_status": "<defined|not_defined>",
          "return_conditions_details": "<текст | 'Не установлены' | 'Не удалось определить'>",
          "refund_procedure_status": "<defined|not_defined>",
          "refund_procedure_details": "<текст | 'Не установлен' | 'Не удалось определить'>",
          "non_returnable_goods_status": "<defined|not_defined>",
          "non_returnable_goods_details": "<текст | 'Не установлены' | 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат товара надлежащего качества обмен товара 14 дней 7 дней право на отказ товарный вид потребительские свойства Перечень 2463 не подлежат обмену не подлежат возврату невозвратные товары возврат денег срок возврата денег дистанционная продажа"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - limitations
      negative_keywords:
        - "гарантийный срок"
        - "недостаток товара"
        - "существенный недостаток"
        - "безвозмездное устранение"
        - "ремонт"
        - "замена товара при браке"
        - "гарантийное обслуживание"
        - "технически сложный"
        - "Постановление 924"
        - "персональные данные"
        - "маркетплейс"
        - "ОГРН"
        - "ИНН"
        - "доставка"
        - "срок доставки"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста публичной оферты только условия
        о праве потребителя на возврат и обмен товара надлежащего качества.
        Не анализируй возврат товара ненадлежащего качества, брак, дефекты,
        гарантийные случаи или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. return_14_days_status:
           - "defined" — если в тексте прямо указано право на обмен или возврат
             товара надлежащего качества в течение 14 дней (ст. 25 ЗоЗПП),
             либо прямо сказано, что такое право определяется по названному
             внешнему документу;
           - "not_defined" — если это право прямо не указано
             или надёжно определить нельзя.
           Важно: общая ссылка на законодательство без указания срока — not_defined.

        2. return_14_days_details:
           Краткое user-facing описание права на 14-дневный обмен/возврат.
           Правила:
           - если право прямо указано, верни кратко (1–2 фразы), например:
             "Обмен в течение 14 дней с момента покупки",
             "Возврат в течение 14 дней при сохранении товарного вида";
           - если условия определяются через внешний документ, например:
             "Согласно Правилам возврата, размещённым на сайте Продавца";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. return_7_days_status:
           - "defined" — если в тексте прямо указано право на возврат
             при дистанционной продаже / покупке через интернет в течение 7 дней,
             либо прямо используется формулировка о праве отказа от товара
             "до получения" или "в течение 7 дней с момента получения";
           - "not_defined" — если это право прямо не указано
             или надёжно определить нельзя.
           Важно: право на 7-дневный возврат распознаётся по смыслу,
           даже если ст. 26.1 прямо не упоминается.

        4. return_7_days_details:
           Краткое user-facing описание права на 7-дневный возврат.
           Правила:
           - если право прямо указано, верни кратко (1–2 фразы), например:
             "Отказ от товара до получения — без объяснения причин",
             "Возврат в течение 7 дней с момента получения";
           - не копируй длинные абзацы;
           - если не установлено — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        5. return_conditions_status:
           - "defined" — если в тексте прямо описаны требования к состоянию
             товара при возврате (товарный вид, упаковка, чек, бирки и т.п.)
             либо прямо сказано, что они определяются по названному
             внешнему документу;
           - "not_defined" — если требования к состоянию при возврате
             прямо не указаны.

        6. return_conditions_details:
           Краткое user-facing описание условий возврата товара.
           Правила:
           - если условия прямо описаны, верни кратко через запятую, например:
             "Товарный вид сохранён, упаковка не нарушена, чек сохранён",
             "Ярлыки и бирки на месте, следы использования отсутствуют";
           - если условия определяются через внешний документ:
             "Согласно Правилам возврата, размещённым на сайте Продавца";
           - не копируй длинные абзацы;
           - если не установлены — "Не установлены";
           - если данные противоречивы — "Не удалось определить".

        7. refund_procedure_status:
           - "defined" — если в тексте прямо указан срок и/или способ
             возврата денежных средств покупателю, либо прямо сказано,
             что он определяется по названному внешнему документу;
           - "not_defined" — если порядок возврата денег прямо не указан.

        8. refund_procedure_details:
           Краткое user-facing описание порядка возврата денег.
           Правила:
           - если порядок прямо описан, верни кратко (1–2 фразы), например:
             "В течение 10 дней на банковскую карту",
             "Наличными — в день обращения; картой — в течение 5–10 рабочих дней";
           - если порядок определяется через внешний документ:
             "Согласно Правилам возврата, размещённым на сайте Продавца";
           - не копируй длинные абзацы;
           - если не установлен — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        9. non_returnable_goods_status:
           - "defined" — если в тексте прямо указаны категории товаров,
             не подлежащих возврату или обмену, либо есть ссылка на
             Постановление № 2463 или иной прямо названный нормативный документ;
           - "not_defined" — если перечень невозвратных товаров прямо не указан.

        10. non_returnable_goods_details:
            Краткое user-facing описание невозвратных товаров.
            Правила:
            - если категории прямо перечислены, верни кратко через запятую, например:
              "Предметы личной гигиены, парфюмерно-косметические товары, нижнее бельё",
              "Ювелирные изделия, чулочно-носочные изделия";
            - если есть ссылка на нормативный акт:
              "Товары согласно Перечню Постановления № 2463";
            - если и перечень, и ссылка — объедини кратко;
            - не копируй длинные абзацы;
            - если не установлены — "Не установлены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения
          вместо текста договора.
        - Не смешивай возврат товара надлежащего качества с возвратом
          при браке, дефектах, гарантийных случаях или существенных недостатках.
        - Право на 7-дневный возврат распознаётся по смыслу даже без явной
          ссылки на ст. 26.1: ориентируйся на формулировки о дистанционной
          продаже, покупке через интернет, праве отказа до или после получения,
          7-дневном сроке возврата.
        - Если условия возврата, порядок возврата денег или перечень невозвратных
          товаров прямо определяются по названному внешнему документу
          (правила возврата, приложение, регламент, страница сайта) —
          считай это defined и отрази кратко в user-facing поле.
        - Общая ссылка на законодательство РФ без конкретных сроков, условий
          или перечня товаров — это not_defined для всех полей.
        - Если в разных фрагментах указаны несовместимые условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 10 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            return_14_days_details → "Не установлено"
            return_7_days_details → "Не установлено"
            return_conditions_details → "Не установлены"
            refund_procedure_details → "Не установлен"
            non_returnable_goods_details → "Не установлены"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "return_14_days_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания права на возврат в течение 14 дней. Внутреннее enum-поле."
          required: true
        - name: "return_14_days_details"
