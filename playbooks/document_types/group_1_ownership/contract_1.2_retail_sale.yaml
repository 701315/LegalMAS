# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.76
    strong_signal_threshold: 0.86
    ambiguity_margin: 0.15
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)розничн[а-я]*[_\\s-]*купли-?продажи"
      - "(?i)retail[_\\s-]*(?:sale|agreement|contract)"
      - "(?i)e[\\-_]?commerce"
      - "(?i)интернет[_\\s-]?магазин"
      - "(?i)public[_\\s-]*offer"
      - "(?i)public[_\\s-]*oferta"
      - "(?i)публичн[а-я]*[_\\s-]*оферт[аы]"
      - "(?i)(?:условия|terms)[_\\s-]*(?:продажи|sales)"
      - "(?i)маркетплейс"
      - "(?i)marketplace"
      - "(?i)user[_\\s-]*agreement"
      - "(?i)пользовательск[а-я]*[_\\s-]*соглашен"

    folder_patterns:
      - "(?i)retail"
      - "(?i)розничн"
      - "(?i)b2c"
      - "(?i)e[\\-_]?commerce"
      - "(?i)internet[_\\s-]*shop"
      - "(?i)интернет[_\\s-]?магазин"
      - "(?i)marketplace"
      - "(?i)маркетплейс"

    keywords:

      high:
        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+розничной\\s+купли-?продажи\\b"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора розничной купли-продажи"

        - pattern: "(?i)публичная\\s+оферта\\s+интернет-?магазина"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Публичная оферта интернет-магазина — классическая форма B2C"

        - pattern: "(?i)договор[\\s\\n\\r]+купли-?продажи\\s+товаров?\\s+дистанционным\\s+способом"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Дистанционная розничная продажа, ст. 497 ГК РФ"

        - pattern: "(?i)условия\\s+продажи\\s+товаров?\\s+на\\s+маркетплейсе"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Условия продажи на маркетплейсе — B2C платформенная торговля"

        - pattern: "(?i)договор[\\s\\n\\r]+купли-?продажи\\s+продовольственных\\s+товаров?"
          weight: 0.90
          distinctiveness: high
          context: header
          description: "Розничная продажа продовольствия"

        - pattern: "(?i)для\\s+личных(?:,\\s*семейных)?(?:,\\s*домашних)?(?:,?\\s*или\\s+иных)?\\s+нужд"
          weight: 0.95
          distinctiveness: high
          context: body
          description: "Формула цели приобретения товара потребителем, ст. 492 ГК РФ"

        - pattern: "(?i)не\\s+связанн[аы]х?\\s+с\\s+предпринимательской\\s+деятельностью"
          weight: 0.90
          distinctiveness: high
          context: body
          description: "Квалифицирующий признак розничной сделки — исключение B2B"

        - pattern: "(?i)\\bзащита\\s+прав\\s+потребителей\\b"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Прямая отсылка к институту защиты прав потребителей"

        - pattern: "(?i)розничная\\s+торговля"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Прямое указание на вид деятельности — розничная торговля"

        - pattern: "(?i)кассовый\\s+чек"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Кассовый чек — обязательный фискальный документ розничной продажи"

        - pattern: "(?i)\\bпотребител[ьяеи]\\b"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Потребитель как сторона договора — ключевой B2C маркер"

        - pattern: "(?i)гражданин\\s*-?\\s*покупател[ьяеи]"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Гражданин-покупатель — точная квалификация розничного покупателя"

        - pattern: "(?i)\\bпубличная\\s+оферта\\b"
          weight: 0.70
          distinctiveness: medium
          context: any
          description: "Публичная оферта — встречается не только в рознице, но здесь весома"

        - pattern: "(?i)оферта\\s+на\\s+продажу\\s+товаров?"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Оферта на продажу товаров — формула публичной розничной оферты"

        - pattern: "(?i)пользовательское\\s+соглашение(?:\\s*\\(e-?commerce\\))?"
          weight: 0.70
          distinctiveness: medium
          context: header
          description: "Пользовательское соглашение e-commerce; в header весомее"

        - pattern: "(?i)условия\\s+использования\\s+сайта\\s+интернет-?магазина"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Условия использования сайта интернет-магазина"

        - pattern: "(?i)розничная\\s+продажа"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Розничная продажа — прямой маркер"

        - pattern: "(?i)розничный\\s+магазин"
          weight: 0.70
          distinctiveness: high
          context: any
          description: "Розничный магазин как торговая точка"

        - pattern: "(?i)товарный\\s+чек"
          weight: 0.70
          distinctiveness: high
          context: any
          description: "Товарный чек — фискальный документ розницы"

      medium:
        - pattern: "(?i)возврат\\s+товаров?"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Возврат товара — типичная B2C процедура по ст. 25/26.1 ЗоЗПП"

        - pattern: "(?i)обмен\\s+товаров?"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Обмен товара надлежащего качества — розничный институт"

        - pattern: "(?i)гарантийный\\s+талон"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Гарантийный талон — характерен для розничных покупок"

        - pattern: "(?i)\\bмаркетплейс\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Маркетплейс — платформа розничной торговли"

        - pattern: "(?i)корзина\\s+покупок"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Корзина покупок — элемент интерфейса e-commerce"

        - pattern: "(?i)оформление\\s+заказа"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Оформление заказа — типовой этап дистанционной розницы"

        - pattern: "(?i)курьерская\\s+доставка"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Курьерская доставка — характерна для дистанционной B2C продажи"

        - pattern: "(?i)пункт\\s+выдачи"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Пункт выдачи заказов — инфраструктура розничного e-commerce"

        - pattern: "(?i)закон\\s+(?:рф\\s+)?о\\s+защите\\s+прав\\s+потребителей|ЗоЗПП"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Прямая ссылка на ЗоЗПП — ключевой нормативный маркер розницы"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*49[2-9]\\s+ГК|ст(?:атья|\\.)?\\s*50[0-5]\\s+ГК"
          weight: 0.70
          distinctiveness: high
          context: any
          description: "Ссылки на ст. 492-505 ГК РФ — нормативная база розничной главы"

        - pattern: "(?i)постановлени[ея]\\s+(?:правительства\\s+рф\\s+)?№\\s*2463"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Постановление Правительства № 2463 (Правила продажи) — только для розницы"

      low:
        - pattern: "(?i)\\bдоставка\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Очень общий термин, встречается в поставке, аренде и т.д."

        - pattern: "(?i)\\bсамовывоз\\b"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Самовывоз — способ получения товара, чаще в рознице"

        - pattern: "(?i)каталог\\s+товаров?"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Каталог товаров — может быть и в оптовой торговле"

        - pattern: "(?i)\\bпромокод\\b"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Промокод — маркетинговый инструмент, специфичен для B2C e-commerce"

    exclusions:
      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+поставки\\b"
        severity: hard
        weight: -1.0
        description: "Договор поставки — отдельный тип, B2B, § 3 Гл. 30 ГК РФ"

      - pattern: "(?i)оптовая\\s+поставка"
        severity: hard
        weight: -1.0
        description: "Оптовая поставка — исключает розничный характер сделки"

      - pattern: "(?i)для\\s+перепродажи"
        severity: hard
        weight: -1.0
        description: "Цель перепродажи прямо исключает розничную квалификацию (ст. 492 ГК)"

      - pattern: "(?i)\\bконтрактация\\b"
        severity: hard
        weight: -1.0
        description: "Контрактация — отдельный вид (§ 5 Гл. 30 ГК), закупка сельхозпродукции"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+купли-?продажи\\s+недвижимости\\b"
        severity: hard
        weight: -1.0
        description: "Купля-продажа недвижимости — совершенно другой тип (§ 7 Гл. 30 ГК)"

      - pattern: "(?i)продажа\\s+предприятия\\s+как\\s+имущественного\\s+комплекса"
        severity: hard
        weight: -1.0
        description: "Продажа предприятия как комплекса — § 8 Гл. 30 ГК РФ"

      - pattern: "(?i)\\bдоля\\s+в\\s+ООО\\b"
        severity: hard
        weight: -1.0
        description: "Доля в ООО — корпоративная сделка, не розничная купля-продажа"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+подряда\\b"
        severity: hard
        weight: -1.0
        description: "Договор подряда — иная договорная конструкция (Гл. 37 ГК)"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+оказания\\s+услуг\\b"
        severity: hard
        weight: -1.0
        description: "Договор оказания услуг — иная конструкция (Гл. 39 ГК)"

      # ── Soft exclusions

      - pattern: "(?i)оптовая\\s+продажа"
        severity: soft
        weight: -0.35
        description: "Упоминание оптовых продаж снижает вероятность розничного характера"

      - pattern: "(?i)между\\s+юридическими\\s+лицами"
        severity: soft
        weight: -0.40
        description: "Сделка между юрлицами — вероятно B2B, не розница"

      - pattern: "(?i)\\bB2B\\b"
        severity: soft
        weight: -0.40
        description: "Явное указание на B2B-модель противоречит розничному характеру"

      - pattern: "(?i)\\bпоставщик\\b"
        severity: soft
        weight: -0.30
        description: "Термин 'поставщик' характерен для поставки, не для розницы"

      - pattern: "(?i)\\bпоставка\\b"
        severity: soft
        weight: -0.25
        description: "Общий термин поставки, может указывать на § 3 Гл. 30 ГК"

      - pattern: "(?i)\\bлизинг\\b"
        severity: soft
        weight: -0.30
        description: "Лизинг — финансовая аренда, иная конструкция"

      - pattern: "(?i)\\bSaaS\\b|программное\\s+обеспечение"
        severity: soft
        weight: -0.25
        description: "SaaS / ПО — цифровые услуги, а не физический товар"

