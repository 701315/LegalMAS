    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста публичной оферты / договора розничной
        купли-продажи только реквизиты продавца: наименование, ОГРН/ОГРНИП, ИНН, адрес.
        Не анализируй предмет товара, цену, оплату, доставку, возврат или иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста документа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_name_status:
           - "defined" — если в тексте прямо указано наименование продавца
             (ООО, АО, ПАО, ИП или иная организационно-правовая форма с названием);
           - "not_defined" — если наименование продавца в тексте отсутствует
             или надёжно определить нельзя.
           Важно: название интернет-магазина, бренда или домена сайта без указания
           юридического лица не является наименованием продавца.

        2. seller_name_value:
           Полное наименование продавца, как оно указано в тексте.
           Правила:
           - пиши точно, как в документе, включая кавычки и организационно-правовую форму;
           - если наименование не указано — "Не установлено";
           - если данные противоречивы или надёжно определить нельзя — "Не удалось определить".

        3. seller_ogrn_status:
           - "defined" — если в тексте прямо указан числовой ОГРН (13 цифр)
             или ОГРНИП (15 цифр) продавца;
           - "not_defined" — если номер отсутствует или надёжно определить нельзя.

        4. seller_ogrn_value:
           Только числовой ОГРН или ОГРНИП без пробелов и пояснений.
           Правила:
           - если номер не указан — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя — "Не удалось определить".

        5. seller_inn_status:
           - "defined" — если в тексте прямо указан числовой ИНН продавца
             (10 цифр для юрлица, 12 для ИП);
           - "not_defined" — если номер отсутствует или надёжно определить нельзя.

        6. seller_inn_value:
           Только числовой ИНН без пробелов и пояснений.
           Правила:
           - если номер не указан — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя — "Не удалось определить".

        7. seller_address_status:
           - "defined" — если в тексте прямо указан адрес продавца
             (юридический адрес, адрес места нахождения или адрес в разделе реквизитов);
           - "not_defined" — если адрес отсутствует или надёжно определить нельзя.
           Важно: адрес склада, пункта выдачи, пункта возврата или доставки
           не является адресом продавца, если текст прямо не называет его таковым.

        8. seller_address_value:
           Адрес продавца, как он указан в тексте.
           Правила:
           - пиши кратко и точно;
           - если адрес не указан — "Не установлен";
           - если данные противоречивы или надёжно определить нельзя — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только сведения, прямо содержащиеся в тексте контекста.
        - Не используй нормы закона, типовую логику розницы, данные сайта вне контекста
          или собственные предположения.
        - Определяй именно продавца. Не подменяй его владельцем сайта, оператором
          маркетплейса, агрегатором, платёжным агентом, службой доставки или иным лицом.
        - Если документ лишь ссылается на внешний сайт, футер, страницу «О компании»
          или иной внешний источник, но сами реквизиты в тексте не приведены —
          считай соответствующее поле неустановленным.
        - Если в разных фрагментах указаны разные наименования или реквизиты
          и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки, прочерки, null или None.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй:
            seller_name_value → "Не установлено"
            seller_ogrn_value → "Не установлен"
            seller_inn_value → "Не установлен"
            seller_address_value → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй:
            "Не удалось определить"
        </output_expectations>
      fields:
        - name: "seller_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания наименования продавца. Внутреннее enum-поле."
          required: true
        - name: "seller_name_value"
          type: "string"
          presentation: "fact"
          label: "Наименование продавца"
          display_in_grid: true
