        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок доставки или прямое указание на источник
           его определения?
        2. Есть ли стоимость доставки, условие бесплатности или порядок
           её расчёта?
        3. Назван ли способ передачи: курьер, самовывоз, перевозчик или несколько?
        4. Указано ли, кто несёт расходы на обратную доставку при возврате?
        5. Нет ли только общих фраз без конкретики?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "delivery_term_status": "<defined|not_defined>",
          "delivery_term_details": "<срок | способ определения | 'Не установлен' | 'Не удалось определить'>",
          "delivery_cost_status": "<defined|not_defined>",
          "delivery_cost_details": "<стоимость | порядок расчёта | 'Не установлена' | 'Не удалось определить'>",
          "delivery_mode": "<delivery|pickup|carrier|combined|not_defined>",
          "delivery_mode_display": "<текст | 'Не установлен' | 'Не удалось определить'>",
          "return_delivery_cost_retention_status": "<defined|not_defined>",
