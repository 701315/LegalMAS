type: contract_1.12
name: "Соглашение об отступном"

description: |
  Соглашение, по которому существующее обязательство прекращается полностью или частично
  путём предоставления кредитору иного исполнения взамен первоначального:
  денежных средств, имущества, имущественного права, ценных бумаг или иного актива.
  Регулируется ст. 409 ГК РФ. Ключевая особенность — обязательство прекращается
  не само по себе в момент подписания соглашения, а по факту предоставления отступного,
  если иное не вытекает из существа согласованной конструкции и требований к переходу прав.
  Отступное необходимо чётко отличать от новации, прощения долга, зачёта и купли-продажи.
  Особое значение имеют идентификация первоначального обязательства, описание предмета отступного,
  объём прекращения долга, момент прекращения обязательства, налоговые и банкротные риски.

version: 4.0
parent: class_2_modification_of_obligations

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: obligation_termination
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ст. 409 ГК РФ"
  doc_types_supported:
    - "соглашение об отступном"
    - "соглашение о предоставлении отступного"
    - "соглашение о прекращении обязательства отступным"
    - "погашение долга имуществом"
    - "погашение долга правом требования"
    - "отступное по кредитному договору"
    - "отступное недвижимостью"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)отступн"
      - "(?i)dation"
      - "(?i)deed[\\s_.-]?in[\\s_.-]?lieu"
      - "(?i)в\\s+счет\\s+погашения"

    folder_patterns:
      - "(?i)termination"
      - "(?i)отступн"
      - "(?i)obligation"

    keywords:

      high:
        - "(?i)отступн[оаые]"
        - "(?i)соглашен[иея]\\s+об\\s+отступн[омым]"
        - "(?i)соглашен[иея]\\s+о\\s+предоставлен[иии]\\s+отступн[огоым]"
        - "(?i)соглашен[иея]\\s+о\\s+прекращен[иии]\\s+обязательств[аы]\\s+отступн[ымого]"
        - "(?i)погашен[иеия]\\s+долг[ао]\\s+имуществ[ома]"
        - "(?i)погашен[иеия]\\s+долг[ао]\\s+прав[ом]\\s+требован[ияи]"
        - "(?i)отступн[оеым]\\s+по\\s+кредитн[омуым]\\s+договор[уеи]"
        - "(?i)отступн[оеым]\\s+недвижимост[ьюи]"
        - "(?i)предоставлен[иеия]\\s+отступн[огоым]"
        - "(?i)прекращен[иеия]\\s+обязательств[аы]"
        - "(?i)взамен\\s+исполнен[ияию]"
        - "(?i)в\\s+счет\\s+погашен[ияию]\\s+долг[ао]"
        - "(?i)должник\\s+предоставл[яетил]"
        - "(?i)кредитор\\s+принима[еет]"
        - "(?i)реальн[аяое]\\s+сделк[аи]"

      medium:
        - "первоначальное обязательство"
        - "погашение задолженности"
        - "акт приема-передачи"
        - "момент прекращения обязательства"
        - "частичное прекращение"
        - "остаток долга"
        - "вместо исполнения обязательства"
        - "предоставление имущества вместо долга"

      low:
        - "кредитный договор"
        - "задолженность"
        - "денежное обязательство"
        - "имущественное обязательство"
        - "передача имущества кредитору"
        - "стоимость отступного"

    exclusions:
      - "новация"
      - "прощение долга"
      - "зачет встречных требований"
      - "безвозмездное прекращение"
      - "купля-продажа"
      - "дарение"
      - "договор мены"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  real_estate_as_otsupnoe:
    any_keywords:
      - "квартира"
      - "земельный участок"
      - "здание"
      - "помещение"
      - "недвижимость"
      - "кадастровый номер"
      - "ЕГРН"
      - "государственная регистрация"
      - "Росреестр"

  claim_assignment_as_otsupnoe:
    any_keywords:
      - "право требования"
      - "цессия"
      - "уступка требования"
      - "договор уступки"
      - "должник по уступаемому требованию"
      - "передача права требования"
      - "цессия в качестве отступного"

  movable_property_as_otsupnoe:
    any_keywords:
      - "автомобиль"
      - "оборудование"
      - "товар"
      - "ценные бумаги"
      - "движимое имущество"
      - "транспортное средство"
      - "серийный номер"
      - "VIN"

  partial_termination:
    any_keywords:
      - "частично"
      - "в части"
      - "остаток долга"
      - "неполное погашение"
      - "в размере"
      - "погашается часть обязательства"
      - "сохраняется остаток"

  bankruptcy_risk_context:
    any_keywords:
      - "банкротство"
      - "несостоятельность"
      - "кредиторы"
      - "предпочтительное удовлетворение"
      - "подозрительная сделка"
      - "конкурсная масса"
      - "арбитражный управляющий"

  secured_original_obligation:
    any_keywords:
      - "залог"
      - "ипотека"
      - "поручительство"
      - "обеспеченное обязательство"
      - "обеспечение исполнения"
      - "залогодержатель"
      - "закладная"

  corporate_approval_context:
    any_keywords:
      - "крупная сделка"
      - "сделка с заинтересованностью"
      - "одобрение общего собрания"
      - "решение единственного участника"
      - "совет директоров"
      - "корпоративное одобрение"

  individual_party:
    any_keywords:
      - "гражданин"
      - "физическое лицо"
      - "паспорт"
      - "дата рождения"
      - "место рождения"

  tax_sensitive_structure:
    any_keywords:
      - "НДС"
      - "налоговые последствия"
      - "рыночная стоимость"
      - "налоговая база"
      - "не является дарением"
      - "экономическая обоснованность"


# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "bankruptcy_preference_or_suspect_transaction_risk"
    name: "Банкротный риск: предпочтение / подозрительная сделка"
    description: >
      Отступное, предоставленное незадолго до банкротства должника, может быть оспорено
      как сделка с предпочтением или подозрительная сделка, особенно при несоразмерности
      отступного, аффилированности или ухудшении положения иных кредиторов.
    legal_base: "ст. 61.2, 61.3 ФЗ-127 «О несостоятельности (банкротстве)»"
    required_triggers: ["bankruptcy_risk_context"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "банкротство"
        - "предпочтительное удовлетворение"
        - "подозрительная сделка"
        - "кредиторы"
        - "неплатежеспособность"
        - "конкурсная масса"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "предпочтительное удовлетворение"
        - "подозрительная сделка"
        - "банкротство"
      rerank: true

  - id: "real_estate_transfer_registration_required"
    name: "Недвижимость как отступное: требуется госрегистрация перехода права"
    description: >
      Если отступным выступает недвижимость, переход права собственности требует
      государственной регистрации. Без неё кредитор не приобретает право на объект,
      а модель прекращения обязательства должна быть согласована особенно тщательно.
    legal_base: "ст. 131, 551 ГК РФ, ФЗ-218"
    required_triggers: ["real_estate_as_otsupnoe"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "государственная регистрация"
        - "ЕГРН"
        - "Росреестр"
        - "переход права собственности"
        - "кадастровый номер"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "ЕГРН"
      rerank: true

  - id: "claim_assignment_identification_required"
    name: "Право требования как отступное: требуется чёткая идентификация и передача документов"
    description: >
      Если отступным выступает право требования, необходимо чётко определить уступаемое требование,
      его основание, должника, объём, обеспечительные права и порядок передачи документов.
      Иначе высок риск неисполнения модели отступного и споров о действительности уступки.
    legal_base: "ст. 382-390, 409 ГК РФ"
    required_triggers: ["claim_assignment_as_otsupnoe"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "право требования"
        - "цессия"
        - "уступка"
        - "договор уступки"
        - "передача документов"
        - "должник по требованию"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "право требования"
        - "цессия"
        - "передача документов"
      rerank: true

  - id: "misclassification_risk_not_novation_or_forgiveness"
    name: "Риск неверной квалификации: не новация и не прощение долга"
    description: >
      При неудачной формулировке соглашение об отступном может быть смешано с новацией,
      прощением долга, зачётом или возмездной отчуждательной сделкой. Это влияет на
      момент прекращения обязательства, налоговые последствия и банкротные риски.
    legal_base: "ст. 409, 410-415 ГК РФ"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "новация"
        - "прощение долга"
        - "зачет"
        - "замена обязательства"
        - "безвозмездное прекращение"
        - "вместо исполнения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "новация"
        - "прощение долга"
        - "зачет"
        - "отступное"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: original_obligation_extraction
    name: "Отступное: извлечение первоначального обязательства"
    description: >
      Извлекает реквизиты обязательства, которое прекращается: основание, сумму,
      состав долга, сроки, обеспечительные меры и объём прекращения.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "первоначальное обязательство"
        - "договор №"
        - "задолженность"
        - "основной долг"
        - "проценты"
        - "неустойка"
        - "в счет погашения"
        - "прекращается обязательство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор\\s*№"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)\\b"
        - "(?i)основн(ой|ого)\\s+долг|процент|неустойк"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Найди, какое обязательство прекращается.

        Ответь строго в JSON:
        {
          "original_obligation_basis": "<договор/судебный акт/иное основание или not_found>",
          "original_obligation_details": "<реквизиты обязательства или not_found>",
          "debt_amount": "<сумма долга или not_found>",
          "includes_interest_and_penalties": "<yes / no / partial / not_found>",
          "termination_scope": "<full / partial / unclear / not_found>",
          "secured_obligation": "<yes / no / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 520
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "первоначальное обязательство"
        - "в счет погашения"
        - "основной долг"
        - "проценты"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "original_obligation_basis"
          type: "string"
          description: "Основание прекращаемого обязательства"
        - name: "debt_amount"
          type: "string"
          description: "Размер долга"
        - name: "termination_scope"
          type: "string"
          allowed_values: ["full", "partial", "unclear", "not_found"]
          description: "Объем прекращения обязательства"
        - name: "secured_obligation"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Было ли обязательство обеспеченным"
      store_payload: true

  - id: otsupnoe_subject_and_transfer_check
    name: "Предмет отступного и механизм его передачи"
    description: >
      Проверяет описание предмета отступного и механизм фактической передачи:
      деньги, имущество, недвижимость, право требования, ценные бумаги.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отступное"
        - "предмет отступного"
        - "передача имущества"
        - "акт приема-передачи"
        - "право требования"
        - "денежные средства"
        - "недвижимость"
        - "автомобиль"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Определи, что именно передается как отступное и как оформляется передача.

        Ответь строго в JSON:
        {
          "otsupnoe_type": "<money / movable_property / real_estate / claim / securities / mixed / not_found>",
          "otsupnoe_description": "<описание предмета или not_found>",
          "transfer_document": "<payment / act / assignment_docs / registration / mixed / not_found>",
          "transfer_deadline": "<срок передачи или not_found>",
          "registration_required": "<yes / no / not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "отступное"
        - "акт приема-передачи"
        - "передача имущества"
        - "право требования"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "otsupnoe_type"
          type: "string"
          allowed_values: ["money", "movable_property", "real_estate", "claim", "securities", "mixed", "not_found"]
          description: "Тип отступного"
        - name: "transfer_document"
          type: "string"
          allowed_values: ["payment", "act", "assignment_docs", "registration", "mixed", "not_found"]
          description: "Документ/механизм передачи"
        - name: "registration_required"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Требуется ли регистрация"
      store_payload: true

  - id: real_character_and_termination_moment_check
    name: "Реальный характер сделки и момент прекращения обязательства"
    description: >
      Проверяет, что прекращение обязательства привязано к фактическому предоставлению
      отступного, а не только к подписанию соглашения.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "с момента передачи отступного"
        - "с момента фактической передачи"
        - "после предоставления отступного"
        - "с момента зачисления денежных средств"
        - "с момента государственной регистрации"
        - "с даты подписания"
      keyword_mode: "any"
      negative_keywords:
        - "обязательство прекращается с даты подписания настоящего соглашения"
      regex_patterns:
        - "(?i)обязательств(о|а).*прекраща(ется|ются).*с\\s+момента"
        - "(?i)с\\s+момента\\s+фактическ(ой|ого)\\s+передач"
        - "(?i)с\\s+даты\\s+подписания"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь, корректно ли определён момент прекращения обязательства.

        Ответь строго в JSON:
        {
          "termination_moment": "<upon_actual_transfer / upon_registration / upon_payment_receipt / upon_signing / unclear / not_found>",
          "real_character_respected": "<yes / no / unclear>",
          "creditor_right_preserved_until_transfer": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "с момента передачи"
        - "фактическая передача"
        - "с даты подписания"
        - "прекращение обязательства"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "termination_moment"
          type: "string"
          allowed_values: ["upon_actual_transfer", "upon_registration", "upon_payment_receipt", "upon_signing", "unclear", "not_found"]
          description: "Момент прекращения обязательства"
        - name: "real_character_respected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Соблюдён ли реальный характер отступного"
      store_payload: true

  - id: valuation_and_settlement_scope_check
    name: "Стоимость отступного и объём погашения долга"
    description: >
      Проверяет, согласована ли стоимость отступного и понятно ли,
      прекращается долг полностью или частично, а также что происходит с остатком.
    triggers:
      any: ["partial_termination", "tax_sensitive_structure"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "стоимость отступного"
        - "оценивается сторонами"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
        - "полное погашение"
        - "неполное погашение"
        - "согласованная стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+отступн"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь стоимость отступного и объём прекращения обязательства.

        Ответь строго в JSON:
        {
          "agreed_value_present": "<yes / no / partial>",
          "debt_termination_scope": "<full / partial / unclear / not_found>",
          "remaining_debt_defined": "<yes / no / not_applicable / not_found>",
          "value_vs_debt_relation": "<equal / lower_but_full_settlement / lower_partial / unclear / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "стоимость отступного"
        - "полное погашение"
        - "остаток долга"
        - "в полном объеме"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "agreed_value_present"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Согласована ли стоимость отступного"
        - name: "debt_termination_scope"
          type: "string"
          allowed_values: ["full", "partial", "unclear", "not_found"]
          description: "Объем прекращения долга"
        - name: "remaining_debt_defined"
          type: "string"
          allowed_values: ["yes", "no", "not_applicable", "not_found"]
          description: "Определен ли остаток долга"
      store_payload: true

  - id: recharacterization_distinction_check
    name: "Отграничение от новации, прощения долга и иных конструкций"
    description: >
      Проверяет, не создает ли текст риска переквалификации соглашения
      в новацию, прощение долга, зачет или иную сделку.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "прощение долга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+новаци"
        - "(?i)не\\s+является\\s+прощени(ем|я)\\s+долг"
        - "(?i)замен(а|яет)\\s+обязательств"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь риск смешения с новацией, прощением долга, зачетом или иной конструкцией.

        Ответь строго в JSON:
        {
          "qualification_as_otsupnoe": "<clear / mixed / doubtful>",
          "novation_risk": "<yes / no / unclear>",
          "debt_forgiveness_risk": "<yes / no / unclear>",
          "setoff_risk": "<yes / no / unclear>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "новация"
        - "прощение долга"
        - "зачет"
        - "отступное"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "qualification_as_otsupnoe"
          type: "string"
          allowed_values: ["clear", "mixed", "doubtful"]
          description: "Четкость квалификации как отступного"
        - name: "novation_risk"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Риск квалификации как новации"
        - name: "debt_forgiveness_risk"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Риск квалификации как прощения долга"
      store_payload: true

  - id: bankruptcy_and_fair_value_risk_check
    name: "Банкротный риск и соразмерность отступного"
    description: >
      Проверяет наличие признаков банкротного риска, несоразмерности стоимости,
      аффилированности и иных факторов оспаривания.
    triggers:
      any: ["bankruptcy_risk_context", "tax_sensitive_structure"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "платежеспособность"
        - "не является сделкой с предпочтением"
        - "рыночная стоимость"
        - "соразмерность"
        - "аффилированность"
        - "кредиторы"
        - "подозрительная сделка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)сделк(а|и)\\s+с\\s+предпочтени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь банкротный риск и соразмерность стоимости.

        Ответь строго в JSON:
        {
          "bankruptcy_risk_disclosed": "<yes / no / partial>",
          "fair_value_support": "<yes / no / partial>",
          "affiliate_risk": "<yes / no / unclear>",
          "challenge_risk_level": "<high / medium / low>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "банкротство"
        - "рыночная стоимость"
        - "предпочтение"
        - "аффилированность"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "bankruptcy_risk_disclosed"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Раскрыт ли банкротный риск"
        - name: "fair_value_support"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Есть ли подтверждение соразмерной стоимости"
        - name: "challenge_risk_level"
          type: "string"
          allowed_values: ["high", "medium", "low"]
          description: "Уровень риска оспаривания"
      store_payload: true

  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Критическая проверка: если прекращаемое обязательство обеспечено залогом,
      ипотекой или поручительством, прекращение основного обязательства отступным
      влечёт прекращение обеспечительных обязательств (ст. 329, 352, 367 ГК РФ).
      Необходимо урегулировать: снятие залога/ипотеки, уведомление поручителей,
      прекращение записей в реестрах, возврат закладной.
    triggers:
      any: ["secured_original_obligation"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь, как урегулирована судьба обеспечений основного обязательства.

        По ст. 329, 352, 367 ГК РФ:
        - Прекращение основного обязательства влечёт прекращение обеспечительных
        - Залог/ипотека подлежат снятию (погашение записи в ЕГРН)
        - Поручительство прекращается автоматически, но поручители должны быть уведомлены
        - Закладная подлежит возврату/погашению

        Ответь строго в JSON:
        {
          "secured_obligation_identified": "<yes / no / not_found>",
          "security_type": "<pledge / mortgage / surety / mixed / not_found>",
          "security_termination_clause": "<described / partial / not_found>",
          "mortgage_release_procedure": "<described / not_found / not_applicable>",
          "surety_notification": "<described / not_found / not_applicable>",
          "pledge_document_return": "<described / not_found / not_applicable>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение"
        - "снятие залога"
        - "закладная"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "security_type"
          type: "string"
          allowed_values: ["pledge", "mortgage", "surety", "mixed", "not_found"]
          description: "Тип обеспечения"
        - name: "security_termination_clause"
          type: "string"
          allowed_values: ["described", "partial", "not_found"]
          description: "Описан ли порядок прекращения обеспечений"
      store_payload: true

  - id: spousal_consent_for_individual_check
    name: "Согласие супруга при передаче совместного имущества (ст. 35 СК РФ)"
    description: >
      Если должник — физлицо и отступным является недвижимость или иное совместно
      нажитое имущество, требуется нотариальное согласие супруга.
      Отсутствие согласия = риск оспаривания сделки (ст. 35 СК РФ).
    triggers:
      any: ["individual_party"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "совместно нажитое имущество"
        - "личная собственность"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
        - "(?i)совместн(о|ого)\\s+нажит"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Если должник — физическое лицо, проверь наличие согласия супруга.

        По ст. 35 СК РФ:
        - Для распоряжения недвижимостью и сделок, требующих нотариального удостоверения
          или госрегистрации, нужно нотариальное согласие супруга
        - При отсутствии — супруг вправе оспорить сделку в течение года

        Ответь строго в JSON:
        {
          "individual_party_as_debtor": "<yes / no / not_found>",
          "spousal_consent_status": "<present / not_married / not_found>",
          "consent_document_type": "<notarized / statement / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "в браке"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["present", "not_married", "not_found"]
          description: "Статус согласия супруга"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны: должник и кредитор"
    description: "Проверяет идентификацию сторон соглашения об отступном"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "должник"
        - "кредитор"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(должник|кредитор).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

  - id: "original_obligation_identification"
    name: "Первоначальное обязательство: точная идентификация"
    description: "Проверяет наличие реквизитов обязательства, которое прекращается"
    legal_base: "ст. 409, 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "обязательство"
        - "договор №"
        - "задолженность"
        - "основной долг"
        - "проценты"
        - "неустойка"
        - "в счет погашения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор\\s*№"
        - "(?i)основн(ой|ого)\\s+долг|процент|неустойк"

  - id: "otsupnoe_subject_description"
    name: "Предмет отступного: индивидуализация"
    description: "Проверяет достаточное описание предмета отступного"
    legal_base: "ст. 409 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "отступное"
        - "денежные средства"
        - "имущество"
        - "право требования"
        - "акт приема-передачи"
        - "кадастровый номер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отступн"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

  - id: "termination_scope_required"
    name: "Объём прекращения: полностью или частично"
    description: "Проверяет, определён ли объём прекращения обязательства"
    legal_base: "ст. 409 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в полном объеме"
        - "полностью"
        - "частично"
        - "остаток долга"
        - "неполное погашение"
        - "прекращается обязательство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"

  - id: "real_character_clause"
    name: "Реальный характер: прекращение после фактического предоставления"
    description: "Проверяет наличие корректной формулировки о моменте прекращения обязательства"
    legal_base: "ст. 409 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "с момента передачи отступного"
        - "с момента фактической передачи"
        - "после предоставления отступного"
        - "после зачисления денежных средств"
        - "после регистрации перехода права"
      keyword_mode: "any"
      negative_keywords:
        - "с даты подписания соглашения"
        - "с момента заключения соглашения"
      regex_patterns:
        - "(?i)с\\s+момента\\s+фактическ(ой|ого)\\s+передач"
        - "(?i)после\\s+предоставления\\s+отступного"

  - id: "agreed_value_of_otsupnoe"
    name: "Согласованная стоимость отступного"
    description: "Проверяет наличие согласованной стоимости предмета отступного"
    legal_base: "ст. 409 ГК РФ, НК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "стоимость отступного"
        - "оценивается сторонами"
        - "рыночная стоимость"
        - "согласованная стоимость"
        - "стоимость для целей налогообложения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+отступн"
        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

  - id: "full_and_final_settlement"
    name: "Полное и окончательное урегулирование"
    description: "Проверяет, закрыт ли риск последующих требований кредитора"
    legal_base: "ст. 409 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "стороны не имеют претензий"
        - "долг считается погашенным"
        - "прекращаются все обязательства"
        - "без права на предъявление дальнейших требований"
        - "окончательное прекращение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+имеют\\s+друг\\s+к\\s+другу\\s+претенз"
        - "(?i)долг\\s+считается\\s+погашенн"

  - id: "real_estate_registration_clause"
    name: "Недвижимость как отступное: регистрация перехода права"
    description: "Проверяет порядок госрегистрации, если отступное — недвижимость"
    legal_base: "ст. 131, 551 ГК РФ, ФЗ-218"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["real_estate_as_otsupnoe"]
    rules:
      keywords:
        - "государственная регистрация"
        - "ЕГРН"
        - "Росреестр"
        - "переход права собственности"
        - "расходы на регистрацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)ЕГРН|Росреестр"

  - id: "claim_assignment_specifics"
    name: "Право требования как отступное: условия уступки"
    description: "Проверяет описание уступаемого требования и передачу подтверждающих документов"
    legal_base: "ст. 382-390, 409 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["claim_assignment_as_otsupnoe"]
    rules:
      keywords:
        - "право требования"
        - "уступка"
        - "должник по требованию"
        - "документы, удостоверяющие требование"
        - "передача документов"
        - "объем уступаемого права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступк(а|и)\\s+прав"
        - "(?i)право\\s+требован"
        - "(?i)передач(а|и)\\s+документ"

  - id: "warranties_for_otsupnoe_subject"
    name: "Гарантии в отношении предмета отступного"
    description: "Проверяет наличие заверений о титуле, обременениях и качестве предмета"
    legal_base: "ст. 460, 469, 475 ГК РФ по аналогии"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "право собственности принадлежит"
        - "надлежащее качество"
        - "отсутствие скрытых недостатков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободн(о|ым)\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+заложен|не\\s+арестован"

  - id: "bankruptcy_risk_disclosure"
    name: "Банкротный риск: заверения о платежеспособности и отсутствии preference risk"
    description: "Проверяет наличие заверений о банкротном статусе и добросовестности сделки"
    legal_base: "ФЗ-127"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bankruptcy_risk_context"]
    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "платежеспособность"
        - "не является сделкой с предпочтением"
        - "не нарушает права кредиторов"
        - "не находится в процедуре банкротства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)сделк(а|и)\\s+с\\s+предпочтени"

  - id: "risk_allocation_before_transfer"
    name: "Распределение рисков до передачи отступного"
    description: "Проверяет, кто несет риск случайной гибели/повреждения до передачи"
    legal_base: "ст. 211, 459 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск повреждения"
        - "до момента передачи"
        - "несет должник"
        - "обязанность по сохранности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел"
        - "(?i)до\\s+момента\\s+передач"

  - id: "tax_liabilities_allocation"
    name: "Налоговые последствия и первичные документы"
    description: "Проверяет распределение налоговых рисков и документального оформления"
    legal_base: "НК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["tax_sensitive_structure"]
    rules:
      keywords:
        - "налоговые обязательства"
        - "НДС"
        - "доход кредитора"
        - "расход должника"
        - "первичные документы"
        - "акт приема-передачи"
        - "стоимость для целей налогообложения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налогов(ые|ых|ой)\\s+обязательств"
        - "(?i)первичн(ые|ых)\\s+документ"

  - id: "corporate_approvals_if_needed"
    name: "Корпоративные одобрения при необходимости"
    description: "Проверяет наличие одобрений, если сторона — юрлицо и сделка может быть крупной/заинтересованной"
    legal_base: "ФЗ-14, ФЗ-208"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["corporate_approval_context"]
    rules:
      keywords:
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "решение единственного участника"
        - "одобрение не требуется"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"

  - id: "distinction_from_novation_and_forgiveness"
    name: "Отграничение от новации / прощения долга / зачета"
    description: "Проверяет, отражено ли в тексте отличие от иных способов прекращения обязательств"
    legal_base: "ст. 409-415 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "ст. 409 ГК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+новаци"
        - "(?i)не\\s+является\\s+прощени(ем|я)\\s+долг"
        - "(?i)не\\s+является\\s+зачет"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет наличие подсудности и/или претензионного порядка"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "подсудность"
        - "арбитражный суд"
        - "претензионный порядок"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "confidentiality"
    name: "Конфиденциальность"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "не раскрывать третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "otsupnoe_transfer_deadline"
    name: "Срок предоставления отступного (ст. 409 ГК РФ)"
    description: "Проверяет наличие конкретного срока передачи отступного — элемент существенных условий"
    legal_base: "ст. 409 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в течение"
        - "не позднее"
        - "срок передачи"
        - "срок предоставления"
        - "до даты"
        - "календарных дней"
        - "рабочих дней"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дней|банковск)"
        - "(?i)срок\\s+(передач|предоставлен).*отступн"

  - id: "security_release_on_termination"
    name: "Судьба обеспечений при прекращении обязательства"
    description: "Проверяет наличие условий о снятии залога/ипотеки/поручительства"
    legal_base: "ст. 329, 352, 367 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["secured_original_obligation"]
    rules:
      keywords:
        - "залог прекращается"
        - "снятие залога"
        - "снятие ипотеки"
        - "погашение записи об ипотеке"
        - "поручительство прекращается"
        - "возврат закладной"
        - "прекращение обеспечения"
        - "освобождение от обеспечения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ|снят(ие|ь)\\s+залог"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"

  - id: "spousal_consent_required"
    name: "Согласие супруга при передаче совместного имущества (ст. 35 СК РФ)"
    description: "Проверяет наличие согласия супруга или подтверждения отсутствия брака"
    legal_base: "ст. 35 СК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["individual_party"]
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "личная собственность"
        - "совместно нажитое"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты должника и кредитора,
      включая ИНН/ОГРН или паспортные данные, адреса и полномочия подписантов.
    addressee: "Обе стороны"

  original_obligation_extraction:
    text: >
      Просим предоставить по {doc_names}: точные реквизиты прекращаемого обязательства,
      состав долга (основной долг, проценты, неустойка), сумму задолженности
      и указание, прекращается ли обязательство полностью или частично.
    addressee: "Обе стороны"

  original_obligation_identification:
    text: >
      Просим уточнить в {doc_names}: какое именно обязательство прекращается,
      на каком основании возник долг, каков его размер и состав.
    addressee: "Юридический советник"

  otsupnoe_subject_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание предмета отступного,
      порядок фактической передачи, подтверждающие документы, срок передачи
      и указание, требуется ли регистрация/дополнительные transfer steps.
    addressee: "Должник / Юридический советник"

  otsupnoe_subject_description:
    text: >
      Просим уточнить в {doc_names}: точный предмет отступного, его индивидуализирующие
      признаки, комплект документов и форму передачи.
    addressee: "Должник"

  real_character_and_termination_moment_check:
    text: >
      Просим уточнить в {doc_names}, что обязательство прекращается не в момент
      подписания соглашения, а в момент фактического предоставления отступного
      (либо регистрации / зачисления денежных средств, если применимо).
    addressee: "Юридический советник"

  real_character_clause:
    text: >
      Просим привести в {doc_names} формулировку о моменте прекращения обязательства
      в соответствие с реальным характером отступного по ст. 409 ГК РФ.
    addressee: "Юридический советник"

  valuation_and_settlement_scope_check:
    text: >
      Просим уточнить в {doc_names}: согласованную стоимость отступного,
      прекращается ли долг полностью или частично, и как определяется остаток
      задолженности (если он сохраняется).
    addressee: "Обе стороны"

  agreed_value_of_otsupnoe:
    text: >
      Просим подтвердить в {doc_names}: стоимость отступного, метод её определения
      и значение этой стоимости для налоговых и расчётных целей.
    addressee: "Финансовый / Налоговый консультант"

  termination_scope_required:
    text: >
      Просим уточнить в {doc_names}: долг прекращается полностью или частично,
      а также остаются ли у кредитора какие-либо дополнительные требования.
    addressee: "Юридический советник"

  full_and_final_settlement:
    text: >
      Просим включить/уточнить в {doc_names} условие о полном и окончательном
      урегулировании обязательства и отсутствии дальнейших претензий,
      если именно это соответствует воле сторон.
    addressee: "Юридический советник"

  recharacterization_distinction_check:
    text: >
      Просим уточнить в {doc_names}: что соглашение квалифицируется именно как
      отступное по ст. 409 ГК РФ, а не как новация, прощение долга, зачет
      или иная конструкция.
    addressee: "Юридический советник"

  distinction_from_novation_and_forgiveness:
    text: >
      Просим включить в {doc_names} формулировки, исключающие риск смешения
      с новацией, прощением долга и зачетом.
    addressee: "Юридический советник"

  bankruptcy_and_fair_value_risk_check:
    text: >
      Просим предоставить по {doc_names}: сведения о платежеспособности должника,
      отсутствии признаков банкротства, подтверждение рыночной / согласованной
      соразмерной стоимости отступного и анализ риска оспаривания сделки.
    addressee: "Финансовый консультант / Юридический советник"

  bankruptcy_risk_disclosure:
    text: >
      Просим подтвердить по {doc_names}, что должник не находится в процедуре
      банкротства, не обладает признаками неплатежеспособности и сделка
      не предоставляет предпочтение одному кредитору перед другими.
    addressee: "Должник / Юридический советник"

  real_estate_registration_clause:
    text: >
      Если в {doc_names} отступным является недвижимость, просим предоставить:
      кадастровые данные, выписку ЕГРН, правоустанавливающие документы,
      порядок регистрации перехода права и распределение расходов на регистрацию.
    addressee: "Должник / Юридический советник"

  claim_assignment_specifics:
    text: >
      Если в {doc_names} отступным является право требования, просим предоставить:
      основание требования, договор/документы, сведения о должнике по уступаемому
      требованию, объем права и комплект передаваемых подтверждающих документов.
    addressee: "Должник / Юридический советник"

  warranties_for_otsupnoe_subject:
    text: >
      Просим предоставить по {doc_names}: заверения должника о титуле на предмет
      отступного, отсутствии обременений, арестов, прав третьих лиц и скрытых недостатков.
    addressee: "Должник"

  risk_allocation_before_transfer:
    text: >
      Просим уточнить в {doc_names}: кто несет риск случайной гибели/повреждения
      предмета отступного до его фактической передачи кредитору.
    addressee: "Юридический советник"

  tax_liabilities_allocation:
    text: >
      Просим уточнить в {doc_names}: налоговые последствия сделки для каждой стороны,
      стоимость отступного для целей налогообложения, необходимость оформления
      первичных документов и НДС-последствия.
    addressee: "Налоговый консультант"

  corporate_approvals_if_needed:
    text: >
      Просим предоставить по {doc_names}: корпоративные одобрения сделки
      (если сторона — юрлицо и требуется одобрение как крупной / заинтересованной),
      либо заключение о том, что одобрение не требуется.
    addressee: "Корпоративный юрист"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность споров, наличие претензионного
      порядка и процедуру разрешения разногласий.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} условия о конфиденциальности и неразглашении
      условий урегулирования долга.
    addressee: "Юридический советник"

  bankruptcy_preference_or_suspect_transaction_risk:
    text: >
      Внимание: по {doc_names} имеется риск оспаривания как предпочтительной
      или подозрительной сделки в банкротстве. Просим предоставить банкротный анализ,
      подтверждение платежеспособности и fair value memorandum.
    addressee: "Юридический советник / Финансовый консультант"

  real_estate_transfer_registration_required:
    text: >
      Внимание: если в {doc_names} отступным является недвижимость,
      требуется государственная регистрация перехода права. Просим подготовить
      регистрационный пакет и план действий по подаче документов в Росреестр.
    addressee: "Юридический советник / Росреестр"

  claim_assignment_identification_required:
    text: >
      Внимание: если в {doc_names} отступным является право требования,
      требуется полная идентификация уступаемого права и пакет transfer documents.
      Просим предоставить договор-основание, уведомление должника и документы по требованию.
    addressee: "Юридический советник"

  misclassification_risk_not_novation_or_forgiveness:
    text: >
      Внимание: {doc_names} содержит риск неверной квалификации. Просим
      уточнить конструкцию сделки и привести формулировки в соответствие
      именно с моделью отступного по ст. 409 ГК РФ.
    addressee: "Юридический советник"

  secured_obligation_fate_check:
    text: >
      Просим уточнить в {doc_names}: если прекращаемое обязательство обеспечено
      залогом/ипотекой/поручительством — как урегулирована судьба обеспечений:
      снятие залога/ипотеки (погашение записи в ЕГРН), уведомление поручителей,
      возврат закладной, порядок и сроки совершения регистрационных действий.
    addressee: "Юридический советник / Кредитор"

  security_release_on_termination:
    text: >
      Просим включить в {doc_names}: порядок прекращения обеспечительных обязательств
      (залог, ипотека, поручительство) в связи с прекращением основного обязательства
      отступным (ст. 329, 352, 367 ГК РФ).
    addressee: "Юридический советник"

  spousal_consent_for_individual_check:
    text: >
      Если должник по {doc_names} — физическое лицо, просим предоставить:
      нотариальное согласие супруга на распоряжение совместным имуществом (ст. 35 СК РФ)
      либо подтверждение, что должник в браке не состоит / имущество является личной
      собственностью / действует брачный договор.
    addressee: "Должник"

  otsupnoe_transfer_deadline:
    text: >
      Просим уточнить в {doc_names}: конкретный срок предоставления отступного
      (ст. 409 ГК РФ требует указания размера, сроков и порядка). Укажите дату
      или количество дней с даты подписания, а также последствия просрочки.
