      - "(?i)пожизненн.*содерж"
      - "(?i)иждивен"
      - "(?i)annuity"
      - "(?i)lifetime[\\s_]maintenance"

    folder_patterns:
      - "(?i)рент"
      - "(?i)annuity"
      - "(?i)maintenance"

    keywords:

      high:
        - "рента"
        - "пожизненная рента"
        - "постоянная рента"
        - "пожизненное содержание"
        - "иждивение"
        - "получатель ренты"
        - "плательщик ренты"
        - "передает имущество под выплату ренты"
        - "алеаторный договор"

      medium:
