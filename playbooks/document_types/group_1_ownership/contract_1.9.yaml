dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}:
      получателя ренты и плательщика ренты, включая паспортные данные /
      ИНН, ОГРН, адрес и полномочия подписантов.
    addressee: "Обе стороны"

  rent_type_and_core_terms_extraction:
    text: >
      Просим предоставить по {doc_names}: вид ренты, описание имущества,
      форму рентного предоставления (деньги / содержание), периодичность,
      а также статус сторон как получателя и плательщика ренты.
    addressee: "Обе стороны"

  notarization_check:
    text: >
      Просим подтвердить по {doc_names}: нотариальное удостоверение договора,
      данные нотариуса, дату удостоверения и реестровый номер нотариального действия.
    addressee: "Нотариус / Юридический советник"

  notarial_form_required:
    text: >
      Просим прямо указать в {doc_names}, что договор подлежит нотариальному
      удостоверению, и предоставить сведения о нотариусе, удостоверившем сделку.
    addressee: "Юридический советник"

  property_identification:
    text: >
      Просим уточнить в {doc_names} имущество, передаваемое под выплату ренты:
      точное описание, адрес, кадастровый номер / иные индивидуализирующие признаки,
      правоустанавливающие документы.
    addressee: "Получатель ренты"

  property_and_statutory_pledge_check:
    text: >
      Просим уточнить в {doc_names}: описание имущества, наличие обременения рентой,
      залога в силу закона в пользу получателя ренты, а также порядок регистрации
      обременения (для недвижимости).
    addressee: "Юридический советник"

  rent_type_required:
    text: >
      Просим уточнить в {doc_names} вид ренты: постоянная, пожизненная
      или пожизненное содержание с иждивением.
    addressee: "Юридический советник"

  rent_amount_and_periodicity:
    text: >
      Просим уточнить в {doc_names}: размер ренты / объём содержания,
      периодичность предоставления, дату начала исполнения и порядок расчёта.
    addressee: "Обе стороны"

  rent_amount_indexation_check:
    text: >
      Просим уточнить в {doc_names}: размер ренты, минимальный размер,
      привязку к прожиточному минимуму, механизм индексации и периодичность выплат.
    addressee: "Юридический советник"

  pm_link_and_indexation:
    text: >
      Просим включить в {doc_names} механизм индексации ренты и ссылку
      на прожиточный минимум / иной допустимый механизм корректировки.
    addressee: "Юридический советник"

  statutory_pledge_and_security:
    text: >
      Просим уточнить в {doc_names}: наличие залога в силу закона,
      обременения рентой и дополнительного обеспечения исполнения обязательств.
    addressee: "Юридический советник"

  lifetime_maintenance_scope_check:
    text: >
      Для {doc_names} (содержание с иждивением) просим детализировать:
      питание, лекарства, медицинскую помощь, жильё, коммунальные услуги,
      бытовой уход, ритуальные услуги, график и стандарты предоставления.
    addressee: "Плательщик ренты / Юридический советник"

  lifetime_maintenance_detailed_scope:
    text: >
      Просим конкретизировать в {doc_names} объём натурального содержания:
      какие услуги, товары и расходы покрывает плательщик ренты.
    addressee: "Юридический советник"

  funeral_services_clause:
    text: >
      Просим уточнить в {doc_names}: обязанность плательщика ренты
      по организации и оплате ритуальных услуг / расходов на погребение.
    addressee: "Юридический советник"

  cash_substitution_clause:
    text: >
      Просим уточнить в {doc_names}: допускается ли замена натурального
      содержания денежными выплатами, в каком порядке и размере.
    addressee: "Юридический советник"

  redemption_and_termination_check:
    text: >
      Просим уточнить в {doc_names}: право на выкуп ренты, выкупную цену,
      основания расторжения, последствия нарушения и возможность возврата имущества.
    addressee: "Юридический советник"

  buyout_right_and_price:
    text: >
      Просим уточнить в {doc_names}: кто и в каком порядке вправе требовать
      выкупа ренты, как определяется выкупная цена, сроки уведомления.
    addressee: "Юридический советник"

  termination_and_return_of_property:
    text: >
      Просим уточнить в {doc_names}: основания расторжения, критерии
      существенного нарушения, порядок возврата имущества и снятия обременения.
    addressee: "Юридический советник"

  risk_of_accidental_loss:
    text: >
      Просим уточнить в {doc_names}: кто несёт риск случайной гибели имущества
      и влияет ли гибель имущества на обязанность по дальнейшей выплате ренты.
    addressee: "Юридический советник"

  insurance_of_property:
    text: >
      Просим уточнить в {doc_names}: порядок страхования имущества и/или
      ответственности плательщика ренты, выгодоприобретателя и минимальную страховую сумму.
    addressee: "Плательщик ренты / Страховой консультант"

  unconscionability_and_capacity_check:
    text: >
      Просим предоставить по {doc_names}: подтверждение добровольности заключения,
      дееспособности получателя ренты, независимую оценку имущества (если есть),
      а также информацию о том, какие разъяснения были даны нотариусом.
    addressee: "Нотариус / Юридический советник"

  unconscionability_protection:
    text: >
      Просим включить в {doc_names} заверения о добровольности сделки,
      понимании её последствий, отсутствии давления и кабальности,
      а также указать рыночную стоимость имущества / наличие оценки.
    addressee: "Юридический советник"

  abuse_protection_mechanisms:
    text: >
      Просим уточнить в {doc_names}: механизмы защиты получателя ренты
      от злоупотреблений при содержании — право на общение с родственниками,
      контроль качества ухода, доступ медицинской помощи и третьих лиц.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и способ разрешения споров, включая споры о качестве содержания.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} положения о конфиденциальности
      и неразглашении условий сделки.
    addressee: "Юридический советник"

  mandatory_notarization_required:
    text: >
      Внимание: для {doc_names} нотариальная форма обязательна.
      Просим подтвердить факт нотариального удостоверения; при его отсутствии
      договор несёт риск ничтожности по ст. 584 ГК РФ.
    addressee: "Юридический советник / Нотариус"

  real_estate_registration_and_encumbrance_required:
    text: >
      Внимание: для {doc_names}, предусматривающего передачу недвижимости,
      требуется регистрация перехода права, обременения рентой и залога
      в силу закона. Просим предоставить план регистрационных действий.
    addressee: "Юридический советник / Росреестр"

  movable_property_security_required:
    text: >
      Внимание: при передаче движимого имущества по {doc_names} необходимо
      дополнительное обеспечение выплаты ренты. Просим предоставить сведения
      о поручительстве, гарантии, залоге либо страховании ответственности.
    addressee: "Плательщик ренты / Юридический советник"

  reclassification_risk_not_rent:
    text: >
      Внимание: {doc_names} содержит риск переквалификации, если отсутствуют
      периодические рентные платежи/содержание. Просим уточнить рентную природу
      обязательств и исключить признаки купли-продажи или дарения.
    addressee: "Юридический советник"

  alienation_restriction_compliance_check:
    text: >
      Просим уточнить в {doc_names}: (а) наличие прямого запрета на отчуждение,
      залог и обременение имущества без согласия получателя ренты (ст. 604 ГК РФ);
      (б) процедуру получения согласия; (в) последствия нарушения запрета;
      (г) распространяется ли запрет на сдачу в аренду.
    addressee: "Юридический советник"

  alienation_restriction_clause:
    text: >
      Просим включить в {doc_names} условие о запрете плательщику ренты
      отчуждать, закладывать или иным образом обременять имущество
      без предварительного согласия получателя ренты (ст. 604 ГК РФ).
    addressee: "Юридический советник"

  payer_succession_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок перехода обязательств
      по выплате ренты при отчуждении имущества (ст. 586 ГК РФ);
      (б) тип ответственности прежнего плательщика — субсидиарная или солидарная;
      (в) порядок уведомления получателя ренты о смене плательщика.
    addressee: "Юридический советник"

  payer_succession_clause:
    text: >
      Просим включить в {doc_names}: условие о переходе обязательств
      к новому собственнику имущества и установить солидарную (вместо субсидиарной)
      ответственность прежнего плательщика для усиления защиты получателя ренты.
    addressee: "Юридический советник"

  paid_vs_free_transfer:
    text: >
      Просим уточнить в {doc_names}: имущество передаётся за плату
      или бесплатно (ст. 585 ГК РФ). Это существенно влияет на:
      (а) выкупную цену (ст. 594); (б) применимые правила (купля-продажа/дарение);
      (в) последствия расторжения (возврат имущества).
    addressee: "Юридический советник"

  late_payment_penalty:
    text: >
      Просим уточнить в {doc_names}: размер процентов/неустойки за просрочку
      выплаты ренты, порядок начисления (ст. 588, 395 ГК РФ), право получателя
      требовать выкупа при систематической просрочке.
    addressee: "Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право.
    addressee: "Юридический советник"

  alienation_prohibition_lifetime_maintenance:
    text: >
      Внимание: для {doc_names} (содержание с иждивением) плательщик ренты
      не вправе отчуждать, закладывать или обременять имущество без предварительного
      согласия получателя ренты (ст. 604 ГК РФ). Просим подтвердить наличие
      данного условия в договоре и описать процедуру получения согласия.
    addressee: "Юридический советник"

  permanent_rent_recipient_limitation:
    text: >
      Внимание: по {doc_names} (постоянная рента) получателями могут быть только
      граждане и некоммерческие организации (ст. 589 ГК РФ). Просим подтвердить
      статус получателя ренты и предоставить документы, подтверждающие
      его правоспособность быть получателем постоянной ренты.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    