type: contract_1.9
name: "Договор ренты"

description: |
  Алеаторный (рисковый) договор, по которому получатель ренты передает имущество в собственность
  плательщику ренты, а плательщик обязуется в обмен периодически выплачивать получателю ренту
  в виде денежной суммы либо предоставлять содержание в иной форме.
  Договор характеризуется элементом случайности, обязательной нотариальной формой,
  императивным регулированием в защиту получателя ренты и специальными способами обеспечения
  обязательств плательщика. Основные виды: постоянная рента, пожизненная рента,
  пожизненное содержание с иждивением. Для недвижимости критичны регистрация перехода права
  и обременения, а также залог в силу закона в пользу получателя ренты.

version: 4.0
parent: class_1_transfer_of_ownership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 33 ГК РФ (ст. 583-605)"
  doc_types_supported:
    - "договор ренты"
    - "договор постоянной ренты"
    - "договор пожизненной ренты"
    - "договор пожизненного содержания с иждивением"
    - "договор содержания с иждивением"
    - "рентный договор под недвижимость"
    - "договор ренты с выкупом"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

