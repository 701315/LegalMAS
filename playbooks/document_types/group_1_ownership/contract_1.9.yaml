# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  pm_reference: "(?i)(прожиточн(ый|ого)\\s+минимум|ПМ)"
  periodicity: "(?i)(ежемесячно|ежеквартально|ежегодно|каждый\\s+месяц|раз\\s+в\\s+месяц)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "mandatory_notarization_required"
    name: "Обязательная нотариальная форма договора ренты (ст. 584 ГК РФ)"
    description: >
      Договор ренты подлежит обязательному нотариальному удостоверению.
      Отсутствие нотариальной формы влечёт ничтожность договора.
    legal_base: "ст. 584 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "рента"
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "нотариальное удостоверение"
        - "ст. 584 ГК РФ"
      rerank: true

  - id: "real_estate_registration_and_encumbrance_required"
    name: "Недвижимость под ренту: регистрация перехода права и обременения"
    description: >
      При передаче недвижимости под выплату ренты требуется регистрация перехода права,
      а также регистрация обременения и залога в силу закона в пользу получателя ренты.
    legal_base: "ст. 584, 587 ГК РФ, ФЗ-218"
    required_triggers: ["real_estate_transfer"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "государственная регистрация"
        - "обременение рентой"
        - "залог в силу закона"
        - "ЕГРН"
        - "Росреестр"
        - "переход права собственности"
      keyword_mode: "any"
    retrieval:
      context_k: 6
      boost_keywords:
        - "обременение рентой"
        - "залог в силу закона"
        - "Росреестр"
        - "ЕГРН"
      rerank: true

  - id: "movable_property_security_required"
    name: "Движимое имущество: обязательное обеспечение выплаты ренты"
    description: >
      При передаче под выплату ренты движимого имущества плательщик обязан предоставить
      обеспечение исполнения обязательств либо застраховать риск ответственности.
    legal_base: "ст. 587 п. 2 ГК РФ"
    required_triggers: ["movable_property_rent"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "поручительство"
        - "банковская гарантия"
        - "залог"
        - "страхование ответственности"
        - "обеспечение обязательств"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "обеспечение обязательств"
        - "страхование ответственности"
        - "ст. 587"
      rerank: true

  - id: "reclassification_risk_not_rent"
    name: "Риск переквалификации: нет периодичности / нет рентной природы"
    description: >
      Если договор предусматривает только единовременную оплату или безвозмездную передачу
      без периодических платежей/содержания, это создаёт риск переквалификации в куплю-продажу
      либо дарение.
    legal_base: "ст. 572, 583 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "единовременная выплата"
        - "разовый платеж"
        - "безвозмездно"
        - "отсутствие периодических выплат"
        - "без выплаты ренты"
        - "без содержания"
        - "без обязательств по уходу"
      keyword_mode: "any"
      negative_keywords:
        - "ежемесячно"
        - "ежеквартально"
        - "ежегодно"
        - "периодические выплаты"
        - "рентные платежи"
        - "содержание с иждивением"
    retrieval:
      context_k: 5
      boost_keywords:
        - "единовременная выплата"
        - "безвозмездно"
        - "периодические выплаты"
      rerank: true

  - id: "alienation_prohibition_lifetime_maintenance"
    name: "Содержание с иждивением: запрет отчуждения без согласия получателя (ст. 604 ГК РФ)"
    description: >
      Плательщик ренты по договору пожизненного содержания с иждивением вправе
      отчуждать, сдавать в залог или иным способом обременять имущество, переданное
      в обеспечение содержания, ТОЛЬКО с предварительного согласия получателя ренты.
      Нарушение влечёт недействительность сделки по распоряжению имуществом.
    legal_base: "ст. 604 ГК РФ"
    required_triggers: ["lifetime_maintenance"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "запрет отчуждения"
        - "без согласия получателя"
        - "распоряжение только с согласия"
        - "ст. 604"
        - "не вправе отчуждать"
        - "запрет залога"
        - "запрет обременения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "запрет отчуждения"
        - "согласие получателя ренты"
        - "ст. 604 ГК"
        - "распоряжение имуществом"
      rerank: true

  - id: "permanent_rent_recipient_limitation"
    name: "Постоянная рента: получателями могут быть только граждане и НКО (ст. 589 ГК РФ)"
    description: >
      Получателями постоянной ренты могут быть только граждане и некоммерческие
      организации, если это не противоречит закону и целям их деятельности.
      Коммерческие организации не могут быть получателями постоянной ренты.
    legal_base: "ст. 589 ГК РФ"
    required_triggers: ["permanent_rent"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "получатель постоянной ренты"
        - "коммерческая организация"
        - "ООО"
        - "АО"
        - "ПАО"
        - "получатель ренты — юридическое лицо"
      keyword_mode: "any"
      negative_keywords:
        - "некоммерческая организация"
        - "фонд"
        - "гражданин"
        - "физическое лицо"
    retrieval:
      context_k: 5
      boost_keywords:
        - "получатель постоянной ренты"
        - "ст. 589 ГК"
        - "коммерческая организация"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: rent_type_and_core_terms_extraction
    name: "Рента: извлечение вида договора и ключевых условий"
    description: >
      Извлекает вид ренты, передаваемое имущество, форму выплат/содержания,
      периодичность и иные базовые условия.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "пожизненное содержание с иждивением"
        - "получатель ренты"
        - "плательщик ренты"
        - "передает имущество"
        - "рентные платежи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)постоянн(ая|ой)\\s+рент"
        - "(?i)пожизненн(ая|ой)\\s+рент"
        - "(?i)пожизненн(ое|ого)\\s+содержани"
        - "(?i)(ежемесячно|ежеквартально|ежегодно|каждый\\s+месяц)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор ренты.
        Извлеки ключевые условия договора.

        Ответь строго в JSON:
        {
          "rent_type": "<permanent / life_annuity / lifetime_maintenance / mixed / not_found>",
          "property_description": "<описание имущества или not_found>",
          "property_kind": "<real_estate / movable / mixed / not_found>",
          "payment_form": "<money / in_kind / mixed / not_found>",
          "payment_periodicity": "<monthly / quarterly / yearly / custom / not_found>",
          "recipient": "<получатель ренты или not_found>",
          "payer": "<плательщик ренты или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 550
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "содержание с иждивением"
        - "рентные платежи"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "rent_type"
          type: "string"
          allowed_values: ["permanent", "life_annuity", "lifetime_maintenance", "mixed", "not_found"]
          description: "Вид ренты"
        - name: "property_kind"
          type: "string"
          allowed_values: ["real_estate", "movable", "mixed", "not_found"]
          description: "Вид передаваемого имущества"
        - name: "payment_form"
          type: "string"
          allowed_values: ["money", "in_kind", "mixed", "not_found"]
          description: "Форма рентного предоставления"
        - name: "payment_periodicity"
          type: "string"
          allowed_values: ["monthly", "quarterly", "yearly", "custom", "not_found"]
          description: "Периодичность выплат/содержания"
      store_payload: true

  - id: notarization_check
    name: "Нотариальная форма договора ренты (ст. 584 ГК РФ)"
    description: "Проверяет наличие указания на обязательное нотариальное удостоверение"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "удостоверено нотариусом"
        - "нотариус"
        - "реестровый номер"
        - "совершено в нотариальной форме"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ое|ой)\\s+удостоверен"
        - "(?i)удостоверен[ао]?\\s+нотариусом"
