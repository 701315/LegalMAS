        - "периодические выплаты"
        - "прожиточный минимум"
        - "содержание с иждивением"
        - "обременение рентой"
        - "залог в силу закона"
        - "выкуп ренты"
        - "индексация ренты"
        - "нотариальное удостоверение"
        - "ст. 583 ГК"
        - "ст. 584 ГК"
        - "ст. 587 ГК"
        - "ст. 601 ГК"
        - "ст. 602 ГК"
        - "ст. 604 ГК"
        - "отчуждение имущества с условием содержания"
        - "запрет отчуждения без согласия получателя"

      low:
        - "выкупная цена"
        - "ритуальные услуги"
        - "уход"
        - "продуктовый набор"
        - "лекарства"
        - "обеспечение потребностей"
        - "рентный договор"

    exclusions:
      - "аренда"
      - "купля-продажа с рассрочкой"
      - "дарение"
      - "единовременная оплата"
      - "безвозмездная передача без выплат"
      - "наследование"
      - "завещание"
      - "пожертвование"
      - "алименты"
      - "социальный контракт"
      - "договор возмездного оказания услуг по уходу"
      - "договор доверительного управления"

