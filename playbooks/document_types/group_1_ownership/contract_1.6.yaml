        - "yes_not_used" — продавец прямо заверяет, что маткапитал не использовался
        - "yes_used_and_complied" — маткапитал использовался, доли выделены
        - "not_addressed" — вопрос не раскрыт (высокий риск!)
        - "not_found" — нет упоминания

        ВАЖНО: Если вопрос не раскрыт — это КРИТИЧЕСКИЙ риск для жилой недвижимости.
