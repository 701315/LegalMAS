      regex_patterns:
        - "(?i)техническ(ая|ой)\\s+документ"
        - "(?i)разрешени(е|я)\\s+на\\s+(строительств|ввод)"

  - id: "utilities_and_servitudes"
    name: "Инженерные коммуникации и сервитуты (ст. 274 ГК РФ)"
    description: "Проверяет наличие информации о коммуникациях и сервитутах"
    legal_base: "ст. 274 ГК РФ, ФЗ-218"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "инженерные коммуникации"
        - "сервитут"
        - "охранная зона"
        - "ЛЭП"
        - "трубопровод"
        - "газопровод"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сервитут|охранн(ая|ой)\\s+зон"

  - id: "mcd_common_property_approval"
    name: "Общее имущество МКД: решение общего собрания собственников"
    description: "Проверяет наличие решения общего собрания при продаже общего имущества МКД"
    legal_base: "ЖК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["mcd_common_property_sale"]
    rules:
      keywords:
        - "общее собрание собственников"
        - "протокол общего собрания"
        - "решение собственников"
        - "кворум"
        - "голосование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)протокол\\s+общ(его|его\\s+собрания)\\s+собственник"

  - id: "seller_title_and_egrn_extract"
    name: "Титул продавца и актуальная выписка ЕГРН"
    description: "Проверяет наличие ссылки на правоустанавливающие документы и выписку ЕГРН"
    legal_base: "ФЗ-218"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "выписка из ЕГРН"
        - "правоустанавливающ"
        - "правоподтверждающ"
        - "запись ЕГРН"
        - "свидетельство о праве"
        - "основание права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"

  - id: "notary_requirement_for_share_sale"
    name: "Нотариальное удостоверение (для долей — обязательно)"
    description: "Проверяет наличие условия о нотариальном удостоверении для сделок с долями"
    legal_base: "ГК РФ (форма сделки), ФЗ-218"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["share_in_right_sale"]
    rules:
      keywords:
        - "нотариус"
        - "нотариальное удостоверение"
        - "удостоверено нотариусом"
        - "нотариальная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ое|ым)\\s+удостоверен"

  - id: "no_change_of_land_purpose_without_consent"
    name: "Запрет изменения категории/ВРИ без согласия продавца (ковенант)"
    description: "Проверяет наличие ковенанта о запрете смены назначения земли"
    legal_base: "ст. 421 ГК РФ, ЗК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["land_plot_sale"]
    rules:
      keywords:
        - "не изменять"
        - "вид разрешенного использования"
        - "категория земель"
        - "целевое назначение"
        - "без согласия продавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+измен(ять|яет).*?(вид\\s+разрешенн|ВРИ|категор|целев)"
        - "(?i)без\\s+согласия\\s+продавц"

  - id: "retention_of_ownership_mortgage_by_law"
    name: "Ипотека в силу закона при рассрочке — не отменять (ст. 488 ГК РФ)"
    description: "Проверяет отсутствие исключения ипотеки в силу закона при рассрочке платежа"
    legal_base: "ст. 488 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ипотека в силу закона"
        - "в залоге у продавца"
        - "до полной оплаты"
      keyword_mode: "any"
      negative_keywords:
        - "ипотека в силу закона не возникает"
        - "залог не возникает"
        - "право залога не применяется"
      regex_patterns:
        - "(?i)ипотек.*в\\s+силу\\s+закона"

  - id: "corporate_approval"
    name: "Корпоративное одобрение (крупная сделка / сделка с заинтересованностью)"
    description: "Проверяет наличие одобрения или заверения об отсутствии необходимости одобрения для ЮЛ-стороны"
    legal_base: "ФЗ-14, ФЗ-208"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["legal_entity_party"]
    rules:
      keywords:
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "не является крупной сделкой"
        - "корпоративное одобрение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"

  - id: "maternity_capital_clause"
    name: "Маткапитал: заверение продавца о неиспользовании или выполнении обязательств (ФЗ-256)"
    description: "Проверяет наличие заверения продавца об отсутствии маткапитала или о выделении долей"
    legal_base: "ст. 10 ФЗ-256"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["residential_property"]
    rules:
      keywords:
        - "материнский капитал"
        - "маткапитал"
        - "средства МСК"
        - "не использовались средства маткапитала"
        - "выделение долей детям"
        - "обязательство о наделении долями"
        - "Пенсионный фонд"
        - "ФЗ-256"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материнск(ий|ого)\\s+капитал"
        - "(?i)не\\s+использовал(ись|ся).*капитал"

  - id: "seller_bankruptcy_warranty"
    name: "Заверение продавца об отсутствии признаков банкротства"
    description: "Проверяет наличие заверения продавца об отсутствии банкротных процедур и признаков неплатежеспособности"
    legal_base: "ФЗ-127, ст. 61.2-61.3"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "не находится в процедуре банкротства"
        - "отсутствие признаков банкротства"
        - "отсутствие признаков неплатежеспособности"
        - "не является должником"
        - "отсутствуют неисполненные обязательства"
        - "кредиторы"
        - "конкурсная масса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"
        - "(?i)признак(ов)?\\s+(банкротств|неплатежеспособност)"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет наличие условий о подсудности и/или претензионном порядке"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "подсудность"
        - "арбитражный суд"
        - "суд общей юрисдикции"
        - "претензионный порядок"
        - "досудебный порядок"
        - "по месту нахождения объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)по\\s+месту\\s+нахождения\\s+объект"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  price_required:
    text: >
      Просим подтвердить цену объекта недвижимости по договору в {doc_names}.
      Необходимо указать: (а) итоговую цену цифрами и прописью; (б) включает ли цена НДС;
      (в) валюту и порядок пересчёта при необходимости.
    addressee: "Юридический советник продавца"

  subject_identification:
    text: >
      Просим предоставить данные для идентификации объекта недвижимости по {doc_names}:
      кадастровый номер, точный адрес, площадь, выписку ЕГРН.
    addressee: "Продавец"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН/ОГРНИП, адрес, документы уполномоченных лиц.
    addressee: "Обе стороны"

  land_subject_extraction:
    text: >
      Просим предоставить полные данные о земельном участке по {doc_names}:
      кадастровый номер, адрес/местоположение, площадь, категорию земель,
      вид разрешённого использования (ВРИ), актуальную выписку ЕГРН.
    addressee: "Продавец"

  cadastral_number_required_for_land_plot:
    text: >
      В {doc_names} не указан кадастровый номер земельного участка, что является существенным
      нарушением ст. 554 ГК РФ и ФЗ-218. Просим незамедлительно предоставить кадастровый номер
      и актуальную выписку ЕГРН, подтверждающую право собственности.
    addressee: "Продавец / Юридический советник продавца"

  land_vri_and_category_required:
    text: >
      Просим предоставить по {doc_names}: (а) категорию земель и вид разрешённого использования (ВРИ);
      (б) выписку ЕГРН с характеристиками участка; (в) ГПЗУ или сведения из ПЗЗ с подтверждением
      допустимости использования участка под цели покупателя.
    addressee: "Продавец / Юридический советник"

  land_vri:
    text: >
      Просим предоставить информацию о категории земель и ВРИ для {doc_names}.
    addressee: "Продавец"

  no_change_of_land_purpose_without_consent:
    text: >
      Если ковенант о неизменности назначения земли важен для продавца, просим включить
      в {doc_names} запрет на изменение категории земель и ВРИ без согласия продавца,
      а также санкции за нарушение.
    addressee: "Юридический советник продавца"

  residents_list_required:
    text: >
      В {doc_names} не раскрыт перечень лиц, сохраняющих право пользования жилым помещением
      (ст. 558 ГК РФ). Просим предоставить: (а) перечень зарегистрированных лиц;
      (б) подтверждение снятия с регистрационного учёта или обязательство сняться к дате закрытия;
      (в) срок освобождения.
    addressee: "Продавец"

  spousal_consent_check:
    text: >
      Просим предоставить по {doc_names}: нотариальное согласие супруга продавца на продажу
      (ст. 35 СК РФ) либо нотариально заверенное заявление о том, что продавец в браке
      не состоит / имущество является личной собственностью / действует брачный договор.
    addressee: "Продавец"

  co_owner_preemptive_right_check:
    text: >
      Просим предоставить документы по соблюдению ст. 250 ГК РФ для {doc_names}:
      (а) уведомления сособственников о цене и условиях с доказательством получения
      (нотариальные уведомления / заказные письма с описью и квитанцией);
      (б) отказы сособственников от права либо подтверждение истечения 30-дневного срока.
    addressee: "Продавец / Нотариус"

  co_owner:
    text: >
      Просим предоставить документы об уведомлении сособственников по {doc_names}.
    addressee: "Продавец"

  notary_requirement_for_share_sale:
    text: >
      Для {doc_names} (сделка с долей) требуется нотариальное удостоверение.
      Просим предоставить: контакты нотариуса, предварительную дату удостоверения,
      комплект документов для нотариуса.
    addressee: "Обе стороны"

  mortgagee_consent_check:
    text: >
      Объект в {doc_names} находится в ипотеке. Просим предоставить:
      (а) письменное согласие залогодержателя/банка на сделку;
      (б) механизм погашения кредита и снятия обременения (через эскроу/аккредитив);
      (в) порядок одновременных регистрационных действий.
    addressee: "Банк-залогодержатель / Продавец"

  mortgage:
    text: >
      Просим предоставить документы по ипотеке и порядку её снятия для {doc_names}.
    addressee: "Банк-залогодержатель"

  retention_of_ownership_mortgage_by_law:
    text: >
      В {doc_names} предусмотрена рассрочка платежа. Просим подтвердить позицию сторон
      по ипотеке в силу закона (ст. 488 ГК РФ): возникает ли залог в пользу продавца
      до полной оплаты или стороны договорились об ином.
    addressee: "Юридический советник"

  land_building_unity_check:
    text: >
      В {doc_names} (продажа здания) просим подтвердить: какие права на земельный участок
      под зданием передаются покупателю (право собственности / аренда / иное),
      а также предоставить правоустанавливающие документы на участок.
    addressee: "Продавец / Юридический советник"

  technical_documentation_transfer:
    text: >
      Для {doc_names} (здание/сооружение) просим предоставить комплект технической документации:
      технический план, проектную и исполнительную документацию, разрешение на строительство,
      разрешение на ввод в эксплуатацию, паспорт объекта (если применимо).
    addressee: "Продавец"

  building:
    text: >
      Просим предоставить техническую документацию на объект недвижимости по {doc_names}.
    addressee: "Продавец"

  encumbrances_warranty:
    text: >
      Просим предоставить по {doc_names}: (а) актуальную выписку ЕГРН с разделом
      об обременениях; (б) письменные заверения продавца об отсутствии прав третьих лиц;
      (в) документы о снятии или прекращении обременений (если выявлены).
    addressee: "Продавец / Юридический советник"

  rosreestr_bans_arrests_absence:
    text: >
      Просим предоставить по {doc_names}: актуальную выписку ЕГРН с разделом
      об ограничениях/обременениях и подтверждение отсутствия арестов и запретов
      регистрационных действий (при наличии — документы об их отмене).
    addressee: "Продавец"

  seller_title:
    text: >
      Просим предоставить правоустанавливающие документы и актуальную выписку ЕГРН
      для {doc_names}.
    addressee: "Продавец"

  seller_title_and_egrn_extract:
    text: >
      Просим предоставить по {doc_names}: актуальную выписку ЕГРН + правоустанавливающие
      документы + цепочку переходов права (если есть) + подтверждение отсутствия ограничений.
    addressee: "Продавец"

  closing_date_long_stop:
    text: >
      Просим согласовать в {doc_names}: конкретную дату/окно закрытия сделки,
      long-stop дату, сроки подачи документов на регистрацию, последствия пропуска сроков.
    addressee: "Обе стороны"

  conditions_precedent_list:
    text: >
      Просим согласовать для {doc_names} перечень условий закрытия (CP):
      список условий, ответственные стороны, сроки исполнения,
      доказательства выполнения, порядок отказа от условий (waiver).
    addressee: "Обе стороны"

  termination_and_consequences:
    text: >
      Просим уточнить для {doc_names}: основания расторжения, последствия для каждой стороны
      (возврат денег/депозита, штрафы, удержания), сроки возврата, порядок уведомлений.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим добавить в {doc_names} запрет уступки прав/перевода долга без согласия другой стороны
      либо описать допустимые случаи уступки и порядок получения согласия.
    addressee: "Юридический советник"

  deposit_advance_security_payment:
    text: >
      Просим уточнить в {doc_names}: вид платежа (аванс/задаток/обеспечительный),
      условия возврата или удержания, срок возврата, реквизиты для перечисления.
    addressee: "Юридический советник"

  payment_schedule_and_conditions:
    text: >
      Просим уточнить в {doc_names}: порядок и сроки оплаты, условие выдачи денег продавцу,
      банковские реквизиты сторон, способ расчётов (аккредитив/эскроу/ячейка).
    addressee: "Обе стороны"

  payment_security_method:
    text: >
      Просим согласовать в {doc_names} безопасный способ расчётов:
      аккредитив, эскроу или банковская ячейка. Указать банк, условия раскрытия,
      порядок действий при нерегистрации.
    addressee: "Обе стороны"

  possession_vacant_delivery:
    text: >
      Просим уточнить в {doc_names}: дату освобождения объекта, порядок снятия с
      регистрационного учёта, дату передачи ключей, порядок подписания передаточного акта.
    addressee: "Продавец"

  sanitary_security_zones:
    text: >
      Просим предоставить по {doc_names}: выписку ЕГРН о ЗОУИТ/ограничениях,
      ПЗЗ/ГПЗУ (для земельных участков), подтверждение отсутствия СЗЗ и охранных зон.
    addressee: "Продавец / Кадастровый инженер"

  ecological_condition:
    text: >
      Просим предоставить по {doc_names}: отчёт экологического аудита (если применимо),
      заверение об отсутствии свалок, захоронений отходов, загрязнений почвы/воды,
      сведения об объектах накопленного экологического вреда.
    addressee: "Продавец / Экологический консультант"

  utilities_and_servitudes:
    text: >
      Просим предоставить по {doc_names}: схему инженерных коммуникаций,
      документы о принадлежности сетей, сведения о сервитутах и охранных зонах,
      согласования ресурсоснабжающих организаций (если применимо).
    addressee: "Продавец / Технический консультант"

  mcd_common_property_approval:
    text: >
      Просим предоставить по {doc_names}: протокол общего собрания собственников МКД
      с подтверждением кворума и результатов голосования, правовое заключение о режиме
      объекта, иные согласования (если требуются).
    addressee: "Управляющая компания / Продавец"

  guardianship_consent:
    text: >
      Просим предоставить по {doc_names}: разрешение органа опеки и попечительства,
      справку о зарегистрированных/проживающих лицах,
      подтверждение отсутствия нарушений прав несовершеннолетних.
    addressee: "Продавец / Орган опеки"

  long_term_lease_check:
    text: >
      Просим предоставить по {doc_names}: все действующие договоры аренды/найма,
      дополнительные соглашения, документы о прекращении/расторжении,
      акт освобождения/передачи.
    addressee: "Продавец"

  insurance_before_registration:
    text: >
      Просим уточнить в {doc_names}: обязанность страхования объекта до регистрации/передачи,
      кто оплачивает страховку, выгодоприобретатель, минимальная страховая сумма.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности:
      перечень конфиденциальных сведений, срок неразглашения, исключения,
      ответственность за нарушение.
    addressee: "Юридический советник"

  cadastral_value_reference:
    text: >
      Просим предоставить по {doc_names}: справку/выписку о кадастровой стоимости
      и пояснить налоговые последствия, если рыночная цена существенно отличается от кадастровой.
    addressee: "Налоговый консультант / Продавец"

  unauthorized_redevelopment:
    text: >
      Просим предоставить по {doc_names}: документы, подтверждающие законность перепланировки
      (разрешение, технический план БТИ, акт о завершённой перепланировке)
      либо заверение об отсутствии несогласованных изменений.
    addressee: "Продавец"

  utility_debts_clearance:
    text: >
      Просим предоставить по {doc_names}: справки об отсутствии задолженности по ЖКУ,
      капремонту, налогу на имущество; подтверждение показаний счётчиков на дату передачи.
    addressee: "Продавец / УК"

  registration_refusal_remedy:
    text: >
      Просим уточнить в {doc_names}: кто несёт расходы на устранение причин приостановки/отказа
      в регистрации, сроки устранения, порядок возврата денег покупателю при невозможности
      регистрации, условия расторжения.
    addressee: "Юридический советник"

  transfer_act:
    text: >
      Просим уточнить в {doc_names}: когда и в какой форме подписывается передаточный акт,
      что фиксируется в акте (состояние объекта, показания счётчиков, ключи),
      порядок действий при выявлении недостатков при приёмке.
    addressee: "Обе стороны"

  foreign_agricultural_land_prohibition:
    text: >
      Внимание: выявлено потенциальное нарушение ФЗ-101 по {doc_names}.
      Иностранные граждане/компании не могут приобретать сельскохозяйственные земли.
      Просим предоставить документы, подтверждающие гражданство/резидентство покупателя,
      и правовое заключение о допустимости сделки.
    addressee: "Юридический советник покупателя"

  foreign_border_zone_prohibition:
    text: >
      Внимание: выявлено потенциальное нарушение ст. 15 ЗК РФ по {doc_names}.
      Иностранные граждане/компании не могут приобретать земли в приграничных зонах.
      Просим предоставить документы о статусе покупателя и правовое заключение.
    addressee: "Юридический советник покупателя"

  maternity_capital_risk_check:
    text: >
      КРИТИЧЕСКИ ВАЖНО по {doc_names}: просим предоставить: (а) письменное заверение
      продавца, что при приобретении объекта не использовались средства материнского
      (семейного) капитала; (б) при использовании маткапитала — документы о выделении
      долей всем членам семьи (супруг, дети) и разрешение органа опеки на продажу;
      (в) справку из Пенсионного фонда / Социального фонда; (г) выписку из ЕГРН
      с проверкой долей всех членов семьи.
    addressee: "Продавец / Юридический советник покупателя"

  maternity_capital_clause:
    text: >
      Просим включить в {doc_names}: заверение продавца об отсутствии использования
      средств материнского капитала при приобретении объекта либо документальное
      подтверждение выполнения обязательства по выделению долей членам семьи.
    addressee: "Юридический советник"

  inheritance_title_risk_check:
    text: >
      Для {doc_names} (объект приобретён по наследству) просим предоставить:
      (а) свидетельство о праве на наследство; (б) заверение об отсутствии иных
      наследников и наследственных споров; (в) дату открытия наследства;
      (г) информацию о наследственном деле у нотариуса; (д) при наследовании
      по завещанию — информацию об обязательных наследниках (ст. 1149 ГК РФ).
    addressee: "Продавец / Юридический советник покупателя"

  corporate_approval:
    text: >
      Просим предоставить по {doc_names}: протокол/решение об одобрении сделки
      (крупная сделка / сделка с заинтересованностью) либо правовое заключение
      о том, что одобрение не требуется (сделка не является крупной,
      отсутствует заинтересованность).
    addressee: "Юридический советник каждой стороны-ЮЛ"

  seller_bankruptcy_warranty:
    text: >
      Просим предоставить по {doc_names}: (а) заверение продавца об отсутствии
      процедур банкротства и признаков неплатежеспособности; (б) проверку по
      Картотеке арбитражных дел и ЕФРСБ; (в) при наличии рисков — правовое
      заключение о вероятности оспаривания сделки по ФЗ-127.
    addressee: "Юридический советник покупателя"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность споров, наличие претензионного
      порядка, сроки рассмотрения претензий.
    addressee: "Юридический советник"


  agricultural_land_preemptive_right_rf_subject:
    text: >
      Внимание: для {doc_names} (земли сельскохозяйственного назначения) субъект РФ
      имеет преимущественное право покупки (ст. 8 ФЗ-101). Просим предоставить:
      (а) извещение продавца в адрес уполномоченного органа субъекта РФ о намерении
      продать участок с указанием цены и условий; (б) отказ субъекта РФ от покупки
      или подтверждение истечения 30-дневного срока. Сделка без соблюдения этого
      порядка ничтожна.
    addressee: "Продавец / Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    