type: contract_1.6_real_estate
name: "Договор купли-продажи недвижимости"

description: |
  Специализированный вид купли-продажи недвижимого имущества, регулируемый § 7 Главы 30 ГК РФ.
  Характеризуется обязательной письменной формой, государственной регистрацией перехода права собственности,
  специальными гарантиями для покупателя и множеством практических ограничений и рисков.

version: 4.0
parent: class_1_transfer_of_ownership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 7 Главы 30 ГК РФ (ст. 549-558)"
  doc_types_supported:
    - "договор купли-продажи квартиры"
    - "договор купли-продажи жилого дома"
    - "договор купли-продажи нежилого помещения"
    - "договор купли-продажи здания/сооружения"
    - "договор купли-продажи земельного участка"
    - "договор купли-продажи доли в праве собственности на недвижимость"
    - "договор купли-продажи общего имущества в МКД (подвал/чердак и т.п.)"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)недвижимост"
      - "(?i)квартир"
      - "(?i)земельн"
      - "(?i)real[\\s_.]?estate"

    folder_patterns:
      - "(?i)real[\\s_]?estate"
      - "(?i)недвижим"

    keywords:

      high:
        - "недвижимост"
        - "квартир"
        - "земельн участ"
        - "здани"
        - "сооружени"
        - "государственн регистрац"
        - "егрн"
        - "росреестр"
        - "кадастров номер"
        - "передаточн акт"
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"

      medium:
        - "купля-продажа недвижимости"
        - "право собственности"
        - "объект недвижимости"
        - "переход права собственности"
        - "обременение"
        - "ограничение"
        - "залог"
        - "ипотека"
        - "задаток"
        - "аванс"
        - "обеспечительный платеж"
        - "эскроу"
        - "аккредитив"
        - "уступка прав"
        - "перевод долга"
        - "страхование"
        - "страховой полис"
        - "запрет регистрационных действий"
        - "арест"
        - "кадастровая стоимость"
        - "конфиденциальность"
        - "неразглашение"
        - "техническая документация"
        - "проектная документация"
        - "разрешение на ввод"
        - "материнский капитал"
        - "средства маткапитала"
        - "наследство"
        - "свидетельство о праве на наследство"
        - "крупная сделка"
        - "корпоративное одобрение"

      low:
        - "дом"
        - "помещение"
        - "сервитут"
        - "зоует"
        - "сзз"
        - "общедомовое имущество"
        - "общее собрание собственников"

    exclusions:
      - "движимое имущество"
      - "аренда"
      - "договор мены недвижимости"
      - "долевое участие в строительстве"      
      - "дарение недвижимости"
      - "рента"
      - "пожизненное содержание с иждивением"
      - "приватизация"
      - "безвозмездная передача"
      - "внесение в уставный капитал"

# ════════════════════════════════════════════════════════════════════════════
