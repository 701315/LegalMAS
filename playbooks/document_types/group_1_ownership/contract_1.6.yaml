  - id: maternity_capital_risk_check
    name: "Маткапитал: риск невыделения долей детям (ст. 10 ФЗ-256)"
    description: >
      Если продавец приобретал объект с использованием средств материнского капитала,
      он обязан был выделить доли всем членам семьи (супруг, дети). Невыполнение
      этой обязанности — одно из самых частых оснований для оспаривания сделки
      с жилой недвижимостью в РФ. Прокуратура, органы опеки и сами дети
      (по достижении совершеннолетия) вправе оспорить сделку.
    triggers:
      any: ["maternity_capital", "residential_property"]
