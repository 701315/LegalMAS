# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  phone_pattern: "(?i)\\+?7[\\s\\-]?\\(?\\d{3}\\)?[\\s\\-]?\\d{3}[\\s\\-]?\\d{2}[\\s\\-]?\\d{2}"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "foreign_agricultural_land_prohibition"
    name: "Запрет покупки сельхозземель иностранцами (ФЗ-101)"
    description: "Иностранные граждане и компании не могут приобретать земли сельскохозяйственного назначения по ФЗ от 24.07.2002 № 101-ФЗ"
    legal_base: "ФЗ № 101-ФЗ «Об обороте земель сельскохозяйственного назначения»"
    required_triggers: ["agricultural_land_keywords", "foreign_buyer_keywords"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "земли сельскохозяйственного назначения"
        - "иностранн"
        - "нерезидент"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "земли сельскохозяйственного назначения"
        - "иностранный покупатель"
        - "нерезидент"
      rerank: true

  - id: "foreign_border_zone_prohibition"
    name: "Запрет покупки земель в приграничных зонах иностранцами (ст. 15 ЗК РФ)"
    description: "Иностранные граждане и компании не могут приобретать земли в приграничных зонах по ст. 15 ЗК РФ"
    legal_base: "ст. 15 Земельного кодекса РФ"
    required_triggers: ["border_zone_keywords", "foreign_buyer_keywords"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "приграничная зона"
        - "пограничная территория"
        - "иностранн"
        - "нерезидент"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "приграничная зона"
        - "иностранный покупатель"
      rerank: true

  - id: "agricultural_land_preemptive_right_rf_subject"
    name: "Сельхозземли: преимущественное право субъекта РФ на покупку (ст. 8 ФЗ-101)"
    description: >
      При продаже земельного участка из земель сельскохозяйственного назначения
      субъект Российской Федерации (или муниципальное образование) имеет преимущественное
      право покупки по цене и на условиях, заявленных продавцом. Продавец обязан
      известить орган власти субъекта РФ о намерении продать участок. Сделка,
      совершённая с нарушением преимущественного права, является ничтожной.
    legal_base: "ст. 8 ФЗ-101 «Об обороте земель сельскохозяйственного назначения»"
    required_triggers: ["agricultural_land_keywords"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "преимущественное право субъекта"
        - "извещение о продаже сельхозземель"
        - "уведомление органа власти"
        - "муниципальное образование"
        - "ст. 8 ФЗ-101"
        - "земли сельскохозяйственного назначения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "преимущественное право субъекта"
        - "ст. 8 ФЗ-101"
        - "земли сельскохозяйственного назначения"
        - "уведомление органа власти"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: land_subject_extraction
    name: "Земля: базовое извлечение предмета"
    description: "Извлекает кадастровый номер, адрес и ключевые параметры земельного участка"
    triggers:
      any: ["land_plot_sale"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "земельный участок"
        - "кадастровый номер"
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор купли-продажи недвижимости.
        Тип документа: договор купли-продажи земельного участка.
        Твоя задача — найти в тексте сведения о предмете договора.

        Ответь строго в JSON-формате:
        {
          "property_kind": "land_plot",
          "cadastral_number": "<номер вида NN:NN:NNNNNNN:N или not_found>",
          "address": "<адрес объекта или not_found>",
          "area": "<площадь с единицей измерения или not_found>",
          "land_category": "<категория земель или not_found>",
          "permitted_use_vri": "<вид разрешенного использования или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано в тексте — пиши "not_found".
        Не придумывай и не выводи значения из контекста.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "земельный участок"
        - "кадастровый номер"
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "property_kind"
          type: "string"
          allowed_values: ["land_plot"]
          description: "Тип объекта недвижимости"
        - name: "cadastral_number"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
          description: "Кадастровый номер участка"
        - name: "address"
          type: "string"
          keyword_hints: ["адрес", "местоположение", "расположен по адресу"]
          description: "Адрес земельного участка"
        - name: "area"
          type: "string"
          keyword_hints: ["площадь", "кв.м", "га", "гектар"]
          unit: "sq_m"
          description: "Площадь участка"
        - name: "land_category"
          type: "string"
          keyword_hints: ["категория земель", "земли населённых пунктов", "земли сельскохозяйственного"]
          description: "Категория земель"
        - name: "permitted_use_vri"
          type: "string"
          keyword_hints: ["разрешенное использование", "вид разрешенного использования", "ВРИ"]
          description: "Вид разрешённого использования"
      store_payload: true

  - id: cadastral_number_required_for_land_plot
    name: "Земля: кадастровый номер обязателен (ст. 554 ГК РФ)"
    description: "Проверяет наличие кадастрового номера земельного участка. Без него договор не позволяет однозначно идентифицировать объект."
    triggers:
      any: ["land_plot_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    rules:
      keywords:
        - "кадастровый номер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: ""
      prompt_file: null
      context_k: 3
      temperature: 0.0
      max_tokens: 128
    retrieval:
      context_k: 3
      max_chunks: 6
      boost_keywords:
        - "кадастровый номер"
        - "земельный участок"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: false
      mode: "rules"
      fields: []
      store_payload: false

  - id: land_vri_and_category_required
    name: "Земля: категория и ВРИ соответствуют целям покупателя"
    description: "Проверяет указание категории земель и ВРИ; анализирует соответствие целям покупателя"
    triggers:
      any: ["land_plot_sale"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор купли-продажи земельного участка.
        Найди в тексте:
        1. Категорию земель (например: "земли населённых пунктов", "земли сельскохозяйственного назначения")
        2. Вид разрешённого использования (ВРИ)
        3. Есть ли явное указание на допустимость использования под цели покупателя

        Ответь строго в JSON:
        {
          "land_category": "<категория или not_found>",
          "permitted_use_vri": "<ВРИ или not_found>",
          "intended_use_fit": "<yes / no / unclear / not_found>"
        }

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
        Если нельзя однозначно определить соответствие целям — пиши "unclear".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
        - "целевое назначение"
        - "назначение участка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "land_category"
          type: "string"
          keyword_hints: ["категория земель", "земли населённых пунктов", "земли сельскохозяйственного"]
          description: "Категория земель"
        - name: "permitted_use_vri"
          type: "string"
          keyword_hints: ["разрешенное использование", "вид разрешенного использования", "ВРИ"]
          description: "Вид разрешённого использования"
        - name: "intended_use_fit"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Соответствует ли ВРИ целям покупателя"
      store_payload: true

  - id: residents_list_required
    name: "Жильё: перечень лиц, сохраняющих право пользования (ст. 558 ГК РФ)"
    description: "Для жилых помещений договор должен содержать перечень лиц с правом пользования или явное указание на их отсутствие"
    triggers:
      any: ["residential_property"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право пользования"
