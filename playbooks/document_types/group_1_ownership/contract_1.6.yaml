        Ответь строго в JSON:
        {
          "matcapital_addressed": "<yes_not_used / yes_used_and_complied / not_addressed / not_found>",
          "shares_allocated_to_family": "<yes / no / not_applicable / not_found>",
          "seller_warranty_present": "<yes / no / not_found>",
          "risk_level": "<critical / medium / low>",
          "snippet": "<цитата из договора или not_found>"
