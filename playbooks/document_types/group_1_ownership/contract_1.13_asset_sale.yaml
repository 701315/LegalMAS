type: contract_1.13_asset_sale
name: "Договор продажи предприятия"

description: |
  Специализированная сделка по продаже предприятия в целом как имущественного комплекса,
  предназначенного для осуществления предпринимательской деятельности.
  В состав предприятия могут входить недвижимость, оборудование, запасы, права требования,
  долги, права на средства индивидуализации, исключительные права и иные активы,
  используемые в бизнесе. Это один из самых формально и practically сложных видов
  купли-продажи: для него характерны обязательные документы о составе предприятия,
  государственная регистрация договора и перехода права, специальные правила уведомления кредиторов,
  корпоративные, налоговые, трудовые и антимонопольные риски.
  Договор продажи предприятия необходимо отличать от продажи долей/акций (share deal)
  и от продажи отдельных активов вне режима имущественного комплекса (asset-by-asset sale).

version: 4.0
parent: class_1_transfer_of_ownership

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: critical
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 8 Главы 30 ГК РФ (ст. 559-566)"
  doc_types_supported:
    - "договор продажи предприятия"
    - "договор купли-продажи предприятия"
    - "продажа предприятия как имущественного комплекса"
    - "sale of enterprise"
    - "asset purchase agreement (enterprise)"
    - "enterprise transfer agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  # Параметры scoring для L2
  scoring:
    accept_threshold: 0.82
    strong_signal_threshold: 0.90
    ambiguity_margin: 0.20
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)продаж[аи].*предприяти"
      - "(?i)купл[яи]_?продаж[аи].*предприяти"
      - "(?i)предприяти[ея].*имущественн[ыйого]\\s*комплекс"
      - "(?i)имущественн[ыйого]\\s*комплекс.*предприяти"
      - "(?i)sale[\\s_.-]*of[\\s_.-]*enterprise"
      - "(?i)enterprise[\\s_.-]*sale"
      - "(?i)asset[\\s_.-]*purchase[\\s_.-]*agreement.*enterprise"
      - "(?i)enterprise[\\s_.-]*transfer[\\s_.-]*agreement"

    folder_patterns:
      - "(?i)enterprise"
      - "(?i)asset[_\\s-]*deal"
      - "(?i)asset[_\\s-]*sale"
      - "(?i)имущественн[ыйого].*комплекс"
      - "(?i)business[_\\s-]*sale"

    keywords:

      high:
        # ── Прямые названия договора / оферты (header-focused) ──

        - pattern: "(?i)договор[\\s\\n\\r]+продаж[ьи]\\s+предприяти[яием]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора продажи предприятия, § 8 Гл. 30 ГК РФ"

        - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+предприяти[яием]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Альтернативное название с формулой купли-продажи"

        - pattern: "(?i)sale\\s+of\\s+enterprise"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "English title form — продажа предприятия"

        - pattern: "(?i)enterprise\\s+transfer\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "English title form — договор передачи предприятия"

        - pattern: "(?i)предприяти[ея]\\s+как\\s+имущественн[ыйого]\\s+комплекс"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Ключевая формула ст. 132 и § 8 Гл. 30 ГК — предприятие как имущественный комплекс"

        - pattern: "(?i)имущественн[ыйого]\\s+комплекс\\s+предприяти[яия]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Инвертированная формула имущественного комплекса"

        - pattern: "(?i)продаж[аы]\\s+предприяти[яием]\\s+как\\s+имущественн[огоый]\\s+комплекс[а]"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Полная формула предмета — продажа предприятия как комплекса"

        - pattern: "(?i)состав\\s+предприяти[яия]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Состав предприятия — обязательный реквизит договора (ст. 561 ГК)"

        - pattern: "(?i)акт\\s+инвентаризац[иии]\\s+предприяти[яия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Акт инвентаризации предприятия — обязательный документ (ст. 561 ГК)"

        - pattern: "(?i)передаточн[ыйого]\\s+акт\\s+предприяти[яия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Передаточный акт предприятия — специальный документ передачи (ст. 563 ГК)"

        - pattern: "(?i)уведомлени[ея]\\s+кредитор[аов]\\s+о\\s+продаж[еи]\\s+предприяти[яия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Уведомление кредиторов — обязательная процедура (ст. 562 ГК)"

        - pattern: "(?i)§\\s*8\\s+глав[ыы]\\s*30\\s+ГК\\s*РФ"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прямая ссылка на параграф ГК о продаже предприятия"

        - pattern: "(?i)ст\\.?\\s*559\\s+ГК\\s*РФ"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Ст. 559 ГК РФ — основная норма о договоре продажи предприятия"

        # ── Оставшиеся legacy high ──
        - "(?i)asset\\s+purchase\\s+agreement\\s*\\(enterprise\\)"
        - "(?i)государственн[аяое]\\s+регистрац[ияи]\\s+договора\\s+продаж[ьи]\\s+предприяти[яия]"
        - "(?i)государственн[аяое]\\s+регистрац[ияи]\\s+переход[аа]\\s+права\\s+собственност[иьи]\\s+на\\s+предприяти[еия]"
        - "(?i)солидарн[аяое]\\s+ответственност[ььи]\\s+по\\s+долгам\\s+предприяти[яия]"

      medium:
        - pattern: "(?i)бухгалтерск[ийое]\\s+баланс\\s+предприяти[яия]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Баланс предприятия — обязательный документ к договору (ст. 561 ГК)"

        - pattern: "(?i)заключен[иеия]\\s+независим[огоый]\\s+аудитор[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Аудиторское заключение — обязательный документ состава (ст. 561 ГК)"

        - pattern: "(?i)перечен[ьяи]\\s+долг[овы]\\s+предприяти[яия]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Перечень долгов — обязательный документ (ст. 561 ГК)"

        - pattern: "(?i)права\\s+требован[ияи]\\s+в\\s+состав[еу]\\s+предприяти[яия]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Права требования в составе предприятия — элемент имущественного комплекса"

        - pattern: "(?i)переход\\s+к\\s+покупател[юю]\\s+прав\\s+и\\s+обязанност[ейи]\\s+предприяти[яия]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Переход прав и обязанностей — сущностная характеристика продажи предприятия"

        - pattern: "(?i)перевод\\s+долг[овы]\\s+в\\s+состав[еу]\\s+предприяти[яия]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Перевод долгов — обязательная процедура при продаже предприятия (ст. 562 ГК)"

        - pattern: "(?i)\\basset\\s+deal\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Asset deal — M&A-термин; встречается в обоих типах (shares_sale как антоним share deal)"

        - pattern: "(?i)исключительн[ыеые]\\s+прав[ао]\\s+в\\s+состав[еу]\\s+предприяти[яия]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Исключительные права в составе — ИС как элемент имущественного комплекса"

        - pattern: "(?i)средств[ао]\\s+индивидуализац[иии]\\s+в\\s+состав[еу]\\s+предприяти[яия]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Средства индивидуализации в составе — товарные знаки, коммерческое обозначение"

        - pattern: "(?i)реестр\\s+кредитор[ова]"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Реестр кредиторов — характерен для продажи предприятия и банкротства"

      low:
        - pattern: "(?i)\\bgoodwill\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Goodwill — деловая репутация; встречается в M&A широко"

        - pattern: "(?i)\\bdue\\s+diligence\\b"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Due diligence без привязки к предприятию — встречается во всех M&A-типах"

        - pattern: "(?i)переход\\s+работник[овы]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Переход работников — следствие продажи предприятия (ст. 75 ТК РФ)"

        - pattern: "(?i)трудов[ыеые]\\s+отношен[ияия]"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Трудовые отношения — широкий маркер, не специфичен для этого типа"

    exclusions:
      # ── Hard exclusions — полностью подавляют тип ──

      # Share deal — принципиальный конкурент (продажа прав, не активов)
      - pattern: "(?i)продаж[аи]\\s+дол[иьи]\\s+в\\s+ООО"
        severity: hard
        weight: -1.0
        description: "Продажа доли в ООО — share deal, contract_1.11_shares_sale"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+дол[иьи]\\s+в\\s+ООО"
        severity: hard
        weight: -1.0
        description: "Договор купли-продажи доли в ООО — явный share deal"

      - pattern: "(?i)продаж[аи]\\s+акц[ийи]"
        severity: hard
        weight: -1.0
        description: "Продажа акций — share deal, contract_1.11_shares_sale"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+акц[ийи]"
        severity: hard
        weight: -1.0
        description: "Договор купли-продажи акций — явный share deal"

      - pattern: "(?i)выход\\s+участник[аов]\\s+из\\s+общества"
        severity: hard
        weight: -1.0
        description: "Выход участника — корпоративная процедура, не продажа предприятия"

      # Аренда предприятия — передача комплекса без перехода права собственности
      - pattern: "(?i)договор[\\s\\n\\r]+аренд[ыа]\\s+предприяти[яия]"
        severity: hard
        weight: -1.0
        description: "Аренда предприятия — Гл. 34 § 5 ГК, без перехода права собственности"

      - pattern: "(?i)аренд[аы]\\s+предприяти[яия]"
        severity: hard
        weight: -1.0
        description: "Аренда предприятия без слова «договор» — тот же конкурирующий тип"

      - pattern: "(?i)договор[\\s\\n\\r]+управлен[ияи]\\s+предприяти[емем]"
        severity: hard
        weight: -1.0
        description: "Управление предприятием — доверительное управление, не продажа"

      # Продажа отдельных активов вне режима комплекса
      - pattern: "(?i)договор[\\s\\n\\r]+продаж[ьи]\\s+отдельн[огоых]\\s+актив[аов]"
        severity: hard
        weight: -1.0
        description: "Продажа отдельных активов — asset-by-asset sale, не § 8 Гл. 30 ГК"

      - pattern: "(?i)продаж[аи]\\s+отдельн[огоых]\\s+объект[аов]\\s+недвижимост[иьи]"
        severity: hard
        weight: -1.0
        description: "Продажа отдельных объектов недвижимости — contract_1.6_real_estate"

      # Явные договоры недвижимости — точечные объекты, не комплекс
      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+квартир"
        severity: hard
        weight: -1.0
        description: "КП квартиры — однозначно contract_1.6_real_estate, не предприятие"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+жил[а-я\\s]*дом"
        severity: hard
        weight: -1.0
        description: "КП жилого дома — однозначно contract_1.6_real_estate"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+земельн[а-я\\s]*участ"
        severity: hard
        weight: -1.0
        description: "КП земельного участка — однозначно contract_1.6_real_estate"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+дол[иьи]\\s+в\\s+прав[еа]\\s+собственн[оа]ст[иьи]\\s+на\\s+недвижимост"
        severity: hard
        weight: -1.0
        description: "КП доли в праве на недвижимость — contract_1.6_real_estate"

      # ── Soft exclusions — снижают confidence ──

      # Недвижимость как предмет без уточнения «отдельный объект» —
      # может быть частью имущественного комплекса, поэтому soft
      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+недвижимост[иьи]"
        severity: soft
        weight: -0.4
        description: "Общий КП недвижимости — вероятно real_estate, но недвижимость может входить в комплекс"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+объект[овы]\\s+недвижимост[иьи]"
        severity: soft
        weight: -0.35
        description: "КП объекта недвижимости — скорее real_estate, но объект может быть частью комплекса"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+нежил[а-я\\s]*помещен"
        severity: soft
        weight: -0.35
        description: "КП нежилого помещения — может быть частью предприятия, но чаще отдельный объект"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+здани[яия]"
        severity: soft
        weight: -0.3
        description: "КП здания — здание может входить в состав предприятия, но заголовок указывает на real_estate"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы]_?продаж[ьи]\\s+сооружен[ияи]"
        severity: soft
        weight: -0.3
        description: "КП сооружения — аналогично зданию: может быть частью комплекса"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  enterprise_sale:
    any_keywords:
      - "(?i)предприяти[ея]\\s+как\\s+имущественн[а-яё]+\\s+комплекс"
      - "(?i)продаж[аы]\\s+предприяти[ея]"
      - "(?i)состав\\s+предприяти[ея]"
      - "(?i)акт\\s+инвентаризаци[ии]"
      - "(?i)передаточн[ыо]й\\s+акт\\s+предприяти[ея]"

  creditor_notification_required:
    any_keywords:
      - "(?i)уведомлени[ея]\\s+кредитор[оа]в"
      - "(?i)кредитор[ыа]\\s+предприяти[ея]"
      - "(?i)переч[её]нь\\s+долг[оа]в"
      - "(?i)перевод\\s+долг[оа]в"
      - "(?i)реестр\\s+кредитор[оа]в"
      - "(?i)согласи[ея]\\s+кредитор[аа]"

  real_estate_in_complex:
    any_keywords:
      - "(?i)\\bнедвижимост[ьи]\\b"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)земельн[а-яё]+\\s+участ[оа]к"
      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)кадастров[а-яё]+\\s+номер"
      - "(?i)\\bЕГРН\\b"
      - "(?i)\\bРосреестр\\b"
      - "(?i)государственн[а-яё]+\\s+регистраци[яи]"

  employee_transfer_context:
    any_keywords:
      - "(?i)работник[ии]\\s+предприяти[ея]"
      - "(?i)трудов[ыо]е\\s+отношени[яя]"
      - "(?i)ст\\.\\s*75\\s*ТК\\s*РФ"
      - "(?i)переход\\s+прав\\s+и\\s+обязанност[еий]\\s+работодател[яя]"
      - "(?i)реестр\\s+работник[оа]в"
      - "(?i)коллективн[ыо]й\\s+договор"

  ip_in_complex:
    any_keywords:
      - "(?i)товарн[ыо]й\\s+знак"
      - "(?i)коммерческ[оа]е\\s+обозначени[ея]"
      - "(?i)исключительн[ыо]е\\s+прав[ао]"
      - "(?i)средств[ао]\\s+индивидуализаци[ии]"
      - "(?i)\\bноу-?хау\\b"
      - "(?i)доменн[оа]е\\s+им[яа]"
      - "(?i)секрет\\s+производств[аа]"

  tax_sensitive_enterprise_sale:
    any_keywords:
      - "(?i)\\bНДС\\b"
      - "(?i)налогов[ыо]е\\s+последстви[яя]"
      - "(?i)налогов[ыо]е\\s+риск[ии]"
      - "(?i)балансов[а-яё]+\\s+стоимост[ьи]"
      - "(?i)распределени[ея]\\s+цен[ыы]"
      - "(?i)налогов[ыо]й\\s+due\\s+diligence"

  antitrust_risk:
    any_keywords:
      - "(?i)\\bФАС\\b"
      - "(?i)антимонопольн[оа]е\\s+согласовани[ея]"
      - "(?i)экономическ[а-яё]+\\s+концентраци[яи]"
      - "(?i)предварительн[оа]е\\s+согласи[ея]\\s+антимонопольн[оа]го\\s+орган[аа]"
      - "(?i)уведомлени[ея]\\s+ФАС"

  debt_transfer_included:
    any_keywords:
      - "(?i)перевод\\s+долг[оа]в"
      - "(?i)обязательств[аа]\\s+предприяти[яя]"
      - "(?i)переч[её]нь\\s+долг[оа]в"
      - "(?i)\\bкредитор[ыа]\\b"
      - "(?i)долг[ии],?\\s+включенн[ыо]е\\s+в\\s+состав\\s+предприяти[яя]"

  due_diligence_context:
    any_keywords:
      - "(?i)\\bdue\\s+diligence\\b"
      - "(?i)\\bdata\\s+room\\b"
      - "(?i)раскрыти[ея]\\s+информаци[ии]"
      - "(?i)проверк[аи]\\s+предприяти[яя]"
      - "(?i)финансов[а-яё]+\\s+проверк[аи]"
      - "(?i)юридическ[а-яё]+\\s+проверк[аи]"

  regulated_assets_context:
    any_keywords:
      - "(?i)\\bлицензи[яи]\\b"
      - "(?i)разрешительн[а-яё]+\\s+документаци[яи]"
      - "(?i)\\bнедропользовани[ея]\\b"
      - "(?i)опасн[ыо]й\\s+производственн[ыо]й\\s+объект"
      - "(?i)персональн[ыо]е\\s+данн[ыо]е"
      - "(?i)фармацевтическ[а-яё]+\\s+деятельност[ьи]"
      - "(?i)медицинск[а-яё]+\\s+деятельност[ьи]"

  non_compete_context:
    description: "Ограничение конкуренции / non-compete"
    any_keywords:
      - "(?i)ограничени[ея]\\s+конкуренци[ии]"
      - "(?i)\\bнеконкуренци[яи]\\b"
      - "(?i)\\bnon-?compete\\b"
      - "(?i)не\\s+конкурировать"
      - "(?i)воздержатьс[яьа]\\s+от\\s+деятельност[ии]"
      - "(?i)запрет\\s+конкурирующ[еёй]\\s+деятельност[ии]"
      - "(?i)переманивани[ея]\\s+работник[оа]в"
      - "(?i)\\bnon-?solicitation\\b"

  payment_escrow_context:
    description: "Механика оплаты: escrow, рассрочка, условия для платежа"
    any_keywords:
      - "(?i)\\bэскроу\\b"
      - "(?i)\\bаккредитив\\b"
      - "(?i)рассрочк[аи]\\s+платеж[аа]"
      - "(?i)услови[ея]\\s+для\\s+оплат[ыы]"
      - "(?i)этап[ыа]\\s+оплат[ыы]"
      - "(?i)удержани[ея]\\s+част[ии]\\s+цен[ыы]"
      - "(?i)\\bescrow\\b"
      - "(?i)\\bholdback\\b"
      - "(?i)\\bearn-out\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  egrn_reference: "(?i)(ЕГРН|выписк(а|у)\\s+из\\s+ЕГРН)"
  inventory_reference: "(?i)(акт\\s+инвентаризац|инвентаризационн)"
  balance_reference: "(?i)(бухгалтерск(ий|ого)\\s+баланс)"
  audit_reference: "(?i)(заключени(е|я)\\s+независим(ого|ым)\\s+аудитор)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "creditor_notification_compliance"
    name: "Кредиторы должны быть письменно уведомлены о продаже предприятия"
    description: >
      Кредиторы по обязательствам, включаемым в состав предприятия, должны быть письменно
      уведомлены о продаже. Нарушение этого требования влечёт существенные риски оспаривания
      и солидарной ответственности.
    legal_base: "ст. 562 ГК РФ"
    required_triggers: ["creditor_notification_required"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "уведомление кредиторов"
        - "письменное уведомление"
        - "согласие кредитора"
        - "реестр кредиторов"
        - "перевод долга"
      keyword_mode: "any"
    retrieval:
      context_k: 6
      boost_keywords:
        - "уведомление кредиторов"
        - "согласие кредитора"
        - "перевод долга"
      rerank: true

  - id: "antitrust_clearance_required"
    name: "Проверка необходимости согласования с ФАС"
    description: >
      Сделка по приобретению предприятия может подпадать под контроль экономической концентрации
      и требовать согласования/уведомления в ФАС России.
    legal_base: "ФЗ-135 «О защите конкуренции»"
    required_triggers: ["antitrust_risk"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ФАС"
        - "антимонопольное согласование"
        - "экономическая концентрация"
        - "предварительное согласие"
        - "уведомление ФАС"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ФАС"
        - "антимонопольное согласование"
        - "экономическая концентрация"
      rerank: true

  - id: "bankruptcy_challenge_risk"
    name: "Банкротный риск оспаривания сделки продажи предприятия"
    description: >
      Продажа предприятия в предбанкротный период может быть оспорена как подозрительная
      сделка или сделка с предпочтением; особенно опасны undervalue, аффилированность и вывод активов.
    legal_base: "ст. 61.2, 61.3 ФЗ-127"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "подозрительная сделка"
        - "предпочтение"
        - "кредиторы"
        - "конкурсная масса"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "банкротство"
        - "подозрительная сделка"
        - "предпочтение"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: enterprise_subject_extraction
    name: "Продажа предприятия: извлечение состава имущественного комплекса"
    description: >
      Извлекает сведения о составе предприятия: активы, долги, IP, работники,
      недвижимость, лицензии и ключевые параметры сделки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предприятие как имущественный комплекс"
        - "состав предприятия"
        - "активы"
        - "пассивы"
        - "обязательства"
        - "права требования"
        - "исключительные права"
        - "работники"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+инвентаризац"
        - "(?i)переч(ень|ня)\\s+долг"
        - "(?i)товарн(ый|ого)\\s+знак|коммерческ(ое|ого)\\s+обозначени"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Извлеки ключевые параметры состава предприятия.

        Ответь строго в JSON:
        {
          "includes_real_estate": "<yes / no / not_found>",
          "includes_movable_assets": "<yes / no / not_found>",
          "includes_claims": "<yes / no / not_found>",
          "includes_debts": "<yes / no / not_found>",
          "includes_ip": "<yes / no / not_found>",
          "includes_employees_context": "<yes / no / not_found>",
          "composition_basis_docs": ["<документ1>", "<документ2>"]
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "состав предприятия"
        - "акт инвентаризации"
        - "перечень долгов"
        - "исключительные права"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "includes_real_estate"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включена ли недвижимость"
        - name: "includes_debts"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли долги"
        - name: "includes_ip"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли IP/средства индивидуализации"
        - name: "composition_basis_docs"
          type: "array"
          description: "Документы, на основе которых определён состав предприятия"
      store_payload: true

  - id: mandatory_attachments_check
    name: "Обязательные приложения к договору продажи предприятия"
    description: >
      Проверяет наличие акта инвентаризации, баланса, заключения аудитора
      и перечня долгов с указанием кредиторов.
    triggers:
      any: ["enterprise_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "заключение независимого аудитора"
        - "перечень долгов"
        - "кредиторы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+инвентаризац"
        - "(?i)бухгалтерск(ий|ого)\\s+баланс"
        - "(?i)заключени(е|я)\\s+независим(ого|ым)\\s+аудитор"
        - "(?i)переч(ень|ня)\\s+долг"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь наличие обязательных приложений по ст. 561 ГК РФ.

        Ответь строго в JSON:
        {
          "inventory_act": "<present / not_found>",
          "balance_sheet": "<present / not_found>",
          "auditor_report": "<present / not_found>",
          "debt_list": "<present / not_found>",
          "overall_status": "<complete / incomplete / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "заключение аудитора"
        - "перечень долгов"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "inventory_act"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли акт инвентаризации"
        - name: "balance_sheet"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли баланс"
        - name: "auditor_report"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли аудиторское заключение"
        - name: "debt_list"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли перечень долгов"
        - name: "overall_status"
          type: "string"
          allowed_values: ["complete", "incomplete", "not_found"]
          description: "Полнота обязательных приложений"
      store_payload: true

  - id: creditor_notification_and_debt_transfer_check
    name: "Уведомление кредиторов и перевод долгов"
    description: >
      Проверяет порядок уведомления кредиторов, согласия на перевод долга,
      последствия неуведомления и солидарную ответственность сторон.
    triggers:
      any: ["creditor_notification_required", "debt_transfer_included"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление кредиторов"
        - "письменное уведомление"
        - "согласие кредитора"
        - "перевод долгов"
        - "солидарная ответственность"
        - "трехмесячный срок"
        - "реестр кредиторов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени(е|я)\\s+кредитор"
        - "(?i)согласие\\s+кредитор"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь, как урегулированы кредиторы и долги.

        Ответь строго в JSON:
        {
          "creditor_notification": "<described / not_found>",
          "debt_list_quality": "<detailed / general / not_found>",
          "creditor_consents": "<described / not_found>",
          "solidary_liability_clause": "<yes / no / not_found>",
          "notification_deadline": "<specified / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "уведомление кредиторов"
        - "согласие кредитора"
        - "перевод долга"
        - "солидарная ответственность"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "creditor_notification"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описан ли порядок уведомления кредиторов"
        - name: "debt_list_quality"
          type: "string"
          allowed_values: ["detailed", "general", "not_found"]
          description: "Детальность перечня долгов"
        - name: "solidary_liability_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли условие о солидарной ответственности"
      store_payload: true

  - id: state_registration_and_transfer_check
    name: "Госрегистрация договора и перехода прав"
    description: >
      Проверяет регистрацию договора продажи предприятия и перехода прав
      по входящим объектам/комплексу.
    triggers:
      any: ["enterprise_sale", "real_estate_in_complex"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "государственная регистрация договора"
        - "Росреестр"
        - "ЕГРН"
        - "договор считается заключенным с момента регистрации"
        - "переход права собственности"
        - "регистрация перехода"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)договор.*считаетс[я].*заключенн.*с\\s+момента\\s+регистрац"
        - "(?i)ЕГРН|Росреестр"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь блок государственной регистрации.

        Ответь строго в JSON:
        {
          "contract_registration_clause": "<present / not_found>",
          "transfer_registration_mechanics": "<described / partial / not_found>",
          "registration_cost_allocation": "<described / not_found>",
          "risk_if_registration_refused": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "ЕГРН"
        - "регистрация договора"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contract_registration_clause"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли условие о регистрации договора"
        - name: "transfer_registration_mechanics"
          type: "string"
          allowed_values: ["described", "partial", "not_found"]
          description: "Описана ли регистрационная механика"
      store_payload: true

  - id: ip_and_intangibles_transfer_check
    name: "Переход исключительных прав и средств индивидуализации"
    description: >
      Проверяет, включены ли в сделку товарные знаки, коммерческие обозначения,
      домены, ноу-хау, лицензии и иные нематериальные активы.
    triggers:
      any: ["ip_in_complex"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товарный знак"
        - "коммерческое обозначение"
        - "исключительные права"
        - "средства индивидуализации"
        - "ноу-хау"
        - "доменное имя"
        - "секрет производства"
        - "лицензионный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн(ый|ого)\\s+знак"
        - "(?i)коммерческ(ое|ого)\\s+обозначени"
        - "(?i)исключительн(ые|ого)\\s+прав"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь блок нематериальных активов и IP.

        Ответь строго в JSON:
        {
          "ip_included": "<yes / no / partial>",
          "trademark_transfer": "<yes / no / not_found>",
          "commercial_designation_transfer": "<yes / no / not_found>",
          "know_how_transfer": "<yes / no / not_found>",
          "licenses_and_consents": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "товарный знак"
        - "исключительные права"
        - "коммерческое обозначение"
        - "ноу-хау"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ip_included"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Включен ли IP-блок"
        - name: "trademark_transfer"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли переход товарных знаков"
        - name: "licenses_and_consents"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описаны ли лицензии и согласования"
      store_payload: true

  - id: labor_transition_check
    name: "Трудовые отношения при продаже предприятия"
    description: >
      Проверяет, как урегулирован переход работодателя, судьба работников,
      кадровых документов и трудовых рисков.
    triggers:
      any: ["employee_transfer_context"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ст. 75 ТК РФ"
        - "трудовые отношения"
        - "права и обязанности работодателя"
        - "работники предприятия"
        - "кадровые документы"
        - "коллективный договор"
        - "реестр работников"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ст\\.\\s*75\\s*ТК\\s*РФ"
        - "(?i)трудов(ые|ых)\\s+отношен"
        - "(?i)работник(и|ов)\\s+предприяти"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь трудовой блок сделки.

        Ответь строго в JSON:
        {
          "employee_transition_clause": "<yes / no / partial>",
          "employer_rights_transfer": "<yes / no / not_found>",
          "employee_registry_transfer": "<yes / no / not_found>",
          "labor_risk_allocation": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "ст. 75 ТК РФ"
        - "трудовые отношения"
        - "работники предприятия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "employee_transition_clause"
