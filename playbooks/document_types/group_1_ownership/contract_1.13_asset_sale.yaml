          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли условие о солидарной ответственности"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 6: ГОСРЕГИСТРАЦИЯ ДОГОВОРА И ПЕРЕХОДА ПРАВА
  # ──────────────────────────────────────────────────────────────────────────
  - id: state_registration_and_transfer_check
    name: "Госрегистрация договора продажи предприятия и перехода права собственности (ст. 560, 563 ГК РФ, ФЗ-218)"
    description: >
      Проверяет наличие условий о государственной регистрации договора (без которой
      договор не считается заключённым), регистрации перехода права на предприятие
