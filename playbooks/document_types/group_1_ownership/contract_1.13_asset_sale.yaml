          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "creditor_notification": "described | not_found",
            "notification_deadline": "specified | not_found",
            "debt_list_quality": "detailed | general | not_found",
            "creditor_consents": "described | not_found",
            "solidary_liability_clause": "yes | no | not_found",
            "unsettled_creditors_risk": "addressed | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
