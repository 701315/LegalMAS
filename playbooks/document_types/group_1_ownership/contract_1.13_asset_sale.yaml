  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 8: НЕСООТВЕТСТВИЕ СОСТАВА / СРЕДСТВА ЗАЩИТЫ ПОКУПАТЕЛЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: enterprise_defects_and_buyer_remedies
    name: "Несоответствие состава предприятия и средства защиты покупателя (ст. 565 ГК РФ)"
    description: >
      Ключевая защита покупателя: при несоответствии состава переданного предприятия
      договору покупатель вправе требовать уменьшения цены, восполнения состава
      или расторжения. Защита от скрытых долгов, не указанных в договоре.
    triggers:
      any: ["enterprise_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "несоответствие состава"
