        - "(?i)солидарн(ая|ой)\\s+ответственност"
        - "(?i)перевод\\s+долг"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: уведомление кредиторов, перевод долгов, солидарная ответственность.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 562 ч. 1 ГК РФ: кредиторы по обязательствам, включаемым в состав
             предприятия, должны быть до передачи предприятия письменно уведомлены
             о его продаже
           — ст. 562 ч. 2 ГК РФ: кредитор, получивший уведомление, вправе в течение
             3 месяцев: потребовать прекращения или досрочного исполнения обязательства
             либо возмещения убытков от продавца
           — ст. 562 ч. 3 ГК РФ: не уведомлённый кредитор вправе требовать в течение
             1 года признания договора продажи недействительным
           — ст. 562 ч. 4 ГК РФ: после передачи предприятия продавец и покупатель несут
             солидарную ответственность по включённым долгам, переданным без согласия кредитора

        2. ПРАКТИКА:
           — DD-стандарт: реестр кредиторов и статус уведомлений; полученные согласия;
             долги, по которым согласие не получено (список + риск-оценка); механизм
             солидарной ответственности; защитные оговорки в договоре

        Верни строго JSON:
