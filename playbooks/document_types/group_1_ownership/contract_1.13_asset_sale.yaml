      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 11: DUE DILIGENCE / ЗАВЕРЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: due_diligence_and_reps_check
    name: "Due Diligence, раскрытие информации и заверения продавца (ст. 431.2 ГК РФ)"
    description: >
      Проверяет наличие DD-процедуры, data room, disclosure schedule, заверений о состоянии
      предприятия: отсутствие скрытых обязательств, споров, налоговых и regulatory issues.
    triggers:
      any: ["due_diligence_context", "tax_sensitive_enterprise_sale", "regulated_assets_context"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "due diligence"
        - "проверка предприятия"
        - "раскрытие информации"
        - "виртуальная комната данных"
        - "заверения об обстоятельствах"
        - "отсутствие скрытых обязательств"
        - "судебные споры"
        - "экологические обязательства"
        - "разрешительная документация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)due\\s+diligence"
        - "(?i)виртуальн(ая|ой)\\s+комнат"
        - "(?i)заверени(я|е)\\s+об\\s+обстоятельств"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: Due Diligence и заверения продавца.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 431.2 ГК РФ: заверения об обстоятельствах; при недостоверности —
             право требовать убытки / неустойку / отказаться от договора
           — ст. 559 ГК РФ: продавец передаёт предприятие в надлежащем состоянии;
             скрытые долги могут быть причиной снижения цены (ст. 565 ГК РФ)

        2. ПРАКТИКА:
           — DD-стандарт: DD-process (data room, legal/financial/tax/HR DD);
             disclosure letter; широкий пакет заверений (финансовые, налоговые,
             судебные, регуляторные, трудовые, экологические, IP);
             взаимосвязь заверений со средствами защиты

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "dd_process": "yes | no | partial",
            "document_disclosure": "yes | no | partial",
            "financial_rep": "yes | no | not_found",
            "hidden_liabilities_rep": "yes | no | not_found",
            "litigation_rep": "yes | no | not_found",
            "regulatory_rep": "yes | no | not_found",
            "tax_rep": "yes | no | not_found",
            "environmental_rep": "yes | no | not_found"
          },
          "risk_summary": "...",
          "evidence": [
