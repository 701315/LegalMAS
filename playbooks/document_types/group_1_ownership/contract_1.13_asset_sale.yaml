  - id: enterprise_defects_and_buyer_remedies
    name: "Несоответствие состава предприятия и средства защиты покупателя (ст. 565 ГК РФ)"
    description: >
      Ключевая защита покупателя: если состав переданного предприятия не соответствует
      договору (недостающие активы, скрытые долги, несоответствие качества), покупатель
      вправе требовать уменьшения цены, восполнения состава или расторжения.
      Продавец вправе заменить ненадлежащие активы. Практически это главный механизм
      пост-closing споров при продаже предприятия.
    triggers:
      any: ["enterprise_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "несоответствие состава"
        - "недостатки предприятия"
        - "ненадлежащее качество"
        - "недостающие активы"
        - "уменьшение покупной цены"
        - "восполнение состава"
        - "право на расторжение"
        - "скрытые обязательства"
        - "ст. 565"
        - "существенное нарушение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)несоответстви(е|я)\\s+состав"
        - "(?i)недостат(ки|ков)\\s+предприяти"
        - "(?i)уменьшени(е|я)\\s+покупн(ой|ую)\\s+цен"
        - "(?i)ст\\.\\s*565"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи предприятия.
        Проверь, как урегулированы последствия несоответствия состава предприятия.

        По ст. 565 ГК РФ:
        - Если состав не соответствует договору — покупатель вправе требовать уменьшения цены
        - Если переданы долги, не указанные в договоре — покупатель вправе требовать
          уменьшения цены, если не докажет, что знал о них при заключении/передаче
        - Продавец вправе заменить ненадлежащие активы
        - При существенном нарушении — право на расторжение
        - Эти правила применяются, если иное не вытекает из договора

        Ответь строго в JSON:
        {
          "defects_remedy_clause": "<described / partial / not_found>",
          "price_reduction_right": "<yes / no / not_found>",
          "supplementary_transfer_right": "<yes / no / not_found>",
          "rescission_right_for_material_breach": "<yes / no / not_found>",
          "hidden_debt_protection": "<yes / no / not_found>",
          "seller_replacement_right": "<yes / no / not_found>",
          "time_limit_for_claims": "<specified / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "несоответствие состава"
        - "недостатки предприятия"
        - "уменьшение цены"
        - "расторжение"
        - "скрытые обязательства"
        - "ст. 565"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "defects_remedy_clause"
          type: "string"
          allowed_values: ["described", "partial", "not_found"]
          description: "Описаны ли средства защиты при несоответствии состава"
        - name: "price_reduction_right"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли право на уменьшение цены"
        - name: "hidden_debt_protection"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли защита от скрытых долгов"
      store_payload: true

