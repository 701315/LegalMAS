      - "(?i)\\bnon-?compete\\b"
      - "(?i)не\\s+конкурировать"
      - "(?i)воздержатьс[яьа]\\s+от\\s+деятельност[ии]"
      - "(?i)запрет\\s+конкурирующ[еёй]\\s+деятельност[ии]"
      - "(?i)переманивани[ея]\\s+работник[оа]в"
      - "(?i)\\bnon-?solicitation\\b"

  payment_escrow_context:
    any_keywords:
      - "(?i)\\bэскроу\\b"
      - "(?i)\\bаккредитив\\b"
      - "(?i)рассрочк[аи]\\s+платеж[аа]"
      - "(?i)услови[ея]\\s+для\\s+оплат[ыы]"
      - "(?i)этап[ыа]\\s+оплат[ыы]"
      - "(?i)удержани[ея]\\s+част[ии]\\s+цен[ыы]"
      - "(?i)\\bescrow\\b"
      - "(?i)\\bholdback\\b"
      - "(?i)\\bearn-out\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  egrn_reference: "(?i)(ЕГРН|выписк(а|у)\\s+из\\s+ЕГРН)"
  inventory_reference: "(?i)(акт\\s+инвентаризац|инвентаризационн)"
  balance_reference: "(?i)(бухгалтерск(ий|ого)\\s+баланс)"
  audit_reference: "(?i)(заключени(е|я)\\s+независим(ого|ым)\\s+аудитор)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 1: СТОРОНЫ / ПОЛНОМОЧИЯ 
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны сделки: продавец, покупатель, полномочия (ст. 432 ГК РФ, ФЗ-14, ФЗ-208)"
    description: >
      Проверяет идентификацию продавца и покупателя, полномочия подписантов,
      корпоративные одобрения (если сделка является крупной или с заинтересованностью).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "в лице"
        - "действующего на основании"
        - "коммерческая организация"
        - "индивидуальный предприниматель"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "решение единственного участника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: идентификация сторон, полномочия подписантов, корпоративное одобрение.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 432 ГК РФ: стороны должны быть идентифицированы
           — ст. 559 ГК РФ: продавец — собственник предприятия или уполномоченное лицо
           — ФЗ-14 ст. 45-46, ФЗ-208 ст. 78-84: крупная сделка / сделка с заинтересованностью
           — Предприятие как имущественный комплекс требует проверки правоспособности
             продавца в отношении каждого из включённых объектов

        2. ПРАКТИКА:
           — DD-стандарт: полные реквизиты продавца и покупателя; проверка полномочий
             подписантов (устав, доверенность, протокол); корпоративные решения об одобрении;
             для физлица-предпринимателя — ОГРНИП, паспорт

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "seller_identification": "ok | partial | missing",
            "seller_type": "legal_entity | individual_entrepreneur | individual | unclear",
            "seller_authority": "ok | partial | missing | not_found",
            "buyer_identification": "ok | partial | missing",
            "buyer_type": "legal_entity | individual_entrepreneur | individual | unclear",
            "corporate_approval_required": "yes | no | not_assessable",
            "corporate_approval_present": "yes | no | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — not_assessable: невозможно оценить без дополнительных документов
        — Не додумывай реквизиты и полномочия
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "одобрение"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "seller_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин"]
          description: "Тип продавца"
        - name: "buyer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин"]
          description: "Тип покупателя"
        - name: "corporate_approval_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие корпоративного одобрения"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 2: ПРЕДМЕТ / СОСТАВ ПРЕДПРИЯТИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: enterprise_subject_extraction
    name: "Предмет договора: предприятие как имущественный комплекс и его состав (ст. 132, 559, 561 ГК РФ)"
    description: >
      Проверяет, что предметом является именно предприятие в целом как имущественный
      комплекс, извлекает состав предприятия: активы, долги, IP, работники, недвижимость,
      лицензии, права требования.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предприятие как имущественный комплекс"
        - "состав предприятия"
        - "активы"
        - "пассивы"
        - "обязательства"
        - "права требования"
        - "исключительные права"
        - "работники"
        - "предприятие в целом"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inventory_reference }}"
        - "(?i)переч(ень|ня)\\s+долг"
        - "(?i)товарн(ый|ого)\\s+знак|коммерческ(ое|ого)\\s+обозначени"
        - "{{ cadastral_number }}"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: предмет договора — предприятие как имущественный комплекс.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 132 ГК РФ: предприятие — имущественный комплекс, включая недвижимость,
             оборудование, запасы, долги, права требования, исключительные права;
             предприятие признаётся недвижимостью
           — ст. 559 ГК РФ: продавец обязуется передать предприятие в целом;
             предмет — обязательное существенное условие
           — ст. 561 ГК РФ: состав предприятия должен быть подтверждён обязательными
             документами

        2. ПРАКТИКА:
           — DD-стандарт: чёткое определение предмета (именно имущественный комплекс, не
             набор отдельных активов); исчерпывающий состав с разбивкой по группам;
             выявление исключений из состава (excluded assets)

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "enterprise_as_complex_stated": "yes | implied | not_found",
            "includes_real_estate": "yes | no | not_found",
            "includes_movable_assets": "yes | no | not_found",
            "includes_claims": "yes | no | not_found",
            "includes_debts": "yes | no | not_found",
            "includes_ip": "yes | no | not_found",
            "includes_employees_context": "yes | no | not_found",
            "excluded_assets_defined": "yes | no | not_found",
            "composition_basis_docs": ["<документ1>", "..."]
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — implied: следует из контекста, но не назван явно
        — Не додумывай состав предприятия
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "состав предприятия"
        - "акт инвентаризации"
        - "перечень долгов"
        - "исключительные права"
        - "имущественный комплекс"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "enterprise_as_complex_stated"
          type: "string"
          allowed_values: ["yes", "implied", "not_found"]
          description: "Явно ли указан имущественный комплекс"
        - name: "includes_real_estate"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включена ли недвижимость"
        - name: "includes_debts"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли долги"
        - name: "includes_ip"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли IP/средства индивидуализации"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 3: ОБЯЗАТЕЛЬНЫЕ ПРИЛОЖЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: mandatory_attachments_check
    name: "Обязательные приложения к договору продажи предприятия (ст. 561 ГК РФ)"
    description: >
      Проверяет наличие всех четырёх обязательных документов, которые должны быть
      приложены к договору: акт инвентаризации, бухгалтерский баланс,
      заключение независимого аудитора, перечень долгов с указанием кредиторов.
      Без этих документов договор может быть признан незаключённым.
    triggers:
      any: ["enterprise_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "заключение независимого аудитора"
        - "перечень долгов"
        - "кредиторы"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inventory_reference }}"
        - "{{ balance_reference }}"
        - "{{ audit_reference }}"
        - "(?i)переч(ень|ня)\\s+долг"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: обязательные приложения по ст. 561 ГК РФ.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 561 ГК РФ: к договору продажи предприятия ОБЯЗАТЕЛЬНО прилагаются:
             (1) акт инвентаризации предприятия;
             (2) бухгалтерский баланс;
             (3) заключение независимого аудитора о составе и стоимости предприятия;
             (4) перечень всех долгов, включаемых в состав предприятия,
             с указанием кредиторов, характера, размера и сроков требований
           — Без этих документов состав предприятия не может считаться согласованным

        2. ПРАКТИКА:
           — DD-стандарт: все четыре документа получены и актуальны; дата инвентаризации
             максимально близка к дате подписания; аудитор независим и имеет надлежащие
             полномочия; перечень долгов исчерпывающий; документы подписаны и датированы

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "inventory_act": "present | not_found",
            "balance_sheet": "present | not_found",
            "auditor_report": "present | not_found",
            "debt_list": "present | not_found",
            "overall_status": "complete | incomplete | not_found",
            "documents_currency": "recent | outdated | not_assessable"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — present: документ явно упомянут как приложение
        — not_found: документ не упомянут
        — recent: дата близка к дате договора
        — Не додумывай наличие документов
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "заключение аудитора"
        - "перечень долгов"
        - "ст. 561 ГК"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "inventory_act"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли акт инвентаризации"
        - name: "balance_sheet"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли баланс"
        - name: "auditor_report"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли аудиторское заключение"
        - name: "debt_list"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли перечень долгов"
        - name: "overall_status"
          type: "string"
          allowed_values: ["complete", "incomplete", "not_found"]
          description: "Полнота обязательных приложений"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 4: ЦЕНА И МЕХАНИКА ОПЛАТЫ
  # ──────────────────────────────────────────────────────────────────────────
  - id: price_and_payment_mechanics
    name: "Цена предприятия и структура расчётов (ст. 555, 559 ГК РФ)"
    description: >
      Проверяет наличие и размер цены предприятия, порядок расчётов,
      структуру платежей (upfront / escrow / holdback / earn-out),
      распределение цены по группам активов для налоговых целей.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена"
        - "стоимость предприятия"
        - "покупная цена"
        - "рублей"
        - "балансовая стоимость"
        - "порядок оплаты"
        - "этапы оплаты"
        - "эскроу"
        - "аккредитив"
        - "рассрочка"
        - "holdback"
        - "earn-out"
        - "escrow"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)эскроу|escrow"
        - "(?i)аккредитив"
        - "(?i)рассрочк"
        - "(?i)holdback|earn[- ]?out"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: цена предприятия и структура расчётов.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 555 ГК РФ: цена — обязательное существенное условие; при её отсутствии
             договор продажи предприятия незаключён (в отличие от общего правила)
           — ст. 560 ГК РФ: форма и государственная регистрация договора
           — НДС при продаже предприятия как комплекса — ст. 158 НК РФ:
             особый порядок налогообложения, распределение по группам активов

        2. ПРАКТИКА:
           — DD-стандарт: цена определена в рублях и/или иностранной валюте;
             структура платежей раскрыта; условия escrow/holdback/earn-out описаны;
             механизм корректировки цены (WC, price adjustment); налоговое распределение
             по группам активов (ст. 158 НК РФ)

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "price_defined": "yes | no | not_found",
            "price_amount": "<сумма или not_found>",
            "price_currency": "RUB | USD | EUR | other | not_found",
            "payment_structure": "upfront | deferred | escrow | earn_out | mixed | not_found",
            "price_adjustment_mechanism": "yes | no | not_found",
            "tax_allocation_by_asset_groups": "yes | no | not_found",
            "escrow_release_conditions": "described | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — Не додумывай суммы и структуру платежей
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цена предприятия"
        - "покупная цена"
        - "escrow"
        - "эскроу"
        - "earn-out"
        - "рассрочка"
        - "ст. 555 ГК"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
