doc_type_checks:

  - id: "parties_identification"
    name: "Стороны сделки: продавец и покупатель предприятия"
    description: "Проверяет идентификацию сторон и их реквизитов"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "в лице"
        - "действующего на основании"
        - "коммерческая организация"
        - "индивидуальный предприниматель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

