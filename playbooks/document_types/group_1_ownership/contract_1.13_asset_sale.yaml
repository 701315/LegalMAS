  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 9: IP И НЕМАТЕРИАЛЬНЫЕ АКТИВЫ
  # ──────────────────────────────────────────────────────────────────────────
  - id: ip_and_intangibles_transfer_check
    name: "Переход исключительных прав, средств индивидуализации и нематериальных активов (ст. 559, часть IV ГК РФ)"
    description: >
      Проверяет включение в сделку товарных знаков, коммерческих обозначений,
      доменных имён, ноу-хау, лицензий и иных нематериальных активов,
      а также порядок их перехода/переоформления.
    triggers:
      any: ["ip_in_complex"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "товарный знак"
        - "коммерческое обозначение"
        - "исключительные права"
        - "средства индивидуализации"
        - "ноу-хау"
        - "доменное имя"
        - "секрет производства"
        - "лицензионный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн(ый|ого)\\s+знак"
        - "(?i)коммерческ(ое|ого)\\s+обозначени"
        - "(?i)исключительн(ые|ого)\\s+прав"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: исключительные права и средства индивидуализации в составе предприятия.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 559 ГК РФ: в состав предприятия входят права на средства
             индивидуализации (товарные знаки, коммерческое обозначение и т.д.)
             и иные исключительные права, если иное не предусмотрено договором
           — Часть IV ГК РФ: переход исключительных прав в ряде случаев требует
             дополнительных документов (уведомление Роспатента, регистрация)
           — Ноу-хау (ст. 1465 ГК РФ): переходит как часть комплекса, но нужна
             конкретизация и режим конфиденциальности

        2. ПРАКТИКА:
           — DD-стандарт: реестр товарных знаков, лицензий; статус каждого IP-актива;
             третьи лица на IP-права; порядок переоформления в Роспатенте;
             лицензионные соглашения (in/out) — их судьба

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "ip_included": "yes | no | partial",
            "trademark_transfer": "yes | no | not_found",
            "commercial_designation_transfer": "yes | no | not_found",
            "know_how_transfer": "yes | no | not_found",
            "rospatent_registration": "required_and_addressed | not_required | not_found",
            "licenses_and_consents": "described | not_found",
            "third_party_ip_risks": "addressed | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — partial: частично включён
        — Не додумывай реестр IP-активов
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_query: "товарный знак коммерческое обозначение исключительные права средства индивидуализации ноу-хау доменное имя секрет производства лицензионный договор Роспатент регистрация IP"
      preferred_unit_types:
        - obligation
        - warranty
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "лицензия как разрешительная документация ФАС"
        - "антимонопольное согласование"
        - "НДС"
        - "non-compete"
        - "цена предприятия"
        - "уведомление кредиторов"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 450
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора продажи предприятия
        условия о переходе исключительных прав и нематериальных активов.
        Не анализируй состав движимого и недвижимого имущества, цену или кредиторов.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. ip_included — "yes" / "no" / "partial".
        2. trademark_transfer_status — "yes" / "no" / "not_found".
        3. trademark_details — формулировка о товарных знаках.
        4. commercial_designation_status — "yes" / "no" / "not_found".
        5. know_how_transfer_status — "yes" / "no" / "not_found".
        6. rospatent_registration_status — "required_and_addressed" / "not_required" / "not_found".
        7. licenses_and_consents_status — "described" / "not_found".
        8. licenses_details — описание лицензий в составе.

        Если данных нет:
        - "not_found"
        </task>
      fields:
        - name: "ip_included"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "partial"]
          description: "Включён ли IP-блок в состав предприятия."
        - name: "trademark_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Переход товарных знаков."
        - name: "trademark_details"
          type: "string"
          presentation: "fact"
          label: "Переход товарных знаков"
          description: "Формулировка о переходе товарных знаков."
        - name: "commercial_designation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Переход коммерческого обозначения."
        - name: "know_how_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Переход ноу-хау."
        - name: "rospatent_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["required_and_addressed", "not_required", "not_found"]
          description: "Урегулирована ли регистрация IP-активов в Роспатенте."
        - name: "licenses_and_consents_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["described", "not_found"]
          description: "Описаны ли лицензии в составе предприятия."
        - name: "licenses_details"
          type: "string"
          presentation: "fact"
          label: "Лицензии в составе предприятия"
          description: "Описание лицензий и лицензионных соглашений."
      store_payload: true

