             который содержит данные о составе предприятия и уведомлении кредиторов
           — ст. 563 ч. 2 ГК РФ: право собственности переходит с момента государственной
             регистрации; до регистрации покупатель вправе пользоваться предприятием
           — ст. 563 ч. 3 ГК РФ: уклонение от подписания акта — нарушение договора

        2. ПРАКТИКА:
           — DD-стандарт: форма и содержание передаточного акта; closing agenda;
             перечень deliverables (документы, ключи, IT-доступы, реестры, кадровые дела);
