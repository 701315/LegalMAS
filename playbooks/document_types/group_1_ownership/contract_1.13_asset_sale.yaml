        - "согласие кредитора"
        - "перевод долга"
        - "солидарная ответственность"
        - "ст. 562 ГК"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10

