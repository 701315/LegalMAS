type: contract_1.13_asset_sale
name: "Договор продажи предприятия"

description: |
  Специализированная сделка по продаже предприятия в целом как имущественного комплекса,
  предназначенного для осуществления предпринимательской деятельности.
  В состав предприятия могут входить недвижимость, оборудование, запасы, права требования,
  долги, права на средства индивидуализации, исключительные права и иные активы,
  используемые в бизнесе. Это один из самых формально и practically сложных видов
  купли-продажи: для него характерны обязательные документы о составе предприятия,
  государственная регистрация договора и перехода права, специальные правила уведомления кредиторов,
  корпоративные, налоговые, трудовые и антимонопольные риски.
  Договор продажи предприятия необходимо отличать от продажи долей/акций (share deal)
  и от продажи отдельных активов вне режима имущественного комплекса (asset-by-asset sale).

