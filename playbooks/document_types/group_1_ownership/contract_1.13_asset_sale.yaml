        Проверь блок: государственная регистрация договора и перехода права.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 560 ч. 3 ГК РФ: договор продажи предприятия ПОДЛЕЖИТ государственной
             регистрации и считается заключённым с момента такой регистрации
           — ст. 563 ч. 2 ГК РФ: право собственности на предприятие переходит к покупателю
             с момента государственной регистрации этого права
           — ФЗ-218: порядок регистрации; предприятие — недвижимость, регистрируется в ЕГРН

        2. ПРАКТИКА:
           — DD-стандарт: явная ссылка на ст. 560 ГК РФ и момент заключения договора;
