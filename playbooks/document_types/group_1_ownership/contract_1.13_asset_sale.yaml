      - "(?i)\\bnon-?compete\\b"
      - "(?i)не\\s+конкурировать"
      - "(?i)воздержатьс[яьа]\\s+от\\s+деятельност[ии]"
      - "(?i)запрет\\s+конкурирующ[еёй]\\s+деятельност[ии]"
      - "(?i)переманивани[ея]\\s+работник[оа]в"
      - "(?i)\\bnon-?solicitation\\b"

  payment_escrow_context:
    any_keywords:
      - "(?i)\\bэскроу\\b"
      - "(?i)\\bаккредитив\\b"
      - "(?i)рассрочк[аи]\\s+платеж[аа]"
      - "(?i)услови[ея]\\s+для\\s+оплат[ыы]"
      - "(?i)этап[ыа]\\s+оплат[ыы]"
      - "(?i)удержани[ея]\\s+част[ии]\\s+цен[ыы]"
      - "(?i)\\bescrow\\b"
      - "(?i)\\bholdback\\b"
      - "(?i)\\bearn-out\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  egrn_reference: "(?i)(ЕГРН|выписк(а|у)\\s+из\\s+ЕГРН)"
  inventory_reference: "(?i)(акт\\s+инвентаризац|инвентаризационн)"
  balance_reference: "(?i)(бухгалтерск(ий|ого)\\s+баланс)"
  audit_reference: "(?i)(заключени(е|я)\\s+независим(ого|ым)\\s+аудитор)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 1: СТОРОНЫ / ПОЛНОМОЧИЯ 
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны сделки: продавец, покупатель, полномочия (ст. 432 ГК РФ, ФЗ-14, ФЗ-208)"
    description: >
      Проверяет идентификацию продавца и покупателя, полномочия подписантов,
      корпоративные одобрения (если сделка является крупной или с заинтересованностью).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "в лице"
        - "действующего на основании"
        - "коммерческая организация"
        - "индивидуальный предприниматель"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "решение единственного участника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: идентификация сторон, полномочия подписантов, корпоративное одобрение.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 432 ГК РФ: стороны должны быть идентифицированы
           — ст. 559 ГК РФ: продавец — собственник предприятия или уполномоченное лицо
           — ФЗ-14 ст. 45-46, ФЗ-208 ст. 78-84: крупная сделка / сделка с заинтересованностью
           — Предприятие как имущественный комплекс требует проверки правоспособности
             продавца в отношении каждого из включённых объектов

        2. ПРАКТИКА:
           — DD-стандарт: полные реквизиты продавца и покупателя; проверка полномочий
             подписантов (устав, доверенность, протокол); корпоративные решения об одобрении;
             для физлица-предпринимателя — ОГРНИП, паспорт

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "seller_identification": "ok | partial | missing",
            "seller_type": "legal_entity | individual_entrepreneur | individual | unclear",
            "seller_authority": "ok | partial | missing | not_found",
            "buyer_identification": "ok | partial | missing",
            "buyer_type": "legal_entity | individual_entrepreneur | individual | unclear",
            "corporate_approval_required": "yes | no | not_assessable",
            "corporate_approval_present": "yes | no | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — not_assessable: невозможно оценить без дополнительных документов
        — Не додумывай реквизиты и полномочия
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_query: "продавец покупатель в лице действующего на основании ИНН ОГРН крупная сделка сделка с заинтересованностью одобрение общего собрания решение единственного участника корпоративное одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "состав предприятия"
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "перечень долгов"
        - "цена предприятия"
        - "уведомление кредиторов"
        - "государственная регистрация"
        - "передаточный акт"
        - "несоответствие состава"
        - "НДС"
        - "non-compete"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 520
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора продажи предприятия
        данные о продавце и покупателе, подписантах и корпоративном одобрении.
        Не анализируй состав предприятия, цену, регистрацию или заверения.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. seller_details_status — "defined" если продавец прямо идентифицирован, иначе "not_defined".
        2. seller_details — наименование/ФИО и реквизиты продавца.
        3. seller_type — "legal_entity" / "individual_entrepreneur" / "individual" / "not_defined".
        4. seller_signatory_status — "defined" если подписант продавца указан.
        5. seller_signatory — подписант продавца.
        6. seller_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        7. buyer_details_status — "defined" если покупатель прямо идентифицирован.
        8. buyer_details — наименование/ФИО и реквизиты покупателя.
        9. buyer_type — "legal_entity" / "individual_entrepreneur" / "individual" / "not_defined".
        10. buyer_signatory_status — "defined" если подписант покупателя указан.
        11. buyer_signatory — подписант покупателя.
        12. buyer_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        13. corporate_approval_status — "defined" если корпоративное одобрение или его ненужность прямо указаны.
        14. corporate_approval_details — формулировка.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
        - name: "seller_details"
          type: "string"
          presentation: "fact"
          label: "Продавец: реквизиты"
        - name: "seller_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
        - name: "seller_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
        - name: "seller_signatory"
          type: "string"
          presentation: "fact"
          label: "Продавец: подписант"
        - name: "seller_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
        - name: "buyer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
        - name: "buyer_details"
          type: "string"
          presentation: "fact"
          label: "Покупатель: реквизиты"
        - name: "buyer_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
        - name: "buyer_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
        - name: "buyer_signatory"
          type: "string"
          presentation: "fact"
          label: "Покупатель: подписант"
        - name: "buyer_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 2: ПРЕДМЕТ / СОСТАВ ПРЕДПРИЯТИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: enterprise_subject_extraction
    name: "Предмет договора: предприятие как имущественный комплекс и его состав (ст. 132, 559, 561 ГК РФ)"
    description: >
      Проверяет, что предметом является именно предприятие в целом как имущественный
      комплекс, извлекает состав предприятия: активы, долги, IP, работники, недвижимость,
      лицензии, права требования.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предприятие как имущественный комплекс"
        - "состав предприятия"
        - "активы"
        - "пассивы"
        - "обязательства"
        - "права требования"
        - "исключительные права"
        - "работники"
        - "предприятие в целом"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inventory_reference }}"
        - "(?i)переч(ень|ня)\\s+долг"
        - "(?i)товарн(ый|ого)\\s+знак|коммерческ(ое|ого)\\s+обозначени"
        - "{{ cadastral_number }}"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: предмет договора — предприятие как имущественный комплекс.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 132 ГК РФ: предприятие — имущественный комплекс, включая недвижимость,
             оборудование, запасы, долги, права требования, исключительные права;
             предприятие признаётся недвижимостью
           — ст. 559 ГК РФ: продавец обязуется передать предприятие в целом;
             предмет — обязательное существенное условие
           — ст. 561 ГК РФ: состав предприятия должен быть подтверждён обязательными
             документами

        2. ПРАКТИКА:
           — DD-стандарт: чёткое определение предмета (именно имущественный комплекс, не
             набор отдельных активов); исчерпывающий состав с разбивкой по группам;
             выявление исключений из состава (excluded assets)

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "enterprise_as_complex_stated": "yes | implied | not_found",
            "includes_real_estate": "yes | no | not_found",
            "includes_movable_assets": "yes | no | not_found",
            "includes_claims": "yes | no | not_found",
            "includes_debts": "yes | no | not_found",
            "includes_ip": "yes | no | not_found",
            "includes_employees_context": "yes | no | not_found",
            "excluded_assets_defined": "yes | no | not_found",
            "composition_basis_docs": ["<документ1>", "..."]
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — implied: следует из контекста, но не назван явно
        — Не додумывай состав предприятия
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_query: "предприятие как имущественный комплекс состав предприятия активы пассивы обязательства права требования исключительные права работники предприятие в целом excluded assets перечень включённых активов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "акт инвентаризации как приложение"
        - "бухгалтерский баланс как приложение"
        - "заключение аудитора"
        - "перечень долгов для кредиторов"
        - "цена предприятия"
        - "уведомление кредиторов"
        - "государственная регистрация"
        - "передаточный акт"
        - "несоответствие состава"
        - "НДС"
        - "non-compete"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 520
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора продажи предприятия
        описание предмета — предприятия как имущественного комплекса и его состава.
        Не анализируй цену, регистрацию, заверения или кредиторов.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. enterprise_as_complex_status — "defined" если предприятие прямо названо имущественным комплексом, иначе "not_defined".
        2. enterprise_description — описание предмета.
        3. includes_real_estate — "yes" / "no" / "not_found".
        4. includes_movable_assets — "yes" / "no" / "not_found".
        5. includes_claims — "yes" / "no" / "not_found".
        6. includes_debts — "yes" / "no" / "not_found".
        7. includes_ip — "yes" / "no" / "not_found".
        8. excluded_assets_status — "defined" если excluded assets прямо определены.
        9. excluded_assets_details — описание excluded assets.
        10. composition_basis_docs — перечень документов-оснований для состава.

        Если данных нет:
        - статус = "not_found" или "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "enterprise_as_complex_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прямого указания на имущественный комплекс."
        - name: "enterprise_description"
          type: "string"
          presentation: "fact"
          label: "Описание предприятия"
          description: "Описание предмета договора."
        - name: "includes_real_estate"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включена ли недвижимость."
        - name: "includes_movable_assets"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включено ли движимое имущество."
        - name: "includes_claims"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли права требования."
        - name: "includes_debts"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли долги (обязательства)."
        - name: "includes_ip"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Включены ли исключительные права."
        - name: "excluded_assets_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения excluded assets."
        - name: "excluded_assets_details"
          type: "string"
          presentation: "fact"
          label: "Исключённые активы"
          description: "Описание активов, явно исключённых из состава предприятия."
        - name: "composition_basis_docs"
          type: "string"
          presentation: "fact"
          label: "Документы-основания состава"
          description: "Перечень документов, определяющих состав предприятия."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 3: ОБЯЗАТЕЛЬНЫЕ ПРИЛОЖЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: mandatory_attachments_check
    name: "Обязательные приложения к договору продажи предприятия (ст. 561 ГК РФ)"
    description: >
      Проверяет наличие всех четырёх обязательных документов, которые должны быть
      приложены к договору: акт инвентаризации, бухгалтерский баланс,
      заключение независимого аудитора, перечень долгов с указанием кредиторов.
      Без этих документов договор может быть признан незаключённым.
    triggers:
      any: ["enterprise_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт инвентаризации"
        - "бухгалтерский баланс"
        - "заключение независимого аудитора"
        - "перечень долгов"
        - "кредиторы"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inventory_reference }}"
        - "{{ balance_reference }}"
        - "{{ audit_reference }}"
        - "(?i)переч(ень|ня)\\s+долг"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: обязательные приложения по ст. 561 ГК РФ.

        Оцени по двум стандартам:

        1. ЗАКОН:
