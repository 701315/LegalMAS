            "employee_registry_transfer": "yes | no | not_found",
            "labor_risk_allocation": "described | not_found",
            "wage_arrears_addressed": "yes | no | not_found",
            "collective_agreement_status": "described | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — Не додумывай состав работников
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_query: "ст. 75 ТК РФ трудовые отношения права и обязанности работодателя работники предприятия кадровые документы коллективный договор реестр работников задолженность по зарплате"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "исключительные права"
        - "товарный знак"
        - "лицензия как ФАС"
        - "НДС"
        - "non-compete"
        - "цена предприятия"
        - "уведомление кредиторов"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 430
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора продажи предприятия
        условия о трудовых отношениях при переходе предприятия.
        Не анализируй IP, регистрацию, цену или кредиторов.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. employee_transition_status — "yes" / "no" / "partial".
        2. employee_transition_details — описание условий о работниках.
        3. employer_rights_transfer_status — "yes" / "no" / "not_found".
        4. employee_registry_transfer_status — "yes" / "no" / "not_found".
        5. labor_risk_allocation_status — "described" / "not_found".
        6. labor_risk_details — описание распределения трудовых рисков.
        7. wage_arrears_status — "yes" / "no" / "not_found".
        8. collective_agreement_status — "described" / "not_found".

        Если данных нет:
        - "not_found"
        </task>
      fields:
        - name: "employee_transition_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "partial"]
          description: "Наличие трудового блока."
        - name: "employee_transition_details"
          type: "string"
          presentation: "fact"
          label: "Условия о работниках"
          description: "Описание условий о трудовых отношениях при переходе предприятия."
        - name: "employer_rights_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Переход прав и обязанностей работодателя."
        - name: "employee_registry_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_found"]
          description: "Передача кадровых документов."
        - name: "labor_risk_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["described", "not_found"]
          description: "Распределение трудовых рисков."
        - name: "labor_risk_details"
          type: "string"
          presentation: "fact"
          label: "Трудовые риски"
