        - name: "vat_clause_art158"
          type: "string"
          allowed_values: ["yes", "partial", "not_found"]
          description: "НДС-оговорка по ст. 158 НК РФ"
        - name: "pre_closing_tax_liability"
          type: "string"
          allowed_values: ["seller", "buyer", "shared", "not_found"]
          description: "Кто несёт pre-closing налоговые риски"
        - name: "indemnification_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли indemnity clause"
        - name: "cap"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли cap ответственности"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 14: POST-CLOSING: НЕКОНКУРЕНЦИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: post_closing_obligations_check
    name: "Post-closing ограничения: неконкуренция и non-solicitation (ст. 421 ГК РФ)"
    description: >
      Проверяет наличие post-closing ограничений на конкуренцию (non-compete)
      и переманивание работников/клиентов (non-solicitation) со стороны продавца.
    triggers:
      any: ["non_compete_context"]
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ограничение конкуренции"
        - "неконкуренция"
        - "non-compete"
        - "не конкурировать"
        - "воздержаться от деятельности"
        - "запрет конкурирующей деятельности"
        - "переманивание работников"
        - "non-solicitation"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)non[- ]?compete"
        - "(?i)non[- ]?solicitation"
        - "(?i)ограничени(е|я)\\s+конкуренц"
        - "(?i)воздерж(аться|ивается)\\s+от.*деятельност"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: post-closing ограничения — неконкуренция и non-solicitation.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 421 ГК РФ: свобода договора — non-compete является законным условием;
             но слишком широкие ограничения могут быть признаны нарушающими ст. 10 ГК РФ
           — ФЗ-135: non-compete не должен создавать антиконкурентных последствий

        2. ПРАКТИКА:
           — DD-стандарт: non-compete (территория, срок обычно 2-5 лет, виды деятельности,
             санкции за нарушение); non-solicitation (ключевые работники и клиенты,
             срок, санкции); carve-outs (пассивные инвестиции, публичные компании и т.д.)

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "non_compete_clause": "yes | no | not_found",
            "non_compete_duration": "<срок или not_found>",
            "non_compete_territory": "<территория или not_found>",
            "non_compete_scope": "<виды деятельности или not_found>",
            "non_solicitation_clause": "yes | no | not_found",
            "penalty_for_breach": "described | not_found",
            "carve_outs": "yes | no | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — Не додумывай сроки и территорию
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "неконкуренция"
        - "non-compete"
        - "non-solicitation"
        - "переманивание"
        - "ограничение деятельности"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.06

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "non_compete_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли non-compete"
        - name: "non_compete_duration"
          type: "string"
          description: "Срок неконкуренции"
        - name: "non_solicitation_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли non-solicitation"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  #  CHECK 15: КОНФИДЕНЦИАЛЬНОСТЬ / СПОРЫ / ПРАВО
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_disputes_check
    name: "Конфиденциальность, подсудность и применимое право (ст. 421, 1210 ГК РФ)"
    description: >
      Проверяет условия конфиденциальности, порядок разрешения споров (подсудность,
      претензионный порядок, арбитраж), применимое право.
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "арбитражный суд"
        - "третейский суд"
        - "подсудность"
        - "претензионный порядок"
        - "применимое право"
        - "governing law"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)третейск(ий|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)применим(ое|ого)\\s+прав"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: конфиденциальность, споры, применимое право.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — АПК РФ / ГПК РФ: подведомственность (юрлица → арбитражный суд)
           — ст. 1210-1211 ГК РФ: применимое право
           — Коммерческая тайна: Федеральный закон № 98-ФЗ

        2. ПРАКТИКА:
           — DD-стандарт: подсудность явно указана; претензионный порядок с конкретным
             сроком; конфиденциальность с исключениями (банки, регуляторы, советники);
             применимое право — РФ или иное

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "confidentiality_clause": "yes | partial | not_found",
            "confidentiality_duration": "<срок или not_found>",
            "pre_trial_claim_procedure": "yes | not_found",
            "claim_response_deadline": "<срок или not_found>",
            "jurisdiction": "<суд или not_found>",
            "governing_law": "RU | foreign | not_specified | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — Не додумывай сроки и суды
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "конфиденциальность"
        - "арбитражный суд"
        - "претензионный порядок"
        - "применимое право"
        - "подсудность"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "confidentiality_clause"
          type: "string"
          allowed_values: ["yes", "partial", "not_found"]
          description: "Наличие конфиденциальности"
        - name: "pre_trial_claim_procedure"
          type: "string"
          allowed_values: ["yes", "not_found"]
          description: "Претензионный порядок"
        - name: "jurisdiction"
          type: "string"
          keyword_hints: ["арбитражный суд", "третейский суд", "МКАС"]
          description: "Подсудность"
        - name: "governing_law"
          type: "string"
          allowed_values: ["RU", "foreign", "not_specified", "not_found"]
          description: "Применимое право"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты продавца и покупателя (наименование/ФИО, ИНН/ОГРН, адрес);
      (б) полномочия подписантов (устав, доверенность, протокол);
      (в) корпоративные решения об одобрении сделки (если применимо) либо
      заключение о ненужности одобрения.
    addressee: "Обе стороны / Юридический советник"

  enterprise_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: детальное описание состава предприятия
      с разбивкой по группам активов — недвижимость, движимое имущество, права
      требования, долги, IP, работники, лицензии; перечень исключённых активов
      (excluded assets).
    addressee: "Продавец / Юридический советник"

  price_and_payment_mechanics:
    text: >
      Просим подтвердить по {doc_names}:
      (а) цену предприятия и валюту;
      (б) структуру платежей (upfront / retention / escrow / earn-out);
      (в) механизм корректировки цены (working capital, price adjustment);
      (г) распределение цены по группам активов для целей ст. 158 НК РФ.
    addressee: "Обе стороны / Налоговый консультант"

  mandatory_attachments_check:
    text: >
      Просим предоставить по {doc_names} обязательные приложения по ст. 561 ГК РФ:
      (а) акт инвентаризации предприятия;
      (б) бухгалтерский баланс;
      (в) заключение независимого аудитора о составе и стоимости;
      (г) перечень всех долгов с указанием кредиторов, размера и сроков требований.
    addressee: "Продавец / Финансовый советник"

  creditor_notification_and_debt_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) реестр кредиторов и статус письменных уведомлений каждого;
      (б) полученные согласия на перевод долга;
      (в) перечень долгов, по которым согласие не получено (risk assessment);
      (г) механизм солидарной ответственности при необходимости.
    addressee: "Продавец / Корпоративный юрист"

  state_registration_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) план регистрационных действий в Росреестре;
      (б) распределение расходов на государственную регистрацию;
      (в) последствия и план действий при отказе/приостановке регистрации.
    addressee: "Юридический советник / Росреестр"

  closing_and_transfer_act_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) форму и содержание передаточного акта предприятия;
      (б) closing agenda — последовательность действий сторон;
      (в) перечень deliverables (документы, ключи, IT-доступы, реестры, кадровые дела);
      (г) момент перехода рисков и распределение ответственности до/после регистрации.
    addressee: "Обе стороны / Юридический советник"

  enterprise_defects_and_buyer_remedies:
    text: >
      Просим уточнить по {doc_names}: средства защиты покупателя при несоответствии
      состава предприятия (ст. 565 ГК РФ):
      (а) право на уменьшение покупной цены;
      (б) право требовать восполнения состава;
      (в) право на расторжение при существенном нарушении;
      (г) защита от скрытых долгов (undisclosed liabilities);
      (д) time bar для предъявления требований.
    addressee: "Юридический советник покупателя"

  ip_and_intangibles_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) реестр товарных знаков, коммерческих обозначений, доменных имён, ноу-хау;
      (б) статус прав третьих лиц на IP-активы;
      (в) порядок переоформления в Роспатенте;
      (г) перечень входящих/исходящих лицензионных соглашений и их судьбу.
    addressee: "IP-консультант / Юридический советник"

  labor_transition_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) реестр работников с должностями и окладами;
      (б) результаты кадрового due diligence;
      (в) незавершённые трудовые споры и задолженность по зарплате;
      (г) коллективный договор (при наличии);
      (д) распределение pre-closing / post-closing трудовых рисков.
    addressee: "HR / Трудовой консультант"

  due_diligence_and_reps_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) DD-отчёт (юридический, финансовый, налоговый, кадровый, экологический);
      (б) disclosure schedule/letter;
      (в) пакет заверений продавца по финансовому состоянию, долгам, спорам,
      лицензиям, IP, налогам, экологии и работникам.
    addressee: "Продавец / DD-координатор"

  corporate_regulatory_compliance_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) антимонопольное заключение о необходимости согласования с ФАС либо
      подтверждение отсутствия необходимости;
      (б) перечень лицензий и разрешений с анализом их передаваемости;
      (в) план переоформления лицензий и влияние на closing.
    addressee: "Антимонопольный консультант / Regulatory counsel"

  tax_and_indemnity_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) налоговое заключение по ст. 158 НК РФ (НДС при продаже предприятия);
      (б) распределение pre-closing / post-closing налоговых рисков;
      (в) механизм tax indemnity и общее indemnification clause
      (cap, basket, de minimis, time bar).
    addressee: "Налоговый консультант / Юридический советник"

  post_closing_obligations_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) non-compete: территория, срок, виды деятельности, санкции, carve-outs;
      (б) non-solicitation: работники и клиенты, срок, санкции.
    addressee: "Юридический советник"

  termination_and_disputes_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) условия конфиденциальности (перечень сведений, исключения, срок);
      (б) подсудность (арбитражный суд / МКАС / иной форум);
      (в) претензионный порядок с конкретным сроком;
      (г) применимое право.
    addressee: "Юридический советник"

  creditor_notification_compliance:
    text: >
      Внимание: по {doc_names} требуется подтверждение письменного уведомления
      кредиторов (ст. 562 ГК РФ). Просим предоставить реестр уведомлений,
      доказательства отправки и статус согласий кредиторов.
    addressee: "Продавец / Корпоративный юрист"

  antitrust_clearance_required:
    text: >
      Внимание: {doc_names} может требовать согласования с ФАС России.
      Просим предоставить антимонопольное заключение и, при необходимости,
      материалы для согласования экономической концентрации.
    addressee: "Антимонопольный консультант"

  bankruptcy_challenge_risk:
    text: >
      Внимание: {doc_names} содержит риск банкротного оспаривания (ст. 61.2-61.3 ФЗ-127).
      Просим предоставить: анализ платежеспособности продавца, подтверждение
      рыночной стоимости предприятия и правовое заключение по риску оспаривания.
    addressee: "Юридический советник / Финансовый консультант"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


