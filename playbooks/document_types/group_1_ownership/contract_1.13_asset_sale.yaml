  # ──────────────────────────────────────────────────────────────────────────
  - id: creditor_notification_and_debt_transfer_check
    name: "Уведомление кредиторов, перевод долгов и солидарная ответственность (ст. 562 ГК РФ)"
    description: >
      Проверяет порядок письменного уведомления кредиторов, получение согласий
      на перевод долга, перечень долгов, последствия неуведомления и солидарную
      ответственность продавца и покупателя по не переведённым долгам.
    triggers:
      any: ["creditor_notification_required", "debt_transfer_included"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомление кредиторов"
