  - id: labor_transition_check
    name: "Трудовые отношения при продаже предприятия: переход работодателя (ст. 75 ТК РФ)"
    description: >
      Проверяет, как урегулирован переход работодателя по ст. 75 ТК РФ,
      судьба работников, кадровых документов, коллективного договора
      и трудовых рисков.
    triggers:
      any: ["employee_transfer_context"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ст. 75 ТК РФ"
        - "трудовые отношения"
        - "права и обязанности работодателя"
        - "работники предприятия"
        - "кадровые документы"
        - "коллективный договор"
        - "реестр работников"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ст\\.\\s*75\\s*ТК\\s*РФ"
        - "(?i)трудов(ые|ых)\\s+отношен"
        - "(?i)работник(и|ов)\\s+предприяти"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: трудовые отношения при продаже предприятия.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 75 ТК РФ: при смене собственника имущества организации трудовые
             отношения с работниками продолжаются; новый собственник вправе расторгнуть
             трудовые договоры с руководителем, заместителями, главным бухгалтером
             в течение 3 месяцев; остальные работники могут отказаться от продолжения работы
           — Коллективный договор действует в течение срока, на который заключён

        2. ПРАКТИКА:
           — DD-стандарт: реестр работников с должностями/окладами; кадровый DD;
             незавершённые трудовые споры; задолженность по зарплате; коллективный договор;
             распределение pre-closing / post-closing трудовых рисков

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
