        - "(?i)недостат(ки|ков)\\s+предприяти"
        - "(?i)уменьшени(е|я)\\s+покупн(ой|ую)\\s+цен"
        - "(?i)ст\\.\\s*565"

    llm:
      prompt_template: |
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор продажи предприятия (§ 8 Гл. 30 ГК РФ, ст. 559-566).

        Проверь блок: несоответствие состава предприятия и средства защиты покупателя.

        Оцени по двум стандартам:

        1. ЗАКОН:
           — ст. 565 ГК РФ: при передаче предприятия с недостатками или
             несоответствующего договору составом применяются правила о КП (ст. 460-462, 466,
             469, 475, 479 ГК РФ), если иное не вытекает из существа и последствий нарушения
           — ст. 565 ч. 3 ГК РФ: если долги, не указанные в договоре, переведены на покупателя
             без согласия кредиторов — покупатель вправе требовать уменьшения цены,
             если не докажет, что знал о них при заключении/передаче
           — Расторжение допускается только при существенном нарушении (ст. 565 ч. 4 ГК РФ):
             покупатель вправе требовать возврата переданного, но продавец не возвращает
             то, чем уже воспользовался покупатель

        2. ПРАКТИКА:
           — DD-стандарт: перечень допустимых средств защиты при несоответствии состава;
             механизм price reduction; процедура supplementary transfer; conditions for
             rescission; protection against hidden/undisclosed liabilities; claim time bar

        Верни строго JSON:
        {
          "law_compliance": "compliant | partial | non_compliant | not_assessable",
          "law_gaps": ["..."],
          "practice_quality": "good | acceptable | weak | not_assessable",
          "practice_gaps": ["..."],
          "missing_elements": {
            "defects_remedy_clause": "described | partial | not_found",
            "price_reduction_right": "yes | no | not_found",
            "supplementary_transfer_right": "yes | no | not_found",
            "rescission_right_for_material_breach": "yes | no | not_found",
            "hidden_debt_protection": "yes | no | not_found",
            "seller_replacement_right": "yes | no | not_found",
            "time_limit_for_claims": "specified | not_found"
          },
          "risk_summary": "...",
          "evidence": [
            {"clause_ref": "...", "quote": "..."}
          ]
        }

        Правила интерпретации:
        — not_found: условие явно отсутствует
        — partial: упомянуто, но без достаточной детализации
        — Не додумывай сроки и средства защиты
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "несоответствие состава"
        - "недостатки предприятия"
        - "уменьшение цены"
        - "расторжение"
        - "скрытые обязательства"
        - "ст. 565"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "defects_remedy_clause"
          type: "string"
          allowed_values: ["described", "partial", "not_found"]
          description: "Описаны ли средства защиты"
        - name: "price_reduction_right"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли право на уменьшение цены"
        - name: "hidden_debt_protection"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли защита от скрытых долгов"
      store_payload: true

