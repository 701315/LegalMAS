    name: "Closing, передаточный акт и deliverables"
    description: "Проверяет механизмы закрытия сделки и комплект передаваемых документов"
    legal_base: "ст. 563 ГК РФ, свобода договора"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "передаточный акт"
        - "дата закрытия"
        - "условия precedent"
        - "передача документации"
        - "передача ключей"
        - "closing"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передаточн(ый|ого)\\s+акт"
        - "(?i)closing|условия\\s+precedent"

  - id: "confidentiality"
    name: "Конфиденциальность"
    description: "Проверяет наличие NDA-like положений"
    legal_base: "ст. 421 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет forum, court/arbitration и претензионный порядок"
    legal_base: "АПК РФ, ГПК РФ, Закон об арбитраже"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "арбитражный суд"
        - "третейский суд"
        - "подсудность"
        - "претензионный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)третейск(ий|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "enterprise_defects_remedies"
    name: "Средства защиты покупателя при несоответствии состава (ст. 565 ГК РФ)"
    description: "Проверяет наличие условий о последствиях несоответствия состава предприятия"
    legal_base: "ст. 565 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "несоответствие состава"
        - "недостатки предприятия"
        - "уменьшение покупной цены"
        - "восполнение состава"
        - "расторжение при существенном нарушении"
        - "скрытые обязательства"
        - "ст. 565"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)несоответстви(е|я)\\s+состав"
        - "(?i)уменьшени(е|я)\\s+покупн(ой|ую)\\s+цен"
        - "(?i)ст\\.\\s*565"

  - id: "payment_mechanics"
    name: "Механика оплаты: escrow, этапы, условия для платежа"
    description: "Проверяет порядок расчётов — для сделок с предприятиями критически важно"
    legal_base: "ГК РФ (общие положения)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["payment_escrow_context"]
    rules:
      keywords:
        - "порядок оплаты"
        - "этапы оплаты"
        - "эскроу"
        - "аккредитив"
        - "рассрочка"
        - "условие для платежа"
        - "удержание части цены"
        - "holdback"
        - "earn-out"
        - "escrow"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)эскроу|escrow"
        - "(?i)аккредитив"
        - "(?i)рассрочк"
        - "(?i)holdback|earn[- ]?out"

  - id: "non_compete_non_solicitation"
    name: "Ограничение конкуренции и non-solicitation"
    description: "Проверяет наличие non-compete и non-solicitation ковенантов — стандарт M&A-практики"
    legal_base: "ст. 421 ГК РФ, свобода договора"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["non_compete_context"]
    rules:
      keywords:
        - "ограничение конкуренции"
        - "неконкуренция"
        - "non-compete"
        - "не конкурировать"
        - "воздержаться от деятельности"
        - "переманивание работников"
        - "non-solicitation"
        - "запрет конкурирующей деятельности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)non[- ]?compete"
        - "(?i)non[- ]?solicitation"
        - "(?i)ограничени(е|я)\\s+конкуренц"
        - "(?i)воздерж(аться|ивается)\\s+от.*деятельност"

  - id: "indemnification_clause"
    name: "Возмещение потерь / индемнити (ст. 406.1 ГК РФ)"
    description: "Проверяет наличие indemnification clause — критично для M&A-конструкций"
    legal_base: "ст. 406.1 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возмещение потерь"
        - "индемнити"
        - "indemnification"
        - "indemnity"
        - "ст. 406.1"
        - "обязуется возместить потери"
        - "cap on liability"
        - "basket"
        - "de minimis"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индемнити|indemnit"
        - "(?i)возмещени(е|я)\\s+потерь"
        - "(?i)ст\\.\\s*406\\.1"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты продавца и покупателя,
      включая ИНН/ОГРН, адреса, бенефициаров и полномочия подписантов.
    addressee: "Обе стороны"

  enterprise_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: детальное описание состава предприятия,
      включая активы, долги, IP, недвижимость, работников, лицензии и иные
      элементы имущественного комплекса.
    addressee: "Продавец / Юридический советник"

  enterprise_subject_required:
    text: >
      Просим уточнить в {doc_names}, что предметом является именно предприятие
      как имущественный комплекс в целом, а не набор отдельных активов.
    addressee: "Юридический советник"

  price_required:
    text: >
      Просим подтвердить цену предприятия по {doc_names}, валюту цены,
      порядок оплаты и, при необходимости, распределение цены по группам активов
      для налоговых и accounting-целей.
    addressee: "Обе стороны / Налоговый консультант"

  mandatory_attachments_check:
    text: >
      Просим предоставить по {doc_names}: акт инвентаризации, бухгалтерский баланс,
      заключение независимого аудитора и перечень долгов с указанием кредиторов.
    addressee: "Продавец / Финансовый советник"

  mandatory_attachments_required:
    text: >
      Просим приложить к {doc_names} полный комплект обязательных документов по ст. 561 ГК РФ:
      инвентаризацию, баланс, аудиторское заключение и перечень долгов.
    addressee: "Юридический советник продавца"

  creditor_notification_and_debt_transfer_check:
    text: >
      Просим предоставить по {doc_names}: порядок уведомления кредиторов,
      реестр кредиторов, согласия на перевод долга (если требуются),
      а также описание последствий неуведомления.
    addressee: "Продавец / Корпоративный юрист"

  creditor_notification_procedure:
    text: >
      Просим уточнить в {doc_names}: когда, как и кем уведомляются кредиторы,
      какие обязательства включаются в перевод долгов, и какие согласия кредиторов
      уже получены / подлежат получению.
    addressee: "Юридический советник"

  solidary_liability_clause:
    text: >
      Просим уточнить в {doc_names}: как отражена солидарная ответственность
      продавца и покупателя по долгам, не переведённым на покупателя.
    addressee: "Юридический советник"

  state_registration_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: регистрационную механику сделки,
      порядок подачи документов в Росреестр, распределение расходов и действия
      сторон при приостановке/отказе в регистрации.
    addressee: "Юридический советник / Росреестр"

  state_registration_clause:
    text: >
      Просим уточнить в {doc_names}: условие о государственной регистрации договора
      продажи предприятия и момент, с которого договор считается заключённым.
    addressee: "Юридический советник"

  transfer_act_required:
    text: >
      Просим согласовать по {doc_names}: форму передаточного акта предприятия,
      дату подписания, состав передаваемой документации, ключей, реестров и иных deliverables.
    addressee: "Обе стороны"

  ip_and_intangibles_transfer_check:
    text: >
      Просим предоставить по {doc_names}: перечень товарных знаков, коммерческих обозначений,
      доменных имён, ноу-хау, лицензий и иных нематериальных активов,
      а также порядок их перехода/переоформления.
    addressee: "Продавец / IP-консультант"

  ip_transfer_clause:
    text: >
      Просим уточнить в {doc_names}: какие исключительные права и средства индивидуализации
      входят в состав предприятия и как оформляется их переход к покупателю.
    addressee: "IP-консультант / Юридический советник"

  labor_transition_check:
    text: >
      Просим предоставить по {doc_names}: реестр работников, кадровый due diligence,
      информацию о коллективном договоре, незавершённых трудовых спорах и порядке
      перехода функций работодателя.
    addressee: "HR / Трудовой консультант"

  labor_relations_transition:
    text: >
      Просим уточнить в {doc_names}: порядок применения ст. 75 ТК РФ,
      переход трудовых отношений, кадровой документации и распределение
      pre-closing / post-closing трудовых рисков.
    addressee: "Трудовой консультант / Юридический советник"

  tax_implications_and_liabilities:
    text: >
      Просим предоставить по {doc_names}: налоговый анализ сделки, НДС-последствия,
      распределение pre-closing / post-closing налоговых рисков, результаты tax DD
      и проект tax indemnity.
    addressee: "Налоговый консультант"

  due_diligence_and_reps_check:
    text: >
      Просим предоставить по {doc_names}: DD-report, data room index,
      disclosure schedule/letter, пакет заверений продавца по долгам, спорам,
      лицензиям, IP, налогам, экологии и работникам.
    addressee: "Продавец / DD-координатор"

  due_diligence_and_representations:
    text: >
      Просим включить/уточнить в {doc_names}: DD-процедуру, раскрытие информации
      и заверения продавца об отсутствии скрытых обязательств, споров, regulatory issues
      и иных material adverse matters.
    addressee: "Юридический советник"

  antimonopoly_clearance_requirements:
    text: >
      Просим предоставить по {doc_names}: антимонопольный анализ,
      заключение о необходимости согласования с ФАС, проект/копию ходатайства
      или подтверждение отсутствия такой необходимости.
    addressee: "Антимонопольный консультант"

  regulated_assets_and_licenses:
    text: >
      Просим предоставить по {doc_names}: перечень лицензий и разрешительной документации,
      анализ их перехода/переоформления и влияние на closing.
    addressee: "Regulatory counsel / Юридический советник"

  closing_and_transfer_act_check:
    text: >
      Просим уточнить в {doc_names}: closing agenda, перечень closing deliverables,
      форму передаточного акта, дату закрытия сделки, момент перехода рисков
      и порядок передачи доступа к предприятию.
    addressee: "Юридический советник / Обе стороны"

  closing_and_transfer_act_procedures:
    text: >
      Просим согласовать по {doc_names}: closing steps, передаточный акт,
      перечень документов, имущества, ключей, IT-доступов и иных deliverables.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим уточнить в {doc_names}: условия конфиденциальности,
      commercial secrecy regime и permitted disclosures.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      арбитражную оговорку (если есть) и применимое право.
    addressee: "Юридический советник"

  state_registration_required_for_enterprise_sale:
    text: >
      Внимание: для {doc_names} обязательна государственная регистрация договора
      продажи предприятия. Просим подготовить регистрационный пакет и план действий
      по подаче документов.
    addressee: "Юридический советник / Росреестр"

  mandatory_enterprise_attachments_required:
    text: >
      Внимание: {doc_names} без обязательных приложений по ст. 561 ГК РФ
      несёт риск незаключённости. Просим предоставить инвентаризацию, баланс,
      аудиторское заключение и перечень долгов.
    addressee: "Продавец / Юридический советник"

  creditor_notification_required:
    text: >
      Внимание: по {doc_names} требуется подтверждение письменного уведомления кредиторов.
      Просим предоставить реестр уведомлений, доказательства отправки и статус согласий кредиторов.
    addressee: "Продавец / Корпоративный юрист"

  antitrust_clearance_required:
    text: >
      Внимание: {doc_names} может требовать согласования с ФАС России.
      Просим предоставить антимонопольное заключение и, при необходимости,
      материалы для согласования экономической концентрации.
    addressee: "Антимонопольный консультант"

  bankruptcy_challenge_risk:
    text: >
      Внимание: {doc_names} содержит риск банкротного оспаривания.
      Просим предоставить insolvency analysis, fair value support,
      сведения об аффилированности и кредиторском контуре продавца.
    addressee: "Юридический советник / Финансовый консультант"

  enterprise_defects_and_buyer_remedies:
    text: >
      Просим уточнить в {doc_names}: какие средства защиты имеет покупатель
      при несоответствии состава предприятия (ст. 565 ГК РФ): право на уменьшение
      цены, требование восполнения состава, расторжение при существенном нарушении,
      защита от скрытых долгов, сроки предъявления требований.
    addressee: "Юридический советник покупателя"

  enterprise_defects_remedies:
    text: >
      Просим включить в {doc_names}: блок последствий несоответствия состава
      предприятия (ст. 565 ГК РФ) — уменьшение цены, восполнение, расторжение,
      защита от undisclosed liabilities, time bar для требований.
    addressee: "Юридический советник"

  payment_mechanics:
    text: >
      Просим уточнить в {doc_names}: механику расчётов — этапы оплаты,
      условия для каждого платежа, использование escrow/аккредитива,
      holdback, earn-out (если применимо), распределение расходов на escrow.
    addressee: "Обе стороны / Финансовый советник"

  non_compete_non_solicitation:
    text: >
      Просим уточнить в {doc_names}: наличие и параметры non-compete
      (территория, срок, виды деятельности, санкции) и non-solicitation
      (запрет переманивания работников/клиентов, срок, санкции).
    addressee: "Юридический советник"

  indemnification_clause:
    text: >
      Просим уточнить в {doc_names}: наличие indemnification clause
      (ст. 406.1 ГК РФ) — перечень indemnified events, cap, basket,
      de minimis, time bar, порядок уведомления и взыскания.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"