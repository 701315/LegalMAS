        - ст. 465 ГК РФ
        - ст. 424 ГК РФ
        - ст. 485 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли описание предмета (товара).
        2. Есть ли состав/количество товара.
