type: contract_1.1_general_sale
name: "Договор купли-продажи (общая)"

description: |
  Базовая (родовая) конструкция купли-продажи для возмездной передачи права собственности
  на имущество по § 1 Главы 30 ГК РФ. Является parent/fallback-типом для группы договоров
  передачи имущества в собственность и применяется тогда, когда документ содержит признаки
  возмездного отчуждения вещи/товара, но не содержит достаточно определённых признаков
  специализированных видов купли-продажи или смежных специальных конструкций
  (розница, поставка, контрактация, энергоснабжение, недвижимость, мена, дарение, рента,
  цессия, продажа корпоративных прав, отступное, продажа предприятия и т.п.).
  Тип предназначен для разовых и неспециализированных сделок с движимым имуществом,
  когда применяются общие положения о купле-продаже без преобладания специального режима.

version: 4.1
parent: class_1_transfer_of_ownership

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 30 ГК РФ (ст. 454-491)"
  doc_types_supported:
    - "договор купли-продажи"
    - "договор купли-продажи товара"
    - "договор купли-продажи имущества"
    - "соглашение о продаже имущества"
    - "договор продажи движимого имущества"
    - "разовая купля-продажа"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.82
    strong_signal_threshold: 0.90
    ambiguity_margin: 0.22
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)\\bкупли-?продажи\\b"
      - "(?i)\\bдоговор[\\s_.-]*купли-?продажи\\b"
      - "(?i)\\bsale[\\s_.-]*agreement\\b"
      - "(?i)\\bpurchase[\\s_.-]*agreement\\b"
      - "(?i)\\bgeneral[\\s_.-]*sale\\b"
      - "(?i)договор[\\s_.-]*продажи(?!.*(поставк|розничн|недвижимост|аренд|лизинг))"

    folder_patterns:
      - "(?i)sale"
      - "(?i)purchase"
      - "(?i)ownership"
      - "(?i)transfer"
      - "(?i)general[_\\s-]*sale"

    keywords:

      high:
        - pattern: "(?i)^\\s*договор[\\s\\n\\r]+купли-?продажи\\s*$"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Голое название без указания предмета — классический general sale"

        - pattern: "(?i)^\\s*договор[\\s\\n\\r]+купли-?продажи\\s+товар[ао]\\s*$"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Договор купли-продажи товара — типовая формулировка general sale"

        - pattern: "(?i)^\\s*договор[\\s\\n\\r]+купли-?продажи\\s+имуществ[ао]\\s*$"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор купли-продажи имущества — движимое, не недвижимость"

        - pattern: "(?i)^\\s*договор[\\s\\n\\r]+купли-?продажи\\s+движим[а-я\\s]+имуществ[ао]\\s*$"
          weight: 0.98
          distinctiveness: high
          context: header
          description: "Явное указание на движимое имущество в заголовке — сильнейший маркер"

        - pattern: "(?i)^\\s*соглашение[\\s\\n\\r]+о\\s+продаже\\s+имуществ[ао]\\s*$"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Соглашение о продаже имущества"

        - pattern: "(?i)^\\s*sale\\s+and\\s+purchase\\s+agreement\\s*$"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Общая English-форма SPA без уточнения предмета"

        - pattern: "(?i)^\\s*sale\\s+agreement\\s*$"
          weight: 0.85
          distinctiveness: high
          context: header
          description: "Простая English-форма sale agreement"

        - pattern: "(?i)^\\s*purchase\\s+agreement\\s*$"
          weight: 0.85
          distinctiveness: high
          context: header
          description: "Простая English-форма purchase agreement"

        - pattern: "(?i)передает\\s+в\\s+собственност[ьи]"
          weight: 0.75
          distinctiveness: medium
          context: body
          description: "Ключевая формула возмездной передачи права собственности"

        - pattern: "(?i)\\bдвижим[оа]е?\\s+имущество\\b"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Прямое указание на движимое имущество — отсекает недвижимость"

        - pattern: "(?i)цена\\s+товар[ао]"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Признак товарной купли-продажи"

        - pattern: "(?i)количество\\s+товар[ао]"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Количественная спецификация товара"

        - pattern: "(?i)наименовани[ея]\\s+товар[ао]"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Идентификация товара как предмета договора"

      medium:
        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+купли-?продажи\\b"
          weight: 0.55
          distinctiveness: medium
          context: header
          description: "Общая формула — присутствует во всех специализированных типах, здесь fallback"

        - pattern: "(?i)\\bпродавец\\b"
          weight: 0.40
          distinctiveness: low
          context: body
          description: "Продавец — универсальная роль, есть во всех купле-продажах"

        - pattern: "(?i)\\bпокупател[ьяеи]\\b"
          weight: 0.40
          distinctiveness: low
          context: body
          description: "Покупатель — аналогично продавцу"

        - pattern: "(?i)\\bтовар\\b"
          weight: 0.35
          distinctiveness: low
          context: body
          description: "Товар — очень общий термин"

        - pattern: "(?i)\\bимуществ[оа]\\b"
          weight: 0.30
          distinctiveness: low
          context: body
          description: "Имущество — универсальный термин"

        - pattern: "(?i)ассортимент"
          weight: 0.45
          distinctiveness: low
          context: any
          description: "Ассортимент — частый, но не уникальный признак товарной продажи"

        - pattern: "(?i)комплектност[ьи]"
          weight: 0.45
          distinctiveness: low
          context: any
          description: "Комплектность товара"

        - pattern: "(?i)тара\\s+и\\s+упаковка"
          weight: 0.45
          distinctiveness: low
          context: any
          description: "Условия тары и упаковки"

        - pattern: "(?i)гарантийный\\s+срок"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Гарантийные условия по товару"

        - pattern: "(?i)скрыт[аые]\\s+недостатк"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Регулирование скрытых недостатков"

        - pattern: "(?i)товарн[а-я\\s]+накладн(?:ая|ые|ых)"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Товарная накладная как типичный документ передачи"

        - pattern: "(?i)акт[\\s\\n\\r]+при[её]ма-?передач[ии]"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Акт приёма-передачи"

        - pattern: "(?i)доставк[аи]"
          weight: 0.40
          distinctiveness: low
          context: any
          description: "Условие доставки"

        - pattern: "(?i)самовывоз"
          weight: 0.40
          distinctiveness: low
          context: any
          description: "Самовывоз как способ передачи товара"

        - pattern: "(?i)предоплат[аы]"
          weight: 0.45
          distinctiveness: low
          context: any
          description: "Условие о предоплате"

        - pattern: "(?i)переход\\s+риска"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Переход риска случайной гибели"

        - pattern: "(?i)переход\\s+права\\s+собственност[иьи]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Прямая формула перехода права собственности"

      low:
        - pattern: "(?i)спецификаци[яяеиий]"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Спецификация товара"

        - pattern: "(?i)приемк[аи]"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Общая лексика о приёмке"

        - pattern: "(?i)претензии?\\s+по\\s+качеств"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Претензии по качеству"

        - pattern: "(?i)неустойк[аи]"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Общий санкционный блок"

        - pattern: "(?i)отгрузк[аи]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Условие отгрузки"

        - pattern: "(?i)сертификат\\s+качеств[ао]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Сертификат качества"

    exclusions:
      - pattern: "(?i)розничн[а-я\\s]+купли-?продаж"
        severity: hard
        weight: -1.0
        description: "Розничная купля-продажа — отдельный специальный тип"

      - pattern: "(?i)для\\s+(?:личных|семейных|домашних|бытовых)\\s+нужд"
        severity: hard
        weight: -1.0
        description: "Потребительская цель — признак розницы (ст. 492 ГК)"

      - pattern: "(?i)гражданин-?потребитель|\\bпотребитель\\b"
        severity: hard
        weight: -1.0
        description: "Потребительский характер сделки"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+поставки\\b"
        severity: hard
        weight: -1.0
        description: "Поставка — самостоятельный тип договора"

      - pattern: "(?i)\\bпоставщик\\b"
        severity: hard
        weight: -1.0
        description: "Роль поставщика — маркер договора поставки"

      - pattern: "(?i)поставка\\s+партиями"
        severity: hard
        weight: -1.0
        description: "Поставка партиями — признак поставки, не general sale"

      - pattern: "(?i)график\\s+поставок"
        severity: hard
        weight: -1.0
        description: "График поставок — сильный маркер поставки"

      - pattern: "(?i)\\bконтрактаци[яи]\\b"
        severity: hard
        weight: -1.0
        description: "Контрактация — отдельный тип (§ 5 гл. 30 ГК)"

      - pattern: "(?i)\\bэнергоснабжен"
        severity: hard
        weight: -1.0
        description: "Энергоснабжение — отдельный договорный режим (§ 6 гл. 30 ГК)"

      - pattern: "(?i)потреблени[ея]\\s+электроэнерг"
        severity: hard
        weight: -1.0
        description: "Прямой энергетический контекст"

      - pattern: "(?i)\\bресурсоснабжени[ея]\\b"
        severity: hard
        weight: -1.0
        description: "Ресурсоснабжение — не general sale"

      - pattern: "(?i)\\bнедвижимост[ьи]\\b"
        severity: hard
        weight: -1.0
        description: "Недвижимость — специальный тип купли-продажи (§ 7 гл. 30 ГК)"

      - pattern: "(?i)\\bквартир[аеиу]\\b"
        severity: hard
        weight: -1.0
        description: "Квартира как объект недвижимости"

      - pattern: "(?i)жил[а-я\\s]+помещени[ея]"
        severity: hard
        weight: -1.0
        description: "Жилое помещение"

      - pattern: "(?i)земельн[а-я\\s]+участ"
        severity: hard
        weight: -1.0
        description: "Земельный участок"

      - pattern: "(?i)ЕГРН|Росреестр|кадастр[а-я]"
        severity: hard
        weight: -1.0
        description: "Реестровые маркеры недвижимости — однозначно исключают general sale"

      - pattern: "(?i)государственн[а-я\\s]+регистраци[яи]\\s+прав"
        severity: hard
        weight: -1.0
        description: "Регистрация права собственности — обязательна только для недвижимости"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\b"
        severity: hard
        weight: -1.0
        description: "Мена — самостоятельный договор (ст. 567 ГК)"

      - pattern: "(?i)бартерн[а-я\\s]+договор"
        severity: hard
        weight: -1.0
        description: "Бартерная конструкция"

      - pattern: "(?i)обмен[а-я\\s]+имуществ"
        severity: hard
        weight: -1.0
        description: "Прямой признак мены"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+дарени[яи]\\b"
        severity: hard
        weight: -1.0
        description: "Дарение — безвозмездная передача (ст. 572 ГК)"

      - pattern: "(?i)безвозмездн[а-я\\s]+передач[аи]"
        severity: hard
        weight: -1.0
        description: "Безвозмездность несовместима с куплей-продажей"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+ренты\\b"
        severity: hard
        weight: -1.0
        description: "Рента — самостоятельный тип (гл. 33 ГК)"

      - pattern: "(?i)пожизненн[а-я\\s]+содержани[ея]"
        severity: hard
        weight: -1.0
        description: "Пожизненное содержание с иждивением"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+цессии\\b"
        severity: hard
        weight: -1.0
        description: "Цессия — уступка права требования, не продажа вещи (ст. 382 ГК)"

      - pattern: "(?i)уступк[аи]\\s+прав[аоу]\\s+требовани[яи]"
        severity: hard
        weight: -1.0
        description: "Уступка прав требования"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+купли-?продажи\\s+доли\\s+участия\\b"
        severity: hard
        weight: -1.0
        description: "Продажа доли участия — отдельный корпоративный тип"

      - pattern: "(?i)продажа\\s+доли\\s+в\\s+уставном\\s+капитал"
        severity: hard
        weight: -1.0
        description: "Продажа доли в уставном капитале"

      - pattern: "(?i)\\bдоля\\s+в\\s+ООО\\b"
        severity: hard
        weight: -1.0
        description: "Корпоративная доля в ООО"

      - pattern: "(?i)share\\s+purchase\\s+agreement|share\\s+sale\\s+agreement"
        severity: hard
        weight: -1.0
        description: "Английская форма SPA для акций/долей"

      - pattern: "(?i)соглашени[ея]\\s+об\\s+отступн"
        severity: hard
        weight: -1.0
        description: "Отступное — иная правовая конструкция (ст. 409 ГК)"

      - pattern: "(?i)исполнени[ея]\\s+обязательств\\s+отступн"
        severity: hard
        weight: -1.0
        description: "Исполнение обязательства через отступное"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+продажи\\s+предприяти[яи]\\b"
        severity: hard
        weight: -1.0
        description: "Продажа предприятия — отдельный тип (§ 8 гл. 30 ГК)"

      - pattern: "(?i)предприятие\\s+как\\s+имущественн[а-я\\s]+комплекс"
        severity: hard
        weight: -1.0
        description: "Имущественный комплекс предприятия"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+аренды\\b"
        severity: hard
        weight: -1.0
        description: "Аренда — не передача права собственности"

      - pattern: "(?i)\\bарендатор\\b|\\bарендодатель\\b"
        severity: hard
        weight: -1.0
        description: "Роли сторон арендного договора"

      - pattern: "(?i)лизингополучател[яьи]|лизингодател[яьи]"
        severity: hard
        weight: -1.0
        description: "Лизинговая конструкция"

      - pattern: "(?i)\\blease\\s+agreement\\b"
        severity: hard
        weight: -1.0
        description: "Англоязычный признак аренды/лизинга"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+хранен"
        severity: hard
        weight: -1.0
        description: "Хранение — иной договорный тип (гл. 47 ГК)"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+перевоз"
        severity: hard
        weight: -1.0
        description: "Перевозка — иной договорный тип (гл. 40 ГК)"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+транспортн[а-я\\s]+экспедиц"
        severity: hard
        weight: -1.0
        description: "Транспортная экспедиция (гл. 41 ГК)"

      - pattern: "(?i)\\bхранитель\\b"
        severity: hard
        weight: -1.0
        description: "Роль хранителя"

      - pattern: "(?i)\\bперевозчик\\b|\\bэкспедитор\\b"
        severity: hard
        weight: -1.0
        description: "Роли перевозки/экспедиции"

      # ── Soft exclusions

      - pattern: "(?i)\\bакци[яи]\\b"
        severity: soft
        weight: -0.30
        description: "Акции чаще указывают на shares sale, но требуют контекста"

      - pattern: "(?i)сельскохозяйственн[а-я\\s]+продукци"
        severity: soft
        weight: -0.30
        description: "Может указывать на контрактацию (ст. 535 ГК)"

      - pattern: "(?i)недопоставк[аи]"
        severity: soft
        weight: -0.35
        description: "Терминология поставки"

      - pattern: "(?i)\\bвосполнени[ея]\\b"
        severity: soft
        weight: -0.25
        description: "Может быть связано с восполнением недопоставки"

      - pattern: "(?i)поставк[аи]\\s+товар[овы]"
        severity: soft
        weight: -0.30
        description: "Поставка товаров — ближе к contract_1.3_goods_supply"

      - pattern: "(?i)публичн[а-я\\s]+оферт"
        severity: soft
        weight: -0.25
        description: "Публичная оферта часто указывает на розницу, но не всегда"

      - pattern: "(?i)(?:здани[ея]|сооружени[ея])"
        severity: soft
        weight: -0.25
        description: "Здание/сооружение часто указывает на недвижимость, но требует контекста"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  general_sale_subject:
    any_keywords:
      - "(?i)\\bтовар\\b"
      - "(?i)\\bимуществ[оа]\\b"
      - "(?i)\\bвещь\\b"
      - "(?i)передает\\s+в\\s+собственност[ьи]"
      - "(?i)передача\\s+товар[ао]"
      - "(?i)наименовани[ея]\\s+товар[ао]"
      - "(?i)количество\\s+товар[ао]"

  movable_goods_sale:
    any_keywords:
      - "(?i)\\bоборудовани[ея]\\b"
      - "(?i)\\bтовар\\b"
      - "(?i)\\bпродукци[яи]\\b"
      - "(?i)\\bматериал[ыов]\\b"
      - "(?i)\\bмебел[ьи]\\b"
      - "(?i)\\bтехник[аи]\\b"
      - "(?i)запасн[ыхые]\\s+част[ейи]"
      - "(?i)\\bинвентар[ьяю]\\b"
      - "(?i)\\bсырь[ёея]\\b"

  legal_entity_party:
    any_keywords:
      - "(?i)\\bООО\\b"
      - "(?i)\\bАО\\b"
      - "(?i)\\bПАО\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bКПП\\b"
      - "(?i)юридическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bобществ[оа]\\b"

  individual_party:
    any_keywords:
      - "(?i)\\bгражданин\\b"
      - "(?i)физическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bпаспорт\\b"
      - "(?i)дата\\s+рождения"
      - "(?i)место\\s+рождения"

  installment_or_deferred_payment:
    any_keywords:
      - "(?i)\\bрассрочк[аи]\\b"
      - "(?i)отсрочк[аи]\\s+платеж[ао]"
      - "(?i)поэтапн[а-я\\s]+оплат[аы]"
      - "(?i)оплат[аы]\\s+частями"
      - "(?i)после\\s+передач[ии]"
      - "(?i)в\\s+течени[ие]\\s+.*\\s+дней\\s+после\\s+передач[ии]"

  advance_payment:
    any_keywords:
      - "(?i)\\bпредоплат[аы]\\b"
      - "(?i)\\bаванс\\b"
      - "(?i)частичн[а-я\\s]+предоплат[аы]"
      - "(?i)100\\s*%\\s*предоплат[аы]"

  delivery_included:
    any_keywords:
      - "(?i)\\bдоставк[аи]\\b"
      - "(?i)\\bсамовывоз\\b"
      - "(?i)\\bотгрузк[аи]\\b"
      - "(?i)передач[аи]\\s+перевозчику"
      - "(?i)пункт\\s+выдач[ии]"
      - "(?i)склад\\s+продавц[аы]"
      - "(?i)склад\\s+покупател[яи]"

  warranty_goods:
    any_keywords:
      - "(?i)гарантийный\\s+срок"
      - "(?i)гаранти[яи]\\s+качеств[ао]"
      - "(?i)гарантийн[ыхые]\\s+обязательств"
      - "(?i)сертификат\\s+качеств[ао]"
      - "(?i)паспорт\\s+издели[яи]"

  specialized_type_hint:
    any_keywords:
      - "(?i)\\bрозничн[а-я]\\b"
      - "(?i)\\bпоставк[аи]\\b"
      - "(?i)\\bконтрактаци[яи]\\b"
      - "(?i)\\bэнергоснабжен"
      - "(?i)\\bнедвижимост[ьи]\\b"
      - "(?i)\\bмен[аы]\\b"
      - "(?i)\\bдарени[ея]\\b"
      - "(?i)\\bрент[аы]\\b"
      - "(?i)\\bцесси[яи]\\b"
      - "(?i)доля\\s+в\\s+ООО"
      - "(?i)\\bакци[яи]\\b"
      - "(?i)\\bпредприяти[ея]\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  quantity_units: "(?i)\\b\\d+[\\d\\s,.]*\\s*(шт|штук|кг|тонн|л|литр|м|м2|м3|ед\\.)\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "specialized_type_misclassification_risk"
    name: "Риск неверной квалификации: документ может относиться к специальному типу"
    description: >
      Общая купля-продажа применяется только как fallback. Если документ содержит
      устойчивые признаки специализированной конструкции (розница, поставка, недвижимость,
      мена, дарение, рента, цессия и т.п.), требуется переквалификация в специальный тип.
    legal_base: "§ 1 Главы 30 ГК РФ, специальные нормы для отдельных видов договоров"
    required_triggers: ["specialized_type_hint"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "розничная"
        - "поставка"
        - "недвижимость"
        - "мена"
        - "дарение"
        - "рента"
        - "цессия"
        - "акции"
        - "доля в ООО"
        - "предприятие"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "поставка"
        - "розничная"
        - "недвижимость"
        - "мена"
        - "цессия"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: general_sale_subject_extraction
    name: "Общая купля-продажа: извлечение предмета, количества и цены"
    description: >
      Извлекает наименование товара/имущества, количество, цену,
      способ передачи и базовые параметры общей купли-продажи.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товар"
        - "имущество"
        - "наименование товара"
        - "количество"
        - "цена"
        - "передает в собственность"
        - "продавец"
        - "покупатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[\\d\\s,.]*\\s*(шт|штук|кг|тонн|л|литр|м|м2|м3|ед\\.)\\b"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
        - "(?i)наименовани(е|я)\\s+товар"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор общей купли-продажи.
        Извлеки ключевые параметры предмета сделки.

        Ответь строго в JSON:
        {
          "subject_name": "<наименование товара/имущества или not_found>",
          "quantity": "<количество с единицей измерения или not_found>",
          "price": "<цена или not_found>",
          "delivery_mode": "<delivery / pickup / unclear / not_found>",
          "transfer_document": "<invoice / act / mixed / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "наименование товара"
        - "количество"
        - "цена"
        - "передача товара"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "subject_name"
          type: "string"
          description: "Наименование предмета купли-продажи"
        - name: "quantity"
          type: "string"
          description: "Количество товара"
        - name: "price"
          type: "string"
          description: "Цена"
        - name: "delivery_mode"
          type: "string"
          allowed_values: ["delivery", "pickup", "unclear", "not_found"]
          description: "Способ передачи"
      store_payload: true

  - id: qualification_fallback_check
    name: "Проверка корректности fallback-квалификации"
    description: >
      Проверяет, действительно ли документ следует квалифицировать как общую куплю-продажу,
      а не как один из специальных договоров группы.
    triggers:
      any: ["specialized_type_hint"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "розничная"
        - "поставка"
        - "контрактация"
        - "энергоснабжение"
        - "недвижимость"
        - "мена"
        - "дарение"
        - "рента"
        - "уступка"
        - "доля в ООО"
        - "акции"
        - "предприятие"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор купли-продажи.
        Определи, не является ли документ специальным типом, который ошибочно попал в общий тип.

        Ответь строго в JSON:
        {
          "fallback_classification_valid": "<yes / no / unclear>",
          "most_likely_specific_type": "<contract_1.2 / contract_1.3 / contract_1.4 / contract_1.5 / contract_1.6 / contract_1.7 / contract_1.8 / contract_1.9 / contract_1.10 / contract_1.11 / contract_1.12 / contract_1.13 / none>",
          "qualification_reason": "<краткая причина или not_found>"
        }
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "розничная"
        - "поставка"
        - "недвижимость"
        - "мена"
        - "дарение"
        - "рента"
        - "уступка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "fallback_classification_valid"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Корректна ли fallback-квалификация"
        - name: "most_likely_specific_type"
          type: "string"
          allowed_values:
            ["contract_1.2", "contract_1.3", "contract_1.4", "contract_1.5",
             "contract_1.6", "contract_1.7", "contract_1.8", "contract_1.9",
             "contract_1.10", "contract_1.11", "contract_1.12", "contract_1.13", "none"]
          description: "Наиболее вероятный специальный тип"
      store_payload: true

  - id: transfer_and_title_risk_check
    name: "Переход права собственности и риск случайной гибели"
    description: >
      Проверяет, как урегулированы момент перехода права собственности
      и риск случайной гибели/повреждения товара.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право собственности переходит"
        - "риск случайной гибели"
        - "с момента передачи"
        - "с момента оплаты"
        - "после подписания акта"
        - "передача товара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+собственности.*переходит"
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"
        - "(?i)с\\s+момента\\s+передач"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор общей купли-продажи.
        Проверь правила перехода права собственности и риска случайной гибели.

        Ответь строго в JSON:
        {
          "ownership_transfer_moment": "<upon_delivery / upon_payment / upon_act / custom / not_found>",
          "risk_transfer_moment": "<upon_delivery / upon_payment / custom / not_found>",
          "retention_of_title": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "право собственности"
        - "риск случайной гибели"
        - "с момента передачи"
        - "до полной оплаты"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ownership_transfer_moment"
          type: "string"
          allowed_values: ["upon_delivery", "upon_payment", "upon_act", "custom", "not_found"]
          description: "Момент перехода права собственности"
        - name: "retention_of_title"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли оговорка об удержании титула"
      store_payload: true

  - id: quality_and_acceptance_check
    name: "Качество, комплектность и приемка товара"
    description: >
      Проверяет условия о качестве, комплектности, порядке приемки
      и сроках предъявления претензий.
    triggers:
      any: ["warranty_goods", "delivery_included"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество товара"
        - "комплектность"
        - "гарантийный срок"
        - "приемка товара"
        - "претензии"
        - "скрытые недостатки"
        - "сертификат качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)приемк[аи]\\s+товар"
        - "(?i)скрыт(ые|ых)\\s+недостатк"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор общей купли-продажи.
        Проверь блок качества и приемки.

        Ответь строго в JSON:
        {
          "quality_clause": "<detailed / general / not_found>",
          "completeness_clause": "<yes / no / not_found>",
          "warranty_period": "<есть срок / not_found>",
          "acceptance_procedure": "<described / not_found>",
          "claims_deadline": "<specified / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "качество"
        - "комплектность"
        - "гарантийный срок"
        - "приемка"
        - "претензии"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "quality_clause"
          type: "string"
          allowed_values: ["detailed", "general", "not_found"]
          description: "Степень проработки качества"
        - name: "acceptance_procedure"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описана ли приемка"
        - name: "claims_deadline"
          type: "string"
          allowed_values: ["specified", "not_found"]
          description: "Есть ли срок претензий"
      store_payload: true

  - id: encumbrance_and_third_party_rights_check
    name: "Права третьих лиц и отсутствие обременений"
    description: >
      Проверяет, дает ли продавец заверения об отсутствии прав третьих лиц,
      залога, ареста и иных обременений на товар.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "свободен от прав третьих лиц"
        - "не обременен"
        - "не заложен"
        - "не находится под арестом"
        - "отсутствие обременений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободен\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+обременен|не\\s+обременён"
        - "(?i)не\\s+заложен"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор общей купли-продажи.
        Проверь, раскрыты ли права третьих лиц и обременения.

        Ответь строго в JSON:
        {
          "encumbrance_warranty": "<yes / no / not_found>",
          "third_party_rights_disclosure": "<yes / no / not_found>",
          "arrest_or_pledge_status": "<clear / unclear / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 350
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "свободен от прав третьих лиц"
        - "не обременен"
        - "не заложен"
        - "не находится под арестом"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "encumbrance_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли гарантия отсутствия обременений"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора: продавец и покупатель"
    description: "Проверяет наличие и достаточность идентификации сторон"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

  - id: "subject_identification"
    name: "Предмет договора: наименование и определимость товара"
    description: "Проверяет наличие данных, позволяющих определить предмет купли-продажи"
    legal_base: "ст. 455 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "товар"
        - "имущество"
        - "наименование"
        - "спецификация"
        - "предмет договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+договор"
        - "(?i)наименовани(е|я)\\s+товар"

  - id: "quantity_required"
    name: "Количество товара"
    description: "Проверяет наличие количества или механизма его определения"
    legal_base: "ст. 465 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "количество"
        - "объем"
        - "единица измерения"
        - "шт"
        - "кг"
        - "л"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[\\d\\s,.]*\\s*(шт|штук|кг|тонн|л|литр|м|м2|м3|ед\\.)\\b"

  - id: "price_or_determinability"
    name: "Цена или определимость цены"
    description: "Проверяет, указана ли цена либо имеется механизм ее определения"
    legal_base: "ст. 424, 485 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "определяется"
        - "прайс-лист"
        - "согласно спецификации"
        - "рублей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"

  - id: "payment_terms"
    name: "Порядок оплаты"
    description: "Проверяет сроки и способ оплаты"
    legal_base: "ст. 486-489 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "предоплата"
        - "аванс"
        - "оплата"
        - "банковские реквизиты"
        - "рассрочка"
        - "отсрочка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предоплат|аванс|рассрочк|отсрочк"
        - "(?i)оплат(а|ы).*?(в\\s+течение|не\\s+позднее|после)"

  - id: "delivery_and_transfer"
    name: "Порядок передачи товара (ст. 458 ГК РФ)"
    description: "Проверяет условия доставки/самовывоза и передачи товара"
    legal_base: "ст. 458 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["delivery_included"]
    rules:
      keywords:
        - "доставка"
        - "самовывоз"
        - "отгрузка"
        - "передача товара"
        - "товарная накладная"
        - "акт приема-передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк|самовывоз|отгрузк"
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)товарн(ая|ой)\\s+накладн"

  - id: "quality_and_completeness"
    name: "Качество, комплектность, тара и упаковка"
    description: "Проверяет наличие базовых условий о качестве и комплектности"
    legal_base: "ст. 469-482 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "качество"
        - "комплектность"
        - "тара"
        - "упаковка"
        - "гарантийный срок"
        - "сертификат качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)качеств|комплектност|тар[ае]|упаковк|гарантийн"

  - id: "encumbrance_warranty_general"
    name: "Гарантия отсутствия прав третьих лиц"
    description: "Проверяет наличие заверений об отсутствии прав третьих лиц"
    legal_base: "ст. 460-462 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "свободен от прав третьих лиц"
        - "не обременен"
        - "не заложен"
        - "отсутствие обременений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободен\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+обременен|не\\s+обременён"

  - id: "acceptance_and_claims"
    name: "Приемка и сроки заявления претензий"
    description: "Проверяет порядок приемки и сроки претензионной работы"
    legal_base: "ст. 477, 483 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "приемка"
        - "претензии"
        - "в течение"
        - "скрытые недостатки"
        - "акт приемки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приемк|претензи"
        - "(?i)скрыт(ые|ых)\\s+недостатк"

  - id: "retention_of_title_general"
    name: "Сохранение права собственности за продавцом до оплаты"
    description: "Проверяет оговорку по ст. 491 ГК РФ"
    legal_base: "ст. 491 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["installment_or_deferred_payment"]
    rules:
      keywords:
        - "право собственности переходит после оплаты"
        - "сохраняется за продавцом до полной оплаты"
        - "до полной оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)до\\s+полной\\s+оплаты.*право\\s+собственности"
        - "(?i)сохраняется\\s+за\\s+продавцом"

  - id: "risk_transfer_clause"
    name: "Переход риска случайной гибели"
    description: "Проверяет распределение риска случайной гибели/повреждения"
    legal_base: "ст. 211, 459 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск повреждения"
        - "несет риск"
        - "с момента передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет наличие forum / court / претензионного порядка"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "арбитражный суд"
        - "подсудность"
        - "претензионный порядок"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)подсудност"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "accessories_and_documents_transfer"
    name: "Передача принадлежностей и документов на товар (ст. 456 ГК РФ)"
    description: "Продавец обязан передать покупателю принадлежности товара и документы (сертификаты, паспорта, инструкции). Отсутствие условия — частая причина споров о комплектности передачи."
    legal_base: "ст. 456 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "принадлежности"
        - "документы на товар"
        - "сертификат качества"
        - "паспорт изделия"
        - "инструкция по эксплуатации"
        - "техническая документация"
        - "руководство пользователя"
        - "гарантийный талон"
        - "комплект документов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлежност(и|ей)\\s+товар"
        - "(?i)документ(ы|ов).*?(товар|издели)"
        - "(?i)сертификат.*качеств"

  - id: "assortment_clause"
    name: "Ассортимент товаров и последствия нарушения (ст. 467-468 ГК РФ)"
    description: "При продаже товаров нескольких наименований/видов проверяет наличие согласованного ассортимента и последствий передачи товара в ненадлежащем ассортименте."
    legal_base: "ст. 467, 468 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ассортимент"
        - "номенклатура"
        - "виды товаров"
        - "наименования товаров"
        - "перечень товаров"
        - "спецификация"
        - "нарушение ассортимента"
        - "ненадлежащий ассортимент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ассортимент"
        - "(?i)номенклатур"
        - "(?i)спецификаци(я|и|ю)"

  - id: "termination_and_consequences"
    name: "Расторжение: основания и последствия (ст. 450, 453 ГК РФ)"
    description: "Проверяет наличие оснований расторжения, порядка возврата товара/денег, последствий существенного нарушения."
    legal_base: "ст. 450, 453, 463 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат товара"
        - "возврат денежных средств"
        - "существенное нарушение"
        - "односторонний отказ"
        - "неустойка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)существенн(ое|ого)\\s+нарушен"

  - id: "seller_refusal_consequences"
    name: "Последствия отказа продавца передать товар или документы (ст. 463-464 ГК РФ)"
    description: "При отказе или уклонении продавца от передачи товара покупатель вправе отказаться от договора. При непередаче документов — потребовать передачи или отказаться. Проверяет наличие условий о последствиях."
    legal_base: "ст. 463, 464 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "отказ от передачи"
        - "уклонение от передачи"
        - "непередача товара"
        - "просрочка передачи"
        - "утрата интереса"
        - "последствия непередачи"
        - "обязанность передать в срок"
        - "убытки от непередачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отказ(а|ался)?\\s+от\\s+передач"
        - "(?i)уклонени(е|я)\\s+от\\s+передач"
        - "(?i)просрочк(а|и)\\s+передач"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты продавца и покупателя,
      включая ИНН/ОГРН либо паспортные данные, адреса и полномочия подписантов.
    addressee: "Обе стороны"

  general_sale_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: точное наименование товара/имущества,
      количество, цену, способ передачи, комплект передаточных документов
      и иные идентифицирующие признаки предмета сделки.
    addressee: "Продавец"

  subject_identification:
    text: >
      Просим уточнить в {doc_names}: предмет договора, спецификацию, наименование
      товара/имущества и иные характеристики, позволяющие его однозначно определить.
    addressee: "Продавец / Юридический советник"

  quantity_required:
    text: >
      Просим уточнить в {doc_names}: количество товара и единицы измерения
      либо согласованный механизм определения количества.
    addressee: "Продавец / Юридический советник"

  price_or_determinability:
    text: >
      Просим уточнить в {doc_names}: цену товара либо механизм ее определения
      (прайс-лист, спецификация, формула, счет и т.п.).
    addressee: "Обе стороны"

  payment_terms:
    text: >
      Просим уточнить в {doc_names}: способ оплаты, сроки, предоплату/аванс,
      рассрочку/отсрочку, банковские реквизиты и последствия просрочки.
    addressee: "Обе стороны"

  delivery_and_transfer:
    text: >
      Просим согласовать по {doc_names}: способ передачи товара (доставка/самовывоз),
      место передачи, дату, комплект передаточных документов, форму акта/накладной.
    addressee: "Обе стороны"

  transfer_and_title_risk_check:
    text: >
      Просим уточнить в {doc_names}: момент перехода права собственности,
      момент перехода риска случайной гибели и наличие/отсутствие retention of title.
    addressee: "Юридический советник"

  quality_and_acceptance_check:
    text: >
      Просим уточнить в {doc_names}: требования к качеству, комплектности,
      гарантийному сроку, приемке товара и срокам предъявления претензий.
    addressee: "Обе стороны"

  quality_and_completeness:
    text: >
      Просим включить/уточнить в {doc_names}: качество товара, комплектность,
      тару/упаковку, гарантийные обязательства и подтверждающие документы о качестве.
    addressee: "Продавец / Юридический советник"

  encumbrance_and_third_party_rights_check:
    text: >
      Просим предоставить по {doc_names}: заверения продавца об отсутствии
      залога, ареста, прав третьих лиц и иных обременений на товар/имущество.
    addressee: "Продавец"

  encumbrance_warranty_general:
    text: >
      Просим включить в {doc_names} прямую гарантию отсутствия прав третьих лиц,
      залога, ареста и иных обременений на предмет сделки.
    addressee: "Юридический советник"

  acceptance_and_claims:
    text: >
      Просим уточнить в {doc_names}: порядок приемки, сроки осмотра,
      сроки заявления претензий по явным и скрытым недостаткам.
    addressee: "Обе стороны"

  retention_of_title_general:
    text: >
      Если в {doc_names} предусмотрена отсрочка/рассрочка, просим уточнить,
      сохраняется ли право собственности за продавцом до полной оплаты.
    addressee: "Юридический советник продавца"

  risk_transfer_clause:
    text: >
      Просим уточнить в {doc_names}: кто и с какого момента несет риск случайной
      гибели или повреждения предмета купли-продажи.
    addressee: "Юридический советник"

  qualification_fallback_check:
    text: >
      Просим подтвердить по {doc_names}, что договор не подпадает под признаки
      специального типа (розница, поставка, недвижимость, мена, дарение, рента,
      цессия и др.) и правомерно квалифицируется как общая купля-продажа.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок
      и общий порядок разрешения споров.
    addressee: "Юридический советник"

  specialized_type_misclassification_risk:
    text: >
      Внимание: {doc_names} содержит признаки специального договорного типа.
      Просим провести переквалификацию документа и подтвердить, должен ли он
      анализироваться как общий договор купли-продажи или как специальный вид.
    addressee: "Юридический советник"

  accessories_and_documents_transfer:
    text: >
      Просим уточнить в {doc_names}: перечень принадлежностей и документов,
      передаваемых с товаром (ст. 456 ГК РФ) — сертификаты качества, паспорта,
      инструкции, гарантийные талоны; последствия непередачи документов.
    addressee: "Продавец"

  assortment_clause:
    text: >
      Просим уточнить в {doc_names}: согласован ли ассортимент товаров
      (при продаже нескольких наименований), формат спецификации,
      последствия передачи в ненадлежащем ассортименте (ст. 468 ГК РФ).
    addressee: "Обе стороны"

  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: основания расторжения договора для каждой стороны,
      порядок возврата товара и денежных средств, неустойки, судьба товара
      при расторжении, существенные нарушения как основание для одностороннего отказа.
    addressee: "Юридический советник"

  seller_refusal_consequences:
    text: >
      Просим уточнить в {doc_names}: последствия отказа или просрочки продавца
      в передаче товара (ст. 463 ГК РФ) и документов (ст. 464 ГК РФ):
      право покупателя на отказ, порядок возврата предоплаты,
      размер убытков/неустойки, сроки для устранения нарушения.
    addressee: "Юридический советник покупателя"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"