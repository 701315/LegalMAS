        Проверяется только один вопрос: качество товара, комплектность, гарантия, приемка и претензии.

        Нормативный ориентир:
        - ст. 469-477 ГК РФ
        - ст. 478-480 ГК РФ
        - ст. 483 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли требования к качеству товара.
        2. Есть ли условие о комплектности.
        3. Есть ли гарантия / гарантийный срок.
        4. Есть ли порядок приемки.
        5. Есть ли порядок предъявления претензий.

