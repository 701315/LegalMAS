        - "не обременен"
        - "не заложен"
        - "свободен от прав"
      position_bias:
        preferred_range: [0.35, 1.0]
        boost: 0.18
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 580
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения об ответственности сторон, санкциях и расторжении.
        Анализируй строго только эту тему. Не анализируй качество, передачу, цену или иные темы.
        Не оценивай риски.
        </role>

        <context>
