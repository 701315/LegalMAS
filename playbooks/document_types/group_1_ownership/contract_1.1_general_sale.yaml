        2. buyer_details_value: Полное наименование и реквизиты (ИНН/ОГРН/Адрес) Покупателя.
        3. seller_details_status: "defined" если у Продавца прямо указаны идентификационные данные или реквизиты, иначе "not_defined".
        4. seller_details_value: Полное наименование и реквизиты Продавца.
        5. buyer_signatory: ФИО и должность того, кто подписывает от Покупателя.
        6. buyer_signatory_basis: Основание полномочий Покупателя (charter / poa / order / other / not_defined).
        7. seller_signatory: ФИО и должность того, кто подписывает от Продавца.
        8. seller_signatory_basis: Основание полномочий Продавца (charter / poa / order / other / not_defined).

        Если данных нет в тексте:
        - для status-поля используй "not_defined"
        - для текстового поля используй "Данные не определены"
        </task>

        <rules>
        - Используй только текст документа.
        - Не делай предположений.
        - Для buyer_signatory_basis и seller_signatory_basis используй только:
          - "charter" — если прямо указано "на основании устава"
          - "poa" — если прямо указано "по доверенности" или "на основании доверенности"
          - "order" — если прямо указано "на основании приказа"
          - "other" — если прямо указано иное основание полномочий
          - "not_defined" — если основание прямо не указано
        - Не смешивай сведения о Покупателе и Продавце.
        - Пиши коротко и официально.
        - Ответ верни строго в формате JSON.
        </rules>
      fields:
