        - name: "arrest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии ареста."
          required: false
        - name: "arrest_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Арест"
          description: "Заверение об отсутствии ареста на товар."
          required: false
        - name: "other_encumbrances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
