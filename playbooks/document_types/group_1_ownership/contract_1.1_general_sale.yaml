        3. Не оценивай договор.
        4. Если нужное условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет, возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

