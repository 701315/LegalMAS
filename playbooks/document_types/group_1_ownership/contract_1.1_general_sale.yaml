            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны действуют в соответствии с законодательством Российской Федерации."

        Ответ:
        {
          "termination_status": "not_defined",
          "termination_details": "Данные не определены",
          "goods_return_status": "not_defined",
          "goods_return_details": "Данные не определены",
          "money_return_status": "not_defined",
          "money_return_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о расторжении / отказе.
        2. Есть ли прямое условие о возврате товара.
        3. Есть ли прямое условие о возврате денег.
        4. Не выводи эти последствия из закона, если их нет в тексте.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_status": "<defined / not_defined>",
          "termination_details": "<текст или 'Данные не определены'>",
          "goods_return_status": "<defined / not_defined>",
          "goods_return_details": "<текст или 'Данные не определены'>",
          "money_return_status": "<defined / not_defined>",
          "money_return_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
