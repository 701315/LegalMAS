        preferred_range: [0.10, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только о порядке оплаты, модели расчётов, НДС и наличии прямых последствий просрочки оплаты.
        Не анализируй предмет, количество, качество, расторжение или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. payment_procedure_status — "defined" или "not_defined".
        2. payment_procedure_details — порядок и сроки оплаты.
        3. payment_model — prepayment / postpayment / installments / mixed / not_defined.
        4. vat_status — "defined" если в тексте прямо есть указание на НДС или его отсутствие, иначе "not_defined".
        5. late_payment_consequences_status — "defined" если в тексте прямо указаны последствия просрочки оплаты, иначе "not_defined".

        Если данные отсутствуют в тексте — используй:
        - статус: "not_defined"
        - текстовое поле: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Для payment_model используй только:
          - "prepayment" — если оплата прямо производится до передачи товара
          - "postpayment" — если оплата прямо производится после передачи товара, получения товара или подписания передаточного документа
          - "installments" — если оплата прямо разбита на части / график
          - "mixed" — если есть сочетание аванса и последующей доплаты
          - "not_defined" — если модель оплаты прямо не следует из текста
        - Не делай выводов, если нет прямого текста.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "payment_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка оплаты."
