        - name: "pledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога."
          required: false
        - name: "pledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Залог"
          description: "Заверение об отсутствии залога на товар."
