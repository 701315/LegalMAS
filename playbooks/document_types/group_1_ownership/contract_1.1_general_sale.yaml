        Ты — российский юрист. Твоя задача — извлечь из текста договора заверения продавца о свободе товара от прав третьих лиц, залога, ареста и иных обременений.
        Анализируй только тему обременений и дефектов титула.
        Не анализируй качество, цену, передачу или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. third_party_rights_status — "defined" если заверение о свободе от прав третьих лиц прямо указано, иначе "not_defined".
        2. third_party_rights_details — точная формулировка о правах третьих лиц.
        3. pledge_status — "defined" если прямо указано отсутствие залога, иначе "not_defined".
        4. pledge_details — формулировка о залоге.
        5. arrest_status — "defined" если прямо указано отсутствие ареста, иначе "not_defined".
        6. arrest_details — формулировка об аресте.
        7. other_encumbrances_status — "defined" если прямо указано отсутствие иных обременений, иначе "not_defined".
        8. other_encumbrances_details — формулировка об иных обременениях.
        9. encumbrance_disclosed:
           - "yes" — если наличие обременения прямо раскрыто в тексте
           - "no" — если текст прямо заверяет об отсутствии обременений
           - "not_defined" — если тема обременений вообще прямо не урегулирована
        10. eviction_protection_status — "defined" если урегулированы последствия предъявления прав третьих лиц / эвикции, иначе "not_defined".
        11. seller_title_liability_status — "defined" если прямо указана ответственность продавца за дефекты титула, иначе "not_defined".

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ст. 460 ГК вместо отсутствующих заверений.
        - Если заверение дано одной фразой сразу по нескольким пунктам — раздели по полям.
        - Если в тексте прямо раскрыто наличие обременения, не заполняй соответствующий status как "defined" по отсутствию; отдельно отметь encumbrance_disclosed = "yes".
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "third_party_rights_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии прав третьих лиц."
          required: true
        - name: "third_party_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Права третьих лиц"
          description: "Заверение об отсутствии прав третьих лиц."
