    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        о передаче товара, сроках, месте, способе передачи и сопутствующих документах.
        Анализируй только тему передачи товара.
        Не оценивай риски.
        Не подставляй выводы из закона или обычной практики.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. delivery_term_status:
           - "defined" — если в тексте прямо указан срок передачи товара
             (дата, период, срок в днях, момент передачи) или прямо указано,
             что срок определяется по спецификации, приложению, заявке, графику
             поставки или иному названному документу;
           - "not_defined" — если срок передачи прямо не указан или его нельзя
             надёжно определить.

        2. delivery_term_details:
           Краткое user-facing значение срока передачи на русском языке.
           Правила:
           - если срок прямо указан, верни его кратко, например:
             "До 15.07.2026", "В течение 10 рабочих дней с даты оплаты",
             "В день подписания договора";
           - если срок прямо определяется через другой документ, это не отсутствие
             регулирования; верни понятную формулировку, например:
             "Согласно Спецификации №1",
             "По заявкам Покупателя",
             "По Графику поставки";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. delivery_mode:
           Используй только одно из значений:
           - "delivery" — если из текста прямо следует, что товар доставляет
             продавец / поставщик к покупателю или по указанному адресу;
           - "pickup" — если прямо указан самовывоз;
           - "carrier" — если прямо указаны перевозчик, транспортная компания
             или передача товара первому перевозчику;
           - "not_defined" — если способ передачи прямо не указан, противоречив
             или его нельзя надёжно определить.
           Важно:
           - если сказано только, что способ передачи определяется заявкой,
             спецификацией или иным документом, но сам тип передачи не назван,
             используй "not_defined".

        4. delivery_mode_display:
           User-facing значение способа передачи на русском языке:
           - "Доставка продавцом" — для delivery;
           - "Самовывоз" — для pickup;
           - "Через перевозчика" — для carrier;
           - "Не установлен" — если способ передачи отсутствует в тексте;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
           Не используй в этом поле сырые enum-значения.

        5. delivery_place_status:
           - "defined" — если в тексте прямо указано место передачи
             или прямо сказано, что оно определяется по заявке, приложению,
             спецификации или иному названному документу;
           - "not_defined" — если место передачи прямо не указано или его нельзя
             надёжно определить.

        6. delivery_place_details:
           Краткое user-facing значение места передачи на русском языке.
           Правила:
           - если место прямо указано, верни его кратко, например:
             "Со склада Продавца", "По адресу Покупателя: г. Москва, ...";
           - если место определяется по другому документу, верни понятную формулировку,
             например:
             "По адресу, указанному в заявке",
             "Согласно Спецификации №1";
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. transfer_documents_status:
           - "defined" — если в тексте прямо названы передаточные документы
             или прямо сказано, что они определяются по спецификации, приложению
             или иному названному документу;
           - "not_defined" — если передаточные документы прямо не указаны
             или их нельзя надёжно определить.

        8. transfer_documents_details:
           Краткое user-facing описание передаточных документов на русском языке.
           Сюда относятся документы, оформляющие сам факт передачи товара, например:
           - товарная накладная,
           - УПД / универсальный передаточный документ,
           - акт приёма-передачи,
           - транспортная накладная, если она прямо названа как документ передачи.
           Правила:
           - не смешивай их с документами на товар;
           - если перечень определяется по другому документу, верни понятную формулировку,
             например: "Согласно Спецификации №1";
           - если в тексте есть только общая фраза "с документами" или
             "в установленном порядке" без конкретизации, не придумывай перечень;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. accessories_status:
           - "defined" — если в тексте прямо перечислены принадлежности к товару
             или прямо указано, что они определяются по комплекту поставки,
             спецификации, приложению или иному названному документу;
           - "not_defined" — если принадлежности прямо не указаны или их нельзя
             надёжно определить.

        10. accessories_details:
            Краткое user-facing описание принадлежностей на русском языке.
            Примеры:
            - "Кабель питания и крепёж",
            - "Комплект ключей",
            - "Согласно комплекту поставки",
            - "Согласно Спецификации №1".
            Если данных нет — "Не установлены".
            Если данные противоречивы или их нельзя надёжно определить —
            "Не удалось определить".

        11. product_documents_status:
            - "defined" — если в тексте прямо названы документы на товар
              или прямо указано, что они определяются по спецификации,
              приложению, комплекту поставки или иному названному документу;
            - "not_defined" — если документы на товар прямо не указаны
              или их нельзя надёжно определить.

        12. product_documents_details:
            Краткое user-facing описание документов на товар на русском языке.
            Сюда относятся, например:
            - паспорт изделия,
            - сертификат качества / соответствия,
            - инструкция,
            - руководство пользователя,
            - гарантийный талон,
            - техническая документация.
            Правила:
            - не смешивай документы на товар с передаточными документами;
            - если перечень определяется по другому документу, верни понятную формулировку,
              например: "Согласно Спецификации №1", "Согласно комплекту поставки";
            - если в тексте только общая формулировка "необходимые документы" без перечня,
              не придумывай конкретные документы;
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Если параметр прямо определяется через спецификацию, приложение, заявку,
          график поставки, комплект поставки или иной названный документ, это не всегда
          отсутствие регулирования — отрази это в user-facing поле.
        - Для delivery_mode используй "not_defined", если сам тип передачи
          (delivery / pickup / carrier) прямо не назван, даже если договор отсылает
          к заявке или иному документу.
        - Не смешивай:
          * передаточные документы — накладная, УПД, акт приёма-передачи и т.п.;
          * документы на товар — паспорт, сертификат, инструкция, гарантийный талон и т.п.
        - Общие фразы вроде "с документами", "в комплекте", "в установленном порядке"
          без конкретизации не дают оснований придумывать перечень.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту:
          * status/enum-поля → "not_defined";
          * text/display-поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда возвращай ключ
          с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 12 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для delivery_term_status, delivery_place_status, transfer_documents_status,
          accessories_status, product_documents_status используй только:
          "defined" или "not_defined".
        - Для delivery_mode используй только:
          "delivery", "pickup", "carrier", "not_defined".
        - Для text/display-полей при отсутствии данных используй только:
          delivery_term_details → "Не установлен"
          delivery_mode_display → "Не установлен"
          delivery_place_details → "Не установлено"
          transfer_documents_details → "Не установлены"
          accessories_details → "Не установлены"
          product_documents_details → "Не установлены"
        - Для text/display-полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "delivery_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока передачи. Внутреннее enum-поле."
          required: true

        - name: "delivery_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок передачи"
          description: >
            Срок передачи товара или user-facing указание на способ его определения
            по договору, например: "До 15.07.2026", "В течение 10 рабочих дней с даты оплаты",
            "По заявкам Покупателя", "Согласно Спецификации №1".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "delivery_mode"
          type: "string"
          presentation: "signal"
          allowed_values: ["delivery", "pickup", "carrier", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение способа передачи товара."
          required: false

        - name: "delivery_mode_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Способ передачи"
          description: >
            User-facing способ передачи товара.
            Примеры: "Доставка продавцом", "Самовывоз", "Через перевозчика".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "delivery_place_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения места передачи. Внутреннее enum-поле."
          required: false

        - name: "delivery_place_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Место передачи"
          description: >
            Место передачи товара или user-facing указание на способ его определения
            по договору, например: "Со склада Продавца", "По адресу, указанному в заявке",
            "Согласно Спецификации №1".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "transfer_documents_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания передаточных документов. Внутреннее enum-поле."
          required: false

        - name: "transfer_documents_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Передаточные документы"
          description: >
            Документы, оформляющие передачу товара, например: "Товарная накладная и акт приема-передачи",
            "УПД", "Согласно Спецификации №1".
            Не включает документы на товар.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "accessories_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания принадлежностей. Внутреннее enum-поле."
          required: false

        - name: "accessories_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Принадлежности"
          description: >
            Перечень принадлежностей к товару или user-facing указание на способ их определения
            по договору, например: "Комплект ключей", "Кабель питания и крепёж",
            "Согласно комплекту поставки", "Согласно Спецификации №1".
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "product_documents_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания документов на товар. Внутреннее enum-поле."
          required: false

        - name: "product_documents_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Документы на товар"
          description: >
            Перечень документов, передаваемых вместе с товаром, или user-facing указание
            на способ их определения по договору, например: "Инструкция и паспорт изделия",
            "Сертификат соответствия и гарантийный талон", "Согласно комплекту поставки",
            "Согласно Спецификации №1".
            Не включает передаточные документы.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Переход риска и права собственности
  # ──────────────────────────────────────────────────────────────────────────
  - id: title_risk_retention
    name: "Переход права собственности, риск случайной гибели и удержание титула"
    description: >
      Фактографическая проверка наличия в договоре момента перехода риска,
      момента перехода права собственности и оговорки об удержании титула.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право собственности"
        - "переход права"
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "с момента передачи"
        - "с момента оплаты"
        - "после полной оплаты"
        - "до полной оплаты"
        - "сохраняется за продавцом"
        - "несет риск"
        - "удержание права собственности"
        - "товарная накладная"
        - "УПД"
        - "акт приема-передачи"
        - "первому перевозчику"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+собственности.{0,50}переходит"
        - "(?i)переход\\s+права\\s+собственност[иьи]"
        - "(?i)риск\\s+случайн[а-я]+\\s+(?:гибел|поврежден)"
        - "(?i)до\\s+полной\\s+оплаты"
        - "(?i)сохраняется\\s+за\\s+продавцом"
        - "(?i)с\\s+момента\\s+(?:передач|оплат|подписани|получени)"
        - "(?i)перв(?:ому|ого)\\s+перевозчик"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: переход риска, переход права собственности и удержание титула.

        Нормативный ориентир:
        - ст. 223 ГК РФ
        - ст. 459 ГК РФ
        - ст. 491 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о моменте перехода риска случайной гибели / повреждения.
        2. Есть ли прямое условие о моменте перехода права собственности.
        3. Есть ли условие о сохранении права собственности за продавцом до оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай риски.
        4. Для status/enum-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлен" — если момент перехода не указан;
           - "Не установлено" — если наличие удержания титула не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Не путай переход риска с переходом права собственности.
        7. Не выводи удержание титула только из факта наличия оплаты, если в тексте нет прямой связи оплаты с переходом права собственности.
        8. Не используй "None", "null" или пустые строки.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Право собственности на товар переходит к Покупателю после полной оплаты.
        Риск случайной гибели переходит с момента передачи товара Покупателю."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_delivery",
          "risk_transfer_details": "С момента передачи товара Покупателю",
          "title_transfer_status": "defined",
          "title_transfer_moment": "upon_payment",
          "title_transfer_details": "После полной оплаты",
          "retention_of_title_status": "yes",
          "retention_of_title_display": "Удержание титула до полной оплаты",
          "title_risk_alignment": "different",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Право собственности на товар переходит к Покупателю после полной оплаты. Риск случайной гибели переходит с момента передачи товара Покупателю."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Право собственности на товар и риск случайной гибели переходят к Покупателю
        с момента подписания товарной накладной."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_act",
          "risk_transfer_details": "С момента подписания товарной накладной",
          "title_transfer_status": "defined",
          "title_transfer_moment": "upon_act",
          "title_transfer_details": "С момента подписания товарной накладной",
          "retention_of_title_status": "no",
          "retention_of_title_display": "Удержание титула отсутствует",
          "title_risk_alignment": "same",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Право собственности на товар и риск случайной гибели переходят к Покупателю с момента подписания товарной накладной."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец передаёт товар Покупателю."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Не установлен",
          "title_transfer_status": "not_defined",
          "title_transfer_moment": "not_defined",
          "title_transfer_details": "Не установлен",
          "retention_of_title_status": "not_defined",
          "retention_of_title_display": "Не установлено",
          "title_risk_alignment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о переходе права собственности.
        2. Найди прямую цитату о переходе риска.
        3. Если прямой цитаты нет — не выводи момент по закону, а возвращай "not_defined".
        4. Если есть условие "до полной оплаты" / "после полной оплаты", проверь,
           относится ли оно прямо к переходу права собственности или к сохранению права за продавцом.
        5. Если в разных фрагментах есть несовместимые формулировки и конфликт нельзя снять по тексту —
           верни "Не удалось определить", а для status/enum-полей используй "not_defined".
        6. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_delivery / upon_carrier / upon_payment / upon_act / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "title_transfer_status": "<defined / not_defined>",
          "title_transfer_moment": "<upon_delivery / upon_payment / upon_act / custom / not_defined>",
          "title_transfer_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "retention_of_title_status": "<yes / no / not_defined>",
          "retention_of_title_display": "<Удержание титула до полной оплаты / Удержание титула отсутствует / Не установлено / Не удалось определить>",
          "title_risk_alignment": "<same / different / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 720
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право собственности переход права собственности риск случайной гибели риск случайного повреждения с момента передачи с момента оплаты после полной оплаты до полной оплаты сохраняется за продавцом удержание права несет риск товарная накладная УПД акт приема-передачи первому перевозчику"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "неустойка"
        - "штраф"
        - "ответственность сторон"
        - "расторжение"
        - "претензия"
        - "качество"
        - "гарантия"
        - "залог"
        - "арест"
        - "свободен от прав"
      position_bias:
        preferred_range: [0.15, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        о моменте перехода риска случайной гибели, моменте перехода права собственности
        и наличии оговорки об удержании титула.
        Анализируй только эту тему.
        Не оценивай риски. Не анализируй последствия.
        Не подставляй диспозитивные нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. risk_transfer_status:
           - "defined" — если момент перехода риска прямо указан в тексте;
           - "not_defined" — если момент перехода риска прямо не указан
             или его нельзя надёжно определить.

        2. risk_transfer_moment:
           Используй только одно из значений:
           - "upon_delivery" — если риск прямо переходит с момента передачи / вручения товара покупателю;
           - "upon_carrier" — если риск прямо переходит с момента передачи первому перевозчику
             или транспортной компании;
           - "upon_payment" — если риск прямо переходит после оплаты / полной оплаты;
           - "upon_act" — если риск прямо переходит с момента подписания акта,
             товарной накладной, УПД или иного передаточного документа;
           - "custom" — если прямо указан иной конкретный момент, не попадающий
             в перечисленные категории;
           - "not_defined" — если момент прямо не указан, противоречив
             или его нельзя надёжно определить.

        3. risk_transfer_details:
           Краткое user-facing описание момента перехода риска на русском языке.
           Правила:
           - укажи только ключевую формулировку (1 короткая фраза), например:
             "С момента передачи товара Покупателю",
             "С момента передачи первому перевозчику",
             "После полной оплаты",
             "С момента подписания УПД";
           - не копируй весь абзац;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        4. title_transfer_status:
           - "defined" — если момент перехода права собственности прямо указан в тексте;
           - "not_defined" — если момент перехода права собственности прямо не указан
             или его нельзя надёжно определить.

        5. title_transfer_moment:
           Используй только одно из значений:
           - "upon_delivery" — если право собственности прямо переходит с момента передачи товара;
           - "upon_payment" — если право собственности прямо переходит после оплаты / полной оплаты;
           - "upon_act" — если право собственности прямо переходит с момента подписания акта,
             товарной накладной, УПД или иного передаточного документа;
           - "custom" — если прямо указан иной конкретный момент, не попадающий
             в перечисленные категории;
           - "not_defined" — если момент прямо не указан, противоречив
             или его нельзя надёжно определить.

        6. title_transfer_details:
           Краткое user-facing описание момента перехода права собственности на русском языке.
           Правила:
           - укажи только ключевую формулировку (1 короткая фраза), например:
             "С момента передачи товара Покупателю",
             "После полной оплаты",
             "С момента подписания товарной накладной";
           - не копируй весь абзац;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. retention_of_title_status:
           Используй только одно из значений:
           - "yes" — если из текста прямо следует, что право собственности
             сохраняется за продавцом до полной оплаты, или прямо сказано,
             что право собственности переходит только после полной оплаты;
           - "no" — только если из текста прямо следует, что право собственности
             переходит до оплаты или независимо от оплаты
             (например, при передаче товара или подписании накладной / акта),
             либо если прямо указано отсутствие удержания титула;
           - "not_defined" — если по тексту нельзя надёжно установить наличие
             или отсутствие удержания титула.
           Не выводи "yes" только из факта наличия условия об оплате.

        8. retention_of_title_display:
           User-facing значение на русском языке:
           - "Удержание титула до полной оплаты" — для retention_of_title_status = "yes";
           - "Удержание титула отсутствует" — для retention_of_title_status = "no";
           - "Не установлено" — если наличие или отсутствие удержания титула не определено;
           - "Не удалось определить" — если в тексте есть противоречие или неоднозначность.

        9. title_risk_alignment:
           Используй только одно из значений:
           - "same" — если risk_transfer_moment и title_transfer_moment оба определены
             и совпадают по событию и смыслу;
           - "different" — если оба момента определены и привязаны к разным событиям;
           - "not_defined" — если хотя бы один из моментов не определён
             или сравнение по тексту неоднозначно.
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если момент перехода не написан прямо — ставь "not_defined", не выводи его из контекста.
        - Не путай момент перехода права собственности с моментом перехода риска.
        - Для risk_transfer_moment:
          * "upon_delivery" — передача / вручение товара покупателю;
          * "upon_carrier" — передача первому перевозчику / транспортной компании;
          * "upon_act" — подписание акта, накладной, УПД или иного передаточного документа.
        - Для title_transfer_moment:
          * "upon_delivery" — переход с момента передачи товара;
          * "upon_act" — переход с момента подписания акта, накладной, УПД или иного передаточного документа.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          * status/enum-поля → "not_defined";
          * text/display-поля → "Не удалось определить".
        - Для retention_of_title_status:
          * "yes" — только при прямой связи оплаты с сохранением права собственности за продавцом;
          * "no" — только при прямом тексте об обратном или о переходе права до оплаты / независимо от оплаты;
          * "not_defined" — во всех иных случаях.
        - Если для alignment сопоставление моментов по тексту неоднозначно, используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда возвращай ключ
          с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 9 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для risk_transfer_status и title_transfer_status используй только:
          "defined" или "not_defined".
        - Для risk_transfer_moment используй только:
          "upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined".
        - Для title_transfer_moment используй только:
          "upon_delivery", "upon_payment", "upon_act", "custom", "not_defined".
        - Для retention_of_title_status используй только:
          "yes", "no", "not_defined".
        - Для title_risk_alignment используй только:
          "same", "different", "not_defined".
        - Для text/display-полей при отсутствии данных используй только:
          risk_transfer_details → "Не установлен"
          title_transfer_details → "Не установлен"
          retention_of_title_display → "Не установлено"
        - Для text/display-полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента перехода риска. Внутреннее enum-поле."
          required: true

        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение момента перехода риска случайной гибели."
          required: false

        - name: "risk_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Переход риска"
          description: >
            Краткая user-facing формулировка о моменте перехода риска случайной гибели,
            например: "С момента передачи товара Покупателю",
            "С момента передачи первому перевозчику", "После полной оплаты",
            "С момента подписания УПД".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "title_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента перехода права собственности. Внутреннее enum-поле."
          required: true

        - name: "title_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_delivery", "upon_payment", "upon_act", "custom", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение момента перехода права собственности."
          required: false

        - name: "title_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Переход права собственности"
          description: >
            Краткая user-facing формулировка о моменте перехода права собственности,
            например: "С момента передачи товара Покупателю", "После полной оплаты",
            "С момента подписания товарной накладной".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "retention_of_title_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение наличия оговорки об удержании титула до оплаты."
          required: false

        - name: "retention_of_title_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Удержание титула"
          description: >
            User-facing указание на наличие или отсутствие удержания титула.
            Допустимые значения: "Удержание титула до полной оплаты",
            "Удержание титула отсутствует".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "title_risk_alignment"
          type: "string"
          presentation: "signal"
          allowed_values: ["same", "different", "not_defined"]
          display_in_grid: false
          description: "Внутренний флаг совпадения моментов перехода риска и права собственности."
          required: false

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Качество, комплектность, гарантия
  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_completeness_warranty
    name: "Качество товара, комплектность и гарантия"
    description: >
      Фактографическая проверка наличия условий о качестве товара, комплектности,
      гарантии и гарантийном сроке.
    triggers:
      any: ["warranty_goods", "general_sale_subject", "delivery_included"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество"
        - "комплектность"
        - "гарантийный срок"
        - "гарантия качества"
        - "гарантия производителя"
        - "сертификат качества"
        - "паспорт изделия"
        - "тара"
        - "упаковка"
        - "ассортимент"
        - "ГОСТ"
        - "ТУ"
        - "стандарт"
        - "спецификация"
        - "приложение"
        - "комплект поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн[а-я]+\\s+срок"
        - "(?i)комплектност[ьи]"
        - "(?i)ненадлежащ[а-я]+\\s+качеств"
        - "(?i)сертификат\\s+качеств"
        - "(?i)ГОСТ|ТУ|стандарт"
        - "(?i)спецификаци[еяю]|приложени[ея]|комплект\\s+поставк"
        - "(?i)гарант[а-я]+\\s+производител"
        - "(?i)\\d+\\s+(?:месяц|месяцев|дней|лет)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: качество товара, комплектность и гарантия.

        Нормативный ориентир:
        - ст. 469-477 ГК РФ
        - ст. 478-480 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли требования к качеству товара.
        2. Есть ли условие о комплектности.
        3. Есть ли гарантия / гарантийный срок.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Для status-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлено" — если требований к качеству нет;
           - "Не установлена" — если комплектность или гарантия не указаны;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Если параметр прямо определяется по ГОСТ, ТУ, спецификации, приложению,
           комплекту поставки, паспорту изделия или иному названному документу,
           это не всегда отсутствие регулирования — отрази это в user-facing поле.
        7. Если в договоре прямо сказано, что гарантия не предоставляется
           или гарантийный срок не устанавливается, это не "not_defined":
           верни warranty_status = "defined" и user-facing значение о том,
           что гарантия не предусмотрена.
        8. Не смешивай требования к качеству с перечнем документов на товар.
           Само по себе упоминание сертификата качества или паспорта изделия
           не всегда означает самостоятельное условие о качестве.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Товар должен соответствовать ГОСТ 12345-2020. Гарантийный срок составляет
        12 месяцев с даты передачи товара."

        Ответ:
        {
          "quality_status": "defined",
          "quality_details": "Соответствие ГОСТ 12345-2020",
          "completeness_status": "not_defined",
          "completeness_details": "Не установлена",
          "warranty_status": "defined",
          "warranty_details": "12 месяцев с даты передачи товара",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Товар должен соответствовать ГОСТ 12345-2020. Гарантийный срок составляет 12 месяцев с даты передачи товара."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Комплектность товара определяется в Спецификации №1. Гарантия производителя
        указывается в паспорте изделия."

        Ответ:
        {
          "quality_status": "not_defined",
          "quality_details": "Не установлено",
          "completeness_status": "defined",
          "completeness_details": "Согласно Спецификации №1",
          "warranty_status": "defined",
          "warranty_details": "Гарантия по паспорту изделия",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Комплектность товара определяется в Спецификации №1. Гарантия производителя указывается в паспорте изделия."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец гарантию не предоставляет."

        Ответ:
        {
          "quality_status": "not_defined",
          "quality_details": "Не установлено",
          "completeness_status": "not_defined",
          "completeness_details": "Не установлена",
          "warranty_status": "defined",
          "warranty_details": "Гарантия не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Продавец гарантию не предоставляет."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны согласуют характеристики товара дополнительно."

        Ответ:
        {
          "quality_status": "not_defined",
          "quality_details": "Не установлено",
          "completeness_status": "not_defined",
          "completeness_details": "Не установлена",
          "warranty_status": "not_defined",
          "warranty_details": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую формулировку о качестве.
        2. Найди прямую формулировку о комплектности.
        3. Найди прямую формулировку о гарантии.
        4. Если параметр определяется по спецификации, ГОСТ, ТУ, комплекту поставки
           или иному названному документу — отрази это как user-facing значение.
        5. Если простое упоминание сертификата или паспорта относится только к документам
           на товар, не превращай его автоматически в условие о качестве.
        6. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а для status-полей используй "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quality_status": "<defined / not_defined>",
          "quality_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "completeness_status": "<defined / not_defined>",
          "completeness_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<текст или 'Не установлена' / 'Гарантия не предусмотрена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "качество товара комплектность гарантийный срок гарантия качества гарантия производителя ГОСТ ТУ стандарт сертификат качества упаковка тара ассортимент спецификация приложение комплект поставки паспорт изделия"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "приемка"
        - "претензия"
        - "претензионный срок"
        - "расторжение"
        - "неустойка"
        - "право собственности"
        - "риск случайной гибели"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о качестве товара, комплектности и гарантии.
        Не анализируй приёмку, претензии, цену, передачу, документы на товар
        и иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. quality_status:
           - "defined" — если в тексте прямо указаны требования к качеству товара
             или прямо сказано, что качество определяется по ГОСТ, ТУ, стандарту,
             спецификации, приложению или иному названному документу;
           - "not_defined" — если требования к качеству прямо не указаны
             или их нельзя надёжно определить.

        2. quality_details:
           Краткое user-facing описание требований к качеству на русском языке.
           Правила:
           - если требования к качеству прямо указаны, верни их кратко, например:
             "Соответствие ГОСТ 12345-2020",
             "Соответствие ТУ 456-78",
             "Товар должен быть новым, не бывшим в употреблении";
           - если качество прямо определяется по другому документу, это не отсутствие
             регулирования; верни понятную формулировку, например:
             "Согласно Спецификации №1",
             "Согласно ТУ 456-78";
           - не копируй длинный абзац, пиши одной короткой фразой;
           - если в тексте упомянуты только сертификат качества, паспорт изделия,
             инструкция или иные документы на товар без самостоятельного условия
             о качестве, не считай это автоматически defined;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. completeness_status:
           - "defined" — если в тексте прямо указана комплектность товара
             или прямо сказано, что комплектность определяется по спецификации,
             приложению, комплекту поставки или иному названному документу;
           - "not_defined" — если комплектность прямо не указана
             или её нельзя надёжно определить.

        4. completeness_details:
           Краткое user-facing описание комплектности на русском языке.
           Правила:
           - если комплектность прямо указана, верни её кратко, например:
             "Станок, пульт управления и комплект ключей",
             "Товар передаётся в комплекте с кабелем питания";
           - если комплектность определяется по другому документу, верни понятную
             формулировку, например:
             "Согласно Спецификации №1",
             "Согласно комплекту поставки";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. warranty_status:
           - "defined" — если в тексте прямо указаны гарантия, гарантийный срок,
             гарантия производителя, отсутствие гарантии либо если гарантия
             прямо определяется по паспорту изделия, спецификации, приложению
             или иному названному документу;
           - "not_defined" — если гарантия прямо не урегулирована
             или её нельзя надёжно определить.

        6. warranty_details:
           Краткое user-facing описание гарантии на русском языке.
           Правила:
           - если прямо указан гарантийный срок, верни его кратко, например:
             "12 месяцев с даты передачи товара",
             "24 месяца с даты ввода в эксплуатацию";
           - если прямо сказано, что гарантия предоставляется, но срок не назван,
             верни: "Гарантия предусмотрена, срок не установлен";
           - если прямо сказано, что гарантия не предоставляется
             или гарантийный срок не устанавливается, верни:
             "Гарантия не предусмотрена";
           - если указано, что действует гарантия производителя
             или гарантия определяется по паспорту / документации, верни понятную
             формулировку, например:
             "Гарантия производителя",
             "Гарантия по паспорту изделия",
             "Согласно Спецификации №1";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай качество, комплектность и гарантию с приёмкой, претензиями,
          ценой, передачей и иными нерелевантными темами.
        - Если параметр прямо определяется по ГОСТ, ТУ, спецификации, приложению,
          комплекту поставки, паспорту изделия или иному названному документу,
          считай такой параметр определённым и отрази это в user-facing поле.
        - Простое упоминание сертификата качества, паспорта изделия, инструкции
          или иных документов на товар не означает само по себе наличие
          самостоятельного условия о качестве.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          quality_details → "Не установлено"
          completeness_details → "Не установлена"
          warranty_details → "Не установлена"
        - Для warranty_details при прямом отсутствии гарантии используй:
          "Гарантия не предусмотрена"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "quality_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения требований к качеству. Внутреннее enum-поле."
          required: true

        - name: "quality_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Качество"
          description: >
            Краткое user-facing описание требований к качеству товара, например:
            "Соответствие ГОСТ 12345-2020", "Соответствие ТУ 456-78",
            "Согласно Спецификации №1".
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "completeness_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения комплектности. Внутреннее enum-поле."
          required: true

        - name: "completeness_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Комплектность"
          description: >
            Краткое user-facing описание комплектности товара, например:
            "Станок, пульт управления и комплект ключей",
            "Согласно комплекту поставки", "Согласно Спецификации №1".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения гарантии. Внутреннее enum-поле."
          required: true

        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Гарантия"
          description: >
            Краткое user-facing описание гарантии и гарантийного срока, например:
            "12 месяцев с даты передачи товара", "Гарантия производителя",
            "Гарантия по паспорту изделия", "Гарантия предусмотрена, срок не установлен",
            "Гарантия не предусмотрена".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Приемка и претензии
  # ──────────────────────────────────────────────────────────────────────────
  - id: acceptance_and_claims
    name: "Приёмка товара и претензии по качеству"
    description: >
      Фактографическая проверка наличия условий о порядке приёмки товара
      и порядке предъявления претензий по качеству.
    triggers:
      any: ["warranty_goods", "general_sale_subject", "delivery_included"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приемка"
        - "приемка товара"
        - "акт приемки"
        - "претензии"
        - "недостатки"
        - "скрытые недостатки"
        - "явные недостатки"
        - "претензионный срок"
        - "уведомление"
        - "направить претензию"
        - "инструкция П-6"
        - "инструкция П-7"
        - "приложение"
        - "регламент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приемк[аи]\\s+товар"
        - "(?i)скрыт[а-я]+\\s+недостатк"
        - "(?i)явн[а-я]+\\s+недостатк"
        - "(?i)претензи[ияй]\\s+по\\s+качеств"
        - "(?i)в\\s+течение\\s+\\d+\\s+(?:дн|рабоч|календар)"
        - "(?i)инструкци[яи]\\s+[ПпPp]-?[67]"
        - "(?i)приложени[ея]\\s+№"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества.
        Проверяется только один вопрос: приёмка товара и претензии по качеству.

        Нормативный ориентир:
        - ст. 483 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок приёмки товара.
        2. Есть ли порядок предъявления претензий по качеству.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей используй:
           - "Не установлен" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Если параметр определяется по названному внешнему документу
           (приложению, инструкции, регламенту, нормативному документу) —
           это не отсутствие регулирования; отрази это в user-facing поле.
        6. Общая фраза вроде "Стороны руководствуются законодательством РФ"
           или "в порядке, предусмотренном ГК РФ" без конкретизации
           не является достаточным основанием для "defined".
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель обязан проверить товар в течение 3 рабочих дней с даты передачи
        и направить письменную претензию по качеству в течение 5 рабочих дней
        со дня выявления недостатков."

        Ответ:
        {
          "acceptance_status": "defined",
          "acceptance_details": "Проверка в течение 3 рабочих дней с даты передачи",
          "claims_procedure_status": "defined",
          "claims_procedure_details": "Письменная претензия в течение 5 рабочих дней со дня выявления недостатков",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Покупатель обязан проверить товар в течение 3 рабочих дней с даты передачи и направить письменную претензию по качеству в течение 5 рабочих дней со дня выявления недостатков."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Приёмка осуществляется по Инструкции П-6 и П-7.
        Претензии направляются согласно Приложению №3 к договору."

        Ответ:
        {
          "acceptance_status": "defined",
          "acceptance_details": "Согласно Инструкции П-6 и П-7",
          "claims_procedure_status": "defined",
          "claims_procedure_details": "Согласно Приложению №3",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Приёмка осуществляется по Инструкции П-6 и П-7. Претензии направляются согласно Приложению №3 к договору."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Покупатель принимает товар по количеству в течение 1 рабочего дня
        с момента доставки. Приёмка по качеству — в течение 5 рабочих дней."

        Ответ:
        {
          "acceptance_status": "defined",
          "acceptance_details": "По количеству — в течение 1 рабочего дня с момента доставки; по качеству — в течение 5 рабочих дней",
          "claims_procedure_status": "not_defined",
          "claims_procedure_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Покупатель принимает товар по количеству в течение 1 рабочего дня с момента доставки. Приёмка по качеству — в течение 5 рабочих дней."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны руководствуются действующим законодательством РФ."

        Ответ:
        {
          "acceptance_status": "not_defined",
          "acceptance_details": "Не установлен",
          "claims_procedure_status": "not_defined",
          "claims_procedure_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую формулировку о приёмке.
        2. Найди прямую формулировку о претензиях.
        3. Если параметр определяется по названному внешнему документу —
           отрази это как user-facing значение, а не как пустоту.
        4. Если сказано только "в соответствии с законодательством" или
           "в порядке, предусмотренном ГК РФ" — это не defined.
        5. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "acceptance_status": "<defined / not_defined>",
          "acceptance_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "claims_procedure_status": "<defined / not_defined>",
          "claims_procedure_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 580
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "приемка товара приемка по качеству приемка по количеству явные недостатки скрытые недостатки претензии по качеству претензионный срок уведомление направить претензию инструкция П-6 П-7 приложение регламент"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - obligations
      negative_keywords:
        - "цена"
        - "оплата"
        - "право собственности"
        - "риск случайной гибели"
        - "расторжение"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о порядке приёмки товара и порядке предъявления претензий по качеству.
        Не анализируй качество товара, гарантию, цену, передачу и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. acceptance_status:
           - "defined" — если в тексте прямо указан порядок приёмки товара
             (по количеству, по качеству или по обоим критериям), либо прямо
             сказано, что приёмка осуществляется по названному внешнему документу
             (инструкции, регламенту, приложению и т.п.);
           - "not_defined" — если порядок приёмки прямо не указан или его нельзя
             надёжно определить.
           Важно: общая ссылка на законодательство без конкретизации порядка
           не является основанием для "defined".

        2. acceptance_details:
           Краткое user-facing описание порядка приёмки на русском языке.
           Правила:
           - если приёмка прямо описана, верни краткое summary (1–2 коротких фразы),
             например:
             "Проверка в течение 3 рабочих дней с даты передачи",
             "По количеству — в течение 1 рабочего дня; по качеству — в течение 5 рабочих дней";
           - если и приёмка по количеству, и приёмка по качеству прямо урегулированы,
             дай краткое summary обоих через точку с запятой;
           - если приёмка прямо определяется по названному внешнему документу,
             это не отсутствие регулирования; верни понятную формулировку, например:
             "Согласно Инструкции П-6 и П-7",
             "Согласно Приложению №3";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. claims_procedure_status:
           - "defined" — если в тексте прямо указан порядок предъявления претензий
             по качеству (форма, срок, адресат) либо прямо сказано, что порядок
             определяется по названному внешнему документу;
           - "not_defined" — если порядок претензий прямо не указан или его нельзя
             надёжно определить.
           Важно: общая ссылка на законодательство или ГК РФ без конкретизации
           порядка не является основанием для "defined".

        4. claims_procedure_details:
           Краткое user-facing описание порядка претензий на русском языке.
           Правила:
           - если порядок прямо описан, верни краткое summary (1–2 коротких фразы),
             например:
             "Письменная претензия в течение 5 рабочих дней со дня выявления недостатков",
             "Уведомление в течение 10 дней; ответ в течение 14 дней";
           - если порядок прямо определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №3",
             "Согласно Регламенту претензионной работы";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай приёмку и претензии с гарантийными условиями, ценой, передачей
          и иными нерелевантными темами.
        - Если параметр прямо определяется по названному внешнему документу
          (приложению, инструкции, регламенту), считай его определённым и отрази
          это в user-facing поле.
        - Общие фразы вроде "в соответствии с законодательством РФ",
          "в порядке, предусмотренном ГК РФ" без конкретизации порядка —
          это not_defined, а не defined.
        - Если в разных фрагментах указаны разные сроки / порядки и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          acceptance_details → "Не установлен"
          claims_procedure_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "acceptance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка приёмки. Внутреннее enum-поле."
          required: true

        - name: "acceptance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Приёмка"
          description: >
            Краткое user-facing описание порядка приёмки товара, например:
            "Проверка в течение 3 рабочих дней с даты передачи",
            "По количеству — в течение 1 рабочего дня; по качеству — в течение 5 рабочих дней",
            "Согласно Инструкции П-6 и П-7", "Согласно Приложению №3".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "claims_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка претензий. Внутреннее enum-поле."
          required: true

        - name: "claims_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Претензии по качеству"
          description: >
            Краткое user-facing описание порядка и сроков предъявления претензий
            по качеству, например:
            "Письменная претензия в течение 5 рабочих дней со дня выявления недостатков",
            "Уведомление в течение 10 дней; ответ в течение 14 дней",
            "Согласно Приложению №3", "Согласно Регламенту претензионной работы".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Права третьих лиц и обременения
  # ──────────────────────────────────────────────────────────────────────────
  - id: encumbrance_third_party_rights
    name: "Права третьих лиц, залог, арест и иные обременения на товар"
    description: >
      Фактографическая проверка наличия в договоре заверений продавца о свободе
      товара от прав третьих лиц, залога, ареста и других обременений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "свободен от прав третьих лиц"
        - "не обременен"
        - "не обременён"
        - "не заложен"
        - "не находится под арестом"
        - "отсутствие обременений"
        - "права третьих лиц"
        - "залог"
        - "арест"
        - "ипотека"
        - "обременение"
        - "претензии третьих лиц"
        - "эвикция"
        - "изъятие товара"
        - "заверения и гарантии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободен\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+обременен|не\\s+обременён"
        - "(?i)не\\s+заложен"
        - "(?i)не\\s+находится\\s+под\\s+арестом"
        - "(?i)прав[а]?\\s+третьих\\s+лиц\\s+(?:нет|отсутствуют|не\\s+имеется)"
        - "(?i)изъят[аи]е?\\s+товар[аоу]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: свобода товара от прав третьих лиц, залога, ареста и иных обременений.

        Нормативный ориентир:
        - ст. 460 ГК РФ
        - ст. 461 ГК РФ
        - ст. 462 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое заверение о том, что товар свободен от прав третьих лиц.
        2. Есть ли прямое указание, что товар не находится в залоге.
        3. Есть ли прямое указание, что товар не находится под арестом.
        4. Есть ли прямое указание об отсутствии иных обременений.
        5. Есть ли прямое условие о последствиях предъявления прав третьих лиц / эвикции.
        6. Есть ли прямое условие об ответственности продавца за дефекты титула.
        7. Раскрыто ли наличие какого-либо обременения прямо в тексте договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не выводи отсутствие обременений из ст. 460 ГК РФ — это диспозитивная норма,
           а не условие договора.
        4. Не оценивай договор.
        5. Для status/enum-полей, если условие не указано прямо — возвращай "not_defined".
        6. Для текстовых/display-полей используй:
           encumbrance_warranty_display → "Заверения не предусмотрены"
           если заверения отсутствуют.
        7. Если в тексте прямо раскрыто наличие обременения — не трактуй это как
           заверение об отсутствии; отдельно отмечай encumbrance_disclosed = "yes".
        8. Не используй "None", "null" или пустые строки.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец гарантирует, что товар свободен от прав третьих лиц,
        не находится в залоге и под арестом."

        Ответ:
        {
          "third_party_rights_status": "defined",
          "third_party_rights_details": "Товар свободен от прав третьих лиц",
          "pledge_status": "defined",
          "pledge_details": "Не находится в залоге",
          "arrest_status": "defined",
          "arrest_details": "Не находится под арестом",
          "other_encumbrances_status": "not_defined",
          "other_encumbrances_details": "Не установлено",
          "encumbrance_disclosed": "no",
          "encumbrance_warranty_display": "Товар свободен от прав третьих лиц, залога и ареста",
          "eviction_protection_status": "not_defined",
          "eviction_protection_display": "Не установлено",
          "seller_title_liability_status": "not_defined",
          "seller_title_liability_display": "Не установлена",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Продавец гарантирует, что товар свободен от прав третьих лиц, не находится в залоге и под арестом."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец гарантирует, что товар свободен от любых прав третьих лиц,
        обременений, залога, ареста и иных ограничений. В случае предъявления
        претензий третьими лицами Продавец обязуется урегулировать их
        за свой счёт. За дефекты титула Продавец несёт полную ответственность."

        Ответ:
        {
          "third_party_rights_status": "defined",
          "third_party_rights_details": "Товар свободен от любых прав третьих лиц",
          "pledge_status": "defined",
          "pledge_details": "Товар свободен от залога",
          "arrest_status": "defined",
          "arrest_details": "Товар свободен от ареста",
          "other_encumbrances_status": "defined",
          "other_encumbrances_details": "Товар свободен от иных обременений и ограничений",
          "encumbrance_disclosed": "no",
          "encumbrance_warranty_display": "Товар свободен от прав третьих лиц, залога, ареста и иных обременений",
          "eviction_protection_status": "defined",
          "eviction_protection_display": "Продавец урегулирует претензии третьих лиц за свой счёт",
          "seller_title_liability_status": "defined",
          "seller_title_liability_display": "Полная ответственность продавца за дефекты титула",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Продавец гарантирует, что товар свободен от любых прав третьих лиц, обременений, залога, ареста и иных ограничений. В случае предъявления претензий третьими лицами Продавец обязуется урегулировать их за свой счёт. За дефекты титула Продавец несёт полную ответственность."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец продаёт товар Покупателю на условиях настоящего договора."

        Ответ:
        {
          "third_party_rights_status": "not_defined",
          "third_party_rights_details": "Не установлено",
          "pledge_status": "not_defined",
          "pledge_details": "Не установлено",
          "arrest_status": "not_defined",
          "arrest_details": "Не установлено",
          "other_encumbrances_status": "not_defined",
          "other_encumbrances_details": "Не установлено",
          "encumbrance_disclosed": "not_defined",
          "encumbrance_warranty_display": "Заверения не предусмотрены",
          "eviction_protection_status": "not_defined",
          "eviction_protection_display": "Не установлено",
          "seller_title_liability_status": "not_defined",
          "seller_title_liability_display": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые формулировки об отсутствии прав третьих лиц.
        2. Отдельно проверь залог и арест.
        3. Если в тексте есть обременение, не трактуй это как заверение об отсутствии;
           отдельно отметь encumbrance_disclosed = "yes".
        4. Не выводи отсутствие обременений из ст. 460 ГК — это диспозитивная норма,
           а не условие договора.
        5. Если заверение дано одной сводной фразой — разложи на внутренние поля
           и сформируй сводный encumbrance_warranty_display.
        6. Если в разных фрагментах данные несовместимы и конфликт нельзя снять —
           верни "Не удалось определить" и "not_defined" в status-полях.
        7. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "third_party_rights_status": "<defined / not_defined>",
          "third_party_rights_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "pledge_status": "<defined / not_defined>",
          "pledge_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "arrest_status": "<defined / not_defined>",
          "arrest_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "other_encumbrances_status": "<defined / not_defined>",
          "other_encumbrances_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "encumbrance_disclosed": "<yes / no / not_defined>",
          "encumbrance_warranty_display": "<сводный текст или 'Заверения не предусмотрены' / 'Не удалось определить'>",
          "eviction_protection_status": "<defined / not_defined>",
          "eviction_protection_display": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "seller_title_liability_status": "<defined / not_defined>",
          "seller_title_liability_display": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "свободен от прав третьих лиц не обременен не заложен не находится под арестом обременение залог арест ипотека права третьих лиц отсутствие обременений эвикция изъятие товара заверения продавца дефект титула ответственность продавца"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "качество товара"
        - "гарантийный срок"
        - "комплектность"
        - "недостатки товара"
        - "скрытые недостатки"
        - "приемка"
        - "претензия по качеству"
        - "сертификат качества"
        - "означает"
        - "в целях настоящего"
        - "неустойка"
        - "расторжение"
        - "риск случайной гибели"
        - "право собственности переходит"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.10
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 520
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора заверения
        продавца о свободе товара от прав третьих лиц, залога, ареста и иных обременений,
        а также сведения об урегулировании эвикции и ответственности за дефекты титула.
        Анализируй только тему обременений и дефектов титула.
        Не анализируй качество, цену, передачу и иные темы.
        Не оценивай риски.
        Не подставляй нормы ст. 460 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. third_party_rights_status:
           - "defined" — если в тексте прямо указано, что товар свободен от прав
             третьих лиц, или прямо указано об их наличии;
           - "not_defined" — если тема прав третьих лиц прямо не урегулирована.

        2. third_party_rights_details:
           Краткая формулировка о правах третьих лиц на русском языке, например:
           "Товар свободен от прав третьих лиц",
           "Права третьих лиц не урегулированы".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. pledge_status:
           - "defined" — если в тексте прямо указано отсутствие или наличие залога;
           - "not_defined" — если тема залога прямо не урегулирована.

        4. pledge_details:
           Краткая формулировка о залоге на русском языке, например:
           "Не находится в залоге", "Передаётся с обременением — залог".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. arrest_status:
           - "defined" — если в тексте прямо указано отсутствие или наличие ареста;
           - "not_defined" — если тема ареста прямо не урегулирована.

        6. arrest_details:
           Краткая формулировка об аресте на русском языке, например:
           "Не находится под арестом".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        7. other_encumbrances_status:
           - "defined" — если в тексте прямо указано отсутствие или наличие иных
             обременений (помимо залога и ареста);
           - "not_defined" — если иные обременения прямо не урегулированы.

        8. other_encumbrances_details:
           Краткая формулировка об иных обременениях на русском языке, например:
           "Иных обременений нет", "Товар свободен от любых ограничений".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        9. encumbrance_disclosed:
           - "yes" — если в тексте прямо раскрыто наличие какого-либо обременения
             (залог, арест, иное ограничение передаётся вместе с товаром);
           - "no" — если текст прямо заверяет об отсутствии обременений
             и не раскрывает ни одного;
           - "not_defined" — если тема обременений вообще не упомянута.

        10. encumbrance_warranty_display:
            Сводное user-facing значение на русском языке, отражающее общую картину
            заверений об обременениях.
            Правила:
            - если заверения охватывают права третьих лиц + залог + арест +
              иные обременения:
              "Товар свободен от прав третьих лиц, залога, ареста и иных обременений";
            - если заверения частичные, укажи, что именно покрыто, например:
              "Товар свободен от залога и ареста (права третьих лиц не упомянуты)";
            - если наличие обременения раскрыто в тексте:
              "Наличие обременения раскрыто в договоре" + краткое уточнение, если возможно;
            - если заверений нет и наличие обременений не раскрыто:
              "Заверения не предусмотрены";
            - если данные противоречивы или их нельзя надёжно определить:
              "Не удалось определить".

        11. eviction_protection_status:
            - "defined" — если в тексте прямо урегулированы последствия предъявления
              прав третьих лиц на товар или прямо указано, как действует продавец
              при эвикции;
            - "not_defined" — если этот вопрос прямо не урегулирован.

        12. eviction_protection_display:
            Краткое user-facing описание защиты от эвикции на русском языке, например:
            "Продавец урегулирует претензии третьих лиц за свой счёт",
            "Продавец обязуется возместить убытки при изъятии товара".
            Если данных нет — "Не установлено".
            Если данные противоречивы — "Не удалось определить".

        13. seller_title_liability_status:
            - "defined" — если в тексте прямо указана ответственность продавца
              за дефекты титула;
            - "not_defined" — если этот вопрос прямо не урегулирован.

        14. seller_title_liability_display:
            Краткое user-facing описание ответственности продавца за дефекты титула
            на русском языке, например:
            "Полная ответственность продавца за дефекты титула",
            "Продавец возмещает убытки при предъявлении прав третьих лиц".
            Если данных нет — "Не установлена".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ст. 460 ГК РФ или иные диспозитивные нормы вместо
          текста договора. Отсутствие заверения в тексте — это not_defined,
          а не автоматически "свободен от обременений".
        - Если заверение дано одной сводной фразой, охватывающей несколько видов
          обременений — разложи на внутренние поля и сформируй сводный
          encumbrance_warranty_display.
        - Если в тексте прямо раскрыто наличие обременения, не заполняй
          соответствующий status как "defined" по отсутствию; используй
          encumbrance_disclosed = "yes".
        - Если в разных фрагментах есть несовместимые данные и конфликт
          нельзя разрешить по тексту:
          * status/enum-поля → "not_defined";
          * text/display-поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 14 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для encumbrance_disclosed используй только: "yes", "no", "not_defined".
        - Для text/display-полей при отсутствии данных используй только:
          third_party_rights_details → "Не установлено"
          pledge_details → "Не установлено"
          arrest_details → "Не установлено"
          other_encumbrances_details → "Не установлено"
          encumbrance_warranty_display → "Заверения не предусмотрены"
          eviction_protection_display → "Не установлено"
          seller_title_liability_display → "Не установлена"
        - Для text/display-полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "third_party_rights_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии прав третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "third_party_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Внутренняя краткая формулировка о правах третьих лиц.
            Используется для формирования encumbrance_warranty_display.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "pledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии залога. Внутреннее enum-поле."
          required: false

        - name: "pledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Внутренняя краткая формулировка о залоге.
            Используется для формирования encumbrance_warranty_display.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "arrest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии ареста. Внутреннее enum-поле."
          required: false

        - name: "arrest_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Внутренняя краткая формулировка об аресте.
            Используется для формирования encumbrance_warranty_display.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "other_encumbrances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии иных обременений. Внутреннее enum-поле."
          required: false

        - name: "other_encumbrances_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          description: >
            Внутренняя краткая формулировка об иных обременениях.
            Используется для формирования encumbrance_warranty_display.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "encumbrance_disclosed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: >
            Внутренний флаг: раскрыто ли наличие обременения прямо в тексте договора.
            Используется для формирования encumbrance_warranty_display.
          required: false

        - name: "encumbrance_warranty_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обременения и права третьих лиц"
          description: >
            Сводное user-facing значение о заверениях продавца относительно
            обременений и прав третьих лиц, например:
            "Товар свободен от прав третьих лиц, залога, ареста и иных обременений",
            "Товар свободен от залога и ареста (права третьих лиц не упомянуты)",
            "Наличие обременения раскрыто в договоре".
            Fallback: "Заверения не предусмотрены" / "Не удалось определить".
          required: true

        - name: "eviction_protection_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус урегулирования последствий эвикции. Внутреннее enum-поле."
          required: false

        - name: "eviction_protection_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Защита от эвикции"
          description: >
            Краткое user-facing описание условий о защите от эвикции, например:
            "Продавец урегулирует претензии третьих лиц за свой счёт",
            "Продавец обязуется возместить убытки при изъятии товара".
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "seller_title_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности продавца за дефекты титула. Внутреннее enum-поле."
          required: false

        - name: "seller_title_liability_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственность за дефекты титула"
          description: >
            Краткое user-facing описание ответственности продавца за дефекты титула,
            например: "Полная ответственность продавца за дефекты титула",
            "Продавец возмещает убытки при предъявлении прав третьих лиц".
            Fallback: "Не установлена" / "Не удалось определить".
          required: false

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Неустойка и санкции
  # ──────────────────────────────────────────────────────────────────────────
  - id: liability_sanctions
    name: "Неустойка и санкции за просрочку исполнения"
    description: >
      Фактографическая проверка наличия в договоре специальных санкций
      за просрочку передачи товара продавцом и просрочку оплаты покупателем.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность"
        - "неустойка"
        - "пени"
        - "штраф"
        - "просрочка"
        - "просрочка передачи"
        - "просрочка оплаты"
        - "убытки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк[аи]|пен[яиь]|штраф"
        - "(?i)просрочк[аи]\\s+(?:передач|оплат)"
        - "(?i)\\d+\\s*%?\\s*(?:в\\s+день|за\\s+каждый\\s+день|годовых)"
        - "(?i)не\\s+(?:применяется|предусмотрена)\\s+неустойк"
        - "(?i)не\\s+(?:более|превышает)\\s+\\d+\\s*%"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества.
        Проверяется только один вопрос: специальные санкции за просрочку исполнения.

        Нормативный ориентир:
        - ст. 393-395 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка/штраф за просрочку передачи товара продавцом.
        2. Есть ли неустойка/штраф за просрочку оплаты покупателем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Общая фраза "стороны несут ответственность по закону" без конкретной ставки
           или размера не считается специальной санкцией — это not_defined.
        4. Для status-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлена" — если санкция прямо не указана;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Если в договоре прямо сказано, что неустойка не применяется
           или освобождение от неустойки прямо предусмотрено:
           - status → "defined"
           - details → "Неустойка не предусмотрена"
        7. Не смешивай санкцию продавца и санкцию покупателя.
        8. В evidence включай только текст договора.
        9. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку передачи товара Продавец уплачивает пени в размере 0,1% от цены
        товара за каждый день просрочки, но не более 10% от цены договора.
        За просрочку оплаты Покупатель уплачивает 0,05% за каждый день просрочки."

        Ответ:
        {
          "seller_penalty_status": "defined",
          "seller_penalty_details": "Пени 0,1% от цены товара за каждый день просрочки, но не более 10% от цены договора",
          "buyer_penalty_status": "defined",
          "buyer_penalty_details": "Пени 0,05% за каждый день просрочки оплаты",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку передачи товара Продавец уплачивает пени в размере 0,1% от цены товара за каждый день просрочки, но не более 10% от цены договора. За просрочку оплаты Покупатель уплачивает 0,05% за каждый день просрочки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "За каждый день просрочки виновная сторона уплачивает другой стороне
        0,1% от суммы просроченного обязательства."

        Ответ:
        {
          "seller_penalty_status": "defined",
          "seller_penalty_details": "Пени 0,1% от суммы просроченного обязательства за каждый день просрочки",
          "buyer_penalty_status": "defined",
          "buyer_penalty_details": "Пени 0,1% от суммы просроченного обязательства за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "За каждый день просрочки виновная сторона уплачивает другой стороне 0,1% от суммы просроченного обязательства."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Неустойка по настоящему договору не применяется.
        Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "seller_penalty_status": "defined",
          "seller_penalty_details": "Неустойка не предусмотрена",
          "buyer_penalty_status": "defined",
          "buyer_penalty_details": "Неустойка не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Неустойка по настоящему договору не применяется. Стороны несут ответственность в соответствии с законодательством РФ."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "seller_penalty_status": "not_defined",
          "seller_penalty_details": "Не установлена",
          "buyer_penalty_status": "not_defined",
          "buyer_penalty_details": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая санкция за просрочку передачи товара продавцом.
        2. Есть ли прямая санкция за просрочку оплаты покупателем.
        3. Если санкция сформулирована для обеих сторон одной фразой —
           продублируй её в оба поля.
        4. Если прямо указано, что неустойка не применяется —
           это defined, а не not_defined.
        5. Не путай общую ответственность со специальной неустойкой.
        6. Если в разных фрагментах данные несовместимы и конфликт нельзя снять —
           верни "Не удалось определить" и "not_defined" в status-полях.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_penalty_status": "<defined / not_defined>",
          "seller_penalty_details": "<текст или 'Не установлена' / 'Неустойка не предусмотрена' / 'Не удалось определить'>",
          "buyer_penalty_status": "<defined / not_defined>",
          "buyer_penalty_details": "<текст или 'Не установлена' / 'Неустойка не предусмотрена' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 580
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность неустойка пени штраф просрочка передачи товара просрочка оплаты покупателя продавца максимальный размер неустойки не применяется освобождение"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "расторжение"
        - "односторонний отказ"
        - "возврат товара"
        - "возврат денежных средств"
        - "форс-мажор"
        - "претензионный порядок"
        - "качество товара"
        - "право собственности"
        - "риск случайной гибели"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о специальных санкциях:
        - продавца за просрочку передачи товара,
        - покупателя за просрочку оплаты.
        Не анализируй расторжение, возвраты, форс-мажор, качество товара и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_penalty_status:
           - "defined" — если в тексте прямо указана неустойка, пени или штраф
             за просрочку передачи товара продавцом, либо прямо указано,
             что такая неустойка не применяется / не предусмотрена;
           - "not_defined" — если санкция продавца прямо не урегулирована
             или её нельзя надёжно определить.
           Важно: общая фраза об ответственности по закону без конкретной ставки
           или размера — это not_defined.

        2. seller_penalty_details:
           Краткое user-facing описание санкции продавца на русском языке.
           Правила:
           - если санкция прямо указана, верни её кратко (1–2 фразы), например:
             "Пени 0,1% от цены товара за каждый день просрочки",
             "Штраф 10 000 рублей за нарушение срока передачи",
             "Пени 0,1% в день, но не более 10% от цены договора";
           - если санкция ограничена максимальным размером — включи это в details;
           - если санкция сформулирована для обеих сторон одной фразой —
             используй эту же формулировку и для продавца, и для покупателя;
           - если неустойка прямо исключена или не предусмотрена — верни:
             "Неустойка не предусмотрена";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. buyer_penalty_status:
           - "defined" — если в тексте прямо указана неустойка, пени или штраф
             за просрочку оплаты покупателем, либо прямо указано,
             что такая неустойка не применяется / не предусмотрена;
           - "not_defined" — если санкция покупателя прямо не урегулирована
             или её нельзя надёжно определить.
           Важно: общая фраза об ответственности по закону без конкретной ставки
           или размера — это not_defined.

        4. buyer_penalty_details:
           Краткое user-facing описание санкции покупателя на русском языке.
           Правила:
           - если санкция прямо указана, верни её кратко (1–2 фразы), например:
             "Пени 0,05% за каждый день просрочки оплаты",
             "Штраф 5 000 рублей за нарушение срока оплаты",
             "Пени 0,1% в день, но не более 5% от суммы задолженности";
           - если санкция ограничена максимальным размером — включи это в details;
           - если санкция сформулирована для обеих сторон одной фразой —
             используй эту же формулировку и для продавца, и для покупателя;
           - если неустойка прямо исключена или не предусмотрена — верни:
             "Неустойка не предусмотрена";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай санкцию продавца и санкцию покупателя:
          * seller_penalty — только за просрочку передачи товара;
          * buyer_penalty — только за просрочку оплаты.
        - Если санкция сформулирована для обеих сторон одной общей фразой,
          продублируй её в оба поля.
        - Общая ссылка на закон без конкретной ставки или размера — это not_defined.
        - Если неустойка прямо исключена в тексте — это defined,
          а не not_defined. Верни "Неустойка не предусмотрена".
        - Если санкция ограничена максимальным размером — включи это в details.
        - Не анализируй расторжение, форс-мажор, возвраты, качество товара
          и иные нерелевантные темы.
        - Если в разных фрагментах указаны разные ставки или условия и конфликт
          нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          seller_penalty_details → "Не установлена"
          buyer_penalty_details → "Не установлена"
        - Для текстовых полей при прямом исключении неустойки используй только:
          "Неустойка не предусмотрена"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "seller_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения неустойки продавца. Внутреннее enum-поле."
          required: true

        - name: "seller_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Неустойка продавца"
          description: >
            Краткое user-facing описание санкции продавца за просрочку передачи товара,
            например: "Пени 0,1% от цены товара за каждый день просрочки",
            "Штраф 10 000 рублей", "Пени 0,1% в день, но не более 10% от цены договора",
            "Неустойка не предусмотрена".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "buyer_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения неустойки покупателя. Внутреннее enum-поле."
          required: true

        - name: "buyer_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Неустойка покупателя"
          description: >
            Краткое user-facing описание санкции покупателя за просрочку оплаты,
            например: "Пени 0,05% за каждый день просрочки оплаты",
            "Штраф 5 000 рублей", "Пени 0,1% в день, но не более 5% от суммы задолженности",
            "Неустойка не предусмотрена".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Расторжение
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_restitution
    name: "Расторжение договора и возврат товара / денег"
    description: >
      Фактографическая проверка наличия условий об одностороннем отказе,
      расторжении договора и последствиях в виде возврата товара и/или денег.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "существенное нарушение"
        - "возврат товара"
        - "возврат денежных средств"
        - "возврат денег"
        - "утрата интереса"
        - "непередача"
        - "уклонение"
        - "уведомление о расторжении"
        - "по соглашению сторон"
        - "не допускается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(?:ение|ении|ения)"
        - "(?i)односторонн[а-я]+\\s+отказ"
        - "(?i)существенн[а-я]+\\s+нарушен"
        - "(?i)возврат\\s+(?:товар|денежн|денег)"
        - "(?i)отказ\\s+(?:от\\s+договора|не\\s+допускается)"
        - "(?i)уведомлени[еяю]\\s+(?:о\\s+расторж|за\\s+\\d+)"
        - "(?i)по\\s+соглашению\\s+сторон"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества.
        Проверяется только один вопрос: расторжение договора и возврат исполнения.

        Нормативный ориентир:
        - ст. 450-453 ГК РФ
        - ст. 463-464 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условия об одностороннем отказе / расторжении.
        2. Есть ли условия о возврате товара при расторжении.
        3. Есть ли условия о возврате денег при расторжении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Для status-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлено" / "Не установлен" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Если прямо указано расторжение по соглашению сторон — это defined,
           даже если одностороннего отказа нет.
        7. Если в договоре прямо указано, что односторонний отказ не допускается —
           это defined, а не not_defined.
        8. Общая ссылка на законодательство РФ без конкретных оснований
           расторжения — это not_defined.
        9. Не смешивай основания расторжения с последствиями расторжения.
        10. Возврат товара и возврат денег — разные поля; не смешивай их.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор может быть расторгнут в одностороннем порядке при существенном нарушении
        путём направления письменного уведомления за 10 дней.
        При расторжении товар возвращается Продавцу, денежные средства — Покупателю."

        Ответ:
        {
          "termination_status": "defined",
          "termination_details": "Односторонний отказ при существенном нарушении; уведомление за 10 дней",
          "goods_return_status": "defined",
          "goods_return_details": "Товар возвращается Продавцу",
          "money_return_status": "defined",
          "money_return_details": "Денежные средства возвращаются Покупателю",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Договор может быть расторгнут в одностороннем порядке при существенном нарушении путём направления письменного уведомления за 10 дней. При расторжении товар возвращается Продавцу, денежные средства — Покупателю."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор расторгается по соглашению сторон.
        Односторонний отказ от исполнения договора не допускается."

        Ответ:
        {
          "termination_status": "defined",
          "termination_details": "По соглашению сторон; односторонний отказ не допускается",
          "goods_return_status": "not_defined",
          "goods_return_details": "Не установлен",
          "money_return_status": "not_defined",
          "money_return_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Договор расторгается по соглашению сторон. Односторонний отказ от исполнения договора не допускается."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "При расторжении договора Покупателю возвращаются уплаченные денежные средства
        за вычетом документально подтверждённых расходов Продавца."

        Ответ:
        {
          "termination_status": "not_defined",
          "termination_details": "Не установлено",
          "goods_return_status": "not_defined",
          "goods_return_details": "Не установлен",
          "money_return_status": "defined",
          "money_return_details": "Возврат уплаченных средств за вычетом документально подтверждённых расходов Продавца",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "При расторжении договора Покупателю возвращаются уплаченные денежные средства за вычетом документально подтверждённых расходов Продавца."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны действуют в соответствии с законодательством Российской Федерации."

        Ответ:
        {
          "termination_status": "not_defined",
          "termination_details": "Не установлено",
          "goods_return_status": "not_defined",
          "goods_return_details": "Не установлен",
          "money_return_status": "not_defined",
          "money_return_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о расторжении / одностороннем отказе.
        2. Если расторжение только по соглашению — это defined.
        3. Если односторонний отказ прямо запрещён — это defined.
        4. Есть ли прямое условие о возврате товара.
        5. Есть ли прямое условие о возврате денег.
        6. Не смешивай основания и последствия расторжения.
        7. Не выводи последствия расторжения из закона, если их нет в тексте.
        8. Если в разных фрагментах данные несовместимы и конфликт нельзя снять —
           верни "Не удалось определить" и "not_defined" в status-полях.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_status": "<defined / not_defined>",
          "termination_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "goods_return_status": "<defined / not_defined>",
          "goods_return_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "money_return_status": "<defined / not_defined>",
          "money_return_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение отказ от договора односторонний отказ существенное нарушение возврат товара возврат денежных средств возврат денег утрата интереса непередача уклонение уведомление о расторжении по соглашению сторон не допускается"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "неустойка"
        - "пени"
        - "штраф"
        - "форс-мажор"
        - "претензионный порядок"
        - "право собственности"
        - "риск случайной гибели"
        - "качество товара"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 1.0]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о расторжении / одностороннем отказе и последствиях в виде возврата
        товара и денег.
        Не анализируй неустойки, форс-мажор, цену, качество и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_status:
           - "defined" — если в тексте прямо указаны основания расторжения
             или одностороннего отказа, либо прямо указано расторжение
             по соглашению сторон, либо прямо указано, что односторонний
             отказ не допускается;
           - "not_defined" — если вопрос расторжения прямо не урегулирован
             или его нельзя надёжно определить.
           Важно: общая ссылка на законодательство без конкретных оснований —
           это not_defined.

        2. termination_details:
           Краткое user-facing описание оснований и порядка расторжения
           на русском языке (1–2 коротких фразы).
           Правила:
           - если прямо указан односторонний отказ, верни кратко основания
             и порядок, например:
             "Односторонний отказ при существенном нарушении; уведомление за 10 дней",
             "Отказ Покупателя при непоставке товара в срок";
           - если расторжение только по соглашению сторон:
             "По соглашению сторон";
           - если прямо указано расторжение по соглашению и одностороннего
             отказа нет:
             "По соглашению сторон; односторонний отказ не допускается";
           - если одностороннего отказа нет, но есть право расторжения через суд:
             "По соглашению сторон или через суд";
           - если в договоре прямо указано, что односторонний отказ не допускается,
             и иных оснований нет — верни:
             "Односторонний отказ не допускается";
           - если расторжение предусматривает уведомление за N дней — включи это;
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. goods_return_status:
           - "defined" — если в тексте прямо указаны условия возврата товара
             при расторжении;
           - "not_defined" — если возврат товара прямо не урегулирован
             или его нельзя надёжно определить.

        4. goods_return_details:
           Краткое user-facing описание условий возврата товара на русском языке
           (1–2 коротких фразы).
           Правила:
           - если условия прямо указаны, верни их кратко, например:
             "Товар возвращается Продавцу",
             "Товар возвращается в течение 5 рабочих дней с даты расторжения",
             "Возврат товара за счёт Покупателя";
           - если возврат частичный или с условиями — отрази это:
             "Возврат товара за вычетом естественного износа";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. money_return_status:
           - "defined" — если в тексте прямо указаны условия возврата денег
             при расторжении;
           - "not_defined" — если возврат денег прямо не урегулирован
             или его нельзя надёжно определить.

        6. money_return_details:
           Краткое user-facing описание условий возврата денег на русском языке
           (1–2 коротких фразы).
           Правила:
           - если условия прямо указаны, верни их кратко, например:
             "Денежные средства возвращаются Покупателю",
             "Возврат в течение 10 рабочих дней с даты расторжения",
             "Возврат за вычетом документально подтверждённых расходов Продавца";
           - если возврат частичный или с условиями — отрази это кратко;
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, обычную практику или предположения вместо текста договора.
        - Не смешивай основания расторжения (termination_details) с его последствиями
          (goods_return_details, money_return_details).
        - Возврат товара и возврат денег — разные поля; не смешивай их.
        - Расторжение по соглашению сторон — это defined, даже если одностороннего
          отказа нет.
        - Если прямо указано, что односторонний отказ не допускается, — это defined,
          а не not_defined.
        - Общая ссылка на законодательство без конкретных оснований — это not_defined.
        - Если возврат товара или денег предусмотрен с условиями или частично —
          отрази это кратко в details.
        - Не выводи последствия расторжения из закона, если их нет в тексте.
        - Если в разных фрагментах указаны разные условия и конфликт нельзя
          разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          termination_details → "Не установлено"
          goods_return_details → "Не установлен"
          money_return_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения оснований расторжения. Внутреннее enum-поле."
          required: true

        - name: "termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Расторжение"
          description: >
            Краткое user-facing описание оснований и порядка расторжения договора,
            например: "Односторонний отказ при существенном нарушении; уведомление за 10 дней",
            "По соглашению сторон", "По соглашению сторон; односторонний отказ не допускается",
            "Односторонний отказ не допускается".
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "goods_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения условий возврата товара. Внутреннее enum-поле."
          required: true

        - name: "goods_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Возврат товара"
          description: >
            Краткое user-facing описание условий возврата товара при расторжении,
            например: "Товар возвращается Продавцу",
            "Возврат в течение 5 рабочих дней с даты расторжения",
            "Возврат за вычетом естественного износа".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "money_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения условий возврата денег. Внутреннее enum-поле."
          required: true

        - name: "money_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Возврат денег"
          description: >
            Краткое user-facing описание условий возврата денег при расторжении,
            например: "Денежные средства возвращаются Покупателю",
            "Возврат в течение 10 рабочих дней с даты расторжения",
            "Возврат за вычетом документально подтверждённых расходов Продавца".
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Споры, претензионный порядок
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_resolution_and_governing_law
    name: "Претензионный порядок разрешения споров"
    description: >
      Фактографическая проверка наличия условий о претензионном порядке, сроках
      ответа на претензию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "спор"
        - "претензия"
        - "претензионный порядок"
        - "досудебный порядок"
        - "направление претензии"
        - "ответ на претензию"
        - "медиация"
        - "регламент"
        - "не является обязательным"
        - "заказным письмом"
        - "электронная почта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионн[ый]+\\s+поряд"
        - "(?i)досудебн[ый]+\\s+(?:поряд|урегулирован)"
        - "(?i)в\\s+течение\\s+\\d+\\s+(?:дн|рабоч|календар).{0,20}(?:претензи|ответ)"
        - "(?i)досудебн[ый]+\\s+поряд[а-я]+\\s+не\\s+являет"
        - "(?i)претензи[яи]\\s+направляется\\s+(?:в\\s+письменн|заказн|по\\s+электронн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: претензионный порядок разрешения споров.

        Нормативный ориентир:
        - ст. 4 АПК РФ
        - ст. 131–132 ГПК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли претензионный / досудебный порядок.
        2. Есть ли срок ответа на претензию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Для status-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлен" — если условие прямо не указано;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Если досудебный порядок прямо указан как необязательный —
           это defined, а не not_defined.
        7. Если порядок или срок определяются по регламенту / приложению —
           это не отсутствие регулирования; отрази это в user-facing поле.
        8. Общая ссылка на законодательство без конкретного претензионного порядка —
           это not_defined.
        9. Не используй "None", "null" или пустые строки.
        10. В evidence включай только текст договора.
        11. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Все споры, возникающие в связи с исполнением настоящего договора, подлежат
        урегулированию путём направления письменной претензии заказным письмом.
        Сторона, получившая претензию, обязана дать письменный ответ в течение
        10 рабочих дней с даты её получения."

        Ответ:
        {
          "pretrial_status": "defined",
          "pretrial_details": "Обязательный претензионный порядок; претензия направляется письменно заказным письмом",
          "claim_response_deadline_status": "defined",
          "claim_response_deadline_details": "10 рабочих дней с даты получения претензии",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Все споры, возникающие в связи с исполнением настоящего договора, подлежат урегулированию путём направления письменной претензии заказным письмом. Сторона, получившая претензию, обязана дать письменный ответ в течение 10 рабочих дней с даты её получения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Досудебный порядок урегулирования споров не является обязательным.
        Стороны вправе обратиться в суд непосредственно."

        Ответ:
        {
          "pretrial_status": "defined",
          "pretrial_details": "Досудебный порядок не является обязательным",
          "claim_response_deadline_status": "not_defined",
          "claim_response_deadline_details": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Досудебный порядок урегулирования споров не является обязательным. Стороны вправе обратиться в суд непосредственно."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Срок ответа на претензию по качеству товара — 5 рабочих дней;
        по иным вопросам — 10 рабочих дней."

        Ответ:
        {
          "pretrial_status": "not_defined",
          "pretrial_details": "Не установлен",
          "claim_response_deadline_status": "defined",
          "claim_response_deadline_details": "По качеству товара — 5 рабочих дней; по иным вопросам — 10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Срок ответа на претензию по качеству товара — 5 рабочих дней; по иным вопросам — 10 рабочих дней."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны договорились разрешать все разногласия в соответствии
        с законодательством Российской Федерации."

        Ответ:
        {
          "pretrial_status": "not_defined",
          "pretrial_details": "Не установлен",
          "claim_response_deadline_status": "not_defined",
          "claim_response_deadline_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата о претензионном / досудебном порядке.
        2. Если досудебный порядок прямо не обязателен — это defined.
        3. Если порядок или срок определяются по регламенту / приложению —
           отрази это как user-facing значение, а не как пустоту.
        4. Есть ли прямая цитата о сроке ответа на претензию.
        5. Если прямой цитаты нет — верни "not_defined" и "Не установлен".
        6. Не используй закон вместо текста договора.
        7. Если в разных фрагментах данные несовместимы и конфликт нельзя снять —
           верни "Не удалось определить" и "not_defined" в status-полях.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "claim_response_deadline_status": "<defined / not_defined>",
          "claim_response_deadline_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разрешение споров претензионный порядок досудебный порядок урегулирование споров направление претензии ответ на претензию регламент не является обязательным заказным письмом электронная почта"
      retrieval_profile: "dispute_resolution_check"
      preferred_unit_types:
        - dispute_resolution
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "претензия по качеству"
        - "претензии по недостаткам"
        - "претензии к товару"
        - "гарантийный срок"
        - "комплектность"
        - "неустойка"
        - "расторжение"
        - "ответственность сторон"
        - "право собственности"
        - "риск случайной гибели"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.25
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о претензионном порядке и сроке ответа на претензию.
        Не анализируй орган разрешения споров, применимое право, ответственность,
        цену или передачу товара.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. pretrial_status:
           - "defined" — если в тексте прямо предусмотрен претензионный /
             досудебный порядок, либо прямо указано, что досудебный порядок
             не является обязательным;
           - "not_defined" — если претензионный порядок прямо не урегулирован
             или его нельзя надёжно определить.
           Важно: общая ссылка на законодательство без конкретного порядка —
           это not_defined.

        2. pretrial_details:
           Краткое user-facing описание претензионного порядка на русском языке
           (1–2 коротких фразы).
           Правила:
           - если претензионный порядок прямо установлен, верни кратко его суть,
             например:
             "Обязательный претензионный порядок",
             "Обязательный претензионный порядок; претензия направляется
             письменно заказным письмом",
             "Обязательный претензионный порядок; претензия направляется
             по электронной почте или заказным письмом";
           - если прямо указано, что претензия должна быть в письменной форме
             или направляться определённым способом — включи это кратко;
           - если досудебный порядок прямо указан как необязательный — верни:
             "Досудебный порядок не является обязательным";
           - если порядок прямо определяется по регламенту / приложению —
             это не отсутствие регулирования; верни понятную формулировку,
             например: "Согласно Регламенту взаимодействия";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. claim_response_deadline_status:
           - "defined" — если в тексте прямо указан срок ответа на претензию;
           - "not_defined" — если срок ответа прямо не установлен или его нельзя
             надёжно определить.

        4. claim_response_deadline_details:
           Краткое user-facing описание срока ответа на претензию на русском языке
           (1–2 коротких фразы).
           Правила:
           - если срок прямо указан, верни его кратко, например:
             "10 рабочих дней с даты получения претензии",
             "30 календарных дней";
           - если для разных видов претензий установлены разные сроки, укажи оба:
             "По качеству товара — 5 рабочих дней; по иным вопросам — 10 рабочих дней";
           - если срок определяется по регламенту / приложению, верни понятную
             формулировку, например: "Согласно Регламенту взаимодействия";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо
          текста договора.
        - Анализируй только претензионный / досудебный порядок и срок ответа.
        - Не извлекай орган разрешения споров, применимое право, ответственность
          и иные нерелевантные темы.
        - Не путай претензию по качеству товара (из раздела приёмки) с претензионным
          порядком разрешения споров.
        - Если досудебный порядок прямо не обязателен — это defined, а не not_defined.
        - Если порядок или срок прямо определяются по регламенту / приложению —
          считай это определённым и отрази в user-facing поле.
        - Общая ссылка на законодательство без конкретного порядка — это not_defined.
        - Если в разных фрагментах указаны разные сроки / порядки и конфликт нельзя
          разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          pretrial_details → "Не установлен"
          claim_response_deadline_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "pretrial_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения претензионного порядка. Внутреннее enum-поле."
          required: true

        - name: "pretrial_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Претензионный порядок"
          description: >
            Краткое user-facing описание претензионного / досудебного порядка,
            например: "Обязательный претензионный порядок",
            "Обязательный претензионный порядок; претензия направляется заказным письмом",
            "Досудебный порядок не является обязательным",
            "Согласно Регламенту взаимодействия".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "claim_response_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока ответа на претензию. Внутреннее enum-поле."
          required: false

        - name: "claim_response_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок ответа на претензию"
          description: >
            Краткое user-facing описание срока ответа на претензию,
            например: "10 рабочих дней с даты получения претензии",
            "По качеству товара — 5 рабочих дней; по иным вопросам — 10 рабочих дней",
            "Согласно Регламенту взаимодействия".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим предоставить по {doc_names} подтверждающие документы на подписантов 
      от Покупателя и Продавца (устав, доверенность, приказ), подтверждающие их полномочия 
      на подписание документа, а также полные реквизиты сторон (если они не определены в тексте).
    addressee: "Обе стороны"

  subject_price_payment:
    text: >
      В связи с отсутствием существенных условий в {doc_names}, просим предоставить: 
      (а) детальное описание предмета (товара), его состава и количества; 
      (б) точную цену за предмет (товар) либо механизм её определения; 
      (в) форму расчетов, сроки и порядок оплаты.
    addressee: "Продавец / Покупатель"

  delivery_and_transfer_docs:
    text: >
      Просим предоставить по {doc_names} детальное описание сроков и места поставки 
      предмета (товара), а также точный перечень принадлежностей и документов на товар 
      (паспорта, сертификаты, инструкции), подлежащих передаче вместе с товаром.
    addressee: "Продавец"

  title_risk_retention:
    text: >
      Просим предоставить по {doc_names} четкое описание момента перехода риска 
      случайной гибели и/или повреждения товара, момента перехода права собственности 
      на товар, а также их соотношения (совпадают или не совпадают).
    addressee: "Юридический советник"

  quality_warranty_acceptance:
    text: >
      Просим предоставить по {doc_names} требования к качеству товара 
      (включая стандарты — ГОСТ/ТУ/СТО), перечень комплектующих и состав комплектности товара, 
      а также условия о гарантии и регламент приемки товара по качеству.
    addressee: "Продавец / Юридический советник"

  encumbrance_third_party_rights:
    text: >
      Просим предоставить по {doc_names} письменное подтверждение (заверение) 
      отсутствия прав третьих лиц, залога, ареста и иных обременений на товар. 
      При наличии обременений — предоставить подтверждающие документы и явное 
      согласие покупателя на принятие такого товара.
    addressee: "Продавец"

  liability_and_termination:
    text: >
      Просим уточнить по {doc_names} условия ответственности сторон (неустойки за просрочку 
      передачи товара и оплаты), исчерпывающие основания для расторжения договора, 
      порядок возврата товара / денежных средств и форс-мажорную оговорку.
    addressee: "Юридический советник"

  dispute_resolution_and_governing_law:
    text: >
      Просим уточнить по {doc_names} претензионный (досудебный) порядок, 
      сроки ответа на претензию, суд (форум) разрешения споров и применимое право.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

    
