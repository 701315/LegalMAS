        - "(?i)просрочк[аи]\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: порядок оплаты, модель расчётов и НДС.

        Нормативный ориентир:
        - ст. 424 ГК РФ
        - ст. 486-489 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок и сроки оплаты.
        2. Есть ли указание на модель оплаты.
        3. Есть ли указание на НДС.
        4. Есть ли прямое указание на последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Оплата производится в течение 5 рабочих дней с даты подписания договора. Цена включает НДС 20%."

        Ответ:
        {
          "payment_procedure_status": "defined",
          "payment_procedure_details": "оплата производится в течение 5 рабочих дней с даты подписания договора",
          "payment_model": "prepayment",
          "vat_status": "defined",
          "late_payment_consequences_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Оплата производится в течение 5 рабочих дней с даты подписания договора. Цена включает НДС 20%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны согласуют расчёты дополнительно."

        Ответ:
        {
          "payment_procedure_status": "not_defined",
          "payment_procedure_details": "Данные не определены",
          "payment_model": "not_defined",
          "vat_status": "not_defined",
          "late_payment_consequences_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о порядке оплаты.
        2. Есть ли прямое указание на предоплату, постоплату, рассрочку или смешанную модель.
        3. Есть ли прямое указание на НДС или отсутствие НДС.
        4. Есть ли прямое указание на последствия просрочки оплаты.
        5. Если прямого текста нет — верни "not_defined" и "Данные не определены".
        6. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_procedure_status": "<defined / not_defined>",
          "payment_procedure_details": "<текст или 'Данные не определены'>",
          "payment_model": "<prepayment / postpayment / installments / mixed / not_defined>",
          "vat_status": "<defined / not_defined>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата порядок расчетов предоплата аванс рассрочка отсрочка срок оплаты НДС без НДС включая НДС просрочка оплаты"
      preferred_unit_types:
        - payment_term
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "качество"
        - "гарантия"
        - "приемка"
        - "право собственности"
        - "риск случайной гибели"
        - "арест"
        - "залог"
        - "расторжение"
        - "форс-мажор"
