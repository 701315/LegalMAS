        <task>
        Заполни строго следующие поля:

        1. seller_penalty_status — "defined" если неустойка/штраф продавца за просрочку передачи товара прямо указаны, иначе "not_defined".
        2. seller_penalty_details — размер и условия неустойки продавца.
        3. buyer_penalty_status — "defined" если неустойка/штраф покупателя за просрочку оплаты прямо указаны, иначе "not_defined".
        4. buyer_penalty_details — размер и условия неустойки покупателя.
        5. termination_status — "defined" если основания расторжения или одностороннего отказа прямо указаны, иначе "not_defined".
        6. termination_details — основания и порядок расторжения.
        7. goods_return_status — "defined" если возврат товара при расторжении прямо предусмотрен, иначе "not_defined".
        8. goods_return_details — условия возврата товара.
        9. money_return_status — "defined" если возврат денег при расторжении прямо предусмотрен, иначе "not_defined".
        10. money_return_details — условия возврата денег.
        11. force_majeure_status — "defined" если форс-мажорная оговорка прямо предусмотрена, иначе "not_defined".
        12. force_majeure_details — формулировка форс-мажорной оговорки.

        Важно:
        - Неустойка продавца и покупателя — это разные поля. Не смешивай.
        - Возврат товара и возврат денег — это разные поля. Не смешивай.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - Не смешивай разные темы в одном поле.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения неустойки продавца."
