        - "неустойка"
        - "пени"
        - "штраф"
        - "убытки"
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "существенное нарушение"
        - "возврат товара"
        - "возврат денежных средств"
        - "просрочка"
        - "непередача"
        - "уклонение"
        - "утрата интереса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк[аи]|пен[яиь]|штраф"
        - "(?i)расторж(?:ение|ении|ения)"
        - "(?i)односторонн[а-я]+\\s+отказ"
        - "(?i)существенн[а-я]+\\s+нарушен"
        - "(?i)возврат\\s+(?:товар|денежн)"
        - "(?i)убытк[иа]\\s+(?:возмещ|взыскан)"
        - "(?i)просрочк[аи]\\s+(?:передач|оплат|поставк)"
        - "(?i)\\d+\\s*%?\\s*(?:в\\s+день|годовых|за\\s+каждый\\s+день)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: ответственность сторон, санкции и расторжение.

        Нормативный ориентир:
        - ст. 393-395 ГК РФ
        - ст. 450-453 ГК РФ
        - ст. 463-464 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка/штраф за просрочку передачи товара продавцом.
        2. Есть ли неустойка/штраф за просрочку оплаты покупателем.
        3. Есть ли условия об одностороннем отказе / расторжении.
        4. Есть ли условия о возврате товара и/или денег при расторжении.
        5. Есть ли форс-мажорная оговорка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке / штрафе.
        2. Найди прямую цитату о расторжении / отказе.
        3. Найди прямую цитату о возврате товара / денег.
        4. Найди прямую цитату о форс-мажоре.
        5. Если прямой цитаты нет — верни "not_defined".
        6. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_penalty_status": "<defined / not_defined>",
          "seller_penalty_details": "<текст или 'Данные не определены'>",
          "buyer_penalty_status": "<defined / not_defined>",
          "buyer_penalty_details": "<текст или 'Данные не определены'>",
          "termination_status": "<defined / not_defined>",
          "termination_details": "<текст или 'Данные не определены'>",
          "goods_return_status": "<defined / not_defined>",
          "goods_return_details": "<текст или 'Данные не определены'>",
          "money_return_status": "<defined / not_defined>",
          "money_return_details": "<текст или 'Данные не определены'>",
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_query: "ответственность неустойка пени штраф убытки просрочка расторжение отказ от договора односторонний отказ существенное нарушение возврат товара возврат денежных средств форс-мажор обстоятельства непреодолимой силы непередача утрата интереса уклонение"
      preferred_unit_types:
