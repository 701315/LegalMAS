  - id: liability_and_termination
    name: "Ответственность сторон, санкции и расторжение договора"
    description: >
      Фактографическая проверка наличия в договоре условий о неустойке, ответственности,
      одностороннем отказе, расторжении, возврате товара/денег и форс-мажоре.
