        </context>

        <task>
        Заполни строго следующие поля:
        1. termination_status — "defined" если основания расторжения или одностороннего отказа прямо указаны, иначе "not_defined".
        2. termination_details — основания и порядок расторжения.
        3. goods_return_status — "defined" если возврат товара при расторжении прямо предусмотрен, иначе "not_defined".
        4. goods_return_details — условия возврата товара.
        5. money_return_status — "defined" если возврат денег при расторжении прямо предусмотрен, иначе "not_defined".
        6. money_return_details — условия возврата денег.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - Не смешивай основания расторжения с последствиями расторжения.
        - Возврат товара и возврат денег — это разные поля.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения оснований расторжения."
          required: true
        - name: "termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Расторжение"
          description: "Основания и порядок расторжения договора."
          required: true
        - name: "goods_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения условий возврата товара."
          required: true
        - name: "goods_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Возврат товара"
          description: "Условия возврата товара при расторжении."
          required: true
        - name: "money_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения условий возврата денег."
          required: true
        - name: "money_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Возврат денег"
          description: "Условия возврата денег при расторжении."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Форс-мажор
  # ──────────────────────────────────────────────────────────────────────────
  - id: force_majeure_clause
    name: "Форс-мажорная оговорка"
    description: >
      Фактографическая проверка наличия в договоре форс-мажорной оговорки
      и её базовой формулировки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "освобождаются от ответственности"
        - "чрезвычайные и непредотвратимые обстоятельства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)обстоятельств[ао]\\s+непреодолим[а-я]+\\s+сил"
        - "(?i)освобожда(?:ется|ются)\\s+от\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества.
        Проверяется только один вопрос: наличие форс-мажорной оговорки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли форс-мажорная оговорка.
        2. Какая базовая формулировка используется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны освобождаются от ответственности за неисполнение обязательств при наступлении обстоятельств непреодолимой силы."

        Ответ:
        {
          "force_majeure_status": "defined",
          "force_majeure_details": "Стороны освобождаются от ответственности за неисполнение обязательств при наступлении обстоятельств непреодолимой силы",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны освобождаются от ответственности за неисполнение обязательств при наступлении обстоятельств непреодолимой силы."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством."

        Ответ:
        {
          "force_majeure_status": "not_defined",
          "force_majeure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая форс-мажорная оговорка.
        2. Не путай общую ответственность с форс-мажором.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 420
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "форс-мажор обстоятельства непреодолимой силы освобождаются от ответственности чрезвычайные и непредотвратимые обстоятельства"
      preferred_unit_types:
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - boilerplate
      negative_keywords:
        - "неустойка"
        - "расторжение"
        - "претензионный порядок"
        - "качество товара"
        - "право собственности"
        - "риск случайной гибели"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.22
        scope: segment
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 300

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только о форс-мажорной оговорке.
        Не анализируй неустойку, расторжение, цену, качество или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. force_majeure_status — "defined" если форс-мажорная оговорка прямо предусмотрена, иначе "not_defined".
        2. force_majeure_details — формулировка форс-мажорной оговорки.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы закона вместо отсутствующих условий.
        - Не путай общую ответственность и форс-мажор.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "force_majeure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус форс-мажорной оговорки."
          required: true
        - name: "force_majeure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Форс-мажор"
          description: "Формулировка форс-мажорной оговорки."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Споры, претензионный порядок
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_resolution_and_governing_law
    name: "Претензионный порядок разрешения споров"
    description: >
      Фактографическая проверка наличия условий о претензионном порядке, сроках
      ответа на претензию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "спор"
        - "претензия"
        - "претензионный порядок"
        - "досудебный порядок"
        - "направление претензии"
        - "ответ на претензию"
        - "медиация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионн[ый]+\\s+поряд"
        - "(?i)досудебн[ый]+\\s+(?:поряд|урегулирован)"
        - "(?i)в\\s+течение\\s+\\d+\\s+(?:дн|рабоч|календар).{0,20}(?:претензи|ответ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: претензионный порядок разрешения споров.

        Нормативный ориентир:
        - ст. 4 АПК РФ
        - ст. 131–132 ГПК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли претензионный / досудебный порядок.
        2. Есть ли срок ответа на претензию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Не цитируй закон в evidence.
        9. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Все споры, возникающие в связи с исполнением настоящего договора, подлежат
        урегулированию путём направления письменной претензии. Сторона, получившая претензию,
        обязана дать письменный ответ в течение 10 рабочих дней с даты её получения."

        Ответ:
        {
          "pretrial_status": "defined",
          "pretrial_details": "все споры подлежат урегулированию путём направления письменной претензии",
          "claim_response_deadline_status": "defined",
          "claim_response_deadline_details": "10 рабочих дней с даты получения претензии",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Все споры, возникающие в связи с исполнением настоящего договора, подлежат урегулированию путём направления письменной претензии. Сторона, получившая претензию, обязана дать письменный ответ в течение 10 рабочих дней с даты её получения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились разрешать все разногласия в соответствии с законодательством
        Российской Федерации."

        Ответ:
        {
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "claim_response_deadline_status": "not_defined",
          "claim_response_deadline_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о претензионном / досудебном порядке.
        2. Есть ли прямая цитата о сроке ответа на претензию.
        3. Если прямой цитаты нет — верни "not_defined" и "Данные не определены".
        4. Не используй закон вместо текста договора.
        5. Убедись, что evidence содержит только текст договора.
        6. Убедись, что значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Данные не определены'>",
          "claim_response_deadline_status": "<defined / not_defined>",
          "claim_response_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разрешение споров претензионный порядок досудебный порядок урегулирование споров направление претензии ответ на претензию"
      preferred_unit_types:
        - dispute_resolution
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "претензия по качеству"
        - "претензии по недостаткам"
        - "претензии к товару"
        - "гарантийный срок"
        - "комплектность"
        - "неустойка"
        - "расторжение"
        - "ответственность сторон"
        - "право собственности"
        - "риск случайной гибели"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.25
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только о претензионном порядке и сроке ответа на претензию.
        Не анализируй орган разрешения споров, применимое право, ответственность, цену или передачу товара.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. pretrial_status — "defined" если в договоре прямо предусмотрен претензионный / досудебный порядок, иначе "not_defined".
        2. pretrial_details — формулировка о претензионном порядке.
        3. claim_response_deadline_status — "defined" если прямо указан срок ответа на претензию, иначе "not_defined".
        4. claim_response_deadline_details — срок ответа на претензию.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы закона вместо отсутствующих условий.
        - Анализируй только претензионный / досудебный порядок и срок ответа на претензию.
        - Не извлекай орган разрешения споров и применимое право.
        - Не делай предположений.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "pretrial_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения претензионного порядка."
          required: true
        - name: "pretrial_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Претензионный порядок"
          description: "Условие о досудебном урегулировании споров."
          required: false
        - name: "claim_response_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока ответа на претензию."
          required: false
        - name: "claim_response_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок ответа на претензию"
          description: "Срок ответа на претензию."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим предоставить по {doc_names} подтверждающие документы на подписантов 
      от Покупателя и Продавца (устав, доверенность, приказ), подтверждающие их полномочия 
      на подписание документа, а также полные реквизиты сторон (если они не определены в тексте).
    addressee: "Обе стороны"

  subject_price_payment:
    text: >
      В связи с отсутствием существенных условий в {doc_names}, просим предоставить: 
      (а) детальное описание предмета (товара), его состава и количества; 
      (б) точную цену за предмет (товар) либо механизм её определения; 
      (в) форму расчетов, сроки и порядок оплаты.
    addressee: "Продавец / Покупатель"

  delivery_and_transfer_docs:
    text: >
      Просим предоставить по {doc_names} детальное описание сроков и места поставки 
      предмета (товара), а также точный перечень принадлежностей и документов на товар 
      (паспорта, сертификаты, инструкции), подлежащих передаче вместе с товаром.
    addressee: "Продавец"

  title_risk_retention:
    text: >
      Просим предоставить по {doc_names} четкое описание момента перехода риска 
      случайной гибели и/или повреждения товара, момента перехода права собственности 
      на товар, а также их соотношения (совпадают или не совпадают).
    addressee: "Юридический советник"

  quality_warranty_acceptance:
