        4. Есть ли передаточные документы.
        5. Есть ли перечень принадлежностей.
        6. Есть ли перечень документов на товар.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
