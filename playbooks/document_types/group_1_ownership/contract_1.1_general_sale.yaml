type: contract_1.1_general_sale
name: "Договор купли-продажи (общая)"
version: 6.0
parent: class_1_transfer_of_ownership

description: |
  Базовая (родовая) конструкция купли-продажи для возмездной передачи права собственности
  на имущество по § 1 Главы 30 ГК РФ. Является parent/fallback-типом для группы договоров
  передачи имущества в собственность и применяется тогда, когда документ содержит признаки
  возмездного отчуждения вещи/товара, но не содержит достаточно определённых признаков
  специализированных видов купли-продажи или смежных специальных конструкций
  (розница, поставка, контрактация, энергоснабжение, недвижимость, мена, дарение, рента,
  цессия, продажа корпоративных прав, отступное, продажа предприятия и т.п.).
  Тип предназначен для разовых и неспециализированных сделок с движимым имуществом,
  когда применяются общие положения о купле-продаже без преобладания специального режима.

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 30 ГК РФ (ст. 454-491)"
  doc_types_supported:
    - "договор купли-продажи"
    - "договор купли-продажи товара"
    - "договор купли-продажи имущества"
    - "соглашение о продаже имущества"
    - "договор продажи движимого имущества"
    - "разовая купля-продажа"
    - "договор продажи оборудования"
    - "договор продажи техники"
    - "договор продажи ТМЦ"
    - "sale agreement"
    - "sale and purchase agreement"
    - "purchase agreement"
    - "contract of sale"
    - "goods sale agreement"
    - "bill of sale"

