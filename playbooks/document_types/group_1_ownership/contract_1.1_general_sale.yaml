  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны договора — реквизиты и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны договора: идентификация и полномочия подписантов"
    description: >
      Фактографическая проверка наличия в договоре данных о продавце и покупателе,
      их реквизитах, подписантах и документах, подтверждающих полномочия.
      Проверка предназначена для табличного вывода по нескольким договорам без оценки
      серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
