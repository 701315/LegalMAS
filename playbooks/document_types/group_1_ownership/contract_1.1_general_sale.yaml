        - "реквизиты"
        - "подписант"
        - "представитель"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inn_ogrn }}"
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)паспорт\\s*(?:серия|№|номер)?"
        - "(?i)юридическ[а-я]+\\s+адрес"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: идентификация сторон и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 434 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Покупатель и как Продавец.
        2. Какие реквизиты указаны у Покупателя и Продавца (ИНН, ОГРН, адрес).
        3. Кто подписывает договор от каждой стороны.
        4. На каком основании действует подписант от каждой стороны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined" строго по схеме.
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "seller_details_status": "defined",
          "seller_details_value": "ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "seller_signatory": "Генеральный директор Иванов И.И.",
          "seller_signatory_basis": "charter",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о продаже товара."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "seller_details_status": "not_defined",
          "seller_details_value": "Данные не определены",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в документе прямая цитата с указанием стороны.
        2. Есть ли в документе прямая цитата с указанием подписанта и основания полномочий.
        3. Если прямой цитаты нет — не додумывай, а верни "Данные не определены" / "not_defined".
        4. Убедись, что evidence содержит только текст договора.
        5. Убедись, что значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details_value": "<текст или 'Данные не определены'>",
          "seller_details_status": "<defined / not_defined>",
          "seller_details_value": "<текст или 'Данные не определены'>",
          "buyer_signatory": "<текст или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / other / not_defined>",
          "seller_signatory": "<текст или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
