  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Переход риска и права собственности
  # ──────────────────────────────────────────────────────────────────────────
  - id: title_risk_retention
    name: "Переход права собственности, риск случайной гибели и удержание титула"
    description: >
      Фактографическая проверка наличия в договоре момента перехода риска,
      момента перехода права собственности и оговорки об удержании титула.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право собственности"
        - "переход права"
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "с момента передачи"
        - "с момента оплаты"
        - "после полной оплаты"
        - "до полной оплаты"
        - "сохраняется за продавцом"
        - "несет риск"
        - "удержание права собственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+собственности.{0,50}переходит"
        - "(?i)переход\\s+права\\s+собственност[иьи]"
        - "(?i)риск\\s+случайн[а-я]+\\s+(?:гибел|поврежден)"
        - "(?i)до\\s+полной\\s+оплаты"
        - "(?i)сохраняется\\s+за\\s+продавцом"
        - "(?i)с\\s+момента\\s+(?:передач|оплат|подписани|получени)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: переход риска, переход права собственности и удержание титула.

        Нормативный ориентир:
        - ст. 223 ГК РФ
        - ст. 459 ГК РФ
        - ст. 491 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о моменте перехода риска случайной гибели / повреждения.
        2. Есть ли прямое условие о моменте перехода права собственности.
        3. Есть ли условие о сохранении права собственности за продавцом до оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай риски.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример:
        Фрагмент:
        "Право собственности на товар переходит к Покупателю после полной оплаты. Риск случайной гибели переходит с момента передачи товара Покупателю."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_delivery",
          "risk_transfer_details": "с момента передачи товара Покупателю",
          "title_transfer_status": "defined",
          "title_transfer_moment": "upon_payment",
          "title_transfer_details": "после полной оплаты",
          "retention_of_title_status": "yes",
          "title_risk_alignment": "different",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Право собственности на товар переходит к Покупателю после полной оплаты. Риск случайной гибели переходит с момента передачи товара Покупателю."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец передаёт товар Покупателю."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "title_transfer_status": "not_defined",
          "title_transfer_moment": "not_defined",
          "title_transfer_details": "Данные не определены",
          "retention_of_title_status": "not_defined",
          "title_risk_alignment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о переходе права собственности.
        2. Найди прямую цитату о переходе риска.
        3. Если прямой цитаты нет — не выводи момент по закону, а возвращай "not_defined".
        4. Если есть условие "до полной оплаты" / "после полной оплаты", проверь, указывает ли оно на удержание титула.
        5. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_delivery / upon_carrier / upon_payment / upon_act / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "title_transfer_status": "<defined / not_defined>",
          "title_transfer_moment": "<upon_delivery / upon_payment / upon_act / custom / not_defined>",
          "title_transfer_details": "<текст или 'Данные не определены'>",
          "retention_of_title_status": "<yes / no / not_defined>",
          "title_risk_alignment": "<same / different / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 620
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право собственности переход права собственности риск случайной гибели риск случайного повреждения с момента передачи с момента оплаты после полной оплаты до полной оплаты сохраняется за продавцом удержание права несет риск"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "неустойка"
        - "штраф"
        - "ответственность сторон"
        - "расторжение"
        - "претензия"
        - "качество"
        - "гарантия"
        - "залог"
        - "арест"
        - "свободен от прав"
      position_bias:
        preferred_range: [0.15, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения о моменте перехода риска случайной гибели, моменте перехода права собственности и наличии оговорки об удержании титула.
        Анализируй только эту тему.
        Не оценивай риски. Не анализируй последствия.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. risk_transfer_status — "defined" если момент перехода риска прямо указан, иначе "not_defined".
        2. risk_transfer_moment — upon_delivery / upon_carrier / upon_payment / upon_act / custom / not_defined.
        3. risk_transfer_details — точная формулировка о переходе риска из текста.
        4. title_transfer_status — "defined" если момент перехода права собственности прямо указан, иначе "not_defined".
        5. title_transfer_moment — upon_delivery / upon_payment / upon_act / custom / not_defined.
        6. title_transfer_details — точная формулировка о переходе права собственности из текста.
        7. retention_of_title_status:
           - "yes" — если из текста прямо следует, что право собственности переходит только после полной оплаты
             или прямо сказано, что оно сохраняется за продавцом до оплаты
           - "no" — только если в тексте прямо следует, что право собственности переходит до оплаты
             и удержание титула отсутствует
           - "not_defined" — если условие о праве собственности прямо не указано
        8. title_risk_alignment:
           - "same" — если risk_transfer_moment и title_transfer_moment оба определены и совпадают по смыслу
           - "different" — если risk_transfer_moment и title_transfer_moment оба определены и различаются
           - "not_defined" — если хотя бы один из двух моментов не определён

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй диспозитивные нормы закона вместо отсутствующих условий.
        - Если момент перехода не написан прямо — ставь "not_defined", не выводи его из контекста.
        - Не путай момент перехода права собственности с моментом перехода риска.
        - Не выводи retention_of_title_status = "yes" только из факта наличия оплаты, если в тексте нет прямой связи оплаты с переходом права собственности.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения момента перехода риска."
          required: true
        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined"]
          description: "Момент перехода риска случайной гибели."
          required: false
        - name: "risk_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Переход риска"
          description: "Формулировка о переходе риска случайной гибели."
          required: false
        - name: "title_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения момента перехода права собственности."
          required: true
        - name: "title_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_delivery", "upon_payment", "upon_act", "custom", "not_defined"]
          description: "Момент перехода права собственности."
          required: false
        - name: "title_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Переход права собственности"
          description: "Формулировка о переходе права собственности."
          required: false
        - name: "retention_of_title_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие оговорки об удержании титула до оплаты."
          required: false
        - name: "title_risk_alignment"
          type: "string"
          presentation: "signal"
          allowed_values: ["same", "different", "not_defined"]
          description: "Совпадение моментов перехода риска и права собственности."
          required: false
      store_payload: true

