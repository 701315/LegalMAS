          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Неустойка и санкции
  # ──────────────────────────────────────────────────────────────────────────
  - id: liability_sanctions
    name: "Неустойка и санкции за просрочку исполнения"
    description: >
      Фактографическая проверка наличия в договоре специальных санкций
      за просрочку передачи товара продавцом и просрочку оплаты покупателем.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность"
        - "неустойка"
        - "пени"
        - "штраф"
        - "просрочка"
        - "просрочка передачи"
        - "просрочка оплаты"
        - "убытки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк[аи]|пен[яиь]|штраф"
        - "(?i)просрочк[аи]\\s+(?:передач|оплат)"
        - "(?i)\\d+\\s*%?\\s*(?:в\\s+день|за\\s+каждый\\s+день|годовых)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества.
        Проверяется только один вопрос: специальные санкции за просрочку исполнения.

        Нормативный ориентир:
        - ст. 393-395 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли неустойка/штраф за просрочку передачи товара продавцом.
        2. Есть ли неустойка/штраф за просрочку оплаты покупателем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Общая фраза "стороны несут ответственность по закону" не считается специальной санкцией.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку передачи товара Продавец уплачивает пени в размере 0,1% от цены товара за каждый день просрочки. За просрочку оплаты Покупатель уплачивает 0,05% за каждый день просрочки."

        Ответ:
        {
          "seller_penalty_status": "defined",
          "seller_penalty_details": "0,1% от цены товара за каждый день просрочки",
          "buyer_penalty_status": "defined",
          "buyer_penalty_details": "0,05% за каждый день просрочки оплаты",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку передачи товара Продавец уплачивает пени в размере 0,1% от цены товара за каждый день просрочки. За просрочку оплаты Покупатель уплачивает 0,05% за каждый день просрочки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "seller_penalty_status": "not_defined",
          "seller_penalty_details": "Данные не определены",
          "buyer_penalty_status": "not_defined",
          "buyer_penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая санкция за просрочку передачи товара продавцом.
        2. Есть ли прямая санкция за просрочку оплаты покупателем.
        3. Не путай общую ответственность со специальной неустойкой.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_penalty_status": "<defined / not_defined>",
          "seller_penalty_details": "<текст или 'Данные не определены'>",
          "buyer_penalty_status": "<defined / not_defined>",
          "buyer_penalty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность неустойка пени штраф просрочка передачи товара просрочка оплаты покупателя продавца"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "расторжение"
        - "односторонний отказ"
        - "возврат товара"
        - "возврат денежных средств"
        - "форс-мажор"
        - "претензионный порядок"
        - "качество товара"
        - "право собственности"
        - "риск случайной гибели"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только о специальных санкциях:
        - продавца за просрочку передачи товара
        - покупателя за просрочку оплаты
        Не анализируй расторжение, возвраты, форс-мажор или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. seller_penalty_status — "defined" если неустойка/штраф продавца за просрочку передачи товара прямо указаны, иначе "not_defined".
        2. seller_penalty_details — размер и условия неустойки продавца.
        3. buyer_penalty_status — "defined" если неустойка/штраф покупателя за просрочку оплаты прямо указаны, иначе "not_defined".
        4. buyer_penalty_details — размер и условия неустойки покупателя.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - Общая фраза об ответственности по закону не является основанием для "defined".
        - Не смешивай санкцию продавца и санкцию покупателя.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения неустойки продавца."
          required: true
        - name: "seller_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Неустойка продавца"
          description: "Неустойка за просрочку передачи товара продавцом."
          required: true
        - name: "buyer_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения неустойки покупателя."
          required: true
        - name: "buyer_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Неустойка покупателя"
          description: "Неустойка за просрочку оплаты покупателем."
          required: true
      store_payload: true

