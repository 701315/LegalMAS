  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны договора — реквизиты и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны договора: идентификация и полномочия подписантов"
    description: >
      Фактографическая проверка наличия в договоре данных о продавце и покупателе,
      их идентифицирующих сведениях (включая ИНН, ОГРН, ОГРНИП, паспортные данные,
      если они прямо указаны), подписантах и документах или иных основаниях,
      подтверждающих полномочия. Проверка предназначена для табличного вывода
      по нескольким договорам без оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуемый"
        - "именуемая"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "приказ"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "КПП"
        - "паспорт"
        - "паспортные данные"
        - "адрес"
        - "реквизиты"
        - "подписант"
        - "представитель"
        - "индивидуальный предприниматель"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inn_ogrn }}"
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)паспорт\\s*(?:серия|№|номер)?"
        - "(?i)юридическ[а-я]+\\s+адрес"
        - "(?i)ОГРНИП"
        - "(?i)индивидуальн[а-я]+\\s+предпринимател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: идентификация сторон и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 434 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.
        - Сторонами могут быть юрлица, ИП и физические лица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Покупатель и как Продавец.
        2. Какие идентифицирующие сведения указаны у Покупателя и Продавца:
           - для юрлица: наименование, ИНН, ОГРН;
           - для ИП: статус ИП, ФИО, ИНН, ОГРНИП;
           - для физлица: ФИО, паспортные данные;
           - адрес указывай только если он нужен для краткой идентификации и прямо приведён.
        3. Кто подписывает договор от каждой стороны.
        4. На каком основании действует подписант от каждой стороны.
        5. Кратко сформируй user-facing значение основания полномочий для табличного вывода.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        3. Игнорируй нерелевантные фрагменты.
        4. Не смешивай сведения о Покупателе и Продавце.
        5. Если данные прямо отсутствуют — возвращай "Данные не определены" или "not_defined" строго по схеме.
        6. Если данные в тексте есть, но они противоречивы, неоднозначны или их нельзя надёжно привязать к стороне — возвращай "Не удалось определить", а в enum/status-полях используй "not_defined", если иное не предусмотрено схемой.
        7. Если прямо указано только наименование стороны, только ФИО стороны или только статус ИП + ФИО, этого достаточно для статуса "defined".
        8. Не используй "None", "null" или пустые строки. "not_defined" используй только в тех полях, где это прямо предусмотрено схемой.
        9. Для buyer_signatory_basis и seller_signatory_basis используй только:
           - "charter"
           - "poa"
           - "order"
           - "other"
           - "not_defined"
        10. Если физлицо или ИП подписывает договор лично и это прямо следует из текста, используй:
            - basis: "other"
            - basis_display: "Подписывает лично"
        11. В evidence включай только цитаты из договора.
        12. Не цитируй закон в evidence.
        13. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "seller_details_status": "defined",
          "seller_details_value": "ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "buyer_signatory_basis_display": "Данные не определены",
          "seller_signatory": "Генеральный директор Иванов И.И.",
          "seller_signatory_basis": "charter",
          "seller_signatory_basis_display": "Устав",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Покупатель: Иванов Иван Иванович, паспорт серия 45 01 №123456, выдан 01.01.2018.
        Продавец: Петров Петр Петрович, паспорт серия 45 02 №654321, выдан 02.02.2019."

        Ответ:
        {
          "buyer_details_status": "defined",
          "buyer_details_value": "Иванов Иван Иванович, паспорт серия 45 01 №123456",
          "seller_details_status": "defined",
          "seller_details_value": "Петров Петр Петрович, паспорт серия 45 02 №654321",
          "buyer_signatory": "Иванов Иван Иванович",
          "buyer_signatory_basis": "other",
          "buyer_signatory_basis_display": "Подписывает лично",
          "seller_signatory": "Петров Петр Петрович",
          "seller_signatory_basis": "other",
          "seller_signatory_basis_display": "Подписывает лично",
          "evidence": [
            {
              "clause_ref": "Реквизиты сторон",
              "quote": "Покупатель: Иванов Иван Иванович, паспорт серия 45 01 №123456, выдан 01.01.2018. Продавец: Петров Петр Петрович, паспорт серия 45 02 №654321, выдан 02.02.2019."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Стороны договорились о продаже товара."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "seller_details_status": "not_defined",
          "seller_details_value": "Данные не определены",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "buyer_signatory_basis_display": "Данные не определены",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "seller_signatory_basis_display": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в документе прямая цитата с указанием Покупателя и/или Продавца.
        2. Есть ли в документе прямая цитата с указанием подписанта и основания полномочий.
        3. Если прямой цитаты нет или привязка к стороне ненадёжна — не додумывай.
        4. Если фрагменты противоречат друг другу и противоречие нельзя разрешить по тексту — верни "Не удалось определить".
        5. Убедись, что evidence содержит только текст договора.
        6. Убедись, что значения enum-полей соответствуют допустимому словарю.
        7. Убедись, что ответ — это один валидный JSON-объект.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details_value": "<краткий текст или 'Данные не определены' / 'Не удалось определить'>",
          "seller_details_status": "<defined / not_defined>",
          "seller_details_value": "<краткий текст или 'Данные не определены' / 'Не удалось определить'>",
          "buyer_signatory": "<текст или 'Данные не определены' / 'Не удалось определить'>",
          "buyer_signatory_basis": "<charter / poa / order / other / not_defined>",
          "buyer_signatory_basis_display": "<Устав / Доверенность / Доверенность №... от ... / Приказ / Подписывает лично / Иное основание / Данные не определены / Не удалось определить>",
          "seller_signatory": "<текст или 'Данные не определены' / 'Не удалось определить'>",
          "seller_signatory_basis": "<charter / poa / order / other / not_defined>",
          "seller_signatory_basis_display": "<Устав / Доверенность / Доверенность №... от ... / Приказ / Подписывает лично / Иное основание / Данные не определены / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "продавец покупатель стороны договора именуемый в лице действующего на основании устава доверенности приказа ИНН ОГРН ОГРНИП КПП реквизиты подписант представитель полномочия паспорт паспортные данные индивидуальный предприниматель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "понимается как"
        - "термин"
        - "качество"
        - "гарантия"
        - "неустойка"
        - "расторжение"
        - "претензия"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.4
        scope: auto
      retrieval_profile: "party_identification_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора:
        1) идентификационные данные Покупателя и Продавца,
        2) сведения о подписантах,
        3) основания полномочий подписантов,
        4) краткие user-facing значения для отображения в таблице DD Grid.
        Анализируй только текст договора. Не оценивай риски. Не подставляй выводы из закона или обычной практики.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. buyer_details_status:
           - "defined" — если Покупатель прямо идентифицируется по тексту хотя бы по наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если Покупатель прямо не идентифицируется или его нельзя надёжно определить.

        2. buyer_details_value:
           Краткая идентификация Покупателя на русском языке:
           - для юрлица: наименование + ИНН + ОГРН, если прямо указаны;
           - для ИП: ИП + ФИО + ИНН + ОГРНИП, если прямо указаны;
           - для физлица: ФИО + паспортные данные, если прямо указаны.
           Не включай банковские реквизиты, расчётный счёт, корреспондентский счёт, БИК и иные лишние данные.
           Если данных нет — "Данные не определены".
           Если данные противоречивы или их нельзя надёжно привязать к Покупателю — "Не удалось определить".

        3. seller_details_status:
           - "defined" — если Продавец прямо идентифицируется по тексту хотя бы по наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если Продавец прямо не идентифицируется или его нельзя надёжно определить.

        4. seller_details_value:
           Краткая идентификация Продавца по тем же правилам, что и для Покупателя.
           Если данных нет — "Данные не определены".
           Если данные противоречивы или их нельзя надёжно привязать к Продавцу — "Не удалось определить".

        5. buyer_signatory:
           ФИО и должность лица, которое подписывает договор от Покупателя.
           Если договор прямо подписывает сам Покупатель-физлицо или сам ИП, укажи ФИО этого лица.
           Если данных нет — "Данные не определены".
           Если данные противоречивы или нельзя надёжно определить подписанта — "Не удалось определить".

        6. buyer_signatory_basis:
           Используй только одно из значений:
           - "charter" — если прямо указано "на основании устава";
           - "poa" — если прямо указано "по доверенности" или "на основании доверенности";
           - "order" — если прямо указано "на основании приказа";
           - "other" — если прямо указано иное основание полномочий, включая случай, когда физлицо или ИП подписывает договор лично;
           - "not_defined" — если основание прямо не указано или его нельзя надёжно определить.

        7. buyer_signatory_basis_display:
           User-facing значение на русском языке:
           - "Устав" — если basis = "charter";
           - "Доверенность" — если basis = "poa" и в тексте не указаны номер и дата доверенности;
           - "Доверенность №... от ..." — если basis = "poa" и в тексте прямо указаны номер и/или дата доверенности
             (используй реквизиты из текста, например: "Доверенность №15 от 01.03.2024");
           - "Приказ" — если basis = "order" и в тексте не указаны номер и дата приказа;
           - "Приказ №... от ..." — если basis = "order" и в тексте прямо указаны номер и/или дата приказа;
           - "Подписывает лично" — если физлицо или ИП прямо подписывает договор от своего имени;
           - краткое русское наименование иного конкретного основания, если оно прямо названо в тексте
             (например: "Решение единственного участника", "Положение о филиале");
           - "Иное основание" — если иное основание прямо указано, но кратко и надёжно сформулировать его нельзя;
           - "Данные не определены" — если основание отсутствует;
           - "Не удалось определить" — если по фрагментам есть противоречие или неоднозначность.

        8. seller_signatory:
           ФИО и должность лица, которое подписывает договор от Продавца.
           Если договор прямо подписывает сам Продавец-физлицо или сам ИП, укажи ФИО этого лица.
           Если данных нет — "Данные не определены".
           Если данные противоречивы или нельзя надёжно определить подписанта — "Не удалось определить".

        9. seller_signatory_basis:
           Используй только одно из значений:
           - "charter"
           - "poa"
           - "order"
           - "other"
           - "not_defined"
           по тем же правилам, что и для Покупателя.

        10. seller_signatory_basis_display:
            User-facing значение на русском языке по тем же правилам, что и для Покупателя:
            - "Устав";
            - "Доверенность";
            - "Доверенность №... от ..." — если в тексте прямо указаны номер и/или дата доверенности;
            - "Приказ";
            - "Приказ №... от ..." — если в тексте прямо указаны номер и/или дата приказа;
            - "Подписывает лично";
            - краткое русское наименование иного конкретного основания;
            - "Иное основание";
            - "Данные не определены";
            - "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не делай предположений по типовой структуре договора.
        - Не смешивай сведения о Покупателе и Продавце.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, не выбирай один из вариантов: верни "Не удалось определить", а для status/basis enum используй "not_defined".
        - Если в тексте есть только обозначения "Покупатель" / "Продавец" без идентифицирующих данных, это "not_defined".
        - Если прямо указано только наименование юрлица, только ФИО физлица или только статус ИП + ФИО, этого достаточно для статуса "defined".
        - Если основание полномочий не указано прямо, не выводи его из должности или из закона.
        - Если физлицо или ИП подписывает договор лично и это прямо видно из текста, используй basis = "other" и basis_display = "Подписывает лично".
        - Если в тексте прямо указаны номер и/или дата доверенности или приказа — включи их в basis_display.
        - Если иное основание полномочий прямо названо в тексте и его можно кратко сформулировать на русском языке — используй это наименование в basis_display вместо "Иное основание".
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 10 ключей, перечисленных в task. Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Все свободные текстовые поля заполняй на русском языке.
        - Для enum-полей используй только допустимые значения.
        - Для полей buyer_signatory и seller_signatory при отсутствии данных всегда возвращай
          "Данные не определены" — даже если поле не является обязательным.
        - Для полей buyer_signatory_basis_display и seller_signatory_basis_display при отсутствии
          данных всегда возвращай "Данные не определены" — даже если поле не является обязательным.
        </output_expectations>

      fields:
        - name: "buyer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения Покупателя. Внутреннее enum-поле."
          required: true

        - name: "buyer_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Покупатель"
          description: >
            Краткая идентификация Покупателя: наименование/ФИО и ИНН, ОГРН, ОГРНИП
            или паспортные данные, если они прямо указаны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "seller_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения Продавца. Внутреннее enum-поле."
          required: true

        - name: "seller_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Продавец"
          description: >
            Краткая идентификация Продавца: наименование/ФИО и ИНН, ОГРН, ОГРНИП
            или паспортные данные, если они прямо указаны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "buyer_signatory"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подписант покупателя"
          description: >
            Лицо, подписывающее договор от Покупателя: ФИО и должность, если прямо указаны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "buyer_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение основания полномочий подписанта Покупателя."
          required: false

        - name: "buyer_signatory_basis_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Основание полномочий покупателя"
          description: >
            User-facing основание полномочий подписанта Покупателя.
            Примеры: "Устав", "Доверенность №15 от 01.03.2024", "Приказ №3 от 10.01.2024",
            "Подписывает лично", "Решение единственного участника", "Иное основание".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "seller_signatory"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Подписант продавца"
          description: >
            Лицо, подписывающее договор от Продавца: ФИО и должность, если прямо указаны.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

        - name: "seller_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение основания полномочий подписанта Продавца."
          required: false

        - name: "seller_signatory_basis_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Основание полномочий продавца"
          description: >
            User-facing основание полномочий подписанта Продавца.
            Примеры: "Устав", "Доверенность №15 от 01.03.2024", "Приказ №3 от 10.01.2024",
            "Подписывает лично", "Решение единственного участника", "Иное основание".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет, количество, цена
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_quantity_price
    name: "Предмет договора, количество и цена товара"
    description: >
      Фактографическая проверка наличия в договоре предмета, состава/количества товара
      и цены. Результат предназначен для быстрой табличной сверки нескольких договоров
      без правовой оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет договора"
        - "товар"
        - "имущество"
        - "наименование"
        - "количество"
        - "объем"
        - "цена"
        - "стоимость"
        - "спецификация"
        - "передает в собственность"
        - "продавец обязуется передать"
      keyword_mode: "any"
      regex_patterns:
        - "{{ quantity_units }}"
        - "{{ money_amount }}"
        - "(?i)предмет\\s+договор"
        - "(?i)наименовани[еяю]\\s+товар"
        - "(?i)передает\\s+в\\s+собственност[ьи]"
        - "(?i)цен[аеуой]\\s+[\\d\\.\\s]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: предмет договора, количество товара и цена.

        Нормативный ориентир:
        - ст. 455 ГК РФ
        - ст. 465 ГК РФ
        - ст. 424 ГК РФ
        - ст. 485 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли описание предмета (товара).
        2. Есть ли состав/количество товара.
        3. Есть ли цена товара.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если нужное условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет, возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_defined", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец обязуется передать Покупателю оборудование в количестве 5 единиц по цене 1 250 000 рублей."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "оборудование",
          "quantity_status": "defined",
          "quantity_details": "5 единиц",
          "price_status": "defined",
          "price_details": "1 250 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец обязуется передать Покупателю оборудование в количестве 5 единиц по цене 1 250 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны согласуют характеристики товара дополнительно."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о предмете.
        2. Есть ли прямая формулировка о количестве.
        3. Есть ли прямая формулировка о цене.
        4. Если прямого текста нет — верни "not_defined" и "Данные не определены".
        5. Не используй закон вместо текста договора.
        6. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subject_status": "<defined / not_defined>",
          "subject_details": "<текст или 'Данные не определены'>",
          "quantity_status": "<defined / not_defined>",
          "quantity_details": "<текст или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора товар имущество наименование количество объем цена стоимость спецификация продавец обязуется передать передает в собственность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "оплата"
        - "предоплата"
        - "аванс"
        - "рассрочка"
        - "отсрочка"
        - "НДС"
        - "неустойка"
        - "расторжение"
        - "качество"
        - "приемка"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.14
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только о предмете, количестве и цене товара.
        Не анализируй порядок оплаты, НДС, просрочку оплаты, санкции, качество, приемку, поставку и иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. subject_status:
           - "defined" — если в тексте прямо указан товар, его наименование, вид, номенклатура
             или прямо указано, что предмет определяется по спецификации, приложению, заявке
             или иному названному документу;
           - "not_defined" — если предмет прямо не определён, указан слишком абстрактно
             или его нельзя надёжно определить.

        2. subject_details:
           Краткое user-facing описание предмета на русском языке.
           Правила:
           - если товар прямо назван, укажи его кратко: например, "оборудование",
             "автозапчасти", "станок токарный";
           - не копируй весь длинный абзац, пиши кратко, не более 1–2 коротких фраз;
           - если предмет прямо определяется через другой документ, это не отсутствие регулирования;
             верни понятную формулировку, например:
             "Определяется Спецификацией №1",
             "Номенклатура по заявкам Покупателя",
             "Согласно Приложению №2";
           - если в тексте есть только слова "товар", "имущество", "продукция" без конкретизации
             и без ссылки на документ, верни "Данные не определены";
           - если данные противоречивы или их нельзя надёжно определить, верни
             "Не удалось определить".

        3. quantity_status:
           - "defined" — если количество прямо указано числом, единицами измерения
             или прямо сказано, что количество определяется по спецификации, заявкам,
             приложению или иному названному документу;
           - "not_defined" — если количество прямо не определено или его нельзя
             надёжно определить.

        4. quantity_details:
           Краткое user-facing описание количества товара на русском языке.
           Правила:
           - если количество прямо указано, верни его кратко, например:
             "5 единиц", "120 кг", "3 партии";
           - если количество определяется через другой документ или механизм,
             верни понятную формулировку, например:
             "По заявкам Покупателя",
             "Определяется Спецификацией №1",
             "Согласно Приложению №2";
           - если данных нет — "Данные не определены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. price_status:
           - "defined" — если цена прямо указана суммой, ценой за единицу
             или прямо сказано, что цена определяется по спецификации, прайс-листу,
             приложению, заявке или иному названному документу;
           - "not_defined" — если цена прямо не определена или её нельзя
             надёжно определить.

        6. price_details:
           Краткое user-facing описание цены на русском языке.
           Правила:
           - если цена прямо указана, верни её кратко, например:
             "1 250 000 рублей", "25 000 руб./ед.";
           - если прямо указаны и общая цена, и цена за единицу, можешь указать оба значения
             в краткой форме, если это помещается в один компактный столбец;
           - если цена определяется через другой документ или механизм, это не отсутствие
             регулирования; верни понятную формулировку, например:
             "Согласно прайс-листу Продавца",
             "Определяется Спецификацией №1",
             "По согласованным заявкам";
           - не включай в price_details сведения только о НДС, порядке оплаты,
             предоплате, отсрочке, рассрочке или штрафах, если сама цена не названа;
           - если данных нет — "Данные не определены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        Если данные отсутствуют в тексте:
        - статус: "not_defined"
        - текстовое поле: "Данные не определены"

        Если данные есть, но противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус: "not_defined"
        - текстовое поле: "Не удалось определить"
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай порядок оплаты, НДС, аванс, предоплату, отсрочку, рассрочку, санкции,
          качество, приемку, поставку и иные нерелевантные темы.
        - Если параметр прямо определяется через спецификацию, приложение, заявку, прайс-лист
          или иной названный документ, и это прямо видно из текста договора, считай такой параметр
          определённым и отрази это в user-facing поле.
        - Если в тексте нет надёжной привязки к предмету, количеству или цене, не додумывай.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту,
          не выбирай один из вариантов: верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только "Данные не определены".
        - Для текстовых полей при неоднозначности или конфликте используй только "Не удалось определить".
        </output_expectations>
      fields:
        - name: "subject_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения предмета договора. Внутреннее enum-поле."
          required: true

        - name: "subject_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Предмет"
          description: >
            Краткое наименование товара или user-facing указание на способ его определения
            по договору, например: "оборудование", "станок токарный",
            "Определяется Спецификацией №1", "Номенклатура по заявкам Покупателя".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "quantity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения количества. Внутреннее enum-поле."
          required: true

        - name: "quantity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Количество"
          description: >
            Количество товара или user-facing указание на способ его определения
            по договору, например: "5 единиц", "120 кг", "По заявкам Покупателя",
            "Определяется Спецификацией №1".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения цены. Внутреннее enum-поле."
          required: true

        - name: "price_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Цена"
          description: >
            Цена товара, цена за единицу или user-facing указание на способ определения цены
            по договору, например: "1 250 000 рублей", "25 000 руб./ед.",
            "Согласно прайс-листу Продавца", "Определяется Спецификацией №1".
            Не включает порядок оплаты, НДС, аванс, отсрочку или санкции как самостоятельные значения.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Оплата
  # ──────────────────────────────────────────────────────────────────────────
  - id: payment_terms
    name: "Порядок оплаты, модель расчётов и НДС"
    description: >
      Фактографическая проверка наличия в договоре порядка оплаты, модели расчётов,
      указания на НДС и прямого упоминания последствий просрочки оплаты.
      Результат предназначен для быстрой табличной сверки нескольких договоров
      без правовой оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "порядок расчетов"
        - "предоплата"
        - "аванс"
        - "рассрочка"
        - "отсрочка"
        - "срок оплаты"
        - "НДС"
        - "без НДС"
        - "включая НДС"
        - "просрочка оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)оплат[аы]\\s.{0,40}(?:в\\s+течение|не\\s+позднее|до\\s+момента|после)"
        - "(?i)(предоплат|аванс|рассрочк|отсрочк)"
        - "(?i)НДС|без\\s+НДС"
        - "(?i)просрочк[аи]\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: порядок оплаты, модель расчётов и НДС.

        Нормативный ориентир:
        - ст. 424 ГК РФ
        - ст. 486-489 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок и сроки оплаты.
        2. Есть ли указание на модель оплаты.
        3. Есть ли указание на НДС.
        4. Есть ли прямое указание на последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Для статусных enum-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей, если данных нет — возвращай строго "Не установлено".
        6. Не используй "None", "null" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель перечисляет 100% стоимости товара в течение 5 рабочих дней
        с даты подписания договора, до момента отгрузки товара. Цена включает НДС 20%.
        За каждый день просрочки оплаты начисляется пеня в размере 0,1% от суммы долга."

        Ответ:
        {
          "payment_procedure_status": "defined",
          "payment_procedure_details": "100% стоимости в течение 5 рабочих дней с даты подписания, до отгрузки товара",
          "payment_model": "prepayment",
          "payment_model_display": "Предоплата",
          "vat_status": "defined",
          "vat_display": "Включая НДС 20%",
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_display": "Пеня 0,1% за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Покупатель перечисляет 100% стоимости товара в течение 5 рабочих дней с даты подписания договора, до момента отгрузки товара. Цена включает НДС 20%. За каждый день просрочки оплаты начисляется пеня в размере 0,1% от суммы долга."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Покупатель вносит аванс в размере 30% в течение 3 рабочих дней с даты подписания договора.
        Оставшиеся 70% оплачиваются в течение 5 рабочих дней с момента подписания товарной накладной.
        Цена указана без НДС. НДС не облагается."

        Ответ:
        {
          "payment_procedure_status": "defined",
          "payment_procedure_details": "аванс 30% в течение 3 рабочих дней с даты подписания; остаток 70% в течение 5 рабочих дней с момента подписания накладной",
          "payment_model": "mixed",
          "payment_model_display": "Смешанная модель (аванс + постоплата)",
          "vat_status": "defined",
          "vat_display": "Без НДС (не облагается)",
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_display": "Не установлены",
          "evidence": [
            {
              "clause_ref": "п. 2.1–2.2",
              "quote": "Покупатель вносит аванс в размере 30% в течение 3 рабочих дней с даты подписания договора. Оставшиеся 70% оплачиваются в течение 5 рабочих дней с момента подписания товарной накладной. Цена указана без НДС. НДС не облагается."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Оплата производится по выставленному Продавцом счёту. Стороны несут
        ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "payment_procedure_status": "defined",
          "payment_procedure_details": "По выставленному Продавцом счёту",
          "payment_model": "not_defined",
          "payment_model_display": "Не установлена",
          "vat_status": "not_defined",
          "vat_display": "Не указано",
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_display": "Не установлены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Оплата производится по выставленному Продавцом счёту. Стороны несут ответственность в соответствии с законодательством РФ."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Стороны согласуют расчёты дополнительно."

        Ответ:
        {
          "payment_procedure_status": "not_defined",
          "payment_procedure_details": "Не установлено",
          "payment_model": "not_defined",
          "payment_model_display": "Не установлена",
          "vat_status": "not_defined",
          "vat_display": "Не указано",
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_display": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о порядке оплаты.
        2. Есть ли прямое указание на то, что оплата производится до или после передачи товара,
           что позволяет надёжно определить модель оплаты.
        3. Есть ли прямое указание на НДС или его отсутствие.
        4. Есть ли прямое указание именно на последствия просрочки оплаты
           (не общая фраза об ответственности по закону).
        5. Если прямого текста нет — верни "not_defined" и соответствующее fallback-значение.
        6. Не используй закон вместо текста договора.
        7. Убедись, что ответ — один валидный JSON-объект без markdown.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_procedure_status": "<defined / not_defined>",
          "payment_procedure_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "payment_model": "<prepayment / postpayment / installments / mixed / not_defined>",
          "payment_model_display": "<Предоплата / Постоплата / Рассрочка / Смешанная модель (аванс + постоплата) / Не установлена / Не удалось определить>",
          "vat_status": "<defined / not_defined>",
          "vat_display": "<Включая НДС 20% / НДС сверх цены / Без НДС / Без НДС (не облагается) / Не указано / Не удалось определить>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "late_payment_consequences_display": "<краткое summary или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата порядок расчетов предоплата аванс рассрочка отсрочка срок оплаты НДС без НДС включая НДС просрочка оплаты"
      preferred_unit_types:
        - payment_term
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "качество"
        - "гарантия"
        - "приемка"
        - "право собственности"
        - "риск случайной гибели"
        - "арест"
        - "залог"
        - "расторжение"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.12
        scope: segment
      retrieval_profile: "payment_terms_check"
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения только
        о порядке оплаты, модели расчётов, НДС и наличии прямых последствий просрочки оплаты.
        Не анализируй предмет, количество, качество, приёмку, расторжение и иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. payment_procedure_status:
           - "defined" — если в тексте прямо указан порядок или срок оплаты, или прямо
             сказано, что оплата производится по счёту, спецификации, заявке, графику
             или иному названному документу;
           - "not_defined" — если порядок оплаты прямо не указан или его нельзя
             надёжно определить.

        2. payment_procedure_details:
           Краткое user-facing описание порядка и сроков оплаты на русском языке.
           Правила:
           - если порядок прямо указан, опиши кратко: сроки, условие начала отсчёта,
             валюта, если есть;
           - если оплата определяется через внешний документ или механизм, это не
             отсутствие регулирования; верни понятную формулировку, например:
             "По выставленному Продавцом счёту",
             "Согласно Графику платежей (Приложение №2)",
             "По заявкам Покупателя";
           - пиши кратко, не более 2–3 коротких фраз;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. payment_model:
           Используй только одно из значений:
           - "prepayment" — только если из текста прямо следует, что платёж вносится
             до передачи, отгрузки или поставки товара;
           - "postpayment" — только если из текста прямо следует, что платёж вносится
             после передачи, получения или приёмки товара, или после подписания
             передаточного документа;
           - "installments" — если оплата прямо разбита на части, этапы или платёжный
             график без элемента предоплаты;
           - "mixed" — если в тексте прямо сочетаются аванс/предоплата и последующая
             доплата после передачи товара;
           - "not_defined" — если модель оплаты прямо не следует из текста или её
             нельзя надёжно определить.
           Важно: одна только привязка срока оплаты к дате подписания договора
           без прямого указания на соотношение с передачей товара
           не является достаточным основанием для prepayment.

        4. payment_model_display:
           User-facing значение на русском языке:
           - "Предоплата" — для prepayment;
           - "Постоплата" — для postpayment;
           - "Рассрочка" — для installments;
           - "Смешанная модель (аванс + постоплата)" — для mixed;
           - "Не установлена" — для not_defined при отсутствии данных;
           - "Не удалось определить" — при противоречии или неоднозначности.

        5. vat_status:
           - "defined" — только если в тексте прямо есть одно из:
             "включая НДС", "НДС 20%", "НДС 10%", "без НДС", "НДС не облагается",
             "НДС сверх цены", "цена без учёта НДС" или аналогичная прямая формулировка;
           - "not_defined" — если прямого указания на НДС нет.
           Общая фраза "включая все налоги" без прямого упоминания НДС
           не является основанием для "defined".

        6. vat_display:
           User-facing значение на русском языке:
           - "Включая НДС 20%" — если цена включает НДС 20%;
           - "Включая НДС 10%" — если цена включает НДС 10%;
           - "НДС сверх цены" — если НДС начисляется сверх указанной цены;
           - "Без НДС" — если прямо указано "без НДС" или "цена без НДС";
           - "Без НДС (не облагается)" — если прямо указано, что товар не облагается НДС;
           - "Не указано" — если прямого указания на НДС нет;
           - "Не удалось определить" — если есть противоречие или неоднозначность.

        7. late_payment_consequences_status:
           - "defined" — только если в тексте прямо указаны последствия именно просрочки
             оплаты: пеня, неустойка, проценты, право приостановить поставку, право
             расторгнуть договор и т.п.;
           - "not_defined" — если прямых последствий просрочки оплаты в тексте нет.
           Важно: общая фраза вроде "Стороны несут ответственность в соответствии
           с законодательством РФ" без конкретизации последствий просрочки оплаты
           не является основанием для "defined".

        8. late_payment_consequences_display:
           Краткое user-facing summary последствий просрочки оплаты на русском языке.
           Правила:
           - если последствия прямо указаны, кратко опиши их (одна-две фразы),
             например:
             "Пеня 0,1% за каждый день просрочки",
             "Проценты по ст. 395 ГК РФ",
             "Право Продавца приостановить поставку",
             "Неустойка 0,5% в день; право расторгнуть договор";
           - если последствий нет — "Не установлены";
           - если данные противоречивы или нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о предмете, количестве, качестве, приёмке, гарантии,
          расторжении, форс-мажоре и иных нерелевантных темах.
        - Если параметр прямо определяется через счёт, спецификацию, приложение, заявку,
          график или иной названный документ и это прямо видно из текста, считай такой
          параметр определённым и отрази это в user-facing поле.
        - Одна только привязка срока оплаты к дате подписания договора без явного указания
          на соотношение с передачей товара не даёт основания для payment_model = "prepayment".
        - vat_status = "defined" только при прямом упоминании НДС или его отсутствия.
          Общие фразы о налогах без упоминания НДС не считаются.
        - late_payment_consequences_status = "defined" только при прямом указании последствий
          именно просрочки оплаты. Общая ссылка на закон без конкретизации не считается.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <output_expectations>
        - Верни ровно один JSON-объект.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Для payment_model используй только:
          "prepayment", "postpayment", "installments", "mixed", "not_defined".
        - Для текстовых полей при отсутствии данных используй:
          payment_procedure_details → "Не установлено"
          payment_model_display → "Не установлена"
          vat_display → "Не указано"
          late_payment_consequences_display → "Не установлены"
        - Для текстовых полей при неоднозначности или конфликте используй:
          "Не удалось определить".
        </output_expectations>

      fields:
        - name: "payment_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка оплаты. Внутреннее enum-поле."
          required: true

        - name: "payment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок оплаты"
          description: >
            Краткое описание порядка и сроков оплаты, или user-facing указание на способ
            их определения по договору, например: "100% в течение 5 рабочих дней с даты
            подписания, до отгрузки", "По выставленному Продавцом счёту",
            "Согласно Графику платежей (Приложение №2)".
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "payment_model"
          type: "string"
          presentation: "signal"
          allowed_values: ["prepayment", "postpayment", "installments", "mixed", "not_defined"]
          display_in_grid: false
          description: "Внутреннее enum-значение модели оплаты."
          required: true

        - name: "payment_model_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Модель оплаты"
          description: >
            User-facing модель расчётов по договору.
            Допустимые значения: "Предоплата", "Постоплата", "Рассрочка",
            "Смешанная модель (аванс + постоплата)".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "vat_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия прямого указания на НДС в договоре. Внутреннее enum-поле."
          required: true

        - name: "vat_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "НДС"
          description: >
            User-facing указание на НДС по договору.
            Примеры: "Включая НДС 20%", "НДС сверх цены", "Без НДС",
            "Без НДС (не облагается)".
            Fallback: "Не указано" / "Не удалось определить".
          required: true

        - name: "late_payment_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: >
            Статус наличия в договоре прямых последствий просрочки оплаты.
            Внутреннее enum-поле.
          required: true

        - name: "late_payment_consequences_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Последствия просрочки оплаты"
          description: >
            Краткое user-facing summary последствий просрочки оплаты, если они прямо
            указаны в договоре. Примеры: "Пеня 0,1% за каждый день просрочки",
            "Проценты по ст. 395 ГК РФ", "Право Продавца приостановить поставку".
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Передача товара, сроки передачи, принадлежности и документы
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_and_transfer_docs
    name: "Порядок передачи товара, передаточные документы и принадлежности"
    description: >
      Фактографическая проверка наличия условий о сроке передачи, месте передачи,
      способе передачи, передаточных документах, принадлежностях и документах на товар.
    triggers:
      any: ["delivery_included", "general_sale_subject"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доставка"
        - "самовывоз"
        - "отгрузка"
        - "передача товара"
        - "товарная накладная"
        - "универсальный передаточный документ"
        - "УПД"
        - "акт приема-передачи"
        - "место передачи"
        - "срок передачи"
        - "принадлежности"
        - "документы на товар"
        - "сертификат качества"
        - "паспорт изделия"
        - "инструкция"
        - "техническая документация"
        - "руководство пользователя"
        - "гарантийный талон"
        - "перевозчик"
        - "склад"
        - "спецификация"
        - "приложение"
        - "заявка"
        - "комплект поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк[аи]|самовывоз|отгрузк[аи]"
        - "(?i)акт\\s+(?:приема|приёма|передач)"
        - "(?i)товарн[ая]\\s+накладн"
        - "(?i)упд|универсальн[а-я]+\\s+передаточн"
        - "(?i)принадлежност[иь]\\s+товар"
        - "(?i)документ[ыов].*?(?:товар|издели)"
        - "(?i)спецификаци[еяю]|приложени[ея]|заявк[аи]"
        - "(?i)сертификат\\s+качеств"
        - "{{ date_pattern }}"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: передача товара, сроки передачи, принадлежности и документы.

        Нормативный ориентир:
        - ст. 456 ГК РФ
        - ст. 457 ГК РФ
        - ст. 458 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли срок передачи товара.
        2. Есть ли место передачи товара.
        3. Есть ли способ передачи (доставка, самовывоз, перевозчик).
        4. Есть ли передаточные документы.
        5. Есть ли перечень принадлежностей.
        6. Есть ли перечень документов на товар.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Для status/enum-полей, если условие не указано прямо — возвращай "not_defined".
        5. Для текстовых полей используй:
           - "Не установлен" / "Не установлено" / "Не установлены" — если данных нет;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. Если параметр прямо определяется по спецификации, приложению, заявке, графику поставки
           или иному названному документу, это не всегда отсутствие регулирования — отрази это
           в user-facing поле.
        7. Не используй "None", "null" или пустые строки.
        8. Не смешивай передаточные документы и документы на товар.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Передача товара осуществляется самовывозом со склада Продавца в срок до 15.07.2026.
        Передача оформляется товарной накладной и актом приема-передачи.
        Вместе с товаром передаются инструкция и паспорт изделия."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "До 15.07.2026",
          "delivery_mode": "pickup",
          "delivery_mode_display": "Самовывоз",
          "delivery_place_status": "defined",
          "delivery_place_details": "Со склада Продавца",
          "transfer_documents_status": "defined",
          "transfer_documents_details": "Товарная накладная и акт приема-передачи",
          "accessories_status": "not_defined",
          "accessories_details": "Не установлены",
          "product_documents_status": "defined",
          "product_documents_details": "Инструкция и паспорт изделия",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Передача товара осуществляется самовывозом со склада Продавца в срок до 15.07.2026. Передача оформляется товарной накладной и актом приема-передачи. Вместе с товаром передаются инструкция и паспорт изделия."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Срок поставки и адрес доставки определяются в заявках Покупателя.
        Комплект сопроводительных документов указывается в Спецификации №1."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "По заявкам Покупателя",
          "delivery_mode": "not_defined",
          "delivery_mode_display": "Не установлен",
          "delivery_place_status": "defined",
          "delivery_place_details": "По адресу, указанному в заявке",
          "transfer_documents_status": "not_defined",
          "transfer_documents_details": "Не установлены",
          "accessories_status": "not_defined",
          "accessories_details": "Не установлены",
          "product_documents_status": "defined",
          "product_documents_details": "Согласно Спецификации №1",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Срок поставки и адрес доставки определяются в заявках Покупателя. Комплект сопроводительных документов указывается в Спецификации №1."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Товар передается Покупателю."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Не установлен",
          "delivery_mode": "not_defined",
          "delivery_mode_display": "Не установлен",
          "delivery_place_status": "not_defined",
          "delivery_place_details": "Не установлено",
          "transfer_documents_status": "not_defined",
          "transfer_documents_details": "Не установлены",
          "accessories_status": "not_defined",
          "accessories_details": "Не установлены",
          "product_documents_status": "not_defined",
          "product_documents_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче товара.
        2. Убедись, что в ней прямо указан срок, место, способ передачи, документы или принадлежности.
        3. Если параметр определяется по спецификации, приложению, заявке или иному названному документу,
           отрази это как user-facing значение, а не как пустоту.
        4. Если данных нет — верни "not_defined" и соответствующее fallback-значение.
        5. Если данные противоречат друг другу и противоречие нельзя снять по тексту —
           верни "Не удалось определить", а в status/enum-полях используй "not_defined".
        6. Не подменяй отсутствие условия диспозитивной нормой закона.
        7. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delivery_term_status": "<defined / not_defined>",
          "delivery_term_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "delivery_mode": "<delivery / pickup / carrier / not_defined>",
          "delivery_mode_display": "<Доставка продавцом / Самовывоз / Через перевозчика / Не установлен / Не удалось определить>",
          "delivery_place_status": "<defined / not_defined>",
          "delivery_place_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "transfer_documents_status": "<defined / not_defined>",
          "transfer_documents_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "accessories_status": "<defined / not_defined>",
          "accessories_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "product_documents_status": "<defined / not_defined>",
          "product_documents_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача товара срок передачи место передачи доставка самовывоз перевозчик товарная накладная УПД универсальный передаточный документ акт приема-передачи принадлежности документы на товар сертификат качества паспорт изделия гарантийный талон склад отгрузка техническая документация спецификация приложение заявка комплект поставки"
      preferred_unit_types:
