          "completeness_details": "Данные не определены",
          "warranty_status": "defined",
          "warranty_details": "12 месяцев с даты передачи товара",
          "acceptance_status": "defined",
          "acceptance_details": "проверить товар в течение 3 рабочих дней",
          "claims_procedure_status": "defined",
          "claims_procedure_details": "направить претензию в письменной форме",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Товар должен соответствовать ГОСТ. Гарантийный срок составляет 12 месяцев с даты передачи товара."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую формулировку о качестве.
        2. Найди прямую формулировку о комплектности.
        3. Найди прямую формулировку о гарантии.
        4. Найди прямую формулировку о приемке.
        5. Найди прямую формулировку о претензиях.
        6. Если чего-то нет в тексте — верни "not_defined".
        7. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quality_status": "<defined / not_defined>",
          "quality_details": "<текст или 'Данные не определены'>",
          "completeness_status": "<defined / not_defined>",
          "completeness_details": "<текст или 'Данные не определены'>",
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<текст или 'Данные не определены'>",
          "acceptance_status": "<defined / not_defined>",
          "acceptance_details": "<текст или 'Данные не определены'>",
