  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны договора — реквизиты и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны договора: идентификация и полномочия подписантов"
    description: >
      Фактографическая проверка наличия в договоре данных о продавце и покупателе,
      их реквизитах, подписантах и документах, подтверждающих полномочия.
      Проверка предназначена для табличного вывода по нескольким договорам без оценки
      серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуемый"
        - "именуемая"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "ИНН"
        - "ОГРН"
        - "КПП"
        - "паспорт"
        - "адрес"
        - "реквизиты"
        - "подписант"
        - "представитель"
      keyword_mode: "any"
      regex_patterns:
        - "{{ inn_ogrn }}"
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)паспорт\\s*(?:серия|№|номер)?"
        - "(?i)юридическ[а-я]+\\s+адрес"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: идентификация сторон и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 434 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Покупатель и как Продавец.
        2. Есть ли у сторон реквизиты.
        3. Кто подписывает договор от каждой стороны.
        4. На каком основании действует подписант от каждой стороны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined" строго по схеме.
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details": "Данные не определены",
          "seller_details_status": "defined",
          "seller_details": "ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "seller_signatory": "Генеральный директор Иванов И.И.",
          "seller_signatory_basis": "charter",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец — ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о продаже товара."

        Ответ:
        {
          "buyer_details_status": "not_defined",
          "buyer_details": "Данные не определены",
          "seller_details_status": "not_defined",
          "seller_details": "Данные не определены",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в документе прямая цитата с указанием стороны.
        2. Есть ли в документе прямая цитата с указанием подписанта и основания полномочий.
        3. Если прямой цитаты нет — не додумывай, а верни "Данные не определены" / "not_defined".
        4. Убедись, что evidence содержит только текст договора.
        5. Убедись, что значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details": "<текст или 'Данные не определены'>",
          "seller_details_status": "<defined / not_defined>",
          "seller_details": "<текст или 'Данные не определены'>",
          "buyer_signatory": "<текст или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / other / not_defined>",
          "seller_signatory": "<текст или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "продавец"
        - "покупатель"
        - "именуемый"
        - "ИНН"
        - "ОГРН"
        - "устав"
        - "доверенность"
        - "подписант"
        - "реквизиты"
        - "адрес"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "buyer_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определен Покупатель и его реквизиты. Иначе верни 'not_defined'."
        - name: "buyer_details"
          type: "string"
          description: "Укажи Покупателя и его реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "seller_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определен Продавец и его реквизиты. Иначе верни 'not_defined'."
        - name: "seller_details"
          type: "string"
          description: "Укажи Продавца и его реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "buyer_signatory"
          type: "string"
          description: "Укажи, кто подписывает от имени Покупателя. Если данных нет, верни строго: 'Данные не определены'."
        - name: "buyer_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Покупателя: charter / poa / order / other. Если не указано, верни 'not_defined'."
        - name: "seller_signatory"
          type: "string"
          description: "Укажи, кто подписывает от имени Продавца. Если данных нет, верни строго: 'Данные не определены'."
        - name: "seller_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Продавца: charter / poa / order / other. Если не указано, верни 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет, количество, цена и порядок расчетов
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_price_payment
    name: "Предмет договора, количество, цена и порядок оплаты"
    description: >
      Фактографическая проверка наличия в договоре предмета, состава/количества товара,
      цены и порядка расчетов. Результат предназначен для быстрой табличной сверки
      нескольких договоров без правовой оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет договора"
        - "товар"
        - "имущество"
        - "наименование"
        - "количество"
        - "объем"
        - "цена"
        - "стоимость"
        - "оплата"
        - "предоплата"
        - "аванс"
        - "рассрочка"
        - "отсрочка"
        - "рублей"
        - "спецификация"
        - "передает в собственность"
        - "продавец обязуется передать"
      keyword_mode: "any"
      regex_patterns:
        - "{{ quantity_units }}"
        - "{{ money_amount }}"
        - "(?i)предмет\\s+договор"
        - "(?i)наименовани[еяю]\\s+товар"
        - "(?i)передает\\s+в\\s+собственност[ьи]"
        - "(?i)цен[аеуой]\\s+[\\d\\.\\s]"
        - "(?i)оплат[аы]\\s.{0,30}(?:в\\s+течение|не\\s+позднее|до\\s+момента)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: предмет договора, количество товара, цена и порядок расчетов.

        Нормативный ориентир:
        - ст. 455 ГК РФ
        - ст. 465 ГК РФ
        - ст. 424 ГК РФ
        - ст. 485 ГК РФ
        - ст. 486-489 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли описание предмета (товара).
        2. Есть ли состав/количество товара.
        3. Есть ли цена товара.
        4. Есть ли порядок расчётов.
        5. Есть ли указание на модель оплаты (предоплата, постоплата, рассрочка и т.д.).
        6. Есть ли указание на НДС.
        7. Есть ли указание на последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если нужное условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет, возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец обязуется передать Покупателю оборудование в количестве 5 единиц по цене 1 250 000 рублей. Оплата производится в течение 5 рабочих дней с даты подписания договора."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "оборудование",
          "quantity_status": "defined",
          "quantity_details": "5 единиц",
          "price_status": "defined",
          "price_details": "1 250 000 рублей",
          "payment_procedure_status": "defined",
          "payment_procedure_details": "оплата производится в течение 5 рабочих дней с даты подписания договора",
          "payment_model": "postpayment",
          "vat_status": "not_defined",
          "late_payment_consequences_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец обязуется передать Покупателю оборудование в количестве 5 единиц по цене 1 250 000 рублей."
            },
            {
              "clause_ref": "п. 2.1",
              "quote": "Оплата производится в течение 5 рабочих дней с даты подписания договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны согласуют условия поставки и расчетов дополнительно."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "payment_procedure_status": "not_defined",
          "payment_procedure_details": "Данные не определены",
          "payment_model": "not_defined",
          "vat_status": "not_defined",
          "late_payment_consequences_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая формулировка о предмете.
        2. Есть ли прямая формулировка о количестве.
        3. Есть ли прямая формулировка о цене.
        4. Есть ли прямая формулировка о порядке оплаты.
        5. Если прямого текста нет — верни "not_defined" и "Данные не определены".
        6. Не используй закон вместо текста договора.
        7. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subject_status": "<defined / not_defined>",
          "subject_details": "<текст или 'Данные не определены'>",
          "quantity_status": "<defined / not_defined>",
          "quantity_details": "<текст или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "payment_procedure_status": "<defined / not_defined>",
          "payment_procedure_details": "<текст или 'Данные не определены'>",
          "payment_model": "<prepayment / postpayment / installments / mixed / not_defined>",
          "vat_status": "<defined / not_defined>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "предмет договора"
        - "наименование товара"
        - "количество"
        - "цена"
        - "стоимость"
        - "оплата"
        - "предоплата"
        - "аванс"
        - "рассрочка"
        - "спецификация"
        - "передает в собственность"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "subject_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определен предмет (товар). Иначе верни 'not_defined'."
        - name: "subject_details"
          type: "string"
          description: "Кратко укажи предмет (товар). Если данных нет, верни строго: 'Данные не определены'."
        - name: "quantity_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определено количество товара. Иначе верни 'not_defined'."
        - name: "quantity_details"
          type: "string"
          description: "Укажи количество товара. Если данных нет, верни строго: 'Данные не определены'."
        - name: "price_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определена цена товара или цена за единицу. Иначе верни 'not_defined'."
        - name: "price_details"
          type: "string"
          description: "Укажи цену товара. Если данных нет, верни строго: 'Данные не определены'."
        - name: "payment_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определен порядок расчетов или сроки оплаты. Иначе верни 'not_defined'."
        - name: "payment_procedure_details"
          type: "string"
          description: "Укажи порядок оплаты и/или сроки оплаты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "payment_model"
          type: "string"
          allowed_values: ["prepayment", "postpayment", "installments", "mixed", "not_defined"]
          description: "Определи модель оплаты: prepayment / postpayment / installments / mixed. Если не указано — 'not_defined'."
        - name: "vat_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо указано, включает ли цена НДС или не включает. Иначе 'not_defined'."
        - name: "late_payment_consequences_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо указаны последствия просрочки оплаты. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Передача товара, сроки передачи, принадлежности и документы
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_and_transfer_docs
    name: "Порядок передачи товара, передаточные документы и принадлежности"
    description: >
      Фактографическая проверка наличия условий о сроке передачи, месте передачи,
      способе передачи, передаточных документах, принадлежностях и документах на товар.
    triggers:
      any: ["delivery_included", "general_sale_subject"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доставка"
        - "самовывоз"
        - "отгрузка"
        - "передача товара"
        - "товарная накладная"
        - "акт приема-передачи"
        - "место передачи"
        - "срок передачи"
        - "принадлежности"
        - "документы на товар"
        - "сертификат качества"
        - "паспорт изделия"
        - "инструкция"
        - "техническая документация"
        - "руководство пользователя"
        - "гарантийный талон"
        - "перевозчик"
        - "склад"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк[аи]|самовывоз|отгрузк[аи]"
        - "(?i)акт\\s+(?:приема|приёма|передач)"
        - "(?i)товарн[ая]\\s+накладн"
        - "(?i)принадлежност[иь]\\s+товар"
        - "(?i)документ[ыов].*?(?:товар|издели)"
        - "(?i)сертификат\\s+качеств"
        - "{{ date_pattern }}"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор общей купли-продажи движимого имущества по § 1 Главы 30 ГК РФ.
        Проверяется только один вопрос: передача товара, сроки передачи, принадлежности и документы.

        Нормативный ориентир:
        - ст. 456 ГК РФ
        - ст. 457 ГК РФ
        - ст. 458 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
