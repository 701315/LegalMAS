        - "порядок расчетов"
        - "предоплата"
        - "аванс"
        - "рассрочка"
        - "отсрочка"
        - "срок оплаты"
        - "НДС"
        - "без НДС"
        - "включая НДС"
        - "просрочка оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)оплат[аы]\\s.{0,40}(?:в\\s+течение|не\\s+позднее|до\\s+момента|после)"
        - "(?i)(предоплат|аванс|рассрочк|отсрочк)"
