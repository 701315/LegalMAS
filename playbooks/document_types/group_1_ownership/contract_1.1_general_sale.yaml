        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения о качестве товара, комплектности, гарантии, порядке приёмки и претензиях по качеству.
        Не анализируй цену, передачу, расторжение или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. quality_status — "defined" если требования к качеству прямо указаны, иначе "not_defined".
        2. quality_details — требования к качеству товара (ГОСТ, ТУ, стандарт, описание).
        3. completeness_status — "defined" или "not_defined".
        4. completeness_details — комплектность товара.
        5. warranty_status — "defined" если гарантия или гарантийный срок прямо указаны, иначе "not_defined".
        6. warranty_details — срок и условия гарантии.
        7. acceptance_status — "defined" если порядок приёмки прямо указан, иначе "not_defined".
        8. acceptance_details — порядок приёмки товара по качеству и количеству.
        9. claims_procedure_status — "defined" если порядок претензий прямо указан, иначе "not_defined".
        10. claims_procedure_details — порядок и сроки предъявления претензий по качеству.

        Если условие отсутствует в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - Анализируй только тему качества, гарантии и приёмки.
        - Не смешивай с условиями о передаче, цене или расторжении.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "quality_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения требований к качеству."
        - name: "quality_details"
          type: "string"
          presentation: "fact"
          label: "Качество"
          description: "Требования к качеству товара."
        - name: "completeness_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения комплектности."
        - name: "completeness_details"
          type: "string"
          presentation: "fact"
          label: "Комплектность"
          description: "Состав комплектности товара."
        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения гарантии."
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия"
          description: "Гарантийный срок и условия."
        - name: "acceptance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка приёмки."
        - name: "acceptance_details"
          type: "string"
          presentation: "fact"
          label: "Приёмка"
          description: "Порядок приёмки товара."
        - name: "claims_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка претензий."
        - name: "claims_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Претензии по качеству"
          description: "Порядок и сроки предъявления претензий."
      store_payload: true

