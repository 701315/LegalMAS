  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Корпоративные процедуры, преимущественное право, ФАС
  # ──────────────────────────────────────────────────────────────────────────
  - id: corporate_procedure_compliance_check
    name: "Корпоративные процедуры: преимущественное право, одобрения, ФАС, уставные ограничения"
    description: >
      Фактографическая проверка соблюдения корпоративных процедур: преимущественного
      права участников/акционеров, корпоративных одобрений (крупная сделка, сделка
      с заинтересованностью), ограничений устава, ФАС-согласования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "преимущественное право покупки"
        - "оферта участникам"
        - "отказ участников"
        - "согласие общества"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "ФАС"
        - "антимонопольное согласование"
        - "ограничения устава"
        - "корпоративное одобрение"
        - "одобрение общего собрания"
        - "решение единственного участника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)сделк(а|и)\\s+с\\s+заинтересованност"
        - "(?i)антимонопольн(ое|ого)\\s+соглас"
        - "(?i)одобрен(ие|а).*собрани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: корпоративные процедуры — преимущественное
        право, одобрения, уставные ограничения, ФАС.

        Нормативный ориентир:
        - ст. 21 ФЗ-14 — преимущественное право участников ООО
        - ст. 7 ФЗ-208 — преимущественное право в непубличном АО
        - ФЗ-14 ст. 45–46, ФЗ-208 ст. 78–84 — крупные сделки и сделки с заинтересованностью
        - ФЗ-135 — антимонопольное согласование

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на соблюдение / отсутствие преимущественного права
           участников / акционеров.
        2. Есть ли ссылка на корпоративное одобрение (тип: общее собрание / совет
           директоров / единственный участник) или на то, что одобрение не требуется.
        3. Есть ли проверка уставных ограничений на отчуждение.
        4. Есть ли указание на ФАС-согласование или на то, что оно не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процедуры урегулированы:
        Фрагмент:
        "Продавец подтверждает, что все участники ООО «Гамма» отказались от
        преимущественного права покупки в установленном порядке. Сделка одобрена
        решением единственного участника от 01.03.2024. Антимонопольное согласование
        ФАС не требуется: суммарные активы группы не превышают пороговых значений."

        Ответ:
        {
          "preemptive_rights_status": "defined",
          "preemptive_rights_details": "все участники отказались от преимущественного права",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "решение единственного участника от 01.03.2024",
          "corporate_approval_type": "sole_participant",
          "charter_restrictions_status": "not_defined",
          "charter_restrictions_details": "Данные не определены",
          "fas_clearance_status": "defined",
          "fas_clearance_details": "антимонопольное согласование не требуется: суммарные активы не превышают пороговых значений",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Продавец подтверждает, что все участники ООО «Гамма» отказались от преимущественного права покупки в установленном порядке."
            }
          ]
        }

        Пример 2 — процедуры не упомянуты:
        Фрагмент:
        "Стороны договорились о продаже доли."

        Ответ:
        {
          "preemptive_rights_status": "not_defined",
          "preemptive_rights_details": "Данные не определены",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "corporate_approval_type": "not_defined",
          "charter_restrictions_status": "not_defined",
          "charter_restrictions_details": "Данные не определены",
          "fas_clearance_status": "not_defined",
          "fas_clearance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о преимущественном праве или отказе от него.
        2. Найди прямую цитату о корпоративном одобрении.
        3. Найди прямую цитату о проверке устава.
        4. Найди прямую цитату о ФАС или отсутствии необходимости согласования.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай процедуры.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "preemptive_rights_status": "<defined / not_defined>",
          "preemptive_rights_details": "<текст или 'Данные не определены'>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "corporate_approval_type": "<general_meeting / board / sole_participant / not_defined>",
          "charter_restrictions_status": "<defined / not_defined>",
          "charter_restrictions_details": "<текст или 'Данные не определены'>",
          "fas_clearance_status": "<defined / not_defined>",
          "fas_clearance_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преимущественное право покупки оферта участникам отказ участников согласие общества крупная сделка сделка с заинтересованностью ФАС антимонопольное согласование ограничения устава корпоративное одобрение одобрение общего собрания решение единственного участника"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "conditions precedent для closing"
        - "long-stop date"
        - "право отказаться от сделки при неисполнении CP"
        - "ЕГРЮЛ регистрация"
        - "механизм перехода права"
        - "нотариус"
        - "заверения"
        - "indemnity"
        - "due diligence"
        - "ковенанты промежуточного периода"
        - "санкции"
        - "AML"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора корпоративные процедуры:
        преимущественное право, корпоративные одобрения, уставные ограничения и ФАС.
        Не анализируй механизм перехода права, цену, заверения или ковенанты.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. preemptive_rights_status — "defined" если соблюдение или отказ от преимущественного права прямо урегулированы, иначе "not_defined".
        2. preemptive_rights_details — формулировка о преимущественном праве.
        3. corporate_approval_status — "defined" если корпоративное одобрение прямо упомянуто или прямо указано, что оно не требуется, иначе "not_defined".
        4. corporate_approval_details — формулировка о корпоративном одобрении.
        5. corporate_approval_type — "general_meeting" / "board" / "sole_participant" / "not_defined".
        6. charter_restrictions_status — "defined" если проверка уставных ограничений прямо указана, иначе "not_defined".
        7. charter_restrictions_details — формулировка об уставных ограничениях.
        8. fas_clearance_status — "defined" если согласование ФАС прямо упомянуто (требуется или не требуется), иначе "not_defined".
        9. fas_clearance_details — формулировка о ФАС.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - corporate_approval_type:
            - "general_meeting" — если одобрение исходит от общего собрания.
            - "board" — если одобрение исходит от совета директоров / наблюдательного совета.
            - "sole_participant" — если одобрение исходит от единственного участника / акционера.
            - "not_defined" — если орган прямо не назван или одобрение не упомянуто.
        - Верни только JSON.
        </rules>
      fields:
        - name: "preemptive_rights_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования преимущественного права."
          required: true
        - name: "preemptive_rights_details"
          type: "string"
          presentation: "fact"
          label: "Преимущественное право"
          description: "Формулировка о соблюдении или отказе от преимущественного права."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия корпоративного одобрения."
          required: false
        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
          description: "Формулировка о корпоративном одобрении сделки."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "corporate_approval_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["general_meeting", "board", "sole_participant", "not_defined"]
          description: "Тип органа корпоративного одобрения."
          required: false
        - name: "charter_restrictions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус проверки уставных ограничений."
          required: false
        - name: "charter_restrictions_details"
          type: "string"
          presentation: "fact"
          label: "Уставные ограничения"
          description: "Формулировка о проверке уставных ограничений на отчуждение."
          required: false
          display_in_grid: false
        - name: "fas_clearance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания ФАС-согласования."
          required: false
        - name: "fas_clearance_details"
          type: "string"
          presentation: "fact"
          label: "ФАС-согласование"
          description: "Формулировка о ФАС-согласовании или его ненужности."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Цена и структура платежей
  # ──────────────────────────────────────────────────────────────────────────
  - id: price_and_payment_mechanics
    name: "Цена сделки, структура платежей, escrow, earn-out, корректировка цены"
    description: >
      Фактографическая проверка наличия в договоре цены сделки, валюты, структуры
      платежей (upfront/escrow/deferred/earn-out), условий release средств,
      механизма корректировки цены, срока оплаты, последствий просрочки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "покупная цена"
        - "цена доли"
        - "цена акций"
        - "эскроу"
        - "escrow"
        - "отложенный платеж"
        - "поэтапная оплата"
        - "earn-out"
        - "удержание части цены"
        - "банковские реквизиты"
        - "условия release"
        - "корректировка цены"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)escrow|эскроу"
        - "(?i)earn[- ]?out"
        - "(?i)отложенн(ый|ого)\\s+платеж"
        - "(?i)working\\s+capital\\s+adjustment"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: цена сделки и структура платежей.

        Нормативный ориентир:
        - ст. 424, 454 ГК РФ — цена договора
        - ст. 575 ГК РФ — запрет безвозмездной передачи между юрлицами

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли цена сделки (размер и валюта).
        2. Есть ли структура платежей (upfront / escrow / deferred / earn-out).
        3. Есть ли условия release из эскроу.
        4. Есть ли механизм корректировки цены (working capital, debt/cash-free).
        5. Есть ли срок оплаты.
        6. Есть ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и структура определены:
        Фрагмент:
        "Покупная цена составляет 10 000 000 рублей. Из них 7 000 000 рублей
        уплачиваются на дату закрытия, 3 000 000 рублей размещаются на эскроу-счёте
        сроком на 12 месяцев. Release из эскроу происходит при отсутствии
        подтверждённых требований по заверениям. В случае просрочки оплаты
        Покупатель уплачивает пени 0,1% за каждый день."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "10 000 000 рублей",
          "price_currency": "RUB",
          "payment_structure_code": "mixed",
          "payment_structure_details": "7 000 000 рублей на дату закрытия, 3 000 000 рублей на эскроу",
          "escrow_release_status": "defined",
          "escrow_release_details": "при отсутствии подтверждённых требований по заверениям",
          "price_adjustment_status": "not_defined",
          "price_adjustment_details": "Данные не определены",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "на дату закрытия",
          "late_payment_status": "defined",
          "late_payment_details": "пени 0,1% за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Покупная цена составляет 10 000 000 рублей. Из них 7 000 000 рублей уплачиваются на дату закрытия, 3 000 000 рублей размещаются на эскроу-счёте сроком на 12 месяцев."
            }
          ]
        }

        Пример 2 — цена не определена:
        Фрагмент:
        "Цена сделки будет согласована дополнительно."

        Ответ:
        {
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "price_currency": "not_defined",
          "payment_structure_code": "not_defined",
          "payment_structure_details": "Данные не определены",
          "escrow_release_status": "not_defined",
          "escrow_release_details": "Данные не определены",
          "price_adjustment_status": "not_defined",
          "price_adjustment_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "late_payment_status": "not_defined",
          "late_payment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о размере цены и валюте.
        2. Найди прямую цитату о структуре платежей.
        3. Найди прямую цитату об условиях release из эскроу.
        4. Найди прямую цитату о механизме корректировки цены.
        5. Найди прямую цитату о сроке оплаты.
        6. Найди прямую цитату о последствиях просрочки.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай суммы и структуру.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "price_currency": "<RUB / USD / EUR / other / not_defined>",
          "payment_structure_code": "<upfront / deferred / escrow / earn_out / mixed / not_defined>",
          "payment_structure_details": "<текст или 'Данные не определены'>",
          "escrow_release_status": "<defined / not_defined>",
          "escrow_release_details": "<текст или 'Данные не определены'>",
          "price_adjustment_status": "<defined / not_defined>",
