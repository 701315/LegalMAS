  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Расторжение, break fee, конфиденциальность, споры, право
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_disputes_check
    name: "Расторжение, break fee, запрет уступки, конфиденциальность, споры, применимое право"
    description: >
      Фактографическая проверка наличия в договоре условий расторжения и walk-away
      rights (long-stop date, break fee, reverse break fee), ограничения на уступку
      прав, режима конфиденциальности, порядка разрешения споров и применимого права.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "long-stop"
        - "break fee"
        - "reverse break fee"
        - "уступка прав"
        - "без согласия другой стороны"

      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)long[- ]?stop"
        - "(?i)break\\s+fee"
        - "(?i)уступк(а|и).*без\\s+соглас"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: расторжение, break fee, конфиденциальность,
        споры и применимое право.

        Нормативный ориентир:
        - ст. 450–453 ГК РФ — расторжение
        - ст. 382, 388 ГК РФ — уступка прав

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли основания расторжения.
        2. Есть ли long-stop date.
        3. Есть ли break fee (размер и условия).
        4. Есть ли reverse break fee.
        5. Есть ли ограничение на уступку прав без согласия.


        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — блок определён:
        Фрагмент:
        "Любая сторона вправе расторгнуть договор при наступлении MAC или неисполнении CP
        к long-stop date (31.12.2024). Если Покупатель отказывается без оснований, он
        уплачивает break fee в размере 5% покупной цены. Уступка прав по настоящему
        договору без согласия другой стороны не допускается. Конфиденциальность: 3 года.
        Споры — МКАС при ТПП РФ. Применимое право — РФ."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "наступление MAC или неисполнение CP к long-stop date",
          "long_stop_date_status": "defined",
          "long_stop_date_details": "31.12.2024",
          "break_fee_status": "defined",
          "break_fee_details": "5% покупной цены при отказе Покупателя без оснований",
          "reverse_break_fee_status": "not_defined",
          "reverse_break_fee_details": "Данные не определены",
          "assignment_restriction_status": "defined",
          "assignment_restriction_details": "уступка без согласия другой стороны не допускается",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Любая сторона вправе расторгнуть договор при наступлении MAC или неисполнении CP к long-stop date (31.12.2024)."
            }
          ]
        }

        Пример 2 — блок не определён:
        Фрагмент:
        "Споры регулируются действующим законодательством."

        Ответ:
        {
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "long_stop_date_status": "not_defined",
          "long_stop_date_details": "Данные не определены",
          "break_fee_status": "not_defined",
          "break_fee_details": "Данные не определены",
          "reverse_break_fee_status": "not_defined",
          "reverse_break_fee_details": "Данные не определены",
          "assignment_restriction_status": "not_defined",
          "assignment_restriction_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату о long-stop date.
        3. Найди прямую цитату о break fee.
        4. Найди прямую цитату о reverse break fee.
        5. Найди прямую цитату о запрете уступки.
        6. Найди прямую цитату о конфиденциальности и сроке.
        7. Найди прямую цитату о суде / форуме.
        8. Найди прямую цитату о применимом праве.
        9. Если прямой цитаты нет — верни "not_defined". Не додумывай размеры и сроки.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "long_stop_date_status": "<defined / not_defined>",
          "long_stop_date_details": "<текст или 'Данные не определены'>",
          "break_fee_status": "<defined / not_defined>",
          "break_fee_details": "<текст или 'Данные не определены'>",
          "reverse_break_fee_status": "<defined / not_defined>",
          "reverse_break_fee_details": "<текст или 'Данные не определены'>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

