# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: corporate_asset_subject_extraction
    name: "Корпоративные права: извлечение предмета сделки"
    description: >
      Извлекает тип актива (доля/акции), реквизиты общества, размер участия,
      количество акций, тип акций, цену и базовые параметры сделки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доля в уставном капитале"
        - "акции"
        - "эмитент"
        - "общество с ограниченной ответственностью"
        - "акционерное общество"
        - "размер доли"
        - "номинальная стоимость"
        - "количество акций"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"
        - "(?i)(государственн(ый|ого)\\s+регистрационн(ый|ого)\\s+номер\\s+выпуска)"
        - "(?i)(ЕГРЮЛ|лист\\s+записи\\s+ЕГРЮЛ)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор купли-продажи корпоративных прав.
        Извлеки ключевые параметры предмета сделки.

        Ответь строго в JSON:
        {
          "asset_type": "<llc_share / shares / mixed / not_found>",
          "target_name": "<наименование общества или not_found>",
          "target_ogrn": "<ОГРН или not_found>",
          "target_inn": "<ИНН или not_found>",
          "share_ratio": "<размер доли в % или not_found>",
          "share_nominal_value": "<номинальная стоимость доли или not_found>",
          "shares_quantity": "<количество акций или not_found>",
          "shares_type": "<ordinary / preferred / mixed / not_found>",
          "issue_number": "<номер выпуска или not_found>",
          "price": "<цена сделки или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "доля в уставном капитале"
        - "акции"
        - "ОГРН"
        - "ИНН"
        - "размер доли"
        - "цена сделки"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "asset_type"
          type: "string"
          allowed_values: ["llc_share", "shares", "mixed", "not_found"]
          description: "Тип корпоративного актива"
        - name: "target_name"
          type: "string"
          keyword_hints: ["общество", "эмитент", "ООО", "АО", "ПАО"]
          description: "Наименование target-компании"
        - name: "share_ratio"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"
          description: "Размер доли в процентах"
        - name: "shares_quantity"
          type: "string"
          keyword_hints: ["количество акций", "штук", "акций"]
          description: "Количество акций"
        - name: "issue_number"
          type: "string"
          keyword_hints: ["номер выпуска", "государственный регистрационный номер выпуска"]
          description: "Номер выпуска акций"
        - name: "price"
          type: "string"
          keyword_hints: ["цена", "стоимость", "покупная цена"]
          description: "Цена сделки"
      store_payload: true

  - id: corporate_procedure_compliance_check
    name: "Соблюдение корпоративных процедур и ограничений"
    description: >
      Проверяет наличие условий о преимущественном праве, корпоративных одобрениях,
      ограничениях устава, согласиях общества, антимонопольных и иных разрешениях.
    triggers: {}
