  - id: warranties_check
    name: "Заверения об обстоятельствах продавца (title, tax, litigation, IP, compliance)"
    description: >
      Фактографическая проверка наличия пакета заверений продавца: title, tax,
      litigation, IP, licenses, compliance. Indemnity и лимиты ответственности
      проверяются в отдельном check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "representations and warranties"
        - "налоги уплачены"
        - "судебные споры"
        - "лицензии действительны"
        - "гарантии и заверения"
        - "IP"
        - "интеллектуальная собственность"
        - "соответствие законодательству"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заверени(я|е)\\s+об\\s+обстоятельств"
        - "(?i)representations\\s+and\\s+warranties"
        - "(?i)все\\s+налог(и|ов)\\s+(уплачен|исчислен)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
