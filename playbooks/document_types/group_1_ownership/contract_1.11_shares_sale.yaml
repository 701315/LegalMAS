  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Indemnity, cap, basket, claim period
  # ──────────────────────────────────────────────────────────────────────────
  - id: indemnity_and_liability_limits_check
    name: "Indemnity, cap ответственности, basket/de minimis и claim period"
    description: >
      Фактографическая проверка механизма indemnity при нарушении заверений,
      лимита ответственности продавца (cap), порогов de minimis/basket и срока
      предъявления требований (claim period).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "indemnity"
        - "компенсация потерь"
        - "лимит ответственности"
        - "cap"
        - "de minimis"
        - "basket"
        - "срок предъявления требований"
        - "claim period"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)indemnity|компенсац(ия|ии)\\s+потер"
        - "(?i)лимит\\s+ответственност"
        - "(?i)de\\s+minimis|basket|\\bcap\\b"
        - "(?i)claim\\s+period|срок.*предъявлен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: механизм indemnity, лимиты ответственности
        продавца и пороги предъявления требований.

        Нормативный ориентир:
        - ст. 406.1 ГК РФ — возмещение потерь
        - ст. 393 ГК РФ — общие убытки
        - договорная практика indemnity / caps / baskets в M&A

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не подставляй нормы закона вместо текста договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли механизм indemnity / компенсации потерь при нарушении заверений или иных триггерах.
        2. Есть ли лимит ответственности продавца (cap) и его размер.
        3. Есть ли пороги de minimis и/или basket.
        4. Есть ли срок предъявления требований по заверениям или indemnity (claim period).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Не смешивай специальный indemnity-механизм с общей ссылкой на ответственность по закону.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — indemnity и лимиты предусмотрены:
        Фрагмент:
        "В случае недостоверности заверений Продавец обязуется возместить Покупателю
        все документально подтверждённые потери. Совокупная ответственность Продавца
        ограничивается суммой, равной 20% от Цены сделки. Требования не подлежат
        удовлетворению, если размер отдельных потерь менее 100 000 рублей, а общий
        размер требований не превысил 500 000 рублей. Требования могут быть
        предъявлены в течение 24 месяцев с даты закрытия сделки."

        Ответ:
        {
          "indemnity_status": "defined",
          "indemnity_details": "Продавец обязуется возместить Покупателю все документально подтверждённые потери в случае недостоверности заверений",
          "liability_cap_status": "defined",
          "liability_cap_details": "совокупная ответственность Продавца ограничивается суммой, равной 20% от Цены сделки",
          "de_minimis_basket_status": "defined",
          "de_minimis_basket_details": "размер отдельных потерь менее 100 000 рублей, а общий размер требований не превысил 500 000 рублей",
          "claim_period_status": "defined",
          "claim_period_details": "требования могут быть предъявлены в течение 24 месяцев с даты закрытия сделки",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "В случае недостоверности заверений Продавец обязуется возместить Покупателю все документально подтверждённые потери."
            }
          ]
        }

        Пример 2 — специальных условий нет:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "indemnity_status": "not_defined",
          "indemnity_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "de_minimis_basket_status": "not_defined",
          "de_minimis_basket_details": "Данные не определены",
          "claim_period_status": "not_defined",
          "claim_period_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о компенсации потерь / indemnity.
        2. Найди прямую цитату о cap или ином лимите ответственности.
        3. Найди прямую цитату о de minimis и/или basket.
        4. Найди прямую цитату о claim period / сроке предъявления требований.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай ограничения ответственности.
        6. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "indemnity_status": "<defined / not_defined>",
          "indemnity_details": "<текст или 'Данные не определены'>",
          "liability_cap_status": "<defined / not_defined>",
          "liability_cap_details": "<текст или 'Данные не определены'>",
          "de_minimis_basket_status": "<defined / not_defined>",
          "de_minimis_basket_details": "<текст или 'Данные не определены'>",
          "claim_period_status": "<defined / not_defined>",
          "claim_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "indemnity компенсация потерь лимит ответственности cap de minimis basket срок предъявления требований claim period нарушение заверений компенсация убытков ограничение ответственности продавца"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
