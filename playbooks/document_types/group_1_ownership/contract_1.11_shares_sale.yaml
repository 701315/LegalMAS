        Проверяется только один вопрос: пакет заверений продавца о target-компании
        и её состоянии.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах
        - общая практика representations and warranties в M&A

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не подставляй нормы закона вместо текста договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора заверения по каждому из типов:
        1. tax — налоги, сборы, отчётность, отсутствие налоговых претензий.
        2. litigation — отсутствие судебных споров или значимых разбирательств.
        3. license — действительность лицензий, разрешений, допусков.
        4. title — право собственности target на своё имущество.
        5. IP — наличие / принадлежность прав на интеллектуальную собственность.
        6. compliance — соответствие применимому законодательству.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Не смешивай заверения о target-компании с заверениями о титуле продавца на продаваемую долю/акции.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — пакет заверений присутствует:
