          label: "Target: ОГРН"
          description: "ОГРН target-компании."
          required: false
          display_in_grid: false
        - name: "target_inn_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания ИНН target."
          required: false
        - name: "target_inn_details"
          type: "string"
          presentation: "fact"
          label: "Target: ИНН"
          description: "ИНН target-компании."
          required: false
          display_in_grid: false
        - name: "share_ratio_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания размера доли."
          required: false
        - name: "share_ratio_details"
          type: "string"
          presentation: "fact"
          label: "Размер доли"
          description: "Размер доли в уставном капитале target."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "share_nominal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания номинальной стоимости доли."
          required: false
        - name: "share_nominal_details"
          type: "string"
          presentation: "fact"
          label: "Номинальная стоимость доли"
          description: "Номинальная стоимость доли в уставном капитале."
          required: false
          display_in_grid: false
        - name: "shares_quantity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания количества акций."
          required: false
        - name: "shares_quantity_details"
          type: "string"
          presentation: "fact"
          label: "Количество акций"
          description: "Количество продаваемых акций."
          required: false
          display_in_grid: false
        - name: "shares_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания типа акций."
          required: false
        - name: "shares_type_details"
          type: "string"
          presentation: "fact"
          label: "Тип акций"
          description: "Тип акций: обыкновенные, привилегированные или смешанные."
          required: false
          display_in_grid: false
        - name: "issue_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания номера выпуска акций."
          required: false
        - name: "issue_number_details"
          type: "string"
          presentation: "fact"
          label: "Номер выпуска акций"
          description: "Номер выпуска акций."
          required: false
          display_in_grid: false
        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания цены сделки."
          required: true
        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена сделки"
          description: "Цена сделки с указанием валюты."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "price_currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта цены сделки."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Механизм перехода права
  # ──────────────────────────────────────────────────────────────────────────
  - id: transfer_mechanics_check
    name: "Механизм перехода права на долю/акции: нотариус, ЕГРЮЛ, регистратор, closing sequence"
    description: >
      Фактографическая проверка наличия в договоре механизма перехода права на
      корпоративный актив: для ООО — нотариальное удостоверение и ЕГРЮЛ; для АО —
      передаточное распоряжение и запись у регистратора/депозитария; closing sequence.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ЕГРЮЛ"
        - "нотариус подает заявление"
        - "переход права на долю"
        - "регистратор"
        - "реестродержатель"
        - "передаточное распоряжение"
        - "счет депо"
        - "лицевой счет"
        - "closing"
        - "нотариальное удостоверение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передаточн(ое|ого)\\s+распоряжен"
        - "(?i)счет\\s+депо|лицев(ой|ого)\\s+счет"
        - "(?i)нотариус.*пода[её]т.*заявлен"
        - "(?i)нотариальн(ое|ого)\\s+удостоверен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: механизм перехода права на корпоративный актив,
        нотариальное удостоверение / регистрационная процедура и closing sequence.

        Нормативный ориентир:
        - ст. 21 ФЗ-14 — переход права на долю в ООО
        - ст. 149 ГК РФ, ФЗ-39 — учёт и переход прав на акции
        - общая договорная практика closing mechanics в M&A

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не подставляй норму закона вместо текста договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на момент или механизм перехода права на актив.
        2. Есть ли условие о нотариальном удостоверении сделки / договора (для доли ООО).
        3. Есть ли условие о внесении записи в ЕГРЮЛ или подаче заявления нотариусом (для доли ООО).
        4. Есть ли условие о передаточном распоряжении, регистраторе, депозитарии,
           лицевом счёте или счёте депо (для акций АО).
        5. Есть ли closing sequence — последовательность действий при закрытии сделки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — механизм перехода описан:
        Фрагмент:
        "Право на долю переходит к Покупателю с момента внесения соответствующей записи
        в ЕГРЮЛ. Настоящий договор подлежит нотариальному удостоверению. Нотариус
        подаёт заявление о государственной регистрации изменений в ЕГРЮЛ. Закрытие
        сделки включает: подписание договора, нотариальное удостоверение, подачу
        заявления нотариусом и внесение записи в ЕГРЮЛ."

        Ответ:
        {
          "transfer_mechanism_status": "defined",
          "transfer_mechanism_details": "право на долю переходит к Покупателю с момента внесения соответствующей записи в ЕГРЮЛ",
          "llc_notarization_status": "defined",
          "llc_notarization_details": "договор подлежит нотариальному удостоверению",
          "llc_egrul_status": "defined",
          "llc_egrul_details": "нотариус подаёт заявление о государственной регистрации изменений в ЕГРЮЛ",
          "shares_registry_status": "not_defined",
          "shares_registry_details": "Данные не определены",
          "closing_sequence_status": "defined",
          "closing_sequence_details": "закрытие сделки включает: подписание договора, нотариальное удостоверение, подачу заявления нотариусом и внесение записи в ЕГРЮЛ",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Право на долю переходит к Покупателю с момента внесения соответствующей записи в ЕГРЮЛ."
            }
          ]
        }

        Пример 2 — механизм перехода не описан:
        Фрагмент:
        "Продавец обязуется передать Покупателю долю в уставном капитале Общества."

        Ответ:
        {
          "transfer_mechanism_status": "not_defined",
          "transfer_mechanism_details": "Данные не определены",
          "llc_notarization_status": "not_defined",
          "llc_notarization_details": "Данные не определены",
          "llc_egrul_status": "not_defined",
          "llc_egrul_details": "Данные не определены",
          "shares_registry_status": "not_defined",
          "shares_registry_details": "Данные не определены",
          "closing_sequence_status": "not_defined",
          "closing_sequence_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте или механизме перехода права.
        2. Найди прямую цитату о нотариальном удостоверении.
        3. Найди прямую цитату о ЕГРЮЛ или подаче заявления нотариусом.
        4. Найди прямую цитату о регистраторе, депозитарии, лицевом счёте, счёте депо или передаточном распоряжении.
        5. Найди прямую цитату о последовательности действий при закрытии сделки.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай механизм перехода.
        7. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_mechanism_status": "<defined / not_defined>",
          "transfer_mechanism_details": "<текст или 'Данные не определены'>",
          "llc_notarization_status": "<defined / not_defined>",
          "llc_notarization_details": "<текст или 'Данные не определены'>",
          "llc_egrul_status": "<defined / not_defined>",
          "llc_egrul_details": "<текст или 'Данные не определены'>",
          "shares_registry_status": "<defined / not_defined>",
          "shares_registry_details": "<текст или 'Данные не определены'>",
          "closing_sequence_status": "<defined / not_defined>",
          "closing_sequence_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ЕГРЮЛ нотариус подаёт заявление переход права на долю регистратор реестродержатель передаточное распоряжение счёт депо лицевой счёт closing нотариальное удостоверение момент перехода права"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "преимущественное право"
        - "корпоративное одобрение"
        - "ФАС"
        - "уставные ограничения"
        - "conditions precedent"
        - "long-stop"
        - "заверения"
        - "indemnity"
        - "due diligence"
        - "ковенанты"
        - "санкции"
        - "AML"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора купли-продажи корпоративных
        прав механизм перехода права: нотариус, ЕГРЮЛ, регистратор, closing sequence.
        Не анализируй заверения о титуле, обременениях, цену или стороны.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. transfer_mechanism_status — "defined" если момент или механизм перехода права прямо указан, иначе "not_defined".
        2. transfer_mechanism_details — формулировка о механизме перехода.
        3. llc_notarization_status — "defined" если нотариальное удостоверение прямо предусмотрено, иначе "not_defined".
        4. llc_notarization_details — формулировка о нотариальном удостоверении.
        5. llc_egrul_status — "defined" если этап с ЕГРЮЛ или подача заявления прямо описаны, иначе "not_defined".
        6. llc_egrul_details — формулировка об ЕГРЮЛ.
        7. shares_registry_status — "defined" если регистратор, депозитарий или передаточное распоряжение прямо указаны, иначе "not_defined".
        8. shares_registry_details — формулировка о регистраторе или счетах.
        9. closing_sequence_status — "defined" если последовательность закрытия сделки (closing sequence) прямо описана, иначе "not_defined".
        10. closing_sequence_details — формулировка о последовательности действий при закрытии.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи механизм перехода права из закона (ст. 21 ФЗ-14 и др.) — фиксируй только то, что прямо написано.
        - transfer_mechanism_status = "defined" только если момент перехода права явно сформулирован в тексте.
        - llc_notarization_status = "defined" только если необходимость нотариального удостоверения прямо предусмотрена текстом.
        - Верни только JSON.
        </rules>
      fields:
        - name: "transfer_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения механизма перехода права."
          required: true
        - name: "transfer_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Механизм перехода права"
          description: "Формулировка о механизме перехода права на корпоративный актив."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "llc_notarization_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус нотариального удостоверения (для доли ООО)."
          required: false
        - name: "llc_notarization_details"
          type: "string"
          presentation: "fact"
          label: "Нотариальное удостоверение"
          description: "Формулировка о нотариальном удостоверении договора."
          required: false
          display_in_grid: false
        - name: "llc_egrul_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования записи в ЕГРЮЛ."
          required: false
        - name: "llc_egrul_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация в ЕГРЮЛ"
          description: "Формулировка об этапе с ЕГРЮЛ."
          required: false
          display_in_grid: false
        - name: "shares_registry_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования записи у регистратора/депозитария."
          required: false
        - name: "shares_registry_details"
          type: "string"
          presentation: "fact"
          label: "Запись у регистратора"
          description: "Формулировка о передаточном распоряжении и записи у регистратора."
          required: false
          display_in_grid: false
        - name: "closing_sequence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия closing sequence."
          required: false
        - name: "closing_sequence_details"
          type: "string"
          presentation: "fact"
          label: "Closing sequence"
          description: "Формулировка о последовательности действий при закрытии."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

