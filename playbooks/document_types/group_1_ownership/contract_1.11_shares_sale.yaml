  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Механизм перехода права, нотариус, регистратор, титул
  # ──────────────────────────────────────────────────────────────────────────
  - id: transfer_mechanics_and_title_check
    name: "Переход права на долю/акции: нотариус/ЕГРЮЛ, регистратор/депозитарий, титул продавца, обременения"
    description: >
      Фактографическая проверка наличия в договоре механизма перехода права:
      для ООО — нотариальное удостоверение и ЕГРЮЛ; для АО — передаточное
      распоряжение и запись у регистратора/депозитария. Подтверждение титула
      продавца и отсутствия обременений.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ЕГРЮЛ"
        - "нотариус подает заявление"
        - "переход права на долю"
        - "регистратор"
        - "реестродержатель"
        - "передаточное распоряжение"
        - "счет депо"
        - "лицевой счет"
        - "closing"
        - "принадлежит на праве собственности"
        - "свободна от обременений"
        - "не заложена"
        - "не находится под арестом"
        - "правоустанавливающие документы"
      keyword_mode: "any"
      regex_patterns:
        - "{{ egrul_record }}"
        - "(?i)передаточн(ое|ого)\\s+распоряжен"
        - "(?i)счет\\s+депо|лицев(ой|ого)\\s+счет"
        - "(?i)нотариус.*пода[её]т.*заявлен"
        - "(?i)свободн(а|ы)\\s+от\\s+обременен"
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: механизм перехода права на корпоративный
        актив, подтверждение титула продавца и обременения.

        Нормативный ориентир:
        - ст. 21 ФЗ-14 — переход доли ООО через нотариуса и ЕГРЮЛ
        - ФЗ-39, ГК РФ — переход акций через регистратора/депозитария
        - ст. 460 ГК РФ — свобода актива от прав третьих лиц
        - ст. 209 ГК РФ — право собственности продавца

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о нотариальном удостоверении (для доли ООО).
        2. Есть ли условие о внесении записи в ЕГРЮЛ (для доли ООО).
        3. Есть ли условие о передаточном распоряжении / записи у регистратора (для акций АО).
        4. Есть ли условие о closing sequence (последовательность действий).
        5. Есть ли подтверждение титула продавца на актив.
        6. Есть ли заверение об отсутствии залога, ареста, прав третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — механизм определён (доля ООО):
