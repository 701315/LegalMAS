shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur|доллар|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  issue_number: "(?i)(государственн(ый|ого)\\s+регистрационн(ый|ого)\\s+номер\\s+выпуска|регистрационн(ый|ого)\\s+номер\\s+выпуска)"
  egrul_record: "(?i)(ЕГРЮЛ|лист\\s+записи\\s+ЕГРЮЛ|номер\\s+записи\\s+в\\s+ЕГРЮЛ)"
  share_ratio: "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, полномочия, согласие супруга
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны сделки: продавец, покупатель, target-компания, полномочия, согласие супруга"
    description: >
      Фактографическая проверка наличия в договоре идентификации продавца,
      покупателя, target-компании/эмитента, полномочий подписантов,
      а также согласия супруга при продаже физическим лицом.
      Результат предназначен для табличного вывода без оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "общество"
        - "эмитент"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: идентификация сторон, target-компании,
        полномочия подписантов и согласие супруга.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 182–185 ГК РФ — полномочия представителя
        - ст. 35 СК РФ — нотариальное согласие супруга
        - ст. 21 ФЗ-14 — полномочия подписанта для сделок с долями ООО

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Продавец (наименование/ФИО, ИНН, ОГРН, адрес).
        2. Кто указан как Покупатель (наименование/ФИО, ИНН, ОГРН, адрес).
        3. Идентифицирована ли target-компания/эмитент (наименование, ОГРН, ИНН).
        4. Кто подписывает договор от каждой стороны и на каком основании.
        5. Есть ли нотариальное согласие супруга продавца или подтверждение
           личного режима имущества / отсутствия брака / брачного договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные есть:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Продавец»,
        в лице Генерального директора Иванова И.И., действующего на основании Устава,
        и ООО «Бета» (ИНН 7700000002), именуемое «Покупатель», в лице директора
        Петрова П.П., действующего на основании доверенности № 5 от 01.01.2024.
        Target: ООО «Гамма», ОГРН 1027700000003, ИНН 7700000003."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "seller_type": "legal_entity",
          "seller_signatory_status": "defined",
          "seller_signatory_value": "Генеральный директор Иванов И.И.",
          "seller_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details_value": "ООО «Бета», ИНН 7700000002",
          "buyer_type": "legal_entity",
          "buyer_signatory_status": "defined",
          "buyer_signatory_value": "Директор Петров П.П.",
          "buyer_signatory_basis": "poa",
          "target_details_status": "defined",
          "target_details_value": "ООО «Гамма», ОГРН 1027700000003, ИНН 7700000003",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Продавец», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Стороны договорились о продаже корпоративных прав."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details_value": "Данные не определены",
          "seller_type": "not_defined",
          "seller_signatory_status": "not_defined",
          "seller_signatory_value": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "buyer_type": "not_defined",
          "buyer_signatory_status": "not_defined",
          "buyer_signatory_value": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "target_details_status": "not_defined",
          "target_details_value": "Данные не определены",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с наименованием/ФИО и реквизитами Продавца.
        2. Найди прямую цитату с наименованием/ФИО и реквизитами Покупателя.
        3. Найди прямую цитату с идентификацией target-компании/эмитента.
        4. Найди прямую цитату о подписанте и основании полномочий от каждой стороны.
        5. Найди прямую цитату о согласии супруга или личном режиме имущества.
        6. Если прямой цитаты нет — верни "not_defined" и "Данные не определены".
        7. Не додумывай реквизиты и не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "seller_details_status": "<defined / not_defined>",
          "seller_details_value": "<текст или 'Данные не определены'>",
          "seller_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "seller_signatory_status": "<defined / not_defined>",
          "seller_signatory_value": "<текст или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details_value": "<текст или 'Данные не определены'>",
          "buyer_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "buyer_signatory_status": "<defined / not_defined>",
          "buyer_signatory_value": "<текст или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / other / not_defined>",
          "target_details_status": "<defined / not_defined>",
          "target_details_value": "<текст или 'Данные не определены'>",
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "продавец покупатель эмитент общество в лице действующего на основании ИНН ОГРН согласие супруга нотариальное согласие не состоит в браке брачный договор именуемый реквизиты target-компания"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "доля в уставном капитале"
        - "акции"
        - "размер доли"
        - "цена сделки"
        - "механизм перехода права"
        - "ЕГРЮЛ"
        - "регистратор"
        - "заверения об обстоятельствах"
        - "conditions precedent"
        - "due diligence"
        - "ковенанты"
        - "санкции"
        - "AML"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      retrieval_profile: "party_identification_check"
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора купли-продажи
        корпоративных прав данные о продавце, покупателе, target-компании,
        подписантах и согласии супруга.
        Не анализируй предмет сделки, цену, механизм перехода права или заверения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_details_status — "defined" если продавец прямо идентифицирован, иначе "not_defined".
        2. seller_details_value — наименование/ФИО и реквизиты продавца.
        3. seller_type — "legal_entity" / "individual" / "individual_entrepreneur" / "not_defined".
        4. seller_signatory_status — "defined" если подписант продавца прямо указан, иначе "not_defined".
        5. seller_signatory_value — подписант от продавца.
        6. seller_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        7. buyer_details_status — "defined" если покупатель прямо идентифицирован, иначе "not_defined".
        8. buyer_details_value — наименование/ФИО и реквизиты покупателя.
        9. buyer_type — "legal_entity" / "individual" / "individual_entrepreneur" / "not_defined".
        10. buyer_signatory_status — "defined" если подписант покупателя прямо указан, иначе "not_defined".
        11. buyer_signatory_value — подписант от покупателя.
        12. buyer_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        13. target_details_status — "defined" если target прямо идентифицирован, иначе "not_defined".
        14. target_details_value — наименование, ОГРН, ИНН target-компании.
        15. spousal_consent_status — "defined" если согласие супруга или личный режим имущества прямо указан, иначе "not_defined".
        16. spousal_consent_details — формулировка о согласии супруга или личном режиме имущества.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Target-компания — это не продавец и не покупатель, а тот, чьи доли/акции продаются.
        - seller_type и buyer_type:
            - "legal_entity" — для юридических лиц (ООО, АО и др.).
            - "individual" — для физических лиц (без статуса ИП).
            - "individual_entrepreneur" — для индивидуальных предпринимателей.
            - "not_defined" — если тип не ясен.
        - seller_signatory_basis и buyer_signatory_basis:
            - "charter" — действует на основании устава.
            - "poa" — действует на основании доверенности.
            - "order" — действует на основании приказа.
            - "other" — иное основание (свидетельство, решение и т.д.).
            - "not_defined" — если основание полномочий не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации продавца."
