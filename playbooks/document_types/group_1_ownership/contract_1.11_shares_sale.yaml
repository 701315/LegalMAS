        - reverse_break_fee_status = "defined" только если специальный reverse break fee
          прямо предусмотрен как отдельное договорное условие.
        - assignment_restriction_status = "defined" только если ограничение уступки прав
          прямо сформулировано; не выводи из общих положений об уступке по ст. 382 ГК РФ.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания оснований расторжения."
          required: true
        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "Основания расторжения договора."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "long_stop_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания long-stop date."
          required: false
        - name: "long_stop_date_details"
          type: "string"
          presentation: "fact"
          label: "Long-stop date"
          description: "Предельная дата, после которой стороны вправе отказаться от сделки."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "break_fee_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия break fee."
          required: false
        - name: "break_fee_details"
          type: "string"
          presentation: "fact"
          label: "Break fee"
          description: "Размер и условия уплаты break fee."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "reverse_break_fee_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия reverse break fee."
          required: false
        - name: "reverse_break_fee_details"
          type: "string"
          presentation: "fact"
          label: "Reverse break fee"
          description: "Размер и условия уплаты reverse break fee."
          required: false
          display_in_grid: false
        - name: "assignment_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничения на уступку прав."
          required: false
        - name: "assignment_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Ограничение уступки прав"
          description: "Формулировка об ограничении уступки прав по договору."
          required: false
          display_in_grid: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:

    missing_seller_details:
      text: >
        Просим предоставить по {doc_names} полные реквизиты Продавца:
        наименование / ФИО, ИНН, ОГРН / ОГРНИП, юридический адрес.
      addressee: "Продавец"

    missing_buyer_details:
      text: >
        Просим предоставить по {doc_names} полные реквизиты Покупателя:
        наименование / ФИО, ИНН, ОГРН / ОГРНИП, юридический адрес.
      addressee: "Покупатель"

    missing_target_details:
      text: >
        Просим предоставить по {doc_names} полные реквизиты target-компании /
        эмитента: наименование, ОГРН, ИНН, организационно-правовая форма.
      addressee: "Продавец"

    missing_seller_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Продавца (устав, доверенность, протокол назначения).
      addressee: "Продавец"

    missing_buyer_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Покупателя (устав, доверенность, протокол назначения).
      addressee: "Покупатель"

    missing_spousal_consent:
      text: >
        Просим предоставить по {doc_names} нотариальное согласие супруга Продавца
        (если Продавец — физическое лицо) либо документы, подтверждающие личный
        режим имущества / отсутствие брака / наличие брачного договора.
      addressee: "Продавец / Нотариус"

  corporate_asset_subject_extraction:

    missing_asset_type:
      text: >
        Просим уточнить по {doc_names}, какой именно корпоративный актив
        отчуждается: доля в ООО или акции АО (с указанием типа).
      addressee: "Продавец"

    missing_share_ratio:
      text: >
        Просим предоставить по {doc_names} точный размер доли в уставном капитале
        (в процентах) и её номинальную стоимость.
      addressee: "Продавец"

    missing_shares_quantity:
      text: >
        Просим предоставить по {doc_names} количество отчуждаемых акций,
        их тип (обыкновенные / привилегированные) и государственный
        регистрационный номер выпуска.
      addressee: "Продавец"

    missing_price:
      text: >
        Просим предоставить по {doc_names} цену сделки в рублях и/или
        иностранной валюте с указанием валюты и порядка оплаты.
      addressee: "Продавец / Покупатель"

  transfer_mechanics_and_title_check:

    missing_llc_notarization:
      text: >
        Внимание: для сделки с долей ООО требуется нотариальное удостоверение
        (ст. 21 ФЗ-14). Просим подтвердить нотариальное удостоверение
        по {doc_names}.
      addressee: "Нотариус / Юридический советник"

    missing_llc_egrul:
      text: >
        Просим подтвердить по {doc_names} порядок подачи нотариусом заявления
        в ЕГРЮЛ и срок внесения записи о переходе доли.
      addressee: "Нотариус"

    missing_shares_registry_step:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие передачу
        акций через регистратора / депозитарий (передаточное распоряжение,
        подтверждение записи на лицевой счёт / счёт депо).
      addressee: "Регистратор / Депозитарий"

    missing_title_confirmation:
      text: >
        Просим предоставить по {doc_names} правоустанавливающие документы,
        подтверждающие право собственности Продавца на долю / акции.
      addressee: "Продавец"

    missing_encumbrance_confirmation:
      text: >
        Просим предоставить по {doc_names} письменное подтверждение отсутствия
        залога, ареста и прав третьих лиц на долю / акции.
      addressee: "Продавец"

  corporate_procedure_compliance_check:

    missing_preemptive_rights:
      text: >
        Просим предоставить по {doc_names} документы о соблюдении
        преимущественного права участников / акционеров:
        оферты, отказы, протоколы.
      addressee: "Продавец / Корпоративный юрист"

    missing_corporate_approvals:
      text: >
        Просим предоставить по {doc_names} корпоративные решения об одобрении
        сделки (крупная сделка / сделка с заинтересованностью) либо правовое
        заключение о ненужности одобрения.
      addressee: "Корпоративный юрист"

    missing_charter_restrictions:
      text: >
        Просим предоставить актуальную редакцию устава target для проверки
        ограничений на отчуждение доли / акций.
      addressee: "Продавец"

    missing_fas_analysis:
      text: >
        Просим предоставить по {doc_names} антимонопольный анализ необходимости
        согласования с ФАС России либо подтверждение, что согласование не требуется.
      addressee: "Антимонопольный консультант"

  price_and_payment_mechanics:

    missing_payment_structure:
      text: >
        Просим уточнить по {doc_names} структуру платежей:
        upfront / deferred / escrow / earn-out, с указанием сумм и сроков.
      addressee: "Покупатель / Финансовый советник"

    missing_escrow_release:
      text: >
        Просим предоставить по {doc_names} условия release средств с эскроу-счёта:
        события, сроки, порядок уведомления.
      addressee: "Финансовый советник"

    missing_price_adjustment:
      text: >
        Просим уточнить по {doc_names}, предусмотрен ли механизм корректировки
        цены (working capital adjustment, debt/cash-free) и порядок расчёта.
      addressee: "Финансовый советник"

    missing_late_payment:
      text: >
        Просим уточнить по {doc_names} последствия просрочки оплаты
        (неустойка, право расторжения, удержание документов).
      addressee: "Юридический советник"

  warranties_and_indemnity_check:

    missing_warranties_package:
      text: >
        Просим предоставить по {doc_names} полный перечень заверений Продавца
        (title, taxes, litigation, IP, licenses, employment, compliance).
      addressee: "Продавец"

    missing_indemnity:
      text: >
        Просим уточнить по {doc_names} механизм indemnity (компенсации потерь)
        при нарушении заверений.
      addressee: "Юридический советник"

    missing_cap:
      text: >
        Просим уточнить по {doc_names} лимит ответственности Продавца (cap)
        и его размер.
      addressee: "Юридический советник"

    missing_claim_period:
      text: >
        Просим уточнить по {doc_names} срок предъявления требований
        по заверениям (claim period).
      addressee: "Юридический советник"

  due_diligence_and_disclosure_check:

    missing_dd:
      text: >
        Просим предоставить по {doc_names} информацию о проведённом Due Diligence,
        перечень раскрытых документов и доступ к data room.
      addressee: "Продавец / DD-координатор"

    missing_disclosure_letter:
      text: >
        Просим предоставить по {doc_names} disclosure letter с раскрытием
        возможных нарушений заверений.
      addressee: "Продавец"

    missing_reliance_position:
      text: >
        Просим уточнить по {doc_names}, полагается ли Покупатель на заверения
        Продавца (reliance) либо исключительно на результаты DD (no-reliance).
      addressee: "Юридический советник"

  closing_conditions_and_payment_mechanics_check:

    missing_cp:
      text: >
        Просим предоставить по {doc_names} полный список conditions precedent (CP),
        подлежащих выполнению до closing.
      addressee: "Юридический советник"

    missing_long_stop:
      text: >
        Просим уточнить по {doc_names} long-stop date — предельный срок
        выполнения CP.
      addressee: "Юридический советник"

    missing_closing_sequence:
      text: >
        Просим предоставить по {doc_names} closing agenda — последовательность
        действий сторон и closing deliverables.
      addressee: "Юридический советник"

  mac_clause_check:

    missing_mac:
      text: >
        Просим уточнить по {doc_names} наличие MAC/MAE clause, её определение,
        carve-outs и последствия (termination right / price adjustment).
      addressee: "Юридический советник покупателя"

  interim_period_covenants_check:

    missing_interim_covenants:
      text: >
        Просим уточнить по {doc_names} перечень ковенантов промежуточного периода
        (ordinary course, запрет дивидендов, займов, отчуждения активов)
        и последствия их нарушения.
      addressee: "Юридический советник"

  change_of_control_contracts_check:

    missing_coc_disclosure:
      text: >
        Просим предоставить по {doc_names} перечень ключевых договоров target
        с CoC-условиями и статус получения согласий контрагентов.
      addressee: "Продавец"

  sanctions_and_beneficial_ownership_check:

    missing_sanctions_rep:
      text: >
        Просим предоставить по {doc_names} санкционные заверения обеих сторон
        (включая подтверждение отсутствия в санкционных списках).
      addressee: "Продавец / Покупатель"

    missing_ubo:
      text: >
        Просим предоставить по {doc_names} UBO chart — цепочку владения до
        физических лиц.
      addressee: "Покупатель"

    missing_source_of_funds:
      text: >
        Просим предоставить по {doc_names} подтверждение законного происхождения
        средств (source of funds).
      addressee: "Покупатель"

  post_closing_obligations_check:

    missing_non_compete:
      text: >
        Просим уточнить по {doc_names} условия non-compete (срок, территория,
        виды деятельности, carve-outs).
      addressee: "Юридический советник"

    missing_tax_allocation:
      text: >
        Просим уточнить по {doc_names} распределение ответственности
        за pre-closing налоговые обязательства target.
      addressee: "Налоговый консультант"

  termination_and_disputes_check:

    missing_break_fee:
      text: >
        Просим уточнить по {doc_names} наличие break fee / reverse break fee,
        их размер и условия выплаты.
      addressee: "Юридический советник"

    missing_confidentiality:
      text: >
        Просим уточнить по {doc_names} условия конфиденциальности
        (срок, исключения, режим раскрытия информации).
      addressee: "Юридический советник"

    missing_dispute_forum:
      text: >
        Просим уточнить по {doc_names} суд / арбитраж для разрешения споров
        и применимое право.
      addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

    
