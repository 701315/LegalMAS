  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Due Diligence и раскрытие информации
  # ──────────────────────────────────────────────────────────────────────────
  - id: due_diligence_and_disclosure_check
    name: "Due Diligence, data room, disclosure letter, reliance покупателя"
    description: >
      Фактографическая проверка наличия в договоре положений о DD, data room,
      disclosure letter, позиции покупателя по reliance / no-reliance и порядка
      взаимодействия при выявленных DD-issues.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "due diligence"
        - "проверка компании"
        - "раскрытие информации"
        - "data room"
        - "виртуальная комната данных"
        - "disclosure letter"
        - "reliance"
        - "no-reliance"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)due\\s+diligence"
        - "(?i)data\\s+room|виртуальн(ая|ой)\\s+комнат"
        - "(?i)disclosure\\s+letter"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: Due Diligence и раскрытие информации.

        Нормативный ориентир:
        - ст. 10 ГК РФ — добросовестность
        - ст. 431.2 ГК РФ — заверения как часть механизма раскрытия

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание DD / проверки компании.
        2. Есть ли ссылка на data room или перечень раскрытых документов.
        3. Есть ли disclosure letter (раскрытие нарушений заверений).
        4. Есть ли позиция покупателя по reliance (полагается на заверения)
           или no-reliance (только на результаты DD).
        5. Есть ли порядок взаимодействия при выявленных DD-issues.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — DD урегулирован:
        Фрагмент:
        "Покупатель провёл due diligence Target в период с 01.02.2024 по 28.02.2024
        на основании документов, размещённых в виртуальной комнате данных. Продавец
        предоставил disclosure letter от 01.03.2024. Покупатель полагается на заверения
        Продавца (reliance)."

        Ответ:
        {
          "dd_status": "defined",
          "dd_details": "due diligence проведён с 01.02.2024 по 28.02.2024",
          "data_room_status": "defined",
          "data_room_details": "виртуальная комната данных",
          "disclosure_letter_status": "defined",
          "disclosure_letter_details": "disclosure letter от 01.03.2024",
          "buyer_reliance_status": "defined",
          "buyer_reliance_details": "reliance — Покупатель полагается на заверения",
          "dd_issues_procedure_status": "not_defined",
          "dd_issues_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Покупатель провёл due diligence Target в период с 01.02.2024 по 28.02.2024 на основании документов, размещённых в виртуальной комнате данных."
            }
          ]
        }

        Пример 2 — DD не упомянут:
        Фрагмент:
        "Стороны договорились о продаже корпоративных прав."

        Ответ:
        {
          "dd_status": "not_defined",
          "dd_details": "Данные не определены",
          "data_room_status": "not_defined",
          "data_room_details": "Данные не определены",
          "disclosure_letter_status": "not_defined",
          "disclosure_letter_details": "Данные не определены",
          "buyer_reliance_status": "not_defined",
          "buyer_reliance_details": "Данные не определены",
          "dd_issues_procedure_status": "not_defined",
          "dd_issues_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о проведении DD.
        2. Найди прямую цитату о data room или перечне документов.
        3. Найди прямую цитату о disclosure letter.
        4. Найди прямую цитату о reliance / no-reliance.
        5. Найди прямую цитату о порядке при DD-issues.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай содержание DD.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "dd_status": "<defined / not_defined>",
          "dd_details": "<текст или 'Данные не определены'>",
          "data_room_status": "<defined / not_defined>",
          "data_room_details": "<текст или 'Данные не определены'>",
          "disclosure_letter_status": "<defined / not_defined>",
          "disclosure_letter_details": "<текст или 'Данные не определены'>",
          "buyer_reliance_status": "<defined / not_defined>",
          "buyer_reliance_details": "<reliance / no_reliance / 'Данные не определены'>",
          "dd_issues_procedure_status": "<defined / not_defined>",
          "dd_issues_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "due diligence"
        - "data room"
        - "раскрытие информации"
        - "disclosure letter"
        - "reliance"
        - "no-reliance"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "procedures"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "dd_status"
