          "de_minimis_basket_status": "<defined / not_defined>",
          "de_minimis_basket_details": "<текст или 'Данные не определены'>",
          "claim_period_status": "<defined / not_defined>",
          "claim_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
