        Проверяется только один вопрос: post-closing ограничения и налоговые аспекты.

        Нормативный ориентир:
        - ст. 421 ГК РФ — non-compete / non-solicit как договорные условия
        - НК РФ — НДФЛ, налог на прибыль, pre-closing tax liabilities

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли non-compete clause (срок, территория, виды деятельности).
        2. Есть ли non-solicit clause (ключевые сотрудники, клиенты).
        3. Есть ли налоговые оговорки / распределение налоговых рисков.
        4. Есть ли указание на то, кто несёт ответственность за pre-closing налоги target.
        5. Есть ли налоговая индемнити.
        6. Есть ли порядок взаимодействия при налоговых проверках.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — post-closing определён:
        Фрагмент:
        "Продавец принимает на себя обязательство не осуществлять конкурирующую
        деятельность в течение 3 лет после закрытия на территории России.
        Продавец также обязуется не переманивать сотрудников Target в течение
        2 лет. Продавец несёт ответственность за все налоговые обязательства
        Target за период до закрытия сделки (pre-closing taxes)."

        Ответ:
