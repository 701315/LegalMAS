        1. indemnity_status — "defined" если специальный механизм возмещения потерь / убытков при нарушении заверений прямо предусмотрен, иначе "not_defined".
        2. indemnity_details — формулировка об indemnity.
        3. liability_cap_status — "defined" если лимит ответственности (cap) продавца прямо указан, иначе "not_defined".
        4. liability_cap_details — формулировка о размере совокупного лимита ответственности.
