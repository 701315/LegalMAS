  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Заверения, indemnity, cap, basket, claim period
  # ──────────────────────────────────────────────────────────────────────────
  - id: warranties_and_indemnity_check
    name: "Заверения об обстоятельствах, indemnity, cap, basket, claim period"
    description: >
      Фактографическая проверка наличия пакета заверений продавца (title, taxes,
      litigation, licenses, IP, employment, compliance), механизма indemnity,
      лимита ответственности (cap), порогов de minimis/basket и срока предъявления
      требований (claim period).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "representations and warranties"
        - "гарантии и заверения"
        - "налоги уплачены"
        - "судебные споры"
        - "indemnity"
        - "компенсация потерь"
        - "лимит ответственности"
        - "cap"
        - "de minimis"
        - "basket"
        - "срок предъявления требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заверени(я|е)\\s+об\\s+обстоятельств"
        - "(?i)representations\\s+and\\s+warranties"
        - "(?i)indemnity|компенсац(ия|ии)\\s+потер"
        - "(?i)лимит\\s+ответственност"
        - "(?i)de\\s+minimis|basket|cap"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: заверения об обстоятельствах, indemnity
        и ограничения ответственности.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах
        - ст. 15, 393 ГК РФ — возмещение убытков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли пакет заверений продавца (title, taxes, litigation, IP,
           licenses, employment, compliance).
        2. Есть ли механизм indemnity (компенсации потерь при нарушении заверений).
        3. Есть ли лимит ответственности (cap) и его размер.
        4. Есть ли пороги de minimis / basket.
        5. Есть ли срок предъявления требований по заверениям (claim period).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — заверения есть:
        Фрагмент:
        "Продавец заверяет: (а) все налоги уплачены; (б) отсутствуют судебные споры;
        (в) все лицензии действительны. При нарушении заверений Покупатель вправе
        требовать компенсации убытков (indemnity). Совокупный лимит ответственности
        Продавца (cap) составляет 100% покупной цены. Порог de minimis — 500 000 рублей.
        Срок предъявления требований — 24 месяца с даты закрытия."

        Ответ:
        {
          "warranties_status": "defined",
          "tax_warranty_status": "defined",
          "tax_warranty_details": "все налоги уплачены",
          "litigation_warranty_status": "defined",
          "litigation_warranty_details": "отсутствуют судебные споры",
          "license_warranty_status": "defined",
          "license_warranty_details": "все лицензии действительны",
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Данные не определены",
          "ip_warranty_status": "not_defined",
          "ip_warranty_details": "Данные не определены",
          "compliance_warranty_status": "not_defined",
          "compliance_warranty_details": "Данные не определены",
          "indemnity_status": "defined",
          "indemnity_details": "право требовать компенсации убытков при нарушении заверений",
          "liability_cap_status": "defined",
          "liability_cap_details": "100% покупной цены",
          "de_minimis_basket_status": "defined",
          "de_minimis_basket_details": "порог de minimis — 500 000 рублей",
          "claim_period_status": "defined",
          "claim_period_details": "24 месяца с даты закрытия",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Продавец заверяет: все налоги уплачены; отсутствуют судебные споры; все лицензии действительны."
            }
          ]
        }

        Пример 2 — заверений нет:
        Фрагмент:
        "Продавец передаёт долю на условиях «как есть»."

        Ответ:
        {
          "warranties_status": "not_defined",
          "tax_warranty_status": "not_defined",
          "tax_warranty_details": "Данные не определены",
          "litigation_warranty_status": "not_defined",
          "litigation_warranty_details": "Данные не определены",
          "license_warranty_status": "not_defined",
          "license_warranty_details": "Данные не определены",
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Данные не определены",
          "ip_warranty_status": "not_defined",
          "ip_warranty_details": "Данные не определены",
          "compliance_warranty_status": "not_defined",
          "compliance_warranty_details": "Данные не определены",
          "indemnity_status": "not_defined",
          "indemnity_details": "Данные не определены",
          "liability_cap_status": "not_defined",
          "liability_cap_details": "Данные не определены",
          "de_minimis_basket_status": "not_defined",
          "de_minimis_basket_details": "Данные не определены",
          "claim_period_status": "not_defined",
          "claim_period_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Продавец передаёт долю на условиях «как есть»."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждому типу заверений (tax, litigation, IP и т.д.).
        2. Найди прямую цитату о механизме indemnity.
        3. Найди прямую цитату о cap и его размере.
        4. Найди прямую цитату о de minimis / basket.
        5. Найди прямую цитату о claim period.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай заверения.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "warranties_status": "<defined / not_defined>",
          "tax_warranty_status": "<defined / not_defined>",
          "tax_warranty_details": "<текст или 'Данные не определены'>",
          "litigation_warranty_status": "<defined / not_defined>",
          "litigation_warranty_details": "<текст или 'Данные не определены'>",
          "license_warranty_status": "<defined / not_defined>",
          "license_warranty_details": "<текст или 'Данные не определены'>",
          "title_warranty_status": "<defined / not_defined>",
