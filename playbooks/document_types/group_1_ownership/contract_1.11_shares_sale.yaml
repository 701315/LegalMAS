          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "смена контроля"
        - "change of control"
        - "ключевые договоры"
        - "кредитный договор"
        - "согласие контрагентов"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "coc_risk_addressed"
          type: "string"
          allowed_values: ["yes", "no", "partial", "not_found"]
          description: "Урегулирован ли CoC-риск"
        - name: "key_contracts_disclosed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Раскрыты ли ключевые контракты target"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны сделки: продавец, покупатель, target-компания"
    description: "Проверяет идентификацию продавца, покупателя и реквизитов общества/эмитента"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "общество"
        - "эмитент"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "seller_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип продавца"
        - name: "buyer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип покупателя"
      store_payload: true

  - id: "corporate_asset_identification"
    name: "Предмет: идентификация доли / акций и реквизитов общества"
    description: "Проверяет достаточную индивидуализацию корпоративного актива"
    legal_base: "ст. 454, 455 ГК РФ, ФЗ-14, ФЗ-39"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "доля в уставном капитале"
        - "акции"
        - "размер доли"
        - "номинальная стоимость"
        - "номер выпуска"
        - "эмитент"
        - "ОГРН"
        - "ИНН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"
        - "(?i)(государственн(ый|ого)\\s+регистрационн(ый|ого)\\s+номер\\s+выпуска)"
        - "(?i)(ЕГРЮЛ|лист\\s+записи\\s+ЕГРЮЛ)"

  - id: "price_required"
    name: "Цена корпоративного актива"
    description: "Цена является существенным условием возмездной сделки"
    legal_base: "ст. 424, 454 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "покупная цена"
        - "цена доли"
        - "цена акций"
        - "рублей"
        - "USD"
        - "EUR"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "price_amount"
          type: "string"
          keyword_hints: ["цена", "стоимость", "покупная цена"]
          description: "Цена сделки"
        - name: "price_currency"
          type: "string"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_found"]
          keyword_hints: ["руб", "USD", "EUR", "евро", "доллар"]
          description: "Валюта цены"
      store_payload: true

  - id: "llc_notarization_clause"
    name: "ООО: нотариальное удостоверение сделки"
    description: "Проверяет наличие нотариальной формы для сделки с долей ООО"
    legal_base: "ст. 21 ФЗ-14"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["llc_share_sale"]
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "удостоверено нотариусом"
        - "нотариус"
        - "ЕГРЮЛ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ое|ой)\\s+удостоверен"
        - "(?i)нотариус.*ЕГРЮЛ"

  - id: "llc_preemptive_right_procedure"
    name: "ООО: соблюдение преимущественного права покупки и уставных ограничений"
    description: "Проверяет раскрытие процедуры преимущественного права и ограничений устава"
    legal_base: "ст. 21 ФЗ-14"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["llc_share_sale"]
    rules:
      keywords:
        - "преимущественное право покупки"
        - "оферта участникам"
        - "отказ участников"
        - "срок для акцепта"
        - "устав общества"
        - "согласие общества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)оферт[аы]\\s+участник"

  - id: "jsc_transfer_procedure"
    name: "АО: порядок перехода прав на акции"
    description: "Проверяет наличие механизма перехода прав через регистратора/депозитарий"
    legal_base: "ФЗ-39, ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["jsc_share_sale"]
    rules:
      keywords:
        - "передаточное распоряжение"
        - "регистратор"
        - "реестродержатель"
        - "депозитарий"
        - "счет депо"
        - "лицевой счет"
        - "внесение записи"
