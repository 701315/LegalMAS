  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет сделки и параметры актива
  # ──────────────────────────────────────────────────────────────────────────
  - id: corporate_asset_subject_extraction
    name: "Предмет сделки: идентификация доли/акций, параметры актива и цена"
    description: >
      Фактографическая проверка полноты описания предмета сделки: тип актива,
      реквизиты общества/эмитента, размер доли в процентах, номинальная стоимость,
      количество и тип акций, номер выпуска, цена сделки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "доля в уставном капитале"
        - "акции"
        - "эмитент"
        - "общество с ограниченной ответственностью"
        - "акционерное общество"
        - "размер доли"
        - "номинальная стоимость"
        - "количество акций"
        - "цена"
        - "стоимость"
        - "покупная цена"
      keyword_mode: "any"
      regex_patterns:
        - "{{ share_ratio }}"
        - "{{ issue_number }}"
        - "{{ egrul_record }}"
        - "{{ money_amount }}"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: предмет сделки — идентификация актива и цена.

        Нормативный ориентир:
        - ст. 432, 455 ГК РФ — предмет договора
        - ст. 21 ФЗ-14 — идентификация доли ООО
        - ФЗ-39 — идентификация акций
        - ст. 424 ГК РФ — цена

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип актива (доля в ООО / акции АО / смешанное).
        2. Реквизиты target-компании/эмитента (наименование, ОГРН, ИНН).
        3. Размер доли в процентах и номинальная стоимость (для ООО).
        4. Количество и тип акций (для АО).
        5. Номер выпуска акций (для АО).
        6. Цена сделки и валюта.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён:
        Фрагмент:
        "Продавец продаёт Покупателю долю в размере 51% уставного капитала
        ООО «Гамма» (ОГРН 1027700000003, ИНН 7700000003), номинальной стоимостью
        51 000 рублей. Цена доли составляет 5 000 000 рублей."

        Ответ:
        {
          "asset_type": "llc_share",
          "target_name_status": "defined",
          "target_name_details": "ООО «Гамма»",
          "target_ogrn_status": "defined",
          "target_ogrn_details": "1027700000003",
          "target_inn_status": "defined",
          "target_inn_details": "7700000003",
          "share_ratio_status": "defined",
          "share_ratio_details": "51%",
          "share_nominal_status": "defined",
          "share_nominal_details": "51 000 рублей",
          "shares_quantity_status": "not_defined",
          "shares_quantity_details": "Данные не определены",
          "shares_type_status": "not_defined",
          "shares_type_details": "Данные не определены",
          "issue_number_status": "not_defined",
          "issue_number_details": "Данные не определены",
          "price_status": "defined",
          "price_details": "5 000 000 рублей",
          "price_currency": "RUB",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец продаёт Покупателю долю в размере 51% уставного капитала ООО «Гамма», номинальной стоимостью 51 000 рублей. Цена доли составляет 5 000 000 рублей."
            }
          ]
        }

        Пример 2 — предмет не определён:
        Фрагмент:
        "Продавец продаёт корпоративные права Покупателю."

        Ответ:
        {
          "asset_type": "not_defined",
          "target_name_status": "not_defined",
          "target_name_details": "Данные не определены",
          "target_ogrn_status": "not_defined",
          "target_ogrn_details": "Данные не определены",
          "target_inn_status": "not_defined",
          "target_inn_details": "Данные не определены",
          "share_ratio_status": "not_defined",
          "share_ratio_details": "Данные не определены",
          "share_nominal_status": "not_defined",
          "share_nominal_details": "Данные не определены",
          "shares_quantity_status": "not_defined",
          "shares_quantity_details": "Данные не определены",
          "shares_type_status": "not_defined",
          "shares_type_details": "Данные не определены",
          "issue_number_status": "not_defined",
          "issue_number_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "price_currency": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе актива.
        2. Найди прямую цитату о реквизитах target.
        3. Найди прямую цитату о размере доли / количестве акций.
        4. Найди прямую цитату о номере выпуска (для АО).
        5. Найди прямую цитату о цене сделки.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай параметры актива.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "asset_type": "<llc_share / shares / mixed / not_defined>",
          "target_name_status": "<defined / not_defined>",
          "target_name_details": "<текст или 'Данные не определены'>",
          "target_ogrn_status": "<defined / not_defined>",
          "target_ogrn_details": "<текст или 'Данные не определены'>",
          "target_inn_status": "<defined / not_defined>",
          "target_inn_details": "<текст или 'Данные не определены'>",
          "share_ratio_status": "<defined / not_defined>",
          "share_ratio_details": "<текст или 'Данные не определены'>",
          "share_nominal_status": "<defined / not_defined>",
          "share_nominal_details": "<текст или 'Данные не определены'>",
          "shares_quantity_status": "<defined / not_defined>",
          "shares_quantity_details": "<текст или 'Данные не определены'>",
          "shares_type_status": "<defined / not_defined>",
          "shares_type_details": "<ordinary / preferred / mixed / 'Данные не определены'>",
          "issue_number_status": "<defined / not_defined>",
          "issue_number_details": "<текст или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "price_currency": "<RUB / USD / EUR / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доля в уставном капитале акции эмитент общество с ограниченной ответственностью акционерное общество размер доли номинальная стоимость количество акций цена сделки покупная цена номер выпуска акций ОГРН target ИНН target"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "структура платежей"
        - "escrow"
        - "эскроу"
        - "earn-out"
        - "отложенный платёж"
        - "корректировка цены"
        - "working capital"
        - "последствия просрочки"
        - "ЕГРЮЛ"
        - "нотариус подаёт заявление"
        - "регистратор"
        - "closing"
        - "заверения"
        - "conditions precedent"
        - "due diligence"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 2100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора купли-продажи корпоративных
        прав данные о предмете сделки: тип актива, реквизиты target, параметры доли
        или акций и цена.
        Не анализируй стороны договора, механизм перехода права или заверения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. asset_type — "llc_share" / "shares" / "mixed" / "not_defined".
        2. target_name_status — "defined" если наименование target прямо указано, иначе "not_defined".
        3. target_name_details — наименование target-компании.
        4. target_ogrn_status — "defined" если ОГРН target прямо указан, иначе "not_defined".
        5. target_ogrn_details — ОГРН target-компании.
        6. target_inn_status — "defined" если ИНН target прямо указан, иначе "not_defined".
        7. target_inn_details — ИНН target-компании.
        8. share_ratio_status — "defined" если размер доли в % прямо указан, иначе "not_defined".
        9. share_ratio_details — размер доли в уставном капитале в процентах.
        10. share_nominal_status — "defined" если номинальная стоимость доли прямо указана, иначе "not_defined".
        11. share_nominal_details — номинальная стоимость доли.
        12. shares_quantity_status — "defined" если количество акций прямо указано, иначе "not_defined".
        13. shares_quantity_details — количество акций.
        14. shares_type_status — "defined" если тип акций прямо указан, иначе "not_defined".
        15. shares_type_details — "ordinary" / "preferred" / "mixed" / "Данные не определены".
        16. issue_number_status — "defined" если номер выпуска акций прямо указан, иначе "not_defined".
        17. issue_number_details — номер выпуска акций.
        18. price_status — "defined" если цена сделки прямо указана, иначе "not_defined".
        19. price_details — цена сделки с валютой.
        20. price_currency — "RUB" / "USD" / "EUR" / "other" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - asset_type: 
            - "llc_share" — при продаже доли в ООО.
            - "shares" — при продаже акций АО.
            - "mixed" — если продаётся и то, и другое.
            - "not_defined" — если тип актива прямо не определён.
        - shares_type_details:
            - "ordinary" — обыкновенные акции.
            - "preferred" — привилегированные акции.
            - "mixed" — продаются акции обоих типов.
            - "Данные не определены" — тип акций не указан.
        - price_currency:
            - "RUB" — рубли.
            - "USD" — доллары США.
            - "EUR" — евро.
            - "other" — иная валюта, прямо названная в тексте.
            - "not_defined" — валюта не указана.
        - Не путай цену сделки с номинальной стоимостью доли.
        - Верни только JSON.
        </rules>
      fields:
        - name: "asset_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["llc_share", "shares", "mixed", "not_defined"]
          description: "Тип корпоративного актива."
          required: true
        - name: "target_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания наименования target."
          required: true
        - name: "target_name_details"
          type: "string"
          presentation: "fact"
          label: "Target: наименование"
          description: "Наименование target-компании."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "target_ogrn_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
