          "arrest_status": "not_defined",
          "arrest_details": "Данные не определены",
          "third_party_rights_status": "not_defined",
          "third_party_rights_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о нотариальном удостоверении (для ООО).
        2. Найди прямую цитату о ЕГРЮЛ (для ООО).
        3. Найди прямую цитату о передаточном распоряжении / регистраторе (для АО).
        4. Найди прямую цитату о closing sequence.
