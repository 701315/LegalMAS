  - id: mac_clause_check
    name: "MAC/MAE: существенное неблагоприятное изменение"
    description: >
      Проверяет наличие и параметры MAC/MAE clause — права покупателя отказаться
      от сделки при существенном ухудшении бизнеса target между подписанием и закрытием.
