      context_k: 7
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "преимущественное право"
        - "корпоративное одобрение"
        - "ФАС"
        - "ограничения устава"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "preemptive_rights_status"
          type: "string"
          allowed_values: ["complied", "not_addressed", "not_applicable", "unclear"]
          description: "Статус соблюдения преимущественного права"
        - name: "corporate_approvals_status"
          type: "string"
          allowed_values: ["obtained", "not_addressed", "not_required_stated", "unclear"]
          description: "Статус корпоративных одобрений"
        - name: "fas_clearance_status"
          type: "string"
          allowed_values: ["required_and_addressed", "stated_not_required", "not_addressed", "unclear"]
          description: "Статус ФАС-согласования"
      store_payload: true

  - id: transfer_mechanics_check
    name: "Порядок перехода права на долю / акции"
    description: >
      Проверяет механизм перехода права: нотариальная регистрация для ООО,
      записи у регистратора/депозитария для акций, подача документов и closing steps.
