        weight: -0.3
        description: "Конвертируемый займ, а не прямой SPA"

      - pattern: "(?i)увеличен[иие]\\s+уставн[огоый]\\s+капитал[ао]"
        severity: soft
        weight: -0.25
        description: "Увеличение УК, не продажа существующих долей/акций"

      - pattern: "(?i)эмисси[яи]\\s+дополнительн[ыхые]\\s+акци[йяия]"
        severity: soft
        weight: -0.25
        description: "Эмиссия новых акций"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы][-_\\s]?продаж[ьи]\\s+имуществ[ао]\\s+компан[ииии]"
        severity: soft
        weight: -0.35
        description: "Asset deal (продажа имущества компании), а не shares deal"

      - pattern: "(?i)продаж[аи]\\s+имуществ[ао]\\s+предприяти[яи]"
        severity: soft
        weight: -0.35
        description: "Продажа имущественного комплекса, ближе к asset deal"

      - pattern: "(?i)продаж[аи]\\s+активов\\s+компан[ииии]"
        severity: soft
        weight: -0.3
        description: "Продажа активов, не обязательно корпоративных прав"

      - pattern: "(?i)корпоративн[ыйоеы]й\\s+договор"
        severity: soft
        weight: -0.35
        description: "Корпоративный договор (shareholders' agreement) — регулирует управление, а не отчуждение"

      - pattern: "(?i)акционерн(?:ое|ый)\\s+соглашен[иеи]"
        severity: soft
        weight: -0.35
        description: "Акционерное соглашение — сопутствующий, но не тождественный SPA документ"

      - pattern: "(?i)решени[ея]\\s+участник[аов]\\s+(ооо|общества)"
        severity: soft
        weight: -0.25
        description: "Решение единственного участника о продаже/одобрении, часто прилагается к SPA"

