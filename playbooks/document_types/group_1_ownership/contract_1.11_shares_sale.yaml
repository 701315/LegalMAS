    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цену сделки и структуру
        платежей: upfront, escrow, deferred, earn-out, механизм корректировки цены
        и последствия просрочки.
        Не анализируй заверения, ковенанты, механизм перехода права или стороны.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. price_status — "defined" если размер цены прямо указан, иначе "not_defined".
        2. price_details — размер цены сделки.
        3. price_currency — "RUB" / "USD" / "EUR" / "other" / "not_defined".
        4. payment_structure_code — "upfront" / "deferred" / "escrow" / "earn_out" / "mixed" / "not_defined".
        5. payment_structure_details — описание структуры платежей.
        6. escrow_release_status — "defined" если условия раскрытия эскроу (release) прямо описаны, иначе "not_defined".
        7. escrow_release_details — формулировка об условиях release.
        8. price_adjustment_status — "defined" если механизм корректировки цены прямо описан, иначе "not_defined".
        9. price_adjustment_details — формулировка о механизме корректировки.
        10. payment_deadline_status — "defined" если срок оплаты прямо указан, иначе "not_defined".
        11. payment_deadline_details — срок оплаты.
        12. late_payment_status — "defined" если последствия просрочки прямо описаны, иначе "not_defined".
        13. late_payment_details — последствия просрочки.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не смешивай покупную цену сделки с номинальной стоимостью доли в уставном капитале.
        - price_currency:
            - "RUB" — российские рубли.
            - "USD" — доллары США.
            - "EUR" — евро.
            - "other" — иная валюта, прямо названная в тексте.
            - "not_defined" — валюта прямо не указана.
        - payment_structure_code:
            - "upfront" — вся сумма уплачивается единовременно без удержаний.
            - "deferred" — часть или вся сумма уплачивается отложенным платежом (без escrow и earn-out).
            - "escrow" — часть суммы резервируется на эскроу-счёте.
            - "earn_out" — часть суммы зависит от достижения target-компанией будущих показателей.
            - "mixed" — комбинация двух и более указанных структур.
            - "not_defined" — структура платежей прямо не определена.
        - Верни только JSON.
        </rules>
      fields:
        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания цены сделки."
          required: true
        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена сделки"
          description: "Цена продажи корпоративного актива."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "price_currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта цены сделки."
          required: false
        - name: "payment_structure_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["upfront", "deferred", "escrow", "earn_out", "mixed", "not_defined"]
          description: "Структура платежей."
          required: false
        - name: "payment_structure_details"
          type: "string"
          presentation: "fact"
          label: "Структура платежей"
          description: "Описание структуры платежей по сделке."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "escrow_release_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения условий release из эскроу."
          required: false
        - name: "escrow_release_details"
          type: "string"
          presentation: "fact"
          label: "Условия release из эскроу"
          description: "Условия release средств из эскроу-счёта."
          required: false
          display_in_grid: false
        - name: "price_adjustment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия механизма корректировки цены."
          required: false
        - name: "price_adjustment_details"
          type: "string"
          presentation: "fact"
          label: "Корректировка цены"
          description: "Механизм корректировки цены (working capital, debt/cash-free и т.п.)."
          required: false
          display_in_grid: false
        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока оплаты."
          required: false
        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: "Срок оплаты цены сделки."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "late_payment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условий о последствиях просрочки."
          required: false
        - name: "late_payment_details"
          type: "string"
          presentation: "fact"
          label: "Последствия просрочки оплаты"
          description: "Последствия просрочки оплаты цены сделки."
          required: false
          display_in_grid: false
      store_payload: true

