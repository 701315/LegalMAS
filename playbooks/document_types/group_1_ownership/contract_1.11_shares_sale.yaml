          "compliance_warranty_status": "not_defined",
          "compliance_warranty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о налоговых заверениях.
        2. Найди прямую цитату об отсутствии споров.
        3. Найди прямую цитату о лицензиях / разрешениях.
        4. Найди прямую цитату о праве target на своё имущество.
        5. Найди прямую цитату об интеллектуальной собственности.
        6. Найди прямую цитату о compliance / соблюдении законодательства.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай заверения.
        8. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

