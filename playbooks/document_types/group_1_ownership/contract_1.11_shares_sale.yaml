        - "свободна от прав третьих лиц"
        - "правоустанавливающие документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)свободн(а|ы)\\s+от\\s+обременен"
        - "(?i)не\\s+заложен"
        - "(?i)не\\s+находится\\s+под\\s+арест"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: подтверждение титула продавца на актив
        и отсутствие обременений / прав третьих лиц.

        Нормативный ориентир:
        - ст. 460 ГК РФ — обязанность передать товар свободным от прав третьих лиц
        - общая практика representations and warranties в M&A

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не подставляй нормы закона вместо текста договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое подтверждение права собственности продавца на продаваемый актив.
        2. Есть ли прямое указание на отсутствие залога.
        3. Есть ли прямое указание на отсутствие ареста или запрета распоряжения.
        4. Есть ли прямое указание на отсутствие прав третьих лиц или иных обременений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — титул и отсутствие обременений подтверждены:
        Фрагмент:
        "Продавец подтверждает, что ему на праве собственности принадлежит продаваемая
        доля в уставном капитале Общества. Указанная доля не заложена, не находится
        под арестом и свободна от прав третьих лиц."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "Продавец подтверждает, что ему на праве собственности принадлежит продаваемая доля в уставном капитале Общества",
          "pledge_status": "defined",
