  - id: title_and_encumbrances_check
    name: "Титул продавца на актив и отсутствие обременений (ст. 460 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре подтверждения права собственности
      продавца на корпоративный актив и заверений об отсутствии залога, ареста,
      прав третьих лиц.
    triggers: {}
    ui_mode: "field_extraction"
