  - id: interim_period_covenants_check
    name: "Промежуточный период: ковенанты между подписанием и закрытием"
    description: >
      Проверяет наличие ограничений на деятельность target-компании между signing и closing:
      обычная хозяйственная деятельность, запреты на дивиденды, заимствования,
      крупные сделки, изменение уставного капитала.
    triggers:
      any: ["interim_period_present"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "промежуточный период"
