#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ═══════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur|доллар|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  issue_number: "(?i)(государственн(ый|ого)\\s+регистрационн(ый|ого)\\s+номер\\s+выпуска|регистрационн(ый|ого)\\s+номер\\s+выпуска)"
  egrul_record: "(?i)(ЕГРЮЛ|лист\\s+записи\\s+ЕГРЮЛ|номер\\s+записи\\s+в\\s+ЕГРЮЛ)"
  share_ratio: "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "llc_notarization_required"
    name: "ООО: обязательная нотариальная форма сделки с долей"
    description: >
      Сделка по отчуждению доли в ООО подлежит обязательному нотариальному удостоверению.
      Несоблюдение нотариальной формы влечёт недействительность сделки.
    legal_base: "ст. 21 ФЗ-14 «Об ООО», ст. 163 ГК РФ"
    required_triggers: ["llc_share_sale"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "заявление в ЕГРЮЛ"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "нотариальное удостоверение"
        - "доля в ООО"
        - "ЕГРЮЛ"
      rerank: true

  - id: "jsc_transfer_record_required"
    name: "АО: переход прав на акции требует учетной записи у регистратора/депозитария"
    description: >
      Для перехода прав на акции недостаточно подписания договора;
      требуется надлежащее оформление передаточных документов и внесение записи
      по лицевому счету / счету депо.
    legal_base: "ГК РФ, ФЗ-39 «О рынке ценных бумаг»"
    required_triggers: ["jsc_share_sale"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "передаточное распоряжение"
        - "регистратор"
        - "реестродержатель"
        - "счет депо"
        - "лицевой счет"
        - "внесение записи в реестр"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "передаточное распоряжение"
        - "реестр акционеров"
        - "счет депо"
      rerank: true

  - id: "preemptive_rights_and_corporate_restrictions"
    name: "Преимущественное право / корпоративные ограничения должны быть соблюдены"
    description: >
      Для долей в ООО и отдельных акций/непубличных АО требуется анализ
      преимущественных прав, ограничений устава и корпоративных процедур.
    legal_base: "ФЗ-14 «Об ООО», ФЗ-208 «Об АО», устав общества"
    required_triggers: ["llc_share_sale"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "преимущественное право покупки"
        - "оферта участникам"
        - "отказ участников"
        - "согласие общества"
        - "ограничения устава"
        - "корпоративные ограничения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "преимущественное право"
        - "оферта участникам"
        - "устав общества"
      rerank: true

  - id: "fas_approval_required"
    name: "Необходимость предварительного согласия ФАС на экономическую концентрацию"
    description: >
      Сделка по приобретению корпоративного контроля может требовать предварительного
      согласия ФАС России. Отсутствие проверки этого вопроса создаёт высокий риск
      regulatory breach.
    legal_base: "ФЗ-135 «О защите конкуренции»"
    required_triggers: ["majority_stake_sale", "fas_clearance_risk"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ФАС"
        - "антимонопольное согласование"
