        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "принадлежит на праве"
        - "свободна от обременений"
        - "залог доли"
        - "арест"
        - "права третьих лиц"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "title_confirmation"
          type: "string"
          allowed_values: ["confirmed", "partial", "not_found"]
          description: "Подтверждён ли титул продавца"
        - name: "encumbrances_warranty"
          type: "string"
          allowed_values: ["clean", "encumbered", "not_addressed", "not_found"]
          description: "Статус обременений"
        - name: "pledge_status"
          type: "string"
          allowed_values: ["no_pledge", "pledged", "not_addressed", "not_found"]
          description: "Наличие залога"
      store_payload: true

  - id: change_of_control_contracts_check
    name: "Change of control: влияние на ключевые договоры target"
    description: >
      Проверяет раскрытие и урегулирование рисков change of control — наличие
      у target контрактов с CoC-клаузами (кредиты, лицензии, ключевые контракты),
      которые могут сработать при смене собственника.
    triggers:
      any: ["change_of_control_risk", "majority_stake_sale"]
