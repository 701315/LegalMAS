        - "дивиденды"
        - "interim period"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 750

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "interim_covenants_status"
          type: "string"
