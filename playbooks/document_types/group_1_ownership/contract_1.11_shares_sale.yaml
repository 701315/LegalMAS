           (ФАС, ЦБ и т.п.), прямо указан, иначе "not_defined".
        4. cp_regulatory_details — формулировка о таком регуляторном CP.
        5. cp_corporate_status — "defined" если CP, связанный с корпоративными одобрениями
           (собрание, совет директоров), прямо указан, иначе "not_defined".
        6. cp_corporate_details — формулировка о таком корпоративном CP.
        7. long_stop_date_status — "defined" если long-stop date прямо указана, иначе "not_defined".
        8. long_stop_date_details — дата или формулировка о long-stop date.
        9. termination_on_cp_failure_status — "defined" если право отказаться от сделки
           при неисполнении CP прямо предусмотрено, иначе "not_defined".
        10. termination_on_cp_failure_details — формулировка о праве отказа.
        11. closing_sequence_status — "defined" если последовательность действий
            при closing прямо описана, иначе "not_defined".
        12. closing_sequence_details — формулировка о closing sequence.
        13. closing_deliverables_status — "defined" если перечень документов, подтверждений
            или действий, которые стороны предоставляют при closing, прямо указан,
            иначе "not_defined".
        14. closing_deliverables_details — формулировка о closing deliverables.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - cp_status = "defined" только если conditions precedent прямо перечислены или
          охарактеризованы как условия закрытия; не выводи CP из общего смысла договора.
        - cp_regulatory_status = "defined" только если регуляторное одобрение прямо
          обозначено в договоре как CP.
        - cp_corporate_status = "defined" только если корпоративное одобрение прямо
          обозначено в договоре как CP.
        - closing_sequence_status = "defined" только если порядок действий при closing
          прямо описан (пошагово или в виде перечня).
        - closing_deliverables_status = "defined" только если перечислены конкретные
          документы, подтверждения, действия или deliverables, подлежащие предоставлению
          именно при closing.
        - Верни только JSON.
        </rules>
      fields:
        - name: "cp_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия перечня conditions precedent."
          required: true
        - name: "cp_details"
          type: "string"
          presentation: "fact"
          label: "Conditions Precedent"
          description: "Перечень условий закрытия сделки."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "cp_regulatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус CP, связанного с регуляторными одобрениями."
          required: false
        - name: "cp_regulatory_details"
          type: "string"
          presentation: "fact"
          label: "CP: регуляторные одобрения"
          description: "CP, требующий регуляторного одобрения."
          required: false
          display_in_grid: false
        - name: "cp_corporate_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус CP, связанного с корпоративными одобрениями."
          required: false
        - name: "cp_corporate_details"
          type: "string"
          presentation: "fact"
          label: "CP: корпоративные одобрения"
          description: "CP, требующий корпоративного одобрения."
          required: false
          display_in_grid: false
        - name: "long_stop_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания long-stop date."
          required: false
        - name: "long_stop_date_details"
          type: "string"
          presentation: "fact"
          label: "Long-stop date"
          description: "Предельная дата для выполнения условий закрытия."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "termination_on_cp_failure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права отказа при неисполнении CP."
          required: false
        - name: "termination_on_cp_failure_details"
          type: "string"
          presentation: "fact"
          label: "Право отказа при неисполнении CP"
          description: "Формулировка о праве отказаться от сделки при неисполнении CP."
          required: false
          display_in_grid: false
        - name: "closing_sequence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия closing sequence."
          required: false
        - name: "closing_sequence_details"
          type: "string"
          presentation: "fact"
          label: "Closing sequence"
          description: "Формулировка о последовательности действий при закрытии."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Ковенанты промежуточного периода
  # ──────────────────────────────────────────────────────────────────────────
  - id: interim_period_covenants_check
    name: "Промежуточный период: ковенанты между подписанием и закрытием"
    description: >
      Фактографическая проверка наличия ограничений на деятельность target-компании
      между signing и closing: обычная хозяйственная деятельность, запреты
      на дивиденды, заимствования, крупные сделки, изменение уставного капитала,
      необходимость согласия покупателя.
    triggers:
      any: ["interim_period_present"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "промежуточный период"
        - "interim period"
        - "обычная хозяйственная деятельность"
        - "ordinary course"
        - "запрет на дивиденды"
        - "не допускать изменений"
        - "без согласия покупателя"
        - "ковенанты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обычн(ая|ой)\\s+хозяйствен"
        - "(?i)ordinary\\s+course"
        - "(?i)промежуточн(ый|ого)\\s+период"
        - "(?i)без\\s+(предварительного\\s+)?согласия\\s+покупател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: ковенанты промежуточного периода (от signing
        до closing) — ограничения на деятельность target.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязательство вести бизнес target в обычном режиме.
        2. Есть ли перечень запрещённых действий без согласия покупателя.
        3. Есть ли запрет на дивиденды.
        4. Есть ли запрет на новые заимствования.
        5. Есть ли запрет на отчуждение активов.
        6. Есть ли последствия нарушения ковенантов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ковенанты определены:
        Фрагмент:
        "В период между подписанием и закрытием сделки Продавец обязуется обеспечить
        ведение бизнеса Target в обычном хозяйственном режиме. Без предварительного
        согласия Покупателя запрещены: выплата дивидендов, привлечение новых займов
        свыше 1 000 000 рублей, отчуждение основных средств. Нарушение ковенантов
        даёт Покупателю право отказаться от договора."

        Ответ:
        {
          "interim_covenants_status": "defined",
          "ordinary_course_status": "defined",
          "ordinary_course_details": "обязуется вести бизнес Target в обычном хозяйственном режиме",
          "restricted_actions_status": "defined",
          "restricted_actions_details": "выплата дивидендов; привлечение займов свыше 1 000 000 руб.; отчуждение основных средств",
          "buyer_consent_status": "defined",
          "buyer_consent_details": "без предварительного согласия Покупателя",
          "dividend_restriction_status": "defined",
          "dividend_restriction_details": "запрет выплаты дивидендов",
          "borrowing_restriction_status": "defined",
          "borrowing_restriction_details": "запрет займов свыше 1 000 000 рублей",
          "asset_disposal_restriction_status": "defined",
          "asset_disposal_restriction_details": "запрет отчуждения основных средств",
          "breach_consequences_status": "defined",
          "breach_consequences_details": "право Покупателя отказаться от договора",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "В период между подписанием и закрытием сделки Продавец обязуется обеспечить ведение бизнеса Target в обычном хозяйственном режиме."
            }
          ]
        }

        Пример 2 — ковенантов нет:
        Фрагмент:
        "Продавец обязуется передать долю Покупателю."

        Ответ:
        {
          "interim_covenants_status": "not_defined",
          "ordinary_course_status": "not_defined",
          "ordinary_course_details": "Данные не определены",
          "restricted_actions_status": "not_defined",
          "restricted_actions_details": "Данные не определены",
          "buyer_consent_status": "not_defined",
          "buyer_consent_details": "Данные не определены",
          "dividend_restriction_status": "not_defined",
          "dividend_restriction_details": "Данные не определены",
          "borrowing_restriction_status": "not_defined",
          "borrowing_restriction_details": "Данные не определены",
          "asset_disposal_restriction_status": "not_defined",
          "asset_disposal_restriction_details": "Данные не определены",
          "breach_consequences_status": "not_defined",
          "breach_consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обычном режиме деятельности.
        2. Найди прямой перечень запрещённых действий.
        3. Найди прямые цитаты о дивидендах, займах, отчуждении активов.
        4. Найди прямую цитату о последствиях нарушения.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай ковенанты.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "interim_covenants_status": "<defined / not_defined>",
          "ordinary_course_status": "<defined / not_defined>",
          "ordinary_course_details": "<текст или 'Данные не определены'>",
          "restricted_actions_status": "<defined / not_defined>",
          "restricted_actions_details": "<текст или 'Данные не определены'>",
          "buyer_consent_status": "<defined / not_defined>",
          "buyer_consent_details": "<текст или 'Данные не определены'>",
          "dividend_restriction_status": "<defined / not_defined>",
          "dividend_restriction_details": "<текст или 'Данные не определены'>",
          "borrowing_restriction_status": "<defined / not_defined>",
          "borrowing_restriction_details": "<текст или 'Данные не определены'>",
          "asset_disposal_restriction_status": "<defined / not_defined>",
          "asset_disposal_restriction_details": "<текст или 'Данные не определены'>",
          "breach_consequences_status": "<defined / not_defined>",
          "breach_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "промежуточный период interim period обычная хозяйственная деятельность ordinary course запрет на дивиденды не допускать изменений без согласия покупателя ковенанты дивиденды заимствования отчуждение активов нарушение ковенантов"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "conditions precedent"
        - "long-stop date"
        - "closing deliverables"
        - "преимущественное право"
        - "корпоративное одобрение pre-signing"
        - "ФАС"
        - "due diligence"
        - "заверения"
        - "indemnity"
        - "cap"
        - "санкции"
        - "AML"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 750

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора купли-продажи корпоративных
        прав ковенанты промежуточного периода: обязательство ordinary course, перечень
        запрещённых действий, необходимость согласия покупателя, запреты на дивиденды,
        заимствования и отчуждение активов, а также последствия нарушения ковенантов.
        Не анализируй заверения, indemnity, цену или механизм перехода права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. interim_covenants_status — "defined" если ковенанты промежуточного периода
           (период между signing и closing) прямо предусмотрены, иначе "not_defined".
        2. ordinary_course_status — "defined" если обязательство вести деятельность
           target в обычном хозяйственном режиме (ordinary course) прямо указано,
           иначе "not_defined".
        3. ordinary_course_details — формулировка об ordinary course.
        4. restricted_actions_status — "defined" если перечень или описание действий,
           запрещённых или ограниченных в промежуточный период, прямо указаны,
           иначе "not_defined".
        5. restricted_actions_details — формулировка или перечень запрещённых действий.
        6. buyer_consent_status — "defined" если прямо указано, что отдельные действия
           в промежуточный период допускаются только с предварительного согласия
           покупателя, иначе "not_defined".
        7. buyer_consent_details — формулировка о необходимости согласия покупателя.
        8. dividend_restriction_status — "defined" если запрет на выплату дивидендов
           в промежуточный период прямо указан, иначе "not_defined".
        9. dividend_restriction_details — формулировка о запрете дивидендов.
        10. borrowing_restriction_status — "defined" если запрет или ограничение
            новых заимствований в промежуточный период прямо указаны, иначе "not_defined".
        11. borrowing_restriction_details — формулировка об ограничении заимствований.
        12. asset_disposal_restriction_status — "defined" если запрет или ограничение
            на отчуждение активов в промежуточный период прямо указаны, иначе "not_defined".
        13. asset_disposal_restriction_details — формулировка об ограничении отчуждения активов.
        14. breach_consequences_status — "defined" если последствия нарушения ковенантов
            промежуточного периода прямо указаны, иначе "not_defined".
        15. breach_consequences_details — формулировка о последствиях нарушения.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - interim_covenants_status = "defined" только если ограничения прямо относятся
          к периоду между signing и closing или иному явно обозначенному промежуточному
          периоду до закрытия сделки.
        - ordinary_course_status = "defined" только если обязательство вести деятельность
          в обычном режиме прямо сформулировано в тексте.
        - buyer_consent_status = "defined" только если согласие покупателя прямо требуется
          для совершения конкретных действий в промежуточный период.
        - restricted_actions_status = "defined" только если имеется прямой перечень или
          прямое описание ограниченных действий; не выводи запреты из общего контекста.
        - Верни только JSON.
        </rules>
      fields:
        - name: "interim_covenants_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия ковенантов промежуточного периода."
          required: true
        - name: "ordinary_course_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания обязательства ordinary course."
          required: false
        - name: "ordinary_course_details"
          type: "string"
          presentation: "fact"
          label: "Ordinary course"
          description: "Обязательство вести бизнес target в обычном режиме."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "restricted_actions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня запрещённых действий."
          required: false
        - name: "restricted_actions_details"
          type: "string"
          presentation: "fact"
          label: "Запрещённые действия"
          description: "Перечень действий, запрещённых без согласия покупателя."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "buyer_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания необходимости согласия покупателя на действия в промежуточный период."
          required: false
        - name: "buyer_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие покупателя"
          description: "Формулировка о необходимости предварительного согласия покупателя."
          required: false
          display_in_grid: false
        - name: "dividend_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета дивидендов."
          required: false
        - name: "dividend_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Запрет дивидендов"
          description: "Формулировка запрета выплаты дивидендов в промежуточный период."
          required: false
          display_in_grid: false
        - name: "borrowing_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета новых заимствований."
          required: false
        - name: "borrowing_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Запрет заимствований"
          description: "Формулировка запрета новых заимствований в промежуточный период."
          required: false
          display_in_grid: false
        - name: "asset_disposal_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета отчуждения активов."
          required: false
        - name: "asset_disposal_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Запрет отчуждения активов"
          description: "Формулировка запрета отчуждения активов target."
          required: false
          display_in_grid: false
        - name: "breach_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания последствий нарушения ковенантов."
          required: false
        - name: "breach_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения ковенантов"
          description: "Последствия нарушения ковенантов промежуточного периода."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Санкции, AML/KYC, бенефициарные владельцы
  # ──────────────────────────────────────────────────────────────────────────
  - id: sanctions_and_beneficial_ownership_check
    name: "Санкции, AML/KYC, бенефициарные владельцы (UBO)"
    description: >
      Фактографическая проверка наличия в договоре заверений о санкционном статусе,
      раскрытия бенефициарных владельцев (UBO), источника средств, AML/KYC-пакета
      и права приостановить closing при compliance-проблеме.
    triggers:
      any: ["cross_border_party"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "санкции"
        - "бенефициарный владелец"
        - "конечный бенефициар"
        - "источник средств"
        - "AML"
        - "KYC"
        - "комплаенс"
        - "право отказа от closing"
        - "иностранное лицо"
        - "нерезидент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)AML|KYC"
        - "(?i)бенефициарн(ый|ого)\\s+владел"
        - "(?i)источник\\s+средств"
        - "(?i)санкц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: санкционный статус, AML/KYC, бенефициарные
        владельцы.

        Нормативный ориентир:
        - ФЗ-115 — идентификация бенефициарных владельцев
        - Санкционное законодательство — запрет сделок с лицами из санкционных списков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли санкционные заверения (и покрывают ли обе стороны).
        2. Есть ли раскрытие бенефициарных владельцев (UBO).
        3. Есть ли условие об источнике средств (source of funds).
        4. Есть ли AML/KYC-пакет или ссылка на него.
        5. Есть ли право приостановить/прекратить closing при compliance-проблеме.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — sanctions compliance урегулированы:
        Фрагмент:
        "Каждая из сторон заверяет, что она и её бенефициарные владельцы не включены
        в санкционные списки SDN, EU, UN. Покупатель раскрывает UBO chart. Источник
        средств подтверждён документально. При обнаружении compliance-нарушений любая
        сторона вправе приостановить closing."

        Ответ:
        {
          "sanctions_rep_status": "defined",
          "sanctions_rep_details": "стороны и их бенефициарные владельцы не включены в санкционные списки SDN, EU, UN",
          "sanctions_covers_both_parties": "yes",
          "ubo_disclosure_status": "defined",
          "ubo_disclosure_details": "Покупатель раскрывает UBO chart",
          "source_of_funds_status": "defined",
          "source_of_funds_details": "источник средств подтверждён документально",
          "compliance_termination_status": "defined",
          "compliance_termination_details": "право любой стороны приостановить closing при compliance-нарушениях",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Каждая из сторон заверяет, что она и её бенефициарные владельцы не включены в санкционные списки SDN, EU, UN."
            }
          ]
        }

        Пример 2 — compliance не упомянут:
        Фрагмент:
        "Стороны гарантируют выполнение условий настоящего договора."

        Ответ:
        {
          "sanctions_rep_status": "not_defined",
          "sanctions_rep_details": "Данные не определены",
          "sanctions_covers_both_parties": "not_defined",
          "ubo_disclosure_status": "not_defined",
          "ubo_disclosure_details": "Данные не определены",
          "source_of_funds_status": "not_defined",
          "source_of_funds_details": "Данные не определены",
          "compliance_termination_status": "not_defined",
          "compliance_termination_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о санкционных заверениях.
        2. Найди прямую цитату о покрытии обеих сторон санкционными заверениями.
        3. Найди прямую цитату о UBO.
        4. Найди прямую цитату об источнике средств.
        5. Найди прямую цитату о праве приостановить closing.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай структуру собственности.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "sanctions_rep_status": "<defined / not_defined>",
          "sanctions_rep_details": "<текст или 'Данные не определены'>",
          "sanctions_covers_both_parties": "<yes / no / not_defined>",
          "ubo_disclosure_status": "<defined / not_defined>",
          "ubo_disclosure_details": "<текст или 'Данные не определены'>",
          "source_of_funds_status": "<defined / not_defined>",
          "source_of_funds_details": "<текст или 'Данные не определены'>",
          "compliance_termination_status": "<defined / not_defined>",
          "compliance_termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "санкции бенефициарный владелец конечный бенефициар источник средств AML KYC комплаенс право отказа от closing иностранное лицо нерезидент UBO SDN EU UN санкционные списки источник финансирования"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "налоги уплачены"
        - "судебные споры"
        - "лицензии"
        - "IP"
        - "compliance как часть warranty package"
        - "indemnity"
        - "cap"
        - "basket"
        - "conditions precedent"
        - "due diligence"
        - "ковенанты"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора купли-продажи корпоративных
        прав условия о санкционном статусе сторон, раскрытии бенефициарных владельцев
        (UBO), подтверждении источника средств, AML/KYC-пакете и праве приостановить
        или прекратить closing при compliance-нарушениях.
        Не анализируй заверения о налогах, цену или механизм перехода права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. sanctions_rep_status — "defined" если санкционные заверения прямо присутствуют
           в тексте договора, иначе "not_defined".
        2. sanctions_rep_details — формулировка санкционных заверений.
        3. sanctions_covers_both_parties — "yes" / "no" / "not_defined".
        4. ubo_disclosure_status — "defined" если раскрытие бенефициарных владельцев (UBO)
           прямо предусмотрено или осуществлено в тексте, иначе "not_defined".
        5. ubo_disclosure_details — формулировка о раскрытии UBO.
        6. source_of_funds_status — "defined" если источник средств прямо подтверждён
           или подтверждение источника прямо предусмотрено договором, иначе "not_defined".
        7. source_of_funds_details — формулировка об источнике средств.
        8. compliance_termination_status — "defined" если право приостановить, не закрывать
           или прекратить closing при compliance-нарушении прямо предусмотрено,
           иначе "not_defined".
        9. compliance_termination_details — формулировка о таком праве.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - sanctions_covers_both_parties:
            - "yes" — если санкционные заверения прямо распространяются на обе стороны
              сделки (и продавца, и покупателя).
            - "no" — если санкционные заверения в тексте прямо относятся только к одной
              из сторон.
            - "not_defined" — если из текста невозможно прямо установить охват обеих сторон
              или санкционных заверений нет вовсе.
        - sanctions_rep_status = "defined" только если санкционный статус, санкционные
          списки или compliance-заявления прямо упомянуты; не выводи из общих заверений.
        - ubo_disclosure_status = "defined" только если раскрытие бенефициарных владельцев
          прямо предусмотрено или осуществлено.
        - source_of_funds_status = "defined" только если источник средств прямо
          подтверждён или требуется подтвердить его документально.
        - compliance_termination_status = "defined" только если именно compliance-проблема
          названа основанием для приостановки или прекращения closing.
        - Верни только JSON.
        </rules>
      fields:
        - name: "sanctions_rep_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия санкционных заверений."
          required: true
        - name: "sanctions_rep_details"
          type: "string"
          presentation: "fact"
          label: "Санкционные заверения"
          description: "Формулировка санкционных заверений сторон."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "sanctions_covers_both_parties"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Покрывают ли санкционные заверения обе стороны."
          required: false
        - name: "ubo_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия UBO."
          required: false
        - name: "ubo_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие UBO"
          description: "Формулировка о раскрытии бенефициарных владельцев."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "source_of_funds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения источника средств."
          required: false
        - name: "source_of_funds_details"
          type: "string"
          presentation: "fact"
          label: "Источник средств"
          description: "Формулировка о подтверждении источника средств покупателя."
          required: false
          display_in_grid: false
        - name: "compliance_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права приостановить closing при compliance-нарушениях."
          required: false
        - name: "compliance_termination_details"
          type: "string"
          presentation: "fact"
          label: "Право приостановить closing"
          description: "Формулировка о праве приостановить closing при compliance-нарушениях."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: Post-closing: неконкуренция и налоговые риски
  # ──────────────────────────────────────────────────────────────────────────
  - id: post_closing_obligations_check
    name: "Post-closing обязательства: неконкуренция, non-solicit, налоговые риски"
    description: >
      Фактографическая проверка наличия в договоре post-closing ограничений
      на конкуренцию и solicitation, а также налоговых оговорок по сделке
      и распределения pre-closing налоговых рисков target.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неконкуренция"
        - "non-compete"
        - "непереманивание сотрудников"
        - "non-solicit"
        - "запрет на конкурирующую деятельность"
        - "налоговые обязательства"
        - "НДФЛ"
        - "налог на прибыль"
        - "tax indemnity"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)non[- ]?compete|неконкуренц"
        - "(?i)non[- ]?solicit|непереманив"
        - "(?i)налогов(ые|ых|ой)\\s+обязательств"
        - "(?i)\\bНДФЛ\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: post-closing ограничения и налоговые аспекты.

        Нормативный ориентир:
        - ст. 421 ГК РФ — non-compete / non-solicit как договорные условия
        - НК РФ — НДФЛ, налог на прибыль, pre-closing tax liabilities

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли non-compete clause (срок, территория, виды деятельности).
        2. Есть ли non-solicit clause (ключевые сотрудники, клиенты).
        3. Есть ли налоговые оговорки / распределение налоговых рисков.
        4. Есть ли указание на то, кто несёт ответственность за pre-closing налоги target.
        5. Есть ли налоговая индемнити.
        6. Есть ли порядок взаимодействия при налоговых проверках.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — post-closing определён:
        Фрагмент:
        "Продавец принимает на себя обязательство не осуществлять конкурирующую
        деятельность в течение 3 лет после закрытия на территории России.
        Продавец также обязуется не переманивать сотрудников Target в течение
        2 лет. Продавец несёт ответственность за все налоговые обязательства
        Target за период до закрытия сделки (pre-closing taxes)."

        Ответ:
        {
          "non_compete_status": "defined",
          "non_compete_details": "3 года после закрытия, территория России",
          "non_compete_duration_status": "defined",
          "non_compete_duration_details": "3 года после закрытия",
          "non_compete_territory_status": "defined",
          "non_compete_territory_details": "территория России",
          "non_solicit_status": "defined",
          "non_solicit_details": "не переманивать сотрудников Target в течение 2 лет",
          "tax_allocation_status": "defined",
          "tax_allocation_details": "Продавец несёт ответственность за все налоговые обязательства за период до закрытия",
          "pre_closing_tax_liability": "seller",
          "tax_indemnity_status": "not_defined",
          "tax_indemnity_details": "Данные не определены",
          "tax_audit_cooperation_status": "not_defined",
          "tax_audit_cooperation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Продавец принимает на себя обязательство не осуществлять конкурирующую деятельность в течение 3 лет после закрытия на территории России."
            }
          ]
        }

        Пример 2 — post-closing не определён:
        Фрагмент:
        "Покупатель принимает долю в том состоянии, в котором она находится."

        Ответ:
        {
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "non_compete_duration_status": "not_defined",
          "non_compete_duration_details": "Данные не определены",
          "non_compete_territory_status": "not_defined",
          "non_compete_territory_details": "Данные не определены",
          "non_solicit_status": "not_defined",
          "non_solicit_details": "Данные не определены",
          "tax_allocation_status": "not_defined",
          "tax_allocation_details": "Данные не определены",
          "pre_closing_tax_liability": "not_defined",
          "tax_indemnity_status": "not_defined",
          "tax_indemnity_details": "Данные не определены",
          "tax_audit_cooperation_status": "not_defined",
          "tax_audit_cooperation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о non-compete (срок, территория).
        2. Найди прямую цитату о non-solicit.
        3. Найди прямую цитату о распределении налоговых рисков.
        4. Найди прямую цитату о pre-closing налогах.
        5. Найди прямую цитату о налоговой индемнити.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай ставки налогов.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
