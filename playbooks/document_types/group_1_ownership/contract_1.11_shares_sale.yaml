          description: "Описан ли механизм перехода права"
        - name: "llc_egrul_step"
          type: "string"
          allowed_values: ["described", "not_applicable", "not_found"]
          description: "Описан ли этап с ЕГРЮЛ для ООО"
        - name: "shares_registry_step"
