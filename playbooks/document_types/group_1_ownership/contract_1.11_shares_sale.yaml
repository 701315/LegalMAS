# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты продавца, покупателя
      и target-компании/эмитента, включая ИНН, ОГРН, адреса, бенефициаров
      и полномочия подписантов.
    addressee: "Обе стороны"

  corporate_asset_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: точное описание предмета сделки —
      доля/акции, размер участия, количество акций, тип акций, номер выпуска,
      реквизиты общества, цена и структура владения до/после сделки.
    addressee: "Продавец / Юридический советник"

  corporate_asset_identification:
    text: >
      Просим уточнить в {doc_names}: реквизиты target-компании, размер доли,
      номинальную стоимость, номер записи ЕГРЮЛ или номер выпуска акций,
      количество и категорию акций.
    addressee: "Продавец"

  price_required:
    text: >
      Просим подтвердить цену сделки по {doc_names}, валюту платежа,
      порядок расчёта цены и наличие корректировок/удержаний.
    addressee: "Обе стороны"

  corporate_procedure_compliance_check:
    text: >
      Просим предоставить по {doc_names}: доказательства соблюдения
      преимущественного права, корпоративных ограничений устава,
      одобрений и анализа необходимости согласования ФАС.
    addressee: "Юридический советник"

  transfer_mechanics_check:
    text: >
      Просим уточнить в {doc_names}: последовательность перехода права
      на долю/акции, действия нотариуса / регистратора / депозитария,
      срок внесения записей и closing sequence.
    addressee: "Юридический советник / Нотариус / Регистратор"

  llc_notarization_clause:
    text: >
      Для {doc_names} (доля в ООО) просим подтвердить нотариальную форму сделки,
      данные нотариуса и порядок подачи документов в ЕГРЮЛ.
    addressee: "Нотариус / Юридический советник"

  llc_preemptive_right_procedure:
    text: >
      Просим предоставить по {doc_names}: оферты участникам/обществу,
      отказы от преимущественного права, положения устава об ограничениях,
      а также подтверждение соблюдения сроков процедуры.
    addressee: "Продавец / Корпоративный юрист"

  jsc_transfer_procedure:
    text: >
      Для {doc_names} (акции) просим предоставить: передаточное распоряжение,
      инструкции регистратору/депозитарию, подтверждение открытия лицевого счета /
      счета депо покупателя и порядок внесения записи о переходе прав.
    addressee: "Продавец / Регистратор / Депозитарий"

  corporate_approvals:
    text: >
      Просим предоставить по {doc_names}: протоколы/решения об одобрении
      крупной сделки или сделки с заинтересованностью либо правовое заключение
      о том, что одобрение не требуется.
    addressee: "Юридический советник каждой стороны"

  fas_clearance_check:
    text: >
      Просим предоставить по {doc_names}: антимонопольный анализ, проект/копию
      ходатайства в ФАС (если требуется) либо заключение о том, что согласование
      не требуется.
    addressee: "Антимонопольный консультант / Юридический советник"

  spousal_consent_check:
    text: >
      Просим предоставить по {doc_names}: нотариальное согласие супруга продавца
      либо подтверждение, что отчуждаемые доля/акции являются личной собственностью
      / продавец не состоит в браке / действует брачный договор.
    addressee: "Продавец"

  warranties_and_indemnity_check:
    text: >
      Просим предоставить по {doc_names}: полный пакет заверений продавца
      (title, taxes, litigation, licenses, IP, employment, compliance),
      а также механизм indemnity, cap, basket/de minimis и claim period.
    addressee: "Продавец / Юридический советник"

  representations_and_warranties:
    text: >
      Просим расширить в {doc_names} раздел заверений об обстоятельствах:
      титул на актив, отсутствие обременений, налоги, споры, лицензии,
      достоверность отчётности, IP, трудовые и regulatory вопросы.
    addressee: "Юридический советник продавца"

  indemnity_and_liability_cap:
    text: >
      Просим уточнить в {doc_names}: механизм компенсации потерь,
      лимит ответственности продавца, пороги de minimis/basket, сроки
      предъявления требований, исключения из cap.
    addressee: "Юридический советник"

  due_diligence_and_disclosure_check:
    text: >
      Просим предоставить по {doc_names}: перечень раскрытых документов,
      доступ к data room, disclosure letter, список выявленных DD-issues
      и их влияние на цену/closing.
    addressee: "Продавец / DD-координатор"

  due_diligence_clause:
    text: >
      Просим включить/уточнить в {doc_names}: порядок DD, data room,
      раскрытие информации, reliance/no-reliance и последствия undisclosed matters.
    addressee: "Юридический советник"

  closing_conditions_and_payment_mechanics_check:
    text: >
      Просим уточнить в {doc_names}: список CP, структуру платежей,
      наличие escrow / deferred payment / earn-out, release conditions,
      price adjustment mechanics и holdback.
    addressee: "Обе стороны / Финансовый советник"

  closing_conditions:
    text: >
      Просим согласовать в {doc_names}: conditions precedent, long-stop date,
      право отказа при неисполнении CP, closing agenda и closing deliverables.
    addressee: "Юридический советник"

  payment_mechanics:
    text: >
      Просим уточнить в {doc_names}: способ расчётов, даты и этапы платежей,
      реквизиты, escrow / retention / earn-out и условия release денежных средств.
    addressee: "Финансовый советник / Обе стороны"

  non_compete_non_solicit:
    text: >
      Просим уточнить в {doc_names}: post-closing ограничения на конкуренцию,
      solicitation сотрудников/клиентов, срок, территорию, carve-outs и санкции.
    addressee: "Юридический советник покупателя"

  tax_liabilities_allocation:
    text: >
      Просим уточнить в {doc_names}: распределение налоговых рисков,
      налоги продавца по сделке, pre-closing tax liabilities target-компании,
      порядок взаимодействия при налоговых проверках и tax indemnity.
    addressee: "Налоговый консультант"

  sanctions_and_beneficial_ownership_check:
    text: >
      Просим предоставить по {doc_names}: сведения о конечных бенефициарах,
      санкционном статусе сторон и связанных лиц, источнике средств,
      AML/KYC package и последствиях compliance breach.
    addressee: "Compliance / Юридический советник"

  sanctions_aml_kyc:
    text: >
      Просим включить в {doc_names}: санкционные заверения, UBO disclosure,
      source of funds, право suspend/terminate closing при AML/KYC issue.
    addressee: "Compliance / Юридический советник"

  confidentiality:
    text: >
      Просим уточнить в {doc_names}: режим конфиденциальности,
      список confidential information, permitted disclosures и срок действия.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: forum, арбитражную оговорку/подсудность,
      претензионный порядок, применимое право и язык производства.
    addressee: "Юридический советник"

  llc_notarization_required:
    text: >
      Внимание: для {doc_names} (сделка с долей ООО) обязательна нотариальная форма.
      Просим подтвердить нотариальное удостоверение и порядок внесения записи в ЕГРЮЛ.
    addressee: "Нотариус / Юридический советник"

  jsc_transfer_record_required:
    text: >
      Внимание: для {doc_names} переход права на акции не завершён без внесения
      записи у регистратора/депозитария. Просим предоставить все transfer documents
      и подтверждение учетной записи.
    addressee: "Регистратор / Депозитарий / Юридический советник"

  preemptive_rights_and_corporate_restrictions:
    text: >
      Внимание: по {doc_names} требуется подтверждение соблюдения
      преимущественного права и уставных ограничений. Просим предоставить
      оферты, отказы, положения устава и корпоративное заключение.
    addressee: "Корпоративный юрист"

  fas_approval_required:
    text: >
      Внимание: {doc_names} может требовать согласования с ФАС России.
      Просим предоставить антимонопольный анализ и заключение о необходимости
      либо ненужности предварительного согласия.
    addressee: "Антимонопольный консультант"

  sanctions_aml_kyc_risk:
    text: >
      Внимание: {doc_names} содержит трансграничный / compliance-элемент.
      Просим предоставить sanctions / AML / KYC пакет, UBO chart,
      source of funds и legal memo по санкционным ограничениям.
    addressee: "Compliance / Юридический советник"

  seller_title_encumbrances:
    text: >
      Просим предоставить по {doc_names}: правоустанавливающие документы на долю/акции,
      актуальную выписку ЕГРЮЛ / выписку из реестра акционеров,
      подтверждение отсутствия залога, ареста, запрета на распоряжение и прав третьих лиц.
    addressee: "Продавец / Юридический советник"

  mac_clause_check:
    text: >
      Просим уточнить в {doc_names}: определение MAC/MAE, перечень carve-outs,
      порядок определения существенности, последствия MAC (право отказа / корректировка цены),
      временной горизонт и burden of proof.
    addressee: "Юридический советник покупателя"

  mac_clause:
    text: >
      Просим включить/уточнить в {doc_names} MAC clause: определение,
      исключения, последствия и процедуру уведомления.
    addressee: "Юридический советник"

  interim_period_covenants_check:
    text: >
      Просим уточнить в {doc_names}: перечень ограничений для target между signing и closing,
      критерии «обычной хозяйственной деятельности», перечень действий, требующих
      согласия покупателя, порядок получения такого согласия и санкции за нарушение.
    addressee: "Юридический советник покупателя"

  interim_period_covenants:
    text: >
      Просим включить в {doc_names}: обязательство вести бизнес target в обычном режиме,
      запрет на распределение дивидендов, привлечение долга, крупные сделки — без согласия покупателя.
    addressee: "Юридический советник"

  seller_title_and_encumbrances_check:
    text: >
      Просим предоставить по {doc_names}: документы, подтверждающие основание приобретения
      доли/акций продавцом, актуальные справки об отсутствии залога и ареста,
      выписку ЕГРЮЛ / из реестра акционеров.
    addressee: "Продавец"

  change_of_control_contracts_check:
    text: >
      Просим предоставить по {doc_names}: перечень контрактов target с CoC-триггерами
      (кредитные договоры, лицензии, ключевые коммерческие контракты),
      статус получения согласий контрагентов и план действий по уведомлениям.
    addressee: "Продавец / DD-координатор"

  change_of_control_target_contracts:
    text: >
      Просим раскрыть для {doc_names}: все договоры target, содержащие change of control clause,
      необходимые согласия/уведомления и сроки их получения.
    addressee: "Продавец"

  termination_walk_away_rights:
    text: >
      Просим уточнить в {doc_names}: основания расторжения для каждой стороны,
      long-stop date, наличие и размер break fee / reverse break fee,
      порядок возврата авансов и deposi, последствия расторжения.
    addressee: "Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право, особенно при наличии
      трансграничного элемента, и согласовать forum/арбитражную оговорку.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим включить в {doc_names} запрет уступки прав / перевода долга
      без согласия другой стороны либо описать допустимые случаи.
    addressee: "Юридический советник"

  public_jsc_mandatory_offer:
    text: >
      Внимание: по {doc_names} при приобретении >30% голосующих акций ПАО
      возникает обязанность направить обязательное предложение (ст. 84.2 ФЗ-208).
      Просим предоставить: анализ применимости, проект обязательного предложения,
      расчёт цены и порядок финансирования.
    addressee: "Юридический советник покупателя"

  strategic_enterprise_foreign_investor:
    text: >
      Внимание: {doc_names} может подпадать под ФЗ-57 (стратегические общества).
      Просим предоставить: анализ применимости ФЗ-57, перечень видов деятельности target,
      проект ходатайства в Правительственную комиссию (если требуется).
    addressee: "Юридический советник / Антимонопольный консультант"

  non_public_jsc_preemptive_right:
    text: >
      Просим предоставить по {doc_names}: актуальную редакцию устава непубличного АО,
      подтверждение соблюдения преимущественного права акционеров (уведомления, отказы),
      корпоративное заключение о допустимости продажи третьему лицу.
    addressee: "Корпоративный юрист / Продавец"
    
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    