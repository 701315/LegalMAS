  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: Post-closing: неконкуренция и налоговые риски
  # ──────────────────────────────────────────────────────────────────────────
  - id: post_closing_obligations_check
    name: "Post-closing обязательства: неконкуренция, non-solicit, налоговые риски"
    description: >
      Фактографическая проверка наличия в договоре post-closing ограничений
      на конкуренцию и solicitation, а также налоговых оговорок по сделке
      и распределения pre-closing налоговых рисков target.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неконкуренция"
        - "non-compete"
        - "непереманивание сотрудников"
        - "non-solicit"
        - "запрет на конкурирующую деятельность"
        - "налоговые обязательства"
        - "НДФЛ"
        - "налог на прибыль"
        - "tax indemnity"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)non[- ]?compete|неконкуренц"
        - "(?i)non[- ]?solicit|непереманив"
        - "(?i)налогов(ые|ых|ой)\\s+обязательств"
