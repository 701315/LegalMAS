        <task>
        Заполни строго следующие поля:

        1. title_confirmation_status — "defined" если право собственности продавца на актив прямо подтверждено, иначе "not_defined".
        2. title_confirmation_details — формулировка о праве собственности продавца.
        3. pledge_status — "defined" если отсутствие залога прямо указано, иначе "not_defined".
        4. pledge_details — формулировка об отсутствии залога.
        5. arrest_status — "defined" если отсутствие ареста или запрета распоряжения прямо указано, иначе "not_defined".
