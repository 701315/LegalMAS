        - "уведомление контрагентов"
        - "ключевые договоры"
        - "кредитный договор"
        - "досрочное погашение"
        - "лицензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смен(а|ы|е)\\s+контрол"
        - "(?i)change\\s+of\\s+control"
        - "(?i)ключев(ые|ых)\\s+договор"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий M&A-сделку.
