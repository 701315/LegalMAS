      any: ["mac_clause_present"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "существенное неблагоприятное изменение"
        - "material adverse change"
        - "material adverse effect"
        - "MAC"
        - "MAE"
        - "существенное ухудшение"
        - "право отказаться"
        - "существенные негативные изменения"
      keyword_mode: "any"
