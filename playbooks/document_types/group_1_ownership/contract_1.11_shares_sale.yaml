          "dividend_restriction": "<yes / no / not_found>",
          "borrowing_restriction": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 550
    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
