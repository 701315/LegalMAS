        - "обычная хозяйственная деятельность"
        - "без согласия покупателя"
        - "ковенанты"
        - "дивиденды"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "interim_covenants_present"
          type: "string"
          allowed_values: ["yes", "no", "partial", "not_found"]
          description: "Есть ли ковенанты промежуточного периода"
        - name: "restricted_actions_list"
          type: "string"
          allowed_values: ["listed", "not_found"]
          description: "Перечислены ли запрещённые действия"
      store_payload: true

  - id: seller_title_and_encumbrances_check
    name: "Титул продавца и отсутствие обременений на долю/акции"
    description: >
      Проверяет подтверждение титула продавца и отсутствие обременений:
      залогов, арестов, споров, прав третьих лиц на отчуждаемую долю/акции.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "принадлежит на праве собственности"
        - "свободна от обременений"
        - "не заложена"
        - "не находится под арестом"
        - "не является предметом спора"
        - "права третьих лиц отсутствуют"
        - "правоустанавливающие документы"
        - "основание приобретения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободн(а|ы)\\s+от\\s+обременен"
        - "(?i)не\\s+залож(ена|ены)"
        - "(?i)не\\s+являет(ся|ся\\s+предметом)\\s+спор"
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор продажи корпоративных прав.
        Проверь подтверждение титула продавца и отсутствие обременений на долю/акции.

        Ответь строго в JSON:
        {
          "title_confirmation": "<confirmed / partial / not_found>",
