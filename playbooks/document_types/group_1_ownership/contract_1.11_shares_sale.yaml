      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы][-_\\s]?продаж[ьи]\\s+дол[ьи]\\s+в\\s+прав[еа]\\s+собственн[оа]ст[иьи]\\s+на\\s+недвижимост"
        severity: hard
        weight: -1.0
        description: "Доля в праве собственности на недвижимость"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы][-_\\s]?продаж[ьи]\\s+дол[ьи]\\s+в\\s+собственн[оа]ст[иьи]"
        severity: hard
        weight: -1.0
        description: "Общая долевая собственность на имущество, не корпоративные права"

      - pattern: "(?i)договор[\\s\\n\\r]+купл[иы][-_\\s]?продаж[ьи]\\s+общ[ео]\\s+имуществ[ао]\\s+в\\s+многоквартирн[омой]\\s+дом[еуа]"
        severity: hard
        weight: -1.0
        description: "Общее имущество в МКД — недвижимость"

      - pattern: "(?i)договор[\\s\\n\\r]+залог[аа]\\s+дол[ьи]"
        severity: hard
        weight: -1.0
        description: "Залог доли, а не её купля-продажа"

      - pattern: "(?i)договор[\\s\\n\\r]+залог[аа]\\s+акци[йяия]"
        severity: hard
        weight: -1.0
        description: "Залог акций, а не их продажа"

      - pattern: "(?i)договор[\\s\\n\\r]+доверительн[огоое]\\s+управлен[ияи]"
        severity: hard
        weight: -1.0
        description: "Доверительное управление, а не отчуждение"

      - pattern: "(?i)договор[\\s\\n\\r]+дарен[ияи]"
