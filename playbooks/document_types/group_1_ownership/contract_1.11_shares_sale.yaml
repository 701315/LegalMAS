  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Conditions Precedent, closing mechanics, long-stop date
  # ──────────────────────────────────────────────────────────────────────────
  - id: closing_conditions_and_payment_mechanics_check
    name: "Conditions Precedent, closing mechanics, long-stop date"
    description: >
      Фактографическая проверка наличия и содержания условий закрытия (CP),
      closing sequence, long-stop date, права отказа при неисполнении CP,
      closing deliverables.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "conditions precedent"
        - "условия закрытия"
        - "closing"
        - "выполнение условий до закрытия"
        - "право отказаться от сделки"
        - "long-stop"
        - "предельный срок"
        - "closing agenda"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)conditions\\s+precedent|условия\\s+закрыти"
        - "(?i)long[- ]?stop"
        - "(?i)closing"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: conditions precedent и механика closing.

        Нормативный ориентир:
        - ст. 157 ГК РФ — сделка под условием
        - ст. 421 ГК РФ — свобода договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли перечень conditions precedent (CP).
        2. Есть ли CP, связанные с регуляторными одобрениями.
        3. Есть ли CP, связанные с корпоративными одобрениями.
        4. Есть ли long-stop date.
        5. Есть ли право отказаться от сделки при неисполнении CP.
        6. Есть ли closing sequence (последовательность действий при закрытии).
        7. Есть ли closing deliverables (что предоставляет каждая сторона).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — CP определены:
        Фрагмент:
        "Закрытие сделки осуществляется при выполнении следующих условий: (а) получение
        одобрения ФАС; (б) корпоративное одобрение Покупателя. Long-stop date: 31.12.2024.
        Если CP не выполнены к long-stop date, любая сторона вправе отказаться от договора.
        Closing agenda согласована в Приложении № 3."

        Ответ:
        {
          "cp_status": "defined",
          "cp_details": "получение одобрения ФАС; корпоративное одобрение Покупателя",
          "cp_regulatory_status": "defined",
          "cp_regulatory_details": "получение одобрения ФАС",
          "cp_corporate_status": "defined",
          "cp_corporate_details": "корпоративное одобрение Покупателя",
          "long_stop_date_status": "defined",
          "long_stop_date_details": "31.12.2024",
          "termination_on_cp_failure_status": "defined",
          "termination_on_cp_failure_details": "любая сторона вправе отказаться от договора",
          "closing_sequence_status": "defined",
          "closing_sequence_details": "closing agenda в Приложении № 3",
          "closing_deliverables_status": "not_defined",
          "closing_deliverables_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Закрытие сделки осуществляется при выполнении следующих условий: получение одобрения ФАС; корпоративное одобрение Покупателя. Long-stop date: 31.12.2024."
            }
          ]
        }

        Пример 2 — CP не определены:
        Фрагмент:
        "Стороны закрывают сделку после подписания настоящего договора."

        Ответ:
        {
          "cp_status": "not_defined",
          "cp_details": "Данные не определены",
          "cp_regulatory_status": "not_defined",
          "cp_regulatory_details": "Данные не определены",
          "cp_corporate_status": "not_defined",
          "cp_corporate_details": "Данные не определены",
          "long_stop_date_status": "not_defined",
          "long_stop_date_details": "Данные не определены",
          "termination_on_cp_failure_status": "not_defined",
          "termination_on_cp_failure_details": "Данные не определены",
          "closing_sequence_status": "not_defined",
          "closing_sequence_details": "Данные не определены",
          "closing_deliverables_status": "not_defined",
          "closing_deliverables_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о перечне CP.
        2. Найди прямую цитату о long-stop date.
        3. Найди прямую цитату о праве отказа при неисполнении CP.
        4. Найди прямую цитату о closing sequence.
        5. Найди прямую цитату о closing deliverables.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай список CP.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "cp_status": "<defined / not_defined>",
          "cp_details": "<текст или 'Данные не определены'>",
          "cp_regulatory_status": "<defined / not_defined>",
          "cp_regulatory_details": "<текст или 'Данные не определены'>",
          "cp_corporate_status": "<defined / not_defined>",
          "cp_corporate_details": "<текст или 'Данные не определены'>",
          "long_stop_date_status": "<defined / not_defined>",
          "long_stop_date_details": "<текст или 'Данные не определены'>",
          "termination_on_cp_failure_status": "<defined / not_defined>",
          "termination_on_cp_failure_details": "<текст или 'Данные не определены'>",
          "closing_sequence_status": "<defined / not_defined>",
          "closing_sequence_details": "<текст или 'Данные не определены'>",
          "closing_deliverables_status": "<defined / not_defined>",
          "closing_deliverables_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "conditions precedent"
        - "closing"
        - "long-stop"
        - "условия закрытия"
        - "право отказаться"
        - "closing agenda"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cp_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если список CP прямо присутствует. Иначе 'not_defined'."
        - name: "cp_details"
          type: "string"
          description: "Укажи CP. Если данных нет, верни строго: 'Данные не определены'."
        - name: "long_stop_date_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если long-stop date прямо указана. Иначе 'not_defined'."
        - name: "long_stop_date_details"
          type: "string"
          description: "Укажи дату. Если данных нет, верни строго: 'Данные не определены'."
        - name: "termination_on_cp_failure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если право отказа при неисполнении CP прямо предусмотрено. Иначе 'not_defined'."
        - name: "termination_on_cp_failure_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "closing_sequence_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если closing sequence прямо описан. Иначе 'not_defined'."
        - name: "closing_sequence_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: MAC/MAE clause
  # ──────────────────────────────────────────────────────────────────────────
  - id: mac_clause_check
    name: "MAC/MAE clause: существенное неблагоприятное изменение"
    description: >
      Фактографическая проверка наличия и параметров MAC/MAE clause — права
      покупателя отказаться от сделки при существенном ухудшении бизнеса target
      между подписанием и закрытием.
    triggers:
      any: ["mac_clause_present"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "существенное неблагоприятное изменение"
        - "material adverse change"
        - "material adverse effect"
        - "MAC"
        - "MAE"
        - "существенное ухудшение"
        - "право отказаться"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)material\\s+adverse\\s+(change|effect)"
        - "(?i)существенн(ое|ого)\\s+(неблагоприятн|ухудшен)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: MAC/MAE clause — существенное неблагоприятное
        изменение.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора
        - ст. 451 ГК РФ — существенное изменение обстоятельств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли MAC/MAE clause.
        2. Как определён MAC (широко / узко / стандартно).
        3. Есть ли перечень carve-outs (событий, не являющихся MAC).
        4. Каково последствие MAC (право отказаться / корректировка цены).
        5. Есть ли порог существенности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — MAC clause есть:
        Фрагмент:
        "Под существенным неблагоприятным изменением (MAC) понимается снижение выручки
        Target более чем на 20% по сравнению с аналогичным периодом предыдущего года.
        Carve-outs: общеэкономические условия, форс-мажор, действия Покупателя.
        При наступлении MAC Покупатель вправе отказаться от договора."

        Ответ:
        {
          "mac_status": "defined",
          "mac_details": "снижение выручки Target более чем на 20%",
          "mac_definition_scope": "narrow",
          "mac_carve_outs_status": "defined",
          "mac_carve_outs_details": "общеэкономические условия, форс-мажор, действия Покупателя",
          "mac_consequence_status": "defined",
          "mac_consequence_details": "право Покупателя отказаться от договора",
          "mac_consequence_type": "termination_right",
          "mac_threshold_status": "defined",
          "mac_threshold_details": "снижение выручки более чем на 20%",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Под существенным неблагоприятным изменением (MAC) понимается снижение выручки Target более чем на 20%."
            }
          ]
        }

        Пример 2 — MAC clause нет:
        Фрагмент:
        "Стороны договорились о продаже корпоративных прав."

        Ответ:
        {
          "mac_status": "not_defined",
          "mac_details": "Данные не определены",
          "mac_definition_scope": "not_defined",
          "mac_carve_outs_status": "not_defined",
          "mac_carve_outs_details": "Данные не определены",
          "mac_consequence_status": "not_defined",
          "mac_consequence_details": "Данные не определены",
          "mac_consequence_type": "not_defined",
          "mac_threshold_status": "not_defined",
          "mac_threshold_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о MAC/MAE clause.
        2. Найди прямую цитату об определении MAC.
        3. Найди прямую цитату о carve-outs.
        4. Найди прямую цитату о последствии MAC.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай определение MAC.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "mac_status": "<defined / not_defined>",
          "mac_details": "<текст или 'Данные не определены'>",
          "mac_definition_scope": "<broad / narrow / standard / not_defined>",
          "mac_carve_outs_status": "<defined / not_defined>",
          "mac_carve_outs_details": "<текст или 'Данные не определены'>",
          "mac_consequence_status": "<defined / not_defined>",
          "mac_consequence_details": "<текст или 'Данные не определены'>",
          "mac_consequence_type": "<termination_right / price_adjustment / other / not_defined>",
          "mac_threshold_status": "<defined / not_defined>",
          "mac_threshold_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "существенное неблагоприятное изменение"
        - "material adverse"
        - "MAC"
        - "MAE"
        - "право отказаться от сделки"
        - "carve-outs"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "mac_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если MAC/MAE clause прямо присутствует. Иначе 'not_defined'."
        - name: "mac_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "mac_definition_scope"
          type: "string"
          allowed_values: ["broad", "narrow", "standard", "not_defined"]
          description: "Широта определения MAC. Если не определена — 'not_defined'."
        - name: "mac_carve_outs_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если carve-outs прямо перечислены. Иначе 'not_defined'."
        - name: "mac_carve_outs_details"
          type: "string"
          description: "Укажи carve-outs. Если данных нет, верни строго: 'Данные не определены'."
        - name: "mac_consequence_type"
          type: "string"
          allowed_values: ["termination_right", "price_adjustment", "other", "not_defined"]
          description: "Тип последствия MAC. Если не определён — 'not_defined'."
        - name: "mac_consequence_details"
          type: "string"
          description: "Укажи последствие. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Ковенанты промежуточного периода
  # ──────────────────────────────────────────────────────────────────────────
  - id: interim_period_covenants_check
    name: "Промежуточный период: ковенанты между подписанием и закрытием"
    description: >
      Фактографическая проверка наличия ограничений на деятельность target-компании
      между signing и closing: обычная хозяйственная деятельность, запреты
      на дивиденды, заимствования, крупные сделки, изменение уставного капитала,
      необходимость согласия покупателя.
    triggers:
      any: ["interim_period_present"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "промежуточный период"
        - "interim period"
        - "обычная хозяйственная деятельность"
        - "ordinary course"
        - "запрет на дивиденды"
        - "не допускать изменений"
        - "без согласия покупателя"
        - "ковенанты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обычн(ая|ой)\\s+хозяйствен"
        - "(?i)ordinary\\s+course"
        - "(?i)промежуточн(ый|ого)\\s+период"
        - "(?i)без\\s+(предварительного\\s+)?согласия\\s+покупател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: ковенанты промежуточного периода (от signing
        до closing) — ограничения на деятельность target.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязательство вести бизнес target в обычном режиме.
        2. Есть ли перечень запрещённых действий без согласия покупателя.
        3. Есть ли запрет на дивиденды.
        4. Есть ли запрет на новые заимствования.
        5. Есть ли запрет на отчуждение активов.
        6. Есть ли последствия нарушения ковенантов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ковенанты определены:
        Фрагмент:
        "В период между подписанием и закрытием сделки Продавец обязуется обеспечить
        ведение бизнеса Target в обычном хозяйственном режиме. Без предварительного
        согласия Покупателя запрещены: выплата дивидендов, привлечение новых займов
        свыше 1 000 000 рублей, отчуждение основных средств. Нарушение ковенантов
        даёт Покупателю право отказаться от договора."

        Ответ:
        {
          "interim_covenants_status": "defined",
          "ordinary_course_status": "defined",
          "ordinary_course_details": "обязуется вести бизнес Target в обычном хозяйственном режиме",
          "restricted_actions_status": "defined",
          "restricted_actions_details": "выплата дивидендов; привлечение займов свыше 1 000 000 руб.; отчуждение основных средств",
          "buyer_consent_status": "defined",
