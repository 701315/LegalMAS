type: contract_1.11_shares_sale
name: "Договор купли-продажи корпоративных прав (долей/акций)"
version: 6.0
parent: class_1_transfer_of_ownership
description: |
  Специализированный договор отчуждения корпоративных прав участия в коммерческих организациях.
  Включает продажу долей в уставном капитале ООО и продажу акций акционерных обществ.
  Характеризуется строгими формальными требованиями, особыми правилами перехода права,
  корпоративными ограничениями и высокой долей M&A-рисков: Due Diligence, заверения об обстоятельствах,
  indemnity, условия закрытия, антимонопольные и санкционные ограничения.
  Для долей в ООО критичны нотариальная форма и соблюдение корпоративной процедуры;
  для акций АО — корректное оформление перехода прав через регистратора/депозитарий.
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: critical
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ГК РФ, ФЗ-14 «Об ООО», ФЗ-208 «Об АО», ФЗ-39 «О рынке ценных бумаг», ФЗ-135 «О защите конкуренции»"
  doc_types_supported:
