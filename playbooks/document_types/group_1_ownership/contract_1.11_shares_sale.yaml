        - name: "dividend_restriction_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "breach_consequences_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если последствия нарушения ковенантов прямо указаны. Иначе 'not_defined'."
        - name: "breach_consequences_details"
          type: "string"
          description: "Укажи последствия. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Change of control
  # ──────────────────────────────────────────────────────────────────────────
  - id: change_of_control_contracts_check
    name: "Change of control: ключевые договоры target с CoC-триггерами"
    description: >
      Фактографическая проверка наличия в договоре раскрытия и урегулирования
      рисков change of control: контракты target с CoC-клаузами (кредиты, лицензии,
      коммерческие контракты), порядок получения согласий, сроки.
    triggers:
      any: ["change_of_control_risk", "majority_stake_sale"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "смена контроля"
        - "change of control"
        - "переход контроля"
        - "согласие контрагентов"
        - "уведомление контрагентов"
        - "ключевые договоры"
        - "кредитный договор"
        - "досрочное погашение"
        - "лицензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смен(а|ы|е)\\s+контрол"
        - "(?i)change\\s+of\\s+control"
        - "(?i)ключев(ые|ых)\\s+договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: риски change of control для ключевых
        договоров target-компании.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — нераскрытие существенных договоров как нарушение заверений

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание риска change of control / смены контроля.
        2. Есть ли перечень ключевых договоров target с CoC-условиями.
        3. Есть ли условие о необходимости согласия кредиторов.
        4. Есть ли условие о лицензиях при смене собственника.
        5. Есть ли порядок получения согласий контрагентов и сроки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — CoC риск урегулирован:
        Фрагмент:
        "Продавец раскрывает ключевые договоры Target с CoC-клаузами: кредитный договор
        с ПАО «Банк» от 01.01.2023 (требует согласия банка на смену контроля), лицензия
        на недропользование (требует уведомления ФАС в течение 30 дней после closing)."

        Ответ:
        {
          "coc_risk_status": "defined",
          "coc_risk_details": "кредитный договор с ПАО «Банк»; лицензия на недропользование",
          "key_contracts_status": "defined",
          "key_contracts_details": "кредитный договор с ПАО «Банк» от 01.01.2023; лицензия на недропользование",
          "lender_consent_status": "defined",
          "lender_consent_details": "требует согласия банка на смену контроля",
          "license_coc_status": "defined",
          "license_coc_details": "требует уведомления ФАС в течение 30 дней после closing",
          "counterparty_consent_procedure_status": "not_defined",
          "counterparty_consent_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Продавец раскрывает ключевые договоры Target с CoC-клаузами: кредитный договор с ПАО «Банк» от 01.01.2023."
            }
          ]
        }

        Пример 2 — CoC риск не упомянут:
        Фрагмент:
        "Продавец гарантирует действительность передаваемой доли."

        Ответ:
        {
          "coc_risk_status": "not_defined",
          "coc_risk_details": "Данные не определены",
          "key_contracts_status": "not_defined",
          "key_contracts_details": "Данные не определены",
          "lender_consent_status": "not_defined",
          "lender_consent_details": "Данные не определены",
          "license_coc_status": "not_defined",
          "license_coc_details": "Данные не определены",
          "counterparty_consent_procedure_status": "not_defined",
          "counterparty_consent_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о CoC-риске или смене контроля.
        2. Найди прямую цитату о ключевых договорах с CoC-условиями.
        3. Найди прямую цитату о согласии кредиторов.
        4. Найди прямую цитату о лицензиях.
        5. Найди прямую цитату о порядке получения согласий.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай список договоров.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "coc_risk_status": "<defined / not_defined>",
          "coc_risk_details": "<текст или 'Данные не определены'>",
          "key_contracts_status": "<defined / not_defined>",
          "key_contracts_details": "<текст или 'Данные не определены'>",
          "lender_consent_status": "<defined / not_defined>",
          "lender_consent_details": "<текст или 'Данные не определены'>",
          "license_coc_status": "<defined / not_defined>",
          "license_coc_details": "<текст или 'Данные не определены'>",
          "counterparty_consent_procedure_status": "<defined / not_defined>",
          "counterparty_consent_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "смена контроля"
        - "change of control"
        - "ключевые договоры"
        - "кредитный договор"
        - "согласие контрагентов"
        - "лицензия"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "coc_risk_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если CoC-риск прямо упомянут и урегулирован. Иначе 'not_defined'."
        - name: "coc_risk_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "key_contracts_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ключевые договоры target с CoC-условиями прямо раскрыты. Иначе 'not_defined'."
        - name: "key_contracts_details"
          type: "string"
          description: "Укажи договоры. Если данных нет, верни строго: 'Данные не определены'."
        - name: "lender_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если необходимость согласия кредиторов прямо указана. Иначе 'not_defined'."
        - name: "lender_consent_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Санкции, AML/KYC, бенефициарные владельцы
  # ──────────────────────────────────────────────────────────────────────────
  - id: sanctions_and_beneficial_ownership_check
    name: "Санкции, AML/KYC, бенефициарные владельцы (UBO)"
    description: >
      Фактографическая проверка наличия в договоре заверений о санкционном статусе,
      раскрытия бенефициарных владельцев (UBO), источника средств, AML/KYC-пакета
      и права приостановить closing при compliance-проблеме.
    triggers:
      any: ["cross_border_party"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "санкции"
        - "бенефициарный владелец"
        - "конечный бенефициар"
        - "источник средств"
        - "AML"
        - "KYC"
        - "комплаенс"
        - "право отказа от closing"
        - "иностранное лицо"
        - "нерезидент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)AML|KYC"
        - "(?i)бенефициарн(ый|ого)\\s+владел"
        - "(?i)источник\\s+средств"
        - "(?i)санкц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: санкционный статус, AML/KYC, бенефициарные
        владельцы.

        Нормативный ориентир:
        - ФЗ-115 — идентификация бенефициарных владельцев
        - Санкционное законодательство — запрет сделок с лицами из санкционных списков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли санкционные заверения (и покрывают ли обе стороны).
        2. Есть ли раскрытие бенефициарных владельцев (UBO).
        3. Есть ли условие об источнике средств (source of funds).
        4. Есть ли AML/KYC-пакет или ссылка на него.
        5. Есть ли право приостановить/прекратить closing при compliance-проблеме.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — sanctions compliance урегулированы:
        Фрагмент:
        "Каждая из сторон заверяет, что она и её бенефициарные владельцы не включены
        в санкционные списки SDN, EU, UN. Покупатель раскрывает UBO chart. Источник
        средств подтверждён документально. При обнаружении compliance-нарушений любая
        сторона вправе приостановить closing."

        Ответ:
        {
          "sanctions_rep_status": "defined",
          "sanctions_rep_details": "стороны и их бенефициарные владельцы не включены в санкционные списки SDN, EU, UN",
          "sanctions_covers_both_parties": "yes",
          "ubo_disclosure_status": "defined",
          "ubo_disclosure_details": "Покупатель раскрывает UBO chart",
          "source_of_funds_status": "defined",
          "source_of_funds_details": "источник средств подтверждён документально",
          "compliance_termination_status": "defined",
          "compliance_termination_details": "право любой стороны приостановить closing при compliance-нарушениях",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Каждая из сторон заверяет, что она и её бенефициарные владельцы не включены в санкционные списки SDN, EU, UN."
            }
          ]
        }

        Пример 2 — compliance не упомянут:
        Фрагмент:
        "Стороны гарантируют выполнение условий настоящего договора."

        Ответ:
        {
          "sanctions_rep_status": "not_defined",
          "sanctions_rep_details": "Данные не определены",
          "sanctions_covers_both_parties": "not_defined",
          "ubo_disclosure_status": "not_defined",
          "ubo_disclosure_details": "Данные не определены",
          "source_of_funds_status": "not_defined",
          "source_of_funds_details": "Данные не определены",
          "compliance_termination_status": "not_defined",
          "compliance_termination_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о санкционных заверениях.
        2. Найди прямую цитату о покрытии обеих сторон санкционными заверениями.
        3. Найди прямую цитату о UBO.
        4. Найди прямую цитату об источнике средств.
        5. Найди прямую цитату о праве приостановить closing.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай структуру собственности.

