        - name: "data_room_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если data room прямо упомянута. Иначе 'not_defined'."
        - name: "data_room_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "disclosure_letter_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
