  - id: "strategic_enterprise_foreign_investor"
    name: "Стратегическое общество: согласование Правительственной комиссии (ФЗ-57)"
    description: >
      Иностранные инвесторы и контролируемые ими лица при приобретении контроля
      над стратегическими обществами обязаны получить предварительное согласие
      Правительственной комиссии. Сделка без согласования ничтожна.
    legal_base: "ФЗ-57 «О порядке осуществления иностранных инвестиций в хозяйственные общества, имеющие стратегическое значение»"
