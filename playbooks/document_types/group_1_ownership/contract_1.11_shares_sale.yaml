          "third_party_rights_status": "defined",
          "third_party_rights_details": "свободна от прав третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Продавец подтверждает, что ему на праве собственности принадлежит продаваемая доля в уставном капитале Общества."
            }
          ]
        }

        Пример 2 — подтверждений нет:
        Фрагмент:
        "Продавец продаёт Покупателю долю в уставном капитале Общества."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "pledge_status": "not_defined",
          "pledge_details": "Данные не определены",
          "arrest_status": "not_defined",
          "arrest_details": "Данные не определены",
          "third_party_rights_status": "not_defined",
          "third_party_rights_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности продавца на актив.
        2. Найди прямую цитату об отсутствии залога.
        3. Найди прямую цитату об отсутствии ареста или запрета распоряжения.
        4. Найди прямую цитату об отсутствии прав третьих лиц или иных обременений.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай заверения.
        6. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
