          "shares_registry_details": "Данные не определены",
          "closing_sequence_status": "not_defined",
          "closing_sequence_details": "Данные не определены",
          "title_confirmation_status": "defined",
          "title_confirmation_details": "доля принадлежит Продавцу на праве собственности",
          "pledge_status": "defined",
          "pledge_details": "свободна от залога",
          "arrest_status": "defined",
          "arrest_details": "свободна от ареста",
          "third_party_rights_status": "not_defined",
          "third_party_rights_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Переход права на долю осуществляется с момента нотариального удостоверения настоящего договора. Нотариус подаёт заявление в ЕГРЮЛ в течение 3 рабочих дней."
            }
          ]
        }

        Пример 2 — механизм не определён:
        Фрагмент:
        "Продавец передаёт долю Покупателю."

        Ответ:
        {
