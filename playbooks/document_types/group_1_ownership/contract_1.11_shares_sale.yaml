#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ═══════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur|доллар|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  issue_number: "(?i)(государственн(ый|ого)\\s+регистрационн(ый|ого)\\s+номер\\s+выпуска|регистрационн(ый|ого)\\s+номер\\s+выпуска)"
  egrul_record: "(?i)(ЕГРЮЛ|лист\\s+записи\\s+ЕГРЮЛ|номер\\s+записи\\s+в\\s+ЕГРЮЛ)"
  share_ratio: "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, полномочия, согласие супруга
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны сделки: продавец, покупатель, target-компания, полномочия, согласие супруга"
    description: >
      Фактографическая проверка наличия в договоре идентификации продавца,
      покупателя, target-компании/эмитента, полномочий подписантов,
      а также согласия супруга при продаже физическим лицом.
      Результат предназначен для табличного вывода без оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "общество"
        - "эмитент"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративным сделкам.
        Анализируется договор купли-продажи корпоративных прав (долей/акций).
        Проверяется только один вопрос: идентификация сторон, target-компании,
        полномочия подписантов и согласие супруга.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 182–185 ГК РФ — полномочия представителя
        - ст. 35 СК РФ — нотариальное согласие супруга
        - ст. 21 ФЗ-14 — полномочия подписанта для сделок с долями ООО

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Продавец (наименование/ФИО, ИНН, ОГРН, адрес).
        2. Кто указан как Покупатель (наименование/ФИО, ИНН, ОГРН, адрес).
        3. Идентифицирована ли target-компания/эмитент (наименование, ОГРН, ИНН).
        4. Кто подписывает договор от каждой стороны и на каком основании.
        5. Есть ли нотариальное согласие супруга продавца или подтверждение
           личного режима имущества / отсутствия брака / брачного договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные есть:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Продавец»,
        в лице Генерального директора Иванова И.И., действующего на основании Устава,
        и ООО «Бета» (ИНН 7700000002), именуемое «Покупатель», в лице директора
        Петрова П.П., действующего на основании доверенности № 5 от 01.01.2024.
        Target: ООО «Гамма», ОГРН 1027700000003, ИНН 7700000003."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "seller_type": "legal_entity",
          "seller_signatory_status": "defined",
          "seller_signatory": "Генеральный директор Иванов И.И.",
          "seller_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details": "ООО «Бета», ИНН 7700000002",
          "buyer_type": "legal_entity",
          "buyer_signatory_status": "defined",
          "buyer_signatory": "Директор Петров П.П.",
          "buyer_signatory_basis": "poa",
          "target_details_status": "defined",
          "target_details": "ООО «Гамма», ОГРН 1027700000003, ИНН 7700000003",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Продавец», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Стороны договорились о продаже корпоративных прав."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details": "Данные не определены",
          "seller_type": "not_defined",
          "seller_signatory_status": "not_defined",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details": "Данные не определены",
          "buyer_type": "not_defined",
          "buyer_signatory_status": "not_defined",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "target_details_status": "not_defined",
          "target_details": "Данные не определены",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с наименованием/ФИО и реквизитами Продавца.
        2. Найди прямую цитату с наименованием/ФИО и реквизитами Покупателя.
        3. Найди прямую цитату с идентификацией target-компании/эмитента.
        4. Найди прямую цитату о подписанте и основании полномочий от каждой стороны.
        5. Найди прямую цитату о согласии супруга или личном режиме имущества.
        6. Если прямой цитаты нет — верни "not_defined" и "Данные не определены".
        7. Не додумывай реквизиты и не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "seller_details_status": "<defined / not_defined>",
          "seller_details": "<текст или 'Данные не определены'>",
          "seller_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "seller_signatory_status": "<defined / not_defined>",
          "seller_signatory": "<текст или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details": "<текст или 'Данные не определены'>",
          "buyer_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "buyer_signatory_status": "<defined / not_defined>",
          "buyer_signatory": "<текст или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / other / not_defined>",
          "target_details_status": "<defined / not_defined>",
          "target_details": "<текст или 'Данные не определены'>",
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "продавец"
        - "покупатель"
        - "эмитент"
        - "ИНН"
        - "ОГРН"
        - "в лице"
        - "согласие супруга"
        - "действующего на основании"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "seller_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Продавец прямо идентифицирован с реквизитами. Иначе 'not_defined'."
        - name: "seller_details"
          type: "string"
          description: "Укажи Продавца и реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "seller_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          description: "Тип продавца. Если не определён — 'not_defined'."
        - name: "seller_signatory_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если подписант от Продавца прямо указан. Иначе 'not_defined'."
        - name: "seller_signatory"
          type: "string"
          description: "Укажи подписанта Продавца. Если данных нет, верни строго: 'Данные не определены'."
        - name: "seller_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Продавца. Если не указано — 'not_defined'."
        - name: "buyer_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Покупатель прямо идентифицирован с реквизитами. Иначе 'not_defined'."
        - name: "buyer_details"
          type: "string"
          description: "Укажи Покупателя и реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "buyer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          description: "Тип покупателя. Если не определён — 'not_defined'."
        - name: "buyer_signatory_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если подписант от Покупателя прямо указан. Иначе 'not_defined'."
        - name: "buyer_signatory"
          type: "string"
          description: "Укажи подписанта Покупателя. Если данных нет, верни строго: 'Данные не определены'."
        - name: "buyer_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Покупателя. Если не указано — 'not_defined'."
        - name: "target_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если target-компания/эмитент прямо идентифицированы. Иначе 'not_defined'."
        - name: "target_details"
          type: "string"
          description: "Укажи target и реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо указано согласие супруга или подтверждение личного режима. Иначе 'not_defined'."
        - name: "spousal_consent_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет сделки и параметры актива
  # ──────────────────────────────────────────────────────────────────────────
  - id: corporate_asset_subject_extraction
    name: "Предмет сделки: идентификация доли/акций, параметры актива и цена"
    description: >
      Фактографическая проверка полноты описания предмета сделки: тип актива,
      реквизиты общества/эмитента, размер доли в процентах, номинальная стоимость,
      количество и тип акций, номер выпуска, цена сделки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
