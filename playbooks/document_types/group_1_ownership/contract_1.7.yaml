    triggers:
      any: ["vehicle_barter"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "VIN"
        - "ПТС"
        - "СТС"
        - "регистрация в ГИБДД"
        - "перерегистрация"
        - "номер кузова"
        - "номер двигателя"
        - "год выпуска"
        - "ОСАГО"
        - "диагностическая карта"
        - "пробег"
        - "техническое состояние"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)\\bПТС\\b|\\bСТС\\b"
        - "(?i)регистрац.*ГИБДД|ГИБДД.*регистрац"
        - "(?i)\\bОСАГО\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор мены транспортных средств.
        Проверь наличие специальных условий для обмена ТС.

        Ответь строго в JSON:
        {
          "vehicle_A_vin": "<VIN или not_found>",
          "vehicle_B_vin": "<VIN или not_found>",
          "pts_transfer_clause": "<yes / no / not_found>",
          "gibdd_registration_procedure": "<described / not_found>",
          "technical_condition_warranty": "<yes / no / not_found>",
          "osago_addressed": "<yes / no / not_found>",
          "encumbrances_check": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "VIN"
        - "ПТС"
        - "ГИБДД"
        - "техническое состояние"
        - "ОСАГО"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "vehicle_A_vin"
          type: "string"
          regex_patterns:
            - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
          description: "VIN транспортного средства A"
        - name: "vehicle_B_vin"
          type: "string"
          regex_patterns:
            - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
          description: "VIN транспортного средства B"
        - name: "pts_transfer_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Предусмотрена ли передача ПТС"
        - name: "gibdd_registration_procedure"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описан ли порядок перерегистрации в ГИБДД"
      store_payload: true

