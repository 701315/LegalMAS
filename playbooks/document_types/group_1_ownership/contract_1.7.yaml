classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)мен[аеыуой]"
      - "(?i)бартер"
      - "(?i)товарообмен"
      - "(?i)barter"
      - "(?i)exchange[\\s_]agreement"

    folder_patterns:
      - "(?i)мен[аы]"
      - "(?i)бартер"
      - "(?i)barter"
      - "(?i)exchange"

    keywords:

      high:
        - "(?i)договор\\s+мен[ыи]"
        - "(?i)договор\\s+бартера"
        - "(?i)товарообменн[а-я\\s]*договор"
        - "(?i)договор\\s+товарообмена"
        - "(?i)договор\\s+мен[ыи]\\s+недвижимост[иья]"
        - "(?i)договор\\s+мен[ыи]\\s+транспортн[а-я\\s]*средств"
        - "(?i)договор\\s+мен[ыи]\\s+дол[ейя]\\s*/?\\s*акц[ийи]"
        - "(?i)смешанн[а-я\\s]*договор\\s+мен[ыи]\\s+с\\s+доплат[ойеи]"
        - "(?i)бартер(?!н[а-я])"
        - "(?i)обмен\\s+товар[ао]ми"
        - "(?i)товар\\s+на\\s+товар"
        - "(?i)взаимн[а-я\\s]*передач[аи]"
        - "(?i)равноценност[ьи]\\s+товар[ао]в"
        - "(?i)встречн[а-я\\s]*предоставлен[иия]"
        - "(?i)обмениваем[а-я\\s]*товар[ыо]"
        - "(?i)каждая\\s+из\\s+сторон\\s+признаетс[яь]\\s+продавц[еом]"

      medium:
        - "товарообмен"
        - "переход права собственности при мене"
        - "доплата при неравноценности"
        - "встречная передача"
        - "неравноценный обмен"
        - "компенсация разницы в стоимости"
        - "одновременная передача товаров"
        - "оценка обмениваемых товаров"
        - "бартерная сделка"
        - "ст. 567 ГК"
        - "ст. 568 ГК"
        - "ст. 570 ГК"
        - "ст. 571 ГК"
        - "субсидиарно применяются правила купли-продажи"
        - "каждая сторона продавец и покупатель"

      low:
        - "компенсационная сделка"
        - "неденежный расчет"
        - "обменный договор"
        - "товарообменная операция"
        - "натуральный обмен"

    exclusions:
      - "купля-продажа за деньги"
      - "дарение"
      - "договор поставки"
      - "договор аренды"
      - "безвозмездная передача"
      - "рента"
      - "факторинг"
      - "зачёт встречных требований"
      - "отступное"
      - "новация"
      - "взнос в уставный капитал"
      - "вклад в имущество"

