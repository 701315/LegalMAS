        5. deferred_payment_interest_status:
           - "defined" — если есть условие о процентах на отсрочку / рассрочку;
           - "not_defined" — если нет.

        6. deferred_payment_interest_details:
           Условия начисления процентов на отсрочку / рассрочку.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. interest_rate_status:
           - "defined" — если прямо указана ставка процентов;
           - "not_defined" — если не указана.

        8. interest_rate_details:
           Конкретная ставка процентов.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни commercial_credit_interest_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
