        - "страхование урожая"
        - "страхование сельскохозяйственных рисков"
        - "агрострахование"
        - "страховой полис"
        - "страховая сумма"
        - "страховой случай"
        - "гибель урожая"
        - "выгодоприобретатель"
        - "застраховать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ой)\\s+(урожа|сельскохозяйственн)"
        - "(?i)обязуется.*застраховать"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: условия о страховании урожая.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о страховании урожая.
        2. Кто обязан застраховать (производитель / заготовитель).
        3. Кто несёт расходы на страхование.
        4. Кто является выгодоприобретателем.
        5. Порядок действий при страховом случае.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязан застраховать урожай в страховой компании
        «АгроЗащита» на сумму не менее 80% от стоимости договора.
        Расходы на страхование несёт Заготовитель. Выгодоприобретателем
        по договору страхования является Заготовитель в части выплаченного аванса."

        Ответ:
        {
          "insurance_status": "defined",
          "insurance_obligated_party_status": "defined",
          "insurance_obligated_party_code": "producer",
          "insurance_cost_status": "defined",
          "insurance_cost_details": "расходы несёт Заготовитель",
          "beneficiary_status": "defined",
          "beneficiary_code": "purchaser",
          "beneficiary_details": "в части выплаченного аванса",
          "insurance_event_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Производитель обязан застраховать урожай в страховой компании «АгроЗащита» на сумму не менее 80% от стоимости договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны рекомендуют застраховать урожай."

        Ответ:
        {
          "insurance_status": "not_defined",
          "insurance_obligated_party_status": "not_defined",
          "insurance_obligated_party_code": "not_defined",
          "insurance_cost_status": "not_defined",
          "insurance_cost_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary_code": "not_defined",
          "beneficiary_details": "Данные не определены",
          "insurance_event_procedure_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязанность (не рекомендация) застраховать?
        2. Кто именно обязан — производитель или заготовитель?
        3. Кто несёт расходы?
        4. Кто выгодоприобретатель?
        5. "Рекомендуется застраховать" — это NOT defined.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "insurance_status": "<defined / not_defined>",
          "insurance_obligated_party_status": "<defined / not_defined>",
          "insurance_obligated_party_code": "<producer / purchaser / both / not_defined>",
          "insurance_cost_status": "<defined / not_defined>",
          "insurance_cost_details": "<текст или 'Данные не определены'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_code": "<producer / purchaser / both / not_defined>",
          "beneficiary_details": "<текст или 'Данные не определены'>",
          "insurance_event_procedure_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
