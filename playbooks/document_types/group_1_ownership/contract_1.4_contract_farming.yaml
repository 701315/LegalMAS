        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "liability_termination_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия об ответственности сторон (виновная или безвиновная для
        производителя), размерах неустоек, основаниях расторжения и условиях
        возврата аванса.
        Не анализируй качество продукции, сроки сдачи, форс-мажор или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. liability_termination_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по ответственности
           и расторжению.
           - "present" — если хотя бы одно из содержательных полей
             (producer_liability_type_status,
              producer_delivery_penalty_status,
              purchaser_non_acceptance_penalty_status,
              purchaser_late_payment_penalty_status,
              termination_grounds_status,
              advance_return_on_termination_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - producer_liability_type_status = "not_defined";
           - producer_liability_type_code = "not_defined";
           - violation_of_art_538 = "no";
           - producer_delivery_penalty_status = "not_defined";
           - purchaser_non_acceptance_penalty_status = "not_defined";
           - purchaser_late_payment_penalty_status = "not_defined";
           - termination_grounds_status = "not_defined";
           - advance_return_on_termination_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. producer_liability_type_status:
           - "defined" — если характер ответственности производителя
             прямо определён (виновная / безвиновная);
           - "not_defined" — если не определён.

        2. producer_liability_type_code:
           - "fault_based" — "при наличии вины";
           - "strict_liability" — "независимо от вины";
           - "not_defined" — если не указано.

        3. violation_of_art_538:
           - "yes" — если буквально написано "независимо от вины"
             применительно к производителю (нарушение ст. 538 ГК РФ);
           - "no" — в остальных случаях.

        4. producer_delivery_penalty_status:
           - "defined" — если неустойка за просрочку сдачи прямо указана;
           - "not_defined" — если не указана.

        5. producer_delivery_penalty_details:
           Ставка и база неустойки за просрочку сдачи.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. purchaser_non_acceptance_penalty_status:
           - "defined" — если ответственность за отказ от приёмки прямо указана;
           - "not_defined" — если не указана.

        7. purchaser_non_acceptance_penalty_details:
           Условия ответственности за отказ от приёмки.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. purchaser_late_payment_penalty_status:
           - "defined" — если неустойка за просрочку оплаты прямо указана;
           - "not_defined" — если не указана.

        9. purchaser_late_payment_penalty_details:
           Ставка неустойки за просрочку оплаты.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        10. termination_grounds_status:
            - "defined" — если основания расторжения прямо указаны;
            - "not_defined" — если не указаны.

        11. termination_grounds_details:
            Основания расторжения договора.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        12. advance_return_on_termination_status:
            - "defined" — если условие о возврате аванса при расторжении
              прямо указано;
            - "not_defined" — если не указано.

        13. advance_return_on_termination_details:
            Условия и срок возврата аванса при расторжении.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_termination_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - violation_of_art_538 = "yes" только если буквально написано
          "независимо от вины" применительно к производителю.
        - Не выводи тип ответственности из косвенных признаков.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности производителя, ни неустоек,
           ни расторжения, ни возврата аванса.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны несут ответственность в соответствии с законодательством РФ."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.7.1 — ответственность при наличии вины, в п.9.2 — независимо от вины.
           → presence = "unclear";
             producer_liability_type_status = "not_defined";
             producer_liability_type_code = "not_defined".

        4. Нарушение ст. 538.
           "Производитель несёт ответственность независимо от наличия вины."
           → presence = "present";
             producer_liability_type_status = "defined";
             producer_liability_type_code = "strict_liability";
             violation_of_art_538 = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_termination_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для producer_liability_type_code используй только:
          "fault_based", "strict_liability", "not_defined".
        - Для violation_of_art_538 используй только: "yes" или "no".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_termination_cluster_presence"
          type: "string"
          presentation: "signal"
