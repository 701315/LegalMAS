        - name: "termination_grounds_details"
          type: "string"
          description: "Основания расторжения. Если нет — строго 'Данные не определены'."
        - name: "advance_return_on_termination_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условие о возврате аванса при расторжении прямо определено. Иначе 'not_defined'."
        - name: "advance_return_on_termination_details"
          type: "string"
          description: "Условия возврата аванса. Если нет — строго 'Данные не определены'."
