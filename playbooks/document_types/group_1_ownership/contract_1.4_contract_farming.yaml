  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Общие условия договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: general_provisions_cluster
    name: "Общие условия: срок, НДС/ЕСХН, уступка, конфиденциальность, споры"
    description: >
      Фактографическая проверка стандартных условий договора контрактации:
      срок действия, налоговые оговорки, ограничения уступки прав,
      конфиденциальность, претензионный порядок и подсудность.
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "срок договора"
        - "действует до"
        - "вступает в силу"
        - "на сезон"
        - "на урожай"
        - "пролонгация"
        - "автоматически продлевается"
        - "НДС"
        - "ЕСХН"
        - "единый сельскохозяйственный налог"
        - "освобождение от НДС"
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "подсудность"
        - "арбитражный суд"
        - "претензионный порядок"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*действует.*до"
        - "(?i)автоматическ.*продл(евается|ение)"
        - "(?i)на\\s+(сезон|урожай|\\d+\\s+год)"
        - "(?i)\\bНДС\\b"
        - "(?i)\\bЕСХН\\b"
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)перевод\\s+долга"
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: общие условия — срок, налоги,
        уступка, конфиденциальность, претензионный порядок и подсудность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок действия договора и его привязку к сезону/урожаю.
        2. Наличие автоматической пролонгации.
        3. Налоговую оговорку (НДС / ЕСХН).
        4. Ограничения на уступку прав.
        5. Условия конфиденциальности.
        6. Претензионный порядок (срок предъявления претензии и ответа).
        7. Подсудность (конкретный суд).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_specified", пустые строки.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор действует с момента подписания до 31 декабря 2026 г.
        Производитель применяет ЕСХН и не является плательщиком НДС.
        Уступка прав по договору допускается только с письменного согласия
        другой стороны. Претензионный порядок: срок направления претензии —
        30 дней, срок ответа — 15 дней. Споры рассматриваются в
        Арбитражном суде г. Москвы."

        Ответ:
        {
          "contract_term_status": "defined",
          "contract_term_details": "до 31 декабря 2026 г.",
          "auto_renewal_status": "not_defined",
          "vat_status": "defined",
          "vat_details": "ЕСХН, не является плательщиком НДС",
          "assignment_restriction_status": "defined",
          "assignment_restriction_details": "только с письменного согласия другой стороны",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "pretrial_status": "defined",
          "pretrial_details": "претензия — 30 дней, ответ — 15 дней",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "Арбитражный суд г. Москвы",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Договор действует с момента подписания до 31 декабря 2026 г."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор регулируется законодательством Российской Федерации."

        Ответ:
        {
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "auto_renewal_status": "not_defined",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "assignment_restriction_status": "not_defined",
          "assignment_restriction_details": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "jurisdiction_status": "not_defined",
          "jurisdiction_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок действия (дата или привязка к сезону)?
        2. Есть ли автоматическая пролонгация явно?
        3. Указано ли явно: с НДС / без НДС / ЕСХН?
        4. Есть ли условие об уступке (с согласия / без / запрет)?
        5. Есть ли условие о конфиденциальности?
        6. Указаны ли конкретные сроки претензионного порядка?
        7. Назван ли конкретный суд?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<срок или 'Данные не определены'>",
          "auto_renewal_status": "<defined / not_defined>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<режим или 'Данные не определены'>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction_details": "<текст или 'Данные не определены'>",
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_details": "<текст или 'Данные не определены'>",
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<сроки или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<суд или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "срок действия"
        - "пролонгация"
        - "НДС"
        - "ЕСХН"
        - "уступка прав"
        - "конфиденциальность"
        - "претензионный порядок"
        - "подсудность"
        - "арбитражный суд"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contract_term_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок действия договора прямо определён. Иначе 'not_defined'."
        - name: "contract_term_details"
          type: "string"
          description: "Срок действия. Если нет — строго 'Данные не определены'."
        - name: "auto_renewal_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если автоматическая пролонгация прямо определена. Иначе 'not_defined'."
        - name: "vat_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если налоговый режим (НДС/ЕСХН) прямо указан. Иначе 'not_defined'."
        - name: "vat_details"
          type: "string"
          description: "Налоговая оговорка. Если нет — строго 'Данные не определены'."
        - name: "assignment_restriction_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ограничение уступки прав прямо определено. Иначе 'not_defined'."
        - name: "assignment_restriction_details"
          type: "string"
          description: "Условие об уступке. Если нет — строго 'Данные не определены'."
        - name: "confidentiality_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условие конфиденциальности прямо определено. Иначе 'not_defined'."
        - name: "confidentiality_details"
          type: "string"
          description: "Условие конфиденциальности. Если нет — строго 'Данные не определены'."
        - name: "pretrial_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если претензионный порядок со сроками прямо определён. Иначе 'not_defined'."
        - name: "pretrial_details"
          type: "string"
          description: "Сроки претензионного порядка. Если нет — строго 'Данные не определены'."
        - name: "jurisdiction_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если конкретный суд прямо указан. Иначе 'not_defined'."
        - name: "jurisdiction_details"
          type: "string"
          description: "Суд / форум споров. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Базовые параметры предмета контрактации
  # ──────────────────────────────────────────────────────────────────────────
  - id: contracting_subject_extraction
    name: "Базовые параметры предмета контрактации"
    description: >
      Структурированное извлечение ключевых параметров предмета контрактации:
      наименование, вид, количество, стандарт качества, срок и место сдачи.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сельскохозяйственная продукция"
        - "выращенная продукция"
        - "произведённая продукция"
        - "наименование продукции"
        - "вид продукции"
        - "количество"
        - "объём поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
        - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 455 ГК РФ).
        Проверяется только один вопрос: базовые параметры предмета договора —
        извлечь структурированные данные.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование сельскохозяйственной продукции.
        2. Вид продукции (зерно / молоко / мясо / овощи / фрукты / многолетние / иное).
        3. Количество с единицей измерения.
        4. Стандарт качества (ГОСТ/ТУ/иной).
        5. Срок/период сдачи продукции.
        6. Место сдачи продукции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если значение не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_specified", пустые строки.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязуется вырастить и сдать молоко коровье цельное
        в количестве 500 тонн, соответствующее ГОСТ 31449-2013.
