      compact_output: false

      presence_signal:
        field: "production_support_obligations_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия об обязанностях заготовителя обеспечивать производителя ресурсами
        (семена, удобрения, СЗР, техника, ГСМ, агрономическое сопровождение):
        перечень ресурсов, распределение расходов и наличие ответственности
        за непредоставление.
        Не анализируй цену продукции, качество, сроки сдачи, неустойки за просрочку
        или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. production_support_obligations_check_presence:
           Агрегатное signal-поле — наличие регулирования по поддержке
           производства заготовителем.
           - "present" — если хотя бы одно из содержательных полей
             (production_support_status, resources_list_status,
              cost_allocation_status,
              liability_for_non_provision_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - production_support_status = "not_defined";
           - resources_list_status = "not_defined";
           - cost_allocation_status = "not_defined";
           - cost_allocation_code = "not_defined";
           - liability_for_non_provision_status = "not_defined";
           - resources_list_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. production_support_status:
           - "defined" — если есть прямая обязанность заготовителя
             предоставить ресурсы;
           - "not_defined" — если нет.

        2. resources_list_status:
           - "defined" — если перечень ресурсов прямо указан;
           - "not_defined" — если не указан.

        3. resources_list_details:
           Перечень предоставляемых ресурсов.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        4. cost_allocation_status:
           - "defined" — если прямо указано, кто несёт расходы на ресурсы;
           - "not_defined" — если не указано.

        5. cost_allocation_code:
           - "purchaser" — расходы несёт заготовитель;
           - "producer" — расходы несёт производитель;
           - "offset_against_price" — стоимость ресурсов зачитывается
             в счёт цены продукции;
           - "not_defined" — не указано.

        6. liability_for_non_provision_status:
           - "defined" — если прямо предусмотрена ответственность
             за непредоставление ресурсов;
           - "not_defined" — если не предусмотрена.
        </task>

        <context_rules>
        - Перед остальными полями заполни production_support_obligations_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          resources_list_details = "Данные не определены".
        - Используй только текст договора.
        - "Вправе предоставить" / "может предоставить" / "оказывает содействие"
          не являются достаточным основанием для production_support_status = "defined".
        - Только "обязан предоставить" / "обязуется предоставить" / "обеспечивает"
          как договорная обязанность → production_support_status = "defined".
        - Не делай предположений.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности предоставить ресурсы,
           ни перечня, ни распределения расходов, ни ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             resources_list_details = "Данные не определены".

        2. Только право, а не обязанность.
           "Заготовитель вправе оказывать содействие."
           → presence = "missing";
             production_support_status = "not_defined";
             resources_list_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.3 — расходы на заготовителе, в п.8 — на производителе.
           → presence = "unclear";
             cost_allocation_status = "not_defined";
             cost_allocation_code = "not_defined".

        4. Полное раскрытие.
           "Заготовитель обязуется предоставить семена 5 т и удобрения 10 т.
           Стоимость включается в цену. За непредоставление — неустойка 0,1%."
           → presence = "present";
             production_support_status = "defined";
             resources_list_status = "defined";
             cost_allocation_status = "defined";
             cost_allocation_code = "offset_against_price";
             liability_for_non_provision_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для production_support_obligations_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для cost_allocation_code используй только:
          "purchaser", "producer", "offset_against_price", "not_defined".
        - Fallback при отсутствии данных:
          * resources_list_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * resources_list_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "production_support_obligations_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по поддержке производства. Внутреннее агрегатное signal-поле."
          required: true
        - name: "production_support_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности заготовителя предоставлять ресурсы производителю."
          required: true
        - name: "resources_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения перечня ресурсов."
          required: true
        - name: "resources_list_details"
          type: "string"
          presentation: "fact"
          label: "Ресурсы от заготовителя"
          description: "Перечень ресурсов, предоставляемых заготовителем производителю."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "cost_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения расходов на ресурсы."
          required: true
        - name: "cost_allocation_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["purchaser", "producer", "offset_against_price", "not_defined"]
          description: "Кто несёт расходы на предоставляемые ресурсы."
          required: true
        - name: "liability_for_non_provision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения ответственности за непредоставление ресурсов."
          required: true
      store_payload: true

  - id: purpose_of_procurement_check
    name: "Целевое назначение закупки (ст. 535 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре указания на целевое
      назначение закупки сельхозпродукции (переработка / продажа),
      что является квалифицирующим признаком договора контрактации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "для переработки"
        - "для последующей продажи"
        - "для реализации"
        - "для оптовой продажи"
        - "для промышленной переработки"
        - "для консервирования"
        - "для мукомольного производства"
        - "для дальнейшей переработки"
        - "для нужд заготовителя"
        - "не для личного потребления"
        - "цель закупки"
        - "целевое назначение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)для\\s+(переработк|реализаци|продаж|оптов)"
        - "(?i)целев[а-я]+\\s+назначени"
        - "(?i)не\\s+для\\s+личн[а-я]+\\s+потреблени"
        - "(?i)с\\s+целью\\s+(переработк|реализаци|продаж)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (ст. 535 ГК РФ).
        Проверяется только один вопрос: указано ли в договоре целевое
        назначение закупки продукции (для переработки или продажи),
        что является квалифицирующим признаком контрактации.

        Нормативный ориентир:
        - ст. 535 ГК РФ (понятие договора контрактации)

        Важно:
        - Только установить, что прямо есть в тексте договора.
        - Без указания цели закупки договор может быть переквалифицирован
          в обычную куплю-продажу / поставку.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на цель закупки (для переработки / для продажи /
           для иных нужд заготовителя, не связанных с личным потреблением).
        2. Указание конкретного переработчика / конечного покупателя.
        3. Ссылку на ст. 535 ГК РФ или § 5 Главы 30 ГК РФ.
        4. Указание, что продукция закупается НЕ для личного потребления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цель указана:
        Фрагмент:
        "Заготовитель приобретает сельскохозяйственную продукцию
        для последующей переработки на мукомольном комбинате и оптовой
        продажи. Продукция не предназначена для личного потребления."

        Ответ:
        {
          "procurement_purpose_status": "defined",
          "procurement_purpose_details": "для последующей переработки на мукомольном комбинате и оптовой продажи; не для личного потребления",
          "processor_or_buyer_status": "defined",
          "processor_or_buyer_details": "мукомольный комбинат, оптовая продажа",
          "art_535_reference_status": "not_defined",
          "non_consumer_purpose_status": "defined",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Заготовитель приобретает сельскохозяйственную продукцию для последующей переработки на мукомольном комбинате и оптовой продажи."
            }
          ]
        }

        Пример 2 — цель не указана:
        Фрагмент:
        "Производитель обязуется передать пшеницу в количестве 200 тонн."

        Ответ:
        {
          "procurement_purpose_status": "not_defined",
          "procurement_purpose_details": "Данные не определены",
          "processor_or_buyer_status": "not_defined",
          "processor_or_buyer_details": "Данные не определены",
          "art_535_reference_status": "not_defined",
          "non_consumer_purpose_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на цель закупки (переработка / продажа)?
        2. Указан ли конкретный переработчик / конечный покупатель?
        3. Есть ли ссылка на ст. 535 ГК РФ?
        4. Указано ли явно, что продукция не для личного потребления?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "procurement_purpose_status": "<defined / not_defined>",
          "procurement_purpose_details": "<цель или 'Данные не определены'>",
          "processor_or_buyer_status": "<defined / not_defined>",
          "processor_or_buyer_details": "<конкретный переработчик/покупатель или 'Данные не определены'>",
