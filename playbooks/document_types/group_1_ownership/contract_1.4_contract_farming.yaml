    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации между предпринимателями.
        Проверяется порядок уведомлений и условия об электронном
        документообороте.

        Нормативный ориентир:
        - ст. 160, 165.1, 434 ГК РФ
        - ФЗ № 63-ФЗ «Об электронной подписи»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Реквизиты для юридически значимых сообщений (адреса, email).
        2. Порядок направления уведомлений (стороны, форма, момент получения).
        3. Условие о признании документов, подписанных ЭЦП / КЭП,
           равнозначными бумажным.
        4. Соглашение об ЭДО с указанием оператора или типа подписи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — всё раскрыто:
        Фрагмент:
        "Юридически значимые сообщения направляются по адресам,
        указанным в реквизитах сторон. Уведомления по email:
        supplier@example.com и buyer@example.com — считаются полученными
        на следующий рабочий день. Документы, подписанные КЭП, признаются
        равнозначными бумажным. ЭДО осуществляется через оператора Диадок."

        Ответ:
        {
          "notice_addresses_status": "defined",
          "notice_addresses_details": "адреса из реквизитов сторон; email: supplier@example.com, buyer@example.com",
          "notice_procedure_status": "defined",
          "notice_procedure_details": "по email считаются полученными на следующий рабочий день",
          "e_signature_recognition_status": "defined",
          "e_signature_recognition_details": "документы с КЭП равнозначны бумажным",
          "edo_agreement_status": "defined",
          "edo_agreement_details": "через оператора Диадок",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Юридически значимые сообщения направляются по адресам, указанным в реквизитах сторон."
            }
          ]
        }

        Пример 2 — условия не раскрыты:
        Фрагмент:
        "Стороны обязуются своевременно уведомлять друг друга."

        Ответ:
        {
          "notice_addresses_status": "not_defined",
          "notice_addresses_details": "Данные не определены",
          "notice_procedure_status": "not_defined",
          "notice_procedure_details": "Данные не определены",
          "e_signature_recognition_status": "not_defined",
          "e_signature_recognition_details": "Данные не определены",
          "edo_agreement_status": "not_defined",
          "edo_agreement_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли адреса для юридически значимых сообщений?
        2. Указан ли порядок направления уведомлений и момент получения?
        3. Есть ли признание юридической силы документов с ЭЦП / КЭП?
        4. Указан ли оператор ЭДО?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "notice_addresses_status": "<defined / not_defined>",
          "notice_addresses_details": "<текст или 'Данные не определены'>",
          "notice_procedure_status": "<defined / not_defined>",
          "notice_procedure_details": "<текст или 'Данные не определены'>",
          "e_signature_recognition_status": "<defined / not_defined>",
          "e_signature_recognition_details": "<текст или 'Данные не определены'>",
          "edo_agreement_status": "<defined / not_defined>",
          "edo_agreement_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "notices_check"
