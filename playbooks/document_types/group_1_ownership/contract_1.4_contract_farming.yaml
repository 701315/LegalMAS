             proof_requirements_details, consequences_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. force_majeure_status:
           - "defined" — если форс-мажорная оговорка есть;
           - "not_defined" — если нет.

        2. force_majeure_type:
           - "agricultural_specific" — если прямо перечислены специфические
             с/х риски: засуха, заморозки, наводнение, градобой, эпизоотия,
             нашествие вредителей или иные явно сельскохозяйственные события;
           - "general_only" — если оговорка есть, но перечень событий отсутствует
