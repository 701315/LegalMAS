  - id: currency_control_check
    name: "Валюта, валютный контроль и валютная оговорка (ВЭД)"
    description: >
      Фактографическая проверка условий о валюте цены и платежа, валютной
      оговорке, постановке контракта на учёт и репатриации валютной выручки
      (если контракт является внешнеторговым).
    triggers:
      any: ["international_trade"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "валюта цены"
        - "валюта платежа"
        - "валютная оговорка"
        - "курсовая разница"
        - "валютный контроль"
        - "173-ФЗ"
        - "репатриация"
        - "постановка на учёт"
        - "уполномоченный банк"
        - "уникальный номер контракта"
        - "УНК"
        - "Инструкция 181-И"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)валют[а-я]+\\s+цены"
        - "(?i)валют[а-я]+\\s+платеж"
        - "(?i)валютн[а-я]+\\s+оговорк"
        - "(?i)173-?ФЗ|173\\s+ФЗ"
        - "(?i)репатриац"
        - "(?i)постановк[а-я]+\\s+на\\s+уч[её]т"
        - "(?i)уникальн[а-я]+\\s+номер\\s+контракт"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Если контракт является внешнеторговым, применяются требования
        ФЗ № 173-ФЗ и Инструкция Банка России № 181-И.

        Проверяется только один вопрос: наличие условий о валюте,
        валютной оговорке и валютном контроле.

        Нормативный ориентир:
        - ФЗ № 173-ФЗ «О валютном регулировании и валютном контроле»
        - Инструкция Банка России № 181-И

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Валюту цены товара.
        2. Валюту платежа.
        3. Наличие валютной оговорки (привязка к курсу).
        4. Условие о постановке контракта на учёт в уполномоченном банке.
        5. Условие о репатриации валютной выручки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия раскрыты:
        Фрагмент:
        "Валюта цены — доллары США. Валюта платежа — рубли РФ по курсу
        ЦБ РФ на день оплаты. Контракт подлежит постановке на учёт
        в уполномоченном банке. Стороны обязуются обеспечить репатриацию
        валютной выручки в соответствии с 173-ФЗ."

        Ответ:
        {
          "price_currency_status": "defined",
          "price_currency_details": "доллары США",
          "payment_currency_status": "defined",
          "payment_currency_details": "рубли РФ по курсу ЦБ РФ на день оплаты",
          "currency_clause_status": "defined",
          "currency_clause_details": "привязка к курсу ЦБ РФ на день оплаты",
          "bank_registration_status": "defined",
          "bank_registration_details": "постановка на учёт в уполномоченном банке",
          "repatriation_status": "defined",
          "repatriation_details": "обеспечение репатриации валютной выручки в соответствии с 173-ФЗ",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Валюта цены — доллары США. Валюта платежа — рубли РФ по курсу ЦБ РФ на день оплаты."
            }
          ]
        }

        Пример 2 — условия не раскрыты:
        Фрагмент:
        "Цена товара определяется в рублях РФ."

        Ответ:
        {
          "price_currency_status": "defined",
          "price_currency_details": "рубли РФ",
          "payment_currency_status": "not_defined",
          "payment_currency_details": "Данные не определены",
          "currency_clause_status": "not_defined",
          "currency_clause_details": "Данные не определены",
          "bank_registration_status": "not_defined",
          "bank_registration_details": "Данные не определены",
          "repatriation_status": "not_defined",
          "repatriation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цена товара определяется в рублях РФ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли валюта цены явно (RUB, USD, EUR, CNY)?
        2. Указана ли валюта платежа?
        3. Есть ли валютная оговорка?
        4. Указана ли постановка на учёт в уполномоченном банке?
        5. Указана ли репатриация валютной выручки?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "price_currency_status": "<defined / not_defined>",
          "price_currency_details": "<валюта или 'Данные не определены'>",
          "payment_currency_status": "<defined / not_defined>",
          "payment_currency_details": "<валюта или 'Данные не определены'>",
          "currency_clause_status": "<defined / not_defined>",
          "currency_clause_details": "<текст или 'Данные не определены'>",
          "bank_registration_status": "<defined / not_defined>",
          "bank_registration_details": "<текст или 'Данные не определены'>",
          "repatriation_status": "<defined / not_defined>",
          "repatriation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "валюта цены валюта платежа валютная оговорка курсовая разница валютный контроль 173-ФЗ репатриация постановка на учёт уполномоченный банк уникальный номер контракта УНК Инструкция 181-И"
      preferred_unit_types:
        - payment_term
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "приемка"
        - "качество"
        - "гарантия"
        - "срок поставки"
        - "риск гибели"
        - "хранение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.65]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "currency_control_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о валюте, валютной оговорке и валютном контроле.
        Анализируй только эти темы.
        Не анализируй поставку, ответственность или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. currency_control_check_presence:
           Агрегатное signal-поле — наличие регулирования по валюте
           и валютному контролю.
           - "present" — если хотя бы одно из содержательных полей
             (price_currency_status, payment_currency_status,
              currency_clause_status, bank_registration_status,
              repatriation_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. price_currency_status:
           - "defined" — если валюта цены прямо указана;
           - "not_defined" — если не указана.

        2. price_currency_details:
           Валюта цены.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. payment_currency_status:
           - "defined" — если валюта платежа прямо указана;
           - "not_defined" — если не указана.

        4. payment_currency_details:
           Валюта платежа.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. currency_clause_status:
           - "defined" — если есть валютная оговорка (привязка
             цены/платежа к курсу);
           - "not_defined" — если не указана.

        6. currency_clause_details:
           Условия валютной оговорки.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. bank_registration_status:
           - "defined" — если указано условие о постановке контракта
             на учёт в уполномоченном банке;
           - "not_defined" — если не указано.

        8. bank_registration_details:
           Условия постановки на учёт.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. repatriation_status:
           - "defined" — если указано условие о репатриации
             валютной выручки;
           - "not_defined" — если не указано.

        10. repatriation_details:
            Условия репатриации.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни currency_control_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Общая фраза "расчёты в рублях" без указания валюты платежа —
          это not_defined для payment_currency_status.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни валюты цены, ни валюты платежа,
           ни валютной оговорки, ни постановки на учёт, ни репатриации.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Только валюта цены.
           "Цена определяется в рублях РФ."
           → presence = "present";
             price_currency_status = "defined";
             price_currency_details = "рубли РФ";
             payment_currency_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.4 — оплата в USD, в п.9 — оплата в EUR.
           → presence = "unclear";
             payment_currency_status = "not_defined";
             payment_currency_details = "Не удалось определить".

        4. Полное раскрытие ВЭД.
           "Валюта цены — USD. Валюта платежа — RUB по курсу ЦБ.
           Контракт на учёте в банке. Репатриация по 173-ФЗ."
           → presence = "present";
             price_currency_status = "defined";
             payment_currency_status = "defined";
             currency_clause_status = "defined";
             bank_registration_status = "defined";
             repatriation_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для currency_control_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "currency_control_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по валюте и валютному контролю. Внутреннее агрегатное signal-поле."
          required: true
        - name: "price_currency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания валюты цены."
          required: true
        - name: "price_currency_details"
          type: "string"
          presentation: "fact"
          label: "Валюта цены"
          description: "Валюта, в которой выражена цена товара."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "payment_currency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания валюты платежа."
          required: true
        - name: "payment_currency_details"
          type: "string"
          presentation: "fact"
          label: "Валюта платежа"
          description: "Валюта, в которой производится оплата товара."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "currency_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия валютной оговорки."
          required: true
        - name: "currency_clause_details"
          type: "string"
          presentation: "fact"
          label: "Валютная оговорка"
          description: "Условия привязки цены или платежа к курсу валюты."
          required: false
          display_in_grid: false
        - name: "bank_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о постановке контракта на учёт в банке."
          required: true
        - name: "bank_registration_details"
          type: "string"
          presentation: "fact"
          label: "Постановка на учёт"
          description: "Условия постановки контракта на учёт в уполномоченном банке."
          required: false
          display_in_grid: false
        - name: "repatriation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о репатриации валютной выручки."
          required: true
        - name: "repatriation_details"
          type: "string"
          presentation: "fact"
          label: "Репатриация выручки"
          description: "Условия репатриации валютной выручки по контракту."
          required: false
          display_in_grid: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_authority_cluster:
    text: >
      В {doc_names} не определены реквизиты одной или обеих сторон.
      Просим предоставить: (а) для Производителя — наименование / ФИО главы КФХ,
      ИНН, ОГРН/ОГРНИП, адрес, документ-основание деятельности;
      (б) для Заготовителя — наименование, ИНН, ОГРН, адрес, полномочия подписанта
      (устав/доверенность). Просим подтверждающие документы на подписантов обеих сторон.
    addressee: "Обе стороны"

  subject_price_payment_cluster:
    text: >
      В {doc_names} не определены один или несколько ключевых параметров.
      Просим предоставить: (а) наименование, вид и количество продукции;
      (б) цену за единицу с налоговой оговоркой (НДС / без НДС / ЕСХН);
      (в) механизм пересмотра цены при изменении рыночной конъюнктуры;
      (г) срок оплаты после приёмки и способ расчётов;
      (д) условия авансирования — размер, срок, порядок зачёта в счёт оплаты.
    addressee: "Обе стороны"

  delivery_acceptance_cluster:
    text: >
      В {doc_names} не определены условия сдачи и/или приёмки продукции.
      Просим предоставить: (а) конкретные сроки и/или график сдачи продукции;
      (б) место приёмки (у производителя / на элеваторе / на складе заготовителя);
      (в) обязанность заготовителя принять продукцию без права немотивированного отказа;
      (г) кто обеспечивает тару и транспорт, распределение расходов;
      (д) документы при приёмке (ТТН, акт, форма и сроки подписания);
      (е) порядок отбора проб и взвешивания.
    addressee: "Обе стороны"

  quality_safety_claims_cluster:
    text: >
      В {doc_names} не определены требования к качеству и/или документам безопасности.
      Просим предоставить: (а) стандарт качества (ГОСТ/ТУ с конкретным номером);
      (б) конкретные параметры качества (влажность, сорность, жирность, ПДК и т.д.);
      (в) применимые ТР ТС с обязательными декларациями/сертификатами;
      (г) требования к ветеринарным документам (ВСД через ФГИС «Меркурий»)
      или фитосанитарным сертификатам;
      (д) порядок отбора проб при приёмке, нейтральная лаборатория, арбитражный образец;
      (е) срок предъявления претензий по качеству и механизм спора.
    addressee: "Производитель / Юридический советник"

  risk_title_storage_cluster:
    text: >
      В {doc_names} не определены условия перехода риска и/или хранения.
      Просим предоставить: (а) момент перехода риска случайной гибели продукции
      (при подписании акта / при взвешивании / при отгрузке);
      (б) условия хранения продукции до вывоза заготовителем;
      (в) ответственность за порчу при хранении на территории производителя;
      (г) порядок пересчёта обязательств при частичной гибели урожая.
    addressee: "Юридический советник"

  liability_termination_cluster:
    text: >
      В {doc_names} не определены или некорректно определены условия ответственности.
      Просим: (а) проверить и исправить ответственность производителя — она должна быть
      виновной (ст. 538 ГК РФ); условие "независимо от вины" — недопустимо;
      (б) определить неустойку за просрочку сдачи продукции производителем;
      (в) определить ответственность заготовителя за необоснованный отказ от приёмки;
      (г) определить неустойку за просрочку оплаты заготовителем;
      (д) перечислить конкретные основания расторжения для каждой стороны;
      (е) определить порядок возврата аванса при расторжении.
    addressee: "Юридический советник"

  general_provisions_cluster:
    text: >
      В {doc_names} не определены общие условия.
      Просим предоставить: (а) срок действия договора с привязкой к сезону/урожаю;
      (б) налоговую оговорку (НДС / без НДС / ЕСХН производителя);
      (в) ограничения на уступку прав / перевод долга без согласия другой стороны;
      (г) условия конфиденциальности (перечень сведений, срок);
      (д) претензионный порядок (срок направления претензии и ответа);
      (е) подсудность споров (конкретный суд).
    addressee: "Юридический советник"

  contracting_subject_extraction:
    text: >
      В {doc_names} не определены базовые параметры предмета контрактации.
      Просим предоставить: наименование продукции, вид, количество с единицей измерения,
      стандарт качества (ГОСТ/ТУ), срок и место сдачи.
    addressee: "Производитель / Юридический советник"

  agricultural_force_majeure_check:
    text: >
      В {doc_names} отсутствует или недостаточна форс-мажорная оговорка для с/х.
      Просим включить / уточнить: (а) перечень с/х рисков: засуха, наводнение,
      заморозки, градобой, эпизоотия, нашествие вредителей;
      (б) срок уведомления и форму подтверждающих документов
      (справка Гидрометцентра или ТПП);
      (в) последствия для обязательств — отсрочка / уменьшение объёма / прекращение.
    addressee: "Юридический советник"

  crop_insurance_check:
    text: >
      В {doc_names} не определены условия страхования урожая.
      Просим предоставить: (а) обязанность по страхованию — кто и когда;
      (б) минимальная страховая сумма (% от стоимости договора);
      (в) выгодоприобретатель по страховому полису;
      (г) порядок действий при страховом случае.
    addressee: "Юридический советник"

  perennial_crops_risk_allocation:
    text: >
      В {doc_names} (многолетние культуры) не определены условия для насаждений.
      Просим предоставить: (а) распределение рисков гибели насаждений;
      (б) механизм компенсации капитальных затрат производителя при гибели;
      (в) порядок пересчёта объёмов при частичной гибели насаждений.
    addressee: "Юридический советник"

  production_support_obligations_check:
    text: >
      В {doc_names} не определены обязанности заготовителя по обеспечению производства.
      Просим предоставить: (а) перечень ресурсов, предоставляемых заготовителем
      (семена, удобрения, СЗР, техника, ГСМ);
      (б) сроки и порядок предоставления каждого вида ресурсов;
      (в) кто несёт расходы (за счёт заготовителя / зачёт в цену продукции);
      (г) ответственность заготовителя за непредоставление ресурсов.
    addressee: "Заготовитель"

  veterinary_certificate_required:
    text: >
      В {doc_names} не определены требования к ветеринарным документам.
      Просим предоставить: (а) обязанность производителя оформлять ВСД через
      ФГИС «Меркурий» с каждой партией; (б) последствия при отсутствии ВСД.
    addressee: "Производитель / Ветеринарная служба"

  phytosanitary_export_certificate_required:
    text: >
      В {doc_names} не определены требования к фитосанитарным документам.
      Просим предоставить порядок получения фитосанитарного сертификата и
      распределение расходов на фитосанитарный контроль.
    addressee: "Производитель / Россельхознадзор"

  organic_certification_required:
    text: >
      В {doc_names} не подтверждена сертификация органической продукции (ФЗ-280).
      Просим предоставить действующий сертификат соответствия.
    addressee: "Производитель"

  grain_safety_declaration_required:
    text: >
      В {doc_names} не определены требования к декларации зерна.
      Просим включить в договор обязанность производителя предоставлять декларацию
      соответствия ТР ТС 015/2011 с каждой партией зерна.
    addressee: "Производитель"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

    
