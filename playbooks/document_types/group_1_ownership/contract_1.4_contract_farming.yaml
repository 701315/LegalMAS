  - id: perennial_crops_risk_allocation
    name: "Многолетние культуры: распределение рисков гибели насаждений"
    description: >
      Фактографическая проверка наличия особых условий для многолетних культур
      (виноградники, сады, плантации) — распределение рисков гибели насаждений
      и механизм компенсации затрат.
    triggers:
      any: ["perennial_crops"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "многолетние насаждения"
        - "плодовые деревья"
        - "виноградник"
        - "многолетние культуры"
        - "гибель насаждений"
        - "компенсация затрат на насаждения"
        - "восстановление насаждений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)многолетн.*насажден"
        - "(?i)гибель.*насажден"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации многолетних культур.
        Проверяется наличие особых условий для многолетних насаждений.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие специального условия для многолетних насаждений.
        2. Распределение рисков гибели насаждений (кто несёт).
        3. Механизм компенсации затрат производителя при гибели насаждений.
        4. Предусмотрен ли прямо механизм пересчёта объёмов при частичной гибели насаждений.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — риск и компенсация раскрыты:
        Фрагмент:
        "Риск случайной гибели многолетних насаждений несёт Заготовитель
        с момента их высадки. В случае гибели насаждений по причинам,
        не зависящим от Производителя, Заготовитель компенсирует
        капитальные затраты Производителя в размере, определяемом
        соглашением сторон. При частичной гибели насаждений объёмы
        поставки пересчитываются пропорционально сохранившейся площади."

        Ответ:
        {
          "perennial_clause_status": "defined",
          "risk_allocation_status": "defined",
          "risk_allocation_code": "purchaser",
          "compensation_mechanism_status": "defined",
          "compensation_mechanism_details": "компенсация капитальных затрат по соглашению сторон",
          "partial_loss_recalculation_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Риск случайной гибели многолетних насаждений несёт Заготовитель с момента их высадки."
            }
          ]
        }

        Пример 2 — условие о многолетних насаждениях не раскрыто:
        Фрагмент:
        "Производитель обязуется вырастить и передать Заготовителю
        урожай многолетних культур в согласованные сроки."

        Ответ:
        {
          "perennial_clause_status": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_code": "not_defined",
          "compensation_mechanism_status": "not_defined",
          "compensation_mechanism_details": "Данные не определены",
          "partial_loss_recalculation_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие именно о насаждениях (не просто урожае)?
        2. Кто несёт риск гибели насаждений?
        3. Есть ли механизм компенсации капитальных затрат?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "perennial_clause_status": "<defined / not_defined>",
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_code": "<producer / purchaser / shared / insured / not_defined>",
          "compensation_mechanism_status": "<defined / not_defined>",
          "compensation_mechanism_details": "<текст или 'Данные не определены'>",
          "partial_loss_recalculation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "многолетние насаждения плодовые деревья виноградник многолетние культуры гибель насаждений компенсация затрат на насаждения восстановление насаждений капитальные затраты пересчёт объёма при гибели насаждений риск насаждений"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "риск гибели урожая"
        - "риск случайной гибели продукции"
        - "гибель сезонной продукции"
        - "форс-мажор"
        - "засуха"
        - "страхование урожая"
        - "неустойка"
        - "расторжение"
        - "цена"
        - "оплата"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "perennial_crops_risk_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о многолетних насаждениях (виноградники, сады, плантации):
        распределение рисков гибели насаждений, механизм компенсации капитальных
        затрат и наличие механизма пересчёта объёмов при частичной гибели насаждений.
        Не анализируй риск гибели урожая как сезонной продукции, форс-мажор,
        страхование или ответственность за нарушение договора.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. perennial_crops_risk_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по многолетним
           насаждениям.
           - "present" — если хотя бы одно из содержательных полей
             (perennial_clause_status, risk_allocation_status,
              compensation_mechanism_status,
              partial_loss_recalculation_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - risk_allocation_code = "not_defined";
           - compensation_mechanism_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. perennial_clause_status:
           - "defined" — если есть специальное условие именно
             о многолетних насаждениях (не просто об урожае);
           - "not_defined" — если нет.

        2. risk_allocation_status:
           - "defined" — если прямо указано распределение рисков
             гибели насаждений;
           - "not_defined" — если не указано.

        3. risk_allocation_code:
           - "producer" — риск несёт производитель;
           - "purchaser" — риск несёт заготовитель;
           - "shared" — риск распределён между сторонами;
           - "insured" — риск покрывается страховым механизмом;
           - "not_defined" — не указано.

        4. compensation_mechanism_status:
           - "defined" — если прямо предусмотрен механизм компенсации
             затрат на насаждения;
           - "not_defined" — если не предусмотрен.

        5. compensation_mechanism_details:
           Механизм компенсации капитальных затрат производителя
           при гибели насаждений.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. partial_loss_recalculation_status:
           - "defined" — если прямо предусмотрен механизм пересчёта объёмов
             при частичной гибели насаждений;
           - "not_defined" — если не предусмотрен.
        </task>

        <context_rules>
        - Перед остальными полями заполни perennial_crops_risk_allocation_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          compensation_mechanism_details = "Данные не определены".
        - Используй только текст договора.
        - Условие об урожае (сезонная продукция) не равно условию о насаждениях.
        - Только прямое упоминание "насаждений", "плодовых деревьев",
          "виноградника", "сада", "плантации" может быть основанием
          для perennial_clause_status = "defined".
        - Не делай предположений.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни насаждений, ни рисков гибели насаждений,
           ни компенсации, ни пересчёта.
           → presence = "missing";
             все *_status = "not_defined";
             compensation_mechanism_details = "Данные не определены".

        2. Общее упоминание многолетних культур без раскрытия.
           "Производитель передаёт урожай многолетних культур."
           → presence = "missing";
             perennial_clause_status = "not_defined";
             risk_allocation_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.4 — риск на заготовителе, в п.9 — на производителе.
           → presence = "unclear";
             risk_allocation_status = "not_defined";
             risk_allocation_code = "not_defined";

        4. Полное раскрытие.
           "Риск гибели многолетних насаждений — на заготовителе с момента
           высадки. Компенсация капитальных затрат по соглашению сторон.
           При частичной гибели — пересчёт объёма."
           → presence = "present";
             perennial_clause_status = "defined";
             risk_allocation_status = "defined";
             risk_allocation_code = "purchaser";
             compensation_mechanism_status = "defined";
             partial_loss_recalculation_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для perennial_crops_risk_allocation_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для risk_allocation_code используй только:
          "producer", "purchaser", "shared", "insured", "not_defined".
        - Fallback при отсутствии данных:
          * compensation_mechanism_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * compensation_mechanism_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "perennial_crops_risk_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по многолетним насаждениям. Внутреннее агрегатное signal-поле."
          required: true
        - name: "perennial_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия специального условия о многолетних насаждениях."
          required: true
        - name: "risk_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения рисков гибели насаждений."
          required: true
        - name: "risk_allocation_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["producer", "purchaser", "shared", "insured", "not_defined"]
          description: "Кто несёт риск гибели многолетних насаждений."
          required: true
        - name: "compensation_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения механизма компенсации затрат."
          required: true
        - name: "compensation_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Компенсация затрат на насаждения"
          description: "Механизм компенсации капитальных затрат производителя при гибели насаждений."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "partial_loss_recalculation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения пересчёта объёмов при частичной гибели насаждений."
          required: true
      store_payload: true

  - id: production_support_obligations_check
    name: "Обязанности заготовителя по обеспечению производства (ст. 536 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об обязанности заготовителя
      предоставлять ресурсы (семена, удобрения, СЗР, технику) производителю,
      распределения расходов и ответственности за непредоставление.
    triggers:
      any: ["production_support"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предоставление семян"
        - "обеспечение удобрениями"
        - "средства защиты растений"
        - "предоставление техники"
        - "агрономическое сопровождение"
        - "обеспечение производственного процесса"
        - "семенной материал"
        - "ГСМ"
        - "горюче-смазочные материалы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заготовитель.*обязуется.*предоставить"
        - "(?i)обеспечени(е|я).*производ(ства|ственного)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации.
        Проверяется наличие обязанностей заготовителя по обеспечению
        производственного процесса производителя.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязанности заготовителя предоставлять ресурсы.
        2. Перечень предоставляемых ресурсов.
        3. Кто несёт расходы на ресурсы.
        4. Предусмотрена ли прямо ответственность за непредоставление ресурсов.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обязанности заготовителя раскрыты:
        Фрагмент:
        "Заготовитель обязуется предоставить Производителю семена
        в количестве 5 тонн и минеральные удобрения в количестве 10 тонн.
        Стоимость ресурсов включается в закупочную цену сельхозпродукции.
        За непредоставление ресурсов Заготовитель уплачивает Производителю
        неустойку в размере 0,1% от стоимости ресурсов за каждый день просрочки."

        Ответ:
        {
          "production_support_status": "defined",
          "resources_list_status": "defined",
          "resources_list_details": "семена — 5 тонн; минеральные удобрения — 10 тонн",
          "cost_allocation_status": "defined",
          "cost_allocation_code": "offset_against_price",
          "liability_for_non_provision_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Заготовитель обязуется предоставить Производителю семена в количестве 5 тонн и минеральные удобрения в количестве 10 тонн."
            }
          ]
        }

        Пример 2 — есть только право, а не обязанность:
        Фрагмент:
        "Заготовитель вправе оказывать Производителю помощь
        в организации производства."

        Ответ:
        {
          "production_support_status": "not_defined",
          "resources_list_status": "not_defined",
          "resources_list_details": "Данные не определены",
          "cost_allocation_status": "not_defined",
          "cost_allocation_code": "not_defined",
          "liability_for_non_provision_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность (не рекомендация и не право) предоставить ресурсы?
        2. Перечислены ли конкретные ресурсы (семена / удобрения / СЗР / техника / ГСМ)?
        3. Кто платит за ресурсы — прямо ли указано?
        4. Есть ли прямое условие об ответственности за непредоставление ресурсов?
        5. Если прямого текста нет — верни "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "production_support_status": "<defined / not_defined>",
          "resources_list_status": "<defined / not_defined>",
          "resources_list_details": "<перечень или 'Данные не определены'>",
          "cost_allocation_status": "<defined / not_defined>",
          "cost_allocation_code": "<purchaser / producer / offset_against_price / not_defined>",
          "liability_for_non_provision_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предоставление семян обеспечение удобрениями средства защиты растений предоставление техники агрономическое сопровождение обеспечение производственного процесса семенной материал ГСМ горюче-смазочные материалы заготовитель обязуется предоставить ст. 536 ГК РФ расходы на ресурсы зачёт в счёт цены ответственность за непредоставление"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "цена продукции"
        - "оплата после приёмки"
        - "аванс производителю"
        - "срок сдачи"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "риск гибели"
        - "хранение"
        - "неустойка за недопоставку"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
