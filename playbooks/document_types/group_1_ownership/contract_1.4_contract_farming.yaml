          "interest_free_details": "авансовые платежи беспроцентные, не считаются коммерческим кредитом",
          "prepayment_interest_status": "not_defined",
          "prepayment_interest_details": "Данные не определены",
          "deferred_payment_interest_status": "defined",
          "deferred_payment_interest_details": "проценты по ключевой ставке ЦБ РФ на день оплаты",
