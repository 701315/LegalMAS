             insurance_obligated_party_code = "producer";
             insurance_cost_status = "defined";
             beneficiary_status = "defined";
             beneficiary_code = "purchaser";
             insurance_event_procedure_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для crop_insurance_check_presence используй только:
