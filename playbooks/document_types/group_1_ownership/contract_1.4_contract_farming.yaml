type: contract_1.4_contract_farming
name: "Договор контрактации"

description: |
  Специализированный вид купли-продажи сельскохозяйственной продукции, регулируемый § 5 Главы 30 ГК РФ.
  Характеризуется особым субъектным составом (производитель сельскохозяйственной продукции vs заготовитель),
  учётом зависимости производства от природных факторов, повышенной защитой производителя при форс-мажоре
  и субсидиарным применением норм о договоре поставки (§ 3 Главы 30 ГК РФ).
  Заготовитель — лицо, закупающее продукцию для последующей переработки или продажи.

version: 4.1
parent: class_1_transfer_of_ownership

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 5 Главы 30 ГК РФ (ст. 535-538)"
  doc_types_supported:
    - "договор контрактации"
    - "договор закупки сельскохозяйственной продукции"
    - "договор на поставку сельхозпродукции"
    - "договор на закупку зерна"
    - "договор на закупку молока"
    - "договор на закупку мяса"
    - "договор на закупку скота"
    - "договор на закупку овощей"
    - "договор на закупку фруктов"
    - "договор контрактации с авансированием"
    - "договор закупки урожая"
    - "договор поставки сельхозпродукции"
    - "договор контрактации урожая"
    - "договор закупки сельхозпродукции на корню"
    - "форвардный договор на урожай"
    - "договор поставки зерна после уборки"

    - "agricultural produce purchase agreement"
    - "crop purchase agreement"
    - "contract farming agreement"
    - "forward agricultural contract"
    - "forward contract for agricultural products"
    - "grain supply agreement"
    - "commodity farming agreement"
    - "FOSFA agreement"
    - "GAFTA agreement

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.79
    strong_signal_threshold: 0.87
    ambiguity_margin: 0.17
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)контрактаци[яи]"
      - "(?i)contract[_\\s-]*farming"
      - "(?i)agri[_\\s-]*contract"
      - "(?i)agri[_\\s-]*procurement"
      - "(?i)supply[_\\s-]*of[_\\s-]*agricultural[_\\s-]*products"
      - "(?i)закупки?[_\\s-]*(?:сельхоз|сельскохозяйственн)[а-я]*[_\\s-]*продукци[ии]"
      - "(?i)договор[_\\s-]*закупки[_\\s-]*зерн[ао]"
      - "(?i)договор[_\\s-]*закупки[_\\s-]*(?:молок[ао]|мяс[ао]|скот[аоу]?|овощ[ейья]|фрукт[овы]?)"

    folder_patterns:
      - "(?i)контрактаци[яи]"
      - "(?i)сельхоз"
      - "(?i)selsk\\w*"
      - "(?i)agri"
      - "(?i)agro"
      - "(?i)farming"

    keywords:

      high:
        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+контрактации\\b"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора контрактации, ст. 535 ГК РФ"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+закупки\\s+сельскохозяйственной\\s+продукции\\b"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Прямое название закупочного договора с указанием на сельхозпродукцию"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+контрактации\\s+с\\s+авансированием\\b"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Контрактация с авансированием производителя — характерная форма"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+на\\s+поставку\\s+сельхозпродукции\\b"
          weight: 0.90
          distinctiveness: high
          context: header
          description: "Название договора с использованием сокращения сельхозпродукция"

        - pattern: "(?i)производитель\\s+сельскохозяйственной\\s+продукции"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Роль производителя сельхозпродукции — ключевой субъект контрактации (ст. 535 ГК)"

        - pattern: "(?i)производитель\\s+сельхозпродукции"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Сокращённое обозначение производителя — специфично для контрактации"

        - pattern: "(?i)\\bзаготовитель[а-я]*\\b"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Заготовитель — специальная роль второй стороны контрактации (ст. 535 ГК РФ)"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*535\\s+ГК"
          weight: 0.97
          distinctiveness: high
          context: any
          description: "Прямая ссылка на ст. 535 ГК РФ — основная норма о контрактации"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*53[6-8]\\s+ГК"
          weight: 0.90
          distinctiveness: high
          context: any
          description: "Ссылки на ст. 536-538 ГК РФ — специальные нормы о контрактации"

        - pattern: "(?i)§\\s*5\\s+глав[ыы]\\s*30\\s+ГК"
          weight: 0.90
          distinctiveness: high
          context: any
          description: "Прямая ссылка на параграф ГК о контрактации"

        - pattern: "(?i)сдать\\s+сельскохозяйственную\\s+продукцию"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Обязанность производителя сдать продукцию — характеристика контрактации"

        - pattern: "(?i)принять\\s+и\\s+оплатить\\s+сельскохозяйственную\\s+продукцию"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Обязанность заготовителя принять и оплатить — специфично для контрактации"

        - pattern: "(?i)выращенный\\s+урожай"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Выращенный урожай как предмет договора — признак контрактации"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+на\\s+закупку\\s+зерн[ао]\\b"
          weight: 0.88
          distinctiveness: high
          context: header
          description: "Заголовок закупки зерна — специфичный вид контрактации"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+на\\s+закупку\\s+молок[ао]\\b"
          weight: 0.88
          distinctiveness: high
          context: header
          description: "Заголовок закупки молока — специфичный вид контрактации"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+на\\s+закупку\\s+мяс[ао](?:\\s*/\\s*скот[аоу]?)?\\b"
          weight: 0.88
          distinctiveness: high
          context: header
          description: "Заголовок закупки мяса/скота — специфичный вид контрактации"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+на\\s+закупку\\s+(?:овощ[ейья]|фрукт[овы]?)\\b"
          weight: 0.85
          distinctiveness: high
          context: header
          description: "Заголовок закупки овощей/фруктов — специфичный вид контрактации"

        - pattern: "(?i)\\bконтрактант[аоу]?\\b"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Контрактант — устаревший, но встречающийся термин для стороны контрактации"

        - pattern: "(?i)сельскохозяйственная\\s+продукция"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Прямое указание на сельскохозяйственную продукцию как предмет"

        - pattern: "(?i)\\bсельхозпродукция\\b"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Сокращённая форма — специфична для документов о контрактации"

        - pattern: "(?i)выращенная\\s+продукция"
          weight: 0.75
          distinctiveness: high
          context: any
          description: "Выращенная продукция — признак сельскохозяйственного производства"

        - pattern: "(?i)произведённая\\s+сельхозпродукция"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Произведённая сельхозпродукция — формула из контрактационных договоров"

        - pattern: "(?i)природн[а-я]+\\s+(?:явлени[яи]|услови[яи]|факторы?)"
          weight: 0.75
          distinctiveness: high
          context: body
          description: "Природные условия/явления — форс-мажорная специфика контрактации (ст. 538 ГК)"

        - pattern: "(?i)зависимост[ьи]\\s+(?:урожая|производства|сбора)\\s+от\\s+природн"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Зависимость от природных условий — квалифицирующий признак контрактации"

      medium:
        - pattern: "(?i)крестьянское\\s+фермерское\\s+хозяйство"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "КФХ — типичный субъект на стороне производителя в контрактации"

        - pattern: "(?i)\\bКФХ\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Аббревиатура крестьянско-фермерского хозяйства"

        - pattern: "(?i)авансирование\\s+производителя"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Авансирование производителя — характерный инструмент контрактации"

        - pattern: "(?i)\\bграфик\\s+сдачи\\s+продукции\\b"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "График сдачи продукции — плановый элемент контрактации"

        - pattern: "(?i)страхование\\s+урожая"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Страхование урожая — управление аграрными рисками"

        - pattern: "(?i)заготовка\\s+урожая"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Заготовка урожая — смежный термин к роли заготовителя"

        - pattern: "(?i)обязанность\\s+принять\\s+продукцию"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Безусловная обязанность заготовителя принять продукцию (ст. 536 ГК)"

        - pattern: "(?i)фермерское\\s+хозяйство"
          weight: 0.50
          distinctiveness: medium
          context: any
          description: "Фермерское хозяйство как сторона договора"

        - pattern: "(?i)субсидиарно\\s+(?:применяются?|действуют?)\\s+нормы\\s+о\\s+поставке"
          weight: 0.70
          distinctiveness: high
          context: body
          description: "Субсидиарное применение норм о поставке — ст. 535(2) ГК, специфично для контрактации"

        - pattern: "(?i)государственные?\\s+закупки\\s+сельскохозяйственной\\s+продукции"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Госзакупки сельхозпродукции — частая форма контрактации"

      low:
        - pattern: "(?i)\\bзерн[оа]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Зерно — может встречаться в поставке, страховании, хранении"

        - pattern: "(?i)\\bмолок[оа]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Молоко — общий продовольственный термин"

        - pattern: "(?i)\\bмяс[оа]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Мясо — общий продовольственный термин"

        - pattern: "(?i)\\bудобрени[яи]\\b"
          weight: 0.20
          distinctiveness: low
          context: any
          description: "Удобрения — может указывать на производственный контекст или поставку ресурсов"

        - pattern: "(?i)\\bагроном\\b"
          weight: 0.20
          distinctiveness: low
          context: any
          description: "Агроном — слабый маркер аграрного контекста"

        - pattern: "(?i)\\bурожайность\\b"
          weight: 0.22
          distinctiveness: low
          context: any
          description: "Урожайность — аграрный контекст, но слабый дискриминатор"

        - pattern: "(?i)площадь\\s+(?:угодий|посевов|полей)"
          weight: 0.20
          distinctiveness: low
          context: any
          description: "Площадь угодий/посевов — сельскохозяйственный контекст"

    exclusions:
      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+поставки\\s+промышленных\\s+товаров\\b"
        severity: hard
        weight: -1.0
        description: "Поставка промышленных товаров — § 3 Гл. 30 ГК, не контрактация"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+поставки\\s+оборудования\\b"
        severity: hard
        weight: -1.0
        description: "Поставка оборудования — явно не сельхозпродукция"

      - pattern: "(?i)\\bрозничная\\s+купля-?продажа\\b"
        severity: hard
        weight: -1.0
        description: "Розничная купля-продажа — B2C, § 2 Гл. 30 ГК, несовместима с контрактацией"

      - pattern: "(?i)для\\s+личных(?:,\\s*семейных)?(?:,\\s*домашних)?(?:,?\\s*или\\s+иных)?\\s+нужд"
        severity: hard
        weight: -1.0
        description: "Формула потребительской цели — признак розницы, исключает контрактацию"

      - pattern: "(?i)\\bпубличная\\s+оферта\\b"
        severity: hard
        weight: -1.0
        description: "Публичная оферта — форма розничной торговли, не контрактации"

      - pattern: "(?i)\\bнедвижимость\\b"
        severity: hard
        weight: -1.0
        description: "Недвижимость — совершенно другой объект и тип договора"

      - pattern: "(?i)\\bквартир[аеиу]\\b"
        severity: hard
        weight: -1.0
        description: "Квартира — объект недвижимости, не сельхозпродукция"

      - pattern: "(?i)(?:здани[ея]|сооружени[ея])"
        severity: hard
        weight: -1.0
        description: "Здание/сооружение — объект недвижимости, не предмет контрактации"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+оказания\\s+услуг\\b"
        severity: hard
        weight: -1.0
        description: "Договор оказания услуг — Гл. 39 ГК, иная правовая природа"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+подряда\\b"
        severity: hard
        weight: -1.0
        description: "Договор подряда — Гл. 37 ГК, выполнение работ, не передача продукции"

      - pattern: "(?i)\\bэнергоснабжение\\b"
        severity: hard
        weight: -1.0
        description: "Энергоснабжение — § 6 Гл. 30 ГК, не имеет отношения к сельхозпродукции"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+аренды\\s+(?:земельного\\s+участка|сельскохозяйственных\\s+угодий)\\b"
        severity: hard
        weight: -1.0
        description: "Аренда сельхозземель — Гл. 34 ГК; не контрактация, хотя аграрный контекст совпадает"

      # ── Soft exclusions

      - pattern: "(?i)поставка\\s+готовой\\s+продукции"
        severity: soft
        weight: -0.35
        description: "Поставка готовой продукции — скорее § 3 Гл. 30 ГК, не контрактация"

      - pattern: "(?i)\\bперепродажа\\b"
        severity: soft
        weight: -0.30
        description: "Перепродажа указывает на торговый, а не производственный характер"

      - pattern: "(?i)промышленные\\s+товары"
        severity: soft
        weight: -0.30
        description: "Промышленные товары — вероятно поставка, не сельхозконтрактация"

      - pattern: "(?i)гражданин-?потребитель"
        severity: soft
        weight: -0.40
        description: "Гражданин-потребитель — B2C-маркер, снижает вероятность контрактации"

      - pattern: "(?i)интернет-?магазин"
        severity: soft
        weight: -0.35
        description: "Интернет-магазин — e-commerce контекст, не закупка сельхозпродукции"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+хранения\\s+(?:зерна|сельскохозяйственной\\s+продукции)\\b"
        severity: soft
        weight: -0.45
        description: "Хранение сельхозпродукции — Гл. 47 ГК; аграрный контекст, но иная конструкция"

