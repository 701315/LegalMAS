  - id: tax_representations_check
    name: "Заверения об обстоятельствах и налоговая оговорка"
    description: >
      Фактографическая проверка наличия заверений об обстоятельствах
      (отсутствие банкротства, налоговый режим) и обязательства
      о возмещении потерь при доначислении налогов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговая оговорка"
        - "заверения об обстоятельствах"
        - "возмещение потерь"
        - "возмещение имущественных потерь"
        - "54.1 НК"
        - "налоговая выгода"
        - "доначисление налогов"
        - "необоснованная налоговая выгода"
        - "бенефициарный владелец"
        - "цепочка собственников"
        - "налоговая добросовестность"
        - "ЕСХН"
        - "применяемый налоговый режим"
        - "заверения о налоговом режиме"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов[а-я]+\\s+оговорк"
        - "(?i)заверени[яе].*об\\s+обстоятельств"
        - "(?i)возмещени[ея].*потерь"
        - "(?i)54\\.?1\\s*НК"
        - "(?i)необоснованн[а-я]+\\s+налогов[а-я]+\\s+выгод"
        - "(?i)бенефициарн[а-я]+\\s+владел"
        - "(?i)применяем[а-я]+\\s+налогов[а-я]+\\s+режим"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации между предпринимателями.
        Проверяется наличие заверений об обстоятельствах и налоговой оговорки.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ (заверения об обстоятельствах)
        - ст. 406.1 ГК РФ (возмещение имущественных потерь)
        - ст. 54.1 НК РФ (пределы осуществления прав по исчислению налогов)
        - Постановление Пленума ВАС РФ № 53 от 12.10.2006

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверения о налоговом режиме контрагента (ЕСХН / ОСНО).
        2. Заверения о налоговой добросовестности и отсутствии
           признаков технической компании.
        3. Заверения об отсутствии процедур банкротства.
        4. Обязательство о возмещении имущественных потерь
           при доначислении налогов.
        5. Обязанность раскрывать бенефициаров / цепочку собственников.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное раскрытие:
        Фрагмент:
        "Каждая сторона заверяет, что применяет налоговый режим,
        указанный в реквизитах (ОСНО/ЕСХН), является добросовестным
        налогоплательщиком и не находится в процедуре банкротства.
        При доначислении налогов Покупателю по сделке Продавец возмещает
        потери в полном объёме. Стороны обязуются раскрывать информацию
        о цепочке собственников по запросу."

        Ответ:
        {
          "tax_regime_representations_status": "defined",
          "tax_regime_representations_details": "применение налогового режима согласно реквизитам (ОСНО/ЕСХН)",
          "tax_good_faith_representations_status": "defined",
          "tax_good_faith_representations_details": "добросовестный налогоплательщик, отсутствие признаков технической компании",
          "insolvency_representations_status": "defined",
          "insolvency_representations_details": "отсутствие процедуры банкротства",
          "loss_indemnification_status": "defined",
          "loss_indemnification_details": "возмещение потерь при доначислении налогов в полном объёме",
          "beneficial_owners_disclosure_status": "defined",
          "beneficial_owners_disclosure_details": "раскрытие цепочки собственников по запросу",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Каждая сторона заверяет, что применяет налоговый режим, указанный в реквизитах (ОСНО/ЕСХН), является добросовестным налогоплательщиком и не находится в процедуре банкротства."
            }
          ]
        }

        Пример 2 — заверения не раскрыты:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство РФ."

        Ответ:
        {
          "tax_regime_representations_status": "not_defined",
          "tax_regime_representations_details": "Данные не определены",
          "tax_good_faith_representations_status": "not_defined",
          "tax_good_faith_representations_details": "Данные не определены",
          "insolvency_representations_status": "not_defined",
          "insolvency_representations_details": "Данные не определены",
          "loss_indemnification_status": "not_defined",
          "loss_indemnification_details": "Данные не определены",
          "beneficial_owners_disclosure_status": "not_defined",
          "beneficial_owners_disclosure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли заверение о применяемом налоговом режиме?
        2. Есть ли заверение о налоговой добросовестности?
        3. Есть ли заверение об отсутствии банкротства?
        4. Есть ли обязательство возместить потери при доначислении?
        5. Есть ли обязанность раскрывать бенефициаров?
        6. Если ничего нет — "not_defined" и "Данные не определены".

