  - id: waste_disposal_check
    name: "Утилизация отходов производства и побочной продукции"
    description: >
      Фактографическая проверка наличия условий об утилизации отходов
      производства, распределении расходов и соблюдении экологических норм.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "утилизация отходов"
        - "отходы производства"
        - "побочная продукция"
        - "солома"
        - "ботва"
        - "палая продукция"
        - "89-ФЗ"
        - "обращение с отходами"
        - "экологические нормы"
        - "вывоз отходов"
        - "размещение отходов"
        - "лицензированный оператор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утилизаци[яи].*отход"
        - "(?i)отход[ыа]+\\s+производства"
        - "(?i)побочн[а-я]+\\s+продукци"
        - "(?i)89-?ФЗ|89\\s+ФЗ"
        - "(?i)обращени[ея].*с\\s+отходами"
        - "(?i)лицензированн[а-я]+\\s+оператор"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: наличие условий об утилизации
        отходов производства и побочной продукции.

        Нормативный ориентир:
        - ФЗ № 89-ФЗ «Об отходах производства и потребления»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на обязанность утилизации отходов производства.
        2. Распределение расходов на утилизацию между сторонами.
        3. Требование соблюдения экологических норм.
        4. Требование привлекать лицензированного оператора по обращению
           с отходами.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — раскрыто:
        Фрагмент:
        "Отходы производства (солома, ботва) утилизируются Производителем
        в соответствии с 89-ФЗ. Расходы на утилизацию несёт Производитель.
        При необходимости вывоза отходов за пределы хозяйства Производитель
        привлекает лицензированного оператора. Соблюдение экологических
        норм обязательно."

        Ответ:
        {
          "waste_disposal_obligation_status": "defined",
          "waste_disposal_obligation_details": "утилизация отходов силами Производителя согласно 89-ФЗ",
          "cost_allocation_status": "defined",
          "cost_allocation_code": "producer",
          "cost_allocation_details": "расходы на утилизацию несёт Производитель",
          "environmental_norms_status": "defined",
          "environmental_norms_details": "соблюдение экологических норм обязательно",
          "licensed_operator_status": "defined",
          "licensed_operator_details": "привлечение лицензированного оператора при вывозе отходов",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "Отходы производства (солома, ботва) утилизируются Производителем в соответствии с 89-ФЗ."
            }
          ]
        }

        Пример 2 — условия не раскрыты:
        Фрагмент:
        "Производитель обязуется передать продукцию надлежащего качества."

        Ответ:
        {
          "waste_disposal_obligation_status": "not_defined",
          "waste_disposal_obligation_details": "Данные не определены",
          "cost_allocation_status": "not_defined",
          "cost_allocation_code": "not_defined",
          "cost_allocation_details": "Данные не определены",
          "environmental_norms_status": "not_defined",
          "environmental_norms_details": "Данные не определены",
          "licensed_operator_status": "not_defined",
          "licensed_operator_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об утилизации отходов?
        2. Указано ли распределение расходов?
        3. Есть ли требование соблюдения экологических норм?
        4. Есть ли требование лицензированного оператора?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "waste_disposal_obligation_status": "<defined / not_defined>",
          "waste_disposal_obligation_details": "<текст или 'Данные не определены'>",
          "cost_allocation_status": "<defined / not_defined>",
          "cost_allocation_code": "<producer / purchaser / shared / not_defined>",
          "cost_allocation_details": "<текст или 'Данные не определены'>",
          "environmental_norms_status": "<defined / not_defined>",
          "environmental_norms_details": "<текст или 'Данные не определены'>",
          "licensed_operator_status": "<defined / not_defined>",
          "licensed_operator_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "утилизация отходов отходы производства побочная продукция солома ботва палая продукция 89-ФЗ обращение с отходами экологические нормы вывоз отходов размещение отходов лицензированный оператор"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "цена"
        - "оплата"
        - "аванс"
        - "срок сдачи"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "качество продукции"
        - "ГОСТ"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "waste_disposal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия об утилизации отходов производства и побочной продукции.
        Анализируй только эту тему.
        Не анализируй цену, качество, сроки или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. waste_disposal_check_presence:
           Агрегатное signal-поле — наличие регулирования по утилизации
           отходов.
           - "present" — если хотя бы одно из содержательных полей
             (waste_disposal_obligation_status, cost_allocation_status,
              environmental_norms_status,
              licensed_operator_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - cost_allocation_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. waste_disposal_obligation_status:
           - "defined" — если прямо указана обязанность утилизации
             отходов производства;
           - "not_defined" — если не указана.

        2. waste_disposal_obligation_details:
           Условия утилизации.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. cost_allocation_status:
           - "defined" — если прямо указано, кто несёт расходы
             на утилизацию;
           - "not_defined" — если не указано.

        4. cost_allocation_code:
           - "producer" / "purchaser" / "shared" / "not_defined".

        5. cost_allocation_details:
           Распределение расходов на утилизацию.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. environmental_norms_status:
           - "defined" — если прямо указано соблюдение экологических норм;
           - "not_defined" — если не указано.

        7. environmental_norms_details:
           Требования по экологическим нормам.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. licensed_operator_status:
           - "defined" — если прямо требуется привлекать
             лицензированного оператора по обращению с отходами;
           - "not_defined" — если не требуется.

        9. licensed_operator_details:
           Требования к оператору.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни waste_disposal_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          cost_allocation_code = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни отходов, ни утилизации, ни экологических норм.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны соблюдают законодательство об отходах."
           → presence = "present";
             waste_disposal_obligation_status = "not_defined";
             environmental_norms_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.8 — расходы на производителе, в п.11 — на заготовителе.
           → presence = "unclear";
             cost_allocation_status = "not_defined";
             cost_allocation_code = "not_defined";
             cost_allocation_details = "Не удалось определить".

        4. Полное раскрытие.
           "Отходы (солома, ботва) утилизируются Производителем
           в соответствии с 89-ФЗ. Расходы — на Производителе.
           При вывозе — лицензированный оператор. Экологические нормы обязательны."
           → presence = "present";
             waste_disposal_obligation_status = "defined";
             cost_allocation_status = "defined";
             cost_allocation_code = "producer";
             environmental_norms_status = "defined";
             licensed_operator_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для waste_disposal_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для cost_allocation_code используй только:
          "producer", "purchaser", "shared", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "waste_disposal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по утилизации отходов. Внутреннее агрегатное signal-поле."
          required: true
        - name: "waste_disposal_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обязанности утилизации отходов."
          required: true
        - name: "waste_disposal_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Утилизация отходов"
          description: "Условия утилизации отходов производства и побочной продукции."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "cost_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения расходов на утилизацию."
          required: true
        - name: "cost_allocation_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["producer", "purchaser", "shared", "not_defined"]
          description: "Кто несёт расходы на утилизацию отходов."
          required: true
        - name: "cost_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на утилизацию"
          description: "Распределение расходов на утилизацию отходов."
          required: false
          display_in_grid: false
        - name: "environmental_norms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования соблюдения экологических норм."
          required: true
        - name: "environmental_norms_details"
          type: "string"
          presentation: "fact"
          label: "Экологические нормы"
          description: "Требования по соблюдению экологических норм при утилизации."
          required: false
          display_in_grid: false
        - name: "licensed_operator_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования привлекать лицензированного оператора."
          required: true
        - name: "licensed_operator_details"
          type: "string"
          presentation: "fact"
          label: "Лицензированный оператор"
          description: "Требования к привлечению лицензированного оператора по обращению с отходами."
          required: false
          display_in_grid: false
      store_payload: true

  - id: commercial_credit_interest_check
    name: "Проценты по коммерческому кредиту (аванс/отсрочка)"
    description: >
      Фактографическая проверка наличия условий о безвозмездности или
