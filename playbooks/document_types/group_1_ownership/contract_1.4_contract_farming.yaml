        - "арбитражный образец"
        - "третейская экспертиза"
        - "разногласия по качеству"
        - "рекламация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)экспертиз(а|у|ы)\\s+качеств"
        - "(?i)рекламац"

  - id: "storage_conditions"
    name: "Условия хранения продукции до/после приёмки"
