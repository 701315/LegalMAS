  - id: price_regulation_and_interventions_check
    name: "Госрегулирование цен и закупочные интервенции"
    description: >
      Фактографическая проверка наличия в договоре механизма пересмотра
      цены при государственном регулировании, закупочных интервенциях
      и привязки к биржевым котировкам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "закупочные интервенции"
        - "государственные интервенции"
        - "товарные интервенции"
        - "биржевые котировки"
        - "НТБ"
        - "СПбМТСБ"
        - "госрегулирование цен"
        - "регулируемая цена"
        - "пересмотр цены"
        - "индексация цены"
        - "при изменении рыночной цены"
        - "264-ФЗ"
        - "приказ Минсельхоза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закупочн[а-я]+\\s+интервенц"
        - "(?i)государственн[а-я]+\\s+интервенц"
        - "(?i)биржев[а-я]+\\s+котировк"
        - "(?i)НТБ|СПбМТСБ"
        - "(?i)264-?ФЗ|264\\s+ФЗ"
        - "(?i)пересмотр.*цен.*при"
        - "(?i)госрегулирован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: наличие механизма пересмотра цены
        при государственном регулировании, закупочных интервенциях
        и биржевых котировках.

        Нормативный ориентир:
        - ФЗ № 264-ФЗ «О развитии сельского хозяйства»
        - Постановление Правительства РФ № 580
        - Приказы Минсельхоза о закупочных интервенциях

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Ссылку на закупочные интервенции.
        2. Привязку цены к биржевым котировкам (НТБ, СПбМТСБ).
        3. Механизм пересмотра цены при госрегулировании.
        4. Указание порядка действий при введении интервенций.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Цена за тонну определяется на основании котировок НТБ на дату
        отгрузки. При введении государственных закупочных интервенций
        стороны пересматривают цену в соответствии с уровнем интервенционных
        цен. Приказ Минсельхоза применяется к настоящему договору."

        Ответ:
        {
          "interventions_reference_status": "defined",
          "interventions_reference_details": "государственные закупочные интервенции; пересмотр цены по уровню интервенционных цен",
          "exchange_quotes_status": "defined",
          "exchange_quotes_details": "котировки НТБ на дату отгрузки",
          "price_revision_mechanism_status": "defined",
          "price_revision_mechanism_details": "пересмотр цены по интервенционным ценам при введении интервенций",
          "ministerial_order_reference_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Цена за тонну определяется на основании котировок НТБ на дату отгрузки. При введении государственных закупочных интервенций стороны пересматривают цену в соответствии с уровнем интервенционных цен."
            }
          ]
        }

        Пример 2 — механизмы не указаны:
        Фрагмент:
        "Цена определяется соглашением сторон."

        Ответ:
        {
          "interventions_reference_status": "not_defined",
          "interventions_reference_details": "Данные не определены",
          "exchange_quotes_status": "not_defined",
          "exchange_quotes_details": "Данные не определены",
          "price_revision_mechanism_status": "not_defined",
          "price_revision_mechanism_details": "Данные не определены",
          "ministerial_order_reference_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли ссылка на закупочные / товарные интервенции?
        2. Есть ли привязка к биржевым котировкам (НТБ, СПбМТСБ)?
        3. Есть ли механизм пересмотра цены при госрегулировании?
        4. Есть ли ссылка на приказ Минсельхоза?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "interventions_reference_status": "<defined / not_defined>",
          "interventions_reference_details": "<текст или 'Данные не определены'>",
          "exchange_quotes_status": "<defined / not_defined>",
          "exchange_quotes_details": "<текст или 'Данные не определены'>",
          "price_revision_mechanism_status": "<defined / not_defined>",
          "price_revision_mechanism_details": "<текст или 'Данные не определены'>",
          "ministerial_order_reference_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "закупочные интервенции государственные интервенции товарные интервенции биржевые котировки НТБ СПбМТСБ госрегулирование цен регулируемая цена пересмотр цены индексация цены при изменении рыночной цены 264-ФЗ приказ Минсельхоза"
      preferred_unit_types:
        - payment_term
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "срок сдачи"
        - "место приёмки"
        - "качество"
        - "риск гибели"
        - "ответственное хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "price_regulation_and_interventions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        сведения о механизмах пересмотра цены при госрегулировании,
        закупочных интервенциях и биржевых котировках.
        Не анализируй цену как таковую, качество, сроки или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. price_regulation_and_interventions_check_presence:
           Агрегатное signal-поле — наличие регулирования по госрегулированию
           цен и интервенциям.
           - "present" — если хотя бы одно из содержательных полей
             (interventions_reference_status, exchange_quotes_status,
              price_revision_mechanism_status,
              ministerial_order_reference_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - interventions_reference_status = "not_defined";
           - exchange_quotes_status = "not_defined";
           - price_revision_mechanism_status = "not_defined";
           - ministerial_order_reference_status = "not_defined";
           - interventions_reference_details, exchange_quotes_details,
             price_revision_mechanism_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. interventions_reference_status:
           - "defined" — если есть прямая ссылка на закупочные / товарные
             интервенции;
           - "not_defined" — если нет.

        2. interventions_reference_details:
           Условие о применении интервенций.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. exchange_quotes_status:
           - "defined" — если цена привязана к биржевым котировкам
             (НТБ, СПбМТСБ и др.);
           - "not_defined" — если нет.

        4. exchange_quotes_details:
           Описание привязки к биржевым котировкам.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. price_revision_mechanism_status:
           - "defined" — если прямо указан механизм пересмотра цены
             при госрегулировании / интервенциях;
           - "not_defined" — если не указан.

        6. price_revision_mechanism_details:
           Описание механизма пересмотра цены.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. ministerial_order_reference_status:
           - "defined" — если есть прямая ссылка на приказ Минсельхоза
             или Постановление Правительства по интервенциям;
           - "not_defined" — если нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни price_regulation_and_interventions_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни интервенций, ни биржевых котировок,
           ни механизма пересмотра цены.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Только фиксированная цена без механизмов.
           "Цена определяется соглашением сторон."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.2 — цена фиксирована, в п.8 — пересмотр по котировкам.
           → presence = "unclear";
             price_revision_mechanism_status = "not_defined";
             price_revision_mechanism_details = "Не удалось определить".

        4. Полное раскрытие.
           "Цена на основании котировок НТБ. При введении интервенций
           — пересмотр по уровню интервенционных цен в соответствии
           с приказом Минсельхоза."
           → presence = "present";
             interventions_reference_status = "defined";
             exchange_quotes_status = "defined";
             price_revision_mechanism_status = "defined";
             ministerial_order_reference_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для price_regulation_and_interventions_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "price_regulation_and_interventions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по госрегулированию цен и интервенциям. Внутреннее агрегатное signal-поле."
          required: true
        - name: "interventions_reference_status"
          type: "string"
