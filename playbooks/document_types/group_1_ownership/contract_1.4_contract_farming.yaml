           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - force_majeure_status = "not_defined";
           - force_majeure_type = "not_defined";
           - specific_events_status = "not_defined";
           - notification_status = "not_defined";
           - proof_requirements_status = "not_defined";
