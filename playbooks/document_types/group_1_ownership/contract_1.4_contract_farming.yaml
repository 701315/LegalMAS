  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет, количество, цена и оплата
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_price_payment_cluster
    name: "Предмет, количество, цена и порядок расчётов"
    description: >
      Фактографическая проверка наличия в договоре предмета (вид и наименование
      продукции), количества, цены, механизма пересмотра цены и порядка расчётов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование продукции"
        - "вид продукции"
        - "количество"
        - "объём поставки"
        - "сельскохозяйственная продукция"
        - "выращенная продукция"
        - "цена"
        - "стоимость"
        - "цена за тонну"
        - "цена за килограмм"
        - "рублей"
        - "рыночная цена"
        - "оплата"
        - "срок оплаты"
        - "после приёмки"
        - "авансирование"
        - "предоплата"
        - "аванс"
        - "корректировка цены"
        - "пересмотр цены"
        - "индексация"
        - "биржевые котировки"
        - "НДС"
        - "ЕСХН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)за\\s+(?:тонну|кг|центнер|литр)"
        - "(?i)оплат(а|ы).*?(после|в\\s+течение)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)(корректировк|пересмотр|изменени|индексаци)(а|е|и|я)\\s+цен"
        - "(?i)биржев(ая|ой|ых)\\s+(цен|котировк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 424, 455, 485-487 ГК РФ).
        Проверяется только один вопрос: предмет договора, количество продукции,
        цена и порядок расчётов, авансирование производителя.

        Важно:
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист сравнивает несколько договоров — нужна чёткая таблица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и вид сельскохозяйственной продукции.
        2. Количество продукции с единицей измерения.
        3. Цена за единицу продукции.
        4. Налоговая оговорка (НДС включён / без НДС / ЕСХН).
        5. Механизм изменения/пересмотра цены.
        6. Срок оплаты после приёмки.
        7. Наличие авансирования (предоплаты) производителя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязуется вырастить и передать пшеницу продовольственную
        4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС
        (производитель применяет ЕСХН). Оплата — в течение 5 рабочих дней
        после приёмки. Заготовитель выплачивает аванс в размере 30%
        от стоимости договора не позднее 1 апреля 2026 г."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "пшеница продовольственная 4 класса",
          "quantity_status": "defined",
          "quantity_details": "200 тонн",
          "price_status": "defined",
          "price_details": "18 000 рублей за тонну",
          "vat_status": "defined",
          "vat_details": "без НДС, ЕСХН",
          "price_change_mechanism_status": "not_defined",
          "price_change_mechanism_details": "Данные не определены",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 5 рабочих дней после приёмки",
          "advance_status": "defined",
          "advance_details": "30% от стоимости договора не позднее 1 апреля 2026 г.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Производитель обязуется вырастить и передать пшеницу продовольственную 4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Условия сделки будут определены дополнительным соглашением."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "price_change_mechanism_status": "not_defined",
          "price_change_mechanism_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "advance_status": "not_defined",
          "advance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное наименование продукции (не просто "сельхозпродукция")?
        2. Указано ли количество числом с единицей?
        3. Указана ли цена за единицу конкретной суммой?
        4. Указано ли явно: с НДС / без НДС / ЕСХН?
        5. Есть ли механизм пересмотра цены (индексация, привязка к бирже)?
        6. Указан ли конкретный срок оплаты?
        7. Есть ли условие об авансе с размером и сроком?
        8. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subject_status": "<defined / not_defined>",
          "subject_details": "<наименование или 'Данные не определены'>",
          "quantity_status": "<defined / not_defined>",
          "quantity_details": "<количество с единицей или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<цена или 'Данные не определены'>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<с НДС / без НДС / ЕСХН или 'Данные не определены'>",
          "price_change_mechanism_status": "<defined / not_defined>",
          "price_change_mechanism_details": "<механизм или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "advance_status": "<defined / not_defined>",
          "advance_details": "<условия аванса или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "наименование продукции вид продукции сельскохозяйственная продукция выращенная продукция количество объём поставки цена стоимость тонна килограмм центнер литр рублей за тонну рыночная цена оплата срок оплаты после приёмки авансирование предоплата аванс корректировка цены пересмотр цены индексация биржевые котировки НДС ЕСХН"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "производитель в лице"
        - "заготовитель в лице"
        - "ИНН"
        - "ОГРН"
        - "срок сдачи"
        - "место приёмки"
        - "транспорт"
        - "тара"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "фитосанитарный"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false



      llm_max_tokens: 1500



      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        данные о предмете договора, количестве продукции, цене, налоговой оговорке,
        механизме изменения цены, сроке оплаты и авансировании производителя.
        Не анализируй качество продукции, сроки сдачи, транспорт или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. subject_status — "defined" или "not_defined".
        2. subject_details — наименование и вид сельскохозяйственной продукции.
        3. quantity_status — "defined" или "not_defined".
        4. quantity_details — количество с единицей измерения (тонны, кг и т.д.).
        5. price_status — "defined" или "not_defined".
        6. price_details — цена за единицу продукции с валютой.
        7. vat_status — "defined" или "not_defined".
        8. vat_details — налоговая оговорка (с НДС / без НДС / ЕСХН).
        9. price_change_mechanism_status — "defined" или "not_defined".
        10. price_change_mechanism_details — механизм изменения цены (индексация, привязка к бирже и т.п.).
        11. payment_deadline_status — "defined" или "not_defined".
        12. payment_deadline_details — срок оплаты после приёмки.
        13. advance_status — "defined" или "not_defined".
        14. advance_details — размер и срок аванса.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Не делай предположений об условиях.
        - ЕСХН → vat_details = "ЕСХН, без НДС".
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "subject_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения предмета договора."
          required: true
        - name: "subject_details"
          type: "string"
          presentation: "fact"
          label: "Предмет договора"
          description: "Наименование и вид сельскохозяйственной продукции."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "quantity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения количества."
          required: true
        - name: "quantity_details"
          type: "string"
          presentation: "fact"
          label: "Количество продукции"
          description: "Количество с единицей измерения."
          required: false
          display_in_grid: false
        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения цены."
          required: true
        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена за единицу"
          description: "Цена за единицу продукции."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "vat_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус налоговой оговорки."
          required: false
        - name: "vat_details"
          type: "string"
          presentation: "fact"
          label: "Налоговый режим"
          description: "Налоговая оговорка (с НДС / без НДС / ЕСХН)."
          required: false
          display_in_grid: false
        - name: "price_change_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма изменения цены."
          required: false
        - name: "price_change_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Механизм изменения цены"
          description: "Механизм пересмотра цены (индексация, биржа и т.п.)."
          required: false
          display_in_grid: false
        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока оплаты."
          required: true
        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: "Срок оплаты после приёмки продукции."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "advance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об авансировании."
          required: false
        - name: "advance_details"
          type: "string"
          presentation: "fact"
          label: "Условия аванса"
          description: "Размер и срок аванса производителю."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
