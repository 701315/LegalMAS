        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)график\\s+(сдач|поставк)"
        - "(?i)порядок\\s+приёмк"
        - "(?i)акт\\s+приёмк"
        - "(?i)заготовитель.*обязан.*принять"
        - "(?i)(транспортировк|перевозк|доставк)"
        - "(?i)(тар[аеуой]|упаковк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 536, 508, 517 ГК РФ).
        Проверяется только один вопрос: условия сдачи и приёмки продукции,
        место, транспортировка и тара.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок сдачи продукции (конкретная дата или период).
        2. Наличие графика сдачи по периодам (для сезонных контрактов).
        3. Место приёмки (у производителя / на элеваторе / на складе заготовителя).
        4. Обязанность заготовителя принять продукцию.
        5. Кто обеспечивает тару и упаковку.
        6. Кто обеспечивает транспорт для вывоза.
        7. Документы при приёмке (ТТН, акт приёмки).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель сдаёт продукцию не позднее 31 октября 2026 г.
        Заготовитель обязан принять продукцию по месту нахождения производителя,
        обеспечить тару и транспортировку собственными силами.
        Приёмка оформляется товарно-транспортной накладной."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "не позднее 31 октября 2026 г.",
          "delivery_schedule_status": "not_defined",
          "delivery_schedule_details": "Данные не определены",
          "acceptance_place_status": "defined",
          "acceptance_place_code": "producer_location",
          "acceptance_place_details": "по месту нахождения производителя",
          "acceptance_obligation_status": "defined",
          "acceptance_obligation_details": "заготовитель обязан принять продукцию",
          "packaging_provision_status": "defined",
          "packaging_provision_code": "purchaser",
          "transport_provision_status": "defined",
          "transport_provision_code": "purchaser",
          "acceptance_documents_status": "defined",
          "acceptance_documents_details": "товарно-транспортная накладная",
