        - "оплата"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 1.0]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
