          "delivery_place": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное наименование (не просто "продукция")?
        2. Можно ли определить вид продукции (зерно / молоко / мясо и т.д.)?
        3. Указано ли количество числом с единицей?
        4. Есть ли конкретный ГОСТ, ТУ или иной стандарт?
        5. Указаны ли конкретные сроки или периоды сдачи?
        6. Указано ли конкретное место сдачи?
        7. Если чего-то нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
