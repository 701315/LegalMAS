        при приёмке.
        Не анализируй цену, оплату, качество или ответственность сторон.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. delivery_term_status — "defined" или "not_defined".
        2. delivery_term_details — конкретный срок сдачи (дата или период).
        3. delivery_schedule_status — "defined" или "not_defined".
        4. delivery_schedule_details — график сдачи по периодам/партиям.
        5. acceptance_place_status — "defined" или "not_defined".
        6. acceptance_place_code — одно из: producer_location / purchaser_warehouse / elevator / other / not_defined.
        7. acceptance_place_details — конкретное место (адрес, название элеватора и т.п.).
        8. acceptance_obligation_status — "defined" если прямо указана обязанность
           заготовителя принять продукцию (или прямо запрещено отказываться от приёмки),
           иначе "not_defined".
        9. acceptance_obligation_details — формулировка об обязанности заготовителя принять продукцию.
        10. packaging_provision_status — "defined" или "not_defined".
        11. packaging_provision_code — одно из: purchaser / producer / not_defined.
        12. transport_provision_status — "defined" или "not_defined".
        13. transport_provision_code — одно из: purchaser / producer / shared / not_defined.
        14. acceptance_documents_status — "defined" или "not_defined".
        15. acceptance_documents_details — документы при приёмке (ТТН, акт и т.п.).

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Самовывоз = transport_provision_code: purchaser.
        - Доставка производителем = transport_provision_code: producer.
        - Пиши кратко. Верни только JSON.
        </rules>
