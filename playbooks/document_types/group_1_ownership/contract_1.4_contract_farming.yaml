        <task>
        0. commercial_credit_interest_check_presence:
           Агрегатное signal-поле — наличие регулирования по коммерческому
           кредиту и процентам.
           - "present" — если хотя бы одно из содержательных полей
             (interest_free_status, prepayment_interest_status,
              deferred_payment_interest_status,
              interest_rate_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. interest_free_status:
           - "defined" — если есть прямое условие о безвозмездности
             коммерческого кредита / отсутствии процентов;
           - "not_defined" — если нет.

        2. interest_free_details:
           Формулировка о безвозмездности.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. prepayment_interest_status:
           - "defined" — если есть условие о процентах на предоплату / аванс;
           - "not_defined" — если нет.

        4. prepayment_interest_details:
           Условия начисления процентов на предоплату.
           Правила:
           - если не установлено — "Данные не определены";
