  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Специальная форс-мажорная оговорка для с/х
  # ──────────────────────────────────────────────────────────────────────────
  - id: agricultural_force_majeure_check
    name: "Специальная форс-мажорная оговорка для с/х производства"
    description: >
      Фактографическая проверка наличия форс-мажорной оговорки с учётом специфики
      сельскохозяйственного производства — перечень с/х рисков, уведомление,
      доказательства, последствия для обязательств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неблагоприятные погодные условия"
        - "засуха"
        - "наводнение"
        - "заморозки"
        - "град"
        - "эпидемии"
        - "эпизоотия"
        - "нашествие вредителей"
        - "стихийные бедствия"
        - "гибель урожая"
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождается от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)производитель.*освобождается.*ответственности"
        - "(?i)обстоятельств(а|ами)\\s+непреодолимой\\s+силы"
        - "(?i)форс[\\s-]?мажор"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 538, 401, 416 ГК РФ).
        Проверяется только один вопрос: наличие форс-мажорной оговорки
        с учётом специфики сельскохозяйственного производства.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие форс-мажорной оговорки (полная / только общая формулировка / отсутствует).
        2. Перечислены ли конкретные с/х риски (засуха, заморозки, эпизоотия и т.д.).
        3. Порядок уведомления о форс-мажоре.
        4. Требуемые доказательства (ТПП, Гидрометцентр, Россельхознадзор).
        5. Последствия для обязательств (отсрочка / уменьшение объёма / прекращение).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_specified", пустые строки.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка:
        Фрагмент:
        "Производитель освобождается от ответственности при наступлении
        обстоятельств непреодолимой силы, в том числе: засуха, наводнение,
        заморозки в вегетационный период, градобой, эпизоотия, нашествие
        вредителей. Производитель уведомляет Заготовителя в течение 5 дней
        с приложением справки Гидрометцентра или ТПП. В зависимости от масштаба
        ущерба стороны пересчитывают объём или переносят сроки сдачи."

        Ответ:
        {
          "force_majeure_status": "defined",
          "force_majeure_type": "agricultural_specific",
          "specific_events_status": "defined",
          "specific_events_details": "засуха, наводнение, заморозки, градобой, эпизоотия, нашествие вредителей",
          "notification_status": "defined",
          "notification_details": "в течение 5 дней",
          "proof_requirements_status": "defined",
          "proof_requirements_details": "справка Гидрометцентра или ТПП",
          "consequences_status": "defined",
          "consequences_details": "пересчёт объёма или перенос сроков",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Производитель освобождается от ответственности при наступлении обстоятельств непреодолимой силы, в том числе: засуха, наводнение, заморозки в вегетационный период, градобой, эпизоотия, нашествие вредителей."
            }
          ]
        }

        Пример 2 — только общая формулировка:
        Фрагмент:
        "Стороны освобождаются от ответственности при форс-мажоре."

        Ответ:
        {
          "force_majeure_status": "defined",
          "force_majeure_type": "general_only",
          "specific_events_status": "not_defined",
          "specific_events_details": "Данные не определены",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "proof_requirements_status": "not_defined",
          "proof_requirements_details": "Данные не определены",
          "consequences_status": "not_defined",
          "consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны освобождаются от ответственности при форс-мажоре."
            }
          ]
        }

        Пример 3 — оговорки нет:
        Фрагмент:
        "Стороны несут ответственность в полном объёме за нарушение договора."

        Ответ:
        {
          "force_majeure_status": "not_defined",
          "force_majeure_type": "not_defined",
          "specific_events_status": "not_defined",
          "specific_events_details": "Данные не определены",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "proof_requirements_status": "not_defined",
          "proof_requirements_details": "Данные не определены",
          "consequences_status": "not_defined",
          "consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слово "форс-мажор" или "непреодолимая сила"?
        2. Если есть — перечислены ли конкретные с/х события (засуха, эпизоотия и т.д.)?
        3. Указан ли срок уведомления конкретным числом?
        4. Требуется ли справка ТПП или Гидрометцентра?
        5. Указаны ли конкретные последствия (перенос сроков / пересчёт объёма)?
        6. Если только "форс-мажор" без деталей — force_majeure_type: general_only.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_type": "<agricultural_specific / general_only / not_defined>",
          "specific_events_status": "<defined / not_defined>",
          "specific_events_details": "<перечень или 'Данные не определены'>",
          "notification_status": "<defined / not_defined>",
          "notification_details": "<срок или 'Данные не определены'>",
          "proof_requirements_status": "<defined / not_defined>",
          "proof_requirements_details": "<документы или 'Данные не определены'>",
          "consequences_status": "<defined / not_defined>",
          "consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
