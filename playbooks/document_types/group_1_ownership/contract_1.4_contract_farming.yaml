        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о возврате несоответствующей продукции, её утилизации,
        распределении расходов и судьбе аванса.
        Анализируй только эту тему.
        Не анализируй приёмку, качество, цену или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. product_return_and_disposal_check_presence:
           Агрегатное signal-поле — наличие регулирования по возврату
           и утилизации продукции.
           - "present" — если хотя бы одно из содержательных полей
             (return_procedure_status, disposal_procedure_status,
              cost_allocation_status,
              advance_return_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. return_procedure_status:
           - "defined" — если прямо указан порядок возврата
             несоответствующей продукции;
           - "not_defined" — если не указан.

        2. return_procedure_details:
           Порядок возврата.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. disposal_procedure_status:
           - "defined" — если прямо указан порядок утилизации
             испорченной / опасной продукции;
           - "not_defined" — если не указан.

        4. disposal_procedure_details:
           Порядок утилизации.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. cost_allocation_status:
           - "defined" — если прямо указано, кто несёт расходы
             на возврат и утилизацию;
           - "not_defined" — если не указано.

        6. cost_allocation_details:
           Распределение расходов.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. advance_return_status:
           - "defined" — если прямо указана судьба аванса
             при возврате продукции;
           - "not_defined" — если не указана.

        8. advance_return_details:
           Условия возврата аванса при возврате продукции.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни product_return_and_disposal_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни возврата, ни утилизации,
           ни распределения расходов, ни судьбы аванса.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Только общая отсылка к закону.
           "Стороны действуют в соответствии с законодательством РФ."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.7 — расходы на производителе, в п.9 — на заготовителе.
           → presence = "unclear";
             cost_allocation_status = "not_defined";
             cost_allocation_details = "Не удалось определить".

        4. Полное раскрытие.
           "Возврат несоответствующей продукции производителю.
           Утилизация испорченной продукции силами производителя.
           Расходы — на производителе. Аванс возвращается в течение 10 дней."
           → presence = "present";
             return_procedure_status = "defined";
             disposal_procedure_status = "defined";
             cost_allocation_status = "defined";
             advance_return_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для product_return_and_disposal_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "product_return_and_disposal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по возврату и утилизации. Внутреннее агрегатное signal-поле."
