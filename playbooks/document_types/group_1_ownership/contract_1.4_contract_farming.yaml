compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_authority_cluster
    name: "Стороны контрактации: идентификация, реквизиты и полномочия"
    description: >
      Фактографическая проверка наличия в договоре данных о производителе
      и заготовителе — реквизиты, тип производителя (КФХ/ИП/юрлицо),
      подписанты и документы, подтверждающие полномочия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "производитель"
        - "заготовитель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "КФХ"
        - "крестьянское фермерское хозяйство"
        - "глава КФХ"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(производитель|заготовитель).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 432, 535 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, их реквизиты и
        полномочия подписантов.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Производитель (наименование, реквизиты).
        2. Кто указан как Заготовитель (наименование, реквизиты).
        3. Тип производителя (КФХ / ИП / юридическое лицо / физическое лицо).
        4. Кто подписывает договор от каждой стороны.
        5. На каком основании действует подписант от каждой стороны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "not_defined" или строго
           "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель: Глава КФХ Иванов П.П., ОГРНИП 312770000000001,
        ИНН 770000000001. Заготовитель: ООО «Агро», ИНН 7700000002,
        ОГРН 1027700000002, в лице Генерального директора Петрова С.С.,
        действующего на основании Устава."

        Ответ:
        {
          "producer_details_status": "defined",
          "producer_details_value": "Глава КФХ Иванов П.П., ОГРНИП 312770000000001, ИНН 770000000001",
          "producer_type": "kfh",
          "producer_signatory": "Иванов П.П.",
          "producer_signatory_basis": "kfh_head",
          "purchaser_details_status": "defined",
          "purchaser_details_value": "ООО «Агро», ИНН 7700000002, ОГРН 1027700000002",
          "purchaser_signatory": "Генеральный директор Петров С.С.",
          "purchaser_signatory_basis": "charter",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Производитель: Глава КФХ Иванов П.П., ОГРНИП 312770000000001, ИНН 770000000001."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между производителем и заготовителем."

        Ответ:
        {
          "producer_details_status": "not_defined",
          "producer_details_value": "Данные не определены",
          "producer_type": "not_defined",
          "producer_signatory": "Данные не определены",
          "producer_signatory_basis": "not_defined",
          "purchaser_details_status": "not_defined",
          "purchaser_details_value": "Данные не определены",
          "purchaser_signatory": "Данные не определены",
          "purchaser_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата с наименованием и ИНН/ОГРН/ОГРНИП производителя?
        2. Есть ли прямая цитата с наименованием и ИНН/ОГРН заготовителя?
        3. Указан ли конкретный тип производителя (КФХ / ИП / юрлицо)?
        4. Указан ли конкретный подписант и документ-основание?
        5. Если прямого текста нет — "not_defined" и "Данные не определены".
        6. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "producer_details_status": "<defined / not_defined>",
          "producer_details_value": "<реквизиты или 'Данные не определены'>",
          "producer_type": "<legal_entity / individual_entrepreneur / kfh / individual / not_defined>",
          "producer_signatory": "<ФИО или 'Данные не определены'>",
          "producer_signatory_basis": "<charter / poa / order / kfh_head / other / not_defined>",
          "purchaser_details_status": "<defined / not_defined>",
          "purchaser_details_value": "<реквизиты или 'Данные не определены'>",
          "purchaser_signatory": "<ФИО или 'Данные не определены'>",
          "purchaser_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "производитель заготовитель стороны договора контрактации КФХ крестьянское фермерское хозяйство глава КФХ ИНН ОГРН ОГРНИП в лице действующего на основании устава доверенности реквизиты подписант"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "предмет договора"
        - "наименование продукции"
        - "количество"
        - "цена"
        - "срок сдачи"
        - "качество"
        - "гарантия"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "parties_authority_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки данные о сторонах договора контрактации и полномочиях их подписантов.
        Особое внимание удели типу производителя (КФХ, ИП, ЮЛ).
        </role>

        <context>
        {context}
        </context>

        <task>
        0. parties_authority_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по сторонам
           и полномочиям подписантов.
           - "present" — если хотя бы одно из содержательных полей
             (producer_details_status, producer_type,
              producer_signatory_basis, purchaser_details_status,
              purchaser_signatory_basis) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - producer_details_status = "not_defined";
           - producer_type = "not_defined";
           - producer_signatory_basis = "not_defined";
           - purchaser_details_status = "not_defined";
           - purchaser_signatory_basis = "not_defined";
           - producer_details_value, producer_signatory = "Данные не определены";
           - purchaser_details_value, purchaser_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. producer_details_status:
           - "defined" — если прямо указаны наименование и реквизиты
             Производителя (ИНН и/или ОГРН/ОГРНИП);
           - "not_defined" — если данные не указаны или недостаточны.

        2. producer_details_value:
           Наименование и реквизиты производителя.
           Правила:
           - пиши кратко, как в документе;
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. producer_type:
           - "kfh" — если прямо указано КФХ или крестьянское (фермерское) хозяйство;
           - "individual_entrepreneur" — если прямо указан ИП;
           - "legal_entity" — если прямо указано ООО, АО, ПАО или иное юридическое лицо;
           - "individual" — если прямо указано физическое лицо без ИП или КФХ;
           - "not_defined" — если тип производителя прямо не указан.

        4. producer_signatory:
           ФИО и должность подписанта производителя.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. producer_signatory_basis:
           - "charter" — если прямо указано "на основании устава";
           - "poa" — если прямо указано "по доверенности" или "на основании доверенности";
           - "order" — если прямо указано "на основании приказа";
           - "kfh_head" — если подписантом является глава КФХ, действующий без иного основания;
           - "other" — если прямо указано иное основание;
           - "not_defined" — если основание прямо не указано.

        6. purchaser_details_status:
           - "defined" — если прямо указаны наименование и реквизиты
             Заготовителя (ИНН и/или ОГРН);
           - "not_defined" — если данные не указаны или недостаточны.

        7. purchaser_details_value:
           Наименование и реквизиты заготовителя.
           Правила:
           - пиши кратко, как в документе;
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. purchaser_signatory:
           ФИО и должность подписанта заготовителя.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. purchaser_signatory_basis:
           - "charter" / "poa" / "order" / "other" / "not_defined"
             по тем же правилам, что для производителя.
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_authority_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_value / *_signatory = "Данные не определены".
        - Используй только текст договора.
        - Для producer_type используй только:
          "kfh", "individual_entrepreneur", "legal_entity", "individual", "not_defined".
        - Для producer_signatory_basis используй только:
          "charter", "poa", "order", "kfh_head", "other", "not_defined".
        - Для purchaser_signatory_basis используй только:
          "charter", "poa", "order", "other", "not_defined".
        - Не смешивай сведения о производителе и заготовителе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сторон, ни реквизитов, ни подписантов.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Общая фраза без конкретики.
           "Настоящий договор заключён между производителем и заготовителем."
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле — один тип производителя, в реквизитах — другой.
           → presence = "unclear";
             producer_type = "not_defined";
             producer_details_value = "Не удалось определить".

        4. Стороны указаны, но без полномочий.
           "Производитель: Глава КФХ Иванов П.П., ОГРНИП...; Заготовитель: ООО «Агро», ИНН..., ОГРН..."
           → presence = "present";
             producer_details_status = "defined";
             producer_type = "kfh";
             purchaser_details_status = "defined";
             producer_signatory_basis = purchaser_signatory_basis = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_authority_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для *_details_status используй только: "defined" или "not_defined".
        - Для producer_type используй только:
          "legal_entity", "individual_entrepreneur", "kfh", "individual", "not_defined".
        - Для producer_signatory_basis используй только:
          "charter", "poa", "order", "kfh_head", "other", "not_defined".
        - Для purchaser_signatory_basis используй только:
          "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value / *_signatory → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_signatory → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_authority_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сторонам и полномочиям. Внутреннее агрегатное signal-поле."
          required: true
        - name: "producer_details_status"
          type: "string"
