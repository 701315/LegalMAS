      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия форс-мажорной оговорки с учётом специфики сельскохозяйственного
        производства: перечень с/х рисков, порядок уведомления, требуемые
