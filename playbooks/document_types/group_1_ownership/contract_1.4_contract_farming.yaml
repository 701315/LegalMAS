  - id: liability_termination_cluster
    name: "Ответственность сторон и расторжение договора"
    description: >
      Фактографическая проверка наличия условий об ответственности производителя
      (виновная, ст. 538 ГК), неустоек, оснований расторжения и возврата аванса.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность производителя"
        - "при наличии вины"
        - "виновное неисполнение"
        - "освобождается от ответственности"
        - "независимо от вины"
        - "безусловная ответственность"
        - "неустойка за недопоставку"
        - "пеня за просрочку сдачи"
        - "штраф за нарушение сроков"
        - "отказ от приёмки"
        - "необоснованный отказ"
        - "уклонение от приёмки"
        - "неустойка за отказ"
        - "просрочка оплаты"
        - "неустойка за просрочку оплаты"
        - "проценты за пользование"
        - "ст. 395"
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "возврат аванса"
        - "существенное нарушение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)производитель.*несёт.*ответственность.*при.*наличии.*вин"
        - "(?i)производитель.*освобождается.*от.*ответственности"
        - "(?i)независимо\\s+от\\s+вин(ы|ы\\s+производител)"
        - "(?i)неустойк.*за.*недопоставк"
        - "(?i)пен[яиьюей].*за.*просрочк"
        - "(?i)\\b\\d+[,.]?\\d*\\s*%\\s*(от|за|в\\s+день)"
        - "(?i)отказ.*от.*приёмк"
        - "(?i)уклонен.*от.*приёмк"
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)просрочк(а|и|у)\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 330, 395, 450, 523, 538 ГК РФ).
        Проверяется только один вопрос: ответственность сторон, неустойки,
        основания и порядок расторжения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Характер ответственности производителя (виновная / безвиновная).
        2. Неустойку за недопоставку / просрочку сдачи производителем.
        3. Ответственность заготовителя за отказ от приёмки.
        4. Неустойку за просрочку оплаты заготовителем.
        5. Основания расторжения для каждой стороны.
        6. Условие о возврате аванса при расторжении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. ВАЖНО: если в договоре написано "независимо от вины производителя" —
           это нарушение ст. 538 ГК РФ. Зафиксируй в violation_of_art_538.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель несёт ответственность за неисполнение договора только
        при наличии его вины. За просрочку сдачи — пеня 0,1% от стоимости
        непоставленного товара за каждый день просрочки. За отказ заготовителя
        от приёмки надлежащей продукции — неустойка 5% от стоимости отклонённой
        партии. Договор может быть расторгнут в одностороннем порядке при
        существенном нарушении. Аванс возвращается в течение 10 дней
        при расторжении по вине заготовителя."

        Ответ:
        {
          "producer_liability_type_status": "defined",
          "producer_liability_type_code": "fault_based",
          "violation_of_art_538": "no",
          "producer_delivery_penalty_status": "defined",
          "producer_delivery_penalty_details": "0,1% от стоимости непоставленного товара за каждый день",
          "purchaser_non_acceptance_penalty_status": "defined",
          "purchaser_non_acceptance_penalty_details": "5% от стоимости отклонённой партии",
          "purchaser_late_payment_penalty_status": "not_defined",
          "purchaser_late_payment_penalty_details": "Данные не определены",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "существенное нарушение в одностороннем порядке",
          "advance_return_on_termination_status": "defined",
          "advance_return_on_termination_details": "в течение 10 дней при расторжении по вине заготовителя",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Производитель несёт ответственность за неисполнение договора только при наличии его вины."
            }
          ]
        }

        Пример 2 — нарушение ст. 538:
        Фрагмент:
        "Производитель несёт ответственность независимо от наличия вины."

        Ответ:
        {
          "producer_liability_type_status": "defined",
          "producer_liability_type_code": "strict_liability",
          "violation_of_art_538": "yes",
          "producer_delivery_penalty_status": "not_defined",
          "producer_delivery_penalty_details": "Данные не определены",
          "purchaser_non_acceptance_penalty_status": "not_defined",
          "purchaser_non_acceptance_penalty_details": "Данные не определены",
          "purchaser_late_payment_penalty_status": "not_defined",
          "purchaser_late_payment_penalty_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "advance_return_on_termination_status": "not_defined",
          "advance_return_on_termination_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Производитель несёт ответственность независимо от наличия вины."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли фраза "при наличии вины" применительно к производителю?
        2. Есть ли фраза "независимо от вины" — это нарушение ст. 538 ГК!
        3. Указана ли конкретная ставка неустойки (%) с базой?
        4. Указано ли основание ответственности заготовителя за отказ от приёмки?
        5. Указан ли срок и порядок возврата аванса при расторжении?
        6. Перечислены ли конкретные основания расторжения?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "producer_liability_type_status": "<defined / not_defined>",
          "producer_liability_type_code": "<fault_based / strict_liability / not_defined>",
          "violation_of_art_538": "<yes / no>",
          "producer_delivery_penalty_status": "<defined / not_defined>",
          "producer_delivery_penalty_details": "<ставка и база или 'Данные не определены'>",
          "purchaser_non_acceptance_penalty_status": "<defined / not_defined>",
          "purchaser_non_acceptance_penalty_details": "<текст или 'Данные не определены'>",
          "purchaser_late_payment_penalty_status": "<defined / not_defined>",
          "purchaser_late_payment_penalty_details": "<ставка или 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<основания или 'Данные не определены'>",
          "advance_return_on_termination_status": "<defined / not_defined>",
          "advance_return_on_termination_details": "<условия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность производителя при наличии вины виновное неисполнение освобождается от ответственности независимо от вины безусловная ответственность неустойка за недопоставку пеня за просрочку сдачи штраф за нарушение сроков отказ от приёмки необоснованный отказ уклонение от приёмки неустойка за отказ просрочка оплаты ст. 395 ключевая ставка расторжение отказ от договора возврат аванса существенное нарушение ст. 538"
      preferred_unit_types:
        - liability_provision
        - termination_provision
        - indemnification
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
