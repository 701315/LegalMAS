  - id: notices_and_edo_check
    name: "Порядок уведомлений и электронный документооборот"
    description: >
      Фактографическая проверка наличия условий о юридически значимых
      сообщениях, реквизитах для уведомлений, признании электронных
      документов и соглашения об ЭДО.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "юридически значимое сообщение"
        - "адрес для уведомлений"
        - "адрес электронной почты"
        - "электронный документооборот"
        - "ЭДО"
        - "электронная подпись"
        - "электронная цифровая подпись"
        - "ЭЦП"
        - "квалифицированная электронная подпись"
        - "оператор ЭДО"
        - "Диадок"
        - "СБИС"
        - "признание юридической силы"
