        - name: "payment_deadline_details"
          type: "string"
          description: "Срок оплаты. Если нет — строго 'Данные не определены'."
        - name: "advance_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условие об авансировании прямо определено. Иначе 'not_defined'."
        - name: "advance_details"
          type: "string"
          description: "Условия аванса. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Сдача, приёмка, транспорт и тара
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_acceptance_cluster
    name: "Сдача, приёмка, место, транспорт и тара"
    description: >
      Фактографическая проверка наличия условий о сроке и графике сдачи продукции,
      месте приёмки, обязанности заготовителя принять продукцию, транспорте и таре.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок сдачи"
        - "срок поставки"
        - "период сдачи"
        - "не позднее"
        - "в течение"
        - "график сдачи"
        - "график поставки"
        - "по мере созревания"
        - "уборочная кампания"
        - "сезон сбора"
        - "приёмка продукции"
        - "порядок приёмки"
        - "место приёмки"
        - "пункт приёмки"
        - "акт приёмки"
        - "весовая"
        - "лаборатория"
        - "отбор проб"
        - "ТТН"
        - "транспортировка"
        - "перевозка"
        - "доставка"
        - "самовывоз"
        - "тара"
        - "упаковка"
        - "обязан принять продукцию"
        - "не вправе отказаться от приемки"
        - "обеспечить тарой"
        - "обеспечить транспортом"
        - "вывоз продукции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение|до)\\s+\\d+"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)график\\s+(сдач|поставк)"
        - "(?i)порядок\\s+приёмк"
        - "(?i)акт\\s+приёмк"
        - "(?i)заготовитель.*обязан.*принять"
        - "(?i)(транспортировк|перевозк|доставк)"
        - "(?i)(тар[аеуой]|упаковк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 536, 508, 517 ГК РФ).
        Проверяется только один вопрос: условия сдачи и приёмки продукции,
        место, транспортировка и тара.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок сдачи продукции (конкретная дата или период).
        2. Наличие графика сдачи по периодам (для сезонных контрактов).
        3. Место приёмки (у производителя / на элеваторе / на складе заготовителя).
        4. Обязанность заготовителя принять продукцию.
        5. Кто обеспечивает тару и упаковку.
        6. Кто обеспечивает транспорт для вывоза.
        7. Документы при приёмке (ТТН, акт приёмки).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель сдаёт продукцию не позднее 31 октября 2026 г.
        Заготовитель обязан принять продукцию по месту нахождения производителя,
        обеспечить тару и транспортировку собственными силами.
        Приёмка оформляется товарно-транспортной накладной."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "не позднее 31 октября 2026 г.",
          "delivery_schedule_status": "not_defined",
          "delivery_schedule_details": "Данные не определены",
          "acceptance_place_status": "defined",
          "acceptance_place": "producer_location",
          "acceptance_place_details": "по месту нахождения производителя",
          "acceptance_obligation_status": "defined",
          "acceptance_obligation_details": "заготовитель обязан принять продукцию",
          "packaging_provision_status": "defined",
          "packaging_provision": "purchaser",
          "transport_provision_status": "defined",
          "transport_provision": "purchaser",
          "acceptance_documents_status": "defined",
          "acceptance_documents_details": "товарно-транспортная накладная",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заготовитель обязан принять продукцию по месту нахождения производителя, обеспечить тару и транспортировку собственными силами."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Производитель передаёт продукцию заготовителю."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Данные не определены",
          "delivery_schedule_status": "not_defined",
          "delivery_schedule_details": "Данные не определены",
          "acceptance_place_status": "not_defined",
          "acceptance_place": "not_defined",
          "acceptance_place_details": "Данные не определены",
          "acceptance_obligation_status": "not_defined",
          "acceptance_obligation_details": "Данные не определены",
          "packaging_provision_status": "not_defined",
          "packaging_provision": "not_defined",
          "transport_provision_status": "not_defined",
          "transport_provision": "not_defined",
          "acceptance_documents_status": "not_defined",
          "acceptance_documents_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок сдачи (дата или период)?
        2. Есть ли график сдачи по частям (для периодических поставок)?
        3. Указано ли место приёмки конкретно?
        4. Прямо ли написана обязанность заготовителя принять продукцию?
        5. Кто обеспечивает тару — прямо ли указано?
        6. Кто обеспечивает транспорт — прямо ли указано?
        7. Какой документ оформляется при приёмке?
        8. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delivery_term_status": "<defined / not_defined>",
          "delivery_term_details": "<срок или 'Данные не определены'>",
          "delivery_schedule_status": "<defined / not_defined>",
          "delivery_schedule_details": "<описание графика или 'Данные не определены'>",
          "acceptance_place_status": "<defined / not_defined>",
          "acceptance_place": "<producer_location / purchaser_warehouse / elevator / other / not_defined>",
          "acceptance_place_details": "<текст или 'Данные не определены'>",
          "acceptance_obligation_status": "<defined / not_defined>",
          "acceptance_obligation_details": "<текст или 'Данные не определены'>",
          "packaging_provision_status": "<defined / not_defined>",
          "packaging_provision": "<purchaser / producer / not_defined>",
          "transport_provision_status": "<defined / not_defined>",
          "transport_provision": "<purchaser / producer / shared / not_defined>",
          "acceptance_documents_status": "<defined / not_defined>",
          "acceptance_documents_details": "<документы или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "срок сдачи"
        - "график поставки"
        - "приёмка продукции"
        - "место приёмки"
        - "заготовитель обязан принять"
        - "обеспечить тарой"
        - "вывоз продукции"
        - "акт приёмки"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "delivery_term_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок сдачи прямо определён. Иначе 'not_defined'."
        - name: "delivery_term_details"
          type: "string"
          description: "Срок сдачи. Если нет — строго 'Данные не определены'."
        - name: "delivery_schedule_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если график сдачи прямо определён. Иначе 'not_defined'."
        - name: "delivery_schedule_details"
          type: "string"
          description: "Описание графика. Если нет — строго 'Данные не определены'."
        - name: "acceptance_place_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если место приёмки прямо определено. Иначе 'not_defined'."
        - name: "acceptance_place"
          type: "string"
          allowed_values: ["producer_location", "purchaser_warehouse", "elevator", "other", "not_defined"]
          description: "Место приёмки."
        - name: "acceptance_obligation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если обязанность заготовителя принять продукцию прямо определена. Иначе 'not_defined'."
        - name: "packaging_provision_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ответственный за тару прямо определён. Иначе 'not_defined'."
        - name: "packaging_provision"
          type: "string"
          allowed_values: ["purchaser", "producer", "not_defined"]
          description: "Кто обеспечивает тару."
        - name: "transport_provision_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ответственный за транспорт прямо определён. Иначе 'not_defined'."
        - name: "transport_provision"
          type: "string"
          allowed_values: ["purchaser", "producer", "shared", "not_defined"]
          description: "Кто обеспечивает транспорт."
        - name: "acceptance_documents_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если документы при приёмке прямо определены. Иначе 'not_defined'."
        - name: "acceptance_documents_details"
          type: "string"
          description: "Документы при приёмке. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Качество, безопасность, ветдоки/фитосан, претензии
  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_safety_claims_cluster
    name: "Качество, безопасность, ветеринария/фитосанитария и претензии"
    description: >
      Фактографическая проверка наличия требований к качеству продукции,
      ссылок на стандарты, ветеринарных/фитосанитарных документов,
      порядка приёмки по качеству и претензионного механизма.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество продукции"
        - "требования к качеству"
        - "стандарты качества"
        - "соответствие ГОСТ"
        - "технические условия"
        - "параметры качества"
        - "сертификат качества"
        - "декларация соответствия"
        - "лабораторный анализ"
        - "влажность"
        - "сорность"
        - "жирность"
        - "кислотность"
        - "пестициды"
        - "ПДК"
        - "безопасность продукции"
        - "ТР ТС"
        - "ветеринарный сертификат"
        - "ВСД"
        - "Меркурий"
        - "фитосанитарный сертификат"
        - "Россельхознадзор"
        - "экспертиза качества"
        - "рекламация"
        - "арбитражный образец"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
        - "(?i)продукция.*должна.*соответствовать"
        - "(?i)ТР\\s+ТС"
        - "(?i)\\bПДК\\b"
        - "(?i)пестицид|гербицид|нитрат"
        - "(?i)ветеринарн(ый|ое|ого)\\s+(сертификат|свидетельств)"
        - "(?i)фитосанитарн(ый|ого)\\s+сертификат"
        - "(?i)экспертиз(а|у|ы)\\s+качеств"
        - "(?i)рекламац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 469-475, 536 ГК РФ).
        Проверяется только один вопрос: требования к качеству продукции,
        документы о безопасности, ветеринарные и фитосанитарные документы,
        механизм разрешения споров о качестве.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Стандарт качества (ГОСТ/ТУ или иной).
        2. Конкретные параметры качества (влажность, сорность, жирность и т.д.).
        3. Ссылку на технические регламенты (ТР ТС).
        4. Требование ветеринарных документов (ВСД через ФГИС «Меркурий»).
        5. Требование фитосанитарных документов.
        6. Порядок определения качества при приёмке (лаборатория, отбор проб).
        7. Срок предъявления претензий по качеству.
        8. Механизм разрешения споров о качестве (экспертиза, арбитражный образец).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Зерно должно соответствовать ГОСТ 9353-2016. Влажность — не более 14%,
        сорность — не более 2%. Декларация соответствия ТР ТС 015/2011
        предоставляется с каждой партией. Претензии по качеству предъявляются
        в течение 5 рабочих дней с момента приёмки. При разногласиях — независимая
        экспертиза аккредитованной лаборатории, расходы — на проигравшую сторону."

        Ответ:
        {
          "quality_standard_status": "defined",
          "quality_standard_details": "ГОСТ 9353-2016",
          "quality_parameters_status": "defined",
          "quality_parameters_details": "влажность не более 14%, сорность не более 2%",
          "tr_ts_status": "defined",
          "tr_ts_details": "ТР ТС 015/2011",
          "veterinary_docs_status": "not_defined",
          "phytosanitary_docs_status": "not_defined",
          "quality_check_procedure_status": "not_defined",
          "quality_check_procedure_details": "Данные не определены",
          "claims_period_status": "defined",
          "claims_period_details": "5 рабочих дней с момента приёмки",
          "dispute_mechanism_status": "defined",
          "dispute_mechanism_details": "независимая экспертиза аккредитованной лаборатории",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Зерно должно соответствовать ГОСТ 9353-2016. Влажность — не более 14%, сорность — не более 2%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продукция должна быть надлежащего качества."

        Ответ:
        {
          "quality_standard_status": "not_defined",
          "quality_standard_details": "Данные не определены",
          "quality_parameters_status": "not_defined",
          "quality_parameters_details": "Данные не определены",
          "tr_ts_status": "not_defined",
          "tr_ts_details": "Данные не определены",
          "veterinary_docs_status": "not_defined",
          "phytosanitary_docs_status": "not_defined",
          "quality_check_procedure_status": "not_defined",
          "quality_check_procedure_details": "Данные не определены",
          "claims_period_status": "not_defined",
          "claims_period_details": "Данные не определены",
          "dispute_mechanism_status": "not_defined",
          "dispute_mechanism_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли ссылка на конкретный ГОСТ/ТУ (не просто "качество")?
        2. Перечислены ли конкретные параметры числами?
        3. Упомянуты ли конкретные ТР ТС?
        4. Требуются ли ВСД / Меркурий?
        5. Требуется ли фитосанитарный сертификат?
        6. Описан ли порядок отбора проб или лабораторного контроля?
        7. Указан ли конкретный срок претензий по качеству?
        8. Описан ли механизм спора (экспертиза, арбитражный образец)?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quality_standard_status": "<defined / not_defined>",
          "quality_standard_details": "<ГОСТ/ТУ или 'Данные не определены'>",
          "quality_parameters_status": "<defined / not_defined>",
          "quality_parameters_details": "<параметры или 'Данные не определены'>",
          "tr_ts_status": "<defined / not_defined>",
          "tr_ts_details": "<ТР ТС или 'Данные не определены'>",
          "veterinary_docs_status": "<defined / not_defined>",
          "phytosanitary_docs_status": "<defined / not_defined>",
          "quality_check_procedure_status": "<defined / not_defined>",
          "quality_check_procedure_details": "<текст или 'Данные не определены'>",
          "claims_period_status": "<defined / not_defined>",
          "claims_period_details": "<срок или 'Данные не определены'>",
          "dispute_mechanism_status": "<defined / not_defined>",
          "dispute_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "качество"
        - "ГОСТ"
        - "стандарт"
        - "параметры"
        - "ТР ТС"
        - "ветеринарный сертификат"
        - "фитосанитарный сертификат"
        - "рекламация"
        - "экспертиза качества"
        - "отбор проб"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "quality_standard_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если стандарт качества (ГОСТ/ТУ) прямо определён. Иначе 'not_defined'."
        - name: "quality_standard_details"
          type: "string"
          description: "Стандарт качества. Если нет — строго 'Данные не определены'."
        - name: "quality_parameters_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если конкретные параметры прямо определены. Иначе 'not_defined'."
        - name: "quality_parameters_details"
          type: "string"
          description: "Параметры качества. Если нет — строго 'Данные не определены'."
        - name: "tr_ts_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ТР ТС прямо указан. Иначе 'not_defined'."
        - name: "veterinary_docs_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если требование ветдокументов прямо определено. Иначе 'not_defined'."
        - name: "phytosanitary_docs_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если требование фитосанитарных документов прямо определено. Иначе 'not_defined'."
        - name: "claims_period_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок претензий по качеству прямо определён. Иначе 'not_defined'."
        - name: "claims_period_details"
          type: "string"
          description: "Срок претензий. Если нет — строго 'Данные не определены'."
        - name: "dispute_mechanism_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если механизм разрешения споров о качестве прямо определён. Иначе 'not_defined'."
        - name: "dispute_mechanism_details"
          type: "string"
          description: "Механизм спора. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Переход риска и хранение
  # ──────────────────────────────────────────────────────────────────────────
  - id: risk_title_storage_cluster
    name: "Переход риска гибели продукции и условия хранения"
    description: >
      Фактографическая проверка наличия условий о моменте перехода риска
      случайной гибели/повреждения продукции и условиях хранения до передачи.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск гибели"
        - "риск повреждения"
        - "случайная гибель"
        - "риск порчи"
        - "несёт риск"
        - "момент перехода риска"
        - "условия хранения"
        - "температурный режим"
        - "склад"
        - "элеватор"
        - "зернохранилище"
        - "холодильник"
        - "ответственное хранение"
        - "порча при хранении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+(гибел|поврежден|порч|случайн)"
        - "(?i)переход\\s+риск"
        - "(?i)условия\\s+хранен"
        - "(?i)температурн(ый|ого)\\s+режим"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 459, 514, 538 ГК РФ).
        Проверяется только один вопрос: момент перехода риска гибели продукции
        и условия её хранения до передачи заготовителю.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент перехода риска случайной гибели/повреждения продукции.
        2. Кто несёт риск до момента передачи.
        3. Условия хранения продукции до вывоза заготовителем.
        4. Порядок действий при частичной гибели продукции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Риск случайной гибели продукции переходит к Заготовителю с момента
        подписания акта приёмки. До этого момента риск несёт Производитель.
        Производитель обязан хранить продукцию при температуре от +2 до +8 °C
        до момента вывоза Заготовителем. При частичной гибели урожая объём
        поставки пересчитывается пропорционально фактическому сбору."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_act",
          "risk_transfer_details": "с момента подписания акта приёмки",
          "risk_bearer_before_transfer_status": "defined",
          "risk_bearer_before_transfer": "producer",
          "storage_conditions_status": "defined",
          "storage_conditions_details": "температура от +2 до +8 °C",
          "partial_loss_procedure_status": "defined",
          "partial_loss_procedure_details": "объём пересчитывается пропорционально фактическому сбору",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Риск случайной гибели продукции переходит к Заготовителю с момента подписания акта приёмки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продукция хранится на ферме производителя до вывоза."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "risk_bearer_before_transfer_status": "not_defined",
          "risk_bearer_before_transfer": "not_defined",
          "storage_conditions_status": "not_defined",
          "storage_conditions_details": "Данные не определены",
          "partial_loss_procedure_status": "not_defined",
          "partial_loss_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о переходе риска к конкретному событию?
        2. Указано ли прямо, кто несёт риск до передачи?
        3. Есть ли конкретные условия хранения (температура, тип хранилища)?
        4. Есть ли порядок пересчёта при частичной гибели?
        5. Не выводи момент перехода риска из общих условий — только из прямой цитаты.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_act / upon_weighing / upon_shipping / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "risk_bearer_before_transfer_status": "<defined / not_defined>",
          "risk_bearer_before_transfer": "<producer / purchaser / not_defined>",
          "storage_conditions_status": "<defined / not_defined>",
          "storage_conditions_details": "<требования или 'Данные не определены'>",
          "partial_loss_procedure_status": "<defined / not_defined>",
          "partial_loss_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "риск гибели"
        - "переход риска"
        - "случайная гибель"
        - "условия хранения"
        - "ответственное хранение"
        - "элеватор"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "risk_transfer_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если момент перехода риска прямо определён. Иначе 'not_defined'."
        - name: "risk_transfer_moment"
          type: "string"
          allowed_values: ["upon_act", "upon_weighing", "upon_shipping", "custom", "not_defined"]
          description: "Момент перехода риска."
        - name: "risk_transfer_details"
          type: "string"
          description: "Формулировка о переходе риска. Если нет — строго 'Данные не определены'."
        - name: "risk_bearer_before_transfer_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если кто несёт риск до передачи прямо определено. Иначе 'not_defined'."
        - name: "risk_bearer_before_transfer"
          type: "string"
          allowed_values: ["producer", "purchaser", "not_defined"]
          description: "Кто несёт риск до передачи."
        - name: "storage_conditions_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если условия хранения прямо определены. Иначе 'not_defined'."
        - name: "storage_conditions_details"
          type: "string"
          description: "Условия хранения. Если нет — строго 'Данные не определены'."
        - name: "partial_loss_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок при частичной гибели прямо определён. Иначе 'not_defined'."
        - name: "partial_loss_procedure_details"
          type: "string"
          description: "Порядок при частичной гибели. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Ответственность и расторжение
  # ──────────────────────────────────────────────────────────────────────────
  - id: liability_termination_cluster
    name: "Ответственность сторон и расторжение договора"
    description: >
      Фактографическая проверка наличия условий об ответственности производителя
      (виновная, ст. 538 ГК), неустоек, оснований расторжения и возврата аванса.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность производителя"
        - "при наличии вины"
        - "виновное неисполнение"
        - "освобождается от ответственности"
        - "независимо от вины"
        - "безусловная ответственность"
        - "неустойка за недопоставку"
        - "пеня за просрочку сдачи"
        - "штраф за нарушение сроков"
        - "отказ от приёмки"
        - "необоснованный отказ"
        - "уклонение от приёмки"
        - "неустойка за отказ"
        - "просрочка оплаты"
        - "неустойка за просрочку оплаты"
        - "проценты за пользование"
        - "ст. 395"
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "возврат аванса"
        - "существенное нарушение"
      keyword_mode: "any"
      negative_keywords:
        - "независимо от вины производителя"
        - "вне зависимости от вины"
        - "безусловная ответственность производителя"
      regex_patterns:
        - "(?i)производитель.*несёт.*ответственность.*при.*наличии.*вин"
        - "(?i)производитель.*освобождается.*от.*ответственности"
        - "(?i)независимо\\s+от\\s+вин(ы|ы\\s+производител)"
        - "(?i)неустойк.*за.*недопоставк"
        - "(?i)пен[яиьюей].*за.*просрочк"
        - "(?i)\\b\\d+[,.]?\\d*\\s*%\\s*(от|за|в\\s+день)"
        - "(?i)отказ.*от.*приёмк"
        - "(?i)уклонен.*от.*приёмк"
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)просрочк(а|и|у)\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 330, 395, 450, 523, 538 ГК РФ).
        Проверяется только один вопрос: ответственность сторон, неустойки,
        основания и порядок расторжения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Характер ответственности производителя (виновная / безвиновная).
        2. Неустойку за недопоставку / просрочку сдачи производителем.
        3. Ответственность заготовителя за отказ от приёмки.
        4. Неустойку за просрочку оплаты заготовителем.
        5. Основания расторжения для каждой стороны.
        6. Условие о возврате аванса при расторжении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. ВАЖНО: если в договоре написано "независимо от вины производителя" —
           это нарушение ст. 538 ГК РФ. Зафиксируй в violation_of_art_538.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель несёт ответственность за неисполнение договора только
        при наличии его вины. За просрочку сдачи — пеня 0,1% от стоимости
        непоставленного товара за каждый день просрочки. За отказ заготовителя
        от приёмки надлежащей продукции — неустойка 5% от стоимости отклонённой
        партии. Договор может быть расторгнут в одностороннем порядке при
        существенном нарушении. Аванс возвращается в течение 10 дней
        при расторжении по вине заготовителя."

        Ответ:
        {
          "producer_liability_type_status": "defined",
          "producer_liability_type": "fault_based",
          "violation_of_art_538": "no",
          "producer_delivery_penalty_status": "defined",
          "producer_delivery_penalty_details": "0,1% от стоимости непоставленного товара за каждый день",
          "purchaser_non_acceptance_penalty_status": "defined",
          "purchaser_non_acceptance_penalty_details": "5% от стоимости отклонённой партии",
          "purchaser_late_payment_penalty_status": "not_defined",
          "purchaser_late_payment_penalty_details": "Данные не определены",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "существенное нарушение в одностороннем порядке",
          "advance_return_on_termination_status": "defined",
          "advance_return_on_termination_details": "в течение 10 дней при расторжении по вине заготовителя",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Производитель несёт ответственность за неисполнение договора только при наличии его вины."
            }
          ]
        }

        Пример 2 — нарушение ст. 538:
        Фрагмент:
        "Производитель несёт ответственность независимо от наличия вины."

        Ответ:
        {
          "producer_liability_type_status": "defined",
          "producer_liability_type": "strict_liability",
          "violation_of_art_538": "yes",
          "producer_delivery_penalty_status": "not_defined",
          "producer_delivery_penalty_details": "Данные не определены",
          "purchaser_non_acceptance_penalty_status": "not_defined",
          "purchaser_non_acceptance_penalty_details": "Данные не определены",
          "purchaser_late_payment_penalty_status": "not_defined",
          "purchaser_late_payment_penalty_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "advance_return_on_termination_status": "not_defined",
          "advance_return_on_termination_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Производитель несёт ответственность независимо от наличия вины."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли фраза "при наличии вины" применительно к производителю?
        2. Есть ли фраза "независимо от вины" — это нарушение ст. 538 ГК!
        3. Указана ли конкретная ставка неустойки (%) с базой?
        4. Указано ли основание ответственности заготовителя за отказ от приёмки?
        5. Указан ли срок и порядок возврата аванса при расторжении?
        6. Перечислены ли конкретные основания расторжения?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "producer_liability_type_status": "<defined / not_defined>",
          "producer_liability_type": "<fault_based / strict_liability / not_defined>",
          "violation_of_art_538": "<yes / no>",
          "producer_delivery_penalty_status": "<defined / not_defined>",
          "producer_delivery_penalty_details": "<ставка и база или 'Данные не определены'>",
          "purchaser_non_acceptance_penalty_status": "<defined / not_defined>",
          "purchaser_non_acceptance_penalty_details": "<текст или 'Данные не определены'>",
          "purchaser_late_payment_penalty_status": "<defined / not_defined>",
          "purchaser_late_payment_penalty_details": "<ставка или 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<основания или 'Данные не определены'>",
          "advance_return_on_termination_status": "<defined / not_defined>",
          "advance_return_on_termination_details": "<условия или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
