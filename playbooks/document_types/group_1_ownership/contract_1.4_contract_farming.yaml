           - если данные противоречивы — "Не удалось определить".

        9. consequences_status:
           - "defined" — если последствия для обязательств прямо указаны;
           - "not_defined" — если не указаны.

        10. consequences_details:
            Последствия для обязательств при форс-мажоре.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

