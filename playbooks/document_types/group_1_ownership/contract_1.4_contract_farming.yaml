        1. insurance_status:
           - "defined" — если есть прямая обязанность застраховать урожай;
           - "not_defined" — если только рекомендация / право / нет условия.

        2. insurance_obligated_party_status:
           - "defined" — если прямо указано, кто обязан застраховать;
