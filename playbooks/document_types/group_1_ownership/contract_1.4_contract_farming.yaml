           → presence = "unclear";
             insurance_cost_status = "not_defined";
             insurance_cost_details = "Не удалось определить".

        4. Полное раскрытие.
           "Производитель обязан застраховать урожай на 80% стоимости.
           Расходы несёт заготовитель. Выгодоприобретатель — заготовитель
