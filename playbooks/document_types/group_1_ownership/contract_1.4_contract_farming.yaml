  - id: delivery_acceptance_cluster
    name: "Сдача, приёмка, место, транспорт и тара"
    description: >
      Фактографическая проверка наличия условий о сроке и графике сдачи продукции,
      месте приёмки, обязанности заготовителя принять продукцию, транспорте и таре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок сдачи"
        - "срок поставки"
        - "период сдачи"
        - "не позднее"
        - "в течение"
        - "график сдачи"
        - "график поставки"
        - "по мере созревания"
        - "уборочная кампания"
        - "сезон сбора"
        - "приёмка продукции"
        - "порядок приёмки"
        - "место приёмки"
        - "пункт приёмки"
        - "акт приёмки"
        - "весовая"
        - "лаборатория"
        - "отбор проб"
        - "ТТН"
        - "транспортировка"
        - "перевозка"
        - "доставка"
        - "самовывоз"
        - "тара"
        - "упаковка"
        - "обязан принять продукцию"
        - "не вправе отказаться от приемки"
        - "обеспечить тарой"
        - "обеспечить транспортом"
        - "вывоз продукции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение|до)\\s+\\d+"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)график\\s+(сдач|поставк)"
        - "(?i)порядок\\s+приёмк"
        - "(?i)акт\\s+приёмк"
        - "(?i)заготовитель.*обязан.*принять"
        - "(?i)(транспортировк|перевозк|доставк)"
        - "(?i)(тар[аеуой]|упаковк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 536, 508, 517 ГК РФ).
        Проверяется только один вопрос: условия сдачи и приёмки продукции,
        место, транспортировка и тара.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок сдачи продукции (конкретная дата или период).
        2. Наличие графика сдачи по периодам (для сезонных контрактов).
        3. Место приёмки (у производителя / на элеваторе / на складе заготовителя).
        4. Обязанность заготовителя принять продукцию.
        5. Кто обеспечивает тару и упаковку.
        6. Кто обеспечивает транспорт для вывоза.
        7. Документы при приёмке (ТТН, акт приёмки).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель сдаёт продукцию не позднее 31 октября 2026 г.
        Заготовитель обязан принять продукцию по месту нахождения производителя,
        обеспечить тару и транспортировку собственными силами.
        Приёмка оформляется товарно-транспортной накладной."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "не позднее 31 октября 2026 г.",
          "delivery_schedule_status": "not_defined",
          "delivery_schedule_details": "Данные не определены",
          "acceptance_place_status": "defined",
          "acceptance_place_code": "producer_location",
          "acceptance_place_details": "по месту нахождения производителя",
          "acceptance_obligation_status": "defined",
          "acceptance_obligation_details": "заготовитель обязан принять продукцию",
          "packaging_provision_status": "defined",
          "packaging_provision_code": "purchaser",
          "transport_provision_status": "defined",
          "transport_provision_code": "purchaser",
          "acceptance_documents_status": "defined",
          "acceptance_documents_details": "товарно-транспортная накладная",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заготовитель обязан принять продукцию по месту нахождения производителя, обеспечить тару и транспортировку собственными силами."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Производитель передаёт продукцию заготовителю."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Данные не определены",
          "delivery_schedule_status": "not_defined",
          "delivery_schedule_details": "Данные не определены",
          "acceptance_place_status": "not_defined",
          "acceptance_place_code": "not_defined",
          "acceptance_place_details": "Данные не определены",
          "acceptance_obligation_status": "not_defined",
          "acceptance_obligation_details": "Данные не определены",
          "packaging_provision_status": "not_defined",
          "packaging_provision_code": "not_defined",
          "transport_provision_status": "not_defined",
          "transport_provision_code": "not_defined",
          "acceptance_documents_status": "not_defined",
          "acceptance_documents_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок сдачи (дата или период)?
        2. Есть ли график сдачи по частям (для периодических поставок)?
        3. Указано ли место приёмки конкретно?
        4. Прямо ли написана обязанность заготовителя принять продукцию?
        5. Кто обеспечивает тару — прямо ли указано?
        6. Кто обеспечивает транспорт — прямо ли указано?
        7. Какой документ оформляется при приёмке?
        8. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "delivery_term_status": "<defined / not_defined>",
          "delivery_term_details": "<срок или 'Данные не определены'>",
          "delivery_schedule_status": "<defined / not_defined>",
          "delivery_schedule_details": "<описание графика или 'Данные не определены'>",
          "acceptance_place_status": "<defined / not_defined>",
          "acceptance_place_code": "<producer_location / purchaser_warehouse / elevator / other / not_defined>",
          "acceptance_place_details": "<текст или 'Данные не определены'>",
          "acceptance_obligation_status": "<defined / not_defined>",
          "acceptance_obligation_details": "<текст или 'Данные не определены'>",
          "packaging_provision_status": "<defined / not_defined>",
          "packaging_provision_code": "<purchaser / producer / not_defined>",
          "transport_provision_status": "<defined / not_defined>",
          "transport_provision_code": "<purchaser / producer / shared / not_defined>",
          "acceptance_documents_status": "<defined / not_defined>",
          "acceptance_documents_details": "<документы или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок сдачи срок поставки период сдачи не позднее в течение график сдачи по мере созревания уборочная кампания сезон сбора приёмка продукции порядок приёмки место приёмки пункт приёмки акт приёмки весовая лаборатория отбор проб ТТН транспортировка перевозка доставка самовывоз тара упаковка обязан принять продукцию не вправе отказаться обеспечить тарой обеспечить транспортом вывоз продукции"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "цена"
        - "оплата"
        - "аванс"
        - "НДС"
        - "ЕСХН"
        - "качество продукции"
        - "ГОСТ"
        - "ТУ"
        - "параметры качества"
        - "влажность"
        - "сорность"
        - "ветеринарный сертификат"
        - "фитосанитарный"
        - "рекламация"
        - "претензии по качеству"
        - "риск гибели"
        - "хранение до вывоза"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1550

      compact_output: false

      presence_signal:
        field: "delivery_acceptance_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о сроке сдачи продукции, графике поставок, месте приёмки,
        обязанности заготовителя принять продукцию, таре, транспорте и документах
        при приёмке.
        Не анализируй цену, оплату, качество или ответственность сторон.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. delivery_acceptance_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по сдаче,
           приёмке, транспорту и таре.
           - "present" — если хотя бы одно из содержательных полей
             (delivery_term_status, delivery_schedule_status,
              acceptance_place_status, acceptance_obligation_status,
              packaging_provision_status, transport_provision_status,
              acceptance_documents_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - acceptance_place_code = "not_defined";
           - packaging_provision_code = "not_defined";
           - transport_provision_code = "not_defined";
           - delivery_term_details, delivery_schedule_details,
             acceptance_place_details, acceptance_obligation_details,
             acceptance_documents_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. delivery_term_status:
           - "defined" — если срок сдачи прямо определён;
           - "not_defined" — если не определён.

        2. delivery_term_details:
           Конкретный срок сдачи (дата или период).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. delivery_schedule_status:
           - "defined" — если график сдачи прямо указан;
           - "not_defined" — если не указан.

        4. delivery_schedule_details:
           График сдачи продукции по периодам или партиям.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. acceptance_place_status:
           - "defined" — если место приёмки прямо указано;
           - "not_defined" — если не указано.

        6. acceptance_place_code:
           - "producer_location" — у производителя;
           - "purchaser_warehouse" — на складе заготовителя;
           - "elevator" — на элеваторе / хлебоприёмном пункте;
           - "other" — иное прямо названное место;
           - "not_defined" — не указано.

        7. acceptance_place_details:
           Конкретное место приёмки (адрес, название элеватора).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. acceptance_obligation_status:
           - "defined" — если прямо указана обязанность заготовителя
             принять продукцию (или прямо запрещено отказываться от приёмки);
           - "not_defined" — если не указана.

        9. acceptance_obligation_details:
           Формулировка об обязанности заготовителя принять продукцию.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        10. packaging_provision_status:
            - "defined" — если прямо указано, кто обеспечивает тару;
            - "not_defined" — если не указано.

        11. packaging_provision_code:
            - "purchaser" — тару обеспечивает заготовитель;
            - "producer" — тару обеспечивает производитель;
            - "not_defined" — не указано.

        12. transport_provision_status:
            - "defined" — если прямо указано, кто обеспечивает транспорт;
            - "not_defined" — если не указано.

        13. transport_provision_code:
            - "purchaser" — транспорт заготовителя (в т.ч. самовывоз);
            - "producer" — транспорт производителя (доставка);
            - "shared" — распределён между сторонами;
            - "not_defined" — не указано.

        14. acceptance_documents_status:
            - "defined" — если прямо указаны документы при приёмке;
            - "not_defined" — если не указаны.

        15. acceptance_documents_details:
            Документы при приёмке (ТТН, акт приёмки и т.п.).
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_acceptance_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Самовывоз = transport_provision_code: purchaser.
        - Доставка производителем = transport_provision_code: producer.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока сдачи, ни графика, ни места приёмки,
           ни транспорта, ни тары.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Производитель передаёт продукцию заготовителю."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.3 — срок 31 октября, в п.8 — 15 ноября.
           → presence = "unclear";
             delivery_term_status = "not_defined";
             delivery_term_details = "Не удалось определить".

        4. Полное раскрытие.
           "Срок сдачи — не позднее 31 октября 2026 г. Заготовитель
           принимает продукцию по месту нахождения производителя,
           обеспечивает тару и транспорт. Приёмка — ТТН."
           → presence = "present";
             delivery_term_status = "defined";
             acceptance_place_status = "defined";
             acceptance_place_code = "producer_location";
             packaging_provision_code = "purchaser";
             transport_provision_code = "purchaser";
             acceptance_documents_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_acceptance_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для acceptance_place_code используй только:
          "producer_location", "purchaser_warehouse", "elevator", "other", "not_defined".
        - Для packaging_provision_code используй только:
          "purchaser", "producer", "not_defined".
        - Для transport_provision_code используй только:
          "purchaser", "producer", "shared", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_acceptance_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
