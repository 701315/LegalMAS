        - limitations
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "засуха"
        - "заморозки"
        - "эпизоотия"
        - "освобождение при форс-мажоре"
        - "страхование"
        - "страховой случай"
        - "качество"
        - "ГОСТ"
        - "рекламация"
        - "риск гибели"
        - "хранение"
        - "цена"
        - "оплата"
        - "аванс"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
