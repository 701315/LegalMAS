            }
          ]
        }

        Пример 2 — условия не раскрыты:
        Фрагмент:
        "Оплата производится в течение 30 дней с момента поставки."

        Ответ:
        {
          "interest_free_status": "not_defined",
          "interest_free_details": "Данные не определены",
          "prepayment_interest_status": "not_defined",
          "prepayment_interest_details": "Данные не определены",
          "deferred_payment_interest_status": "not_defined",
          "deferred_payment_interest_details": "Данные не определены",
          "interest_rate_status": "not_defined",
          "interest_rate_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на безвозмездность коммерческого кредита?
        2. Есть ли условие о процентах на аванс?
        3. Есть ли условие о процентах на отсрочку?
        4. Указана ли конкретная ставка?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "interest_free_status": "<defined / not_defined>",
          "interest_free_details": "<текст или 'Данные не определены'>",
          "prepayment_interest_status": "<defined / not_defined>",
          "prepayment_interest_details": "<текст или 'Данные не определены'>",
          "deferred_payment_interest_status": "<defined / not_defined>",
          "deferred_payment_interest_details": "<текст или 'Данные не определены'>",
