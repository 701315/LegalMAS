        7. loss_indemnification_status:
           - "defined" — если есть обязательство о возмещении
             имущественных потерь при доначислении налогов;
           - "not_defined" — если нет.

        8. loss_indemnification_details:
           Условия возмещения потерь.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. beneficial_owners_disclosure_status:
           - "defined" — если есть обязанность раскрывать бенефициаров
             или цепочку собственников;
           - "not_defined" — если нет.

        10. beneficial_owners_disclosure_details:
            Условия раскрытия.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_representations_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений, ни налоговой оговорки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны обязуются соблюдать законодательство РФ."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
