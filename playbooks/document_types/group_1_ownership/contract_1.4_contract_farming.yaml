          "title_transfer_status": "not_defined",
          "title_transfer_moment": "not_defined",
          "title_transfer_details": "Данные не определены",
          "retention_of_title_status": "not_defined",
          "retention_of_title_details": "Данные не определены",
          "future_crop_pledge_status": "not_defined",
          "future_crop_pledge_details": "Данные не определены",
          "double_sale_protection_status": "not_defined",
          "evidence": []
