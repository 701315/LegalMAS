        - "особые условия хранения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+подлежит.*возврат"

  - id: "quality_dispute_resolution"
    name: "Порядок разрешения споров о качестве"
    description: "Проверяет наличие механизма разрешения споров о качестве продукции (экспертиза, арбитраж)"
