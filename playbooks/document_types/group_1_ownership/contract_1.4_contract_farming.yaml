        </role>

        <context>
        {context}
        </context>

        <task>
        0. agricultural_force_majeure_check_presence:
           Агрегатное signal-поле — наличие регулирования по форс-мажору
           в с/х контрактации.
           - "present" — если хотя бы одно из содержательных полей
