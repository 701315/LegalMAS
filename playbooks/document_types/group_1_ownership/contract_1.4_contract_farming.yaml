        - "неустойка за отказ"
        - "штраф за уклонение"
        - "компенсация убытков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отказ.*от.*приёмк"
        - "(?i)уклонен.*от.*приёмк"
      negative_keywords:
        - "обоснованный отказ"
        - "мотивированный отказ"

  - id: "late_payment_penalty"
    name: "Неустойка за просрочку оплаты (ст. 395, 330 ГК РФ)"
    description: "Проверяет наличие неустойки или процентов за просрочку оплаты заготовителем"
    legal_base: "ст. 395, 330 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "просрочка оплаты"
        - "неустойка за просрочку оплаты"
        - "пеня за просрочку оплаты"
        - "проценты за пользование"
        - "ст. 395"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)просрочк(а|и|у)\\s+оплат"
        - "(?i)\\b\\d+[,.]?\\d*\\s*%\\s*(за|в\\s+день)"

  - id: "producer_fault_based_liability"
    name: "Ответственность производителя только при наличии вины (ст. 538 ГК РФ)"
    description: "Ключевая особенность контрактации: производитель несёт ответственность за неисполнение только при наличии вины, в отличие от общего правила безвиновной ответственности предпринимателей (ст. 401 п. 3 ГК). Проверяет, не установлена ли в договоре безвиновная (строгая) ответственность производителя в нарушение его законного права."
    legal_base: "ст. 538 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственность производителя"
        - "при наличии вины"
        - "виновное неисполнение"
        - "освобождается от ответственности"
        - "доказал отсутствие вины"
        - "независимо от вины"
        - "в любом случае"
        - "безусловная ответственность"
      keyword_mode: "any"
      negative_keywords:
        - "независимо от вины производителя"
        - "вне зависимости от вины"
        - "безусловная ответственность производителя"
      regex_patterns:
        - "(?i)производитель.*несёт.*ответственность.*при.*наличии.*вин"
        - "(?i)производитель.*освобождается.*от.*ответственности"
        - "(?i)независимо\\s+от\\s+вин(ы|ы\\s+производител)"

  - id: "price_adjustment_mechanism"
    name: "Механизм корректировки цены при изменении рыночной конъюнктуры"
    description: "В сельскохозяйственном секторе цены подвержены сезонным и рыночным колебаниям. Проверяет наличие механизма пересмотра/индексации цены, привязки к биржевым котировкам, порядка согласования новой цены."
    legal_base: "ст. 424, 485 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "корректировка цены"
        - "пересмотр цены"
        - "индексация"
        - "изменение цены"
        - "рыночная конъюнктура"
        - "биржевая цена"
        - "биржевые котировки"
        - "ценовая формула"
        - "привязка к индексу"
        - "при изменении тарифа"
        - "пересмотр по соглашению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(корректировк|пересмотр|изменени|индексаци)(а|е|и|я)\\s+цен"
        - "(?i)биржев(ая|ой|ых)\\s+(цен|котировк)"
        - "(?i)привязк(а|и)\\s+к\\s+(индекс|курс)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "price_adjustment_type"
          type: "string"
          allowed_values: ["index_linked", "market_based", "mutual_agreement", "fixed_no_adjustment", "not_found"]
          keyword_hints: ["индексация", "биржевая цена", "по соглашению сторон", "фиксированная"]
          description: "Тип механизма корректировки цены"
        - name: "adjustment_frequency"
          type: "string"
          keyword_hints: ["ежемесячно", "ежеквартально", "ежегодно", "при изменении"]
          description: "Периодичность пересмотра"
      store_payload: true

  - id: "contract_term_and_duration"
    name: "Срок действия договора контрактации"
    description: "Проверяет наличие срока действия, привязки к сельскохозяйственному сезону, условий продления для многолетних контрактов"
    legal_base: "ст. 425, 535 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "срок договора"
        - "действует до"
        - "вступает в силу"
        - "на сезон"
        - "на урожай"
        - "на год"
        - "пролонгация"
        - "продление договора"
        - "автоматически продлевается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*действует.*до"
        - "(?i)автоматическ.*продл(евается|ение)"
        - "(?i)на\\s+(сезон|урожай|\\d+\\s+год)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "contract_term"
          type: "string"
          keyword_hints: ["срок действия", "до", "по", "на сезон"]
          description: "Срок действия договора"
        - name: "auto_renewal"
          type: "string"
          allowed_values: ["yes", "no", "seasonal", "not_found"]
          keyword_hints: ["пролонгация", "продлевается", "возобновляется"]
          description: "Автоматическая пролонгация"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}:
      для производителя — наименование/ФИО главы КФХ, ИНН, ОГРН/ОГРНИП, адрес;
      для заготовителя — наименование, ИНН, ОГРН, адрес, полномочия подписанта.
    addressee: "Обе стороны"

  subject_product_specification:
    text: >
      Просим уточнить в {doc_names}: наименование продукции, вид, количество
      (в тоннах/кг/литрах), стандарт качества (ГОСТ/ТУ), ассортимент (если применимо).
    addressee: "Обе стороны"

  price_required:
    text: >
      Просим подтвердить цену продукции по {doc_names}: (а) цена за единицу;
      (б) механизм корректировки цены (при изменении рыночной конъюнктуры);
      (в) включает ли цена НДС (или производитель на ЕСХН с освобождением от НДС).
    addressee: "Юридический советник"

  delivery_term_required:
    text: >
      Просим уточнить в {doc_names}: конкретные сроки сдачи продукции,
      график поставок по периодам (при сезонной сдаче), последствия пропуска сроков.
    addressee: "Обе стороны"

  contracting_subject_extraction:
    text: >
      Просим предоставить полные данные о предмете контрактации по {doc_names}:
      наименование продукции, вид, количество, стандарт качества, срок сдачи,
      место сдачи, порядок определения качества при приёмке.
    addressee: "Производитель / Юридический советник"

  agricultural_force_majeure_check:
    text: >
      В {doc_names} недостаточно детализирована форс-мажорная оговорка для с/х.
      Просим включить: (а) перечень специфических сельскохозяйственных рисков
      (засуха, наводнение, заморозки, град, эпизоотия, вредители);
      (б) порядок уведомления о наступлении форс-мажора;
      (в) доказательства (справка ТПП, Гидрометцентр, Россельхознадзор);
      (г) последствия для обязательств сторон.
    addressee: "Юридический советник"

  purchaser_obligation_to_accept:
    text: >
      Просим уточнить в {doc_names}: (а) обязанность заготовителя принять
      выращенную продукцию; (б) место приёмки (у производителя / на складе заготовителя);
      (в) обеспечение тарой и транспортом; (г) сроки приёмки.
    addressee: "Заготовитель / Юридический советник"

  product_quality_standards_check:
    text: >
      Просим предоставить по {doc_names}: (а) ссылку на стандарт качества (ГОСТ/ТУ/СТО);
      (б) конкретные параметры качества (влажность, сорность, жирность и т.д.);
      (в) порядок определения качества при приёмке; (г) порядок разрешения споров о качестве.
    addressee: "Обе стороны"

  crop_insurance_check:
    text: >
      Просим уточнить в {doc_names}: (а) обязательность страхования урожая;
      (б) кто несёт расходы на страхование; (в) минимальная страховая сумма;
      (г) выгодоприобретатель; (д) порядок действий при страховом случае.
    addressee: "Юридический советник"

  perennial_crops_risk_allocation:
    text: >
      Для {doc_names} (многолетние культуры) просим уточнить:
      (а) распределение рисков гибели насаждений;
      (б) механизм компенсации затрат на насаждения;
      (в) условия продления/прекращения обязательств при гибели.
    addressee: "Юридический советник"

  production_support_obligations_check:
    text: >
      Просим уточнить в {doc_names}: (а) перечень ресурсов, предоставляемых заготовителем
      (семена, удобрения, СЗР, техника); (б) порядок учёта стоимости ресурсов
      (за счёт заготовителя / зачёт в цену); (в) сроки предоставления.
    addressee: "Заготовитель"

  delivery_schedule_and_periods:
    text: >
      Просим согласовать в {doc_names}: график сдачи продукции по периодам,
      объёмы по каждому периоду, допустимые отклонения, последствия отклонений.
    addressee: "Обе стороны"

  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: место приёмки, порядок отбора проб,
      лабораторию для определения качества, форму акта приёмки,
      сроки подписания акта, порядок действий при расхождениях.
    addressee: "Обе стороны"

  transport_and_packaging:
    text: >
      Просим уточнить в {doc_names}: кто обеспечивает транспортировку,
      требования к таре/упаковке, распределение расходов на перевозку,
      ответственность за повреждение при транспортировке.
    addressee: "Обе стороны"

  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: основания расторжения для каждой стороны,
      порядок возврата авансов, неустойки при расторжении,
      судьба произведённой, но непереданной продукции.
    addressee: "Юридический советник"

  penalty_for_non_delivery:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за недопоставку/просрочку,
      порядок расчёта, ограничение суммы неустойки, соотношение с убытками.
    addressee: "Юридический советник"

  advance_payment_terms:
    text: >
      Просим уточнить в {doc_names}: размер и сроки авансирования,
      условия возврата аванса при неисполнении, зачёт аванса в оплату.
    addressee: "Юридический советник"

  payment_terms_and_schedule:
    text: >
      Просим уточнить в {doc_names}: срок оплаты после приёмки,
      способ расчётов, банковские реквизиты, порядок сверки расчётов.
    addressee: "Обе стороны"

  veterinary_phytosanitary_documents:
    text: >
      Просим уточнить в {doc_names}: какие ветеринарные/фитосанитарные документы
      должен предоставить производитель, порядок оформления ВСД через ФГИС «Меркурий»,
      последствия отсутствия документов.
    addressee: "Производитель"

  quality_dispute_resolution:
    text: >
      Просим уточнить в {doc_names}: порядок разрешения споров о качестве,
      назначение и оплата экспертизы, обязательность арбитражного образца,
      срок предъявления рекламации.
    addressee: "Обе стороны"

  storage_conditions:
    text: >
      Просим уточнить в {doc_names}: условия хранения продукции до передачи,
      ответственность за порчу, требования к складским помещениям.
    addressee: "Обе стороны"

  assignment_restriction:
    text: >
      Просим добавить в {doc_names} ограничения на уступку прав / перевод долга
      без согласия другой стороны.
    addressee: "Юридический советник"

  vat_and_tax_allocation:
    text: >
      Просим уточнить в {doc_names}: применяемый налоговый режим производителя
      (ЕСХН/ОСНО), включает ли цена НДС, порядок выставления счетов-фактур.
    addressee: "Налоговый консультант / Бухгалтер"

  confidentiality:
    text: >
      Просим добавить в {doc_names} условия о конфиденциальности:
      перечень конфиденциальных сведений, срок действия, исключения.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность споров, обязательность
      претензионного порядка, сроки рассмотрения претензий.
    addressee: "Юридический советник"

  ecological_and_safety_requirements:
    text: >
      Просим уточнить в {doc_names}: требования по содержанию пестицидов/нитратов,
      ссылки на применимые технические регламенты ТС, порядок подтверждения
      безопасности продукции.
    addressee: "Производитель / Лаборатория"

  risk_of_crop_loss_allocation:
    text: >
      Просим уточнить в {doc_names}: момент перехода рисков гибели/повреждения
      продукции, порядок действий при частичной гибели, распределение
      рисков при транспортировке.
    addressee: "Юридический советник"

  penalty_for_non_acceptance:
    text: >
      Просим уточнить в {doc_names}: размер ответственности заготовителя
      за необоснованный отказ от приёмки, порядок фиксации отказа,
      право производителя на возмещение убытков (порча продукции).
    addressee: "Юридический советник"

  late_payment_penalty:
    text: >
      Просим уточнить в {doc_names}: размер неустойки/процентов за просрочку
      оплаты заготовителем, порядок начисления, соотношение с ст. 395 ГК РФ.
    addressee: "Юридический советник"

  veterinary_certificate_required:
    text: >
      Внимание: для продукции животноводства по {doc_names} требуется оформление
      ветеринарного сопроводительного документа через ФГИС «Меркурий».
      Просим подтвердить наличие ВСД и право производителя на оформление.
    addressee: "Производитель / Ветеринарная служба"

  phytosanitary_export_certificate_required:
    text: >
      Внимание: для экспорта подкарантинной продукции по {doc_names} требуется
      фитосанитарный сертификат Россельхознадзора. Просим предоставить
      документы о карантинном статусе и порядке получения сертификата.
    addressee: "Производитель / Россельхознадзор"

  organic_certification_required:
    text: >
      Внимание: реализация продукции как «органической» по {doc_names}
      без сертификата по ФЗ-280 запрещена. Просим предоставить сертификат
      соответствия органической продукции.
    addressee: "Производитель"

  non_returnable_goods_reference:
    text: >
      Просим уточнить в {doc_names}: применяются ли ограничения на возврат
      для скоропортящейся продукции, порядок действий при возврате.
    addressee: "Юридический советник"

  producer_fault_based_liability:
    text: >
      Просим проверить в {doc_names}: (а) не установлена ли безвиновная (строгая)
      ответственность производителя, противоречащая ст. 538 ГК РФ;
      (б) корректно ли отражён принцип виновной ответственности;
      (в) перечень обстоятельств, освобождающих производителя от ответственности
      (неблагоприятные погодные условия, эпизоотии, вредители и т.д.).
    addressee: "Юридический советник производителя"

  price_adjustment_mechanism:
    text: >
      Просим согласовать в {doc_names}: (а) механизм корректировки цены
      при изменении рыночной конъюнктуры (индексация / привязка к бирже /
      пересмотр по соглашению); (б) периодичность пересмотра;
      (в) порядок уведомления об изменении цены; (г) право стороны
      на отказ от договора при существенном изменении цены.
    addressee: "Обе стороны"

  contract_term_and_duration:
    text: >
      Просим уточнить в {doc_names}: срок действия договора,
      привязку к сельскохозяйственному сезону/урожаю, условия продления
      (автоматическая пролонгация или заключение нового договора),
      обязательства сторон, переживающие прекращение договора.
    addressee: "Юридический советник"

  grain_safety_declaration_required:
    text: >
      Внимание: для зерновой продукции по {doc_names} обязательна декларация
      соответствия ТР ТС 015/2011 «О безопасности зерна». Просим подтвердить
      наличие декларации и включить в договор обязанность производителя
      предоставлять декларацию с каждой партией.
    addressee: "Производитель"
    
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"