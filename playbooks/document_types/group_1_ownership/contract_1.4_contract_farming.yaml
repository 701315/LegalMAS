    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: наличие условий о господдержке
        и действиях сторон при чрезвычайных ситуациях.

        Нормативный ориентир:
        - Постановление Правительства РФ № 1528 (правила компенсации
          при ЧС в агропромышленном комплексе)
        - ФЗ № 264-ФЗ «О развитии сельского хозяйства»
        - ФЗ № 68-ФЗ «О защите населения и территорий от ЧС»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на получение государственной поддержки (субсидии,
           компенсации).
        2. Распределение полученной господдержки между сторонами.
        3. Порядок действий сторон при введении режима ЧС.
        4. Кто готовит документы для получения компенсации при ЧС.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — раскрыто:
        Фрагмент:
        "Стороны обязуются совместно подавать документы на получение
        субсидий по программе несвязанной поддержки. Полученная субсидия
        распределяется между сторонами пропорционально понесённым затратам.
        При введении режима ЧС в регионе стороны действуют согласно
        Постановлению Правительства № 1528. Документы для компенсации
        готовит Производитель."

        Ответ:
        {
          "state_support_reference_status": "defined",
          "state_support_reference_details": "несвязанная поддержка, субсидии",
          "support_allocation_status": "defined",
          "support_allocation_details": "пропорционально понесённым затратам",
          "emergency_procedure_status": "defined",
          "emergency_procedure_details": "действия согласно Постановлению Правительства № 1528",
          "emergency_documents_preparer_status": "defined",
          "emergency_documents_preparer_code": "producer",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Стороны обязуются совместно подавать документы на получение субсидий по программе несвязанной поддержки."
            }
          ]
        }

        Пример 2 — условия не раскрыты:
        Фрагмент:
        "Стороны действуют в соответствии с законодательством РФ."

        Ответ:
        {
          "state_support_reference_status": "not_defined",
          "state_support_reference_details": "Данные не определены",
          "support_allocation_status": "not_defined",
          "support_allocation_details": "Данные не определены",
          "emergency_procedure_status": "not_defined",
          "emergency_procedure_details": "Данные не определены",
          "emergency_documents_preparer_status": "not_defined",
          "emergency_documents_preparer_code": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая ссылка на господдержку / субсидии?
        2. Указано ли распределение господдержки между сторонами?
        3. Есть ли условие о действиях при режиме ЧС?
        4. Указано ли, кто готовит документы для компенсации?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "state_support_reference_status": "<defined / not_defined>",
          "state_support_reference_details": "<текст или 'Данные не определены'>",
          "support_allocation_status": "<defined / not_defined>",
          "support_allocation_details": "<текст или 'Данные не определены'>",
          "emergency_procedure_status": "<defined / not_defined>",
          "emergency_procedure_details": "<текст или 'Данные не определены'>",
          "emergency_documents_preparer_status": "<defined / not_defined>",
          "emergency_documents_preparer_code": "<producer / purchaser / both / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
