        <task>
        Заполни строго следующие поля:

        1. force_majeure_status — "defined" или "not_defined".
        2. force_majeure_type — одно из: agricultural_specific / general_only / not_defined.
           agricultural_specific = перечислены конкретные с/х риски (засуха, заморозки и т.п.).
           general_only = только общая формулировка без с/х специфики.
        3. specific_events_status — "defined" или "not_defined".
        4. specific_events_details — перечень конкретных с/х событий.
        5. notification_status — "defined" или "not_defined".
        6. notification_details — срок уведомления о наступлении форс-мажора.
        7. proof_requirements_status — "defined" или "not_defined".
        8. proof_requirements_details — требуемые документы (ТПП, Гидрометцентр, Россельхознадзор).
        9. consequences_status — "defined" или "not_defined".
        10. consequences_details — последствия для обязательств (отсрочка, пересчёт объёма, прекращение).

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Для force_majeure_type используй только:
          - "agricultural_specific" — если прямо перечислены специфические с/х риски:
