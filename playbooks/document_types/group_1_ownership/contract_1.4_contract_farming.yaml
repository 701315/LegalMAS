    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество продукции"
        - "требования к качеству"
        - "стандарты качества"
        - "соответствие ГОСТ"
        - "технические условия"
        - "параметры качества"
        - "сертификат качества"
        - "декларация соответствия"
        - "лабораторный анализ"
        - "влажность"
        - "сорность"
        - "жирность"
        - "кислотность"
        - "пестициды"
