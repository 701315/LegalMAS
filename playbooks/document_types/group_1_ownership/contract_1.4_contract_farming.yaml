        - "претензионный порядок"
        - "досудебный порядок"
        - "медиация"
        - "место рассмотрения спора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "ecological_and_safety_requirements"
    name: "Экологические и санитарные требования к продукции"
    description: "Проверяет наличие экологических и санитарных требований"
    legal_base: "ФЗ от 02.01.2000 № 29-ФЗ «О качестве и безопасности пищевых продуктов», ТР ТС 021/2011, ТР ТС 015/2011 (зерно), ТР ТС 033/2013 (молоко)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
