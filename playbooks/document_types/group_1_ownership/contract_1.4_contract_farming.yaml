           - "defined" — если прямо предусмотрен залог будущего урожая;
           - "not_defined" — если не предусмотрен.

        7. future_crop_pledge_details:
           Условия залога будущего урожая.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. double_sale_protection_status:
           - "defined" — если прямо предусмотрен механизм защиты
             от двойной продажи одного и того же урожая;
           - "not_defined" — если не предусмотрен.
        </task>

        <context_rules>
        - Перед остальными полями заполни future_crop_title_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не выводи момент перехода титула из диспозитивных норм ГК.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни момента перехода права собственности,
           ни retention of title, ни залога, ни защиты от двойной продажи.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Только упоминание права собственности без момента.
           "Право собственности на продукцию принадлежит заготовителю."
           → presence = "present";
             title_transfer_status = "not_defined";
             retention_of_title_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.5 — титул переходит при подписании акта, в п.9 — при оплате.
           → presence = "unclear";
             title_transfer_status = "not_defined";
             title_transfer_details = "Не удалось определить".

        4. Полное раскрытие.
           "Право собственности переходит при подписании акта приёмки.
           До полной оплаты сохраняется за производителем.
           Будущий урожай в залоге у заготовителя."
           → presence = "present";
             title_transfer_status = "defined";
             title_transfer_moment = "upon_act";
             retention_of_title_status = "yes";
             future_crop_pledge_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для future_crop_title_check_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для title_transfer_moment используй только:
          "upon_act", "upon_shipping", "upon_payment", "custom", "not_defined".
        - Для retention_of_title_status используй только:
          "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "future_crop_title_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
