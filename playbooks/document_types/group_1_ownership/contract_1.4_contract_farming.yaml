  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Переход риска и хранение
  # ──────────────────────────────────────────────────────────────────────────
  - id: risk_title_storage_cluster
    name: "Переход риска гибели продукции и условия хранения"
    description: >
      Фактографическая проверка наличия условий о моменте перехода риска
      случайной гибели/повреждения продукции и условиях хранения до передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск гибели"
        - "риск повреждения"
        - "случайная гибель"
        - "риск порчи"
        - "несёт риск"
        - "момент перехода риска"
        - "условия хранения"
        - "температурный режим"
        - "склад"
        - "элеватор"
        - "зернохранилище"
        - "холодильник"
        - "ответственное хранение"
        - "порча при хранении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+(гибел|поврежден|порч|случайн)"
        - "(?i)переход\\s+риск"
        - "(?i)условия\\s+хранен"
        - "(?i)температурн(ый|ого)\\s+режим"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 459, 514, 538 ГК РФ).
        Проверяется только один вопрос: момент перехода риска гибели продукции
        и условия её хранения до передачи заготовителю.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент перехода риска случайной гибели/повреждения продукции.
        2. Кто несёт риск до момента передачи.
        3. Условия хранения продукции до вывоза заготовителем.
        4. Порядок действий при частичной гибели продукции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Риск случайной гибели продукции переходит к Заготовителю с момента
        подписания акта приёмки. До этого момента риск несёт Производитель.
        Производитель обязан хранить продукцию при температуре от +2 до +8 °C
        до момента вывоза Заготовителем. При частичной гибели урожая объём
        поставки пересчитывается пропорционально фактическому сбору."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_act",
          "risk_transfer_details": "с момента подписания акта приёмки",
          "risk_bearer_before_transfer_status": "defined",
          "risk_bearer_before_transfer_code": "producer",
          "storage_conditions_status": "defined",
          "storage_conditions_details": "температура от +2 до +8 °C",
          "partial_loss_procedure_status": "defined",
          "partial_loss_procedure_details": "объём пересчитывается пропорционально фактическому сбору",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Риск случайной гибели продукции переходит к Заготовителю с момента подписания акта приёмки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продукция хранится на ферме производителя до вывоза."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "risk_bearer_before_transfer_status": "not_defined",
          "risk_bearer_before_transfer_code": "not_defined",
          "storage_conditions_status": "not_defined",
          "storage_conditions_details": "Данные не определены",
          "partial_loss_procedure_status": "not_defined",
          "partial_loss_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о переходе риска к конкретному событию?
        2. Указано ли прямо, кто несёт риск до передачи?
        3. Есть ли конкретные условия хранения (температура, тип хранилища)?
        4. Есть ли порядок пересчёта при частичной гибели?
        5. Не выводи момент перехода риска из общих условий — только из прямой цитаты.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_act / upon_weighing / upon_shipping / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "risk_bearer_before_transfer_status": "<defined / not_defined>",
          "risk_bearer_before_transfer_code": "<producer / purchaser / not_defined>",
          "storage_conditions_status": "<defined / not_defined>",
          "storage_conditions_details": "<требования или 'Данные не определены'>",
          "partial_loss_procedure_status": "<defined / not_defined>",
          "partial_loss_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск гибели риск повреждения случайная гибель риск порчи несёт риск момент перехода риска условия хранения температурный режим склад элеватор зернохранилище холодильник ответственное хранение порча при хранении частичная гибель продукции пересчёт объёма"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождение от ответственности"
        - "засуха"
        - "заморозки"
        - "эпизоотия"
        - "страхование урожая"
        - "страховой случай"
        - "неустойка"
        - "расторжение"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "фитосанитарный"
        - "цена"
        - "оплата"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false



      llm_max_tokens: 1000



      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о моменте перехода риска случайной гибели продукции, ответственном
        за риск до передачи, условиях хранения и порядке действий при частичной
        гибели урожая.
        Не анализируй цену, качество, ответственность за нарушение договора или
        расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. risk_transfer_status — "defined" или "not_defined".
        2. risk_transfer_moment — одно из: upon_act / upon_weighing / upon_shipping / custom / not_defined.
        3. risk_transfer_details — формулировка о переходе риска из договора.
        4. risk_bearer_before_transfer_status — "defined" или "not_defined".
        5. risk_bearer_before_transfer_code — одно из: producer / purchaser / not_defined.
        6. storage_conditions_status — "defined" или "not_defined".
        7. storage_conditions_details — требования к хранению (температура, тип хранилища).
        8. partial_loss_procedure_status — "defined" или "not_defined".
        9. partial_loss_procedure_details — порядок действий при частичной гибели урожая.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи момент перехода риска из общих норм ГК — только из прямой цитаты.
        - Не подставляй нормы закона.
        - upon_act — переход риска при подписании акта приёмки или приёмо-сдаточного акта.
        - upon_weighing — при взвешивании / замере количества продукции.
        - upon_shipping — при отгрузке / передаче продукции перевозчику или заготовителю
          без дополнительного акта.
        - custom — любой иной явно указанный момент, не совпадающий с перечисленными.
        - not_defined — если момент прямо не указан в тексте.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения момента перехода риска."
