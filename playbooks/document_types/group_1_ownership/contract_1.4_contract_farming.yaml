          description: "Сумма аванса"
        - name: "advance_percentage"
          type: "string"
          keyword_hints: ["% от стоимости", "процент", "в размере"]
          description: "Процент аванса от суммы договора"
      store_payload: true

  - id: "payment_terms_and_schedule"
    name: "Порядок расчётов: сроки и условия оплаты"
    description: "Проверяет наличие чёткого порядка оплаты за поставленную продукцию"
    legal_base: "ст. 486, 516 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "оплата"
        - "срок оплаты"
        - "в течение"
        - "после приёмки"
        - "после сдачи"
        - "банковские реквизиты"
        - "платёжное поручение"
        - "расчёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|ы).*?(после|в\\s+течение)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|банковск)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "payment_deadline_days"
          type: "number"
          keyword_hints: ["в течение", "не позднее", "дней после"]
          description: "Срок оплаты в днях"
        - name: "payment_method"
          type: "string"
          allowed_values: ["bank_transfer", "cash", "offset", "mixed", "not_found"]
          keyword_hints: ["безналичный расчёт", "платёжное поручение", "наличными", "зачёт"]
          description: "Способ оплаты"
      store_payload: true

  - id: "veterinary_phytosanitary_documents"
    name: "Ветеринарные / фитосанитарные документы"
    description: "Проверяет наличие требований о предоставлении ветеринарных или фитосанитарных сертификатов"
    legal_base: "ФЗ «О ветеринарии», ФЗ «О карантине растений»"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["livestock_products", "phytosanitary_control", "export_supply"]
    rules:
      keywords:
        - "ветеринарный сертификат"
        - "ветеринарное свидетельство"
        - "ВСД"
        - "Меркурий"
        - "фитосанитарный сертификат"
        - "карантинный сертификат"
        - "Россельхознадзор"
        - "декларация соответствия"
        - "сертификат соответствия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ветеринарн(ый|ое|ого)\\s+(сертификат|свидетельств)"
        - "(?i)фитосанитарн(ый|ого)\\s+сертификат"

  - id: "non_returnable_goods_reference"
    name: "Ссылка на перечень товаров, не подлежащих возврату (Пост. № 2463)"
