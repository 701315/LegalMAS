          required: true
        - name: "interventions_reference_details"
          type: "string"
          presentation: "fact"
          label: "Закупочные интервенции"
          description: "Условие о применении закупочных интервенций к цене."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "exchange_quotes_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус привязки цены к биржевым котировкам."
          required: true
        - name: "exchange_quotes_details"
          type: "string"
          presentation: "fact"
          label: "Биржевые котировки"
          description: "Описание привязки цены к биржевым котировкам."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "price_revision_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия механизма пересмотра цены при госрегулировании."
          required: true
        - name: "price_revision_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Механизм пересмотра цены"
          description: "Описание механизма пересмотра цены при госрегулировании / интервенциях."
