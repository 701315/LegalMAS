    any_keywords:
      - "(?i)страховани[ея]\\s+урожа[яя]"
      - "(?i)страховани[ея]\\s+сельскохозяйственн[а-яё]+\\s+рисков"
      - "(?i)\\bагростраховани[ея]\\b"
      - "(?i)страхов[оа]й\\s+полис"
      - "(?i)страхов[а-яё]+\\s+сумм[аы]"
      - "(?i)страхов[оа]й\\s+случа[йя]"
      - "(?i)гибел[ьи]\\s+урожа[яя]"

  production_support:
    any_keywords:
      - "(?i)предоставлени[ея]\\s+семян"
      - "(?i)обеспечени[ея]\\s+удобрени[яями]"
      - "(?i)средств[ао]\\s+защит[ыи]\\s+растени[йя]"
      - "(?i)предоставлени[ея]\\s+техник[ии]"
      - "(?i)агрономическ[а-яё]+\\s+сопровождени[ея]"
      - "(?i)обеспечени[ея]\\s+тар[оы]й"
      - "(?i)обеспечени[ея]\\s+производственн[а-яё]+\\s+процесс[аа]"

  organic_products:
    any_keywords:
      - "(?i)органическ[а-яё]+\\s+продукци[яи]"
      - "(?i)органическ[оае]+\\s+земледели[ея]"
      - "(?i)экологическ[иоя]+\\s+чист[а-яё]+"
      - "(?i)без\\s+пестицид[оа]в"
      - "(?i)\\bбио\\b"
      - "(?i)\\bэко\\b"
      - "(?i)сертификат\\s+органическ[а-яё]+\\s+продукци[ии]"

  export_supply:
    any_keywords:
      - "(?i)\\bэкспорт\\b"
      - "(?i)экспортн[а-яё]+\\s+поставк[аи]"
      - "(?i)внешнеэкономическ[а-яё]+"
      - "(?i)таможенн[а-яё]+\\s+оформлени[ея]"
      - "(?i)фитосанитарн[а-яё]+\\s+сертификат"
      - "(?i)стран[аы]-импорт[её]р"
      - "(?i)международн[а-яё]+\\s+поставк[аи]"

  veterinary_control:
    any_keywords:
      - "(?i)ветеринарн[а-яё]+\\s+сертификат"
      - "(?i)ветеринарн[а-яё]+\\s+свидетельств[оа]"
      - "(?i)ветеринарн[а-яё]+\\s+контрол[ьяю]"
      - "(?i)\\bВСД\\b"
      - "(?i)\\bМеркурий\\b"
      - "(?i)\\bФГИС\\s+Меркурий\\b"
      - "(?i)ветеринарно-санитарн[а-яё]+\\s+экспертиз[аы]"

  phytosanitary_control:
    any_keywords:
      - "(?i)фитосанитарн[а-яё]+\\s+сертификат"
      - "(?i)карантинн[а-яё]+\\s+сертификат"
      - "(?i)карантин\\s+растени[йя]"
      - "(?i)\\bРоссельхознадзор\\b"
      - "(?i)подкарантинн[а-яё]+\\s+продукци[яи]"
      - "(?i)фитосанитарн[а-яё]+\\s+контрол[ьяю]"

  high_value_crops:
    any_keywords:
      - "(?i)элитн[а-яё]+\\s+семен[ао]"
      - "(?i)ценн[а-яё]+\\s+сорт[аы]"
      - "(?i)дорогостоящ[а-яё]+\\s+культур[аы]"
      - "(?i)селекционн[а-яё]+\\s+достижени[яй]"
      - "(?i)племенн[оа]й\\s+скот"
      - "(?i)племенн[оа]е\\s+поголовь[еия]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  weight_volume: "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  gost_tu: "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "veterinary_certificate_required"
    name: "Обязательный ветеринарный сертификат для продукции животноводства"
    description: >
      Оборот продукции животного происхождения (молоко, мясо, яйцо и т.д.)
      без ветеринарного сопроводительного документа (ВСД) запрещён.
      Оформление через ФГИС «Меркурий» обязательно.
    legal_base: "ФЗ от 14.05.1993 № 4979-1 «О ветеринарии», Приказ Минсельхоза № 589"
    required_triggers: ["livestock_products"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "ветеринарный сертификат"
        - "ВСД"
        - "Меркурий"
        - "ветеринарное свидетельство"
        - "продукция животного происхождения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ветеринарный сертификат"
        - "ФГИС Меркурий"
        - "ВСД"
      rerank: true

  - id: "phytosanitary_export_certificate_required"
    name: "Фитосанитарный сертификат для экспорта подкарантинной продукции"
    description: >
      Экспорт подкарантинной продукции (зерно, овощи, фрукты, семена)
      без фитосанитарного сертификата запрещён.
    legal_base: "ФЗ от 21.07.2014 № 206-ФЗ «О карантине растений»"
    required_triggers: ["export_supply"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "фитосанитарный сертификат"
        - "карантинный сертификат"
        - "подкарантинная продукция"
        - "Россельхознадзор"
        - "экспорт"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "фитосанитарный сертификат"
        - "экспорт сельхозпродукции"
      rerank: true

  - id: "organic_certification_required"
    name: "Сертификация органической продукции (ФЗ-280)"
    description: >
      Маркировка и реализация продукции как «органической» без сертификата
      соответствия по ФЗ от 03.08.2018 № 280-ФЗ запрещена.
    legal_base: "ФЗ от 03.08.2018 № 280-ФЗ «Об органической продукции»"
    required_triggers: ["organic_products"]
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "органическая продукция"
        - "сертификат органической"
        - "органическое земледелие"
        - "ФЗ-280"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "органическая продукция"
        - "сертификат соответствия"
      rerank: true

  - id: "grain_safety_declaration_required"
    name: "Обязательная декларация соответствия зерна (ТР ТС 015/2011)"
    description: >
      Каждая партия зерна, выпускаемая в обращение на территории ЕАЭС,
      подлежит обязательному декларированию соответствия требованиям
      ТР ТС 015/2011. Без декларации оборот зерна запрещён.
    legal_base: "ТР ТС 015/2011 «О безопасности зерна», ст. 3, 7"
    required_triggers: ["grain_crops"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "декларация соответствия"
        - "ТР ТС 015"
        - "безопасность зерна"
        - "подтверждение соответствия"
        - "декларирование зерна"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "декларация соответствия"
        - "ТР ТС 015"
        - "безопасность зерна"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: contracting_subject_extraction
    name: "Контрактация: базовое извлечение предмета договора"
    description: "Извлекает наименование, вид, количество, качество с/х продукции и ключевые параметры"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сельскохозяйственная продукция"
        - "выращенная продукция"
        - "произведённая продукция"
        - "наименование продукции"
        - "вид продукции"
        - "количество"
        - "объём поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
        - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор контрактации (закупки сельскохозяйственной продукции).
        Тип документа: договор контрактации.
        Твоя задача — найти в тексте сведения о предмете договора.

        Ответь строго в JSON-формате:
        {
          "product_name": "<наименование продукции или not_found>",
          "product_kind": "<grain / livestock / dairy / vegetables / fruits / perennial / other / not_found>",
          "quantity": "<количество с единицей измерения или not_found>",
          "quality_standard": "<ГОСТ/ТУ/стандарт или not_found>",
          "delivery_period": "<срок/период сдачи или not_found>",
          "delivery_place": "<место сдачи или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
        Не придумывай и не выводи значения из контекста.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "сельскохозяйственная продукция"
        - "наименование"
        - "количество"
        - "ГОСТ"
        - "сдача продукции"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "product_name"
          type: "string"
          keyword_hints: ["наименование", "продукция", "зерно", "молоко", "мясо", "овощи"]
          description: "Наименование сельскохозяйственной продукции"
        - name: "product_kind"
          type: "string"
          allowed_values: ["grain", "livestock", "dairy", "vegetables", "fruits", "perennial", "other", "not_found"]
          description: "Вид продукции"
        - name: "quantity"
          type: "string"
          keyword_hints: ["количество", "объём", "тонн", "кг", "центнер", "литр"]
          regex_patterns:
            - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
          description: "Количество продукции"
        - name: "quality_standard"
          type: "string"
          keyword_hints: ["ГОСТ", "ТУ", "стандарт", "качество", "СТО"]
          regex_patterns:
            - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
          description: "Стандарт качества"
        - name: "delivery_period"
          type: "string"
          keyword_hints: ["срок сдачи", "период поставки", "до", "не позднее", "график"]
          description: "Срок/период сдачи продукции"
        - name: "delivery_place"
          type: "string"
          keyword_hints: ["место сдачи", "пункт приёмки", "склад", "элеватор", "ферма"]
          description: "Место сдачи продукции"
      store_payload: true

  - id: agricultural_force_majeure_check
    name: "Специальная оговорка о форс-мажоре для с/х (ст. 538 ГК РФ)"
    description: >
      Проверяет наличие детализированного перечня сельскохозяйственных форс-мажорных
      обстоятельств и порядка освобождения производителя от ответственности.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неблагоприятные погодные условия"
        - "засуха"
        - "наводнение"
        - "заморозки"
        - "град"
        - "эпидемии"
        - "эпизоотия"
        - "нашествие вредителей"
        - "стихийные бедствия"
        - "гибель урожая"
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождается от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)производитель.*освобождается.*ответственности"
        - "(?i)обстоятельств(а|ами)\\s+непреодолимой\\s+силы"
        - "(?i)форс[\\s-]?мажор"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор контрактации.
        Проверь наличие и полноту форс-мажорной оговорки для сельскохозяйственного производства (ст. 538 ГК РФ).

        Ответь строго в JSON:
        {
          "force_majeure_clause_present": "<yes / partial / not_found>",
          "specific_agricultural_risks_listed": "<yes / no / not_found>",
          "listed_risks": ["<риск1>", "<риск2>", "..."],
          "notification_procedure": "<described / not_found>",
          "proof_requirements": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "yes" — полная детализированная оговорка с перечнем с/х рисков
        - "partial" — общая формулировка без конкретных с/х рисков
        - "not_found" — отсутствует

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "засуха"
        - "гибель урожая"
        - "ст. 538"
        - "освобождение от ответственности"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "force_majeure_clause_present"
          type: "string"
          allowed_values: ["yes", "partial", "not_found"]
          description: "Наличие форс-мажорной оговорки"
        - name: "specific_agricultural_risks_listed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Перечислены ли специфические с/х риски"
        - name: "notification_procedure"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описан ли порядок уведомления о форс-мажоре"
      store_payload: true

  - id: purchaser_obligation_to_accept
    name: "Обязанность заготовителя принять продукцию (ст. 536 ГК РФ)"
    description: >
      Проверяет наличие чёткого условия об обязанности заготовителя принять
      выращенную/произведённую продукцию, порядке приёмки, обеспечении тарой и вывозом.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обязан принять продукцию"
        - "обязанность заготовителя принять"
        - "не вправе отказаться от приемки"
        - "принять выращенную продукцию"
        - "обеспечить приёмку"
        - "вывоз продукции"
        - "обеспечить тарой"
        - "обеспечить транспортом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заготовитель.*обязан.*принять"
        - "(?i)обязанност(ь|и).*заготовител.*при(нять|ёмк)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор контрактации.
        Проверь наличие обязанности заготовителя принять продукцию (ст. 536 ГК РФ).

        Ответь строго в JSON:
        {
          "acceptance_obligation_present": "<yes / not_found>",
          "acceptance_at_producer_location": "<yes / no / not_found>",
          "packaging_provision": "<yes / no / not_found>",
          "transport_provision": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "заготовитель обязан принять"
        - "обеспечить тарой"
        - "вывоз продукции"
        - "ст. 536 ГК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "acceptance_obligation_present"
          type: "string"
          allowed_values: ["yes", "not_found"]
          description: "Обязанность заготовителя принять продукцию"
        - name: "acceptance_at_producer_location"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Приёмка по месту нахождения производителя"
        - name: "packaging_provision"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Обеспечение тарой/упаковкой"
        - name: "transport_provision"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Обеспечение транспортом для вывоза"
      store_payload: true

  - id: product_quality_standards_check
    name: "Требования к качеству продукции (ГОСТ/ТУ/СТО)"
    description: >
      Проверяет наличие чётких требований к качеству, ссылок на стандарты,
      порядка определения качества при приёмке и последствий несоответствия.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество продукции"
        - "требования к качеству"
        - "стандарты качества"
        - "соответствие ГОСТ"
        - "технические условия"
        - "параметры качества"
        - "сертификат качества"
        - "декларация соответствия"
        - "лабораторный анализ"
        - "влажность"
        - "сорность"
        - "жирность"
        - "кислотность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
        - "(?i)продукция.*должна.*соответствовать"
        - "(?i)качество.*определяется"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор контрактации.
        Проверь наличие и полноту требований к качеству сельскохозяйственной продукции.

        Ответь строго в JSON:
        {
          "quality_requirements_present": "<detailed / general / not_found>",
          "quality_standard_reference": "<ГОСТ/ТУ номер или not_found>",
          "quality_parameters_listed": "<yes / no / not_found>",
          "quality_check_procedure": "<described / not_found>",
          "rejection_procedure": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
