          "title_transfer_moment": "upon_act",
          "title_transfer_details": "с момента подписания акта приёмки",
          "retention_of_title_status": "yes",
          "retention_of_title_details": "до полной оплаты продукции право собственности сохраняется за Производителем",
          "future_crop_pledge_status": "defined",
          "future_crop_pledge_details": "будущий урожай в залоге у Заготовителя в обеспечение возврата аванса",
          "double_sale_protection_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Право собственности на продукцию переходит к Заготовителю с момента подписания акта приёмки."
            }
          ]
        }

        Пример 2 — титул и залог не указаны:
        Фрагмент:
        "Производитель обязуется вырастить и передать продукцию."

        Ответ:
