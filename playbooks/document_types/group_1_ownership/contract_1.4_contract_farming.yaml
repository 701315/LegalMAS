        2. Общая фраза без конкретики.
           "Оплата производится в течение 30 дней с момента поставки."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.5.1 — беспроцентный аванс, в п.9.4 — проценты на аванс.
           → presence = "unclear";
             prepayment_interest_status = "not_defined";
             prepayment_interest_details = "Не удалось определить".

        4. Полное раскрытие.
           "Аванс беспроцентный. При отсрочке — проценты по ключевой
           ставке ЦБ РФ."
           → presence = "present";
             interest_free_status = "defined";
             deferred_payment_interest_status = "defined";
             interest_rate_status = "defined";
             interest_rate_details = "ключевая ставка ЦБ РФ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для commercial_credit_interest_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
