      retrieval_query: "форс-мажор непреодолимая сила неблагоприятные погодные условия засуха наводнение заморозки град эпидемия эпизоотия нашествие вредителей стихийные бедствия гибель урожая освобождается от ответственности производитель уведомляет ТПП Гидрометцентр Россельхознадзор справка о форс-мажоре перенос сроков пересчёт объёма"
      preferred_unit_types:
        - liability_provision
