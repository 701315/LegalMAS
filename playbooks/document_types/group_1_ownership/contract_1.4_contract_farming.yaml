  - id: harvest_accounting_and_control_check
    name: "Учёт урожая и контроль посевов"
    description: >
      Фактографическая проверка наличия условий об учёте урожая,
      контроля посевов заготовителем и предоставления производителем
      отчётности о ходе производства.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отчёт о ходе посевной"
        - "отчёт об уборке"
        - "данные о засеянных площадях"
        - "обследование посевов"
        - "акт обследования"
        - "контроль посевов"
        - "доступ на поля"
        - "представитель заготовителя"
        - "план урожайности"
        - "фактический сбор"
        - "учёт урожая"
        - "отчётность о производстве"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отч[её]т\\s+о\\s+ход[ее]\\s+(посевн|уборочн)"
        - "(?i)обследован[иея]+\\s+посев"
        - "(?i)доступ\\s+на\\s+пол[яе]"
        - "(?i)контрол[ья]+\\s+посев"
        - "(?i)данн[ыа]+\\s+о\\s+засеянн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: наличие условий об учёте урожая
        и контроле посевов заготовителем.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность производителя предоставлять отчётность о ходе
           посевной / уборочной кампании.
        2. Право заготовителя на обследование посевов (акты обследования).
        3. Право доступа представителей заготовителя на поля.
        4. Данные о засеянных площадях и плане урожайности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный контроль раскрыт:
        Фрагмент:
        "Производитель обязан предоставлять Заготовителю отчёт о ходе
        посевной кампании не позднее 15 мая и отчёт об уборке — не позднее
        15 октября. Заготовитель вправе проводить обследование посевов
        с составлением акта. Представители Заготовителя имеют право доступа
        на поля Производителя по предварительному уведомлению."

        Ответ:
        {
          "reporting_obligation_status": "defined",
          "reporting_obligation_details": "отчёт о посевной — до 15 мая; отчёт об уборке — до 15 октября",
          "inspection_right_status": "defined",
          "inspection_right_details": "обследование посевов с составлением акта",
          "field_access_status": "defined",
          "field_access_details": "представители заготовителя по предварительному уведомлению",
          "sown_area_data_status": "not_defined",
          "sown_area_data_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Производитель обязан предоставлять Заготовителю отчёт о ходе посевной кампании не позднее 15 мая и отчёт об уборке — не позднее 15 октября."
            }
          ]
        }

        Пример 2 — контроль не предусмотрен:
        Фрагмент:
        "Производитель обязуется вырастить и передать продукцию."

        Ответ:
        {
          "reporting_obligation_status": "not_defined",
          "reporting_obligation_details": "Данные не определены",
          "inspection_right_status": "not_defined",
          "inspection_right_details": "Данные не определены",
          "field_access_status": "not_defined",
          "field_access_details": "Данные не определены",
          "sown_area_data_status": "not_defined",
          "sown_area_data_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязанность предоставлять отчётность о ходе производства?
        2. Есть ли право обследования посевов?
        3. Есть ли право доступа на поля?
        4. Указаны ли данные о засеянных площадях?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "reporting_obligation_status": "<defined / not_defined>",
          "reporting_obligation_details": "<текст или 'Данные не определены'>",
          "inspection_right_status": "<defined / not_defined>",
          "inspection_right_details": "<текст или 'Данные не определены'>",
          "field_access_status": "<defined / not_defined>",
          "field_access_details": "<текст или 'Данные не определены'>",
          "sown_area_data_status": "<defined / not_defined>",
          "sown_area_data_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчёт о ходе посевной отчёт об уборке данные о засеянных площадях обследование посевов акт обследования контроль посевов доступ на поля представитель заготовителя план урожайности фактический сбор учёт урожая отчётность о производстве"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "цена продукции"
        - "оплата"
        - "срок сдачи"
        - "качество"
        - "ГОСТ"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "harvest_accounting_and_control_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия об учёте урожая и контроле посевов заготовителем.
        Анализируй только эту тему.
        Не анализируй цену, качество, риск гибели или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. harvest_accounting_and_control_check_presence:
           Агрегатное signal-поле — наличие регулирования по учёту урожая
           и контролю посевов.
           - "present" — если хотя бы одно из содержательных полей
             (reporting_obligation_status, inspection_right_status,
              field_access_status, sown_area_data_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. reporting_obligation_status:
           - "defined" — если прямо указана обязанность производителя
             предоставлять отчётность о ходе производства;
           - "not_defined" — если не указана.

        2. reporting_obligation_details:
           Условия отчётности.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. inspection_right_status:
           - "defined" — если прямо указано право заготовителя
             обследовать посевы;
           - "not_defined" — если не указано.

        4. inspection_right_details:
           Условия обследования посевов.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. field_access_status:
           - "defined" — если прямо указано право доступа
             представителей заготовителя на поля;
           - "not_defined" — если не указано.

        6. field_access_details:
           Условия доступа на поля.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. sown_area_data_status:
           - "defined" — если прямо указаны данные о засеянных площадях
             или плане урожайности;
           - "not_defined" — если не указаны.

        8. sown_area_data_details:
           Данные о засеянных площадях / плане урожайности.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни harvest_accounting_and_control_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни отчётности, ни обследования,
           ни доступа на поля, ни данных о площадях.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Заготовитель контролирует ход производства."
           → presence = "present";
             reporting_obligation_status = "not_defined";
             inspection_right_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.3 — отчёт до 15 мая, в п.8 — до 1 июня.
           → presence = "unclear";
             reporting_obligation_status = "not_defined";
             reporting_obligation_details = "Не удалось определить".

        4. Полное раскрытие.
           "Отчёт о посевной — до 15 мая. Заготовитель вправе обследовать
           посевы. Представители заготовителя имеют доступ на поля.
           Площадь посевов — 500 га."
           → presence = "present";
             reporting_obligation_status = "defined";
             inspection_right_status = "defined";
             field_access_status = "defined";
             sown_area_data_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для harvest_accounting_and_control_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "harvest_accounting_and_control_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по учёту урожая и контролю посевов. Внутреннее агрегатное signal-поле."
          required: true
        - name: "reporting_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности производителя предоставлять отчётность."
          required: true
        - name: "reporting_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Отчётность о ходе производства"
          description: "Условия предоставления производителем отчётности о ходе посевной / уборочной."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "inspection_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права заготовителя обследовать посевы."
          required: true
        - name: "inspection_right_details"
          type: "string"
          presentation: "fact"
          label: "Обследование посевов"
          description: "Условия обследования посевов заготовителем."
          required: false
          display_in_grid: false
        - name: "field_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права доступа представителей заготовителя на поля."
          required: true
        - name: "field_access_details"
          type: "string"
          presentation: "fact"
          label: "Доступ на поля"
          description: "Условия доступа представителей заготовителя на поля."
          required: false
          display_in_grid: false
        - name: "sown_area_data_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания данных о засеянных площадях."
          required: true
        - name: "sown_area_data_details"
          type: "string"
          presentation: "fact"
          label: "Засеянные площади"
          description: "Данные о засеянных площадях или плане урожайности."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: product_return_and_disposal_check
    name: "Возврат и утилизация несоответствующей продукции"
    description: >
      Фактографическая проверка наличия условий о возврате несоответствующей
      продукции производителю, её утилизации, распределении расходов
      и судьбе аванса при возврате.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат продукции"
        - "возврат несоответствующей продукции"
        - "утилизация продукции"
        - "утилизация испорченной продукции"
        - "уничтожение продукции"
        - "несоответствующая продукция"
        - "некачественная продукция"
        - "опасная продукция"
        - "расходы на возврат"
        - "расходы на утилизацию"
        - "судьба аванса при возврате"
        - "возврат аванса при возврате продукции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат\\s+(продукци|товар)"
        - "(?i)утилизаци[яи].*(продукци|товар)"
        - "(?i)уничтожени[ея].*(продукци|товар)"
        - "(?i)расход[ыа]+\\s+на\\s+(возврат|утилизаци)"
        - "(?i)судьб[аы]+\\s+аванс"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 475 ГК РФ).
        Проверяется только один вопрос: наличие условий о возврате
        несоответствующей продукции, её утилизации и судьбе аванса.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность или право возврата несоответствующей продукции
           производителю.
        2. Порядок утилизации испорченной / опасной продукции.
        3. Распределение расходов на возврат и утилизацию.
        4. Судьба аванса при возврате продукции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное раскрытие:
        Фрагмент:
        "При выявлении несоответствия продукции по качеству Заготовитель
        возвращает продукцию Производителю. Испорченная и опасная продукция
        подлежит утилизации силами Производителя. Расходы на возврат
        и утилизацию несёт Производитель. Аванс, уплаченный за возвращённую
        продукцию, возвращается Заготовителю в течение 10 дней."

        Ответ:
