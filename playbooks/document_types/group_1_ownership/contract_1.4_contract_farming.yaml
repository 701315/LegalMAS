  - id: risk_title_storage_cluster
    name: "Переход риска гибели продукции и условия хранения"
    description: >
      Фактографическая проверка наличия условий о моменте перехода риска
      случайной гибели/повреждения продукции и условиях хранения до передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск гибели"
        - "риск повреждения"
        - "случайная гибель"
        - "риск порчи"
        - "несёт риск"
        - "момент перехода риска"
        - "условия хранения"
        - "температурный режим"
        - "склад"
        - "элеватор"
        - "зернохранилище"
        - "холодильник"
        - "ответственное хранение"
        - "порча при хранении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+(гибел|поврежден|порч|случайн)"
        - "(?i)переход\\s+риск"
        - "(?i)условия\\s+хранен"
        - "(?i)температурн(ый|ого)\\s+режим"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 459, 514, 538 ГК РФ).
        Проверяется только один вопрос: момент перехода риска гибели продукции
        и условия её хранения до передачи заготовителю.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент перехода риска случайной гибели/повреждения продукции.
        2. Кто несёт риск до момента передачи.
        3. Условия хранения продукции до вывоза заготовителем.
        4. Порядок действий при частичной гибели продукции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Риск случайной гибели продукции переходит к Заготовителю с момента
        подписания акта приёмки. До этого момента риск несёт Производитель.
        Производитель обязан хранить продукцию при температуре от +2 до +8 °C
        до момента вывоза Заготовителем. При частичной гибели урожая объём
        поставки пересчитывается пропорционально фактическому сбору."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_act",
          "risk_transfer_details": "с момента подписания акта приёмки",
          "risk_bearer_before_transfer_status": "defined",
          "risk_bearer_before_transfer_code": "producer",
          "storage_conditions_status": "defined",
          "storage_conditions_details": "температура от +2 до +8 °C",
          "partial_loss_procedure_status": "defined",
          "partial_loss_procedure_details": "объём пересчитывается пропорционально фактическому сбору",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Риск случайной гибели продукции переходит к Заготовителю с момента подписания акта приёмки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продукция хранится на ферме производителя до вывоза."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "risk_bearer_before_transfer_status": "not_defined",
          "risk_bearer_before_transfer_code": "not_defined",
          "storage_conditions_status": "not_defined",
          "storage_conditions_details": "Данные не определены",
          "partial_loss_procedure_status": "not_defined",
          "partial_loss_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка о переходе риска к конкретному событию?
        2. Указано ли прямо, кто несёт риск до передачи?
        3. Есть ли конкретные условия хранения (температура, тип хранилища)?
        4. Есть ли порядок пересчёта при частичной гибели?
        5. Не выводи момент перехода риска из общих условий — только из прямой цитаты.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_act / upon_weighing / upon_shipping / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "risk_bearer_before_transfer_status": "<defined / not_defined>",
          "risk_bearer_before_transfer_code": "<producer / purchaser / not_defined>",
          "storage_conditions_status": "<defined / not_defined>",
          "storage_conditions_details": "<требования или 'Данные не определены'>",
          "partial_loss_procedure_status": "<defined / not_defined>",
          "partial_loss_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск гибели риск повреждения случайная гибель риск порчи несёт риск момент перехода риска условия хранения температурный режим склад элеватор зернохранилище холодильник ответственное хранение порча при хранении частичная гибель продукции пересчёт объёма"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождение от ответственности"
        - "засуха"
        - "заморозки"
        - "эпизоотия"
        - "страхование урожая"
        - "страховой случай"
        - "неустойка"
        - "расторжение"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "фитосанитарный"
        - "цена"
        - "оплата"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "risk_title_storage_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия о моменте перехода риска случайной гибели продукции, ответственном
        за риск до передачи, условиях хранения и порядке действий при частичной
        гибели урожая.
        Не анализируй цену, качество, ответственность за нарушение договора или
        расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. risk_title_storage_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по переходу риска
           и условиям хранения.
           - "present" — если хотя бы одно из содержательных полей
             (risk_transfer_status, risk_bearer_before_transfer_status,
              storage_conditions_status, partial_loss_procedure_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - risk_transfer_moment = "not_defined";
           - risk_bearer_before_transfer_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. risk_transfer_status:
           - "defined" — если момент перехода риска прямо указан;
           - "not_defined" — если не указан.

        2. risk_transfer_moment:
           - "upon_act" — при подписании акта приёмки или приёмо-сдаточного акта;
           - "upon_weighing" — при взвешивании / замере количества продукции;
           - "upon_shipping" — при отгрузке / передаче перевозчику или заготовителю
             без дополнительного акта;
           - "custom" — любой иной явно указанный момент;
           - "not_defined" — если момент прямо не указан.

        3. risk_transfer_details:
           Формулировка о переходе риска из договора.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        4. risk_bearer_before_transfer_status:
           - "defined" — если прямо указано, кто несёт риск до передачи;
           - "not_defined" — если не указано.

        5. risk_bearer_before_transfer_code:
           - "producer" — риск несёт производитель;
           - "purchaser" — риск несёт заготовитель;
           - "not_defined" — не указано.

        6. storage_conditions_status:
           - "defined" — если условия хранения прямо указаны;
           - "not_defined" — если не указаны.

        7. storage_conditions_details:
           Требования к хранению (температура, тип хранилища).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. partial_loss_procedure_status:
           - "defined" — если прямо указан порядок при частичной гибели урожая;
           - "not_defined" — если не указан.

        9. partial_loss_procedure_details:
           Порядок действий при частичной гибели урожая.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_title_storage_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_moment = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не выводи момент перехода риска из общих норм ГК — только из прямой цитаты.
        - Не подставляй нормы закона.
        - Для risk_transfer_moment используй только:
          "upon_act", "upon_weighing", "upon_shipping", "custom", "not_defined".
        - Для risk_bearer_before_transfer_code используй только:
          "producer", "purchaser", "not_defined".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни момента перехода риска, ни ответственного до передачи,
           ни условий хранения, ни порядка при частичной гибели.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Продукция хранится на ферме производителя до вывоза."
           → presence = "present" (тема упомянута);
             risk_transfer_status = "not_defined";
             storage_conditions_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.5 — риск переходит при подписании акта, в п.9 — при отгрузке.
           → presence = "unclear";
             risk_transfer_status = "not_defined";
             risk_transfer_moment = "not_defined";
             risk_transfer_details = "Не удалось определить".

        4. Полное раскрытие.
           "Риск переходит при подписании акта приёмки. До этого — риск
           на производителе. Хранение при +2…+8 °C. При частичной гибели —
           пересчёт объёма."
           → presence = "present";
             risk_transfer_status = "defined";
             risk_transfer_moment = "upon_act";
             risk_bearer_before_transfer_status = "defined";
             risk_bearer_before_transfer_code = "producer";
             storage_conditions_status = "defined";
             partial_loss_procedure_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_title_storage_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для risk_transfer_moment используй только:
          "upon_act", "upon_weighing", "upon_shipping", "custom", "not_defined".
        - Для risk_bearer_before_transfer_code используй только:
          "producer", "purchaser", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_title_storage_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по переходу риска и хранению. Внутреннее агрегатное signal-поле."
          required: true
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения момента перехода риска."
          required: true
        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["upon_act", "upon_weighing", "upon_shipping", "custom", "not_defined"]
          description: "Момент перехода риска случайной гибели."
          required: true
        - name: "risk_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход риска гибели"
          description: "Формулировка договора о моменте перехода риска."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "risk_bearer_before_transfer_status"
          type: "string"
