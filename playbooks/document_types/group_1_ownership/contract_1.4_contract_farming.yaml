  - id: subject_price_payment_cluster
    name: "Предмет, количество, цена и порядок расчётов"
    description: >
      Фактографическая проверка наличия в договоре предмета (вид и наименование
      продукции), количества, цены, механизма пересмотра цены и порядка расчётов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование продукции"
        - "вид продукции"
        - "количество"
        - "объём поставки"
        - "сельскохозяйственная продукция"
        - "выращенная продукция"
        - "цена"
        - "стоимость"
        - "цена за тонну"
        - "цена за килограмм"
        - "рублей"
        - "рыночная цена"
        - "оплата"
        - "срок оплаты"
        - "после приёмки"
        - "авансирование"
        - "предоплата"
        - "аванс"
        - "корректировка цены"
        - "пересмотр цены"
        - "индексация"
        - "биржевые котировки"
        - "НДС"
        - "ЕСХН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)за\\s+(?:тонну|кг|центнер|литр)"
        - "(?i)оплат(а|ы).*?(после|в\\s+течение)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)(корректировк|пересмотр|изменени|индексаци)(а|е|и|я)\\s+цен"
        - "(?i)биржев(ая|ой|ых)\\s+(цен|котировк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 424, 455, 485-487 ГК РФ).
        Проверяется только один вопрос: предмет договора, количество продукции,
        цена и порядок расчётов, авансирование производителя.

        Важно:
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист сравнивает несколько договоров — нужна чёткая таблица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и вид сельскохозяйственной продукции.
        2. Количество продукции с единицей измерения.
        3. Цена за единицу продукции.
        4. Налоговая оговорка (НДС включён / без НДС / ЕСХН).
        5. Механизм изменения/пересмотра цены.
        6. Срок оплаты после приёмки.
        7. Наличие авансирования (предоплаты) производителя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязуется вырастить и передать пшеницу продовольственную
        4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС
        (производитель применяет ЕСХН). Оплата — в течение 5 рабочих дней
        после приёмки. Заготовитель выплачивает аванс в размере 30%
        от стоимости договора не позднее 1 апреля 2026 г."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "пшеница продовольственная 4 класса",
          "quantity_status": "defined",
          "quantity_details": "200 тонн",
          "price_status": "defined",
          "price_details": "18 000 рублей за тонну",
          "vat_status": "defined",
          "vat_details": "без НДС, ЕСХН",
          "price_change_mechanism_status": "not_defined",
          "price_change_mechanism_details": "Данные не определены",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 5 рабочих дней после приёмки",
          "advance_status": "defined",
          "advance_details": "30% от стоимости договора не позднее 1 апреля 2026 г.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Производитель обязуется вырастить и передать пшеницу продовольственную 4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Условия сделки будут определены дополнительным соглашением."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "price_change_mechanism_status": "not_defined",
          "price_change_mechanism_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "advance_status": "not_defined",
          "advance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное наименование продукции (не просто "сельхозпродукция")?
        2. Указано ли количество числом с единицей?
        3. Указана ли цена за единицу конкретной суммой?
        4. Указано ли явно: с НДС / без НДС / ЕСХН?
        5. Есть ли механизм пересмотра цены (индексация, привязка к бирже)?
        6. Указан ли конкретный срок оплаты?
        7. Есть ли условие об авансе с размером и сроком?
        8. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "subject_status": "<defined / not_defined>",
          "subject_details": "<наименование или 'Данные не определены'>",
          "quantity_status": "<defined / not_defined>",
          "quantity_details": "<количество с единицей или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<цена или 'Данные не определены'>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<с НДС / без НДС / ЕСХН или 'Данные не определены'>",
          "price_change_mechanism_status": "<defined / not_defined>",
          "price_change_mechanism_details": "<механизм или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "advance_status": "<defined / not_defined>",
          "advance_details": "<условия аванса или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "наименование продукции вид продукции сельскохозяйственная продукция выращенная продукция количество объём поставки цена стоимость тонна килограмм центнер литр рублей за тонну рыночная цена оплата срок оплаты после приёмки авансирование предоплата аванс корректировка цены пересмотр цены индексация биржевые котировки НДС ЕСХН"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "производитель в лице"
        - "заготовитель в лице"
        - "ИНН"
        - "ОГРН"
        - "срок сдачи"
        - "место приёмки"
        - "транспорт"
        - "тара"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "фитосанитарный"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "subject_price_payment_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        данные о предмете договора, количестве продукции, цене, налоговой оговорке,
        механизме изменения цены, сроке оплаты и авансировании производителя.
        Не анализируй качество продукции, сроки сдачи, транспорт или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. subject_price_payment_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по предмету,
           количеству, цене и порядку расчётов.
           - "present" — если хотя бы одно из содержательных полей
             (subject_status, quantity_status, price_status, vat_status,
              price_change_mechanism_status, payment_deadline_status,
              advance_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - subject_details, quantity_details, price_details,
             vat_details, price_change_mechanism_details,
             payment_deadline_details, advance_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subject_status:
           - "defined" — если наименование и вид продукции прямо указаны;
           - "not_defined" — если не указано.

        2. subject_details:
           Наименование и вид сельхозпродукции.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. quantity_status:
           - "defined" — если количество или порядок его определения прямо указаны;
           - "not_defined" — если не указано.

        4. quantity_details:
           Количество с единицей измерения.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. price_status:
           - "defined" — если цена за единицу или порядок её определения указаны;
           - "not_defined" — если не указано.

        6. price_details:
           Цена за единицу продукции.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. vat_status:
           - "defined" — если прямо указано: с НДС / без НДС / ЕСХН;
           - "not_defined" — если не указано.

        8. vat_details:
           Налоговая оговорка.
           Правила:
           - ЕСХН → "ЕСХН, без НДС";
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. price_change_mechanism_status:
           - "defined" — если предусмотрен механизм изменения или индексации цены;
           - "not_defined" — если не предусмотрен.

        10. price_change_mechanism_details:
            Механизм изменения цены (индексация, привязка к бирже).
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        11. payment_deadline_status:
            - "defined" — если срок оплаты прямо определён;
            - "not_defined" — если не определён.

        12. payment_deadline_details:
            Срок оплаты после приёмки.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        13. advance_status:
            - "defined" — если условие об авансировании прямо указано;
            - "not_defined" — если не указано.

        14. advance_details:
            Размер и срок аванса производителю.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_price_payment_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Не делай предположений об условиях.
        - ЕСХН → vat_details = "ЕСХН, без НДС".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни предмета, ни количества, ни цены, ни оплаты,
           ни аванса.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Условия сделки будут определены дополнительным соглашением."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.1 — цена 18 000 руб./т, в приложении — 20 000 руб./т.
           → presence = "unclear";
             price_status = "not_defined";
             price_details = "Не удалось определить".

        4. Полное раскрытие.
           "Пшеница 4 класса, 200 тонн, 18 000 руб./т без НДС, оплата
           в течение 5 рабочих дней после приёмки, аванс 30%."
           → presence = "present";
             subject_status = quantity_status = price_status = "defined";
             vat_status = "defined";
             payment_deadline_status = "defined";
             advance_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_price_payment_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

