      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "ЕСХН"
        - "единый сельскохозяйственный налог"
        - "освобождение от НДС"
        - "налог"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)\\bЕСХН\\b"

  - id: "confidentiality"
    name: "Конфиденциальность условий сделки"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
