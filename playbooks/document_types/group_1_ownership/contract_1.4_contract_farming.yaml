        - "санитарные требования"
        - "технический регламент"
        - "ТР ТС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ТР\\s+ТС"
        - "(?i)\\bПДК\\b"
        - "(?i)пестицид|гербицид|нитрат"

  - id: "risk_of_crop_loss_allocation"
    name: "Распределение рисков гибели/повреждения продукции до передачи (ст. 459 ГК РФ)"
    description: "Проверяет распределение рисков случайной гибели или повреждения продукции"
    legal_base: "ст. 459, 538 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск гибели"
        - "риск повреждения"
        - "случайная гибель"
        - "риск порчи"
        - "несёт риск"
        - "момент перехода риска"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+(гибел|поврежден|порч|случайн)"
        - "(?i)переход\\s+риск"

  - id: "penalty_for_non_acceptance"
    name: "Ответственность заготовителя за отказ от приёмки"
    description: "Проверяет наличие неустойки или иной ответственности за необоснованный отказ от приёмки"
    legal_base: "ст. 536, 330 ГК РФ"
    severity: "high"
