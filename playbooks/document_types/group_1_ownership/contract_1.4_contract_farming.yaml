  - id: general_provisions_cluster
    name: "Общие условия: срок, НДС/ЕСХН, уступка"
    description: >
      Фактографическая проверка стандартных условий договора контрактации:
      срок действия договора (включая сезонную привязку), автоматическая пролонгация,
      налоговые оговорки (НДС / ЕСХН) и ограничения уступки прав.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "срок договора"
        - "действует до"
        - "вступает в силу"
        - "на сезон"
        - "на урожай"
        - "пролонгация"
        - "автоматически продлевается"
        - "НДС"
        - "ЕСХН"
        - "единый сельскохозяйственный налог"
        - "освобождение от НДС"
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*действует.*до"
        - "(?i)автоматическ.*продл(евается|ение)"
        - "(?i)на\\s+(сезон|урожай|\\d+\\s+год)"
        - "(?i)\\bНДС\\b"
        - "(?i)\\bЕСХН\\b"
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)перевод\\s+долга"
        - "(?i)не\\s+разглаш"
        - "(?i)претензионн(ый|ого)\\s+поряд"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: общие условия — срок, налоги,
        уступка, конфиденциальность, претензионный порядок и подсудность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок действия договора и его привязку к сезону/урожаю.
        2. Наличие автоматической пролонгации.
        3. Налоговую оговорку (НДС / ЕСХН).
        4. Ограничения на уступку прав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор действует с момента подписания до 31 декабря 2026 г.
        Производитель применяет ЕСХН и не является плательщиком НДС.
        Уступка прав по договору допускается только с письменного согласия
        другой стороны."

        Ответ:
        {
          "contract_term_status": "defined",
          "contract_term_details": "до 31 декабря 2026 г.",
          "auto_renewal_status": "not_defined",
          "vat_status": "defined",
          "vat_details": "ЕСХН, не является плательщиком НДС",
          "assignment_restriction_status": "defined",
          "assignment_restriction_details": "только с письменного согласия другой стороны",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Договор действует с момента подписания до 31 декабря 2026 г."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор регулируется законодательством Российской Федерации."

        Ответ:
        {
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "auto_renewal_status": "not_defined",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "assignment_restriction_status": "not_defined",
          "assignment_restriction_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок действия (дата или привязка к сезону/урожаю)?
        2. Есть ли автоматическая пролонгация прямо указана?
        3. Указано ли явно: с НДС / без НДС / ЕСХН?
        4. Есть ли прямое условие об уступке (с согласия / запрет / свободно)?
        5. Если прямого текста нет — возвращай "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<срок или 'Данные не определены'>",
          "auto_renewal_status": "<defined / not_defined>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<режим или 'Данные не определены'>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "term_and_renewal_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок действия договора действует до вступает в силу на сезон на урожай пролонгация автоматически продлевается НДС ЕСХН единый сельскохозяйственный налог освобождение от НДС уступка переуступка перевод долга без согласия с согласия другой стороны не разглашать претензионный порядок"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
        - obligations
      negative_keywords:
        - "наименование продукции"
        - "количество"
        - "цена за тонну"
        - "оплата после приёмки"
        - "аванс производителю"
        - "срок сдачи"
        - "место приёмки"
        - "качество"
        - "ГОСТ"
        - "ветеринарный"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "general_provisions_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        срок действия договора (включая сезонную привязку), условие об
        автоматической пролонгации, налоговый режим и ограничения на уступку прав.
        Не анализируй ответственность, расторжение, качество или условия сдачи
        продукции. Не анализируй подсудность, претензионный порядок или
        конфиденциальность — они проверяются отдельно.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. general_provisions_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по общим условиям.
           - "present" — если хотя бы одно из содержательных полей
             (contract_term_status, auto_renewal_status,
              vat_status, assignment_restriction_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contract_term_status = "not_defined";
           - auto_renewal_status = "not_defined";
           - vat_status = "not_defined";
           - assignment_restriction_status = "not_defined";
           - contract_term_details, vat_details,
             assignment_restriction_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. contract_term_status:
           - "defined" — если срок действия договора прямо указан;
           - "not_defined" — если не указан.

        2. contract_term_details:
           Срок действия договора (дата или привязка к сезону/урожаю).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. auto_renewal_status:
           - "defined" — если автоматическая пролонгация прямо указана;
           - "not_defined" — если не указана.

        4. vat_status:
           - "defined" — если налоговый режим прямо указан (с НДС / без НДС / ЕСХН);
           - "not_defined" — если не указан.

        5. vat_details:
           Налоговая оговорка.
           Правила:
           - ЕСХН / "не является плательщиком НДС" → фиксируй дословно;
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. assignment_restriction_status:
           - "defined" — если условие об уступке прав прямо указано;
           - "not_defined" — если не указано.

        7. assignment_restriction_details:
           Условие об уступке прав (с согласия / запрет / свободно).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни general_provisions_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - ЕСХН / "не является плательщиком НДС" → vat_details фиксируй дословно.
        - "На сезон 2026 года" / "до завершения уборочной кампании" →
          contract_term_details: фиксируй дословно.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока действия, ни пролонгации,
           ни налоговой оговорки, ни уступки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Договор регулируется законодательством Российской Федерации."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.9 — срок до 31.12.2026, в п.12 — до 31.12.2027.
           → presence = "unclear";
             contract_term_status = "not_defined";
             contract_term_details = "Не удалось определить".

        4. Полное раскрытие.
           "Договор действует до 31.12.2026. Производитель на ЕСХН.
           Уступка — только с письменного согласия другой стороны."
           → presence = "present";
             contract_term_status = "defined";
             vat_status = "defined";
             vat_details = "ЕСХН, не является плательщиком НДС";
             assignment_restriction_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для general_provisions_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

