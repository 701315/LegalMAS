        - Перед остальными полями заполни state_support_and_emergency_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни господдержки, ни ЧС, ни распределения, ни компенсаций.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны действуют в соответствии с законодательством РФ."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.10 — субсидия на производителя, в п.11 — на заготовителя.
           → presence = "unclear";
             support_allocation_status = "not_defined";
             support_allocation_details = "Не удалось определить".

        4. Полное раскрытие.
           "Стороны совместно подают документы на несвязанную поддержку.
           Субсидия распределяется пропорционально затратам.
           При ЧС — Постановление № 1528. Документы готовит производитель."
           → presence = "present";
             state_support_reference_status = "defined";
             support_allocation_status = "defined";
             emergency_procedure_status = "defined";
             emergency_documents_preparer_status = "defined";
             emergency_documents_preparer_code = "producer".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для state_support_and_emergency_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для emergency_documents_preparer_code используй только:
          "producer", "purchaser", "both", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "state_support_and_emergency_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по господдержке и ЧС. Внутреннее агрегатное signal-поле."
          required: true
        - name: "state_support_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на господдержку / субсидии."
          required: true
        - name: "state_support_reference_details"
          type: "string"
          presentation: "fact"
          label: "Господдержка"
          description: "Указание на получение государственной поддержки или субсидий."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "support_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения господдержки."
          required: true
        - name: "support_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Распределение господдержки"
          description: "Порядок распределения полученной господдержки между сторонами."
          required: false
          display_in_grid: false
        - name: "emergency_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка действий при режиме ЧС."
          required: true
        - name: "emergency_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Действия при ЧС"
          description: "Порядок действий сторон при введении режима ЧС в регионе."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "emergency_documents_preparer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения ответственного за подготовку документов для компенсации."
          required: true
        - name: "emergency_documents_preparer_code"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["producer", "purchaser", "both", "not_defined"]
          description: "Кто готовит документы для компенсации при ЧС."
          required: true
      store_payload: true

  - id: seed_production_compliance_check
    name: "Семеноводство: сортовые и карантинные сертификаты"
    description: >
      Фактографическая проверка наличия условий о сертификации семенного
      материала, карантинных сертификатах и записи в ФГИС «Зерно»
      (если применимо к предмету договора).
    triggers:
      any: ["seed_material"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "семенной материал"
        - "семена"
        - "сортовая чистота"
        - "сортовой сертификат"
        - "карантинный сертификат"
        - "ФГИС Зерно"
        - "реестр селекционных достижений"
        - "149-ФЗ"
        - "семеноводство"
        - "репродукция семян"
        - "посевные качества"
        - "всхожесть"
        - "энергия прорастания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)семенн[а-я]+\\s+материал"
        - "(?i)семен[а-я]+\\s+(сорт|качеств|репродукц)"
        - "(?i)сортов[а-я]+\\s+сертификат"
        - "(?i)карантинн[а-я]+\\s+сертификат"
        - "(?i)ФГИС\\s+Зерно"
        - "(?i)149-?ФЗ|149\\s+ФЗ"
        - "(?i)реестр[а-я]+\\s+селекционн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации. Если предметом договора
        является семенной материал с/х растений, применяются дополнительные
        требования ФЗ № 149-ФЗ «О семеноводстве» (с 01.09.2023).

        Проверяется только один вопрос: наличие условий о соблюдении
        требований семеноводства.

        Нормативный ориентир:
        - ФЗ № 149-ФЗ «О семеноводстве»
        - ФГИС «Зерно» (п. 8 ст. 14 ФЗ № 149-ФЗ)
        - Реестр селекционных достижений

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание, что предмет — семенной материал.
        2. Требование сортовых сертификатов / сертификатов сортовой чистоты.
        3. Требование карантинных сертификатов.
        4. Требование записи во ФГИС «Зерно».
        5. Требование соответствия реестру селекционных достижений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Если предмет договора не является семенным материалом —
           все *_status = "not_defined", non_seed_subject = "yes".
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — семенной материал, требования раскрыты:
        Фрагмент:
        "Предмет — семена озимой пшеницы сорта «Скипетр», 5-я репродукция.
        Поставщик передаёт сортовой сертификат и карантинный сертификат
        на каждую партию. Сведения о партиях вносятся во ФГИС «Зерно»
        в соответствии с 149-ФЗ. Сорт включён в реестр селекционных достижений."

        Ответ:
        {
          "seed_material_status": "defined",
          "seed_material_details": "семена озимой пшеницы сорта «Скипетр», 5-я репродукция",
          "varietal_certificate_status": "defined",
          "varietal_certificate_details": "сортовой сертификат на каждую партию",
          "quarantine_certificate_status": "defined",
          "quarantine_certificate_details": "карантинный сертификат на каждую партию",
          "fgis_zerno_status": "defined",
          "fgis_zerno_details": "внесение сведений в ФГИС «Зерно» согласно 149-ФЗ",
          "registry_compliance_status": "defined",
          "registry_compliance_details": "сорт включён в реестр селекционных достижений",
          "non_seed_subject": "no",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет — семена озимой пшеницы сорта «Скипетр», 5-я репродукция."
            }
          ]
        }

        Пример 2 — не семенной материал:
        Фрагмент:
        "Предмет — пшеница продовольственная 4 класса."

        Ответ:
        {
          "seed_material_status": "not_defined",
          "seed_material_details": "Данные не определены",
          "varietal_certificate_status": "not_defined",
          "varietal_certificate_details": "Данные не определены",
          "quarantine_certificate_status": "not_defined",
          "quarantine_certificate_details": "Данные не определены",
          "fgis_zerno_status": "not_defined",
          "fgis_zerno_details": "Данные не определены",
          "registry_compliance_status": "not_defined",
          "registry_compliance_details": "Данные не определены",
          "non_seed_subject": "yes",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Является ли предмет семенным материалом?
        2. Если нет — non_seed_subject = "yes", все остальные = "not_defined".
        3. Если да — есть ли требование сортового сертификата?
        4. Есть ли карантинный сертификат?
        5. Есть ли требование записи во ФГИС «Зерно»?
        6. Есть ли ссылка на реестр селекционных достижений?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "seed_material_status": "<defined / not_defined>",
          "seed_material_details": "<текст или 'Данные не определены'>",
          "varietal_certificate_status": "<defined / not_defined>",
          "varietal_certificate_details": "<текст или 'Данные не определены'>",
          "quarantine_certificate_status": "<defined / not_defined>",
          "quarantine_certificate_details": "<текст или 'Данные не определены'>",
          "fgis_zerno_status": "<defined / not_defined>",
          "fgis_zerno_details": "<текст или 'Данные не определены'>",
          "registry_compliance_status": "<defined / not_defined>",
          "registry_compliance_details": "<текст или 'Данные не определены'>",
          "non_seed_subject": "<yes / no>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "семенной материал семена сортовая чистота сортовой сертификат карантинный сертификат ФГИС Зерно реестр селекционных достижений 149-ФЗ семеноводство репродукция семян посевные качества всхожесть энергия прорастания"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
        - procedures
      negative_keywords:
        - "цена"
        - "оплата"
        - "аванс"
        - "срок сдачи"
        - "риск гибели"
        - "хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "seed_production_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        сведения о соблюдении требований семеноводства (если предмет —
        семенной материал).
        Анализируй только эту тему.
        Не анализируй цену, качество в общем смысле, сроки или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. seed_production_compliance_check_presence:
           Агрегатное signal-поле — наличие регулирования по семеноводству.
           - "present" — если хотя бы одно из содержательных полей
             (seed_material_status, varietal_certificate_status,
              quarantine_certificate_status, fgis_zerno_status,
              registry_compliance_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - seed_material_status = "not_defined";
           - varietal_certificate_status = "not_defined";
           - quarantine_certificate_status = "not_defined";
           - fgis_zerno_status = "not_defined";
           - registry_compliance_status = "not_defined";
           - seed_material_details, varietal_certificate_details,
             quarantine_certificate_details, fgis_zerno_details,
             registry_compliance_details = "Данные не определены";
           - non_seed_subject = "yes";
           - не выполняй остальные шаги.

        1. seed_material_status:
           - "defined" — если предметом договора прямо указан
             семенной материал;
           - "not_defined" — если предмет не является семенным материалом.

        2. seed_material_details:
           Описание семенного материала.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. varietal_certificate_status:
           - "defined" — если прямо требуется сортовой сертификат
             (сертификат сортовой чистоты);
           - "not_defined" — если не требуется.

        4. varietal_certificate_details:
           Требования к сортовому сертификату.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. quarantine_certificate_status:
           - "defined" — если прямо требуется карантинный сертификат;
           - "not_defined" — если не требуется.

        6. quarantine_certificate_details:
           Требования к карантинному сертификату.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. fgis_zerno_status:
           - "defined" — если прямо требуется внесение сведений
             во ФГИС «Зерно»;
           - "not_defined" — если не требуется.

        8. fgis_zerno_details:
           Требования по ФГИС «Зерно».
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. registry_compliance_status:
           - "defined" — если прямо указано соответствие реестру
             селекционных достижений;
           - "not_defined" — если не указано.

        10. registry_compliance_details:
            Требования по реестру селекционных достижений.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        11. non_seed_subject:
            - "yes" — если предмет не является семенным материалом;
            - "no" — если является.
        </task>

        <context_rules>
        - Перед остальными полями заполни seed_production_compliance_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены",
          non_seed_subject = "yes".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет семенного материала.
           → presence = "missing";
             все *_status = "not_defined";
             non_seed_subject = "yes".

        2. Предмет — семена, но без требований.
           "Предмет — семена пшеницы."
           → presence = "present";
             seed_material_status = "defined";
             varietal_certificate_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.1 — семена, в п.5 — продовольственное зерно.
           → presence = "unclear";
             seed_material_status = "not_defined";
             seed_material_details = "Не удалось определить";
             non_seed_subject = "yes".

        4. Полное раскрытие.
           "Предмет — семена озимой пшеницы, сорт в реестре.
           Сортовой сертификат и карантинный на каждую партию.
           Сведения в ФГИС «Зерно»."
           → presence = "present";
             seed_material_status = "defined";
             varietal_certificate_status = "defined";
             quarantine_certificate_status = "defined";
             fgis_zerno_status = "defined";
             registry_compliance_status = "defined";
             non_seed_subject = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для seed_production_compliance_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
