  - id: packaging_transport_compensation_check
    name: "Компенсация расходов на тару и транспорт (ст. 536 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий о компенсации расходов
      производителя на тару и транспорт, если они возложены на него
      договором (отступление от диспозитивной нормы ст. 536 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возмещение расходов на тару"
        - "возмещение транспортных расходов"
        - "компенсация расходов"
        - "компенсация затрат"
        - "тара за счёт производителя"
        - "транспорт за счёт производителя"
        - "возмещение стоимости тары"
        - "компенсация за тару"
        - "стоимость доставки компенсируется"
        - "включение в цену продукции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возмещени[ея].*расход.*тар"
        - "(?i)возмещени[ея].*транспортн"
        - "(?i)компенсаци[яи].*расход"
        - "(?i)за\\s+сч[её]т\\s+производител.*тар"
        - "(?i)включ.*в\\s+цену.*тары"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: предусмотрена ли в договоре
        компенсация расходов производителя на тару и транспорт,
        если эти расходы возложены на производителя.

        Нормативный ориентир:
        - ст. 536 ГК РФ (обязанности заготовителя; диспозитивная норма:
          по умолчанию тару и транспорт обеспечивает заготовитель)

        Важно:
        - Если договор отступает от диспозитивной нормы и возлагает
          тару/транспорт на производителя, должна быть предусмотрена
          компенсация расходов.
        - Если тара/транспорт на заготовителе — компенсация не требуется.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто обеспечивает тару и транспорт (заготовитель / производитель).
        2. Предусмотрена ли компенсация расходов производителю.
        3. Механизм компенсации (отдельный платёж / зачёт в цену).
        4. Размер компенсации (формула, ставка, порядок расчёта).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — расходы на производителе с компенсацией:
        Фрагмент:
        "Тара и транспортировка продукции обеспечиваются Производителем.
        Стоимость тары компенсируется Заготовителем по фактическим расходам
        на основании подтверждающих документов. Транспортные расходы
        включаются в закупочную цену продукции и не подлежат отдельной оплате."

        Ответ:
        {
          "packaging_bearer_status": "defined",
          "packaging_bearer_code": "producer",
          "transport_bearer_status": "defined",
          "transport_bearer_code": "producer",
          "compensation_required_status": "defined",
          "compensation_required_details": "производитель несёт расходы, заготовитель компенсирует",
          "compensation_mechanism_status": "defined",
          "compensation_mechanism_code": "offset_against_price",
          "compensation_mechanism_details": "стоимость тары — по факту; транспорт — включён в цену",
          "compensation_amount_status": "defined",
          "compensation_amount_details": "тара — по фактическим расходам; транспорт — включён в цену",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Тара и транспортировка продукции обеспечиваются Производителем. Стоимость тары компенсируется Заготовителем по фактическим расходам на основании подтверждающих документов."
            }
          ]
        }

        Пример 2 — расходы на производителе без компенсации:
        Фрагмент:
        "Тара и транспортировка обеспечиваются Производителем за его счёт."

        Ответ:
        {
          "packaging_bearer_status": "defined",
          "packaging_bearer_code": "producer",
          "transport_bearer_status": "defined",
          "transport_bearer_code": "producer",
          "compensation_required_status": "not_defined",
          "compensation_required_details": "Данные не определены",
          "compensation_mechanism_status": "not_defined",
          "compensation_mechanism_code": "not_defined",
          "compensation_mechanism_details": "Данные не определены",
          "compensation_amount_status": "not_defined",
          "compensation_amount_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Тара и транспортировка обеспечиваются Производителем за его счёт."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Кто обеспечивает тару и транспорт?
        2. Если производитель — есть ли компенсация расходов?
        3. Какой механизм компенсации (отдельный платёж / зачёт в цену)?
        4. Указан ли размер компенсации?
        5. Если компенсации нет и расходы на производителе — зафиксируй это.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "packaging_bearer_status": "<defined / not_defined>",
          "packaging_bearer_code": "<producer / purchaser / not_defined>",
          "transport_bearer_status": "<defined / not_defined>",
          "transport_bearer_code": "<producer / purchaser / shared / not_defined>",
          "compensation_required_status": "<defined / not_defined>",
          "compensation_required_details": "<текст или 'Данные не определены'>",
          "compensation_mechanism_status": "<defined / not_defined>",
          "compensation_mechanism_code": "<separate_payment / offset_against_price / mixed / not_defined>",
          "compensation_mechanism_details": "<текст или 'Данные не определены'>",
          "compensation_amount_status": "<defined / not_defined>",
          "compensation_amount_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возмещение расходов на тару возмещение транспортных расходов компенсация расходов компенсация затрат тара за счёт производителя транспорт за счёт производителя возмещение стоимости тары компенсация за тару стоимость доставки компенсируется включение в цену продукции ст. 536 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "цена продукции"
        - "аванс производителю"
        - "срок сдачи"
        - "качество"
        - "риск гибели"
        - "ответственное хранение"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "packaging_transport_compensation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        сведения о том, кто обеспечивает тару и транспорт, предусмотрена ли
        компенсация расходов производителю и каков механизм компенсации.
        Не анализируй цену продукции, качество, риск гибели или иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. packaging_transport_compensation_check_presence:
           Агрегатное signal-поле — наличие регулирования по таре,
           транспорту и их компенсации.
           - "present" — если хотя бы одно из содержательных полей
             (packaging_bearer_status, transport_bearer_status,
              compensation_required_status,
              compensation_mechanism_status,
              compensation_amount_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - packaging_bearer_code = "not_defined";
           - transport_bearer_code = "not_defined";
           - compensation_mechanism_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. packaging_bearer_status:
           - "defined" — если прямо указано, кто обеспечивает тару;
           - "not_defined" — если не указано.

        2. packaging_bearer_code:
           - "producer" / "purchaser" / "not_defined".

        3. transport_bearer_status:
           - "defined" — если прямо указано, кто обеспечивает транспорт;
           - "not_defined" — если не указано.

        4. transport_bearer_code:
           - "producer" / "purchaser" / "shared" / "not_defined".

        5. compensation_required_status:
           - "defined" — если прямо указано, что расходы производителя
             на тару/транспорт компенсируются;
           - "not_defined" — если не указано.

        6. compensation_required_details:
           Условие о компенсации.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. compensation_mechanism_status:
           - "defined" — если прямо указан механизм компенсации;
           - "not_defined" — если не указан.

        8. compensation_mechanism_code:
           - "separate_payment" — отдельным платежом;
           - "offset_against_price" — зачётом в цену продукции;
           - "mixed" — комбинация;
           - "not_defined" — не указан.

        9. compensation_mechanism_details:
           Описание механизма компенсации.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        10. compensation_amount_status:
            - "defined" — если прямо указан размер компенсации;
            - "not_defined" — если не указан.

        11. compensation_amount_details:
            Размер компенсации.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни packaging_transport_compensation_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни тары, ни транспорта, ни компенсации.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Тару обеспечивает производитель без компенсации.
           "Тара обеспечивается Производителем за его счёт."
           → presence = "present";
             packaging_bearer_status = "defined";
             packaging_bearer_code = "producer";
             compensation_required_status = "not_defined".

        3. Противоречие между фрагментами.
           В п.3 — тара на производителе, в п.7 — тара на заготовителе.
           → presence = "unclear";
             packaging_bearer_status = "not_defined";
             packaging_bearer_code = "not_defined".

        4. Полное раскрытие с компенсацией.
           "Тара и транспорт — за счёт Производителя. Стоимость тары
           компенсируется Заготовителем по фактическим расходам.
           Транспортные расходы включаются в закупочную цену."
           → presence = "present";
