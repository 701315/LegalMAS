        - "отказ от приёмки"
        - "необоснованный отказ"
        - "уклонение от приёмки"
        - "неустойка за отказ"
        - "просрочка оплаты"
        - "неустойка за просрочку оплаты"
        - "проценты за пользование"
        - "ст. 395"
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "возврат аванса"
        - "существенное нарушение"
      keyword_mode: "any"
