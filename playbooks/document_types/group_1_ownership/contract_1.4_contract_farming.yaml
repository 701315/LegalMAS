      keyword_mode: "any"
      regex_patterns:
        - "(?i)юридическ[а-я]+\\s+значим[а-я]+\\s+сообщен"
        - "(?i)адрес[а-я]*\\s+для\\s+уведомлен"
        - "(?i)электронн[а-я]+\\s+документооборот"
        - "(?i)оператор[а-я]*\\s+ЭДО"
