# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_authority_cluster
    name: "Стороны контрактации: идентификация, реквизиты и полномочия"
    description: >
      Фактографическая проверка наличия в договоре данных о производителе
      и заготовителе — реквизиты, тип производителя (КФХ/ИП/юрлицо),
      подписанты и документы, подтверждающие полномочия.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "производитель"
        - "заготовитель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "КФХ"
        - "крестьянское фермерское хозяйство"
        - "глава КФХ"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(производитель|заготовитель).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 432, 535 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, их реквизиты и
        полномочия подписантов.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Производитель (наименование, реквизиты).
        2. Кто указан как Заготовитель (наименование, реквизиты).
        3. Тип производителя (КФХ / ИП / юридическое лицо / физическое лицо).
        4. Кто подписывает договор от каждой стороны.
        5. На каком основании действует подписант от каждой стороны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "not_defined" или строго
           "Данные не определены".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель: Глава КФХ Иванов П.П., ОГРНИП 312770000000001,
        ИНН 770000000001. Заготовитель: ООО «Агро», ИНН 7700000002,
        ОГРН 1027700000002, в лице Генерального директора Петрова С.С.,
        действующего на основании Устава."

        Ответ:
        {
          "producer_details_status": "defined",
          "producer_details": "Глава КФХ Иванов П.П., ОГРНИП 312770000000001, ИНН 770000000001",
          "producer_type": "kfh",
          "producer_signatory": "Иванов П.П.",
          "producer_signatory_basis": "kfh_head",
          "purchaser_details_status": "defined",
          "purchaser_details": "ООО «Агро», ИНН 7700000002, ОГРН 1027700000002",
          "purchaser_signatory": "Генеральный директор Петров С.С.",
          "purchaser_signatory_basis": "charter",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Производитель: Глава КФХ Иванов П.П., ОГРНИП 312770000000001, ИНН 770000000001."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между производителем и заготовителем."

        Ответ:
        {
          "producer_details_status": "not_defined",
          "producer_details": "Данные не определены",
          "producer_type": "not_defined",
          "producer_signatory": "Данные не определены",
          "producer_signatory_basis": "not_defined",
          "purchaser_details_status": "not_defined",
          "purchaser_details": "Данные не определены",
          "purchaser_signatory": "Данные не определены",
          "purchaser_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата с наименованием и ИНН/ОГРН/ОГРНИП производителя?
        2. Есть ли прямая цитата с наименованием и ИНН/ОГРН заготовителя?
        3. Указан ли конкретный тип производителя (КФХ / ИП / юрлицо)?
        4. Указан ли конкретный подписант и документ-основание?
        5. Если прямого текста нет — "not_defined" и "Данные не определены".
        6. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "producer_details_status": "<defined / not_defined>",
          "producer_details": "<реквизиты или 'Данные не определены'>",
          "producer_type": "<legal_entity / individual_entrepreneur / kfh / individual / not_defined>",
          "producer_signatory": "<ФИО или 'Данные не определены'>",
          "producer_signatory_basis": "<charter / poa / order / kfh_head / other / not_defined>",
          "purchaser_details_status": "<defined / not_defined>",
          "purchaser_details": "<реквизиты или 'Данные не определены'>",
          "purchaser_signatory": "<ФИО или 'Данные не определены'>",
          "purchaser_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "производитель"
        - "заготовитель"
        - "именуем"
        - "ИНН"
        - "ОГРН"
        - "действующий на основании"
        - "КФХ"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "producer_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Производитель прямо определён с реквизитами. Иначе 'not_defined'."
        - name: "producer_details"
          type: "string"
          description: "Реквизиты Производителя. Если нет — строго 'Данные не определены'."
        - name: "producer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "kfh", "individual", "not_defined"]
          description: "Тип производителя."
        - name: "producer_signatory"
          type: "string"
          description: "Подписант от Производителя. Если нет — строго 'Данные не определены'."
        - name: "producer_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "kfh_head", "other", "not_defined"]
          description: "Основание полномочий подписанта Производителя."
        - name: "purchaser_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Заготовитель прямо определён с реквизитами. Иначе 'not_defined'."
        - name: "purchaser_details"
          type: "string"
          description: "Реквизиты Заготовителя. Если нет — строго 'Данные не определены'."
        - name: "purchaser_signatory"
          type: "string"
          description: "Подписант от Заготовителя. Если нет — строго 'Данные не определены'."
        - name: "purchaser_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Заготовителя."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет, количество, цена и оплата
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_price_payment_cluster
    name: "Предмет, количество, цена и порядок расчётов"
    description: >
      Фактографическая проверка наличия в договоре предмета (вид и наименование
      продукции), количества, цены, механизма пересмотра цены и порядка расчётов.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование продукции"
        - "вид продукции"
        - "количество"
        - "объём поставки"
        - "сельскохозяйственная продукция"
        - "выращенная продукция"
        - "цена"
        - "стоимость"
        - "цена за тонну"
        - "цена за килограмм"
        - "рублей"
        - "рыночная цена"
        - "оплата"
        - "срок оплаты"
        - "после приёмки"
        - "авансирование"
        - "предоплата"
        - "аванс"
        - "корректировка цены"
        - "пересмотр цены"
        - "индексация"
        - "биржевые котировки"
        - "НДС"
        - "ЕСХН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s,.]*(?:тонн|кг|центнер|литр|л\\b|ц\\b|т\\b)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)за\\s+(?:тонну|кг|центнер|литр)"
        - "(?i)оплат(а|ы).*?(после|в\\s+течение)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)(корректировк|пересмотр|изменени|индексаци)(а|е|и|я)\\s+цен"
        - "(?i)биржев(ая|ой|ых)\\s+(цен|котировк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 535, 424, 455, 485-487 ГК РФ).
        Проверяется только один вопрос: предмет договора, количество продукции,
        цена и порядок расчётов, авансирование производителя.

        Важно:
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист сравнивает несколько договоров — нужна чёткая таблица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и вид сельскохозяйственной продукции.
        2. Количество продукции с единицей измерения.
        3. Цена за единицу продукции.
        4. Налоговая оговорка (НДС включён / без НДС / ЕСХН).
        5. Механизм изменения/пересмотра цены.
        6. Срок оплаты после приёмки.
        7. Наличие авансирования (предоплаты) производителя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязуется вырастить и передать пшеницу продовольственную
        4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС
        (производитель применяет ЕСХН). Оплата — в течение 5 рабочих дней
        после приёмки. Заготовитель выплачивает аванс в размере 30%
        от стоимости договора не позднее 1 апреля 2026 г."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "пшеница продовольственная 4 класса",
          "quantity_status": "defined",
          "quantity_details": "200 тонн",
          "price_status": "defined",
          "price_details": "18 000 рублей за тонну",
          "vat_status": "defined",
          "vat_details": "без НДС, ЕСХН",
          "price_change_mechanism_status": "not_defined",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 5 рабочих дней после приёмки",
          "advance_status": "defined",
          "advance_details": "30% от стоимости договора не позднее 1 апреля 2026 г.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Производитель обязуется вырастить и передать пшеницу продовольственную 4 класса в количестве 200 тонн. Цена: 18 000 рублей за тонну без НДС."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Условия сделки будут определены дополнительным соглашением."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "price_change_mechanism_status": "not_defined",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "advance_status": "not_defined",
          "advance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное наименование продукции (не просто "сельхозпродукция")?
        2. Указано ли количество числом с единицей?
        3. Указана ли цена за единицу конкретной суммой?
        4. Указано ли явно: с НДС / без НДС / ЕСХН?
        5. Есть ли механизм пересмотра цены (индексация, привязка к бирже)?
        6. Указан ли конкретный срок оплаты?
        7. Есть ли условие об авансе с размером и сроком?
        8. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subject_status": "<defined / not_defined>",
          "subject_details": "<наименование или 'Данные не определены'>",
          "quantity_status": "<defined / not_defined>",
          "quantity_details": "<количество с единицей или 'Данные не определены'>",
          "price_status": "<defined / not_defined>",
          "price_details": "<цена или 'Данные не определены'>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<с НДС / без НДС / ЕСХН или 'Данные не определены'>",
          "price_change_mechanism_status": "<defined / not_defined>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "advance_status": "<defined / not_defined>",
          "advance_details": "<условия аванса или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "наименование продукции"
        - "количество"
        - "цена"
        - "стоимость"
        - "оплата"
        - "аванс"
        - "предоплата"
        - "НДС"
        - "ЕСХН"
        - "пересмотр цены"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "subject_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если предмет (продукция) прямо определён. Иначе 'not_defined'."
        - name: "subject_details"
          type: "string"
          description: "Наименование продукции. Если нет — строго 'Данные не определены'."
        - name: "quantity_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если количество прямо определено. Иначе 'not_defined'."
        - name: "quantity_details"
          type: "string"
          description: "Количество с единицей. Если нет — строго 'Данные не определены'."
        - name: "price_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если цена прямо определена. Иначе 'not_defined'."
        - name: "price_details"
          type: "string"
          description: "Цена за единицу. Если нет — строго 'Данные не определены'."
        - name: "vat_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если НДС/ЕСХН прямо оговорены. Иначе 'not_defined'."
        - name: "vat_details"
          type: "string"
          description: "Налоговая оговорка. Если нет — строго 'Данные не определены'."
        - name: "price_change_mechanism_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если механизм изменения цены прямо определён. Иначе 'not_defined'."
        - name: "payment_deadline_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
