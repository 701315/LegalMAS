          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Производитель обязуется вырастить и сдать молоко коровье цельное в количестве 500 тонн, соответствующее ГОСТ 31449-2013."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Производитель сдаёт сельскохозяйственную продукцию заготовителю."

        Ответ:
        {
          "product_name_status": "not_defined",
          "product_name": "Данные не определены",
          "product_kind": "not_defined",
          "quantity_status": "not_defined",
          "quantity": "Данные не определены",
          "quality_standard_status": "not_defined",
          "quality_standard": "Данные не определены",
