             tax_regime_representations_status = "not_defined";
             tax_regime_representations_details = "Не удалось определить".

        4. Полное раскрытие.
           "Заверение ОСНО. Добросовестный налогоплательщик.
           Отсутствие банкротства. Возмещение потерь при доначислении.
