          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения неустойки за просрочку оплаты."
          required: false
        - name: "purchaser_late_payment_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку оплаты"
          description: "Ставка неустойки заготовителя за просрочку оплаты."
          required: false
          display_in_grid: false
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
