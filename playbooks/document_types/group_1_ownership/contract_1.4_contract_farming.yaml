  - id: quality_safety_claims_cluster
    name: "Качество, безопасность, ветеринария/фитосанитария и претензии"
    description: >
      Фактографическая проверка наличия требований к качеству продукции,
      ссылок на стандарты, ветеринарных/фитосанитарных документов,
      порядка приёмки по качеству и претензионного механизма.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество продукции"
        - "требования к качеству"
        - "стандарты качества"
        - "соответствие ГОСТ"
        - "технические условия"
        - "параметры качества"
        - "сертификат качества"
        - "декларация соответствия"
        - "лабораторный анализ"
        - "влажность"
        - "сорность"
        - "жирность"
        - "кислотность"
        - "пестициды"
        - "ПДК"
        - "безопасность продукции"
        - "ТР ТС"
        - "ветеринарный сертификат"
        - "ВСД"
        - "Меркурий"
        - "фитосанитарный сертификат"
        - "Россельхознадзор"
        - "экспертиза качества"
        - "рекламация"
        - "арбитражный образец"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:ГОСТ|ТУ|СТО|ОСТ)\\s*[\\d\\s.-]+\\b"
        - "(?i)продукция.*должна.*соответствовать"
        - "(?i)ТР\\s+ТС"
        - "(?i)\\bПДК\\b"
        - "(?i)пестицид|гербицид|нитрат"
        - "(?i)ветеринарн(ый|ое|ого)\\s+(сертификат|свидетельств)"
        - "(?i)фитосанитарн(ый|ого)\\s+сертификат"
        - "(?i)экспертиз(а|у|ы)\\s+качеств"
        - "(?i)рекламац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 469-475, 536 ГК РФ).
        Проверяется только один вопрос: требования к качеству продукции,
        документы о безопасности, ветеринарные и фитосанитарные документы,
        механизм разрешения споров о качестве.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Стандарт качества (ГОСТ/ТУ или иной).
        2. Конкретные параметры качества (влажность, сорность, жирность и т.д.).
        3. Ссылку на технические регламенты (ТР ТС).
        4. Требование ветеринарных документов (ВСД через ФГИС «Меркурий»).
        5. Требование фитосанитарных документов.
        6. Порядок определения качества при приёмке (лаборатория, отбор проб).
        7. Срок предъявления претензий по качеству.
        8. Механизм разрешения споров о качестве (экспертиза, арбитражный образец).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Зерно должно соответствовать ГОСТ 9353-2016. Влажность — не более 14%,
        сорность — не более 2%. Декларация соответствия ТР ТС 015/2011
        предоставляется с каждой партией. Претензии по качеству предъявляются
        в течение 5 рабочих дней с момента приёмки. При разногласиях — независимая
        экспертиза аккредитованной лаборатории, расходы — на проигравшую сторону."

        Ответ:
        {
          "quality_standard_status": "defined",
          "quality_standard_details": "ГОСТ 9353-2016",
          "quality_parameters_status": "defined",
          "quality_parameters_details": "влажность не более 14%, сорность не более 2%",
          "tr_ts_status": "defined",
          "tr_ts_details": "ТР ТС 015/2011",
          "veterinary_docs_status": "not_defined",
          "phytosanitary_docs_status": "not_defined",
          "quality_check_procedure_status": "not_defined",
          "quality_check_procedure_details": "Данные не определены",
          "claims_period_status": "defined",
          "claims_period_details": "5 рабочих дней с момента приёмки",
          "dispute_mechanism_status": "defined",
          "dispute_mechanism_details": "независимая экспертиза аккредитованной лаборатории",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Зерно должно соответствовать ГОСТ 9353-2016. Влажность — не более 14%, сорность — не более 2%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продукция должна быть надлежащего качества."

        Ответ:
        {
          "quality_standard_status": "not_defined",
          "quality_standard_details": "Данные не определены",
          "quality_parameters_status": "not_defined",
          "quality_parameters_details": "Данные не определены",
          "tr_ts_status": "not_defined",
          "tr_ts_details": "Данные не определены",
          "veterinary_docs_status": "not_defined",
          "phytosanitary_docs_status": "not_defined",
          "quality_check_procedure_status": "not_defined",
          "quality_check_procedure_details": "Данные не определены",
          "claims_period_status": "not_defined",
          "claims_period_details": "Данные не определены",
          "dispute_mechanism_status": "not_defined",
          "dispute_mechanism_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли ссылка на конкретный ГОСТ/ТУ (не просто "качество")?
        2. Перечислены ли конкретные параметры числами?
        3. Упомянуты ли конкретные ТР ТС?
        4. Требуются ли ВСД / Меркурий?
        5. Требуется ли фитосанитарный сертификат?
        6. Описан ли порядок отбора проб или лабораторного контроля?
        7. Указан ли конкретный срок претензий по качеству?
        8. Описан ли механизм спора (экспертиза, арбитражный образец)?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "quality_standard_status": "<defined / not_defined>",
          "quality_standard_details": "<ГОСТ/ТУ или 'Данные не определены'>",
          "quality_parameters_status": "<defined / not_defined>",
          "quality_parameters_details": "<параметры или 'Данные не определены'>",
          "tr_ts_status": "<defined / not_defined>",
          "tr_ts_details": "<ТР ТС или 'Данные не определены'>",
          "veterinary_docs_status": "<defined / not_defined>",
          "phytosanitary_docs_status": "<defined / not_defined>",
          "quality_check_procedure_status": "<defined / not_defined>",
          "quality_check_procedure_details": "<текст или 'Данные не определены'>",
          "claims_period_status": "<defined / not_defined>",
          "claims_period_details": "<срок или 'Данные не определены'>",
          "dispute_mechanism_status": "<defined / not_defined>",
          "dispute_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "качество продукции требования к качеству стандарты качества соответствие ГОСТ технические условия параметры качества сертификат качества декларация соответствия лабораторный анализ влажность сорность жирность кислотность пестициды ПДК безопасность продукции ТР ТС ветеринарный сертификат ВСД Меркурий фитосанитарный сертификат Россельхознадзор экспертиза качества рекламация арбитражный образец"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - procedures
      negative_keywords:
        - "срок сдачи"
        - "место приёмки"
        - "пункт приёмки"
        - "ТТН"
        - "акт приёмки при передаче"
        - "транспорт"
        - "тара"
        - "самовывоз"
        - "обязан принять"
        - "вывоз продукции"
        - "цена"
        - "оплата"
        - "аванс"
        - "риск гибели"
        - "хранение до вывоза"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "quality_safety_claims_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        требования к качеству продукции, стандарты, параметры, ветеринарные и
        фитосанитарные документы, порядок приёмки по качеству и механизм
        разрешения претензий.
        Не анализируй цену, сроки сдачи, транспорт, ответственность или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. quality_safety_claims_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по качеству,
           безопасности и претензиям.
           - "present" — если хотя бы одно из содержательных полей
             (quality_standard_status, quality_parameters_status,
              tr_ts_status, veterinary_docs_status,
              phytosanitary_docs_status,
              quality_check_procedure_status,
              claims_period_status, dispute_mechanism_status)
             ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - quality_standard_details, quality_parameters_details,
             tr_ts_details, quality_check_procedure_details,
             claims_period_details, dispute_mechanism_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. quality_standard_status:
           - "defined" — если стандарт качества (ГОСТ/ТУ) прямо указан;
           - "not_defined" — если не указан.

        2. quality_standard_details:
           Стандарт качества (ГОСТ, ТУ, ОСТ и т.п.).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. quality_parameters_status:
           - "defined" — если конкретные параметры качества прямо указаны;
           - "not_defined" — если не указаны.

        4. quality_parameters_details:
           Конкретные параметры (влажность, сорность, жирность и т.п.).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. tr_ts_status:
           - "defined" — если прямо указан ТР ТС с номером;
           - "not_defined" — если не указан.

        6. tr_ts_details:
           Технический регламент (ТР ТС с номером).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. veterinary_docs_status:
           - "defined" — если прямо требуются ветеринарные документы
             (ВСД, Меркурий, ветсвидетельство);
           - "not_defined" — если не требуются.

        8. phytosanitary_docs_status:
           - "defined" — если прямо требуется фитосанитарный сертификат
             или иное заключение Россельхознадзора;
           - "not_defined" — если не требуется.

        9. quality_check_procedure_status:
           - "defined" — если прямо описан порядок определения качества
             при приёмке (лаборатория, отбор проб);
           - "not_defined" — если не описан.

        10. quality_check_procedure_details:
            Порядок лабораторного контроля или отбора проб.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        11. claims_period_status:
            - "defined" — если срок претензий по качеству прямо указан;
            - "not_defined" — если не указан.

        12. claims_period_details:
            Срок предъявления претензий по качеству.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        13. dispute_mechanism_status:
            - "defined" — если прямо указан механизм разрешения споров
              о качестве (экспертиза, арбитражный образец);
            - "not_defined" — если не указан.

        14. dispute_mechanism_details:
            Механизм разрешения споров о качестве.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_safety_claims_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо фактов договора.
        - Не делай предположений.
        - ВСД / Меркурий / ветсвидетельство → veterinary_docs_status: "defined".
        - Фитосанитарный сертификат / Россельхознадзор → phytosanitary_docs_status: "defined".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни стандарта, ни параметров, ни ТР ТС,
           ни ветеринарных/фитосанитарных документов,
           ни порядка контроля качества, ни претензий.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Продукция должна быть надлежащего качества."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.4 — ГОСТ 9353-2016, в приложении — ГОСТ 10846-91.
           → presence = "unclear";
             quality_standard_status = "not_defined";
             quality_standard_details = "Не удалось определить".

        4. Полное раскрытие.
           "Зерно соответствует ГОСТ 9353-2016. Влажность ≤ 14%,
           сорность ≤ 2%. ТР ТС 015/2011. ВСД через Меркурий.
           Претензии — 5 рабочих дней. Экспертиза аккредитованной лаборатории."
           → presence = "present";
             quality_standard_status = "defined";
             quality_parameters_status = "defined";
             tr_ts_status = "defined";
             veterinary_docs_status = "defined";
             claims_period_status = "defined";
             dispute_mechanism_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_safety_claims_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_safety_claims_cluster_presence"
