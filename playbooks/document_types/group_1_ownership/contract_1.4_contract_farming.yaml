      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора контрактации
        условия об ответственности сторон (виновная или безвиновная для
        производителя), размерах неустоек, основаниях расторжения и условиях
        возврата аванса.
        Не анализируй качество продукции, сроки сдачи, форс-мажор или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. producer_liability_type_status — "defined" или "not_defined".
        2. producer_liability_type_code — одно из: fault_based / strict_liability / not_defined.
           fault_based = "при наличии вины". strict_liability = "независимо от вины".
        3. violation_of_art_538 — "yes" если в договоре прямо установлена безвиновная
           ответственность производителя (нарушение ст. 538 ГК РФ). Иначе "no".
        4. producer_delivery_penalty_status — "defined" или "not_defined".
        5. producer_delivery_penalty_details — ставка и база неустойки за просрочку сдачи.
        6. purchaser_non_acceptance_penalty_status — "defined" или "not_defined".
        7. purchaser_non_acceptance_penalty_details — условия ответственности за отказ от приёмки.
        8. purchaser_late_payment_penalty_status — "defined" или "not_defined".
        9. purchaser_late_payment_penalty_details — ставка неустойки за просрочку оплаты.
        10. termination_grounds_status — "defined" или "not_defined".
        11. termination_grounds_details — основания расторжения договора.
        12. advance_return_on_termination_status — "defined" или "not_defined".
        13. advance_return_on_termination_details — условия и срок возврата аванса при расторжении.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - violation_of_art_538 = "yes" только если буквально написано
          "независимо от вины" применительно к производителю.
        - Не выводи тип ответственности из косвенных признаков.
        - Пиши кратко. Верни только JSON.
        </rules>
      fields:
        - name: "producer_liability_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения характера ответственности производителя."
