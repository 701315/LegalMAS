        - "section"
      required_kind: "legal_unit"
      retrieval_query: "юридически значимое сообщение адрес для уведомлений адрес электронной почты электронный документооборот ЭДО электронная подпись электронная цифровая подпись ЭЦП квалифицированная электронная подпись оператор ЭДО Диадок СБИС признание юридической силы момент получения сообщения"
      preferred_unit_types:
