  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Специальная форс-мажорная оговорка для с/х
  # ──────────────────────────────────────────────────────────────────────────
  - id: agricultural_force_majeure_check
    name: "Специальная форс-мажорная оговорка для с/х производства"
    description: >
      Фактографическая проверка наличия форс-мажорной оговорки с учётом специфики
      сельскохозяйственного производства — перечень с/х рисков, уведомление,
      доказательства, последствия для обязательств.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неблагоприятные погодные условия"
        - "засуха"
        - "наводнение"
        - "заморозки"
        - "град"
        - "эпидемии"
        - "эпизоотия"
        - "нашествие вредителей"
        - "стихийные бедствия"
        - "гибель урожая"
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождается от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)производитель.*освобождается.*ответственности"
        - "(?i)обстоятельств(а|ами)\\s+непреодолимой\\s+силы"
        - "(?i)форс[\\s-]?мажор"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции
        (§ 5 Главы 30 ГК РФ, ст. 538, 401, 416 ГК РФ).
        Проверяется только один вопрос: наличие форс-мажорной оговорки
        с учётом специфики сельскохозяйственного производства.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие форс-мажорной оговорки (полная / только общая формулировка / отсутствует).
        2. Перечислены ли конкретные с/х риски (засуха, заморозки, эпизоотия и т.д.).
        3. Порядок уведомления о форс-мажоре.
        4. Требуемые доказательства (ТПП, Гидрометцентр, Россельхознадзор).
        5. Последствия для обязательств (отсрочка / уменьшение объёма / прекращение).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_specified", пустые строки.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка:
        Фрагмент:
        "Производитель освобождается от ответственности при наступлении
        обстоятельств непреодолимой силы, в том числе: засуха, наводнение,
        заморозки в вегетационный период, градобой, эпизоотия, нашествие
        вредителей. Производитель уведомляет Заготовителя в течение 5 дней
        с приложением справки Гидрометцентра или ТПП. В зависимости от масштаба
        ущерба стороны пересчитывают объём или переносят сроки сдачи."

        Ответ:
        {
          "force_majeure_status": "defined",
          "force_majeure_type": "agricultural_specific",
          "specific_events_status": "defined",
          "specific_events_details": "засуха, наводнение, заморозки, градобой, эпизоотия, нашествие вредителей",
          "notification_status": "defined",
          "notification_details": "в течение 5 дней",
          "proof_requirements_status": "defined",
          "proof_requirements_details": "справка Гидрометцентра или ТПП",
          "consequences_status": "defined",
          "consequences_details": "пересчёт объёма или перенос сроков",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Производитель освобождается от ответственности при наступлении обстоятельств непреодолимой силы, в том числе: засуха, наводнение, заморозки в вегетационный период, градобой, эпизоотия, нашествие вредителей."
            }
          ]
        }

        Пример 2 — только общая формулировка:
        Фрагмент:
        "Стороны освобождаются от ответственности при форс-мажоре."

        Ответ:
        {
          "force_majeure_status": "defined",
          "force_majeure_type": "general_only",
          "specific_events_status": "not_defined",
          "specific_events_details": "Данные не определены",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "proof_requirements_status": "not_defined",
          "proof_requirements_details": "Данные не определены",
          "consequences_status": "not_defined",
          "consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны освобождаются от ответственности при форс-мажоре."
            }
          ]
        }

        Пример 3 — оговорки нет:
        Фрагмент:
        "Стороны несут ответственность в полном объёме за нарушение договора."

        Ответ:
        {
          "force_majeure_status": "not_defined",
          "force_majeure_type": "not_defined",
          "specific_events_status": "not_defined",
          "specific_events_details": "Данные не определены",
          "notification_status": "not_defined",
          "notification_details": "Данные не определены",
          "proof_requirements_status": "not_defined",
          "proof_requirements_details": "Данные не определены",
          "consequences_status": "not_defined",
          "consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слово "форс-мажор" или "непреодолимая сила"?
        2. Если есть — перечислены ли конкретные с/х события (засуха, эпизоотия и т.д.)?
        3. Указан ли срок уведомления конкретным числом?
        4. Требуется ли справка ТПП или Гидрометцентра?
        5. Указаны ли конкретные последствия (перенос сроков / пересчёт объёма)?
        6. Если только "форс-мажор" без деталей — force_majeure_type: general_only.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_type": "<agricultural_specific / general_only / not_defined>",
          "specific_events_status": "<defined / not_defined>",
          "specific_events_details": "<перечень или 'Данные не определены'>",
          "notification_status": "<defined / not_defined>",
          "notification_details": "<срок или 'Данные не определены'>",
          "proof_requirements_status": "<defined / not_defined>",
          "proof_requirements_details": "<документы или 'Данные не определены'>",
          "consequences_status": "<defined / not_defined>",
          "consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "засуха"
        - "гибель урожая"
        - "ст. 538"
        - "освобождение от ответственности"
        - "эпизоотия"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "boilerplate"
        - "limitations"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "force_majeure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если форс-мажорная оговорка присутствует. Иначе 'not_defined'."
        - name: "force_majeure_type"
          type: "string"
          allowed_values: ["agricultural_specific", "general_only", "not_defined"]
          description: "Тип: с/х специфика / только общая формулировка / нет."
        - name: "specific_events_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если конкретные с/х события перечислены. Иначе 'not_defined'."
        - name: "specific_events_details"
          type: "string"
          description: "Перечень событий. Если нет — строго 'Данные не определены'."
        - name: "notification_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок уведомления прямо определён. Иначе 'not_defined'."
        - name: "notification_details"
          type: "string"
          description: "Срок уведомления. Если нет — строго 'Данные не определены'."
        - name: "proof_requirements_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если требования к доказательствам прямо определены. Иначе 'not_defined'."
        - name: "proof_requirements_details"
          type: "string"
          description: "Требуемые документы. Если нет — строго 'Данные не определены'."
        - name: "consequences_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если последствия для обязательств прямо определены. Иначе 'not_defined'."
        - name: "consequences_details"
          type: "string"
          description: "Последствия. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Страхование урожая
  # ──────────────────────────────────────────────────────────────────────────
  - id: crop_insurance_check
    name: "Страхование урожая и сельскохозяйственных рисков"
    description: >
      Фактографическая проверка наличия условий о страховании урожая,
      обязанной стороны, распределения расходов и выгодоприобретателя.
    triggers:
      any: ["crop_insurance", "high_value_crops"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страхование урожая"
        - "страхование сельскохозяйственных рисков"
        - "агрострахование"
        - "страховой полис"
        - "страховая сумма"
        - "страховой случай"
        - "гибель урожая"
        - "выгодоприобретатель"
        - "застраховать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ой)\\s+(урожа|сельскохозяйственн)"
        - "(?i)обязуется.*застраховать"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации сельскохозяйственной продукции.
        Проверяется только один вопрос: условия о страховании урожая.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о страховании урожая.
        2. Кто обязан застраховать (производитель / заготовитель).
        3. Кто несёт расходы на страхование.
        4. Кто является выгодоприобретателем.
        5. Порядок действий при страховом случае.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Производитель обязан застраховать урожай в страховой компании
        «АгроЗащита» на сумму не менее 80% от стоимости договора.
        Расходы на страхование несёт Заготовитель. Выгодоприобретателем
        по договору страхования является Заготовитель в части выплаченного аванса."

        Ответ:
        {
          "insurance_status": "defined",
          "insurance_obligated_party_status": "defined",
          "insurance_obligated_party": "producer",
          "insurance_cost_status": "defined",
          "insurance_cost_details": "расходы несёт Заготовитель",
          "beneficiary_status": "defined",
          "beneficiary": "purchaser",
          "beneficiary_details": "в части выплаченного аванса",
          "insurance_event_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Производитель обязан застраховать урожай в страховой компании «АгроЗащита» на сумму не менее 80% от стоимости договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны рекомендуют застраховать урожай."

        Ответ:
        {
          "insurance_status": "not_defined",
          "insurance_obligated_party_status": "not_defined",
          "insurance_obligated_party": "not_defined",
          "insurance_cost_status": "not_defined",
          "insurance_cost_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary": "not_defined",
          "beneficiary_details": "Данные не определены",
          "insurance_event_procedure_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязанность (не рекомендация) застраховать?
        2. Кто именно обязан — производитель или заготовитель?
        3. Кто несёт расходы?
        4. Кто выгодоприобретатель?
        5. "Рекомендуется застраховать" — это NOT defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_status": "<defined / not_defined>",
          "insurance_obligated_party_status": "<defined / not_defined>",
          "insurance_obligated_party": "<producer / purchaser / both / not_defined>",
          "insurance_cost_status": "<defined / not_defined>",
          "insurance_cost_details": "<текст или 'Данные не определены'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary": "<producer / purchaser / both / not_defined>",
          "beneficiary_details": "<текст или 'Данные не определены'>",
          "insurance_event_procedure_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "страхование урожая"
        - "агрострахование"
        - "страховой полис"
        - "гибель урожая"
        - "выгодоприобретатель"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "insurance_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если обязательство по страхованию прямо определено. Иначе 'not_defined'."
        - name: "insurance_obligated_party_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если обязанная сторона прямо определена. Иначе 'not_defined'."
        - name: "insurance_obligated_party"
          type: "string"
          allowed_values: ["producer", "purchaser", "both", "not_defined"]
          description: "Кто обязан застраховать."
        - name: "insurance_cost_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если кто несёт расходы прямо определено. Иначе 'not_defined'."
        - name: "insurance_cost_details"
          type: "string"
          description: "Кто несёт расходы. Если нет — строго 'Данные не определены'."
        - name: "beneficiary_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если выгодоприобретатель прямо определён. Иначе 'not_defined'."
        - name: "beneficiary"
          type: "string"
          allowed_values: ["producer", "purchaser", "both", "not_defined"]
          description: "Выгодоприобретатель."
        - name: "insurance_event_procedure_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок действий при страховом случае прямо определён. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Риски гибели многолетних насаждений
  # ──────────────────────────────────────────────────────────────────────────
  - id: perennial_crops_risk_allocation
    name: "Многолетние культуры: распределение рисков гибели насаждений"
    description: >
      Фактографическая проверка наличия особых условий для многолетних культур
      (виноградники, сады, плантации) — распределение рисков гибели насаждений
      и механизм компенсации затрат.
    triggers:
      any: ["perennial_crops"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "многолетние насаждения"
        - "плодовые деревья"
        - "виноградник"
        - "многолетние культуры"
        - "гибель насаждений"
        - "компенсация затрат на насаждения"
        - "восстановление насаждений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)многолетн.*насажден"
        - "(?i)гибель.*насажден"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации многолетних культур.
        Проверяется наличие особых условий для многолетних насаждений.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие специального условия для многолетних насаждений.
        2. Распределение рисков гибели насаждений (кто несёт).
        3. Механизм компенсации затрат производителя при гибели насаждений.
        4. Порядок пересчёта объёмов при частичной гибели насаждений.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие именно о насаждениях (не просто урожае)?
        2. Кто несёт риск гибели насаждений?
        3. Есть ли механизм компенсации капитальных затрат?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "perennial_clause_status": "<defined / not_defined>",
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation": "<producer / purchaser / shared / insured / not_defined>",
          "compensation_mechanism_status": "<defined / not_defined>",
          "compensation_mechanism_details": "<текст или 'Данные не определены'>",
          "partial_loss_recalculation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "многолетние насаждения"
        - "гибель насаждений"
        - "виноградник"
        - "плодовые деревья"
        - "компенсация затрат"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "perennial_clause_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если специальное условие для насаждений прямо определено. Иначе 'not_defined'."
        - name: "risk_allocation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если распределение рисков прямо определено. Иначе 'not_defined'."
        - name: "risk_allocation"
          type: "string"
          allowed_values: ["producer", "purchaser", "shared", "insured", "not_defined"]
          description: "Кто несёт риск гибели насаждений."
        - name: "compensation_mechanism_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если механизм компенсации прямо определён. Иначе 'not_defined'."
        - name: "compensation_mechanism_details"
          type: "string"
          description: "Механизм компенсации. Если нет — строго 'Данные не определены'."
        - name: "partial_loss_recalculation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если пересчёт при частичной гибели прямо определён. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Обязанности заготовителя по обеспечению производства
  # ──────────────────────────────────────────────────────────────────────────
  - id: production_support_obligations_check
    name: "Обязанности заготовителя по обеспечению производства (ст. 536 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий об обязанности заготовителя
      предоставлять ресурсы (семена, удобрения, СЗР, технику) производителю,
      распределения расходов и ответственности за непредоставление.
    triggers:
      any: ["production_support"]
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предоставление семян"
        - "обеспечение удобрениями"
        - "средства защиты растений"
        - "предоставление техники"
        - "агрономическое сопровождение"
        - "обеспечение производственного процесса"
        - "семенной материал"
        - "ГСМ"
        - "горюче-смазочные материалы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заготовитель.*обязуется.*предоставить"
        - "(?i)обеспечени(е|я).*производ(ства|ственного)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор контрактации.
        Проверяется наличие обязанностей заготовителя по обеспечению
        производственного процесса производителя.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязанности заготовителя предоставлять ресурсы.
        2. Перечень предоставляемых ресурсов.
        3. Кто несёт расходы на ресурсы.
        4. Ответственность за непредоставление ресурсов.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность (не рекомендация) предоставить ресурсы?
        2. Перечислены ли конкретные ресурсы (семена / удобрения / СЗР / техника)?
        3. Кто платит за ресурсы — прямо ли указано?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "production_support_status": "<defined / not_defined>",
          "resources_list_status": "<defined / not_defined>",
          "resources_list_details": "<перечень или 'Данные не определены'>",
          "cost_allocation_status": "<defined / not_defined>",
          "cost_allocation": "<purchaser / producer / offset_against_price / not_defined>",
          "liability_for_non_provision_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "предоставление семян"
        - "обеспечение удобрениями"
        - "агрономическое сопровождение"
        - "ст. 536 ГК РФ"
        - "заготовитель обязуется предоставить"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "production_support_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если обязанность заготовителя предоставлять ресурсы прямо определена. Иначе 'not_defined'."
        - name: "resources_list_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если перечень ресурсов прямо определён. Иначе 'not_defined'."
        - name: "resources_list_details"
          type: "string"
          description: "Перечень ресурсов. Если нет — строго 'Данные не определены'."
        - name: "cost_allocation_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если распределение расходов прямо определено. Иначе 'not_defined'."
        - name: "cost_allocation"
          type: "string"
          allowed_values: ["purchaser", "producer", "offset_against_price", "not_defined"]
          description: "Кто несёт расходы."
        - name: "liability_for_non_provision_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ответственность за непредоставление ресурсов прямо определена. Иначе 'not_defined'."
      store_payload: true


# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_authority_cluster:
    text: >
      В {doc_names} не определены реквизиты одной или обеих сторон.
      Просим предоставить: (а) для Производителя — наименование / ФИО главы КФХ,
      ИНН, ОГРН/ОГРНИП, адрес, документ-основание деятельности;
      (б) для Заготовителя — наименование, ИНН, ОГРН, адрес, полномочия подписанта
      (устав/доверенность). Просим подтверждающие документы на подписантов обеих сторон.
    addressee: "Обе стороны"

  subject_price_payment_cluster:
    text: >
      В {doc_names} не определены один или несколько ключевых параметров.
      Просим предоставить: (а) наименование, вид и количество продукции;
      (б) цену за единицу с налоговой оговоркой (НДС / без НДС / ЕСХН);
      (в) механизм пересмотра цены при изменении рыночной конъюнктуры;
      (г) срок оплаты после приёмки и способ расчётов;
      (д) условия авансирования — размер, срок, порядок зачёта в счёт оплаты.
    addressee: "Обе стороны"

  delivery_acceptance_cluster:
    text: >
      В {doc_names} не определены условия сдачи и/или приёмки продукции.
      Просим предоставить: (а) конкретные сроки и/или график сдачи продукции;
      (б) место приёмки (у производителя / на элеваторе / на складе заготовителя);
      (в) обязанность заготовителя принять продукцию без права немотивированного отказа;
      (г) кто обеспечивает тару и транспорт, распределение расходов;
      (д) документы при приёмке (ТТН, акт, форма и сроки подписания);
      (е) порядок отбора проб и взвешивания.
    addressee: "Обе стороны"

  quality_safety_claims_cluster:
    text: >
      В {doc_names} не определены требования к качеству и/или документам безопасности.
      Просим предоставить: (а) стандарт качества (ГОСТ/ТУ с конкретным номером);
      (б) конкретные параметры качества (влажность, сорность, жирность, ПДК и т.д.);
      (в) применимые ТР ТС с обязательными декларациями/сертификатами;
      (г) требования к ветеринарным документам (ВСД через ФГИС «Меркурий»)
      или фитосанитарным сертификатам;
      (д) порядок отбора проб при приёмке, нейтральная лаборатория, арбитражный образец;
      (е) срок предъявления претензий по качеству и механизм спора.
    addressee: "Производитель / Юридический советник"

  risk_title_storage_cluster:
    text: >
      В {doc_names} не определены условия перехода риска и/или хранения.
      Просим предоставить: (а) момент перехода риска случайной гибели продукции
      (при подписании акта / при взвешивании / при отгрузке);
      (б) условия хранения продукции до вывоза заготовителем;
      (в) ответственность за порчу при хранении на территории производителя;
      (г) порядок пересчёта обязательств при частичной гибели урожая.
    addressee: "Юридический советник"

  liability_termination_cluster:
    text: >
      В {doc_names} не определены или некорректно определены условия ответственности.
      Просим: (а) проверить и исправить ответственность производителя — она должна быть
      виновной (ст. 538 ГК РФ); условие "независимо от вины" — недопустимо;
      (б) определить неустойку за просрочку сдачи продукции производителем;
      (в) определить ответственность заготовителя за необоснованный отказ от приёмки;
      (г) определить неустойку за просрочку оплаты заготовителем;
      (д) перечислить конкретные основания расторжения для каждой стороны;
      (е) определить порядок возврата аванса при расторжении.
    addressee: "Юридический советник"

  general_provisions_cluster:
    text: >
      В {doc_names} не определены общие условия.
      Просим предоставить: (а) срок действия договора с привязкой к сезону/урожаю;
      (б) налоговую оговорку (НДС / без НДС / ЕСХН производителя);
      (в) ограничения на уступку прав / перевод долга без согласия другой стороны;
      (г) условия конфиденциальности (перечень сведений, срок);
      (д) претензионный порядок (срок направления претензии и ответа);
      (е) подсудность споров (конкретный суд).
    addressee: "Юридический советник"

  contracting_subject_extraction:
    text: >
      В {doc_names} не определены базовые параметры предмета контрактации.
      Просим предоставить: наименование продукции, вид, количество с единицей измерения,
      стандарт качества (ГОСТ/ТУ), срок и место сдачи.
    addressee: "Производитель / Юридический советник"

  agricultural_force_majeure_check:
    text: >
      В {doc_names} отсутствует или недостаточна форс-мажорная оговорка для с/х.
      Просим включить / уточнить: (а) перечень с/х рисков: засуха, наводнение,
      заморозки, градобой, эпизоотия, нашествие вредителей;
      (б) срок уведомления и форму подтверждающих документов
      (справка Гидрометцентра или ТПП);
      (в) последствия для обязательств — отсрочка / уменьшение объёма / прекращение.
    addressee: "Юридический советник"

  crop_insurance_check:
    text: >
      В {doc_names} не определены условия страхования урожая.
      Просим предоставить: (а) обязанность по страхованию — кто и когда;
      (б) минимальная страховая сумма (% от стоимости договора);
      (в) выгодоприобретатель по страховому полису;
      (г) порядок действий при страховом случае.
    addressee: "Юридический советник"

  perennial_crops_risk_allocation:
    text: >
      В {doc_names} (многолетние культуры) не определены условия для насаждений.
      Просим предоставить: (а) распределение рисков гибели насаждений;
      (б) механизм компенсации капитальных затрат производителя при гибели;
      (в) порядок пересчёта объёмов при частичной гибели насаждений.
    addressee: "Юридический советник"

  production_support_obligations_check:
    text: >
      В {doc_names} не определены обязанности заготовителя по обеспечению производства.
      Просим предоставить: (а) перечень ресурсов, предоставляемых заготовителем
      (семена, удобрения, СЗР, техника, ГСМ);
      (б) сроки и порядок предоставления каждого вида ресурсов;
      (в) кто несёт расходы (за счёт заготовителя / зачёт в цену продукции);
      (г) ответственность заготовителя за непредоставление ресурсов.
    addressee: "Заготовитель"

  veterinary_certificate_required:
    text: >
      В {doc_names} не определены требования к ветеринарным документам.
      Просим предоставить: (а) обязанность производителя оформлять ВСД через
      ФГИС «Меркурий» с каждой партией; (б) последствия при отсутствии ВСД.
    addressee: "Производитель / Ветеринарная служба"

  phytosanitary_export_certificate_required:
    text: >
      В {doc_names} не определены требования к фитосанитарным документам.
      Просим предоставить порядок получения фитосанитарного сертификата и
      распределение расходов на фитосанитарный контроль.
