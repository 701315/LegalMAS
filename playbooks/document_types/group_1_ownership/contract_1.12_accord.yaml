          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Должник подтверждает, что автомобиль принадлежит ему на праве собственности, не находится в залоге, под арестом и свободен от прав третьих лиц."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Имущество передается кредитору."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Данные не определены",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Данные не определены",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Данные не определены",
          "risk_allocation": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по титулу, залогу, аресту и правам третьих лиц.
        2. Найди прямую цитату по качеству.
        3. Найди прямую цитату о риске случайной гибели.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "title_warranty_status": "<defined / not_defined>",
          "title_warranty_details": "<текст или 'Данные не определены'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Данные не определены'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Данные не определены'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Данные не определены'>",
          "quality_warranty_status": "<defined / not_defined>",
          "quality_warranty_details": "<текст или 'Данные не определены'>",
          "risk_allocation": "<debtor / creditor / not_defined>",
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "риск случайной гибели"
        - "до момента передачи"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
