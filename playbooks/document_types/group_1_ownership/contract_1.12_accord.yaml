          "claim_debtor_identified_status": "not_defined",
          "claim_debtor_identified_details": "Данные не определены",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору квартиру, кадастровый номер 77:01:0004010:1234. Переход права собственности подлежит государственной регистрации в Росреестре."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "В качестве отступного передается право требования."

        Ответ:
        {
          "asset_subtype": "claim",
          "cadastral_number_status": "not_defined",
          "cadastral_number": "Данные не определены",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Данные не определены",
          "registration_procedure_status": "not_defined",
          "registration_procedure_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "claim_basis_status": "not_defined",
          "claim_basis_details": "Данные не определены",
          "claim_debtor_identified_status": "not_defined",
          "claim_debtor_identified_details": "Данные не определены",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного передается право требования."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе предмета.
        2. Для недвижимости — найди прямые цитаты о кадастровом номере и регистрации.
        3. Для права требования — найди прямые цитаты об основании, должнике, документах и уведомлении.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
