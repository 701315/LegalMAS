type: contract_1.12_accord
name: "Соглашение об отступном"

description: |
  Соглашение, по которому существующее обязательство прекращается полностью или частично
  путём предоставления кредитору иного исполнения взамен первоначального:
  денежных средств, имущества, имущественного права, ценных бумаг или иного актива.
  Регулируется ст. 409 ГК РФ. Ключевая особенность — обязательство прекращается
  не само по себе в момент подписания соглашения, а по факту предоставления отступного,
  если иное не вытекает из существа согласованной конструкции и требований к переходу прав.
  Отступное необходимо чётко отличать от новации, прощения долга, зачёта и купли-продажи.
  Особое значение имеют идентификация первоначального обязательства, описание предмета отступного,
  объём прекращения долга, момент прекращения обязательства, налоговые и банкротные риски.

version: 4.1
parent: class_2_modification_of_obligations

metadata:
  category: contract
  subcategory: obligation_termination
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ст. 409 ГК РФ"
  doc_types_supported:
    - "соглашение об отступном"
    - "соглашение о предоставлении отступного"
    - "соглашение о прекращении обязательства отступным"
    - "погашение долга имуществом"
    - "погашение долга правом требования"
    - "отступное по кредитному договору"
    - "отступное недвижимостью"
    - "соглашение о замене исполнения"
    - "отступное векселем"

    - "accord and satisfaction"
    - "accord agreement"
    - "settlement in lieu of performance"
    - "debt settlement agreement"
    - "composition agreement"
    - "settlement and release agreement"
    - "transfer in satisfaction of debt"
    - "deed in satisfaction"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.80
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*об[\\s_.-]*отступн[а-я]*\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование соглашения об отступном

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*предоставлени[а-я]*[\\s_.-]*отступн[а-я]*\\b"
        kind: specific_subject
        weight: 0.98
        # Прямое покрытие из supported types

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*прекращени[а-я]*[\\s_.-]*обязательств[а-я]*[\\s_.-]*отступн[а-я]*\\b"
        kind: specific_subject
        weight: 0.98
        # Прекращение обязательства отступным — юридически точная формула

      - pattern: "(?i)\\bотступн[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Базовый русский маркер; достаточно специфичен для данного типа

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*замен[а-я]*[\\s_.-]*исполнени[а-я]*\\b"
        kind: specific_subject
        weight: 0.88
        # Замена исполнения — функциональный эквивалент отступного из supported types

      - pattern: "(?i)\\bпогашени[ея][\\s_.-]*долг[а-я]*[\\s_.-]*имуществ[а-я]*\\b"
        kind: specific_subject
        weight: 0.90
        # Погашение долга имуществом — прямой subject-маркер отступного

      - pattern: "(?i)\\bпогашени[ея][\\s_.-]*долг[а-я]*[\\s_.-]*прав[а-я]*[\\s_.-]*требован[а-я]*\\b"
        kind: specific_subject
        weight: 0.90
        # Погашение долга правом требования из supported types

      - pattern: "(?i)\\bотступн[а-я]*[\\s_.-]*(?:по[\\s_.-]*кредитн[а-я]*[\\s_.-]*договор[а-я]*|недвижимост[а-я]*|векселем)\\b"
        kind: specific_subject
        weight: 0.94
        # Предметные формы отступного: по кредиту, недвижимостью, векселем

      - pattern: "(?i)\\baccord[\\s_.-]*and[\\s_.-]*satisfaction\\b"
        kind: specific_subject
        weight: 0.96
        # Прямой англоязычный юридический термин

      - pattern: "(?i)\\baccord[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.88
        # Accord agreement — поддерживаемый английский маркер

      - pattern: "(?i)\\bdation[\\s_.-]*in[\\s_.-]*payment\\b"
        kind: specific_subject
        weight: 0.94
        # Dation in payment — романо-правовой аналог отступного, достаточно специфичен

      - pattern: "(?i)\\btransfer[\\s_.-]*in[\\s_.-]*satisfaction[\\s_.-]*of[\\s_.-]*debt\\b"
        kind: specific_subject
        weight: 0.92
        # Transfer in satisfaction of debt — прямой маркер из supported types

      - pattern: "(?i)\\bdeed[\\s_.-]*in[\\s_.-]*satisfaction\\b"
        kind: specific_subject
        weight: 0.88
        # Deed in satisfaction — формальная английская форма

      - pattern: "(?i)\\bdeed[\\s_.-]*in[\\s_.-]*lieu(?:[\\s_.-]*of[\\s_.-]*(?:payment|foreclosure))?\\b"
        kind: specific_subject
        weight: 0.86
        # Deed in lieu (of payment/foreclosure) — практически применяемая форма

      - pattern: "(?i)\\bsettlement[\\s_.-]*in[\\s_.-]*lieu[\\s_.-]*of[\\s_.-]*performance\\b"
        kind: specific_subject
        weight: 0.90
        # Settlement in lieu of performance — из supported types, достаточно специфично

      - pattern: "(?i)(?=.*\\bв[\\s_.-]*счёт\\b|\\bв[\\s_.-]*счет\\b)(?=.*\\bпогашени[а-я]*\\b).*"
        kind: specific_subject
        weight: 0.84
        # В счёт погашения — характерная формула для отступного, более специфична в связке

      - pattern: "(?i)\\bin[\\s_.-]*lieu[\\s_.-]*of[\\s_.-]*payment\\b"
        kind: specific_subject
        weight: 0.82
        # In lieu of payment — функциональный маркер отступного

      - pattern: "(?i)\\bdebt[\\s_.-]*settlement[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.56
        # Debt settlement agreement из supported types, но шире отступного; конфликт с debt restructuring

      - pattern: "(?i)\\bsettlement[\\s_.-]*and[\\s_.-]*release[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.52
        # Settlement and release шире отступного: может быть litigation settlement, general release

      - pattern: "(?i)\\bcomposition[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.46
        # Composition agreement в ряде юрисдикций ближе к реструктуризации/рассрочке, чем к отступному

      - pattern: "(?i)\\bsettlement[\\s_.-]*agreement\\b"
        kind: context
        weight: 0.22
        # Settlement agreement без уточнения слишком широко: litigation, commercial, employment и т.д.

      - pattern: "(?i)\\bsettlement\\b"
        kind: context
        weight: 0.16
        # Сам по себе settlement — слишком широкий контекстный маркер


    folder_patterns:
      - pattern: "(?i)отступн"
        kind: specific_subject
        weight: 0.86
        # Явная папка по соглашениям об отступном

      - pattern: "(?i)accord[_\\s-]*(?:and[_\\s-]*)?satisfaction|dation[_\\s-]*in[_\\s-]*payment"
        kind: specific_subject
        weight: 0.84
        # Прямые англоязычные folder-markers отступного

      - pattern: "(?i)transfer[_\\s-]*in[_\\s-]*satisfaction|deed[_\\s-]*in[_\\s-]*(?:satisfaction|lieu)"
        kind: specific_subject
        weight: 0.80
        # Folder по deed/transfer in satisfaction формам

      - pattern: "(?i)замен[а-я]*[_\\s-]*исполнени|погашени[ея][_\\s-]*долг[а-я]*[_\\s-]*имуществ"
        kind: specific_subject
        weight: 0.76
        # Папка по русскоязычным эквивалентам отступного

      - pattern: "(?i)debt[_\\s-]*settlement"
        kind: generic_form
        weight: 0.50
        # Debt settlement folder полезен, но шире чистого отступного

      - pattern: "(?i)settlement[_\\s-]*(?:and[_\\s-]*release|in[_\\s-]*lieu)"
        kind: generic_form
        weight: 0.46
        # Settlement with qualifier — умеренно полезен, но неоднозначен

      - pattern: "(?i)obligation[_\\s-]*termination|прекращени[ея][_\\s-]*обязательств"
        kind: generic_form
        weight: 0.44
        # Прекращение обязательств — правильный контекст, но шире отступного (новация, зачёт и др.)

      - pattern: "(?i)settlement"
        kind: context
        weight: 0.20
        # Settlement folder слишком широк

      - pattern: "(?i)termination"
        kind: context
        weight: 0.18
        # Termination folder неоднозначен: termination of contract, of employment и т.д.

      - pattern: "(?i)obligation"
        kind: context
        weight: 0.16
        # Obligation folder почти ничего не определяет

      - pattern: "(?i)debt"
        kind: context
        weight: 0.16
        # Debt folder слишком широк: collections, restructuring, assignment и др.

    keywords:

      high:
        - pattern: "(?i)\\bсоглашение\\s+об\\s+отступном\\b"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Базовое наименование соглашения об отступном (ст. 409 ГК РФ)"

        - pattern: "(?i)\\bсоглашение\\s+о\\s+предоставлении\\s+отступного\\b"
          weight: 0.98
          distinctiveness: high
          context: header
          description: "Прямое указание на предоставление отступного"

        - pattern: "(?i)\\bсоглашение\\s+о\\s+прекращении\\s+обязательства\\s+отступным\\b"
          weight: 0.98
          distinctiveness: high
          context: header
          description: "Прекращение обязательства отступным"

        - pattern: "(?i)соглашение\\s+о\\s+прекращении\\s+обязательства\\s+предоставлением\\s+отступного"
          weight: 0.97
          distinctiveness: high
          context: header
          description: "Развёрнутая формула прекращения обязательства предоставлением отступного"

        - pattern: "(?i)\\bотступное\\b"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Ключевой термин отступное — уникален для ст. 409 ГК РФ"

        - pattern: "(?i)погашение\\s+долга\\s+имуществом"
          weight: 0.90
          distinctiveness: high
          context: body
          description: "Погашение долга передачей имущества вместо первоначального исполнения"

        - pattern: "(?i)погашение\\s+долга\\s+правом\\s+требования"
          weight: 0.90
