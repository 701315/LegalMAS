  - id: bankruptcy_and_fair_value_risk_check
    name: "Банкротный контекст, соразмерность стоимости и аффилированность"
    description: >
      Фактографическая проверка наличия в тексте заверений об отсутствии банкротства
      и признаков неплатёжеспособности, текстового обоснования соразмерности
      стоимости, аффилированности сторон, отсутствия предпочтения.
      Примечание: конкретный метод оценки стоимости (valuation_method) также
      отражён в check valuation_and_settlement_scope_check; в DD Grid
      единственным видимым источником метода оценки является
      valuation_and_settlement_scope_check. Здесь этот факт используется
      только как скрытый контекст, а фокус проверки — наличие текстового
      обоснования соразмерности цены для целей защиты от оспаривания сделки
      по ст. 61.2 ФЗ-127 (неравноценность встречного предоставления), а не
      сама величина стоимости.
    triggers:
      any: ["bankruptcy_risk_context", "tax_sensitive_structure"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "платежеспособность"
        - "не является сделкой с предпочтением"
        - "рыночная стоимость"
        - "соразмерность"
        - "аффилированность"
        - "кредиторы"
        - "подозрительная сделка"
        - "не находится в процедуре банкротства"
        - "единый федеральный реестр сведений о банкротстве"
        - "заинтересованное лицо"
        - "предпочтительное удовлетворение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)сделк(а|и)\\s+с\\s+предпочтени"
        - "(?i)аффилированн"
        - "(?i)заинтересованн[а-я]+\\s+лиц"
        - "(?i)ЕФРСБ|единый\\s+федеральн[а-я]+\\s+реестр"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие factual-данные в тексте касаются
        банкротного контекста, соразмерности стоимости и аффилированности.

        Нормативный ориентир:
        - ст. 61.2 ФЗ-127
        - ст. 61.3 ФЗ-127

        Важно:
        - Не оценивай реальный уровень риска — только фиксируй, что есть в тексте.
        - Не анализируй саму величину стоимости отступного (это отдельный
          вопрос) — здесь важно только наличие текстового обоснования
          соразмерности/рыночности цены.
        - Если банкротный статус подтверждается через отсылку к конкретному
          документу (справка из Единого федерального реестра сведений о
          банкротстве, выписка и т.п.) — это усиленная, но всё равно defined
          форма подтверждения.
        - Общая фраза вроде "стороны действуют добросовестно", "сделка
          совершается в соответствии с требованиями законодательства о
          банкротстве" или "стороны гарантируют соблюдение прав кредиторов"
          без конкретного факта (отсутствие процедуры банкротства, отсутствие
          признаков неплатёжеспособности, конкретное обоснование цены,
          указание на аффилированность, конкретную формулировку об отсутствии
          предпочтения) НЕ является основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение отсутствия процедуры банкротства.
        2. Есть ли подтверждение отсутствия признаков неплатёжеспособности.
        3. Есть ли текстовое обоснование соразмерности / рыночности стоимости
           предмета отступного.
        4. Какой метод оценки указан (используется как контекст).
        5. Есть ли указание на аффилированность сторон.
        6. Есть ли формулировка, что сделка не является предпочтительной.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не оценивай реальный уровень риска — только фиксируй, что есть в тексте.
        3. Общая фраза о добросовестности или соответствии законодательству
           без конкретного факта — это not_defined.
        4. Если данных нет — возвращай "not_defined" и соответствующий
           текстовый fallback.
        5. Не додумывай финансовое состояние должника.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено:
        Фрагмент:
        "Должник подтверждает, что на дату подписания настоящего соглашения
        не находится в процедуре банкротства и не обладает признаками
        неплатежеспособности. Стоимость передаваемого имущества определена
        на основании отчета независимого оценщика и соответствует рыночной
        стоимости."

        Ответ:
        {
          "bankruptcy_status_status": "defined",
          "bankruptcy_status_details": "Не находится в процедуре банкротства",
          "insolvency_signs_status": "defined",
          "insolvency_signs_details": "Не обладает признаками неплатёжеспособности",
          "fair_value_support_status": "defined",
