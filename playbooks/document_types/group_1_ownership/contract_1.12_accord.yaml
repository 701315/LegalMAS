  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: СПЕЦИФИКА НЕДВИЖИМОСТИ / УСТУПКИ ПРАВА
  # ──────────────────────────────────────────────────────────────────────────
  - id: real_estate_and_claim_specifics_check
    name: "Специальные условия для недвижимости и уступки права требования как отступного"
    description: >
      Фактографическая проверка специальных условий для недвижимости
      (регистрация, ЕГРН, кадастровый номер, расходы) и для права требования
      (идентификация требования, документы, уведомление должника).
    triggers:
      any: ["real_estate_as_otsupnoe", "claim_assignment_as_otsupnoe"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "ЕГРН"
        - "Росреестр"
        - "переход права собственности"
        - "кадастровый номер"
        - "расходы на регистрацию"
        - "право требования"
        - "уступка"
        - "должник по требованию"
        - "документы, удостоверяющие требование"
        - "передача документов"
        - "объем уступаемого права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)ЕГРН|Росреестр"
        - "(?i)уступк(а|и)\\s+прав"
        - "(?i)право\\s+требован"
        - "(?i)передач(а|и)\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: специальные условия, если отступное
        представляет собой недвижимость и/или право требования.

        Нормативный ориентир:
        - ст. 131, 551 ГК РФ
        - ст. 382–390 ГК РФ
        - ст. 385 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Является ли отступное недвижимостью, правом требования или обоими.
        2. Если это недвижимость — есть ли кадастровый номер.
        3. Если это недвижимость — есть ли указание на ЕГРН / Росреестр / регистрацию.
        4. Если это недвижимость — распределены ли расходы на регистрацию.
        5. Если это право требования — указано ли основание требования.
        6. Если это право требования — идентифицирован ли должник по требованию.
        7. Если это право требования — есть ли указание на передачу документов и уведомление должника.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай кадастровые номера и реквизиты требования.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору квартиру,
        кадастровый номер 77:01:0004010:1234. Переход права собственности
        подлежит государственной регистрации в Росреестре. Расходы на регистрацию
        стороны несут поровну."

