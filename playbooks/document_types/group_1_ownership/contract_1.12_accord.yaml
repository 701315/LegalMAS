  - id: original_obligation_extraction
    name: "Первоначальное обязательство и объём его прекращения"
    description: >
      Фактографическая проверка идентификации прекращаемого обязательства:
      реквизиты основания, сумма долга, состав задолженности,
      полное или частичное прекращение, остаток долга.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "первоначальное обязательство"
        - "договор №"
        - "задолженность"
        - "основной долг"
        - "проценты"
        - "неустойка"
        - "в счет погашения"
        - "прекращается обязательство"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор\\s*№"
        - "{{ money_amount }}"
        - "(?i)основн(ой|ого)\\s+долг|процент|неустойк"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какое обязательство прекращается и в каком объёме.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 432 ГК РФ

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте соглашения.
        - Не анализируй обеспечение обязательства (залог, поручительство) —
          это отдельный вопрос, не относящийся к данной проверке.
        - Общая фраза вроде "задолженность возникла в порядке, установленном
          законодательством" или "сумма определяется по расчётам сторон" без
          конкретной цифры, реквизитов или названного документа НЕ является
          основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основание прекращаемого обязательства.
        2. Реквизиты обязательства (договор / судебный акт / иное).
        3. Размер долга.
        4. Указан ли состав долга: основной долг / проценты / неустойка.
        5. Прекращается ли обязательство полностью или частично.
        6. Если частично — указан ли остаток долга.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй недостающие реквизиты.
        3. Не оценивай достаточность идентификации как юрзаключение.
        4. Не путай сумму первоначальной задолженности со стоимостью или ценой
           отступного (передаваемого имущества) — это разные величины и разные
           вопросы. Если в тексте есть обе суммы, извлекай только сумму долга
           по первоначальному обязательству.
        5. Общая фраза без конкретной цифры, реквизитов договора или названного
           документа-основания — это not_defined, а не defined.
        6. Если данных нет — возвращай "not_defined" для статусов и
           соответствующий текстовый fallback для текстовых полей.
        7. Если частичное прекращение прямо упомянуто, но конкретная сумма остатка
           не названа — верни remaining_debt_status = "defined" и
           remaining_debt_value = "Не установлен" (тема поднята, но сумма не названа).
        8. Если данные о сумме или объёме прекращения противоречат друг другу
           в разных фрагментах и конфликт нельзя разрешить по тексту — верни
           "not_defined" для статуса и "Не удалось определить" для текстового поля.
        9. В evidence включай только цитаты из соглашения.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено, полное прекращение:
        Фрагмент:
        "Настоящее соглашение заключено в счет прекращения задолженности Должника
        по Договору поставки № 15 от 10.01.2024 в размере 1 500 000 рублей,
        включая основной долг и проценты. Обязательство прекращается частично,
        остаток долга составляет 200 000 рублей."

        Ответ:
        {
          "original_obligation_basis_status": "defined",
          "original_obligation_basis_code": "contract",
          "original_obligation_details_status": "defined",
          "original_obligation_details_value": "Договор поставки № 15 от 10.01.2024",
          "debt_amount_status": "defined",
          "debt_amount_value": "1 500 000 рублей",
          "principal_status": "defined",
          "interest_status": "defined",
          "penalty_status": "not_defined",
          "termination_scope": "partial",
          "remaining_debt_status": "defined",
          "remaining_debt_value": "200 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Настоящее соглашение заключено в счет прекращения задолженности Должника по Договору поставки № 15 от 10.01.2024 в размере 1 500 000 рублей, включая основной долг и проценты. Обязательство прекращается частично, остаток долга составляет 200 000 рублей."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны договорились прекратить обязательство."

        Ответ:
        {
          "original_obligation_basis_status": "not_defined",
          "original_obligation_basis_code": "not_defined",
          "original_obligation_details_status": "not_defined",
          "original_obligation_details_value": "Не установлены",
          "debt_amount_status": "not_defined",
          "debt_amount_value": "Не установлена",
          "principal_status": "not_defined",
          "interest_status": "not_defined",
          "penalty_status": "not_defined",
          "termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_value": "Не установлен",
          "evidence": []
        }

        Пример 3 — частичное погашение без остатка суммы:
        Фрагмент:
        "Задолженность Должника по Договору займа № 4 от 05.02.2023 составляет
        900 000 рублей. Обязательство прекращается частично; оставшаяся часть
        долга подлежит уплате в порядке, предусмотренном Договором займа."

        Ответ:
        {
          "original_obligation_basis_status": "defined",
          "original_obligation_basis_code": "contract",
          "original_obligation_details_status": "defined",
          "original_obligation_details_value": "Договор займа № 4 от 05.02.2023",
          "debt_amount_status": "defined",
          "debt_amount_value": "900 000 рублей",
          "principal_status": "not_defined",
          "interest_status": "not_defined",
          "penalty_status": "not_defined",
          "termination_scope": "partial",
          "remaining_debt_status": "defined",
          "remaining_debt_value": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Задолженность Должника по Договору займа № 4 от 05.02.2023 составляет 900 000 рублей. Обязательство прекращается частично; оставшаяся часть долга подлежит уплате в порядке, предусмотренном Договором займа."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Задолженность Должника определяется в порядке, установленном
        действующим законодательством Российской Федерации, и подлежит
        погашению в соответствии с условиями настоящего соглашения."

        Ответ:
        {
          "original_obligation_basis_status": "not_defined",
          "original_obligation_basis_code": "not_defined",
          "original_obligation_details_status": "not_defined",
          "original_obligation_details_value": "Не установлены",
          "debt_amount_status": "not_defined",
          "debt_amount_value": "Не установлена",
          "principal_status": "not_defined",
          "interest_status": "not_defined",
          "penalty_status": "not_defined",
          "termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_value": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязательстве-основании.
        2. Найди прямую цитату о сумме долга (не путай с ценой отступного).
        3. Найди прямую цитату о полном/частичном прекращении.
        4. Найди прямую цитату об остатке долга; если остаток упомянут без суммы —
           отрази это как "Не установлен", а не как "not_defined" по статусу.
        5. Проверь: не является ли формулировка общей фразой о законодательстве
           без конкретной цифры/реквизитов — если да, это not_defined.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        7. Если фрагменты противоречат друг другу — верни "not_defined" /
           "Не удалось определить".
        8. Не додумывай состав долга.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "original_obligation_basis_status": "<defined / not_defined>",
          "original_obligation_basis_code": "<contract / court_act / other / not_defined>",
          "original_obligation_details_status": "<defined / not_defined>",
          "original_obligation_details_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "debt_amount_status": "<defined / not_defined>",
          "debt_amount_value": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "principal_status": "<defined / not_defined>",
          "interest_status": "<defined / not_defined>",
          "penalty_status": "<defined / not_defined>",
          "termination_scope": "<full / partial / not_defined>",
          "remaining_debt_status": "<defined / not_defined>",
          "remaining_debt_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "первоначальное обязательство договор задолженность основной долг проценты неустойка в счет погашения прекращается обязательство в полном объёме частично остаток долга реквизиты основания"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "предмет отступного"
        - "передача имущества"
        - "акт приёма-передачи"
        - "срок передачи"
        - "стоимость отступного"
        - "согласованная стоимость"
        - "момент прекращения обязательства"
        - "реальная сделка"
        - "не является новацией"
        - "залог"
        - "поручительство"
        - "банковская гарантия"
        - "обеспечение"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о первоначальном обязательстве: основание, реквизиты, сумма,
        состав долга, объём прекращения и остаток долга.
        Не анализируй предмет отступного, титул имущества, обеспечение
        (залог, поручительство, банковскую гарантию), налоги или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. original_obligation_basis_status — "defined" если основание первоначального
           обязательства прямо указано (с реквизитами договора/акта), иначе "not_defined".
        2. original_obligation_basis_code — "contract" / "court_act" / "other" / "not_defined".
        3. original_obligation_details_status — "defined" если реквизиты обязательства
           (номер, дата, стороны) прямо указаны, иначе "not_defined".
        4. original_obligation_details_value — реквизиты первоначального обязательства.
           Формат: краткое summary (например, "Договор поставки № 15 от 10.01.2024"),
           без пересказа полного текста договора. Общая фраза без номера и даты —
           это not_defined. Fallback при отсутствии — "Не установлены".
        5. debt_amount_status — "defined" если общая сумма задолженности прямо указана
           конкретной цифрой, иначе "not_defined".
        6. debt_amount_value — сумма задолженности по первоначальному обязательству
           (не путать со стоимостью отступного). Общая фраза "сумма определяется по
           расчётам сторон" без цифры — это not_defined. Fallback — "Не установлена".
        7. principal_status — "defined" если основной долг выделен отдельно,
           иначе "not_defined".
        8. interest_status — "defined" если проценты выделены отдельно,
           иначе "not_defined".
        9. penalty_status — "defined" если неустойка выделена отдельно,
           иначе "not_defined".
        10. termination_scope — "full" / "partial" / "not_defined". Общая фраза
            "обязательство прекращается в соответствии с настоящим соглашением"
            без слов "полностью"/"частично" — это not_defined.
        11. remaining_debt_status — "defined" если частичное прекращение прямо
            упомянуто (независимо от того, названа ли конкретная сумма остатка),
            иначе "not_defined".
        12. remaining_debt_value — сумма остатка долга, если названа; если
            частичное прекращение упомянуто, но сумма остатка не названа —
            "Не установлен". Формат: краткая цифра с валютой, без пересказа условий.

        Если данные отсутствуют, используй следующий fallback:
        - original_obligation_details_value → "Не установлены"
        - debt_amount_value → "Не установлена"
        - remaining_debt_value → "Не установлен"
        - соответствующий статус → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением — не пропускай ключи.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о законодательстве, "расчётах сторон" или "условиях
          настоящего соглашения" без конкретной цифры, реквизитов или названного
          документа-основания — это not_defined, а не defined. Правило
          применяется ко всем полям check-а без исключения.
        - Не путай сумму первоначальной задолженности со стоимостью или ценой
          отступного (передаваемого имущества) — если в тексте есть обе величины,
          извлекай только сумму долга по первоначальному обязательству.
        - Не анализируй обеспечение обязательства (залог, поручительство,
          банковскую гарантию) — это отдельный вопрос, не относящийся к данной проверке.
        - Не достраивай состав долга по умолчанию: если основной долг, проценты
          или неустойка прямо не выделены — ставь "not_defined".
        - original_obligation_basis_code:
            - "contract" — обязательство возникло из договора (указан номер,
              дата, наименование договора).
            - "court_act" — обязательство установлено судебным актом.
            - "other" — иное основание, прямо названное в тексте.
            - "not_defined" — основание не указано.
        - termination_scope:
            - "full" — обязательство прекращается полностью.
            - "partial" — обязательство прекращается частично.
            - "not_defined" — объём прекращения прямо не определён.
        - Если частичное прекращение прямо упомянуто, но конкретная сумма
          остатка не названа, это не "not_defined" — тема поднята, статус
          "defined", значение "Не установлен".
        - Если в разных фрагментах указаны разные суммы или разный объём
          прекращения и конфликт нельзя разрешить по тексту, верни "not_defined"
          для статуса и "Не удалось определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых
          пунктов договора.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 12 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для original_obligation_basis_code используй только: "contract",
          "court_act", "other" или "not_defined".
        - Для termination_scope используй только: "full", "partial" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          original_obligation_details_value → "Не установлены"
          debt_amount_value → "Не установлена"
          remaining_debt_value → "Не установлен"
        - Для текстовых полей при неразрешимом противоречии используй только:
          "Не удалось определить".
        </output_expectations>

      fields:
        - name: "original_obligation_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения основания первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "original_obligation_basis_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["contract", "court_act", "other", "not_defined"]
          display_in_grid: false
          description: "Тип основания первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "original_obligation_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус реквизитов первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "original_obligation_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Первоначальное обязательство"
          description: >
            Реквизиты договора, судебного акта или иного основания обязательства.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

        - name: "debt_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания суммы долга. Внутреннее enum-поле."
          required: true

        - name: "debt_amount_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Сумма долга"
          description: >
            Сумма задолженности по первоначальному обязательству.
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "principal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Указан ли основной долг отдельно. Внутреннее enum-поле."
          required: true

        - name: "interest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Указаны ли проценты отдельно. Внутреннее enum-поле."
          required: true

        - name: "penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Указана ли неустойка отдельно. Внутреннее enum-поле."
          required: true

        - name: "termination_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "partial", "not_defined"]
          display_in_grid: false
          description: "Объём прекращения обязательства. Внутреннее enum-поле, отображается через termination_scope_display."
          required: true

        - name: "termination_scope_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Объём прекращения"
          description: >
            Читаемое отображение объёма прекращения обязательства: "Полностью",
            "Частично" или "Не установлен".
          required: true

        - name: "remaining_debt_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания остатка долга. Внутреннее enum-поле."
          required: true

        - name: "remaining_debt_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Остаток долга"
          description: >
            Остаток долга после частичного прекращения обязательства.
            Fallback: "Не установлен" / "Не удалось определить" / "Не применимо"
            (если termination_scope = full).
          required: true
      store_payload: true

  - id: secured_obligation_check
    name: "Обеспечение первоначального обязательства"
    description: >
      Фактографическая проверка наличия указания на то, что прекращаемое
      обязательство было обеспечено залогом, поручительством, банковской
      гарантией или иным способом обеспечения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "залог"
        - "поручительство"
        - "банковская гарантия"
        - "обеспечение обязательства"
        - "обеспечено"
        - "договор залога"
        - "договор поручительства"
        - "независимая гарантия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог[а-я]*"
        - "(?i)поручительств[а-я]*"
        - "(?i)банковск[а-я]+\\s+гаранти"
        - "(?i)обеспечен[а-я]+\\s+обязательств"
        - "(?i)независим[а-я]+\\s+гаранти"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: было ли первоначальное обязательство
        обеспечено, и если да — каким способом.

        Нормативный ориентир:
        - ст. 329 ГК РФ
        - ст. 352 ГК РФ
        - ст. 367 ГК РФ

        Важно:
        - Не оценивай серьёзность риска и не делай правовой вывод о том,
          сохраняется ли обеспечение после отступного.
        - Устанавливай только то, что прямо есть в тексте соглашения.
        - Не анализируй сумму долга, объём прекращения, предмет отступного —
          это отдельные вопросы, не относящиеся к данной проверке.
        - Общая фраза вроде "обязательство обеспечено в порядке, предусмотренном
          законодательством" или "стороны предусмотрели надлежащее обеспечение
          исполнения" без указания конкретного способа обеспечения (залог,
          поручительство, банковская гарантия) НЕ является основанием для
          "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора прямое указание на то, что первоначальное
        обязательство было обеспечено (залогом, поручительством, банковской
        гарантией, независимой гарантией или иным конкретно названным способом),
        либо прямое указание на отсутствие обеспечения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не делай вывод о наличии обеспечения по умолчанию, если оно прямо
           не упомянуто в тексте.
        4. Общая фраза о "надлежащем обеспечении" без названия конкретного
           способа — это not_defined, а не defined.
        5. Если данных нет — возвращай "not_defined" для статуса и
           соответствующий текстовый fallback.
        6. В evidence включай только цитаты из соглашения.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обеспечение определено конкретно:
        Фрагмент:
        "Обязательство Должника по Договору займа № 4 от 05.02.2023 обеспечено
        залогом оборудования по Договору залога № 4-З от 05.02.2023."

        Ответ:
        {
          "secured_obligation_status": "defined",
          "secured_obligation_type": "pledge",
          "secured_obligation_value": "Обеспечено залогом оборудования по Договору залога № 4-З от 05.02.2023",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство Должника по Договору займа № 4 от 05.02.2023 обеспечено залогом оборудования по Договору залога № 4-З от 05.02.2023."
            }
          ]
        }

        Пример 2 — прямое указание на отсутствие обеспечения:
        Фрагмент:
        "Первоначальное обязательство не было обеспечено."

        Ответ:
        {
          "secured_obligation_status": "defined",
          "secured_obligation_type": "none",
          "secured_obligation_value": "Не было обеспечено",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Первоначальное обязательство не было обеспечено."
            }
          ]
        }

        Пример 3 — тема не упомянута:
        Фрагмент:
        "Стороны договорились прекратить обязательство по Договору поставки № 15."

        Ответ:
        {
          "secured_obligation_status": "not_defined",
          "secured_obligation_type": "not_defined",
          "secured_obligation_value": "Не установлено",
          "evidence": []
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стороны предусмотрели надлежащее обеспечение исполнения обязательств
        в соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "secured_obligation_status": "not_defined",
          "secured_obligation_type": "not_defined",
          "secured_obligation_value": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обеспечении обязательства или его отсутствии.
        2. Если обеспечение упомянуто — определи его способ (залог, поручительство,
           банковская гарантия, иное).
        3. Проверь: не является ли формулировка общей фразой о "надлежащем
           обеспечении" без названия конкретного способа — если да, это not_defined.
        4. Если прямой цитаты нет — верни "not_defined" / "Не установлено".
        5. Не додумывай наличие обеспечения по умолчанию.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "secured_obligation_status": "<defined / not_defined>",
          "secured_obligation_type": "<pledge / suretyship / bank_guarantee / other / none / not_defined>",
          "secured_obligation_value": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обеспечение обязательства залог поручительство банковская гарантия независимая гарантия договор залога договор поручительства"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "предмет отступного"
        - "передача имущества"
        - "стоимость отступного"
        - "основной долг"
        - "остаток долга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.60]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о том, было ли первоначальное обязательство обеспечено,
        и если да — каким способом.
        Не анализируй сумму долга, объём прекращения, предмет отступного
        или иные темы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. secured_obligation_status — "defined" если в тексте прямо указано,
           что обязательство обеспечено конкретным способом, либо прямо указано,
           что оно не было обеспечено, иначе "not_defined". Общая фраза о
           "надлежащем обеспечении" без названия способа — это not_defined.
        2. secured_obligation_type — "pledge" (залог) / "suretyship" (поручительство) /
           "bank_guarantee" (банковская или независимая гарантия) / "other" (иной
           прямо названный способ) / "none" (прямо указано отсутствие обеспечения) /
           "not_defined" (не упомянуто или упомянуто обобщённо без конкретики).
        3. secured_obligation_value — краткое user-facing описание обеспечения
           или его отсутствия. Формат: одна краткая фраза (например, "Обеспечено
           залогом оборудования по Договору залога № 4-З от 05.02.2023"), без
           пересказа полного текста пункта.

        Если данные отсутствуют:
        - secured_obligation_status → "not_defined"
        - secured_obligation_type → "not_defined"
        - secured_obligation_value → "Не установлено"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о "надлежащем обеспечении" или "обеспечении в соответствии
          с законодательством" без указания конкретного способа (залог,
          поручительство, банковская гарантия) — это not_defined, а не defined.
        - Не делай вывод о наличии обеспечения по умолчанию, если оно прямо
          не упомянуто в тексте.
        - Не анализируй сумму долга, объём прекращения обязательства, предмет
          отступного или его стоимость — это отдельные вопросы.
        - Если прямо указано отсутствие обеспечения — это "defined" со значением
          "none", а не "not_defined".
        - Если в разных фрагментах контекста указаны противоречивые сведения
          об обеспечении и конфликт нельзя разрешить по тексту — верни
          "not_defined" для статуса и "Не удалось определить" для значения.
        - Значение должно быть кратким — одна фраза, без пересказа целого пункта.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 3 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для secured_obligation_status используй только: "defined" или "not_defined".
        - Для secured_obligation_type используй только: "pledge", "suretyship",
          "bank_guarantee", "other", "none" или "not_defined".
        - Для secured_obligation_value при отсутствии данных используй только:
          "Не установлено".
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "secured_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на обеспечение первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "secured_obligation_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["pledge", "suretyship", "bank_guarantee", "other", "none", "not_defined"]
          display_in_grid: false
          description: "Способ обеспечения первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "secured_obligation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обеспечение обязательства"
          description: >
            Описание способа обеспечения первоначального обязательства или
            указание на его отсутствие.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

      store_payload: true

  - id: otsupnoe_subject_and_transfer_check
    name: "Предмет отступного, механизм передачи и срок предоставления"
    description: >
      Фактографическая проверка предмета отступного: деньги, движимое имущество,
      недвижимость, право требования, ценные бумаги; механизма передачи;
      срока предоставления; необходимости регистрации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отступное"
        - "предмет отступного"
        - "передача имущества"
        - "акт приема-передачи"
        - "право требования"
        - "денежные средства"
        - "недвижимость"
        - "автомобиль"
        - "в течение"
        - "не позднее"
        - "срок передачи"
        - "срок предоставления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дней|банковск)"
        - "(?i)срок\\s+(передач|предоставлен).*отступн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: предмет отступного, механизм передачи, срок предоставления.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 131, 551 ГК РФ
        - ст. 382–390 ГК РФ

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте соглашения.
        - Не выводи необходимость регистрации автоматически из типа предмета —
          фиксируй регистрацию только если она прямо упомянута в тексте.
        - Общая фраза вроде "предмет отступного определяется по соглашению
          сторон", "передача осуществляется в установленном законом порядке"
          или "в разумный срок" без конкретного описания предмета, механизма
          или срока НЕ является основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой тип отступного указан.
        2. Как описан предмет отступного.
        3. Есть ли индивидуализирующие признаки предмета.
        4. Какой документ / механизм передачи указан.
        5. Какой срок предоставления отступного указан.
        6. Есть ли последствия просрочки.
        7. Требуется ли регистрация.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай описание предмета.
        3. Не выводи регистрацию по умолчанию из типа предмета (например, из того,
           что предмет — недвижимость) — только если регистрация прямо упомянута.
        4. Если срок передачи определяется через отсылку к приложению, графику
           или иному названному документу — это не отсутствие регулирования,
           отрази это как понятную формулировку.
        5. Общая фраза без конкретного описания предмета, механизма или срока
           (например, "в разумный срок", "в установленном порядке") — это
           not_defined, а не defined.
        6. Если данных нет — верни "not_defined" для статусов/enum и
           соответствующий текстовый fallback для текстовых полей.
        7. Не используй None/null/пустые строки.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. Evidence — только текст соглашения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору автомобиль Toyota Camry,
        VIN XXXXXXXXXXXXXXXX, по акту приема-передачи не позднее 5 рабочих дней
        с даты подписания настоящего соглашения."

        Ответ:
        {
          "otsupnoe_type": "movable_property",
          "otsupnoe_description_status": "defined",
          "otsupnoe_description_value": "Автомобиль Toyota Camry",
          "identifying_features_status": "defined",
          "identifying_features_value": "VIN XXXXXXXXXXXXXXXX",
          "transfer_document": "act",
          "transfer_deadline_status": "defined",
          "transfer_deadline_value": "Не позднее 5 рабочих дней с даты подписания",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Не установлены",
          "registration_required": "no",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору автомобиль Toyota Camry, VIN XXXXXXXXXXXXXXXX, по акту приема-передачи не позднее 5 рабочих дней с даты подписания настоящего соглашения."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Отступное передается кредитору."

        Ответ:
        {
          "otsupnoe_type": "not_defined",
          "otsupnoe_description_status": "not_defined",
          "otsupnoe_description_value": "Не установлено",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Не установлены",
          "transfer_document": "not_defined",
          "transfer_deadline_status": "not_defined",
          "transfer_deadline_value": "Не установлен",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Не установлены",
          "registration_required": "not_defined",
          "evidence": []
        }

        Пример 3 — смешанный предмет, срок по отсылке к приложению:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору денежные средства
        в размере 300 000 рублей и оборудование согласно перечню, указанному
        в Приложении №1. Срок передачи — согласно графику, указанному
        в Приложении №2."

        Ответ:
        {
          "otsupnoe_type": "mixed",
          "otsupnoe_description_status": "defined",
          "otsupnoe_description_value": "Денежные средства 300 000 рублей и оборудование согласно Приложению №1",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Не установлены",
          "transfer_document": "mixed",
          "transfer_deadline_status": "defined",
          "transfer_deadline_value": "Согласно графику, указанному в Приложении №2",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Не установлены",
          "registration_required": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "В качестве отступного Должник передает Кредитору денежные средства в размере 300 000 рублей и оборудование согласно перечню, указанному в Приложении №1. Срок передачи — согласно графику, указанному в Приложении №2."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Предмет отступного определяется по соглашению сторон и передается
        в разумный срок в порядке, установленном действующим законодательством
        Российской Федерации."

        Ответ:
        {
          "otsupnoe_type": "not_defined",
          "otsupnoe_description_status": "not_defined",
          "otsupnoe_description_value": "Не установлено",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Не установлены",
          "transfer_document": "not_defined",
          "transfer_deadline_status": "not_defined",
          "transfer_deadline_value": "Не установлен",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Не установлены",
          "registration_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе и описании отступного.
        2. Найди прямую цитату о сроке передачи; если срок определяется через
           отсылку к приложению/графику — отрази это как понятную формулировку.
        3. Найди прямую цитату о механизме передачи.
        4. Проверь: не является ли формулировка общей фразой без конкретики
           ("в разумный срок", "в установленном порядке") — если да, это not_defined.
        5. Если данных нет — верни "not_defined" и соответствующий fallback.
        6. Не додумывай регистрационный режим, если он прямо не упомянут в тексте.
        7. Если фрагменты противоречат друг другу (например, разные описания
           предмета) — верни "not_defined" / "Не удалось определить".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "otsupnoe_type": "<money / movable_property / real_estate / claim / securities / mixed / not_defined>",
          "otsupnoe_description_status": "<defined / not_defined>",
          "otsupnoe_description_value": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "transfer_document": "<payment / act / assignment_docs / registration / mixed / not_defined>",
          "transfer_deadline_status": "<defined / not_defined>",
          "transfer_deadline_value": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "late_transfer_consequences_status": "<defined / not_defined>",
          "late_transfer_consequences_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "registration_required": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отступное предмет отступного передача имущества акт приёма-передачи право требования денежные средства недвижимость автомобиль в течение не позднее срок передачи срок предоставления VIN кадастровый номер регистрация"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство"
        - "основной долг"
        - "проценты по долгу"
        - "неустойка по первоначальному обязательству"
        - "остаток долга"
        - "стоимость отступного как погашение"
        - "с момента передачи прекращается обязательство"
        - "не является новацией"
        - "залог прекращается"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.18
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        предмет отступного, механизм его передачи, срок предоставления,
        последствия просрочки и необходимость регистрации.
        Не анализируй первоначальный долг, банкротный контекст, налоги или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. otsupnoe_type — "money" / "movable_property" / "real_estate" / "claim" /
           "securities" / "mixed" / "not_defined".
        2. otsupnoe_type_display — читаемое отображение типа отступного на русском языке.
        3. otsupnoe_description_status — "defined" если предмет отступного прямо описан
           конкретно (наименование объекта, вид имущества), иначе "not_defined".
           Фраза "по соглашению сторон" без конкретного описания — not_defined.
        4. otsupnoe_description_value — краткое описание предмета отступного.
           Формат: одна краткая фраза (например, "Автомобиль Toyota Camry"),
           без пересказа всего пункта. Fallback — "Не установлено".
        5. identifying_features_status — "defined" если индивидуализирующие признаки
           прямо указаны, иначе "not_defined".
        6. identifying_features_value — VIN, кадастровый номер, номер ценной бумаги и т.п.
           Fallback — "Не установлены".
        7. transfer_document — "payment" / "act" / "assignment_docs" / "registration" /
           "mixed" / "not_defined". Фраза "в порядке, установленном законодательством"
           без указания конкретного механизма — not_defined.
        8. transfer_document_display — читаемое отображение механизма передачи
           на русском языке.
        9. transfer_deadline_status — "defined" если срок предоставления прямо указан
           конкретной датой/периодом (включая случаи, когда срок определяется
           через отсылку к приложению или графику), иначе "not_defined". Фраза
           "в разумный срок" без конкретики — not_defined.
        10. transfer_deadline_value — срок передачи/предоставления отступного.
            Формат: краткая фраза с конкретным периодом или отсылкой. Fallback —
            "Не установлен".
        11. late_transfer_consequences_status — "defined" если последствия просрочки
            прямо указаны, иначе "not_defined".
        12. late_transfer_consequences_value — последствия просрочки передачи.
            Fallback — "Не установлены".
        13. registration_required — "yes" / "no" / "not_defined". Фраза "регистрация
            осуществляется в установленном порядке" без явного да/нет о самой
            необходимости регистрации применительно к данной сделке — not_defined.
        14. registration_required_display — читаемое отображение необходимости
            регистрации на русском языке.

        Правила заполнения *_display полей:
        - otsupnoe_type_display: "Денежные средства" / "Движимое имущество" /
          "Недвижимость" / "Право требования" / "Ценные бумаги" /
          "Смешанный предмет" / "Не установлен".
        - transfer_document_display: "Платёж" / "Акт приёма-передачи" /
          "Документы уступки права" / "Государственная регистрация" /
          "Смешанный механизм" / "Не установлен".
        - registration_required_display: "Требуется" / "Не требуется" /
          "Не установлено".

        Если данные отсутствуют, используй следующий fallback:
        - otsupnoe_description_value → "Не установлено"
        - identifying_features_value → "Не установлены"
        - transfer_deadline_value → "Не установлен"
        - late_transfer_consequences_value → "Не установлены"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением — не пропускай ключи.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретного описания предмета, механизма или срока
          (например, "по соглашению сторон", "в разумный срок", "в установленном
          законом порядке") — это not_defined, а не defined. Правило применяется
          ко всем полям check-а без исключения.
        - otsupnoe_type:
            - "money" — денежные средства.
            - "movable_property" — движимое имущество (автомобиль, оборудование и т.п.).
            - "real_estate" — недвижимое имущество (квартира, здание, земельный участок).
            - "claim" — право требования к третьему лицу.
            - "securities" — ценные бумаги (акции, облигации, векселя).
            - "mixed" — несколько разнотипных объектов одновременно.
            - "not_defined" — тип предмета прямо не определён.
        - transfer_document:
            - "payment" — безналичный платёж (для денег).
            - "act" — акт приёма-передачи (для движимого имущества).
            - "assignment_docs" — акт и документы уступки (для прав требования).
            - "registration" — государственная регистрация (для недвижимости).
            - "mixed" — несколько механизмов одновременно.
            - "not_defined" — механизм передачи прямо не определён.
        - registration_required:
            - "yes" — регистрация прямо предусмотрена текстом соглашения.
            - "no" — прямо указано, что регистрация не требуется.
            - "not_defined" — вопрос регистрации в тексте прямо не урегулирован.
        - Не выводи registration_required = "yes" автоматически из того, что
          otsupnoe_type = "real_estate" — фиксируй регистрацию только если она
          прямо упомянута в тексте соглашения.
        - Если срок передачи определяется через отсылку к приложению, графику,
          спецификации или иному названному документу, это не отсутствие
          регулирования — верни defined с понятной формулировкой
          (например: "Согласно графику, указанному в Приложении №2").
        - Не смешивай механизм передачи с моментом прекращения обязательства.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны разные описания предмета, сроки или
          механизмы передачи и конфликт нельзя разрешить по тексту, верни
          "not_defined" для статуса/enum и "Не удалось определить" для
          текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 14 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для otsupnoe_type используй только: "money", "movable_property",
          "real_estate", "claim", "securities", "mixed" или "not_defined".
        - Для transfer_document используй только: "payment", "act",
          "assignment_docs", "registration", "mixed" или "not_defined".
        - Для registration_required используй только: "yes", "no" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          otsupnoe_description_value → "Не установлено"
          identifying_features_value → "Не установлены"
          transfer_deadline_value → "Не установлен"
          late_transfer_consequences_value → "Не установлены"
        - Для текстовых полей при неразрешимом противоречии используй только:
          "Не удалось определить".
        </output_expectations>

      fields:
        - name: "otsupnoe_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["money", "movable_property", "real_estate", "claim", "securities", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип отступного. Внутреннее enum-поле, отображается через otsupnoe_type_display."
          required: true

        - name: "otsupnoe_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип отступного"
          description: >
            Читаемое отображение типа отступного: "Денежные средства",
            "Движимое имущество", "Недвижимость", "Право требования",
            "Ценные бумаги", "Смешанный предмет" или "Не установлен".
          required: true

        - name: "otsupnoe_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания предмета отступного. Внутреннее enum-поле."
          required: true

        - name: "otsupnoe_description_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Предмет отступного"
          description: >
            Описание предмета отступного.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "identifying_features_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания индивидуализирующих признаков. Внутреннее enum-поле."
          required: true

        - name: "identifying_features_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Идентификаторы предмета"
          description: >
            Индивидуализирующие признаки предмета отступного (VIN, кадастровый
            номер, номер ценной бумаги и т.п.). Доступно в drawer.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "transfer_document"
          type: "string"
          presentation: "signal"
          allowed_values: ["payment", "act", "assignment_docs", "registration", "mixed", "not_defined"]
          display_in_grid: false
          description: "Механизм оформления передачи отступного. Внутреннее enum-поле, отображается через transfer_document_display."
          required: true

        - name: "transfer_document_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Механизм передачи"
          description: >
            Читаемое отображение механизма передачи отступного: "Платёж",
            "Акт приёма-передачи", "Документы уступки права",
            "Государственная регистрация", "Смешанный механизм" или "Не установлен".
          required: true

        - name: "transfer_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока предоставления отступного. Внутреннее enum-поле."
          required: true

        - name: "transfer_deadline_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Срок предоставления отступного"
          description: >
            Срок передачи/предоставления отступного.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "late_transfer_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания последствий просрочки передачи. Внутреннее enum-поле."
          required: true

        - name: "late_transfer_consequences_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Последствия просрочки передачи"
          description: >
            Последствия просрочки передачи отступного. Доступно в drawer.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false

        - name: "registration_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Требуется ли регистрация для передачи отступного. Внутреннее enum-поле, отображается через registration_required_display."
          required: true

        - name: "registration_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Требуется регистрация"
          description: >
            Читаемое отображение необходимости регистрации: "Требуется",
            "Не требуется" или "Не установлено".
          required: true
      store_payload: true

  - id: real_character_and_termination_moment_check
    name: "Реальный характер соглашения и момент прекращения обязательства"
    description: >
      Фактографическая проверка того, к какому моменту текст договора
      привязывает прекращение обязательства: к фактическому предоставлению,
      к регистрации, к зачислению денег или к подписанию соглашения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "с момента передачи отступного"
        - "с момента фактической передачи"
        - "после предоставления отступного"
        - "с момента зачисления денежных средств"
        - "с момента государственной регистрации"
        - "с даты подписания"
        - "реальная сделка"
      keyword_mode: "any"
      negative_keywords:
        - "обязательство прекращается с даты подписания настоящего соглашения"
        - "обязательство прекращается с момента заключения настоящего соглашения"
      regex_patterns:
        - "(?i)обязательств(о|а).*прекраща(ется|ются).*с\\s+момента"
        - "(?i)с\\s+момента\\s+фактическ(ой|ого)\\s+передач"
        - "(?i)с\\s+даты\\s+подписания"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какой момент прекращения обязательства
        прямо указан в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        Важно:
        - Не подменяй текст нормой закона.
        - Не смешивай дату подписания акта приёма-передачи (событие, относящееся
          к фактической передаче) с датой подписания самого соглашения
          об отступном (это разные события с разными правовыми последствиями).
        - Различай два случая: (1) формулировка называет конкретное событие
          момента прекращения, но оно не подпадает чётко ни под один из 4
          перечисленных кодов — тогда status = "defined", code = "not_defined";
          (2) формулировка вообще не называет никакого события, а лишь отсылает
          к "настоящему соглашению" или "законодательству" в общем виде
          (например, "обязательство прекращается в соответствии с настоящим
          соглашением") — тогда status = "not_defined" И code = "not_defined",
          поскольку тема по существу не раскрыта.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прекращается ли обязательство с момента фактической передачи.
        2. Прекращается ли обязательство с момента государственной регистрации.
        3. Прекращается ли обязательство с момента зачисления денежных средств.
        4. Прекращается ли обязательство с даты подписания соглашения.
        5. Есть ли указание, что кредитор сохраняет право требовать исполнение
           до фактического предоставления отступного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подменяй текст нормы закона.
        3. Не делай квалификационный вывод вовне — только извлекай факт.
        4. Не путай подписание акта приёма-передачи с подписанием самого соглашения.
        5. Формулировка, которая называет конкретное событие, но не подпадает
           чётко ни под один из 4 кодов — status "defined", code "not_defined".
        6. Формулировка, которая НЕ называет никакого конкретного события
           (общая отсылка к "настоящему соглашению" или "законодательству") —
           status "not_defined" И code "not_defined".
        7. Если момент не указан прямо — верни "not_defined" для статуса/кода и
           соответствующий текстовый fallback.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — конкретное событие, код определён:
        Фрагмент:
        "Обязательство Должника считается прекращенным с момента фактической передачи
        Кредитору имущества, указанного в п. 2.1 настоящего соглашения."

        Ответ:
        {
          "termination_moment_code": "upon_actual_transfer",
          "termination_moment_status": "defined",
          "termination_moment_details": "С момента фактической передачи Кредитору имущества",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство Должника считается прекращенным с момента фактической передачи Кредитору имущества, указанного в п. 2.1 настоящего соглашения."
            }
          ]
        }

        Пример 2 — конкретное событие (дата подписания соглашения):
        Фрагмент:
        "Обязательство прекращается с даты подписания настоящего соглашения."

        Ответ:
        {
          "termination_moment_code": "upon_signing",
          "termination_moment_status": "defined",
          "termination_moment_details": "С даты подписания настоящего соглашения",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство прекращается с даты подписания настоящего соглашения."
            }
          ]
        }

        Пример 3 — конкретное событие, не подпадающее чётко под код:
        Фрагмент:
        "Обязательство Должника прекращается с момента исполнения сторонами
        всех обязательств по настоящему соглашению. До фактической передачи
        отступного Кредитор вправе требовать исполнения первоначального
        обязательства в полном объеме."

        Ответ:
        {
          "termination_moment_code": "not_defined",
          "termination_moment_status": "defined",
          "termination_moment_details": "С момента исполнения сторонами всех обязательств по настоящему соглашению",
          "creditor_right_preserved_until_transfer_status": "defined",
          "creditor_right_preserved_until_transfer_details": "До фактической передачи отступного Кредитор вправе требовать исполнения первоначального обязательства в полном объёме",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Обязательство Должника прекращается с момента исполнения сторонами всех обязательств по настоящему соглашению. До фактической передачи отступного Кредитор вправе требовать исполнения первоначального обязательства в полном объеме."
            }
          ]
        }

        Пример 4 — общая фраза без конкретного события (generic-clause ловушка):
        Фрагмент:
        "Обязательство Должника прекращается в соответствии с условиями
        настоящего соглашения и действующим законодательством Российской
        Федерации."

        Ответ:
        {
          "termination_moment_code": "not_defined",
          "termination_moment_status": "not_defined",
          "termination_moment_details": "Не установлен",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Не установлено",
          "evidence": []
        }

        Пример 5 — полностью не определено:
        Фрагмент:
        "Стороны заключили настоящее соглашение об отступном."

        Ответ:
        {
          "termination_moment_code": "not_defined",
          "termination_moment_status": "not_defined",
          "termination_moment_details": "Не установлен",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте прекращения.
        2. Проверь, не перепутан ли момент подписания соглашения с моментом
           подписания акта приёма-передачи.
        3. Определи: формулировка называет конкретное событие (пусть и не
           подпадающее под 4 кода) или это общая отсылка без конкретики?
           Если общая отсылка — status "not_defined" и code "not_defined".
           Если конкретное событие вне 4 кодов — status "defined", code "not_defined".
        4. Найди прямую цитату о сохранении права кредитора до предоставления.
        5. Общая фраза "в установленном законом порядке" без конкретики — это
           not_defined для creditor_right_preserved.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        7. Не выводи момент прекращения по умолчанию из закона, если его нет в тексте.
        8. Не додумывай намерения сторон.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_moment_code": "<upon_actual_transfer / upon_registration / upon_payment_receipt / upon_signing / not_defined>",
          "termination_moment_status": "<defined / not_defined>",
          "termination_moment_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "creditor_right_preserved_until_transfer_status": "<defined / not_defined>",
          "creditor_right_preserved_until_transfer_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "с момента передачи отступного с момента фактической передачи после предоставления отступного с момента зачисления денежных средств с момента государственной регистрации с даты подписания реальная сделка обязательство считается прекращённым"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "срок передачи отступного"
        - "не позднее"
        - "в течение дней"
        - "последствия просрочки"
        - "стоимость отступного"
        - "не является новацией"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        момент прекращения обязательства и указание на сохранение права кредитора
        до фактического предоставления отступного.
        Не анализируй предмет отступного, стоимость, налоги или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_moment_code — "upon_actual_transfer" / "upon_registration" /
           "upon_payment_receipt" / "upon_signing" / "not_defined".
        2. termination_moment_status — "defined" если момент прекращения прямо
           назван конкретным событием в тексте (независимо от того, удалось ли
           классифицировать его по одному из 4 кодов), иначе "not_defined".
           Общая отсылка к "настоящему соглашению" или "законодательству" без
           названия конкретного события — это not_defined для ОБОИХ полей
           (status и code), а не только для code.
        3. termination_moment_details — точная формулировка о моменте прекращения
           обязательства. Формат: краткая цитата или её сжатый пересказ (одна
           фраза), без домысливания. Fallback — "Не установлен".
        4. creditor_right_preserved_until_transfer_status — "defined" если прямо
           указано, что кредитор сохраняет право требовать исполнение
           первоначального обязательства до фактического предоставления
           отступного, иначе "not_defined". Общая фраза "права сторон сохраняются
           в установленном законом порядке" без конкретного упоминания права
           требовать исполнения — это not_defined.
        5. creditor_right_preserved_until_transfer_details — формулировка о
           сохранении права кредитора. Fallback — "Не установлено".

        Если данные отсутствуют, используй следующий fallback:
        - termination_moment_details → "Не установлен"
        - creditor_right_preserved_until_transfer_details → "Не установлено"
        - соответствующий статус/код → "not_defined"

        Если формулировка о моменте прекращения присутствует и называет
        конкретное событие, но это событие не соответствует чётко ни одному
        из перечисленных кодов (например, привязана к исполнению всех
        обязательств по соглашению или к нескольким событиям одновременно):
        - termination_moment_code → "not_defined"
        - termination_moment_status → "defined"
        - termination_moment_details → точная формулировка из текста

        Если формулировка НЕ называет никакого конкретного события, а является
        общей отсылкой ("в соответствии с настоящим соглашением", "согласно
        законодательству РФ"):
        - termination_moment_code → "not_defined"
        - termination_moment_status → "not_defined"
        - termination_moment_details → "Не установлен"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/код → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретного события ("в соответствии с настоящим
          соглашением", "согласно действующему законодательству") — это
          not_defined как для статуса, так и для кода. Правило применяется
          ко всем полям check-а без исключения.
        - termination_moment_code:
            - "upon_actual_transfer" — обязательство прекращается с момента фактической
              передачи предмета отступного (акт, фактическая передача имущества).
            - "upon_registration" — обязательство прекращается с момента государственной
              регистрации перехода права (для недвижимости).
            - "upon_payment_receipt" — обязательство прекращается с момента зачисления
              денежных средств на счёт кредитора (для денежного отступного).
            - "upon_signing" — обязательство прекращается с даты подписания
              самого соглашения об отступном.
            - "not_defined" — момент прекращения прямо не определён, либо
              формулировка не подпадает чётко ни под один из перечисленных кодов,
              либо формулировка является общей отсылкой без конкретики.
        - Не путай дату подписания акта приёма-передачи (относится к
          "upon_actual_transfer") с датой подписания самого соглашения об
          отступном (относится к "upon_signing") — это разные события.
        - Код и статус не обязаны совпадать по смыслу "определено/не определено"
          ТОЛЬКО в случае, когда формулировка называет конкретное, но
          неклассифицируемое событие: тогда код "not_defined", а статус "defined"
          с точной формулировкой в details. Если же формулировка вообще не
          называет конкретного события — оба поля "not_defined".
        - Не выводи момент прекращения из нормы ст. 409 ГК РФ или иных норм закона —
          только из текста соглашения.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны противоречивые сведения о моменте
          прекращения или о сохранении права кредитора и конфликт нельзя
          разрешить по тексту, верни "not_defined" для статуса/кода и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 5 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для termination_moment_code используй только: "upon_actual_transfer",
          "upon_registration", "upon_payment_receipt", "upon_signing" или "not_defined".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для termination_moment_details при отсутствии данных используй только:
          "Не установлен".
        - Для creditor_right_preserved_until_transfer_details при отсутствии
          данных используй только: "Не установлено".
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "termination_moment_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_actual_transfer", "upon_registration", "upon_payment_receipt", "upon_signing", "not_defined"]
          display_in_grid: false
          description: "Момент прекращения обязательства по тексту соглашения. Внутреннее enum-поле, отображается через termination_moment_code_display."
          required: true

        - name: "termination_moment_code_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Момент прекращения (тип условия)"
          description: >
            Читаемое отображение момента прекращения обязательства: "С момента
            фактической передачи", "С момента государственной регистрации",
            "С момента зачисления денежных средств", "С даты подписания соглашения"
            или "Не установлен" (в том числе если формулировка не классифицируется
            чётко ни под один из типов, но при этом присутствует — см.
            termination_moment_details).
          required: true

        - name: "termination_moment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания момента прекращения обязательства. Внутреннее enum-поле."
          required: true

        - name: "termination_moment_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Момент прекращения обязательства"
          description: >
            Точная формулировка о моменте прекращения обязательства.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "creditor_right_preserved_until_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания, что право кредитора сохраняется до предоставления отступного. Внутреннее enum-поле."
          required: true

        - name: "creditor_right_preserved_until_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Сохранение права кредитора до предоставления"
          description: >
            Формулировка о сохранении права кредитора до фактического
            предоставления отступного.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: valuation_and_settlement_scope_check
    name: "Стоимость отступного, объём погашения долга и окончательность расчётов"
    description: >
      Фактографическая проверка согласованной стоимости отступного,
      объёма погашения долга, остатка долга при частичном погашении,
      а также оговорок об окончательности урегулирования.
      Примечание: объём погашения долга и остаток долга также отражены
      в check original_obligation_extraction; в DD Grid единственным
      видимым источником этих фактов является original_obligation_extraction,
      здесь они используются как скрытый контекст для оценки стоимости.
    triggers:
      any: ["partial_termination", "tax_sensitive_structure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "стоимость отступного"
        - "оценивается сторонами"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
        - "полное погашение"
        - "согласованная стоимость"
        - "стороны не имеют претензий"
        - "долг считается погашенным"
        - "прекращаются все обязательства"
        - "без права на предъявление дальнейших требований"
        - "отчет об оценке"
        - "независимый оценщик"
        - "рыночная стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+отступн"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"
        - "(?i)не\\s+имеют\\s+друг\\s+к\\s+другу\\s+претенз"
        - "(?i)долг\\s+считается\\s+погашенн"
        - "(?i)оценщик|отчет\\s+об\\s+оценке|рыночн[а-я]+\\s+стоимост"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: стоимость отступного, объём погашения долга,
        остаток долга и окончательность расчётов.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - НК РФ

        Важно:
        - Не путай стоимость отступного (согласованную цену передаваемого имущества/прав)
          с суммой первоначального долга (задолженностью, которая гасится) — это разные
          величины, обе могут присутствовать в тексте одновременно.
        - Если стоимость определяется через отсылку к приложению, акту оценки
          или иному названному документу — это не отсутствие регулирования.
        - Общая фраза вроде "стоимость определяется по соглашению сторон" без
          конкретной цифры или названного документа, либо "стороны урегулировали
          все вопросы в установленном порядке" без конкретного заявления об
          окончательности или отказе от претензий — НЕ является основанием
          для "defined". Это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли согласованная стоимость отступного.
        2. Есть ли указание на способ определения стоимости.
        3. Погашается долг полностью или частично.
        4. Если частично — определён ли остаток долга.
        5. Есть ли формулировка об окончательности урегулирования (конкретное
           обязательство считается погашенным/прекращённым).
        6. Есть ли отдельный отказ от дальнейших претензий (более широкое
           заявление об отсутствии взаимных требований между сторонами).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай стоимость, остаток долга и метод оценки.
        3. Не путай стоимость отступного с суммой первоначального долга.
        4. Если стоимость или объём погашения определяются через отсылку
           к приложению, акту оценки или иному документу — отрази это
           как понятную формулировку, а не как отсутствие данных.
        5. Общая фраза без конкретной цифры, метода оценки или содержательного
           заявления об окончательности/отказе от претензий — это not_defined,
           а не defined.
        6. Если данных нет — верни "not_defined" для статусов/enum и
           соответствующий текстовый fallback.
        7. Не используй None/null/пустые строки.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено:
        Фрагмент:
        "Стороны согласовали стоимость отступного в размере 900 000 рублей.
        Передача отступного прекращает обязательство в полном объеме.
        После исполнения настоящего соглашения стороны не имеют друг к другу
        каких-либо претензий."

        Ответ:
        {
          "agreed_value_status": "defined",
          "agreed_value_details": "900 000 рублей",
          "valuation_method": "contractual",
          "debt_termination_scope": "full",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Не установлен",
          "full_and_final_settlement_status": "defined",
          "full_and_final_settlement_details": "Обязательство прекращается в полном объёме",
          "no_further_claims_status": "defined",
          "no_further_claims_details": "Стороны не имеют друг к другу каких-либо претензий",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стороны согласовали стоимость отступного в размере 900 000 рублей. Передача отступного прекращает обязательство в полном объеме. После исполнения настоящего соглашения стороны не имеют друг к другу каких-либо претензий."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны договорились о передаче имущества."

        Ответ:
        {
          "agreed_value_status": "not_defined",
          "agreed_value_details": "Не установлена",
          "valuation_method": "not_defined",
          "debt_termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Не установлен",
          "full_and_final_settlement_status": "not_defined",
          "full_and_final_settlement_details": "Не установлено",
          "no_further_claims_status": "not_defined",
          "no_further_claims_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — оценка через отчёт, частичное погашение:
        Фрагмент:
        "Стоимость отступного определена согласно отчёту об оценке независимого
        оценщика ООО «Оценка+» от 12.03.2024 № 45 и составляет 1 200 000 рублей.
        Обязательство прекращается частично, остаток долга в размере 300 000
        рублей подлежит погашению в общем порядке."

        Ответ:
        {
          "agreed_value_status": "defined",
          "agreed_value_details": "1 200 000 рублей согласно отчёту об оценке ООО «Оценка+» от 12.03.2024 № 45",
          "valuation_method": "appraiser",
          "debt_termination_scope": "partial",
          "remaining_debt_status": "defined",
          "remaining_debt_details": "300 000 рублей",
          "full_and_final_settlement_status": "not_defined",
          "full_and_final_settlement_details": "Не установлено",
          "no_further_claims_status": "not_defined",
          "no_further_claims_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Стоимость отступного определена согласно отчёту об оценке независимого оценщика ООО «Оценка+» от 12.03.2024 № 45 и составляет 1 200 000 рублей. Обязательство прекращается частично, остаток долга в размере 300 000 рублей подлежит погашению в общем порядке."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стоимость отступного определяется по соглашению сторон. Стороны
        урегулировали все вопросы, связанные с исполнением обязательств,
        в порядке, установленном настоящим соглашением и действующим
        законодательством Российской Федерации."

        Ответ:
        {
          "agreed_value_status": "not_defined",
          "agreed_value_details": "Не установлена",
          "valuation_method": "not_defined",
          "debt_termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Не установлен",
          "full_and_final_settlement_status": "not_defined",
          "full_and_final_settlement_details": "Не установлено",
          "no_further_claims_status": "not_defined",
          "no_further_claims_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о стоимости отступного; убедись, что это не сумма
           первоначального долга.
        2. Найди прямую цитату о методе определения стоимости.
        3. Найди прямую цитату о полном/частичном погашении.
        4. Найди прямую цитату об остатке долга.
        5. Найди прямую цитату об окончательности урегулирования конкретного
           обязательства, отдельно — об отказе от дальнейших претензий в целом.
        6. Проверь: не является ли формулировка общей фразой без конкретной
           цифры или содержательного заявления — если да, это not_defined.
        7. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "agreed_value_status": "<defined / not_defined>",
          "agreed_value_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "valuation_method": "<contractual / market / appraiser / not_defined>",
          "debt_termination_scope": "<full / partial / not_defined>",
          "remaining_debt_status": "<defined / not_defined>",
          "remaining_debt_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "full_and_final_settlement_status": "<defined / not_defined>",
          "full_and_final_settlement_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "no_further_claims_status": "<defined / not_defined>",
          "no_further_claims_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость отступного оценивается сторонами в полном объёме частично остаток долга полное погашение согласованная стоимость стороны не имеют претензий долг считается погашенным прекращаются все обязательства без права на дальнейшие требования отчет об оценке независимый оценщик рыночная стоимость"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "сумма первоначального долга"
        - "основной долг по договору"
        - "предмет отступного"
        - "передача имущества"
        - "срок передачи"
        - "момент прекращения"
        - "не является новацией"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        согласованную стоимость отступного, метод её определения, объём погашения
        долга, остаток долга и оговорки об окончательности урегулирования.
        Не анализируй титул, банкротство, налоги, момент прекращения или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. agreed_value_status — "defined" если согласованная стоимость отступного
           прямо указана конкретной цифрой (в том числе через отсылку к
           приложению, акту оценки или иному документу), иначе "not_defined".
           Фраза "по соглашению сторон" без цифры или отсылки к документу —
           not_defined.
        2. agreed_value_details — стоимость отступного (не сумма первоначального
           долга). Формат: краткая фраза с цифрой (например, "900 000 рублей"
           или "1 200 000 рублей согласно отчёту об оценке..."). Fallback —
           "Не установлена".
        3. valuation_method — "contractual" / "market" / "appraiser" / "not_defined".
        4. debt_termination_scope — "full" / "partial" / "not_defined".
        5. remaining_debt_status — "defined" если остаток долга прямо указан
           или частичное прекращение прямо упомянуто, иначе "not_defined".
        6. remaining_debt_details — остаток долга после частичного прекращения;
           если частичное прекращение упомянуто без конкретной суммы — "Не
           установлен". Формат: краткая цифра с валютой.
        7. full_and_final_settlement_status — "defined" если прямо указано, что
           конкретное обязательство считается полностью погашенным/прекращённым,
           иначе "not_defined". Фраза "стороны урегулировали все вопросы в
           установленном порядке" без прямого указания на погашение
           конкретного обязательства — not_defined.
        8. full_and_final_settlement_details — формулировка об окончательности
           погашения конкретного обязательства. Формат: краткая фраза. Fallback —
           "Не установлено".
        9. no_further_claims_status — "defined" если прямо указан отдельный,
           более широкий отказ сторон от взаимных претензий друг к другу
           (не ограниченный только данным обязательством), иначе "not_defined".
           Общая фраза о "урегулировании в установленном порядке" без прямого
           заявления об отсутствии претензий — not_defined.
        10. no_further_claims_details — формулировка об отсутствии дальнейших
            претензий. Формат: краткая фраза. Fallback — "Не установлено".

        Если данные отсутствуют, используй следующий fallback:
        - agreed_value_details → "Не установлена"
        - remaining_debt_details → "Не установлен"
        - full_and_final_settlement_details → "Не установлено"
        - no_further_claims_details → "Не установлено"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретной цифры, метода оценки или содержательного
          заявления об окончательности/отказе от претензий (например, "по
          соглашению сторон", "в установленном порядке", "в соответствии с
          законодательством") — это not_defined, а не defined. Правило
          применяется ко всем полям check-а без исключения.
        - Не путай стоимость отступного с суммой первоначального долга — если
          в тексте есть обе величины, извлекай только согласованную стоимость
          передаваемого имущества/прав.
        - valuation_method:
            - "contractual" — стоимость определена соглашением сторон (прямо
              зафиксирована в тексте как договорённость, без ссылки на оценщика
              или рыночные данные).
            - "market" — стоимость определена по рыночной оценке, на которую
              есть прямая ссылка в тексте, без привлечения независимого оценщика.
            - "appraiser" — стоимость определена независимым оценщиком, отчёт
              которого прямо упомянут в тексте.
            - "not_defined" — метод определения стоимости прямо не указан.
        - debt_termination_scope и remaining_debt_details дублируются в check
          original_obligation_extraction и используются здесь только как контекст
          для оценки стоимости, не как основной предмет проверки.
        - full_and_final_settlement — это утверждение о конкретном прекращаемом
          обязательстве. no_further_claims — это более широкое заявление об
          отсутствии взаимных претензий между сторонами в целом. Не смешивай
          их: если в тексте есть только одна из формулировок, заполняй только
          соответствующее поле, второе оставляй "not_defined".
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны разные суммы стоимости или разный
          объём погашения и конфликт нельзя разрешить по тексту, верни
          "not_defined" для статуса/enum и "Не удалось определить" для
          текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 10 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для valuation_method используй только: "contractual", "market",
          "appraiser" или "not_defined".
        - Для debt_termination_scope используй только: "full", "partial"
          или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          agreed_value_details → "Не установлена"
          remaining_debt_details → "Не установлен"
          full_and_final_settlement_details → "Не установлено"
          no_further_claims_details → "Не установлено"
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "agreed_value_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания согласованной стоимости отступного. Внутреннее enum-поле."
          required: true

        - name: "agreed_value_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Стоимость отступного"
          description: >
            Согласованная стоимость отступного (не сумма первоначального долга).
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "valuation_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["contractual", "market", "appraiser", "not_defined"]
          display_in_grid: false
          description: "Метод определения стоимости отступного. Внутреннее enum-поле, отображается через valuation_method_display."
          required: true

        - name: "valuation_method_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Метод определения стоимости"
          description: >
            Читаемое отображение метода определения стоимости: "По соглашению
            сторон", "По рыночной оценке", "По отчёту независимого оценщика"
            или "Не установлен".
          required: true

        - name: "debt_termination_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "partial", "not_defined"]
          display_in_grid: false
          description: >
            Полное или частичное погашение долга. Внутреннее enum-поле, используется
            как скрытый контекст для оценки стоимости. Основной видимый источник
            этого факта в DD Grid — check original_obligation_extraction
            (поле termination_scope_display).
          required: true

        - name: "remaining_debt_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания остатка долга. Внутреннее enum-поле, скрытый контекст."
          required: true

        - name: "remaining_debt_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Остаток долга (контекст стоимости)"
          description: >
            Остаток долга после частичного прекращения. Используется как скрытый
            контекст для оценки стоимости отступного. Основной видимый источник
            этого факта в DD Grid — check original_obligation_extraction
            (поле remaining_debt_value). Не отображается в гриде во избежание
            дублирования.
          required: false

        - name: "full_and_final_settlement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки об окончательности урегулирования конкретного обязательства. Внутреннее enum-поле."
          required: true

        - name: "full_and_final_settlement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Окончательность погашения обязательства"
          description: >
            Формулировка о том, что конкретное прекращаемое обязательство
            считается полностью погашенным/прекращённым.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "no_further_claims_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отдельного отказа сторон от взаимных претензий в целом. Внутреннее enum-поле."
          required: true

        - name: "no_further_claims_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Отказ от взаимных претензий"
          description: >
            Формулировка о более широком отказе сторон от взаимных претензий
            друг к другу, не ограниченном только данным обязательством.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: recharacterization_distinction_check
    name: "Формулировки об отступном и отграничение от новации, прощения долга, зачёта"
    description: >
      Фактографическая проверка наличия в тексте прямой ссылки на ст. 409 ГК РФ,
      указания, что соглашение является отступным, а также оговорок о том,
      что конструкция не является новацией, прощением долга или зачётом.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "ст. 409 ГК РФ"
        - "является новацией"
        - "является прощением долга"
        - "является зачетом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+)?являет(ся|ются)\\s+новаци"
        - "(?i)(не\\s+)?являет(ся|ются)\\s+прощени(ем|я)\\s+долг"
        - "(?i)(не\\s+)?являет(ся|ются)\\s+зачет"
        - "(?i)замен(а|яет)\\s+обязательств"
        - "(?i)ст(?:атья|\\.)?\\s*409"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие квалифицирующие формулировки
        прямо есть в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 410 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        Важно:
        - Отсутствие защитной оговорки в тексте — это самостоятельный юридически
          значимый факт (повышенный риск переквалификации), а не техническая
          недоработка извлечения. Формулируй это прямо.
        - Различай два принципиально разных случая: (а) в тексте вообще нет
          упоминания новации/прощения долга/зачёта, и (б) в тексте прямо
          сказано, что соглашение ЯВЛЯЕТСЯ новацией/прощением долга/зачётом
          (то есть прямо подтверждает иную квалификацию, а не исключает её).
          Это разные по значимости риска ситуации.
        - Не выводи наличие защитной оговорки из заголовка документа
          ("Соглашение об отступном") или из общего смысла — только из
          содержательной формулировки в теле текста.
        - Общая фраза вроде "соглашение заключено в соответствии с требованиями
          действующего законодательства" (без явного упоминания номера ст. 409
          ГК РФ) или "стороны урегулировали обязательство надлежащим образом"
          (без слов "новация"/"зачёт"/"прощение долга") НЕ является основанием
          для "defined" или для статусов, отличных от "absent"/"not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямая ссылка на ст. 409 ГК РФ.
        2. Есть ли прямое указание, что соглашение является отступным.
        3. Есть ли оговорка о новации: отсутствует, прямо исключена, либо
           прямо подтверждена.
        4. Есть ли оговорка о прощении долга: отсутствует, прямо исключена,
           либо прямо подтверждена.
        5. Есть ли оговорка о зачёте: отсутствует, прямо исключена, либо
           прямо подтверждена.
        6. Есть ли формулировка "вместо исполнения" или аналогичная.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не делай самостоятельной переквалификации.
        3. Фиксируй только наличие / отсутствие текстовых формулировок.
        4. Каждую из трёх оговорок (новация/прощение долга/зачёт) оценивай
           независимо — упоминание одной не означает наличие другой.
        5. Общая фраза о соответствии законодательству без номера статьи —
           это not_defined для st409_reference.
        6. Общая фраза об "урегулировании обязательства" без явного упоминания
           новации/зачёта/прощения долга — это "absent" для соответствующей
           оговорки, а не "excluded_by_clause".
        7. Если формулировки нет — верни "absent".
        8. Если формулировка прямо исключает данную квалификацию — верни
           "excluded_by_clause".
        9. Если формулировка прямо утверждает данную квалификацию (то есть
           текст говорит обратное защитной оговорке) — верни "affirmed".
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью защищено:
        Фрагмент:
        "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ
        и не является новацией, прощением долга или зачётом."

        Ответ:
        {
          "st409_reference_status": "defined",
          "st409_reference_details": "Ссылка на ст. 409 ГК РФ",
          "qualification_as_otsupnoe_status": "defined",
          "qualification_as_otsupnoe_details": "Соглашение прямо названо соглашением об отступном",
          "novation_clause_status": "excluded_by_clause",
          "novation_clause_details": "Прямо указано: не является новацией",
          "debt_forgiveness_clause_status": "excluded_by_clause",
          "debt_forgiveness_clause_details": "Прямо указано: не является прощением долга",
          "setoff_clause_status": "excluded_by_clause",
          "setoff_clause_details": "Прямо указано: не является зачётом",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ и не является новацией, прощением долга или зачётом."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны урегулировали отношения настоящим соглашением."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "absent",
          "novation_clause_details": "Оговорка отсутствует в тексте",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "absent",
          "setoff_clause_details": "Оговорка отсутствует в тексте",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": []
        }

        Пример 3 — прямое утверждение иной квалификации:
        Фрагмент:
        "Стороны договорились о зачёте встречных однородных требований. Настоящее
        соглашение является новацией обязательства Должника."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "affirmed",
          "novation_clause_details": "Текст прямо утверждает: соглашение является новацией обязательства",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "affirmed",
          "setoff_clause_details": "Текст прямо утверждает зачёт встречных однородных требований",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Стороны договорились о зачёте встречных однородных требований. Настоящее соглашение является новацией обязательства Должника."
            }
          ]
        }

        Пример 4 — частичный набор оговорок:
        Фрагмент:
        "Настоящим Кредитор соглашается принять от Должника имущество вместо
        исполнения обязательства по Договору поставки № 15, при этом соглашение
        не является зачётом."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "absent",
          "novation_clause_details": "Оговорка отсутствует в тексте",
          "debt_forgiveness_clause_status": "absent",
