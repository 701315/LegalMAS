  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: СУДЬБА ОБЕСПЕЧЕНИЙ
  # ──────────────────────────────────────────────────────────────────────────
  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Фактографическая проверка того, урегулирована ли судьба обеспечений:
      залог, ипотека, поручительство, снятие залога, погашение ипотечной записи,
      возврат закладной, уведомление поручителей.
    triggers:
      any: ["secured_original_obligation"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
        - "залог прекращается"
        - "возврат закладной"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ|снят(ие|ь)\\s+залог"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: как в тексте урегулирована судьба обеспечений
        после прекращения основного обязательства.

        Нормативный ориентир:
        - ст. 329 ГК РФ
        - ст. 352 ГК РФ
        - ст. 367 ГК РФ
        - ФЗ-102, ФЗ-218

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли наличие обеспеченного обязательства.
        2. Какой вид обеспечения указан.
        3. Есть ли условие о прекращении обеспечения.
        4. Есть ли порядок погашения ипотечной записи.
        5. Есть ли условие о возврате закладной / документов по залогу.
        6. Есть ли указание на уведомление поручителей.
        7. Есть ли распределение расходов на действия по снятию обеспечения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не выводи судьбу обеспечения из закона, если этого нет в тексте.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "С прекращением основного обязательства прекращается залог автомобиля.
        Кредитор обязуется в течение 3 рабочих дней передать Должнику оригинал
        договора залога и подписать документы, необходимые для снятия обременения."

        Ответ:
        {
          "secured_obligation_identified_status": "defined",
          "secured_obligation_identified_details": "обязательство обеспечено залогом автомобиля",
          "security_type": "pledge",
          "security_termination_status": "defined",
          "security_termination_details": "с прекращением основного обязательства прекращается залог автомобиля",
          "mortgage_release_procedure_status": "not_defined",
          "mortgage_release_procedure_details": "Данные не определены",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "pledge_document_return_status": "defined",
          "pledge_document_return_details": "передать оригинал договора залога и подписать документы для снятия обременения",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "С прекращением основного обязательства прекращается залог автомобиля. Кредитор обязуется в течение 3 рабочих дней передать Должнику оригинал договора залога."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны урегулировали обязательство."

        Ответ:
        {
          "secured_obligation_identified_status": "not_defined",
          "secured_obligation_identified_details": "Данные не определены",
          "security_type": "not_defined",
          "security_termination_status": "not_defined",
          "security_termination_details": "Данные не определены",
          "mortgage_release_procedure_status": "not_defined",
          "mortgage_release_procedure_details": "Данные не определены",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "pledge_document_return_status": "not_defined",
          "pledge_document_return_details": "Данные не определены",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наличии обеспечения.
        2. Найди прямую цитату о прекращении обеспечения.
        3. Найди прямую цитату о снятии залога / ипотеки.
        4. Найди прямую цитату о возврате документов.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай вид обеспечения.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "secured_obligation_identified_status": "<defined / not_defined>",
          "secured_obligation_identified_details": "<текст или 'Данные не определены'>",
          "security_type": "<pledge / mortgage / surety / mixed / not_defined>",
          "security_termination_status": "<defined / not_defined>",
          "security_termination_details": "<текст или 'Данные не определены'>",
          "mortgage_release_procedure_status": "<defined / not_defined>",
          "mortgage_release_procedure_details": "<текст или 'Данные не определены'>",
          "surety_notification_status": "<defined / not_defined>",
          "surety_notification_details": "<текст или 'Данные не определены'>",
          "pledge_document_return_status": "<defined / not_defined>",
          "pledge_document_return_details": "<текст или 'Данные не определены'>",
          "security_release_costs_status": "<defined / not_defined>",
          "security_release_costs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение"
        - "снятие залога"
        - "закладная"
        - "погашение записи"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "secured_obligation_identified_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "secured_obligation_identified_details"
          type: "string"
        - name: "security_type"
          type: "string"
          allowed_values: ["pledge", "mortgage", "surety", "mixed", "not_defined"]
        - name: "security_termination_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "security_termination_details"
