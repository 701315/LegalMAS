    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "залог ипотека поручительство обеспечение прекращается снятие залога погашение записи об ипотеке закладная залогодержатель поручитель освобождение от обеспечения возврат закладной снятие обременения расходы на снятие обеспечения"
      retrieval_profile: "security_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "не заложено как гарантия при передаче"
        - "не арестовано"
        - "свободно от прав третьих лиц"
        - "риск случайной гибели"
        - "первоначальное обязательство"
        - "стоимость отступного"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        формулировки о судьбе обеспечений после прекращения основного обязательства:
        тип обеспечения, его прекращение (автоматическое или требующее отдельных
        действий), процедура снятия ипотечной записи, уведомление поручителей,
        возврат документов и расходы на снятие обеспечения.
        Не анализируй стоимость, банкротный контекст, налоги, споры, а также
        заверения об отсутствии обременений на сам предмет отступного
        (это отдельный вопрос).
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. secured_obligation_identified_status — "defined" если наличие
           обеспеченного обязательства прямо указано в тексте, иначе "not_defined".
        2. secured_obligation_identified_details — описание обеспеченного
           обязательства (используется как контекст для оценки судьбы
           обеспечения). Fallback — "Не идентифицировано".
        3. security_type — "pledge" / "mortgage" / "surety" / "mixed" / "not_defined".
        4. security_termination_status — "defined" если прекращение обеспечения
           прямо описано в тексте конкретным условием (автоматически или через
           названное действие), иначе "not_defined". Фраза "в порядке,
           установленном законодательством" без конкретики — not_defined.
        5. security_termination_details — формулировка о прекращении обеспечения;
           если из текста ясно, происходит ли прекращение автоматически (в силу
           факта прекращения основного обязательства) или требует отдельных
           действий сторон (подача заявления, подписание соглашения) — отрази
           это явно в формулировке. Формат: краткая фраза. Fallback —
           "Не урегулировано".
        6. mortgage_release_procedure_status — "defined" если процедура погашения
           ипотечной записи прямо описана конкретными действиями (кто подаёт,
           куда, в какой срок), иначе "not_defined".
        7. mortgage_release_procedure_details — формулировка о процедуре
           погашения ипотечной записи. Fallback — "Не описана".
        8. surety_notification_status — "defined" если уведомление поручителей
           прямо предусмотрено конкретным способом/сроком, иначе "not_defined".
           Фраза "поручитель уведомляется в порядке, предусмотренном
           законодательством" без конкретики — not_defined.
        9. surety_notification_details — формулировка об уведомлении поручителей.
           Fallback — "Не предусмотрено".
        10. pledge_document_return_status — "defined" если возврат закладной
            или документов по залогу прямо предусмотрен конкретным действием,
            иначе "not_defined".
        11. pledge_document_return_details — формулировка о возврате документов.
            Fallback — "Не предусмотрен".
        12. security_release_costs_status — "defined" если расходы на снятие
            обеспечения прямо распределены между сторонами конкретно, иначе
            "not_defined". Общая фраза "вопросы решаются в соответствии с
            законом" без конкретного распределения расходов — not_defined.
        13. security_release_costs_details — формулировка о распределении расходов.
            Fallback — "Не распределены".

        Если данные отсутствуют, используй следующий fallback:
        - secured_obligation_identified_details → "Не идентифицировано"
        - security_termination_details → "Не урегулировано"
        - mortgage_release_procedure_details → "Не описана"
        - surety_notification_details → "Не предусмотрено"
        - pledge_document_return_details → "Не предусмотрен"
        - security_release_costs_details → "Не распределены"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "в порядке, установленном законодательством" или "в
          соответствии с законом" без конкретного условия (кто, что, когда
          делает применительно к обеспечению) — это not_defined. Правило
          применяется ко всем полям check-а без исключения.
        - Не путай обеспечение первоначального обязательства (предмет этого
          check-а) с заверениями об отсутствии залога/ареста/прав третьих лиц
          на сам предмет отступного (передаваемое имущество) — это разные
          обеспечения и разные вопросы.
        - security_type:
            - "pledge" — залог движимого имущества (кроме ипотеки).
            - "mortgage" — залог недвижимого имущества (ипотека).
            - "surety" — поручительство.
            - "mixed" — несколько видов обеспечения одновременно.
            - "not_defined" — вид обеспечения прямо не указан.
        - security_termination_status = "defined" только если прекращение
          обеспечения прямо сформулировано в тексте конкретным условием; не
          выводи из общей нормы ст. 329 ГК РФ или общей фразы о законодательстве.
        - Различай автоматическое прекращение обеспечения и прекращение,
          требующее отдельных действий сторон (заявление в регистрирующий
          орган, подписание дополнительного соглашения, уведомление) — отражай
          это различие в security_termination_details.
        - mortgage_release_procedure_status = "defined" только если описаны
          конкретные действия по погашению ипотечной записи в ЕГРН (кто подаёт,
          куда, в какой срок), а не общая ссылка на закон.
        - pledge_document_return_status = "defined" только если возврат
          закладной или иных документов по залогу прямо предусмотрен конкретным
          действием.
        - Если в разных фрагментах указаны противоречивые сведения о виде
          обеспечения, его прекращении или сопутствующих процедурах и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса/enum и
          "Не удалось определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 13 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для security_type используй только: "pledge", "mortgage", "surety",
          "mixed" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только указанные
          в task fallback-формулировки, дословно.
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

