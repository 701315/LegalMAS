        severity: hard
        weight: -1.0
        description: "Новация — замена обязательства новым (ст. 414 ГК); не является отступным"

      - pattern: "(?i)соглашение\\s+о\\s+новации"
        severity: hard
        weight: -1.0
        description: "Прямое указание на соглашение о новации"

      - pattern: "(?i)прощение\\s+долга"
        severity: hard
        weight: -1.0
        description: "Прощение долга — безвозмездное прекращение без встречного предоставления"

      - pattern: "(?i)зачёт\\s+встречных\\s+требований|зачет\\s+встречных\\s+требований"
        severity: hard
        weight: -1.0
        description: "Зачёт — самостоятельный способ прекращения обязательств (ст. 410 ГК)"

      - pattern: "(?i)безвозмездное\\s+прекращение\\s+обязательства"
        severity: hard
        weight: -1.0
        description: "Безвозмездное прекращение противоречит логике отступного"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+купли-?продажи\\b"
        severity: hard
        weight: -1.0
        description: "Прямой договор купли-продажи — иной договорный тип"

      # ── Soft exclusions

      - pattern: "(?i)\\bкупля-?продажа\\b"
        severity: soft
        weight: -0.40
        description: "Купля-продажа может описывать предмет передачи, но не должна доминировать"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+дарения\\b"
        severity: hard
        weight: -1.0
        description: "Прямое указание на договор дарения"

      - pattern: "(?i)\\bдарение\\b"
        severity: soft
        weight: -0.40
        description: "Дарение конкурирует при передаче имущества без встречного предоставления"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\b"
        severity: hard
        weight: -1.0
        description: "Мена — обменная конструкция, отличная от прекращения обязательства отступным"

      - pattern: "(?i)реструктуризация\\s+(?:долга|задолженности|обязательства)"
        severity: soft
        weight: -0.38
        description: "Реструктуризация — изменение условий обязательства, а не прекращение его отступным"

      - pattern: "(?i)надлежащее\\s+исполнение\\s+обязательства"
        severity: soft
        weight: -0.35
        description: "Надлежащее исполнение обязательства исключает конструкцию отступного"

      - pattern: "(?i)соглашение\\s+о\\s+расторжении\\s+договора"
        severity: soft
        weight: -0.38
        description: "Расторжение договора — отдельное основание прекращения (ст. 450 ГК), не отступное"

      - pattern: "(?i)\\bрента\\b"
        severity: soft
        weight: -0.35
        description: "Рента — длящееся обязательство (гл. 33 ГК); снижает уверенность в отступном"
        
# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
