          "registration_costs_status": "defined",
          "registration_costs_details": "расходы по регистрации стороны несут поровну",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору квартиру, кадастровый номер 77:06:0001001:123."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "В качестве отступного передается недвижимое имущество."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Данные не определены",
          "registration_procedure_status": "not_defined",
          "registration_procedure_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с кадастровым номером.
        2. Найди прямую цитату о выписке ЕГРН.
        3. Найди прямую цитату о государственной регистрации перехода права.
        4. Найди прямую цитату о распределении расходов на регистрацию.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай реквизиты.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
