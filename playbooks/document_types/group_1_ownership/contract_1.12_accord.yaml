          description: "Описание предмета отступного — ключевой реквизит ст. 409 ГК"

        - pattern: "(?i)объём\\s+прекращения\\s+(?:долга|обязательства)|объем\\s+прекращения\\s+(?:долга|обязательства)"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Объём прекращения долга — существенное условие соглашения об отступном"

        - pattern: "(?i)ценные\\s+бумаги\\s+в\\s+качестве\\s+отступного"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Ценные бумаги как предмет отступного — прямо указан в description"

        - pattern: "(?i)имущественное\\s+право\\s+в\\s+качестве\\s+отступного"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Имущественное право как предмет отступного — прямо из description"

        - pattern: "(?i)оспаривание\\s+отступного\\s+в\\s+(?:процедуре\\s+)?банкротств"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Банкротные риски оспаривания — ст. 61.2-61.3 Закона о банкротстве"

      medium:
