  - id: parties_and_authority
    name: "Стороны соглашения об отступном: должник, кредитор, полномочия, корпоративное одобрение"
    description: >
      Фактографическая проверка наличия в договоре данных о должнике и кредиторе,
      их реквизитах, подписантах, основаниях полномочий, а также указания
      на корпоративное одобрение или на отсутствие необходимости такого одобрения.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "должник"
        - "кредитор"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "решение единственного участника"
        - "одобрение не требуется"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(должник|кредитор).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: идентификация должника и кредитора,
        полномочия подписантов и наличие указания на корпоративное одобрение.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 182–185 ГК РФ
        - ФЗ-14 ст. 45–46
        - ФЗ-208 ст. 78–84

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте соглашения.
        - Юрист будет использовать результат в сравнительной таблице.
        - Общая фраза вроде "стороны действуют в соответствии с законодательством
          РФ" или "полномочия подтверждаются в установленном порядке" без
          конкретного указания лица, документа-основания или содержания
          одобрения НЕ является основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Должник.
        2. Кто указан как Кредитор.
        3. Кто подписывает договор от каждой стороны и на каком основании.
        4. Есть ли в тексте ссылка на корпоративное одобрение либо указание,
           что одобрение не требуется, либо указание, что одобрение требуется,
           но факт его получения не подтверждён.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, требуется ли одобрение по существу, если это не написано в тексте.
        4. Не выводи основание полномочий по умолчанию исходя из должности
           (например, не считай, что генеральный директор действует на основании
           устава, если это прямо не написано в тексте).
        5. Общая ссылка на "действующее законодательство" или "устав общества"
           без конкретики и без прямого указания на конкретное лицо/документ —
           это not_defined, а не defined.
        6. Если данные не указаны прямо — возвращай "not_defined" для статусов
           и соответствующий текстовый fallback для текстовых полей (см. формат ответа).
        7. Если в разных фрагментах документа (например, преамбула и блок подписей)
           указаны несовместимые данные о подписанте или основании полномочий
           и конфликт нельзя снять по тексту — верни "not_defined" для статуса
           и "Не удалось определить" для текстового поля, включив оба фрагмента в evidence.
        8. Не используй "None", "null" или пустые строки.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено:
        Фрагмент:
        "ООО «Альфа», именуемое в дальнейшем «Должник», в лице Генерального директора
        Иванова И.И., действующего на основании Устава, и ООО «Бета», именуемое
        «Кредитор», в лице директора Петрова П.П., действующего на основании
        доверенности № 7 от 01.02.2024. Сделка одобрена решением единственного
        участника Должника № 3 от 10.03.2024."

        Ответ:
        {
          "debtor_details_status": "defined",
          "debtor_details_value": "ООО «Альфа»",
          "debtor_type": "legal_entity",
          "debtor_signatory_status": "defined",
          "debtor_signatory_value": "Генеральный директор Иванов И.И., действует на основании Устава",
          "debtor_signatory_basis": "charter",
          "creditor_details_status": "defined",
          "creditor_details_value": "ООО «Бета»",
          "creditor_type": "legal_entity",
          "creditor_signatory_status": "defined",
          "creditor_signatory_value": "Директор Петров П.П., действует на основании доверенности № 7 от 01.02.2024",
          "creditor_signatory_basis": "poa",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Сделка одобрена решением единственного участника Должника № 3 от 10.03.2024",
          "evidence": [
            {
              "clause_ref": "Преамбула / п. 6.1",
              "quote": "ООО «Альфа», именуемое в дальнейшем «Должник», в лице Генерального директора Иванова И.И., действующего на основании Устава... Сделка одобрена решением единственного участника Должника № 3 от 10.03.2024."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны заключили настоящее соглашение."

        Ответ:
        {
          "debtor_details_status": "not_defined",
          "debtor_details_value": "Не установлены",
          "debtor_type": "not_defined",
          "debtor_signatory_status": "not_defined",
          "debtor_signatory_value": "Не указан",
          "debtor_signatory_basis": "not_defined",
          "creditor_details_status": "not_defined",
          "creditor_details_value": "Не установлены",
          "creditor_type": "not_defined",
          "creditor_signatory_status": "not_defined",
          "creditor_signatory_value": "Не указан",
          "creditor_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — одобрение требуется, но не подтверждено:
        Фрагмент:
        "Настоящая сделка является крупной сделкой для Должника и требует
        одобрения общего собрания участников Должника."

        Ответ:
        {
          "debtor_details_status": "not_defined",
          "debtor_details_value": "Не установлены",
          "debtor_type": "not_defined",
          "debtor_signatory_status": "not_defined",
          "debtor_signatory_value": "Не указан",
          "debtor_signatory_basis": "not_defined",
          "creditor_details_status": "not_defined",
          "creditor_details_value": "Не установлены",
          "creditor_type": "not_defined",
          "creditor_signatory_status": "not_defined",
          "creditor_signatory_value": "Не указан",
          "creditor_signatory_basis": "not_defined",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Требуется одобрение общего собрания участников Должника; факт получения одобрения в тексте не подтверждён",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Настоящая сделка является крупной сделкой для Должника и требует одобрения общего собрания участников Должника."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стороны обладают всеми необходимыми полномочиями для заключения
        настоящего соглашения в соответствии с действующим законодательством
        Российской Федерации."

        Ответ:
        {
          "debtor_details_status": "not_defined",
          "debtor_details_value": "Не установлены",
          "debtor_type": "not_defined",
          "debtor_signatory_status": "not_defined",
          "debtor_signatory_value": "Не указан",
          "debtor_signatory_basis": "not_defined",
          "creditor_details_status": "not_defined",
          "creditor_details_value": "Не установлены",
          "creditor_type": "not_defined",
          "creditor_signatory_status": "not_defined",
          "creditor_signatory_value": "Не указан",
          "creditor_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Должника.
        2. Найди прямую цитату с идентификацией Кредитора.
        3. Найди прямую цитату о подписантах и основаниях полномочий каждой стороны.
        4. Найди прямую цитату о корпоративном одобрении, его ненужности,
           либо о требовании одобрения без подтверждения его получения.
        5. Проверь: не является ли найденная формулировка общей фразой о
           законодательстве без конкретики — если да, это not_defined.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий текстовый fallback.
        7. Если фрагменты противоречат друг другу — верни "not_defined" /
           "Не удалось определить" и включи оба фрагмента в evidence.
        8. Не додумывай реквизиты, основания полномочий и не делай правовой вывод
           вместо текста.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "debtor_details_status": "<defined / not_defined>",
          "debtor_details_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "debtor_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "debtor_signatory_status": "<defined / not_defined>",
          "debtor_signatory_value": "<текст или 'Не указан' / 'Не удалось определить'>",
          "debtor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "creditor_details_status": "<defined / not_defined>",
          "creditor_details_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "creditor_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "creditor_signatory_status": "<defined / not_defined>",
          "creditor_signatory_value": "<текст или 'Не указан' / 'Не удалось определить'>",
          "creditor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "должник кредитор именуем в лице действующего на основании ИНН ОГРН крупная сделка сделка с заинтересованностью одобрение общего собрания решение единственного участника одобрение не требуется"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "первоначальное обязательство"
        - "задолженность по договору"
        - "предмет отступного"
        - "срок передачи"
        - "момент прекращения"
        - "не является новацией"
        - "обременения"
        - "залог"
        - "ипотека"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1550

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о Должнике, Кредиторе, подписантах, основаниях полномочий
        и корпоративном одобрении.
        Не анализируй предмет отступного, стоимость, прекращение обязательства,
        налоги или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. debtor_details_status — "defined" если Должник прямо идентифицирован
           (наименование/ФИО с реквизитами), иначе "not_defined".
        2. debtor_details_value — наименование/ФИО и реквизиты Должника.
           Формат: краткое summary, без длинных реквизитных блоков (например,
           "ООО «Альфа»", а не полный юридический адрес и все реквизиты).
           Fallback при отсутствии — "Не установлены".
        3. debtor_type — "legal_entity" / "individual" / "individual_entrepreneur" /
           "not_defined".
        4. debtor_signatory_status — "defined" если подписант Должника прямо указан,
           иначе "not_defined".
        5. debtor_signatory_value — подписант Должника вместе с основанием его
           полномочий одной краткой фразой, если основание указано в тексте
           (например: "Генеральный директор Иванов И.И., действует на основании Устава").
           Если указан только подписант без основания — верни только подписанта.
           Не добавляй основание, если оно не указано в тексте прямо.
           Общая фраза "полномочия подтверждены в установленном порядке" без
           указания конкретного лица — это not_defined, а не defined.
           Fallback при отсутствии — "Не указан".
        6. debtor_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        7. creditor_details_status — "defined" если Кредитор прямо идентифицирован,
           иначе "not_defined".
        8. creditor_details_value — наименование/ФИО и реквизиты Кредитора.
           Формат и fallback — аналогично debtor_details_value ("Не установлены").
        9. creditor_type — "legal_entity" / "individual" / "individual_entrepreneur" /
           "not_defined".
        10. creditor_signatory_status — "defined" если подписант Кредитора прямо указан,
            иначе "not_defined".
        11. creditor_signatory_value — подписант Кредитора вместе с основанием его
            полномочий одной краткой фразой, по тем же правилам, что и для
            debtor_signatory_value. Fallback при отсутствии — "Не указан".
        12. creditor_signatory_basis — "charter" / "poa" / "order" / "other" /
            "not_defined".
        13. corporate_approval_status — "defined" если корпоративное одобрение,
            прямое указание на его ненужность, либо указание на требование
            одобрения без подтверждения его получения присутствует в тексте,
            иначе "not_defined". Общая фраза "сделка не требует специального
            одобрения" без указания оснований — считай defined, поскольку это
            прямое указание на отсутствие необходимости одобрения; но фраза
            "стороны обладают всеми необходимыми полномочиями" без упоминания
            корпоративного одобрения как такового — это not_defined.
        14. corporate_approval_details — формулировка о корпоративном одобрении,
            его ненужности, либо о том, что одобрение требуется, но факт его
            получения не подтверждён в тексте. Формат: краткое summary в одну
            фразу. Fallback при отсутствии — "Не установлено".

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением — не пропускай ключи.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о законодательстве или об "установленном порядке" без
          конкретного указания лица, документа-основания или содержания
          одобрения — это not_defined, а не defined. Данное правило применяется
          ко всем полям check-а без исключения.
        - Не выводи основание полномочий по умолчанию исходя из должности
          (например, не считай, что генеральный директор действует на основании
          устава, если это прямо не написано в тексте).
        - Не анализируй предмет отступного, стоимость, прекращение обязательства,
          налоги, обременения, залог, ипотеку, банкротство и иные нерелевантные темы,
          даже если они присутствуют в контексте.
        - Не путай корпоративное одобрение самой сделки с одобрением или
          согласованием иных документов (спецификаций, актов, графиков).
        - debtor_type и creditor_type:
            - "legal_entity" — ООО, АО, ПАО и иные юридические лица.
            - "individual" — физическое лицо без статуса ИП.
            - "individual_entrepreneur" — физическое лицо со статусом ИП
              (указан ОГРНИП).
            - "not_defined" — тип прямо не указан или не определяем из текста.
        - debtor_signatory_basis и creditor_signatory_basis:
            - "charter" — действует на основании устава.
            - "poa" — действует на основании доверенности.
            - "order" — действует на основании приказа.
            - "other" — иное основание, прямо указанное в тексте.
            - "not_defined" — основание полномочий не указано.
        - corporate_approval_status = "defined" как при наличии одобрения,
          так и при прямом указании, что одобрение не требуется, так и при
          указании, что одобрение требуется, но факт его получения не подтверждён.
        - Не делай самостоятельный вывод о необходимости одобрения по закону.
        - Если в разных фрагментах контекста указаны разные данные о подписанте,
          основании его полномочий или об одобрении и конфликт нельзя разрешить
          по тексту, верни "not_defined" для статуса и "Не удалось определить"
          для текстового поля, а не выбирай один из вариантов произвольно.
        - Каждое текстовое значение должно быть кратким (1 фраза, без длинных
          абзацев и без копирования реквизитных блоков целиком).
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 14 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для debtor_type / creditor_type используй только: "legal_entity",
          "individual", "individual_entrepreneur" или "not_defined".
        - Для debtor_signatory_basis / creditor_signatory_basis используй только:
          "charter", "poa", "order", "other" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          debtor_details_value / creditor_details_value → "Не установлены"
          debtor_signatory_value / creditor_signatory_value → "Не указан"
          corporate_approval_details → "Не установлено"
        - Для текстовых полей при неразрешимом противоречии между фрагментами
          используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "debtor_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации Должника. Внутреннее enum-поле."
