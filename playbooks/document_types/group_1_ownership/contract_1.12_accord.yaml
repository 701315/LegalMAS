        Не анализируй стоимость, банкротство, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. title_warranty_status — "defined" если право собственности или иной
           правовой титул Должника на предмет отступного прямо подтверждён,
           иначе "not_defined".
        2. title_warranty_details — формулировка о праве собственности / титуле.
        3. no_pledge_status — "defined" если отсутствие залога прямо указано,
           иначе "not_defined".
        4. no_pledge_details — формулировка об отсутствии залога.
        5. no_arrest_status — "defined" если отсутствие ареста или запрета распоряжения
           прямо указано, иначе "not_defined".
        6. no_arrest_details — формулировка об отсутствии ареста.
        7. no_third_party_rights_status — "defined" если отсутствие прав третьих лиц
           прямо указано, иначе "not_defined".
        8. no_third_party_rights_details — формулировка об отсутствии прав третьих лиц.
        9. quality_warranty_status — "defined" если качество предмета или отсутствие
           скрытых недостатков прямо указаны, иначе "not_defined".
        10. quality_warranty_details — формулировка о качестве предмета.
        11. risk_allocation_status — "defined" если распределение риска случайной гибели
            или повреждения до момента передачи прямо указано, иначе "not_defined".
        12. risk_allocation_code — "debtor" / "creditor" / "not_defined".
        13. risk_allocation_details — формулировка о распределении риска до передачи.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - title_warranty_status = "defined" только если право собственности или иной
          прямо названный правовой титул подтверждён в тексте.
        - no_pledge_status = "defined" как при отсутствии залога, так и при наличии
          залога, если оба варианта прямо указаны в тексте (в details отразить факт).
        - risk_allocation_code:
            - "debtor" — риск случайной гибели/повреждения до передачи несёт Должник.
            - "creditor" — риск несёт Кредитор.
            - "not_defined" — распределение риска прямо не определено.
        - Верни только JSON.
        </rules>
