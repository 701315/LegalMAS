              "quote": "В качестве отступного Должник передает Кредитору автомобиль Toyota Camry, VIN XXXXXXXXXXXXXXXX, по акту приема-передачи не позднее 5 рабочих дней с даты подписания настоящего соглашения."
            }
          ]
        }

        Пример 2:
