          context: body
          description: "Принятие отступного кредитором"

        - pattern: "(?i)\\bреальная\\s+сделка\\b"
          weight: 0.82
          distinctiveness: high
          context: body
          description: "Указание на реальный характер конструкции отступного"

        - pattern: "(?i)отступное\\s+как\\s+способ\\s+прекращения\\s+обязательства"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Квалификация отступного как способа прекращения обязательства"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*409\\s+ГК"
          weight: 0.92
          distinctiveness: high
          context: any
          description: "Ст. 409 ГК РФ — единственная норма, регулирующая отступное"

        - pattern: "(?i)предмет\\s+отступного"
          weight: 0.88
