    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость отступного оценивается сторонами в полном объёме частично остаток долга полное погашение согласованная стоимость стороны не имеют претензий долг считается погашенным прекращаются все обязательства без права на дальнейшие требования отчет об оценке независимый оценщик рыночная стоимость"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "сумма первоначального долга"
        - "основной долг по договору"
        - "предмет отступного"
        - "передача имущества"
        - "срок передачи"
        - "момент прекращения"
        - "не является новацией"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "valuation_and_settlement_scope_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        согласованную стоимость отступного, метод её определения, объём погашения
        долга, остаток долга и оговорки об окончательности урегулирования.
        Не анализируй титул, банкротство, налоги, момент прекращения или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. valuation_and_settlement_scope_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме стоимости
           отступного, объёма погашения долга и окончательности расчётов.
           - "present" — если хотя бы одно из содержательных полей
             (agreed_value_status, valuation_method, debt_termination_scope,
              remaining_debt_status, full_and_final_settlement_status,
              no_further_claims_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - agreed_value_status = "not_defined";
           - agreed_value_details = "Не установлена";
           - valuation_method = "not_defined";
           - valuation_method_display = "Не установлен";
           - debt_termination_scope = "not_defined";
           - remaining_debt_status = "not_defined";
           - remaining_debt_details = "Не установлен";
           - full_and_final_settlement_status = "not_defined";
           - full_and_final_settlement_details = "Не установлено";
           - no_further_claims_status = "not_defined";
           - no_further_claims_details = "Не установлено";
           - не выполняй остальные шаги.

        1. agreed_value_status — "defined" если согласованная стоимость отступного
           прямо указана конкретной цифрой (в том числе через отсылку к
           приложению, акту оценки или иному документу), иначе "not_defined".
           Фраза "по соглашению сторон" без цифры или отсылки к документу —
           not_defined.
        2. agreed_value_details — стоимость отступного (не сумма первоначального
           долга). Формат: краткая фраза с цифрой (например, "900 000 рублей"
           или "1 200 000 рублей согласно отчёту об оценке..."). Fallback —
           "Не установлена".
        3. valuation_method — "contractual" / "market" / "appraiser" / "not_defined".
        4. valuation_method_display — читаемое отображение метода определения
           стоимости:
           - "По соглашению сторон" — если valuation_method = "contractual";
           - "По рыночной оценке" — если valuation_method = "market";
           - "По отчёту независимого оценщика" — если valuation_method = "appraiser";
           - "Не установлен" — если valuation_method = "not_defined".
        5. debt_termination_scope — "full" / "partial" / "not_defined".
        6. remaining_debt_status — "defined" если остаток долга прямо указан
           или частичное прекращение прямо упомянуто, иначе "not_defined".
        7. remaining_debt_details — остаток долга после частичного прекращения;
           если частичное прекращение упомянуто без конкретной суммы — "Не
           установлен". Формат: краткая цифра с валютой.
        8. full_and_final_settlement_status — "defined" если прямо указано, что
           конкретное обязательство считается полностью погашенным/прекращённым,
           иначе "not_defined". Фраза "стороны урегулировали все вопросы в
           установленном порядке" без прямого указания на погашение
           конкретного обязательства — not_defined.
        9. full_and_final_settlement_details — формулировка об окончательности
           погашения конкретного обязательства. Формат: краткая фраза. Fallback —
           "Не установлено".
        10. no_further_claims_status — "defined" если прямо указан отдельный,
            более широкий отказ сторон от взаимных претензий друг к другу
            (не ограниченный только данным обязательством), иначе "not_defined".
            Общая фраза о "урегулировании в установленном порядке" без прямого
            заявления об отсутствии претензий — not_defined.
        11. no_further_claims_details — формулировка об отсутствии дальнейших
            претензий. Формат: краткая фраза. Fallback — "Не установлено".

        Если данные отсутствуют, используй следующий fallback:
        - agreed_value_details → "Не установлена"
        - valuation_method_display → "Не установлен"
        - remaining_debt_details → "Не установлен"
        - full_and_final_settlement_details → "Не установлено"
        - no_further_claims_details → "Не установлено"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - valuation_method_display → "Не установлен"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни valuation_and_settlement_scope_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = соответствующий fallback, valuation_method_display = "Не установлен".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретной цифры, метода оценки или содержательного
          заявления об окончательности/отказе от претензий (например, "по
          соглашению сторон", "в установленном порядке", "в соответствии с
          законодательством") — это not_defined, а не defined. Правило
          применяется ко всем полям check-а без исключения.
        - Не путай стоимость отступного с суммой первоначального долга — если
          в тексте есть обе величины, извлекай только согласованную стоимость
          передаваемого имущества/прав.
        - valuation_method:
            - "contractual" — стоимость определена соглашением сторон (прямо
              зафиксирована в тексте как договорённость, без ссылки на оценщика
              или рыночные данные).
            - "market" — стоимость определена по рыночной оценке, на которую
              есть прямая ссылка в тексте, без привлечения независимого оценщика.
            - "appraiser" — стоимость определена независимым оценщиком, отчёт
              которого прямо упомянут в тексте.
            - "not_defined" — метод определения стоимости прямо не указан.
        - valuation_method_display формируется ТОЛЬКО из значения valuation_method
          по правилу из пункта 4 task.
        - debt_termination_scope и remaining_debt_details дублируются в check
          original_obligation_extraction и используются здесь только как контекст
          для оценки стоимости, не как основной предмет проверки.
        - full_and_final_settlement — это утверждение о конкретном прекращаемом
          обязательстве. no_further_claims — это более широкое заявление об
          отсутствии взаимных претензий между сторонами в целом. Не смешивай
          их: если в тексте есть только одна из формулировок, заполняй только
          соответствующее поле, второе оставляй "not_defined".
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны разные суммы стоимости или разный
          объём погашения и конфликт нельзя разрешить по тексту, верни
          "not_defined" для статуса/enum и "Не удалось определить" для
          текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни стоимости отступного, ни сведений о погашении
           долга, ни оговорок об окончательности.
           → presence = "missing";
             все *_status/*_method/*_scope = "not_defined";
             все *_details = соответствующий fallback;
             valuation_method_display = "Не установлен".

        2. Неполное раскрытие темы (generic-clause ловушка).
           «Стоимость определяется по соглашению сторон» /
           «стороны урегулировали все вопросы в установленном порядке»
           без конкретной цифры или содержательного заявления.
           → presence = "present";
             agreed_value_status = "not_defined";
             agreed_value_details = "Не установлена";
             valuation_method = "not_defined";
             valuation_method_display = "Не установлен";
             full_and_final_settlement_status = "not_defined";
             full_and_final_settlement_details = "Не установлено".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны разные суммы стоимости
           или разный объём погашения, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий *_status/*_method/*_scope = "not_defined";
             соответствующее *_details = "Не удалось определить";
             valuation_method_display = "Не установлен".

        4. Специфика темы: оценка через отчёт, частичное погашение.
           Стоимость определена через отчёт независимого оценщика,
           обязательство прекращается частично с указанием остатка.
           → presence = "present";
             agreed_value_status = "defined";
             agreed_value_details = "1 200 000 рублей согласно отчёту об оценке...";
             valuation_method = "appraiser";
             valuation_method_display = "По отчёту независимого оценщика";
             debt_termination_scope = "partial";
             remaining_debt_status = "defined";
             remaining_debt_details = "300 000 рублей".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для valuation_and_settlement_scope_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для valuation_method используй только: "contractual", "market",
          "appraiser" или "not_defined".
        - Для valuation_method_display используй только: "По соглашению сторон",
          "По рыночной оценке", "По отчёту независимого оценщика" или "Не установлен".
        - Для debt_termination_scope используй только: "full", "partial"
          или "not_defined".
        - Fallback при отсутствии данных:
          * agreed_value_details → "Не установлена";
          * valuation_method_display → "Не установлен";
          * remaining_debt_details → "Не установлен";
          * full_and_final_settlement_details → "Не установлено";
          * no_further_claims_details → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * valuation_method_display → "Не установлен".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "valuation_and_settlement_scope_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по стоимости отступного, объёму погашения долга и окончательности расчётов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "agreed_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания согласованной стоимости отступного. Внутреннее enum-поле."
          required: true

        - name: "agreed_value_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Стоимость отступного"
          description: >
            Согласованная стоимость отступного (не сумма первоначального долга).
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "valuation_method"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["contractual", "market", "appraiser", "not_defined"]
          display_in_grid: false
          description: "Метод определения стоимости отступного. Внутреннее enum-поле, отображается через valuation_method_display."
          required: true

        - name: "valuation_method_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Метод определения стоимости"
          description: >
            Читаемое отображение метода определения стоимости: "По соглашению
            сторон", "По рыночной оценке", "По отчёту независимого оценщика"
            или "Не установлен".
          required: true

        - name: "debt_termination_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full", "partial", "not_defined"]
          display_in_grid: false
          description: >
            Полное или частичное погашение долга. Внутреннее enum-поле, используется
            как скрытый контекст для оценки стоимости. Основной видимый источник
            этого факта в DD Grid — check original_obligation_extraction
            (поле termination_scope_display).
          required: true

        - name: "remaining_debt_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания остатка долга. Внутреннее enum-поле, скрытый контекст."
          required: true

        - name: "remaining_debt_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Остаток долга (контекст стоимости)"
          description: >
            Остаток долга после частичного прекращения. Используется как скрытый
            контекст для оценки стоимости отступного. Основной видимый источник
            этого факта в DD Grid — check original_obligation_extraction
            (поле remaining_debt_value). Не отображается в гриде во избежание
            дублирования.
          required: false

        - name: "full_and_final_settlement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки об окончательности урегулирования конкретного обязательства. Внутреннее enum-поле."
          required: true

        - name: "full_and_final_settlement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Окончательность погашения обязательства"
          description: >
            Формулировка о том, что конкретное прекращаемое обязательство
            считается полностью погашенным/прекращённым.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "no_further_claims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отдельного отказа сторон от взаимных претензий в целом. Внутреннее enum-поле."
          required: true

        - name: "no_further_claims_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Отказ от взаимных претензий"
          description: >
            Формулировка о более широком отказе сторон от взаимных претензий
            друг к другу, не ограниченном только данным обязательством.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: recharacterization_distinction_check
    name: "Формулировки об отступном и отграничение от новации, прощения долга, зачёта"
    description: >
      Фактографическая проверка наличия в тексте прямой ссылки на ст. 409 ГК РФ,
      указания, что соглашение является отступным, а также оговорок о том,
      что конструкция не является новацией, прощением долга или зачётом.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "ст. 409 ГК РФ"
        - "является новацией"
        - "является прощением долга"
        - "является зачетом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+)?являет(ся|ются)\\s+новаци"
        - "(?i)(не\\s+)?являет(ся|ются)\\s+прощени(ем|я)\\s+долг"
        - "(?i)(не\\s+)?являет(ся|ются)\\s+зачет"
        - "(?i)замен(а|яет)\\s+обязательств"
        - "(?i)ст(?:атья|\\.)?\\s*409"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие квалифицирующие формулировки
        прямо есть в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 410 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        Важно:
        - Отсутствие защитной оговорки в тексте — это самостоятельный юридически
          значимый факт (повышенный риск переквалификации), а не техническая
          недоработка извлечения. Формулируй это прямо.
        - Различай два принципиально разных случая: (а) в тексте вообще нет
          упоминания новации/прощения долга/зачёта, и (б) в тексте прямо
          сказано, что соглашение ЯВЛЯЕТСЯ новацией/прощением долга/зачётом
          (то есть прямо подтверждает иную квалификацию, а не исключает её).
          Это разные по значимости риска ситуации.
        - Не выводи наличие защитной оговорки из заголовка документа
          ("Соглашение об отступном") или из общего смысла — только из
          содержательной формулировки в теле текста.
        - Общая фраза вроде "соглашение заключено в соответствии с требованиями
          действующего законодательства" (без явного упоминания номера ст. 409
          ГК РФ) или "стороны урегулировали обязательство надлежащим образом"
          (без слов "новация"/"зачёт"/"прощение долга") НЕ является основанием
          для "defined" или для статусов, отличных от "absent"/"not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямая ссылка на ст. 409 ГК РФ.
        2. Есть ли прямое указание, что соглашение является отступным.
        3. Есть ли оговорка о новации: отсутствует, прямо исключена, либо
           прямо подтверждена.
        4. Есть ли оговорка о прощении долга: отсутствует, прямо исключена,
           либо прямо подтверждена.
        5. Есть ли оговорка о зачёте: отсутствует, прямо исключена, либо
           прямо подтверждена.
        6. Есть ли формулировка "вместо исполнения" или аналогичная.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не делай самостоятельной переквалификации.
        3. Фиксируй только наличие / отсутствие текстовых формулировок.
        4. Каждую из трёх оговорок (новация/прощение долга/зачёт) оценивай
           независимо — упоминание одной не означает наличие другой.
        5. Общая фраза о соответствии законодательству без номера статьи —
           это not_defined для st409_reference.
        6. Общая фраза об "урегулировании обязательства" без явного упоминания
           новации/зачёта/прощения долга — это "absent" для соответствующей
           оговорки, а не "excluded_by_clause".
        7. Если формулировки нет — верни "absent".
        8. Если формулировка прямо исключает данную квалификацию — верни
           "excluded_by_clause".
        9. Если формулировка прямо утверждает данную квалификацию (то есть
           текст говорит обратное защитной оговорке) — верни "affirmed".
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью защищено:
        Фрагмент:
        "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ
        и не является новацией, прощением долга или зачётом."

        Ответ:
        {
          "st409_reference_status": "defined",
          "st409_reference_details": "Ссылка на ст. 409 ГК РФ",
          "qualification_as_otsupnoe_status": "defined",
          "qualification_as_otsupnoe_details": "Соглашение прямо названо соглашением об отступном",
          "novation_clause_status": "excluded_by_clause",
          "novation_clause_details": "Прямо указано: не является новацией",
          "debt_forgiveness_clause_status": "excluded_by_clause",
          "debt_forgiveness_clause_details": "Прямо указано: не является прощением долга",
          "setoff_clause_status": "excluded_by_clause",
          "setoff_clause_details": "Прямо указано: не является зачётом",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ и не является новацией, прощением долга или зачётом."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны урегулировали отношения настоящим соглашением."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "absent",
          "novation_clause_details": "Оговорка отсутствует в тексте",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "absent",
          "setoff_clause_details": "Оговорка отсутствует в тексте",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": []
        }

        Пример 3 — прямое утверждение иной квалификации:
        Фрагмент:
        "Стороны договорились о зачёте встречных однородных требований. Настоящее
        соглашение является новацией обязательства Должника."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "affirmed",
          "novation_clause_details": "Текст прямо утверждает: соглашение является новацией обязательства",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "affirmed",
          "setoff_clause_details": "Текст прямо утверждает зачёт встречных однородных требований",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Стороны договорились о зачёте встречных однородных требований. Настоящее соглашение является новацией обязательства Должника."
            }
          ]
        }

        Пример 4 — частичный набор оговорок:
        Фрагмент:
        "Настоящим Кредитор соглашается принять от Должника имущество вместо
        исполнения обязательства по Договору поставки № 15, при этом соглашение
        не является зачётом."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "absent",
          "novation_clause_details": "Оговорка отсутствует в тексте",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "excluded_by_clause",
          "setoff_clause_details": "Прямо указано: не является зачётом",
          "instead_of_performance_status": "defined",
          "instead_of_performance_details": "Имущество передаётся вместо исполнения обязательства по Договору поставки № 15",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Настоящим Кредитор соглашается принять от Должника имущество вместо исполнения обязательства по Договору поставки № 15, при этом соглашение не является зачётом."
            }
          ]
        }

        Пример 5 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Настоящее соглашение заключено в соответствии с требованиями действующего
        законодательства Российской Федерации. Стороны урегулировали обязательство
        надлежащим образом."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Ссылка на статью отсутствует в тексте",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Прямая квалификация отсутствует в тексте",
          "novation_clause_status": "absent",
          "novation_clause_details": "Оговорка отсутствует в тексте",
          "debt_forgiveness_clause_status": "absent",
          "debt_forgiveness_clause_details": "Оговорка отсутствует в тексте",
          "setoff_clause_status": "absent",
          "setoff_clause_details": "Оговорка отсутствует в тексте",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Оговорка отсутствует в тексте",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую ссылку на ст. 409 ГК РФ; проверь, назван ли номер статьи явно.
        2. Найди прямую квалификацию соглашения как отступного.
        3. Для каждой из трёх оговорок (новация/прощение долга/зачёт) отдельно
           определи: отсутствует, прямо исключена или прямо подтверждена.
        4. Проверь: не является ли формулировка общей фразой о "надлежащем
           урегулировании" без слов "новация"/"зачёт"/"прощение долга" — если
           да, статус "absent" для соответствующей оговорки.
        5. Не путай упоминание одной оговорки с наличием остальных.
        6. Не выводи оговорку из заголовка документа или общего смысла.
        7. Не делай вывод "есть риск" без текстовой основы — фиксируй только факт.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "st409_reference_status": "<defined / not_defined>",
          "st409_reference_details": "<текст или 'Ссылка на статью отсутствует в тексте'>",
          "qualification_as_otsupnoe_status": "<defined / not_defined>",
          "qualification_as_otsupnoe_details": "<текст или 'Прямая квалификация отсутствует в тексте'>",
          "novation_clause_status": "<absent / excluded_by_clause / affirmed>",
          "novation_clause_details": "<текст или 'Оговорка отсутствует в тексте'>",
          "debt_forgiveness_clause_status": "<absent / excluded_by_clause / affirmed>",
          "debt_forgiveness_clause_details": "<текст или 'Оговорка отсутствует в тексте'>",
          "setoff_clause_status": "<absent / excluded_by_clause / affirmed>",
          "setoff_clause_details": "<текст или 'Оговорка отсутствует в тексте'>",
          "instead_of_performance_status": "<defined / not_defined>",
          "instead_of_performance_details": "<текст или 'Оговорка отсутствует в тексте'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не является новацией прощение долга зачёт отступное ст. 409 ГК РФ вместо исполнения замена обязательства квалификация как отступное прекращение обязательства отступным не является куплей-продажей является новацией является прощением долга является зачетом"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "первоначальное обязательство"
        - "предмет отступного"
        - "срок передачи"
        - "момент прекращения"
        - "стоимость отступного"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "recharacterization_distinction_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        квалифицирующие формулировки: ссылка на ст. 409 ГК РФ, прямое указание
        на отступное, оговорки о новации, прощении долга, зачёте (отсутствуют,
        прямо исключены или прямо подтверждены), а также формулировку
        «вместо исполнения».
        Не анализируй фактический риск переквалификации — только извлекай
        текстовые формулировки.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. recharacterization_distinction_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме
           квалифицирующих формулировок.
           - "present" — если хотя бы одно из содержательных полей находится
             в «информативном» состоянии:
             st409_reference_status = "defined" ИЛИ
             qualification_as_otsupnoe_status = "defined" ИЛИ
             novation_clause_status ∈ {"excluded_by_clause", "affirmed"} ИЛИ
             debt_forgiveness_clause_status ∈ {"excluded_by_clause", "affirmed"} ИЛИ
             setoff_clause_status ∈ {"excluded_by_clause", "affirmed"} ИЛИ
             instead_of_performance_status = "defined";
           - "missing" — если st409_reference_status = "not_defined" И
             qualification_as_otsupnoe_status = "not_defined" И
             novation_clause_status = "absent" И
             debt_forgiveness_clause_status = "absent" И
             setoff_clause_status = "absent" И
             instead_of_performance_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - st409_reference_status = "not_defined";
           - st409_reference_details = "Ссылка на статью отсутствует в тексте";
           - qualification_as_otsupnoe_status = "not_defined";
           - qualification_as_otsupnoe_details = "Прямая квалификация отсутствует в тексте";
           - novation_clause_status = "absent";
           - novation_clause_details = "Оговорка отсутствует в тексте";
           - debt_forgiveness_clause_status = "absent";
           - debt_forgiveness_clause_details = "Оговорка отсутствует в тексте";
           - setoff_clause_status = "absent";
           - setoff_clause_details = "Оговорка отсутствует в тексте";
           - instead_of_performance_status = "not_defined";
           - instead_of_performance_details = "Оговорка отсутствует в тексте";
           - не выполняй остальные шаги.

        1. st409_reference_status — "defined" если прямая ссылка на ст. 409 ГК РФ
           (с явным номером статьи) присутствует в тексте, иначе "not_defined".
           Фраза "в соответствии с законодательством РФ" без номера статьи —
           not_defined. Формат details: краткая цитата. Fallback — "Ссылка на
           статью отсутствует в тексте".
        2. st409_reference_details — формулировка со ссылкой на ст. 409 ГК РФ.
        3. qualification_as_otsupnoe_status — "defined" если соглашение прямо названо
           соглашением об отступном, иначе "not_defined". Формат details: краткая
           цитата. Fallback — "Прямая квалификация отсутствует в тексте".
        4. qualification_as_otsupnoe_details — такая формулировка.
        5. novation_clause_status — "absent" (не упомянуто) / "excluded_by_clause"
           (прямо исключено: "не является новацией") / "affirmed" (прямо
           подтверждено: "является новацией"). Общая фраза "стороны урегулировали
           обязательство надлежащим образом" без слова "новация" — это "absent".
        6. novation_clause_details — соответствующая формулировка. Fallback при
           "absent" — "Оговорка отсутствует в тексте".
        7. debt_forgiveness_clause_status — "absent" / "excluded_by_clause" /
           "affirmed" — аналогично для прощения долга. Общая фраза без слов
           "прощение долга" — это "absent".
        8. debt_forgiveness_clause_details — соответствующая формулировка.
           Fallback при "absent" — "Оговорка отсутствует в тексте".
        9. setoff_clause_status — "absent" / "excluded_by_clause" / "affirmed" —
           аналогично для зачёта. Общая фраза без слова "зачёт" — это "absent".
        10. setoff_clause_details — соответствующая формулировка. Fallback при
            "absent" — "Оговорка отсутствует в тексте".
        11. instead_of_performance_status — "defined" если в тексте есть формулировка
            «вместо исполнения» или аналогичная, иначе "not_defined".
        12. instead_of_performance_details — такая формулировка. Fallback —
            "Оговорка отсутствует в тексте".

        Оценивай novation_clause, debt_forgiveness_clause и setoff_clause
        полностью независимо друг от друга: наличие одной оговорки не означает
        наличие или отсутствие двух других.

        Если данные отсутствуют, используй следующий fallback:
        - st409_reference_details → "Ссылка на статью отсутствует в тексте"
        - qualification_as_otsupnoe_details → "Прямая квалификация отсутствует в тексте"
        - novation_clause_details / debt_forgiveness_clause_details / setoff_clause_details
          при статусе "absent" → "Оговорка отсутствует в тексте"
        - instead_of_performance_details → "Оговорка отсутствует в тексте"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        (например, один пункт исключает новацию, другой её прямо утверждает)
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "affirmed" (более рискованная трактовка
          указывается явно, а не скрывается за нейтральным значением)
        - соответствующее текстовое поле → "Не удалось определить: в тексте
          есть противоречивые формулировки" с указанием обоих фрагментов в evidence

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни recharacterization_distinction_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined"/"absent", все *_details = соответствующий fallback.
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без явного упоминания номера статьи ГК РФ, слова
          "отступное" как прямой квалификации, или слов "новация"/"зачёт"/
          "прощение долга" — это not_defined/absent, а не defined. Правило
          применяется ко всем полям check-а без исключения.
        - st409_reference_status = "defined" только если статья 409 ГК РФ прямо
          упомянута с номером; не считай достаточным просто слово «отступное»
          без ссылки на статью.
        - qualification_as_otsupnoe_status = "defined" только если соглашение
          прямо поименовано как «соглашение об отступном» или аналогично.
        - Не выводи наличие или отсутствие защитной оговорки из заголовка
          документа или из общего смысла текста — только из содержательной
          формулировки в теле соглашения.
        - Различай "absent" (тема вообще не поднята) и "excluded_by_clause"
          (тема поднята и прямо исключена) — это не одно и то же с точки
          зрения полноты юридической защиты.
        - "affirmed" используй только если текст прямо и недвусмысленно
          утверждает данную квалификацию (например, "является новацией"),
          а не просто содержит слово рядом с другим контекстом.
        - Не делай самостоятельного вывода о риске переквалификации —
          фиксируй только текстовый факт.
        - Каждое текстовое значение должно быть кратким — одна фраза или
          точная цитата, без пересказа целого пункта.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ссылки на ст. 409 ГК РФ, ни квалификации как
           отступного, ни оговорок о новации/прощении долга/зачёте,
           ни формулировки «вместо исполнения».
           → presence = "missing";
             все статусы = "not_defined"/"absent";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Соглашение заключено в соответствии с требованиями законодательства
           РФ. Стороны урегулировали обязательство надлежащим образом»
           без номера статьи и без слов «новация»/«зачёт»/«прощение долга».
           → presence = "missing";
             st409_reference_status = "not_defined";
             qualification_as_otsupnoe_status = "not_defined";
             novation_clause_status / debt_forgiveness_clause_status / setoff_clause_status = "absent";
             instead_of_performance_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте сказано, что соглашение не является новацией,
           в другом — что является новацией; конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий *_clause_status = "affirmed";
             соответствующее *_clause_details = "Не удалось определить:
             в тексте есть противоречивые формулировки".

        4. Специфика темы: прямое утверждение иной квалификации.
           В тексте прямо сказано, что соглашение «является новацией» /
           «является зачётом» / «является прощением долга» — то есть текст
           подтверждает иную квалификацию вместо защитной оговорки.
           → presence = "present";
             соответствующий *_clause_status = "affirmed";
             соответствующее *_clause_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для recharacterization_distinction_check_presence используй только: "present", "missing", "unclear".
        - Для st409_reference_status, qualification_as_otsupnoe_status и
          instead_of_performance_status используй только: "defined" или "not_defined".
        - Для novation_clause_status, debt_forgiveness_clause_status и
          setoff_clause_status используй только: "absent", "excluded_by_clause"
          или "affirmed".
        - Fallback при отсутствии данных:
          * st409_reference_details → "Ссылка на статью отсутствует в тексте";
          * qualification_as_otsupnoe_details → "Прямая квалификация отсутствует в тексте";
          * novation_clause_details / debt_forgiveness_clause_details / setoff_clause_details
            при статусе "absent" → "Оговорка отсутствует в тексте";
          * instead_of_performance_details → "Оговорка отсутствует в тексте".
        - Fallback при противоречии или неоднозначности:
          * соответствующий *_clause_status → "affirmed";
          * соответствующее *_clause_details → "Не удалось определить: в тексте есть противоречивые формулировки".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "recharacterization_distinction_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие квалифицирующих формулировок и защитных оговорок. Внутреннее агрегатное signal-поле."
          required: true

        - name: "st409_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия прямой ссылки на ст. 409 ГК РФ. Внутреннее enum-поле."
          required: true

        - name: "st409_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ссылка на ст. 409 ГК РФ"
          description: >
            Прямая ссылка на ст. 409 ГК РФ.
            Fallback: "Ссылка на статью отсутствует в тексте".
          required: true

        - name: "qualification_as_otsupnoe_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус прямого указания на отступное. Внутреннее enum-поле."
          required: true

        - name: "qualification_as_otsupnoe_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Квалификация как отступное"
          description: >
            Формулировка, что соглашение является отступным.
            Fallback: "Прямая квалификация отсутствует в тексте".
          required: true

        - name: "novation_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "excluded_by_clause", "affirmed"]
          display_in_grid: false
          description: "Статус оговорки о новации. Внутреннее enum-поле."
          required: true

        - name: "novation_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Оговорка о новации"
          description: >
            Формулировка об отсутствии, исключении или прямом подтверждении
            новации.
            Fallback: "Оговорка отсутствует в тексте".
          required: true

        - name: "debt_forgiveness_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "excluded_by_clause", "affirmed"]
          display_in_grid: false
          description: "Статус оговорки о прощении долга. Внутреннее enum-поле."
          required: true

        - name: "debt_forgiveness_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Оговорка о прощении долга"
          description: >
            Формулировка об отсутствии, исключении или прямом подтверждении
            прощения долга.
            Fallback: "Оговорка отсутствует в тексте".
          required: true

        - name: "setoff_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "excluded_by_clause", "affirmed"]
          display_in_grid: false
          description: "Статус оговорки о зачёте. Внутреннее enum-поле."
          required: true

        - name: "setoff_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Оговорка о зачёте"
          description: >
            Формулировка об отсутствии, исключении или прямом подтверждении
            зачёта.
            Fallback: "Оговорка отсутствует в тексте".
          required: true

        - name: "instead_of_performance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус формулировки 'вместо исполнения' или аналогичной. Внутреннее enum-поле."
          required: true

        - name: "instead_of_performance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Формулировка «вместо исполнения»"
          description: >
            Формулировка о предоставлении отступного вместо исполнения.
            Fallback: "Оговорка отсутствует в тексте".
          required: true
      store_payload: true

  - id: title_and_warranties_check
    name: "Гарантии в отношении предмета отступного и риск до передачи"
    description: >
      Фактографическая проверка наличия заверений об отсутствии обременений,
      залога, ареста, прав третьих лиц, а также условий о качестве предмета
      отступного и распределении риска до момента передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "право собственности принадлежит"
        - "надлежащее качество"
        - "отсутствие скрытых недостатков"
        - "риск случайной гибели"
        - "риск повреждения"
        - "до момента передачи"
        - "несет должник"
        - "находится в залоге"
        - "находится под арестом"
        - "за исключением"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободн(о|ым)\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+заложен|не\\s+арестован"
        - "(?i)находится\\s+в\\s+залог|находится\\s+под\\s+арест"
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел"
        - "(?i)до\\s+момента\\s+передач"
        - "(?i)за\\s+исключением"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: гарантии в отношении предмета отступного
        и распределение риска до передачи.

        Нормативный ориентир:
        - ст. 460 ГК РФ
        - ст. 211 ГК РФ
        - ст. 459 ГК РФ

        Важно:
        - Для залога, ареста и прав третьих лиц принципиально различать:
          заверение вообще не дано / прямо заверено отсутствие / прямо
          заверено отсутствие с оговоркой-исключением / прямо указано наличие
          обременения. Это разные по значимости риска ситуации, их нельзя
          сводить к одному статусу "defined".
        - Общая фраза вроде "имущество передается в состоянии, соответствующем
          требованиям законодательства" (без конкретного упоминания залога,
          ареста или прав третьих лиц) — это "absent" для соответствующих
          полей, а не "clean". Аналогично, "правомерность владения" без слова
          "собственность"/"титул" — это not_defined для титула, а "риски
          распределяются в соответствии с законодательством" без указания
          конкретной стороны — not_defined для распределения риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности / титула.
        2. Что указано про залог: не упомянуто, отсутствует, отсутствует
           с исключением, или прямо указано наличие залога.
        3. Что указано про арест: аналогично.
        4. Что указано про права третьих лиц: аналогично.
        5. Есть ли гарантия качества / отсутствия скрытых недостатков.
        6. Кто несёт риск случайной гибели / повреждения до передачи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай заверения, которых нет.
        3. Различай отсутствие обременения, отсутствие с исключением и прямое
           наличие обременения — не смешивай эти случаи в одном статусе.
        4. Общая фраза без конкретного упоминания залога/ареста/прав третьих
           лиц — это "absent", а не "clean" (отсутствие обременения нужно
           заверить прямо, а не вывести из общей фразы о законности).
        5. Общая фраза "правомерность владения" без слова "собственность" или
           "титул" — это not_defined для title_warranty.
        6. Общая фраза о рисках "в соответствии с законодательством" без
           указания конкретной стороны — это not_defined для risk_allocation.
        7. Если данных нет — возвращайте "not_defined"/"absent" и соответствующий
           текстовый fallback.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. Evidence — только текст соглашения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено, всё чисто:
        Фрагмент:
        "Должник подтверждает, что автомобиль принадлежит ему на праве собственности,
        не находится в залоге, под арестом и свободен от прав третьих лиц.
        Риск случайной гибели до момента передачи несет Должник."

        Ответ:
        {
          "title_warranty_status": "defined",
          "title_warranty_details": "Автомобиль принадлежит Должнику на праве собственности",
          "no_pledge_status": "clean",
          "no_pledge_details": "Не находится в залоге",
          "no_arrest_status": "clean",
          "no_arrest_details": "Не находится под арестом",
          "no_third_party_rights_status": "clean",
          "no_third_party_rights_details": "Свободен от прав третьих лиц",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Заверение отсутствует в тексте",
          "risk_allocation_code": "debtor",
          "risk_allocation_status": "defined",
          "risk_allocation_details": "Риск случайной гибели до момента передачи несёт Должник",
          "evidence": [
