          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "transfer_deadline"
          type: "string"
        - name: "late_transfer_consequences_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "late_transfer_consequences"
