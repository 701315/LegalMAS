          required: true

        - name: "creditor_type"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          display_in_grid: false
          description: "Тип Кредитора. Внутреннее enum-поле, не выводится отдельным столбцом."
