        Пример 5 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Должник гарантирует надлежащее качество товара и правомерность
        владения имуществом. Имущество передается в состоянии, соответствующем
        требованиям действующего законодательства Российской Федерации. Риски
        распределяются между сторонами в соответствии с законодательством РФ."

        Ответ:
        {
