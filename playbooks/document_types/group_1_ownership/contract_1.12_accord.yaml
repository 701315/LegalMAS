    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты должника и кредитора (наименование/ФИО, ИНН/ОГРН/ОГРНИП, адрес);
      (б) полномочия подписантов (устав, доверенность, протокол назначения);
      (в) корпоративные решения об одобрении (если сделка является крупной
      или с заинтересованностью) либо заключение о ненужности одобрения.
    addressee: "Обе стороны / Юридический советник"

  original_obligation_extraction:
    text: >
      Просим предоставить по {doc_names}:
      (а) точные реквизиты прекращаемого обязательства (договор + дата + стороны);
      (б) размер долга с разбивкой на компоненты (основной долг / проценты / неустойка);
      (в) явное указание на полное или частичное прекращение;
      (г) при частичном погашении — размер остатка задолженности;
      (д) наличие обеспечительных обязательств по прекращаемому долгу.
    addressee: "Обе стороны"

  otsupnoe_subject_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) детальное описание предмета отступного с индивидуализирующими признаками;
      (б) порядок и документ фактической передачи (акт, платёж, договор уступки, регистрация);
      (в) конкретный срок предоставления отступного;
      (г) последствия просрочки предоставления.
    addressee: "Должник / Юридический советник"

  real_character_and_termination_moment_check:
    text: >
      Просим уточнить в {doc_names}: обязательство прекращается не в момент
      подписания соглашения, а в момент фактического предоставления отступного
      (либо госрегистрации / зачисления средств). Формулировку привести
      в соответствие с реальным характером сделки по ст. 409 ГК РФ.
    addressee: "Юридический советник"

  valuation_and_settlement_scope_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) согласованную стоимость предмета отступного и метод её определения;
      (б) прекращается долг полностью или частично;
      (в) при частичном — чёткий остаток задолженности;
      (г) оговорку об окончательности урегулирования (full and final settlement)
      и отказе от дальнейших претензий.
    addressee: "Обе стороны"

  recharacterization_distinction_check:
    text: >
      Просим уточнить в {doc_names}: явная ссылка на ст. 409 ГК РФ;
      оговорка о том, что соглашение является отступным (а не новацией,
      прощением долга, зачётом или куплей-продажей); формулировка
      «взамен исполнения» первоначального обязательства.
    addressee: "Юридический советник"

  title_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии залога, ареста и прав третьих лиц
      на предмет отступного;
      (б) заверение о надлежащем качестве предмета отступного;
      (в) явное указание на то, что риск случайной гибели несёт должник
      до момента фактической передачи кредитору.
    addressee: "Должник"

  real_estate_and_claim_specifics_check:
    text: >
      Если отступное — недвижимость, просим предоставить по {doc_names}:
      кадастровый номер, выписку ЕГРН, правоустанавливающий документ,
      порядок и распределение расходов на государственную регистрацию.

      Если отступное — право требования, просим предоставить:
      реквизиты основного договора, идентификацию должника по уступаемому
      требованию, объём уступаемого права, документы и план уведомления должника.
    addressee: "Должник / Юридический советник"

  secured_obligation_fate_check:
    text: >
      Просим уточнить в {doc_names}: как урегулирована судьба обеспечений
      прекращаемого обязательства:
      (а) снятие залога — порядок, ответственный, срок;
      (б) погашение ипотечной записи в ЕГРН — совместное заявление или закладная;
      (в) уведомление поручителей;
      (г) распределение расходов на регистрационные действия.
    addressee: "Кредитор / Юридический советник"

  bankruptcy_and_fair_value_risk_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии процедуры банкротства
      и признаков неплатёжеспособности;
      (б) подтверждение рыночной / соразмерной стоимости отступного
      (отчёт оценщика или документальное обоснование);
      (в) раскрытие аффилированности сторон (при наличии);
      (г) анализ периода подозрительности (1-3 года до возможного банкротства).
    addressee: "Юридический советник / Финансовый консультант"

  tax_and_accounting_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) НДС-последствия передачи предмета отступного;
      (б) стоимость для целей налогообложения;
      (в) первичные документы (акт, товарная накладная) для подтверждения операции;
      (г) обоснование возмездного характера сделки (не дарение).
    addressee: "Налоговый консультант"

  spousal_consent_for_individual_check:
    text: >
      Если должник по {doc_names} — физическое лицо, просим предоставить:
      нотариальное согласие супруга на передачу совместного имущества (ст. 35 СК РФ)
      либо подтверждение отсутствия брака / личного режима имущества / брачного договора.
    addressee: "Должник"

  termination_and_disputes_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) подсудность споров;
      (б) претензионный порядок с конкретным сроком рассмотрения;
      (в) условия конфиденциальности и перечень исключений;
      (г) применимое право.
    addressee: "Юридический советник"

  bankruptcy_preference_or_suspect_transaction_risk:
    text: >
      Внимание: по {doc_names} имеется риск оспаривания как предпочтительной
      или подозрительной сделки в банкротстве (ст. 61.2-61.3 ФЗ-127).
      Просим предоставить: подтверждение платежеспособности должника,
      отчёт о рыночной стоимости предмета отступного и правовой анализ
      периода подозрительности.
    addressee: "Юридический советник / Финансовый консультант"

  real_estate_transfer_registration_required:
    text: >
      Внимание: если в {doc_names} отступным является недвижимость,
      переход права требует государственной регистрации (ст. 131, 551 ГК РФ).
      Просим подготовить регистрационный пакет и согласовать порядок
      подачи документов в Росреестр.
    addressee: "Юридический советник / Должник"

  claim_assignment_identification_required:
    text: >
      Внимание: если в {doc_names} отступным является право требования,
      требуется полная идентификация уступаемого права и пакет transfer documents.
      Просим предоставить: договор-основание, реквизиты должника по требованию,
      уведомление должника и документы, подтверждающие требование.
    addressee: "Юридический советник"

  misclassification_risk_not_novation_or_forgiveness:
    text: >
      Внимание: {doc_names} содержит риск неверной квалификации.
      Просим уточнить конструкцию сделки и привести формулировки
      в соответствие с моделью отступного по ст. 409 ГК РФ,
      исключив признаки новации, прощения долга и зачёта.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

