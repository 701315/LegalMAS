        7. Если прямой цитаты нет — верни "not_defined"/"absent" и
           соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "foreign_element_status": "<absent / defined / not_defined>",
          "foreign_element_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "foreign_element_type": "<non_resident_party / foreign_currency / foreign_account / mixed / not_defined>",
          "foreign_element_type_display": "<Иностранная сторона / Иностранная валюта / Иностранный счёт / Смешанный иностранный элемент / Не установлен>",
          "currency_of_obligation_status": "<defined / not_defined>",
          "currency_of_obligation_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "settlement_procedure_status": "<defined / not_defined>",
          "settlement_procedure_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "currency_clause_status": "<defined / not_defined>",
          "currency_clause_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "special_economic_measures_status": "<defined / not_defined>",
          "special_economic_measures_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "иностранное лицо нерезидент иностранная валюта валютный контроль валютная оговорка уполномоченный банк счёт в иностранном банке постановка на учёт ФЗ-173 валютное законодательство курс Банка России расчёты"
      retrieval_profile: "currency_control_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "первоначальное обязательство"
        - "предмет отступного как недвижимость"
        - "кадастровый номер"
        - "ЕГРН"
        - "залог прекращается"
        - "банкротство"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "currency_control_and_foreign_element_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения об иностранном элементе (сторона-нерезидент, иностранная
        валюта, иностранный счёт) и урегулировании валютного контроля:
        валюта обязательства, порядок расчётов, валютная оговорка,
        специальные экономические меры.
        Не анализируй первоначальное обязательство, предмет отступного,
        банкротные и налоговые аспекты — это отдельные вопросы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. currency_control_and_foreign_element_check_presence:
           Агрегатное signal-поле — наличие регулирования по иностранному
           элементу и валютному контролю.
           - "present" — если хотя бы одно из содержательных полей находится
             в «информативном» состоянии:
             foreign_element_status = "defined" ИЛИ
             currency_of_obligation_status = "defined" ИЛИ
             settlement_procedure_status = "defined" ИЛИ
             currency_clause_status = "defined" ИЛИ
             special_economic_measures_status = "defined";
           - "missing" — если foreign_element_status = "absent" И
             currency_of_obligation_status = "not_defined" И
             settlement_procedure_status = "not_defined" И
             currency_clause_status = "not_defined" И
             special_economic_measures_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - foreign_element_status = "absent";
           - foreign_element_details = "Не установлено";
           - foreign_element_type = "not_defined";
           - foreign_element_type_display = "Не установлен";
           - currency_of_obligation_status = "not_defined";
           - currency_of_obligation_details = "Не установлено";
           - settlement_procedure_status = "not_defined";
           - settlement_procedure_details = "Не установлено";
           - currency_clause_status = "not_defined";
           - currency_clause_details = "Не установлено";
           - special_economic_measures_status = "not_defined";
           - special_economic_measures_details = "Не установлено";
           - не выполняй остальные шаги.

        1. foreign_element_status — "absent" (иностранный элемент не
           упомянут) / "defined" (иностранный элемент прямо указан) /
           "not_defined". Иностранный элемент — сторона-нерезидент,
           иностранная валюта, иностранный счёт.
        2. foreign_element_details — описание иностранного элемента. Формат:
           краткая фраза. Fallback при "absent" — "Не установлено".
        3. foreign_element_type — "non_resident_party" / "foreign_currency" /
           "foreign_account" / "mixed" / "not_defined".
        4. foreign_element_type_display — читаемое отображение типа
           иностранного элемента по правилу из [ФОРМАТ ОТВЕТА].
        5. currency_of_obligation_status — "defined" если валюта обязательства
           прямо указана (в том числе российский рубль), иначе "not_defined".
        6. currency_of_obligation_details — валюта обязательства. Fallback —
           "Не установлено".
        7. settlement_procedure_status — "defined" если порядок расчётов
           прямо описан конкретными действиями (через уполномоченный банк,
           с постановкой на учёт, с указанием счёта), иначе "not_defined".
           Общая фраза "в соответствии с валютным законодательством" без
           конкретики — not_defined.
        8. settlement_procedure_details — формулировка о порядке расчётов.
           Fallback — "Не установлено".
        9. currency_clause_status — "defined" если валютная оговорка прямо
           указана с конкретным курсом или механизмом пересчёта, иначе
           "not_defined". Общая фраза "курс определяется на дату платежа"
           без указания, чей курс, — not_defined.
        10. currency_clause_details — формулировка валютной оговорки.
            Fallback — "Не установлено".
        11. special_economic_measures_status — "defined" если в тексте прямо
            указаны специальные экономические меры (уведомление, ограничения,
            разрешительный порядок), иначе "not_defined".
        12. special_economic_measures_details — формулировка о специальных
            экономических мерах. Fallback — "Не установлено".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined"/"absent" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - соответствующий *_display → "Не установлен"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни currency_control_and_foreign_element_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined"/"absent", все *_details = соответствующий fallback, соответствующие *_display = "Не установлен".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о "соответствии валютному законодательству" без
          указания конкретной валюты, порядка расчётов, банка или курса —
          это not_defined, а не defined. Правило применяется ко всем полям
          check-а без исключения.
        - foreign_element_status:
            - "absent" — ни один из признаков иностранного элемента
              (сторона-нерезидент, иностранная валюта, иностранный счёт)
              в тексте не указан.
            - "defined" — хотя бы один из признаков прямо указан.
            - "not_defined" — вопрос прямо не урегулирован.
        - foreign_element_type:
            - "non_resident_party" — сторона является иностранным лицом
              (нерезидентом).
            - "foreign_currency" — валюта обязательства или платежа
              иностранная.
            - "foreign_account" — расчёты через счёт в иностранном банке.
            - "mixed" — несколько признаков одновременно.
            - "not_defined" — тип прямо не указан.
        - settlement_procedure_status = "defined" только если указан
          конкретный банк (уполномоченный), конкретный счёт, или прямо
          упомянута постановка контракта на учёт.
        - currency_clause_status = "defined" только если указан конкретный
          курс (например, "курс Банка России") или механизм пересчёта.
        - special_economic_measures_status = "defined" только если прямо
          указаны ограничения или разрешительный порядок, связанные
          со специальными экономическими мерами.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса/enum и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни иностранного элемента, ни указания валюты
           обязательства, ни порядка расчётов, ни валютной оговорки, ни
           специальных экономических мер.
           → presence = "missing";
             foreign_element_status = "absent";
             все остальные статусы/enum = "not_defined";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Стороны осуществляют расчёты в соответствии с валютным
           законодательством. Соблюдают требования валютного контроля»
           без указания валюты, банка, счёта или курса.
           → presence = "missing";
             foreign_element_status = "absent";
             currency_of_obligation_status = "not_defined";
             settlement_procedure_status = "not_defined";
             currency_clause_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о валюте обязательства или о порядке расчётов, и конфликт
           нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: иностранная валюта без постановки на учёт.
           В тексте прямо указана иностранная валюта обязательства,
           но порядок расчётов и постановка контракта на учёт не упомянуты
           (red flag — влечёт риск нарушения ФЗ-173 и Инструкции 181-И).
           → presence = "present";
             foreign_element_status = "defined";
             foreign_element_type = "foreign_currency";
             foreign_element_type_display = "Иностранная валюта";
             currency_of_obligation_status = "defined";
             settlement_procedure_status = "not_defined";
             settlement_procedure_details = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для currency_control_and_foreign_element_check_presence используй только: "present", "missing", "unclear".
        - Для foreign_element_status используй только: "absent", "defined" или "not_defined".
        - Для foreign_element_type используй только: "non_resident_party", "foreign_currency",
          "foreign_account", "mixed" или "not_defined".
        - Для foreign_element_type_display используй только: "Иностранная сторона",
          "Иностранная валюта", "Иностранный счёт", "Смешанный иностранный элемент"
          или "Не установлен".
        - Для остальных статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * foreign_element_details → "Не установлено";
          * currency_of_obligation_details → "Не установлено";
          * settlement_procedure_details → "Не установлено";
          * currency_clause_details → "Не установлено";
          * special_economic_measures_details → "Не установлено";
          * foreign_element_type_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * соответствующий *_display → "Не установлен".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "currency_control_and_foreign_element_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по иностранному элементу и валютному контролю. Внутреннее агрегатное signal-поле."
          required: true

        - name: "foreign_element_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "defined", "not_defined"]
          display_in_grid: false
          description: "Статус иностранного элемента в соглашении. Внутреннее enum-поле."
          required: true

        - name: "foreign_element_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Иностранный элемент"
          description: >
            Описание иностранного элемента (сторона-нерезидент, иностранная
            валюта, иностранный счёт).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "foreign_element_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["non_resident_party", "foreign_currency", "foreign_account", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип иностранного элемента. Внутреннее enum-поле, отображается через foreign_element_type_display."
          required: true

        - name: "foreign_element_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип иностранного элемента"
          description: >
            Читаемое отображение типа иностранного элемента: "Иностранная
            сторона", "Иностранная валюта", "Иностранный счёт", "Смешанный
            иностранный элемент" или "Не установлен".
          required: true

        - name: "currency_of_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания валюты обязательства. Внутреннее enum-поле."
          required: true

        - name: "currency_of_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Валюта обязательства"
          description: >
            Указанная валюта обязательства.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "settlement_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания порядка расчётов. Внутреннее enum-поле."
          required: true

        - name: "settlement_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Порядок расчётов"
          description: >
            Формулировка о порядке расчётов (уполномоченный банк, счёт,
            постановка на учёт).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "currency_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус валютной оговорки. Внутреннее enum-поле."
          required: true

        - name: "currency_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Валютная оговорка"
          description: >
            Формулировка валютной оговорки (курс пересчёта).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "special_economic_measures_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания специальных экономических мер. Внутреннее enum-поле."
          required: true

        - name: "special_economic_measures_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Специальные экономические меры"
          description: >
            Формулировка о специальных экономических мерах (уведомление,
            ограничения, разрешительный порядок).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты должника и кредитора (наименование/ФИО, ИНН/ОГРН/ОГРНИП, адрес);
      (б) полномочия подписантов (устав, доверенность, протокол назначения);
      (в) корпоративные решения об одобрении (если сделка является крупной
      или с заинтересованностью) либо заключение о ненужности одобрения.
    addressee: "Обе стороны / Юридический советник"

  original_obligation_extraction:
    text: >
      Просим предоставить по {doc_names}:
      (а) точные реквизиты прекращаемого обязательства (договор + дата + стороны);
      (б) размер долга с разбивкой на компоненты (основной долг / проценты / неустойка);
      (в) явное указание на полное или частичное прекращение;
      (г) при частичном погашении — размер остатка задолженности;
      (д) наличие обеспечительных обязательств по прекращаемому долгу.
    addressee: "Обе стороны"

  otsupnoe_subject_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) детальное описание предмета отступного с индивидуализирующими признаками;
      (б) порядок и документ фактической передачи (акт, платёж, договор уступки, регистрация);
      (в) конкретный срок предоставления отступного;
      (г) последствия просрочки предоставления.
    addressee: "Должник / Юридический советник"

  real_character_and_termination_moment_check:
    text: >
      Просим уточнить в {doc_names}: обязательство прекращается не в момент
      подписания соглашения, а в момент фактического предоставления отступного
      (либо госрегистрации / зачисления средств). Формулировку привести
      в соответствие с реальным характером сделки по ст. 409 ГК РФ.
    addressee: "Юридический советник"

  valuation_and_settlement_scope_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) согласованную стоимость предмета отступного и метод её определения;
      (б) прекращается долг полностью или частично;
      (в) при частичном — чёткий остаток задолженности;
      (г) оговорку об окончательности урегулирования (full and final settlement)
      и отказе от дальнейших претензий.
    addressee: "Обе стороны"

  recharacterization_distinction_check:
    text: >
      Просим уточнить в {doc_names}: явная ссылка на ст. 409 ГК РФ;
      оговорка о том, что соглашение является отступным (а не новацией,
      прощением долга, зачётом или куплей-продажей); формулировка
      «взамен исполнения» первоначального обязательства.
    addressee: "Юридический советник"

  title_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии залога, ареста и прав третьих лиц
      на предмет отступного;
      (б) заверение о надлежащем качестве предмета отступного;
      (в) явное указание на то, что риск случайной гибели несёт должник
      до момента фактической передачи кредитору.
    addressee: "Должник"

  real_estate_and_claim_specifics_check:
    text: >
      Если отступное — недвижимость, просим предоставить по {doc_names}:
      кадастровый номер, выписку ЕГРН, правоустанавливающий документ,
      порядок и распределение расходов на государственную регистрацию.

      Если отступное — право требования, просим предоставить:
      реквизиты основного договора, идентификацию должника по уступаемому
      требованию, объём уступаемого права, документы и план уведомления должника.
    addressee: "Должник / Юридический советник"

  secured_obligation_fate_check:
    text: >
      Просим уточнить в {doc_names}: как урегулирована судьба обеспечений
      прекращаемого обязательства:
      (а) снятие залога — порядок, ответственный, срок;
      (б) погашение ипотечной записи в ЕГРН — совместное заявление или закладная;
      (в) уведомление поручителей;
      (г) распределение расходов на регистрационные действия.
    addressee: "Кредитор / Юридический советник"

  bankruptcy_and_fair_value_risk_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии процедуры банкротства
      и признаков неплатёжеспособности;
      (б) подтверждение рыночной / соразмерной стоимости отступного
      (отчёт оценщика или документальное обоснование);
      (в) раскрытие аффилированности сторон (при наличии);
      (г) анализ периода подозрительности (1-3 года до возможного банкротства).
    addressee: "Юридический советник / Финансовый консультант"

  tax_and_accounting_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) НДС-последствия передачи предмета отступного;
      (б) стоимость для целей налогообложения;
      (в) первичные документы (акт, товарная накладная) для подтверждения операции;
      (г) обоснование возмездного характера сделки (не дарение).
    addressee: "Налоговый консультант"

  spousal_consent_for_individual_check:
    text: >
      Если должник по {doc_names} — физическое лицо, просим предоставить:
      нотариальное согласие супруга на передачу совместного имущества (ст. 35 СК РФ)
      либо подтверждение отсутствия брака / личного режима имущества / брачного договора.
    addressee: "Должник"

  termination_and_disputes_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) подсудность споров;
      (б) претензионный порядок с конкретным сроком рассмотрения;
      (в) условия конфиденциальности и перечень исключений;
      (г) применимое право.
    addressee: "Юридический советник"

  bankruptcy_preference_or_suspect_transaction_risk:
    text: >
      Внимание: по {doc_names} имеется риск оспаривания как предпочтительной
      или подозрительной сделки в банкротстве (ст. 61.2-61.3 ФЗ-127).
      Просим предоставить: подтверждение платежеспособности должника,
      отчёт о рыночной стоимости предмета отступного и правовой анализ
      периода подозрительности.
    addressee: "Юридический советник / Финансовый консультант"

  real_estate_transfer_registration_required:
    text: >
      Внимание: если в {doc_names} отступным является недвижимость,
      переход права требует государственной регистрации (ст. 131, 551 ГК РФ).
      Просим подготовить регистрационный пакет и согласовать порядок
      подачи документов в Росреестр.
    addressee: "Юридический советник / Должник"

  claim_assignment_identification_required:
    text: >
      Внимание: если в {doc_names} отступным является право требования,
      требуется полная идентификация уступаемого права и пакет transfer documents.
      Просим предоставить: договор-основание, реквизиты должника по требованию,
      уведомление должника и документы, подтверждающие требование.
    addressee: "Юридический советник"

  misclassification_risk_not_novation_or_forgiveness:
    text: >
      Внимание: {doc_names} содержит риск неверной квалификации.
      Просим уточнить конструкцию сделки и привести формулировки
      в соответствие с моделью отступного по ст. 409 ГК РФ,
      исключив признаки новации, прощения долга и зачёта.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
