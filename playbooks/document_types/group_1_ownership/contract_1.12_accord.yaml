           прямо подтверждено в тексте соглашения, иначе "not_defined".
        2. bankruptcy_status_details — формулировка об отсутствии процедуры банкротства.
        3. insolvency_signs_status — "defined" если отсутствие признаков
           неплатёжеспособности прямо подтверждено в тексте, иначе "not_defined".
        4. insolvency_signs_details — формулировка об отсутствии признаков
           неплатёжеспособности.
        5. fair_value_support_status — "defined" если в тексте есть ссылка
           на рыночную, оценочную или согласованную стоимость предмета отступного,
           иначе "not_defined".
        6. fair_value_support_details — формулировка о стоимости и её основании.
        7. valuation_method — "appraiser" / "market_reference" / "contractual" /
           "not_defined".
        8. affiliate_risk_status — "defined" если аффилированность или связанность
           сторон прямо упомянута в тексте, иначе "not_defined".
        9. affiliate_risk_details — формулировка об аффилированности.
        10. preference_risk_addressed_status — "defined" если в тексте прямо указано,
            что сделка не является предпочтительной или содержится аналогичная
            формулировка, иначе "not_defined".
        11. preference_risk_addressed_details — такая формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - Не оценивай реальный банкротный риск и не подменяй текст анализом
          по ст. 61.2 или 61.3 ФЗ-127.
        - valuation_method:
            - "appraiser" — стоимость определена независимым оценщиком,
              отчёт которого прямо упомянут в тексте.
            - "market_reference" — стоимость определена со ссылкой на рыночные
              данные, котировки или сравнимые сделки, прямо упомянутые в тексте.
            - "contractual" — стоимость определена соглашением сторон без
              привязки к внешним данным.
            - "not_defined" — метод определения стоимости прямо не указан.
        - bankruptcy_status_status = "defined" только если отсутствие процедуры
          банкротства прямо подтверждено; не выводи из отсутствия упоминания.
        - preference_risk_addressed_status = "defined" только если соответствующая
          формулировка прямо присутствует в тексте.
        - Верни только JSON.
        </rules>
      fields:
        - name: "bankruptcy_status_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на отсутствие процедуры банкротства."
          required: true
        - name: "bankruptcy_status_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие процедуры банкротства"
          description: "Формулировка об отсутствии процедуры банкротства."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "insolvency_signs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на отсутствие признаков неплатёжеспособности."
          required: false
        - name: "insolvency_signs_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие признаков неплатёжеспособности"
          description: "Формулировка об отсутствии признаков неплатёжеспособности."
          required: false
          display_in_grid: false
        - name: "fair_value_support_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия формулировки о соразмерной/рыночной стоимости."
          required: false
        - name: "fair_value_support_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение стоимости"
          description: "Формулировка о рыночной, оценочной или согласованной стоимости."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "valuation_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["appraiser", "market_reference", "contractual", "not_defined"]
          description: "Метод оценки стоимости."
          required: false
        - name: "affiliate_risk_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания аффилированности сторон."
          required: false
        - name: "affiliate_risk_details"
          type: "string"
          presentation: "fact"
          label: "Аффилированность сторон"
          description: "Формулировка об аффилированности сторон."
          required: false
          display_in_grid: false
        - name: "preference_risk_addressed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус формулировки о предпочтении."
          required: false
        - name: "preference_risk_addressed_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие сделки с предпочтением"
          description: "Формулировка о том, что сделка не является предпочтительной."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: НАЛОГИ / ПЕРВИЧНЫЕ ДОКУМЕНТЫ
  # ──────────────────────────────────────────────────────────────────────────
  - id: tax_and_accounting_check
    name: "Налоговые последствия отступного и первичные документы"
    description: >
      Фактографическая проверка наличия в тексте НДС-оговорки, указания
      на стоимость для налоговых целей, первичные документы, налог на прибыль
      и формулировки о возмездном характере сделки.
    triggers:
      any: ["tax_sensitive_structure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговые обязательства"
        - "НДС"
        - "доход кредитора"
        - "расход должника"
        - "первичные документы"
        - "акт приема-передачи"
        - "стоимость для целей налогообложения"
        - "рыночная стоимость"
        - "не является дарением"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налогов(ые|ых|ой)\\s+обязательств"
        - "(?i)первичн(ые|ых)\\s+документ"
        - "(?i)стоимост(ь|и)\\s+для\\s+целей\\s+налогообложен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие налоговые и учётные формулировки
        прямо содержатся в тексте соглашения.

        Нормативный ориентир:
        - НК РФ
        - ст. 154 НК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли НДС-оговорка.
        2. Есть ли указание на стоимость для налоговых целей.
        3. Есть ли упоминание первичных документов.
        4. Есть ли указание на налог на прибыль / налоговые последствия.
        5. Есть ли формулировка, что сделка не является дарением.
        6. Есть ли указание на экономическую цель сделки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай налоговые последствия, если они не указаны в тексте.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стоимость передаваемого имущества для целей налогообложения составляет
        1 000 000 рублей. Передача имущества облагается НДС в соответствии
        с действующим законодательством. Передача оформляется актом приема-передачи."

        Ответ:
        {
          "vat_clause_status": "defined",
          "vat_clause_details": "передача имущества облагается НДС",
          "tax_value_defined_status": "defined",
          "tax_value_defined_details": "стоимость для целей налогообложения составляет 1 000 000 рублей",
          "primary_documents_status": "defined",
          "primary_documents_details": "акт приема-передачи",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Данные не определены",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Данные не определены",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стоимость передаваемого имущества для целей налогообложения составляет 1 000 000 рублей. Передача имущества облагается НДС."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны передают имущество в счет прекращения обязательства."

        Ответ:
        {
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Данные не определены",
          "tax_value_defined_status": "not_defined",
          "tax_value_defined_details": "Данные не определены",
          "primary_documents_status": "not_defined",
          "primary_documents_details": "Данные не определены",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Данные не определены",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Данные не определены",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату про НДС.
        2. Найди прямую цитату про стоимость для налоговых целей.
        3. Найди прямую цитату про первичные документы.
        4. Найди прямую цитату про отсутствие дарения / экономическую цель.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "vat_clause_status": "<defined / not_defined>",
          "vat_clause_details": "<текст или 'Данные не определены'>",
          "tax_value_defined_status": "<defined / not_defined>",
          "tax_value_defined_details": "<текст или 'Данные не определены'>",
          "primary_documents_status": "<defined / not_defined>",
          "primary_documents_details": "<текст или 'Данные не определены'>",
          "gift_risk_addressed_status": "<defined / not_defined>",
          "gift_risk_addressed_details": "<текст или 'Данные не определены'>",
          "profit_tax_status": "<defined / not_defined>",
          "profit_tax_details": "<текст или 'Данные не определены'>",
          "economic_purpose_status": "<defined / not_defined>",
          "economic_purpose_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС налоговые обязательства доход кредитора расход должника первичные документы акт приёма-передачи стоимость для целей налогообложения рыночная стоимость для налога не является дарением экономическая цель налог на прибыль"
      retrieval_profile: "tax_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "стоимость отступного как коммерческое условие"
        - "согласованная стоимость для погашения долга"
        - "соразмерность в контексте банкротства"
        - "ст. 61.2"
        - "ст. 61.3"
        - "аффилированность"
        - "залог"
        - "банкротство"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        налоговые и учётные формулировки: НДС-оговорку, стоимость для
        налоговых целей, перечень первичных документов, оговорку об отсутствии
        дарения, упоминание налога на прибыль и экономической цели сделки.
        Не анализируй фактические налоговые последствия по НК РФ, если они
        прямо не воспроизведены в тексте соглашения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. vat_clause_status — "defined" если НДС-оговорка прямо присутствует
           в тексте соглашения, иначе "not_defined".
        2. vat_clause_details — формулировка о НДС.
        3. tax_value_defined_status — "defined" если стоимость предмета отступного
           для целей налогообложения прямо определена, иначе "not_defined".
        4. tax_value_defined_details — такая стоимость.
        5. primary_documents_status — "defined" если первичные документы или акт
           приёма-передачи прямо упомянуты как подлежащие оформлению,
           иначе "not_defined".
        6. primary_documents_details — формулировка о первичных документах.
        7. gift_risk_addressed_status — "defined" если прямо указано, что сделка
           не является дарением или носит возмездный характер, иначе "not_defined".
        8. gift_risk_addressed_details — соответствующая формулировка.
        9. profit_tax_status — "defined" если налог на прибыль или иные
           налоговые последствия прямо упомянуты в тексте, иначе "not_defined".
        10. profit_tax_details — формулировка о налоге на прибыль или иных
            налоговых последствиях.
        11. economic_purpose_status — "defined" если экономическая цель сделки
            прямо упомянута в тексте, иначе "not_defined".
        12. economic_purpose_details — формулировка об экономической цели сделки.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - Не выводи налоговые последствия из норм НК РФ, если они прямо
          не воспроизведены в тексте соглашения.
        - vat_clause_status = "defined" как при наличии оговорки о начислении НДС,
          так и при прямом указании, что передача НДС не облагается.
        - primary_documents_status = "defined" только если первичные документы
          или акт приёма-передачи прямо упомянуты как подлежащие оформлению;
          не выводи из факта передачи имущества.
        - gift_risk_addressed_status = "defined" только если соответствующая
          формулировка прямо присутствует в тексте.
        - Верни только JSON.
        </rules>
      fields:
        - name: "vat_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия НДС-оговорки."
          required: true
        - name: "vat_clause_details"
          type: "string"
          presentation: "fact"
          label: "НДС-оговорка"
          description: "Формулировка о НДС."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "tax_value_defined_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания стоимости для налоговых целей."
          required: false
        - name: "tax_value_defined_details"
          type: "string"
          presentation: "fact"
          label: "Стоимость для налоговых целей"
          description: "Стоимость предмета отступного для целей налогообложения."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "primary_documents_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на первичные документы."
          required: false
        - name: "primary_documents_details"
          type: "string"
          presentation: "fact"
          label: "Первичные документы"
          description: "Формулировка о первичных документах или акте приёма-передачи."
          required: false
          display_in_grid: false
        - name: "gift_risk_addressed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус формулировки о том, что сделка не является дарением."
          required: false
        - name: "gift_risk_addressed_details"
          type: "string"
          presentation: "fact"
          label: "Не является дарением"
          description: "Формулировка о том, что сделка не является дарением."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "profit_tax_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания налога на прибыль или иных налоговых последствий."
          required: false
        - name: "profit_tax_details"
          type: "string"
          presentation: "fact"
          label: "Налоговые последствия"
          description: "Формулировка о налоге на прибыль или иных налоговых последствиях."
          required: false
          display_in_grid: false
        - name: "economic_purpose_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания экономической цели сделки."
          required: false
        - name: "economic_purpose_details"
          type: "string"
          presentation: "fact"
          label: "Экономическая цель сделки"
          description: "Формулировка об экономической цели сделки."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: СОГЛАСИЕ СУПРУГА
  # ──────────────────────────────────────────────────────────────────────────
  - id: spousal_consent_for_individual_check
    name: "Согласие супруга при передаче совместного имущества физическим лицом"
    description: >
      Фактографическая проверка наличия в тексте нотариального согласия супруга,
      указания на отсутствие брака, личный характер имущества или брачный договор,
      если должник — физическое лицо.
    triggers:
      any: ["individual_party"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "совместно нажитое имущество"
        - "личная собственность"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
        - "(?i)совместн(о|ого)\\s+нажит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: есть ли в тексте указание на согласие супруга
        или на личный режим имущества при участии физического лица.

        Нормативный ориентир:
        - ст. 35 СК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Является ли должник физическим лицом.
        2. Есть ли указание на нотариальное согласие супруга.
        3. Есть ли указание, что должник не состоит в браке.
        4. Есть ли указание, что имущество является личной собственностью.
        5. Есть ли указание на брачный договор.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай семейный статус.
        3. Если формулировки нет — возвращай "not_defined".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Должник подтверждает, что передаваемое имущество является его личной
        собственностью и не относится к совместно нажитому имуществу супругов."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Должник является физическим лицом",
          "spousal_consent_status": "personal_property",
          "spousal_consent_details": "имущество является личной собственностью",
          "consent_document_type": "statement",
          "marital_regime_confirmed_status": "defined",
          "marital_regime_confirmed_details": "не относится к совместно нажитому имуществу супругов",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Должник подтверждает, что передаваемое имущество является его личной собственностью и не относится к совместно нажитому имуществу супругов."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Гражданин Иванов И.И. передает имущество кредитору."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Гражданин Иванов И.И.",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "consent_document_type": "not_defined",
          "marital_regime_confirmed_status": "not_defined",
          "marital_regime_confirmed_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "Гражданин Иванов И.И. передает имущество кредитору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о физическом лице.
        2. Найди прямую цитату о согласии супруга / отсутствии брака / личной собственности.
        3. Если прямой цитаты нет — верни "not_defined".
        4. Не додумывай семейный статус должника.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "individual_party_as_debtor_status": "<defined / not_defined>",
          "individual_party_as_debtor_details": "<текст или 'Данные не определены'>",
          "spousal_consent_status": "<present / not_married / personal_property / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "consent_document_type": "<notarized / statement / not_defined>",
          "marital_regime_confirmed_status": "<defined / not_defined>",
          "marital_regime_confirmed_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие супруга нотариальное согласие не состоит в браке совместно нажитое имущество личная собственность брачный договор семейный режим имущества личный режим имущества"
      preferred_unit_types:
        - warranty
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "крупная сделка"
        - "одобрение общего собрания"
        - "корпоративное одобрение"
        - "первоначальное обязательство"
        - "предмет отступного"
        - "стоимость отступного"
        - "залог"
        - "ипотека"
        - "свободно от прав третьих лиц"
        - "банкротство"
        - "неплатежеспособность"
        - "НДС"
        - "не является новацией"
        - "зачёт"
        - "прощение долга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.12
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        формулировки о согласии супруга, отсутствии брака, личном характере
        имущества или наличии брачного договора, если Должник является
        физическим лицом.
        Не анализируй семейный статус самостоятельно — только то, что прямо
        написано в тексте соглашения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. individual_party_as_debtor_status — "defined" если Должник прямо указан
           как физическое лицо (гражданин, физическое лицо, ИП), иначе "not_defined".
        2. individual_party_as_debtor_details — формулировка, подтверждающая,
           что Должник является физическим лицом.
        3. spousal_consent_status — "present" / "not_married" / "personal_property" /
           "not_defined".
        4. spousal_consent_details — формулировка о согласии супруга, отсутствии
           брака, личной собственности или брачном договоре.
        5. consent_document_type — "notarized" / "statement" / "not_defined".
        6. marital_regime_confirmed_status — "defined" если режим имущества или
           семейный статус должника прямо подтверждён, иначе "not_defined".
        7. marital_regime_confirmed_details — формулировка о семейном статусе
           или режиме имущества.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - spousal_consent_status:
            - "present" — нотариальное согласие супруга прямо упомянуто или приложено.
            - "not_married" — должник прямо подтверждает, что не состоит в браке.
            - "personal_property" — прямо указано, что имущество является личной
              собственностью должника и не относится к совместно нажитому.
            - "not_defined" — ни одна из перечисленных ситуаций прямо не указана.
        - consent_document_type:
            - "notarized" — прямо указано, что согласие нотариально удостоверено.
            - "statement" — согласие оформлено в иной форме (заявление, подтверждение
              в тексте соглашения), не упомянутой как нотариальное.
            - "not_defined" — тип подтверждающего документа прямо не указан
              или согласие не упомянуто.
        - individual_party_as_debtor_status = "defined" только если из текста
          прямо следует, что Должник является физическим лицом; не выводи из
          наличия имени и отчества.
        - Не делай самостоятельного вывода о необходимости согласия супруга.
        - Верни только JSON.
        </rules>
      fields:
        - name: "individual_party_as_debtor_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания, что Должник является физическим лицом."
          required: true
        - name: "individual_party_as_debtor_details"
          type: "string"
          presentation: "fact"
          label: "Должник-физическое лицо"
          description: "Формулировка о том, что Должник является физическим лицом."
          required: false
          display_in_grid: false
        - name: "spousal_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_married", "personal_property", "not_defined"]
          description: "Статус согласия супруга или личного режима имущества."
          required: true
        - name: "spousal_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие супруга / личный режим"
          description: "Формулировка о согласии супруга, отсутствии брака или личной собственности."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "consent_document_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["notarized", "statement", "not_defined"]
          description: "Тип подтверждающего документа или заявления."
          required: false
        - name: "marital_regime_confirmed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения семейного или имущественного режима."
          required: false
        - name: "marital_regime_confirmed_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение семейного режима"
          description: "Формулировка о браке, брачном договоре или личной собственности."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты должника и кредитора (наименование/ФИО, ИНН/ОГРН/ОГРНИП, адрес);
      (б) полномочия подписантов (устав, доверенность, протокол назначения);
      (в) корпоративные решения об одобрении (если сделка является крупной
      или с заинтересованностью) либо заключение о ненужности одобрения.
    addressee: "Обе стороны / Юридический советник"

  original_obligation_extraction:
    text: >
      Просим предоставить по {doc_names}:
      (а) точные реквизиты прекращаемого обязательства (договор + дата + стороны);
      (б) размер долга с разбивкой на компоненты (основной долг / проценты / неустойка);
      (в) явное указание на полное или частичное прекращение;
      (г) при частичном погашении — размер остатка задолженности;
      (д) наличие обеспечительных обязательств по прекращаемому долгу.
    addressee: "Обе стороны"

  otsupnoe_subject_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) детальное описание предмета отступного с индивидуализирующими признаками;
      (б) порядок и документ фактической передачи (акт, платёж, договор уступки, регистрация);
      (в) конкретный срок предоставления отступного;
      (г) последствия просрочки предоставления.
    addressee: "Должник / Юридический советник"

  real_character_and_termination_moment_check:
    text: >
      Просим уточнить в {doc_names}: обязательство прекращается не в момент
      подписания соглашения, а в момент фактического предоставления отступного
      (либо госрегистрации / зачисления средств). Формулировку привести
      в соответствие с реальным характером сделки по ст. 409 ГК РФ.
    addressee: "Юридический советник"

  valuation_and_settlement_scope_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) согласованную стоимость предмета отступного и метод её определения;
      (б) прекращается долг полностью или частично;
      (в) при частичном — чёткий остаток задолженности;
      (г) оговорку об окончательности урегулирования (full and final settlement)
      и отказе от дальнейших претензий.
    addressee: "Обе стороны"

  recharacterization_distinction_check:
    text: >
      Просим уточнить в {doc_names}: явная ссылка на ст. 409 ГК РФ;
      оговорка о том, что соглашение является отступным (а не новацией,
      прощением долга, зачётом или куплей-продажей); формулировка
      «взамен исполнения» первоначального обязательства.
    addressee: "Юридический советник"

  title_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии залога, ареста и прав третьих лиц
      на предмет отступного;
      (б) заверение о надлежащем качестве предмета отступного;
      (в) явное указание на то, что риск случайной гибели несёт должник
      до момента фактической передачи кредитору.
    addressee: "Должник"

  real_estate_and_claim_specifics_check:
    text: >
      Если отступное — недвижимость, просим предоставить по {doc_names}:
      кадастровый номер, выписку ЕГРН, правоустанавливающий документ,
      порядок и распределение расходов на государственную регистрацию.

      Если отступное — право требования, просим предоставить:
      реквизиты основного договора, идентификацию должника по уступаемому
      требованию, объём уступаемого права, документы и план уведомления должника.
    addressee: "Должник / Юридический советник"

  secured_obligation_fate_check:
    text: >
      Просим уточнить в {doc_names}: как урегулирована судьба обеспечений
      прекращаемого обязательства:
      (а) снятие залога — порядок, ответственный, срок;
      (б) погашение ипотечной записи в ЕГРН — совместное заявление или закладная;
      (в) уведомление поручителей;
      (г) распределение расходов на регистрационные действия.
    addressee: "Кредитор / Юридический советник"

  bankruptcy_and_fair_value_risk_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения должника об отсутствии процедуры банкротства
      и признаков неплатёжеспособности;
      (б) подтверждение рыночной / соразмерной стоимости отступного
      (отчёт оценщика или документальное обоснование);
      (в) раскрытие аффилированности сторон (при наличии);
      (г) анализ периода подозрительности (1-3 года до возможного банкротства).
    addressee: "Юридический советник / Финансовый консультант"

  tax_and_accounting_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) НДС-последствия передачи предмета отступного;
      (б) стоимость для целей налогообложения;
      (в) первичные документы (акт, товарная накладная) для подтверждения операции;
      (г) обоснование возмездного характера сделки (не дарение).
    addressee: "Налоговый консультант"

  spousal_consent_for_individual_check:
    text: >
      Если должник по {doc_names} — физическое лицо, просим предоставить:
      нотариальное согласие супруга на передачу совместного имущества (ст. 35 СК РФ)
      либо подтверждение отсутствия брака / личного режима имущества / брачного договора.
    addressee: "Должник"

  termination_and_disputes_check:
    text: >
      Просим уточнить в {doc_names}:
      (а) подсудность споров;
      (б) претензионный порядок с конкретным сроком рассмотрения;
      (в) условия конфиденциальности и перечень исключений;
      (г) применимое право.
    addressee: "Юридический советник"

  bankruptcy_preference_or_suspect_transaction_risk:
    text: >
      Внимание: по {doc_names} имеется риск оспаривания как предпочтительной
      или подозрительной сделки в банкротстве (ст. 61.2-61.3 ФЗ-127).
      Просим предоставить: подтверждение платежеспособности должника,
      отчёт о рыночной стоимости предмета отступного и правовой анализ
      периода подозрительности.
    addressee: "Юридический советник / Финансовый консультант"

  real_estate_transfer_registration_required:
    text: >
      Внимание: если в {doc_names} отступным является недвижимость,
      переход права требует государственной регистрации (ст. 131, 551 ГК РФ).
      Просим подготовить регистрационный пакет и согласовать порядок
      подачи документов в Росреестр.
    addressee: "Юридический советник / Должник"

  claim_assignment_identification_required:
    text: >
      Внимание: если в {doc_names} отступным является право требования,
      требуется полная идентификация уступаемого права и пакет transfer documents.
      Просим предоставить: договор-основание, реквизиты должника по требованию,
      уведомление должника и документы, подтверждающие требование.
    addressee: "Юридический советник"

  misclassification_risk_not_novation_or_forgiveness:
    text: >
      Внимание: {doc_names} содержит риск неверной квалификации.
      Просим уточнить конструкцию сделки и привести формулировки
      в соответствие с моделью отступного по ст. 409 ГК РФ,
      исключив признаки новации, прощения долга и зачёта.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

