        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наличии обеспечения.
        2. Найди прямую цитату о прекращении обеспечения; определи, автоматическое
           оно или требует отдельных действий, а не общая отсылка к закону.
        3. Найди прямую цитату о снятии залога / погашении записи об ипотеке
           с конкретными действиями (кто/куда/когда подаёт документы).
        4. Найди прямую цитату о возврате документов и об уведомлении поручителей
           с конкретным сроком/способом, а не общую ссылку на закон.
        5. Убедись, что речь идёт об обеспечении первоначального обязательства,
           а не об обременениях на предмет отступного.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

