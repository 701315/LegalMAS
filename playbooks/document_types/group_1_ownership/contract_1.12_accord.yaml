    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "otsupnoe_type"
          type: "string"
          allowed_values: ["money", "movable_property", "real_estate", "claim", "securities", "mixed", "not_defined"]
        - name: "otsupnoe_description_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "otsupnoe_description"
          type: "string"
        - name: "identifying_features_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "identifying_features"
