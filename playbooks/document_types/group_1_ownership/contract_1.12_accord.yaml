        2. Найди прямую цитату о валюте обязательства.
        3. Найди прямую цитату о порядке расчётов; убедись, что указан
           конкретный банк или порядок постановки на учёт, а не общая отсылка
           к валютному законодательству.
        4. Найди прямую цитату о валютной оговорке с конкретным курсом.
        5. Найди прямую цитату о специальных экономических мерах (если есть).
        6. Проверь: не является ли формулировка общей фразой о "соответствии
           валютному законодательству" без конкретики — если да, все поля
