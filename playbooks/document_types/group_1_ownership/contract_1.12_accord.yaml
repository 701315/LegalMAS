  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: ПРЕДМЕТ ОТСТУПНОГО / ПЕРЕДАЧА / СРОК
  # ──────────────────────────────────────────────────────────────────────────
  - id: otsupnoe_subject_and_transfer_check
    name: "Предмет отступного, механизм передачи и срок предоставления"
    description: >
      Фактографическая проверка предмета отступного: деньги, движимое имущество,
      недвижимость, право требования, ценные бумаги; механизма передачи;
      срока предоставления; необходимости регистрации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отступное"
        - "предмет отступного"
        - "передача имущества"
        - "акт приема-передачи"
        - "право требования"
        - "денежные средства"
        - "недвижимость"
        - "автомобиль"
        - "в течение"
        - "не позднее"
        - "срок передачи"
        - "срок предоставления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дней|банковск)"
        - "(?i)срок\\s+(передач|предоставлен).*отступн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: предмет отступного, механизм передачи, срок предоставления.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 131, 551 ГК РФ
        - ст. 382–390 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой тип отступного указан.
        2. Как описан предмет отступного.
        3. Есть ли индивидуализирующие признаки предмета.
        4. Какой документ / механизм передачи указан.
        5. Какой срок предоставления отступного указан.
        6. Есть ли последствия просрочки.
        7. Требуется ли регистрация.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай описание предмета.
        3. Если данных нет — верни "Данные не определены" / "not_defined".
        4. Не используй None/null.
        5. Верни только один JSON-объект.
        6. Evidence — только текст соглашения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору автомобиль Toyota Camry,
        VIN XXXXXXXXXXXXXXXX, по акту приема-передачи не позднее 5 рабочих дней
        с даты подписания настоящего соглашения."

        Ответ:
        {
          "otsupnoe_type": "movable_property",
          "otsupnoe_description_status": "defined",
          "otsupnoe_description_value": "автомобиль Toyota Camry",
          "identifying_features_status": "defined",
          "identifying_features_value": "VIN XXXXXXXXXXXXXXXX",
          "transfer_document": "act",
          "transfer_deadline_status": "defined",
          "transfer_deadline_value": "не позднее 5 рабочих дней с даты подписания",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Данные не определены",
          "registration_required": "no",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору автомобиль Toyota Camry, VIN XXXXXXXXXXXXXXXX, по акту приема-передачи не позднее 5 рабочих дней с даты подписания настоящего соглашения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Отступное передается кредитору."

        Ответ:
        {
          "otsupnoe_type": "not_defined",
          "otsupnoe_description_status": "not_defined",
          "otsupnoe_description_value": "Данные не определены",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Данные не определены",
          "transfer_document": "not_defined",
          "transfer_deadline_status": "not_defined",
          "transfer_deadline_value": "Данные не определены",
          "late_transfer_consequences_status": "not_defined",
          "late_transfer_consequences_value": "Данные не определены",
          "registration_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе и описании отступного.
        2. Найди прямую цитату о сроке передачи.
        3. Найди прямую цитату о механизме передачи.
        4. Если данных нет — верни "not_defined".
        5. Не додумывай регистрационный режим, если он прямо не вытекает из текста предмета.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "otsupnoe_type": "<money / movable_property / real_estate / claim / securities / mixed / not_defined>",
          "otsupnoe_description_status": "<defined / not_defined>",
          "otsupnoe_description_value": "<текст или 'Данные не определены'>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<текст или 'Данные не определены'>",
          "transfer_document": "<payment / act / assignment_docs / registration / mixed / not_defined>",
          "transfer_deadline_status": "<defined / not_defined>",
          "transfer_deadline_value": "<текст или 'Данные не определены'>",
          "late_transfer_consequences_status": "<defined / not_defined>",
          "late_transfer_consequences_value": "<текст или 'Данные не определены'>",
          "registration_required": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800

