        - name: "registration_required"
          type: "string"
          allowed_values: ["yes", "no", "not_defined"]
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: РЕАЛЬНЫЙ ХАРАКТЕР / МОМЕНТ ПРЕКРАЩЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: real_character_and_termination_moment_check
    name: "Реальный характер соглашения и момент прекращения обязательства"
    description: >
      Фактографическая проверка того, к какому моменту текст договора
      привязывает прекращение обязательства: к фактическому предоставлению,
      к регистрации, к зачислению денег или к подписанию соглашения.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "с момента передачи отступного"
        - "с момента фактической передачи"
        - "после предоставления отступного"
        - "с момента зачисления денежных средств"
        - "с момента государственной регистрации"
        - "с даты подписания"
        - "реальная сделка"
      keyword_mode: "any"
      negative_keywords:
        - "обязательство прекращается с даты подписания настоящего соглашения"
        - "обязательство прекращается с момента заключения настоящего соглашения"
      regex_patterns:
        - "(?i)обязательств(о|а).*прекраща(ется|ются).*с\\s+момента"
        - "(?i)с\\s+момента\\s+фактическ(ой|ого)\\s+передач"
        - "(?i)с\\s+даты\\s+подписания"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какой момент прекращения обязательства
        прямо указан в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прекращается ли обязательство с момента фактической передачи.
        2. Прекращается ли обязательство с момента государственной регистрации.
        3. Прекращается ли обязательство с момента зачисления денежных средств.
        4. Прекращается ли обязательство с даты подписания.
        5. Есть ли указание, что кредитор сохраняет право требовать исполнение
           до фактического предоставления отступного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подменяй текст нормы закона.
        3. Не делай квалификационный вывод вовне — только извлекай факт.
        4. Если момент не указан прямо — верни "not_defined" / "Данные не определены".
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Обязательство Должника считается прекращенным с момента фактической передачи
        Кредитору имущества, указанного в п. 2.1 настоящего соглашения."

        Ответ:
        {
          "termination_moment": "upon_actual_transfer",
          "termination_moment_status": "defined",
          "termination_moment_details": "с момента фактической передачи Кредитору имущества",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство Должника считается прекращенным с момента фактической передачи Кредитору имущества."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Обязательство прекращается с даты подписания настоящего соглашения."

        Ответ:
        {
          "termination_moment": "upon_signing",
          "termination_moment_status": "defined",
          "termination_moment_details": "с даты подписания настоящего соглашения",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство прекращается с даты подписания настоящего соглашения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте прекращения.
        2. Не выводи момент прекращения по умолчанию из закона, если его нет в тексте.
        3. Если прямой цитаты нет — верни "not_defined".
        4. Не додумывай намерения сторон.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_moment": "<upon_actual_transfer / upon_registration / upon_payment_receipt / upon_signing / not_defined>",
          "termination_moment_status": "<defined / not_defined>",
          "termination_moment_details": "<текст или 'Данные не определены'>",
          "creditor_right_preserved_until_transfer_status": "<defined / not_defined>",
          "creditor_right_preserved_until_transfer_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "с момента передачи"
        - "фактическая передача"
        - "с даты подписания"
        - "прекращение обязательства"
        - "реальная сделка"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "termination_moment"
          type: "string"
          allowed_values: ["upon_actual_transfer", "upon_registration", "upon_payment_receipt", "upon_signing", "not_defined"]
        - name: "termination_moment_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "termination_moment_details"
          type: "string"
        - name: "creditor_right_preserved_until_transfer_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "creditor_right_preserved_until_transfer_details"
          type: "string"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: СТОИМОСТЬ / ОБЪЁМ ПОГАШЕНИЯ / ОКОНЧАТЕЛЬНОСТЬ
  # ──────────────────────────────────────────────────────────────────────────
  - id: valuation_and_settlement_scope_check
    name: "Стоимость отступного, объём погашения долга и окончательность расчётов"
    description: >
      Фактографическая проверка согласованной стоимости отступного,
      объёма погашения долга, остатка долга при частичном погашении,
      а также оговорок об окончательности урегулирования.
    triggers:
      any: ["partial_termination", "tax_sensitive_structure"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "стоимость отступного"
        - "оценивается сторонами"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
        - "полное погашение"
        - "согласованная стоимость"
        - "стороны не имеют претензий"
        - "долг считается погашенным"
        - "прекращаются все обязательства"
        - "без права на предъявление дальнейших требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+отступн"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"
        - "(?i)не\\s+имеют\\s+друг\\s+к\\s+другу\\s+претенз"
        - "(?i)долг\\s+считается\\s+погашенн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: стоимость отступного, объём погашения долга,
        остаток долга и окончательность расчётов.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - НК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли согласованная стоимость отступного.
        2. Есть ли указание на способ определения стоимости.
        3. Погашается долг полностью или частично.
        4. Если частично — определён ли остаток долга.
        5. Есть ли формулировка об окончательности урегулирования.
        6. Есть ли отказ от дальнейших претензий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай стоимость, остаток долга и метод оценки.
        3. Если данных нет — верни "Данные не определены" / "not_defined".
        4. Не используй None/null.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны согласовали стоимость отступного в размере 900 000 рублей.
        Передача отступного прекращает обязательство в полном объеме.
        После исполнения настоящего соглашения стороны не имеют друг к другу
        каких-либо претензий."

        Ответ:
        {
          "agreed_value_status": "defined",
          "agreed_value_details": "900 000 рублей",
          "valuation_method": "contractual",
          "debt_termination_scope": "full",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Данные не определены",
          "full_and_final_settlement_status": "defined",
          "full_and_final_settlement_details": "стороны не имеют друг к другу каких-либо претензий",
          "no_further_claims_status": "defined",
          "no_further_claims_details": "стороны не имеют друг к другу каких-либо претензий",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стороны согласовали стоимость отступного в размере 900 000 рублей. Передача отступного прекращает обязательство в полном объеме."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о передаче имущества."

        Ответ:
        {
          "agreed_value_status": "not_defined",
          "agreed_value_details": "Данные не определены",
          "valuation_method": "not_defined",
          "debt_termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Данные не определены",
          "full_and_final_settlement_status": "not_defined",
          "full_and_final_settlement_details": "Данные не определены",
          "no_further_claims_status": "not_defined",
          "no_further_claims_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о стоимости отступного.
        2. Найди прямую цитату о полном/частичном погашении.
        3. Найди прямую цитату об остатке долга.
        4. Найди прямую цитату об окончательности расчётов.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "agreed_value_status": "<defined / not_defined>",
          "agreed_value_details": "<текст или 'Данные не определены'>",
          "valuation_method": "<contractual / market / appraiser / not_defined>",
          "debt_termination_scope": "<full / partial / not_defined>",
          "remaining_debt_status": "<defined / not_defined>",
          "remaining_debt_details": "<текст или 'Данные не определены'>",
          "full_and_final_settlement_status": "<defined / not_defined>",
          "full_and_final_settlement_details": "<текст или 'Данные не определены'>",
          "no_further_claims_status": "<defined / not_defined>",
          "no_further_claims_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "стоимость отступного"
        - "полное погашение"
        - "остаток долга"
        - "в полном объёме"
        - "не имеют претензий"
        - "долг считается погашенным"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "agreed_value_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "agreed_value_details"
          type: "string"
        - name: "valuation_method"
          type: "string"
          allowed_values: ["contractual", "market", "appraiser", "not_defined"]
        - name: "debt_termination_scope"
          type: "string"
          allowed_values: ["full", "partial", "not_defined"]
        - name: "remaining_debt_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "remaining_debt_details"
          type: "string"
        - name: "full_and_final_settlement_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "full_and_final_settlement_details"
          type: "string"
        - name: "no_further_claims_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
        - name: "no_further_claims_details"
          type: "string"
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: ОТГРАНИЧЕНИЕ ОТ ИНЫХ КОНСТРУКЦИЙ
  # ──────────────────────────────────────────────────────────────────────────
  - id: recharacterization_distinction_check
    name: "Формулировки об отступном и отграничение от новации, прощения долга, зачёта"
    description: >
      Фактографическая проверка наличия в тексте прямой ссылки на ст. 409 ГК РФ,
      указания, что соглашение является отступным, а также оговорок о том,
      что конструкция не является новацией, прощением долга или зачётом.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "ст. 409 ГК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+новаци"
        - "(?i)не\\s+является\\s+прощени(ем|я)\\s+долг"
        - "(?i)замен(а|яет)\\s+обязательств"
        - "(?i)ст(?:атья|\\.)?\\s*409"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие квалифицирующие формулировки
        прямо есть в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 410 ГК РФ
