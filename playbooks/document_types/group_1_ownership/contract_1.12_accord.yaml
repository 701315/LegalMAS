  - id: recharacterization_distinction_check
    name: "Отграничение от новации, прощения долга и иных конструкций"
    description: >
      Проверяет, не создает ли текст риска переквалификации соглашения
      в новацию, прощение долга, зачет или иную сделку.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "прощение долга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+новаци"
        - "(?i)не\\s+является\\s+прощени(ем|я)\\s+долг"
        - "(?i)замен(а|яет)\\s+обязательств"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь риск смешения с новацией, прощением долга, зачетом или иной конструкцией.

        Ответь строго в JSON:
        {
          "qualification_as_otsupnoe": "<clear / mixed / doubtful>",
          "novation_risk": "<yes / no / unclear>",
          "debt_forgiveness_risk": "<yes / no / unclear>",
          "setoff_risk": "<yes / no / unclear>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "новация"
        - "прощение долга"
        - "зачет"
        - "отступное"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "qualification_as_otsupnoe"
          type: "string"
          allowed_values: ["clear", "mixed", "doubtful"]
          description: "Четкость квалификации как отступного"
        - name: "novation_risk"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Риск квалификации как новации"
        - name: "debt_forgiveness_risk"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Риск квалификации как прощения долга"
      store_payload: true

  - id: bankruptcy_and_fair_value_risk_check
    name: "Банкротный риск и соразмерность отступного"
    description: >
      Проверяет наличие признаков банкротного риска, несоразмерности стоимости,
      аффилированности и иных факторов оспаривания.
    triggers:
      any: ["bankruptcy_risk_context", "tax_sensitive_structure"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "платежеспособность"
        - "не является сделкой с предпочтением"
        - "рыночная стоимость"
        - "соразмерность"
        - "аффилированность"
        - "кредиторы"
        - "подозрительная сделка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)сделк(а|и)\\s+с\\s+предпочтени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь банкротный риск и соразмерность стоимости.

        Ответь строго в JSON:
        {
          "bankruptcy_risk_disclosed": "<yes / no / partial>",
          "fair_value_support": "<yes / no / partial>",
          "affiliate_risk": "<yes / no / unclear>",
          "challenge_risk_level": "<high / medium / low>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "банкротство"
        - "рыночная стоимость"
        - "предпочтение"
        - "аффилированность"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "bankruptcy_risk_disclosed"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Раскрыт ли банкротный риск"
        - name: "fair_value_support"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Есть ли подтверждение соразмерной стоимости"
        - name: "challenge_risk_level"
          type: "string"
          allowed_values: ["high", "medium", "low"]
          description: "Уровень риска оспаривания"
      store_payload: true

  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Критическая проверка: если прекращаемое обязательство обеспечено залогом,
      ипотекой или поручительством, прекращение основного обязательства отступным
      влечёт прекращение обеспечительных обязательств (ст. 329, 352, 367 ГК РФ).
      Необходимо урегулировать: снятие залога/ипотеки, уведомление поручителей,
      прекращение записей в реестрах, возврат закладной.
    triggers:
      any: ["secured_original_obligation"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Проверь, как урегулирована судьба обеспечений основного обязательства.

        По ст. 329, 352, 367 ГК РФ:
        - Прекращение основного обязательства влечёт прекращение обеспечительных
        - Залог/ипотека подлежат снятию (погашение записи в ЕГРН)
        - Поручительство прекращается автоматически, но поручители должны быть уведомлены
        - Закладная подлежит возврату/погашению

        Ответь строго в JSON:
        {
          "secured_obligation_identified": "<yes / no / not_found>",
          "security_type": "<pledge / mortgage / surety / mixed / not_found>",
          "security_termination_clause": "<described / partial / not_found>",
          "mortgage_release_procedure": "<described / not_found / not_applicable>",
          "surety_notification": "<described / not_found / not_applicable>",
          "pledge_document_return": "<described / not_found / not_applicable>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение"
        - "снятие залога"
        - "закладная"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "security_type"
          type: "string"
          allowed_values: ["pledge", "mortgage", "surety", "mixed", "not_found"]
          description: "Тип обеспечения"
        - name: "security_termination_clause"
          type: "string"
          allowed_values: ["described", "partial", "not_found"]
          description: "Описан ли порядок прекращения обеспечений"
      store_payload: true

  - id: spousal_consent_for_individual_check
    name: "Согласие супруга при передаче совместного имущества (ст. 35 СК РФ)"
    description: >
      Если должник — физлицо и отступным является недвижимость или иное совместно
      нажитое имущество, требуется нотариальное согласие супруга.
      Отсутствие согласия = риск оспаривания сделки (ст. 35 СК РФ).
    triggers:
      any: ["individual_party"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "совместно нажитое имущество"
        - "личная собственность"
        - "брачный договор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
        - "(?i)совместн(о|ого)\\s+нажит"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий соглашение об отступном.
        Если должник — физическое лицо, проверь наличие согласия супруга.

        По ст. 35 СК РФ:
        - Для распоряжения недвижимостью и сделок, требующих нотариального удостоверения
          или госрегистрации, нужно нотариальное согласие супруга
        - При отсутствии — супруг вправе оспорить сделку в течение года

        Ответь строго в JSON:
        {
          "individual_party_as_debtor": "<yes / no / not_found>",
          "spousal_consent_status": "<present / not_married / not_found>",
          "consent_document_type": "<notarized / statement / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "в браке"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["present", "not_married", "not_found"]
          description: "Статус согласия супруга"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны: должник и кредитор"
    description: "Проверяет идентификацию сторон соглашения об отступном"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "должник"
        - "кредитор"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(должник|кредитор).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

  - id: "original_obligation_identification"
    name: "Первоначальное обязательство: точная идентификация"
