        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе и описании отступного.
        2. Найди прямую цитату о сроке передачи; если срок определяется через
           отсылку к приложению/графику — отрази это как понятную формулировку.
        3. Найди прямую цитату о механизме передачи.
        4. Проверь: не является ли формулировка общей фразой без конкретики
           ("в разумный срок", "в установленном порядке") — если да, это not_defined.
        5. Если данных нет — верни "not_defined" и соответствующий fallback.
        6. Не додумывай регистрационный режим, если он прямо не упомянут в тексте.
        7. Если фрагменты противоречат друг другу (например, разные описания
           предмета) — верни "not_defined" / "Не удалось определить".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

