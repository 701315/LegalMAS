              "clause_ref": "п. 9.1",
              "quote": "Стоимость передаваемого имущества для целей налогообложения составляет 1 000 000 рублей. Передача имущества облагается НДС."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны передают имущество в счет прекращения обязательства."

        Ответ:
        {
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Данные не определены",
          "tax_value_defined_status": "not_defined",
          "tax_value_defined_details": "Данные не определены",
          "primary_documents_status": "not_defined",
          "primary_documents_details": "Данные не определены",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Данные не определены",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Данные не определены",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Данные не определены",
          "evidence": []
