          weight: 0.58
          distinctiveness: medium
          context: body
          description: "Общая формула погашения задолженности"

        - pattern: "(?i)акт\\s+приёма-?передачи\\s+имущества|акт\\s+приема-?передачи\\s+имущества"
          weight: 0.62
          distinctiveness: medium
          context: body
          description: "Акт передачи имущества — этап исполнения соглашения об отступном"

        - pattern: "(?i)момент\\s+прекращения\\s+обязательства"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Момент прекращения обязательства — ключевое для квалификации"

        - pattern: "(?i)частичное\\s+прекращение\\s+обязательства"
          weight: 0.62
          distinctiveness: medium
          context: body
          description: "Частичное прекращение обязательства отступным"

        - pattern: "(?i)остаток\\s+долга"
          weight: 0.56
          distinctiveness: medium
          context: body
          description: "Сохранение остатка долга после частичного отступного"

        - pattern: "(?i)вместо\\s+исполнения\\s+обязательства"
          weight: 0.60
          distinctiveness: medium
          context: body
          description: "Иное исполнение вместо изначального"

        - pattern: "(?i)имущество\\s+передаётся\\s+вместо\\s+денежного\\s+обязательства|имущество\\s+передается\\s+вместо\\s+денежного\\s+обязательства"
          weight: 0.62
          distinctiveness: medium
          context: body
          description: "Имущество вместо денежного обязательства"

        - pattern: "(?i)погашение\\s+займа\\s+имуществом"
          weight: 0.58
          distinctiveness: medium
          context: body
          description: "Погашение займа имуществом"

        - pattern: "(?i)переход\\s+права\\s+собственности\\s+к\\s+кредитору"
          weight: 0.58
          distinctiveness: medium
          context: body
          description: "Переход права собственности к кредитору при исполнении"

        - pattern: "(?i)соглашение\\s+о\\s+прекращении\\s+обязательства"
          weight: 0.54
          distinctiveness: medium
          context: body
          description: "Общая формула соглашения о прекращении обязательства"

        - pattern: "(?i)идентификация\\s+(?:первоначального\\s+)?обязательства"
          weight: 0.64
          distinctiveness: medium
          context: body
          description: "Идентификация первоначального обязательства — существенное условие из description"

        - pattern: "(?i)НДС\\s+при\\s+отступном|налоговые\\s+(?:последствия|риски)\\s+отступного"
          weight: 0.65
          distinctiveness: medium
