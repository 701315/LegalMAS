      retrieval_query: "отступное предмет отступного передача имущества акт приёма-передачи право требования денежные средства недвижимость автомобиль в течение не позднее срок передачи срок предоставления VIN кадастровый номер регистрация"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
