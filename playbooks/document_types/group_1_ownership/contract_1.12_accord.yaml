  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: СТОРОНЫ / ПОЛНОМОЧИЯ / КОРП. ОДОБРЕНИЕ
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны соглашения об отступном: должник, кредитор, полномочия, корпоративное одобрение"
    description: >
      Фактографическая проверка наличия в договоре данных о должнике и кредиторе,
      их реквизитах, подписантах, основаниях полномочий, а также указания
      на корпоративное одобрение или на отсутствие необходимости такого одобрения.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "должник"
        - "кредитор"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "решение единственного участника"
        - "одобрение не требуется"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(должник|кредитор).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: идентификация должника и кредитора,
        полномочия подписантов и наличие указания на корпоративное одобрение.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 182–185 ГК РФ
        - ФЗ-14 ст. 45–46
        - ФЗ-208 ст. 78–84

        Важно:
        - Не оценивай серьёзность риска.
        - Устанавливай только то, что прямо есть в тексте соглашения.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Должник.
        2. Кто указан как Кредитор.
        3. Кто подписывает договор от каждой стороны.
        4. На каком основании действует подписант от каждой стороны.
        5. Есть ли в тексте ссылка на корпоративное одобрение либо указание,
           что одобрение не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, требуется ли одобрение по существу, если это не написано в тексте.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ООО «Альфа», именуемое в дальнейшем «Должник», в лице Генерального директора
        Иванова И.И., действующего на основании Устава, и ООО «Бета», именуемое
        «Кредитор», в лице директора Петрова П.П., действующего на основании
        доверенности № 7 от 01.02.2024. Сделка одобрена решением единственного
        участника Должника № 3 от 10.03.2024."

        Ответ:
        {
          "debtor_details_status": "defined",
          "debtor_details_value": "ООО «Альфа»",
          "debtor_type": "legal_entity",
          "debtor_signatory_status": "defined",
          "debtor_signatory_value": "Генеральный директор Иванов И.И.",
          "debtor_signatory_basis": "charter",
          "creditor_details_status": "defined",
          "creditor_details_value": "ООО «Бета»",
          "creditor_type": "legal_entity",
          "creditor_signatory_status": "defined",
          "creditor_signatory_value": "Директор Петров П.П.",
          "creditor_signatory_basis": "poa",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Сделка одобрена решением единственного участника Должника № 3 от 10.03.2024",
          "evidence": [
            {
              "clause_ref": "Преамбула / п. 6.1",
              "quote": "ООО «Альфа», именуемое в дальнейшем «Должник», в лице Генерального директора Иванова И.И., действующего на основании Устава... Сделка одобрена решением единственного участника Должника № 3 от 10.03.2024."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящее соглашение."

        Ответ:
        {
          "debtor_details_status": "not_defined",
          "debtor_details_value": "Данные не определены",
          "debtor_type": "not_defined",
          "debtor_signatory_status": "not_defined",
          "debtor_signatory_value": "Данные не определены",
          "debtor_signatory_basis": "not_defined",
          "creditor_details_status": "not_defined",
          "creditor_details_value": "Данные не определены",
          "creditor_type": "not_defined",
          "creditor_signatory_status": "not_defined",
          "creditor_signatory_value": "Данные не определены",
          "creditor_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Должника.
        2. Найди прямую цитату с идентификацией Кредитора.
        3. Найди прямую цитату о подписантах и основаниях полномочий.
        4. Найди прямую цитату о корпоративном одобрении или его ненужности.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".
        6. Не додумывай реквизиты и не делай правовой вывод вместо текста.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "debtor_details_status": "<defined / not_defined>",
          "debtor_details_value": "<текст или 'Данные не определены'>",
          "debtor_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "debtor_signatory_status": "<defined / not_defined>",
          "debtor_signatory_value": "<текст или 'Данные не определены'>",
          "debtor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "creditor_details_status": "<defined / not_defined>",
          "creditor_details_value": "<текст или 'Данные не определены'>",
          "creditor_type": "<legal_entity / individual / individual_entrepreneur / not_defined>",
          "creditor_signatory_status": "<defined / not_defined>",
          "creditor_signatory_value": "<текст или 'Данные не определены'>",
          "creditor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "должник кредитор именуем в лице действующего на основании ИНН ОГРН крупная сделка сделка с заинтересованностью одобрение общего собрания решение единственного участника одобрение не требуется"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "первоначальное обязательство"
        - "задолженность по договору"
        - "предмет отступного"
        - "срок передачи"
        - "момент прекращения"
        - "не является новацией"
        - "обременения"
        - "залог"
        - "ипотека"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о Должнике, Кредиторе, подписантах, основаниях полномочий
        и корпоративном одобрении.
        Не анализируй предмет отступного, стоимость, прекращение обязательства,
        налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. debtor_details_status — "defined" если Должник прямо идентифицирован,
           иначе "not_defined".
        2. debtor_details_value — наименование/ФИО и реквизиты Должника.
        3. debtor_type — "legal_entity" / "individual" / "individual_entrepreneur" /
           "not_defined".
        4. debtor_signatory_status — "defined" если подписант Должника прямо указан,
           иначе "not_defined".
        5. debtor_signatory_value — подписант Должника.
        6. debtor_signatory_basis — "charter" / "poa" / "order" / "other" / "not_defined".
        7. creditor_details_status — "defined" если Кредитор прямо идентифицирован,
           иначе "not_defined".
        8. creditor_details_value — наименование/ФИО и реквизиты Кредитора.
        9. creditor_type — "legal_entity" / "individual" / "individual_entrepreneur" /
           "not_defined".
        10. creditor_signatory_status — "defined" если подписант Кредитора прямо указан,
            иначе "not_defined".
        11. creditor_signatory_value — подписант Кредитора.
        12. creditor_signatory_basis — "charter" / "poa" / "order" / "other" /
            "not_defined".
        13. corporate_approval_status — "defined" если корпоративное одобрение или
            прямое указание на его ненужность присутствует в тексте, иначе "not_defined".
        14. corporate_approval_details — формулировка о корпоративном одобрении
            или его ненужности.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - debtor_type и creditor_type:
            - "legal_entity" — ООО, АО, ПАО и иные юридические лица.
            - "individual" — физическое лицо без статуса ИП.
            - "individual_entrepreneur" — физическое лицо со статусом ИП
              (указан ОГРНИП).
            - "not_defined" — тип прямо не указан или не определяем из текста.
        - debtor_signatory_basis и creditor_signatory_basis:
            - "charter" — действует на основании устава.
            - "poa" — действует на основании доверенности.
            - "order" — действует на основании приказа.
            - "other" — иное основание, прямо указанное в тексте.
            - "not_defined" — основание полномочий не указано.
        - corporate_approval_status = "defined" как при наличии одобрения,
          так и при прямом указании, что одобрение не требуется.
        - Не делай самостоятельный вывод о необходимости одобрения по закону.
        - Верни только JSON.
        </rules>
      fields:
        - name: "debtor_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Должника."
          required: true
        - name: "debtor_details_value"
          type: "string"
          presentation: "fact"
          label: "Должник: реквизиты"
          description: "Наименование/ФИО и реквизиты Должника."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "debtor_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          description: "Тип Должника."
          required: false
        - name: "debtor_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подписанта Должника."
          required: false
        - name: "debtor_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Должник: подписант"
          description: "Подписант от Должника."
          required: false
          display_in_grid: false
        - name: "debtor_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Должника."
          required: false
        - name: "creditor_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Кредитора."
          required: true
        - name: "creditor_details_value"
          type: "string"
          presentation: "fact"
          label: "Кредитор: реквизиты"
          description: "Наименование/ФИО и реквизиты Кредитора."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "creditor_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          description: "Тип Кредитора."
          required: false
        - name: "creditor_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подписанта Кредитора."
          required: false
        - name: "creditor_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Кредитор: подписант"
          description: "Подписант от Кредитора."
          required: false
          display_in_grid: false
        - name: "creditor_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Кредитора."
          required: false
        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на корпоративное одобрение."
          required: false
        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
          description: "Формулировка о корпоративном одобрении или его ненужности."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: ПЕРВОНАЧАЛЬНОЕ ОБЯЗАТЕЛЬСТВО / ОБЪЁМ ПРЕКРАЩЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: original_obligation_extraction
    name: "Первоначальное обязательство и объём его прекращения"
    description: >
      Фактографическая проверка идентификации прекращаемого обязательства:
      реквизиты основания, сумма долга, состав задолженности,
      полное или частичное прекращение, остаток долга.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "первоначальное обязательство"
        - "договор №"
        - "задолженность"
        - "основной долг"
        - "проценты"
        - "неустойка"
        - "в счет погашения"
        - "прекращается обязательство"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор\\s*№"
        - "{{ money_amount }}"
        - "(?i)основн(ой|ого)\\s+долг|процент|неустойк"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какое обязательство прекращается и в каком объёме.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 432 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основание прекращаемого обязательства.
        2. Реквизиты обязательства (договор / судебный акт / иное).
        3. Размер долга.
        4. Указан ли состав долга: основной долг / проценты / неустойка.
        5. Прекращается ли обязательство полностью или частично.
        6. Если частично — указан ли остаток долга.
        7. Указано ли, что обязательство было обеспеченным.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй недостающие реквизиты.
        3. Не оценивай достаточность идентификации как юрзаключение.
        4. Если данных нет — возвращай "Данные не определены" / "not_defined".
        5. В evidence включай только цитаты из соглашения.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящее соглашение заключено в счет прекращения задолженности Должника
        по Договору поставки № 15 от 10.01.2024 в размере 1 500 000 рублей,
        включая основной долг и проценты. Обязательство прекращается частично,
        остаток долга составляет 200 000 рублей."

        Ответ:
        {
          "original_obligation_basis_status": "defined",
          "original_obligation_basis_code": "contract",
          "original_obligation_details_status": "defined",
          "original_obligation_details_value": "Договор поставки № 15 от 10.01.2024",
          "debt_amount_status": "defined",
          "debt_amount_value": "1 500 000 рублей",
          "principal_status": "defined",
          "interest_status": "defined",
          "penalty_status": "not_defined",
          "termination_scope": "partial",
          "remaining_debt_status": "defined",
          "remaining_debt_value": "200 000 рублей",
          "secured_obligation_status": "not_defined",
          "secured_obligation_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Настоящее соглашение заключено в счет прекращения задолженности Должника по Договору поставки № 15 от 10.01.2024 в размере 1 500 000 рублей, включая основной долг и проценты."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились прекратить обязательство."

        Ответ:
        {
          "original_obligation_basis_status": "not_defined",
          "original_obligation_basis_code": "not_defined",
          "original_obligation_details_status": "not_defined",
          "original_obligation_details_value": "Данные не определены",
          "debt_amount_status": "not_defined",
          "debt_amount_value": "Данные не определены",
          "principal_status": "not_defined",
          "interest_status": "not_defined",
          "penalty_status": "not_defined",
          "termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
