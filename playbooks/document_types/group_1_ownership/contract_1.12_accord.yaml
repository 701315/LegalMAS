        - name: "debtor_signatory_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подписант Должника"
          description: >
            Подписант от Должника вместе с основанием полномочий, если оно указано
            в тексте, например: "Генеральный директор Иванов И.И., действует
            на основании Устава".
            Fallback: "Не указан" / "Не удалось определить".
          required: true

        - name: "debtor_signatory_basis"
          type: "string"
