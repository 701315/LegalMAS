          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "подсудность"
        - "арбитражный суд"
        - "претензионный порядок"
        - "конфиденциальность"
        - "применимое право"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
