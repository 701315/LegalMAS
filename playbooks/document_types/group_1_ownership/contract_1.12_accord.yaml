          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Данные не определены",
          "registration_procedure_status": "defined",
          "registration_procedure_details": "переход права собственности подлежит государственной регистрации в Росреестре",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы на регистрацию стороны несут поровну",
          "claim_basis_status": "not_defined",
