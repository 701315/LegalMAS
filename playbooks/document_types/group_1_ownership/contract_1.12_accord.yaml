      store_payload: true

  - id: title_and_warranties_check
    name: "Гарантии в отношении предмета отступного и риск до передачи"
    description: >
      Фактографическая проверка наличия заверений об отсутствии обременений,
      залога, ареста, прав третьих лиц, а также условий о качестве предмета
      отступного и распределении риска до момента передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "право собственности принадлежит"
        - "надлежащее качество"
        - "отсутствие скрытых недостатков"
        - "риск случайной гибели"
        - "риск повреждения"
        - "до момента передачи"
        - "несет должник"
        - "находится в залоге"
        - "находится под арестом"
        - "за исключением"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)свободн(о|ым)\\s+от\\s+прав\\s+третьих\\s+лиц"
        - "(?i)не\\s+заложен|не\\s+арестован"
        - "(?i)находится\\s+в\\s+залог|находится\\s+под\\s+арест"
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел"
        - "(?i)до\\s+момента\\s+передач"
        - "(?i)за\\s+исключением"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: гарантии в отношении предмета отступного
        и распределение риска до передачи.

        Нормативный ориентир:
        - ст. 460 ГК РФ
        - ст. 211 ГК РФ
        - ст. 459 ГК РФ

        Важно:
        - Для залога, ареста и прав третьих лиц принципиально различать:
          заверение вообще не дано / прямо заверено отсутствие / прямо
          заверено отсутствие с оговоркой-исключением / прямо указано наличие
          обременения. Это разные по значимости риска ситуации, их нельзя
          сводить к одному статусу "defined".
        - Общая фраза вроде "имущество передается в состоянии, соответствующем
          требованиям законодательства" (без конкретного упоминания залога,
          ареста или прав третьих лиц) — это "absent" для соответствующих
          полей, а не "clean". Аналогично, "правомерность владения" без слова
          "собственность"/"титул" — это not_defined для титула, а "риски
          распределяются в соответствии с законодательством" без указания
          конкретной стороны — not_defined для распределения риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности / титула.
        2. Что указано про залог: не упомянуто, отсутствует, отсутствует
           с исключением, или прямо указано наличие залога.
        3. Что указано про арест: аналогично.
        4. Что указано про права третьих лиц: аналогично.
        5. Есть ли гарантия качества / отсутствия скрытых недостатков.
        6. Кто несёт риск случайной гибели / повреждения до передачи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай заверения, которых нет.
        3. Различай отсутствие обременения, отсутствие с исключением и прямое
           наличие обременения — не смешивай эти случаи в одном статусе.
        4. Общая фраза без конкретного упоминания залога/ареста/прав третьих
           лиц — это "absent", а не "clean" (отсутствие обременения нужно
           заверить прямо, а не вывести из общей фразы о законности).
        5. Общая фраза "правомерность владения" без слова "собственность" или
           "титул" — это not_defined для title_warranty.
        6. Общая фраза о рисках "в соответствии с законодательством" без
           указания конкретной стороны — это not_defined для risk_allocation.
        7. Если данных нет — возвращайте "not_defined"/"absent" и соответствующий
           текстовый fallback.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. Evidence — только текст соглашения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полностью определено, всё чисто:
        Фрагмент:
        "Должник подтверждает, что автомобиль принадлежит ему на праве собственности,
        не находится в залоге, под арестом и свободен от прав третьих лиц.
        Риск случайной гибели до момента передачи несет Должник."

        Ответ:
        {
          "title_warranty_status": "defined",
          "title_warranty_details": "Автомобиль принадлежит Должнику на праве собственности",
          "no_pledge_status": "clean",
          "no_pledge_details": "Не находится в залоге",
          "no_arrest_status": "clean",
          "no_arrest_details": "Не находится под арестом",
          "no_third_party_rights_status": "clean",
          "no_third_party_rights_details": "Свободен от прав третьих лиц",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Заверение отсутствует в тексте",
          "risk_allocation_code": "debtor",
          "risk_allocation_status": "defined",
          "risk_allocation_details": "Риск случайной гибели до момента передачи несёт Должник",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Должник подтверждает, что автомобиль принадлежит ему на праве собственности, не находится в залоге, под арестом и свободен от прав третьих лиц. Риск случайной гибели до момента передачи несет Должник."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Имущество передается кредитору."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Заверение отсутствует в тексте",
          "no_pledge_status": "absent",
          "no_pledge_details": "Заверение отсутствует в тексте",
          "no_arrest_status": "absent",
          "no_arrest_details": "Заверение отсутствует в тексте",
          "no_third_party_rights_status": "absent",
          "no_third_party_rights_details": "Заверение отсутствует в тексте",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Заверение отсутствует в тексте",
          "risk_allocation_code": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — обременение прямо есть (red flag), независимая оценка полей:
        Фрагмент:
        "Автомобиль находится в залоге у ПАО «Банк» по договору залога № 12
        от 01.02.2023. Иных прав третьих лиц и ареста в отношении автомобиля
        нет."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Заверение отсутствует в тексте",
          "no_pledge_status": "encumbered",
          "no_pledge_details": "Находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023",
          "no_arrest_status": "clean",
          "no_arrest_details": "Ареста нет",
          "no_third_party_rights_status": "clean",
          "no_third_party_rights_details": "Иных прав третьих лиц нет",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Заверение отсутствует в тексте",
          "risk_allocation_code": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Автомобиль находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023. Иных прав третьих лиц и ареста в отношении автомобиля нет."
            }
          ]
        }

        Пример 4 — заверение с исключением:
        Фрагмент:
        "Должник заверяет, что имущество свободно от прав третьих лиц, за
        исключением договора аренды с ООО «Ромашка» от 01.01.2023."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Заверение отсутствует в тексте",
          "no_pledge_status": "absent",
          "no_pledge_details": "Заверение отсутствует в тексте",
          "no_arrest_status": "absent",
          "no_arrest_details": "Заверение отсутствует в тексте",
          "no_third_party_rights_status": "clean_with_exceptions",
          "no_third_party_rights_details": "Свободно от прав третьих лиц, за исключением договора аренды с ООО «Ромашка» от 01.01.2023",
          "quality_warranty_status": "not_defined",
          "quality_warranty_details": "Заверение отсутствует в тексте",
          "risk_allocation_code": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Должник заверяет, что имущество свободно от прав третьих лиц, за исключением договора аренды с ООО «Ромашка» от 01.01.2023."
            }
          ]
        }

        Пример 5 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Должник гарантирует надлежащее качество товара и правомерность
        владения имуществом. Имущество передается в состоянии, соответствующем
        требованиям действующего законодательства Российской Федерации. Риски
        распределяются между сторонами в соответствии с законодательством РФ."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Заверение отсутствует в тексте",
          "no_pledge_status": "absent",
          "no_pledge_details": "Заверение отсутствует в тексте",
          "no_arrest_status": "absent",
          "no_arrest_details": "Заверение отсутствует в тексте",
          "no_third_party_rights_status": "absent",
          "no_third_party_rights_details": "Заверение отсутствует в тексте",
          "quality_warranty_status": "defined",
          "quality_warranty_details": "Должник гарантирует надлежащее качество товара",
          "risk_allocation_code": "not_defined",
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Должник гарантирует надлежащее качество товара и правомерность владения имуществом. Имущество передается в состоянии, соответствующем требованиям действующего законодательства Российской Федерации. Риски распределяются между сторонами в соответствии с законодательством РФ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по титулу, залогу, аресту и правам третьих лиц.
        2. Для залога/ареста/третьих лиц определи: не упомянуто, отсутствует,
           отсутствует с исключением, или прямо указано наличие.
        3. Проверь: не является ли формулировка общей фразой о "соответствии
           законодательству" без конкретного упоминания залога/ареста/третьих
           лиц/собственности/стороны риска — если да, соответствующее поле
           "absent"/"not_defined".
        4. Найди прямую цитату по качеству.
        5. Найди прямую цитату о риске случайной гибели с явным указанием стороны.
        6. Если прямой цитаты нет — верни "not_defined"/"absent" и соответствующий
           fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "title_warranty_status": "<defined / not_defined>",
          "title_warranty_details": "<текст или 'Заверение отсутствует в тексте'>",
          "no_pledge_status": "<absent / clean / clean_with_exceptions / encumbered>",
          "no_pledge_details": "<текст или 'Заверение отсутствует в тексте'>",
          "no_arrest_status": "<absent / clean / clean_with_exceptions / encumbered>",
          "no_arrest_details": "<текст или 'Заверение отсутствует в тексте'>",
          "no_third_party_rights_status": "<absent / clean / clean_with_exceptions / encumbered>",
          "no_third_party_rights_details": "<текст или 'Заверение отсутствует в тексте'>",
          "quality_warranty_status": "<defined / not_defined>",
          "quality_warranty_details": "<текст или 'Заверение отсутствует в тексте'>",
          "risk_allocation_code": "<debtor / creditor / not_defined>",
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_details": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "свободно от прав третьих лиц не заложено не арестовано находится в залоге находится под арестом право собственности принадлежит надлежащее качество отсутствие скрытых недостатков риск случайной гибели риск повреждения до момента передачи несёт должник за исключением"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "залог прекращается после передачи"
        - "обеспечение прекращается"
        - "погашение ипотечной записи"
        - "судьба поручительства"
        - "отсутствие банкротства"
        - "признаки неплатёжеспособности"
        - "соразмерность стоимости"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        заверения о титуле должника на предмет отступного, статусе залога,
        ареста и прав третьих лиц (отсутствуют / отсутствуют с исключением /
        присутствуют), гарантии качества предмета и распределение риска
        случайной гибели до передачи.
        Не анализируй стоимость, банкротство, налоги или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. title_warranty_status — "defined" если право собственности или иной
           правовой титул Должника на предмет отступного прямо подтверждён
           (со словом "собственность" или прямым названием иного титула),
           иначе "not_defined". Фраза "правомерность владения" без слова
           "собственность"/"титул" — not_defined.
        2. title_warranty_details — формулировка о праве собственности / титуле.
           Формат: краткая фраза. Fallback — "Заверение отсутствует в тексте".
        3. no_pledge_status — "absent" (залог не упомянут) / "clean" (прямо
           заверено отсутствие залога) / "clean_with_exceptions" (отсутствие
           заверено с оговоркой-исключением) / "encumbered" (прямо указано
           наличие залога). Общая фраза о "соответствии законодательству" без
           слова "залог" — это "absent".
        4. no_pledge_details — соответствующая формулировка. Fallback при
           "absent" — "Заверение отсутствует в тексте".
        5. no_arrest_status — аналогично для ареста: "absent" / "clean" /
           "clean_with_exceptions" / "encumbered". Общая фраза без слова
           "арест" — это "absent".
        6. no_arrest_details — соответствующая формулировка. Fallback при
           "absent" — "Заверение отсутствует в тексте".
        7. no_third_party_rights_status — аналогично для прав третьих лиц:
           "absent" / "clean" / "clean_with_exceptions" / "encumbered". Общая
           фраза без упоминания "прав третьих лиц" — это "absent".
        8. no_third_party_rights_details — соответствующая формулировка.
           Fallback при "absent" — "Заверение отсутствует в тексте".
        9. quality_warranty_status — "defined" если качество предмета или
           отсутствие скрытых недостатков прямо указаны, иначе "not_defined".
        10. quality_warranty_details — формулировка о качестве предмета.
            Fallback — "Заверение отсутствует в тексте".
        11. risk_allocation_status — "defined" если распределение риска случайной
            гибели или повреждения до момента передачи прямо указано с явным
            указанием стороны (Должник/Кредитор), иначе "not_defined". Фраза
            "риски распределяются в соответствии с законодательством" без
            указания конкретной стороны — not_defined.
        12. risk_allocation_code — "debtor" / "creditor" / "not_defined".
        13. risk_allocation_details — формулировка о распределении риска до
            передачи. Fallback — "Не установлено".

        Оценивай залог, арест и права третьих лиц полностью независимо друг
        от друга — упоминание статуса одного не означает такой же статус
        у другого (см. Пример 3, где залог есть, а арест и права третьих
        лиц — чисто).

        Если данные отсутствуют, используй следующий fallback:
        - title_warranty_details / quality_warranty_details →
          "Заверение отсутствует в тексте"
        - no_pledge_details / no_arrest_details / no_third_party_rights_details
          при статусе "absent" → "Заверение отсутствует в тексте"
        - risk_allocation_details → "Не установлено"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "encumbered" для полей залог/арест/третьи
          лица (более рискованная трактовка указывается явно), "not_defined"
          для остальных статусов
        - соответствующее текстовое поле → "Не удалось определить: в тексте
          есть противоречивые формулировки" с указанием обоих фрагментов в evidence

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о "соответствии требованиям законодательства" без
          конкретного упоминания залога, ареста, прав третьих лиц, права
          собственности/титула или конкретной стороны риска — это
          "absent"/"not_defined", а не "clean"/"defined". Правило применяется
          ко всем полям check-а без исключения.
        - no_pledge_status / no_arrest_status / no_third_party_rights_status:
            - "absent" — тема вообще не упомянута в тексте.
            - "clean" — прямо заверено отсутствие обременения без каких-либо
              оговорок.
            - "clean_with_exceptions" — отсутствие обременения заверено, но
              с прямо названным исключением (например, "свободно от прав
              третьих лиц, за исключением договора аренды").
            - "encumbered" — текст прямо указывает на наличие залога, ареста
              или прав третьих лиц.
        - Не путайте статус одного вида обременения со статусом другого —
          оценивайте залог, арест и права третьих лиц независимо.
        - Не выводите наличие или отсутствие обременения из общего заверения
          о "чистоте" сделки или "соответствии законодательству", если
          конкретный вид обременения не упомянут прямо.
        - risk_allocation_code:
            - "debtor" — риск случайной гибели/повреждения до передачи несёт
              Должник.
            - "creditor" — риск несёт Кредитор.
            - "not_defined" — распределение риска прямо не определено или
              определено без указания конкретной стороны.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 13 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для title_warranty_status и quality_warranty_status и
          risk_allocation_status используй только: "defined" или "not_defined".
        - Для no_pledge_status, no_arrest_status, no_third_party_rights_status
          используй только: "absent", "clean", "clean_with_exceptions"
          или "encumbered".
        - Для risk_allocation_code используй только: "debtor", "creditor"
          или "not_defined".
        - Для текстовых полей при отсутствии данных используй только указанные
          в task fallback-формулировки, дословно.
        </output_expectations>
        
      fields:
        - name: "title_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения титула на предмет отступного. Внутреннее enum-поле."
          required: true

        - name: "title_warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Титул на предмет отступного"
          description: >
            Формулировка о праве собственности/титуле на предмет отступного.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "no_pledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["absent", "clean", "clean_with_exceptions", "encumbered"]
          display_in_grid: false
          description: "Статус заверения об отсутствии залога. Внутреннее enum-поле."
          required: true

        - name: "no_pledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Залог"
          description: >
            Формулировка об отсутствии, отсутствии с исключением или наличии
            залога.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "no_arrest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["absent", "clean", "clean_with_exceptions", "encumbered"]
          display_in_grid: false
          description: "Статус заверения об отсутствии ареста. Внутреннее enum-поле."
          required: true

        - name: "no_arrest_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Арест"
          description: >
            Формулировка об отсутствии, отсутствии с исключением или наличии
            ареста.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "no_third_party_rights_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["absent", "clean", "clean_with_exceptions", "encumbered"]
          display_in_grid: false
          description: "Статус заверения об отсутствии прав третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "no_third_party_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Права третьих лиц"
          description: >
            Формулировка об отсутствии, отсутствии с исключением или наличии
            прав третьих лиц.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "quality_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на качество предмета отступного. Внутреннее enum-поле."
          required: true

        - name: "quality_warranty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Качество предмета отступного"
          description: >
            Формулировка о качестве или отсутствии скрытых недостатков.
            Доступно в drawer.
            Fallback: "Заверение отсутствует в тексте".
          required: false

        - name: "risk_allocation_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["debtor", "creditor", "not_defined"]
          display_in_grid: false
          description: "Кто несёт риск случайной гибели до передачи. Внутреннее enum-поле."
          required: true

        - name: "risk_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения риска до передачи. Внутреннее enum-поле."
          required: true

        - name: "risk_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Риск до передачи"
          description: >
            Формулировка о распределении риска случайной гибели/повреждения
            предмета отступного до момента передачи.
            Fallback: "Не установлено".
          required: true
      store_payload: true

  - id: real_estate_otsupnoe_specifics_check
    name: "Специальные условия для недвижимости как отступного"
    description: >
      Фактографическая проверка специальных условий для недвижимости как предмета
      отступного: кадастровый номер, регистрация, ЕГРН, расходы на регистрацию.
    triggers:
      any: ["real_estate_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "государственная регистрация"
        - "ЕГРН"
        - "Росреестр"
        - "кадастровый номер"
        - "расходы на регистрацию"
        - "переход права собственности"
        - "приложение"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)ЕГРН|Росреестр"
        - "(?i)кадастров(ый|ого)\\s+номер"
        - "(?i)приложени[ея]|спецификаци[еяю]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ, где предметом
        отступного является недвижимое имущество.
        Проверяется только один вопрос: специальные условия для недвижимости
        как предмета отступного.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ст. 131, 551 ГК РФ — государственная регистрация прав на недвижимость
        - ФЗ-218 — сведения ЕГРН и регистрационные действия

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте соглашения,
          а чего прямо нет.
        - Не подменяй текст договора нормами закона.
        - Если кадастровый номер не воспроизведён в самом тексте соглашения,
          но объект идентифицируется через прямую отсылку к приложению, акту
          или иному названному документу, где номер указан — это не отсутствие
          регулирования, а определённость через отсылочный документ.
        - Не путай регистрацию перехода права собственности на предмет
          отступного с регистрацией обременений (залога) или с иными
          регистрационными действиями.
        - Общая фраза "переход права оформляется в порядке, предусмотренном
          законодательством РФ" без конкретных действий (кто подаёт документы,
          в какой орган, в какой срок) — это not_defined для порядка регистрации.
          Аналогично, "расходы несут стороны в соответствии с законодательством"
          без конкретного распределения именно расходов на регистрацию —
          not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Кадастровый номер недвижимого имущества, передаваемого как отступное
           (в самом тексте либо через отсылку к приложению).
        2. Есть ли ссылка на выписку из ЕГРН или сведения ЕГРН.
        3. Есть ли описание порядка государственной регистрации перехода права.
        4. Есть ли распределение расходов на государственную регистрацию / госпошлину.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Кадастровый номер считай определённым, если он прямо указан в тексте
           либо текст прямо отсылает к документу (приложению, акту), где номер
           содержится.
        3. Не выводи наличие ЕГРН или регистрации из того, что предмет — недвижимость.
        4. Не путай регистрацию перехода права с регистрацией обременений.
        5. Общая фраза о порядке регистрации "в соответствии с законодательством"
           без конкретных действий — это not_defined.
        6. Общая фраза о расходах "в соответствии с законодательством" без
           конкретного упоминания расходов на регистрацию — это not_defined.
        7. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        8. Не используй "None", "null" или пустые строки.
        9. В evidence включай только цитаты из соглашения.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору квартиру,
        кадастровый номер 77:06:0001001:123. Переход права собственности
        подлежит государственной регистрации в Росреестре. Расходы по регистрации
        стороны несут поровну. Выписка из ЕГРН от 01.03.2024 прилагается."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "egrn_extract_status": "defined",
          "egrn_extract_details": "Выписка из ЕГРН от 01.03.2024 прилагается",
          "registration_procedure_status": "defined",
          "registration_procedure_details": "Переход права собственности подлежит государственной регистрации в Росреестре",
          "registration_costs_status": "defined",
          "registration_costs_details": "Расходы по регистрации стороны несут поровну",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору квартиру, кадастровый номер 77:06:0001001:123. Переход права собственности подлежит государственной регистрации в Росреестре. Расходы по регистрации стороны несут поровну."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "В качестве отступного передается недвижимое имущество."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Не указан",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Не упомянуто",
          "registration_procedure_status": "not_defined",
          "registration_procedure_details": "Не описан",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Не распределены",
          "evidence": []
        }

        Пример 3 — частичная определённость и идентификация через приложение:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору объект недвижимости,
        указанный в Приложении №1 (кадастровый номер 78:12:0002002:456).
        Переход права собственности подлежит государственной регистрации
        в установленном законом порядке."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "78:12:0002002:456 (указан в Приложении №1)",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Не упомянуто",
          "registration_procedure_status": "not_defined",
          "registration_procedure_details": "Не описан",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Не распределены",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "В качестве отступного Должник передает Кредитору объект недвижимости, указанный в Приложении №1 (кадастровый номер 78:12:0002002:456). Переход права собственности подлежит государственной регистрации в установленном законом порядке."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Переход права собственности на объект недвижимости оформляется
        в порядке, предусмотренном действующим законодательством Российской
        Федерации. Расходы, связанные с исполнением настоящего соглашения,
        несут стороны в соответствии с законодательством."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Не указан",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Не упомянуто",
          "registration_procedure_status": "not_defined",
          "registration_procedure_details": "Не описан",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Не распределены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с кадастровым номером либо отсылку к документу,
           где номер указан.
        2. Найди прямую цитату о выписке ЕГРН.
        3. Найди прямую цитату о государственной регистрации перехода права;
           убедись, что это не регистрация обременения, и что описаны
           конкретные действия, а не общая отсылка к закону.
        4. Найди прямую цитату о распределении расходов на регистрацию;
           убедись, что это про расходы именно на регистрацию, а не общая
           фраза о расходах по соглашению в целом.
        5. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        6. Не додумывай реквизиты.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<текст или 'Не указан' / 'Не удалось определить'>",
          "egrn_extract_status": "<defined / not_defined>",
          "egrn_extract_details": "<текст или 'Не упомянуто' / 'Не удалось определить'>",
          "registration_procedure_status": "<defined / not_defined>",
          "registration_procedure_details": "<текст или 'Не описан' / 'Не удалось определить'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Не распределены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация ЕГРН Росреестр кадастровый номер расходы на регистрацию переход права собственности на недвижимость приложение спецификация"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "залог прекращается"
        - "судьба поручительства"
        - "банкротство"
        - "НДС"
        - "первоначальное обязательство"
        - "стоимость отступного"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки специальные условия для недвижимости
        как предмета отступного: кадастровый номер, сведения ЕГРН, порядок
        государственной регистрации и распределение расходов на регистрацию.
        Не анализируй уступку требований, качество имущества, стоимость или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. cadastral_number_status — "defined" если кадастровый номер прямо
           указан в тексте соглашения либо текст прямо отсылает к документу
           (приложению, акту), где номер содержится, иначе "not_defined".
        2. cadastral_number_value — кадастровый номер недвижимого имущества.
           Если номер указан в приложении, а текст соглашения на это прямо
           ссылается, укажи номер и отметь источник, например:
           "78:12:0002002:456 (указан в Приложении №1)". Fallback — "Не указан".
        3. egrn_extract_status — "defined" если выписка из ЕГРН или сведения ЕГРН
           прямо упомянуты, иначе "not_defined".
        4. egrn_extract_details — формулировка об ЕГРН или выписке из ЕГРН.
           Fallback — "Не упомянуто".
        5. registration_procedure_status — "defined" если порядок государственной
           регистрации перехода права прямо описан конкретными действиями
           (кто подаёт документы, в какой орган, в какой срок), иначе
           "not_defined". Общая фраза "в порядке, предусмотренном
           законодательством" без конкретных действий — это not_defined.
        6. registration_procedure_details — формулировка о государственной
           регистрации перехода права (не регистрации обременений). Формат:
           краткая фраза. Fallback — "Не описан".
        7. registration_costs_status — "defined" если распределение расходов на
           государственную регистрацию или государственную пошлину прямо указано
           конкретно применительно к регистрации, иначе "not_defined". Общая
           фраза о расходах "по соглашению в целом" без упоминания регистрации —
           это not_defined.
        8. registration_costs_details — формулировка о расходах на регистрацию.
           Формат: краткая фраза. Fallback — "Не распределены".

        Если данные отсутствуют, используй следующий fallback:
        - cadastral_number_value → "Не указан"
        - egrn_extract_details → "Не упомянуто"
        - registration_procedure_details → "Не описан"
        - registration_costs_details → "Не распределены"
        - соответствующий статус → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "в порядке, предусмотренном законодательством" без
          конкретных действий по регистрации, или "расходы в соответствии с
          законодательством" без конкретного упоминания регистрации — это
          not_defined. Правило применяется ко всем полям check-а без исключения.
        - Не выводи наличие ЕГРН или необходимости регистрации из одного факта,
          что предмет — недвижимость.
        - Кадастровый номер, указанный только в приложении или ином документе,
          на который текст соглашения прямо ссылается, считается определённым —
          это не отсутствие регулирования.
        - registration_procedure_status = "defined" только если прямо описан
          порядок действий по регистрации перехода права собственности
          (кто подаёт документы, в какой орган, в какой срок), а не порядок
          регистрации залога или иного обременения, и не общая отсылка к закону.
        - Не путай регистрацию перехода права собственности на предмет
          отступного с регистрацией обременений (залога) или с иными
          регистрационными действиями, упомянутыми в тексте.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны разные кадастровые номера, разные
          формулировки порядка регистрации или расходов и конфликт нельзя
          разрешить по тексту, верни "not_defined" для статуса и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только указанные
          в task fallback-формулировки, дословно.
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания кадастрового номера. Внутреннее enum-поле."
          required: true

        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кадастровый номер"
          description: >
            Кадастровый номер недвижимого имущества, включая случаи, когда
            номер указан через отсылку к приложению.
            Fallback: "Не указан" / "Не удалось определить".
          required: true

        - name: "egrn_extract_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания ЕГРН. Внутреннее enum-поле."
          required: true

        - name: "egrn_extract_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "ЕГРН / выписка"
          description: >
            Формулировка о ЕГРН или выписке из ЕГРН. Доступно в drawer.
            Fallback: "Не упомянуто" / "Не удалось определить".
          required: false

        - name: "registration_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания регистрационной процедуры. Внутреннее enum-поле."
          required: true

        - name: "registration_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Порядок регистрации"
          description: >
            Формулировка о государственной регистрации перехода права.
            Fallback: "Не описан" / "Не удалось определить".
          required: true

        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения расходов на регистрацию. Внутреннее enum-поле."
          required: true

        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Расходы на регистрацию"
          description: >
            Формулировка о распределении расходов на регистрацию.
            Fallback: "Не распределены" / "Не удалось определить".
          required: true
      store_payload: true

  - id: claim_as_otsupnoe_specifics_check
    name: "Специальные условия для права требования как отступного"
    description: >
      Фактографическая проверка специальных условий, если предметом отступного
      является право требования: основание требования, должник, документы,
      уведомление должника.
    triggers:
      any: ["claim_assignment_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право требования"
        - "уступка"
        - "должник по требованию"
        - "передача документов"
        - "уведомление должника"
        - "основание требования"
        - "реестр требований"
        - "приложение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+требован"
        - "(?i)уступк(а|и)"
        - "(?i)передач(а|и)\\s+документ"
        - "(?i)уведомлени[ея]\\s+должник"
        - "(?i)реестр\\s+требован|приложени[ея]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ, где предметом
        отступного является право требования.
        Проверяется только один вопрос: специальные условия для права требования
        как предмета отступного.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ст. 382–390 ГК РФ — уступка права требования
        - ст. 385 ГК РФ — документы и уведомление должника

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте соглашения,
          а чего прямо нет.
        - Не подменяй текст договора нормами закона.
        - КРИТИЧЕСКИ ВАЖНО: в тексте фигурируют два разных лица, оба могут
          называться "должник": (1) Должник — сторона самого соглашения
          об отступном, которая передаёт право требования в качестве
          отступного; (2) должник по уступаемому требованию — третье лицо,
          обязанное перед Должником по первоначальному обязательству (договору,
          из которого возникло уступаемое требование). Поля этого check-а
          относятся ТОЛЬКО ко второму лицу. Не путай их.
        - Если основание требования или должник по требованию определяются
          через отсылку к приложению или реестру уступаемых требований —
          это не отсутствие регулирования.
        - Общая фраза вроде "право требования, передаваемое в соответствии
          с настоящим соглашением" (без реквизитов договора-основания),
          "документы передаются в порядке, установленном законодательством"
          (без конкретного действия), или "должник уведомляется в соответствии
          со ст. 385 ГК РФ" (без указания, кто, когда и как именно уведомляет)
          НЕ является основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Основание права требования, передаваемого как отступное (в самом
           тексте либо через отсылку к приложению/реестру).
        2. Идентификацию должника по передаваемому требованию (третье лицо,
           не сторона соглашения об отступном).
        3. Есть ли условие о передаче документов, подтверждающих требование.
        4. Есть ли условие об уведомлении должника по требованию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай Должника по соглашению об отступном с должником по
           уступаемому требованию — это разные лица.
        3. Не выводи наличие уведомления или передачи документов по умолчанию из закона.
        4. Если условие определяется через отсылку к приложению или реестру —
           отрази это как понятную формулировку, а не как отсутствие данных.
        5. Общая фраза без реквизитов договора-основания, без конкретного
           действия по передаче документов, или без указания конкретного
           действия по уведомлению (только отсылка к статье ГК РФ) — это
           not_defined, а не defined.
        6. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        7. Не используй "None", "null" или пустые строки.
        8. В evidence включай только цитаты из соглашения.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены, оба лица разграничены:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору право требования
        к ООО «Гамма» (должник по уступаемому требованию), возникшее из
        Договора поставки № 15 от 10.01.2024, заключённого между Должником
        и ООО «Гамма». Должник передает Кредитору оригиналы документов,
        подтверждающих требование, и обязуется уведомить ООО «Гамма» о
        передаче права требования в течение 5 рабочих дней."

        Ответ:
        {
          "claim_basis_status": "defined",
          "claim_basis_details": "Договор поставки № 15 от 10.01.2024",
          "claim_debtor_identified_status": "defined",
          "claim_debtor_identified_details": "ООО «Гамма»",
          "documents_transfer_status": "defined",
          "documents_transfer_details": "Должник передаёт Кредитору оригиналы документов, подтверждающих требование",
          "debtor_notification_status": "defined",
          "debtor_notification_details": "Должник обязуется уведомить ООО «Гамма» о передаче права требования в течение 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору право требования к ООО «Гамма» (должник по уступаемому требованию), возникшее из Договора поставки № 15 от 10.01.2024, заключённого между Должником и ООО «Гамма»."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "В качестве отступного передается право требования."

        Ответ:
        {
          "claim_basis_status": "not_defined",
          "claim_basis_details": "Не указано",
          "claim_debtor_identified_status": "not_defined",
          "claim_debtor_identified_details": "Не идентифицирован",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Не предусмотрена",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Не предусмотрено",
          "evidence": []
        }

        Пример 3 — частичная определённость, идентификация через приложение:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору право требования,
        указанное в Приложении №1 (реестр уступаемых требований), включая
        наименование должника и основание возникновения требования."

        Ответ:
        {
          "claim_basis_status": "defined",
          "claim_basis_details": "Согласно Приложению №1 (реестр уступаемых требований)",
          "claim_debtor_identified_status": "defined",
          "claim_debtor_identified_details": "Согласно Приложению №1 (реестр уступаемых требований)",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Не предусмотрена",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "В качестве отступного Должник передает Кредитору право требования, указанное в Приложении №1 (реестр уступаемых требований), включая наименование должника и основание возникновения требования."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Право требования передаётся в соответствии с настоящим соглашением.
        Документы, подтверждающие требование, передаются в порядке,
        установленном действующим законодательством Российской Федерации.
        Должник по требованию уведомляется в соответствии со ст. 385 ГК РФ."

        Ответ:
        {
          "claim_basis_status": "not_defined",
          "claim_basis_details": "Не указано",
          "claim_debtor_identified_status": "not_defined",
          "claim_debtor_identified_details": "Не идентифицирован",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Не предусмотрена",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Не предусмотрено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основании права требования; убедись, что она
           относится к уступаемому требованию, а не к первоначальному
           обязательству по соглашению об отступном, и содержит конкретные
           реквизиты, а не общую отсылку.
        2. Найди прямую цитату о должнике по требованию; убедись, что это не
           Должник по соглашению об отступном.
        3. Найди прямую цитату о передаче подтверждающих документов; убедись,
           что описано конкретное действие, а не общая отсылка к закону.
        4. Найди прямую цитату об уведомлении должника по требованию; убедись,
           что описано конкретное действие (кто/когда/как), а не просто ссылка
           на статью ГК РФ.
        5. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        6. Не додумывай условия уступки.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "claim_basis_status": "<defined / not_defined>",
          "claim_basis_details": "<текст или 'Не указано' / 'Не удалось определить'>",
          "claim_debtor_identified_status": "<defined / not_defined>",
          "claim_debtor_identified_details": "<текст или 'Не идентифицирован' / 'Не удалось определить'>",
          "documents_transfer_status": "<defined / not_defined>",
          "documents_transfer_details": "<текст или 'Не предусмотрена' / 'Не удалось определить'>",
          "debtor_notification_status": "<defined / not_defined>",
          "debtor_notification_details": "<текст или 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право требования уступка должник по требованию передача документов уведомление должника основание требования акт передачи прав документы подтверждающие реестр требований приложение"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство по договору поставки"
        - "залог прекращается"
        - "ЕГРН"
        - "кадастровый номер"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки специальные условия для права требования
        как предмета отступного: основание уступаемого требования, идентификация
        должника по требованию, передача подтверждающих документов и условие
        об уведомлении должника.
        КРИТИЧЕСКИ ВАЖНО: различай Должника по соглашению об отступном (сторону
        соглашения) и должника по уступаемому требованию (третье лицо, обязанное
        перед Должником по первоначальному договору, из которого возникло
        уступаемое требование). Все поля этого check-а относятся ТОЛЬКО ко
        второму лицу.
        Не анализируй недвижимость, качество имущества, стоимость отступного или споры.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. claim_basis_status — "defined" если основание права требования,
           передаваемого как отступное, прямо указано с конкретными реквизитами
           (в тексте либо через отсылку к приложению/реестру), иначе "not_defined".
           Фраза "в соответствии с настоящим соглашением" без реквизитов
           договора-основания — not_defined.
        2. claim_basis_details — основание права требования (договор, судебный
           акт и т.п.). Формат: краткая фраза с реквизитами. Fallback —
           "Не указано".
        3. claim_debtor_identified_status — "defined" если должник по
           уступаемому требованию прямо идентифицирован (в тексте либо через
           отсылку к приложению/реестру), иначе "not_defined".
        4. claim_debtor_identified_details — наименование / ФИО должника по
           требованию (не Должника по соглашению об отступном). Формат:
           краткая фраза. Fallback — "Не идентифицирован".
        5. documents_transfer_status — "defined" если передача подтверждающих
           документов прямо предусмотрена конкретным действием, иначе
           "not_defined". Фраза "документы передаются в порядке, установленном
           законодательством" без конкретики — not_defined.
        6. documents_transfer_details — формулировка о передаче документов.
           Fallback — "Не предусмотрена".
        7. debtor_notification_status — "defined" если условие об уведомлении
           должника по требованию прямо предусмотрено конкретным действием
           (кто, когда, как уведомляет), иначе "not_defined". Фраза "должник
           уведомляется в соответствии со ст. 385 ГК РФ" без указания
           конкретного порядка уведомления — not_defined.
        8. debtor_notification_details — формулировка об уведомлении должника
           по требованию. Fallback — "Не предусмотрено".

        Если данные отсутствуют, используй следующий fallback:
        - claim_basis_details → "Не указано"
        - claim_debtor_identified_details → "Не идентифицирован"
        - documents_transfer_details → "Не предусмотрена"
        - debtor_notification_details → "Не предусмотрено"
        - соответствующий статус → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без реквизитов договора-основания, без конкретного
          действия по передаче документов, или содержащая только ссылку на
          статью ГК РФ без описания конкретного порядка уведомления — это
          not_defined. Правило применяется ко всем полям check-а без исключения.
        - Различай Должника по соглашению об отступном и должника по
          уступаемому требованию — это разные лица. Поля claim_debtor_identified_*
          и debtor_notification_* относятся только к должнику по требованию.
        - claim_basis_status = "defined" только если основание требования прямо
          названо в тексте с реквизитами или через отсылку к приложению/реестру
          (договор с номером и датой, судебный акт и т.п.).
        - claim_debtor_identified_status = "defined" только если должник по
          уступаемому требованию прямо идентифицирован (наименование, ИНН
          и т.п.) в тексте или через отсылку к приложению/реестру.
        - documents_transfer_status = "defined" только если передача документов,
          подтверждающих требование, прямо предусмотрена конкретным действием
          в тексте; не выводи из общего смысла или нормы ст. 385 ГК РФ.
        - debtor_notification_status = "defined" только если уведомление
          должника по требованию прямо предусмотрено конкретным порядком
          (кто уведомляет, в какой срок, каким способом); одна лишь ссылка на
          статью закона без описания порядка — not_defined.
        - Если в разных фрагментах указаны противоречивые сведения об основании,
          должнике по требованию, передаче документов или уведомлении и
          конфликт нельзя разрешить по тексту, верни "not_defined" для статуса
          и "Не удалось определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только указанные
          в task fallback-формулировки, дословно.
        - При неразрешимом противоречии используй только: "Не удалось определить".
        </output_expectations>

      fields:
        - name: "claim_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания основания права требования. Внутреннее enum-поле."
          required: true

        - name: "claim_basis_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Основание права требования"
          description: >
            Основание права требования, передаваемого в качестве отступного.
            Fallback: "Не указано" / "Не удалось определить".
          required: true

        - name: "claim_debtor_identified_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации должника по требованию. Внутреннее enum-поле."
          required: true

        - name: "claim_debtor_identified_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Должник по требованию"
          description: >
            Идентификация должника по уступаемому требованию (не Должника
            по соглашению об отступном).
            Fallback: "Не идентифицирован" / "Не удалось определить".
          required: true

        - name: "documents_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о передаче документов по требованию. Внутреннее enum-поле."
          required: true

        - name: "documents_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Передача документов по требованию"
          description: >
            Формулировка о передаче документов, подтверждающих требование.
            Fallback: "Не предусмотрена" / "Не удалось определить".
          required: true

        - name: "debtor_notification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об уведомлении должника по требованию. Внутреннее enum-поле."
          required: true

        - name: "debtor_notification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Уведомление должника по требованию"
          description: >
            Формулировка об уведомлении должника по требованию.
            Fallback: "Не предусмотрено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Фактографическая проверка того, урегулирована ли судьба обеспечений:
      залог, ипотека, поручительство, снятие залога, погашение ипотечной записи,
      возврат закладной, уведомление поручителей.
    triggers:
      any: ["secured_original_obligation"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
        - "залог прекращается"
        - "возврат закладной"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ|снят(ие|ь)\\s+залог"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: как в тексте урегулирована судьба обеспечений
        после прекращения основного обязательства.

        Нормативный ориентир:
        - ст. 329 ГК РФ
        - ст. 352 ГК РФ
        - ст. 367 ГК РФ
        - ФЗ-102, ФЗ-218

        Важно:
        - Не анализируй заверения об отсутствии залога/ареста/прав третьих лиц
          на сам предмет отступного (передаваемое имущество) — это отдельный
          вопрос. Здесь речь идёт об обеспечении, которое было установлено
          в пользу Кредитора по первоначальному (прекращаемому) обязательству.
        - Различай автоматическое прекращение обеспечения (наступает в силу
          самого факта прекращения основного обязательства) и прекращение,
          требующее отдельных действий сторон (например, подписания
          дополнительного соглашения или заявления в регистрирующий орган).
        - Общая фраза вроде "обеспечение прекращается в порядке, установленном
          законодательством" (без указания, автоматически это происходит или
          требует действий), "вопросы обеспечения решаются в соответствии
          с законом" (без конкретного условия), или "поручитель уведомляется
          в порядке, предусмотренном законодательством" (без конкретного
          срока/способа уведомления) НЕ является основанием для "defined" —
          это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли наличие обеспеченного обязательства.
        2. Какой вид обеспечения указан.
        3. Есть ли условие о прекращении обеспечения, и происходит ли оно
           автоматически или требует отдельных действий сторон.
        4. Есть ли порядок погашения ипотечной записи.
        5. Есть ли условие о возврате закладной / документов по залогу.
        6. Есть ли указание на уведомление поручителей.
        7. Есть ли распределение расходов на действия по снятию обеспечения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не выводи судьбу обеспечения из закона, если этого нет в тексте.
        3. Не путай обеспечение первоначального обязательства с обременениями
           на сам предмет отступного.
        4. Общая фраза о "порядке, установленном законодательством" без
           конкретного условия (кто, что, когда делает) — это not_defined
           для соответствующего поля.
        5. Если данных нет — возвращай "not_defined" и соответствующий
           текстовый fallback.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

