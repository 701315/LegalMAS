    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки специальные условия для недвижимости
        как предмета отступного: кадастровый номер, сведения ЕГРН, порядок
        государственной регистрации и распределение расходов на регистрацию.
        Не анализируй уступку требований, качество имущества, стоимость или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. cadastral_number_status — "defined" если кадастровый номер прямо указан
           в тексте соглашения, иначе "not_defined".
        2. cadastral_number_value — кадастровый номер недвижимого имущества.
        3. egrn_extract_status — "defined" если выписка из ЕГРН или сведения ЕГРН
           прямо упомянуты, иначе "not_defined".
        4. egrn_extract_details — формулировка об ЕГРН или выписке из ЕГРН.
        5. registration_procedure_status — "defined" если порядок государственной
           регистрации перехода права прямо описан, иначе "not_defined".
        6. registration_procedure_details — формулировка о государственной регистрации.
        7. registration_costs_status — "defined" если распределение расходов на
           государственную регистрацию или государственную пошлину прямо указано,
           иначе "not_defined".
        8. registration_costs_details — формулировка о расходах на регистрацию.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - cadastral_number_status = "defined" только если кадастровый номер прямо
          воспроизведён в тексте соглашения; не считай достаточным упоминание
          объекта без номера.
        - egrn_extract_status = "defined" только если ЕГРН или выписка из ЕГРН
          прямо упомянуты; не выводи наличие ЕГРН из факта, что предмет —
          недвижимость.
        - registration_procedure_status = "defined" только если прямо описан порядок
          действий по регистрации (кто подаёт, в какой орган, в какой срок).
        - Верни только JSON.
        </rules>
      fields:
        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания кадастрового номера."
          required: true
        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер"
          description: "Кадастровый номер недвижимого имущества."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "egrn_extract_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания ЕГРН."
          required: false
        - name: "egrn_extract_details"
          type: "string"
          presentation: "fact"
          label: "ЕГРН / выписка"
          description: "Формулировка о ЕГРН или выписке из ЕГРН."
          required: false
          display_in_grid: false
        - name: "registration_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания регистрационной процедуры."
          required: false
        - name: "registration_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок регистрации"
          description: "Формулировка о государственной регистрации перехода права."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "registration_costs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на регистрацию."
          required: false
        - name: "registration_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на регистрацию"
          description: "Формулировка о распределении расходов на регистрацию."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Специальные условия
  # ──────────────────────────────────────────────────────────────────────────
  - id: claim_as_otsupnoe_specifics_check
    name: "Специальные условия для права требования как отступного"
    description: >
      Фактографическая проверка специальных условий, если предметом отступного
      является право требования: основание требования, должник, документы,
      уведомление должника.
    triggers:
      any: ["claim_assignment_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право требования"
        - "уступка"
        - "должник по требованию"
        - "передача документов"
        - "уведомление должника"
        - "основание требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+требован"
        - "(?i)уступк(а|и)"
        - "(?i)передач(а|и)\\s+документ"
        - "(?i)уведомлени[ея]\\s+должник"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ, где предметом
        отступного является право требования.
        Проверяется только один вопрос: специальные условия для права требования
        как предмета отступного.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ст. 382–390 ГК РФ — уступка права требования
        - ст. 385 ГК РФ — документы и уведомление должника

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте соглашения,
          а чего прямо нет.
        - Не подменяй текст договора нормами закона.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Основание права требования, передаваемого как отступное.
        2. Идентификацию должника по передаваемому требованию.
        3. Есть ли условие о передаче документов, подтверждающих требование.
        4. Есть ли условие об уведомлении должника по требованию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не выводи наличие уведомления или передачи документов по умолчанию из закона.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из соглашения.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору право требования
        к ООО «Гамма», возникшее из Договора поставки № 15 от 10.01.2024.
        Должник передает Кредитору оригиналы документов, подтверждающих требование,
        и обязуется уведомить ООО «Гамма» о передаче права требования в течение
        5 рабочих дней."

        Ответ:
        {
          "claim_basis_status": "defined",
          "claim_basis_details": "Договор поставки № 15 от 10.01.2024",
          "claim_debtor_identified_status": "defined",
          "claim_debtor_identified_details": "ООО «Гамма»",
          "documents_transfer_status": "defined",
          "documents_transfer_details": "передает Кредитору оригиналы документов, подтверждающих требование",
          "debtor_notification_status": "defined",
          "debtor_notification_details": "обязуется уведомить ООО «Гамма» о передаче права требования в течение 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору право требования к ООО «Гамма», возникшее из Договора поставки № 15 от 10.01.2024."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "В качестве отступного передается право требования."

        Ответ:
        {
          "claim_basis_status": "not_defined",
          "claim_basis_details": "Данные не определены",
          "claim_debtor_identified_status": "not_defined",
          "claim_debtor_identified_details": "Данные не определены",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "debtor_notification_status": "not_defined",
          "debtor_notification_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основании права требования.
        2. Найди прямую цитату о должнике по требованию.
        3. Найди прямую цитату о передаче подтверждающих документов.
        4. Найди прямую цитату об уведомлении должника.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия уступки.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "claim_basis_status": "<defined / not_defined>",
          "claim_basis_details": "<текст или 'Данные не определены'>",
          "claim_debtor_identified_status": "<defined / not_defined>",
          "claim_debtor_identified_details": "<текст или 'Данные не определены'>",
          "documents_transfer_status": "<defined / not_defined>",
          "documents_transfer_details": "<текст или 'Данные не определены'>",
          "debtor_notification_status": "<defined / not_defined>",
          "debtor_notification_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право требования уступка должник по требованию передача документов уведомление должника основание требования акт передачи прав документы подтверждающие"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство по договору поставки"
        - "залог прекращается"
        - "ЕГРН"
        - "кадастровый номер"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки специальные условия для права требования
        как предмета отступного: основание уступаемого требования, идентификация
        должника по требованию, передача подтверждающих документов и условие
        об уведомлении должника.
        Не анализируй недвижимость, качество имущества, стоимость отступного или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. claim_basis_status — "defined" если основание права требования, передаваемого
           как отступное, прямо указано, иначе "not_defined".
        2. claim_basis_details — основание права требования (договор, судебный акт и т.п.).
        3. claim_debtor_identified_status — "defined" если должник по уступаемому
           требованию прямо идентифицирован в тексте, иначе "not_defined".
        4. claim_debtor_identified_details — наименование / ФИО должника по требованию.
        5. documents_transfer_status — "defined" если передача подтверждающих документов
           прямо предусмотрена, иначе "not_defined".
        6. documents_transfer_details — формулировка о передаче документов.
        7. debtor_notification_status — "defined" если условие об уведомлении должника
           по требованию прямо предусмотрено, иначе "not_defined".
        8. debtor_notification_details — формулировка об уведомлении должника.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - claim_basis_status = "defined" только если основание требования прямо
          названо в тексте (договор с реквизитами, судебный акт и т.п.).
        - claim_debtor_identified_status = "defined" только если должник по
          уступаемому требованию прямо идентифицирован (наименование, ИНН и т.п.);
          не путай с Должником по соглашению об отступном.
        - documents_transfer_status = "defined" только если передача документов,
          подтверждающих требование, прямо предусмотрена в тексте; не выводи
          из общего смысла или нормы ст. 385 ГК РФ.
        - debtor_notification_status = "defined" только если уведомление должника
          прямо предусмотрено; не выводи из нормы закона.
        - Верни только JSON.
        </rules>
      fields:
        - name: "claim_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания основания права требования."
          required: true
        - name: "claim_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание права требования"
          description: "Основание права требования, передаваемого в качестве отступного."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "claim_debtor_identified_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации должника по требованию."
          required: false
        - name: "claim_debtor_identified_details"
          type: "string"
          presentation: "fact"
          label: "Должник по требованию"
          description: "Идентификация должника по уступаемому требованию."
          required: false
          display_in_grid: false
        - name: "documents_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о передаче документов по требованию."
          required: false
        - name: "documents_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Передача документов по требованию"
          description: "Формулировка о передаче документов, подтверждающих требование."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "debtor_notification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об уведомлении должника по требованию."
          required: false
        - name: "debtor_notification_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление должника по требованию"
          description: "Формулировка об уведомлении должника по требованию."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: СУДЬБА ОБЕСПЕЧЕНИЙ
  # ──────────────────────────────────────────────────────────────────────────
  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Фактографическая проверка того, урегулирована ли судьба обеспечений:
      залог, ипотека, поручительство, снятие залога, погашение ипотечной записи,
      возврат закладной, уведомление поручителей.
    triggers:
      any: ["secured_original_obligation"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
        - "залог прекращается"
        - "возврат закладной"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ|снят(ие|ь)\\s+залог"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: как в тексте урегулирована судьба обеспечений
        после прекращения основного обязательства.

        Нормативный ориентир:
        - ст. 329 ГК РФ
        - ст. 352 ГК РФ
        - ст. 367 ГК РФ
        - ФЗ-102, ФЗ-218

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли наличие обеспеченного обязательства.
        2. Какой вид обеспечения указан.
        3. Есть ли условие о прекращении обеспечения.
        4. Есть ли порядок погашения ипотечной записи.
        5. Есть ли условие о возврате закладной / документов по залогу.
        6. Есть ли указание на уведомление поручителей.
        7. Есть ли распределение расходов на действия по снятию обеспечения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не выводи судьбу обеспечения из закона, если этого нет в тексте.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "С прекращением основного обязательства прекращается залог автомобиля.
        Кредитор обязуется в течение 3 рабочих дней передать Должнику оригинал
        договора залога и подписать документы, необходимые для снятия обременения."

        Ответ:
        {
          "secured_obligation_identified_status": "defined",
          "secured_obligation_identified_details": "обязательство обеспечено залогом автомобиля",
          "security_type": "pledge",
          "security_termination_status": "defined",
