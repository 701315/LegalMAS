  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: БАНКРОТНЫЙ РИСК / СОРАЗМЕРНОСТЬ
  # ──────────────────────────────────────────────────────────────────────────
  - id: bankruptcy_and_fair_value_risk_check
    name: "Банкротный контекст, соразмерность стоимости и аффилированность"
    description: >
      Фактографическая проверка наличия в тексте заверений об отсутствии банкротства
      и признаков неплатёжеспособности, указания на рыночную / согласованную стоимость,
      аффилированность сторон, отсутствие предпочтения.
    triggers:
      any: ["bankruptcy_risk_context", "tax_sensitive_structure"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "платежеспособность"
        - "не является сделкой с предпочтением"
        - "рыночная стоимость"
        - "соразмерность"
        - "аффилированность"
        - "кредиторы"
        - "подозрительная сделка"
        - "не находится в процедуре банкротства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)сделк(а|и)\\s+с\\s+предпочтени"
        - "(?i)аффилированн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие factual-данные в тексте касаются
        банкротного контекста, соразмерности стоимости и аффилированности.

        Нормативный ориентир:
        - ст. 61.2 ФЗ-127
        - ст. 61.3 ФЗ-127

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение отсутствия процедуры банкротства.
        2. Есть ли подтверждение отсутствия признаков неплатёжеспособности.
        3. Есть ли ссылка на рыночную / соразмерную стоимость предмета отступного.
        4. Какой метод оценки указан.
        5. Есть ли указание на аффилированность сторон.
        6. Есть ли формулировка, что сделка не является предпочтительной.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не оценивай реальный уровень риска — только фиксируй, что есть в тексте.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Не додумывай финансовое состояние должника.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Должник подтверждает, что на дату подписания настоящего соглашения
        не находится в процедуре банкротства и не обладает признаками
        неплатежеспособности. Стоимость передаваемого имущества определена
        на основании отчета независимого оценщика."

        Ответ:
        {
          "bankruptcy_status_status": "defined",
          "bankruptcy_status_details": "не находится в процедуре банкротства",
          "insolvency_signs_status": "defined",
          "insolvency_signs_details": "не обладает признаками неплатежеспособности",
          "fair_value_support_status": "defined",
          "fair_value_support_details": "стоимость определена на основании отчета независимого оценщика",
          "valuation_method": "appraiser",
          "affiliate_risk_status": "not_defined",
          "affiliate_risk_details": "Данные не определены",
          "preference_risk_addressed_status": "not_defined",
          "preference_risk_addressed_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Должник подтверждает, что на дату подписания настоящего соглашения не находится в процедуре банкротства и не обладает признаками неплатежеспособности."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны определили стоимость имущества по взаимному согласию."

        Ответ:
        {
          "bankruptcy_status_status": "not_defined",
          "bankruptcy_status_details": "Данные не определены",
          "insolvency_signs_status": "not_defined",
          "insolvency_signs_details": "Данные не определены",
          "fair_value_support_status": "defined",
          "fair_value_support_details": "стоимость имущества определена по взаимному согласию",
          "valuation_method": "contractual",
          "affiliate_risk_status": "not_defined",
          "affiliate_risk_details": "Данные не определены",
          "preference_risk_addressed_status": "not_defined",
          "preference_risk_addressed_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Стороны определили стоимость имущества по взаимному согласию."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты о банкротстве и неплатёжеспособности.
        2. Найди прямую цитату о стоимости и методе оценки.
        3. Найди прямую цитату об аффилированности.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "bankruptcy_status_status": "<defined / not_defined>",
          "bankruptcy_status_details": "<текст или 'Данные не определены'>",
          "insolvency_signs_status": "<defined / not_defined>",
          "insolvency_signs_details": "<текст или 'Данные не определены'>",
          "fair_value_support_status": "<defined / not_defined>",
          "fair_value_support_details": "<текст или 'Данные не определены'>",
          "valuation_method": "<appraiser / market_reference / contractual / not_defined>",
          "affiliate_risk_status": "<defined / not_defined>",
          "affiliate_risk_details": "<текст или 'Данные не определены'>",
          "preference_risk_addressed_status": "<defined / not_defined>",
          "preference_risk_addressed_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "банкротство"
