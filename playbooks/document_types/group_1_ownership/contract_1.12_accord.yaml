type: contract_1.12_accord
name: "Соглашение об отступном"

description: |
  Соглашение, по которому существующее обязательство прекращается полностью или частично
  путём предоставления кредитору иного исполнения взамен первоначального:
  денежных средств, имущества, имущественного права, ценных бумаг или иного актива.
  Регулируется ст. 409 ГК РФ. Ключевая особенность — обязательство прекращается
  не само по себе в момент подписания соглашения, а по факту предоставления отступного,
  если иное не вытекает из существа согласованной конструкции и требований к переходу прав.
  Отступное необходимо чётко отличать от новации, прощения долга, зачёта и купли-продажи.
  Особое значение имеют идентификация первоначального обязательства, описание предмета отступного,
  объём прекращения долга, момент прекращения обязательства, налоговые и банкротные риски.

version: 5.0
parent: class_2_modification_of_obligations

