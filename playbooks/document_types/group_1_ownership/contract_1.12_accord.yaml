  - id: secured_obligation_fate_check
    name: "Судьба обеспечений при прекращении основного обязательства"
    description: >
      Фактографическая проверка того, урегулирована ли судьба обеспечений:
      залог, ипотека, поручительство, снятие залога, погашение ипотечной записи,
      возврат закладной, уведомление поручителей.
    triggers:
      any: ["secured_original_obligation"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "обеспечение прекращается"
        - "снятие залога"
        - "погашение записи об ипотеке"
        - "закладная"
        - "залогодержатель"
        - "поручитель"
        - "освобождение от обеспечения"
        - "залог прекращается"
        - "возврат закладной"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог.*прекращ|снят(ие|ь)\\s+залог"
        - "(?i)ипотек.*прекращ|погашени(е|я)\\s+записи"
        - "(?i)поручительств.*прекращ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: как в тексте урегулирована судьба обеспечений
        после прекращения основного обязательства.

        Нормативный ориентир:
        - ст. 329 ГК РФ
        - ст. 352 ГК РФ
        - ст. 367 ГК РФ
        - ФЗ-102, ФЗ-218

        Важно:
        - Не анализируй заверения об отсутствии залога/ареста/прав третьих лиц
          на сам предмет отступного (передаваемое имущество) — это отдельный
          вопрос. Здесь речь идёт об обеспечении, которое было установлено
          в пользу Кредитора по первоначальному (прекращаемому) обязательству.
        - Различай автоматическое прекращение обеспечения (наступает в силу
          самого факта прекращения основного обязательства) и прекращение,
          требующее отдельных действий сторон (например, подписания
          дополнительного соглашения или заявления в регистрирующий орган).
        - Общая фраза вроде "обеспечение прекращается в порядке, установленном
          законодательством" (без указания, автоматически это происходит или
          требует действий), "вопросы обеспечения решаются в соответствии
          с законом" (без конкретного условия), или "поручитель уведомляется
          в порядке, предусмотренном законодательством" (без конкретного
          срока/способа уведомления) НЕ является основанием для "defined" —
          это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли наличие обеспеченного обязательства.
        2. Какой вид обеспечения указан.
        3. Есть ли условие о прекращении обеспечения, и происходит ли оно
           автоматически или требует отдельных действий сторон.
        4. Есть ли порядок погашения ипотечной записи.
        5. Есть ли условие о возврате закладной / документов по залогу.
        6. Есть ли указание на уведомление поручителей.
        7. Есть ли распределение расходов на действия по снятию обеспечения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не выводи судьбу обеспечения из закона, если этого нет в тексте.
        3. Не путай обеспечение первоначального обязательства с обременениями
           на сам предмет отступного.
        4. Общая фраза о "порядке, установленном законодательством" без
           конкретного условия (кто, что, когда делает) — это not_defined
           для соответствующего поля.
        5. Если данных нет — возвращай "not_defined" и соответствующий
           текстовый fallback.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — автоматическое прекращение, конкретные действия:
        Фрагмент:
        "С прекращением основного обязательства прекращается залог автомобиля.
        Кредитор обязуется в течение 3 рабочих дней передать Должнику оригинал
        договора залога и подписать документы, необходимые для снятия обременения."

        Ответ:
        {
          "secured_obligation_identified_status": "defined",
          "secured_obligation_identified_details": "Обязательство обеспечено залогом автомобиля",
          "security_type": "pledge",
          "security_termination_status": "defined",
          "security_termination_details": "Залог прекращается автоматически с прекращением основного обязательства",
          "mortgage_release_procedure_status": "not_defined",
          "mortgage_release_procedure_details": "Не описана",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Не предусмотрено",
          "pledge_document_return_status": "defined",
          "pledge_document_return_details": "Кредитор обязуется передать оригинал договора залога и подписать документы для снятия обременения",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Не распределены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "С прекращением основного обязательства прекращается залог автомобиля. Кредитор обязуется в течение 3 рабочих дней передать Должнику оригинал договора залога и подписать документы, необходимые для снятия обременения."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "Стороны урегулировали обязательство."

        Ответ:
        {
          "secured_obligation_identified_status": "not_defined",
          "secured_obligation_identified_details": "Не идентифицировано",
          "security_type": "not_defined",
          "security_termination_status": "not_defined",
          "security_termination_details": "Не урегулировано",
          "mortgage_release_procedure_status": "not_defined",
          "mortgage_release_procedure_details": "Не описана",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Не предусмотрено",
          "pledge_document_return_status": "not_defined",
          "pledge_document_return_details": "Не предусмотрен",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Не распределены",
          "evidence": []
        }

        Пример 3 — ипотека, конкретные действия по регистрации и уведомлению:
        Фрагмент:
        "Обязательство Должника обеспечено ипотекой в пользу Кредитора и
        поручительством ООО «Гарант». В течение 10 рабочих дней с даты
        передачи отступного Кредитор обязуется подать в Росреестр заявление
        о погашении регистрационной записи об ипотеке. Кредитор обязуется
        письменно уведомить ООО «Гарант» о прекращении основного обязательства
        в течение 5 рабочих дней."

        Ответ:
        {
          "secured_obligation_identified_status": "defined",
          "secured_obligation_identified_details": "Обязательство обеспечено ипотекой и поручительством",
          "security_type": "mixed",
          "security_termination_status": "defined",
          "security_termination_details": "Прекращение обеспечения требует отдельных действий: подачи заявления о погашении записи об ипотеке и уведомления поручителя",
          "mortgage_release_procedure_status": "defined",
          "mortgage_release_procedure_details": "Кредитор обязуется в течение 10 рабочих дней подать в Росреестр заявление о погашении регистрационной записи об ипотеке",
          "surety_notification_status": "defined",
          "surety_notification_details": "Кредитор обязуется письменно уведомить ООО «Гарант» о прекращении основного обязательства в течение 5 рабочих дней",
          "pledge_document_return_status": "not_defined",
          "pledge_document_return_details": "Не предусмотрен",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Не распределены",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Обязательство Должника обеспечено ипотекой в пользу Кредитора и поручительством ООО «Гарант». В течение 10 рабочих дней с даты передачи отступного Кредитор обязуется подать в Росреестр заявление о погашении регистрационной записи об ипотеке. Кредитор обязуется письменно уведомить ООО «Гарант» о прекращении основного обязательства в течение 5 рабочих дней."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Обеспечение обязательства прекращается в порядке, установленном
        действующим законодательством Российской Федерации. Вопросы,
        связанные со снятием обеспечения, решаются сторонами в соответствии
        с законом. Поручитель уведомляется в порядке, предусмотренном
        законодательством."

        Ответ:
        {
          "secured_obligation_identified_status": "not_defined",
          "secured_obligation_identified_details": "Не идентифицировано",
          "security_type": "not_defined",
          "security_termination_status": "not_defined",
          "security_termination_details": "Не урегулировано",
          "mortgage_release_procedure_status": "not_defined",
          "mortgage_release_procedure_details": "Не описана",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Не предусмотрено",
          "pledge_document_return_status": "not_defined",
          "pledge_document_return_details": "Не предусмотрен",
          "security_release_costs_status": "not_defined",
          "security_release_costs_details": "Не распределены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наличии обеспечения.
        2. Найди прямую цитату о прекращении обеспечения; определи, автоматическое
           оно или требует отдельных действий, а не общая отсылка к закону.
        3. Найди прямую цитату о снятии залога / погашении записи об ипотеке
           с конкретными действиями (кто/куда/когда подаёт документы).
        4. Найди прямую цитату о возврате документов и об уведомлении поручителей
           с конкретным сроком/способом, а не общую ссылку на закон.
        5. Убедись, что речь идёт об обеспечении первоначального обязательства,
           а не об обременениях на предмет отступного.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "secured_obligation_identified_status": "<defined / not_defined>",
          "secured_obligation_identified_details": "<текст или 'Не идентифицировано'>",
          "security_type": "<pledge / mortgage / surety / mixed / not_defined>",
          "security_termination_status": "<defined / not_defined>",
          "security_termination_details": "<текст или 'Не урегулировано' / 'Не удалось определить'>",
          "mortgage_release_procedure_status": "<defined / not_defined>",
          "mortgage_release_procedure_details": "<текст или 'Не описана' / 'Не удалось определить'>",
          "surety_notification_status": "<defined / not_defined>",
          "surety_notification_details": "<текст или 'Не предусмотрено' / 'Не удалось определить'>",
          "pledge_document_return_status": "<defined / not_defined>",
          "pledge_document_return_details": "<текст или 'Не предусмотрен' / 'Не удалось определить'>",
          "security_release_costs_status": "<defined / not_defined>",
          "security_release_costs_details": "<текст или 'Не распределены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 1150

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "залог ипотека поручительство обеспечение прекращается снятие залога погашение записи об ипотеке закладная залогодержатель поручитель освобождение от обеспечения возврат закладной снятие обременения расходы на снятие обеспечения"
      retrieval_profile: "security_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "не заложено как гарантия при передаче"
        - "не арестовано"
        - "свободно от прав третьих лиц"
        - "риск случайной гибели"
        - "первоначальное обязательство"
        - "стоимость отступного"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "secured_obligation_fate_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        формулировки о судьбе обеспечений после прекращения основного обязательства:
        тип обеспечения, его прекращение (автоматическое или требующее отдельных
        действий), процедура снятия ипотечной записи, уведомление поручителей,
        возврат документов и расходы на снятие обеспечения.
        Не анализируй стоимость, банкротный контекст, налоги, споры, а также
        заверения об отсутствии обременений на сам предмет отступного
        (это отдельный вопрос).
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. secured_obligation_fate_check_presence:
           Агрегатное signal-поле — наличие регулирования по судьбе обеспечений.
           - "present" — если хотя бы одно из содержательных полей
             (secured_obligation_identified_status, security_termination_status,
              mortgage_release_procedure_status, surety_notification_status,
              pledge_document_return_status, security_release_costs_status)
             = "defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - secured_obligation_identified_status = "not_defined";
           - secured_obligation_identified_details = "Не идентифицировано";
           - security_type = "not_defined";
           - security_termination_status = "not_defined";
           - security_termination_details = "Не урегулировано";
           - mortgage_release_procedure_status = "not_defined";
           - mortgage_release_procedure_details = "Не описана";
           - surety_notification_status = "not_defined";
           - surety_notification_details = "Не предусмотрено";
           - pledge_document_return_status = "not_defined";
           - pledge_document_return_details = "Не предусмотрен";
           - security_release_costs_status = "not_defined";
           - security_release_costs_details = "Не распределены";
           - не выполняй остальные шаги.

        1. secured_obligation_identified_status — "defined" если наличие
           обеспеченного обязательства прямо указано в тексте, иначе "not_defined".
        2. secured_obligation_identified_details — описание обеспеченного
           обязательства (используется как контекст для оценки судьбы
           обеспечения). Fallback — "Не идентифицировано".
        3. security_type — "pledge" / "mortgage" / "surety" / "mixed" / "not_defined".
        4. security_termination_status — "defined" если прекращение обеспечения
           прямо описано в тексте конкретным условием (автоматически или через
           названное действие), иначе "not_defined". Фраза "в порядке,
           установленном законодательством" без конкретики — not_defined.
        5. security_termination_details — формулировка о прекращении обеспечения;
           если из текста ясно, происходит ли прекращение автоматически (в силу
           факта прекращения основного обязательства) или требует отдельных
           действий сторон (подача заявления, подписание соглашения) — отрази
           это явно в формулировке. Формат: краткая фраза. Fallback —
           "Не урегулировано".
        6. mortgage_release_procedure_status — "defined" если процедура погашения
           ипотечной записи прямо описана конкретными действиями (кто подаёт,
           куда, в какой срок), иначе "not_defined".
        7. mortgage_release_procedure_details — формулировка о процедуре
           погашения ипотечной записи. Fallback — "Не описана".
        8. surety_notification_status — "defined" если уведомление поручителей
           прямо предусмотрено конкретным способом/сроком, иначе "not_defined".
           Фраза "поручитель уведомляется в порядке, предусмотренном
           законодательством" без конкретики — not_defined.
        9. surety_notification_details — формулировка об уведомлении поручителей.
           Fallback — "Не предусмотрено".
        10. pledge_document_return_status — "defined" если возврат закладной
            или документов по залогу прямо предусмотрен конкретным действием,
            иначе "not_defined".
        11. pledge_document_return_details — формулировка о возврате документов.
            Fallback — "Не предусмотрен".
        12. security_release_costs_status — "defined" если расходы на снятие
            обеспечения прямо распределены между сторонами конкретно, иначе
            "not_defined". Общая фраза "вопросы решаются в соответствии с
            законом" без конкретного распределения расходов — not_defined.
        13. security_release_costs_details — формулировка о распределении расходов.
            Fallback — "Не распределены".

        Если данные отсутствуют, используй следующий fallback:
        - secured_obligation_identified_details → "Не идентифицировано"
        - security_termination_details → "Не урегулировано"
        - mortgage_release_procedure_details → "Не описана"
        - surety_notification_details → "Не предусмотрено"
        - pledge_document_return_details → "Не предусмотрен"
        - security_release_costs_details → "Не распределены"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни secured_obligation_fate_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "в порядке, установленном законодательством" или "в
          соответствии с законом" без конкретного условия (кто, что, когда
          делает применительно к обеспечению) — это not_defined. Правило
          применяется ко всем полям check-а без исключения.
        - Не путай обеспечение первоначального обязательства (предмет этого
          check-а) с заверениями об отсутствии залога/ареста/прав третьих лиц
          на сам предмет отступного (передаваемое имущество) — это разные
          обеспечения и разные вопросы.
        - security_type:
            - "pledge" — залог движимого имущества (кроме ипотеки).
            - "mortgage" — залог недвижимого имущества (ипотека).
            - "surety" — поручительство.
            - "mixed" — несколько видов обеспечения одновременно.
            - "not_defined" — вид обеспечения прямо не указан.
        - security_termination_status = "defined" только если прекращение
          обеспечения прямо сформулировано в тексте конкретным условием; не
          выводи из общей нормы ст. 329 ГК РФ или общей фразы о законодательстве.
        - Различай автоматическое прекращение обеспечения и прекращение,
          требующее отдельных действий сторон (заявление в регистрирующий
          орган, подписание дополнительного соглашения, уведомление) — отражай
          это различие в security_termination_details.
        - mortgage_release_procedure_status = "defined" только если описаны
          конкретные действия по погашению ипотечной записи в ЕГРН (кто подаёт,
          куда, в какой срок), а не общая ссылка на закон.
        - pledge_document_return_status = "defined" только если возврат
          закладной или иных документов по залогу прямо предусмотрен конкретным
          действием.
        - Если в разных фрагментах указаны противоречивые сведения о виде
          обеспечения, его прекращении или сопутствующих процедурах и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса/enum и
          "Не удалось определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни идентификации обеспечения, ни условия о прекращении,
           ни процедур снятия ипотеки/уведомления поручителей/возврата документов.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Обеспечение прекращается в порядке, установленном законодательством.
           Поручитель уведомляется в порядке, предусмотренном законодательством»
           без конкретных действий и без идентификации вида обеспечения.
           → presence = "missing";
             security_termination_status = "not_defined";
             surety_notification_status = "not_defined";
             соответствующие *_details = "Не урегулировано" / "Не предусмотрено".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны разные виды обеспечения или
           противоречивые сведения о его прекращении, и конфликт нельзя снять
           по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: ипотека с процедурой регистрации и уведомлением поручителя.
           Обязательство обеспечено ипотекой и поручительством; в тексте прямо
           указаны конкретные действия по погашению записи об ипотеке и
           уведомлению поручителя.
           → presence = "present";
             security_type = "mixed";
             security_termination_status = "defined";
             mortgage_release_procedure_status = "defined";
             surety_notification_status = "defined";
             соответствующие *_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для secured_obligation_fate_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Для security_type используй только: "pledge", "mortgage", "surety",
          "mixed" или "not_defined".
        - Fallback при отсутствии данных:
          * secured_obligation_identified_details → "Не идентифицировано";
          * security_termination_details → "Не урегулировано";
          * mortgage_release_procedure_details → "Не описана";
          * surety_notification_details → "Не предусмотрено";
          * pledge_document_return_details → "Не предусмотрен";
          * security_release_costs_details → "Не распределены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "secured_obligation_fate_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования судьбы обеспечений при прекращении основного обязательства. Внутреннее агрегатное signal-поле."
