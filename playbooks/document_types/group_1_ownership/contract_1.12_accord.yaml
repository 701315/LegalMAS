        - name: "creditor_signatory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания подписанта Кредитора. Внутреннее enum-поле."
          required: true

        - name: "creditor_signatory_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Подписант Кредитора"
          description: >
            Подписант от Кредитора вместе с основанием полномочий, если оно указано
