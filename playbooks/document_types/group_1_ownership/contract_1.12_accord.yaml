        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)конфиденциал"
        - "(?i)применим(ое|ого)\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: споры, претензионный порядок,
        конфиденциальность и применимое право.

        Нормативный ориентир:
        - АПК РФ / ГПК РФ
        - ст. 1210–1211 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли претензионный / досудебный порядок.
        2. Есть ли срок ответа на претензию.
        3. Есть ли указание на суд / форум разрешения споров.
        4. Есть ли условие о конфиденциальности.
        5. Есть ли указание на применимое право.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай сроки и суды.
        3. Если формулировки нет — возвращай "not_defined".
        4. В текстовых полях при отсутствии данных возвращай "Данные не определены".
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Все споры подлежат разрешению в Арбитражном суде города Москвы.
        Стороны обязуются соблюдать претензионный порядок; срок ответа
        на претензию составляет 10 рабочих дней. Условия настоящего соглашения
        являются конфиденциальными. Применимым правом является право Российской Федерации."

