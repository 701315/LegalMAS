        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: гарантии в отношении предмета отступного
        и распределение риска до передачи.

        Нормативный ориентир:
        - ст. 460 ГК РФ
        - ст. 211 ГК РФ
        - ст. 459 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности / титула.
        2. Есть ли указание на отсутствие залога.
        3. Есть ли указание на отсутствие ареста.
        4. Есть ли указание на отсутствие прав третьих лиц.
        5. Есть ли гарантия качества / отсутствия скрытых недостатков.
        6. Кто несёт риск случайной гибели / повреждения до передачи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай заверения, которых нет.
        3. Если данных нет — возвращай "Данные не определены" / "not_defined".
        4. Верни только один JSON-объект.
        5. Evidence — только текст соглашения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Должник подтверждает, что автомобиль принадлежит ему на праве собственности,
        не находится в залоге, под арестом и свободен от прав третьих лиц.
        Риск случайной гибели до момента передачи несет Должник."

        Ответ:
        {
          "title_warranty_status": "defined",
          "title_warranty_details": "автомобиль принадлежит ему на праве собственности",
          "no_pledge_status": "defined",
          "no_pledge_details": "не находится в залоге",
          "no_arrest_status": "defined",
