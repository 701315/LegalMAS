        2. Кадастровый номер считай определённым только если он прямо указан в тексте.
        3. Не выводи наличие ЕГРН или регистрации из того, что предмет — недвижимость.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified" или пустые строки.
        7. В evidence включай только цитаты из соглашения.
