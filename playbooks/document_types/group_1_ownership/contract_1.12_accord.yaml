            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Споры разрешаются в установленном порядке."

        Ответ:
        {
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "claim_response_deadline_status": "not_defined",
          "claim_response_deadline_details": "Данные не определены",
          "dispute_forum_status": "not_defined",
          "dispute_forum_details": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "governing_law_status": "not_defined",
          "governing_law_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о претензионном порядке.
        2. Найди прямую цитату о сроке ответа.
        3. Найди прямую цитату о суде / форуме.
        4. Найди прямую цитату о конфиденциальности.
        5. Найди прямую цитату о применимом праве.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Данные не определены'>",
          "claim_response_deadline_status": "<defined / not_defined>",
          "claim_response_deadline_details": "<текст или 'Данные не определены'>",
          "dispute_forum_status": "<defined / not_defined>",
