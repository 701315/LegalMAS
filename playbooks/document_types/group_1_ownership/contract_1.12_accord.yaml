        - pattern: "(?i)обязательство\\s+считается\\s+прекращённым\\s+(?:после|с\\s+момента)\\s+предоставления\\s+отступного"
          weight: 0.94
          distinctiveness: high
          context: body
          description: "Ключевой квалификатор: прекращение после предоставления (не после подписания)"

        - pattern: "(?i)обязательство\\s+прекращается\\s+(?:после|по\\s+факту)\\s+фактической\\s+передачи"
          weight: 0.94
          distinctiveness: high
          context: body
          description: "Прекращение обязательства после фактической передачи актива"

        - pattern: "(?i)\\bвзамен\\s+исполнения\\b"
          weight: 0.86
          distinctiveness: high
          context: body
          description: "Иное исполнение взамен первоначального"

        - pattern: "(?i)в\\s+счёт\\s+погашения\\s+долга|в\\s+счет\\s+погашения\\s+долга"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Передача актива в счёт погашения долга"

        - pattern: "(?i)должник\\s+предоставляет\\s+отступное"
          weight: 0.88
          distinctiveness: high
