        - "(?i)рыночн(ая|ой)\\s+стоимост"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"

  - id: "full_and_final_settlement"
    name: "Полное и окончательное урегулирование"
