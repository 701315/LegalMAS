      store_payload: true

  - id: tax_and_accounting_check
    name: "Налоговые последствия отступного и первичные документы"
    description: >
      Фактографическая проверка наличия в тексте НДС-оговорки, указания
      на стоимость для налоговых целей, первичные документы, налог на прибыль
      и формулировки о возмездном характере сделки.
      Примечание: возмездность и экономическая цель сделки здесь проверяются
      для целей налогового законодательства (НДС/налог на прибыль по НК РФ,
      деловая цель против ст. 54.1 НК РФ). Это отдельный вопрос от check
      bankruptcy_and_fair_value_risk_check, где аналогичная тема (отсутствие
      сделки с предпочтением) проверяется для целей ст. 61.2–61.3 ФЗ-127 —
      оба check-а сохраняются независимо, так как отвечают на разные
      юридические вопросы, даже если ссылаются на один и тот же фрагмент текста.
    triggers:
      any: ["tax_sensitive_structure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговые обязательства"
        - "НДС"
        - "доход кредитора"
        - "расход должника"
        - "первичные документы"
        - "акт приема-передачи"
        - "стоимость для целей налогообложения"
        - "рыночная стоимость"
        - "не является дарением"
        - "налог на прибыль"
        - "экономическая цель"
        - "деловая цель"
        - "счет-фактура"
        - "накладная"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налогов(ые|ых|ой)\\s+обязательств"
        - "(?i)первичн(ые|ых)\\s+документ"
        - "(?i)стоимост(ь|и)\\s+для\\s+целей\\s+налогообложен"
        - "(?i)налог\\s+на\\s+прибыл"
        - "(?i)экономическ(ая|ой|ую)\\s+цел|делов(ая|ой|ую)\\s+цел"
        - "(?i)счет-фактур|накладн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие налоговые и учётные формулировки
        прямо содержатся в тексте соглашения.

        Нормативный ориентир:
        - НК РФ
        - ст. 39, 146, 154 НК РФ (НДС, безвозмездная передача)
        - ст. 54.1 НК РФ (деловая цель)

        Важно:
        - Не додумывай налоговые последствия, если они не указаны в тексте.
        - Здесь возмездность и экономическая цель сделки оцениваются только
          для налоговых целей (НДС, налог на прибыль, деловая цель) — не путай
          с банкротным аспектом отсутствия предпочтения кредиторам (это
          отдельный вопрос, проверяемый в другом check-е).
        - Общая фраза вроде "стороны самостоятельно несут ответственность за
          уплату налогов в соответствии с действующим законодательством
          Российской Федерации" без конкретного факта (упоминания НДС,
          конкретной стоимости для налоговых целей, конкретных первичных
          документов, конкретной формулировки о возмездности, конкретного
          упоминания налога на прибыль или экономической цели) НЕ является
          основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли НДС-оговорка.
        2. Есть ли указание на стоимость для налоговых целей.
        3. Есть ли упоминание первичных документов.
        4. Есть ли указание на налог на прибыль / налоговые последствия.
        5. Есть ли формулировка, что сделка не является дарением.
        6. Есть ли указание на экономическую цель сделки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай налоговые последствия, если они не указаны в тексте.
        3. Общая фраза об ответственности за уплату налогов "в соответствии
           с законодательством" без конкретного факта — это not_defined.
        4. Если данных нет — возвращай "not_defined" и соответствующий
           текстовый fallback.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — частично определено:
        Фрагмент:
        "Стоимость передаваемого имущества для целей налогообложения составляет
        1 000 000 рублей. Передача имущества облагается НДС в соответствии
        с действующим законодательством. Передача оформляется актом приема-передачи."

        Ответ:
        {
          "vat_clause_status": "defined",
          "vat_clause_details": "Передача имущества облагается НДС",
          "tax_value_defined_status": "defined",
          "tax_value_defined_details": "1 000 000 рублей",
          "primary_documents_status": "defined",
          "primary_documents_details": "Оформляется актом приёма-передачи",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Не установлено",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Не установлено",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стоимость передаваемого имущества для целей налогообложения составляет 1 000 000 рублей. Передача имущества облагается НДС в соответствии с действующим законодательством. Передача оформляется актом приема-передачи."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Стороны передают имущество в счет прекращения обязательства."

        Ответ:
        {
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Не установлено",
          "tax_value_defined_status": "not_defined",
          "tax_value_defined_details": "Не установлена",
          "primary_documents_status": "not_defined",
          "primary_documents_details": "Не предусмотрены",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Не установлено",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Не установлено",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — возмездность, налог на прибыль, экономическая цель:
        Фрагмент:
        "Стороны подтверждают, что настоящее соглашение носит возмездный
        характер и не является дарением. Доход Кредитора и расход Должника
        от исполнения настоящего соглашения учитываются для целей налога
        на прибыль в порядке, установленном главой 25 НК РФ. Экономической
        целью настоящего соглашения является урегулирование задолженности
        Должника способом, предусмотренным ст. 409 ГК РФ."

        Ответ:
        {
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Не установлено",
          "tax_value_defined_status": "not_defined",
          "tax_value_defined_details": "Не установлена",
          "primary_documents_status": "not_defined",
          "primary_documents_details": "Не предусмотрены",
          "gift_risk_addressed_status": "defined",
          "gift_risk_addressed_details": "Соглашение носит возмездный характер и не является дарением",
          "profit_tax_status": "defined",
          "profit_tax_details": "Доход Кредитора и расход Должника учитываются для целей налога на прибыль по главе 25 НК РФ",
          "economic_purpose_status": "defined",
          "economic_purpose_details": "Урегулирование задолженности Должника способом, предусмотренным ст. 409 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 9.2",
              "quote": "Стороны подтверждают, что настоящее соглашение носит возмездный характер и не является дарением. Доход Кредитора и расход Должника от исполнения настоящего соглашения учитываются для целей налога на прибыль в порядке, установленном главой 25 НК РФ. Экономической целью настоящего соглашения является урегулирование задолженности Должника способом, предусмотренным ст. 409 ГК РФ."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стороны самостоятельно несут ответственность за исчисление и уплату
        налогов в соответствии с действующим законодательством Российской
        Федерации."

        Ответ:
        {
          "vat_clause_status": "not_defined",
          "vat_clause_details": "Не установлено",
          "tax_value_defined_status": "not_defined",
          "tax_value_defined_details": "Не установлена",
          "primary_documents_status": "not_defined",
          "primary_documents_details": "Не предусмотрены",
          "gift_risk_addressed_status": "not_defined",
          "gift_risk_addressed_details": "Не установлено",
          "profit_tax_status": "not_defined",
          "profit_tax_details": "Не установлено",
          "economic_purpose_status": "not_defined",
          "economic_purpose_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату про НДС.
        2. Найди прямую цитату про стоимость для налоговых целей.
        3. Найди прямую цитату про первичные документы.
        4. Найди прямую цитату про отсутствие дарения / возмездность, налог
           на прибыль, экономическую цель — оцени каждую тему независимо.
        5. Проверь: не является ли формулировка общей фразой об "ответственности
           за уплату налогов" без конкретного факта — если да, все поля
           not_defined.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "vat_clause_status": "<defined / not_defined>",
          "vat_clause_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "tax_value_defined_status": "<defined / not_defined>",
          "tax_value_defined_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "primary_documents_status": "<defined / not_defined>",
          "primary_documents_details": "<текст или 'Не предусмотрены' / 'Не удалось определить'>",
          "gift_risk_addressed_status": "<defined / not_defined>",
          "gift_risk_addressed_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "profit_tax_status": "<defined / not_defined>",
          "profit_tax_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "economic_purpose_status": "<defined / not_defined>",
          "economic_purpose_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС налоговые обязательства доход кредитора расход должника первичные документы акт приёма-передачи стоимость для целей налогообложения рыночная стоимость для налога не является дарением экономическая цель деловая цель налог на прибыль счет-фактура накладная"
      retrieval_profile: "tax_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "стоимость отступного как коммерческое условие"
        - "согласованная стоимость для погашения долга"
        - "соразмерность в контексте банкротства"
        - "ст. 61.2"
        - "ст. 61.3"
        - "аффилированность"
        - "залог"
        - "банкротство"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "tax_and_accounting_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        налоговые и учётные формулировки: НДС-оговорку, стоимость для
        налоговых целей, перечень первичных документов, оговорку об отсутствии
        дарения (возмездность), упоминание налога на прибыль и экономической
        цели сделки.
        Возмездность и экономическая цель здесь оцениваются только для
        налоговых целей (НДС, налог на прибыль, деловая цель по ст. 54.1
        НК РФ) — не путай с банкротным аспектом отсутствия предпочтения
        кредиторам (это отдельный вопрос).
        Не анализируй фактические налоговые последствия по НК РФ, если они
        прямо не воспроизведены в тексте соглашения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tax_and_accounting_check_presence:
           Агрегатное signal-поле — наличие регулирования по налоговым
           и учётным формулировкам.
           - "present" — если хотя бы одно из содержательных полей
             (vat_clause_status, tax_value_defined_status,
              primary_documents_status, gift_risk_addressed_status,
              profit_tax_status, economic_purpose_status) = "defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vat_clause_status = "not_defined";
           - vat_clause_details = "Не установлено";
           - tax_value_defined_status = "not_defined";
           - tax_value_defined_details = "Не установлена";
           - primary_documents_status = "not_defined";
           - primary_documents_details = "Не предусмотрены";
           - gift_risk_addressed_status = "not_defined";
           - gift_risk_addressed_details = "Не установлено";
           - profit_tax_status = "not_defined";
           - profit_tax_details = "Не установлено";
           - economic_purpose_status = "not_defined";
           - economic_purpose_details = "Не установлено";
           - не выполняй остальные шаги.

        1. vat_clause_status — "defined" если НДС-оговорка прямо присутствует
           в тексте соглашения (в том числе прямое указание, что НДС не
           начисляется), иначе "not_defined".
        2. vat_clause_details — формулировка о НДС. Формат: краткая фраза.
           Fallback — "Не установлено".
        3. tax_value_defined_status — "defined" если стоимость предмета отступного
           для целей налогообложения прямо определена конкретной цифрой,
           иначе "not_defined".
        4. tax_value_defined_details — такая стоимость. Формат: краткая цифра
           с валютой. Fallback — "Не установлена".
        5. primary_documents_status — "defined" если первичные документы (акт,
           накладная, счёт-фактура) прямо упомянуты как подлежащие оформлению,
           иначе "not_defined". Не выводи из общего факта передачи имущества.
        6. primary_documents_details — формулировка о первичных документах.
           Fallback — "Не предусмотрены".
        7. gift_risk_addressed_status — "defined" если прямо указано, что сделка
           не является дарением или носит возмездный характер, иначе
           "not_defined". Общая фраза об "ответственности за уплату налогов"
           без слов "дарение"/"возмездный" — not_defined.
        8. gift_risk_addressed_details — соответствующая формулировка. Fallback —
           "Не установлено".
        9. profit_tax_status — "defined" если налог на прибыль или иные
           конкретные налоговые последствия прямо упомянуты в тексте, иначе
           "not_defined".
        10. profit_tax_details — формулировка о налоге на прибыль или иных
            налоговых последствиях. Fallback — "Не установлено".
        11. economic_purpose_status — "defined" если экономическая или деловая
            цель сделки прямо упомянута в тексте конкретной формулировкой,
            иначе "not_defined".
        12. economic_purpose_details — формулировка об экономической цели
            сделки. Fallback — "Не установлено".

        Если данные отсутствуют, используй следующий fallback:
        - vat_clause_details → "Не установлено"
        - tax_value_defined_details → "Не установлена"
        - primary_documents_details → "Не предусмотрены"
        - gift_risk_addressed_details → "Не установлено"
        - profit_tax_details → "Не установлено"
        - economic_purpose_details → "Не установлено"
        - соответствующий статус → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_and_accounting_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "стороны самостоятельно несут ответственность за уплату
          налогов в соответствии с законодательством" без конкретного факта
          (НДС, конкретная стоимость, конкретные документы, возмездность,
          налог на прибыль, экономическая цель) — это not_defined. Правило
          применяется ко всем полям check-а без исключения.
        - Возмездность (gift_risk_addressed) и экономическая цель
          (economic_purpose) здесь оцениваются только для налоговых целей.
          Не путай с проверкой отсутствия предпочтения кредиторам для целей
          банкротного законодательства — это отдельный вопрос, проверяемый
          в другом check-е.
        - vat_clause_status = "defined" как при наличии оговорки о начислении НДС,
          так и при прямом указании, что передача НДС не облагается.
        - primary_documents_status = "defined" только если первичные документы
          или акт приёма-передачи прямо упомянуты как подлежащие оформлению;
          не выводи из факта передачи имущества.
        - gift_risk_addressed_status = "defined" только если соответствующая
          формулировка (не является дарением / носит возмездный характер)
          прямо присутствует в тексте.
        - economic_purpose_status = "defined" только если экономическая цель
          сформулирована конкретно, а не как общая ссылка на законность сделки.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни НДС-оговорки, ни стоимости для налоговых целей,
           ни первичных документов, ни возмездности/отсутствия дарения,
           ни налога на прибыль, ни экономической цели.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Стороны самостоятельно несут ответственность за исчисление и уплату
           налогов в соответствии с законодательством РФ» без конкретных
           фактов по НДС, стоимости, документам, возмездности, прибыли
           и цели сделки.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = соответствующий fallback.

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о налоговых последствиях (в одном пункте — возмездность,
           в другом — признаки дарения), и конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: возмездность и экономическая цель.
           В тексте прямо указано, что соглашение носит возмездный характер
           и не является дарением, а также сформулирована экономическая цель
           (урегулирование задолженности по ст. 409 ГК РФ).
           → presence = "present";
             gift_risk_addressed_status = "defined";
             gift_risk_addressed_details = "Соглашение носит возмездный характер и не является дарением";
             economic_purpose_status = "defined";
             economic_purpose_details = "Урегулирование задолженности Должника способом, предусмотренным ст. 409 ГК РФ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_and_accounting_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * vat_clause_details → "Не установлено";
          * tax_value_defined_details → "Не установлена";
          * primary_documents_details → "Не предусмотрены";
          * gift_risk_addressed_details → "Не установлено";
          * profit_tax_details → "Не установлено";
          * economic_purpose_details → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_and_accounting_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие налоговых и учётных формулировок. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vat_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия НДС-оговорки. Внутреннее enum-поле."
          required: true

        - name: "vat_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "НДС-оговорка"
          description: >
            Формулировка о НДС.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "tax_value_defined_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания стоимости для налоговых целей. Внутреннее enum-поле."
          required: true

        - name: "tax_value_defined_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Стоимость для налоговых целей"
          description: >
            Стоимость предмета отступного для целей налогообложения.
            Fallback: "Не установлена" / "Не удалось определить".
          required: true

        - name: "primary_documents_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на первичные документы. Внутреннее enum-поле."
          required: true

        - name: "primary_documents_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Первичные документы"
          description: >
            Формулировка о первичных документах или акте приёма-передачи.
            Fallback: "Не предусмотрены" / "Не удалось определить".
          required: true

        - name: "gift_risk_addressed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус формулировки о том, что сделка не является дарением. Внутреннее enum-поле."
          required: true

        - name: "gift_risk_addressed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Не является дарением"
          description: >
            Формулировка о том, что сделка не является дарением, для целей
            налогового законодательства.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "profit_tax_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания налога на прибыль или иных налоговых последствий. Внутреннее enum-поле."
          required: true

        - name: "profit_tax_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Налоговые последствия"
          description: >
            Формулировка о налоге на прибыль или иных налоговых последствиях.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "economic_purpose_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания экономической цели сделки. Внутреннее enum-поле."
          required: true

        - name: "economic_purpose_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Экономическая цель сделки"
          description: >
            Формулировка об экономической цели сделки для налоговых целей.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: spousal_consent_for_individual_check
    name: "Согласие супруга при передаче совместного имущества физическим лицом"
    description: >
      Фактографическая проверка наличия в тексте нотариального согласия супруга,
      указания на отсутствие брака, личный характер имущества или брачный договор,
      если должник — физическое лицо.
    triggers:
      any: ["individual_party"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "совместно нажитое имущество"
        - "личная собственность"
        - "брачный договор"
        - "письменное согласие супруги"
        - "письменное согласие супруга"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
        - "(?i)совместн(о|ого)\\s+нажит"
        - "(?i)нотариальн[а-я]+\\s+согласи"
        - "(?i)брачн(ый|ого)\\s+договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: есть ли в тексте указание на согласие супруга
        или на личный режим имущества при участии физического лица.

        Нормативный ориентир:
        - ст. 35 СК РФ (в т.ч. п. 3 — обязательная нотариальная форма согласия
          супруга для сделок с недвижимостью и сделок, требующих нотариального
          удостоверения)

        Важно:
        - Не додумывай семейный статус.
        - Общая фраза вроде "Должник гарантирует наличие права на отчуждение
          передаваемого имущества" или "Должник вправе распоряжаться имуществом
          по своему усмотрению" без конкретного упоминания согласия супруга,
          отсутствия брака, личной собственности или брачного договора — это
          НЕ является основанием для "defined" ни для одного из трёх полей.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Является ли должник физическим лицом.
        2. Есть ли указание на нотариальное согласие супруга.
        3. Есть ли указание, что должник не состоит в браке.
        4. Есть ли указание, что имущество является личной собственностью.
        5. Есть ли указание на брачный договор.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай семейный статус.
        3. Общая фраза о праве на отчуждение имущества без конкретного
           упоминания согласия/брака/личной собственности — это not_defined.
        4. Если формулировки нет — возвращай "not_defined" и соответствующий
           текстовый fallback.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — личная собственность:
        Фрагмент:
        "Должник подтверждает, что передаваемое имущество является его личной
        собственностью и не относится к совместно нажитому имуществу супругов."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Должник является физическим лицом",
          "spousal_consent_status": "personal_property",
          "spousal_consent_details": "Имущество является личной собственностью",
          "consent_document_type": "not_defined",
          "consent_document_type_display": "Не установлено",
          "marital_regime_confirmed_status": "defined",
          "marital_regime_confirmed_details": "Не относится к совместно нажитому имуществу супругов",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Должник подтверждает, что передаваемое имущество является его личной собственностью и не относится к совместно нажитому имуществу супругов."
            }
          ]
        }

        Пример 2 — режим не подтверждён:
        Фрагмент:
        "Гражданин Иванов И.И. передает имущество кредитору."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Гражданин Иванов И.И.",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Не установлено",
          "consent_document_type": "not_defined",
          "consent_document_type_display": "Не установлено",
          "marital_regime_confirmed_status": "not_defined",
          "marital_regime_confirmed_details": "Не подтверждён",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "Гражданин Иванов И.И. передает имущество кредитору."
            }
          ]
        }

        Пример 3 — согласие дано без указания нотариальной формы:
        Фрагмент:
        "Должник передает имущество с письменного согласия супруги Ивановой И.И."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Должник (физическое лицо)",
          "spousal_consent_status": "present",
          "spousal_consent_details": "Письменное согласие супруги Ивановой И.И.",
          "consent_document_type": "statement",
          "consent_document_type_display": "Согласие в иной форме",
          "marital_regime_confirmed_status": "defined",
          "marital_regime_confirmed_details": "Согласие супруги получено, нотариальная форма не упомянута",
          "evidence": [
            {
              "clause_ref": "п. 10.2",
              "quote": "Должник передает имущество с письменного согласия супруги Ивановой И.И."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Должник гарантирует наличие права на отчуждение передаваемого
        имущества и вправе распоряжаться им по своему усмотрению в
        соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "individual_party_as_debtor_status": "defined",
          "individual_party_as_debtor_details": "Должник (физическое лицо)",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Не установлено",
          "consent_document_type": "not_defined",
          "consent_document_type_display": "Не установлено",
          "marital_regime_confirmed_status": "not_defined",
          "marital_regime_confirmed_details": "Не подтверждён",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о физическом лице.
        2. Найди прямую цитату о согласии супруга / отсутствии брака / личной
           собственности / брачном договоре.
        3. Если согласие упомянуто — проверь, указана ли нотариальная форма
           или это неопределённая письменная форма.
        4. Проверь: не является ли формулировка общей фразой о "праве на
           отчуждение" без конкретного упоминания брака/согласия/личной
           собственности — если да, это not_defined.
        5. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        6. Не додумывай семейный статус должника.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "individual_party_as_debtor_status": "<defined / not_defined>",
          "individual_party_as_debtor_details": "<текст или 'Не установлено'>",
          "spousal_consent_status": "<present / not_married / personal_property / not_defined>",
          "spousal_consent_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "consent_document_type": "<notarized / statement / not_defined>",
          "consent_document_type_display": "<Нотариальное согласие / Согласие в иной форме / Не установлено>",
          "marital_regime_confirmed_status": "<defined / not_defined>",
          "marital_regime_confirmed_details": "<текст или 'Не подтверждён' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие супруга нотариальное согласие письменное согласие не состоит в браке совместно нажитое имущество личная собственность брачный договор семейный режим имущества личный режим имущества"
      retrieval_profile: "consent_check"
      preferred_unit_types:
        - warranty
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "крупная сделка"
        - "одобрение общего собрания"
        - "корпоративное одобрение"
        - "первоначальное обязательство"
        - "предмет отступного"
        - "стоимость отступного"
        - "залог"
        - "ипотека"
        - "свободно от прав третьих лиц"
        - "банкротство"
        - "неплатежеспособность"
        - "НДС"
        - "не является новацией"
        - "зачёт"
        - "прощение долга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.12
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "spousal_consent_for_individual_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        формулировки о согласии супруга, отсутствии брака, личном характере
        имущества или наличии брачного договора, если Должник является
        физическим лицом.
        Не анализируй семейный статус самостоятельно — только то, что прямо
        написано в тексте соглашения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. spousal_consent_for_individual_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме согласия
           супруга / личного режима имущества.
           - "present" — если хотя бы одно из содержательных полей находится
             в «информативном» состоянии:
             spousal_consent_status ∈ {"present", "not_married", "personal_property"} ИЛИ
             consent_document_type ∈ {"notarized", "statement"} ИЛИ
             marital_regime_confirmed_status = "defined";
           - "missing" — если spousal_consent_status = "not_defined" И
             consent_document_type = "not_defined" И
             marital_regime_confirmed_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - individual_party_as_debtor_status = "not_defined";
           - individual_party_as_debtor_details = "Не установлено";
           - spousal_consent_status = "not_defined";
           - spousal_consent_details = "Не установлено";
           - consent_document_type = "not_defined";
           - consent_document_type_display = "Не установлено";
           - marital_regime_confirmed_status = "not_defined";
           - marital_regime_confirmed_details = "Не подтверждён";
           - не выполняй остальные шаги.

        1. individual_party_as_debtor_status — "defined" если Должник прямо указан
           как физическое лицо (гражданин, физическое лицо, ИП), иначе "not_defined".
        2. individual_party_as_debtor_details — формулировка, подтверждающая,
           что Должник является физическим лицом. Формат: краткая фраза.
           Fallback — "Не установлено".
        3. spousal_consent_status — "present" / "not_married" / "personal_property" /
           "not_defined". Общая фраза о "праве на отчуждение" без конкретного
           упоминания согласия/брака/собственности — not_defined.
        4. spousal_consent_details — формулировка о согласии супруга, отсутствии
           брака, личной собственности или брачном договоре. Формат: краткая
           фраза. Fallback — "Не установлено".
        5. consent_document_type — "notarized" / "statement" / "not_defined".
           Если согласие упомянуто без указания на нотариальную форму — верни
           "statement", а не "notarized" (не додумывай форму документа).
        6. consent_document_type_display — читаемое отображение формы согласия:
           - "Нотариальное согласие" — если consent_document_type = "notarized";
           - "Согласие в иной форме" — если consent_document_type = "statement";
           - "Не установлено" — если consent_document_type = "not_defined".
        7. marital_regime_confirmed_status — "defined" если режим имущества или
           семейный статус должника прямо подтверждён любым из трёх способов
           (согласие/не женат/личная собственность), иначе "not_defined".
        8. marital_regime_confirmed_details — формулировка о семейном статусе
           или режиме имущества; если согласие дано без указания нотариальной
           формы, явно отрази это ("нотариальная форма не упомянута"). Формат:
           краткая фраза. Fallback — "Не подтверждён".

        Если данные отсутствуют, используй следующий fallback:
        - individual_party_as_debtor_details → "Не установлено"
        - spousal_consent_details → "Не установлено"
        - consent_document_type_display → "Не установлено"
        - marital_regime_confirmed_details → "Не подтверждён"
        - соответствующий статус/enum → "not_defined"

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - consent_document_type_display → "Не установлено"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни spousal_consent_for_individual_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = соответствующий fallback, consent_document_type_display = "Не установлено".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "гарантирует наличие права на отчуждение имущества" или
          "вправе распоряжаться имуществом по своему усмотрению" без
          конкретного упоминания согласия супруга, отсутствия брака, личной
          собственности или брачного договора — это not_defined для всех трёх
          смысловых полей. Правило применяется без исключения.
        - spousal_consent_status:
            - "present" — нотариальное или иное согласие супруга прямо
              упомянуто или приложено.
            - "not_married" — должник прямо подтверждает, что не состоит в браке.
            - "personal_property" — прямо указано, что имущество является личной
              собственностью должника и не относится к совместно нажитому.
            - "not_defined" — ни одна из перечисленных ситуаций прямо не указана.
        - consent_document_type:
            - "notarized" — прямо указано, что согласие нотариально удостоверено.
            - "statement" — согласие упомянуто в тексте, но без указания на
              нотариальную форму (например, "письменное согласие супруги").
            - "not_defined" — тип подтверждающего документа прямо не указан
              или согласие не упомянуто вовсе.
        - consent_document_type_display формируется ТОЛЬКО из значения
          consent_document_type по правилу из пункта 6 task.
        - individual_party_as_debtor_status = "defined" только если из текста
          прямо следует, что Должник является физическим лицом; не выводи из
          наличия имени и отчества без прямого указания статуса.
        - Не делай самостоятельного вывода о необходимости согласия супруга.
        - Если в разных фрагментах указаны противоречивые сведения о семейном
          статусе или согласии и конфликт нельзя разрешить по тексту, верни
          "not_defined" для статуса и "Не удалось определить" для текстового поля,
          consent_document_type_display = "Не установлено".
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни указания на семейный статус, ни согласия супруга,
           ни сведений о личной собственности или брачном договоре.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_details = соответствующий fallback;
             consent_document_type_display = "Не установлено".

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Должник гарантирует наличие права на отчуждение имущества и вправе
           распоряжаться им по своему усмотрению» без конкретного упоминания
           согласия супруга, отсутствия брака, личной собственности или
           брачного договора.
           → presence = "missing";
             spousal_consent_status = "not_defined";
             consent_document_type = "not_defined";
             consent_document_type_display = "Не установлено";
             marital_regime_confirmed_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о семейном статусе (в одном пункте — личная собственность,
           в другом — упоминание совместно нажитого имущества), и конфликт
           нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_details = "Не удалось определить";
             consent_document_type_display = "Не установлено".

        4. Специфика темы: нотариальное согласие супруга.
           В тексте прямо указано, что согласие супруга на передачу имущества
           нотариально удостоверено.
           → presence = "present";
             spousal_consent_status = "present";
             spousal_consent_details = "Нотариальное согласие супруга ...";
             consent_document_type = "notarized";
             consent_document_type_display = "Нотариальное согласие";
             marital_regime_confirmed_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для spousal_consent_for_individual_check_presence используй только: "present", "missing", "unclear".
        - Для individual_party_as_debtor_status и marital_regime_confirmed_status
          используй только: "defined" или "not_defined".
        - Для spousal_consent_status используй только: "present", "not_married",
          "personal_property" или "not_defined".
        - Для consent_document_type используй только: "notarized", "statement"
          или "not_defined".
        - Для consent_document_type_display используй только: "Нотариальное согласие",
          "Согласие в иной форме" или "Не установлено".
        - Fallback при отсутствии данных:
          * individual_party_as_debtor_details → "Не установлено";
          * spousal_consent_details → "Не установлено";
          * consent_document_type_display → "Не установлено";
          * marital_regime_confirmed_details → "Не подтверждён".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * consent_document_type_display → "Не установлено".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "spousal_consent_for_individual_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие указаний на согласие супруга / личный режим имущества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "individual_party_as_debtor_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания, что Должник является физическим лицом. Внутреннее enum-поле."
          required: true

        - name: "individual_party_as_debtor_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Должник-физическое лицо"
          description: >
            Формулировка о том, что Должник является физическим лицом.
            Не выводится отдельным столбцом, поскольку check активируется
            только при триггере individual_party, где этот факт уже известен.
            Fallback: "Не установлено".
          required: false

        - name: "spousal_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_married", "personal_property", "not_defined"]
          display_in_grid: false
          description: "Статус согласия супруга или личного режима имущества. Внутреннее enum-поле."
          required: true

        - name: "spousal_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Согласие супруга / личный режим"
          description: >
            Формулировка о согласии супруга, отсутствии брака или личной
            собственности.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "consent_document_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["notarized", "statement", "not_defined"]
          display_in_grid: false
          description: "Тип подтверждающего документа или заявления. Внутреннее enum-поле, отображается через consent_document_type_display."
          required: true

        - name: "consent_document_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Форма согласия"
          description: >
            Читаемое отображение формы согласия супруга: "Нотариальное
            согласие", "Согласие в иной форме" или "Не установлено".
          required: true

        - name: "marital_regime_confirmed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения семейного или имущественного режима. Внутреннее enum-поле."
          required: true

        - name: "marital_regime_confirmed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подтверждение семейного режима"
          description: >
            Формулировка о браке, брачном договоре или личной собственности,
            включая указание, если нотариальная форма согласия не упомянута.
            Fallback: "Не подтверждён" / "Не удалось определить".
          required: true
      store_payload: true

  - id: creditor_refusal_and_default_remedy_check
    name: "Право кредитора на отказ от просроченного отступного и переход к взысканию по первоначальному обязательству"
    description: >
      Фактографическая проверка того, урегулировано ли в тексте право кредитора
      отказаться от принятия отступного, предоставленного с просрочкой,
      и потребовать исполнения первоначального обязательства, а также срок,
      в течение которого сохраняется возможность предоставления отступного
      после наступления просрочки.
    triggers:
      any: ["warranty_goods", "delivery_included"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отказ от принятия отступного"
        - "вправе отказаться"
        - "потребовать исполнения первоначального обязательства"
        - "просрочка предоставления отступного"
        - "право на взыскание"
        - "возврат к первоначальному обязательству"
        - "предельный срок предоставления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вправе\\s+отказаться\\s+от\\s+принятия"
        - "(?i)потребова(ть|ния)\\s+исполнения\\s+первоначальн"
        - "(?i)просрочк[а-я]+\\s+предоставлен[а-я]+\\s+отступн"
        - "(?i)предельн(ый|ого)\\s+срок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: урегулировано ли право кредитора
        отказаться от принятия отступного при просрочке его предоставления
        и потребовать исполнения первоначального обязательства.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - Постановление Пленума ВС РФ № 6 от 11.06.2020 (о прекращении
          обязательств), п. 3–4 — если отступное не предоставлено в срок,
          кредитор вправе потребовать исполнения первоначального обязательства
          либо продолжать настаивать на предоставлении отступного.

        Важно:
        - Не оценивай риск и не делай правовой вывод о том, какая опция
          выгоднее — фиксируй только то, что прямо написано в тексте.
        - Не путай это условие с условием о сохранении права кредитора требовать
          исполнение ДО момента передачи отступного (это отдельный вопрос,
          проверяемый в другом check-е) — здесь речь идёт именно о том, что
          происходит ПОСЛЕ просрочки предоставления отступного: есть ли у
          кредитора право выбора между продолжением ожидания и переходом
          к взысканию по первоначальному обязательству.
        - Общая фраза вроде "стороны несут ответственность за неисполнение
          обязательств в соответствии с законодательством" без конкретного
          упоминания права на отказ, права требовать исполнения первоначального
          обязательства, или срока, до которого сохраняется возможность
          предоставления отступного — это NOT_DEFINED.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право кредитора отказаться от принятия отступного при просрочке.
        2. Есть ли право кредитора потребовать исполнения первоначального
           обязательства вместо принятия просроченного отступного.
        3. Есть ли предельный срок, после которого право на предоставление
           отступного считается утраченным.
        4. Есть ли указание, что параллельно с просрочкой отступного продолжают
           начисляться проценты/неустойка по первоначальному обязательству.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подменяй текст нормой закона или разъяснением Пленума ВС РФ.
        3. Общая фраза об "ответственности за неисполнение обязательств" без
           конкретного упоминания права на отказ или перехода к первоначальному
           обязательству — это not_defined.
        4. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право отказа и переход к взысканию прямо предусмотрены:
        Фрагмент:
        "В случае непредоставления отступного в срок, установленный п. 2.3
        настоящего соглашения, Кредитор вправе отказаться от принятия
        отступного и потребовать от Должника исполнения первоначального
        обязательства в полном объеме, включая уплату неустойки, начисленной
        за период с даты просрочки."

        Ответ:
        {
          "creditor_refusal_right_status": "defined",
          "creditor_refusal_right_details": "Кредитор вправе отказаться от принятия отступного при просрочке",
          "revert_to_original_obligation_status": "defined",
          "revert_to_original_obligation_details": "Кредитор вправе потребовать исполнения первоначального обязательства в полном объёме",
          "deadline_for_offer_status": "defined",
          "deadline_for_offer_details": "Срок предоставления отступного установлен п. 2.3 настоящего соглашения",
          "continued_accrual_status": "defined",
          "continued_accrual_details": "Неустойка начисляется за период с даты просрочки",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "В случае непредоставления отступного в срок, установленный п. 2.3 настоящего соглашения, Кредитор вправе отказаться от принятия отступного и потребовать от Должника исполнения первоначального обязательства в полном объеме, включая уплату неустойки, начисленной за период с даты просрочки."
            }
          ]
        }

        Пример 2 — условие полностью не урегулировано:
        Фрагмент:
        "Должник обязуется передать отступное в течение 10 рабочих дней
        с даты подписания настоящего соглашения."

        Ответ:
        {
          "creditor_refusal_right_status": "not_defined",
          "creditor_refusal_right_details": "Не установлено",
          "revert_to_original_obligation_status": "not_defined",
          "revert_to_original_obligation_details": "Не установлено",
          "deadline_for_offer_status": "not_defined",
          "deadline_for_offer_details": "Не установлен",
          "continued_accrual_status": "not_defined",
          "continued_accrual_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — частичная определённость (только право на взыскание, без явного отказа):
        Фрагмент:
        "Если Должник не предоставит отступное в установленный срок, Кредитор
        вправе взыскать задолженность по первоначальному обязательству
        в судебном порядке."

        Ответ:
        {
          "creditor_refusal_right_status": "not_defined",
          "creditor_refusal_right_details": "Не установлено",
          "revert_to_original_obligation_status": "defined",
          "revert_to_original_obligation_details": "Кредитор вправе взыскать задолженность по первоначальному обязательству в судебном порядке",
          "deadline_for_offer_status": "not_defined",
          "deadline_for_offer_details": "Не установлен",
          "continued_accrual_status": "not_defined",
          "continued_accrual_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Если Должник не предоставит отступное в установленный срок, Кредитор вправе взыскать задолженность по первоначальному обязательству в судебном порядке."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стороны несут ответственность за неисполнение обязательств по
        настоящему соглашению в соответствии с действующим законодательством
        Российской Федерации."

        Ответ:
        {
          "creditor_refusal_right_status": "not_defined",
          "creditor_refusal_right_details": "Не установлено",
          "revert_to_original_obligation_status": "not_defined",
          "revert_to_original_obligation_details": "Не установлено",
          "deadline_for_offer_status": "not_defined",
          "deadline_for_offer_details": "Не установлен",
          "continued_accrual_status": "not_defined",
          "continued_accrual_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве кредитора отказаться от принятия
           просроченного отступного.
        2. Найди прямую цитату о праве потребовать исполнения первоначального
           обязательства — отдельно от права на отказ (см. Пример 3, где
           есть второе без первого).
        3. Найди прямую цитату о предельном сроке предоставления отступного.
        4. Найди прямую цитату о продолжении начисления процентов/неустойки
           по первоначальному обязательству при просрочке отступного.
        5. Проверь: не является ли формулировка общей фразой об "ответственности
           за неисполнение" без конкретного права на отказ или переход к
           первоначальному обязательству — если да, это not_defined.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.
        7. Не путай это условие с условием о сохранении права кредитора ДО
           передачи отступного — это разные вопросы (после просрочки vs до передачи).

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "creditor_refusal_right_status": "<defined / not_defined>",
          "creditor_refusal_right_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "revert_to_original_obligation_status": "<defined / not_defined>",
          "revert_to_original_obligation_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "deadline_for_offer_status": "<defined / not_defined>",
          "deadline_for_offer_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "continued_accrual_status": "<defined / not_defined>",
          "continued_accrual_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "event_of_default_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отказ от принятия отступного вправе отказаться потребовать исполнения первоначального обязательства просрочка предоставления отступного право на взыскание возврат к первоначальному обязательству предельный срок предоставления неустойка проценты при просрочке"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "срок передачи отступного"
        - "предмет отступного"
        - "стоимость отступного"
        - "момент прекращения обязательства"
        - "первоначальное обязательство сумма"
        - "залог"
        - "банкротство"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "creditor_refusal_and_default_remedy_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        формулировки о праве кредитора отказаться от принятия просроченного
        отступного, праве потребовать исполнения первоначального обязательства,
        предельном сроке предоставления отступного и продолжении начисления
        процентов/неустойки при просрочке.
        Не анализируй сам предмет отступного, его стоимость, момент прекращения
        обязательства при своевременном исполнении — это отдельные вопросы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. creditor_refusal_and_default_remedy_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме защиты
           кредитора при просрочке предоставления отступного.
           - "present" — если хотя бы одно из содержательных полей
             (creditor_refusal_right_status, revert_to_original_obligation_status,
              deadline_for_offer_status, continued_accrual_status) = "defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - creditor_refusal_right_status = "not_defined";
           - creditor_refusal_right_details = "Не установлено";
           - revert_to_original_obligation_status = "not_defined";
           - revert_to_original_obligation_details = "Не установлено";
           - deadline_for_offer_status = "not_defined";
           - deadline_for_offer_details = "Не установлен";
           - continued_accrual_status = "not_defined";
           - continued_accrual_details = "Не установлено";
           - не выполняй остальные шаги.

        1. creditor_refusal_right_status — "defined" если в тексте прямо
           предусмотрено право Кредитора отказаться от принятия отступного
           при просрочке его предоставления, иначе "not_defined". Общая фраза
           об "ответственности за неисполнение" без слов "отказаться от
           принятия" — not_defined.
        2. creditor_refusal_right_details — формулировка о праве на отказ.
           Формат: краткая фраза. Fallback — "Не установлено".
        3. revert_to_original_obligation_status — "defined" если в тексте прямо
           предусмотрено право Кредитора потребовать исполнения (в том числе
           взыскать в судебном порядке) первоначального обязательства вместо
           принятия просроченного отступного, иначе "not_defined". Это поле
           независимо от creditor_refusal_right_status — право взыскать долг
           может быть предусмотрено без явного упоминания слова "отказ" (см.
           пример с формулировкой "вправе взыскать задолженность в судебном
           порядке").
        4. revert_to_original_obligation_details — формулировка о праве
           потребовать исполнения первоначального обязательства. Fallback —
           "Не установлено".
        5. deadline_for_offer_status — "defined" если в тексте прямо указан
           предельный срок, после которого право на предоставление отступного
           считается утраченным (либо прямая отсылка к сроку из другого пункта
           соглашения), иначе "not_defined".
        6. deadline_for_offer_details — формулировка о предельном сроке.
           Fallback — "Не установлен".
        7. continued_accrual_status — "defined" если в тексте прямо указано,
           что проценты или неустойка по первоначальному обязательству
           продолжают начисляться в период просрочки предоставления отступного,
           иначе "not_defined".
        8. continued_accrual_details — формулировка о продолжении начисления.
           Fallback — "Не установлено".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни creditor_refusal_and_default_remedy_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = соответствующий fallback.
        - Используй только текст соглашения.
        - Не подставляй нормы закона, разъяснения Пленума ВС РФ или
          предположения вместо текста договора.
        - Общая фраза "стороны несут ответственность за неисполнение
          обязательств в соответствии с законодательством" без конкретного
          упоминания права на отказ, права требовать исполнения первоначального
          обязательства, срока или продолжения начисления — это not_defined
          для всех полей. Правило применяется без исключения.
        - creditor_refusal_right и revert_to_original_obligation — разные,
          хотя и связанные права: первое — про сам отказ принять отступное,
          второе — про переход к взысканию по первоначальному обязательству.
          Текст может предусматривать одно без явного упоминания другого
          (см. Пример 3 в prompt_template) — оценивай их независимо.
        - Не путай это условие с условием о сохранении права кредитора
          требовать исполнение ДО момента передачи отступного (это отдельный
          вопрос, проверяемый в другом check-е). Здесь речь о том, что
          происходит ПОСЛЕ наступления просрочки.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса и
          "Не удалось определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на отказ от просроченного отступного,
           ни права требовать исполнения первоначального обязательства,
           ни предельного срока предоставления, ни указания на продолжение
           начисления процентов/неустойки.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Стороны несут ответственность за неисполнение обязательств
           в соответствии с законодательством» без конкретного права на отказ
           и без перехода к первоначальному обязательству.
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = соответствующий fallback.

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о последствиях просрочки (в одном пункте — Кредитор вправе
           отказаться от отступного, в другом — обязан принять его и при
           просрочке), и конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: частичная определённость.
           В тексте прямо предусмотрено право Кредитора взыскать задолженность
           по первоначальному обязательству в судебном порядке при просрочке,
           но право на отказ от принятия отступного прямо не упомянуто.
           → presence = "present";
             revert_to_original_obligation_status = "defined";
             revert_to_original_obligation_details = "Кредитор вправе взыскать задолженность по первоначальному обязательству в судебном порядке";
             creditor_refusal_right_status = "not_defined";
             creditor_refusal_right_details = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для creditor_refusal_and_default_remedy_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * creditor_refusal_right_details → "Не установлено";
          * revert_to_original_obligation_details → "Не установлено";
          * deadline_for_offer_details → "Не установлен";
          * continued_accrual_details → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "creditor_refusal_and_default_remedy_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по защите кредитора при просрочке предоставления отступного. Внутреннее агрегатное signal-поле."
          required: true

        - name: "creditor_refusal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права Кредитора отказаться от принятия просроченного отступного. Внутреннее enum-поле."
          required: true

        - name: "creditor_refusal_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право отказа от просроченного отступного"
          description: >
            Формулировка о праве Кредитора отказаться от принятия отступного
            при просрочке его предоставления.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "revert_to_original_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права Кредитора потребовать исполнения первоначального обязательства. Внутреннее enum-поле."
          required: true

        - name: "revert_to_original_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Право требовать исполнения первоначального обязательства"
          description: >
            Формулировка о праве Кредитора потребовать исполнения (в том числе
            взыскать) первоначальное обязательство вместо просроченного
            отступного.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "deadline_for_offer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания предельного срока предоставления отступного. Внутреннее enum-поле."
          required: true

        - name: "deadline_for_offer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Предельный срок предоставления"
          description: >
            Формулировка о предельном сроке, после которого право на
            предоставление отступного считается утраченным.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false

        - name: "continued_accrual_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на продолжение начисления процентов/неустойки при просрочке. Внутреннее enum-поле."
          required: true

        - name: "continued_accrual_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Продолжение начисления при просрочке"
          description: >
            Формулировка о продолжении начисления процентов или неустойки
            по первоначальному обязательству в период просрочки предоставления
            отступного. Доступно в drawer.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
      store_payload: true

  - id: no_pending_litigation_over_subject_check
    name: "Заверения об отсутствии судебных споров и разбирательств в отношении предмета отступного"
    description: >
      Фактографическая проверка наличия заверений об отсутствии судебных
      споров, третейских разбирательств и обеспечительных мер в отношении
      предмета отступного, а также об отсутствии претензий третьих лиц,
      способных повлиять на переход права.
    triggers:
      any: ["warranty_goods", "real_estate_as_otsupnoe", "claim_assignment_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "судебный спор"
        - "судебное разбирательство"
        - "третейское разбирательство"
        - "обеспечительные меры"
        - "исковое заявление"
        - "не является предметом спора"
        - "отсутствуют претензии третьих лиц"
        - "оспаривание права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)судебн(ый|ого|ое)\\s+(спор|разбирательств)"
        - "(?i)третейск(ое|ого)\\s+разбирательств"
        - "(?i)обеспечительн(ые|ых)\\s+мер"
        - "(?i)не\\s+являет(ся|ются)\\s+предметом\\s+спор"
        - "(?i)оспарива(ние|ется)\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: есть ли в тексте заверения об
        отсутствии судебных споров, третейских разбирательств,
        обеспечительных мер и претензий третьих лиц в отношении предмета
        отступного.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ (заверения об обстоятельствах)
        - ст. 460 ГК РФ (обременения правами третьих лиц)

        Важно:
        - Не оценивай реальный уровень риска — фиксируй только текстовый факт.
        - Не путай судебный спор о праве на предмет отступного (например,
          иск об истребовании имущества, спор о праве собственности) с
          заверениями об отсутствии залога/ареста/прав третьих лиц (это
          отдельный вопрос, проверяемый в другом check-е) — обеспечительные
          меры (арест) могут отсутствовать, но при этом судебный спор о
          праве собственности может вестись без ареста.
        - Общая фраза вроде "Должник гарантирует отсутствие обстоятельств,
          препятствующих исполнению настоящего соглашения" без конкретного
          упоминания судебного спора, третейского разбирательства,
          обеспечительных мер или претензий третьих лиц — это NOT_DEFINED.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли заверение об отсутствии судебных споров в отношении
           предмета отступного.
        2. Есть ли заверение об отсутствии третейских разбирательств.
        3. Есть ли заверение об отсутствии обеспечительных мер в отношении
           предмета отступного.
        4. Есть ли заверение об отсутствии претензий третьих лиц, способных
           повлиять на переход права на предмет отступного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай наличие или отсутствие судебных споров.
        3. Общая фраза об "отсутствии препятствий" без конкретного упоминания
           спора/разбирательства/обеспечительных мер/претензий — это
           not_defined.
        4. Если прямо указано, что судебный спор существует — зафиксируй
           это как defined с описанием (это red flag, а не not_defined).
        5. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное заверение об отсутствии:
        Фрагмент:
        "Должник заверяет, что в отношении предмета отступного отсутствуют
        судебные споры, третейские разбирательства, обеспечительные меры,
        а также претензии третьих лиц, способные повлиять на переход права
        собственности к Кредитору."

        Ответ:
        {
          "litigation_status": "clean",
          "litigation_details": "Отсутствуют судебные споры в отношении предмета отступного",
          "arbitration_status": "clean",
          "arbitration_details": "Отсутствуют третейские разбирательства",
          "injunctions_status": "clean",
          "injunctions_details": "Отсутствуют обеспечительные меры",
          "third_party_claims_status": "clean",
          "third_party_claims_details": "Отсутствуют претензии третьих лиц, способные повлиять на переход права",
          "evidence": [
            {
              "clause_ref": "п. 5.5",
              "quote": "Должник заверяет, что в отношении предмета отступного отсутствуют судебные споры, третейские разбирательства, обеспечительные меры, а также претензии третьих лиц, способные повлиять на переход права собственности к Кредитору."
            }
          ]
        }

        Пример 2 — тема не упомянута:
        Фрагмент:
        "Должник передаёт Кредитору автомобиль Toyota Camry по акту
        приёма-передачи."

        Ответ:
        {
          "litigation_status": "absent",
          "litigation_details": "Заверение отсутствует в тексте",
          "arbitration_status": "absent",
          "arbitration_details": "Заверение отсутствует в тексте",
          "injunctions_status": "absent",
          "injunctions_details": "Заверение отсутствует в тексте",
          "third_party_claims_status": "absent",
          "third_party_claims_details": "Заверение отсутствует в тексте",
          "evidence": []
        }

        Пример 3 — прямое указание на наличие спора (red flag):
        Фрагмент:
        "Должнику известно, что в отношении предмета отступного (земельного
        участка) в Арбитражном суде рассматривается дело №А40-12345/2024
        по иску ООО «Сигма» об истребовании имущества из чужого незаконного
        владения."

        Ответ:
        {
          "litigation_status": "disputed",
          "litigation_details": "В Арбитражном суде рассматривается дело №А40-12345/2024 по иску ООО «Сигма» об истребовании имущества",
          "arbitration_status": "absent",
          "arbitration_details": "Заверение отсутствует в тексте",
          "injunctions_status": "absent",
          "injunctions_details": "Заверение отсутствует в тексте",
          "third_party_claims_status": "disputed",
          "third_party_claims_details": "ООО «Сигма» предъявляет иск об истребовании имущества из чужого незаконного владения",
          "evidence": [
            {
              "clause_ref": "п. 5.6",
              "quote": "Должнику известно, что в отношении предмета отступного (земельного участка) в Арбитражном суде рассматривается дело №А40-12345/2024 по иску ООО «Сигма» об истребовании имущества из чужого незаконного владения."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Должник гарантирует отсутствие каких-либо обстоятельств,
        препятствующих исполнению настоящего соглашения, в соответствии
        с действующим законодательством Российской Федерации."

        Ответ:
        {
          "litigation_status": "absent",
          "litigation_details": "Заверение отсутствует в тексте",
          "arbitration_status": "absent",
          "arbitration_details": "Заверение отсутствует в тексте",
          "injunctions_status": "absent",
          "injunctions_details": "Заверение отсутствует в тексте",
          "third_party_claims_status": "absent",
          "third_party_claims_details": "Заверение отсутствует в тексте",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отсутствии или наличии судебного спора
           в отношении предмета отступного.
        2. Найди прямую цитату об отсутствии или наличии третейского
           разбирательства.
        3. Найди прямую цитату об отсутствии или наличии обеспечительных мер.
        4. Найди прямую цитату об отсутствии или наличии претензий третьих лиц.
        5. Проверь: не является ли формулировка общей фразой об "отсутствии
           препятствий" без конкретного упоминания спора/разбирательства/
           обеспечительных мер/претензий — если да, статус "absent".
        6. Если текст прямо указывает на наличие спора/разбирательства/мер/
           претензий — зафиксируй как "disputed", а не "absent" (это
           значимый факт, а не отсутствие данных).
        7. Не путай это с обременениями (залог/арест) на предмет отступного —
           это отдельный вопрос.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "litigation_status": "<absent / clean / disputed>",
          "litigation_details": "<текст или 'Заверение отсутствует в тексте'>",
          "arbitration_status": "<absent / clean / disputed>",
          "arbitration_details": "<текст или 'Заверение отсутствует в тексте'>",
          "injunctions_status": "<absent / clean / disputed>",
          "injunctions_details": "<текст или 'Заверение отсутствует в тексте'>",
          "third_party_claims_status": "<absent / clean / disputed>",
          "third_party_claims_details": "<текст или 'Заверение отсутствует в тексте'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "судебный спор судебное разбирательство третейское разбирательство обеспечительные меры исковое заявление не является предметом спора отсутствуют претензии третьих лиц оспаривание права истребование имущества"
      preferred_unit_types:
        - warranty
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
      negative_keywords:
        - "не заложено"
        - "не арестовано"
        - "свободно от прав третьих лиц"
        - "залог прекращается"
        - "стоимость отступного"
        - "банкротство"
        - "неплатежеспособность"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "no_pending_litigation_over_subject_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        заверения об отсутствии судебных споров, третейских разбирательств,
        обеспечительных мер и претензий третьих лиц в отношении предмета
        отступного.
        Не анализируй залог, арест или права третьих лиц как обременения —
        это отдельный вопрос (проверяется в другом check-е). Здесь речь идёт
        именно о судебных/третейских разбирательствах и заявленных претензиях.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. no_pending_litigation_over_subject_check_presence:
           Агрегатное signal-поле — наличие регулирования по заверениям
           об отсутствии судебных споров и разбирательств в отношении
           предмета отступного.
           - "present" — если хотя бы одно из содержательных полей
             (litigation_status, arbitration_status, injunctions_status,
              third_party_claims_status) ∈ {"clean", "disputed"};
           - "missing" — если все четыре содержательных поля = "absent";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - litigation_status = "absent";
           - litigation_details = "Заверение отсутствует в тексте";
           - arbitration_status = "absent";
           - arbitration_details = "Заверение отсутствует в тексте";
           - injunctions_status = "absent";
           - injunctions_details = "Заверение отсутствует в тексте";
           - third_party_claims_status = "absent";
           - third_party_claims_details = "Заверение отсутствует в тексте";
           - не выполняй остальные шаги.

        1. litigation_status — "absent" (тема не упомянута) / "clean" (прямо
           заверено отсутствие судебных споров) / "disputed" (прямо указано
           на наличие судебного спора). Общая фраза "отсутствие препятствий
           к исполнению" без слова "спор"/"разбирательство" — это "absent".
        2. litigation_details — формулировка об отсутствии или наличии
           судебного спора. Формат: краткая фраза, включая номер дела и
           стороны, если указаны. Fallback при "absent" — "Заверение
           отсутствует в тексте".
        3. arbitration_status — "absent" / "clean" / "disputed" — аналогично
           для третейских разбирательств.
        4. arbitration_details — соответствующая формулировка. Fallback —
           "Заверение отсутствует в тексте".
        5. injunctions_status — "absent" / "clean" / "disputed" — аналогично
           для обеспечительных мер (не путать с залогом/арестом как
           обременением имущества — здесь речь о мерах, принятых судом
           в рамках спора).
        6. injunctions_details — соответствующая формулировка. Fallback —
           "Заверение отсутствует в тексте".
        7. third_party_claims_status — "absent" / "clean" / "disputed" —
           аналогично для претензий третьих лиц, способных повлиять на
           переход права.
        8. third_party_claims_details — соответствующая формулировка.
           Fallback — "Заверение отсутствует в тексте".

        Оценивай все четыре темы независимо друг от друга — наличие судебного
        спора не означает автоматически наличие обеспечительных мер, и наоборот
        (см. Пример 3, где спор есть, а обеспечительных мер и третейского
        разбирательства нет).

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "disputed" (более рискованная трактовка
          указывается явно)
        - соответствующее текстовое поле → "Не удалось определить: в тексте
          есть противоречивые формулировки"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни no_pending_litigation_over_subject_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "absent", все *_details = "Заверение отсутствует в тексте".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "гарантирует отсутствие каких-либо обстоятельств,
          препятствующих исполнению соглашения" без конкретного упоминания
          судебного спора, третейского разбирательства, обеспечительных мер
          или претензий третьих лиц — это "absent" для всех четырёх полей.
          Правило применяется без исключения.
        - Не путай судебный спор или обеспечительные меры (предмет этого
          check-а) с залогом, арестом как обременением имущества или правами
          третьих лиц на само имущество (это отдельный вопрос, проверяемый
          в другом check-е). Обеспечительные меры здесь — это меры, принятые
          судом в рамках рассматриваемого спора (запрет на распоряжение,
          арест как обеспечительная мера иска), а не залог как способ
          обеспечения обязательства.
        - Если текст прямо указывает на наличие спора, разбирательства, мер
          или претензий — это "disputed", а не "absent"; такая находка
          является самостоятельным значимым фактом, а не отсутствием данных.
        - Оценивай litigation, arbitration, injunctions и third_party_claims
          независимо друг от друга.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений об отсутствии споров и разбирательств,
           ни упоминаний об обеспечительных мерах и претензиях третьих лиц
           в отношении предмета отступного.
           → presence = "missing";
             все статусы = "absent";
             все *_details = "Заверение отсутствует в тексте".

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Должник гарантирует отсутствие каких-либо обстоятельств,
           препятствующих исполнению соглашения» без конкретного упоминания
           судебного спора, третейского разбирательства, обеспечительных мер
           или претензий третьих лиц.
           → presence = "missing";
             все статусы = "absent";
             все *_details = "Заверение отсутствует в тексте".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           (в одном пункте — заверение об отсутствии спора, в другом —
           упоминание о наличии судебного разбирательства), и конфликт
           нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус = "disputed";
             соответствующее *_details = "Не удалось определить: в тексте есть противоречивые формулировки".

        4. Специфика темы: прямое указание на наличие спора (red flag).
           В тексте прямо указано, что в отношении предмета отступного
           рассматривается судебный спор (например, дело в арбитражном суде
           по иску третьего лица об истребовании имущества).
           → presence = "present";
             litigation_status = "disputed";
             litigation_details = точная формулировка из текста (например,
             «В Арбитражном суде рассматривается дело №А40-12345/2024 по иску ООО «Сигма» об истребовании имущества»);
             third_party_claims_status = "disputed";
             third_party_claims_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для no_pending_litigation_over_subject_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "absent", "clean" или "disputed".
        - Fallback при отсутствии данных:
          * все *_details → "Заверение отсутствует в тексте".
        - Fallback при противоречии или неоднозначности:
          * соответствующий статус → "disputed";
          * соответствующее *_details → "Не удалось определить: в тексте есть противоречивые формулировки".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "no_pending_litigation_over_subject_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений об отсутствии судебных споров и разбирательств в отношении предмета отступного. Внутреннее агрегатное signal-поле."
          required: true

        - name: "litigation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "clean", "disputed"]
          display_in_grid: false
          description: "Статус заверения об отсутствии судебных споров. Внутреннее enum-поле."
          required: true

        - name: "litigation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Судебные споры"
          description: >
            Формулировка об отсутствии или наличии судебного спора в отношении
            предмета отступного.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "arbitration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "clean", "disputed"]
          display_in_grid: false
          description: "Статус заверения об отсутствии третейских разбирательств. Внутреннее enum-поле."
          required: true

        - name: "arbitration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Третейские разбирательства"
          description: >
            Формулировка об отсутствии или наличии третейского разбирательства
            в отношении предмета отступного.
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "injunctions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "clean", "disputed"]
          display_in_grid: false
          description: "Статус заверения об отсутствии обеспечительных мер. Внутреннее enum-поле."
          required: true

        - name: "injunctions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Обеспечительные меры"
          description: >
            Формулировка об отсутствии или наличии обеспечительных мер,
            принятых судом в рамках спора (не залог/арест как обременение).
            Fallback: "Заверение отсутствует в тексте".
          required: true

        - name: "third_party_claims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "clean", "disputed"]
          display_in_grid: false
          description: "Статус заверения об отсутствии претензий третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "third_party_claims_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Претензии третьих лиц"
          description: >
            Формулировка об отсутствии или наличии претензий третьих лиц,
            способных повлиять на переход права на предмет отступного.
            Fallback: "Заверение отсутствует в тексте".
          required: true
      store_payload: true

  - id: agreement_form_and_notarization_check
    name: "Форма соглашения об отступном и обязательность нотариального удостоверения"
    description: >
      Фактографическая проверка того, соблюдена ли форма, обязательная для
      данного соглашения об отступном в силу вида передаваемого предмета
      (например, нотариальное удостоверение при отчуждении доли в уставном
      капитале ООО), и содержит ли текст указание на нотариальное
      удостоверение самого соглашения, а не на регистрацию перехода права.
    triggers:
      any: ["claim_assignment_as_otsupnoe", "real_estate_as_otsupnoe", "general_sale_subject"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "нотариально удостоверено"
        - "нотариальное удостоверение"
        - "доля в уставном капитале"
        - "простая письменная форма"
        - "нотариус"
        - "удостоверено нотариусом"
        - "требования к форме сделки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн[а-я]+\\s+удостоверен"
        - "(?i)удостоверен[а-я]+\\s+нотариус"
        - "(?i)доля\\s+в\\s+уставном\\s+капитал"
        - "(?i)простой\\s+письменн[а-я]+\\s+форм"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: соблюдена ли форма, обязательная
        именно для самого соглашения как документа (не для регистрации
        перехода права на предмет отступного — это отдельный вопрос,
        проверяемый в другом check-е).

        Нормативный ориентир:
        - ст. 163 ГК РФ (нотариальная форма сделок)
        - ст. 21 ФЗ-14 «Об ООО» (обязательное нотариальное удостоверение
          сделок по отчуждению доли в уставном капитале)
        - ст. 165 ГК РФ (последствия несоблюдения нотариальной формы —
          ничтожность сделки)

        Важно:
        - КРИТИЧЕСКИ ВАЖНО: не путай нотариальное удостоверение САМОГО
          СОГЛАШЕНИЯ об отступном как документа с государственной
          регистрацией ПЕРЕХОДА ПРАВА собственности на недвижимость
          (это отдельный вопрос, проверяемый в другом check-е). Здесь
          проверяется форма самого договора, а не последующие регистрационные
          действия с объектом.
        - Если предметом отступного является доля в уставном капитале ООО,
          нотариальное удостоверение сделки по общему правилу обязательно
          в силу закона, и его отсутствие означает ничтожность сделки —
          но ты фиксируешь только то, что прямо есть в тексте, не оценивая
          последствия.
        - Общая фраза вроде "настоящее соглашение вступает в силу с момента
          подписания сторонами" без указания на нотариальную или простую
          письменную форму НЕ является основанием для "defined" по вопросу
          формы сделки — это not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли прямо, что соглашение нотариально удостоверено.
        2. Указана ли прямо простая письменная форма соглашения (без нотариуса).
        3. Есть ли в тексте признаки предмета, для которого нотариальная форма
           обязательна по закону (доля в уставном капитале ООО, иные прямо
           поименованные случаи).
        4. Если соглашение нотариально удостоверено — указаны ли реквизиты
           нотариального удостоверения (нотариус, реестровый номер, дата).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не делай самостоятельный вывод о том, требуется ли нотариальная
           форма по закону для конкретного случая — фиксируй только то, что
           прямо есть в тексте, но отдельно фиксируй наличие признаков
           предмета (доля в ООО), который обычно требует нотариальной формы.
        3. Не путай нотариальное удостоверение соглашения с государственной
           регистрацией перехода права на предмет отступного.
        4. Общая фраза о "вступлении в силу с момента подписания" без
           указания формы — это not_defined.
        5. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — нотариально удостоверено с реквизитами:
        Фрагмент:
        "Настоящее соглашение удостоверено нотариусом города Москвы Петровой
        А.А., зарегистрировано в реестре за № 77/123-н/77-2024-5-678."

        Ответ:
        {
          "notarization_status": "notarized",
          "notarization_status_display": "Нотариально удостоверено",
          "notarization_details": "Удостоверено нотариусом города Москвы Петровой А.А.",
          "notarization_reference_status": "defined",
          "notarization_reference_details": "Зарегистрировано в реестре за № 77/123-н/77-2024-5-678",
          "share_transfer_form_risk_status": "not_defined",
          "share_transfer_form_risk_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "Заключительные положения",
              "quote": "Настоящее соглашение удостоверено нотариусом города Москвы Петровой А.А., зарегистрировано в реестре за № 77/123-н/77-2024-5-678."
            }
          ]
        }

        Пример 2 — простая письменная форма, предмет не требует нотариуса:
        Фрагмент:
        "Настоящее соглашение составлено в простой письменной форме в двух
        экземплярах, имеющих равную юридическую силу."

        Ответ:
        {
          "notarization_status": "simple_written",
          "notarization_status_display": "Простая письменная форма",
          "notarization_details": "Составлено в простой письменной форме в двух экземплярах",
          "notarization_reference_status": "not_defined",
          "notarization_reference_details": "Не установлено",
          "share_transfer_form_risk_status": "not_defined",
          "share_transfer_form_risk_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Настоящее соглашение составлено в простой письменной форме в двух экземплярах, имеющих равную юридическую силу."
            }
          ]
        }

        Пример 3 — red flag: доля в ООО передаётся, но нотариус не упомянут:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору долю в размере 30%
        в уставном капитале ООО «Технопром». Настоящее соглашение вступает
        в силу с момента подписания сторонами."

        Ответ:
        {
          "notarization_status": "not_defined",
          "notarization_status_display": "Не установлена",
          "notarization_details": "Форма соглашения прямо не указана",
          "notarization_reference_status": "not_defined",
          "notarization_reference_details": "Не установлено",
          "share_transfer_form_risk_status": "defined",
          "share_transfer_form_risk_details": "Предметом отступного является доля в уставном капитале ООО «Технопром»; нотариальное удостоверение соглашения в тексте не упомянуто",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору долю в размере 30% в уставном капитале ООО «Технопром». Настоящее соглашение вступает в силу с момента подписания сторонами."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Настоящее соглашение вступает в силу с момента подписания сторонами
        и действует до полного исполнения обязательств в соответствии с
        действующим законодательством Российской Федерации."

        Ответ:
        {
          "notarization_status": "not_defined",
          "notarization_status_display": "Не установлена",
          "notarization_details": "Форма соглашения прямо не указана",
          "notarization_reference_status": "not_defined",
          "notarization_reference_details": "Не установлено",
          "share_transfer_form_risk_status": "not_defined",
          "share_transfer_form_risk_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о нотариальном удостоверении или простой
           письменной форме самого соглашения.
        2. Если нотариально удостоверено — найди реквизиты (нотариус,
           реестровый номер).
        3. Проверь, является ли предметом отступного доля в уставном капитале
           ООО или иной актив, обычно требующий нотариальной формы — если да,
           а нотариус не упомянут, зафиксируй это как red flag через
           share_transfer_form_risk_status = "defined".
        4. Проверь: не является ли формулировка общей фразой о "вступлении
           в силу с момента подписания" без указания формы — если да,
           notarization_status = "not_defined".
        5. Не путай нотариальное удостоверение соглашения с регистрацией
           перехода права на предмет отступного.
        6. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "notarization_status": "<notarized / simple_written / not_defined>",
          "notarization_status_display": "<Нотариально удостоверено / Простая письменная форма / Не установлена>",
          "notarization_details": "<текст или 'Форма соглашения прямо не указана' / 'Не удалось определить'>",
          "notarization_reference_status": "<defined / not_defined>",
          "notarization_reference_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "share_transfer_form_risk_status": "<defined / not_defined>",
          "share_transfer_form_risk_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нотариально удостоверено нотариальное удостоверение доля в уставном капитале простая письменная форма нотариус удостоверено нотариусом требования к форме сделки реестровый номер"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "государственная регистрация перехода права"
        - "ЕГРН"
        - "кадастровый номер"
        - "залог"
        - "банкротство"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "agreement_form_and_notarization_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о форме самого соглашения (нотариальная или простая
        письменная), реквизитах нотариального удостоверения, если оно есть,
        и о наличии признаков предмета (доля в уставном капитале ООО),
        для которого нотариальная форма обязательна по закону.
        КРИТИЧЕСКИ ВАЖНО: не анализируй государственную регистрацию перехода
        права на предмет отступного (недвижимость) — это отдельный вопрос,
        проверяемый в другом check-е. Здесь речь только о форме самого
        соглашения как документа.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. agreement_form_and_notarization_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме формы
           соглашения и обязательного нотариального удостоверения.
           - "present" — если хотя бы одно из содержательных полей
             находится в «информативном» состоянии:
             notarization_status ∈ {"notarized", "simple_written"} ИЛИ
             notarization_reference_status = "defined" ИЛИ
             share_transfer_form_risk_status = "defined";
           - "missing" — если notarization_status = "not_defined" И
             notarization_reference_status = "not_defined" И
             share_transfer_form_risk_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notarization_status = "not_defined";
           - notarization_status_display = "Не установлена";
           - notarization_details = "Форма соглашения прямо не указана";
           - notarization_reference_status = "not_defined";
           - notarization_reference_details = "Не установлено";
           - share_transfer_form_risk_status = "not_defined";
           - share_transfer_form_risk_details = "Не установлено";
           - не выполняй остальные шаги.

        1. notarization_status — "notarized" (соглашение прямо указано как
           нотариально удостоверенное) / "simple_written" (прямо указана
           простая письменная форма без нотариуса) / "not_defined" (форма
           прямо не указана). Общая фраза "вступает в силу с момента
           подписания" без слов "нотариально"/"письменная форма" — not_defined.
        2. notarization_status_display — читаемое отображение формы соглашения:
           - "Нотариально удостоверено" — если notarization_status = "notarized";
           - "Простая письменная форма" — если notarization_status = "simple_written";
           - "Не установлена" — если notarization_status = "not_defined".
        3. notarization_details — формулировка о форме соглашения. Формат:
           краткая фраза. Fallback — "Форма соглашения прямо не указана".
        4. notarization_reference_status — "defined" если указаны реквизиты
           нотариального удостоверения (ФИО нотариуса, город, реестровый
           номер, дата), иначе "not_defined".
        5. notarization_reference_details — реквизиты нотариального
           удостоверения. Fallback — "Не установлено".
        6. share_transfer_form_risk_status — "defined" если предметом
           отступного прямо названа доля в уставном капитале ООО (или иной
           актив, для которого по закону обычно требуется нотариальная форма),
           а нотариальное удостоверение соглашения в тексте не подтверждено,
           иначе "not_defined". Это поле фиксирует потенциальный риск
           несоблюдения обязательной формы, а не оценивает его юридически.
        7. share_transfer_form_risk_details — описание ситуации: какой актив
           передаётся и что нотариальное удостоверение не подтверждено.
           Fallback — "Не установлено".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - notarization_status_display → "Не установлена"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни agreement_form_and_notarization_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы = "not_defined", все *_details = соответствующий fallback, notarization_status_display = "Не установлена".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза "соглашение вступает в силу с момента подписания
          сторонами" или "действует до полного исполнения обязательств" без
          конкретного упоминания нотариальной или письменной формы — это
          not_defined для notarization_status. Правило применяется без
          исключения.
        - Не путай нотариальное удостоверение соглашения об отступном как
          документа с государственной регистрацией перехода права на предмет
          отступного (недвижимость) — это разные действия и разные вопросы.
          Регистрация перехода права проверяется в другом check-е.
        - notarization_status_display формируется ТОЛЬКО из значения
          notarization_status по правилу из пункта 2 task.
        - share_transfer_form_risk_status = "defined" только если предмет
          отступного прямо назван долей в уставном капитале ООО (или иным
          прямо поименованным активом с обязательной нотариальной формой),
          и при этом нотариальное удостоверение самого соглашения в тексте
          не подтверждено. Не делай юридического вывода о ничтожности сделки —
          только фиксируй текстовый факт наличия такого сочетания.
        - Если соглашение нотариально удостоверено, но реквизиты (нотариус,
          номер, дата) не приведены — notarization_status = "notarized",
          но notarization_reference_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые сведения о форме
          сделки и конфликт нельзя разрешить по тексту, верни "not_defined"
          для статуса и "Не удалось определить" для текстового поля,
          notarization_status_display = "Не установлена".
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни указания на нотариальную или простую письменную
           форму соглашения, ни признаков предмета, требующего нотариальной
           формы (доля в ООО).
           → presence = "missing";
             все статусы = "not_defined";
             все *_details = соответствующий fallback;
             notarization_status_display = "Не установлена".

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Соглашение вступает в силу с момента подписания сторонами
           и действует до полного исполнения обязательств» без указания
           конкретной формы и без признаков предмета с обязательной
           нотариальной формой.
           → presence = "missing";
             notarization_status = "not_defined";
             notarization_status_display = "Не установлена";
             notarization_details = "Форма соглашения прямо не указана".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о форме (в одном пункте — нотариальная, в другом — простая
           письменная), и конфликт нельзя снять по тексту.
           → presence = "unclear";
             notarization_status = "not_defined";
             notarization_status_display = "Не установлена";
             notarization_details = "Не удалось определить".

        4. Специфика темы: red flag — доля в ООО без нотариуса.
           Предметом отступного прямо названа доля в уставном капитале ООО,
           но нотариальное удостоверение самого соглашения в тексте
           не подтверждено (прямо не упомянуто или указана простая
           письменная форма).
           → presence = "present";
             share_transfer_form_risk_status = "defined";
             share_transfer_form_risk_details = "Предметом отступного является
             доля в уставном капитале ООО «...»; нотариальное удостоверение
             соглашения в тексте не упомянуто".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для agreement_form_and_notarization_check_presence используй только: "present", "missing", "unclear".
        - Для notarization_status используй только: "notarized", "simple_written" или "not_defined".
        - Для notarization_status_display используй только: "Нотариально удостоверено",
          "Простая письменная форма" или "Не установлена".
        - Для остальных статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * notarization_details → "Форма соглашения прямо не указана";
          * notarization_reference_details → "Не установлено";
          * share_transfer_form_risk_details → "Не установлено";
          * notarization_status_display → "Не установлена".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * notarization_status_display → "Не установлена".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "agreement_form_and_notarization_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по форме соглашения и обязательному нотариальному удостоверению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notarization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["notarized", "simple_written", "not_defined"]
          display_in_grid: false
          description: "Форма соглашения. Внутреннее enum-поле, отображается через notarization_status_display."
          required: true

        - name: "notarization_status_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Форма соглашения"
          description: >
            Читаемое отображение формы соглашения: "Нотариально удостоверено",
            "Простая письменная форма" или "Не установлена".
          required: true

        - name: "notarization_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания реквизитов нотариального удостоверения. Внутреннее enum-поле."
          required: true

        - name: "notarization_reference_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Реквизиты нотариального удостоверения"
          description: >
            Реквизиты нотариального удостоверения (нотариус, реестровый номер,
            дата), если соглашение нотариально удостоверено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "share_transfer_form_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус потенциального риска несоблюдения обязательной нотариальной формы. Внутреннее enum-поле."
          required: true

        - name: "share_transfer_form_risk_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Риск несоблюдения обязательной формы"
          description: >
            Описание ситуации, когда предмет отступного требует по закону
            нотариальной формы (например, доля в уставном капитале ООО),
            а нотариальное удостоверение соглашения в тексте не подтверждено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "notarization_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Форма соглашения (детали)"
          description: >
            Формулировка о форме соглашения и её нотариальном удостоверении.
            Fallback: "Форма соглашения прямо не указана" / "Не удалось определить".
          required: true
      store_payload: true

  - id: securities_as_otsupnoe_specifics_check
    name: "Специальные условия для ценных бумаг как отступного"
    description: >
      Фактографическая проверка специальных условий, если предметом отступного
      являются ценные бумаги (акции, облигации, векселя и др.): идентификация
      выпуска, механизм передачи (депо / передаточное распоряжение / сертификат /
      индоссамент), преимущественное право других акционеров/участников,
      ограничения в уставе, уведомление эмитента и регистратора/депозитария.
    triggers:
      any: ["securities_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акции"
        - "облигации"
        - "вексель"
        - "ценные бумаги"
        - "бездокументарные"
        - "эмитент"
        - "регистратор"
        - "депозитарий"
        - "передаточное распоряжение"
        - "индоссамент"
        - "ISIN"
        - "преимущественное право"
        - "сертификат ценной бумаги"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ценн(ые|ых|ой)\\s+бумаг"
        - "(?i)акци[йяю]|облигаци[йяю]|вексел"
        - "(?i)бездокументарн"
        - "(?i)передаточн(ое|ого)\\s+распоряжен"
        - "(?i)индоссамент"
        - "(?i)преимущественн(ое|ого)\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ, где предметом
        отступного являются ценные бумаги.
        Проверяется только один вопрос: специальные условия для ценных бумаг
        как предмета отступного.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ст. 128, 142–149.2 ГК РФ — ценные бумаги, бездокументарные бумаги
        - ст. 7 ФЗ-208 «Об АО» — преимущественное право акционеров
        - ст. 21 ФЗ-14 «Об ООО» — при отчуждении доли по аналогии
        - ФЗ-39 «О рынке ценных бумаг», гл. 7 — учёт прав, депозитарий,
          регистратор, передаточное распоряжение

        Важно:
        - Не оценивай серьёзность риска — устанавливай только то, что прямо
          есть в тексте соглашения.
        - Не подменяй текст договора нормами закона.
        - КРИТИЧЕСКИ ВАЖНО: различай бездокументарные ценные бумаги (учёт
          прав — у регистратора или депозитария, передача — через передаточное
          распоряжение / списание-зачисление по счёту депо), документарные
          ценные бумаги (передача сертификата) и ордерные ценные бумаги
          (передача через индоссамент, например вексель). Механизм передачи
          у них разный.
        - Если идентификация выпуска (ISIN, регистрационный номер, эмитент)
          или механизм передачи определяются через отсылку к приложению,
          спецификации, реестру — это не отсутствие регулирования.
        - Общая фраза вроде "ценные бумаги передаются в порядке, установленном
          законодательством" (без описания конкретного механизма передачи),
          "соблюдение прав иных акционеров обеспечивается сторонами" (без
          конкретного указания на преимущественное право и процедуру его
          соблюдения), "уведомление эмитента осуществляется надлежащим
          образом" (без указания, кто, когда и как уведомляет) НЕ является
          основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Какой тип ценных бумаг указан (акции, облигации, вексель, иное).
        2. Есть ли идентификация выпуска (ISIN, регистрационный номер, эмитент).
        3. Какой механизм передачи указан (депо/передаточное распоряжение,
           передача сертификата, индоссамент, иное).
        4. Как урегулировано преимущественное право иных акционеров/участников.
        5. Есть ли ограничения на отчуждение в уставе эмитента.
        6. Есть ли условие об уведомлении эмитента, регистратора или депозитария.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай реквизиты выпуска, механизм передачи или наличие
           преимущественного права.
        3. Не подменяй текст нормой закона.
        4. Если условие определяется через отсылку к приложению, спецификации
           или реестру — отражай это как понятную формулировку.
        5. Общая фраза без конкретного механизма передачи, конкретного
           указания на преимущественное право и процедуру его соблюдения,
           или конкретного порядка уведомления — это not_defined, а не defined.
        6. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        7. В evidence включай только цитаты из соглашения.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены, бездокументарные акции:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору 1 000 обыкновенных
        именных бездокументарных акций ПАО «Технопром», государственный
        регистрационный номер выпуска 1-01-12345-A, ISIN RU000A0XXXXXX.
        Передача акций осуществляется путем списания с лицевого счета Должника
        и зачисления на лицевой счет Кредитора у регистратора АО «Реестр-Р».
        Должник подтверждает, что преимущественное право иных акционеров
        на приобретение акций не применяется в силу отсутствия таких
        акционеров. Ограничения на отчуждение акций уставом ПАО «Технопром»
        не установлены."

        Ответ:
        {
          "securities_type": "shares",
          "securities_type_display": "Акции",
          "securities_identification_status": "defined",
          "securities_identification_details": "1 000 обыкновенных именных бездокументарных акций ПАО «Технопром», гос. рег. № 1-01-12345-A, ISIN RU000A0XXXXXX",
          "transfer_mechanism": "depo_transfer",
          "transfer_mechanism_display": "Списание/зачисление по лицевому счету",
          "preemptive_right_status": "excluded",
          "preemptive_right_details": "Преимущественное право не применяется в силу отсутствия иных акционеров",
          "charter_restrictions_status": "clean",
          "charter_restrictions_details": "Ограничения на отчуждение акций уставом эмитента не установлены",
          "issuer_notification_status": "defined",
          "issuer_notification_details": "Передача осуществляется через регистратора АО «Реестр-Р»",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору 1 000 обыкновенных именных бездокументарных акций ПАО «Технопром», государственный регистрационный номер выпуска 1-01-12345-A, ISIN RU000A0XXXXXX. Передача акций осуществляется путем списания с лицевого счета Должника и зачисления на лицевой счет Кредитора у регистратора АО «Реестр-Р». Должник подтверждает, что преимущественное право иных акционеров на приобретение акций не применяется в силу отсутствия таких акционеров. Ограничения на отчуждение акций уставом ПАО «Технопром» не установлены."
            }
          ]
        }

        Пример 2 — условия не определены:
        Фрагмент:
        "В качестве отступного передаются ценные бумаги."

        Ответ:
        {
          "securities_type": "not_defined",
          "securities_type_display": "Не установлен",
          "securities_identification_status": "not_defined",
          "securities_identification_details": "Не установлены",
          "transfer_mechanism": "not_defined",
          "transfer_mechanism_display": "Не установлен",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Не урегулировано",
          "charter_restrictions_status": "not_defined",
          "charter_restrictions_details": "Не установлено",
          "issuer_notification_status": "not_defined",
          "issuer_notification_details": "Не предусмотрено",
          "evidence": []
        }

        Пример 3 — идентификация через приложение, индоссамент по векселю:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору простой вексель
        эмитента ООО «Финанс-Групп» согласно перечню, указанному в Приложении
        №1. Передача векселя осуществляется путем совершения на его обороте
        бланкового индоссамента."

        Ответ:
        {
          "securities_type": "bills",
          "securities_type_display": "Векселя",
          "securities_identification_status": "defined",
          "securities_identification_details": "Простой вексель ООО «Финанс-Групп» согласно Приложению №1",
          "transfer_mechanism": "endorsement",
          "transfer_mechanism_display": "Индоссамент",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Не урегулировано",
          "charter_restrictions_status": "not_defined",
          "charter_restrictions_details": "Не установлено",
          "issuer_notification_status": "not_defined",
          "issuer_notification_details": "Не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "В качестве отступного Должник передает Кредитору простой вексель эмитента ООО «Финанс-Групп» согласно перечню, указанному в Приложении №1. Передача векселя осуществляется путем совершения на его обороте бланкового индоссамента."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Ценные бумаги передаются в порядке, установленном действующим
        законодательством Российской Федерации. Соблюдение прав иных
        акционеров обеспечивается сторонами в соответствии с законом."

        Ответ:
        {
          "securities_type": "not_defined",
          "securities_type_display": "Не установлен",
          "securities_identification_status": "not_defined",
          "securities_identification_details": "Не установлены",
          "transfer_mechanism": "not_defined",
          "transfer_mechanism_display": "Не установлен",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Не урегулировано",
          "charter_restrictions_status": "not_defined",
          "charter_restrictions_details": "Не установлено",
          "issuer_notification_status": "not_defined",
          "issuer_notification_details": "Не предусмотрено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе ценных бумаг (акции/облигации/вексель/иное).
        2. Найди прямую цитату об идентификации выпуска (ISIN, регистрационный
           номер, эмитент).
        3. Найди прямую цитату о механизме передачи; убедись, что он описан
           конкретно (списание/зачисление, сертификат, индоссамент), а не общей
           отсылкой к закону.
        4. Найди прямую цитату о преимущественном праве; убедись, что указано
           конкретное основание (отсутствие акционеров, отказ от преимущественного
           права, непубличное общество и т.п.).
        5. Найди прямую цитату об ограничениях в уставе эмитента.
        6. Найди прямую цитату об уведомлении эмитента/регистратора/депозитария
           с конкретным порядком, а не общей отсылкой к закону.
        7. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "securities_type": "<shares / bonds / bills / mixed / other / not_defined>",
          "securities_type_display": "<Акции / Облигации / Векселя / Смешанный набор / Иные ценные бумаги / Не установлен>",
          "securities_identification_status": "<defined / not_defined>",
          "securities_identification_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "transfer_mechanism": "<depo_transfer / transfer_order / certificate_delivery / endorsement / mixed / not_defined>",
          "transfer_mechanism_display": "<Списание/зачисление по лицевому счету / Передаточное распоряжение / Передача сертификата / Индоссамент / Смешанный механизм / Не установлен>",
          "preemptive_right_status": "<clean / excluded / disputed / not_defined>",
          "preemptive_right_details": "<текст или 'Не урегулировано' / 'Не удалось определить'>",
          "charter_restrictions_status": "<clean / restricted / not_defined>",
          "charter_restrictions_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "issuer_notification_status": "<defined / not_defined>",
          "issuer_notification_details": "<текст или 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ценные бумаги акции облигации вексель бездокументарные эмитент регистратор депозитарий передаточное распоряжение индоссамент ISIN преимущественное право акционеров устав эмитента сертификат ценной бумаги"
      retrieval_profile: "securities_transfer_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство"
        - "основной долг"
        - "предмет отступного как недвижимость"
        - "кадастровый номер"
        - "ЕГРН"
        - "залог прекращается"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "securities_as_otsupnoe_specifics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        специальные условия для ценных бумаг как предмета отступного:
        тип бумаг, идентификацию выпуска, механизм передачи, преимущественное
        право иных акционеров/участников, ограничения в уставе эмитента,
        уведомление эмитента/регистратора/депозитария.
        Не анализируй первоначальное обязательство, стоимость отступного,
        налоговые аспекты или споры — это отдельные вопросы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. securities_as_otsupnoe_specifics_check_presence:
           Агрегатное signal-поле — наличие регулирования по специальным
           условиям для ценных бумаг как предмета отступного.
           - "present" — если хотя бы одно из содержательных полей
             находится в «информативном» состоянии:
             securities_type ≠ "not_defined" ИЛИ
             securities_identification_status = "defined" ИЛИ
             transfer_mechanism ≠ "not_defined" ИЛИ
             preemptive_right_status ∈ {"clean", "excluded", "disputed"} ИЛИ
             charter_restrictions_status ∈ {"clean", "restricted"} ИЛИ
             issuer_notification_status = "defined";
           - "missing" — если securities_type = "not_defined" И
             securities_identification_status = "not_defined" И
             transfer_mechanism = "not_defined" И
             preemptive_right_status = "not_defined" И
             charter_restrictions_status = "not_defined" И
             issuer_notification_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - securities_type = "not_defined";
           - securities_type_display = "Не установлен";
           - securities_identification_status = "not_defined";
           - securities_identification_details = "Не установлены";
           - transfer_mechanism = "not_defined";
           - transfer_mechanism_display = "Не установлен";
           - preemptive_right_status = "not_defined";
           - preemptive_right_details = "Не урегулировано";
           - charter_restrictions_status = "not_defined";
           - charter_restrictions_details = "Не установлено";
           - issuer_notification_status = "not_defined";
           - issuer_notification_details = "Не предусмотрено";
           - не выполняй остальные шаги.

        1. securities_type — "shares" (акции) / "bonds" (облигации) /
           "bills" (векселя) / "mixed" (несколько разных типов одновременно) /
           "other" (иные прямо названные ценные бумаги) / "not_defined".
        2. securities_type_display — читаемое отображение типа бумаг по
           правилу из [ФОРМАТ ОТВЕТА].
        3. securities_identification_status — "defined" если идентификация
           выпуска прямо указана в тексте (ISIN, регистрационный номер,
           эмитент, количество, категория) либо текст прямо отсылает к
           приложению/реестру, где эти данные содержатся, иначе "not_defined".
        4. securities_identification_details — краткая идентификация выпуска.
           Если указана через приложение — отрази источник. Fallback —
           "Не установлены".
        5. transfer_mechanism — "depo_transfer" / "transfer_order" /
           "certificate_delivery" / "endorsement" / "mixed" / "not_defined".
           Общая фраза "в порядке, установленном законодательством" без
           конкретного механизма — not_defined.
        6. transfer_mechanism_display — читаемое отображение механизма по
           правилу из [ФОРМАТ ОТВЕТА].
        7. preemptive_right_status — "clean" (прямо указано, что
           преимущественное право не применяется) / "excluded" (прямо указано,
           что преимущественное право исключено уставом или отсутствием
           акционеров) / "disputed" (прямо указано наличие преимущественного
           права или порядок его соблюдения через отказ / уведомление) /
           "not_defined".
        8. preemptive_right_details — формулировка. Fallback — "Не урегулировано".
        9. charter_restrictions_status — "clean" (прямо указано, что уставных
           ограничений нет) / "restricted" (прямо указано о наличии
           ограничений на отчуждение в уставе эмитента) / "not_defined".
        10. charter_restrictions_details — формулировка. Fallback —
            "Не установлено".
        11. issuer_notification_status — "defined" если уведомление эмитента,
            регистратора или депозитария прямо предусмотрено конкретным
            порядком (кто, когда, как), иначе "not_defined". Общая фраза
            "уведомление осуществляется надлежащим образом" без конкретики —
            not_defined.
        12. issuer_notification_details — формулировка. Fallback —
            "Не предусмотрено".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - соответствующий *_display → "Не установлен"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни securities_as_otsupnoe_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = соответствующий fallback, соответствующие *_display = "Не установлен".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретного механизма передачи, конкретного
          указания на преимущественное право и процедуру его соблюдения,
          или конкретного порядка уведомления — это not_defined, а не defined.
          Правило применяется ко всем полям check-а без исключения.
        - securities_type:
            - "shares" — акции (обыкновенные, привилегированные).
            - "bonds" — облигации.
            - "bills" — векселя (простые или переводные).
            - "mixed" — несколько разных типов одновременно.
            - "other" — иные прямо названные ценные бумаги (например,
              инвестиционные паи, депозитарные расписки).
            - "not_defined" — тип прямо не указан.
        - transfer_mechanism:
            - "depo_transfer" — списание/зачисление по лицевому счёту
              (счёт депо) у регистратора или депозитария.
            - "transfer_order" — прямо упомянуто передаточное распоряжение.
            - "certificate_delivery" — передача сертификата документарной
              ценной бумаги.
            - "endorsement" — индоссамент (для ордерных бумаг, например
              векселя).
            - "mixed" — несколько механизмов одновременно.
            - "not_defined" — механизм прямо не определён.
        - preemptive_right_status:
            - "clean" — прямо указано, что преимущественное право не применяется.
            - "excluded" — прямо указано, что преимущественное право исключено
              (отсутствие иных акционеров, устав непубличного общества и т.п.).
            - "disputed" — прямо указано наличие преимущественного права или
              порядок его соблюдения (уведомление, отказ, ожидание срока).
            - "not_defined" — вопрос преимущественного права в тексте прямо
              не урегулирован.
        - charter_restrictions_status:
            - "clean" — прямо указано, что уставных ограничений на отчуждение
              нет.
            - "restricted" — прямо указано о наличии уставных ограничений.
            - "not_defined" — вопрос в тексте прямо не урегулирован.
        - Если идентификация выпуска или механизм передачи определяются через
          отсылку к приложению, спецификации или реестру — это не отсутствие
          регулирования, отражай это как понятную формулировку.
        - Не путай преимущественное право иных акционеров с корпоративным
          одобрением крупной сделки (это отдельный вопрос, проверяется
          в check parties_and_authority).
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса/enum и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типа ценных бумаг, ни идентификации выпуска,
           ни механизма передачи, ни сведений о преимущественном праве
           и уставных ограничениях, ни уведомления эмитента.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_details = соответствующий fallback;
             соответствующие *_display = "Не установлен".

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Ценные бумаги передаются в порядке, установленном законодательством.
           Соблюдение прав иных акционеров обеспечивается сторонами в
           соответствии с законом» без конкретного механизма, конкретного
           указания на преимущественное право и процедуру его соблюдения.
           → presence = "missing";
             securities_type = "not_defined";
             securities_identification_status = "not_defined";
             transfer_mechanism = "not_defined";
             preemptive_right_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о типе бумаг или механизме передачи (например, в одном пункте —
           бездокументарные акции, в другом — передача сертификата), и
           конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: преимущественное право или уставные ограничения.
           В тексте прямо указано наличие преимущественного права иных
           акционеров или наличие ограничений на отчуждение в уставе
           эмитента (red flag для перехода бумаг к Кредитору).
           → presence = "present";
             preemptive_right_status = "disputed" (или charter_restrictions_status = "restricted");
             соответствующие *_details = точная формулировка из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для securities_as_otsupnoe_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для securities_type используй только: "shares", "bonds", "bills", "mixed", "other" или "not_defined".
        - Для securities_type_display используй только: "Акции", "Облигации",
          "Векселя", "Смешанный набор", "Иные ценные бумаги" или "Не установлен".
        - Для transfer_mechanism используй только: "depo_transfer", "transfer_order",
          "certificate_delivery", "endorsement", "mixed" или "not_defined".
        - Для transfer_mechanism_display используй только: "Списание/зачисление по лицевому счету",
          "Передаточное распоряжение", "Передача сертификата", "Индоссамент",
          "Смешанный механизм" или "Не установлен".
        - Для preemptive_right_status используй только: "clean", "excluded", "disputed" или "not_defined".
        - Для charter_restrictions_status используй только: "clean", "restricted" или "not_defined".
        - Для остальных статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * securities_identification_details → "Не установлены";
          * preemptive_right_details → "Не урегулировано";
          * charter_restrictions_details → "Не установлено";
          * issuer_notification_details → "Не предусмотрено";
          * securities_type_display / transfer_mechanism_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * соответствующие *_display → "Не установлен".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "securities_as_otsupnoe_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных условий для ценных бумаг как предмета отступного. Внутреннее агрегатное signal-поле."
          required: true

        - name: "securities_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["shares", "bonds", "bills", "mixed", "other", "not_defined"]
          display_in_grid: false
          description: "Тип ценных бумаг. Внутреннее enum-поле, отображается через securities_type_display."
          required: true

        - name: "securities_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип ценных бумаг"
          description: >
            Читаемое отображение типа ценных бумаг: "Акции", "Облигации",
            "Векселя", "Смешанный набор", "Иные ценные бумаги" или "Не установлен".
          required: true

        - name: "securities_identification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации выпуска ценных бумаг. Внутреннее enum-поле."
          required: true

        - name: "securities_identification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Идентификация выпуска"
          description: >
            Идентификация выпуска ценных бумаг (ISIN, регистрационный номер,
            эмитент, количество, категория), в том числе через отсылку к
            приложению/реестру.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

        - name: "transfer_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["depo_transfer", "transfer_order", "certificate_delivery", "endorsement", "mixed", "not_defined"]
          display_in_grid: false
          description: "Механизм передачи ценных бумаг. Внутреннее enum-поле, отображается через transfer_mechanism_display."
          required: true

        - name: "transfer_mechanism_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Механизм передачи"
          description: >
            Читаемое отображение механизма передачи ценных бумаг.
          required: true

        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clean", "excluded", "disputed", "not_defined"]
          display_in_grid: false
          description: "Статус урегулирования преимущественного права иных акционеров/участников. Внутреннее enum-поле."
          required: true

        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Преимущественное право"
          description: >
            Формулировка о преимущественном праве иных акционеров/участников
            на приобретение передаваемых бумаг.
            Fallback: "Не урегулировано" / "Не удалось определить".
          required: true

        - name: "charter_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["clean", "restricted", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений на отчуждение в уставе эмитента. Внутреннее enum-поле."
          required: true

        - name: "charter_restrictions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Ограничения в уставе эмитента"
          description: >
            Формулировка об ограничениях на отчуждение ценных бумаг в уставе
            эмитента.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "issuer_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об уведомлении эмитента/регистратора/депозитария. Внутреннее enum-поле."
          required: true

        - name: "issuer_notification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Уведомление эмитента/регистратора"
          description: >
            Формулировка об уведомлении эмитента, регистратора или депозитария.
            Fallback: "Не предусмотрено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: third_party_pledge_on_subject_check
    name: "Залог на предмет отступного в пользу третьего лица и согласие залогодержателя"
    description: >
      Фактографическая проверка того, урегулирован ли в тексте залог,
      установленный на сам предмет отступного в пользу третьего лица
      (не Кредитора по первоначальному обязательству), наличие согласия
      залогодержателя на отчуждение, порядок снятия обременения и уведомления
      залогодержателя.
    triggers:
      any: ["secured_subject", "general_sale_subject"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залогодержатель"
        - "залог третьего лица"
        - "согласие залогодержателя"
        - "обременение"
        - "снятие залога"
        - "залог на предмет отступного"
        - "залог в пользу третьего лица"
        - "заложенное имущество"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залогодержател"
        - "(?i)согласи(е|я)\\s+залогодержател"
        - "(?i)заложенн[а-я]+\\s+имуществ"
        - "(?i)обременени[ея]\\s+в\\s+пользу"
        - "(?i)снят(ие|ь)\\s+обременени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: урегулирован ли в тексте залог,
        установленный на сам предмет отступного в пользу третьего лица
        (не Кредитора по первоначальному обязательству), и связанные с ним
        процедуры — согласие залогодержателя на отчуждение, уведомление
        залогодержателя, снятие обременения.

        Нормативный ориентир:
        - ст. 334, 346 ГК РФ (залог и распоряжение заложенным имуществом)
        - ст. 352 ГК РФ (прекращение залога)
        - п. 23 Постановления Пленума ВС РФ № 10 от 27.06.2023 (сделки
          с заложенным имуществом без согласия залогодержателя)

        Важно:
        - КРИТИЧЕСКИ ВАЖНО: не путай залог на предмет отступного в пользу
          третьего лица (предмет этого check-а) с залогом, обеспечивающим
          первоначальное обязательство в пользу Кредитора (это отдельный
          вопрос, проверяемый в check secured_obligation_fate_check),
          и с общими заверениями об отсутствии обременений на предмет
          отступного (это тоже отдельный вопрос, проверяемый в check
          title_and_warranties_check).
        - Если в тексте прямо указано наличие залога на предмет отступного,
          но вопрос согласия залогодержателя или снятия обременения не
          раскрыт — это не основание для "defined" в соответствующих полях,
          а значимый факт для других.
        - Общая фраза вроде "стороны обязуются совершить все необходимые
          действия для снятия обременений" без указания конкретной процедуры,
          срока или ответственного лица — это not_defined. Фраза "согласие
          залогодержателя получено в установленном порядке" без указания
          документа или конкретного залогодержателя — тоже not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Есть ли указание на залог, установленный на предмет отступного
           в пользу третьего лица.
        2. Есть ли условие о согласии залогодержателя на отчуждение
           предмета отступного.
        3. Есть ли условие об уведомлении залогодержателя о передаче
           предмета отступного.
        4. Есть ли условие о порядке снятия обременения (залога)
           с предмета отступного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай наличие или отсутствие залога, согласия залогодержателя
           или процедуры снятия обременения.
        3. Не путай залог в пользу третьего лица (предмет этого check-а)
           с обеспечением первоначального обязательства в пользу Кредитора
           (это отдельный вопрос).
        4. Общая фраза о "необходимых действиях по снятию обременений" без
           конкретики — это not_defined.
        5. Общая фраза "согласие залогодержателя получено" без указания
           документа или конкретного лица — это not_defined.
        6. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        7. В evidence включай только цитаты из соглашения.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — залог на предмете есть, согласие получено, порядок снятия описан:
        Фрагмент:
        "Передаваемое в качестве отступного оборудование находится в залоге
        у ПАО «Банк» по договору залога № 12 от 01.02.2023. Залогодержатель —
        ПАО «Банк» — дал письменное согласие на отчуждение предмета залога
        Кредитору (письмо № 12/2-с от 15.04.2024). После передачи оборудования
        Должник обязуется в течение 10 рабочих дней обеспечить снятие
        регистрационной записи об обременении и уведомить ПАО «Банк» о
        состоявшейся передаче."

        Ответ:
        {
          "third_party_pledge_status": "present",
          "third_party_pledge_details": "Оборудование находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023",
          "pledgeholder_consent_status": "defined",
          "pledgeholder_consent_details": "ПАО «Банк» дал письменное согласие на отчуждение (письмо № 12/2-с от 15.04.2024)",
          "pledgeholder_notification_status": "defined",
          "pledgeholder_notification_details": "Должник обязуется уведомить ПАО «Банк» о состоявшейся передаче",
          "release_procedure_status": "defined",
          "release_procedure_details": "Должник обязуется в течение 10 рабочих дней обеспечить снятие регистрационной записи об обременении",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Передаваемое в качестве отступного оборудование находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023. Залогодержатель — ПАО «Банк» — дал письменное согласие на отчуждение предмета залога Кредитору (письмо № 12/2-с от 15.04.2024). После передачи оборудования Должник обязуется в течение 10 рабочих дней обеспечить снятие регистрационной записи об обременении и уведомить ПАО «Банк» о состоявшейся передаче."
            }
          ]
        }

        Пример 2 — тема не упомянута:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору автомобиль
        Toyota Camry, VIN XXXXXXXXXXXXXXXX."

        Ответ:
        {
          "third_party_pledge_status": "absent",
          "third_party_pledge_details": "Не упомянуто",
          "pledgeholder_consent_status": "not_defined",
          "pledgeholder_consent_details": "Не установлено",
          "pledgeholder_notification_status": "not_defined",
          "pledgeholder_notification_details": "Не предусмотрено",
          "release_procedure_status": "not_defined",
          "release_procedure_details": "Не описана",
          "evidence": []
        }

        Пример 3 — залог есть, согласие не упомянуто (red flag):
        Фрагмент:
        "Передаваемое в качестве отступного оборудование находится в залоге
        у ПАО «Банк» по договору залога № 12 от 01.02.2023. Стороны обязуются
        совершить все необходимые действия для снятия обременений."

        Ответ:
        {
          "third_party_pledge_status": "present",
          "third_party_pledge_details": "Оборудование находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023",
          "pledgeholder_consent_status": "not_defined",
          "pledgeholder_consent_details": "Не установлено",
          "pledgeholder_notification_status": "not_defined",
          "pledgeholder_notification_details": "Не предусмотрено",
          "release_procedure_status": "not_defined",
          "release_procedure_details": "Не описана",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Передаваемое в качестве отступного оборудование находится в залоге у ПАО «Банк» по договору залога № 12 от 01.02.2023. Стороны обязуются совершить все необходимые действия для снятия обременений."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Стороны подтверждают, что предмет отступного не обременён правами
        третьих лиц. Согласие залогодержателя получено в установленном
        порядке. Обременения снимаются в соответствии с действующим
        законодательством Российской Федерации."

        Ответ:
        {
          "third_party_pledge_status": "absent",
          "third_party_pledge_details": "Не упомянуто",
          "pledgeholder_consent_status": "not_defined",
          "pledgeholder_consent_details": "Не установлено",
          "pledgeholder_notification_status": "not_defined",
          "pledgeholder_notification_details": "Не предусмотрено",
          "release_procedure_status": "not_defined",
          "release_procedure_details": "Не описана",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о залоге на предмет отступного в пользу
           третьего лица (не Кредитора по первоначальному обязательству).
        2. Если залог есть — найди прямую цитату о согласии залогодержателя
           на отчуждение с конкретным указанием документа или лица.
        3. Найди прямую цитату об уведомлении залогодержателя о передаче.
        4. Найди прямую цитату о порядке снятия обременения с конкретными
           действиями (кто, куда, в какой срок).
        5. Проверь: не является ли формулировка общей фразой о "необходимых
           действиях по снятию обременений" или "согласие получено в
           установленном порядке" без конкретики — если да, соответствующее
           поле not_defined.
        6. Не путай залог в пользу третьего лица с обеспечением первоначального
           обязательства в пользу Кредитора.
        7. Если прямой цитаты нет — верни "not_defined"/"absent" и
           соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "third_party_pledge_status": "<absent / present / not_defined>",
          "third_party_pledge_details": "<текст или 'Не упомянуто' / 'Не удалось определить'>",
          "pledgeholder_consent_status": "<defined / not_defined>",
          "pledgeholder_consent_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "pledgeholder_notification_status": "<defined / not_defined>",
          "pledgeholder_notification_details": "<текст или 'Не предусмотрено' / 'Не удалось определить'>",
          "release_procedure_status": "<defined / not_defined>",
          "release_procedure_details": "<текст или 'Не описана' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "залогодержатель согласие залогодержателя залог на предмет отступного заложенное имущество обременение в пользу третьего лица снятие залога прекращение залога уведомление залогодержателя договор залога"
      retrieval_profile: "security_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство"
        - "обеспечение первоначального обязательства"
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "стоимость отступного"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "third_party_pledge_on_subject_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        сведения о залоге на предмет отступного в пользу третьего лица
        (не Кредитора по первоначальному обязательству): наличие залога,
        согласие залогодержателя на отчуждение, уведомление залогодержателя,
        порядок снятия обременения.
        Не анализируй обеспечение первоначального обязательства (в пользу
        Кредитора), заверения об отсутствии обременений и стоимость отступного —
        это отдельные вопросы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. third_party_pledge_on_subject_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме залога
           на предмет отступного в пользу третьего лица.
           - "present" — если хотя бы одно из содержательных полей находится
             в «информативном» состоянии:
             third_party_pledge_status = "present" ИЛИ
             pledgeholder_consent_status = "defined" ИЛИ
             pledgeholder_notification_status = "defined" ИЛИ
             release_procedure_status = "defined";
           - "missing" — если third_party_pledge_status = "absent" И
             pledgeholder_consent_status = "not_defined" И
             pledgeholder_notification_status = "not_defined" И
             release_procedure_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - third_party_pledge_status = "absent";
           - third_party_pledge_details = "Не упомянуто";
           - pledgeholder_consent_status = "not_defined";
           - pledgeholder_consent_details = "Не установлено";
           - pledgeholder_notification_status = "not_defined";
           - pledgeholder_notification_details = "Не предусмотрено";
           - release_procedure_status = "not_defined";
           - release_procedure_details = "Не описана";
           - не выполняй остальные шаги.

        1. third_party_pledge_status — "absent" (залог на предмет отступного
           не упомянут) / "present" (прямо указано наличие залога на предмет
           отступного в пользу третьего лица) / "not_defined" (вопрос прямо
           не урегулирован). Не путай с обеспечением первоначального
           обязательства в пользу Кредитора — это отдельный вопрос.
        2. third_party_pledge_details — формулировка о залоге на предмет
           отступного в пользу третьего лица (залогодержатель, договор
           залога с реквизитами). Fallback при "absent" — "Не упомянуто".
        3. pledgeholder_consent_status — "defined" если согласие залогодержателя
           на отчуждение прямо предусмотрено с конкретным указанием документа
           или лица, иначе "not_defined". Фраза "согласие получено в
           установленном порядке" без конкретики — not_defined.
        4. pledgeholder_consent_details — формулировка о согласии
           залогодержателя. Fallback — "Не установлено".
        5. pledgeholder_notification_status — "defined" если уведомление
           залогодержателя о передаче предмета отступного прямо предусмотрено
           конкретным порядком (кто, когда, как), иначе "not_defined".
        6. pledgeholder_notification_details — формулировка об уведомлении.
           Fallback — "Не предусмотрено".
        7. release_procedure_status — "defined" если порядок снятия обременения
           (залога) с предмета отступного прямо описан конкретными действиями
           (кто, куда, в какой срок), иначе "not_defined". Общая фраза
           "стороны обязуются совершить все необходимые действия" без
           конкретики — not_defined.
        8. release_procedure_details — формулировка о порядке снятия
           обременения. Fallback — "Не описана".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined"/"absent" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_pledge_on_subject_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined"/"absent", все *_details = соответствующий fallback.
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза о "необходимых действиях по снятию обременений" без
          конкретики, или "согласие залогодержателя получено в установленном
          порядке" без указания документа или конкретного лица — это
          not_defined. Правило применяется ко всем полям check-а без исключения.
        - КРИТИЧЕСКИ ВАЖНО: не путай залог на предмет отступного в пользу
          третьего лица (предмет этого check-а) с:
            1) залогом, обеспечивающим первоначальное обязательство в пользу
               Кредитора (проверяется в check secured_obligation_fate_check);
            2) общими заверениями об отсутствии обременений на предмет
               отступного (проверяется в check title_and_warranties_check).
          Если в тексте речь идёт только об обеспечении первоначального
          обязательства или только о заверениях — этот check не срабатывает,
          third_party_pledge_status = "absent".
        - third_party_pledge_status:
            - "absent" — тема залога на предмет отступного в пользу третьего
              лица вообще не упомянута.
            - "present" — прямо указано наличие такого залога.
            - "not_defined" — вопрос прямо не урегулирован (например, есть
              общая фраза об обременениях без указания, чьи они).
        - pledgeholder_consent_status = "defined" только если прямо указан
          конкретный залогодержатель и/или документ, подтверждающий согласие.
        - release_procedure_status = "defined" только если описаны конкретные
          действия по снятию обременения (кто, куда, в какой срок).
        - Если в разных фрагментах указаны противоречивые сведения о наличии
          залога или о согласии залогодержателя и конфликт нельзя разрешить
          по тексту, верни "not_defined" для статуса/enum и "Не удалось
          определить" для текстового поля.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания залога на предмет отступного в пользу
           третьего лица, ни согласия залогодержателя, ни уведомления, ни
           порядка снятия обременения.
           → presence = "missing";
             third_party_pledge_status = "absent";
             все остальные статусы = "not_defined";
             все *_details = соответствующий fallback.

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Стороны обязуются совершить все необходимые действия для снятия
           обременений. Согласие залогодержателя получено в установленном
           порядке» без указания конкретного залогодержателя, документа
           или процедуры.
           → presence = "missing";
             third_party_pledge_status = "absent";
             pledgeholder_consent_status = "not_defined";
             release_procedure_status = "not_defined";
             соответствующие *_details = "Не установлено" / "Не описана".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о наличии залога на предмет отступного или о согласии
           залогодержателя, и конфликт нельзя снять по тексту.
           → presence = "unclear";
             соответствующий статус/enum = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Специфика темы: red flag — залог есть, согласие не упомянуто.
           В тексте прямо указано наличие залога на предмет отступного
           в пользу третьего лица, но согласие залогодержателя на отчуждение
           прямо не подтверждено (не указан документ, не назван залогодержатель).
           → presence = "present";
             third_party_pledge_status = "present";
             third_party_pledge_details = точная формулировка из текста;
             pledgeholder_consent_status = "not_defined";
             pledgeholder_consent_details = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_pledge_on_subject_check_presence используй только: "present", "missing", "unclear".
        - Для third_party_pledge_status используй только: "absent", "present" или "not_defined".
        - Для остальных статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * third_party_pledge_details → "Не упомянуто";
          * pledgeholder_consent_details → "Не установлено";
          * pledgeholder_notification_details → "Не предусмотрено";
          * release_procedure_details → "Не описана".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_pledge_on_subject_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по залогу на предмет отступного в пользу третьего лица. Внутреннее агрегатное signal-поле."
          required: true

        - name: "third_party_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["absent", "present", "not_defined"]
          display_in_grid: false
          description: "Статус залога на предмет отступного в пользу третьего лица. Внутреннее enum-поле."
          required: true

        - name: "third_party_pledge_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Залог на предмет отступного (третье лицо)"
          description: >
            Формулировка о залоге на предмет отступного в пользу третьего
            лица (залогодержатель, договор залога с реквизитами).
            Fallback: "Не упомянуто" / "Не удалось определить".
          required: true

        - name: "pledgeholder_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласия залогодержателя на отчуждение предмета отступного. Внутреннее enum-поле."
          required: true

        - name: "pledgeholder_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласие залогодержателя"
          description: >
            Формулировка о согласии залогодержателя на отчуждение предмета
            отступного (с указанием документа или лица).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "pledgeholder_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус уведомления залогодержателя о передаче. Внутреннее enum-поле."
          required: true

        - name: "pledgeholder_notification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Уведомление залогодержателя"
          description: >
            Формулировка об уведомлении залогодержателя о передаче предмета
            отступного.
            Fallback: "Не предусмотрено" / "Не удалось определить".
          required: true

        - name: "release_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания порядка снятия обременения с предмета отступного. Внутреннее enum-поле."
          required: true

        - name: "release_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Порядок снятия обременения"
          description: >
            Формулировка о порядке снятия обременения (залога) с предмета
            отступного.
            Fallback: "Не описана" / "Не удалось определить".
          required: true
      store_payload: true

  - id: exclusive_rights_as_otsupnoe_specifics_check
    name: "Специальные условия для исключительных прав как отступного"
    description: >
      Фактографическая проверка специальных условий, если предметом отступного
      являются исключительные права (товарный знак, патент, программа для ЭВМ,
      ноу-хау, коммерческое обозначение): идентификация объекта, вид передачи
      (отчуждение или лицензия), объём и срок, регистрация перехода в Роспатенте,
      наличие обременений (лицензии третьим лицам, залог исключительных прав).
    triggers:
      any: ["exclusive_rights_as_otsupnoe"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительное право"
        - "товарный знак"
        - "патент"
        - "программа для ЭВМ"
        - "ноу-хау"
        - "коммерческое обозначение"
        - "Роспатент"
        - "свидетельство"
        - "отчуждение исключительного права"
        - "лицензия"
        - "лицензионный договор"
        - "интеллектуальная собственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ое|ого|ые)\\s+прав"
        - "(?i)товарн(ый|ого)\\s+знак"
        - "(?i)патент"
        - "(?i)программ[аы]\\s+для\\s+ЭВМ"
        - "(?i)ноу-хау|секрет\\s+производств"
        - "(?i)Роспатент|свидетельств[оа]"
        - "(?i)отчуждени[ея]\\s+исключительн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ, где предметом
        отступного являются исключительные права.
        Проверяется только один вопрос: специальные условия для исключительных
        прав как предмета отступного.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ст. 1226, 1229 ГК РФ — интеллектуальные права, исключительное право
        - ст. 1232 ГК РФ — государственная регистрация результатов
          интеллектуальной деятельности и средств индивидуализации
        - ст. 1234 ГК РФ — договор об отчуждении исключительного права
        - ст. 1235 ГК РФ — лицензионный договор
        - ст. 1488 ГК РФ — отчуждение исключительного права на товарный знак
        - ст. 1365 ГК РФ — отчуждение исключительного права на изобретение

        Важно:
        - Не оценивай серьёзность риска — устанавливай только то, что прямо
          есть в тексте соглашения.
        - Не подменяй текст договора нормами закона.
        - КРИТИЧЕСКИ ВАЖНО: различай отчуждение исключительного права
          (переход права полностью, ст. 1234 ГК РФ) и предоставление
          лицензии (частичная передача прав, ст. 1235 ГК РФ). Это
          принципиально разные сделки с разными последствиями. Если
          предметом отступного передаётся само исключительное право —
          это отчуждение; если только предоставляется возможность
          использования — это лицензия.
        - Отчуждение исключительного права на товарный знак, патент
          и иные регистрируемые РИД подлежит государственной регистрации
          в Роспатенте (ст. 1232, 1234 ГК РФ); если такое отчуждение
          не зарегистрировано — оно считается несостоявшимся.
        - Общая фраза вроде "исключительные права передаются в соответствии
          с законодательством" (без вида передачи), "права передаются
          в порядке, установленном законом" (без указания регистрации
          в Роспатенте), "лицензионные платежи уплачиваются в согласованном
          порядке" (без конкретных условий) НЕ является основанием для
          "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Какой объект исключительных прав передаётся (товарный знак, патент,
           программа для ЭВМ, ноу-хау, коммерческое обозначение, иное).
        2. Как передаётся право — отчуждение или лицензия.
        3. Есть ли идентификация объекта (номер свидетельства, регистрации,
           номер патента, депонирование).
        4. Есть ли условие о государственной регистрации перехода
           исключительного права (в Роспатенте).
        5. Есть ли указание на объём прав, срок, территорию (для лицензии).
        6. Есть ли сведения об обременениях (лицензии третьим лицам,
           залог исключительных прав).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай вид передачи права (отчуждение/лицензия) — фиксируй
           только то, что прямо указано.
        3. Не выводи необходимость регистрации в Роспатенте автоматически
           из типа объекта — только если регистрация прямо упомянута
           в тексте.
        4. Если условие определяется через отсылку к приложению, свидетельству
           или иному документу — отражай это как понятную формулировку.
        5. Общая фраза о порядке передачи "в соответствии с законодательством"
           без указания вида передачи или регистрации — это not_defined.
        6. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        7. В evidence включай только цитаты из соглашения.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отчуждение товарного знака с регистрацией в Роспатенте:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору исключительное
        право на товарный знак «ТЕХНОПРОМ» (свидетельство № 123456, дата
        приоритета 10.01.2020, зарегистрировано в Государственном реестре
        товарных знаков 15.06.2020). Право передаётся путём отчуждения
        в полном объёме. Стороны обязуются в течение 30 рабочих дней
        подать в Роспатент заявление о государственной регистрации
        отчуждения исключительного права. Исключительное право не обременено
        лицензиями третьим лицам и не находится в залоге."

        Ответ:
        {
          "exclusive_right_object_type": "trademark",
          "exclusive_right_object_type_display": "Товарный знак",
          "object_identification_status": "defined",
          "object_identification_details": "Товарный знак «ТЕХНОПРОМ», свидетельство № 123456 от 15.06.2020",
          "transfer_type": "assignment",
          "transfer_type_display": "Отчуждение исключительного права",
          "registration_required_status": "defined",
          "registration_required_details": "Стороны обязуются подать в Роспатент заявление о государственной регистрации отчуждения в течение 30 рабочих дней",
          "scope_of_rights_status": "not_defined",
          "scope_of_rights_details": "Не установлено",
          "encumbrances_status": "clean",
          "encumbrances_details": "Исключительное право не обременено лицензиями третьим лицам и не находится в залоге",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "В качестве отступного Должник передает Кредитору исключительное право на товарный знак «ТЕХНОПРОМ» (свидетельство № 123456, дата приоритета 10.01.2020, зарегистрировано в Государственном реестре товарных знаков 15.06.2020). Право передаётся путём отчуждения в полном объёме. Стороны обязуются в течение 30 рабочих дней подать в Роспатент заявление о государственной регистрации отчуждения исключительного права. Исключительное право не обременено лицензиями третьим лицам и не находится в залоге."
            }
          ]
        }

        Пример 2 — тема не упомянута:
        Фрагмент:
        "В качестве отступного Должник передает Кредитору автомобиль
        Toyota Camry."

        Ответ:
        {
          "exclusive_right_object_type": "not_defined",
          "exclusive_right_object_type_display": "Не установлен",
          "object_identification_status": "not_defined",
          "object_identification_details": "Не установлены",
          "transfer_type": "not_defined",
          "transfer_type_display": "Не установлен",
          "registration_required_status": "not_defined",
          "registration_required_details": "Не установлено",
          "scope_of_rights_status": "not_defined",
          "scope_of_rights_details": "Не установлено",
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Не установлено",
          "evidence": []
        }

        Пример 3 — лицензия с объёмом прав и сроком, без регистрации:
        Фрагмент:
        "В качестве отступного Должник предоставляет Кредитору неисключительную
        лицензию на использование программы для ЭВМ «ТехноКад» (свидетельство
        о государственной регистрации № 2020612345) сроком на 5 лет на
        территории Российской Федерации с правом воспроизведения и
        модификации. Регистрация лицензии в Роспатенте не требуется."

        Ответ:
        {
          "exclusive_right_object_type": "software",
          "exclusive_right_object_type_display": "Программа для ЭВМ",
          "object_identification_status": "defined",
          "object_identification_details": "Программа для ЭВМ «ТехноКад», свидетельство № 2020612345",
          "transfer_type": "license",
          "transfer_type_display": "Лицензия",
          "registration_required_status": "defined",
          "registration_required_details": "Прямо указано, что регистрация лицензии в Роспатенте не требуется",
          "scope_of_rights_status": "defined",
          "scope_of_rights_details": "Неисключительная лицензия на 5 лет, территория РФ, право воспроизведения и модификации",
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "В качестве отступного Должник предоставляет Кредитору неисключительную лицензию на использование программы для ЭВМ «ТехноКад» (свидетельство о государственной регистрации № 2020612345) сроком на 5 лет на территории Российской Федерации с правом воспроизведения и модификации. Регистрация лицензии в Роспатенте не требуется."
            }
          ]
        }

        Пример 4 — обманчиво звучащая общая фраза (generic-clause ловушка):
        Фрагмент:
        "Исключительные права передаются в соответствии с действующим
        законодательством Российской Федерации. Лицензионные платежи
        уплачиваются в согласованном порядке. Все необходимые регистрационные
        действия совершаются сторонами."

        Ответ:
        {
          "exclusive_right_object_type": "not_defined",
          "exclusive_right_object_type_display": "Не установлен",
          "object_identification_status": "not_defined",
          "object_identification_details": "Не установлены",
          "transfer_type": "not_defined",
          "transfer_type_display": "Не установлен",
          "registration_required_status": "not_defined",
          "registration_required_details": "Не установлено",
          "scope_of_rights_status": "not_defined",
          "scope_of_rights_details": "Не установлено",
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе объекта исключительных прав.
        2. Найди прямую цитату о виде передачи (отчуждение / лицензия);
           убедись, что она не является общей фразой о "передаче в
           соответствии с законодательством".
        3. Найди прямую цитату об идентификации объекта (номер свидетельства,
           регистрации, патента).
        4. Найди прямую цитату о государственной регистрации перехода
           исключительного права в Роспатенте (либо об отсутствии такой
           необходимости).
        5. Найди прямую цитату об объёме прав, сроке, территории
           (для лицензии).
        6. Найди прямую цитату об обременениях (лицензии третьим лицам,
           залог исключительных прав).
        7. Если прямой цитаты нет — верни "not_defined" и соответствующий fallback.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "exclusive_right_object_type": "<trademark / patent / software / know_how / commercial_designation / other / mixed / not_defined>",
          "exclusive_right_object_type_display": "<Товарный знак / Патент / Программа для ЭВМ / Ноу-хау / Коммерческое обозначение / Иные исключительные права / Смешанный набор / Не установлен>",
          "object_identification_status": "<defined / not_defined>",
          "object_identification_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "transfer_type": "<assignment / license / mixed / not_defined>",
          "transfer_type_display": "<Отчуждение исключительного права / Лицензия / Смешанная передача / Не установлен>",
          "registration_required_status": "<defined / not_defined>",
          "registration_required_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "scope_of_rights_status": "<defined / not_defined>",
          "scope_of_rights_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "encumbrances_status": "<clean / encumbered / not_defined>",
          "encumbrances_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительное право товарный знак патент программа для ЭВМ ноу-хау коммерческое обозначение Роспатент свидетельство отчуждение исключительного права лицензия лицензионный договор интеллектуальная собственность государственная регистрация перехода права"
      retrieval_profile: "ip_transfer_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "первоначальное обязательство"
        - "кадастровый номер"
        - "ЕГРН"
        - "залог прекращается"
        - "банкротство"
        - "НДС"
        - "не является новацией"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "exclusive_rights_as_otsupnoe_specifics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        специальные условия для исключительных прав как предмета отступного:
        тип объекта, идентификацию, вид передачи (отчуждение или лицензия),
        регистрацию в Роспатенте, объём прав (для лицензии), обременения.
        Не анализируй первоначальное обязательство, стоимость отступного,
        налоговые аспекты или споры — это отдельные вопросы.
        Не оценивай риски — фиксируй только текстовый факт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exclusive_rights_as_otsupnoe_specifics_check_presence:
           Агрегатное signal-поле — наличие регулирования по специальным
           условиям для исключительных прав как предмета отступного.
           - "present" — если хотя бы одно из содержательных полей
             находится в «информативном» состоянии:
             exclusive_right_object_type ≠ "not_defined" ИЛИ
             object_identification_status = "defined" ИЛИ
             transfer_type ≠ "not_defined" ИЛИ
             registration_required_status = "defined" ИЛИ
             scope_of_rights_status = "defined" ИЛИ
             encumbrances_status ∈ {"clean", "encumbered"};
           - "missing" — если exclusive_right_object_type = "not_defined" И
             object_identification_status = "not_defined" И
             transfer_type = "not_defined" И
             registration_required_status = "not_defined" И
             scope_of_rights_status = "not_defined" И
             encumbrances_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - exclusive_right_object_type = "not_defined";
           - exclusive_right_object_type_display = "Не установлен";
           - object_identification_status = "not_defined";
           - object_identification_details = "Не установлены";
           - transfer_type = "not_defined";
           - transfer_type_display = "Не установлен";
           - registration_required_status = "not_defined";
           - registration_required_details = "Не установлено";
           - scope_of_rights_status = "not_defined";
           - scope_of_rights_details = "Не установлено";
           - encumbrances_status = "not_defined";
           - encumbrances_details = "Не установлено";
           - не выполняй остальные шаги.

        1. exclusive_right_object_type — "trademark" (товарный знак) /
           "patent" (патент на изобретение, полезную модель, промышленный
           образец) / "software" (программа для ЭВМ) / "know_how" (ноу-хау,
           секрет производства) / "commercial_designation" (коммерческое
           обозначение) / "other" (иные прямо названные исключительные
           права) / "mixed" (несколько объектов одновременно) / "not_defined".
        2. exclusive_right_object_type_display — читаемое отображение типа
           объекта по правилу из [ФОРМАТ ОТВЕТА].
        3. object_identification_status — "defined" если идентификация объекта
           прямо указана (номер свидетельства, регистрации, патента, дата
           приоритета) либо текст прямо отсылает к документу, где эти данные
           содержатся, иначе "not_defined".
        4. object_identification_details — краткая идентификация объекта.
           Если указана через приложение — отрази источник. Fallback —
           "Не установлены".
        5. transfer_type — "assignment" (отчуждение исключительного права) /
           "license" (лицензия) / "mixed" (несколько разных типов передачи
           одновременно) / "not_defined". Общая фраза "передаётся в
           соответствии с законодательством" без вида передачи — not_defined.
        6. transfer_type_display — читаемое отображение вида передачи
           по правилу из [ФОРМАТ ОТВЕТА].
        7. registration_required_status — "defined" если в тексте прямо
           указано, что переход исключительного права подлежит государственной
           регистрации в Роспатенте (либо прямо указано, что регистрация
           не требуется), иначе "not_defined".
        8. registration_required_details — формулировка о регистрации.
           Fallback — "Не установлено".
        9. scope_of_rights_status — "defined" если объём прав, срок или
           территория прямо указаны (для лицензии); для отчуждения —
           "defined" если прямо указано, что право передаётся в полном
           объёме. Иначе "not_defined".
        10. scope_of_rights_details — формулировка об объёме прав. Fallback —
            "Не установлено".
        11. encumbrances_status — "clean" (прямо указано отсутствие
            обременений — лицензий третьим лицам, залога) / "encumbered"
            (прямо указано наличие обременений) / "not_defined".
        12. encumbrances_details — формулировка об обременениях. Fallback —
            "Не установлено".

        Если данные отсутствуют, используй указанные выше fallback-значения
        и "not_defined" для соответствующего статуса.

        Если данные присутствуют, но противоречат друг другу в разных фрагментах
        и конфликт нельзя разрешить по тексту:
        - соответствующий статус/enum → "not_defined"
        - соответствующее текстовое поле → "Не удалось определить"
        - соответствующий *_display → "Не установлен"

        Даже для полей, помеченных в схеме как required: false, всегда
        возвращай ключ с корректным fallback-значением.
        </task>

        <context_rules>
        - Перед остальными полями заполни exclusive_rights_as_otsupnoe_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусы/enum = "not_defined", все *_details = соответствующий fallback, соответствующие *_display = "Не установлен".
        - Используй только текст соглашения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста.
        - Общая фраза без конкретного вида передачи, без указания регистрации
          в Роспатенте, без конкретного объёма прав или без конкретного
          указания на обременения — это not_defined, а не defined. Правило
          применяется ко всем полям check-а без исключения.
        - exclusive_right_object_type:
            - "trademark" — товарный знак, знак обслуживания.
            - "patent" — патент на изобретение, полезную модель,
              промышленный образец.
            - "software" — программа для ЭВМ, база данных.
            - "know_how" — ноу-хау, секрет производства.
            - "commercial_designation" — коммерческое обозначение.
            - "other" — иные прямо названные исключительные права.
            - "mixed" — несколько объектов одновременно.
            - "not_defined" — тип объекта прямо не указан.
        - transfer_type:
            - "assignment" — отчуждение исключительного права в полном
              объёме (ст. 1234 ГК РФ).
            - "license" — предоставление права использования (ст. 1235
              ГК РФ); в этом случае обязательны объём, срок, территория.
            - "mixed" — разные объекты передаются разными способами.
            - "not_defined" — вид передачи прямо не определён.
        - registration_required_status = "defined" как при указании на
          необходимость регистрации в Роспатенте, так и при прямом указании,
          что регистрация не требуется. Общая фраза "регистрационные действия
          совершаются в установленном порядке" без указания органа или
          конкретных действий — not_defined.
        - encumbrances_status:
            - "clean" — прямо заверено отсутствие лицензий третьим лицам
              и залога исключительного права.
            - "encumbered" — прямо указано наличие обременений.
            - "not_defined" — вопрос обременений прямо не урегулирован.
        - Если идентификация объекта или вид передачи определяются через
          отсылку к приложению, свидетельству или иному документу — это
          не отсутствие регулирования, отражай это как понятную формулировку.
        - Каждое текстовое значение должно быть кратким, без пересказа целых пунктов.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт
          нельзя разрешить по тексту, верни "not_defined" для статуса/enum и
          "Не удалось определить" для текстового поля.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типа объекта исключительных прав, ни идентификации,
           ни вида передачи, ни указания на регистрацию, ни объёма прав,
           ни сведений об обременениях.
           → presence = "missing";
             все статусы/enum = "not_defined";
             все *_details = соответствующий fallback;
             соответствующие *_display = "Не установлен".

        2. Общая фраза без конкретики (generic-clause ловушка).
           «Исключительные права передаются в соответствии с законодательством.
           Регистрационные действия совершаются в установленном порядке»
           без конкретного вида передачи, органа регистрации или объекта.
           → presence = "missing";
             exclusive_right_object_type = "not_defined";
             transfer_type = "not_defined";
             registration_required_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях соглашения указаны противоречивые сведения
           о виде передачи (в одном пункте — отчуждение, в другом — лицензия),
           и конфликт нельзя снять по тексту.
           → presence = "unclear";
             transfer_type = "not_defined";
             transfer_type_display = "Не установлен";
             соответствующие *_details = "Не удалось определить".

        4. Специфика темы: отчуждение регистрируемого объекта без упоминания Роспатента.
           В тексте прямо указано отчуждение исключительного права на
           регистрируемый объект (товарный знак, патент), но государственная
           регистрация перехода в Роспатенте в тексте не упомянута (red flag,
           так как без регистрации отчуждение считается несостоявшимся).
           → presence = "present";
             transfer_type = "assignment";
             transfer_type_display = "Отчуждение исключительного права";
             registration_required_status = "not_defined";
             registration_required_details = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exclusive_rights_as_otsupnoe_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для exclusive_right_object_type используй только: "trademark", "patent",
          "software", "know_how", "commercial_designation", "other", "mixed"
          или "not_defined".
        - Для exclusive_right_object_type_display используй только: "Товарный знак",
          "Патент", "Программа для ЭВМ", "Ноу-хау", "Коммерческое обозначение",
          "Иные исключительные права", "Смешанный набор" или "Не установлен".
        - Для transfer_type используй только: "assignment", "license", "mixed"
          или "not_defined".
        - Для transfer_type_display используй только: "Отчуждение исключительного права",
          "Лицензия", "Смешанная передача" или "Не установлен".
        - Для encumbrances_status используй только: "clean", "encumbered" или "not_defined".
        - Для остальных статусных полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * object_identification_details → "Не установлены";
          * registration_required_details → "Не установлено";
          * scope_of_rights_details → "Не установлено";
          * encumbrances_details → "Не установлено";
          * соответствующие *_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details → "Не удалось определить";
          * соответствующие *_display → "Не установлен".
        - Не используй null, None или пустые строки.
        - Даже для полей, помеченных в схеме как required: false, всегда
          возвращай ключ с корректным fallback-значением — не пропускай ключи.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exclusive_rights_as_otsupnoe_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных условий для исключительных прав как предмета отступного. Внутреннее агрегатное signal-поле."
          required: true

        - name: "exclusive_right_object_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["trademark", "patent", "software", "know_how", "commercial_designation", "other", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип объекта исключительных прав. Внутреннее enum-поле, отображается через exclusive_right_object_type_display."
          required: true

        - name: "exclusive_right_object_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип объекта исключительных прав"
          description: >
            Читаемое отображение типа объекта исключительных прав: "Товарный
            знак", "Патент", "Программа для ЭВМ", "Ноу-хау", "Коммерческое
            обозначение", "Иные исключительные права", "Смешанный набор"
            или "Не установлен".
          required: true

        - name: "object_identification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации объекта исключительных прав. Внутреннее enum-поле."
          required: true

        - name: "object_identification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Идентификация объекта"
          description: >
            Идентификация объекта исключительных прав (номер свидетельства,
            регистрации, патента), в том числе через отсылку к документу.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

        - name: "transfer_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["assignment", "license", "mixed", "not_defined"]
          display_in_grid: false
          description: "Вид передачи исключительного права. Внутреннее enum-поле, отображается через transfer_type_display."
          required: true

        - name: "transfer_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Вид передачи"
          description: >
            Читаемое отображение вида передачи исключительного права:
            "Отчуждение исключительного права", "Лицензия", "Смешанная
            передача" или "Не установлен".
          required: true

        - name: "registration_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на государственную регистрацию перехода исключительного права. Внутреннее enum-поле."
          required: true

        - name: "registration_required_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Государственная регистрация перехода"
          description: >
            Формулировка о государственной регистрации перехода исключительного
            права в Роспатенте (или об отсутствии такой необходимости).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "scope_of_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания объёма прав, срока, территории (для лицензии). Внутреннее enum-поле."
          required: true

        - name: "scope_of_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Объём прав / срок / территория"
          description: >
            Формулировка об объёме передаваемых прав, сроке и территории
            (для лицензии); для отчуждения — о полноте передачи.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["clean", "encumbered", "not_defined"]
          display_in_grid: false
          description: "Статус обременений исключительного права (лицензии третьим лицам, залог). Внутреннее enum-поле."
          required: true

        - name: "encumbrances_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Обременения исключительного права"
          description: >
            Формулировка об обременениях исключительного права (лицензии
            третьим лицам, залог).
            Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: currency_control_and_foreign_element_check
    name: "Валютный контроль и иностранный элемент в соглашении об отступном"
    description: >
      Фактографическая проверка наличия иностранного элемента (иностранное
      лицо, иностранная валюта, счёт за рубежом) и урегулирования валютного
      контроля: валюта обязательства, порядок расчётов, валютная оговорка,
      постановка контракта на учёт, специальные экономические меры.
    triggers:
      any: ["foreign_element", "cross_border_payment"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "иностранное лицо"
        - "нерезидент"
        - "иностранная валюта"
        - "валютный контроль"
        - "валютная оговорка"
        - "уполномоченный банк"
        - "счёт в иностранном банке"
        - "постановка на учёт"
        - "ФЗ-173"
        - "валютное законодательство"
        - "курс Банка России"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)иностранн(ое|ого|ых)\\s+лиц"
        - "(?i)нерезидент"
        - "(?i)иностранн(ая|ой|ую)\\s+валют"
        - "(?i)валютн(ый|ого)\\s+контрол"
        - "(?i)уполномоченн(ый|ого)\\s+банк"
        - "(?i)курс\\s+(ЦБ|Банка\\s+России)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ с иностранным
        элементом.
        Проверяется только один вопрос: как в тексте урегулирован валютный
        контроль и связанные с иностранным элементом аспекты.

        Нормативный ориентир:
        - ст. 409 ГК РФ — прекращение обязательства отступным
        - ФЗ-173 «О валютном регулировании и валютном контроле» (в части
          валютных операций, постановки контрактов на учёт, репатриации)
        - Инструкция Банка России № 181-И (постановка контрактов на учёт)
        - Указы Президента РФ о специальных экономических мерах (при наличии)

        Важно:
        - Не оценивай серьёзность риска — устанавливай только то, что прямо
          есть в тексте соглашения.
        - Не подменяй текст договора нормами закона.
        - Иностранный элемент может проявляться тремя способами: (1) сторона
          является иностранным лицом (нерезидентом); (2) валюта обязательства
          или платежа — иностранная; (3) расчёты осуществляются через счёт
          в иностранном банке или уполномоченном банке. Любое из этих
          проявлений — признак валютного регулирования.
        - Общая фраза вроде "расчёты осуществляются в соответствии с валютным
          законодательством РФ" (без указания валюты и порядка), "стороны
          соблюдают требования валютного контроля" (без конкретных действий),
          "курс определяется на дату платежа" (без указания, чей курс) НЕ
          является основанием для "defined" — это not_defined.

        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Есть ли иностранный элемент (сторона-нерезидент, иностранная
           валюта, иностранный счёт).
        2. Какая валюта обязательства указана.
        3. Есть ли условие о порядке расчётов через уполномоченный банк
           или постановке контракта на учёт.
        4. Есть ли валютная оговорка (курс пересчёта).
        5. Есть ли указание на специальные экономические меры (при наличии).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай иностранный элемент, если он прямо не указан.
        3. Не выводи необходимость постановки контракта на учёт из закона —
           фиксируй только то, что есть в тексте.
        4. Общая фраза "в соответствии с валютным законодательством" без
           конкретного порядка — это not_defined.
        5. Если условие не указано прямо — возвращай "not_defined" и
           соответствующий текстовый fallback.
        6. В evidence включай только цитаты из соглашения.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

