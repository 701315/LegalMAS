    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        предмет отступного, механизм его передачи, срок предоставления,
        последствия просрочки и необходимость регистрации.
        Не анализируй первоначальный долг, банкротный контекст, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. otsupnoe_type — "money" / "movable_property" / "real_estate" / "claim" /
           "securities" / "mixed" / "not_defined".
        2. otsupnoe_description_status — "defined" если предмет отступного прямо описан,
           иначе "not_defined".
        3. otsupnoe_description_value — описание предмета отступного.
        4. identifying_features_status — "defined" если индивидуализирующие признаки
           прямо указаны, иначе "not_defined".
        5. identifying_features_value — VIN, кадастровый номер, номер ценной бумаги и т.п.
        6. transfer_document — "payment" / "act" / "assignment_docs" / "registration" /
           "mixed" / "not_defined".
        7. transfer_deadline_status — "defined" если срок предоставления прямо указан,
           иначе "not_defined".
        8. transfer_deadline_value — срок передачи/предоставления отступного.
        9. late_transfer_consequences_status — "defined" если последствия просрочки
           прямо указаны, иначе "not_defined".
        10. late_transfer_consequences_value — последствия просрочки передачи.
        11. registration_required — "yes" / "no" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - otsupnoe_type:
            - "money" — денежные средства.
            - "movable_property" — движимое имущество (автомобиль, оборудование и т.п.).
            - "real_estate" — недвижимое имущество (квартира, здание, земельный участок).
            - "claim" — право требования к третьему лицу.
            - "securities" — ценные бумаги (акции, облигации, векселя).
            - "mixed" — несколько разнотипных объектов одновременно.
            - "not_defined" — тип предмета прямо не определён.
        - transfer_document:
            - "payment" — безналичный платёж (для денег).
            - "act" — акт приёма-передачи (для движимого имущества).
            - "assignment_docs" — акт и документы уступки (для прав требования).
            - "registration" — государственная регистрация (для недвижимости).
            - "mixed" — несколько механизмов одновременно.
            - "not_defined" — механизм передачи прямо не определён.
        - registration_required:
            - "yes" — регистрация прямо предусмотрена текстом соглашения.
            - "no" — прямо указано, что регистрация не требуется.
            - "not_defined" — вопрос регистрации в тексте прямо не урегулирован.
        - Не смешивай механизм передачи с моментом прекращения обязательства.
        - Верни только JSON.
        </rules>
      fields:
        - name: "otsupnoe_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["money", "movable_property", "real_estate", "claim", "securities", "mixed", "not_defined"]
          description: "Тип отступного."
          required: true
        - name: "otsupnoe_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания предмета отступного."
          required: true
        - name: "otsupnoe_description_value"
          type: "string"
          presentation: "fact"
          label: "Предмет отступного"
          description: "Описание предмета отступного."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "identifying_features_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания индивидуализирующих признаков."
          required: false
        - name: "identifying_features_value"
          type: "string"
          presentation: "fact"
          label: "Идентификаторы предмета"
          description: "Индивидуализирующие признаки предмета отступного."
          required: false
          display_in_grid: false
        - name: "transfer_document"
          type: "string"
          presentation: "signal"
          allowed_values: ["payment", "act", "assignment_docs", "registration", "mixed", "not_defined"]
          description: "Механизм оформления передачи отступного."
          required: false
        - name: "transfer_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока предоставления отступного."
          required: true
        - name: "transfer_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок предоставления отступного"
          description: "Срок передачи/предоставления отступного."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "late_transfer_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания последствий просрочки передачи."
          required: false
        - name: "late_transfer_consequences_value"
          type: "string"
          presentation: "fact"
          label: "Последствия просрочки передачи"
          description: "Последствия просрочки передачи отступного."
          required: false
          display_in_grid: false
        - name: "registration_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли регистрация для передачи отступного."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: РЕАЛЬНЫЙ ХАРАКТЕР / МОМЕНТ ПРЕКРАЩЕНИЯ
  # ──────────────────────────────────────────────────────────────────────────
  - id: real_character_and_termination_moment_check
    name: "Реальный характер соглашения и момент прекращения обязательства"
    description: >
      Фактографическая проверка того, к какому моменту текст договора
      привязывает прекращение обязательства: к фактическому предоставлению,
      к регистрации, к зачислению денег или к подписанию соглашения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "с момента передачи отступного"
        - "с момента фактической передачи"
        - "после предоставления отступного"
        - "с момента зачисления денежных средств"
        - "с момента государственной регистрации"
        - "с даты подписания"
        - "реальная сделка"
      keyword_mode: "any"
      negative_keywords:
        - "обязательство прекращается с даты подписания настоящего соглашения"
        - "обязательство прекращается с момента заключения настоящего соглашения"
      regex_patterns:
        - "(?i)обязательств(о|а).*прекраща(ется|ются).*с\\s+момента"
        - "(?i)с\\s+момента\\s+фактическ(ой|ого)\\s+передач"
        - "(?i)с\\s+даты\\s+подписания"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какой момент прекращения обязательства
        прямо указан в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прекращается ли обязательство с момента фактической передачи.
        2. Прекращается ли обязательство с момента государственной регистрации.
        3. Прекращается ли обязательство с момента зачисления денежных средств.
        4. Прекращается ли обязательство с даты подписания.
        5. Есть ли указание, что кредитор сохраняет право требовать исполнение
           до фактического предоставления отступного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подменяй текст нормы закона.
        3. Не делай квалификационный вывод вовне — только извлекай факт.
        4. Если момент не указан прямо — верни "not_defined" / "Данные не определены".
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Обязательство Должника считается прекращенным с момента фактической передачи
        Кредитору имущества, указанного в п. 2.1 настоящего соглашения."

        Ответ:
        {
          "termination_moment_code": "upon_actual_transfer",
          "termination_moment_status": "defined",
          "termination_moment_details": "с момента фактической передачи Кредитору имущества",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство Должника считается прекращенным с момента фактической передачи Кредитору имущества."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Обязательство прекращается с даты подписания настоящего соглашения."

        Ответ:
        {
          "termination_moment_code": "upon_signing",
          "termination_moment_status": "defined",
          "termination_moment_details": "с даты подписания настоящего соглашения",
          "creditor_right_preserved_until_transfer_status": "not_defined",
          "creditor_right_preserved_until_transfer_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Обязательство прекращается с даты подписания настоящего соглашения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте прекращения.
        2. Не выводи момент прекращения по умолчанию из закона, если его нет в тексте.
        3. Если прямой цитаты нет — верни "not_defined".
        4. Не додумывай намерения сторон.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_moment_code": "<upon_actual_transfer / upon_registration / upon_payment_receipt / upon_signing / not_defined>",
          "termination_moment_status": "<defined / not_defined>",
          "termination_moment_details": "<текст или 'Данные не определены'>",
          "creditor_right_preserved_until_transfer_status": "<defined / not_defined>",
          "creditor_right_preserved_until_transfer_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "с момента передачи отступного с момента фактической передачи после предоставления отступного с момента зачисления денежных средств с момента государственной регистрации с даты подписания реальная сделка обязательство считается прекращённым"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "срок передачи отступного"
        - "не позднее"
        - "в течение дней"
        - "последствия просрочки"
        - "стоимость отступного"
        - "не является новацией"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        момент прекращения обязательства и указание на сохранение права кредитора
        до фактического предоставления отступного.
        Не анализируй предмет отступного, стоимость, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_moment_code — "upon_actual_transfer" / "upon_registration" /
           "upon_payment_receipt" / "upon_signing" / "not_defined".
        2. termination_moment_status — "defined" если момент прекращения прямо указан
           в тексте соглашения, иначе "not_defined".
        3. termination_moment_details — формулировка о моменте прекращения обязательства.
        4. creditor_right_preserved_until_transfer_status — "defined" если прямо указано,
           что кредитор сохраняет право требовать исполнение первоначального обязательства
           до фактического предоставления отступного, иначе "not_defined".
        5. creditor_right_preserved_until_transfer_details — формулировка о сохранении
           права кредитора.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - termination_moment_code:
            - "upon_actual_transfer" — обязательство прекращается с момента фактической
              передачи предмета отступного (акт, фактическая передача имущества).
            - "upon_registration" — обязательство прекращается с момента государственной
              регистрации перехода права (для недвижимости).
            - "upon_payment_receipt" — обязательство прекращается с момента зачисления
              денежных средств на счёт кредитора (для денежного отступного).
            - "upon_signing" — обязательство прекращается с даты подписания соглашения.
            - "not_defined" — момент прекращения прямо не определён.
        - Не выводи момент прекращения из нормы ст. 409 ГК РФ или иных норм закона —
          только из текста соглашения.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_moment_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_actual_transfer", "upon_registration", "upon_payment_receipt", "upon_signing", "not_defined"]
          description: "Момент прекращения обязательства по тексту соглашения."
          required: true
        - name: "termination_moment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания момента прекращения обязательства."
          required: true
        - name: "termination_moment_details"
          type: "string"
          presentation: "fact"
          label: "Момент прекращения обязательства"
          description: "Формулировка о моменте прекращения обязательства."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "creditor_right_preserved_until_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания, что право кредитора сохраняется до предоставления отступного."
          required: false
        - name: "creditor_right_preserved_until_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Сохранение права кредитора до предоставления"
          description: "Формулировка о сохранении права кредитора до фактического предоставления отступного."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: СТОИМОСТЬ / ОБЪЁМ ПОГАШЕНИЯ / ОКОНЧАТЕЛЬНОСТЬ
  # ──────────────────────────────────────────────────────────────────────────
  - id: valuation_and_settlement_scope_check
    name: "Стоимость отступного, объём погашения долга и окончательность расчётов"
    description: >
      Фактографическая проверка согласованной стоимости отступного,
      объёма погашения долга, остатка долга при частичном погашении,
      а также оговорок об окончательности урегулирования.
    triggers:
      any: ["partial_termination", "tax_sensitive_structure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "стоимость отступного"
        - "оценивается сторонами"
        - "в полном объеме"
        - "частично"
        - "остаток долга"
        - "полное погашение"
        - "согласованная стоимость"
        - "стороны не имеют претензий"
        - "долг считается погашенным"
        - "прекращаются все обязательства"
        - "без права на предъявление дальнейших требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+отступн"
        - "(?i)в\\s+полном\\s+объеме|частичн"
        - "(?i)остат(ок|ка)\\s+долг"
        - "(?i)не\\s+имеют\\s+друг\\s+к\\s+другу\\s+претенз"
        - "(?i)долг\\s+считается\\s+погашенн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: стоимость отступного, объём погашения долга,
        остаток долга и окончательность расчётов.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - НК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли согласованная стоимость отступного.
        2. Есть ли указание на способ определения стоимости.
        3. Погашается долг полностью или частично.
        4. Если частично — определён ли остаток долга.
        5. Есть ли формулировка об окончательности урегулирования.
        6. Есть ли отказ от дальнейших претензий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай стоимость, остаток долга и метод оценки.
        3. Если данных нет — верни "Данные не определены" / "not_defined".
        4. Не используй None/null.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны согласовали стоимость отступного в размере 900 000 рублей.
        Передача отступного прекращает обязательство в полном объеме.
        После исполнения настоящего соглашения стороны не имеют друг к другу
        каких-либо претензий."

        Ответ:
        {
          "agreed_value_status": "defined",
          "agreed_value_details": "900 000 рублей",
          "valuation_method": "contractual",
          "debt_termination_scope": "full",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Данные не определены",
          "full_and_final_settlement_status": "defined",
          "full_and_final_settlement_details": "стороны не имеют друг к другу каких-либо претензий",
          "no_further_claims_status": "defined",
          "no_further_claims_details": "стороны не имеют друг к другу каких-либо претензий",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стороны согласовали стоимость отступного в размере 900 000 рублей. Передача отступного прекращает обязательство в полном объеме."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о передаче имущества."

        Ответ:
        {
          "agreed_value_status": "not_defined",
          "agreed_value_details": "Данные не определены",
          "valuation_method": "not_defined",
          "debt_termination_scope": "not_defined",
          "remaining_debt_status": "not_defined",
          "remaining_debt_details": "Данные не определены",
          "full_and_final_settlement_status": "not_defined",
          "full_and_final_settlement_details": "Данные не определены",
          "no_further_claims_status": "not_defined",
          "no_further_claims_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о стоимости отступного.
        2. Найди прямую цитату о полном/частичном погашении.
        3. Найди прямую цитату об остатке долга.
        4. Найди прямую цитату об окончательности расчётов.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "agreed_value_status": "<defined / not_defined>",
          "agreed_value_details": "<текст или 'Данные не определены'>",
          "valuation_method": "<contractual / market / appraiser / not_defined>",
          "debt_termination_scope": "<full / partial / not_defined>",
          "remaining_debt_status": "<defined / not_defined>",
          "remaining_debt_details": "<текст или 'Данные не определены'>",
          "full_and_final_settlement_status": "<defined / not_defined>",
          "full_and_final_settlement_details": "<текст или 'Данные не определены'>",
          "no_further_claims_status": "<defined / not_defined>",
          "no_further_claims_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость отступного оценивается сторонами в полном объёме частично остаток долга полное погашение согласованная стоимость стороны не имеют претензий долг считается погашенным прекращаются все обязательства без права на дальнейшие требования"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "сумма первоначального долга"
        - "основной долг по договору"
        - "предмет отступного"
        - "передача имущества"
        - "срок передачи"
        - "момент прекращения"
        - "не является новацией"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        согласованную стоимость отступного, метод её определения, объём погашения долга,
        остаток долга и оговорки об окончательности урегулирования.
        Не анализируй титул, банкротство, налоги или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. agreed_value_status — "defined" если согласованная стоимость отступного прямо
           указана, иначе "not_defined".
        2. agreed_value_details — стоимость отступного.
        3. valuation_method — "contractual" / "market" / "appraiser" / "not_defined".
        4. debt_termination_scope — "full" / "partial" / "not_defined".
        5. remaining_debt_status — "defined" если остаток долга прямо указан,
           иначе "not_defined".
        6. remaining_debt_details — остаток долга после частичного прекращения.
        7. full_and_final_settlement_status — "defined" если прямо указана окончательность
           урегулирования (долг считается погашенным, прекращаются все обязательства),
           иначе "not_defined".
        8. full_and_final_settlement_details — формулировка об окончательности.
        9. no_further_claims_status — "defined" если прямо указан отказ от дальнейших
           претензий, иначе "not_defined".
        10. no_further_claims_details — формулировка об отсутствии дальнейших претензий.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - valuation_method:
            - "contractual" — стоимость определена соглашением сторон (прямо зафиксирована
              в тексте как договорённость).
            - "market" — стоимость определена по рыночной оценке, на которую есть прямая
              ссылка в тексте.
            - "appraiser" — стоимость определена независимым оценщиком, отчёт которого
              прямо упомянут.
            - "not_defined" — метод определения стоимости прямо не указан.
        - debt_termination_scope:
            - "full" — обязательство прекращается в полном объёме.
            - "partial" — обязательство прекращается частично.
            - "not_defined" — объём прекращения прямо не определён.
        - full_and_final_settlement_status = "defined" только если это явно следует из
          текста (формулировка об окончательности, о том что долг считается погашенным).
        - Верни только JSON.
        </rules>
      fields:
        - name: "agreed_value_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания согласованной стоимости отступного."
          required: false
        - name: "agreed_value_details"
          type: "string"
          presentation: "fact"
          label: "Стоимость отступного"
          description: "Согласованная стоимость отступного."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "valuation_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["contractual", "market", "appraiser", "not_defined"]
          description: "Метод определения стоимости отступного."
          required: false
        - name: "debt_termination_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "partial", "not_defined"]
          description: "Полное или частичное погашение долга."
          required: false
        - name: "remaining_debt_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания остатка долга."
          required: false
        - name: "remaining_debt_details"
          type: "string"
          presentation: "fact"
          label: "Остаток долга"
          description: "Остаток долга после частичного прекращения."
          required: false
          display_in_grid: false
        - name: "full_and_final_settlement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки об окончательности урегулирования."
          required: false
        - name: "full_and_final_settlement_details"
          type: "string"
          presentation: "fact"
          label: "Окончательность урегулирования"
          description: "Формулировка об окончательности урегулирования."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "no_further_claims_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отказа от дальнейших претензий."
          required: false
        - name: "no_further_claims_details"
          type: "string"
          presentation: "fact"
          label: "Отказ от дальнейших претензий"
          description: "Формулировка об отсутствии дальнейших претензий."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: ОТГРАНИЧЕНИЕ ОТ ИНЫХ КОНСТРУКЦИЙ
  # ──────────────────────────────────────────────────────────────────────────
  - id: recharacterization_distinction_check
    name: "Формулировки об отступном и отграничение от новации, прощения долга, зачёта"
    description: >
      Фактографическая проверка наличия в тексте прямой ссылки на ст. 409 ГК РФ,
      указания, что соглашение является отступным, а также оговорок о том,
      что конструкция не является новацией, прощением долга или зачётом.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не является новацией"
        - "не является прощением долга"
        - "не является зачетом"
        - "не является куплей-продажей"
        - "прекращение обязательства отступным"
        - "вместо исполнения"
        - "замена обязательства"
        - "ст. 409 ГК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+новаци"
        - "(?i)не\\s+является\\s+прощени(ем|я)\\s+долг"
        - "(?i)замен(а|яет)\\s+обязательств"
        - "(?i)ст(?:атья|\\.)?\\s*409"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется соглашение об отступном по ст. 409 ГК РФ.
        Проверяется только один вопрос: какие квалифицирующие формулировки
        прямо есть в тексте соглашения.

        Нормативный ориентир:
        - ст. 409 ГК РФ
        - ст. 410 ГК РФ
        - ст. 414 ГК РФ
        - ст. 415 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямая ссылка на ст. 409 ГК РФ.
        2. Есть ли прямое указание, что соглашение является отступным.
        3. Есть ли оговорка, что соглашение не является новацией.
        4. Есть ли оговорка, что соглашение не является прощением долга.
        5. Есть ли оговорка, что соглашение не является зачётом.
        6. Есть ли формулировка "вместо исполнения" или аналогичная.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не делай самостоятельной переквалификации.
        3. Фиксируй только наличие / отсутствие текстовых формулировок.
        4. Если формулировки нет — верни "not_defined".
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ
        и не является новацией, прощением долга или зачётом."

        Ответ:
        {
          "st409_reference_status": "defined",
          "st409_reference_details": "ст. 409 ГК РФ",
          "qualification_as_otsupnoe_status": "defined",
          "qualification_as_otsupnoe_details": "соглашение является соглашением об отступном",
          "novation_clause_status": "defined",
          "novation_clause_details": "не является новацией",
          "debt_forgiveness_clause_status": "defined",
          "debt_forgiveness_clause_details": "не является прощением долга",
          "setoff_clause_status": "defined",
          "setoff_clause_details": "не является зачётом",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящее соглашение является соглашением об отступном в смысле ст. 409 ГК РФ и не является новацией, прощением долга или зачётом."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны урегулировали отношения настоящим соглашением."

        Ответ:
        {
          "st409_reference_status": "not_defined",
          "st409_reference_details": "Данные не определены",
          "qualification_as_otsupnoe_status": "not_defined",
          "qualification_as_otsupnoe_details": "Данные не определены",
          "novation_clause_status": "not_defined",
          "novation_clause_details": "Данные не определены",
          "debt_forgiveness_clause_status": "not_defined",
          "debt_forgiveness_clause_details": "Данные не определены",
          "setoff_clause_status": "not_defined",
          "setoff_clause_details": "Данные не определены",
          "instead_of_performance_status": "not_defined",
          "instead_of_performance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую ссылку на ст. 409 ГК РФ.
        2. Найди прямые формулировки о новации / прощении долга / зачёте.
        3. Не делай вывод "есть риск" без текстовой основы.
        4. Если формулировки нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "st409_reference_status": "<defined / not_defined>",
          "st409_reference_details": "<текст или 'Данные не определены'>",
          "qualification_as_otsupnoe_status": "<defined / not_defined>",
          "qualification_as_otsupnoe_details": "<текст или 'Данные не определены'>",
          "novation_clause_status": "<defined / not_defined>",
          "novation_clause_details": "<текст или 'Данные не определены'>",
          "debt_forgiveness_clause_status": "<defined / not_defined>",
          "debt_forgiveness_clause_details": "<текст или 'Данные не определены'>",
          "setoff_clause_status": "<defined / not_defined>",
          "setoff_clause_details": "<текст или 'Данные не определены'>",
          "instead_of_performance_status": "<defined / not_defined>",
          "instead_of_performance_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не является новацией прощение долга зачёт отступное ст. 409 ГК РФ вместо исполнения замена обязательства квалификация как отступное прекращение обязательства отступным не является куплей-продажей"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "первоначальное обязательство"
        - "предмет отступного"
        - "срок передачи"
        - "момент прекращения"
        - "стоимость отступного"
        - "залог"
        - "банкротство"
        - "НДС"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста соглашения об отступном
        квалифицирующие формулировки: ссылка на ст. 409 ГК РФ, прямое указание
        на отступное, оговорки об отсутствии новации, прощения долга, зачёта,
        а также формулировку «вместо исполнения».
        Не анализируй фактический риск переквалификации — только извлекай
        текстовые формулировки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. st409_reference_status — "defined" если прямая ссылка на ст. 409 ГК РФ
           присутствует в тексте, иначе "not_defined".
        2. st409_reference_details — формулировка со ссылкой на ст. 409 ГК РФ.
        3. qualification_as_otsupnoe_status — "defined" если соглашение прямо названо
           соглашением об отступном, иначе "not_defined".
        4. qualification_as_otsupnoe_details — такая формулировка.
        5. novation_clause_status — "defined" если прямо указано, что соглашение
           не является новацией, иначе "not_defined".
        6. novation_clause_details — формулировка об отсутствии новации.
        7. debt_forgiveness_clause_status — "defined" если прямо указано, что соглашение
           не является прощением долга, иначе "not_defined".
        8. debt_forgiveness_clause_details — формулировка об отсутствии прощения долга.
        9. setoff_clause_status — "defined" если прямо указано, что соглашение
           не является зачётом, иначе "not_defined".
        10. setoff_clause_details — формулировка об отсутствии зачёта.
        11. instead_of_performance_status — "defined" если в тексте есть формулировка
            «вместо исполнения» или аналогичная, иначе "not_defined".
        12. instead_of_performance_details — такая формулировка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст соглашения.
        - st409_reference_status = "defined" только если статья 409 ГК РФ прямо
          упомянута; не считай достаточным просто слово «отступное» без ссылки.
        - qualification_as_otsupnoe_status = "defined" только если соглашение прямо
          поименовано как «соглашение об отступном» или аналогично.
        - Не делай самостоятельного вывода о риске переквалификации.
        - Верни только JSON.
        </rules>
      fields:
        - name: "st409_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия прямой ссылки на ст. 409 ГК РФ."
          required: false
        - name: "st409_reference_details"
          type: "string"
          presentation: "fact"
          label: "Ссылка на ст. 409 ГК РФ"
          description: "Прямая ссылка на ст. 409 ГК РФ."
          required: false
          display_in_grid: false
        - name: "qualification_as_otsupnoe_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прямого указания на отступное."
          required: true
        - name: "qualification_as_otsupnoe_details"
          type: "string"
          presentation: "fact"
          label: "Квалификация как отступное"
          description: "Формулировка, что соглашение является отступным."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "novation_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки об отсутствии новации."
          required: false
        - name: "novation_clause_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие новации"
          description: "Формулировка, что соглашение не является новацией."
          required: false
          display_in_grid: false
        - name: "debt_forgiveness_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки об отсутствии прощения долга."
          required: false
        - name: "debt_forgiveness_clause_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие прощения долга"
          description: "Формулировка, что соглашение не является прощением долга."
          required: false
          display_in_grid: false
        - name: "setoff_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки об отсутствии зачёта."
          required: false
        - name: "setoff_clause_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие зачёта"
          description: "Формулировка, что соглашение не является зачётом."
          required: false
          display_in_grid: false
        - name: "instead_of_performance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус формулировки 'вместо исполнения' или аналогичной."
          required: false
        - name: "instead_of_performance_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка 'вместо исполнения'"
          description: "Формулировка о предоставлении отступного вместо исполнения."
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: ГАРАНТИИ / РИСК ДО ПЕРЕДАЧИ
  # ──────────────────────────────────────────────────────────────────────────
  - id: title_and_warranties_check
    name: "Гарантии в отношении предмета отступного и риск до передачи"
    description: >
      Фактографическая проверка наличия заверений об отсутствии обременений,
      залога, ареста, прав третьих лиц, а также условий о качестве предмета
      отступного и распределении риска до момента передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "свободно от прав третьих лиц"
        - "не заложено"
        - "не арестовано"
        - "право собственности принадлежит"
