        - "переход права собственности"
        - "расходы на регистрацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)ЕГРН|Росреестр"

  - id: "claim_assignment_specifics"
    name: "Право требования как отступное: условия уступки"
    description: "Проверяет описание уступаемого требования и передачу подтверждающих документов"
    legal_base: "ст. 382-390, 409 ГК РФ"
