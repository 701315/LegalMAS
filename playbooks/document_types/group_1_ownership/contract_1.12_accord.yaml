              "quote": "Должник подтверждает, что автомобиль принадлежит ему на праве собственности, не находится в залоге, под арестом и свободен от прав третьих лиц. Риск случайной гибели до момента передачи несет Должник."
            }
          ]
        }

        Пример 2 — полностью не определено:
        Фрагмент:
        "Имущество передается кредитору."

        Ответ:
        {
          "title_warranty_status": "not_defined",
          "title_warranty_details": "Заверение отсутствует в тексте",
