          label: "Должник"
          description: >
            Наименование/ФИО и реквизиты Должника.
            Fallback: "Не установлены" / "Не удалось определить".
          required: true

        - name: "debtor_type"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["legal_entity", "individual", "individual_entrepreneur", "not_defined"]
          display_in_grid: false
          description: "Тип Должника. Внутреннее enum-поле, не выводится отдельным столбцом."
          required: true

        - name: "debtor_signatory_status"
          type: "string"
