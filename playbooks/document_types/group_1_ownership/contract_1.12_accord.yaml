          description: "Налоговые последствия отступного — НДС при передаче имущества"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*61\\.3\\s+(?:Закона|ФЗ)\\s+о\\s+банкротстве"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Ст. 61.3 Закона о банкротстве — оспаривание отступного как сделки с предпочтением"

      low:
        - pattern: "(?i)кредитный\\s+договор"
          weight: 0.28
          distinctiveness: low
          context: body
          description: "Кредитный договор — частая база для отступного"

        - pattern: "(?i)\\bзадолженность\\b"
          weight: 0.24
          distinctiveness: low
          context: body
          description: "Общая задолженность"

        - pattern: "(?i)денежное\\s+обязательство"
          weight: 0.24
          distinctiveness: low
          context: body
          description: "Денежное обязательство"

        - pattern: "(?i)имущественное\\s+обязательство"
          weight: 0.22
          distinctiveness: low
          context: body
          description: "Общая имущественная обязанность"

        - pattern: "(?i)передача\\s+имущества\\s+кредитору"
          weight: 0.26
          distinctiveness: low
          context: body
          description: "Передача имущества кредитору"

        - pattern: "(?i)стоимость\\s+отступного"
