        Заполни строго следующие поля:

        1. statutory_pledge_status — "defined" если залог в силу закона прямо упомянут в тексте, иначе "not_defined".
        2. statutory_pledge_details — текст договора о залоге в силу закона в пользу получателя ренты.
        3. encumbrance_registration_status — "defined" если регистрация обременения рентой в Росреестре прямо указана, иначе "not_defined".
        4. movable_security_status — "defined" если обеспечение выплаты ренты по движимому имуществу прямо указано, иначе "not_defined".
        5. movable_security_type — вид обеспечения: "guarantee" / "surety" / "pledge" / "insurance" / "not_applicable" / "not_defined".

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Только текст договора.
        - guarantee = банковская гарантия.
        - surety = поручительство.
        - pledge = иной залог (не в силу закона).
        - insurance = страхование ответственности плательщика.
        - not_applicable = договор касается недвижимости, обеспечение движимого неприменимо.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "statutory_pledge_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о залоге в силу закона."
          required: true
        - name: "statutory_pledge_details"
          type: "string"
          presentation: "fact"
          label: "Залог в силу закона"
          description: "Текст договора о залоге в силу закона в пользу получателя ренты."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "encumbrance_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о регистрации обременения рентой."
          required: true
        - name: "movable_security_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обеспечения выплаты ренты по движимому имуществу."
          required: true
        - name: "movable_security_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["guarantee", "surety", "pledge", "insurance", "not_applicable", "not_defined"]
          description: "Вид обеспечения выплаты ренты по движимому имуществу."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Размер ренты, периодичность и индексация
  # ──────────────────────────────────────────────────────────────────────────
  - id: rent_amount_indexation_check
    name: "Размер ренты, периодичность и индексация (ст. 590, 597, 602 ГК РФ)"
    description: >
      Фактографическая проверка размера рентного предоставления, периодичности,
      привязки к прожиточному минимуму и механизма индексации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "ежемесячная выплата"
        - "денежная сумма"
        - "не менее"
        - "увеличивается пропорционально"
        - "ежеквартально"
        - "ежегодно"
        - "выплачивается"
        - "содержание"
        - "индекс потребительских цен"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
        - "(?i)(ежемесячн|ежеквартальн|ежегодн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 590, 597, 602 ГК РФ).
        Проверяется только один вопрос: размер ренты, периодичность и индексация.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Размер ренты/содержания (конкретная сумма).
        2. Привязку к прожиточному минимуму (ПМ).
        3. Механизм индексации.
        4. Периодичность выплат/содержания.
        5. Последствия просрочки рентных платежей (пеня/проценты).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Плательщик ренты обязуется выплачивать получателю ренту в размере
        30 000 рублей ежемесячно, но не менее одного прожиточного минимума,
        установленного в г. Москве. Размер ренты индексируется пропорционально
        росту прожиточного минимума. За просрочку выплаты — пеня 0,1% за каждый день."

        Ответ:
        {
          "rent_amount_status": "defined",
          "rent_amount_value": "30 000 рублей ежемесячно",
          "pm_link_status": "defined",
          "pm_link_details": "не менее одного прожиточного минимума, установленного в г. Москве",
          "indexation_status": "defined",
          "indexation_mechanism": "pm_based",
          "payment_periodicity_status": "defined",
          "payment_periodicity_code": "monthly",
          "late_payment_status": "defined",
          "late_payment_details": "пеня 0,1% за каждый день",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Плательщик ренты обязуется выплачивать получателю ренту в размере 30 000 рублей ежемесячно, но не менее одного прожиточного минимума, установленного в г. Москве."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Размер ренты определяется соглашением сторон."

        Ответ:
        {
          "rent_amount_status": "not_defined",
          "rent_amount_value": "Данные не определены",
          "pm_link_status": "not_defined",
          "pm_link_details": "Данные не определены",
          "indexation_status": "not_defined",
          "indexation_mechanism": "not_defined",
          "payment_periodicity_status": "not_defined",
          "payment_periodicity_code": "not_defined",
          "late_payment_status": "not_defined",
          "late_payment_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли конкретная сумма ренты числом?
        2. Есть ли привязка к прожиточному минимуму?
        3. Описан ли механизм индексации?
        4. Указана ли периодичность прямо (ежемесячно / ежеквартально)?
        5. Упомянуты ли пени или проценты за просрочку?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rent_amount_status": "<defined / not_defined>",
          "rent_amount_value": "<сумма или 'Данные не определены'>",
          "pm_link_status": "<defined / not_defined>",
          "pm_link_details": "<текст или 'Данные не определены'>",
          "indexation_status": "<defined / not_defined>",
          "indexation_mechanism": "<pm_based / inflation / custom / not_defined>",
          "payment_periodicity_status": "<defined / not_defined>",
          "payment_periodicity_code": "<monthly / quarterly / yearly / custom / not_defined>",
          "late_payment_status": "<defined / not_defined>",
          "late_payment_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "размер ренты прожиточный минимум индексация ежемесячная выплата денежная сумма не менее увеличивается пропорционально ежеквартально ежегодно выплачивается содержание индекс потребительских цен"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "пеня"
        - "проценты за просрочку"
        - "неустойка"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "залог в силу закона"
        - "обременение рентой"
        - "нотариальное удостоверение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1050

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты размер ренты,
        привязку к прожиточному минимуму, индексацию, периодичность выплат
        и последствия просрочки.
        Не анализируй имущество, выкуп, риск гибели или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. rent_amount_status — "defined" если размер ренты прямо указан, иначе "not_defined".
        2. rent_amount_value — размер ренты или содержания.
        3. pm_link_status — "defined" если есть привязка к прожиточному минимуму, иначе "not_defined".
        4. pm_link_details — текст о привязке к прожиточному минимуму.
        5. indexation_status — "defined" если индексация прямо указана, иначе "not_defined".
        6. indexation_mechanism — "pm_based" / "inflation" / "custom" / "not_defined".
        7. payment_periodicity_status — "defined" если периодичность указана, иначе "not_defined".
        8. payment_periodicity_code — "monthly" / "quarterly" / "yearly" / "custom" / "not_defined".
        9. late_payment_status — "defined" если последствия просрочки прямо указаны, иначе "not_defined".
        10. late_payment_details — текст о пене, процентах или иной ответственности за просрочку.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Только текст договора.
        - pm_based = индексация привязана к прожиточному минимуму.
        - inflation = индексация привязана к инфляции или индексу потребительских цен.
        - custom = иной механизм индексации, прямо описанный в договоре.
        - monthly = ежемесячно, quarterly = ежеквартально, yearly = ежегодно.
        - Не смешивай late_payment с общим risk/insurance block.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "rent_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения размера ренты."
