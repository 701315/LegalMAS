        unclear_values: ["unclear"]

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты сведения о залоге
        в силу закона, регистрации обременения рентой и обеспечении выплат.
        Не анализируй описание имущества, выкуп, страхование просрочки или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rent_security_and_statutory_pledge_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (statutory_pledge_status, encumbrance_registration_status,
              movable_security_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - statutory_pledge_status = "not_defined";
           - encumbrance_registration_status = "not_defined";
           - movable_security_status = "not_defined";
           - movable_security_type = "not_defined";
           - statutory_pledge_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. statutory_pledge_status — "defined" если залог в силу закона прямо упомянут в тексте, иначе "not_defined".
        2. statutory_pledge_details — текст договора о залоге в силу закона в пользу получателя ренты.
        3. encumbrance_registration_status — "defined" если регистрация обременения рентой в Росреестре прямо указана, иначе "not_defined".
        4. movable_security_status — "defined" если обеспечение выплаты ренты по движимому имуществу прямо указано, иначе "not_defined".
        5. movable_security_type — вид обеспечения: "guarantee" / "surety" / "pledge" / "insurance" / "not_applicable" / "not_defined".

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни rent_security_and_statutory_pledge_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", movable_security_type = "not_defined", statutory_pledge_details = "Данные не определены".
        - Только текст договора.
        - guarantee = банковская гарантия.
        - surety = поручительство.
        - pledge = иной залог (не в силу закона).
        - insurance = страхование ответственности плательщика.
        - not_applicable = договор касается только недвижимости, обеспечение движимого неприменимо.
        - not_defined = об обеспечении движимого в тексте ничего не сказано.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни залога в силу закона, ни обременения рентой,
           ни обеспечения выплат.
           → presence = "missing";
             все *_status = "not_defined";
             movable_security_type = "not_defined";
             statutory_pledge_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Упомянут залог в силу закона, но без указания на регистрацию
           обременения рентой в Росреестре.
           → presence = "present";
             statutory_pledge_status = "defined";
             encumbrance_registration_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды обеспечения
           или разные объекты залога, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             statutory_pledge_details = "Не удалось определить".

        4. Имущество движимое — специфика ст. 587 ГК РФ.
           Договор касается движимого имущества; правило о залоге в силу закона
           к нему не применяется, но стороны могут предусмотреть иное обеспечение.
           → presence = "present" (если обеспечение указано);
             statutory_pledge_status = "not_defined";
             movable_security_status = "defined";
             movable_security_type = "guarantee" / "surety" / "pledge" / "insurance".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rent_security_and_statutory_pledge_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для movable_security_type используй только: "guarantee", "surety", "pledge", "insurance", "not_applicable", "not_defined".
        - Fallback при отсутствии данных: statutory_pledge_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: statutory_pledge_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_security_and_statutory_pledge_presence"
