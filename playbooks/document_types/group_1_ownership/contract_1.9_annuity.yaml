  - id: lifetime_maintenance_scope_check
    name: "ДПСИ: объём натурального содержания, ритуальные услуги, замена деньгами (ст. 602-603 ГК РФ)"
    description: >
      Фактографическая проверка наличия и детализации натурального содержания при ДПСИ,
      включая ритуальные услуги и условия замены содержания денежными выплатами.
