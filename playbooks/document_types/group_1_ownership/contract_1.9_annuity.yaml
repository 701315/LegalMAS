           В разных частях договора указаны разные основания расторжения
           или разные сроки снятия обременения, конфликт нельзя разрешить
           по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined".

        4. Общая отсылка к закону вместо конкретных оснований.
           "Стороны вправе расторгнуть договор в соответствии с законодательством РФ"
           без указания конкретных оснований.
           → presence = "present" (если другие поля определены);
             termination_grounds_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rent_termination_and_return_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_termination_and_return_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о расторжении / возврате имущества / снятии обременения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения оснований расторжения договора ренты. Внутреннее enum-поле."
          required: true
        - name: "breach_criteria_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения критериев существенного нарушения. Внутреннее enum-поле."
          required: true
        - name: "return_of_property_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о возврате имущества при расторжении. Внутреннее enum-поле."
          required: true
        - name: "encumbrance_removal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования снятия обременения рентой. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: risk_and_insurance_check
    name: "Риск случайной гибели имущества и страхование"
    description: >
      Фактографическая проверка распределения риска случайной гибели или повреждения
      имущества и наличия страхования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск повреждения"
        - "страхование имущества"
        - "страхование ответственности"
        - "выгодоприобретатель"
        - "не освобождает от выплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел"
        - "(?i)страхов(ание|ой\\s+полис)"
        - "(?i)выгодоприобретател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты.
        Проверяется только один вопрос: риск случайной гибели и страхование.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт риск случайной гибели/повреждения имущества.
        2. Влияет ли гибель имущества на обязанность выплачивать ренту.
        3. Предусмотрено ли страхование.
        4. Кто является выгодоприобретателем.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Риск случайной гибели или случайного повреждения имущества несёт Плательщик ренты.
        Случайная гибель имущества не освобождает Плательщика от обязательства
        выплачивать ренту. Имущество застраховано Плательщиком ренты в пользу
        Получателя ренты."

        Ответ:
        {
          "risk_allocation_status": "defined",
          "risk_allocation_code": "payer",
          "loss_non_discharge_status": "defined",
          "loss_non_discharge_details": "случайная гибель не освобождает от выплаты ренты",
          "insurance_status": "defined",
          "insurance_beneficiary_status": "defined",
          "insurance_beneficiary_value": "Получатель ренты",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Риск случайной гибели несёт Плательщик ренты."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются соблюдать условия настоящего договора."

        Ответ:
        {
          "risk_allocation_status": "not_defined",
          "risk_allocation_code": "not_defined",
          "loss_non_discharge_status": "not_defined",
          "loss_non_discharge_details": "Данные не определены",
          "insurance_status": "not_defined",
          "insurance_beneficiary_status": "not_defined",
          "insurance_beneficiary_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли сказано, кто несёт риск?
        2. Написано ли, освобождает ли гибель от выплаты ренты?
        3. Предусмотрено ли страхование?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_code": "<payer / receiver / not_defined>",
          "loss_non_discharge_status": "<defined / not_defined>",
          "loss_non_discharge_details": "<текст или 'Данные не определены'>",
          "insurance_status": "<defined / not_defined>",
          "insurance_beneficiary_status": "<defined / not_defined>",
          "insurance_beneficiary_value": "<сторона или 'Данные не определены'>",
          "evidence": [{"clause_ref":"<пункт>", "quote":"<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели риск повреждения страхование имущества страхование ответственности выгодоприобретатель не освобождает от выплаты гибель имущества обязанность выплачивать ренту"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "залог в силу закона"
        - "обременение рентой"
        - "поручительство"
        - "банковская гарантия"
        - "выкуп ренты"
        - "расторжение договора"
        - "существенное нарушение"
        - "прожиточный минимум"
        - "индексация"
        - "запрет отчуждения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "risk_and_insurance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты условия
        о риске случайной гибели имущества и страховании.
        Не анализируй просрочку платежей, выкуп или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_and_insurance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (risk_allocation_status, loss_non_discharge_status,
              insurance_status, insurance_beneficiary_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_allocation_status = "not_defined";
           - risk_allocation_code = "not_defined";
           - loss_non_discharge_status = "not_defined";
           - insurance_status = "not_defined";
           - insurance_beneficiary_status = "not_defined";
           - loss_non_discharge_details, insurance_beneficiary_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. risk_allocation_status — "defined" если риск случайной гибели прямо распределён, иначе "not_defined".
        2. risk_allocation_code — сторона, несущая риск: "payer" / "receiver" / "not_defined".
        3. loss_non_discharge_status — "defined" если прямо написано, влияет ли гибель имущества на обязанность выплачивать ренту, иначе "not_defined".
        4. loss_non_discharge_details — текст о влиянии гибели на обязательство.
        5. insurance_status — "defined" если страхование предусмотрено, иначе "not_defined".
        6. insurance_beneficiary_status — "defined" если выгодоприобретатель прямо указан, иначе "not_defined".
        7. insurance_beneficiary_value — наименование выгодоприобретателя.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_and_insurance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status / risk_allocation_code = "not_defined", все *_details / *_value = "Данные не определены".
        - Только текст договора.
        - payer = риск несёт плательщик ренты.
        - receiver = риск несёт получатель ренты.
        - Не анализируй просрочку платежей, выкуп, расторжение и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни распределения риска, ни влияния гибели на выплату,
           ни страхования.
           → presence = "missing";
             все содержательные *_status / risk_allocation_code = "not_defined";
             loss_non_discharge_details, insurance_beneficiary_value = "Данные не определены".

        2. Неполное раскрытие темы.
           Риск случайной гибели распределён, но без указания, влияет ли гибель
           на обязанность выплачивать ренту, и без страхования.
           → presence = "present";
             risk_allocation_status = "defined";
             loss_non_discharge_status / insurance_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные стороны, несущие риск,
           или разные выгодоприобретатели, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status / risk_allocation_code = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Специфика ст. 600 ГК РФ.
           Риск гибели имущества прямо отнесён на плательщика ренты,
           но без указания, освобождает ли гибель от выплаты ренты.
           → presence = "present";
             risk_allocation_status = "defined"; risk_allocation_code = "payer";
             loss_non_discharge_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_and_insurance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для risk_allocation_code используй только: "payer", "receiver", "not_defined".
        - Fallback при отсутствии данных: loss_non_discharge_details, insurance_beneficiary_value = "Данные не определены".
        - Fallback при противоречии или неоднозначности: loss_non_discharge_details, insurance_beneficiary_value = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_and_insurance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о риске случайной гибели и страховании. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения риска случайной гибели имущества. Внутреннее enum-поле."
          required: true
        - name: "risk_allocation_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["payer", "receiver", "not_defined"]
          description: "Сторона, несущая риск случайной гибели имущества. Внутреннее enum-поле."
          required: true
        - name: "loss_non_discharge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания, освобождает ли гибель имущества от выплаты ренты. Внутреннее enum-поле."
          required: true
        - name: "loss_non_discharge_details"
          type: "string"
          presentation: "fact"
          label: "Влияние гибели имущества на выплату ренты"
          description: >
            Текст договора о влиянии гибели имущества на обязанность выплачивать ренту. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия страхования имущества или ответственности. Внутреннее enum-поле."
          required: true
        - name: "insurance_beneficiary_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения выгодоприобретателя по страхованию. Внутреннее enum-поле."
          required: true
        - name: "insurance_beneficiary_value"
          type: "string"
          presentation: "fact"
          label: "Выгодоприобретатель по страхованию"
          description: >
            Сторона, указанная выгодоприобретателем по договору страхования. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: late_payment_liability_check
    name: "Ответственность за просрочку рентных платежей"
    description: >
      Фактографическая проверка наличия ставки пени, процентов или иной ответственности
      за просрочку рентных платежей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проценты за просрочку"
        - "пеня"
        - "неустойка"
        - "ст. 395 ГК"
        - "ответственность за просрочку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)пен(я|и|ю)"
        - "(?i)процент(ы|ов)\\s+за\\s+просрочк"
        - "(?i)неустойк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты.
        Проверяется только один вопрос: ответственность за просрочку рентных платежей.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие ответственности за просрочку.
        2. Ставку пени или процентов.
        3. Основание начисления.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку выплаты ренты Плательщик уплачивает пеню в размере 0,1%
        от суммы задолженности за каждый день просрочки."

        Ответ:
        {
          "late_payment_rate_status": "defined",
          "late_payment_rate_value": "0,1% от суммы задолженности за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "За просрочку выплаты ренты Плательщик уплачивает пеню в размере 0,1% от суммы задолженности за каждый день просрочки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются производить выплаты в установленные сроки."

        Ответ:
        {
          "late_payment_rate_status": "not_defined",
          "late_payment_rate_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
