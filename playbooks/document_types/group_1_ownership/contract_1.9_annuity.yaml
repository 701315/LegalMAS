type: contract_1.9_annuity
name: "Договор ренты"

description: |
  Алеаторный (рисковый) договор, по которому получатель ренты передает имущество в собственность
  плательщику ренты, а плательщик обязуется в обмен периодически выплачивать получателю ренту
  в виде денежной суммы либо предоставлять содержание в иной форме.
  Договор характеризуется элементом случайности, обязательной нотариальной формой,
  императивным регулированием в защиту получателя ренты и специальными способами обеспечения
  обязательств плательщика. Основные виды: постоянная рента, пожизненная рента,
  пожизненное содержание с иждивением. Для недвижимости критичны регистрация перехода права
  и обременения, а также залог в силу закона в пользу получателя ренты.

version: 5.0
parent: class_1_transfer_of_ownership

