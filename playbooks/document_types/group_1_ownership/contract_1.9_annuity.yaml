          "notarization_level": "clearly_notarial",
          "notary_details_status": "defined",
          "notary_details": "Иванова А.А., нотариальный округ г. Москвы",
          "notary_date_status": "defined",
          "notary_date": "15.03.2026",
          "registry_number_status": "defined",
          "registry_number": "77/100-н/77-2026-1-123",
          "nullity_risk": "low",
          "evidence": [
            {
              "clause_ref": "удостоверительная надпись",
              "quote": "Удостоверено нотариусом Ивановой А.А., нотариальный округ г. Москвы. Реестровый номер 77/100-н/77-2026-1-123."
            }
