              "quote": "В силу ст. 587 ГК РФ Плательщик ренты передаёт Получателю ренты право залога на квартиру."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор ренты на условиях настоящего договора."

        Ответ:
        {
