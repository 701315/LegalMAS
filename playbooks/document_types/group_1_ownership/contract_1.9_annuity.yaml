      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты условия о выкупе:
        право выкупа, выкупная цена и срок уведомления.
        Не анализируй расторжение, возврат имущества, страхование или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. buyout_clause_status — "defined" если условие о выкупе ренты прямо присутствует, иначе "not_defined".
        2. buyout_right_holder — сторона с правом выкупа: "receiver" / "payer" / "both" / "not_defined".
        3. buyout_price_status — "defined" если выкупная цена или методика её расчёта указаны, иначе "not_defined".
        4. buyout_price_details — конкретная сумма или описание методики выкупной цены.
        5. buyout_notice_period_status — "defined" если срок уведомления о выкупе прямо указан, иначе "not_defined".
        6. buyout_notice_period_value — конкретный срок уведомления о намерении выкупить ренту.

