          label: "Просрочка рентных платежей"
          description: "Условие о пене, процентах или иной ответственности за просрочку."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Объём содержания при ДПСИ
