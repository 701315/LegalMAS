      - "(?i)реестров[ыо]й\\s+номер\\s+нотариуса"
      - "(?i)нотариальн[а-яё]+\\s+форм[аа]"

  alienation_restricted:
    any_keywords:
      - "(?i)запрет\\s+отчуждени[яя]"
      - "(?i)без\\s+согласи[яя]\\s+получател[яя]\\s+рент[ыа]"
      - "(?i)запрет\\s+залога"
