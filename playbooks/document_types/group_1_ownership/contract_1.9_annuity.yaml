        10. payment_periodicity_code — "monthly" / "quarterly" / "yearly" / "custom" / "not_defined".
        11. transfer_character_status — "defined" если имущество передаётся за плату или бесплатно, иначе "not_defined".
        12. transfer_character_code — "paid" / "free" / "not_defined".

