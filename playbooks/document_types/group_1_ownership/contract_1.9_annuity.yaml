        "Стороны заключили настоящий договор."

        Ответ:
        {
          "voluntariness_status": "not_defined",
          "voluntariness_details": "Данные не определены",
          "notary_explanation_status": "not_defined",
          "independent_valuation_status": "not_defined",
          "pressure_absence_status": "not_defined",
          "abuse_protection_status": "not_defined",
          "abuse_protection_details": "Данные не определены",
          "relatives_access_status": "not_defined",
          "care_quality_control_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написано ли прямо "действует добровольно" или аналогично?
        2. Упомянут ли нотариус в контексте разъяснений?
        3. Упомянута ли независимая оценка?
        4. Есть ли механизмы защиты от изоляции?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
