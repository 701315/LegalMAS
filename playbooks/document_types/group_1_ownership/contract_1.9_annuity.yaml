        2. Указаны ли ФИО нотариуса?
        3. Есть ли реестровый номер?
        4. Если ничего нет — nullity_risk = "critical".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "notarization_status": "<defined / not_defined>",
          "notarization_level": "<clearly_notarial / mentioned / not_found>",
          "notary_details_status": "<defined / not_defined>",
          "notary_details": "<ФИО нотариуса или 'Данные не определены'>",
          "notary_date_status": "<defined / not_defined>",
          "notary_date": "<дата или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number": "<номер или 'Данные не определены'>",
          "nullity_risk": "<critical / low>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
