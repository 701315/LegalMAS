           - pressure_absence_status = "not_defined";
           - abuse_protection_status = "not_defined";
           - relatives_access_status = "not_defined";
           - care_quality_control_status = "not_defined";
           - legal_capacity_status = "not_defined";
           - legal_capacity_age_code = "not_defined";
           - legal_capacity_limitations_status = "not_defined";
           - voluntariness_details, abuse_protection_details,
             legal_capacity_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. voluntariness_status — "defined" если добровольность прямо подтверждена, иначе "not_defined".
        2. voluntariness_details — текст о добровольности или осознании последствий.
        3. notary_explanation_status — "defined" если упомянуты разъяснения нотариуса, иначе "not_defined".
        4. independent_valuation_status — "defined" если независимая оценка имущества упомянута, иначе "not_defined".
        5. pressure_absence_status — "defined" если отсутствие давления прямо подтверждено, иначе "not_defined".
        6. abuse_protection_status — "defined" если механизмы защиты получателя предусмотрены, иначе "not_defined".
        7. abuse_protection_details — текст о механизмах защиты.
        8. relatives_access_status — "defined" если право родственников навещать прямо указано, иначе "not_defined".
        9. care_quality_control_status — "defined" если контроль качества ухода прямо указан, иначе "not_defined".

        10. legal_capacity_status:
            - "defined" — если в тексте прямо есть заверение о полной
              дееспособности / совершеннолетии / вменяемости получателя ренты;
            - "not_defined" — если прямого заверения нет.

        11. legal_capacity_age_code — возраст получателя:
            - "adult" — если прямо указано, что получатель совершеннолетний;
            - "minor" — если прямо указано, что получатель несовершеннолетний;
            - "not_defined" — если возраст прямо не указан.

        12. legal_capacity_limitations_status:
            - "defined" — если в тексте прямо указано отсутствие ограничений
              дееспособности (по решению суда, по состоянию здоровья);
            - "not_defined" — если прямого заверения об отсутствии ограничений нет.

        13. legal_capacity_details — текст о дееспособности / возрасте /
            ограничениях получателя ренты.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текст = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни unconscionability_and_capacity_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", legal_capacity_age_code = "not_defined", voluntariness_details, abuse_protection_details, legal_capacity_details = "Данные не определены".
        - Только текст договора.
        - voluntariness_status = "defined" только если прямо написано "действует добровольно", "осознаёт последствия" или аналогично.
        - abuse_protection_status = "defined" только если в тексте есть конкретные механизмы защиты (право навещать, контроль ухода, доступ врача и т.п.).
        - legal_capacity_status = "defined" только при прямом заверении о полной дееспособности / совершеннолетии / вменяемости получателя.
        - legal_capacity_age_code = "adult" только при прямом указании на совершеннолетие; "minor" — только при прямом указании на несовершеннолетие.
        - legal_capacity_limitations_status = "defined" только при прямом указании на отсутствие ограничений дееспособности.
        - Не оценивай кабальность самостоятельно.
        - Фиксируй только прямые защитные формулировки.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений о добровольности, ни разъяснений нотариуса,
           ни независимой оценки, ни механизмов защиты получателя,
           ни заверений о дееспособности.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             legal_capacity_age_code = "not_defined";
             voluntariness_details, abuse_protection_details,
             legal_capacity_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Есть общая фраза о добровольности, но без разъяснений нотариуса,
           независимой оценки, механизмов защиты и заверений о дееспособности.
           → presence = "present";
             voluntariness_status = "defined";
             notary_explanation_status / independent_valuation_status /
             pressure_absence_status / abuse_protection_status /
             relatives_access_status / care_quality_control_status /
             legal_capacity_status / legal_capacity_limitations_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные заверения о добровольности,
           дееспособности или разные механизмы защиты,
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Частичная защита получателя (специфика ДПСИ).
           Указано право родственников навещать, но без контроля качества ухода
           и без прямого заверения об отсутствии давления.
           → presence = "present";
             relatives_access_status = "defined";
             abuse_protection_status = "defined";
             care_quality_control_status / pressure_absence_status = "not_defined".

        5. Несовершеннолетний получатель (специфика ст. 175 ГК РФ).
           В тексте прямо указано, что получатель ренты несовершеннолетний.
           → presence = "present";
             legal_capacity_status = "not_defined";
             legal_capacity_age_code = "minor";
             legal_capacity_details содержит указание на несовершеннолетие
             получателя ренты.

        6. Отсутствие заверений о специальной дееспособности.
           Есть заверения о добровольности, но без отдельного подтверждения
           полной дееспособности, совершеннолетия и отсутствия ограничений.
           → presence = "present" (если другие содержательные поля определены);
             legal_capacity_status = "not_defined";
             legal_capacity_age_code = "not_defined";
             legal_capacity_limitations_status = "not_defined";
             legal_capacity_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unconscionability_and_capacity_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для legal_capacity_age_code используй только: "adult", "minor", "not_defined".
        - Fallback при отсутствии данных: voluntariness_details, abuse_protection_details, legal_capacity_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: voluntariness_details, abuse_protection_details, legal_capacity_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unconscionability_and_capacity_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений о добровольности / дееспособности / защиты получателя ренты. Внутреннее агрегатное signal-поле."
          required: true

        - name: "voluntariness_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения добровольности заключения договора. Внутреннее enum-поле."
          required: true
        - name: "voluntariness_details"
          type: "string"
          presentation: "fact"
          label: "Добровольность и осознание последствий"
          description: >
            Текст о добровольности заключения договора и осознании его последствий. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notary_explanation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания разъяснений нотариуса. Внутреннее enum-поле."
          required: true
        - name: "independent_valuation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания независимой оценки имущества. Внутреннее enum-поле."
          required: true
        - name: "pressure_absence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения отсутствия давления или принуждения. Внутреннее enum-поле."
          required: true
        - name: "abuse_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия механизмов защиты получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "abuse_protection_details"
          type: "string"
          presentation: "fact"
          label: "Механизмы защиты получателя"
          description: >
            Текст о механизмах защиты получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "relatives_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия права родственников навещать получателя. Внутреннее enum-поле."
          required: true
        - name: "care_quality_control_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия механизма контроля качества ухода. Внутреннее enum-поле."
          required: true
        - name: "legal_capacity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия заверения о специальной дееспособности получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "legal_capacity_age_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["adult", "minor", "not_defined"]
          description: "Возраст получателя ренты (совершеннолетний / несовершеннолетний). Внутреннее enum-поле."
          required: true
        - name: "legal_capacity_limitations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия заверения об отсутствии ограничений дееспособности получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "legal_capacity_details"
          type: "string"
          presentation: "fact"
          label: "Специальная дееспособность получателя"
          description: >
            Текст о дееспособности, возрасте и ограничениях получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: alienation_restriction_compliance_check
    name: "ДПСИ: запрет распоряжения имуществом без согласия получателя (ст. 604 ГК РФ)"
    description: >
      Фактографическая проверка наличия запрета плательщику ренты распоряжаться
      имуществом без предварительного согласия получателя ренты.
    triggers:
      any: ["lifetime_maintenance", "alienation_restricted"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "запрет отчуждения"
        - "не вправе отчуждать"
        - "без предварительного согласия получателя"
        - "распоряжение имуществом"
        - "запрет залога"
        - "запрет обременения"
        - "ст. 604"
        - "ограничение права распоряжения"
        - "запрет сдачи в аренду"
        - "согласие получателя ренты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе\\s+отчужд"
        - "(?i)без\\s+(предварительного\\s+)?согласия\\s+получател"
        - "(?i)запрет.*отчужден"
        - "(?i)ограничен.*распоряжен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ДПСИ (ст. 601-605 ГК РФ; ст. 604 ГК РФ).
        Проверяется только один вопрос: ограничение на распоряжение имуществом.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие запрета отчуждения без согласия получателя ренты.
        2. Запрет залога.
        3. Запрет аренды или иных обременений.
        4. Процедуру получения согласия.
        5. Последствия нарушения запрета.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Плательщик ренты не вправе отчуждать, закладывать или иным образом
        обременять переданное имущество без предварительного письменного согласия
        Получателя ренты. Сдача в аренду также допускается только с согласия
        Получателя ренты.
        Согласие направляется в письменной форме не позднее чем за 10 дней до
        совершения сделки.
        При нарушении указанного запрета Получатель ренты вправе требовать
        расторжения договора и возврата имущества."

        Ответ:
        {
          "alienation_restriction_status": "defined",
          "restriction_scope": "consent_required",
          "pledge_ban_status": "defined",
          "lease_ban_status": "defined",
          "consent_procedure_status": "defined",
          "consent_procedure_details": "письменная форма, не позднее чем за 10 дней до совершения сделки",
          "violation_consequence_status": "defined",
          "violation_consequence_details": "право требовать расторжения договора и возврата имущества",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Плательщик ренты не вправе отчуждать, закладывать или иным образом обременять переданное имущество без предварительного письменного согласия Получателя ренты."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Плательщик ренты принимает имущество в собственность."

        Ответ:
        {
          "alienation_restriction_status": "not_defined",
          "restriction_scope": "not_defined",
          "pledge_ban_status": "not_defined",
          "lease_ban_status": "not_defined",
          "consent_procedure_status": "not_defined",
          "consent_procedure_details": "Данные не определены",
          "violation_consequence_status": "not_defined",
          "violation_consequence_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написано ли прямо "не вправе отчуждать" или аналогично?
        2. Упомянуты ли отдельно залог и аренда?
        3. Описана ли процедура получения согласия?
        4. Указаны ли последствия нарушения?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "alienation_restriction_status": "<defined / not_defined>",
          "restriction_scope": "<full_ban / consent_required / limited / not_defined>",
          "pledge_ban_status": "<defined / not_defined>",
          "lease_ban_status": "<defined / not_defined>",
          "consent_procedure_status": "<defined / not_defined>",
          "consent_procedure_details": "<текст или 'Данные не определены'>",
          "violation_consequence_status": "<defined / not_defined>",
          "violation_consequence_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет отчуждения не вправе отчуждать без предварительного согласия получателя распоряжение имуществом запрет залога запрет обременения ст. 604 ГК РФ ограничение права распоряжения запрет сдачи в аренду согласие получателя ренты"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "залог в силу закона"
        - "обременение рентой"
        - "обеспечение выплаты ренты"
        - "банковская гарантия"
        - "поручительство"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "добровольность"
        - "кабальная сделка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "alienation_restriction_compliance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ДПСИ ограничения
        на распоряжение имуществом: отчуждение, залог, аренду, согласие получателя
        и последствия нарушения.
        Не анализируй размер содержания, выкуп, страхование или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. alienation_restriction_compliance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (alienation_restriction_status, pledge_ban_status,
              lease_ban_status, consent_procedure_status,
              violation_consequence_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - alienation_restriction_status = "not_defined";
           - restriction_scope = "not_defined";
           - pledge_ban_status = "not_defined";
           - lease_ban_status = "not_defined";
           - consent_procedure_status = "not_defined";
           - violation_consequence_status = "not_defined";
           - consent_procedure_details, violation_consequence_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. alienation_restriction_status — "defined" если ограничение распоряжения прямо указано, иначе "not_defined".
        2. restriction_scope — "full_ban" / "consent_required" / "limited" / "not_defined".
        3. pledge_ban_status — "defined" если запрет залога прямо указан, иначе "not_defined".
        4. lease_ban_status — "defined" если запрет аренды или аналогичного обременения прямо указан, иначе "not_defined".
        5. consent_procedure_status — "defined" если процедура получения согласия указана, иначе "not_defined".
        6. consent_procedure_details — текст процедуры получения согласия.
        7. violation_consequence_status — "defined" если последствия нарушения указаны, иначе "not_defined".
        8. violation_consequence_details — текст о последствиях нарушения ограничения.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текст = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни alienation_restriction_compliance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", restriction_scope = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - full_ban = любое распоряжение имуществом прямо запрещено без исключений.
        - consent_required = распоряжение допускается только с предварительного согласия получателя ренты.
        - limited = запрет касается только отдельных видов распоряжения (например, только залог или только аренда).
        - Не выводи диспозитивные нормы закона.
        - Не анализируй размер содержания, выкуп, страхование и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета распоряжения, ни запретов залога и аренды,
           ни процедуры согласия, ни последствий нарушения.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             restriction_scope = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Общая фраза "не вправе распоряжаться без согласия" без указания
           конкретных запретов (залог, аренда) и без процедуры согласия.
           → presence = "present";
             alienation_restriction_status = "defined"; restriction_scope = "consent_required";
             pledge_ban_status / lease_ban_status /
             consent_procedure_status / violation_consequence_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные объёмы ограничения
           (например, полный запрет и разрешение с согласия),
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             alienation_restriction_status = "not_defined";
             restriction_scope = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Частичное ограничение (специфика ст. 604 ГК РФ).
           Запрет касается только отдельных видов распоряжения
           (например, только залога без общего запрета отчуждения).
           → presence = "present";
             alienation_restriction_status = "defined";
             restriction_scope = "limited";
             pledge_ban_status = "defined";
             lease_ban_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для alienation_restriction_compliance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для restriction_scope используй только: "full_ban", "consent_required", "limited", "not_defined".
        - Fallback при отсутствии данных: consent_procedure_details, violation_consequence_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: consent_procedure_details, violation_consequence_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "alienation_restriction_compliance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие ограничения распоряжения имуществом / согласия получателя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "alienation_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия ограничения на распоряжение имуществом. Внутреннее enum-поле."
          required: true
        - name: "restriction_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["full_ban", "consent_required", "limited", "not_defined"]
          description: "Объём ограничения распоряжения имуществом. Внутреннее enum-поле."
          required: true
        - name: "pledge_ban_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прямого запрета залога имущества. Внутреннее enum-поле."
          required: true
        - name: "lease_ban_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус прямого запрета аренды или иного обременения имущества. Внутреннее enum-поле."
          required: true
        - name: "consent_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения процедуры получения согласия получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "consent_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок получения согласия"
          description: >
            Текст о порядке получения согласия получателя ренты на распоряжение имуществом. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "violation_consequence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий нарушения ограничения распоряжения. Внутреннее enum-поле."
          required: true
        - name: "violation_consequence_details"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения ограничения"
          description: >
            Текст о последствиях нарушения запрета или ограничения распоряжения имуществом. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: paid_vs_free_transfer_and_succession
    name: "Характер передачи имущества, преемственность обязательств и признаки притворности (ст. 585, 586, 170 ГК РФ)"
    description: >
      Фактографическая проверка характера передачи имущества (за плату/бесплатно),
      урегулированности перехода рентных обязательств при смене плательщика,
      а также признаков притворности: соответствия цены рыночной стоимости
      и раскрытия аффилированности сторон.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "за плату"
        - "бесплатно"
        - "безвозмездно"
        - "правила купли-продажи"
        - "правила дарения"
        - "оплата при передаче"
        - "без оплаты"
        - "переход обязательств"
        - "новый собственник"
        - "приобретатель имущества"
        - "субсидиарная ответственность"
        - "солидарная ответственность"
        - "ст. 586"
        - "обязательства переходят"
        - "рыночная стоимость"
        - "независимая оценка"
        - "соответствует рыночной"
        - "аффилированность"
        - "аффилированные лица"
        - "взаимозависимые лица"
        - "заинтересованность"
        - "связанные стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переда[её]тся\\s+(за\\s+плату|бесплатно|безвозмездно)"
        - "(?i)правила\\s+(купли|дарени)"
        - "(?i)субсидиарн(ая|ой)\\s+ответственност"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
        - "(?i)обязательств.*переход.*к.*нов"
        - "(?i)рыночн[а-я]*\\s+стоимост"
        - "(?i)независим[а-я]*\\s+оцен"
        - "(?i)аффилированн"
        - "(?i)взаимозависим"
        - "(?i)заинтересованн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 585, 586, 170 ГК РФ).
        Проверяется только один вопрос: характер передачи, преемственность
        обязательств и признаки притворности (соответствие цены рыночной,
        аффилированность сторон).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Характер передачи имущества (за плату / бесплатно).
        2. Сумму платы при возмездной передаче.
        3. Условие о переходе рентных обязательств к новому собственнику.
        4. Тип ответственности прежнего плательщика (субсидиарная / солидарная).
        5. Порядок уведомления получателя о смене плательщика.
        6. Наличие независимой оценки имущества или заверения о соответствии
           цены передачи рыночной стоимости.
        7. Раскрытие аффилированности / взаимозависимости / заинтересованности
           сторон сделки.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Имущество передаётся Плательщику ренты за плату в размере 500 000 рублей.
        К отношениям по передаче применяются правила купли-продажи.
        В случае отчуждения Плательщиком ренты переданного имущества его обязательства
        по выплате ренты переходят к новому собственнику. Прежний Плательщик ренты
        несёт субсидиарную ответственность по этим обязательствам. Получатель ренты
        должен быть уведомлён о смене Плательщика не менее чем за 30 дней.
        Стоимость имущества подтверждена независимым оценщиком — 7 500 000 рублей,
        что соответствует рыночной стоимости. Стороны не являются аффилированными
        или взаимозависимыми лицами."

        Ответ:
        {
          "transfer_type_status": "defined",
          "transfer_type_code": "paid",
          "transfer_price_status": "defined",
          "transfer_price_value": "500 000 рублей",
          "succession_clause_status": "defined",
          "succession_clause_details": "обязательства переходят к новому собственнику при отчуждении имущества",
          "liability_type_status": "defined",
          "liability_type_code": "subsidiary",
          "notification_procedure_status": "defined",
          "price_adequacy_status": "confirmed",
          "price_adequacy_details": "независимая оценка 7 500 000 рублей, соответствует рыночной стоимости",
          "related_party_status": "independent",
          "related_party_details": "стороны не являются аффилированными или взаимозависимыми лицами",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Имущество передаётся Плательщику ренты за плату в размере 500 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Получатель ренты передаёт имущество Плательщику ренты бесплатно.
        К отношениям по передаче применяются правила дарения."

        Ответ:
        {
          "transfer_type_status": "defined",
          "transfer_type_code": "free",
          "transfer_price_status": "not_defined",
          "transfer_price_value": "Данные не определены",
          "succession_clause_status": "not_defined",
          "succession_clause_details": "Данные не определены",
          "liability_type_status": "not_defined",
          "liability_type_code": "not_defined",
          "notification_procedure_status": "not_defined",
          "price_adequacy_status": "not_defined",
          "price_adequacy_details": "Данные не определены",
          "related_party_status": "not_defined",
          "related_party_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Получатель ренты передаёт имущество Плательщику ренты бесплатно."
            }
          ]
        }

        Пример 3 — притворность (символическая цена + аффилированность):
        Фрагмент:
        "Имущество передаётся Плательщику ренты за плату в размере 10 000 рублей.
        Стороны являются аффилированными лицами в силу ст. 4 Закона РСФСР
        «О конкуренции». Независимая оценка имущества не проводилась."

        Ответ:
        {
          "transfer_type_status": "defined",
          "transfer_type_code": "paid",
          "transfer_price_status": "defined",
          "transfer_price_value": "10 000 рублей",
          "succession_clause_status": "not_defined",
          "succession_clause_details": "Данные не определены",
          "liability_type_status": "not_defined",
          "liability_type_code": "not_defined",
          "notification_procedure_status": "not_defined",
          "price_adequacy_status": "not_defined",
          "price_adequacy_details": "независимая оценка не проводилась, соответствие рыночной стоимости не подтверждено",
          "related_party_status": "affiliated",
          "related_party_details": "стороны являются аффилированными лицами",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Имущество передаётся Плательщику ренты за плату в размере 10 000 рублей."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написано ли "бесплатно", "безвозмездно" или "за плату" прямо?
        2. Если за плату — указана ли сумма?
        3. Написано ли, что обязательства переходят к новому собственнику?
        4. Написано ли "субсидиарная" или "солидарная" ответственность?
        5. Есть ли независимая оценка или заверение о рыночности цены?
        6. Раскрыта ли аффилированность или взаимозависимость сторон?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_type_status": "<defined / not_defined>",
          "transfer_type_code": "<paid / free / not_defined>",
          "transfer_price_status": "<defined / not_defined>",
          "transfer_price_value": "<сумма или 'Данные не определены'>",
          "succession_clause_status": "<defined / not_defined>",
          "succession_clause_details": "<текст или 'Данные не определены'>",
          "liability_type_status": "<defined / not_defined>",
          "liability_type_code": "<subsidiary / solidary / not_defined>",
          "notification_procedure_status": "<defined / not_defined>",
          "price_adequacy_status": "<confirmed / not_defined>",
          "price_adequacy_details": "<текст или 'Данные не определены'>",
          "related_party_status": "<affiliated / independent / not_defined>",
          "related_party_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "за плату бесплатно безвозмездно правила купли-продажи правила дарения оплата при передаче без оплаты переход обязательств новый собственник приобретатель имущества субсидиарная ответственность солидарная ответственность ст. 586 ГК РФ обязательства переходят рыночная стоимость независимая оценка аффилированность взаимозависимые лица заинтересованность связанные стороны"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "размер ренты"
        - "ежемесячная выплата"
        - "прожиточный минимум"
        - "индексация"
        - "залог в силу закона"
        - "обременение рентой"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "запрет отчуждения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "paid_vs_free_transfer_and_succession_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1250

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты характер передачи
        имущества (за плату или бесплатно), условия перехода рентных обязательств
        к новому собственнику, а также признаки притворности: подтверждение
        соответствия цены рыночной стоимости и раскрытие аффилированности сторон.
        Не анализируй размер ренты, страхование, выкуп или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. paid_vs_free_transfer_and_succession_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (transfer_type_status, transfer_price_status,
              succession_clause_status, liability_type_status,
              notification_procedure_status,
              price_adequacy_status, related_party_status)
             ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - transfer_type_status = "not_defined";
           - transfer_type_code = "not_defined";
           - transfer_price_status = "not_defined";
           - succession_clause_status = "not_defined";
           - liability_type_status = "not_defined";
           - liability_type_code = "not_defined";
           - notification_procedure_status = "not_defined";
           - price_adequacy_status = "not_defined";
           - related_party_status = "not_defined";
           - transfer_price_value, succession_clause_details,
             price_adequacy_details, related_party_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. transfer_type_status — "defined" если характер передачи указан, иначе "not_defined".
        2. transfer_type_code — "paid" / "free" / "not_defined".
        3. transfer_price_status — "defined" если цена при возмездной передаче указана, иначе "not_defined".
        4. transfer_price_value — цена передачи имущества.
        5. succession_clause_status — "defined" если переход рентных обязательств к новому собственнику указан, иначе "not_defined".
        6. succession_clause_details — текст о переходе обязательств.
        7. liability_type_status — "defined" если вид ответственности прежнего плательщика указан, иначе "not_defined".
        8. liability_type_code — "subsidiary" / "solidary" / "not_defined".
        9. notification_procedure_status — "defined" если порядок уведомления получателя о смене плательщика указан, иначе "not_defined".
        10. price_adequacy_status:
            - "confirmed" — если в тексте прямо есть независимая оценка имущества
              или заверение о соответствии цены передачи рыночной стоимости;
            - "not_defined" — если в тексте нет ни независимой оценки,
              ни заверения о рыночности цены.
        11. price_adequacy_details — текст о независимой оценке или заверении
            о соответствии цены рыночной стоимости, либо о её отсутствии.
        12. related_party_status:
            - "affiliated" — если в тексте прямо указано, что стороны являются
              аффилированными, взаимозависимыми или заинтересованными лицами;
            - "independent" — если в тексте прямо указано, что стороны
              не являются аффилированными / взаимозависимыми;
            - "not_defined" — если в тексте нет ни того, ни другого.
        13. related_party_details — текст о раскрытии (или отсутствии)
            аффилированности сторон.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текст = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни paid_vs_free_transfer_and_succession_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", все *_code = "not_defined", transfer_price_value, succession_clause_details, price_adequacy_details, related_party_details = "Данные не определены".
        - Только текст договора.
        - transfer_price_status = "defined" только для случая, когда прямо указана сумма или иное встречное предоставление при передаче имущества.
        - Не смешивай paid/free transfer с rent payment amount (размер рентных платежей).
        - succession_clause_status = "defined" только если прямо указано, что рентные обязательства переходят к новому собственнику имущества при его отчуждении.
        - price_adequacy_status = "confirmed" только при прямой ссылке на независимую оценку или прямое заверение о соответствии цены рыночной стоимости.
        - related_party_status = "affiliated" только при прямом указании на аффилированность / взаимозависимость / заинтересованность сторон.
        - related_party_status = "independent" только при прямом указании на отсутствие аффилированности.
        - Не оценивай самостоятельно, соответствует ли цена рыночной — фиксируй только прямые формулировки в тексте.
        - Не делай вывода о притворности сделки — фиксируй только факты для последующего анализа.
        - Не анализируй размер ренты, страхование, выкуп и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни характера передачи, ни цены, ни перехода обязательств,
           ни ответственности прежнего плательщика, ни признаков притворности.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             все *_code = "not_defined";
             transfer_price_value, succession_clause_details,
             price_adequacy_details, related_party_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Характер передачи указан (например, "передаётся за плату"),
           но без цены, без перехода обязательств, без ответственности
           прежнего плательщика и без признаков притворности.
           → presence = "present";
             transfer_type_status = "defined"; transfer_type_code = "paid";
             transfer_price_status / succession_clause_status /
             liability_type_status / notification_procedure_status /
             price_adequacy_status / related_party_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды передачи
           (за плату и бесплатно) или разные типы ответственности,
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_code = "not_defined";
             соответствующие *_value / *_details = "Не удалось определить".

        4. Передача за плату без цены (специфика ст. 585 ГК РФ).
           Указано, что имущество передаётся за плату, но сумма платы
           не раскрыта; правила купли-продажи при этом не упомянуты.
           → presence = "present";
             transfer_type_status = "defined"; transfer_type_code = "paid";
             transfer_price_status = "not_defined";
             transfer_price_value = "Данные не определены".

        5. Символическая цена передачи (признак притворности, ст. 170 ГК РФ).
           Имущество передаётся за плату по цене, явно не соответствующей
           рыночной стоимости, без независимой оценки и без заверения
           о её рыночности.
           → presence = "present";
             transfer_type_status = "defined"; transfer_type_code = "paid";
             transfer_price_status = "defined";
             transfer_price_value содержит прямо указанную сумму;
             price_adequacy_status = "not_defined";
             price_adequacy_details = "независимая оценка не проводилась, соответствие рыночной стоимости не подтверждено".

        6. Раскрытие аффилированности сторон (признак притворности / банкротных рисков).
           В тексте прямо указано, что стороны являются аффилированными,
           взаимозависимыми или заинтересованными лицами.
           → presence = "present";
             related_party_status = "affiliated";
             related_party_details содержит формулировку о раскрытой
             аффилированности.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для paid_vs_free_transfer_and_succession_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для transfer_type_code используй только: "paid", "free", "not_defined".
        - Для liability_type_code используй только: "subsidiary", "solidary", "not_defined".
        - Для price_adequacy_status используй только: "confirmed", "not_defined".
        - Для related_party_status используй только: "affiliated", "independent", "not_defined".
        - Fallback при отсутствии данных: transfer_price_value, succession_clause_details,
          price_adequacy_details, related_party_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: transfer_price_value,
          succession_clause_details, price_adequacy_details, related_party_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "paid_vs_free_transfer_and_succession_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по характеру передачи, преемственности обязательств и признакам притворности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transfer_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения характера передачи имущества. Внутреннее enum-поле."
          required: true
        - name: "transfer_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["paid", "free", "not_defined"]
          description: "Передача имущества за плату или бесплатно. Внутреннее enum-поле."
          required: true
        - name: "transfer_price_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения цены при возмездной передаче имущества. Внутреннее enum-поле."
          required: true
        - name: "transfer_price_value"
          type: "string"
          presentation: "fact"
          label: "Цена передачи имущества"
          description: >
            Цена передачи имущества, если оно передаётся за плату. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "succession_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о переходе рентных обязательств к новому собственнику. Внутреннее enum-поле."
          required: true
        - name: "succession_clause_details"
          type: "string"
          presentation: "fact"
          label: "Переход рентных обязательств"
          description: >
            Текст о переходе рентных обязательств к новому собственнику имущества. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "liability_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида ответственности прежнего плательщика. Внутреннее enum-поле."
          required: true
        - name: "liability_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["subsidiary", "solidary", "not_defined"]
          description: "Вид ответственности прежнего плательщика ренты. Внутреннее enum-поле."
          required: true
        - name: "notification_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка уведомления получателя ренты о смене плательщика. Внутреннее enum-поле."
          required: true
        - name: "price_adequacy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["confirmed", "not_defined"]
          description: "Статус подтверждения соответствия цены передачи рыночной стоимости или наличия независимой оценки. Внутреннее enum-поле."
          required: true
        - name: "price_adequacy_details"
          type: "string"
          presentation: "fact"
          label: "Соответствие цены рыночной"
          description: >
            Текст о независимой оценке или заверении о соответствии цены передачи рыночной стоимости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "related_party_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["affiliated", "independent", "not_defined"]
          description: "Статус раскрытия аффилированности / взаимозависимости сторон сделки. Внутреннее enum-поле."
          required: true
        - name: "related_party_details"
          type: "string"
          presentation: "fact"
          label: "Аффилированность сторон"
          description: >
            Текст о раскрытии (или об отсутствии) аффилированности сторон сделки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: title_warranty_check
    name: "Заверения о чистоте титула передаваемого имущества"
    description: >
      Фактографическая проверка наличия в договоре ренты заверений об отсутствии
      обременений, арестов, залогов, сервитутов, прав третьих лиц и споров
      в отношении передаваемого имущества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "заверяет"
        - "гарантирует"
        - "не обременено"
        - "не заложено"
        - "не находится под арестом"
        - "свободно от прав третьих лиц"
        - "свободно от обременений"
        - "выписка ЕГРН"
        - "ЕГРН"
        - "сервитут"
        - "права третьих лиц"
        - "не является предметом спора"
        - "не находится в залоге"
        - "отсутствие обременений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заверя[ею]т.*отсутств"
        - "(?i)гарантиру[ею]т.*отсутств"
        - "(?i)не\\s+обременен"
        - "(?i)не\\s+заложен"
        - "(?i)свободн[оа][а-я]*\\s+от\\s+прав"
        - "(?i)выписк[аи]\\s+ЕГРН"
        - "(?i)не\\s+находится\\s+под\\s+арест"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ).
        Проверяется только один вопрос: заверения о чистоте титула
        передаваемого имущества.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение об отсутствии обременений (залог, арест, сервитут, аренда).
        2. Ссылку на выписку ЕГРН или иной документ, подтверждающий титул.
        3. Заверение об отсутствии прав третьих лиц на имущество.
        4. Заверение об отсутствии судебных споров об имуществе.
        5. Раскрытие известных обременений (если они есть).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты заверяет, что передаваемое имущество не заложено,
        не находится под арестом, свободно от любых обременений и прав третьих лиц.
        Имущество не является предметом судебного спора.
        Согласно выписке из ЕГРН от 01.02.2026 № 77/100/001/2026-1234,
        какие-либо обременения отсутствуют."

        Ответ:
        {
          "encumbrance_warranty_status": "defined",
          "encumbrance_warranty_details": "не заложено, не под арестом, свободно от обременений",
          "egrn_reference_status": "defined",
          "egrn_reference_details": "выписка ЕГРН от 01.02.2026 № 77/100/001/2026-1234",
          "third_party_rights_warranty_status": "defined",
          "third_party_rights_warranty_details": "свободно от прав третьих лиц",
          "litigation_warranty_status": "defined",
          "litigation_warranty_details": "не является предметом судебного спора",
          "known_encumbrances_disclosure_status": "not_applicable",
          "known_encumbrances_disclosure_details": "обременения не раскрыты — заявлено их отсутствие",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Получатель ренты заверяет, что передаваемое имущество не заложено, не находится под арестом, свободно от любых обременений и прав третьих лиц."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Получатель ренты передаёт имущество под выплату ренты."

        Ответ:
        {
          "encumbrance_warranty_status": "not_defined",
          "encumbrance_warranty_details": "Данные не определены",
          "egrn_reference_status": "not_defined",
          "egrn_reference_details": "Данные не определены",
          "third_party_rights_warranty_status": "not_defined",
          "third_party_rights_warranty_details": "Данные не определены",
          "litigation_warranty_status": "not_defined",
          "litigation_warranty_details": "Данные не определены",
          "known_encumbrances_disclosure_status": "not_defined",
          "known_encumbrances_disclosure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте заверение об отсутствии обременений?
        2. Есть ли ссылка на выписку ЕГРН?
        3. Есть ли заверение об отсутствии прав третьих лиц?
        4. Есть ли заверение об отсутствии судебных споров?
        5. Раскрыты ли известные обременения?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "encumbrance_warranty_status": "<defined / not_defined>",
          "encumbrance_warranty_details": "<текст или 'Данные не определены'>",
          "egrn_reference_status": "<defined / not_defined>",
          "egrn_reference_details": "<текст или 'Данные не определены'>",
          "third_party_rights_warranty_status": "<defined / not_defined>",
          "third_party_rights_warranty_details": "<текст или 'Данные не определены'>",
          "litigation_warranty_status": "<defined / not_defined>",
          "litigation_warranty_details": "<текст или 'Данные не определены'>",
          "known_encumbrances_disclosure_status": "<defined / not_applicable / not_defined>",
          "known_encumbrances_disclosure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "title_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверяет гарантирует не обременено не заложено не находится под арестом свободно от прав третьих лиц свободно от обременений выписка ЕГРН сервитут права третьих лиц не является предметом спора не находится в залоге отсутствие обременений"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "ритуальные услуги"
        - "замена содержания"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "title_warranty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты заверения
        о чистоте титула передаваемого имущества: об отсутствии обременений,
        о правах третьих лиц, о судебных спорах, о подтверждающих документах
        (выписка ЕГРН) и о раскрытии известных обременений.
        Не анализируй размер ренты, страхование, выкуп или споры сторон.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. title_warranty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (encumbrance_warranty_status, egrn_reference_status,
              third_party_rights_warranty_status, litigation_warranty_status,
              known_encumbrances_disclosure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - encumbrance_warranty_status = "not_defined";
           - egrn_reference_status = "not_defined";
           - third_party_rights_warranty_status = "not_defined";
           - litigation_warranty_status = "not_defined";
           - known_encumbrances_disclosure_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. encumbrance_warranty_status — "defined" если прямо есть заверение об отсутствии обременений (залог, арест, сервитут, аренда), иначе "not_defined".
        2. encumbrance_warranty_details — текст заверения об отсутствии обременений.
        3. egrn_reference_status — "defined" если прямо упомянута выписка ЕГРН или иной документ, подтверждающий титул, иначе "not_defined".
        4. egrn_reference_details — реквизиты выписки ЕГРН или иного подтверждающего документа.
        5. third_party_rights_warranty_status — "defined" если прямо есть заверение об отсутствии прав третьих лиц на имущество, иначе "not_defined".
        6. third_party_rights_warranty_details — текст заверения об отсутствии прав третьих лиц.
        7. litigation_warranty_status — "defined" если прямо есть заверение об отсутствии судебных споров об имуществе, иначе "not_defined".
        8. litigation_warranty_details — текст заверения об отсутствии судебных споров.
        9. known_encumbrances_disclosure_status:
           - "defined" — если в тексте прямо раскрыты известные обременения (например, сохраняемый сервитут, аренда);
           - "not_applicable" — если прямо заявлено отсутствие обременений и никакие известные обременения не раскрываются;
           - "not_defined" — если в тексте нет ни раскрытия обременений, ни заверения об их отсутствии.
        10. known_encumbrances_disclosure_details — текст о раскрытых известных обременениях.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни title_warranty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - encumbrance_warranty_status = "defined" только при прямом заверении об отсутствии обременений, а не при простом упоминании слова "обременение".
        - egrn_reference_status = "defined" только при прямой ссылке на выписку ЕГРН или иной документ, подтверждающий титул.
        - known_encumbrances_disclosure_status = "not_applicable" только если в тексте прямо заявлено отсутствие обременений и известные обременения не раскрываются.
        - Не выводи чистоту титула из закона — только фиксируй, что прямо написано в тексте.
        - Не анализируй размер ренты, страхование, выкуп и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений об отсутствии обременений, ни ссылок
           на выписку ЕГРН, ни упоминания прав третьих лиц или споров.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Есть общее заверение об отсутствии обременений, но без ссылки
           на выписку ЕГРН, без заверения о правах третьих лиц
           и без заверения об отсутствии споров.
           → presence = "present";
             encumbrance_warranty_status = "defined";
             egrn_reference_status / third_party_rights_warranty_status /
             litigation_warranty_status = "not_defined".

        3. Противоречие между фрагментами.
           В одной части договора заявлено отсутствие обременений,
           в другой раскрыто обременение (например, сохраняемая аренда),
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Раскрытие известных обременений.
           В тексте прямо раскрыто известное обременение (например,
           сохраняемый сервитут или действующий договор аренды),
           которое переходит вместе с имуществом.
           → presence = "present";
             known_encumbrances_disclosure_status = "defined";
             known_encumbrances_disclosure_details содержит формулировку
             о раскрытом обременении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для title_warranty_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для known_encumbrances_disclosure_status используй только: "defined", "not_applicable", "not_defined".
        - Fallback при отсутствии данных: все *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "title_warranty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений о чистоте титула. Внутреннее агрегатное signal-поле."
          required: true

        - name: "encumbrance_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии обременений. Внутреннее enum-поле."
          required: true
        - name: "encumbrance_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии обременений"
          description: >
            Текст заверения об отсутствии обременений (залог, арест, сервитут, аренда). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "egrn_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на выписку ЕГРН или иной подтверждающий документ. Внутреннее enum-поле."
          required: true
        - name: "egrn_reference_details"
          type: "string"
          presentation: "fact"
          label: "Выписка ЕГРН"
          description: >
            Реквизиты выписки ЕГРН или иного документа, подтверждающего титул. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "third_party_rights_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии прав третьих лиц на имущество. Внутреннее enum-поле."
          required: true
        - name: "third_party_rights_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии прав третьих лиц"
          description: >
            Текст заверения об отсутствии прав третьих лиц на имущество. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "litigation_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии судебных споров об имуществе. Внутреннее enum-поле."
          required: true
        - name: "litigation_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии споров"
          description: >
            Текст заверения об отсутствии судебных споров об имуществе. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "known_encumbrances_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус раскрытия известных обременений. Внутреннее enum-поле."
          required: true
        - name: "known_encumbrances_disclosure_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытые обременения"
          description: >
            Текст о раскрытых известных обременениях имущества. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: third_party_consents_check
    name: "Согласия третьих лиц на передачу имущества под ренту (ст. 35 СК РФ, ст. 37, 250, 346 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре ренты ссылок на согласия
      и разрешения третьих лиц: супруга, органа опеки и попечительства,
      залогодержателя, участников долевой собственности, арендатора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "согласие супруги"
        - "нотариально удостоверенное согласие"
        - "согласие супруга на отчуждение"
        - "разрешение органа опеки"
        - "орган опеки и попечительства"
        - "согласие залогодержателя"
        - "согласие банка"
        - "преимущественное право"
        - "участники долевой собственности"
        - "уведомление о продаже доли"
        - "согласие арендатора"
        - "согласие третьих лиц"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи[ея]\\s+супруг"
        - "(?i)нотариальн[оы].*согласи"
        - "(?i)орган[а-я]*\\s+опеки"
        - "(?i)согласи[ея]\\s+залогодержател"
        - "(?i)преимущественн[оы][а-я]*\\s+прав"
        - "(?i)участник[а-я]*\\s+долев[оы][а-я]*\\s+собственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ; ст. 35 СК РФ;
        ст. 37, 250, 346 ГК РФ).
        Проверяется только один вопрос: наличие в тексте ссылок на согласия
        и разрешения третьих лиц, необходимые для отчуждения имущества.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Согласие супруга на отчуждение имущества (для недвижимости — нотариальное).
        2. Разрешение органа опеки и попечительства (если получатель — несовершеннолетний / ограниченно дееспособный).
        3. Согласие залогодержателя (если на имуществе есть залог / ипотека).
        4. Уведомление участников долевой собственности о продаже доли (преимущественное право).
        5. Согласие арендатора или иного правообладателя.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты подтверждает, что имущество является его личной собственностью,
        не находящейся в совместной собственности супругов. Согласие залогодержателя
        на отчуждение имущества получено — ПАО «Банк», письмо № 45 от 10.02.2026.
        Преимущественное право участников долевой собственности соблюдено:
        все участники уведомлены и отказались от покупки."

        Ответ:
        {
          "spouse_consent_status": "not_applicable",
          "spouse_consent_details": "имущество не находится в совместной собственности супругов",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Данные не определены",
          "pledgee_consent_status": "defined",
          "pledgee_consent_details": "ПАО «Банк», письмо № 45 от 10.02.2026",
          "co_owners_notice_status": "defined",
          "co_owners_notice_details": "все участники уведомлены и отказались от покупки",
          "other_consents_status": "not_defined",
          "other_consents_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Согласие залогодержателя на отчуждение имущества получено — ПАО «Банк», письмо № 45 от 10.02.2026."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Получатель ренты передаёт имущество под выплату ренты."

        Ответ:
        {
          "spouse_consent_status": "not_defined",
          "spouse_consent_details": "Данные не определены",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Данные не определены",
          "pledgee_consent_status": "not_defined",
          "pledgee_consent_details": "Данные не определены",
          "co_owners_notice_status": "not_defined",
          "co_owners_notice_details": "Данные не определены",
          "other_consents_status": "not_defined",
          "other_consents_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямая ссылка на согласие супруга?
        2. Есть ли ссылка на орган опеки или ограничение дееспособности?
        3. Есть ли ссылка на залог / ипотеку и согласие залогодержателя?
        4. Есть ли уведомление участников долевой собственности?
        5. Есть ли иные согласия (арендатор и т.п.)?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "spouse_consent_status": "<defined / not_applicable / not_defined>",
          "spouse_consent_details": "<текст или 'Данные не определены'>",
          "guardianship_consent_status": "<defined / not_applicable / not_defined>",
          "guardianship_consent_details": "<текст или 'Данные не определены'>",
          "pledgee_consent_status": "<defined / not_applicable / not_defined>",
          "pledgee_consent_details": "<текст или 'Данные не определены'>",
          "co_owners_notice_status": "<defined / not_applicable / not_defined>",
          "co_owners_notice_details": "<текст или 'Данные не определены'>",
          "other_consents_status": "<defined / not_defined>",
          "other_consents_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие супруга нотариально удостоверенное согласие согласие супруги разрешение органа опеки и попечительства согласие залогодержателя согласие банка преимущественное право участники долевой собственности уведомление о продаже доли согласие арендатора согласие третьих лиц"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "ритуальные услуги"
        - "замена содержания"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "third_party_consents_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты сведения
        о согласиях и разрешениях третьих лиц, необходимых для отчуждения
        имущества: супруга, органа опеки, залогодержателя, участников
        долевой собственности, арендатора.
        Не анализируй размер ренты, страхование, выкуп или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. third_party_consents_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (spouse_consent_status, guardianship_consent_status,
              pledgee_consent_status, co_owners_notice_status,
              other_consents_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - spouse_consent_status = "not_defined";
           - guardianship_consent_status = "not_defined";
           - pledgee_consent_status = "not_defined";
           - co_owners_notice_status = "not_defined";
           - other_consents_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. spouse_consent_status:
           - "defined" — если прямо указано, что получено согласие супруга (супруги) на отчуждение имущества;
           - "not_applicable" — если прямо указано, что имущество не является совместной собственностью супругов или получатель не состоит в браке;
           - "not_defined" — если в тексте нет ни того, ни другого.
        2. spouse_consent_details — текст о согласии супруга или об отсутствии совместной собственности.
        3. guardianship_consent_status:
           - "defined" — если прямо указано разрешение органа опеки и попечительства;
           - "not_applicable" — если получатель прямо указан как полностью дееспособный совершеннолетний;
           - "not_defined" — если в тексте нет ни того, ни другого.
        4. guardianship_consent_details — текст о разрешении органа опеки или об отсутствии необходимости.
        5. pledgee_consent_status:
           - "defined" — если прямо указано согласие залогодержателя (банка) на отчуждение;
           - "not_applicable" — если прямо указано, что имущество не находится в залоге;
           - "not_defined" — если в тексте нет ни того, ни другого.
        6. pledgee_consent_details — текст о согласии залогодержателя или об отсутствии залога.
        7. co_owners_notice_status:
           - "defined" — если прямо указано соблюдение преимущественного права участников долевой собственности или их отказ;
           - "not_applicable" — если прямо указано, что имущество не находится в долевой собственности;
           - "not_defined" — если в тексте нет ни того, ни другого.
        8. co_owners_notice_details — текст об уведомлении участников долевой собственности.
        9. other_consents_status — "defined" если прямо указаны иные согласия (например, арендатора); иначе "not_defined".
        10. other_consents_details — текст об иных согласиях.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_consents_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - "defined" для каждого согласия — только при прямой ссылке на факт его получения или на уведомление соответствующего лица.
        - "not_applicable" — только при прямом указании в тексте на отсутствие соответствующего основания (например, "имущество не находится в совместной собственности").
        - Не выводи необходимость согласия из закона — только фиксируй, что прямо написано в тексте.
        - Не анализируй размер ренты, страхование, выкуп и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания о согласиях или разрешениях
           третьих лиц, а также об отсутствии соответствующих оснований.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Есть указание на согласие одного лица (например, супруга),
           но другие согласия (залогодержателя, участников долевой
           собственности) не упомянуты и не исключены.
           → presence = "present";
             соответствующее поле = "defined";
             остальные содержательные *_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указано одновременно наличие согласия
           и отсутствие необходимости его получать, конфликт нельзя
           разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Ссылка на согласие без реквизитов.
           В тексте прямо указано, что согласие получено, но без указания
           лица, давшего согласие, даты или иных идентифицирующих реквизитов.
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_consents_presence используй только: "present", "missing", "unclear".
        - Для *_consent_status и *_notice_status используй только: "defined", "not_applicable", "not_defined".
        - Для other_consents_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_consents_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие согласий и разрешений третьих лиц. Внутреннее агрегатное signal-поле."
          required: true

        - name: "spouse_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус согласия супруга (супруги) на отчуждение имущества. Внутреннее enum-поле."
          required: true
        - name: "spouse_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие супруга"
          description: >
            Текст о согласии супруга (супруги) либо об отсутствии совместной собственности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "guardianship_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус разрешения органа опеки и попечительства. Внутреннее enum-поле."
          required: true
        - name: "guardianship_consent_details"
          type: "string"
          presentation: "fact"
          label: "Разрешение органа опеки"
          description: >
            Текст о разрешении органа опеки либо об отсутствии необходимости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "pledgee_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус согласия залогодержателя на отчуждение имущества. Внутреннее enum-поле."
          required: true
        - name: "pledgee_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие залогодержателя"
          description: >
            Текст о согласии залогодержателя либо об отсутствии залога. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "co_owners_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус соблюдения преимущественного права участников долевой собственности. Внутреннее enum-поле."
          required: true
        - name: "co_owners_notice_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление участников долевой собственности"
          description: >
            Текст об уведомлении участников долевой собственности или отказе от преимущественного права. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "other_consents_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия иных согласий (например, арендатора). Внутреннее enum-поле."
          required: true
        - name: "other_consents_details"
          type: "string"
          presentation: "fact"
          label: "Иные согласия"
          description: >
            Текст об иных согласиях и разрешениях третьих лиц. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: recipient_eligibility_check
    name: "Соответствие вида ренты типу получателя (ст. 589, 596, 601 ГК РФ)"
    description: >
      Фактографическая проверка соответствия типа получателя ренты виду
      заключённого договора ренты (постоянная рента / пожизненная рента / ДПСИ)
      императивным требованиям ГК РФ о субъектном составе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "получатель ренты"
        - "гражданин"
        - "физическое лицо"
        - "некоммерческая организация"
        - "коммерческая организация"
        - "постоянная рента"
        - "пожизненная рента"
        - "пожизненное содержание с иждивением"
        - "индивидуальный предприниматель"
        - "акционерное общество"
        - "общество с ограниченной ответственностью"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)получател[ея][а-я]*\\s+рент[а-я]*.*(гражданин|физическ)"
        - "(?i)(постоянн|пожизненн)[а-я]*\\s+рент"
        - "(?i)пожизненн[а-я]*\\s+содержани"
        - "(?i)некоммерческ[а-я]*\\s+организаци"
        - "(?i)коммерческ[а-я]*\\s+организаци"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ; ст. 589 п. 1,
        ст. 596 п. 1, ст. 601 ГК РФ).
        Проверяется только один вопрос: соответствует ли тип получателя
        ренты виду заключённого договора ренты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид ренты (постоянная / пожизненная / ДПСИ).
        2. Тип получателя ренты (гражданин / НКО / коммерческая организация).
        3. Соответствует ли тип получателя виду ренты по императивным нормам:
           - постоянная рента: граждане и НКО (коммерческие организации — нельзя);
           - пожизненная рента: только граждане;
           - ДПСИ: только граждане.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если параметр не указан прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты — ООО «Ромашка», именуемое в дальнейшем «Получатель ренты».
        Стороны заключили договор пожизненной ренты."

        Ответ:
        {
          "rent_type_code": "life_annuity",
          "receiver_type_code": "commercial",
          "eligibility_outcome": "ineligible",
          "eligibility_rule": "пожизненная рента — получателем может быть только гражданин (ст. 596 п. 1 ГК РФ)",
          "eligibility_details": "получатель — коммерческая организация, что не соответствует императивному требованию ст. 596 п. 1 ГК РФ",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Получатель ренты — ООО «Ромашка». Стороны заключили договор пожизненной ренты."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Получатель ренты — Иванов Иван Иванович, гражданин РФ.
        Стороны заключили договор пожизненного содержания с иждивением."

        Ответ:
        {
          "rent_type_code": "lifetime_maintenance",
          "receiver_type_code": "individual",
          "eligibility_outcome": "eligible",
          "eligibility_rule": "ДПСИ — получателем может быть гражданин (ст. 601 ГК РФ)",
          "eligibility_details": "получатель — гражданин, что соответствует императивному требованию ст. 601 ГК РФ",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Получатель ренты — Иванов Иван Иванович, гражданин РФ."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Стороны заключили договор ренты."

        Ответ:
        {
          "rent_type_code": "not_defined",
          "receiver_type_code": "not_defined",
          "eligibility_outcome": "not_defined",
          "eligibility_rule": "Данные не определены",
          "eligibility_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли назван вид ренты?
        2. Прямо ли указан тип получателя (гражданин / НКО / коммерческая организация)?
        3. Соответствует ли тип получателя виду ренты по императивным нормам?
        4. Если данных недостаточно — outcome = "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rent_type_code": "<permanent / life_annuity / lifetime_maintenance / not_defined>",
          "receiver_type_code": "<individual / nco / commercial / not_defined>",
          "eligibility_outcome": "<eligible / ineligible / not_defined>",
          "eligibility_rule": "<текст применённого правила или 'Данные не определены'>",
          "eligibility_details": "<обоснование или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "получатель ренты гражданин физическое лицо некоммерческая организация коммерческая организация постоянная рента пожизненная рента пожизненное содержание с иждивением индивидуальный предприниматель акционерное общество общество с ограниченной ответственностью"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "ритуальные услуги"
        - "замена содержания"
        - "залог в силу закона"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "recipient_eligibility_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты вид ренты
        и тип получателя ренты, затем определи, соответствует ли тип получателя
        виду ренты по императивным нормам ГК РФ.
        Не анализируй размер ренты, страхование, выкуп или споры.
        Не оценивай иные риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. recipient_eligibility_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rent_type_code, receiver_type_code, eligibility_outcome)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rent_type_code = "not_defined";
           - receiver_type_code = "not_defined";
           - eligibility_outcome = "not_defined";
           - eligibility_rule, eligibility_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. rent_type_code — вид ренты:
           - "permanent" — постоянная рента;
           - "life_annuity" — пожизненная рента;
           - "lifetime_maintenance" — пожизненное содержание с иждивением (ДПСИ);
           - "not_defined" — вид ренты прямо не назван и не следует из текста.

        2. receiver_type_code — тип получателя ренты:
           - "individual" — гражданин (физическое лицо, в том числе ИП);
           - "nco" — некоммерческая организация;
           - "commercial" — коммерческая организация (ООО, АО, ПАО и т.п.);
           - "not_defined" — тип получателя прямо не указан.

        3. eligibility_outcome — вывод о соответствии:
           - "eligible" — тип получателя соответствует виду ренты;
           - "ineligible" — тип получателя не соответствует виду ренты;
           - "not_defined" — недостаточно данных для вывода.

        4. eligibility_rule — краткое описание императивного правила,
           применённого для вывода, например:
           - "постоянная рента — получателями могут быть граждане и НКО (ст. 589 п. 1 ГК РФ)";
           - "пожизненная рента — получателем может быть только гражданин (ст. 596 п. 1 ГК РФ)";
           - "ДПСИ — получателем может быть только гражданин (ст. 601 ГК РФ)".

        5. eligibility_details — краткое обоснование вывода на русском языке.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни recipient_eligibility_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_code / eligibility_outcome = "not_defined", eligibility_rule, eligibility_details = "Данные не определены".
        - Только текст договора.
        - Правила соответствия:
          * permanent × individual → eligible;
          * permanent × nco → eligible (при условии, что это не противоречит целям деятельности НКО);
          * permanent × commercial → ineligible;
          * life_annuity × individual → eligible;
          * life_annuity × nco / commercial → ineligible;
          * lifetime_maintenance × individual → eligible;
          * lifetime_maintenance × nco / commercial → ineligible.
        - Если хотя бы один из кодов = "not_defined" — eligibility_outcome = "not_defined", и в eligibility_details укажи, какого компонента не хватает.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида ренты, ни типа получателя.
           → presence = "missing";
             все содержательные поля = "not_defined";
             eligibility_rule, eligibility_details = "Данные не определены".

        2. Есть только один из двух компонентов.
           Указан только вид ренты без типа получателя (или наоборот).
           → presence = "present";
             заполнен соответствующий *_code;
             отсутствующий *_code = "not_defined";
             eligibility_outcome = "not_defined";
             eligibility_details = "Недостаточно данных для вывода о соответствии".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы получателя
           (например, гражданин и коммерческая организация),
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             receiver_type_code = "not_defined";
             eligibility_outcome = "not_defined";
             eligibility_details = "Не удалось определить".

        4. Коммерческая организация как получатель пожизненной ренты
           или ДПСИ (специфика ст. 596, 601 ГК РФ).
           Получателем указана коммерческая организация, вид ренты —
           пожизненная рента или ДПСИ.
           → presence = "present";
             rent_type_code = "life_annuity" / "lifetime_maintenance";
             receiver_type_code = "commercial";
             eligibility_outcome = "ineligible";
             eligibility_rule и eligibility_details содержат обоснование
             со ссылкой на императивную норму.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для recipient_eligibility_presence используй только: "present", "missing", "unclear".
        - Для rent_type_code используй только: "permanent", "life_annuity", "lifetime_maintenance", "not_defined".
        - Для receiver_type_code используй только: "individual", "nco", "commercial", "not_defined".
        - Для eligibility_outcome используй только: "eligible", "ineligible", "not_defined".
        - Fallback при отсутствии данных: eligibility_rule, eligibility_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: eligibility_rule, eligibility_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "recipient_eligibility_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие данных для оценки соответствия вида ренты типу получателя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rent_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["permanent", "life_annuity", "lifetime_maintenance", "not_defined"]
          description: "Вид ренты, определённый для целей проверки соответствия. Внутреннее enum-поле."
          required: true
        - name: "receiver_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["individual", "nco", "commercial", "not_defined"]
          description: "Тип получателя ренты (гражданин / НКО / коммерческая организация). Внутреннее enum-поле."
          required: true
        - name: "eligibility_outcome"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["eligible", "ineligible", "not_defined"]
          description: "Вывод о соответствии типа получателя виду ренты. Внутреннее enum-поле."
          required: true
        - name: "eligibility_rule"
          type: "string"
          presentation: "fact"
          label: "Применённое императивное правило"
          description: >
            Краткое описание императивного правила ГК РФ, применённого для вывода. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "eligibility_details"
          type: "string"
          presentation: "fact"
          label: "Обоснование соответствия"
          description: >
            Краткое обоснование вывода на русском языке. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: minimum_rent_compliance_check
    name: "Соответствие размера ренты императивным минимумам (ст. 590 п. 2, 597 п. 2, 602 п. 2 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре ренты прямого указания
      на императивный минимум размера ренты (МРОТ / прожиточный минимум)
      и соответствия заявленного размера применимому правилу.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "прожиточный минимум"
        - "МРОТ"
        - "минимальный размер оплаты труда"
        - "не менее"
        - "не ниже"
        - "минимальный размер ренты"
        - "индекс потребительских цен"
        - "индексация"
        - "увеличивается пропорционально"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прожиточн[а-я]*\\s+минимум"
        - "(?i)\\bМРОТ\\b"
        - "(?i)минимальн[а-я]*\\s+размер\\s+оплаты\\s+труда"
        - "(?i)не\\s+менее\\s+(одного|двух|\\d)"
        - "(?i)не\\s+ниже\\s+прожиточн"
        - "(?i)индекс[а-я]*\\s+потребительск"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ; ст. 590 п. 2,
        ст. 597 п. 2, ст. 602 п. 2 ГК РФ).
        Проверяется только один вопрос: наличие в тексте договора ссылки
        на императивный минимум размера ренты и соответствие заявленного
        размера применимому правилу.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид ренты (постоянная / пожизненная / ДПСИ).
        2. Указание на императивный минимум (МРОТ, прожиточный минимум, иное).
        3. Какое правило применено: 1 МРОТ / 1 ПМ / 2 ПМ / custom.
        4. Заявлен ли размер ренты «не менее» минимума.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Размер пожизненной ренты составляет 25 000 рублей в месяц,
        что не ниже одного прожиточного минимума на душу населения,
        установленного в субъекте РФ по месту нахождения получателя ренты."

        Ответ:
        {
          "rent_type_code": "life_annuity",
          "minimum_threshold_status": "defined",
          "minimum_threshold_rule_code": "pm_1",
          "minimum_threshold_details": "не ниже одного прожиточного минимума на душу населения в субъекте РФ",
          "compliance_outcome": "compliant",
          "compliance_details": "установленный размер прямо привязан к прожиточному минимуму, применяется правило 1 ПМ для пожизненной ренты (ст. 597 п. 2 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Размер пожизненной ренты составляет 25 000 рублей в месяц, что не ниже одного прожиточного минимума на душу населения, установленного в субъекте РФ."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Размер пожизненного содержания с иждивением устанавливается в размере
        одного прожиточного минимума в месяц."

        Ответ:
        {
          "rent_type_code": "lifetime_maintenance",
          "minimum_threshold_status": "defined",
          "minimum_threshold_rule_code": "pm_1",
          "minimum_threshold_details": "один прожиточный минимум в месяц",
          "compliance_outcome": "potentially_noncompliant",
          "compliance_details": "для ДПСИ императивно требуется не менее двух прожиточных минимумов (ст. 602 п. 2 ГК РФ), заявленный размер привязан только к одному",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Размер пожизненного содержания с иждивением устанавливается в размере одного прожиточного минимума в месяц."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Размер ренты определяется соглашением сторон."

        Ответ:
        {
          "rent_type_code": "not_defined",
          "minimum_threshold_status": "not_defined",
          "minimum_threshold_rule_code": "not_defined",
          "minimum_threshold_details": "Данные не определены",
          "compliance_outcome": "not_defined",
          "compliance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Назван ли вид ренты?
        2. Есть ли прямая ссылка на МРОТ или прожиточный минимум?
        3. Соответствует ли указанное правило применимому по виду ренты?
        4. Если правил несколько — выбран ли наиболее релевантный?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rent_type_code": "<permanent / life_annuity / lifetime_maintenance / not_defined>",
          "minimum_threshold_status": "<defined / not_defined>",
          "minimum_threshold_rule_code": "<mrot_1 / pm_1 / pm_2 / custom / not_defined>",
          "minimum_threshold_details": "<текст или 'Данные не определены'>",
          "compliance_outcome": "<compliant / potentially_noncompliant / not_defined>",
          "compliance_details": "<обоснование или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прожиточный минимум МРОТ минимальный размер оплаты труда не менее не ниже минимальный размер ренты индекс потребительских цен индексация увеличивается пропорционально размер ренты размер содержания"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "залог в силу закона"
        - "ритуальные услуги"
        - "замена содержания"
        - "нотариальное удостоверение"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "minimum_rent_compliance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты вид ренты,
        ссылку на императивный минимум размера ренты и определи, соответствует ли
        заявленный размер применимому правилу.
        Не анализируй индексацию как отдельную тему, выкуп, страхование или споры.
        Не оценивай иные риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. minimum_rent_compliance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rent_type_code, minimum_threshold_status,
              minimum_threshold_rule_code, compliance_outcome) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rent_type_code = "not_defined";
           - minimum_threshold_status = "not_defined";
           - minimum_threshold_rule_code = "not_defined";
           - compliance_outcome = "not_defined";
           - minimum_threshold_details, compliance_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. rent_type_code — вид ренты:
           - "permanent" — постоянная рента;
           - "life_annuity" — пожизненная рента;
           - "lifetime_maintenance" — пожизненное содержание с иждивением (ДПСИ);
           - "not_defined" — вид ренты прямо не назван.

        2. minimum_threshold_status — "defined" если в тексте прямо есть
           ссылка на императивный минимум (МРОТ, прожиточный минимум, иное
           прямо названное правило), иначе "not_defined".

        3. minimum_threshold_rule_code — применённое правило:
           - "mrot_1" — не менее одного МРОТ;
           - "pm_1" — не менее одного прожиточного минимума;
           - "pm_2" — не менее двух прожиточных минимумов;
           - "custom" — иное прямо названное правило;
           - "not_defined" — правило не указано.

        4. minimum_threshold_details — текст о минимуме и о применённом
           правиле.

        5. compliance_outcome — вывод о соответствии:
           - "compliant" — заявленное правило соответствует применимому
             императивному минимуму по виду ренты;
           - "potentially_noncompliant" — заявленное правило ниже
             применимого императивного минимума;
           - "not_defined" — недостаточно данных для вывода.

        6. compliance_details — краткое обоснование вывода на русском языке.

        Соответствие применимому минимуму:
        - permanent: минимум в ГК РФ не установлен, но индексация обязательна (ст. 590 п. 2);
        - life_annuity: не менее одного МРОТ / прожиточного минимума (ст. 597 п. 2);
        - lifetime_maintenance: не менее двух МРОТ / прожиточных минимумов (ст. 602 п. 2).

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни minimum_rent_compliance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status / *_code / compliance_outcome = "not_defined", minimum_threshold_details, compliance_details = "Данные не определены".
        - Только текст договора.
        - compliance_outcome = "compliant" только если заявленное правило прямо соответствует применимому минимуму по виду ренты (например, «не менее одного ПМ» для пожизненной ренты, «не менее двух ПМ» для ДПСИ).
        - compliance_outcome = "potentially_noncompliant" если заявленное правило прямо ниже применимого (например, «один ПМ» для ДПСИ).
        - Не выводи compliance_outcome, если хотя бы один из компонентов = "not_defined".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида ренты, ни ссылки на МРОТ или прожиточный минимум.
           → presence = "missing";
             все содержательные поля = "not_defined";
             minimum_threshold_details, compliance_details = "Данные не определены".

        2. Есть размер ренты, но без привязки к минимуму.
           Указан конкретный размер ренты, но императивный минимум
           не упомянут и правило не названо.
           → presence = "present";
             rent_type_code заполнен;
             minimum_threshold_status = "not_defined";
             minimum_threshold_rule_code = "not_defined";
             compliance_outcome = "not_defined";
             compliance_details = "Размер ренты указан, но ссылка на императивный минимум в тексте отсутствует".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные правила привязки размера
           (например, «один ПМ» и «два ПМ»), конфликт нельзя разрешить
           по тексту.
           → presence = "unclear";
             minimum_threshold_rule_code = "not_defined";
             compliance_outcome = "not_defined";
             compliance_details = "Не удалось определить".

        4. Правило ниже императивного минимума (специфика ст. 602 п. 2 ГК РФ).
           Договор ДПСИ, но размер содержания привязан только к одному
           прожиточному минимуму, тогда как императивно требуется
           не менее двух.
           → presence = "present";
             rent_type_code = "lifetime_maintenance";
             minimum_threshold_status = "defined";
             minimum_threshold_rule_code = "pm_1";
             compliance_outcome = "potentially_noncompliant";
             compliance_details содержит обоснование со ссылкой
             на ст. 602 п. 2 ГК РФ.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для minimum_rent_compliance_presence используй только: "present", "missing", "unclear".
        - Для rent_type_code используй только: "permanent", "life_annuity", "lifetime_maintenance", "not_defined".
        - Для minimum_threshold_status используй только: "defined", "not_defined".
        - Для minimum_threshold_rule_code используй только: "mrot_1", "pm_1", "pm_2", "custom", "not_defined".
        - Для compliance_outcome используй только: "compliant", "potentially_noncompliant", "not_defined".
        - Fallback при отсутствии данных: minimum_threshold_details, compliance_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: minimum_threshold_details, compliance_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "minimum_rent_compliance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие данных о соответствии размера ренты императивным минимумам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rent_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["permanent", "life_annuity", "lifetime_maintenance", "not_defined"]
          description: "Вид ренты, определённый для целей проверки минимума. Внутреннее enum-поле."
          required: true
        - name: "minimum_threshold_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия в тексте ссылки на императивный минимум размера ренты. Внутреннее enum-поле."
          required: true
        - name: "minimum_threshold_rule_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["mrot_1", "pm_1", "pm_2", "custom", "not_defined"]
          description: "Правило привязки размера ренты к императивному минимуму. Внутреннее enum-поле."
          required: true
        - name: "minimum_threshold_details"
          type: "string"
          presentation: "fact"
          label: "Императивный минимум"
          description: >
            Текст договора о привязке размера ренты к императивному минимуму. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "compliance_outcome"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "potentially_noncompliant", "not_defined"]
          description: "Вывод о соответствии заявленного размера применимому императивному минимуму. Внутреннее enum-поле."
          required: true
        - name: "compliance_details"
          type: "string"
          presentation: "fact"
          label: "Обоснование соответствия минимуму"
          description: >
            Краткое обоснование вывода о соответствии или несоответствии императивному минимуму. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: registration_and_effective_date_check
    name: "Регистрация перехода права и обременения, привязка начала выплат (ст. 551, 584, 586 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре ренты условий о государственной
      регистрации перехода права собственности и обременения рентой, а также
      о привязке момента начала рентных выплат к регистрации или иному событию.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "государственная регистрация"
        - "регистрация перехода права"
        - "регистрация обременения"
        - "Росреестр"
        - "ЕГРН"
        - "обременение рентой"
        - "с момента регистрации"
        - "с даты регистрации"
        - "начало выплаты ренты"
        - "первая выплата"
        - "вступает в силу с момента"
        - "право собственности возникает"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн[а-я]*\\s+регистраци"
        - "(?i)регистраци[яи].*переход[а-я]*\\s+прав"
        - "(?i)регистраци[яи].*обременени"
        - "(?i)с\\s+(момента|даты)\\s+регистраци"
        - "(?i)обременени[ея].*рент"
        - "(?i)Росреестр"
        - "(?i)начал[оа].*выплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ; ст. 551 п. 2,
        ст. 584 п. 2, ст. 586 ГК РФ).
        Проверяется только один вопрос: регистрация перехода права
        собственности и обременения рентой, а также привязка момента
        начала рентных выплат.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид имущества (недвижимое / движимое / смешанное).
        2. Условие о государственной регистрации перехода права собственности.
        3. Условие о государственной регистрации обременения рентой.
        4. Привязку момента начала рентных выплат (к регистрации / к подписанию / к передаче имущества / к иной дате).
        5. Указание на орган регистрации (Росреестр / иной).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Имущество — квартира, кадастровый номер 77:06:0001001:123.
        Право собственности Плательщика ренты возникает с момента государственной
        регистрации перехода права в Росреестре. Обременение квартиры рентой
        подлежит государственной регистрации в ЕГРН.
        Рентные выплаты начинаются с даты государственной регистрации перехода
        права собственности."

        Ответ:
        {
          "property_kind": "real_estate",
          "transfer_registration_status": "defined",
          "transfer_registration_details": "право собственности возникает с момента государственной регистрации перехода права в Росреестре",
          "encumbrance_registration_status": "defined",
          "encumbrance_registration_details": "обременение квартиры рентой подлежит регистрации в ЕГРН",
          "effective_date_status": "defined",
          "effective_date_code": "registration",
          "effective_date_details": "рентные выплаты начинаются с даты государственной регистрации перехода права собственности",
          "evidence": [
            {
              "clause_ref": "п. 1.4",
              "quote": "Рентные выплаты начинаются с даты государственной регистрации перехода права собственности."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор ренты на условиях настоящего договора."

        Ответ:
        {
          "property_kind": "not_defined",
          "transfer_registration_status": "not_defined",
          "transfer_registration_details": "Данные не определены",
          "encumbrance_registration_status": "not_defined",
          "encumbrance_registration_details": "Данные не определены",
          "effective_date_status": "not_defined",
          "effective_date_code": "not_defined",
          "effective_date_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли указан вид имущества (недвижимое / движимое)?
        2. Есть ли условие о регистрации перехода права?
        3. Есть ли условие о регистрации обременения рентой?
        4. Есть ли прямая привязка начала выплат к событию?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "property_kind": "<real_estate / movable / mixed / not_defined>",
          "transfer_registration_status": "<defined / not_applicable / not_defined>",
          "transfer_registration_details": "<текст или 'Данные не определены'>",
          "encumbrance_registration_status": "<defined / not_applicable / not_defined>",
          "encumbrance_registration_details": "<текст или 'Данные не определены'>",
          "effective_date_status": "<defined / not_defined>",
          "effective_date_code": "<registration / signing / transfer / custom / not_defined>",
          "effective_date_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация регистрация перехода права регистрация обременения Росреестр ЕГРН обременение рентой с момента регистрации с даты регистрации начало выплаты ренты первая выплата вступает в силу с момента право собственности возникает"
      preferred_unit_types:
        - general_provision
        - obligation
        - procedures
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "ритуальные услуги"
        - "замена содержания"
        - "залог в силу закона"
        - "согласие супруга"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.60]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "registration_and_effective_date_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты условия
        о государственной регистрации перехода права собственности, регистрации
        обременения рентой и привязке момента начала рентных выплат.
        Не анализируй размер ренты, страхование, выкуп или споры.
        Не оценивай иные риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. registration_and_effective_date_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (transfer_registration_status, encumbrance_registration_status,
              effective_date_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - property_kind = "not_defined";
           - transfer_registration_status = "not_defined";
           - encumbrance_registration_status = "not_defined";
           - effective_date_status = "not_defined";
           - effective_date_code = "not_defined";
           - transfer_registration_details, encumbrance_registration_details,
             effective_date_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. property_kind — вид имущества:
           - "real_estate" — недвижимое (квартира, дом, земельный участок и т.п.);
           - "movable" — движимое (автомобиль, ценные бумаги и т.п.);
           - "mixed" — сочетание недвижимого и движимого имущества;
           - "not_defined" — вид имущества прямо не указан.

        2. transfer_registration_status:
           - "defined" — если в тексте прямо указано, что переход права
             собственности подлежит государственной регистрации;
           - "not_applicable" — если прямо указано, что имущество движимое
             и регистрация не требуется;
           - "not_defined" — если в тексте нет ни того, ни другого.

        3. transfer_registration_details — текст о регистрации перехода
           права собственности или о её неприменимости.

        4. encumbrance_registration_status:
           - "defined" — если в тексте прямо указано, что обременение рентой
             подлежит государственной регистрации;
           - "not_applicable" — если прямо указано, что имущество движимое
             и регистрация обременения не требуется;
           - "not_defined" — если в тексте нет ни того, ни другого.

        5. encumbrance_registration_details — текст о регистрации обременения
           рентой или о её неприменимости.

        6. effective_date_status — "defined" если в тексте прямо указана
           привязка момента начала рентных выплат к конкретному событию
           (регистрация / подписание / передача имущества / иная дата),
           иначе "not_defined".

        7. effective_date_code — привязка начала выплат:
           - "registration" — с момента государственной регистрации;
           - "signing" — с момента подписания договора;
           - "transfer" — с момента передачи имущества;
           - "custom" — иная прямо названная дата или событие;
           - "not_defined" — привязка не указана.

        8. effective_date_details — текст о привязке момента начала выплат.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни registration_and_effective_date_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", property_kind = "not_defined", effective_date_code = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - transfer_registration_status = "defined" только при прямом указании на необходимость регистрации перехода права собственности.
        - encumbrance_registration_status = "defined" только при прямом указании на необходимость регистрации обременения рентой.
        - effective_date_status = "defined" только при прямой привязке момента начала выплат к конкретному событию или дате.
        - effective_date_code = "registration" только если начало выплат прямо привязано к дате государственной регистрации.
        - Не выводи необходимость регистрации из вида имущества — фиксируй только то, что прямо написано в тексте.
        - Не анализируй размер ренты, страхование, выкуп и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида имущества, ни условий о регистрации,
           ни привязки начала выплат.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             property_kind = "not_defined";
             effective_date_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Указана регистрация перехода права собственности, но без регистрации
           обременения рентой и без привязки начала выплат.
           → presence = "present";
             transfer_registration_status = "defined";
             encumbrance_registration_status = "not_defined";
             effective_date_status = "not_defined";
             effective_date_code = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные привязки начала выплат
           (например, «с момента подписания» и «с момента регистрации»),
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             effective_date_status = "not_defined";
             effective_date_code = "not_defined";
             effective_date_details = "Не удалось определить".

        4. Движимое имущество (специфика ст. 584 ГК РФ).
           Передаётся движимое имущество; регистрация перехода права
           и обременения не требуется.
           → presence = "present";
             property_kind = "movable";
             transfer_registration_status = "not_applicable";
             encumbrance_registration_status = "not_applicable";
             transfer_registration_details и
             encumbrance_registration_details содержат формулировку
             о неприменимости регистрации.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для registration_and_effective_date_presence используй только: "present", "missing", "unclear".
        - Для transfer_registration_status и encumbrance_registration_status используй только: "defined", "not_applicable", "not_defined".
        - Для effective_date_status используй только: "defined" или "not_defined".
        - Для property_kind используй только: "real_estate", "movable", "mixed", "not_defined".
        - Для effective_date_code используй только: "registration", "signing", "transfer", "custom", "not_defined".
        - Fallback при отсутствии данных: transfer_registration_details, encumbrance_registration_details, effective_date_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: transfer_registration_details, encumbrance_registration_details, effective_date_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "registration_and_effective_date_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о регистрации перехода права / обременения и привязке начала выплат. Внутреннее агрегатное signal-поле."
          required: true

        - name: "property_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["real_estate", "movable", "mixed", "not_defined"]
          description: "Вид имущества, передаваемого под выплату ренты. Внутреннее enum-поле."
          required: true
        - name: "transfer_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус условия о государственной регистрации перехода права собственности. Внутреннее enum-поле."
          required: true
        - name: "transfer_registration_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация перехода права"
          description: >
            Текст о государственной регистрации перехода права собственности или о её неприменимости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "encumbrance_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус условия о государственной регистрации обременения рентой. Внутреннее enum-поле."
          required: true
        - name: "encumbrance_registration_details"
          type: "string"
          presentation: "fact"
          label: "Регистрация обременения"
          description: >
            Текст о государственной регистрации обременения рентой или о её неприменимости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "effective_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения привязки момента начала рентных выплат. Внутреннее enum-поле."
          required: true
        - name: "effective_date_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["registration", "signing", "transfer", "custom", "not_defined"]
          description: "Событие, к которому привязано начало рентных выплат. Внутреннее enum-поле."
          required: true
        - name: "effective_date_details"
          type: "string"
          presentation: "fact"
          label: "Начало выплат"
          description: >
            Текст о привязке момента начала рентных выплат. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification_and_capacity:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты получателя и плательщика ренты (ФИО/наименование,
      паспортные данные или ИНН/ОГРН, адрес);
      (б) полномочия подписантов;
      (в) статус получателя ренты (гражданин / НКО / коммерческая организация)
      с точки зрения допустимости быть получателем данного вида ренты (ст. 589, 596 ГК РФ);
      (г) подтверждение дееспособности получателя ренты.
    addressee: "Обе стороны / Нотариус"

  rent_type_and_core_terms_extraction:
    text: >
      Просим предоставить по {doc_names}: явное указание вида ренты
      (постоянная / пожизненная / ДПСИ), описание имущества, форму рентного
      предоставления (деньги / содержание / смешанная), периодичность,
      характер передачи имущества (за плату / бесплатно).
    addressee: "Обе стороны"

  notarization_check:
    text: >
      Просим подтвердить по {doc_names}: нотариальное удостоверение договора,
      ФИО нотариуса, дату удостоверения, реестровый номер нотариального действия
      и место совершения нотариального действия (ст. 584 ГК РФ).
      При его отсутствии договор ничтожен.
    addressee: "Нотариус / Юридический советник"

  property_and_statutory_pledge_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) точное описание и индивидуализацию имущества (кадастровый номер,
      адрес, площадь — для недвижимости; VIN, марка, модель — для ТС);
      (б) наличие залога в силу закона в пользу получателя ренты (ст. 587 ГК РФ);
      (в) наличие и вид дополнительного обеспечения при движимом имуществе
      (поручительство, банковская гарантия, страхование ответственности);
      (г) порядок регистрации обременения рентой для недвижимости.
    addressee: "Юридический советник / Росреестр"

  rent_amount_indexation_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) размер ренты / стоимость натурального содержания в рублях;
      (б) соответствие минимальным требованиям — не менее 1 ПМ (пожизненная)
      или 2 ПМ (ДПСИ) в месяц с учётом ПМ субъекта РФ;
      (в) механизм индексации (привязка к ПМ, периодичность пересчёта);
      (г) периодичность выплат / предоставления содержания;
      (д) ставка процентов/пени за просрочку рентных платежей.
    addressee: "Обе стороны / Юридический советник"

  lifetime_maintenance_scope_check:
    text: >
      Для {doc_names} (ДПСИ) просим детализировать объём натурального содержания:
      (а) жильё (предоставление или сохранение права пользования);
      (б) питание (состав, частота, стандарт);
      (в) одежда, обувь, гигиена;
      (г) медицинская помощь (амбулаторная / стационарная);
      (д) коммунальные услуги;
      (е) бытовая помощь и уход на дому;
      (ж) ритуальные услуги (обязанность организовать и оплатить похороны);
      (з) возможность замены натурального содержания денежными выплатами
      и условия такой замены (ст. 603 ГК РФ).
    addressee: "Плательщик ренты / Юридический советник"

  redemption_and_termination_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) у кого право требовать выкупа ренты и в каком порядке;
      (б) выкупную цену и методику её расчёта;
      (в) срок уведомления о намерении выкупить ренту;
      (г) критерии существенного нарушения для целей расторжения;
      (д) при ДПСИ — право получателя требовать возврата имущества
      или выкупной цены при существенном нарушении (ст. 605 ГК РФ);
      (е) порядок снятия обременения рентой при прекращении договора.
    addressee: "Юридический советник"

  risk_insurance_and_late_payment:
    text: >
      Просим уточнить по {doc_names}:
      (а) кто несёт риск случайной гибели / повреждения имущества;
      (б) влияет ли гибель имущества на обязанность продолжать выплату ренты
      (по умолчанию: при пожизненной ренте — нет, ст. 600 ГК РФ);
      (в) условия страхования имущества и/или ответственности плательщика,
      выгодоприобретатель, минимальная страховая сумма;
      (г) размер процентов / неустойки за просрочку рентного платежа
      (ст. 588, 395 ГК РФ).
    addressee: "Плательщик ренты / Страховой консультант / Юридический советник"

  unconscionability_and_capacity_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) подтверждение добровольности заключения и дееспособности получателя ренты;
      (б) сведения о разъяснениях нотариуса при удостоверении;
      (в) независимую оценку рыночной стоимости имущества;
      (г) при ДПСИ — механизмы защиты получателя от злоупотреблений:
      право родственников навещать, контроль качества ухода, доступ медицинской
      и социальной помощи, запрет изоляции.
    addressee: "Нотариус / Юридический советник"

  alienation_restriction_compliance_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) наличие прямого запрета на отчуждение, залог, аренду и обременение
      имущества без предварительного согласия получателя ренты (ст. 604 ГК РФ);
      (б) процедуру получения согласия (форма, срок рассмотрения);
      (в) последствия нарушения запрета;
      (г) регистрацию ограничения в ЕГРН (для недвижимости).
    addressee: "Юридический советник"

  paid_vs_free_transfer_and_succession:
    text: >
      Просим уточнить по {doc_names}:
      (а) характер передачи имущества — за плату или бесплатно (ст. 585 ГК РФ),
      и размер платы (если применимо);
      (б) порядок перехода рентных обязательств к новому собственнику имущества
      при его последующем отчуждении плательщиком (ст. 586 ГК РФ);
      (в) тип ответственности прежнего плательщика — субсидиарная (по умолчанию)
      или солидарная (усиленная защита получателя);
      (г) порядок уведомления получателя о смене плательщика.
    addressee: "Юридический советник"

  termination_liability_and_disputes:
    text: >
      Просим уточнить по {doc_names}:
      (а) подсудность споров (суд общей юрисдикции / арбитражный суд);
      (б) претензионный порядок с конкретным сроком рассмотрения претензии;
      (в) условия конфиденциальности: перечень охраняемых сведений,
      исключения, срок действия;
      (г) подтверждение применимого права (РФ или иное с обоснованием).
    addressee: "Юридический советник"

  mandatory_notarization_required:
    text: >
      Внимание: для {doc_names} нотариальная форма обязательна по ст. 584 ГК РФ.
      При её отсутствии договор является ничтожным. Просим подтвердить факт
      нотариального удостоверения и предоставить реквизиты нотариуса.
    addressee: "Юридический советник / Нотариус"

  real_estate_registration_and_encumbrance_required:
    text: >
      Внимание: для {doc_names}, предусматривающего передачу недвижимости,
      требуется:
      (а) регистрация перехода права собственности в Росреестре;
      (б) регистрация обременения рентой в ЕГРН;
      (в) залог в силу закона в пользу получателя ренты (ст. 587 ГК РФ).
      Просим предоставить план регистрационных действий.
    addressee: "Юридический советник / Росреестр"

  movable_property_security_required:
    text: >
      Внимание: при передаче движимого имущества по {doc_names} плательщик
      обязан предоставить обеспечение выплаты ренты (ст. 587 п. 2 ГК РФ).
      Просим предоставить сведения о выбранном способе обеспечения
      (поручительство / банковская гарантия / залог / страхование ответственности).
    addressee: "Плательщик ренты / Юридический советник"

  reclassification_risk_not_rent:
    text: >
      Внимание: {doc_names} содержит риск переквалификации как договора
      купли-продажи или дарения при отсутствии периодических рентных платежей.
      Просим уточнить рентную природу обязательств и включить условия
      о периодическом предоставлении ренты / содержания.
    addressee: "Юридический советник"

  alienation_prohibition_lifetime_maintenance:
    text: >
      Внимание: для {doc_names} (ДПСИ) плательщик ренты не вправе отчуждать,
      закладывать или иным образом обременять имущество без предварительного
      согласия получателя ренты (ст. 604 ГК РФ). Просим:
      (а) подтвердить наличие данного условия в договоре;
      (б) описать процедуру получения согласия;
      (в) зафиксировать это ограничение в ЕГРН.
    addressee: "Юридический советник"

  permanent_rent_recipient_limitation:
    text: >
      Внимание: по {doc_names} (постоянная рента) получателями могут быть только
      граждане и НКО (ст. 589 ГК РФ). Просим подтвердить статус получателя ренты
      и предоставить документы, подтверждающие его правоспособность.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

