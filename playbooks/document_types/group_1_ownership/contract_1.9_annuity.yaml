      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "rent_amount_indexation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1050

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты размер ренты,
        привязку к прожиточному минимуму, индексацию, периодичность выплат
        и последствия просрочки.
        Не анализируй имущество, выкуп, риск гибели или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rent_amount_indexation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rent_amount_status, pm_link_status, indexation_status,
              payment_periodicity_status, late_payment_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rent_amount_status = "not_defined";
           - pm_link_status = "not_defined";
           - indexation_status = "not_defined";
           - indexation_mechanism = "not_defined";
           - payment_periodicity_status = "not_defined";
           - payment_periodicity_code = "not_defined";
           - late_payment_status = "not_defined";
           - rent_amount_value, pm_link_details, late_payment_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. rent_amount_status — "defined" если размер ренты прямо указан, иначе "not_defined".
        2. rent_amount_value — размер ренты или содержания.
        3. pm_link_status — "defined" если есть привязка к прожиточному минимуму, иначе "not_defined".
        4. pm_link_details — текст о привязке к прожиточному минимуму.
        5. indexation_status — "defined" если индексация прямо указана, иначе "not_defined".
        6. indexation_mechanism — "pm_based" / "inflation" / "custom" / "not_defined".
        7. payment_periodicity_status — "defined" если периодичность указана, иначе "not_defined".
        8. payment_periodicity_code — "monthly" / "quarterly" / "yearly" / "custom" / "not_defined".
        9. late_payment_status — "defined" если последствия просрочки прямо указаны, иначе "not_defined".
        10. late_payment_details — текст о пене, процентах или иной ответственности за просрочку.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текст = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни rent_amount_indexation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", все *_code = "not_defined", все *_value / *_details = "Данные не определены".
        - Только текст договора.
        - pm_based = индексация привязана к прожиточному минимуму.
        - inflation = индексация привязана к инфляции или индексу потребительских цен.
        - custom = иной механизм индексации, прямо описанный в договоре.
        - monthly = ежемесячно, quarterly = ежеквартально, yearly = ежегодно.
        - Не анализируй имущество, выкуп, риск случайной гибели, страхование
          и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни размера ренты, ни привязки к ПМ, ни индексации,
           ни периодичности, ни последствий просрочки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_code = "not_defined";
             все *_value / *_details = "Данные не определены".

        2. Неполное раскрытие темы.
           Размер ренты указан, но без привязки к ПМ, индексации
           и последствий просрочки.
           → presence = "present";
             rent_amount_status = "defined";
             pm_link_status / indexation_status / late_payment_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы ренты или разная
           периодичность, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Общая ссылка на закон вместо конкретного механизма.
           "Стороны несут ответственность в соответствии с законодательством РФ"
           без указания конкретной пени или процентов.
           → presence = "present" (если другие поля определены);
             late_payment_status = "not_defined";
             late_payment_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rent_amount_indexation_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для indexation_mechanism используй только: "pm_based", "inflation", "custom", "not_defined".
        - Для payment_periodicity_code используй только: "monthly", "quarterly", "yearly", "custom", "not_defined".
        - Fallback при отсутствии данных: все *_value / *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_value / *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_amount_indexation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по размеру ренты / индексации / периодичности / просрочке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rent_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения размера ренты. Внутреннее enum-поле."
          required: true
        - name: "rent_amount_value"
          type: "string"
          presentation: "fact"
          label: "Размер ренты"
          description: >
            Размер ренты или содержания в денежном выражении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "pm_link_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия привязки к прожиточному минимуму. Внутреннее enum-поле."
          required: true
        - name: "pm_link_details"
          type: "string"
          presentation: "fact"
          label: "Привязка к прожиточному минимуму"
          description: >
            Текст договора о привязке размера ренты к прожиточному минимуму. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения механизма индексации. Внутреннее enum-поле."
          required: true
        - name: "indexation_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["pm_based", "inflation", "custom", "not_defined"]
          description: "Механизм индексации рентных выплат. Внутреннее enum-поле."
          required: true
        - name: "payment_periodicity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности рентных выплат. Внутреннее enum-поле."
          required: true
        - name: "payment_periodicity_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["monthly", "quarterly", "yearly", "custom", "not_defined"]
          description: "Периодичность рентных выплат. Внутреннее enum-поле."
          required: true
        - name: "late_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий просрочки рентных платежей. Внутреннее enum-поле."
          required: true
        - name: "late_payment_details"
          type: "string"
          presentation: "fact"
          label: "Просрочка рентных платежей"
          description: >
            Условие о пене, процентах или иной ответственности за просрочку. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: lifetime_maintenance_scope_check
    name: "ДПСИ: объём натурального содержания, право проживания, ритуальные услуги, замена деньгами (ст. 602-603 ГК РФ, ст. 33 ЖК РФ)"
    description: >
      Фактографическая проверка наличия и детализации натурального содержания при ДПСИ,
      включая право проживания получателя ренты в переданном жилье, распространение
      этого права на членов семьи, срок проживания, ритуальные услуги и условия
      замены содержания денежными выплатами.
    triggers:
      any: ["lifetime_maintenance", "natural_maintenance"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "питание"
        - "лекарства"
        - "медицинская помощь"
        - "одежда"
        - "обувь"
        - "уборка"
        - "гигиенические процедуры"
        - "жильё"
        - "коммунальные услуги"
        - "ритуальные услуги"
        - "уход"
        - "содержание"
        - "погребение"
        - "похороны"
        - "замена содержания"
        - "денежный эквивалент"
        - "денежная сумма вместо содержания"
        - "право проживания"
        - "право пользования жилым помещением"
        - "сохраняет право проживания"
        - "пожизненное проживание"
        - "члены семьи"
        - "регистрация по месту жительства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ритуальн(ые|ых)\\s+услуг"
        - "(?i)медицинск(ая|ой)\\s+помощ"
        - "(?i)коммунальн(ые|ых)\\s+услуг"
        - "(?i)замен(а|ить).*содержан"
        - "(?i)погребени|похорон"
        - "(?i)прав[оа]\\s+(проживани|пользовани[яе])"
        - "(?i)сохраня[ею]т?\\s+прав[оа]\\s+(проживани|пользовани)"
        - "(?i)член[а-я]*\\s+семь"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор пожизненного содержания с иждивением (ст. 601-605 ГК РФ,
        ст. 33 ЖК РФ).
        Проверяется только один вопрос: объём натурального содержания, право
        проживания получателя в переданном жилье, ритуальные услуги и возможность
        замены содержания денежными выплатами.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Жильё в составе содержания (предоставляется или нет).
        2. Питание в составе содержания.
        3. Медицинская помощь.
        4. Одежда/обувь/гигиена.
        5. Коммунальные услуги.
        6. Право проживания получателя ренты в переданном жилом помещении.
        7. Срок сохранения права проживания.
        8. Распространение права проживания на членов семьи получателя.
        9. Ритуальные услуги (похороны).
        10. Стоимость содержания в рублях.
        11. Возможность замены содержания денежными выплатами (ст. 603 ГК РФ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Плательщик ренты обязуется пожизненно обеспечивать получателя ренты
        жильём (предоставлять комнату в квартире), питанием, одеждой,
        медицинской помощью и уходом. Коммунальные услуги оплачиваются за счёт
        Плательщика. Стоимость содержания — не менее 60 000 рублей в месяц.
        Получатель ренты сохраняет право пожизненного проживания в переданной
        квартире, а также право проживания членов его семьи — супруги Петровой А.И.
        Ритуальные услуги (погребение) организует и оплачивает Плательщик.
        Замена содержания денежными выплатами допускается только с письменного
        согласия Получателя ренты."

        Ответ:
        {
          "maintenance_scope_status": "defined",
          "maintenance_scope_level": "detailed",
          "housing_status": "defined",
          "food_status": "defined",
          "medical_care_status": "defined",
          "clothing_status": "defined",
          "utilities_status": "defined",
          "residence_right_status": "defined",
          "residence_right_details": "получатель сохраняет право пожизненного проживания в переданной квартире",
          "residence_term_status": "defined",
          "residence_term_details": "пожизненное проживание",
          "residence_family_scope_status": "defined",
          "residence_family_scope_details": "право проживания членов семьи — супруги Петровой А.И.",
          "funeral_services_status": "defined",
          "funeral_services_details": "организует и оплачивает Плательщик",
          "maintenance_value_status": "defined",
          "maintenance_value_value": "не менее 60 000 рублей в месяц",
          "cash_substitution_status": "defined",
          "cash_substitution_details": "допускается только с письменного согласия Получателя ренты",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Получатель ренты сохраняет право пожизненного проживания в переданной квартире, а также право проживания членов его семьи — супруги Петровой А.И."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Плательщик ренты обязуется обеспечивать получателя ренты всем необходимым."

        Ответ:
        {
          "maintenance_scope_status": "defined",
          "maintenance_scope_level": "general",
          "housing_status": "not_defined",
          "food_status": "not_defined",
          "medical_care_status": "not_defined",
          "clothing_status": "not_defined",
          "utilities_status": "not_defined",
          "residence_right_status": "not_defined",
          "residence_right_details": "Данные не определены",
          "residence_term_status": "not_defined",
          "residence_term_details": "Данные не определены",
          "residence_family_scope_status": "not_defined",
          "residence_family_scope_details": "Данные не определены",
          "funeral_services_status": "not_defined",
          "funeral_services_details": "Данные не определены",
          "maintenance_value_status": "not_defined",
          "maintenance_value_value": "Данные не определены",
          "cash_substitution_status": "not_defined",
          "cash_substitution_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Плательщик ренты обязуется обеспечивать получателя ренты всем необходимым."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Перечислены ли конкретные виды содержания?
        2. Упомянуто ли право проживания получателя в переданном жилье?
        3. Указан ли срок проживания (пожизненно / на срок)?
        4. Распространено ли право проживания на членов семьи?
        5. Упомянуты ли ритуальные услуги / похороны прямо?
        6. Указана ли стоимость содержания в рублях?
        7. Есть ли условие о замене деньгами?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "maintenance_scope_status": "<defined / not_defined>",
          "maintenance_scope_level": "<detailed / general / not_defined>",
          "housing_status": "<defined / not_defined>",
          "food_status": "<defined / not_defined>",
          "medical_care_status": "<defined / not_defined>",
          "clothing_status": "<defined / not_defined>",
          "utilities_status": "<defined / not_defined>",
          "residence_right_status": "<defined / not_applicable / not_defined>",
          "residence_right_details": "<текст или 'Данные не определены'>",
          "residence_term_status": "<defined / not_defined>",
          "residence_term_details": "<текст или 'Данные не определены'>",
          "residence_family_scope_status": "<defined / not_defined>",
          "residence_family_scope_details": "<текст или 'Данные не определены'>",
          "funeral_services_status": "<defined / not_defined>",
          "funeral_services_details": "<текст или 'Данные не определены'>",
          "maintenance_value_status": "<defined / not_defined>",
          "maintenance_value_value": "<сумма или 'Данные не определены'>",
          "cash_substitution_status": "<defined / not_defined>",
          "cash_substitution_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "питание лекарства медицинская помощь одежда обувь уборка гигиенические процедуры жильё коммунальные услуги ритуальные услуги уход содержание погребение похороны замена содержания денежный эквивалент денежная сумма вместо содержания право проживания право пользования жилым помещением сохраняет право проживания пожизненное проживание члены семьи регистрация по месту жительства"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "кабальная сделка"
        - "действует добровольно"
        - "осознает последствия"
        - "нотариус разъяснил"
        - "независимая оценка"
        - "отсутствие давления"
        - "контроль качества ухода"
        - "выкуп ренты"
        - "расторжение"
        - "запрет отчуждения"
        - "залог в силу закона"
        - "пеня"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "lifetime_maintenance_scope_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора пожизненного содержания
        с иждивением объём натурального содержания, право проживания получателя
        в переданном жилье, стоимость содержания, ритуальные услуги и замену
        содержания денежными выплатами.
        Не анализируй нотариальную форму, выкуп, риск гибели или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lifetime_maintenance_scope_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (maintenance_scope_status, housing_status, food_status,
              medical_care_status, clothing_status, utilities_status,
              residence_right_status, residence_term_status,
              residence_family_scope_status, funeral_services_status,
              maintenance_value_status, cash_substitution_status)
             ≠ "not_defined";
           - "missing" — если все двенадцать содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - maintenance_scope_status = "not_defined";
           - maintenance_scope_level = "not_defined";
           - housing_status = "not_defined";
           - food_status = "not_defined";
           - medical_care_status = "not_defined";
           - clothing_status = "not_defined";
           - utilities_status = "not_defined";
           - residence_right_status = "not_defined";
           - residence_term_status = "not_defined";
           - residence_family_scope_status = "not_defined";
           - funeral_services_status = "not_defined";
           - maintenance_value_status = "not_defined";
           - cash_substitution_status = "not_defined";
           - residence_right_details, residence_term_details,
             residence_family_scope_details, funeral_services_details,
             maintenance_value_value, cash_substitution_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. maintenance_scope_status — "defined" если объём содержания указан, иначе "not_defined".
        2. maintenance_scope_level — "detailed" / "general" / "not_defined".
        3. housing_status — "defined" если жильё входит в состав содержания, иначе "not_defined".
        4. food_status — "defined" если питание входит в состав содержания, иначе "not_defined".
        5. medical_care_status — "defined" если медицинская помощь указана, иначе "not_defined".
        6. clothing_status — "defined" если одежда, обувь или гигиена указаны, иначе "not_defined".
        7. utilities_status — "defined" если коммунальные услуги указаны, иначе "not_defined".
        8. residence_right_status:
           - "defined" — если в тексте прямо указано, что получатель ренты
             сохраняет право проживания / пользования в переданном жилом помещении;
           - "not_applicable" — если прямо указано, что имущество не является
             жилым помещением либо право проживания не предусмотрено;
           - "not_defined" — если в тексте нет ни того, ни другого.
        9. residence_right_details — текст о праве проживания получателя
           в переданном жилом помещении.
        10. residence_term_status — "defined" если прямо указан срок проживания
            (пожизненно / конкретный срок / до наступления события), иначе "not_defined".
        11. residence_term_details — текст о сроке сохранения права проживания.
        12. residence_family_scope_status — "defined" если в тексте прямо указано
            распространение права проживания на членов семьи получателя,
            иначе "not_defined".
        13. residence_family_scope_details — текст о праве проживания членов семьи
            получателя.
        14. funeral_services_status — "defined" если ритуальные услуги указаны, иначе "not_defined".
        15. funeral_services_details — текст о ритуальных услугах.
        16. maintenance_value_status — "defined" если стоимость содержания указана, иначе "not_defined".
        17. maintenance_value_value — стоимость содержания.
        18. cash_substitution_status — "defined" если замена содержания деньгами указана, иначе "not_defined".
        19. cash_substitution_details — текст о замене содержания денежными выплатами.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текст = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни lifetime_maintenance_scope_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", maintenance_scope_level = "not_defined", все *_details / *_value = "Данные не определены".
        - Только текст договора.
        - detailed = перечислены конкретные виды содержания (жильё, питание, медпомощь и т.п.).
        - general = есть только общая фраза о содержании без конкретного перечня.
        - residence_right_status = "defined" только при прямом указании на сохранение за получателем права проживания / пользования в переданном жилом помещении.
        - residence_right_status = "not_applicable" только при прямом указании на нежилой характер имущества или на отсутствие права проживания.
        - residence_term_status = "defined" только при прямом указании срока (пожизненно, конкретный срок, до события).
        - residence_family_scope_status = "defined" только при прямом указании на распространение права проживания на членов семьи.
        - Не анализируй нотариальную форму, выкуп, расторжение и иные нерелевантные темы.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни объёма содержания, ни права проживания,
           ни стоимости, ни ритуальных услуг, ни замены деньгами.
           → presence = "missing";
             все содержательные *_status = "not_defined";
             maintenance_scope_level = "not_defined";
             все *_details / *_value = "Данные не определены".

        2. Неполное раскрытие темы.
           Объём содержания указан общей фразой ("обеспечивать всем необходимым")
           без перечня конкретных видов и без права проживания.
           → presence = "present";
             maintenance_scope_status = "defined"; maintenance_scope_level = "general";
             housing_status / food_status / medical_care_status /
             clothing_status / utilities_status / residence_right_status /
             residence_term_status / residence_family_scope_status /
             funeral_services_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы стоимости содержания
           или разные условия права проживания, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value / *_details = "Не удалось определить".

        4. Замена содержания деньгами (специфика ст. 603 ГК РФ).
           В тексте указано, что содержание может быть заменено денежными
           выплатами, но механизм или условия замены не раскрыты.
           → presence = "present";
             cash_substitution_status = "defined";
             cash_substitution_details = "Данные не определены".

        5. Право проживания не урегулировано (специфика ст. 33 ЖК РФ).
           Получатель ренты передаёт жилое помещение под ДПСИ, но право
           проживания получателя в тексте не упомянуто.
           → presence = "present" (если другие содержательные поля определены);
             residence_right_status = "not_defined";
             residence_right_details = "Данные не определены".

        6. Право проживания распространено на членов семьи.
           В тексте прямо указано, что право проживания сохраняется
           не только за получателем ренты, но и за членами его семьи.
           → presence = "present";
             residence_right_status = "defined";
             residence_family_scope_status = "defined";
             residence_family_scope_details содержит формулировку
             о распространении права проживания на членов семьи получателя.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lifetime_maintenance_scope_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для maintenance_scope_level используй только: "detailed", "general", "not_defined".
        - Для residence_right_status используй только: "defined", "not_applicable", "not_defined".
        - Fallback при отсутствии данных: все *_details / *_value = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_details / *_value = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lifetime_maintenance_scope_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по объёму содержания / праву проживания / ритуальным услугам / замене деньгами. Внутреннее агрегатное signal-поле."
          required: true

        - name: "maintenance_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения объёма натурального содержания. Внутреннее enum-поле."
          required: true
        - name: "maintenance_scope_level"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["detailed", "general", "not_defined"]
          description: "Степень детализации состава содержания. Внутреннее enum-поле."
          required: true
        - name: "housing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус включения жилья в состав содержания. Внутреннее enum-поле."
          required: true
        - name: "food_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус включения питания в состав содержания. Внутреннее enum-поле."
          required: true
        - name: "medical_care_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус включения медицинской помощи в состав содержания. Внутреннее enum-поле."
          required: true
        - name: "clothing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус включения одежды, обуви или гигиены в состав содержания. Внутреннее enum-поле."
          required: true
        - name: "utilities_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус включения коммунальных услуг в состав содержания. Внутреннее enum-поле."
          required: true
        - name: "residence_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус наличия условия о сохранении за получателем ренты права проживания в переданном жилом помещении. Внутреннее enum-поле."
          required: true
        - name: "residence_right_details"
          type: "string"
          presentation: "fact"
          label: "Право проживания получателя"
          description: >
            Текст о сохранении за получателем ренты права проживания в переданном жилом помещении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "residence_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока сохранения права проживания. Внутреннее enum-поле."
          required: true
        - name: "residence_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок проживания"
          description: >
            Текст о сроке сохранения права проживания получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "residence_family_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распространения права проживания на членов семьи получателя. Внутреннее enum-поле."
          required: true
        - name: "residence_family_scope_details"
          type: "string"
          presentation: "fact"
          label: "Члены семьи получателя"
          description: >
            Текст о праве проживания членов семьи получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "funeral_services_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о ритуальных услугах. Внутреннее enum-поле."
          required: true
        - name: "funeral_services_details"
          type: "string"
          presentation: "fact"
          label: "Ритуальные услуги"
          description: >
            Текст условия о ритуальных услугах и погребении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "maintenance_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения стоимости содержания. Внутреннее enum-поле."
          required: true
        - name: "maintenance_value_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость содержания"
          description: >
            Стоимость пожизненного содержания в денежном выражении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "cash_substitution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о замене содержания денежными выплатами. Внутреннее enum-поле."
          required: true
        - name: "cash_substitution_details"
          type: "string"
          presentation: "fact"
          label: "Замена содержания деньгами"
          description: >
            Текст условия о замене натурального содержания денежными выплатами. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: rent_buyout_check
    name: "Выкуп ренты: право выкупа, цена и уведомление"
    description: >
      Фактографическая проверка наличия условий о выкупе ренты:
      право требовать выкупа, выкупная цена и срок уведомления.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "выкуп ренты"
        - "выкупная цена"
        - "право требовать выкупа"
        - "уведомление о выкупе"
        - "цена выкупа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выкупн(ая|ой)\\s+цен"
        - "(?i)право\\s+требовать\\s+выкуп"
        - "(?i)уведомлени(е|я).*выкуп"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты.
        Проверяется только один вопрос: право выкупа ренты, выкупная цена
        и срок уведомления.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право требовать выкупа ренты.
        2. У кого есть такое право.
        3. Выкупную цену или её методику.
        4. Срок уведомления о намерении выкупить ренту.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты вправе требовать выкупа ренты при просрочке выплаты
        более двух раз подряд. Выкупная цена составляет 1 500 000 рублей.
        Уведомление о намерении выкупить ренту направляется не позднее чем
        за 3 месяца до предполагаемой даты выкупа."

        Ответ:
        {
          "buyout_clause_status": "defined",
          "buyout_right_holder": "receiver",
          "buyout_price_status": "defined",
          "buyout_price_details": "1 500 000 рублей",
          "buyout_notice_period_status": "defined",
          "buyout_notice_period_value": "не менее 3 месяцев до предполагаемой даты",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Выкупная цена составляет 1 500 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны вправе прекратить договор ренты по соглашению."

        Ответ:
        {
          "buyout_clause_status": "not_defined",
          "buyout_right_holder": "not_defined",
          "buyout_price_status": "not_defined",
          "buyout_price_details": "Данные не определены",
          "buyout_notice_period_status": "not_defined",
          "buyout_notice_period_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слово "выкуп" или "выкупная цена"?
        2. У какой стороны право выкупа?
