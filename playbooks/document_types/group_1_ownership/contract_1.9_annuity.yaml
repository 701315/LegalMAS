  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  pm_reference: "(?i)(прожиточн(ый|ого)\\s+минимум|ПМ)"
  periodicity: "(?i)(ежемесячно|ежеквартально|ежегодно|каждый\\s+месяц|раз\\s+в\\s+месяц)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_identification_and_capacity
    name: "Стороны договора ренты: идентификация, полномочия, дееспособность, допустимость получателя"
    description: >
      Фактографическая проверка наличия в договоре данных о получателе и плательщике
      ренты, их реквизитов, полномочий подписантов, подтверждения дееспособности
      и соответствия типа получателя виду заключённого договора ренты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "получатель ренты"
        - "плательщик ренты"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
        - "дата рождения"
        - "пенсионер"
        - "гражданин"
        - "физическое лицо"
        - "ООО"
        - "АО"
        - "некоммерческая организация"
        - "дееспособен"
        - "нотариус разъяснил"
        - "постоянная рента"
        - "пожизненная рента"
        - "содержание с иждивением"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(получатель\\s+ренты|плательщик\\s+ренты).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)(постоянн|пожизненн)[а-я]*\\s+рент"
        - "(?i)пожизненн[а-я]*\\s+содержани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 583-605;
        ст. 432, 182-185 ГК РФ; ст. 589, 596, 601 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов,
        дееспособность, допустимость получателя для данного вида ренты.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Получателя ренты (паспорт / ИНН/ОГРН).
        2. Тип Получателя (гражданин / НКО / коммерческая организация).
        3. Кто подписывает от Получателя и на каком основании.
        4. Наименование и реквизиты Плательщика ренты.
        5. Тип Плательщика.
        6. Кто подписывает от Плательщика и на каком основании.
        7. Подтверждение дееспособности получателя ренты.
        8. Вид ренты (постоянная / пожизненная / ДПСИ) — только для целей проверки
           допустимости получателя.
        9. Соответствие типа получателя виду ренты по императивным правилам:
           - постоянная рента: граждане и НКО (коммерческие организации — нельзя);
           - пожизненная рента: только граждане;
           - ДПСИ: только граждане.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты — Иванова Мария Ивановна, 15.05.1948 г.р.,
        паспорт серия 45 00 № 123456, г. Москва, ул. Ленина, д. 5, кв. 12.
        Плательщик ренты — Петров Иван Сергеевич, паспорт серия 45 01 № 654321.
        Нотариус разъяснил Иванова М.И. правовые последствия заключаемого договора,
        дееспособность проверена. Стороны заключили договор пожизненной ренты."

        Ответ:
        {
          "receiver_details_status": "defined",
          "receiver_details_value": "Иванова Мария Ивановна, 15.05.1948, паспорт серия 45 00 № 123456",
          "receiver_type": "individual",
          "receiver_signatory": "Иванова М.И.",
          "receiver_signatory_basis": "personal",
          "payer_details_status": "defined",
          "payer_details_value": "Петров Иван Сергеевич, паспорт серия 45 01 № 654321",
          "payer_type": "individual",
          "payer_signatory": "Петров И.С.",
          "payer_signatory_basis": "personal",
          "capacity_confirmed_status": "defined",
          "capacity_confirmed_details": "нотариус разъяснил правовые последствия, дееспособность проверена",
          "receiver_rent_type_for_eligibility": "life_annuity",
          "receiver_eligibility_status": "eligible",
          "receiver_eligibility_details": "получатель — гражданин, что соответствует императивному требованию ст. 596 п. 1 ГК РФ для пожизненной ренты",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Нотариус разъяснил Иванова М.И. правовые последствия заключаемого договора, дееспособность проверена."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Получатель ренты — ООО «Ромашка». Плательщик ренты — Петров И.С.
        Стороны заключили договор пожизненной ренты."

        Ответ:
        {
          "receiver_details_status": "defined",
          "receiver_details_value": "ООО «Ромашка»",
          "receiver_type": "commercial",
          "receiver_signatory": "Данные не определены",
          "receiver_signatory_basis": "not_defined",
          "payer_details_status": "defined",
          "payer_details_value": "Петров И.С.",
          "payer_type": "individual",
          "payer_signatory": "Данные не определены",
          "payer_signatory_basis": "not_defined",
          "capacity_confirmed_status": "not_defined",
          "capacity_confirmed_details": "Данные не определены",
          "receiver_rent_type_for_eligibility": "life_annuity",
          "receiver_eligibility_status": "ineligible",
          "receiver_eligibility_details": "получатель — коммерческая организация, что не соответствует императивному требованию ст. 596 п. 1 ГК РФ для пожизненной ренты",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Получатель ренты — ООО «Ромашка». Стороны заключили договор пожизненной ренты."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Настоящий договор заключён между получателем ренты и плательщиком ренты."

        Ответ:
        {
          "receiver_details_status": "not_defined",
          "receiver_details_value": "Данные не определены",
          "receiver_type": "not_defined",
          "receiver_signatory": "Данные не определены",
          "receiver_signatory_basis": "not_defined",
          "payer_details_status": "not_defined",
          "payer_details_value": "Данные не определены",
          "payer_type": "not_defined",
          "payer_signatory": "Данные не определены",
          "payer_signatory_basis": "not_defined",
          "capacity_confirmed_status": "not_defined",
          "capacity_confirmed_details": "Данные не определены",
          "receiver_rent_type_for_eligibility": "not_defined",
          "receiver_eligibility_status": "not_defined",
          "receiver_eligibility_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с паспортными данными или ИНН/ОГРН Получателя?
        2. Явно ли указан тип Получателя (гражданин / НКО / ЮЛ)?
        3. Есть ли прямая цитата с данными Плательщика?
        4. Указан ли подписант и документ-основание?
        5. Упомянуто ли подтверждение дееспособности?
        6. Назван ли вид ренты (постоянная / пожизненная / ДПСИ)?
        7. Соответствует ли тип получателя виду ренты по императивным правилам?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "receiver_details_status": "<defined / not_defined>",
          "receiver_details_value": "<реквизиты или 'Данные не определены'>",
          "receiver_type": "<individual / nco / commercial / not_defined>",
          "receiver_signatory": "<ФИО или 'Данные не определены'>",
          "receiver_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "payer_details_status": "<defined / not_defined>",
          "payer_details_value": "<реквизиты или 'Данные не определены'>",
          "payer_type": "<individual / legal_entity / not_defined>",
          "payer_signatory": "<ФИО или 'Данные не определены'>",
          "payer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "capacity_confirmed_status": "<defined / not_defined>",
          "capacity_confirmed_details": "<текст или 'Данные не определены'>",
          "receiver_rent_type_for_eligibility": "<permanent / life_annuity / lifetime_maintenance / not_defined>",
          "receiver_eligibility_status": "<eligible / ineligible / not_defined>",
          "receiver_eligibility_details": "<обоснование или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "получатель ренты плательщик ренты именуем в лице действующего на основании ИНН ОГРН ОГРНИП паспорт дата рождения пенсионер гражданин физическое лицо ООО АО некоммерческая организация дееспособен нотариус разъяснил постоянная рента пожизненная рента содержание с иждивением"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "кадастровый номер"
        - "ЕГРН"
        - "залог в силу закона"
        - "размер ренты"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "обременение рентой"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "parties_identification_and_capacity_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты данные о сторонах:
        реквизиты, тип, подписанты, основания полномочий, подтверждение дееспособности
        и допустимость получателя для вида ренты.
        Не анализируй имущество, размер ренты, нотариальную форму, выкуп или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_and_capacity_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (receiver_details_status, payer_details_status,
              receiver_signatory_basis, payer_signatory_basis,
              capacity_confirmed_status, receiver_eligibility_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - receiver_details_status = "not_defined";
           - payer_details_status = "not_defined";
           - receiver_signatory_basis = "not_defined";
           - payer_signatory_basis = "not_defined";
           - capacity_confirmed_status = "not_defined";
           - receiver_eligibility_status = "not_defined";
           - receiver_type = "not_defined";
           - payer_type = "not_defined";
           - receiver_rent_type_for_eligibility = "not_defined";
           - receiver_details_value, payer_details_value = "Данные не определены";
           - receiver_signatory, payer_signatory = "Данные не определены";
           - capacity_confirmed_details, receiver_eligibility_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. receiver_details_status — "defined" если получатель ренты прямо идентифицирован, иначе "not_defined".
        2. receiver_details_value — реквизиты получателя ренты.
        3. receiver_type — "individual" / "nco" / "commercial" / "not_defined".
        4. receiver_signatory — подписант от получателя ренты.
        5. receiver_signatory_basis — "charter" / "poa" / "order" / "personal" / "other" / "not_defined".
        6. payer_details_status — "defined" если плательщик ренты прямо идентифицирован, иначе "not_defined".
        7. payer_details_value — реквизиты плательщика ренты.
        8. payer_type — "individual" / "legal_entity" / "not_defined".
        9. payer_signatory — подписант от плательщика ренты.
        10. payer_signatory_basis — "charter" / "poa" / "order" / "personal" / "other" / "not_defined".
        11. capacity_confirmed_status — "defined" если подтверждение дееспособности прямо указано, иначе "not_defined".
        12. capacity_confirmed_details — текст о проверке дееспособности или разъяснениях нотариуса.
        13. receiver_rent_type_for_eligibility — вид ренты для целей проверки допустимости:
            - "permanent" — постоянная рента;
            - "life_annuity" — пожизненная рента;
            - "lifetime_maintenance" — пожизненное содержание с иждивением (ДПСИ);
            - "not_defined" — вид ренты прямо не назван.
        14. receiver_eligibility_status — вывод о соответствии типа получателя виду ренты:
            - "eligible" — тип получателя соответствует виду ренты;
            - "ineligible" — тип получателя не соответствует виду ренты;
            - "not_defined" — недостаточно данных для вывода.
        15. receiver_eligibility_details — краткое обоснование вывода на русском языке.

        Правила соответствия (для п.14):
        - permanent × individual → eligible;
        - permanent × nco → eligible;
        - permanent × commercial → ineligible;
        - life_annuity × individual → eligible;
        - life_annuity × nco / commercial → ineligible;
        - lifetime_maintenance × individual → eligible;
        - lifetime_maintenance × nco / commercial → ineligible.

        Если receiver_type = "not_defined" или
        receiver_rent_type_for_eligibility = "not_defined" — receiver_eligibility_status = "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно привязать к стороне:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_and_capacity_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status / *_basis = "not_defined", *_type = "not_defined", receiver_rent_type_for_eligibility = "not_defined", все *_value / *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй данные из нотариальной формы, если они не относятся к сторонам.
        - Не смешивай сведения о получателе и плательщике ренты.
        - receiver_eligibility_status = "eligible" только если тип получателя прямо соответствует виду ренты по императивному правилу.
        - receiver_eligibility_status = "ineligible" только если тип получателя прямо не соответствует виду ренты.
        - Если хотя бы один из компонентов (receiver_type, receiver_rent_type_for_eligibility) = "not_defined" — receiver_eligibility_status = "not_defined".
        - Не делай иных выводов о допустимости получателя по закону, кроме соответствия виду ренты.
        - Если данные противоречивы или их нельзя надёжно привязать к стороне — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их реквизитов, ни подписантов,
           ни вида ренты.
           → presence = "missing";
             все содержательные *_status / *_basis = "not_defined";
             *_type = "not_defined";
             receiver_rent_type_for_eligibility = "not_defined";
             все *_value / *_details = "Данные не определены".

        2. Только роли без идентификации.
           Стороны названы только как "Получатель ренты" / "Плательщик ренты"
           без реквизитов, ФИО, ИНН, ОГРН.
           → presence = "present";
             соответствующий *_details_status = "not_defined";
             *_details_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные ФИО, паспорта или ИНН
           для одной и той же стороны, либо разные виды ренты,
           конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_details_status = "not_defined";
             receiver_eligibility_status = "not_defined";
             соответствующие *_value / *_details = "Не удалось определить".

        4. Отсутствие подтверждения дееспособности (специфика ренты).
           Получатель — гражданин, но в тексте нет ни фразы о разъяснении
           нотариусом последствий, ни фразы о проверке дееспособности.
           → presence = "present" (если хотя бы один другой содержательный статус = "defined");
             capacity_confirmed_status = "not_defined";
             capacity_confirmed_details = "Данные не определены".

        5. Коммерческая организация как получатель пожизненной ренты или ДПСИ
           (специфика ст. 596 п. 1, ст. 601 ГК РФ).
           Получателем указана коммерческая организация, вид ренты —
           пожизненная рента или ДПСИ.
           → presence = "present";
             receiver_type = "commercial";
             receiver_rent_type_for_eligibility = "life_annuity" / "lifetime_maintenance";
             receiver_eligibility_status = "ineligible";
             receiver_eligibility_details содержит обоснование со ссылкой
             на императивную норму ГК РФ.

        6. Вид ренты не указан.
           Получатель идентифицирован, но вид ренты прямо не назван.
           → presence = "present";
             receiver_rent_type_for_eligibility = "not_defined";
             receiver_eligibility_status = "not_defined";
             receiver_eligibility_details = "Вид ренты в тексте не указан".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_and_capacity_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для receiver_type используй только: "individual", "nco", "commercial", "not_defined".
        - Для payer_type используй только: "individual", "legal_entity", "not_defined".
        - Для *_signatory_basis используй только: "charter", "poa", "order", "personal", "other", "not_defined".
        - Для receiver_rent_type_for_eligibility используй только: "permanent", "life_annuity", "lifetime_maintenance", "not_defined".
        - Для receiver_eligibility_status используй только: "eligible", "ineligible", "not_defined".
        - Fallback при отсутствии данных: все *_value / *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_value / *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_identification_and_capacity_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / полномочий / дееспособности / допустимости получателя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "receiver_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "receiver_details_value"
          type: "string"
          presentation: "fact"
          label: "Получатель ренты: реквизиты"
          description: >
            Наименование и реквизиты получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "receiver_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["individual", "nco", "commercial", "not_defined"]
          description: "Тип получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "receiver_signatory"
          type: "string"
          presentation: "fact"
          label: "Получатель ренты: подписант"
          description: >
            Подписант от получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "receiver_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта получателя ренты. Внутреннее enum-поле."
          required: true
        - name: "payer_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации плательщика ренты. Внутреннее enum-поле."
          required: true
        - name: "payer_details_value"
          type: "string"
          presentation: "fact"
          label: "Плательщик ренты: реквизиты"
          description: >
            Наименование и реквизиты плательщика ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "payer_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["individual", "legal_entity", "not_defined"]
          description: "Тип плательщика ренты. Внутреннее enum-поле."
          required: true
        - name: "payer_signatory"
          type: "string"
          presentation: "fact"
          label: "Плательщик ренты: подписант"
          description: >
            Подписант от плательщика ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "payer_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта плательщика ренты. Внутреннее enum-поле."
          required: true
        - name: "capacity_confirmed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия подтверждения дееспособности. Внутреннее enum-поле."
          required: true
        - name: "capacity_confirmed_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение дееспособности"
          description: >
            Текст о проверке дееспособности получателя ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "receiver_rent_type_for_eligibility"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["permanent", "life_annuity", "lifetime_maintenance", "not_defined"]
          description: "Вид ренты, определённый для целей проверки допустимости получателя. Внутреннее enum-поле."
          required: true
        - name: "receiver_eligibility_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["eligible", "ineligible", "not_defined"]
          description: "Вывод о соответствии типа получателя виду ренты. Внутреннее enum-поле."
          required: true
        - name: "receiver_eligibility_details"
          type: "string"
          presentation: "fact"
          label: "Допустимость получателя"
          description: >
            Краткое обоснование соответствия типа получателя виду ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: rent_type_and_core_terms_extraction
    name: "Вид ренты и ключевые условия договора (ст. 583, 589, 596, 601 ГК РФ)"
    description: >
      Фактографическая проверка вида ренты, описания передаваемого имущества,
      формы рентного предоставления, периодичности и характера передачи имущества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "пожизненное содержание с иждивением"
        - "получатель ренты"
        - "плательщик ренты"
        - "передает имущество"
        - "рентные платежи"
        - "содержание с иждивением"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)постоянн(ая|ой)\\s+рент"
        - "(?i)пожизненн(ая|ой)\\s+рент"
        - "(?i)пожизненн(ое|ого)\\s+содержани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 583-605).
        Проверяется только один вопрос: вид ренты, описание имущества,
        форма предоставления, периодичность и характер передачи.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид ренты (постоянная / пожизненная / ДПСИ).
        2. Явно ли указан вид ренты или следует из контекста.
        3. Описание передаваемого имущества.
        4. Вид имущества (недвижимое / движимое / смешанное).
        5. Форма рентного предоставления (деньги / натуральное / смешанное).
        6. Периодичность выплат/содержания.
        7. Характер передачи имущества (за плату / бесплатно).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты передаёт в собственность Плательщика ренты квартиру,
        расположенную по адресу г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый
        номер 77:06:0001001:123. Плательщик ренты обязуется пожизненно выплачивать
        Получателю ренту в размере 30 000 рублей ежемесячно. Передача квартиры
        осуществляется безвозмездно."

        Ответ:
        {
          "rent_type_status": "defined",
          "rent_type_code": "life_annuity",
          "rent_type_explicitly_stated": "implied",
          "property_description_status": "defined",
          "property_description_value": "квартира, г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123",
          "property_kind": "real_estate",
          "payment_form_status": "defined",
          "payment_form_code": "money",
          "payment_periodicity_status": "defined",
          "payment_periodicity_code": "monthly",
          "transfer_character_status": "defined",
          "transfer_character_code": "free",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Плательщик ренты обязуется пожизненно выплачивать Получателю ренту в размере 30 000 рублей ежемесячно."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор ренты."

        Ответ:
        {
          "rent_type_status": "not_defined",
          "rent_type_code": "not_defined",
          "rent_type_explicitly_stated": "not_defined",
          "property_description_status": "not_defined",
          "property_description_value": "Данные не определены",
          "property_kind": "not_defined",
          "payment_form_status": "not_defined",
          "payment_form_code": "not_defined",
          "payment_periodicity_status": "not_defined",
          "payment_periodicity_code": "not_defined",
          "transfer_character_status": "not_defined",
          "transfer_character_code": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написан ли вид ренты прямо ("пожизненная рента", "постоянная рента")?
        2. Описано ли имущество с достаточной конкретностью?
        3. Указана ли периодичность выплат?
        4. Написано ли "бесплатно/безвозмездно" или "за плату" прямо?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "rent_type_status": "<defined / not_defined>",
          "rent_type_code": "<permanent / life_annuity / lifetime_maintenance / mixed / not_defined>",
          "rent_type_explicitly_stated": "<yes / implied / not_defined>",
          "property_description_status": "<defined / not_defined>",
          "property_description_value": "<описание или 'Данные не определены'>",
          "property_kind": "<real_estate / movable / mixed / not_defined>",
          "payment_form_status": "<defined / not_defined>",
          "payment_form_code": "<money / in_kind / mixed / not_defined>",
          "payment_periodicity_status": "<defined / not_defined>",
          "payment_periodicity_code": "<monthly / quarterly / yearly / custom / not_defined>",
          "transfer_character_status": "<defined / not_defined>",
          "transfer_character_code": "<paid / free / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "постоянная рента пожизненная рента пожизненное содержание с иждивением получатель ренты плательщик ренты передает имущество рентные платежи содержание с иждивением передача имущества за плату бесплатно безвозмездно ежемесячно ежеквартально ежегодно"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "нотариальное удостоверение"
        - "реестровый номер"
        - "кадастровый номер"
        - "ЕГРН"
        - "залог в силу закона"
        - "обременение рентой"
        - "размер ренты 30000 рублей"
        - "прожиточный минимум"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.18
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "rent_type_and_core_terms_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты вид ренты,
        описание передаваемого имущества, форму рентного предоставления,
        периодичность и характер передачи имущества.
        Не анализируй нотариальную форму, выкуп, страхование или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rent_type_and_core_terms_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rent_type_status, property_description_status,
              payment_form_status, payment_periodicity_status,
              transfer_character_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rent_type_status = "not_defined";
           - rent_type_code = "not_defined";
           - rent_type_explicitly_stated = "not_defined";
           - property_description_status = "not_defined";
           - property_kind = "not_defined";
           - payment_form_status = "not_defined";
           - payment_form_code = "not_defined";
           - payment_periodicity_status = "not_defined";
           - payment_periodicity_code = "not_defined";
           - transfer_character_status = "not_defined";
           - transfer_character_code = "not_defined";
           - property_description_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. rent_type_status — "defined" если вид ренты определён, иначе "not_defined".
        2. rent_type_code — "permanent" / "life_annuity" / "lifetime_maintenance" / "mixed" / "not_defined".
        3. rent_type_explicitly_stated — "yes" / "implied" / "not_defined".
        4. property_description_status — "defined" если имущество описано, иначе "not_defined".
        5. property_description_value — описание передаваемого имущества.
        6. property_kind — "real_estate" / "movable" / "mixed" / "not_defined".
        7. payment_form_status — "defined" если форма рентного предоставления указана, иначе "not_defined".
        8. payment_form_code — "money" / "in_kind" / "mixed" / "not_defined".
        9. payment_periodicity_status — "defined" если периодичность указана, иначе "not_defined".
        10. payment_periodicity_code — "monthly" / "quarterly" / "yearly" / "custom" / "not_defined".
        11. transfer_character_status — "defined" если имущество передаётся за плату или бесплатно, иначе "not_defined".
        12. transfer_character_code — "paid" / "free" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни rent_type_and_core_terms_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_code = "not_defined", property_description_value = "Данные не определены".
        - Используй только текст договора.
        - permanent = постоянная рента.
        - life_annuity = пожизненная рента.
        - lifetime_maintenance = пожизненное содержание с иждивением (ДПСИ).
        - rent_type_explicitly_stated = "yes" если вид ренты прямо назван в тексте; "implied" если следует из содержания обязательств без прямого наименования.
        - real_estate = недвижимое имущество (квартира, дом, земельный участок и т.п.).
        - movable = движимое имущество (автомобиль, ценные бумаги и т.п.).
        - paid = имущество передаётся за деньги или иное встречное предоставление.
        - free = имущество передаётся безвозмездно / бесплатно.
        - Не анализируй выкуп, неустойку и снятие обременения.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида ренты, ни имущества, ни формы предоставления,
           ни периодичности, ни характера передачи.
           → presence = "missing";
             все *_status = "not_defined";
             все *_code = "not_defined";
             property_description_value = "Данные не определены".

        2. Вид ренты назван, но ключевые условия не раскрыты.
           Например: "Стороны заключили договор пожизненной ренты" без указания
           имущества, размера и периодичности.
           → presence = "present";
             rent_type_status = "defined"; rent_type_code = "life_annuity";
             остальные *_status = "not_defined";
             property_description_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды ренты или разные
           характеристики имущества, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_code = "not_defined";
             property_description_value = "Не удалось определить".

        4. Алеаторная специфика ренты.
           Имущество передаётся по договору ренты, но прямо указано,
           что передача осуществляется за плату (встречное предоставление),
           что характерно для притворной сделки.
           → presence = "present";
             transfer_character_status = "defined";
             transfer_character_code = "paid".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rent_type_and_core_terms_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для rent_type_code используй только: "permanent", "life_annuity", "lifetime_maintenance", "mixed", "not_defined".
        - Для rent_type_explicitly_stated используй только: "yes", "implied", "not_defined".
        - Для property_kind используй только: "real_estate", "movable", "mixed", "not_defined".
        - Для payment_form_code используй только: "money", "in_kind", "mixed", "not_defined".
        - Для payment_periodicity_code используй только: "monthly", "quarterly", "yearly", "custom", "not_defined".
        - Для transfer_character_code используй только: "paid", "free", "not_defined".
        - Fallback при отсутствии данных: property_description_value = "Данные не определены".
        - Fallback при противоречии или неоднозначности: property_description_value = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "rent_type_and_core_terms_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по виду ренты и ключевым условиям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rent_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида ренты. Внутреннее enum-поле."
          required: true
        - name: "rent_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["permanent", "life_annuity", "lifetime_maintenance", "mixed", "not_defined"]
          description: "Вид договора ренты. Внутреннее enum-поле."
          required: true
        - name: "rent_type_explicitly_stated"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "implied", "not_defined"]
          description: "Прямо ли назван вид ренты в тексте. Внутреннее enum-поле."
          required: true
        - name: "property_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания имущества, передаваемого под выплату ренты. Внутреннее enum-поле."
          required: true
        - name: "property_description_value"
          type: "string"
          presentation: "fact"
          label: "Передаваемое имущество"
          description: >
            Описание имущества, передаваемого плательщику ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "property_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["real_estate", "movable", "mixed", "not_defined"]
          description: "Категория передаваемого имущества. Внутреннее enum-поле."
          required: true
        - name: "payment_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения формы рентного предоставления. Внутреннее enum-поле."
          required: true
        - name: "payment_form_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["money", "in_kind", "mixed", "not_defined"]
          description: "Форма рентного предоставления. Внутреннее enum-поле."
          required: true
        - name: "payment_periodicity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности выплат или содержания. Внутреннее enum-поле."
          required: true
        - name: "payment_periodicity_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["monthly", "quarterly", "yearly", "custom", "not_defined"]
          description: "Периодичность рентных платежей или содержания. Внутреннее enum-поле."
          required: true
        - name: "transfer_character_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения характера передачи имущества. Внутреннее enum-поле."
          required: true
        - name: "transfer_character_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["paid", "free", "not_defined"]
          description: "Передача имущества за плату или бесплатно. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: notarization_check
    name: "Нотариальная форма договора ренты (ст. 584 ГК РФ)"
    description: >
      Фактографическая проверка наличия нотариального удостоверения — обязательного
      требования под страхом ничтожности (ст. 584 ГК РФ).
    triggers: {}
    ui_mode: "clause_presence"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "удостоверено нотариусом"
        - "нотариус"
        - "реестровый номер"
        - "совершено в нотариальной форме"
        - "нотариальная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ое|ой)\\s+удостоверен"
        - "(?i)удостоверен[ао]?\\s+нотариусом"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 584 ГК РФ).
        Проверяется только один вопрос: нотариальная форма договора.

        ВАЖНО:
        - Договор ренты обязателен к нотариальному удостоверению (ст. 584 ГК РФ).
        - При отсутствии нотариальной формы — договор НИЧТОЖЕН.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание нотариального удостоверения.
        2. Данные нотариуса (ФИО, нотариальный округ).
        3. Дату удостоверения.
        4. Реестровый номер нотариального действия.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — нотариальная форма подтверждена:
        Фрагмент:
        "Удостоверено нотариусом Ивановой А.А., нотариальный округ г. Москвы.
        Реестровый номер 77/100-н/77-2026-1-123. Дата: 15.03.2026."

        Ответ:
        {
          "notarization_status": "defined",
          "notarization_level": "clearly_notarial",
          "notary_details_status": "defined",
          "notary_details_value": "Иванова А.А., нотариальный округ г. Москвы",
          "notary_date_status": "defined",
          "notary_date_value": "15.03.2026",
          "registry_number_status": "defined",
          "registry_number_value": "77/100-н/77-2026-1-123",
          "nullity_risk": "low",
          "evidence": [
            {
              "clause_ref": "удостоверительная надпись",
              "quote": "Удостоверено нотариусом Ивановой А.А., нотариальный округ г. Москвы. Реестровый номер 77/100-н/77-2026-1-123."
            }
          ]
        }

        Пример 2 — нотариальная форма не подтверждена:
        Фрагмент:
        "Настоящий договор подписан сторонами."

        Ответ:
        {
          "notarization_status": "not_defined",
          "notarization_level": "not_defined",
          "notary_details_status": "not_defined",
          "notary_details_value": "Данные не определены",
          "notary_date_status": "not_defined",
          "notary_date_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "nullity_risk": "critical",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слова "удостоверено нотариусом" или аналогичные?
        2. Указаны ли ФИО нотариуса?
        3. Есть ли реестровый номер?
        4. Если ничего нет — nullity_risk = "critical".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "notarization_status": "<defined / not_defined>",
          "notarization_level": "<clearly_notarial / mentioned / not_defined>",
          "notary_details_status": "<defined / not_defined>",
          "notary_details_value": "<ФИО нотариуса или 'Данные не определены'>",
          "notary_date_status": "<defined / not_defined>",
          "notary_date_value": "<дата или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number_value": "<номер или 'Данные не определены'>",
          "nullity_risk": "<critical / low>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нотариальное удостоверение удостоверено нотариусом нотариус реестровый номер совершено в нотариальной форме нотариальная форма ст. 584 ГК РФ нотариальный округ"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "пожизненная рента"
        - "размер ренты"
        - "залог в силу закона"
        - "выкуп ренты"
        - "расторжение"
        - "обременение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "notarization_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты сведения
        о нотариальном удостоверении: факт нотариальной формы, нотариус,
        дата удостоверения и реестровый номер.
        Не анализируй ничтожность, стороны, имущество, выкуп или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. notarization_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (notarization_status, notarization_level,
              notary_details_status, notary_date_status,
              registry_number_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notarization_status = "not_defined";
           - notarization_level = "not_defined";
           - notary_details_status = "not_defined";
           - notary_date_status = "not_defined";
           - registry_number_status = "not_defined";
           - notary_details_value, notary_date_value, registry_number_value = "Данные не определены";
           - nullity_risk = "critical";
           - не выполняй остальные шаги.

        1. notarization_status — "defined" если нотариальная форма прямо подтверждена, иначе "not_defined".
        2. notarization_level — "clearly_notarial" / "mentioned" / "not_defined".
        3. notary_details_status — "defined" если данные нотариуса указаны, иначе "not_defined".
        4. notary_details_value — ФИО нотариуса и/или нотариальный округ.
        5. notary_date_status — "defined" если дата удостоверения указана, иначе "not_defined".
        6. notary_date_value — дата удостоверения.
        7. registry_number_status — "defined" если реестровый номер указан, иначе "not_defined".
        8. registry_number_value — реестровый номер нотариального действия.
        9. nullity_risk — "low" если нотариальная форма подтверждена, "critical" если не найдена.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни notarization_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status / notarization_level = "not_defined", все *_value = "Данные не определены", nullity_risk = "critical".
        - Используй только текст договора.
        - clearly_notarial = есть слова "удостоверено нотариусом" или аналогичные с реквизитами нотариуса.
        - mentioned = нотариус упомянут в тексте, но без полного подтверждения.
        - not_defined = никаких признаков нотариального удостоверения.
        - nullity_risk = "low" если notarization_status = "defined"; "critical" если "not_defined".
        - Не выводи правовой вывод о ничтожности.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни слова "нотариус", ни "нотариальное удостоверение",
           ни реестрового номера.
           → presence = "missing";
             все *_status / notarization_level = "not_defined";
             все *_value = "Данные не определены";
             nullity_risk = "critical".

        2. Неполное раскрытие.
           Слово "нотариус" или "нотариальное удостоверение" упомянуто,
           но без ФИО нотариуса, даты или реестрового номера.
           → presence = "present";
             notarization_status = "defined"; notarization_level = "mentioned";
             notary_details_status / notary_date_status / registry_number_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные нотариусы, даты или
           реестровые номера, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             notarization_status = "not_defined"; notarization_level = "not_defined";
             соответствующие *_value = "Не удалось определить".

        4. Нотариальная форма требуется, но не подтверждена.
           В тексте прямо сказано "договор подлежит нотариальному удостоверению"
           или "подлежит удостоверению нотариусом", но самого удостоверения
           (подписи нотариуса, реестрового номера) в тексте нет.
           → presence = "present";
             notarization_status = "not_defined";
             notarization_level = "mentioned";
             nullity_risk = "critical".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notarization_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для notarization_level используй только: "clearly_notarial", "mentioned", "not_defined".
        - Для nullity_risk используй только: "low" или "critical".
        - Fallback при отсутствии данных: все *_value = "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_value = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notarization_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие нотариального удостоверения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notarization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения нотариальной формы договора ренты. Внутреннее enum-поле."
          required: true
        - name: "notarization_level"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["clearly_notarial", "mentioned", "not_defined"]
          description: "Уровень подтверждения нотариального удостоверения. Внутреннее enum-поле."
          required: true
        - name: "notary_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия реквизитов нотариуса. Внутреннее enum-поле."
          required: true
        - name: "notary_details_value"
          type: "string"
          presentation: "fact"
          label: "Нотариус"
          description: >
            ФИО нотариуса и/или нотариальный округ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notary_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия даты нотариального удостоверения. Внутреннее enum-поле."
          required: true
        - name: "notary_date_value"
          type: "string"
          presentation: "fact"
          label: "Дата нотариального удостоверения"
          description: >
            Дата нотариального удостоверения договора ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "registry_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия реестрового номера нотариального действия. Внутреннее enum-поле."
          required: true
        - name: "registry_number_value"
          type: "string"
          presentation: "fact"
          label: "Реестровый номер"
          description: >
            Реестровый номер нотариального действия. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "nullity_risk"
          type: "string"
          presentation: "diagnostic"
          allowed_values: ["critical", "low"]
          description: "Машинный маркер риска ничтожности из-за отсутствия нотариальной формы."
          required: false
      store_payload: true

  - id: property_identification_check
    name: "Идентификация имущества, передаваемого под выплату ренты"
    description: >
      Фактографическая проверка описания и идентификации имущества,
      передаваемого под выплату ренты, включая кадастровый номер
      для недвижимости.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "имущество"
        - "передаваемое под выплату ренты"
        - "передает в собственность"
        - "квартира"
        - "жилой дом"
        - "земельный участок"
        - "кадастровый номер"
        - "ЕГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переда[её]т\\s+в\\s+собственность"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты.
        Проверяется только один вопрос: идентификация имущества,
        передаваемого под выплату ренты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описание имущества.
        2. Вид имущества.
        3. Кадастровый номер, если это недвижимость.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        4. В evidence — только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты передаёт в собственность плательщика ренты квартиру,
        расположенную по адресу: г. Москва, ул. Ленина, д. 5, кв. 12,
        кадастровый номер 77:06:0001001:123, общей площадью 45 кв.м."

        Ответ:
        {
          "property_identified_status": "defined",
          "property_description": "квартира, г. Москва, ул. Ленина, д. 5, кв. 12, 45 кв.м.",
          "property_kind": "real_estate",
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Получатель ренты передаёт в собственность плательщика ренты квартиру, кадастровый номер 77:06:0001001:123."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор ренты."

        Ответ:
        {
          "property_identified_status": "not_defined",
          "property_description": "Данные не определены",
          "property_kind": "not_defined",
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Описано ли имущество с конкретными признаками (адрес, площадь)?
        2. Кадастровый номер — только если прямо написан.
        3. Движимое или недвижимое — следует из описания.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "property_identified_status": "<defined / not_defined>",
          "property_description": "<описание или 'Данные не определены'>",
          "property_kind": "<real_estate / movable / mixed / not_defined>",
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<номер или 'Данные не определены'>",
          "evidence": [{"clause_ref":"<пункт>", "quote":"<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "имущество передаваемое под выплату ренты передает в собственность квартира жилой дом земельный участок кадастровый номер ЕГРН автомобиль имущество под ренту описание имущества"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "содержание с иждивением"
        - "ежемесячно"
        - "размер ренты"
        - "прожиточный минимум"
        - "индексация"
        - "залог в силу закона"
        - "обременение рентой"
        - "выкуп ренты"
        - "расторжение"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "property_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты описание имущества,
        передаваемого плательщику ренты, и его идентификаторы.
        Не анализируй залог в силу закона, обеспечение, размер ренты или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. property_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (property_identified_status, property_kind,
              cadastral_number_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - property_identified_status = "not_defined";
           - property_kind = "not_defined";
           - cadastral_number_status = "not_defined";
           - property_description = "Данные не определены";
           - cadastral_number_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. property_identified_status — "defined" если имущество прямо идентифицировано (адрес, вид, площадь или иные признаки), иначе "not_defined".
        2. property_description — конкретное описание имущества, передаваемого плательщику ренты.
        3. property_kind — "real_estate" если недвижимость / "movable" если движимое / "mixed" если оба типа / "not_defined".
        4. cadastral_number_status — "defined" если кадастровый номер прямо написан, иначе "not_defined".
        5. cadastral_number_value — кадастровый номер в формате NN:NN:NNNNNNN:N.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"

        Если данные противоречивы, неоднозначны или их нельзя надёжно определить:
        - статус = "not_defined"
        - текстовое поле = "Не удалось определить"
        </task>

        <context_rules>
        - Перед остальными полями заполни property_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status = "not_defined", property_kind = "not_defined", все *_value = "Данные не определены".
        - Только текст договора.
        - Кадастровый номер — только если прямо написан в формате NN:NN:NNNNNNN:N.
        - real_estate = квартира, дом, земельный участок, нежилое помещение и т.п.
        - movable = автомобиль, ценные бумаги, иное движимое имущество.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если данные противоречивы — статус = "not_defined", текстовое поле = "Не удалось определить".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания имущества, ни его вида,
           ни кадастрового номера.
           → presence = "missing";
             все *_status = "not_defined";
             property_kind = "not_defined";
             property_description, cadastral_number_value = "Данные не определены".

        2. Неполное раскрытие темы.
           Указан только вид имущества ("квартира") без адреса, площади,
           кадастрового номера и иных идентифицирующих признаков.
           → presence = "present";
             property_identified_status = "not_defined";
             property_kind = "real_estate";
             property_description = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные адреса, кадастровые номера
           или виды имущества, конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             property_identified_status = "not_defined";
             property_description = "Не удалось определить".

        4. Отсылка на внешний документ.
           Имущество описано через ссылку на выписку ЕГРН, приложение,
           технический паспорт и т.п. без самостоятельного описания.
           → presence = "present";
             property_identified_status = "defined";
             property_description содержит формулировку вида
             "Согласно выписке ЕГРН (Приложение №1)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для property_identification_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для property_kind используй только: "real_estate", "movable", "mixed", "not_defined".
        - Fallback при отсутствии данных: property_description, cadastral_number_value = "Данные не определены".
        - Fallback при противоречии или неоднозначности: property_description = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "property_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие описания и идентификации имущества под ренту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "property_identified_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации имущества, передаваемого под выплату ренты. Внутреннее enum-поле."
          required: true
        - name: "property_description"
          type: "string"
          presentation: "fact"
          label: "Имущество под ренту"
          description: >
            Описание имущества, передаваемого плательщику ренты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "property_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["real_estate", "movable", "mixed", "not_defined"]
          description: "Категория передаваемого имущества. Внутреннее enum-поле."
          required: true
        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия кадастрового номера. Внутреннее enum-поле."
          required: true
        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер"
          description: >
            Кадастровый номер передаваемого объекта недвижимости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: rent_security_and_statutory_pledge_check
    name: "Залог в силу закона, обременение рентой и обеспечение выплат"
    description: >
      Фактографическая проверка наличия залога в силу закона для недвижимости,
      регистрации обременения рентой и обеспечения выплат по движимому имуществу.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "залог в силу закона"
        - "обременение рентой"
        - "обеспечение выплаты ренты"
        - "поручительство"
        - "банковская гарантия"
        - "страхование ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог\\s+в\\s+силу\\s+закона"
        - "(?i)обременени(е|я)\\s+рент"
        - "(?i)поручительств"
        - "(?i)банковск(ая|ой)\\s+гарант"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (ст. 587 ГК РФ).
        Проверяется только один вопрос: залог в силу закона, регистрация
