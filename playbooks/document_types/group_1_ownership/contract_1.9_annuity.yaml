      - "(?i)\\bжилищ[еа]\\b"
      - "(?i)коммунальн[а-яё]+\\s+услуг[аи]"
      - "(?i)ритуальн[а-яё]+\\s+услуг[аи]"
      - "(?i)продуктов[ыо]й\\s+набор"
      - "(?i)уход\\s+на\\s+дому"

  buyout_mechanism:
    any_keywords:
      - "(?i)выкуп\\s+рент[ыа]"
      - "(?i)выкупн[а-яё]+\\s+цен[аа]"
      - "(?i)прав[оа]\\s+требовать\\s+выкуп[аа]"
      - "(?i)прекращени[ея]\\s+рент[ыа]\\s+пут[её]м\\s+выкуп[аа]"
      - "(?i)уведомлени[ея]\\s+о\\s+выкуп[ее]"

  notarial_form:
    any_keywords:
      - "(?i)нотариальн[а-яё]+\\s+удостоверени[ея]"
      - "(?i)удостоверен[оаы]?\\s+нотариусом"
      - "(?i)\\bнотариус\\b"
      - "(?i)реестров[ыо]й\\s+номер\\s+нотариуса"
      - "(?i)нотариальн[а-яё]+\\s+форм[аа]"

  alienation_restricted:
    any_keywords:
      - "(?i)запрет\\s+отчуждени[яя]"
      - "(?i)без\\s+согласи[яя]\\s+получател[яя]\\s+рент[ыа]"
      - "(?i)запрет\\s+залога"
      - "(?i)запрет\\s+сдач[ии]\\s+в\\s+аренду"
      - "(?i)распоряжени[ея]\\s+только\\s+с\\s+согласием"
      - "(?i)ограничени[ея]\\s+прав[аа]\\s+распоряжени[яя]"
      - "(?i)ст\\.\\s*604"

  paid_property_transfer:
    any_keywords:
      - "(?i)переда[её]тс[яьа]\\s+за\\s+плату"
      - "(?i)передан[оаы]?\\s+за\\s+плату"
      - "(?i)с\\s+оплатой"
      - "(?i)за\\s+деньги\\s+и\\s+под\\s+выплат[ыу]\\s+рент[ыа]"
      - "(?i)правил[аа]\\s+купли-продаж[ии]"

  free_property_transfer:
    any_keywords:
      - "(?i)переда[её]тс[яьа]\\s+бесплатно"
      - "(?i)\\bбезвозмездно\\b"
      - "(?i)без\\s+оплат[ыы]"
      - "(?i)правил[аа]\\s+дарени[яя]"

  successor_payer_risk:
    any_keywords:
      - "(?i)переход\\s+обязательств"
      - "(?i)нов[ыо]й\\s+собственник"
      - "(?i)приобретател[ья]\\s+имуществ[аа]"
      - "(?i)субсидиарн[а-яё]+\\s+ответственност[ьи]"
      - "(?i)солидарн[а-яё]+\\s+ответственност[ьи]"
      - "(?i)правопреемств[оа]\\s+плательщик[аа]"
      - "(?i)отчуждени[ея]\\s+имуществ[аа]\\s+плательщик[оа]м"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  pm_reference: "(?i)(прожиточн(ый|ого)\\s+минимум|ПМ)"
  periodicity: "(?i)(ежемесячно|ежеквартально|ежегодно|каждый\\s+месяц|раз\\s+в\\s+месяц)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, идентификация и дееспособность
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_identification_and_capacity
    name: "Стороны договора ренты: идентификация, полномочия, дееспособность"
    description: >
      Фактографическая проверка наличия в договоре данных о получателе и плательщике
      ренты, их реквизитов, полномочий подписантов и подтверждения дееспособности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "получатель ренты"
        - "плательщик ренты"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
        - "дата рождения"
        - "пенсионер"
        - "гражданин"
        - "физическое лицо"
        - "ООО"
        - "АО"
        - "некоммерческая организация"
        - "дееспособен"
        - "нотариус разъяснил"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(получатель\\s+ренты|плательщик\\s+ренты).*именуем"
        - "{{ inn_ogrn }}"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ренты (гл. 33 ГК РФ, ст. 583-605;
        ст. 432, 182-185 ГК РФ; ст. 589, 596, 601 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов,
        дееспособность, допустимость получателя для данного вида ренты.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Получателя ренты (паспорт / ИНН/ОГРН).
        2. Тип Получателя (гражданин / НКО / коммерческая организация).
        3. Кто подписывает от Получателя и на каком основании.
        4. Наименование и реквизиты Плательщика ренты.
        5. Тип Плательщика.
        6. Кто подписывает от Плательщика и на каком основании.
        7. Подтверждение дееспособности получателя ренты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_defined", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Получатель ренты — Иванова Мария Ивановна, 15.05.1948 г.р.,
        паспорт серия 45 00 № 123456, г. Москва, ул. Ленина, д. 5, кв. 12.
        Плательщик ренты — Петров Иван Сергеевич, паспорт серия 45 01 № 654321.
        Нотариус разъяснил Иванова М.И. правовые последствия заключаемого договора,
        дееспособность проверена."

        Ответ:
        {
          "receiver_details_status": "defined",
          "receiver_details_value": "Иванова Мария Ивановна, 15.05.1948, паспорт серия 45 00 № 123456",
          "receiver_type": "individual",
          "receiver_signatory": "Иванова М.И.",
          "receiver_signatory_basis": "personal",
          "payer_details_status": "defined",
          "payer_details_value": "Петров Иван Сергеевич, паспорт серия 45 01 № 654321",
          "payer_type": "individual",
          "payer_signatory": "Петров И.С.",
          "payer_signatory_basis": "personal",
          "capacity_confirmed_status": "defined",
          "capacity_confirmed_details": "нотариус разъяснил правовые последствия, дееспособность проверена",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Нотариус разъяснил Иванова М.И. правовые последствия заключаемого договора, дееспособность проверена."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между получателем ренты и плательщиком ренты."

        Ответ:
        {
          "receiver_details_status": "not_defined",
          "receiver_details_value": "Данные не определены",
          "receiver_type": "not_defined",
          "receiver_signatory": "Данные не определены",
          "receiver_signatory_basis": "not_defined",
          "payer_details_status": "not_defined",
          "payer_details_value": "Данные не определены",
          "payer_type": "not_defined",
          "payer_signatory": "Данные не определены",
          "payer_signatory_basis": "not_defined",
          "capacity_confirmed_status": "not_defined",
          "capacity_confirmed_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с паспортными данными или ИНН/ОГРН Получателя?
        2. Явно ли указан тип Получателя (гражданин / НКО / ЮЛ)?
        3. Есть ли прямая цитата с данными Плательщика?
        4. Указан ли подписант и документ-основание?
        5. Упомянуто ли подтверждение дееспособности?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "receiver_details_status": "<defined / not_defined>",
          "receiver_details_value": "<реквизиты или 'Данные не определены'>",
          "receiver_type": "<individual / nco / commercial / not_defined>",
          "receiver_signatory": "<ФИО или 'Данные не определены'>",
          "receiver_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "payer_details_status": "<defined / not_defined>",
          "payer_details_value": "<реквизиты или 'Данные не определены'>",
          "payer_type": "<individual / legal_entity / not_defined>",
          "payer_signatory": "<ФИО или 'Данные не определены'>",
          "payer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "capacity_confirmed_status": "<defined / not_defined>",
          "capacity_confirmed_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "получатель ренты плательщик ренты именуем в лице действующего на основании ИНН ОГРН ОГРНИП паспорт дата рождения пенсионер гражданин физическое лицо ООО АО некоммерческая организация дееспособен нотариус разъяснил"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "содержание с иждивением"
        - "кадастровый номер"
        - "ЕГРН"
        - "залог в силу закона"
        - "размер ренты"
        - "индексация"
        - "выкуп ренты"
        - "расторжение"
        - "обременение рентой"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ренты данные о сторонах:
        реквизиты, тип, подписанты, основания полномочий и подтверждение дееспособности.
        Не анализируй имущество, размер ренты, нотариальную форму, выкуп или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. receiver_details_status — "defined" если получатель ренты прямо идентифицирован, иначе "not_defined".
        2. receiver_details_value — реквизиты получателя ренты.
        3. receiver_type — "individual" / "nco" / "commercial" / "not_defined".
        4. receiver_signatory — подписант от получателя ренты.
        5. receiver_signatory_basis — "charter" / "poa" / "order" / "personal" / "other" / "not_defined".
        6. payer_details_status — "defined" если плательщик ренты прямо идентифицирован, иначе "not_defined".
        7. payer_details_value — реквизиты плательщика ренты.
        8. payer_type — "individual" / "legal_entity" / "not_defined".
        9. payer_signatory — подписант от плательщика ренты.
        10. payer_signatory_basis — "charter" / "poa" / "order" / "personal" / "other" / "not_defined".
        11. capacity_confirmed_status — "defined" если подтверждение дееспособности прямо указано, иначе "not_defined".
        12. capacity_confirmed_details — текст о проверке дееспособности или разъяснениях нотариуса.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - Не делай выводов о допустимости получателя по закону.
        - Не подставляй данные из нотариальной формы, если они не относятся к сторонам.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "receiver_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации получателя ренты."
          required: true
        - name: "receiver_details_value"
          type: "string"
          presentation: "fact"
          label: "Получатель ренты: реквизиты"
          description: "Наименование и реквизиты получателя ренты."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "receiver_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["individual", "nco", "commercial", "not_defined"]
          description: "Тип получателя ренты."
          required: true
        - name: "receiver_signatory"
          type: "string"
          presentation: "fact"
          label: "Получатель ренты: подписант"
          description: "Подписант от получателя ренты."
          required: false
          display_in_grid: false
        - name: "receiver_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта получателя ренты."
          required: true
        - name: "payer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации плательщика ренты."
          required: true
        - name: "payer_details_value"
          type: "string"
          presentation: "fact"
          label: "Плательщик ренты: реквизиты"
          description: "Наименование и реквизиты плательщика ренты."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "payer_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["individual", "legal_entity", "not_defined"]
          description: "Тип плательщика ренты."
          required: true
        - name: "payer_signatory"
          type: "string"
          presentation: "fact"
          label: "Плательщик ренты: подписант"
          description: "Подписант от плательщика ренты."
          required: false
          display_in_grid: false
        - name: "payer_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта плательщика ренты."
          required: true
        - name: "capacity_confirmed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия подтверждения дееспособности."
          required: true
        - name: "capacity_confirmed_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение дееспособности"
          description: "Текст о проверке дееспособности получателя ренты."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Вид ренты и базовые условия
  # ──────────────────────────────────────────────────────────────────────────
  - id: rent_type_and_core_terms_extraction
    name: "Вид ренты и ключевые условия договора (ст. 583, 589, 596, 601 ГК РФ)"
    description: >
      Фактографическая проверка вида ренты, описания передаваемого имущества,
      формы рентного предоставления, периодичности и характера передачи имущества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "постоянная рента"
        - "пожизненная рента"
        - "пожизненное содержание с иждивением"
        - "получатель ренты"
        - "плательщик ренты"
        - "передает имущество"
        - "рентные платежи"
        - "содержание с иждивением"
      keyword_mode: "any"
      regex_patterns:
