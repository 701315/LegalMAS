        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В силу ст. 587 ГК РФ Плательщик ренты передаёт Получателю ренты право залога
        на квартиру, переданную под выплату ренты. Обременение рентой подлежит
