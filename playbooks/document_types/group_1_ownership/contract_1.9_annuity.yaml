        - name: "pm_link_details"
          type: "string"
          presentation: "fact"
          label: "Привязка к прожиточному минимуму"
          description: "Текст договора о привязке размера ренты к прожиточному минимуму."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения механизма индексации."
          required: true
        - name: "indexation_mechanism"
          type: "string"
          presentation: "signal"
          allowed_values: ["pm_based", "inflation", "custom", "not_defined"]
          description: "Механизм индексации рентных выплат."
          required: true
        - name: "payment_periodicity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности рентных выплат."
          required: true
        - name: "payment_periodicity_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["monthly", "quarterly", "yearly", "custom", "not_defined"]
          description: "Периодичность рентных выплат."
          required: true
        - name: "late_payment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
