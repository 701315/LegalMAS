      - "(?i)выплачивать\\s+рент[ыу]\\s+деньгами"

  natural_maintenance:
    any_keywords:
      - "(?i)\\bпитани[ея]\\b"
      - "(?i)\\bодежд[аы]\\b"
      - "(?i)\\bлекарств[ао]\\b"
      - "(?i)медицинск[а-яё]+\\s+помощ[ьи]"
