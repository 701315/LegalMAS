        - "(?i)замен(а|ить).*содержан"
        - "(?i)погребени|похорон"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор пожизненного содержания с иждивением (ст. 601-605 ГК РФ).
        Проверяется только один вопрос: объём натурального содержания, ритуальные
        услуги и возможность замены содержания денежными выплатами.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Жильё в составе содержания (предоставляется или нет).
        2. Питание в составе содержания.
        3. Медицинская помощь.
        4. Одежда/обувь/гигиена.
        5. Коммунальные услуги.
        6. Ритуальные услуги (похороны).
        7. Стоимость содержания в рублях.
        8. Возможность замены содержания денежными выплатами (ст. 603 ГК РФ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
