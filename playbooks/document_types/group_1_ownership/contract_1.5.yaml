# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\d{1,3}(?:[.,]\\d{1,2})?\\s*%"
  tariff_value: "(?i)\\d+[.,]?\\d*\\s*(?:руб|₽)?\\s*(?:/кВт|/кВт·ч|/Гкал|/м³|/куб\\.м)"
  meter_reading: "(?i)\\d{1,6}(?:[.,]\\d{1,2})?\\s*(?:кВт·ч|Гкал|м³|куб\\.м)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "social_facility_disconnection_prohibition"
    name: "Запрет отключения социально значимых объектов (Постановление № 354)"
    description: "Запрещается ограничивать или прекращать подачу коммунальных услуг социально значимым объектам (больницы, школы, детсады) в отопительный период"
    legal_base: "Постановление Правительства РФ № 354 от 06.05.2011 (Правила предоставления коммунальных услуг), п. 119"
    required_triggers: ["critical_infrastructure", "heat_supply"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "социально значимый объект"
        - "больница"
        - "школа"
        - "детский сад"
        - "отключение запрещено"
        - "не допускается ограничение"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "социально значимый"
        - "отключение"
        - "запрещено"
      rerank: true

  - id: "sales_surcharge_requirement"
    name: "Обязательность энергосбытовой надбавки (ПП РФ № 1179)"
    description: "Для юридических лиц тариф должен включать энергосбытовую надбавку в соответствии с Постановлением Правительства РФ № 1179"
    legal_base: "Постановление Правительства РФ № 1179 от 29.12.2001 (о ценах и тарифах в области электроэнергетики)"
    required_triggers: ["electricity_supply", "industrial_consumer"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "энергосбытовая надбавка"
        - "тариф на электроэнергию"
        - "одноставочный тариф"
        - "двухставочный тариф"
        - "плата за мощность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "энергосбытовая надбавка"
        - "тариф"
        - "мощность"
      rerank: true

  - id: "two_rate_meter_requirement"
    name: "Обязательность двухтарифных счетчиков для юрлиц (ФЗ-261)"
    description: "Юридические лица обязаны устанавливать приборы учета с функцией учета по зонам суток"
    legal_base: "ФЗ-261 «Об энергосбережении и о повышении энергетической эффективности», ст. 13"
    required_triggers: ["electricity_supply", "industrial_consumer"]
    severity: "medium"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "двухтарифный счетчик"
        - "учет по зонам суток"
        - "дневной тариф"
        - "ночной тариф"
        - "пиковые часы"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "двухтарифный"
        - "зоны суток"
        - "учет"
      rerank: true

  - id: "residential_heat_disconnection_prohibition"
    name: "Запрет полного отключения теплоснабжения жилых зданий в отопительный период"
    description: "Полное прекращение подачи тепловой энергии в жилые помещения в отопительный период запрещено, допускается только частичное ограничение при задолженности"
    legal_base: "ПП РФ № 354 от 06.05.2011, п. 119 (е); ФЗ-190 «О теплоснабжении», ст. 22"
    required_triggers: ["mcd_subscriber", "heat_supply"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "полное прекращение подачи"
        - "отключение отопления"
        - "прекращение теплоснабжения"
        - "прекращение подачи тепловой энергии"
      keyword_mode: "any"
      negative_keywords:
        - "частичное ограничение"
        - "снижение температуры"
    retrieval:
      context_k: 5
      boost_keywords:
        - "отключение отопления"
        - "отопительный период"
        - "жилой дом"
        - "многоквартирный дом"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: energy_quality_requirements_check
    name: "Требования к качеству подаваемой энергии (ст. 542 ГК РФ)"
    description: "Проверяет наличие требований к качеству энергии (напряжение, частота, температура, давление). Без них абонент не сможет доказать нарушение условий."
    triggers:
      any: ["energy_supply_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "качество энергии"
        - "параметры качества"
        - "соответствие ГОСТ"
        - "напряжение"
        - "частота"
        - "температура"
        - "давление"
        - "технические условия"
        - "ГОСТ 32144"
        - "ГОСТ 30491"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)энергия.*должна.*соответствовать.*требованиям.*качества"
        - "(?i)параметры.*качества.*электроэнергии"
        - "(?i)температура.*теплоносителя"
        - "(?i)давление.*газа"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор энергоснабжения.
        Проверь наличие требований к качеству подаваемой энергии (ст. 542 ГК РФ).

        Ответь строго в JSON:
        {
          "quality_requirements": "<detailed / basic / not_found>",
          "voltage_specified": "<yes / no / not_found>",
          "frequency_specified": "<yes / no / not_found>",
          "temperature_specified": "<yes / no / not_found>",
          "pressure_specified": "<yes / no / not_found>",
          "gost_reference": "<ГОСТ или not_found>",
          "quality_snippet": "<цитата из договора или not_found>"
        }

        - "detailed" — конкретные числовые параметры качества
        - "basic" — общая ссылка на качество без деталей
        - "not_found" — требования не раскрыты

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "качество энергии"
        - "параметры качества"
        - "ГОСТ"
        - "напряжение"
        - "температура"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "quality_requirements"
          type: "string"
          allowed_values: ["detailed", "basic", "not_found"]
          description: "Уровень детализации требований к качеству"
        - name: "voltage_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указано ли напряжение"
        - name: "frequency_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указана ли частота"
        - name: "temperature_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указана ли температура"
        - name: "pressure_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указано ли давление"
        - name: "gost_reference"
          type: "string"
          description: "Ссылка на ГОСТ"
      store_payload: true

  - id: limitation_procedure_check
    name: "Порядок ограничения и прекращения подачи энергии (ст. 546 ГК РФ)"
    description: "Проверяет наличие четкой процедуры ограничения или отключения подачи энергии. Без нее абонент может быть лишен доступа к ресурсу без предупреждения."
    triggers:
      any: ["energy_supply_contract"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ограничение подачи"
        - "прекращение подачи"
        - "отключение энергии"
        - "предварительное уведомление"
        - "срок для устранения нарушений"
        - "при неоплате"
        - "порядок отключения"
        - "возобновление подачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ограничение.*подачи.*энергии.*допускается.*при.*неоплате"
        - "(?i)предварительное.*уведомление.*об.*отключении"
        - "(?i)отключение.*возможно.*при.*условии"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор энергоснабжения.
        Проверь наличие порядка ограничения и прекращения подачи энергии (ст. 546 ГК РФ).

        Ответь строго в JSON:
        {
          "limitation_procedure": "<detailed / basic / not_found>",
          "notice_period_days": "<число дней или not_found>",
          "grounds_for_limitation": "<неоплата / нарушение условий / иное / not_found>",
          "restoration_procedure": "<yes / no / not_found>",
          "limitation_snippet": "<цитата из договора или not_found>"
        }

        - "detailed" — подробная процедура с сроками уведомления и основаниями
        - "basic" — общая ссылка на возможность отключения
        - "not_found" — процедура не раскрыта

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "ограничение подачи"
        - "отключение энергии"
        - "предварительное уведомление"
        - "ст. 546 ГК РФ"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "limitation_procedure"
          type: "string"
          allowed_values: ["detailed", "basic", "not_found"]
          description: "Уровень детализации процедуры ограничения"
        - name: "notice_period_days"
          type: "string"
          description: "Срок предварительного уведомления в днях"
        - name: "grounds_for_limitation"
          type: "string"
          allowed_values: ["неоплата", "нарушение условий", "иное", "not_found"]
          description: "Основания для ограничения подачи"
        - name: "restoration_procedure"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указана ли процедура возобновления подачи"
      store_payload: true

  - id: liability_for_interruptions_check
    name: "Ответственность за перерывы в подаче энергии (ст. 547 ГК РФ)"
    description: "Проверяет наличие условий об ответственности за несанкционированные перерывы в подаче энергии."
    triggers:
      any: ["energy_supply_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за перерывы"
        - "возмещение ущерба"
        - "простой оборудования"
        - "несанкционированное отключение"
        - "компенсация убытков"
        - "прерывание подачи"
        - "неподача энергии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)энергоснабжающая.*организация.*несет.*ответственность.*за.*перерывы"
        - "(?i)возмещение.*убытков.*при.*перерыве"
    llm:
      prompt_template: |
