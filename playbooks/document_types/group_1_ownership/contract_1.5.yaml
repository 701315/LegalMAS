  - id: "confidentiality"
    name: "Конфиденциальность коммерческой информации"
    description: "Проверяет наличие условий о конфиденциальности данных абонента"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "коммерческая тайна"
        - "персональные данные"
        - "защита информации"
        - "неразглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)персональные.*данные"

  - id: "contract_term_and_renewal"
    name: "Срок действия и автоматическая пролонгация (ст. 540 ГК РФ)"
    description: "Проверяет наличие срока действия, условий автоматической пролонгации и порядка уведомления о непродлении. Для граждан договор считается заключённым на неопределённый срок, для юрлиц — существенно знать дату пролонгации."
    legal_base: "ст. 540 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "срок договора"
        - "пролонгация"
        - "автоматически продлевается"
        - "возобновляется на тот же срок"
        - "уведомление о расторжении"
        - "уведомление о непродлении"
        - "на неопределенный срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)договор.*действует.*до"
        - "(?i)автоматическ.*продл(евается|ение)"
        - "(?i)на\\s+неопределенн(ый|ого)\\s+срок"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "contract_term"
          type: "string"
          keyword_hints: ["срок действия", "до", "по"]
          description: "Срок действия договора"
        - name: "auto_renewal"
          type: "string"
          allowed_values: ["yes", "no", "indefinite", "not_found"]
          keyword_hints: ["пролонгация", "продлевается", "возобновляется"]
          description: "Предусмотрена ли автоматическая пролонгация"
        - name: "non_renewal_notice_days"
          type: "string"
          keyword_hints: ["за", "дней", "до окончания"]
          description: "Срок уведомления о непродлении (в днях)"
      store_payload: true

  - id: "energy_volume_and_capacity"
    name: "Количество энергии и максимальная мощность (ст. 541 ГК РФ)"
    description: "Проверяет наличие согласованного объёма потребления и/или максимальной мощности, а также последствий превышения лимита"
    legal_base: "ст. 541 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "количество энергии"
        - "объем потребления"
        - "плановое потребление"
        - "лимит потребления"
        - "максимальная мощность"
        - "присоединенная мощность"
        - "договорной объем"
        - "сверхдоговорное потребление"
        - "превышение лимита"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)количество.*энергии.*составляет"
        - "(?i)максимальн(ая|ой)\\s+мощност"
        - "(?i)присоединенн(ая|ой)\\s+мощност"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "agreed_volume"
          type: "string"
          keyword_hints: ["объем", "количество", "кВт·ч", "Гкал", "м³"]
          description: "Согласованный объём потребления"
        - name: "max_capacity"
          type: "string"
          keyword_hints: ["максимальная мощность", "присоединенная мощность", "кВт", "МВт"]
          description: "Максимальная мощность"
        - name: "excess_consumption_consequence"
          type: "string"
          allowed_values: ["penalty", "higher_tariff", "disconnection", "not_found"]
          keyword_hints: ["превышение", "сверхдоговорное", "штраф", "повышенный тариф"]
          description: "Последствия превышения лимита"
      store_payload: true

  - id: "subscriber_network_maintenance"
    name: "Обязанность абонента содержать сети и энергопринимающее оборудование (ст. 543 ГК РФ)"
    description: "Проверяет наличие обязанности абонента обеспечивать надлежащее техническое состояние энергопринимающих устройств, соблюдать режим потребления и немедленно сообщать об авариях"
    legal_base: "ст. 543 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "надлежащее техническое состояние"
        - "энергопринимающее оборудование"
        - "энергопринимающие устройства"
        - "соблюдение режима потребления"
        - "немедленно сообщить"
        - "уведомить об аварии"
        - "неисправность оборудования"
        - "пожар"
        - "авария"
        - "содержание внутренних сетей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)абонент.*обязан.*обеспечивать.*техническ.*состояние"
        - "(?i)немедленно.*сообщ(ить|ать).*авари"
        - "(?i)надлежащ.*состояние.*оборудован"

  - id: "sub_subscriber_restriction"
    name: "Запрет субабонентского подключения без согласия ЭСО (ст. 545 ГК РФ)"
    description: "Абонент вправе передавать энергию субабоненту только с согласия энергоснабжающей организации. Несогласованное подключение третьих лиц — частая причина споров и отключений."
    legal_base: "ст. 545 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "субабонент"
        - "суб-абонент"
        - "передача энергии третьим лицам"
        - "подключение третьих лиц"
        - "присоединение к сетям абонента"
        - "с согласия энергоснабжающей"
        - "транзит энергии"
        - "запрещается передача энергии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субабонент"
        - "(?i)передач(а|и)\\s+энерги.*третьим"
        - "(?i)подключение.*к\\s+сет(ям|и)\\s+абонент"

  - id: "termination_rights_asymmetry"
    name: "Расторжение: асимметрия прав гражданина и юрлица (ст. 546 ГК РФ)"
    description: "Гражданин-абонент вправе расторгнуть договор в одностороннем порядке (при условии полной оплаты). Юрлицо-абонент — только с согласия ЭСО или по суду. Проверяет корректность отражения этих правил."
    legal_base: "ст. 546 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение договора"
        - "односторонний отказ"
        - "право на отказ"
        - "прекращение договора"
        - "расторгнуть в одностороннем порядке"
        - "досрочное расторжение"
        - "по соглашению сторон"
        - "по решению суда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении|ения)\\s+договор"
        - "(?i)одностороннем\\s+порядке"
        - "(?i)досрочн(ое|ого)\\s+расторжен"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "subscriber_termination_right"
          type: "string"
          allowed_values: ["unilateral", "mutual_consent", "court_only", "not_found"]
          keyword_hints: ["в одностороннем порядке", "по соглашению", "по решению суда"]
          description: "Право абонента на расторжение"
        - name: "supplier_termination_right"
          type: "string"
          allowed_values: ["with_notice", "court_only", "upon_non_payment", "not_found"]
          keyword_hints: ["энергоснабжающая организация вправе", "при неоплате", "по решению суда"]
          description: "Право ЭСО на расторжение"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование, ИНН, ОГРН,
      статус (гарантирующий поставщик / сбытовая / сетевая организация), лицензия на деятельность,
      реквизиты для абонента (юрлицо / физлицо / ТСЖ / УК).
    addressee: "Энергоснабжающая организация / Абонент"

  subject_energy_type:
    text: >
      Просим уточнить в {doc_names}: конкретный вид энергии (электрическая / тепловая / газ / вода),
      технические параметры, соответствие лицензии поставщика.
    addressee: "Энергоснабжающая организация"

  delivery_point_specification:
    text: >
      Просим предоставить по {doc_names}: схему точки поставки, акт разграничения балансовой
      принадлежности, границу эксплуатационной ответственности, технические условия присоединения.
    addressee: "Сетевая организация / Энергоснабжающая организация"

  tariff_specification:
    text: >
      Просим предоставить по {doc_names}: действующий тариф с указанием регулирующего органа,
      типа тарифа (одно/двухставочный), размера платы за мощность (если применимо), порядок пересмотра.
    addressee: "Энергоснабжающая организация"

  metering_procedure:
    text: >
      Просим предоставить по {doc_names}: сведения о приборах учета (модель, номер, дата поверки),
      порядок снятия показаний, порядок расчета при неисправности/отсутствии прибора,
      ответственность за сохранность приборов.
    addressee: "Энергоснабжающая организация"

  energy_quality_requirements_check:
    text: >
      В {doc_names} не раскрыты или неполно раскрыты требования к качеству энергии.
      Просим согласовать: (а) конкретные параметры качества (напряжение, частота, температура, давление);
      (б) ссылку на действующие ГОСТ; (в) порядок проверки качества; (г) ответственность за нарушение качества.
    addressee: "Юридический советник абонента"

  limitation_procedure_check:
    text: >
      В {doc_names} не раскрыт порядок ограничения/отключения энергии.
      Просим согласовать: (а) исчерпывающий перечень оснований; (б) срок предварительного уведомления (не менее 20 дней);
      (в) порядок досудебного обжалования; (г) порядок возобновления подачи.
    addressee: "Юридический советник абонента"

  liability_for_interruptions_check:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за перерывы в подаче энергии,
      порядок возмещения убытков от простоя, доказывание причинно-следственной связи,
      исключения из ответственности (форс-мажор, аварии в сетях).
    addressee: "Юридический советник"

  payment_obligations:
    text: >
      Просим уточнить в {doc_names}: конкретные сроки оплаты (число месяца), размер пени за просрочку,
      право ограничения подачи при неоплате, порядок начисления пени.
    addressee: "Юридический советник энергоснабжающей организации"

  meter_maintenance:
    text: >
      Просим добавить в {doc_names}: обязанность абонента обеспечивать сохранность приборов учета,
      допуск для поверки и замены, последствия повреждения пломбы, расчет по нормативу при отказе от поверки.
    addressee: "Юридический советник энергоснабжающей организации"

  unauthorized_consumption_check:
    text: >
      Просим согласовать в {doc_names}: определение бездоговорного/безучетного потребления,
      методику расчета объема (исходя из мощности и времени), размер штрафа/неустойки,
      право отключения без предупреждения, порядок оформления акта.
    addressee: "Юридический советник энергоснабжающей организации"

  industrial_consumer_protection_check:
    text: >
      Для {doc_names} (промышленный потребитель) просим согласовать: категорию надежности энергоснабжения,
      требования к резервному питанию, размер компенсации убытков от простоя, приоритетное восстановление подачи.
    addressee: "Технический директор / Юридический советник"

  mcd_obligations_check:
    text: >
      Для {doc_names} (МКД) просим согласовать: границу балансовой принадлежности сетей,
      порядок расчета ОДН, ответственность за внутридомовые сети (ТСЖ/УК vs энергоснабжающая организация),
      порядок согласования перерасхода.
    addressee: "Управляющая компания / ТСЖ"

  special_consumption_regime:
    text: >
      Для {doc_names} (объект с особым режимом) просим согласовать: статус объекта (первая категория надежности),
      гарантии бесперебойного снабжения, сроки восстановления подачи, резервные источники питания.
    addressee: "Технический директор / Юридический советник"

  force_majeure_energy:
    text: >
      Просим уточнить в {doc_names} оговорку о форс-мажоре с учетом специфики энергоснабжения:
      аварии в сетях как форс-мажор, порядок уведомления, временные рамки освобождения от ответственности.
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подведомственность (арбитражные суды для юрлиц),
      подсудность (место нахождения объекта), досудебный претензионный порядок (срок 30 дней).
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности: защита данных абонента,
      коммерческая тайна объемов потребления, порядок передачи данных третьим лицам (судебным приставам и т.д.).
    addressee: "Юридический советник"

  social_facility_disconnection_prohibition:
    text: >
      Внимание: для {doc_names} (социально значимый объект) применяется запрет отключения
      в отопительный период (Постановление № 354, п. 119). Просим предоставить подтверждение статуса объекта
      и согласовать гарантии неотключения.
    addressee: "Юридический советник абонента"

  sales_surcharge_requirement:
    text: >
      Для {doc_names} (юридическое лицо) просим подтвердить включение энергосбытовой надбавки в тариф
      в соответствии с ПП РФ № 1179, наличие расчета по двухставочному тарифу (если применимо).
    addressee: "Финансовый директор / Энергоснабжающая организация"

  two_rate_meter_requirement:
    text: >
      Для {doc_names} (юридическое лицо) просим подтвердить установку прибора учета с функцией
      учета по зонам суток (ФЗ-261) или предоставить график замены прибора.
    addressee: "Технический директор"

  contract_term_and_renewal:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия автоматической пролонгации,
      срок направления уведомления о непродлении (не менее чем за ___ дней),
      порядок изменения условий при пролонгации.
    addressee: "Юридический советник"

  energy_volume_and_capacity:
    text: >
      Просим предоставить по {doc_names}: согласованный объём потребления / максимальную мощность,
      порядок расчёта при превышении или недоборе, возможность корректировки плановых объёмов,
      период (месяц / квартал / год), на который согласовывается объём.
    addressee: "Технический директор / Энергоснабжающая организация"

  subscriber_network_maintenance:
    text: >
      Просим согласовать в {doc_names}: перечень обязанностей абонента по содержанию
      энергопринимающего оборудования и внутренних сетей, порядок и срок уведомления ЭСО
      об авариях и неисправностях, распределение ответственности при поломке на стороне абонента.
    addressee: "Технический директор / Юридический советник"

  sub_subscriber_restriction:
    text: >
      Просим уточнить в {doc_names}: наличие запрета или порядка согласования субабонентских
      подключений (ст. 545 ГК РФ), последствия несанкционированного подключения третьих лиц
      к сетям абонента, ответственность за транзит энергии.
    addressee: "Юридический советник"

  termination_rights_asymmetry:
    text: >
      Просим согласовать в {doc_names}: право абонента на односторонний отказ (для граждан —
      ст. 546 п. 1 ГК РФ), условия и порядок расторжения для юрлиц, срок предупреждения,
      обязательства сторон при расторжении (оплата, снятие показаний, демонтаж).
    addressee: "Юридический советник"

  residential_heat_disconnection_prohibition:
    text: >
      Внимание: для {doc_names} (теплоснабжение жилого МКД) действует запрет полного
      отключения в отопительный период (ПП РФ № 354, ФЗ-190). Просим подтвердить, что
      договор не содержит условий, противоречащих данному ограничению, и согласовать
      порядок частичного ограничения (при необходимости).
    addressee: "Юридический советник абонента"
    
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"