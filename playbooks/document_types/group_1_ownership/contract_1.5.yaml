type: contract_1.5_energy_supply
name: "Договор энергоснабжения"

description: |
  Специализированный вид купли-продажи, регулируемый § 6 Главы 30 ГК РФ, для поставки энергии
  (электрической, тепловой, газа, воды) через присоединенную сеть. Является публичным договором,
  характеризуется особым способом передачи товара и специальными правилами учета потребления.
  Для граждан дополнительно применяются Правила предоставления коммунальных услуг
  (ПП РФ № 354) и Закон о защите прав потребителей.

version: 4.0
parent: class_1_transfer_of_ownership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  jurisdiction: RU
  language: ru
  legal_base: "§ 6 Главы 30 ГК РФ (ст. 539-548)"
  doc_types_supported:
    - "договор энергоснабжения"
    - "договор на поставку электроэнергии"
    - "договор теплоснабжения"
    - "договор водоснабжения"
    - "договор газоснабжения"
    - "договор снабжения энергией"
    - "договор с гарантирующим поставщиком"
    - "договор купли-продажи электрической энергии (мощности)"
    - "договор холодного водоснабжения"
    - "договор горячего водоснабжения"
    - "договор водоотведения"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)энергоснабжен"
      - "(?i)энергосбыт"
      - "(?i)электроснабжен"
      - "(?i)теплоснабжен"
      - "(?i)водоснабжен"
      - "(?i)газоснабжен"
      - "(?i)energy.*supply"

    folder_patterns:
      - "(?i)энергоснабжен"
      - "(?i)коммунальные.*услуги"
      - "(?i)utilities"

    keywords:

      high:
        - "энергоснабжен"
        - "энергоснабжающ организаци"
        - "энергосбытовая организация"
        - "сбытовая компания"
        - "сетевая организация"
        - "абонент"
        - "энергия"
        - "через присоединенную сеть"
        - "подача энергии"
        - "прибор учета"
        - "счетчик"

      medium:
        - "электроэнергия"
        - "тепловая энергия"
        - "тепло"
        - "вода"
        - "газ"
        - "потребитель"
        - "потребление энергии"
        - "тариф"
        - "одноставочный тариф"
        - "двухставочный тариф"
        - "мощность"
        - "киловатт"
        - "кВт"
        - "гигакалория"
        - "Гкал"
        - "кубометр"
        - "ОДН"
        - "общедомовые нужды"
        - "граница балансовой принадлежности"
        - "точка поставки"

      low:
        - "снабжение"
        - "ресурсоснабжающая организация"
        - "РСО"
        - "плата за технологическое присоединение"
        - "аккредитация"
        - "гарантирующий поставщик"

    exclusions:
      - "продажа в емкостях"
      - "разовая передача"
      - "договор подряда"
      - "договор купли-продажи товаров"
      - "договор купли-продажи недвижимости"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

