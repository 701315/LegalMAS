      - "сбытовая компания"
      - "абонент"
      - "подача энергии"

  electricity_supply:
    any_keywords:
      - "электроэнергия"
      - "электрическая энергия"
      - "электроснабжение"
      - "киловатт"
      - "кВт"
      - "мощность"
      - "напряжение"
      - "частота"

  heat_supply:
    any_keywords:
      - "тепловая энергия"
      - "теплоснабжение"
      - "отопление"
      - "горячая вода"
