# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, полномочия и корпоративное одобрение
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_authority_cluster
    name: "Стороны, полномочия и корпоративное одобрение"
    description: >
      Фактографическая проверка идентификации продавца и покупателя, полномочий
      подписантов и корпоративного одобрения сделки для юридических лиц.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "не является крупной сделкой"
        - "корпоративное одобрение"
        - "устав"
        - "доверенность"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 432, 549 ГК РФ; ФЗ-14 «Об ООО»; ФЗ-208 «Об АО»; ст. 182 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов
        и корпоративное одобрение.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Продавца (ИНН, ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Продавца (юридическое лицо / физическое лицо / ИП).
        3. Кто подписывает от Продавца и на каком основании.
        4. Наименование и реквизиты Покупателя.
        5. Тип Покупателя.
        6. Кто подписывает от Покупателя и на каком основании.
        7. Есть ли в договоре указание на корпоративное одобрение сделки (протокол,
           одобрение ОС/СД) или заверение о том, что одобрение не требуется.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_specified", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена советом директоров (протокол № 5 от 01.03.2026).
        Покупатель — гражданин Петров Б.Б., паспорт серия 45 00 № 123456."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "seller_type": "legal_entity",
          "seller_signatory": "Генеральный директор Иванов А.А.",
          "seller_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "buyer_type": "individual",
          "buyer_signatory": "Петров Б.Б.",
          "buyer_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "одобрена советом директоров, протокол № 5 от 01.03.2026",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, в лице Генерального директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между продавцом и покупателем."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details": "Данные не определены",
          "seller_type": "not_defined",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details": "Данные не определены",
          "buyer_type": "not_defined",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли ИНН/ОГРН для ЮЛ или паспортные данные для физлица?
        2. Явно ли указан тип стороны?
        3. Указан ли подписант и документ-основание?
        4. Упомянуто ли корпоративное одобрение или заверение о его отсутствии?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_details_status": "<defined / not_defined>",
          "seller_details": "<реквизиты или 'Данные не определены'>",
          "seller_type": "<legal_entity / individual / ip / not_defined>",
          "seller_signatory": "<ФИО или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details": "<реквизиты или 'Данные не определены'>",
          "buyer_type": "<legal_entity / individual / ip / not_defined>",
          "buyer_signatory": "<ФИО или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_query: "продавец покупатель именуем в лице действующего на основании ИНН ОГРН устава доверенности паспорт гражданин физическое лицо крупная сделка сделка с заинтересованностью одобрение общего собрания совета директоров корпоративное одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "кадастровый номер"
        - "площадь"
        - "адрес объекта"
        - "ЕГРН"
        - "обременения"
        - "залог"
        - "арест"
        - "аренда"
        - "банкротство"
        - "цена"
        - "задаток"
        - "аккредитив"
        - "ипотека в силу закона"
        - "передаточный акт"
        - "согласие супруга"
        - "маткапитал"
        - "орган опеки"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.4
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора купли-продажи недвижимости
        сведения о продавце и покупателе: реквизиты, тип стороны, подписанта, основание
        полномочий и корпоративное одобрение сделки.
        Не анализируй предмет договора, цену, расчёты, обременения, передачу объекта
        или семейные риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_details_status — "defined" или "not_defined".
        2. seller_details — реквизиты продавца.
        3. seller_type — legal_entity / individual / ip / not_defined.
        4. seller_signatory — подписант продавца.
        5. seller_signatory_basis — charter / poa / order / personal / other / not_defined.
        6. buyer_details_status — "defined" или "not_defined".
        7. buyer_details — реквизиты покупателя.
        8. buyer_type — legal_entity / individual / ip / not_defined.
        9. buyer_signatory — подписант покупателя.
        10. buyer_signatory_basis — charter / poa / order / personal / other / not_defined.
        11. corporate_approval_status — "defined" или "not_defined".
        12. corporate_approval_details — корпоративное одобрение сделки или указание, что оно не требуется.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Для физлица, подписывающего лично, используй seller_signatory_basis / buyer_signatory_basis = "personal".
        - Не подставляй корпоративные правила, если они не отражены в договоре.
        - Верни только JSON.
        </rules>
      fields:
        - name: "seller_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов продавца."
        - name: "seller_details"
          type: "string"
          presentation: "fact"
          label: "Продавец"
          description: "Реквизиты продавца."
        - name: "seller_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual", "ip", "not_defined"]
          description: "Тип продавца."
        - name: "seller_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант продавца"
          description: "Подписант продавца."
        - name: "seller_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта продавца."
        - name: "buyer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов покупателя."
        - name: "buyer_details"
          type: "string"
          presentation: "fact"
          label: "Покупатель"
          description: "Реквизиты покупателя."
        - name: "buyer_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual", "ip", "not_defined"]
          description: "Тип покупателя."
        - name: "buyer_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант покупателя"
          description: "Подписант покупателя."
        - name: "buyer_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта покупателя."
        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия корпоративного одобрения или заверения о его ненужности."
        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
          description: "Корпоративное одобрение сделки или указание, что оно не требуется."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет договора и титул продавца
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_title_cluster
    name: "Предмет договора и титул продавца"
    description: >
      Фактографическая проверка идентификации объекта недвижимости (кадастровый номер,
      адрес, площадь, вид) и правоустанавливающих документов продавца.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "расположен"
        - "находится по адресу"
        - "выписка из ЕГРН"
        - "правоустанавливающ"
        - "правоподтверждающ"
        - "запись ЕГРН"
        - "свидетельство о праве"
        - "основание права"
        - "ЕГРН"
        - "Росреестр"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)площадь.*?\\d+.*?(кв|га)"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 549, 554 ГК РФ; ФЗ-218 «О государственной регистрации недвижимости»).
        Проверяется только один вопрос: предмет договора и титул продавца.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер объекта (формат NN:NN:NNNNNNN:N).
        2. Адрес объекта.
        3. Площадь объекта с единицей.
        4. Вид объекта (квартира / дом / земельный участок / нежилое и т.д.).
        5. Ссылку на выписку ЕГРН.
        6. Правоустанавливающий документ продавца (тип и реквизиты).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. Не выводи кадастровый номер из контекста — только если прямо написан.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец продаёт квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5,
        кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м.
        Право собственности подтверждается выпиской из ЕГРН от 01.03.2026,
        приобретено на основании договора купли-продажи от 15.06.2015."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number": "77:06:0001001:123",
          "address_status": "defined",
          "address_details": "г. Москва, ул. Ленина, д. 5, кв. 12",
          "area_status": "defined",
          "area_details": "45,3 кв.м",
          "object_type": "apartment",
          "egrn_extract_status": "defined",
          "egrn_extract_details": "выписка из ЕГРН от 01.03.2026",
          "title_document_status": "defined",
          "title_document_type": "договор купли-продажи",
          "title_document_details": "от 15.06.2015",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Предметом договора является объект недвижимости."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number": "Данные не определены",
          "address_status": "not_defined",
          "address_details": "Данные не определены",
          "area_status": "not_defined",
          "area_details": "Данные не определены",
          "object_type": "not_defined",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Данные не определены",
          "title_document_status": "not_defined",
          "title_document_type": "not_defined",
          "title_document_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли кадастровый номер в формате NN:NN:NNNNNNN:N (прямо написан)?
        2. Указан ли адрес объекта?
        3. Указана ли площадь числом с единицей?
        4. Можно ли определить вид объекта?
        5. Упомянута ли выписка ЕГРН?
        6. Указан ли тип правоустанавливающего документа продавца?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number": "<номер или 'Данные не определены'>",
          "address_status": "<defined / not_defined>",
          "address_details": "<адрес или 'Данные не определены'>",
          "area_status": "<defined / not_defined>",
          "area_details": "<площадь или 'Данные не определены'>",
          "object_type": "<apartment / house / land / building / non_residential / share / unfinished / other / not_defined>",
          "egrn_extract_status": "<defined / not_defined>",
          "egrn_extract_details": "<дата/реквизиты или 'Данные не определены'>",
          "title_document_status": "<defined / not_defined>",
          "title_document_type": "<тип или 'Данные не определены'>",
          "title_document_details": "<реквизиты или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_query: "кадастровый номер адрес объекта площадь выписка ЕГРН правоустанавливающий документ правоподтверждающий документ запись ЕГРН Росреестр свидетельство о праве основание права квартира земельный участок нежилое помещение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "не обременен"
        - "свободен от прав третьих лиц"
        - "не заложен"
        - "не под арестом"
        - "не сдан в аренду"
        - "задолженность"
        - "ЗОУИТ"
        - "перепланировка"
        - "банкротство"
        - "цена"
        - "задаток"
        - "аванс"
        - "аккредитив"
        - "ипотека в силу закона"
        - "передаточный акт"
        - "согласие супруга"
        - "маткапитал"
        - "означает"
        - "в целях настоящего"
      position_bias:
