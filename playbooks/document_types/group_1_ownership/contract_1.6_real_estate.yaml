    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только об ипотеке в силу закона по ст. 488 ГК РФ: режим (возникает /
        исключена / не упомянута) и условия прекращения ипотеки.
        Не анализируй способ расчётов, задаток, аванс, залог в пользу банка,
        обременения от третьих лиц и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. mortgage_by_law_status:
           - "defined" — если в тексте прямо указан режим ипотеки в силу закона
             (возникает или исключена);
           - "not_defined" — если режим прямо не указан или его нельзя
             надёжно определить, в том числе если рассрочка есть,
             но вопрос об ипотеке прямо не урегулирован.

        2. mortgage_by_law_regime:
           Используй только одно из значений:
           - "arises" — если прямо указано, что ипотека в силу закона возникает
             или объект находится в залоге у продавца до полной оплаты;
           - "excluded" — если прямо указано, что ипотека в силу закона не возникает,
             исключена или право залога не применяется;
           - "not_addressed" — если рассрочка или отсрочка предусмотрена,
             но вопрос об ипотеке в силу закона прямо не урегулирован,
             либо если расчёты производятся в полном объёме в день подписания
             и ипотека в силу закона не упоминается;
           - "not_defined" — если режим прямо не следует из текста
             и нельзя надёжно его определить.

        3. mortgage_by_law_details:
           Краткое user-facing описание режима ипотеки в силу закона
           на русском языке.
           Правила:
           - если ипотека прямо исключена, верни краткое summary, например:
             "Ипотека в силу закона прямо исключена сторонами";
           - если ипотека прямо возникает, верни краткое summary, например:
             "До полной оплаты объект находится в залоге у Продавца";
           - если рассрочка есть, но ипотека прямо не урегулирована, верни:
             "Рассрочка предусмотрена; вопрос об ипотеке в силу закона
             прямо не урегулирован";
           - если расчёты в день подписания и ипотека не упоминается, верни:
             "Расчёты в день подписания; вопрос об ипотеке в силу закона
             не применим";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        4. mortgage_termination_status:
           - "defined" — если в тексте прямо указаны условия прекращения /
             снятия ипотеки в силу закона;
           - "not_defined" — если такие условия прямо не указаны
             или их нельзя надёжно определить.

        5. mortgage_termination_details:
           Краткое user-facing описание условий прекращения ипотеки
           на русском языке.
           Правила:
           - если условия прямо указаны, верни краткое summary, например:
             "Продавец подаёт заявление о снятии обременения в течение
             3 рабочих дней после последнего платежа";
           - если ипотека прямо исключена или не применима к данной сделке —
             "Не применимо";
           - если ипотека возникает, но условия прекращения прямо не описаны —
             "Не установлены";
           - не копируй длинные абзацы;
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, ФЗ-102, судебную практику, обычную практику
          или предположения вместо текста договора.
        - Не смешивай ипотеку в силу закона с залогом в пользу банка,
          обременениями от третьих лиц, задатком, авансом, способом расчётов,
          передачей объекта и иными нерелевантными темами.
        - Общие фразы вроде "объект передаётся свободным от обременений"
          без конкретизации ипотеки в силу закона не являются основанием
          для режима "excluded".
        - Если рассрочка или отсрочка прямо предусмотрена, но ипотека в силу
          закона прямо не упомянута → mortgage_by_law_regime = "not_addressed".
        - Если расчёты производятся в полном объёме в день подписания
          и ипотека в силу закона не упоминается →
          mortgage_by_law_regime = "not_addressed",
          mortgage_termination_details = "Не применимо".
        - Если ипотека прямо исключена →
          mortgage_termination_details = "Не применимо".
        - Если ипотека возникает, но условия снятия прямо не описаны →
          mortgage_termination_details = "Не установлены".
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 5 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для mortgage_by_law_status и mortgage_termination_status используй только:
          "defined" или "not_defined".
        - Для mortgage_by_law_regime используй только:
          "arises", "excluded", "not_addressed", "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          mortgage_by_law_details → "Не установлено"
          mortgage_termination_details → "Не установлены" или "Не применимо"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "mortgage_by_law_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования ипотеки в силу закона."
          required: true
          display_in_grid: false

        - name: "mortgage_by_law_regime"
          type: "string"
          presentation: "signal"
          allowed_values: ["arises", "excluded", "not_addressed", "not_defined"]
          description: "Режим ипотеки в силу закона."
          required: true
          display_in_grid: false

        - name: "mortgage_by_law_details"
          type: "string"
          presentation: "fact"
          label: "Ипотека в силу закона"
          description: >
            Краткое user-facing summary по режиму ипотеки в силу закона:
            возникает, исключена, не урегулирована при рассрочке,
            не применима при расчётах в день подписания.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "mortgage_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий прекращения ипотеки в силу закона."
          required: true
          display_in_grid: false

        - name: "mortgage_termination_details"
          type: "string"
          presentation: "fact"
          label: "Прекращение ипотеки"
          description: >
            Краткое user-facing summary по условиям прекращения / снятия
            ипотеки в силу закона.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: closing_transfer_cluster
    name: "Закрытие, условия закрытия и передача объекта"
    description: >
      Фактографическая проверка сроков закрытия, перечня отлагательных условий,
      передаточного акта и момента его подписания, освобождения объекта,
      выписки зарегистрированных лиц, порядка при отказе / приостановке
      регистрации и передачи технической документации.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не позднее"
        - "в течение"
        - "подать на регистрацию"
        - "регистрация перехода права"
        - "срок закрытия"
        - "дата закрытия"
        - "при условии"
        - "после предоставления"
        - "до регистрации"
        - "условие закрытия"
        - "отлагательное условие"
        - "передаточный акт"
        - "акт приема-передачи"
        - "передача ключей"
        - "освободить"
        - "снятие с регистрационного учета"
        - "выписаться"
        - "зарегистрированные лица"
        - "прописанные"
        - "техническая документация"
        - "приостановка регистрации"
        - "отказ в регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч)"
        - "(?i)под(ать|ача).*регистрац"
        - "(?i)(при\\s+условии|до\\s+регистрац|после\\s+предоставлен)"
        - "(?i)акт\\s+(приема|передач)"
        - "(?i)снят(ие|ь)\\s+с\\s+регистрац"
        - "(?i)техническ(ая|ой)\\s+документ"
        - "(?i)(приостановк|отказ).*регистрац"
        - "(?i)зарегистрированн(ые|ых)\\s+лиц"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: условия закрытия сделки и передача объекта.
        Не анализируй цену, расчёты, обременения, ипотеку, банкротство продавца
        или семейные риски.

        Нормативный ориентир:
        - ст. 551, 556 ГК РФ
        - ФЗ-218 «О государственной регистрации недвижимости»

        [ВАЖНО — ПРАКТИКА ЗАКРЫТИЯ СДЕЛОК С НЕДВИЖИМОСТЬЮ В RUSSIA]
        В российской практике купли-продажи недвижимости закрытие — это не одно
        событие, а цепочка:
        1. Подача документов в МФЦ / Росреестр (операционный дедлайн).
        2. Государственная регистрация перехода права (5–9 рабочих дней,
           производится Росреестром, стороны не контролируют дату напрямую).
        3. Передача объекта по передаточному акту (может быть до или после
           регистрации, или в МФЦ в день подачи).
        4. Фактическое освобождение (вывоз вещей, передача ключей).
        5. Выписка зарегистрированных лиц (для жилой недвижимости).

        Эти события могут происходить в разные дни и регулироваться по-разному.
        Различай их при анализе.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок подачи документов на регистрацию (операционный дедлайн).
        2. Крайний срок закрытия сделки, после которого сторона вправе отказаться
           от договора (аналог longstop date).
        3. Перечень отлагательных условий закрытия сделки.
        4. Наличие передаточного акта и момент его подписания.
        5. Срок фактического освобождения объекта.
        6. Условия о выписке зарегистрированных лиц (прописанных).
        7. Порядок действий при приостановке или отказе в регистрации.
        8. Передача технической документации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Различай три разных события:
           - срок подачи документов на регистрацию → closing_date_details;
           - крайний срок, после которого сторона вправе выйти из сделки →
             longstop_date_details;
           - дата подписания передаточного акта → transfer_act_details.
           Не смешивай их в одно поле.
        4. Для conditions_precedent ищи российские конструкции:
           "при условии", "после предоставления", "до регистрации",
           "обязательства наступают при", "при наличии", отлагательные условия
           по ст. 157 ГК РФ. Не требуй именно термин "conditions precedent".
        5. Для transfer_act_details важно не только наличие акта, но и момент
           его подписания:
           - до подачи на регистрацию,
           - одновременно с подачей (в МФЦ),
           - после регистрации,
           - в иной момент прямо указанный в договоре.
        6. Для deregistration_details:
           - это только выписка прописанных / зарегистрированных по месту жительства лиц;
           - не путай со снятием ипотечного обременения в ЕГРН — это другая тема;
           - если в договоре прямо написано, что зарегистрированных лиц нет,
             это тоже "defined".
        7. Для registration_refusal_details разграничивай:
           - приостановку регистрации (Росреестр предлагает устранить недостатки);
           - отказ в регистрации (финальный).
           Если обе ситуации урегулированы в договоре, кратко отрази обе.
        8. Если longstop_date прямо не назван, но в договоре есть право
           одной из сторон отказаться от договора, если регистрация не состоялась
           до определённой даты, считай это longstop_date и отрази в поле.
        9. Для текстовых полей используй:
           - "Не установлен" — для closing_date_details, longstop_date_details;
           - "Не установлены" — для conditions_precedent_details,
             registration_refusal_details, technical_docs_details;
           - "Не установлено" — для transfer_act_details,
             possession_delivery_details, deregistration_details;
           - "Не применимо" — если параметр явно не применим к данной сделке
             (например, deregistration для нежилого объекта, если прямо следует
             из текста);
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны обязуются подать документы на государственную регистрацию не позднее
        10.05.2026. При условии полной оплаты аванса и предоставления продавцом
        выписки из ЕГРН. Крайний срок закрытия сделки — 01.07.2026; если регистрация
        не состоялась до этой даты, покупатель вправе отказаться от договора.
        Передача объекта производится по передаточному акту, подписываемому после
        государственной регистрации. Продавец обязуется освободить объект и сняться
        с регистрационного учёта по месту жительства до 01.06.2026. В квартире
        зарегистрирована дочь Продавца — Иванова А.А. (1998 г.р.); выписка до
        01.06.2026. При приостановке регистрации по вине Продавца Покупатель вправе
        отказаться от договора."

        Ответ:
        {
          "closing_date_status": "defined",
          "closing_date_details": "Не позднее 10.05.2026",
          "longstop_date_status": "defined",
          "longstop_date_details": "01.07.2026; при незакрытии Покупатель вправе отказаться от договора",
          "conditions_precedent_status": "defined",
          "conditions_precedent_details": "Полная оплата аванса; предоставление Продавцом выписки из ЕГРН",
          "transfer_act_status": "defined",
          "transfer_act_details": "Передача по передаточному акту после государственной регистрации",
          "possession_delivery_status": "defined",
          "possession_delivery_details": "До 01.06.2026",
          "deregistration_status": "defined",
