      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только об идентификации объекта недвижимости и об основании права продавца:
        кадастровый номер, адрес, площадь, вид объекта, выписка из ЕГРН,
        правоустанавливающий документ и его реквизиты.
        Не анализируй цену, расчёты, обременения, семейные риски, передачу объекта,
        регистрацию перехода права и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. cadastral_number_status:
           - "defined" — если кадастровый номер прямо указан в тексте
             или прямо определён по названному внешнему документу;
           - "not_defined" — если кадастровый номер прямо не указан
             или его нельзя надёжно определить.
           Важно: общая ссылка на ЕГРН или документы без конкретизации параметра
           не является достаточным основанием для "defined".

        2. cadastral_number_value:
           Краткое user-facing значение кадастрового номера на русском языке.
           Правила:
           - если номер прямо указан, верни сам номер;
           - если номер прямо определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно выписке из ЕГРН от 01.03.2026",
             "Согласно Приложению №1";
           - если объектов несколько, перечисли значения через "; ";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. address_status:
           - "defined" — если адрес объекта прямо указан в тексте
             или прямо определён по названному внешнему документу;
           - "not_defined" — если адрес прямо не указан
             или его нельзя надёжно определить.

        4. address_details:
           Краткое user-facing описание адреса объекта на русском языке.
           Правила:
           - если адрес прямо указан, верни его в одной строке;
           - если адрес прямо определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №1",
             "Согласно выписке из ЕГРН от 01.03.2026";
           - если объектов несколько, перечисли адреса через "; ";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. area_status:
           - "defined" — если площадь объекта прямо указана в тексте
             или прямо определена по названному внешнему документу;
           - "not_defined" — если площадь прямо не указана
             или её нельзя надёжно определить.

        6. area_details:
           Краткое user-facing описание площади объекта на русском языке.
           Правила:
           - если площадь прямо указана, верни её с единицей измерения;
           - если площадь прямо определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №1",
             "Согласно выписке из ЕГРН от 01.03.2026";
           - если объектов несколько, перечисли значения через "; ";
           - если данных нет — "Не установлена";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. object_type_code:
           Используй только одно из значений:
           - "apartment" — квартира;
           - "house" — жилой дом;
           - "land" — земельный участок;
           - "building" — здание / сооружение;
           - "non_residential" — нежилое помещение;
           - "share" — доля в праве;
           - "unfinished" — объект незавершённого строительства;
           - "other" — иной прямо указанный тип или несколько разных типов объектов;
           - "not_defined" — если вид объекта прямо не следует из текста.

        8. object_type_details:
           Краткое user-facing описание вида объекта на русском языке.
           Правила:
           - если вид объекта прямо указан, верни его так, как он назван в договоре,
             например: "квартира", "земельный участок", "нежилое помещение",
             "1/2 доля в праве собственности на квартиру";
           - если объект определяется по названному внешнему документу
             и из самого текста нельзя надёжно понять вид, верни:
             "Согласно Приложению №1" или аналогичную понятную формулировку;
           - если объектов несколько, перечисли через "; ";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. egrn_extract_status:
           - "defined" — если в тексте прямо упомянута выписка из ЕГРН;
           - "not_defined" — если такая выписка прямо не упомянута
             или её нельзя надёжно определить.

        10. egrn_extract_details:
            Краткое user-facing описание выписки из ЕГРН на русском языке.
            Правила:
            - если выписка упомянута, верни краткое summary, например:
              "Выписка из ЕГРН от 01.03.2026",
              "Выписка из ЕГРН № 123456 от 01.03.2026";
            - если упоминание общее и реквизиты не указаны, можно вернуть:
              "Выписка из ЕГРН";
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
            Важно: не используй выписку из ЕГРН как замену правоустанавливающему документу.

        11. title_document_status:
            - "defined" — если в тексте прямо указано основание возникновения права продавца
              (тип документа и/или его реквизиты), либо прямо указано,
              что основание определяется по названному внешнему документу;
            - "not_defined" — если основание права прямо не указано
              или его нельзя надёжно определить.
            Важно: одна только выписка из ЕГРН без указания основания возникновения права
            не является основанием для "defined".

        12. title_document_type:
            Тип правоустанавливающего документа на русском языке.
            Правила:
            - если тип прямо указан, верни его, например:
              "договор купли-продажи",
              "свидетельство о праве на наследство",
              "решение суда",
              "договор дарения";
            - если тип определяется по названному внешнему документу,
              верни понятную формулировку, например:
              "Согласно Приложению №2";
            - если документов несколько, перечисли через "; ";
            - если данных нет — "Не установлен";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        13. title_document_details:
            Реквизиты правоустанавливающего документа на русском языке.
            Правила:
            - если реквизиты прямо указаны, верни краткое summary, например:
              "от 15.06.2015",
              "№ 12 от 15.06.2015",
              "от 10.09.2019";
            - если реквизиты определяются по названному внешнему документу,
              верни понятную формулировку, например:
              "Согласно Приложению №2";
            - если документов несколько, перечисли через "; ";
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        14. title_document_display:
            Краткое user-facing summary об основании права продавца на русском языке.
            Правила:
            - если прямо указаны тип и реквизиты, объедини их в одну краткую строку, например:
              "Договор купли-продажи от 15.06.2015",
              "Свидетельство о праве на наследство от 10.09.2019",
              "Решение суда от 14.09.2020";
            - если указан только тип без реквизитов, верни только тип;
            - если основание определяется по названному внешнему документу,
              верни понятную формулировку, например:
              "Согласно Приложению №2";
            - если документов несколько, перечисли через "; ";
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, практику Росреестра, обычную практику
          или предположения вместо текста договора.
        - Не смешивай предмет договора и основание права продавца с ценой,
          расчётами, обременениями, передачей объекта, семейными согласиями,
          перепланировкой и иными нерелевантными темами.
        - Если параметр прямо определяется по названному внешнему документу
          (выписке из ЕГРН, приложению, поэтажному плану, экспликации и т.п.),
          считай его определённым и отрази это в user-facing поле.
        - Общая ссылка на документы без привязки к конкретному параметру
          не является достаточным основанием для "defined".
        - Выписка из ЕГРН не является правоустанавливающим документом сама по себе.
          Если в тексте есть только выписка ЕГРН, но нет указания на основание
          возникновения права продавца:
          * egrn_extract_status → "defined";
          * title_document_status → "not_defined";
          * title_document_display → "Не установлено".
        - Если в разных фрагментах указаны разные кадастровые номера, адреса,
          площади, виды объекта или разные основания права, и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Если объектов несколько:
          * для текстовых полей перечисляй значения через "; ";
          * для object_type_code используй один код, только если все объекты
            одного типа; если типы разные — используй "other".
        - Для object_type_code используй только:
          "apartment", "house", "land", "building", "non_residential",
          "share", "unfinished", "other", "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 14 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для object_type_code используй только:
          "apartment", "house", "land", "building", "non_residential",
          "share", "unfinished", "other", "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          cadastral_number_value → "Не установлен"
          address_details → "Не установлен"
          area_details → "Не установлена"
          object_type_details → "Не установлен"
          egrn_extract_details → "Не установлены"
          title_document_type → "Не установлен"
          title_document_details → "Не установлены"
          title_document_display → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "cadastral_number_status"
          type: "string"
