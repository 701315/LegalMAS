  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 17: Единство судьбы земли и строения
  # ──────────────────────────────────────────────────────────────────────────
  - id: land_building_unity_check
    name: "Единство судьбы земли и строения (ст. 552 ГК РФ, ст. 35 ЗК РФ)"
    description: >
      Фактографическая проверка передачи прав на земельный участок вместе со зданием.
    triggers:
      any: ["building_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вместе с земельным участком"
        - "право аренды земельного участка"
        - "переходит вместе со зданием"
        - "права на землю"
        - "земельный участок под зданием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)земельн.*участ.*(переходит|передается).*вместе"
        - "(?i)вместе.*со.*здани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи здания/сооружения (ст. 552 ГК РФ; ст. 35 ЗК РФ).
        Проверяется передача прав на земельный участок вместе со зданием.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид передаваемых прав на земельный участок (собственность / аренда).
        2. Кадастровый номер участка под зданием.
        3. Площадь участка под зданием.
        4. Необходимость согласия арендодателя (при аренде участка).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написано о передаче прав на землю?
        2. Какой вид прав — собственность или аренда?
        3. Указан ли кадастровый номер участка?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "land_rights_transfer_status": "<defined / not_defined>",
          "land_rights_transfer": "<ownership / lease / not_defined>",
          "land_cadastral_number_status": "<defined / not_defined>",
          "land_cadastral_number": "<номер или 'Данные не определены'>",
          "land_area_status": "<defined / not_defined>",
          "land_area": "<площадь или 'Данные не определены'>",
          "lease_consent_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_query: "вместе с земельным участком право аренды земельного участка переходит вместе со зданием права на землю земельный участок под зданием передача прав на землю ст. 552 ГК РФ ст. 35 ЗК РФ согласие арендодателя кадастровый номер участка под зданием площадь участка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "кадастровый номер здания"
        - "площадь здания"
        - "категория земель"
        - "вид разрешённого использования"
        - "ВРИ"
        - "ковенант о неизменности назначения"
        - "ЗОУИТ"
        - "охранная зона"
        - "не обременен"
        - "арест"
        - "аренда как обременение"
        - "ипотека"
        - "цена"
        - "задаток"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 440
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора купли-продажи здания
        или сооружения условия о правах на земельный участок под объектом:
        вид передаваемых прав, кадастровый номер, площадь и согласие арендодателя.
        Не анализируй общие параметры здания, цену, расчёты или ипотеку.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. land_rights_transfer_status — "defined" или "not_defined".
        2. land_rights_transfer — ownership / lease / not_defined.
        3. land_rights_transfer_details — описание передаваемых прав на землю.
        4. land_cadastral_number_status — "defined" или "not_defined".
        5. land_cadastral_number — кадастровый номер участка.
        6. land_area_status — "defined" или "not_defined".
        7. land_area — площадь участка.
        8. lease_consent_status — "defined" или "not_defined".
        9. lease_consent_details — условие о согласии арендодателя.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - ownership = прямо передаётся право собственности на землю.
        - lease = прямо передаётся право аренды или иное производное право пользования землёй.
        - Не выводи права на землю из общих норм закона — только из текста договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "land_rights_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида передаваемых прав на землю."
        - name: "land_rights_transfer"
          type: "string"
          presentation: "signal"
          allowed_values: ["ownership", "lease", "not_defined"]
          description: "Вид передаваемых прав на земельный участок."
        - name: "land_rights_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Права на землю"
          description: "Описание передаваемых прав на земельный участок."
        - name: "land_cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения кадастрового номера участка."
        - name: "land_cadastral_number"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер участка"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: "Кадастровый номер участка под зданием."
        - name: "land_area_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения площади участка."
        - name: "land_area"
          type: "string"
          presentation: "fact"
          label: "Площадь участка"
          description: "Площадь участка под зданием."
        - name: "lease_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о согласии арендодателя."
        - name: "lease_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие арендодателя"
          description: "Условие о согласии арендодателя при аренде участка."
      store_payload: true

