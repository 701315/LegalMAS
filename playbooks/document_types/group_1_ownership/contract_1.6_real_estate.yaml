type: contract_1.6_real_estate
name: "Договор купли-продажи недвижимости"
version: 6.0
parent: class_1_transfer_of_ownership
description: |
  Специализированный вид купли-продажи недвижимого имущества, регулируемый § 7 Главы 30 ГК РФ.
  Характеризуется обязательной письменной формой, государственной регистрацией перехода права
  собственности, специальными гарантиями для покупателя и множеством практических ограничений
  и рисков.
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 7 Главы 30 ГК РФ (ст. 549-558)"
  doc_types_supported:
    - "договор купли-продажи недвижимости"
    - "договор купли-продажи квартиры"
    - "договор купли-продажи жилого дома"
    - "договор купли-продажи нежилого помещения"
    - "договор купли-продажи здания/сооружения"
    - "договор купли-продажи земельного участка"
    - "договор купли-продажи доли в праве собственности на недвижимость"
    - "договор купли-продажи общего имущества в МКД (подвал/чердак и т.п.)"
    - "договор продажи коммерческой недвижимости"
    - "договор продажи объекта незавершенного строительства"
    - "real estate purchase agreement"
    - "real property sale agreement"
    - "property transfer agreement"
    - "deed of sale"
    - "deed of conveyance"
    - "conveyance deed"
    - "transfer deed"
    - "land sale contract"
    - "condominium purchase agreement"
    - "purchase and sale agreement"
    - "PSA"
    - "agreement of purchase and sale"
    - "APS"
    - "sale of leasehold interest"
    - "escrow instructions"

