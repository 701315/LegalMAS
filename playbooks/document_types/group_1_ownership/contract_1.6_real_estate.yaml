      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора только сведения
        о распределении расходов по государственной регистрации перехода права,
        госпошлине и нотариальному оформлению между сторонами.

        Не анализируй цену, НДС, способ расчётов, обеспечительный платёж,
        ипотеку в силу закона, обременения, передачу объекта и иные темы.
        Не оценивай риски и не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. expense_allocation_status:
           - "defined" — если в тексте прямо указано, кто несёт расходы
             по регистрации, госпошлине или нотариальному оформлению;
           - "not_defined" — если такого указания нет или его нельзя
             надёжно определить.

        2. expense_allocation_details:
           Краткое user-facing описание распределения расходов.
           - Если прямо указано: верни summary, например:
             "Расходы по регистрации несёт Покупатель";
             "Госпошлина — Покупатель; нотариальные расходы — поровну".
           - При отсутствии данных: "Не установлены".
           - При конфликте: "Не удалось определить".
        </task>

        <context_rules>
        - Используй только текст договора.
        - Не считай обязанность подать документы на регистрацию распределением
          расходов, если в тексте не сказано, кто их несёт или оплачивает.
        - Не предполагай обычную практику вместо текста договора.
        - Не используй null, None или пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Всегда возвращай оба ключа.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не добавляй поле evidence.
        - Не добавляй другие ключи.
        - Верни ровно два ключа.
        - expense_allocation_status: только "defined" или "not_defined".
        - expense_allocation_details: конкретный текст либо
          "Не установлены" / "Не удалось определить".
        </output_expectations>

      fields:
        - name: "expense_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения распределения расходов на регистрацию."
          required: true
          display_in_grid: false

        - name: "expense_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на регистрацию"
          description: >
            Краткое user-facing описание распределения расходов по государственной
            регистрации, госпошлине и нотариальному оформлению.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: mortgage_by_law_check
    name: "Ипотека в силу закона (ст. 488 ГК РФ)"
    description: >
      Фактографическая проверка наличия и режима ипотеки в силу закона при
      рассрочке или отсрочке оплаты. Отдельный check, чтобы избежать смешения
      с коммерческими условиями расчётов и залоговым обременением.
      В DD Grid показывает только user-facing summary по режиму ипотеки
      и условиям её прекращения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ипотека в силу закона"
        - "в залоге у продавца"
        - "до полной оплаты"
        - "залог не возникает"
        - "право залога не применяется"
        - "ипотека в силу закона не возникает"
        - "рассрочка"
        - "отсрочка платежа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ипотек.*в\\s+силу\\s+закона"
        - "(?i)в\\s+залог(е|е\\s+у)\\s+продавц"
        - "(?i)до\\s+полной\\s+оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: ипотека в силу закона по ст. 488 ГК РФ —
        возникает ли она, прямо ли исключена и каковы условия её прекращения.
        Не анализируй способ расчётов, задаток, аванс, залог в пользу банка
        или обременения от третьих лиц.

        Нормативный ориентир:
        - п. 5 ст. 488 ГК РФ (ипотека в силу закона при рассрочке / отсрочке)
        - ФЗ-102 «Об ипотеке (залоге недвижимости)»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на режим ипотеки в силу закона.
        2. Каков этот режим: ипотека возникает / прямо исключена / не упомянута.
        3. Есть ли прямые условия прекращения / снятия ипотеки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для mortgage_by_law_regime используй только:
           - "arises" — если прямо указано, что ипотека в силу закона возникает
             или объект находится в залоге у продавца до полной оплаты;
           - "excluded" — если прямо указано, что ипотека в силу закона не возникает,
             исключена или право залога не применяется;
           - "not_addressed" — если рассрочка или отсрочка предусмотрена,
             но вопрос об ипотеке в силу закона прямо не урегулирован,
             либо если расчёты производятся в полном объёме в день подписания
             и вопрос об ипотеке не возникает;
           - "not_defined" — если вопрос прямо не следует из текста
             и нельзя надёжно определить режим.
        4. Для текстовых полей используй:
           - mortgage_by_law_details:
             "Не установлено" — если прямого указания нет;
             "Не удалось определить" — если данные противоречивы.
           - mortgage_termination_details:
             "Не применимо" — если ипотека прямо исключена
               или вопрос не применим к данной сделке;
             "Не установлены" — если ипотека возникает, но условия прекращения
               прямо не описаны;
             "Не удалось определить" — если данные противоречивы.
        5. Общие фразы вроде "объект передаётся свободным от обременений"
           без конкретизации ипотеки в силу закона не являются основанием
           для режима "excluded".
        6. Залог в пользу банка или третьих лиц — это не ипотека в силу закона;
           не смешивай эти понятия.
        7. Если в разных фрагментах есть несовместимые данные и конфликт нельзя
           снять по тексту:
           - status → "not_defined";
           - текстовое поле → "Не удалось определить".
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны договорились, что в соответствии с п. 5 ст. 488 ГК РФ право
        залога (ипотека в силу закона) у Продавца на Объект до его полной оплаты
        не возникает."

        Ответ:
        {
          "mortgage_by_law_status": "defined",
          "mortgage_by_law_regime": "excluded",
          "mortgage_by_law_details": "Ипотека в силу закона прямо исключена сторонами",
          "mortgage_termination_status": "not_defined",
          "mortgage_termination_details": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Стороны договорились, что в соответствии с п. 5 ст. 488 ГК РФ право залога (ипотека в силу закона) у Продавца на Объект до его полной оплаты не возникает."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "До момента полной оплаты Объект находится в залоге у Продавца.
        Продавец обязуется подать заявление о снятии обременения в течение
        3 рабочих дней после поступления последнего платежа."

        Ответ:
        {
          "mortgage_by_law_status": "defined",
          "mortgage_by_law_regime": "arises",
          "mortgage_by_law_details": "До полной оплаты объект находится в залоге у Продавца",
          "mortgage_termination_status": "defined",
          "mortgage_termination_details": "Продавец подаёт заявление о снятии обременения в течение 3 рабочих дней после последнего платежа",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "До момента полной оплаты Объект находится в залоге у Продавца. Продавец обязуется подать заявление о снятии обременения в течение 3 рабочих дней после поступления последнего платежа."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Оплата производится в рассрочку равными ежеквартальными платежами
        в течение 2 лет согласно Графику платежей (Приложение №2)."

        Ответ:
        {
          "mortgage_by_law_status": "not_defined",
          "mortgage_by_law_regime": "not_addressed",
          "mortgage_by_law_details": "Рассрочка предусмотрена; вопрос об ипотеке в силу закона прямо не урегулирован",
          "mortgage_termination_status": "not_defined",
          "mortgage_termination_details": "Не установлены",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Оплата производится в рассрочку равными ежеквартальными платежами в течение 2 лет согласно Графику платежей (Приложение №2)."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Покупатель оплачивает цену объекта в полном объёме в день подписания договора."

        Ответ:
        {
          "mortgage_by_law_status": "not_defined",
          "mortgage_by_law_regime": "not_addressed",
          "mortgage_by_law_details": "Расчёты в день подписания; вопрос об ипотеке в силу закона не применим",
          "mortgage_termination_status": "not_defined",
          "mortgage_termination_details": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Покупатель оплачивает цену объекта в полном объёме в день подписания договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание ипотеки в силу закона или залога у продавца?
        2. Прямо ли написано "возникает" или "не возникает"?
        3. Предусмотрена ли рассрочка / отсрочка без явного регулирования ипотеки
           в силу закона? Тогда → "not_addressed".
        4. Расчёты в день подписания в полном объёме без рассрочки?
           Тогда → "not_addressed", mortgage_termination_details → "Не применимо".
        5. Ипотека прямо исключена? Тогда mortgage_termination_details → "Не применимо".
        6. Ипотека возникает, но условия снятия прямо не описаны?
           Тогда mortgage_termination_details → "Не установлены".
        7. Не смешивай ипотеку в силу закона с залогом в пользу банка
           или обременениями от третьих лиц.
        8. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

