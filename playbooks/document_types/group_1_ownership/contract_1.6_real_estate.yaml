        - "(?i)средств(а|ами)\\s+МСК"
        - "(?i)выделени(е|я)\\s+дол(ей|и)\\s+(детям|членам\\s+семьи)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (ст. 35 СК РФ; ст. 292 ГК РФ;
        ФЗ-48; ст. 10 ФЗ-256).
        Проверяется только один вопрос: три семейных риска —
        согласие супруга, маткапитал, разрешение органов опеки.
        Не анализируй перечень прописанных лиц по ст. 558 ГК — это отдельный check.
        Не анализируй цену, расчёты, обременения или передачу объекта.

        [ЗАДАЧА]
        Найди в тексте договора:
        БЛОК А — СУПРУГ:
        1. Нотариальное согласие супруга или заверение об отсутствии брака.
        2. Ссылку на брачный договор.

        БЛОК Б — МАТКАПИТАЛ:
        3. Заверение о неиспользовании маткапитала.
        4. Если использован — выделены ли доли всем членам семьи.

        БЛОК В — ОПЕКА:
        5. Наличие несовершеннолетних/недееспособных, чьи права затронуты.
        6. Разрешение органа опеки.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "not_addressed".
        3. matcapital_regime = "not_addressed" если маткапитал вообще не упомянут.
        4. В evidence — только текст договора.
        5. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Продавец в браке не состоит.
        Маткапитал не использовался.
        Несовершеннолетних детей, чьи права затронуты, нет."
        Ответ:
        {
          "spousal_consent_status": "defined",
          "spousal_consent_regime": "not_married_confirmed",
          "spousal_consent_details": "в браке не состоит",
          "matcapital_status": "defined",
          "matcapital_regime": "yes_not_used",
          "matcapital_details": "маткапитал не использовался",
          "shares_allocated_status": "not_defined",
          "shares_allocated": "not_applicable",
          "shares_allocated_details": "Данные не определены",
          "minor_protected_status": "defined",
          "minor_protected_details": "несовершеннолетних детей нет",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Данные не определены",
          "evidence": [{"clause_ref": "п. 4.3", "quote": "..."}]
        }

        Пример 2:
        "Продавец вправе продать объект."
        Ответ:
        {
          "spousal_consent_status": "not_defined",
          "spousal_consent_regime": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "matcapital_status": "not_defined",
          "matcapital_regime": "not_addressed",
          "matcapital_details": "Данные не определены",
          "shares_allocated_status": "not_defined",
          "shares_allocated": "not_defined",
          "shares_allocated_details": "Данные не определены",
          "minor_protected_status": "not_defined",
          "minor_protected_details": "Данные не определены",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        БЛОК А: брак — прямо?
        БЛОК Б: маткапитал — упомянут? Если нет — not_addressed (критично!).
        БЛОК В: несовершеннолетние — упомянуты? Опека — прямо?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_regime": "<consent_present / not_married_confirmed / prenuptial_referenced / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "matcapital_status": "<defined / not_defined>",
          "matcapital_regime": "<yes_not_used / yes_used_and_complied / not_addressed / not_defined>",
          "matcapital_details": "<текст или 'Данные не определены'>",
          "shares_allocated_status": "<defined / not_defined>",
          "shares_allocated": "<yes / no / not_applicable / not_defined>",
          "shares_allocated_details": "<текст или 'Данные не определены'>",
          "minor_protected_status": "<defined / not_defined>",
          "minor_protected_details": "<текст или 'Данные не определены'>",
          "guardianship_consent_status": "<defined / not_defined>",
          "guardianship_consent_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
