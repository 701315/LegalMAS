      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Единство судьбы земли и строения
  # ──────────────────────────────────────────────────────────────────────────
  - id: land_building_unity_check
    name: "Единство судьбы земли и строения (ст. 552 ГК РФ, ст. 35 ЗК РФ)"
    description: >
      Фактографическая проверка передачи прав на земельный участок вместе со зданием.
    triggers:
      any: ["building_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вместе с земельным участком"
        - "право аренды земельного участка"
        - "переходит вместе со зданием"
        - "права на землю"
        - "земельный участок под зданием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)земельн.*участ.*(переходит|передается).*вместе"
        - "(?i)вместе.*со.*здани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи здания/сооружения (ст. 552 ГК РФ; ст. 35 ЗК РФ).
        Проверяется передача прав на земельный участок вместе со зданием.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид передаваемых прав на земельный участок (собственность / аренда).
        2. Кадастровый номер участка под зданием.
        3. Площадь участка под зданием.
        4. Необходимость согласия арендодателя (при аренде участка).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написано о передаче прав на землю?
        2. Какой вид прав — собственность или аренда?
        3. Указан ли кадастровый номер участка?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "land_rights_transfer_status": "<defined / not_defined>",
          "land_rights_transfer": "<ownership / lease / not_defined>",
          "land_cadastral_number_status": "<defined / not_defined>",
          "land_cadastral_number": "<номер или 'Данные не определены'>",
          "land_area_status": "<defined / not_defined>",
          "land_area": "<площадь или 'Данные не определены'>",
          "lease_consent_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "земельный участок"
        - "права на землю"
        - "переходит вместе"
        - "ст. 552 ГК РФ"
        - "право аренды участка"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "land_rights_transfer_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если вид передаваемых прав на землю прямо определён. Иначе 'not_defined'."
        - name: "land_rights_transfer"
          type: "string"
          allowed_values: ["ownership", "lease", "not_defined"]
          description: "Вид передаваемых прав на участок."
        - name: "land_cadastral_number_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если кадастровый номер участка прямо указан. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 15: Маткапитал
  # ──────────────────────────────────────────────────────────────────────────
  - id: maternity_capital_risk_check
    name: "Маткапитал: риск невыделения долей детям и заверения продавца (ст. 10 ФЗ-256)"
    description: >
      Фактографическая проверка наличия заверения о маткапитале или
      подтверждения выделения долей — один из самых частых рисков при вторичной продаже жилья.
    triggers:
      any: ["maternity_capital", "residential_property", "individual_party"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "материнский капитал"
        - "маткапитал"
        - "средства МСК"
        - "Пенсионный фонд"
        - "сертификат"
        - "обязательство о наделении долями"
        - "выделение долей детям"
        - "не использовались средства маткапитала"
        - "ФЗ-256"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материнск(ий|ого)\\s+капитал"
        - "(?i)средств(а|ами)\\s+МСК"
        - "(?i)выделени(е|я)\\s+дол(ей|и)\\s+(детям|членам\\s+семьи)"
        - "(?i)не\\s+использовал(ись|ся).*маткапитал"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи жилой недвижимости (ст. 10 ФЗ-256).
        КРИТИЧЕСКИ ВАЖНО: это один из самых частых рисков при покупке вторичного жилья.
        Проверяется вопрос использования маткапитала продавцом.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение о том, что маткапитал НЕ использовался.
        2. Если использовался — подтверждение выделения долей всем членам семьи.
        3. Ссылку на ФЗ-256 или Социальный/Пенсионный фонд.
        4. Наличие несовершеннолетних, чьи права могут быть затронуты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если вопрос маткапитала вообще не упомянут — "not_addressed" (критический риск!).
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец гарантирует, что средства материнского (семейного) капитала
        при приобретении объекта не использовались."

        Ответ:
        {
          "matcapital_status": "defined",
          "matcapital_regime": "yes_not_used",
          "matcapital_details": "средства МСК не использовались",
          "shares_allocated_status": "not_defined",
          "shares_allocated": "not_applicable",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Продавец гарантирует, что средства материнского (семейного) капитала при приобретении объекта не использовались."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец продаёт квартиру."

        Ответ:
        {
          "matcapital_status": "not_defined",
          "matcapital_regime": "not_addressed",
          "matcapital_details": "Данные не определены",
          "shares_allocated_status": "not_defined",
          "shares_allocated": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли слово "маткапитал" или "МСК" или "материнский капитал"?
        2. Если есть — что написано: не использовался / использовался и доли выделены?
        3. Если вопрос вообще не упомянут — regime = "not_addressed" (это КРИТИЧНО).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "matcapital_status": "<defined / not_defined>",
          "matcapital_regime": "<yes_not_used / yes_used_and_complied / not_addressed / not_defined>",
          "matcapital_details": "<текст или 'Данные не определены'>",
          "shares_allocated_status": "<defined / not_defined>",
          "shares_allocated": "<yes / no / not_applicable / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "материнский капитал"
        - "маткапитал"
        - "выделение долей"
        - "ФЗ-256"
        - "Пенсионный фонд"
        - "Социальный фонд"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "matcapital_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если вопрос маткапитала прямо раскрыт. Иначе 'not_defined'."
        - name: "matcapital_regime"
          type: "string"
          allowed_values: ["yes_not_used", "yes_used_and_complied", "not_addressed", "not_defined"]
          description: "Статус маткапитала: не использовался / использован и доли выделены / не упомянут (риск!) / нет данных."
        - name: "shares_allocated_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если вопрос выделения долей прямо раскрыт. Иначе 'not_defined'."
        - name: "shares_allocated"
          type: "string"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Выделены ли доли членам семьи."
      store_payload: true

