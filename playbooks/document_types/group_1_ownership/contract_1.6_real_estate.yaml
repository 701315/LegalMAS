             "Инженерный сервитут в пользу электросетевой компании";
           - если прямо указано отсутствие коммуникаций / сервитутов, верни краткое summary,
             например: "Инженерные сервитуты и коммуникации третьих лиц отсутствуют";
           - если параметр определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно ГПЗУ от 20.02.2026",
             "Согласно Приложению №2";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. redevelopment_status:
           - "defined" — если в тексте прямо есть раскрытие, заверение или прямая ссылка
             на названный внешний документ по перепланировкам или реконструкции объекта;
           - "not_defined" — если по теме перепланировок нет прямого указания
             или его нельзя надёжно определить.

        10. redevelopment_details:
            Краткое user-facing описание по перепланировкам и реконструкции
            на русском языке.
            Правила:
            - если прямо указано, что перепланировок не проводилось, верни краткое summary,
              например: "Перепланировок и реконструкций не проводилось";
            - если прямо раскрыта согласованная перепланировка, кратко отрази суть,
              например:
              "Перепланировка согласована, разрешение Мосжилинспекции от 15.03.2024";
            - если прямо раскрыта самовольная перепланировка, кратко отрази суть,
              например:
              "Самовольная перепланировка; легализация не произведена";
            - если параметр определяется по названному внешнему документу,
              верни понятную формулировку, например:
              "Согласно техническому паспорту от 10.01.2026";
            - не копируй длинные абзацы;
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
