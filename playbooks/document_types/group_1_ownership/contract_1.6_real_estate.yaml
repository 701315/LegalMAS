# ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Расторжение договора и уступка прав
  # ──────────────────────────────────────────────────────────────────────────
  - id: contract_lifecycle_check
    name: "Расторжение, последствия и ограничения уступки прав"
    description: >
      Фактографическая проверка оснований и последствий расторжения договора,
      возврата денежных средств и ограничений на уступку прав требования.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат денежных средств"
        - "неустойка"
        - "штраф"
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)возврат.*денежн"
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)одностороннем\\s+порядке"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (ст. 453 ГК РФ).
        Проверяется только один вопрос: основания и последствия расторжения,
        возврат денег и ограничения уступки прав.
        Не анализируй подсудность, налоги, риск гибели или страхование.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения.
        2. Последствия расторжения и возврат денежных средств.
        3. Ограничения на уступку прав.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только JSON.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Основания — перечислены конкретно?
        2. Последствия — что происходит с деньгами?
        3. Уступка — запрет / только с согласия / свободна?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<основания или 'Данные не определены'>",
          "termination_consequences_status": "<defined / not_defined>",
          "termination_consequences_details": "<последствия или 'Данные не определены'>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "assignment_restriction_details": "<условие или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_query: "расторжение отказ от договора возврат денежных средств неустойка штраф уступка переуступка перевод долга без согласия с согласия другой стороны одностороннее расторжение последствия расторжения"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "отказ в регистрации"
        - "приостановка регистрации"
        - "срок закрытия"
        - "передаточный акт"
        - "условие закрытия"
        - "ипотека в силу закона"
        - "не обременен"
        - "банкротство"
        - "риск гибели"
        - "страхование"
        - "подсудность"
        - "согласие супруга"
        - "маткапитал"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 420
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора купли-продажи недвижимости основания
        расторжения, последствия расторжения с возвратом денег и ограничения уступки прав.
        Не анализируй подсудность, налоги, риск гибели, страхование, обременения
        или передачу объекта.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. termination_grounds_status — "defined" или "not_defined".
        2. termination_grounds_details — основания расторжения.
        3. termination_consequences_status — "defined" или "not_defined".
        4. termination_consequences_details — последствия, включая возврат денег.
        5. assignment_restriction_status — "defined" или "not_defined".
        6. assignment_restriction — prohibited / allowed_with_consent / allowed / not_defined.
        7. assignment_restriction_details — условие об уступке.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения."
        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "Основания расторжения договора."
        - name: "termination_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий расторжения."
        - name: "termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: "Последствия расторжения, включая возврат денег."
        - name: "assignment_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничений уступки."
        - name: "assignment_restriction"
          type: "string"
          presentation: "signal"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          description: "Режим уступки прав."
        - name: "assignment_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Уступка прав"
          description: "Условие об уступке прав."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Сохранность актива, налоги и подсудность
  # ──────────────────────────────────────────────────────────────────────────
  - id: asset_protection_taxes_check
    name: "Риск гибели, страхование, налоги и подсудность"
    description: >
      Фактографическая проверка распределения риска случайной гибели объекта,
      условий страхования, налоговой оговорки и корректности подсудности по спорам
      о недвижимости (ст. 30 ГПК РФ).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "до регистрации"
        - "страхование"
        - "страховой полис"
        - "подсудность"
        - "арбитражный суд"
        - "суд общей юрисдикции"
        - "по месту нахождения объекта"
        - "НДС"
        - "кадастровая стоимость"
        - "налог на доход"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"
        - "(?i)страхов(ание|ой\\s+полис)"
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)по\\s+месту\\s+нахождения\\s+объект"
        - "(?i)\\bНДС\\b|кадастровая\\s+стоимость"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (ст. 459 ГК РФ; ст. 30 ГПК РФ).
        Проверяется только один вопрос: распределение риска гибели, страхование,
        налоговая оговорка и корректность подсудности.
        Не анализируй расторжение, уступку, обременения или семейные риски.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт риск случайной гибели до регистрации.
        2. Условие страхования объекта.
        3. Налоговую оговорку (НДС, кадастровая стоимость).
        4. Подсудность и её соответствие ст. 30 ГПК РФ (по месту объекта).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "Данные не определены".
        3. jurisdiction_correct = "yes" только если подсудность по месту объекта.
        4. jurisdiction_correct = "no" если указан иной суд.
        5. В evidence — только текст договора.
        6. Верни только JSON.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Риск — прямо указано, кто несёт?
        2. Страхование — обязанность прямо установлена?
        3. НДС — явно включён или не включён?
        4. Суд — по месту объекта или иной?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_of_loss_status": "<defined / not_defined>",
          "risk_of_loss_details": "<кто несёт или 'Данные не определены'>",
          "insurance_status": "<defined / not_defined>",
          "insurance_details": "<условие или 'Данные не определены'>",
          "tax_clause_status": "<defined / not_defined>",
          "tax_clause_details": "<текст или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<суд или 'Данные не определены'>",
          "jurisdiction_correct": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_query: "риск случайной гибели риск случайного повреждения до регистрации страхование страховой полис подсудность арбитражный суд суд общей юрисдикции по месту нахождения объекта НДС кадастровая стоимость налог на доход"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - limitations
      negative_keywords:
        - "не обременен"
        - "залог"
        - "арест"
        - "аренда"
        - "задолженность по ЖКУ"
        - "банкротство"
        - "задаток"
        - "аванс"
        - "аккредитив"
        - "ипотека в силу закона"
        - "передаточный акт"
        - "расторжение"
        - "уступка"
        - "согласие супруга"
        - "маткапитал"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "boilerplate"
        - "limitations"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 440
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора купли-продажи недвижимости сведения
        о риске случайной гибели, страховании, налоговой оговорке и подсудности.
        Не анализируй расторжение, уступку, обременения, семейные риски или расчёты.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. risk_of_loss_status — "defined" или "not_defined".
        2. risk_of_loss_details — кто несёт риск до регистрации.
        3. insurance_status — "defined" или "not_defined".
        4. insurance_details — условие страхования.
        5. tax_clause_status — "defined" или "not_defined".
        6. tax_clause_details — налоговая оговорка.
        7. jurisdiction_status — "defined" или "not_defined".
        8. jurisdiction_details — суд или форум.
        9. jurisdiction_correct — yes / no / not_defined.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - jurisdiction_correct = "yes" только если подсудность по месту объекта.
        - jurisdiction_correct = "no" если прямо указан иной суд.
        - Верни только JSON.
        </rules>
      fields:
        - name: "risk_of_loss_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус риска случайной гибели."
        - name: "risk_of_loss_details"
          type: "string"
          presentation: "fact"
          label: "Риск случайной гибели"
          description: "Кто несёт риск до регистрации перехода права."
        - name: "insurance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус страхования объекта."
        - name: "insurance_details"
          type: "string"
          presentation: "fact"
          label: "Страхование"
          description: "Условие страхования объекта."
        - name: "tax_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус налоговой оговорки."
        - name: "tax_clause_details"
          type: "string"
          presentation: "fact"
          label: "Налоговая оговорка"
          description: "НДС, кадастровая стоимость и иные налоговые условия."
        - name: "jurisdiction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подсудности."
        - name: "jurisdiction_details"
          type: "string"
          presentation: "fact"
          label: "Подсудность"
          description: "Суд или форум разрешения споров."
        - name: "jurisdiction_correct"
          type: "string"
          presentation: "diagnostic"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Маркер корректности подсудности по ст. 30 ГПК РФ."
      store_payload: true


