        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, ФЗ-218, практику Росреестра, обычную практику
          или предположения вместо текста договора.
        - Не смешивай условия закрытия и передачи объекта с ценой, расчётами,
          обременениями, ипотекой в силу закона, банкротством продавца,
          семейными согласиями и иными нерелевантными темами.
        - Различай три события: подача на регистрацию / государственная регистрация
          в ЕГРН / подписание передаточного акта. Не смешивай их.
        - Дата государственной регистрации в ЕГРН определяется Росреестром
          (5–9 рабочих дней); она не является closing_date — не путай.
        - Для conditions_precedent ищи российские конструкции:
          "при условии", "после предоставления", "до регистрации",
          "обязательства наступают при", "при наличии", отлагательные условия.
        - Для deregistration_details — только выписка прописанных лиц;
          не путай со снятием ипотечного обременения в ЕГРН.
        - Если прямо указан срок, после которого сторона вправе выйти из сделки
          при незакрытии — фиксируй как longstop_date, даже если термин не используется.
        - Если параметр прямо определяется по названному внешнему документу
          (графику, приложению), отрази это в user-facing поле.
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 16 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          closing_date_details → "Не установлен"
          longstop_date_details → "Не установлен"
          conditions_precedent_details → "Не установлены"
          transfer_act_details → "Не установлено"
          possession_delivery_details → "Не установлено"
          deregistration_details → "Не установлено" или "Не применимо"
          registration_refusal_details → "Не установлены"
          technical_docs_details → "Не установлены"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "closing_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока подачи документов на регистрацию."
          required: true
          display_in_grid: false

        - name: "closing_date_details"
          type: "string"
          presentation: "fact"
          label: "Срок подачи на регистрацию"
          description: >
            Краткое user-facing описание срока подачи документов на
            государственную регистрацию перехода права.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
