              "quote": "Продавец — Иванов Иван Иванович, паспорт серии 45 01 № 111111. Покупатель — Петров Петр Петрович, паспорт серии 45 02 № 222222."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Настоящий договор заключен между продавцом и покупателем."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details_value": "Не установлены",
          "seller_display": "Не установлен",
          "seller_type": "not_defined",
          "seller_signatory": "Не установлен",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Не установлены",
          "buyer_display": "Не установлен",
          "buyer_type": "not_defined",
          "buyer_signatory": "Не установлен",
          "buyer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        Пример 4:
        Фрагмент:
        "Стороны подтверждают наличие всех необходимых полномочий и соблюдение требований законодательства."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details_value": "Не установлены",
          "seller_display": "Не установлен",
          "seller_type": "not_defined",
          "seller_signatory": "Не установлен",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Не установлены",
          "buyer_display": "Не установлен",
          "buyer_type": "not_defined",
          "buyer_signatory": "Не установлен",
          "buyer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую формулировку о Продавце.
        2. Найди прямую формулировку о Покупателе.
        3. Найди прямую формулировку о подписанте и основании полномочий по каждой стороне.
        4. Найди прямую формулировку о корпоративном одобрении или о том, что оно не требуется.
        5. Если сторона прямо не определена — используй fallback, а не пустоту.
        6. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "seller_details_status": "<defined / not_defined>",
          "seller_details_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "seller_display": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "seller_type": "<legal_entity / individual / ip / not_defined>",
          "seller_signatory": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "seller_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details_value": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "buyer_display": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "buyer_type": "<legal_entity / individual / ip / not_defined>",
          "buyer_signatory": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "buyer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "продавец покупатель именуем в лице действующего на основании ИНН ОГРН устава доверенности паспорт гражданин физическое лицо крупная сделка сделка с заинтересованностью одобрение общего собрания совета директоров корпоративное одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
