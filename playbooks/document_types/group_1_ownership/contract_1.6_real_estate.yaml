          required: false
          display_in_grid: false

      store_payload: true

  - id: contract_lifecycle_check
    name: "Расторжение, последствия и ограничения уступки прав"
    description: >
      Фактографическая проверка оснований и последствий расторжения договора,
      возврата денежных средств и ограничений на уступку прав требования.
      Содержит real-estate-specific основания и структуру возврата с задатком.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат денежных средств"
        - "неустойка"
        - "штраф"
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
        - "задаток"
        - "двойной задаток"
        - "возврат задатка"
        - "одностороннее расторжение"
        - "отказ от регистрации"
        - "приостановка по вине"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)возврат.*денежн"
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)одностороннем\\s+порядке"
        - "(?i)двойн(ой|ого)\\s+задаток"
        - "(?i)переуступк(а|и)\\s+до\\s+регистрац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: основания и последствия расторжения
        договора, возврат денежных средств и ограничения уступки прав.
        Не анализируй подсудность, налоги, риск гибели, страхование,
        обременения или передачу объекта.

        Нормативный ориентир:
        - ст. 453 ГК РФ (последствия расторжения)
        - ст. 380–381 ГК РФ (задаток)
        - ст. 382–389 ГК РФ (уступка прав)

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения договора или одностороннего отказа.
        2. Последствия расторжения и порядок возврата денежных средств.
        3. Ограничения на уступку прав требования или перевод долга.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для termination_grounds_details учитывай real-estate-specific основания:
           - нарушение Продавцом срока подачи на регистрацию;
           - нарушение Продавцом срока освобождения объекта;
           - отказ в государственной регистрации по вине Продавца;
           - непредоставление Продавцом документов, необходимых для регистрации;
           - наличие незаявленных обременений или прав третьих лиц;
           - ненадлежащее техническое состояние объекта при передаче.
           Это не исчерпывающий перечень; фиксируй только то, что прямо указано.
        4. Для termination_consequences_details учитывай:
           - если последствия прямо дифференцированы по виновной стороне,
             кратко отрази оба сценария через "; ";
           - для задатка: при вине Покупателя — задаток не возвращается;
             при вине Продавца — возврат в двойном размере (ст. 381 ГК РФ);
             если это прямо написано, зафиксируй;
           - если указан срок возврата — включи его в summary;
           - если последствия одинаковы для обеих сторон — опиши один раз.
        5. Если расторжение допускается только по соглашению сторон и последствия
           прямо не урегулированы, используй:
           - termination_grounds_details = "По соглашению сторон";
           - termination_consequences_status = "not_defined";
           - termination_consequences_details = "Не установлены".
        6. Для assignment_restriction_code:
           - "prohibited" — уступка прямо запрещена;
           - "allowed_with_consent" — уступка допускается только с согласия
             другой стороны;
           - "allowed" — уступка прямо допускается без согласия;
           - "not_defined" — режим уступки прямо не урегулирован.
        7. Для assignment_restriction_details учитывай real-estate-specific кейс:
           переуступка прав Покупателя третьему лицу до государственной регистрации
           перехода права — это отдельный сценарий; если он прямо урегулирован,
           отрази это в summary.
        8. Для текстовых полей используй:
           - "Не установлены" — для termination_grounds_details,
             termination_consequences_details;
           - "Не установлен" — для assignment_restriction_details;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель вправе расторгнуть договор в одностороннем порядке при нарушении
        Продавцом срока освобождения объекта более чем на 14 дней, а также при
        выявлении незаявленных обременений. При расторжении по вине Продавца —
        возврат задатка в двойном размере в течение 5 рабочих дней. При отказе
        Покупателя — задаток не возвращается. Уступка прав по договору допускается
        только с письменного согласия Продавца."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "Нарушение Продавцом срока освобождения более 14 дней; выявление незаявленных обременений",
          "termination_consequences_status": "defined",
          "termination_consequences_details": "При вине Продавца — двойной задаток в течение 5 рабочих дней; при отказе Покупателя — задаток не возвращается",
          "assignment_restriction_status": "defined",
          "assignment_restriction_code": "allowed_with_consent",
          "assignment_restriction_details": "Допускается только с письменного согласия Продавца",
          "evidence": [
            {
              "clause_ref": "п. 7.1–7.3",
              "quote": "Покупатель вправе расторгнуть договор в одностороннем порядке при нарушении Продавцом срока освобождения объекта более чем на 14 дней, а также при выявлении незаявленных обременений. При расторжении по вине Продавца — возврат задатка в двойном размере в течение 5 рабочих дней. При отказе Покупателя — задаток не возвращается. Уступка прав по договору допускается только с письменного согласия Продавца."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон. Уступка прав
        Покупателем третьему лицу до государственной регистрации перехода права
        не допускается."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "По соглашению сторон",
          "termination_consequences_status": "not_defined",
          "termination_consequences_details": "Не установлены",
          "assignment_restriction_status": "defined",
          "assignment_restriction_code": "prohibited",
          "assignment_restriction_details": "Уступка Покупателем до государственной регистрации перехода права не допускается",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Договор может быть расторгнут по соглашению сторон. Уступка прав Покупателем третьему лицу до государственной регистрации перехода права не допускается."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец передаёт объект покупателю."

        Ответ:
        {
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Не установлены",
          "termination_consequences_status": "not_defined",
          "termination_consequences_details": "Не установлены",
          "assignment_restriction_status": "not_defined",
          "assignment_restriction_code": "not_defined",
          "assignment_restriction_details": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямые основания расторжения или одностороннего отказа?
           Учитывай real-estate-specific основания.
        2. Есть ли прямые последствия расторжения?
           Дифференцированы ли они по виновной стороне?
           Есть ли задаток / двойной задаток / срок возврата?
        3. Есть ли прямое регулирование уступки прав?
           Учитывай переуступку до регистрации как отдельный кейс.
        4. Если расторжение только по соглашению без конкретизации последствий —
           termination_consequences → "not_defined" / "Не установлены".
        5. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "termination_consequences_status": "<defined / not_defined>",
          "termination_consequences_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction_code": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "assignment_restriction_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение отказ от договора возврат денежных средств неустойка штраф задаток двойной задаток уступка переуступка перевод долга без согласия с согласия другой стороны одностороннее расторжение последствия расторжения переуступка до регистрации"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "отказ в регистрации"
        - "приостановка регистрации"
        - "срок закрытия"
        - "передаточный акт"
        - "условие закрытия"
        - "ипотека в силу закона"
        - "не обременен"
        - "банкротство"
        - "риск гибели"
        - "страхование"
        - "подсудность"
        - "согласие супруга"
        - "маткапитал"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только об основаниях и последствиях расторжения договора купли-продажи
        недвижимости, возврате денежных средств и ограничениях уступки прав.
        Не анализируй подсудность, налоги, риск гибели, страхование, обременения,
        передачу объекта и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_grounds_status:
           - "defined" — если в тексте прямо указаны основания расторжения
             или одностороннего отказа от договора;
           - "not_defined" — если основания прямо не указаны
             или их нельзя надёжно определить.

        2. termination_grounds_details:
           Краткое user-facing описание оснований расторжения на русском языке.
           Правила:
           - если основания прямо перечислены, верни краткое summary, например:
             "Нарушение Продавцом срока освобождения более 14 дней;
             выявление незаявленных обременений",
             "По соглашению сторон",
             "Нарушение срока подачи на регистрацию по вине любой из сторон";
           - учитывай real-estate-specific основания:
             нарушение срока подачи на регистрацию, нарушение срока освобождения,
             отказ в регистрации по вине продавца, непредоставление документов,
             незаявленные обременения, ненадлежащее состояние объекта при передаче;
           - перечисляй через "; ";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. termination_consequences_status:
           - "defined" — если в тексте прямо указаны последствия расторжения
             или порядок возврата денежных средств;
           - "not_defined" — если последствия прямо не указаны
             или их нельзя надёжно определить.
           Правило: если расторжение допускается только по соглашению сторон
           и последствия прямо не урегулированы — "not_defined".

        4. termination_consequences_details:
           Краткое user-facing описание последствий расторжения на русском языке.
           Правила:
           - если последствия дифференцированы по виновной стороне,
             кратко отрази оба сценария через "; ", например:
             "При вине Продавца — двойной задаток в течение 5 рабочих дней;
             при отказе Покупателя — задаток не возвращается";
           - если последствия одинаковы для обеих сторон, опиши один раз,
             например:
             "Возврат уплаченных средств в течение 10 рабочих дней";
           - если указан срок возврата — включи его в summary;
           - если условий возврата нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. assignment_restriction_status:
           - "defined" — если в тексте прямо урегулирован режим уступки прав
             требования или перевода долга;
           - "not_defined" — если режим уступки прямо не урегулирован
             или его нельзя надёжно определить.

        6. assignment_restriction_code:
           Используй только одно из значений:
           - "prohibited" — уступка прямо запрещена;
           - "allowed_with_consent" — уступка допускается только с согласия
             другой стороны;
           - "allowed" — уступка прямо допускается без согласия;
           - "not_defined" — режим уступки прямо не урегулирован.

        7. assignment_restriction_details:
           Краткое user-facing описание режима уступки прав на русском языке.
           Правила:
           - верни понятное summary, например:
             "Уступка запрещена",
             "Допускается только с письменного согласия Продавца",
             "Допускается без согласия другой стороны",
             "Уступка Покупателем до государственной регистрации перехода права
             не допускается";
           - если урегулирована переуступка до регистрации как отдельный кейс,
             отрази это явно;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, судебную практику, обычную практику
          или предположения вместо текста договора.
        - Не смешивай расторжение и уступку прав с подсудностью, налогами,
          риском гибели, страхованием, обременениями, передачей объекта,
          ипотекой в силу закона и иными нерелевантными темами.
        - Для termination_grounds_details учитывай real-estate-specific основания:
          нарушение срока подачи на регистрацию, нарушение срока освобождения,
          отказ в регистрации по вине продавца, непредоставление документов,
          незаявленные обременения, ненадлежащее состояние объекта при передаче.
          Фиксируй только то, что прямо указано в тексте договора.
        - Для termination_consequences_details:
          * если последствия дифференцированы по стороне — отрази оба сценария;
          * для задатка: при вине Покупателя — не возвращается;
            при вине Продавца — двойной размер; фиксируй только если прямо написано;
          * если расторжение только по соглашению и последствия прямо не описаны —
            termination_consequences_status → "not_defined",
            termination_consequences_details → "Не установлены".
        - Для assignment_restriction_details:
          * переуступка прав Покупателем третьему лицу до государственной регистрации
            перехода права — реальный real estate кейс; если урегулирован,
            отрази явно.
        - Для assignment_restriction_code используй только:
          "prohibited", "allowed_with_consent", "allowed", "not_defined".
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 7 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для assignment_restriction_code используй только:
          "prohibited", "allowed_with_consent", "allowed", "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          termination_grounds_details → "Не установлены"
          termination_consequences_details → "Не установлены"
          assignment_restriction_details → "Не установлен"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения договора."
          required: true
          display_in_grid: false

        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: >
            Краткое user-facing summary оснований расторжения или одностороннего
            отказа от договора, включая real-estate-specific основания.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "termination_consequences_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий расторжения договора."
          required: true
          display_in_grid: false

        - name: "termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: >
            Краткое user-facing summary последствий расторжения, включая возврат
            цены, задатка / двойного задатка, срок возврата и дифференциацию
            по виновной стороне.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "assignment_restriction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус регулирования уступки прав."
          required: true
          display_in_grid: false

        - name: "assignment_restriction_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          description: "Режим уступки прав требования."
          required: true
          display_in_grid: false

        - name: "assignment_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Уступка прав"
          description: >
            Краткое user-facing summary режима уступки прав требования, включая
            запрет, согласие, свободную уступку или переуступку до регистрации.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: asset_protection_taxes_check
    name: "Риск случайной гибели и страхование объекта"
    description: >
      Фактографическая проверка распределения риска случайной гибели объекта
      и условий страхования. Налоговая оговорка проверяется в CHECK 6
      (commercial_payment_terms_check).
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "до регистрации"
        - "после регистрации"
        - "момент передачи"
        - "передача объекта"
        - "страхование"
        - "страховой полис"
        - "страхование титула"
        - "страхование ответственности"
        - "обязан застраховать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"
        - "(?i)страхов(ание|ой\\s+полис|ания\\s+титул)"
        - "(?i)обязан.*застрахов"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: распределение риска случайной гибели
        или повреждения объекта и условия страхования.
        Не анализируй расторжение, уступку, обременения, налоговые оговорки,
        семейные риски или расчёты.

        Нормативный ориентир:
        - ст. 459 ГК РФ (риск случайной гибели при купле-продаже)
        - ст. 551 ГК РФ (регистрация перехода права)

        [ВАЖНО — ПРАКТИКА ПО РИСКУ ГИБЕЛИ ПРИ КУПЛЕ-ПРОДАЖЕ НЕДВИЖИМОСТИ]
        В российской практике купли-продажи недвижимости момент перехода риска
        гибели и момент перехода права собственности могут не совпадать.
        По умолчанию по ст. 459 ГК РФ риск переходит с момента передачи
        объекта покупателю. Но договор может это менять.
        Различай три разных момента, которые договор может указывать:
        1. До подписания передаточного акта / передачи ключей.
        2. В период между подписанием акта и государственной регистрацией.
        3. После государственной регистрации перехода права.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт риск случайной гибели / повреждения объекта и с какого момента.
        2. Условия страхования объекта.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Если в договоре прямо не указано распределение риска гибели,
           используй status = "not_defined" и details = "Не установлено".
           Не домысливай из ст. 459 ГК РФ.
        4. Для risk_of_loss_details важно не только кто несёт риск,
           но и с какого момента:
           - до передачи объекта / подписания акта;
           - в период между подписанием акта и регистрацией;
           - после государственной регистрации.
           Если момент прямо указан — включи его в summary.
        5. Для insurance_details учитывай:
           - обязательное страхование объекта (имущественное);
           - страхование титула;
           - страхование ответственности;
           - прямое указание на отсутствие обязанности страховать.
           Если вид страхования прямо назван — включи его в summary.
        6. Для текстовых полей используй:
           - "Не установлено" — если данных нет;
           - "Не удалось определить" — если данные противоречивы.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "До момента государственной регистрации перехода права собственности
        риск случайной гибели и случайного повреждения объекта несёт Продавец.
        После регистрации риск переходит к Покупателю. Покупатель обязан
        застраховать объект от рисков гибели и повреждения в течение 5 рабочих дней
        с даты регистрации перехода права на сумму не менее цены договора."

        Ответ:
        {
          "risk_of_loss_status": "defined",
          "risk_of_loss_details": "До государственной регистрации — несёт Продавец; после регистрации — переходит к Покупателю",
          "insurance_status": "defined",
          "insurance_details": "Покупатель обязан застраховать объект от гибели и повреждения в течение 5 рабочих дней с даты регистрации на сумму не менее цены договора",
          "evidence": [
            {
              "clause_ref": "п. 6.1–6.2",
              "quote": "До момента государственной регистрации перехода права собственности риск случайной гибели и случайного повреждения объекта несёт Продавец. После регистрации риск переходит к Покупателю. Покупатель обязан застраховать объект от рисков гибели и повреждения в течение 5 рабочих дней с даты регистрации перехода права на сумму не менее цены договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "С момента подписания передаточного акта риск случайной гибели переходит
        к Покупателю. Страхование титула осуществляется Покупателем
        за его счёт до даты регистрации."

        Ответ:
        {
          "risk_of_loss_status": "defined",
          "risk_of_loss_details": "С момента подписания передаточного акта — несёт Покупатель",
          "insurance_status": "defined",
          "insurance_details": "Страхование титула — Покупатель за свой счёт до даты регистрации",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "С момента подписания передаточного акта риск случайной гибели переходит к Покупателю. Страхование титула осуществляется Покупателем за его счёт до даты регистрации."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Стороны обязуются соблюдать условия настоящего договора."

        Ответ:
        {
          "risk_of_loss_status": "not_defined",
          "risk_of_loss_details": "Не установлено",
          "insurance_status": "not_defined",
          "insurance_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написано, кто несёт риск гибели и с какого момента?
           Различай момент передачи акта и момент регистрации.
        2. Есть ли прямое условие о страховании?
           Какой вид страхования: имущественное / титул / ответственность?
        3. Если риск и страхование прямо не указаны — не домысливай из закона.
        4. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "risk_of_loss_status": "<defined / not_defined>",
          "risk_of_loss_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "insurance_status": "<defined / not_defined>",
          "insurance_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели риск случайного повреждения до регистрации после регистрации момент передачи передача объекта страхование страховой полис страхование титула страхование ответственности обязан застраховать"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - limitations
      negative_keywords:
        - "не обременен"
        - "залог"
        - "арест"
