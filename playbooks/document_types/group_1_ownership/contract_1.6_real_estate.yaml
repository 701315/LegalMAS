          "mortgagee_consent_details": "Не установлено",
          "clearance_mechanism_status": "defined",
          "clearance_mechanism_code": "prepaid",
          "clearance_mechanism_details": "Ипотека погашается Продавцом из задатка (3 000 000 руб.) до подачи на регистрацию",
