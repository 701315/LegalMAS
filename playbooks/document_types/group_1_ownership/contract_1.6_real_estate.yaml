        Пример 3:
        Фрагмент:
        "Стороны обязуются представить документы для государственной регистрации
        перехода права собственности."

        Ответ:
        {
          "expense_allocation_status": "not_defined",
          "expense_allocation_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание, кто несёт расходы?
        2. Указана ли отдельно госпошлина или нотариальные расходы?
        3. Не подменён ли факт подачи документов распределением расходов?
        4. Не сделано ли предположение вместо текста договора?

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "expense_allocation_status": "<defined / not_defined>",
          "expense_allocation_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

      context_k: 6
