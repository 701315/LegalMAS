             на названный внешний документ по этой теме;
           - "not_defined" — если по теме сервитутов и коммуникаций нет прямого указания
             или его нельзя надёжно определить.
           Важно: общее упоминание инженерных систем объекта без указания на сервитуты
           или проходящие через участок сети не является основанием для "defined".

        8. utilities_servitudes_details:
           Краткое user-facing описание по инженерным сервитутам и коммуникациям
