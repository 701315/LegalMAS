  - id: title_cleanliness_check
    name: "Чистота титула: обременения, аресты, аренда и задолженность"
    description: >
      Фактографическая проверка заверений и раскрытий о частноправовой чистоте
      титула объекта: обременения, аресты, запреты регистрационных действий,
      аренда / найм / иное пользование и задолженность по ЖКУ, налогам,
      капремонту и иным связанным с объектом обязательным платежам.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не обременен"
        - "отсутствие обременений"
        - "не заложен"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "не сдан в аренду"
        - "никаких прав третьих лиц"
        - "запрет регистрационных действий"
        - "ограничение регистрационных действий"
        - "арест"
        - "отсутствуют ограничения"
        - "в ЕГРН отсутствуют записи"
        - "аренда"
        - "найм"
        - "безвозмездное пользование"
        - "отсутствие задолженности"
        - "коммунальные"
        - "капремонт"
        - "налог"
        - "налоги"
        - "имущественный налог"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)продавец.*гарантирует.*отсутствие.*обременений"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"
        - "(?i)запрет\\s+регистрационн"
        - "(?i)в\\s+ЕГРН\\s+отсутств(уют|ует)"
        - "(?i)договор\\s+аренд"
        - "(?i)отсутств(ует|уют).*задолженн"
        - "(?i)(коммунальн|ЖКУ|капремонт|налог).*задолженн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: есть ли в договоре заверения или раскрытия
        о частноправовой чистоте титула объекта — обременениях, арестах / запретах
        регистрационных действий, аренде / найме / ином пользовании и задолженности
        по ЖКУ, налогам, капремонту и иным связанным с объектом обязательным платежам.

        Нормативный ориентир:
        - ст. 460 ГК РФ
        - ФЗ-218 «О государственной регистрации недвижимости»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое заверение или раскрытие по обременениям объекта.
        2. Есть ли прямое заверение или раскрытие по арестам и запретам регистрационных действий.
        3. Есть ли прямое раскрытие аренды / найма / иного пользования объектом
           либо прямое заверение об их отсутствии.
        4. Есть ли прямое заверение или раскрытие о задолженности по ЖКУ, налогам,
           капремонту и иным связанным с объектом обязательным платежам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику, сведения из ЕГРН или предположения
           вместо текста договора.
        3. Для status-полей используй:
           - "defined" — если в тексте прямо есть заверение, раскрытие, исключение
             или прямая ссылка на названный внешний документ по соответствующему блоку;
           - "not_defined" — если по соответствующему блоку в тексте нет прямого указания
             или его нельзя надёжно определить.
        4. Для текстовых полей используй:
           - "Не установлено" — если по блоку нет прямого указания;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Если параметр прямо определяется по названному внешнему документу
           (например, выписке из ЕГРН, приложению, справке управляющей компании),
           это не отсутствие регулирования; отрази это в user-facing поле, например:
           - "Согласно выписке из ЕГРН от 01.03.2026"
           - "Согласно справке УК от 10.04.2026"
        6. Общие фразы вроде "объект передается в надлежащем состоянии",
           "продавец гарантирует законность сделки", "отсутствуют препятствия к исполнению"
           без конкретизации не являются достаточным основанием для "defined".
        7. Для поля по аренде учитывай только прямые указания на аренду, найм,
           безвозмездное пользование, фактическое пользование третьими лицами
           либо прямое указание, что таких прав нет.
        8. Для поля по арестам и запретам учитывай только прямые указания на арест,
           запрет регистрационных действий, ограничение регистрационных действий
           либо прямую ссылку на названный внешний документ по этой теме.
           Общее указание на "обременения" само по себе не всегда достаточно.
        9. Для поля по задолженности учитывай только задолженность,
           явно связанную с объектом: ЖКУ, коммунальные услуги, налоги, взносы
           на капитальный ремонт и иные прямо названные обязательные платежи по объекту.
        10. Если в договоре раскрыта существующая аренда, обременение или долг,
            это всё равно "defined"; в user-facing поле кратко отрази содержание раскрытия.
        11. Если в договоре указано отсутствие риска, но с исключением,
            отрази исключение в user-facing поле.
        12. Не выводи заверения, которых нет в тексте.
        13. В evidence включай только текст договора.
        14. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Объект не обременён залогами и иными правами третьих лиц, не находится под арестом
        и запретом регистрационных действий, не сдан в аренду. Задолженность по коммунальным
        платежам и взносам на капитальный ремонт отсутствует."

        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "Обременения и права третьих лиц отсутствуют",
          "arrest_ban_status": "defined",
          "arrest_ban_details": "Аресты и запреты регистрационных действий отсутствуют",
          "lease_status": "defined",
          "lease_details": "Аренда отсутствует",
          "utility_debts_status": "defined",
          "utility_debts_details": "Задолженность по коммунальным платежам и капремонту отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Объект не обременён залогами и иными правами третьих лиц, не находится под арестом и запретом регистрационных действий, не сдан в аренду. Задолженность по коммунальным платежам и взносам на капитальный ремонт отсутствует."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "На дату заключения договора объект находится в аренде по договору аренды № 5
        от 01.02.2025 сроком до 31.12.2025. Задолженность по налогу на имущество отсутствует."

        Ответ:
        {
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Не установлено",
          "arrest_ban_status": "not_defined",
          "arrest_ban_details": "Не установлено",
          "lease_status": "defined",
          "lease_details": "Объект находится в аренде по договору № 5 от 01.02.2025 до 31.12.2025",
          "utility_debts_status": "defined",
          "utility_debts_details": "Задолженность по налогу на имущество отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "На дату заключения договора объект находится в аренде по договору аренды № 5 от 01.02.2025 сроком до 31.12.2025. Задолженность по налогу на имущество отсутствует."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Сведения об ограничениях и обременениях определяются согласно выписке из ЕГРН
        от 10.04.2026. Справка управляющей компании об отсутствии задолженности
        предоставляется при подписании передаточного акта."

        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "Согласно выписке из ЕГРН от 10.04.2026",
          "arrest_ban_status": "not_defined",
          "arrest_ban_details": "Не установлено",
          "lease_status": "not_defined",
          "lease_details": "Не установлено",
          "utility_debts_status": "defined",
          "utility_debts_details": "Согласно справке управляющей компании, предоставляемой при подписании передаточного акта",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Сведения об ограничениях и обременениях определяются согласно выписке из ЕГРН от 10.04.2026. Справка управляющей компании об отсутствии задолженности предоставляется при подписании передаточного акта."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Продавец передаёт объект покупателю."

        Ответ:
        {
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Не установлено",
          "arrest_ban_status": "not_defined",
          "arrest_ban_details": "Не установлено",
          "lease_status": "not_defined",
          "lease_details": "Не установлено",
          "utility_debts_status": "not_defined",
          "utility_debts_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание по обременениям?
        2. Есть ли прямое указание по арестам / запретам регистрационных действий?
        3. Есть ли прямое указание по аренде / найму / иному пользованию?
        4. Есть ли прямое указание по задолженности, связанной с объектом?
        5. Если параметр определяется по названному внешнему документу —
           отрази это как user-facing значение, а не как пустоту.
        6. Если в тексте раскрыто существующее обременение, аренда или долг —
           это "defined", а не "not_defined".
        7. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "encumbrances_status": "<defined / not_defined>",
          "encumbrances_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "arrest_ban_status": "<defined / not_defined>",
          "arrest_ban_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "lease_status": "<defined / not_defined>",
          "lease_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "utility_debts_status": "<defined / not_defined>",
          "utility_debts_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не обременен отсутствие обременений не заложен не находится под арестом свободен от прав третьих лиц не сдан в аренду никаких прав третьих лиц запрет регистрационных действий ограничение регистрационных действий в ЕГРН отсутствуют записи аренда найм безвозмездное пользование отсутствие задолженности коммунальные ЖКУ капремонт налог имущественный налог"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "ЗОУИТ"
        - "санитарно-защитная зона"
        - "охранная зона"
        - "культурное наследие"
        - "экологическое состояние"
        - "перепланировка"
        - "сервитут инженерный"
        - "ипотека в силу закона"
        - "до полной оплаты в залоге у продавца"
        - "ст. 488 ГК РФ"
        - "банкротство"
        - "несостоятельность"
        - "цена"
        - "задаток"
        - "аккредитив"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о частноправовой чистоте титула объекта: обременения, аресты
        и запреты регистрационных действий, аренда / найм / иное пользование,
        а также задолженность по ЖКУ, налогам, капремонту и иным связанным
        с объектом обязательным платежам.
        Не анализируй ЗОУИТ, экологию, перепланировки, публично-правовые ограничения,
        банкротство продавца, цену, расчёты, передачу объекта и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. encumbrances_status:
           - "defined" — если в тексте прямо есть заверение, раскрытие, исключение
             или прямая ссылка на названный внешний документ по обременениям объекта
             (залог, ипотека, сервитут, иные права третьих лиц, иные обременения);
           - "not_defined" — если по обременениям нет прямого указания
             или его нельзя надёжно определить.

        2. encumbrances_details:
           Краткое user-facing описание по обременениям на русском языке.
           Правила:
           - если прямо указано отсутствие обременений, верни краткое summary, например:
             "Обременения отсутствуют",
             "Залог, ипотека и права третьих лиц отсутствуют";
           - если прямо раскрыто существующее обременение или исключение, кратко отрази его,
             например:
             "Объект обременён сервитутом",
             "Обременения отсутствуют, кроме сервитута от 12.03.2024";
           - если параметр определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно выписке из ЕГРН от 10.04.2026",
             "Согласно Приложению №2";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. arrest_ban_status:
           - "defined" — если в тексте прямо есть заверение, раскрытие, исключение
             или прямая ссылка на названный внешний документ по арестам, запретам
             или ограничениям регистрационных действий;
           - "not_defined" — если такого прямого указания нет
             или его нельзя надёжно определить.
           Важно: общая фраза про отсутствие обременений без прямого упоминания
           ареста или запрета регистрационных действий не всегда достаточна
           для "defined" по этому полю.

        4. arrest_ban_details:
           Краткое user-facing описание по арестам и запретам на русском языке.
           Правила:
           - если прямо указано отсутствие арестов / запретов, верни краткое summary, например:
             "Аресты и запреты регистрационных действий отсутствуют";
           - если прямо раскрыт существующий арест / запрет / ограничение, кратко отрази это;
           - если параметр определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно выписке из ЕГРН от 10.04.2026";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. lease_status:
           - "defined" — если в тексте прямо раскрыта аренда, найм, безвозмездное пользование,
             иное пользование третьими лицами либо прямо указано их отсутствие;
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.
           Важно: общая фраза про отсутствие прав третьих лиц без явной привязки
           к аренде / пользованию не всегда достаточна для "defined" по этому полю.

        6. lease_details:
           Краткое user-facing описание по аренде / пользованию на русском языке.
           Правила:
           - если прямо указано отсутствие аренды / найма / пользования, верни краткое summary,
             например: "Аренда отсутствует";
           - если прямо раскрыта существующая аренда / найм / пользование,
             кратко укажи существенную суть, например:
             "Объект находится в аренде по договору № 5 от 01.02.2025 до 31.12.2025",
             "Сохраняется право пользования третьего лица";
           - если параметр определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №3";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. utility_debts_status:
           - "defined" — если в тексте прямо есть заверение, раскрытие, исключение
             или прямая ссылка на названный внешний документ по задолженности,
             связанной с объектом: ЖКУ, коммунальные услуги, налоги, взносы
             на капитальный ремонт и иные прямо названные обязательные платежи;
           - "not_defined" — если такого прямого указания нет
             или его нельзя надёжно определить.

        8. utility_debts_details:
           Краткое user-facing описание по задолженности на русском языке.
           Правила:
           - если прямо указано отсутствие задолженности, верни краткое summary, например:
             "Задолженность по ЖКУ отсутствует",
             "Задолженность по налогу на имущество и капремонту отсутствует";
           - если прямо раскрыт долг, кратко отрази его, например:
             "Имеется задолженность по ЖКУ за март 2026",
             "Задолженность по капремонту погашается Продавцом до передачи";
           - если параметр определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно справке управляющей компании от 10.04.2026";
           - учитывай только задолженность, прямо связанную с объектом;
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй сведения из закона, судебной практики, ЕГРН или обычной практики
          вместо текста договора.
        - Не смешивай частноправовую чистоту титула с ЗОУИТ, санитарными зонами,
          культурным наследием, экологией, перепланировками, банкротством продавца,
          ценой, расчётами, ипотекой в силу закона в пользу продавца по этой сделке,
          передачей объекта и иными нерелевантными темами.
        - Если параметр прямо определяется по названному внешнему документу
          (выписке из ЕГРН, приложению, справке УК, справке налогового органа и т.п.),
          считай его определённым и отрази это в user-facing поле.
        - Общие фразы вроде "сделка законна", "препятствий нет", "всё соответствует законодательству"
          без конкретизации не являются основанием для "defined".
        - Если текст прямо раскрывает существующее обременение, аренду, арест, запрет
          или задолженность, это всё равно "defined"; кратко отрази раскрытый факт.
        - Если указано отсутствие риска с исключением, отрази исключение в текстовом поле.
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 8 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          encumbrances_details → "Не установлено"
          arrest_ban_details → "Не установлено"
          lease_details → "Не установлено"
          utility_debts_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения или раскрытия по обременениям объекта."
          required: true
          display_in_grid: false

        - name: "encumbrances_details"
          type: "string"
          presentation: "fact"
          label: "Обременения"
          description: >
            Краткое user-facing summary по обременениям объекта:
            отсутствие, наличие, исключение либо ссылка на названный внешний документ.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "arrest_ban_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения или раскрытия по арестам и запретам регистрационных действий."
          required: true
          display_in_grid: false

        - name: "arrest_ban_details"
          type: "string"
          presentation: "fact"
          label: "Аресты и запреты"
          description: >
            Краткое user-facing summary по арестам, запретам и ограничениям
            регистрационных действий.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "lease_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия аренды, найма или иного пользования объектом."
          required: true
          display_in_grid: false

        - name: "lease_details"
          type: "string"
          presentation: "fact"
          label: "Аренда"
          description: >
            Краткое user-facing summary по аренде, найму, безвозмездному
            пользованию или отсутствию таких прав.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "utility_debts_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия задолженности по объекту."
          required: true
          display_in_grid: false

        - name: "utility_debts_details"
          type: "string"
          presentation: "fact"
          label: "Задолженность по ЖКУ и платежам"
          description: >
            Краткое user-facing summary по задолженности по ЖКУ, коммунальным услугам,
            налогам, капремонту и иным связанным с объектом обязательным платежам.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: public_law_restrictions_check
    name: "Публично-правовые ограничения: ЗОУИТ, экология, сервитуты, перепланировки"
    description: >
      Фактографическая проверка раскрытия публично-правовых ограничений объекта:
      ЗОУИТ, охранные зоны, санитарные зоны, культурное наследие, экологическое
      состояние, инженерные сервитуты, перепланировки и реконструкции.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "СЗЗ"
        - "санитарно-защитная зона"
        - "ЗОУИТ"
        - "зона с особыми условиями"
        - "охранная зона"
        - "культурное наследие"
        - "ОКН"
        - "объект культурного наследия"
        - "экологическое состояние"
        - "загрязнение"
        - "захоронение"
        - "свалка"
        - "сервитут"
        - "охранная зона сетей"
        - "перепланировка"
        - "реконструкция"
        - "согласованная перепланировка"
        - "самовольная перепланировка"
        - "ГПЗУ"
        - "градостроительный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)санитарно\\s*[- ]?защитн|ЗОУИТ|СЗЗ"
        - "(?i)культурн(ого)?\\s+наслед"
        - "(?i)экологическ|свалк|захоронен|загрязнен"
        - "(?i)сервитут|охранн(ая|ой)\\s+зон"
        - "(?i)перепланировк|реконструкц"
        - "(?i)ГПЗУ|градостроительн(ый|ого)\\s+план"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: раскрытие публично-правовых ограничений
        объекта — ЗОУИТ, охранные зоны, культурное наследие, экологическое состояние,
        инженерные сервитуты, перепланировки и реконструкции.
        Не анализируй обременения (залог, ипотека), аресты, аренду,
        задолженность или банкротство продавца.

        Нормативный ориентир:
        - ФЗ-218 «О государственной регистрации недвижимости»
        - ЗК РФ
        - ГрК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое раскрытие по ЗОУИТ, охранным или санитарно-защитным зонам.
        2. Есть ли прямое упоминание объекта культурного наследия (ОКН).
        3. Есть ли прямое раскрытие экологического состояния объекта или участка.
        4. Есть ли прямое раскрытие инженерных сервитутов или коммуникаций.
        5. Есть ли прямое раскрытие перепланировок или реконструкции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику, данные ГПЗУ или ЕГРН,
           предположения вместо текста договора.
        3. Для status-полей используй:
           - "defined" — если в тексте прямо есть раскрытие, заверение, исключение
             или прямая ссылка на названный внешний документ по соответствующему блоку;
           - "not_defined" — если по блоку нет прямого указания
             или его нельзя надёжно определить.
        4. Для текстовых полей используй:
           - "Не установлено" — если по блоку нет прямого указания;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Если параметр прямо определяется по названному внешнему документу
           (ГПЗУ, выписке из ЕГРН о зонах, заключению экологической экспертизы,
           приложению и т.п.), это не отсутствие регулирования; отрази это в
           user-facing поле, например:
           - "Согласно ГПЗУ от 01.03.2026"
           - "Согласно заключению экологической экспертизы"
           - "Согласно выписке из ЕГРН о зонах"
        6. Общие фразы вроде "объект передается в надлежащем состоянии",
           "продавец гарантирует законность сделки", "объект соответствует
           требованиям законодательства" без конкретизации не являются
           достаточным основанием для "defined" по каждому блоку.
        7. Если в договоре раскрыта самовольная перепланировка, это всё равно "defined";
           в user-facing поле кратко отрази суть раскрытия.
        8. Если объект прямо указан как ОКН либо прямо указано, что он не является ОКН,
           это "defined"; отрази суть раскрытия в user-facing поле.
        9. Если в договоре раскрыт существующий сервитут или коммуникации, это "defined";
           в user-facing поле кратко отрази суть раскрытия.
        10. Не выводи заверения из молчания договора.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Объект не входит в зоны с особыми условиями использования территорий (ЗОУИТ)
        и санитарно-защитные зоны. Объект не является объектом культурного наследия.
        Перепланировок и реконструкций не проводилось. Экологическое состояние объекта
        соответствует требованиям действующего законодательства."

        Ответ:
        {
          "zouit_status": "defined",
          "zouit_details": "Объект не входит в ЗОУИТ и санитарно-защитные зоны",
          "heritage_status": "defined",
          "heritage_details": "Объект не является объектом культурного наследия",
          "ecological_status": "defined",
