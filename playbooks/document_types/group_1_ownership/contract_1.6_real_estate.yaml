      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только об условиях закрытия сделки и передаче объекта: срок подачи на
        регистрацию, крайний срок закрытия, отлагательные условия, передаточный акт
        и момент его подписания, срок освобождения объекта, выписка зарегистрированных
        лиц, порядок при приостановке / отказе в регистрации и передача технической
        документации.
        Не анализируй цену, расчёты, обременения, ипотеку, банкротство продавца,
        семейные риски и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. closing_date_status:
           - "defined" — если в тексте прямо указан срок подачи документов
             на государственную регистрацию;
           - "not_defined" — если такой срок прямо не указан
             или его нельзя надёжно определить.

        2. closing_date_details:
           Краткое user-facing описание срока подачи на регистрацию
           на русском языке.
           Правила:
           - если срок прямо указан, верни его, например:
             "Не позднее 10.05.2026",
             "В течение 5 рабочих дней с даты подписания договора";
           - не смешивай с датой государственной регистрации в ЕГРН
             (она определяется Росреестром, а не договором);
           - не копируй длинные абзацы;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. longstop_date_status:
           - "defined" — если в тексте прямо указан крайний срок, после которого
             одна из сторон вправе отказаться от договора при незакрытии сделки,
             либо договор прекращается автоматически;
           - "not_defined" — если такого срока прямо нет
             или его нельзя надёжно определить.
           Правило: если прямо назван срок, после которого сторона вправе выйти
           из сделки при незакрытии, считай это longstop_date — даже если сам
           термин не используется.

        4. longstop_date_details:
           Краткое user-facing описание крайнего срока на русском языке.
           Правила:
           - если срок прямо указан, верни его с кратким описанием последствий,
             например:
             "01.07.2026; при незакрытии Покупатель вправе отказаться от договора",
             "31.12.2026; договор прекращается автоматически";
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. conditions_precedent_status:
           - "defined" — если в тексте прямо указаны отлагательные условия
             закрытия сделки или конструкции: "при условии", "после предоставления",
             "до регистрации", "обязательства наступают при", "при наличии",
             либо иные прямые отлагательные условия;
           - "not_defined" — если таких условий прямо нет
             или их нельзя надёжно определить.

        6. conditions_precedent_details:
           Краткое user-facing описание отлагательных условий на русском языке.
           Правила:
           - если условия прямо перечислены, верни краткое summary, например:
             "Полная оплата аванса; предоставление Продавцом выписки из ЕГРН",
             "Получение согласия органа опеки";
           - перечисляй через "; ";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        7. transfer_act_status:
           - "defined" — если в тексте прямо предусмотрен передаточный акт
             или акт приёма-передачи;
           - "not_defined" — если передаточный акт прямо не предусмотрен
             или его нельзя надёжно определить.

        8. transfer_act_details:
           Краткое user-facing описание передаточного акта и момента его подписания
           на русском языке.
           Правила:
           - отрази не только факт наличия акта, но и момент его подписания;
           - используй понятные формулировки, например:
             "Передаточный акт подписывается до подачи документов на регистрацию",
             "Передаточный акт подписывается в день подачи документов в МФЦ",
             "Передаточный акт подписывается после государственной регистрации",
             "Передаточный акт подписывается при передаче ключей";
           - если момент подписания прямо не указан, верни только факт наличия акта,
             например: "Передача по передаточному акту; момент подписания не указан";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. possession_delivery_status:
           - "defined" — если в тексте прямо указан срок фактического освобождения
             объекта (вывоз вещей, передача ключей);
           - "not_defined" — если такой срок прямо не указан
             или его нельзя надёжно определить.

        10. possession_delivery_details:
            Краткое user-facing описание срока освобождения объекта
            на русском языке.
            Правила:
            - если срок прямо указан, верни его, например:
              "До 01.06.2026",
              "В течение 14 календарных дней с даты регистрации";
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        11. deregistration_status:
            - "defined" — если в тексте прямо указаны условия о выписке
              зарегистрированных по месту жительства лиц (прописанных),
              либо прямо указано, что таких лиц нет;
            - "not_defined" — если по теме выписки зарегистрированных лиц
              прямого указания нет или его нельзя надёжно определить.
            Важно: не путай выписку зарегистрированных лиц со снятием
            ипотечного обременения в ЕГРН — это разные темы.

        12. deregistration_details:
            Краткое user-facing описание условий о выписке зарегистрированных
            лиц на русском языке.
            Правила:
            - если прямо указаны конкретные лица и срок выписки, верни краткое
              summary, например:
              "Продавец и дочь Иванова А.А. (1998 г.р.) — выписка до 01.06.2026";
            - если прямо указано, что зарегистрированных лиц нет, верни:
              "Зарегистрированных по месту жительства лиц нет";
            - если прямо указан только срок выписки без перечня лиц, верни, например:
              "Выписка всех зарегистрированных лиц до 01.06.2026";
            - если из текста прямо следует, что объект нежилой и данная тема
              не применима — "Не применимо";
            - если данных нет — "Не установлено";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        13. registration_refusal_status:
            - "defined" — если в тексте прямо урегулированы действия сторон
              при приостановке или отказе в государственной регистрации;
            - "not_defined" — если такого регулирования прямо нет
              или его нельзя надёжно определить.

        14. registration_refusal_details:
            Краткое user-facing описание порядка при приостановке / отказе
            в регистрации на русском языке.
            Правила:
            - разграничивай приостановку (предложение устранить недостатки)
              и отказ (финальный);
            - если обе ситуации урегулированы, кратко отрази обе, например:
              "При приостановке по вине Продавца Покупатель вправе отказаться
              от договора; при отказе по вине Продавца — возврат аванса в двойном
              размере";
            - если урегулирована только одна ситуация, отрази её;
            - не копируй длинные абзацы;
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".

        15. technical_docs_status:
            - "defined" — если в тексте прямо предусмотрена передача технической
              документации (техпаспорт, поэтажный план, договоры с УК,
              инструкции к оборудованию и т.п.);
            - "not_defined" — если передача технической документации прямо
              не предусмотрена или её нельзя надёжно определить.

        16. technical_docs_details:
            Краткое user-facing описание условий передачи технической документации
            на русском языке.
            Правила:
            - если передача прямо предусмотрена, верни краткое summary, например:
              "Передаётся по акту приёма-передачи документов одновременно с ключами",
              "Техпаспорт и поэтажный план передаются при подписании акта";
            - если данных нет — "Не установлены";
            - если данные противоречивы или их нельзя надёжно определить —
              "Не удалось определить".
