    llm:
      prompt_template: ""
      context_k: 3
      temperature: 0.0
      max_tokens: 128
    retrieval:
      context_k: 3
      max_chunks: 6
      boost_keywords:
        - "кадастровый номер"
        - "земельный участок"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: false
      mode: "rules"
      fields: []
      store_payload: false

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Категория, ВРИ и ковенант о неизменности назначения
  # ──────────────────────────────────────────────────────────────────────────
  - id: land_vri_and_category_required
    name: "Земля: категория, ВРИ и ковенант о неизменности назначения"
    description: >
      Фактографическая проверка наличия категории земель, ВРИ и ковенанта
      о запрете смены назначения.
    triggers:
      any: ["land_plot_sale"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
        - "не изменять"
        - "целевое назначение"
        - "без согласия продавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+измен(ять|яет).*?(вид\\s+разрешенн|ВРИ|категор|целев)"
        - "(?i)без\\s+согласия\\s+продавц"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи земельного участка (ЗК РФ, ст. 7-8;
        ГрК РФ, ст. 37-38).
        Проверяется наличие категории земель, ВРИ и ковенанта о неизменности назначения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Категорию земель.
        2. Вид разрешённого использования (ВРИ).
        3. Условие о соответствии ВРИ целям покупателя.
        4. Ковенант о запрете изменения категории/ВРИ без согласия продавца.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Категория — только прямое название.
        2. ВРИ — только прямая формулировка.
        3. Ковенант — есть ли прямой запрет изменения?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "land_category_status": "<defined / not_defined>",
          "land_category": "<категория или 'Данные не определены'>",
          "vri_status": "<defined / not_defined>",
          "vri_details": "<ВРИ или 'Данные не определены'>",
          "intended_use_fit_status": "<defined / not_defined>",
          "intended_use_fit": "<yes / no / unclear / not_defined>",
          "covenant_no_change_status": "<defined / not_defined>",
          "covenant_no_change_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "категория земель"
        - "разрешённое использование"
        - "вид разрешённого использования"
        - "ВРИ"
        - "целевое назначение"
        - "без согласия продавца"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "land_category_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если категория прямо указана. Иначе 'not_defined'."
        - name: "vri_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ВРИ прямо указан. Иначе 'not_defined'."
        - name: "covenant_no_change_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ковенант о неизменности прямо определён. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Перечень лиц с правом пользования (жильё)
  # ──────────────────────────────────────────────────────────────────────────
  - id: residents_list_required
    name: "Жильё: перечень лиц с правом пользования (ст. 558 ГК РФ)"
    description: >
      Фактографическая проверка наличия перечня лиц с правом пользования
      или заверения об их отсутствии (существенное условие по ст. 558 ГК РФ).
    triggers:
      any: ["residential_property"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право пользования"
        - "зарегистрированные лица"
        - "проживающие лица"
        - "сохраняют право пользования"
        - "лица, не утратившие право"
        - "отсутствуют лица"
        - "никто не зарегистрирован"
        - "снят с регистрационного учёта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(перечень|список)\\s+лиц.*?(пользован|проживан)"
        - "(?i)лиц\\s+не\\s+(утрат|сохран).*?право"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи жилой недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 558 ГК РФ; ст. 292 ГК РФ; ст. 19 ФЗ-189).
        Проверяется только один вопрос: перечень лиц с правом пользования.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень лиц с правом пользования жилым помещением (если есть).
        2. Явное указание на отсутствие таких лиц.
        3. Упоминание отказавшихся от приватизации.
        4. Упоминание несовершеннолетних.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лиц, сохраняющих право пользования жилым помещением в соответствии со ст. 558 ГК РФ,
        не имеется. Лиц, отказавшихся от участия в приватизации, нет."

        Ответ:
        {
          "residents_list_status": "defined",
          "residents_regime": "explicitly_none",
          "residents_details": "лиц с правом пользования не имеется",
          "privatization_refusers_status": "defined",
          "privatization_refusers_details": "лиц, отказавшихся от приватизации, нет",
          "minor_residents_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Лиц, сохраняющих право пользования жилым помещением в соответствии со ст. 558 ГК РФ, не имеется."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец передаёт квартиру покупателю."

        Ответ:
        {
          "residents_list_status": "not_defined",
          "residents_regime": "not_defined",
          "residents_details": "Данные не определены",
          "privatization_refusers_status": "not_defined",
          "privatization_refusers_details": "Данные не определены",
          "minor_residents_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли явная фраза "лиц с правом пользования нет" или их перечень?
        2. Упомянуты ли отказавшиеся от приватизации?
        3. Отсутствие раздела = not_defined (критично!).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "residents_list_status": "<defined / not_defined>",
          "residents_regime": "<listed / explicitly_none / not_defined>",
          "residents_details": "<текст или 'Данные не определены'>",
          "privatization_refusers_status": "<defined / not_defined>",
          "privatization_refusers_details": "<текст или 'Данные не определены'>",
          "minor_residents_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "право пользования"
        - "зарегистрированные лица"
        - "перечень лиц"
        - "ст. 558 ГК РФ"
        - "приватизация"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "residents_list_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если перечень лиц или заверение об их отсутствии прямо определено. Иначе 'not_defined'."
        - name: "residents_regime"
          type: "string"
          allowed_values: ["listed", "explicitly_none", "not_defined"]
          description: "Статус: есть перечень / явно нет / не определено."
        - name: "privatization_refusers_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если отказавшиеся от приватизации упомянуты. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Согласие супруга и органов опеки
  # ──────────────────────────────────────────────────────────────────────────
  - id: spousal_consent_check
    name: "Согласие супруга, семейное положение и разрешение органов опеки"
    description: >
      Фактографическая проверка наличия нотариального согласия супруга или
      подтверждения отсутствия брака, а также разрешения органов опеки.
    triggers:
      any: ["individual_party"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "является единственным собственником"
        - "приобретено до брака"
        - "личная собственность"
        - "согласие органа опеки"
        - "разрешение опеки"
        - "несовершеннолетн"
        - "недееспособн"
        - "отсутствие несовершеннолетних"
        - "орган опеки и попечительства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
        - "(?i)орган(а|ов)?\\s+опек"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости, в котором одна из сторон —
        физическое лицо (ст. 35 СК РФ; ст. 292 ГК РФ; ФЗ-48).
        Проверяется только один вопрос: согласие супруга и разрешение органов опеки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Нотариальное согласие супруга продавца или заверение о его отсутствии в браке.
        2. Ссылку на брачный договор (если имущество — личное).
        3. Наличие несовершеннолетних/недееспособных.
        4. Разрешение органа опеки (при наличии несовершеннолетних).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец подтверждает, что в зарегистрированном браке не состоит.
        Несовершеннолетних детей, чьи права могут быть затронуты, не имеется."

        Ответ:
        {
          "spousal_consent_status": "defined",
          "spousal_consent_regime": "not_married_confirmed",
          "spousal_consent_details": "в зарегистрированном браке не состоит",
          "minor_residents_status": "defined",
          "minor_residents_details": "несовершеннолетних детей не имеется",
          "guardianship_consent_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Продавец подтверждает, что в зарегистрированном браке не состоит."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец вправе продать объект."

        Ответ:
        {
          "spousal_consent_status": "not_defined",
          "spousal_consent_regime": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "minor_residents_status": "not_defined",
          "minor_residents_details": "Данные не определены",
          "guardianship_consent_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая фраза о браке (не состоит / согласие приложено)?
        2. Упомянуты ли несовершеннолетние?
        3. Есть ли ссылка на разрешение органа опеки?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_regime": "<consent_present / not_married_confirmed / prenuptial_referenced / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "minor_residents_status": "<defined / not_defined>",
          "minor_residents_details": "<текст или 'Данные не определены'>",
          "guardianship_consent_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "состоит в браке"
        - "ст. 35 СК РФ"
        - "орган опеки"
        - "несовершеннолетний"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если согласие супруга или отсутствие брака прямо определено. Иначе 'not_defined'."
        - name: "spousal_consent_regime"
          type: "string"
          allowed_values: ["consent_present", "not_married_confirmed", "prenuptial_referenced", "not_defined"]
          description: "Статус согласия супруга."
        - name: "guardianship_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если разрешение органов опеки прямо определено. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Долевая собственность — преимущественное право
  # ──────────────────────────────────────────────────────────────────────────
  - id: co_owner_preemptive_right_check
    name: "Долевая собственность: преимущественное право и нотариальная форма"
    description: >
      Фактографическая проверка соблюдения преимущественного права покупки сособственников
      и нотариальной формы сделки с долей.
    triggers:
      any: ["share_in_right_sale"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "преимущественное право покупки"
        - "уведомление сособственников"
        - "отказ от преимущественного права"
        - "извещение о продаже доли"
        - "ст. 250"
        - "нотариус"
        - "нотариальное удостоверение"
        - "удостоверено нотариусом"
        - "нотариальная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право\\s+покупк"
        - "(?i)уведомлен(ие|ия).*сособственник"
        - "(?i)нотариальн(ое|ым)\\s+удостоверен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи доли в праве на недвижимость
        (ст. 250 ГК РФ; ФЗ-218, ст. 42).
        Проверяется соблюдение преимущественного права и нотариальная форма.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Статус преимущественного права сособственников (отказались / уведомлены).
        2. Способ уведомления сособственников.
        3. Соответствие цены в уведомлении цене договора.
        4. Упоминание нотариального удостоверения.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли написано об отказе или уведомлении сособственников?
        2. Упомянут ли нотариус для удостоверения?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_regime": "<waived / notified / not_defined>",
          "notification_method_status": "<defined / not_defined>",
          "notification_method": "<notary / registered_mail / other / not_defined>",
          "price_matches_notification_status": "<defined / not_defined>",
          "price_matches_notification": "<yes / no / not_defined>",
          "notary_form_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "преимущественное право"
        - "уведомление сособственников"
        - "отказ от права"
        - "ст. 250 ГК РФ"
        - "нотариальное удостоверение"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "procedures"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "preemptive_right_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если преимущественное право прямо урегулировано. Иначе 'not_defined'."
        - name: "preemptive_right_regime"
          type: "string"
          allowed_values: ["waived", "notified", "not_defined"]
          description: "Статус: отказались / уведомлены / не определено."
        - name: "notary_form_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если нотариальная форма упомянута. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 13: Ипотека — согласие залогодержателя
  # ──────────────────────────────────────────────────────────────────────────
  - id: mortgagee_consent_check
    name: "Ипотека: согласие залогодержателя и механизм снятия обременения"
    description: >
      Фактографическая проверка наличия согласия банка/залогодержателя и механизма
      погашения ипотеки с одновременным снятием обременения.
    triggers:
      any: ["mortgage_related"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
