        1. Согласие залогодержателя/банка на сделку.
        2. Механизм погашения ипотеки (аккредитив / эскроу / прямой платёж).
        3. Одновременность снятия ипотеки и регистрации перехода права.
        4. Сумму ипотечного долга.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание согласия банка/залогодержателя?
        2. Описан ли механизм погашения (аккредитив / счёт эскроу)?
        3. Написано ли о одновременной регистрации?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "mortgagee_consent_status": "<defined / not_defined>",
          "mortgagee_consent_details": "<текст или 'Данные не определены'>",
          "clearance_mechanism_status": "<defined / not_defined>",
          "clearance_mechanism": "<escrow / accreditive / direct_payment / not_defined>",
          "simultaneous_registration_status": "<defined / not_defined>",
          "mortgage_amount_status": "<defined / not_defined>",
          "mortgage_amount": "<сумма или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "согласие залогодержателя"
        - "согласие банка"
        - "погашение ипотеки"
        - "снятие обременения"
        - "закладная"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "mortgagee_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если согласие залогодержателя прямо определено. Иначе 'not_defined'."
        - name: "clearance_mechanism_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если механизм снятия ипотеки прямо определён. Иначе 'not_defined'."
        - name: "clearance_mechanism"
          type: "string"
