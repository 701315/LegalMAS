        Ответь строго в JSON:
        {
          "inheritance_basis_status": "<defined / not_defined>",
          "inheritance_basis": "<will / by_law / not_defined>",
          "other_heirs_warranty_status": "<defined / not_defined>",
          "other_heirs_warranty_details": "<текст или 'Данные не определены'>",
          "mandatory_share_status": "<defined / not_defined>",
          "inheritance_disputes_status": "<defined / not_defined>",
          "inheritance_disputes_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_query: "наследство свидетельство о праве на наследство наследодатель наследник завещание наследование по закону отсутствие иных наследников круг наследников срок вступления в наследство обязательная доля обязательные наследники наследственные споры ст. 1149 ГК РФ ст. 1154 ГК РФ"
      preferred_unit_types:
