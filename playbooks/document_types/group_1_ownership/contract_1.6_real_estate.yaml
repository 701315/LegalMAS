        ст. 61.2, 61.3).
        Проверяется только один вопрос: банкротный риск продавца и риск оспаривания
        сделки как подозрительной.
        Не анализируй обременения, ЗОУИТ, аренду или перепланировки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение продавца об отсутствии банкротных процедур.
        2. Заверение об отсутствии признаков несостоятельности.
        3. Прямую ссылку на ст. 61.2 ФЗ-127 или «подозрительную сделку».
        4. Цену сделки относительно рыночной стоимости (при наличии).

        [ПРАВИЛА]
