  - id: seller_bankruptcy_check
    name: "Банкротный риск продавца (ФЗ-127, ст. 61.2)"
    description: >
      Фактографическая проверка наличия заверений об отсутствии банкротных
      процедур и признаков несостоятельности продавца. Самостоятельный check
      из-за критичности риска оспаривания сделки.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не находится в процедуре банкротства"
        - "отсутствие признаков банкротства"
        - "несостоятельность"
        - "процедура наблюдения"
        - "конкурсное производство"
        - "внешнее управление"
        - "финансовое оздоровление"
        - "ст. 61.2"
        - "подозрительная сделка"
        - "сделка в ущерб кредиторам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"
        - "(?i)банкротств|несостоятельност"
        - "(?i)ст\\s*\\.?\\s*61\\.2"
