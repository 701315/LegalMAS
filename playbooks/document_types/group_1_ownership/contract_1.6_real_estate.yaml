        Анализируется договор купли-продажи недвижимости, находящейся в ипотеке
        (ФЗ-102, ст. 37; ФЗ-218).
        Проверяется наличие согласия залогодержателя и механизм снятия ипотеки.

        [ЗАДАЧА]
