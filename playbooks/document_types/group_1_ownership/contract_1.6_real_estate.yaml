          required: false
          display_in_grid: false

      store_payload: true

  - id: subject_title_cluster
    name: "Предмет договора и титул продавца"
    description: >
      Фактографическая проверка идентификации объекта недвижимости
      (кадастровый номер, адрес, площадь, вид) и правоустанавливающих
      документов продавца. В DD Grid показывает только user-facing
      характеристики объекта и summary по основанию права продавца.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "расположен"
        - "находится по адресу"
        - "выписка из ЕГРН"
        - "правоустанавливающ"
        - "правоподтверждающ"
        - "запись ЕГРН"
        - "свидетельство о праве"
        - "основание права"
        - "ЕГРН"
        - "Росреестр"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)площадь.*?\\d+.*?(кв|га)"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: как индивидуализирован объект недвижимости
        и указано ли основание права продавца на этот объект.

        Нормативный ориентир:
        - ст. 549, 554 ГК РФ
        - ФЗ-218 «О государственной регистрации недвижимости»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер объекта.
        2. Адрес объекта.
        3. Площадь объекта с единицей измерения.
        4. Вид объекта так, как он назван в договоре.
        5. Есть ли ссылка на выписку из ЕГРН.
        6. Указан ли правоустанавливающий документ продавца и его реквизиты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        3. Не выводи кадастровый номер, адрес, площадь, вид объекта или основание права,
           если они не указаны прямо либо не определены через названный в договоре
           внешний документ.
        4. Если параметр прямо определяется по названному внешнему документу
           (например, выписке из ЕГРН, Приложению №1, поэтажному плану, экспликации),
           это не отсутствие регулирования; отрази это в user-facing поле, например:
           - "Согласно выписке из ЕГРН от 01.03.2026"
           - "Согласно Приложению №1"
        5. Общая ссылка на ЕГРН или документы без конкретизации параметра
           не является достаточным основанием для "defined" по каждому полю.
        6. Выписка из ЕГРН не является правоустанавливающим документом сама по себе.
           Если в договоре указана только выписка ЕГРН, но не указано основание
           возникновения права продавца, то:
           - egrn_extract_status может быть "defined",
           - но title_document_status должен быть "not_defined".
        7. Если в договоре несколько объектов, перечисляй соответствующие значения
           в одном поле через "; ".
        8. Для текстовых полей используй:
           - cadastral_number_value:
             "Не установлен" — если номер прямо не указан;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - address_details:
             "Не установлен" — если адрес прямо не указан;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - area_details:
             "Не установлена" — если площадь прямо не указана;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - object_type_details:
             "Не установлен" — если вид объекта прямо не указан;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - egrn_extract_details:
             "Не установлены" — если реквизиты выписки не указаны;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - title_document_type:
             "Не установлен" — если тип документа не указан;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - title_document_details:
             "Не установлены" — если реквизиты документа не указаны;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - title_document_display:
             "Не установлено" — если основание права продавца прямо не указано;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец продаёт квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5,
        кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м.
        Право собственности подтверждается выпиской из ЕГРН от 01.03.2026,
        возникло на основании договора купли-продажи от 15.06.2015."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:06:0001001:123",
          "address_status": "defined",
          "address_details": "г. Москва, ул. Ленина, д. 5, кв. 12",
          "area_status": "defined",
          "area_details": "45,3 кв.м",
          "object_type_code": "apartment",
          "object_type_details": "квартира",
          "egrn_extract_status": "defined",
          "egrn_extract_details": "Выписка из ЕГРН от 01.03.2026",
          "title_document_status": "defined",
          "title_document_type": "договор купли-продажи",
          "title_document_details": "от 15.06.2015",
          "title_document_display": "Договор купли-продажи от 15.06.2015",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Продавец продаёт квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м. Право собственности подтверждается выпиской из ЕГРН от 01.03.2026, возникло на основании договора купли-продажи от 15.06.2015."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Объект недвижимости определяется согласно Приложению №1 к настоящему договору.
        Право продавца подтверждается выпиской из ЕГРН от 12.04.2026.
