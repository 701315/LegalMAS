        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи земельного участка.
        Проверяется только один вопрос: есть ли в договоре кадастровый номер
        земельного участка, необходимый для его однозначной идентификации
        по ст. 554 ГК РФ.
        Не анализируй цену, обременения, расчёты или иные темы.

        Нормативный ориентир:
        - ст. 554 ГК РФ (данные, позволяющие определённо установить объект)
        - ФЗ-218 «О государственной регистрации недвижимости»

        [ЗАДАЧА]
        Найди в тексте договора кадастровый номер земельного участка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Кадастровый номер имеет формат NN:NN:NNNNNNN:N
           (например, 50:20:0010203:456). Ищи именно такой формат.
        3. Не выводи кадастровый номер из контекста — только если он прямо
           написан в тексте договора.
        4. Если кадастровый номер прямо определяется по названному внешнему
           документу (Приложению, выписке из ЕГРН), это не отсутствие номера;
           отрази это в user-facing поле.
        5. Для текстовых полей используй:
           - "Не установлен" — если номер прямо не указан и нет ссылки
             на названный внешний документ;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец продаёт земельный участок, кадастровый номер 50:20:0010203:456,
        площадью 1 200 кв.м, категория земель: земли населённых пунктов."

        Ответ:
        {
          "cadastral_number_presence_status": "defined",
          "cadastral_number_value": "50:20:0010203:456",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "земельный участок, кадастровый номер 50:20:0010203:456, площадью 1 200 кв.м"
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Характеристики земельного участка определяются согласно
        выписке из ЕГРН (Приложение №1)."

        Ответ:
        {
          "cadastral_number_presence_status": "defined",
          "cadastral_number_value": "Согласно выписке из ЕГРН (Приложение №1)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Характеристики земельного участка определяются согласно выписке из ЕГРН (Приложение №1)."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец продаёт земельный участок площадью 800 кв.м."

        Ответ:
        {
          "cadastral_number_presence_status": "not_defined",
          "cadastral_number_value": "Не установлен",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли кадастровый номер в формате NN:NN:NNNNNNN:N прямо в тексте?
        2. Если номер не указан прямо, есть ли ссылка на названный внешний документ,
           в котором он определяется?
        3. Если ни того, ни другого нет — "not_defined" / "Не установлен".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "cadastral_number_presence_status": "<defined / not_defined>",
          "cadastral_number_value": "<номер или ссылка на документ или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
