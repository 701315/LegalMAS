              "quote": "Продавец обязуется за счёт полученного задатка в размере 3 000 000 рублей досрочно погасить кредит в АО «Альфа-Банк» и обеспечить снятие обременения до подачи документов на государственную регистрацию."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец продаёт объект покупателю за 12 000 000 рублей."

        Ответ:
        {
          "mortgagee_consent_status": "not_defined",
          "mortgagee_consent_details": "Не установлено",
          "clearance_mechanism_status": "not_defined",
          "clearance_mechanism_code": "not_defined",
          "clearance_mechanism_details": "Не установлено",
          "simultaneous_registration_status": "not_defined",
          "simultaneous_registration_details": "Не установлено",
          "mortgage_amount_status": "not_defined",
          "mortgage_amount_value": "Не установлена",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание согласия банка / залогодержателя?
        2. Описан ли механизм погашения ипотеки?
           Различай: аккредитив / эскроу / депозит нотариуса / прямой платёж /
           погашение до сделки из задатка или собственных средств.
        3. Есть ли прямое условие об одновременной или последовательной
           регистрации перехода права и снятия ипотеки?
        4. Указана ли сумма ипотечного долга или сумма для погашения?
        5. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "mortgagee_consent_status": "<defined / not_defined>",
          "mortgagee_consent_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "clearance_mechanism_status": "<defined / not_defined>",
          "clearance_mechanism_code": "<accreditive / escrow / notary_deposit / direct_payment / prepaid / not_defined>",
          "clearance_mechanism_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "simultaneous_registration_status": "<defined / not_defined>",
          "simultaneous_registration_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "mortgage_amount_status": "<defined / not_defined>",
          "mortgage_amount_value": "<сумма или 'Не установлена' / 'Не удалось определить'>",
