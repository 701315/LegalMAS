# ──────────────────────────────────────────────────────────────────────────
  # CHECK 14: Семейные риски — супруг, маткапитал, опека
  # ──────────────────────────────────────────────────────────────────────────
  - id: family_risks_check
    name: "Семейные риски: согласие супруга, маткапитал и разрешение органов опеки"
    description: >
      Фактографическая проверка трёх взаимосвязанных семейных рисков:
      нотариальное согласие супруга или подтверждение отсутствия брака,
      использование маткапитала и выделение долей детям,
      разрешение органов опеки при наличии несовершеннолетних.
      Все три темы касаются состава семьи и прав на общее имущество.
    triggers:
      any: ["individual_party", "residential_property"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
