#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_authority_cluster
    name: "Стороны, полномочия и корпоративное одобрение"
    description: >
      Фактографическая проверка идентификации продавца и покупателя, полномочий
      подписантов и корпоративного одобрения сделки для юридических лиц.
      В DD Grid показывает только role-specific user-facing данные о Продавце и Покупателе;
      поля о полномочиях и корпоративном одобрении сохраняются для drawer / payload.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "не является крупной сделкой"
        - "корпоративное одобрение"
        - "устав"
        - "доверенность"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: кто является Продавцом и Покупателем,
        кто подписывает договор от их имени, на каком основании, и есть ли
        в тексте договора указание на корпоративное одобрение сделки либо
        прямое указание, что такое одобрение не требуется.

        Нормативный ориентир:
        - ст. 182, 185 ГК РФ
        - ст. 432, 549, 550 ГК РФ
        - ФЗ-14 «Об ООО»
        - ФЗ-208 «Об АО»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямо указанные данные о Продавце.
        2. Есть ли прямо указанные данные о Покупателе.
        3. Кто подписывает договор от имени Продавца и на каком основании.
        4. Кто подписывает договор от имени Покупателя и на каком основании.
        5. Есть ли в договоре прямое указание на корпоративное одобрение сделки
           либо прямое указание, что такое одобрение не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        3. Если в договоре несколько продавцов или несколько покупателей,
           перечисляй их в одном поле через "; ".
        4. Для текстовых полей используй:
           - seller_details_value / buyer_details_value:
             "Не установлены" — если реквизиты прямо не указаны;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - seller_display / buyer_display:
             "Не установлен" — если сторону нельзя прямо определить;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - seller_signatory / buyer_signatory:
             "Не установлен" — если подписант прямо не указан;
             "Не удалось определить" — если данные противоречивы или неоднозначны.
           - corporate_approval_details:
             "Не установлено" — если прямого указания нет;
             "Не применимо" — если из текста следует, что соответствующая сторона
             не является юридическим лицом и отдельной оговорки об одобрении нет;
             "Не удалось определить" — если данные противоречивы.
        5. Если параметр прямо определяется в ином названном документе,
           на который ссылается договор (например, доверенности),
           это можно учитывать только если такая ссылка прямо есть в договоре.
        6. Общие фразы вроде "стороны обладают необходимой правоспособностью",
           "представитель действует законно", "сделка соответствует законодательству"
           без конкретизации не являются достаточным основанием для "defined"
           по корпоративному одобрению.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Иванова А.А., действующего на основании Устава.
        Покупатель — гражданин Петров Борис Борисович, паспорт серия 45 00 № 123456,
        действующий от своего имени.
        Сделка одобрена советом директоров Продавца, протокол № 5 от 01.03.2026."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details_value": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "seller_display": "ООО «Строй-Инвест»",
          "seller_type": "legal_entity",
          "seller_signatory": "Генеральный директор Иванов А.А.",
          "seller_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details_value": "Петров Борис Борисович, паспорт серия 45 00 № 123456",
          "buyer_display": "Петров Борис Борисович",
          "buyer_type": "individual",
          "buyer_signatory": "Петров Борис Борисович",
          "buyer_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Сделка одобрена советом директоров Продавца, протокол № 5 от 01.03.2026",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, в лице Генерального директора Иванова А.А., действующего на основании Устава. Покупатель — гражданин Петров Борис Борисович, паспорт серия 45 00 № 123456, действующий от своего имени. Сделка одобрена советом директоров Продавца, протокол № 5 от 01.03.2026."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец — Иванов Иван Иванович, паспорт серии 45 01 № 111111.
        Покупатель — Петров Петр Петрович, паспорт серии 45 02 № 222222."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details_value": "Иванов Иван Иванович, паспорт серии 45 01 № 111111",
          "seller_display": "Иванов Иван Иванович",
          "seller_type": "individual",
          "seller_signatory": "Иванов Иван Иванович",
          "seller_signatory_basis": "personal",
          "buyer_details_status": "defined",
          "buyer_details_value": "Петров Петр Петрович, паспорт серии 45 02 № 222222",
          "buyer_display": "Петров Петр Петрович",
          "buyer_type": "individual",
          "buyer_signatory": "Петров Петр Петрович",
          "buyer_signatory_basis": "personal",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не применимо",
          "evidence": [
            {
