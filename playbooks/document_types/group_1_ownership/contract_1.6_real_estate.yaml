  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Публично-правовые ограничения и техническое состояние
  # ──────────────────────────────────────────────────────────────────────────
  - id: public_law_restrictions_check
    name: "Публично-правовые ограничения: ЗОУИТ, экология, сервитуты, перепланировки"
    description: >
      Фактографическая проверка раскрытия публично-правовых ограничений объекта:
      ЗОУИТ, охранные зоны, санитарные зоны, культурное наследие, экологическое
      состояние, инженерные сервитуты, перепланировки.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "СЗЗ"
        - "санитарно-защитная зона"
        - "ЗОУИТ"
        - "зона с особыми условиями"
        - "охранная зона"
        - "культурное наследие"
        - "ОКН"
        - "объект культурного наследия"
        - "экологическое состояние"
        - "загрязнение"
        - "захоронение"
        - "свалка"
        - "сервитут"
        - "охранная зона сетей"
        - "перепланировка"
        - "реконструкция"
        - "согласованная перепланировка"
        - "самовольная перепланировка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)санитарно\\s*[- ]?защитн|ЗОУИТ|СЗЗ"
        - "(?i)культурн(ого)?\\s+наслед"
        - "(?i)экологическ|свалк|захоронен|загрязнен"
        - "(?i)сервитут|охранн(ая|ой)\\s+зон"
        - "(?i)перепланировк|реконструкц"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (ФЗ-218; ЗК РФ; ГрК РФ).
        Проверяется только один вопрос: публично-правовые ограничения и техническое
        состояние объекта — ЗОУИТ, экология, сервитуты, перепланировки.
        Не анализируй обременения (залог, ипотека), аресты, аренду,
        задолженность или банкротство продавца.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Раскрытие ЗОУИТ / охранных зон / санитарно-защитных зон.
        2. Упоминание объектов культурного наследия (ОКН).
        3. Экологическое состояние участка/объекта.
        4. Раскрытие инженерных коммуникаций и сервитутов.
        5. Перепланировки (согласованы / не проводились / самовольные).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Объект не входит в ЗОУИТ. Перепланировок не проводилось.
        Экологическое состояние соответствует нормативным требованиям."
        Ответ:
        {
          "zouit_status": "defined",
          "zouit_details": "объект не входит в ЗОУИТ",
