    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора
        купли-продажи здания или сооружения условия о правах на земельный участок
        под объектом: вид передаваемых прав, кадастровый номер участка, площадь
        и согласие арендодателя при аренде.
        Не анализируй общие параметры здания, цену, расчёты, ипотеку и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        Не домысливай права на землю из ст. 552 ГК РФ — только из текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. land_rights_transfer_status:
           - "defined" — если в тексте прямо указан вид передаваемых прав
             на земельный участок под зданием, либо прямо указано, что права
             определяются по названному внешнему документу;
           - "not_defined" — если о правах на землю ничего прямо не написано
             или их нельзя надёжно определить.

        2. land_rights_transfer_code:
           Используй только одно из значений:
           - "ownership" — право собственности;
           - "lease" — право аренды;
           - "perpetual_use" — постоянное (бессрочное) пользование;
           - "gratuitous_use" — безвозмездное пользование;
           - "other" — иное прямо названное право;
           - "not_defined" — если вид прав прямо не указан
             (в том числе если права определяются по приложению без указания вида).

        3. land_rights_transfer_details:
           Краткое user-facing описание передаваемых прав на землю
           на русском языке.
           Правила:
           - если вид прав прямо указан, верни краткое summary, например:
             "Право собственности на земельный участок передаётся одновременно
             со зданием",
             "Право аренды земельного участка переходит к Покупателю;
             договор аренды № А-15 от 10.01.2020, срок 25 лет";
           - если права определяются по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №2";
           - не копируй длинные абзацы;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        4. land_cadastral_number_status:
           - "defined" — если кадастровый номер участка прямо указан
             или прямо определяется по названному внешнему документу;
           - "not_defined" — если кадастровый номер прямо не указан
             или его нельзя надёжно определить.

        5. land_cadastral_number_value:
           Краткое user-facing значение кадастрового номера участка
           на русском языке.
           Правила:
           - если номер прямо указан в формате NN:NN:NNNNNNN:N, верни сам номер;
           - если номер определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №2";
           - не выводи кадастровый номер из контекста — только если прямо написан;
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        6. land_area_status:
           - "defined" — если площадь участка прямо указана
             или прямо определяется по названному внешнему документу;
           - "not_defined" — если площадь прямо не указана
             или её нельзя надёжно определить.

        7. land_area_value:
           Краткое user-facing значение площади участка на русском языке.
           Правила:
           - если площадь прямо указана, верни её с единицей измерения,
             например: "1 200 кв.м";
           - если площадь определяется по названному внешнему документу,
             верни понятную формулировку, например:
             "Согласно Приложению №2";
           - если данных нет — "Не установлена";
           - если данные противоречивы — "Не удалось определить".

        8. lease_consent_status:
           - "defined" — если в тексте прямо урегулировано согласие арендодателя
             (получено / не требуется / требуется, но не получено);
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.

        9. lease_consent_details:
           Краткое user-facing описание условия о согласии арендодателя
           на русском языке.
           Правила:
           - если получено согласие, верни краткое summary с реквизитами
             (если указаны);
           - если прямо указано, что согласие не требуется (например, по ст. 22 ЗК РФ
             при сроке аренды более 5 лет), верни:
             "Согласие арендодателя не требуется (ст. 22 ЗК РФ, срок аренды
             более 5 лет)";
           - если участок в собственности и согласие явно неприменимо —
             "Не применимо";
           - если участок в аренде, но вопрос о согласии прямо не урегулирован —
             "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, ЗК, судебную практику, обычную практику
          или предположения вместо текста договора.
        - Не домысливай права на землю из ст. 552 ГК РФ автоматически.
          Если о земле ничего не написано — "not_defined" по всем полям.
        - Не смешивай параметры земельного участка с параметрами самого здания
          (площадь здания ≠ площадь участка, кадастровый номер здания ≠ кадастровый
          номер участка).
        - Если параметр прямо определяется по названному внешнему документу
          (приложению, выписке из ЕГРН), считай его определённым и отрази
          это в user-facing поле.
        - Для lease_consent_details:
          * если участок в собственности → "Не применимо";
          * если участок в аренде, но вопрос о согласии не урегулирован →
            "Не установлено";
          * если прямо написано, что согласие не требуется по ст. 22 ЗК РФ →
            отрази это явно.
        - Для land_rights_transfer_code используй только:
          "ownership", "lease", "perpetual_use", "gratuitous_use",
          "other", "not_defined".
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 9 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для land_rights_transfer_code используй только:
          "ownership", "lease", "perpetual_use", "gratuitous_use",
          "other", "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          land_rights_transfer_details → "Не установлены"
          land_cadastral_number_value → "Не установлен"
          land_area_value → "Не установлена"
          lease_consent_details → "Не установлено" или "Не применимо"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "land_rights_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вида передаваемых прав на землю."
          required: true
          display_in_grid: false

        - name: "land_rights_transfer_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["ownership", "lease", "perpetual_use", "gratuitous_use", "other", "not_defined"]
          description: "Вид передаваемых прав на земельный участок."
          required: true
          display_in_grid: false

        - name: "land_rights_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Права на землю"
          description: >
            Краткое user-facing summary о виде передаваемых прав на земельный
            участок под зданием: собственность, аренда, постоянное пользование
            или иное, либо ссылка на названный внешний документ.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "land_cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения кадастрового номера участка."
          required: true
          display_in_grid: false

        - name: "land_cadastral_number_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер участка"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: >
            Кадастровый номер земельного участка под зданием либо понятная
            ссылка на названный внешний документ, по которому он определяется.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "land_area_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения площади участка."
          required: true
          display_in_grid: false

        - name: "land_area_value"
          type: "string"
          presentation: "fact"
          label: "Площадь участка"
          description: >
            Площадь земельного участка под зданием с единицей измерения
            либо понятная ссылка на названный внешний документ.
            Fallback: "Не установлена" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "lease_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о согласии арендодателя."
          required: true
          display_in_grid: false

        - name: "lease_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие арендодателя"
          description: >
            Краткое user-facing summary о согласии арендодателя: получено,
            не требуется по ст. 22 ЗК РФ, не применимо (собственность)
            или не установлено (аренда без явного регулирования).
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: real_estate_asset_schedule_cluster
    name: "Перечень объектов сделки"
    description: >
      Извлечение полного перечня всех объектов недвижимости, передаваемых
      по договору, включая объекты, детально раскрытые в приложениях,
      спецификациях и реестрах. Inventory-style check: строит список всех
      объектов сделки, а не summary одного объекта.
      В DD Grid показывает краткое summary; полный список — в drawer / payload.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование объекта"
        - "кадастровый номер"
        - "площадь объекта"
        - "адрес объекта"
        - "перечень объектов"
        - "недвижимое имущество"
        - "спецификация"
        - "реестр"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(перечень|список|реестр|спецификац)[а-я]*\\s+(объект|имуществ)"
        - "(?i)наименование\\s+объекта"
        - "(?i)кадастровый\\s+номер"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: полный перечень всех объектов
        недвижимости, передаваемых по сделке.
        Не анализируй цену, расчёты, обременения, ипотеку или иные темы.

        [ЗАДАЧА]
        Определи:
        1. Содержит ли договор (включая приложения, спецификации, реестры)
           индивидуализированный перечень объектов недвижимости.
        2. Какие объекты передаются по сделке.

        [ПРАВИЛА]
        1. Используй только текст договора и переданный контекст.
        2. Учитывай основной текст и приложения / реестры / спецификации.
        3. Если приложение упомянуто, но объекты из него недоступны в контексте —
           отрази ссылку на приложение в summary, не молчи.
        4. Если объектов несколько — перечисли все.
        5. Если объект один — список из одной строки.
        6. Дедуплицируй по кадастровому номеру; если номера нет —
           по комбинации вид + площадь + адрес.
        7. Не включай общие описания предмета без индивидуализации объекта.
        8. Если объектов в контексте больше, чем позволяет вывести лимит,
           выведи первые найденные и добавь в конце:
           "... [ВНИМАНИЕ: Список может быть неполным]".
        9. Для asset_schedule_summary верни краткое user-facing описание:
           - если объект один: вид + кадастровый номер (если есть),
             например: "1 объект: квартира 77:06:0001001:123";
           - если объектов несколько: количество + перечень видов,
             например: "3 объекта: квартира, нежилое помещение, земельный участок";
           - если перечень в приложении, но объекты недоступны:
             "Перечень в Приложении №1; детали недоступны в контексте".
        10. Для текстовых полей используй:
            - "Не установлен" — для asset_schedule_summary, если перечня нет;
            - "Не установлены" — для asset_schedule_details, если перечня нет;
            - "Не удалось определить" — если данные противоречивы.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — один объект:
        Фрагмент:
        "Продавец продаёт квартиру, расположенную по адресу: г. Москва,
        ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123,
        площадью 45,3 кв.м."

        Ответ:
        {
          "asset_schedule_status": "defined",
          "asset_schedule_summary": "1 объект: квартира 77:06:0001001:123",
          "asset_schedule_details": "Квартира | 77:06:0001001:123 | 45,3 кв.м | г. Москва, ул. Ленина, д. 5, кв. 12",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123, площадью 45,3 кв.м."
            }
          ]
        }

        Пример 2 — несколько объектов:
        Фрагмент:
        "По настоящему договору передаются:
        1) нежилое здание, кадастровый номер 77:01:0001001:456, площадью 320 кв.м,
           г. Москва, ул. Тверская, д. 10;
        2) земельный участок, кадастровый номер 77:01:0001001:100,
           площадью 800 кв.м, г. Москва, ул. Тверская, д. 10."

        Ответ:
        {
          "asset_schedule_status": "defined",
          "asset_schedule_summary": "2 объекта: нежилое здание, земельный участок",
          "asset_schedule_details": "Нежилое здание | 77:01:0001001:456 | 320 кв.м | г. Москва, ул. Тверская, д. 10\nЗемельный участок | 77:01:0001001:100 | 800 кв.м | г. Москва, ул. Тверская, д. 10",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "нежилое здание, кадастровый номер 77:01:0001001:456, площадью 320 кв.м, г. Москва, ул. Тверская, д. 10"
            }
          ]
        }

        Пример 3 — перечень в приложении, недоступном в контексте:
        Фрагмент:
        "Перечень объектов недвижимости, передаваемых по договору,
        приведён в Приложении №1, являющемся неотъемлемой частью договора."

        Ответ:
        {
          "asset_schedule_status": "defined",
          "asset_schedule_summary": "Перечень в Приложении №1; детали недоступны в контексте",
          "asset_schedule_details": "Перечень объектов определяется Приложением №1 к договору",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Перечень объектов недвижимости, передаваемых по договору, приведён в Приложении №1, являющемся неотъемлемой частью договора."
            }
          ]
        }

        Пример 4 — объекты не указаны:
        Фрагмент:
        "Продавец передаёт покупателю недвижимое имущество."

        Ответ:
        {
          "asset_schedule_status": "not_defined",
          "asset_schedule_summary": "Не установлен",
          "asset_schedule_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в контексте хотя бы один индивидуализированный объект?
        2. Если объектов несколько — все ли включены в список?
        3. Если приложение упомянуто, но недоступно — отражена ли ссылка?
        4. Дедуплицированы ли объекты?
        5. Если объект один — summary из одной строки.
        6. Если данных нет — "Не установлен" / "Не установлены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "asset_schedule_status": "<defined / not_defined>",
          "asset_schedule_summary": "<краткое описание или 'Не установлен' / 'Не удалось определить'>",
          "asset_schedule_details": "<список объектов или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1200
    retrieval:
      position_bias:
        preferred_range: [0.3, 0.75]
        boost: 0.15
        scope: segment
      retrieval_profile: "definitions_check"
      corpus_scope: "document"
      levels:
        - "section"
        - "legal_unit"
      required_kind: "section"
      retrieval_query: "перечень объектов недвижимости реестр имущества спецификация приложение недвижимое имущество наименование объекта кадастровый номер площадь адрес назначение"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "не обременен"
        - "арест"
        - "банкротство"
        - "подсудность"
        - "конфиденциальность"
        - "расторжение"
        - "ипотека в силу закона"
      context_k: 10
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: false
      min_snippet_length: 20
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь полный перечень всех объектов
        недвижимости, которые передаются по договору, включая объекты, перечисленные
        в приложениях, спецификациях и реестрах.
        Не анализируй цену, расчёты, обременения, ипотеку, банкротство и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. asset_schedule_status:
           - "defined" — если в контексте есть хотя бы один индивидуализированный
             объект недвижимости или прямая ссылка на приложение / реестр с объектами;
           - "not_defined" — если объекты не индивидуализированы
             и нет ссылки на названный внешний документ.

        2. asset_schedule_summary:
           Краткое user-facing описание перечня объектов на русском языке.
           Правила:
           - если объект один, верни:
             "<Вид объекта> <кадастровый номер если есть>",
             например: "1 объект: квартира 77:06:0001001:123",
             "1 объект: нежилое помещение (кадастровый номер не указан)";
           - если объектов несколько, верни:
             "<N> объектов: <перечень видов через запятую>",
             например: "3 объекта: квартира, нежилое помещение, земельный участок";
           - если перечень в приложении, но объекты недоступны в контексте, верни:
             "Перечень в Приложении №N; детали недоступны в контексте";
           - не копируй длинный список в это поле;
           - если данных нет — "Не установлен";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. asset_schedule_details:
           Полный нормализованный список объектов на русском языке.
           Правила:
           - одна строка на один объект в формате:
             "<Вид объекта> | <Кадастровый номер или 'б/н'> | <Площадь или 'б/п'> | <Адрес или 'б/а'>";
           - например:
             "Квартира | 77:06:0001001:123 | 45,3 кв.м | г. Москва, ул. Ленина, д. 5, кв. 12";
           - если поле объекта отсутствует, используй:
             "б/н" — без номера, "б/п" — без площади, "б/а" — без адреса;
           - строки разделяй символом новой строки (\n);
           - если в основном тексте и приложении один и тот же объект —
             дедуплицируй, предпочитай детальную карточку из приложения;
           - дедупликация по кадастровому номеру; если номера нет —
             по комбинации вид + площадь + адрес;
           - не включай общие описания предмета без индивидуализации;
           - если объектов в контексте больше, чем позволяет вывести лимит,
             выведи первые найденные и добавь в конце:
             "... [ВНИМАНИЕ: Список может быть неполным]";
           - если перечень в приложении, но объекты недоступны в контексте, верни:
             "Перечень объектов определяется Приложением №N к договору";
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй весь переданный контекст, включая фрагменты из приложений,
          реестров и спецификаций.
        - Если приложение упомянуто, но его содержимое недоступно в контексте,
          отрази ссылку на приложение в обоих полях — не молчи.
        - Не включай в список объекты, которые упомянуты как обременения,
          залоги, арендованное третьими лицами имущество или иные нерелевантные
          объекты — только то, что прямо передаётся по сделке.
        - Если один и тот же объект описан и в основном тексте, и в приложении,
          предпочитай детальную карточку из приложения как более авторитетный источник.
        - Дедуплицируй объекты по кадастровому номеру; если номера нет —
          по комбинации вид + площадь + адрес.
        - Не подставляй данные из закона или обычной практики вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 3 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для asset_schedule_status используй только: "defined" или "not_defined".
        - Для asset_schedule_summary при отсутствии данных используй только:
          "Не установлен".
        - Для asset_schedule_details при отсутствии данных используй только:
          "Не установлены".
        - Для обоих текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "asset_schedule_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия полного перечня объектов сделки."
          required: true
          display_in_grid: false

        - name: "asset_schedule_summary"
          type: "string"
          presentation: "fact"
          label: "Объекты сделки"
          description: >
            Краткое user-facing описание перечня объектов для DD Grid:
            количество и виды объектов, либо ссылка на приложение.
            Например: "2 объекта: нежилое здание, земельный участок",
            "1 объект: квартира 77:06:0001001:123",
            "Перечень в Приложении №1; детали недоступны в контексте".
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "asset_schedule_details"
          type: "string"
          presentation: "fact"
          label: "Полный перечень объектов сделки"
          max_value_chars: 5000
          description: >
            Полный нормализованный перечень объектов недвижимости в формате:
            "<Вид> | <Кадастровый номер> | <Площадь> | <Адрес>", по одному объекту
            на строку. Для DD Grid скрыт; доступен в drawer / payload.
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: family_restrictions_spouse_guardianship_matcapital_check
    name: "Семейные ограничения: согласие супруга, опека, маткапитал"
    description: >
      Фактографическая проверка семейных ограничений и согласований,
      способных повлиять на действительность сделки с недвижимостью:
      нотариальное согласие супруга, согласие органа опеки и попечительства,
      а также использование материнского капитала и связанные с ним
      обязательства по долям детей.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие супруга"
        - "в браке не состоит"
        - "брачный договор"
        - "орган опеки"
        - "попечительства"
        - "несовершеннолетний"
        - "малолетний"
        - "подопечный"
        - "материнский капитал"
        - "маткапитал"
        - "средства материнского капитала"
        - "доли детям"
        - "выделение долей детям"
        - "пенсионный фонд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)в\\s+брак[еуа]\\s+не\\s+сост"
        - "(?i)брачн(ый|ого)\\s+договор"
        - "(?i)орган\\s+опек|попечительств"
        - "(?i)несовершеннолетн|малолетн|подопечн"
        - "(?i)материнск(ий|ого)\\s+капитал|маткапитал"
        - "(?i)дол[ияе]\\s+дет"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: семейные ограничения и согласования,
        влияющие на действительность сделки — согласие супруга, опека
        и материнский капитал.
        Не анализируй цену, расчёты, обременения, ипотеку, банкротство
        или иные темы.

        Нормативный ориентир:
        - ст. 35 СК РФ
        - ст. 37 ГК РФ
        - ФЗ «Об опеке и попечительстве»
        - нормы о материнском капитале и выделении долей детям

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли согласие супруга / указание, что оно не требуется.
        2. Есть ли согласие органа опеки и попечительства / указание
           на несовершеннолетних собственников или подопечных.
        3. Есть ли указание на использование материнского капитала
           и связанные с этим обязательства по долям детей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для spouse_consent_details:
           - если есть нотариальное согласие супруга, отрази реквизиты;
           - если прямо указано, что продавец в браке не состоит —
             отрази это;
           - если прямо указано, что согласие не требуется в силу брачного
             договора или иного прямо названного основания — отрази это;
           - если из текста прямо следует, что продавец — юридическое лицо,
             верни "Не применимо";
           - если данных нет — "Не установлено".
        4. Для guardianship_consent_details:
           - если есть несовершеннолетний собственник / подопечный и согласие
             органа опеки, отрази это;
           - если прямо указано, что несовершеннолетних собственников нет,
             отрази это;
           - если из текста прямо следует, что тема не применима
             (например, продавец — юридическое лицо или продаётся нежилой объект
             без указаний на несовершеннолетних собственников) — допускается
             "Не применимо";
           - если данных нет — "Не установлено".
        5. Для matcapital_details:
           - если прямо указано, что материнский капитал использовался,
             отрази это и укажи, что сказано о долях детям;
           - если прямо указано, что материнский капитал не использовался,
             отрази это;
           - если из текста прямо следует, что тема не применима
             (например, нежилой объект или продавец — юрлицо) — допускается
             "Не применимо";
           - если данных нет — "Не установлено".
        6. Для всех текстовых полей используй:
           - "Не установлено" — если данных нет;
           - "Не применимо" — только если неприменимость прямо следует из текста;
           - "Не удалось определить" — если данные противоречивы.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец состоит в браке. Нотариальное согласие супруги Ивановой М.А.
        на отчуждение квартиры выдано 10.03.2026 нотариусом г. Москвы Петровой Н.В.
        Разрешение органа опеки и попечительства № 15/26 от 12.03.2026 получено.
        Квартира приобреталась с использованием средств материнского капитала,
        доли детям выделены, что подтверждается выпиской из ЕГРН."

        Ответ:
        {
          "spouse_consent_status": "defined",
          "spouse_consent_details": "Нотариальное согласие супруги Ивановой М.А. от 10.03.2026",
          "guardianship_consent_status": "defined",
          "guardianship_consent_details": "Согласие органа опеки и попечительства № 15/26 от 12.03.2026 получено",
          "matcapital_status": "defined",
          "matcapital_details": "Материнский капитал использовался; указано, что доли детям выделены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Продавец состоит в браке. Нотариальное согласие супруги Ивановой М.А. на отчуждение квартиры выдано 10.03.2026 нотариусом г. Москвы Петровой Н.В. Разрешение органа опеки и попечительства № 15/26 от 12.03.2026 получено. Квартира приобреталась с использованием средств материнского капитала, доли детям выделены, что подтверждается выпиской из ЕГРН."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец подтверждает, что в браке не состоит. Несовершеннолетние
        собственники отсутствуют. Средства материнского капитала при приобретении
        объекта не использовались."

        Ответ:
        {
          "spouse_consent_status": "defined",
          "spouse_consent_details": "Указано, что Продавец в браке не состоит",
          "guardianship_consent_status": "defined",
          "guardianship_consent_details": "Указано, что несовершеннолетние собственники отсутствуют",
          "matcapital_status": "defined",
          "matcapital_details": "Указано, что материнский капитал не использовался",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Продавец подтверждает, что в браке не состоит. Несовершеннолетние собственники отсутствуют. Средства материнского капитала при приобретении объекта не использовались."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец — ООО «СтройИнвест». Предметом договора является нежилое помещение."

        Ответ:
        {
          "spouse_consent_status": "not_defined",
          "spouse_consent_details": "Не применимо",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Не применимо",
          "matcapital_status": "not_defined",
          "matcapital_details": "Не применимо",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Продавец — ООО «СтройИнвест». Предметом договора является нежилое помещение."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Продавец продаёт объект Покупателю."

        Ответ:
        {
          "spouse_consent_status": "not_defined",
          "spouse_consent_details": "Не установлено",
          "guardianship_consent_status": "not_defined",
          "guardianship_consent_details": "Не установлено",
          "matcapital_status": "not_defined",
          "matcapital_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на согласие супруга или на то, что оно не требуется?
        2. Есть ли прямое указание на опеку / несовершеннолетних собственников?
        3. Есть ли прямое указание на материнский капитал и доли детям?
        4. Если неприменимость прямо следует из текста — отрази "Не применимо".
        5. Если данных нет — "Не установлено".
        6. Если данные конфликтуют — "Не удалось определить".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "spouse_consent_status": "<defined / not_defined>",
          "spouse_consent_details": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "guardianship_consent_status": "<defined / not_defined>",
          "guardianship_consent_details": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "matcapital_status": "<defined / not_defined>",
          "matcapital_details": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие супруга нотариальное согласие супруга в браке не состоит брачный договор орган опеки попечительства несовершеннолетний малолетний подопечный материнский капитал маткапитал доли детям пенсионный фонд"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "цена"
        - "задаток"
        - "аванс"
        - "аккредитив"
        - "эскроу"
        - "ипотека"
        - "не обременен"
        - "арест"
        - "банкротство"
        - "подсудность"
        - "конфиденциальность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.10
        scope: segment
      context_k: 7
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о семейных ограничениях и согласованиях: согласие супруга,
        согласие органа опеки / несовершеннолетние собственники и материнский капитал.
        Не анализируй цену, расчёты, обременения, ипотеку, передачу объекта,
        банкротство и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. spouse_consent_status:
           - "defined" — если в тексте прямо указано нотариальное согласие супруга,
             либо прямо указано, что согласие не требуется / продавец в браке не состоит;
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.

        2. spouse_consent_details:
           Краткое user-facing описание по согласию супруга на русском языке.
           Правила:
           - если есть нотариальное согласие, кратко отрази его реквизиты;
           - если указано, что продавец в браке не состоит, отрази это;
           - если указано, что согласие не требуется в силу брачного договора
             или иного прямо названного основания, отрази это;
           - если из текста прямо следует, что продавец — юридическое лицо,
             верни "Не применимо";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        3. guardianship_consent_status:
           - "defined" — если в тексте прямо указано согласие органа опеки,
             сведения о несовершеннолетнем собственнике / подопечном,
             либо прямо указано, что таких лиц нет;
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.

        4. guardianship_consent_details:
           Краткое user-facing описание по опеке и несовершеннолетним
           на русском языке.
           Правила:
           - если есть согласие органа опеки, кратко отрази его реквизиты;
           - если указано, что несовершеннолетние собственники отсутствуют,
             отрази это;
           - если из текста прямо следует, что тема неприменима
             (например, продавец — юрлицо или предмет — нежилой объект
             без указаний на несовершеннолетних собственников), допускается
             "Не применимо";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".

        5. matcapital_status:
           - "defined" — если в тексте прямо указано использование или
             неиспользование материнского капитала;
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.

        6. matcapital_details:
           Краткое user-facing описание по материнскому капиталу
           на русском языке.
           Правила:
           - если маткапитал использовался, кратко отрази это и укажи,
             что сказано о долях детям;
           - если прямо указано, что маткапитал не использовался, отрази это;
           - если из текста прямо следует неприменимость темы
             (например, нежилой объект или продавец — юрлицо), допускается
             "Не применимо";
           - если данных нет — "Не установлено";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы СК РФ, практику Росреестра, судебную практику
          или предположения вместо текста договора.
        - Не смешивай согласие супруга на отчуждение объекта с нотариальной
          формой самого договора — это разные вопросы.
        - Не смешивай тему опеки с корпоративными одобрениями.
        - Если неприменимость прямо следует из текста, используй "Не применимо".
        - Если по теме нет прямого указания, используй "Не установлено".
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          spouse_consent_details → "Не установлено" или "Не применимо"
          guardianship_consent_details → "Не установлено" или "Не применимо"
          matcapital_details → "Не установлено" или "Не применимо"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "spouse_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сведений о согласии супруга."
          required: true
          display_in_grid: false

        - name: "spouse_consent_details"
          type: "string"
          presentation: "fact"
          label: "Согласие супруга"
          description: >
            Краткое user-facing summary о согласии супруга, отсутствии брака
            либо ином прямо указанном основании, по которому согласие не требуется.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "guardianship_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сведений об опеке и несовершеннолетних собственниках."
          required: true
          display_in_grid: false

        - name: "guardianship_consent_details"
          type: "string"
          presentation: "fact"
          label: "Опека / несовершеннолетние"
          description: >
            Краткое user-facing summary о согласии органа опеки, наличии или
            отсутствии несовершеннолетних собственников / подопечных.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "matcapital_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сведений о материнском капитале."
          required: true
          display_in_grid: false

        - name: "matcapital_details"
          type: "string"
          presentation: "fact"
          label: "Материнский капитал"
          description: >
            Краткое user-facing summary об использовании / неиспользовании
            материнского капитала и указаниях о долях детям.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: notarial_form_requirement_check
    name: "Нотариальная форма договора и расходы на нотариуса"
    description: >
      Фактографическая проверка наличия условия о нотариальном удостоверении
      сделки (обязательном или добровольном) и распределения расходов 
      на оплату нотариального тарифа и услуг правового и технического характера (УПТХ).
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "нотариус"
        - "нотариальная форма"
        - "нотариальное удостоверение"
        - "удостоверен нотариусом"
        - "реестровый номер"
        - "врио нотариуса"
        - "нотариальный тариф"
        - "услуги правового и технического характера"
        - "УПТХ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ая|ое|ой)\\s+(форм|удостоверен)"
        - "(?i)удостоверен.*нотариус"
        - "(?i)нотариальн(ый|ого)\\s+тариф"
        - "(?i)услуг(и|\\s+правового\\s+и\\s+технического\\s+характера|УПТХ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: подлежит ли договор нотариальному
        удостоверению и как распределяются расходы на нотариуса.
        Не анализируй согласие супруга, опеку, цену объекта, банковские
        расходы или государственную пошлину за регистрацию в Росреестре.

        Нормативный ориентир:
        - ст. 163 ГК РФ (нотариальное удостоверение сделок)
        - ФЗ-218 (обязательная нотариальная форма для долей и имущества несовершеннолетних)
        - Основы законодательства РФ о нотариате

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на то, что договор подлежит нотариальному удостоверению
           (или уже удостоверен).
        2. Условия распределения расходов на оплату нотариального тарифа
           и услуг правового и технического характера (УПТХ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не додумывай за стороны: если в тексте нет ни слова про нотариуса,
           считается, что договор заключается в простой письменной форме (not_defined).
        3. Для notarial_form_details:
           - если прямо указано, что договор подлежит нотариальному удостоверению
             или удостоверен, кратко отрази это (включая ФИО нотариуса, если есть);
           - если прямо указано, что договор заключается в простой письменной форме,
             отрази это.
        4. Для notary_fees_details:
           - если распределение расходов на нотариуса прямо указано, отрази кто платит;
           - не путай расходы на нотариуса с госпошлиной за государственную
             регистрацию в Росреестре (это разные расходы).
        5. Для текстовых полей используй:
           - "Не установлена" — для notarial_form_details, если данных нет;
           - "Не установлены" — для notary_fees_details, если расходов нет;
           - "Не удалось определить" — если данные противоречивы.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Настоящий договор подлежит обязательному нотариальному удостоверению
        в связи с отчуждением долей в праве общей собственности.
        Расходы по оплате нотариального тарифа и услуг правового и технического
        характера Покупатель и Продавец несут в равных долях."

        Ответ:
        {
          "notarial_form_status": "defined",
          "notarial_form_details": "Договор подлежит обязательному нотариальному удостоверению",
          "notary_fees_status": "defined",
          "notary_fees_details": "Нотариальный тариф и УПТХ стороны несут в равных долях",
          "evidence": [
            {
              "clause_ref": "п. 8.1–8.2",
              "quote": "Настоящий договор подлежит обязательному нотариальному удостоверению в связи с отчуждением долей в праве общей собственности. Расходы по оплате нотариального тарифа и услуг правового и технического характера Покупатель и Продавец несут в равных долях."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор составлен в простой письменной форме. Расходы на государственную
        регистрацию перехода права несёт Покупатель."

        Ответ:
        {
          "notarial_form_status": "defined",
          "notarial_form_details": "Договор составлен в простой письменной форме",
          "notary_fees_status": "not_defined",
          "notary_fees_details": "Не установлены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Договор составлен в простой письменной форме."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец обязуется передать объект Покупателю."

        Ответ:
        {
          "notarial_form_status": "not_defined",
          "notarial_form_details": "Не установлена",
          "notary_fees_status": "not_defined",
          "notary_fees_details": "Не установлены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на нотариальную форму или простую письменную форму?
        2. Есть ли прямое распределение расходов на нотариуса (не путать с Росреестром)?
        3. Если данных нет — "not_defined" и соответствующие fallbacks.
        4. Если данные конфликтуют — "Не удалось определить".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "notarial_form_status": "<defined / not_defined>",
          "notarial_form_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "notary_fees_status": "<defined / not_defined>",
          "notary_fees_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нотариус нотариальная форма нотариальное удостоверение простая письменная форма удостоверен нотариусом реестровый номер нотариальный тариф услуги правового и технического характера УПТХ расходы на нотариуса"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "цена"
        - "задаток"
        - "аванс"
        - "ипотека"
        - "обременения"
        - "подсудность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.70, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о нотариальной форме сделки и распределении расходов на услуги нотариуса.
        Не анализируй расходы на регистрацию в Росреестре, согласие супруга, опеку,
        цену, расчёты и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. notarial_form_status:
           - "defined" — если в тексте прямо указано, что договор подлежит
             нотариальному удостоверению, удостоверен нотариусом, либо прямо
             указано, что он составлен в простой письменной форме;
           - "not_defined" — если по форме договора нет прямого указания
             или её нельзя надёжно определить.

        2. notarial_form_details:
           Краткое user-facing описание формы договора на русском языке.
           Правила:
           - если договор нотариальный, отрази это, например:
             "Договор подлежит нотариальному удостоверению",
             "Удостоверен нотариусом г. Москвы Ивановым И.И.";
           - если договор в простой письменной форме, отрази это:
             "Составлен в простой письменной форме";
           - если данных нет — "Не установлена";
           - если данные противоречивы — "Не удалось определить".

        3. notary_fees_status:
           - "defined" — если в тексте прямо указано распределение расходов
             на оплату нотариального тарифа и/или УПТХ (услуг правового
             и технического характера);
           - "not_defined" — если по этой теме нет прямого указания
             или его нельзя надёжно определить.

        4. notary_fees_details:
           Краткое user-facing описание распределения нотариальных расходов
           на русском языке.
           Правила:
           - если расходы распределены, кратко отрази суть, например:
             "Нотариальный тариф и УПТХ стороны несут в равных долях",
             "Расходы на нотариуса оплачивает Покупатель";
           - не путай нотариальные расходы с государственной пошлиной за
             регистрацию перехода права в Росреестре;
           - если данных нет — "Не установлены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК РФ, ФЗ-218 или предположения о том, что сделка
          должна быть нотариальной, если этого нет в тексте.
        - Не смешивай нотариальные расходы с расходами на услуги риелтора, банка,
          аккредитив или госпошлиной за регистрацию.
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 4 ключа, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          notarial_form_details → "Не установлена"
          notary_fees_details → "Не установлены"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "notarial_form_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания нотариальной или простой письменной формы."
          required: true
          display_in_grid: false

        - name: "notarial_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма договора"
          description: >
            Краткое user-facing summary о форме договора: нотариальное
            удостоверение или простая письменная форма.
            Fallback: "Не установлена" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "notary_fees_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на нотариуса."
          required: true
          display_in_grid: false

        - name: "notary_fees_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на нотариуса"
          description: >
            Краткое user-facing summary о распределении расходов на оплату
            нотариального тарифа и услуг правового и технического характера (УПТХ).
            Fallback: "Не установлены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true
          
# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_authority_cluster:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты продавца и покупателя (ИНН, ОГРН, адрес для ЮЛ;
      паспортные данные для физлиц);
      (б) полномочия подписантов (устав, протокол об избрании / доверенность);
      (в) для ЮЛ — протокол об одобрении сделки (крупная / с заинтересованностью)
      либо правовое заключение о том, что одобрение не требуется.
    addressee: "Обе стороны / Юридический советник"

  subject_title_cluster:
    text: >
      Просим предоставить по {doc_names}:
      (а) актуальную выписку ЕГРН (не старше 30 дней) с разделами о характеристиках
      объекта, правах, ограничениях и обременениях;
      (б) правоустанавливающий документ продавца с реквизитами;
      (в) подтверждение совпадения площади, адреса, кадастрового номера в договоре
      и ЕГРН; (г) для объекта незавершённого строительства — разрешение на строительство.
    addressee: "Продавец"

  encumbrances_due_diligence_cluster:
    text: >
      Просим предоставить по {doc_names} пакет документов для DD чистоты титула:
      (а) актуальную выписку ЕГРН с разделом об ограничениях/обременениях;
      (б) справки об отсутствии долгов по ЖКУ, капремонту, налогу на имущество;
      (в) все действующие договоры аренды/найма или подтверждение их отсутствия;
      (г) документы о согласованности перепланировок (при наличии);
      (д) выписку из ИСОГД или РГИС о ЗОУИТ, охранных зонах;
      (е) заверение об отсутствии признаков банкротства продавца + проверка ЕФРСБ/КАД;
      (ж) при наличии экологических рисков — отчёт экоаудита;
      (з) сведения о сервитутах и инженерных коммуникациях.
    addressee: "Продавец / Юридический советник покупателя"

  price_payment_cluster:
    text: >
      Просим уточнить по {doc_names}:
      (а) цену цифрами и прописью, НДС-оговорку (включён/не включён);
      (б) способ расчётов (аккредитив / эскроу / ячейка) с указанием банка;
      (в) квалификацию платежа (задаток / аванс / обеспечительный) с условиями возврата/удержания;
      (г) при рассрочке — позицию сторон по ипотеке в силу закона (ст. 488 ГК РФ):
      возникает / исключается / иное;
      (д) порядок уплаты госпошлины и иных расходов.
    addressee: "Обе стороны / Юридический советник"

  closing_transfer_cluster:
    text: >
      Просим уточнить по {doc_names}:
      (а) дату закрытия сделки и long-stop дату;
      (б) перечень conditions precedent (CP) с ответственными сторонами и сроками;
      (в) когда и в какой форме подписывается передаточный акт;
      (г) дату фактического освобождения объекта + санкцию за задержку;
      (д) порядок действий при приостановке/отказе в регистрации;
      (е) для зданий — комплект технической документации.
    addressee: "Обе стороны"

  general_provisions_cluster:
    text: >
      Просим уточнить по {doc_names}:
      (а) основания расторжения для каждой стороны и последствия (возврат денег,
      удержание задатка, санкции);
      (б) ограничение уступки прав — запрет или порядок согласования;
      (в) подсудность: по месту нахождения объекта (исключительная — ст. 30 ГПК РФ);
      (г) НДС-оговорку и налоговые последствия при кадастровой стоимости > рыночной;
      (д) распределение риска гибели объекта до регистрации;
      (е) обязанность страхования объекта до передачи;
      (ж) конфиденциальность цены сделки.
    addressee: "Юридический советник"

  land_subject_extraction:
    text: >
      Просим предоставить полные данные о земельном участке по {doc_names}:
      кадастровый номер, адрес/местоположение, площадь, категорию земель,
      вид разрешённого использования (ВРИ), актуальную выписку ЕГРН.
    addressee: "Продавец"

  cadastral_number_required_for_land_plot:
    text: >
      В {doc_names} не указан кадастровый номер земельного участка — нарушение ст. 554 ГК РФ.
      Просим незамедлительно предоставить кадастровый номер в формате NN:NN:NNNNNNN:N
      и актуальную выписку ЕГРН.
    addressee: "Продавец / Юридический советник"

  land_vri_and_category_required:
    text: >
      Просим предоставить по {doc_names}:
      (а) категорию земель и вид разрешённого использования (ВРИ) с выпиской ЕГРН;
      (б) ГПЗУ или сведения из ПЗЗ — подтверждение допустимости использования
      под цели покупателя;
      (в) при несоответствии ВРИ — план смены ВРИ (до или после сделки);
      (г) если предусмотрен ковенант о неизменности назначения — согласовать текст.
    addressee: "Продавец / Юридический советник"

  residents_list_required:
    text: >
      В {doc_names} не раскрыт перечень лиц, сохраняющих право пользования (ст. 558 ГК РФ).
      Просим предоставить:
      (а) справку о зарегистрированных лицах;
      (б) обязательство снятия с регистрационного учёта (срок);
      (в) явную формулировку в договоре об отсутствии лиц с правом пользования
      или их перечень; (г) проверку отказавшихся от приватизации.
    addressee: "Продавец"

  spousal_consent_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) нотариальное согласие супруга продавца на продажу (ст. 35 СК РФ)
      либо нотариальное заявление о том, что в браке не состоит / имущество личное;
      (б) при несовершеннолетних — разрешение органа опеки и попечительства
      с обязательством предоставления равноценного жилья.
    addressee: "Продавец"

  co_owner_preemptive_right_check:
    text: >
      Просим предоставить по {doc_names}:
      (а) нотариальные уведомления сособственников с доказательством получения
      (РПО с описью / нотариальная телеграмма) — по цене, равной договорной;
      (б) нотариально удостоверенные отказы или подтверждение истечения 30-дневного срока;
      (в) подтверждение нотариальной формы договора (обязательно для сделок с долями).
    addressee: "Продавец / Нотариус"

  mortgagee_consent_check:
    text: >
      Объект в {doc_names} находится в ипотеке. Просим предоставить:
      (а) письменное согласие залогодержателя/банка на сделку;
      (б) механизм погашения: часть цены напрямую банку через аккредитив с условием /
      эскроу; остаток — продавцу после снятия обременения;
      (в) одновременность регистрации перехода права и погашения ипотеки в ЕГРН;
      (г) при наличии закладной — порядок её погашения.
    addressee: "Банк-залогодержатель / Продавец"

  land_building_unity_check:
    text: >
      В {doc_names} (продажа здания) просим подтвердить:
      (а) вид прав на земельный участок под зданием (собственность / аренда);
      (б) кадастровый номер и площадь участка;
      (в) при аренде — договор аренды, срок, согласие арендодателя на переуступку;
      (г) правоустанавливающие документы на участок.
    addressee: "Продавец / Юридический советник"

  maternity_capital_risk_check:
    text: >
      КРИТИЧЕСКИ ВАЖНО по {doc_names}. Просим предоставить:
      (а) заверение продавца о неиспользовании средств маткапитала при приобретении объекта;
      (б) при использовании маткапитала — документы о выделении долей всем членам семьи
      + выписку ЕГРН с долями детей и супруга;
      (в) разрешение органа опеки на продажу (при наличии несовершеннолетних);
      (г) справку из СФР о состоянии сертификата.
    addressee: "Продавец / Юридический советник покупателя"

  inheritance_title_risk_check:
    text: >
      Для {doc_names} (объект приобретён по наследству) просим предоставить:
      (а) свидетельство о праве на наследство с датой выдачи;
      (б) заверение об отсутствии иных наследников, наследственных споров
      и претензий обязательных наследников (ст. 1149 ГК РФ);
      (в) нотариальное дело: нотариус, дата открытия;
      (г) при давности наследства < 3 лет — рекомендация страхования титула.
    addressee: "Продавец / Юридический советник покупателя"

  mcd_common_property_approval_check:
    text: >
      Для {doc_names} (общее имущество МКД) просим предоставить:
      (а) протокол общего собрания собственников МКД с подтверждением кворума 2/3 голосов;
      (б) правовое заключение о статусе объекта (общее имущество vs самостоятельный объект);
      (в) иные согласования (Росреестр, орган местного самоуправления).
    addressee: "Управляющая компания / Продавец"

  foreign_agricultural_land_prohibition:
    text: >
      Внимание: выявлено потенциальное нарушение ФЗ-101 по {doc_names}.
      Иностранные граждане/компании не могут приобретать сельскохозяйственные земли.
      Просим предоставить документы о гражданстве/резидентстве покупателя
      и правовое заключение о допустимости сделки.
    addressee: "Юридический советник покупателя"

  foreign_border_zone_prohibition:
    text: >
      Внимание: выявлено потенциальное нарушение ст. 15 ЗК РФ по {doc_names}.
      Иностранные граждане/компании не могут приобретать земли в приграничных зонах.
      Просим предоставить правовое заключение о статусе покупателя и территории.
    addressee: "Юридический советник покупателя"

  agricultural_land_preemptive_right_rf_subject:
    text: >
      Внимание: для {doc_names} (земли сельскохозяйственного назначения) субъект РФ
      имеет преимущественное право покупки (ст. 8 ФЗ-101). Просим предоставить:
      (а) извещение продавца в адрес уполномоченного органа субъекта РФ о намерении
      продать участок с указанием цены и условий;
      (б) отказ субъекта РФ от покупки или подтверждение истечения 30-дневного срока.
      Сделка без соблюдения этого порядка ничтожна.
    addressee: "Продавец / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

