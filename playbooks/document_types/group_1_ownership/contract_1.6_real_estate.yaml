      retrieval_query: "ипотека в силу закона в залоге у продавца до полной оплаты залог не возникает право залога не применяется ипотека в силу закона не возникает рассрочка отсрочка платежа ст. 488 ГК РФ снятие ипотеки"
      preferred_unit_types:
