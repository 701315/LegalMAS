        удостоверению договора стороны несут поровну."

        Ответ:
        {
          "expense_allocation_status": "defined",
          "expense_allocation_details": "Госпошлину уплачивает Покупатель; нотариальные расходы стороны несут поровну",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Государственную пошлину уплачивает Покупатель. Расходы по нотариальному удостоверению договора стороны несут поровну."
            }
