        - boilerplate
      negative_keywords:
        - "кадастровый номер"
        - "площадь"
        - "адрес объекта"
        - "ЕГРН"
        - "обременения"
        - "залог"
        - "арест"
        - "аренда"
        - "банкротство"
        - "цена"
        - "задаток"
        - "аккредитив"
        - "ипотека в силу закона"
        - "передаточный акт"
        - "согласие супруга"
        - "маткапитал"
        - "орган опеки"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.4
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о Продавце, Покупателе, подписантах, основании полномочий и
        корпоративном одобрении сделки.
        Не анализируй предмет договора, цену, расчёты, обременения, передачу объекта,
        семейные риски, земельные вопросы и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. seller_details_status:
           - "defined" — если в тексте прямо указаны реквизиты Продавца
             или иные идентифицирующие данные;
           - "not_defined" — если реквизиты прямо не указаны или их нельзя
             надёжно определить.

        2. seller_details_value:
           Полные реквизиты Продавца в краткой строке.
           Правила:
           - если данные прямо указаны, верни их в одной строке;
           - не копируй длинный абзац целиком;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. seller_display:
           Краткое user-facing отображение Продавца на русском языке.
           Правила:
           - для юридического лица — наименование; при необходимости для различения
             можно добавить ИНН;
           - для физического лица — ФИО;
           - для ИП — "ИП <ФИО>";
           - если продавцов несколько — перечисли через "; ";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        4. seller_type:
           - "legal_entity" — если Продавец прямо указан как юридическое лицо;
           - "individual" — если Продавец прямо указан как физическое лицо / гражданин;
           - "ip" — если Продавец прямо указан как индивидуальный предприниматель;
           - "not_defined" — если тип стороны прямо не следует из текста.

        5. seller_signatory:
           Кто подписывает договор от имени Продавца.
           Правила:
           - если подписант прямо указан — извлеки его;
           - если физическое лицо или ИП подписывает лично, укажи само это лицо;
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        6. seller_signatory_basis:
           - "charter" — если указано, что подписант действует на основании устава;
           - "poa" — если указана доверенность;
           - "order" — если указаны приказ / решение о назначении;
           - "personal" — если физическое лицо или ИП действует лично;
           - "other" — если прямо указано иное основание;
           - "not_defined" — если основание прямо не указано или его нельзя надёжно определить.

        7. buyer_details_status:
           - "defined" — если в тексте прямо указаны реквизиты Покупателя
             или иные идентифицирующие данные;
           - "not_defined" — если реквизиты прямо не указаны или их нельзя
             надёжно определить.

        8. buyer_details_value:
           Полные реквизиты Покупателя в краткой строке.
           Правила:
           - если данные прямо указаны, верни их в одной строке;
           - не копируй длинный абзац целиком;
           - если данных нет — "Не установлены";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        9. buyer_display:
           Краткое user-facing отображение Покупателя на русском языке.
           Правила:
           - для юридического лица — наименование; при необходимости для различения
             можно добавить ИНН;
           - для физического лица — ФИО;
           - для ИП — "ИП <ФИО>";
           - если покупателей несколько — перечисли через "; ";
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        10. buyer_type:
           - "legal_entity" — если Покупатель прямо указан как юридическое лицо;
           - "individual" — если Покупатель прямо указан как физическое лицо / гражданин;
           - "ip" — если Покупатель прямо указан как индивидуальный предприниматель;
           - "not_defined" — если тип стороны прямо не следует из текста.

        11. buyer_signatory:
           Кто подписывает договор от имени Покупателя.
           Правила:
           - если подписант прямо указан — извлеки его;
           - если физическое лицо или ИП подписывает лично, укажи само это лицо;
           - если данных нет — "Не установлен";
           - если данные противоречивы — "Не удалось определить".

        12. buyer_signatory_basis:
           - "charter" — если указано, что подписант действует на основании устава;
           - "poa" — если указана доверенность;
           - "order" — если указаны приказ / решение о назначении;
           - "personal" — если физическое лицо или ИП действует лично;
           - "other" — если прямо указано иное основание;
           - "not_defined" — если основание прямо не указано или его нельзя надёжно определить.

        13. corporate_approval_status:
           - "defined" — если в тексте прямо указано корпоративное одобрение сделки
             либо прямо указано, что одобрение не требуется;
           - "not_defined" — если такого прямого указания нет или его нельзя
             надёжно определить.

        14. corporate_approval_details:
           Краткое user-facing описание корпоративного одобрения на русском языке.
           Правила:
           - если в договоре прямо сказано, что сделка одобрена, верни краткое summary,
             например: "Одобрена советом директоров, протокол № 5 от 01.03.2026";
           - если прямо сказано, что одобрение не требуется, верни краткое summary,
             например: "Указано, что корпоративное одобрение не требуется";
           - если есть несколько прямых указаний, перечисли их через "; ";
           - общие фразы о законности сделки без конкретизации не считай достаточными;
           - если из текста следует, что соответствующая сторона не является юридическим лицом
             и отдельной оговорки про одобрение нет — "Не применимо";
           - если прямого указания нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ГК, корпоративного законодательства, обычную практику
          или предположения вместо текста договора.
        - Не смешивай сведения о сторонах с предметом договора, ценой, передачей объекта,
          обременениями, семейными согласиями и иными нерелевантными темами.
        - Если в договоре несколько продавцов или несколько покупателей, перечисляй
          их в одном поле через "; ".
        - Если сведения о стороне указаны и в преамбуле, и в реквизитах, используй
          те данные, которые прямо указаны и не противоречат друг другу.
        - Если в разных фрагментах указаны разные реквизиты, разные подписанты
          или разные основания полномочий, и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Для seller_signatory_basis и buyer_signatory_basis используй только:
          "charter", "poa", "order", "personal", "other", "not_defined".
        - Для seller_type и buyer_type используй только:
          "legal_entity", "individual", "ip", "not_defined".
        - Общие фразы вроде "стороны обладают необходимыми полномочиями",
          "сделка соответствует законодательству", "корпоративные процедуры соблюдены"
          без прямого указания на одобрение или отсутствие необходимости в нём
          не являются основанием для "defined" по corporate_approval_status.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 14 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для seller_type и buyer_type используй только:
          "legal_entity", "individual", "ip", "not_defined".
        - Для seller_signatory_basis и buyer_signatory_basis используй только:
          "charter", "poa", "order", "personal", "other", "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          seller_details_value → "Не установлены"
          seller_display → "Не установлен"
          seller_signatory → "Не установлен"
          buyer_details_value → "Не установлены"
          buyer_display → "Не установлен"
          buyer_signatory → "Не установлен"
          corporate_approval_details → "Не установлено" или "Не применимо"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "seller_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов продавца."
          required: true
          display_in_grid: false

        - name: "seller_details_value"
          type: "string"
          presentation: "fact"
          label: "Реквизиты продавца"
          description: "Полные реквизиты продавца."
          required: true
          display_in_grid: false

        - name: "seller_display"
          type: "string"
          presentation: "fact"
          label: "Продавец"
          description: >
            Краткое user-facing отображение продавца для DD Grid.
            Например: "ООО «Строй-Инвест»", "Петров Петр Петрович", "ИП Сидоров А.А.".
            Fallback: "Не установлен" / "Не удалось определить".
