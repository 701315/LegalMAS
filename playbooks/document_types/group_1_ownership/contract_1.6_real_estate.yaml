  - id: cadastral_number_required_for_land_plot
    name: "Земля: обязательность кадастрового номера (ст. 554 ГК РФ)"
    description: >
      Проверяет наличие и значение кадастрового номера земельного участка —
      без него договор не позволяет однозначно идентифицировать объект
