        - "орган опеки"
        - "несовершеннолетний в контексте опеки"
        - "право пользования"
        - "зарегистрированные лица"
        - "не обременен"
        - "арест"
        - "банкротство"
        - "цена"
        - "задаток"
        - "ипотека"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
