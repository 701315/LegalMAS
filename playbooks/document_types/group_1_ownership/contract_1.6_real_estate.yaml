  - id: land_building_unity_check
    name: "Единство судьбы земли и строения (ст. 552 ГК РФ, ст. 35 ЗК РФ)"
    description: >
      Фактографическая проверка передачи прав на земельный участок вместе
      со зданием: вид прав, кадастровый номер участка, площадь и согласие
      арендодателя при аренде. В DD Grid показывает только user-facing summary
      по каждому блоку.
    triggers:
      any: ["building_sale"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вместе с земельным участком"
        - "право аренды земельного участка"
        - "переходит вместе со зданием"
        - "права на землю"
        - "земельный участок под зданием"
        - "постоянное бессрочное пользование"
        - "безвозмездное пользование"
        - "согласие арендодателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)земельн.*участ.*(переходит|передается).*вместе"
        - "(?i)вместе.*со.*здани"
        - "(?i)постоянн(ое|ого)\\s+(бессрочн(ое|ого)\\s+)?пользован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи здания или сооружения.
        Проверяется только один вопрос: как урегулированы права на земельный
        участок под зданием в соответствии с принципом единства судьбы
        земли и строения.
        Не анализируй цену, расчёты, обременения, ипотеку или иные темы.

        Нормативный ориентир:
        - ст. 552 ГК РФ (права на земельный участок при продаже здания)
        - ст. 35 ЗК РФ (переход прав на землю при переходе прав на здание)
        - ст. 22 ЗК РФ (особенности аренды земли, согласие арендодателя)

        [ВАЖНО — ANTI-HALLUCINATION]
        По ст. 552 ГК РФ при продаже здания покупатель получает те же права
        на землю, что были у продавца, даже если договор прямо не описывает
        передачу земли. Но ты НЕ домысливаешь права из закона — только фиксируешь
        то, что прямо написано в тексте договора.
        Если о земле ничего не написано → "not_defined" по всем полям.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид передаваемых прав на земельный участок под зданием.
        2. Кадастровый номер участка под зданием.
        3. Площадь участка под зданием.
        4. Условие о согласии арендодателя (если участок в аренде).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для land_rights_transfer_code:
           - "ownership" — право собственности на участок;
           - "lease" — право аренды участка;
           - "perpetual_use" — постоянное (бессрочное) пользование;
           - "gratuitous_use" — безвозмездное пользование;
           - "other" — иное прямо названное право, не входящее в перечень;
           - "not_defined" — если вид прав прямо не указан в тексте договора.
        4. Не выводи права на землю из ст. 552 ГК РФ автоматически — только если
           вид прав прямо написан в тексте договора.
        5. Если параметр прямо определяется по названному внешнему документу
           (Приложению, выписке из ЕГРН), отрази это в user-facing поле.
        6. Для lease_consent_details учитывай:
           - если договор прямо указывает на получение согласия арендодателя
             (государства / муниципалитета / частного арендодателя) — отрази;
           - если прямо написано, что согласие не требуется (например, по ст. 22
             ЗК РФ при сроке аренды более 5 лет) — отрази это;
           - если участок в собственности — "Не применимо".
        7. Для текстовых полей используй:
           - "Не установлены" — для land_rights_transfer_details;
           - "Не установлен" — для land_cadastral_number_value;
           - "Не установлена" — для land_area_value;
           - "Не применимо" — для lease_consent_details, если участок
             в собственности и согласие арендодателя явно неприменимо;
           - "Не установлено" — для lease_consent_details, если участок
             в аренде, но условие о согласии прямо не урегулировано;
           - "Не удалось определить" — если данные противоречивы.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Одновременно со зданием Покупателю передаётся право собственности на
        земельный участок, кадастровый номер 50:20:0010001:456, площадью 1 200 кв.м,
        на котором расположено здание."

        Ответ:
        {
          "land_rights_transfer_status": "defined",
          "land_rights_transfer_code": "ownership",
          "land_rights_transfer_details": "Право собственности на земельный участок передаётся одновременно со зданием",
          "land_cadastral_number_status": "defined",
          "land_cadastral_number_value": "50:20:0010001:456",
          "land_area_status": "defined",
          "land_area_value": "1 200 кв.м",
          "lease_consent_status": "not_defined",
          "lease_consent_details": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Одновременно со зданием Покупателю передаётся право собственности на земельный участок, кадастровый номер 50:20:0010001:456, площадью 1 200 кв.м, на котором расположено здание."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Вместе со зданием к Покупателю переходит право аренды земельного участка,
        кадастровый номер 77:05:0001234:789, по договору аренды № А-15 от 10.01.2020
        с Департаментом городского имущества г. Москвы. Срок аренды — 25 лет.
        Согласие арендодателя на переход права аренды не требуется в соответствии
        со ст. 22 ЗК РФ."

        Ответ:
        {
          "land_rights_transfer_status": "defined",
          "land_rights_transfer_code": "lease",
          "land_rights_transfer_details": "Право аренды земельного участка переходит к Покупателю; договор аренды № А-15 от 10.01.2020, срок 25 лет",
          "land_cadastral_number_status": "defined",
          "land_cadastral_number_value": "77:05:0001234:789",
          "land_area_status": "not_defined",
          "land_area_value": "Не установлена",
          "lease_consent_status": "defined",
          "lease_consent_details": "Согласие арендодателя не требуется (ст. 22 ЗК РФ, срок аренды более 5 лет)",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Вместе со зданием к Покупателю переходит право аренды земельного участка, кадастровый номер 77:05:0001234:789, по договору аренды № А-15 от 10.01.2020 с Департаментом городского имущества г. Москвы. Срок аренды — 25 лет. Согласие арендодателя на переход права аренды не требуется в соответствии со ст. 22 ЗК РФ."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Права на земельный участок под зданием определяются согласно
        Приложению №2 к настоящему договору."

        Ответ:
        {
          "land_rights_transfer_status": "defined",
          "land_rights_transfer_code": "not_defined",
          "land_rights_transfer_details": "Согласно Приложению №2",
          "land_cadastral_number_status": "defined",
          "land_cadastral_number_value": "Согласно Приложению №2",
          "land_area_status": "defined",
          "land_area_value": "Согласно Приложению №2",
          "lease_consent_status": "not_defined",
          "lease_consent_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Права на земельный участок под зданием определяются согласно Приложению №2 к настоящему договору."
            }
          ]
        }

        Пример 4:
        Фрагмент:
        "Продавец продаёт Покупателю нежилое здание."

        Ответ:
        {
          "land_rights_transfer_status": "not_defined",
          "land_rights_transfer_code": "not_defined",
          "land_rights_transfer_details": "Не установлены",
          "land_cadastral_number_status": "not_defined",
          "land_cadastral_number_value": "Не установлен",
          "land_area_status": "not_defined",
          "land_area_value": "Не установлена",
          "lease_consent_status": "not_defined",
          "lease_consent_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на передачу прав на землю и вид этих прав?
           Не домысливай из ст. 552 ГК РФ.
        2. Указан ли кадастровый номер участка под зданием?
        3. Указана ли площадь участка?
        4. Если участок в аренде — урегулировано ли согласие арендодателя?
           Если в собственности — "Не применимо".
        5. Если параметр определяется по названному внешнему документу —
           отрази это, а не пустоту.
        6. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "land_rights_transfer_status": "<defined / not_defined>",
          "land_rights_transfer_code": "<ownership / lease / perpetual_use / gratuitous_use / other / not_defined>",
          "land_rights_transfer_details": "<текст или 'Не установлены' / 'Не удалось определить'>",
          "land_cadastral_number_status": "<defined / not_defined>",
          "land_cadastral_number_value": "<номер или ссылка или 'Не установлен' / 'Не удалось определить'>",
          "land_area_status": "<defined / not_defined>",
          "land_area_value": "<площадь или ссылка или 'Не установлена' / 'Не удалось определить'>",
          "lease_consent_status": "<defined / not_defined>",
          "lease_consent_details": "<текст или 'Не применимо' / 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "title_transfer_check"
