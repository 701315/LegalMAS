            Кадастровый номер земельного участка в формате NN:NN:NNNNNNN:N
            либо понятная ссылка на названный внешний документ, по которому
            он определяется.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: mortgagee_consent_check
    name: "Ипотека: согласие залогодержателя и механизм снятия обременения"
    description: >
      Фактографическая проверка наличия согласия банка / залогодержателя
      и механизма погашения ипотеки с одновременным снятием обременения.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers:
      any: ["mortgage_related"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие залогодержателя"
        - "согласие банка"
        - "погашение кредита"
        - "снятие ипотеки"
        - "снятие обременения"
        - "закладная"
        - "досрочное погашение"
        - "депозит нотариуса"
        - "погашение до сделки"
        - "до подачи на регистрацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+(банка|залогодержател)"
        - "(?i)погашен(ие|а)\\s+кредит"
        - "(?i)снят(ие|ь)\\s+обременен"
        - "(?i)до\\s+подачи\\s+на\\s+регистрац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости, находящейся в ипотеке.
        Проверяется только один вопрос: согласие залогодержателя на сделку,
        механизм погашения ипотеки, одновременность снятия обременения
        и регистрации перехода права, сумма ипотечного долга.
        Не анализируй обычные расчёты без ипотеки, обременения от третьих лиц,
        передачу объекта или семейные риски.

        Нормативный ориентир:
        - ст. 37 ФЗ-102 «Об ипотеке (залоге недвижимости)»
        - ФЗ-218 «О государственной регистрации недвижимости»

        [ВАЖНО — ПРАКТИКА СНЯТИЯ ИПОТЕКИ ПРИ КУПЛЕ-ПРОДАЖЕ]
        В российской практике купли-продажи ипотечной недвижимости возможны
        несколько моделей снятия ипотеки:
        1. Погашение ипотеки из средств покупателя в ходе сделки:
           - часть цены направляется на погашение долга через аккредитив
             или счёт эскроу в пользу банка;
           - банк подаёт заявление о снятии ипотеки после получения средств;
           - снятие ипотеки и переход права регистрируются одновременно
             или последовательно.
        2. Погашение ипотеки продавцом до сделки:
           - продавец гасит долг из задатка покупателя или собственных средств;
           - к моменту подачи на регистрацию объект уже свободен от ипотеки.
        3. Через депозит нотариуса:
           - средства для погашения ипотеки депонируются у нотариуса.
        Различай эти модели при анализе.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на согласие залогодержателя / банка на сделку.
        2. Каков механизм погашения ипотеки.
        3. Есть ли условие об одновременном снятии обременения и регистрации
           перехода права.
        4. Указана ли сумма ипотечного долга.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй банковскую логику, обычную практику или предположения
           вместо текста договора.
        3. Для mortgagee_consent_details:
           - если согласие прямо дано (письмо, решение банка), отрази его реквизиты;
           - если прямо сказано, что согласие не требуется (например, банк уже
             выдал разрешение на продажу в кредитном договоре), отрази это.
        4. Для clearance_mechanism_code:
           - "accreditive" — аккредитив для погашения ипотеки;
           - "escrow" — счёт эскроу для погашения ипотеки;
           - "notary_deposit" — депозит нотариуса;
           - "direct_payment" — прямой перевод на счёт банка;
           - "prepaid" — ипотека погашается продавцом до подачи на регистрацию
             из задатка / аванса покупателя или собственных средств;
           - "not_defined" — механизм прямо не указан.
        5. Для simultaneous_registration_details учитывай:
           - "одновременно" в российской практике означает подачу в Росреестр
             одним пакетом: заявления о переходе права + заявления о погашении
             ипотеки (от банка или совместно);
           - если прямо написано "одновременная регистрация" или аналог — отрази;
           - если снятие ипотеки происходит после погашения (последовательно),
             а не одновременно — отрази это отдельно.
        6. Для текстовых полей используй:
           - "Не установлено" — для mortgagee_consent_details,
             clearance_mechanism_details, simultaneous_registration_details;
           - "Не установлена" — для mortgage_amount_value;
           - "Не удалось определить" — если данные противоречивы.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Объект продаётся с согласия ПАО «Сбербанк» как залогодержателя
        (письмо № 123 от 01.04.2026). Часть цены в размере 8 000 000 рублей
        направляется на погашение кредита через аккредитив в пользу банка.
        Стороны договорились об одновременной подаче заявлений о регистрации
        перехода права и о погашении записи об ипотеке."

        Ответ:
        {
          "mortgagee_consent_status": "defined",
          "mortgagee_consent_details": "С согласия ПАО «Сбербанк» как залогодержателя; письмо № 123 от 01.04.2026",
          "clearance_mechanism_status": "defined",
          "clearance_mechanism_code": "accreditive",
          "clearance_mechanism_details": "Часть цены (8 000 000 руб.) направляется на погашение кредита через аккредитив в пользу банка",
          "simultaneous_registration_status": "defined",
          "simultaneous_registration_details": "Одновременная подача заявлений о регистрации перехода права и погашении записи об ипотеке",
          "mortgage_amount_status": "defined",
