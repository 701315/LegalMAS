# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, полномочия и корпоративное одобрение
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_authority_cluster
    name: "Стороны, полномочия и корпоративное одобрение"
    description: >
      Фактографическая проверка идентификации продавца и покупателя, полномочий
      подписантов и корпоративного одобрения сделки для юридических лиц.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "не является крупной сделкой"
        - "корпоративное одобрение"
        - "устав"
        - "доверенность"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(продавец|покупатель).*именуем"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 432, 549 ГК РФ; ФЗ-14 «Об ООО»; ФЗ-208 «Об АО»; ст. 182 ГК РФ).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов
        и корпоративное одобрение.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Продавца (ИНН, ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Продавца (юридическое лицо / физическое лицо / ИП).
        3. Кто подписывает от Продавца и на каком основании.
        4. Наименование и реквизиты Покупателя.
        5. Тип Покупателя.
        6. Кто подписывает от Покупателя и на каком основании.
        7. Есть ли в договоре указание на корпоративное одобрение сделки (протокол,
           одобрение ОС/СД) или заверение о том, что одобрение не требуется.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_specified", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001,
        в лице Генерального директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена советом директоров (протокол № 5 от 01.03.2026).
        Покупатель — гражданин Петров Б.Б., паспорт серия 45 00 № 123456."

        Ответ:
        {
          "seller_details_status": "defined",
          "seller_details": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "seller_type": "legal_entity",
          "seller_signatory": "Генеральный директор Иванов А.А.",
          "seller_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "buyer_type": "individual",
          "buyer_signatory": "Петров Б.Б.",
          "buyer_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "одобрена советом директоров, протокол № 5 от 01.03.2026",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Продавец — ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, в лице Генерального директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между продавцом и покупателем."

        Ответ:
        {
          "seller_details_status": "not_defined",
          "seller_details": "Данные не определены",
          "seller_type": "not_defined",
          "seller_signatory": "Данные не определены",
          "seller_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details": "Данные не определены",
          "buyer_type": "not_defined",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли ИНН/ОГРН для ЮЛ или паспортные данные для физлица?
        2. Явно ли указан тип стороны?
        3. Указан ли подписант и документ-основание?
        4. Упомянуто ли корпоративное одобрение или заверение о его отсутствии?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seller_details_status": "<defined / not_defined>",
          "seller_details": "<реквизиты или 'Данные не определены'>",
          "seller_type": "<legal_entity / individual / ip / not_defined>",
          "seller_signatory": "<ФИО или 'Данные не определены'>",
          "seller_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
          "buyer_details": "<реквизиты или 'Данные не определены'>",
          "buyer_type": "<legal_entity / individual / ip / not_defined>",
          "buyer_signatory": "<ФИО или 'Данные не определены'>",
          "buyer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "продавец"
        - "покупатель"
        - "именуем"
        - "ИНН"
        - "ОГРН"
        - "действующий на основании"
        - "крупная сделка"
        - "одобрение"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "seller_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Продавец прямо определён с реквизитами. Иначе 'not_defined'."
        - name: "seller_details"
          type: "string"
          description: "Реквизиты Продавца. Если нет — строго 'Данные не определены'."
        - name: "seller_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "ip", "not_defined"]
          description: "Тип Продавца."
        - name: "seller_signatory"
          type: "string"
          description: "Подписант от Продавца. Если нет — строго 'Данные не определены'."
        - name: "seller_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Продавца."
        - name: "buyer_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Покупатель прямо определён с реквизитами. Иначе 'not_defined'."
        - name: "buyer_details"
          type: "string"
          description: "Реквизиты Покупателя. Если нет — строго 'Данные не определены'."
        - name: "buyer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "ip", "not_defined"]
          description: "Тип Покупателя."
        - name: "buyer_signatory"
          type: "string"
          description: "Подписант от Покупателя. Если нет — строго 'Данные не определены'."
        - name: "buyer_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Покупателя."
        - name: "corporate_approval_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если корпоративное одобрение или заверение о его отсутствии прямо определено. Иначе 'not_defined'."
        - name: "corporate_approval_details"
          type: "string"
          description: "Корпоративное одобрение. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет договора и титул продавца
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_title_cluster
    name: "Предмет договора и титул продавца"
    description: >
      Фактографическая проверка идентификации объекта недвижимости (кадастровый номер,
      адрес, площадь, вид) и правоустанавливающих документов продавца.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "расположен"
        - "находится по адресу"
        - "выписка из ЕГРН"
        - "правоустанавливающ"
        - "правоподтверждающ"
        - "запись ЕГРН"
        - "свидетельство о праве"
        - "основание права"
        - "ЕГРН"
        - "Росреестр"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)площадь.*?\\d+.*?(кв|га)"
        - "(?i)выписк(а|у)\\s+из\\s+ЕГРН"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 549, 554 ГК РФ; ФЗ-218 «О государственной регистрации недвижимости»).
        Проверяется только один вопрос: предмет договора и титул продавца.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер объекта (формат NN:NN:NNNNNNN:N).
        2. Адрес объекта.
        3. Площадь объекта с единицей.
        4. Вид объекта (квартира / дом / земельный участок / нежилое и т.д.).
        5. Ссылку на выписку ЕГРН.
        6. Правоустанавливающий документ продавца (тип и реквизиты).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. Не выводи кадастровый номер из контекста — только если прямо написан.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец продаёт квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5,
        кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м.
        Право собственности подтверждается выпиской из ЕГРН от 01.03.2026,
        приобретено на основании договора купли-продажи от 15.06.2015."

        Ответ:
        {
          "cadastral_number_status": "defined",
          "cadastral_number": "77:06:0001001:123",
          "address_status": "defined",
          "address_details": "г. Москва, ул. Ленина, д. 5, кв. 12",
          "area_status": "defined",
          "area_details": "45,3 кв.м",
          "object_type": "apartment",
          "egrn_extract_status": "defined",
          "egrn_extract_details": "выписка из ЕГРН от 01.03.2026",
          "title_document_status": "defined",
          "title_document_type": "договор купли-продажи",
          "title_document_details": "от 15.06.2015",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "квартиру, расположенную по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123, общей площадью 45,3 кв.м."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Предметом договора является объект недвижимости."

        Ответ:
        {
          "cadastral_number_status": "not_defined",
          "cadastral_number": "Данные не определены",
          "address_status": "not_defined",
          "address_details": "Данные не определены",
          "area_status": "not_defined",
          "area_details": "Данные не определены",
          "object_type": "not_defined",
          "egrn_extract_status": "not_defined",
          "egrn_extract_details": "Данные не определены",
          "title_document_status": "not_defined",
          "title_document_type": "not_defined",
          "title_document_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли кадастровый номер в формате NN:NN:NNNNNNN:N (прямо написан)?
        2. Указан ли адрес объекта?
        3. Указана ли площадь числом с единицей?
        4. Можно ли определить вид объекта?
        5. Упомянута ли выписка ЕГРН?
        6. Указан ли тип правоустанавливающего документа продавца?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number": "<номер или 'Данные не определены'>",
          "address_status": "<defined / not_defined>",
          "address_details": "<адрес или 'Данные не определены'>",
          "area_status": "<defined / not_defined>",
          "area_details": "<площадь или 'Данные не определены'>",
          "object_type": "<apartment / house / land / building / non_residential / share / unfinished / other / not_defined>",
          "egrn_extract_status": "<defined / not_defined>",
          "egrn_extract_details": "<дата/реквизиты или 'Данные не определены'>",
          "title_document_status": "<defined / not_defined>",
          "title_document_type": "<тип или 'Данные не определены'>",
          "title_document_details": "<реквизиты или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "выписка ЕГРН"
        - "правоустанавливающий документ"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cadastral_number_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если кадастровый номер прямо указан. Иначе 'not_defined'."
        - name: "cadastral_number"
          type: "string"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: "Кадастровый номер. Если нет — строго 'Данные не определены'."
        - name: "address_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если адрес объекта прямо указан. Иначе 'not_defined'."
        - name: "address_details"
          type: "string"
          description: "Адрес объекта. Если нет — строго 'Данные не определены'."
        - name: "area_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если площадь прямо указана. Иначе 'not_defined'."
        - name: "area_details"
          type: "string"
          description: "Площадь. Если нет — строго 'Данные не определены'."
        - name: "object_type"
          type: "string"
          allowed_values: ["apartment", "house", "land", "building", "non_residential", "share", "unfinished", "other", "not_defined"]
          description: "Вид объекта недвижимости."
        - name: "egrn_extract_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если выписка ЕГРН упомянута. Иначе 'not_defined'."
        - name: "title_document_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если правоустанавливающий документ прямо указан. Иначе 'not_defined'."
        - name: "title_document_type"
          type: "string"
          description: "Тип правоустанавливающего документа. Если нет — строго 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Чистота титула — обременения, аресты, ЗОУИТ, экология, аренда
  # ──────────────────────────────────────────────────────────────────────────
  - id: encumbrances_due_diligence_cluster
    name: "Чистота титула: обременения, аресты, ЗОУИТ, аренда, долги, перепланировки, банкротство"
    description: >
      Фактографическая проверка наличия в договоре заверений о чистоте титула по всем
      ключевым DD-блокам: обременения, аресты, ЗОУИТ, экология, аренда, долги, перепланировки,
      банкротный риск продавца.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не обременен"
        - "отсутствие обременений"
        - "не заложен"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "не сдан в аренду"
        - "никаких прав третьих лиц"
        - "запрет регистрационных действий"
        - "ограничение регистрационных действий"
        - "арест"
        - "отсутствуют ограничения"
        - "в ЕГРН отсутствуют записи"
        - "СЗЗ"
        - "санитарно-защитная зона"
        - "ЗОУИТ"
        - "зона с особыми условиями"
        - "охранная зона"
        - "культурное наследие"
        - "ОКН"
        - "экологическое состояние"
        - "загрязнение"
        - "аренда"
        - "отсутствие задолженности"
        - "коммунальные"
        - "перепланировка"
        - "реконструкция"
        - "не находится в процедуре банкротства"
        - "отсутствие признаков банкротства"
      keyword_mode: "any"
      negative_keywords:
        - "наложен арест"
        - "введен запрет"
      regex_patterns:
        - "(?i)продавец.*гарантирует.*отсутствие.*обременений"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"
        - "(?i)запрет\\s+регистрационн"
        - "(?i)в\\s+ЕГРН\\s+отсутств(уют|ует)"
        - "(?i)санитарно\\s*[- ]?защитн|ЗОУИТ|СЗЗ"
        - "(?i)культурн(ого)?\\s+наслед"
        - "(?i)экологическ|свалк|захоронен|загрязнен"
        - "(?i)сервитут|охранн(ая|ой)\\s+зон"
        - "(?i)договор\\s+аренд"
        - "(?i)отсутств(ует|уют).*задолженн"
        - "(?i)перепланировк|реконструкц"
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 460 ГК РФ; ФЗ-218; ФЗ-127; ЖК РФ).
        Проверяется только один вопрос: наличие в договоре заверений о чистоте
        титула по различным категориям рисков.

        [ЗАДАЧА]
        Найди в тексте договора наличие или отсутствие заверений/условий по каждому блоку:
        1. Заверение об отсутствии обременений (залог, ипотека, сервитут).
        2. Заверение об отсутствии арестов и запретов регистрационных действий.
        3. Раскрытие ЗОУИТ / охранных зон / санитарно-защитных зон.
        4. Экологическое состояние участка/объекта.
        5. Раскрытие инженерных коммуникаций и сервитутов.
        6. Раскрытие действующих договоров аренды/найма или заверение об их отсутствии.
        7. Заверение об отсутствии задолженности по ЖКУ, налогам, капремонту.
        8. Раскрытие перепланировок (согласованы/не проводились).
        9. Заверение об отсутствии банкротных процедур в отношении продавца.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если заверение или условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец гарантирует, что объект не обременён залогами, не находится под
        арестом, не сдан в аренду. Задолженность по коммунальным платежам отсутствует.
        Перепланировок не проводилось. Продавец не находится в процедуре банкротства."

        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "объект не обременён залогами",
          "arrest_ban_status": "defined",
          "arrest_ban_details": "не находится под арестом",
          "zouit_status": "not_defined",
          "zouit_details": "Данные не определены",
          "ecological_status": "not_defined",
          "utilities_servitudes_status": "not_defined",
          "lease_status": "defined",
          "lease_details": "не сдан в аренду",
          "utility_debts_status": "defined",
          "utility_debts_details": "задолженность по коммунальным платежам отсутствует",
          "redevelopment_status": "defined",
          "redevelopment_details": "перепланировок не проводилось",
          "bankruptcy_status": "defined",
          "bankruptcy_details": "не находится в процедуре банкротства",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Продавец гарантирует, что объект не обременён залогами, не находится под арестом, не сдан в аренду."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец передаёт объект покупателю."

        Ответ:
        {
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Данные не определены",
          "arrest_ban_status": "not_defined",
          "arrest_ban_details": "Данные не определены",
          "zouit_status": "not_defined",
          "zouit_details": "Данные не определены",
          "ecological_status": "not_defined",
          "utilities_servitudes_status": "not_defined",
          "lease_status": "not_defined",
          "lease_details": "Данные не определены",
          "utility_debts_status": "not_defined",
          "utility_debts_details": "Данные не определены",
          "redevelopment_status": "not_defined",
          "redevelopment_details": "Данные не определены",
          "bankruptcy_status": "not_defined",
          "bankruptcy_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая фраза о заверении по каждому блоку?
        2. "Данных нет" — это not_defined, а не defined.
        3. Не выводи заверения, которых нет в тексте.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "encumbrances_status": "<defined / not_defined>",
          "encumbrances_details": "<текст или 'Данные не определены'>",
          "arrest_ban_status": "<defined / not_defined>",
          "arrest_ban_details": "<текст или 'Данные не определены'>",
          "zouit_status": "<defined / not_defined>",
          "zouit_details": "<текст или 'Данные не определены'>",
          "ecological_status": "<defined / not_defined>",
          "utilities_servitudes_status": "<defined / not_defined>",
          "lease_status": "<defined / not_defined>",
          "lease_details": "<текст или 'Данные не определены'>",
          "utility_debts_status": "<defined / not_defined>",
          "utility_debts_details": "<текст или 'Данные не определены'>",
          "redevelopment_status": "<defined / not_defined>",
          "redevelopment_details": "<текст или 'Данные не определены'>",
          "bankruptcy_status": "<defined / not_defined>",
          "bankruptcy_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "обременения"
        - "арест"
        - "запрет регистрационных действий"
        - "ЗОУИТ"
        - "охранная зона"
        - "аренда"
        - "задолженность"
        - "перепланировка"
        - "банкротство"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 750
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "encumbrances_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если заверение об отсутствии обременений прямо определено. Иначе 'not_defined'."
        - name: "arrest_ban_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если заверение об отсутствии арестов прямо определено. Иначе 'not_defined'."
        - name: "zouit_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ЗОУИТ прямо раскрыты. Иначе 'not_defined'."
        - name: "lease_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если аренда прямо раскрыта. Иначе 'not_defined'."
        - name: "utility_debts_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если долги по ЖКУ прямо раскрыты. Иначе 'not_defined'."
        - name: "redevelopment_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если перепланировки прямо раскрыты. Иначе 'not_defined'."
        - name: "bankruptcy_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если банкротный риск прямо раскрыт. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Цена, расчёты, задаток и ипотека в силу закона
  # ──────────────────────────────────────────────────────────────────────────
  - id: price_payment_cluster
    name: "Цена, порядок расчётов, задаток и ипотека в силу закона"
    description: >
      Фактографическая проверка наличия цены, способа расчётов, условий задатка/аванса
      и регулирования ипотеки в силу закона.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "цену в размере"
        - "рублей"
        - "рублях"
        - "аванс"
        - "задаток"
        - "обеспечительный платеж"
        - "возврат"
        - "удержание"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "депозит нотариуса"
        - "оплата"
        - "срок оплаты"
        - "после регистрации"
        - "банковские реквизиты"
        - "ипотека в силу закона"
        - "в залоге у продавца"
        - "до полной оплаты"
        - "НДС"
        - "госпошлина"
        - "расходы по регистрации"
      keyword_mode: "any"
      negative_keywords:
        - "ипотека в силу закона не возникает"
        - "залог не возникает"
        - "право залога не применяется"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)\\b(аванс|задаток|обеспечительн(ый|ого)\\s+платеж)\\b"
        - "(?i)аккредитив|эскроу|ячейк|депозит\\s+нотариуса"
        - "(?i)ипотек.*в\\s+силу\\s+закона"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 555, 380-381, 488 ГК РФ).
        Проверяется только один вопрос: цена, порядок расчётов, задаток/аванс
        и ипотека в силу закона.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Цену объекта (числовое значение, цифрами и/или прописью).
        2. Способ расчётов (аккредитив / эскроу / ячейка / безнал / наличные).
        3. Тип обеспечительного платежа (аванс / задаток / иное) и его сумму.
        4. Условия возврата/удержания обеспечительного платежа.
        5. Вопрос ипотеки в силу закона при рассрочке — возникает / исключается / не упомянут.
        6. Налоговую оговорку (НДС включён / не включён / не применимо).
        7. Распределение расходов на регистрацию.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Цена объекта составляет 15 000 000 (пятнадцать миллионов) рублей, включая НДС.
        Расчёты производятся через аккредитив. Покупатель уплачивает задаток в размере
        500 000 рублей. При отказе покупателя задаток не возвращается; при отказе
        продавца задаток возвращается в двойном размере. Ипотека в силу закона
        по настоящему договору не возникает."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "15 000 000 рублей, включая НДС",
          "payment_method_status": "defined",
          "payment_method": "accreditive",
          "deposit_type_status": "defined",
          "deposit_type": "zadatok",
          "deposit_amount": "500 000 рублей",
          "deposit_return_status": "defined",
          "deposit_return_details": "при отказе покупателя не возвращается; при отказе продавца — двойной размер",
          "mortgage_by_law_status": "defined",
          "mortgage_by_law_regime": "excluded",
          "vat_status": "defined",
          "vat_details": "включая НДС",
          "expense_allocation_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена объекта составляет 15 000 000 рублей, включая НДС. Расчёты производятся через аккредитив."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о цене объекта."

        Ответ:
        {
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "payment_method_status": "not_defined",
          "payment_method": "not_defined",
          "deposit_type_status": "not_defined",
          "deposit_type": "not_defined",
          "deposit_amount": "Данные не определены",
          "deposit_return_status": "not_defined",
          "deposit_return_details": "Данные не определены",
          "mortgage_by_law_status": "not_defined",
          "mortgage_by_law_regime": "not_addressed",
          "vat_status": "not_defined",
          "vat_details": "Данные не определены",
          "expense_allocation_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли цена конкретной суммой?
        2. Указан ли способ расчётов (аккредитив / эскроу / ячейка)?
        3. Квалифицирован ли платёж как задаток или аванс прямо?
        4. Прямо ли написано условие возврата/удержания?
        5. Упомянута ли ипотека в силу закона (возникает / исключается)?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "price_status": "<defined / not_defined>",
          "price_details": "<цена или 'Данные не определены'>",
          "payment_method_status": "<defined / not_defined>",
          "payment_method": "<escrow / accreditive / bank_cell / cashless / cash / mixed / not_defined>",
          "deposit_type_status": "<defined / not_defined>",
          "deposit_type": "<advance / zadatok / security_payment / not_defined>",
          "deposit_amount": "<сумма или 'Данные не определены'>",
          "deposit_return_status": "<defined / not_defined>",
          "deposit_return_details": "<условия или 'Данные не определены'>",
          "mortgage_by_law_status": "<defined / not_defined>",
          "mortgage_by_law_regime": "<arises / excluded / not_addressed / not_defined>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<текст или 'Данные не определены'>",
          "expense_allocation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "цена"
        - "стоимость"
        - "задаток"
        - "аванс"
        - "обеспечительный платёж"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "ипотека в силу закона"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "price_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если цена прямо определена. Иначе 'not_defined'."
        - name: "price_details"
          type: "string"
          description: "Цена. Если нет — строго 'Данные не определены'."
        - name: "payment_method_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если способ расчётов прямо определён. Иначе 'not_defined'."
        - name: "payment_method"
          type: "string"
          allowed_values: ["escrow", "accreditive", "bank_cell", "cashless", "cash", "mixed", "not_defined"]
          description: "Способ расчётов."
        - name: "deposit_type_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если тип обеспечительного платежа прямо определён. Иначе 'not_defined'."
        - name: "deposit_type"
          type: "string"
          allowed_values: ["advance", "zadatok", "security_payment", "not_defined"]
          description: "Тип обеспечительного платежа."
        - name: "mortgage_by_law_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ипотека в силу закона прямо урегулирована. Иначе 'not_defined'."
        - name: "mortgage_by_law_regime"
          type: "string"
          allowed_values: ["arises", "excluded", "not_addressed", "not_defined"]
          description: "Режим ипотеки в силу закона."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Закрытие сделки, условия и передача объекта
  # ──────────────────────────────────────────────────────────────────────────
  - id: closing_transfer_cluster
    name: "Закрытие, условия закрытия и передача объекта"
    description: >
      Фактографическая проверка наличия сроков закрытия, перечня conditions precedent,
      передаточного акта, освобождения объекта и технической документации.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не позднее"
        - "в течение"
        - "подать на регистрацию"
        - "регистрация перехода права"
        - "срок закрытия"
        - "дата закрытия"
        - "при условии"
        - "после предоставления"
        - "до регистрации"
        - "условие закрытия"
        - "передаточный акт"
        - "акт приема-передачи"
        - "передача ключей"
        - "освободить"
        - "снятие с регистрационного учета"
        - "техническая документация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч)"
        - "(?i)под(ать|ача).*регистрац"
        - "(?i)(при\\s+условии|до\\s+регистрац|после\\s+предоставлен)"
        - "(?i)акт\\s+(приема|передач)"
        - "(?i)снят(ие|ь)\\s+с\\s+регистрац"
        - "(?i)техническ(ая|ой)\\s+документ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ, ст. 556 ГК РФ).
        Проверяется только один вопрос: сроки закрытия, условия закрытия
        и передача объекта.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок закрытия/подачи на регистрацию.
        2. Long-stop дату (крайний срок).
        3. Перечень conditions precedent (условий закрытия).
        4. Наличие передаточного акта (акта приёма-передачи).
        5. Дату/срок освобождения объекта продавцом.
        6. Условие о снятии с регистрационного учёта (для жилья).
        7. Порядок действий при отказе/приостановке регистрации.
        8. Передачу технической документации (для зданий).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретная дата или период для подачи на регистрацию?
        2. Есть ли перечень условий закрытия с конкретными требованиями?
        3. Упомянут ли акт приёма-передачи?
        4. Указан ли срок фактического освобождения объекта?
        5. Что происходит при отказе в регистрации — прямо написано?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "closing_date_status": "<defined / not_defined>",
          "closing_date_details": "<срок или 'Данные не определены'>",
          "longstop_date_status": "<defined / not_defined>",
          "longstop_date_details": "<срок или 'Данные не определены'>",
          "conditions_precedent_status": "<defined / not_defined>",
          "conditions_precedent_details": "<перечень или 'Данные не определены'>",
          "transfer_act_status": "<defined / not_defined>",
          "possession_delivery_status": "<defined / not_defined>",
          "possession_delivery_details": "<срок или 'Данные не определены'>",
          "deregistration_status": "<defined / not_defined>",
          "registration_refusal_status": "<defined / not_defined>",
          "technical_docs_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "срок закрытия"
        - "подать на регистрацию"
        - "передаточный акт"
        - "акт приёмки-передачи"
        - "освободить"
        - "снятие с регистрационного учёта"
        - "техническая документация"
        - "условие закрытия"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "closing_date_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок закрытия прямо определён. Иначе 'not_defined'."
        - name: "closing_date_details"
          type: "string"
          description: "Срок закрытия. Если нет — строго 'Данные не определены'."
        - name: "conditions_precedent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если перечень условий закрытия прямо определён. Иначе 'not_defined'."
        - name: "transfer_act_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если передаточный акт прямо упомянут. Иначе 'not_defined'."
        - name: "possession_delivery_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если дата освобождения объекта прямо определена. Иначе 'not_defined'."
        - name: "deregistration_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если снятие с регистрационного учёта прямо предусмотрено. Иначе 'not_defined'."
        - name: "registration_refusal_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если порядок при отказе в регистрации прямо определён. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Общие условия — расторжение, споры, налоги, риск, страхование
  # ──────────────────────────────────────────────────────────────────────────
  - id: general_provisions_cluster
    name: "Общие условия: расторжение, споры, налоги, риск гибели, страхование, конфиденциальность"
    description: >
      Фактографическая проверка наличия оснований расторжения, подсудности,
      налоговых оговорок, риска гибели, страхования и конфиденциальности.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат денежных средств"
        - "неустойка"
        - "штраф"
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
        - "подсудность"
        - "арбитражный суд"
        - "суд общей юрисдикции"
        - "претензионный порядок"
        - "по месту нахождения объекта"
        - "НДС"
        - "госпошлина"
        - "расходы по регистрации"
        - "кадастровая стоимость"
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "до регистрации"
        - "страхование"
        - "конфиденциальность"
        - "неразглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)возврат.*денежн"
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)по\\s+месту\\s+нахождения\\s+объект"
        - "(?i)\\bНДС\\b|госпошлин"
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"
        - "(?i)страхов(ание|ой\\s+полис)"
        - "(?i)конфиденциал"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (§ 7 Главы 30 ГК РФ,
        ст. 453, 459, 558 ГК РФ; ст. 30 ГПК РФ).
        Проверяется только один вопрос: общие условия договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения и возврат денег.
        2. Ограничения уступки прав.
        3. Подсудность (корректна ли — по месту нахождения объекта).
        4. Претензионный порядок.
        5. Налоговую оговорку (НДС / кадастровая стоимость).
        6. Риск случайной гибели объекта (кто несёт до регистрации).
        7. Страхование объекта.
        8. Конфиденциальность условий сделки.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Для подсудности: корректная — по месту нахождения объекта (ст. 30 ГПК РФ).
        6. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Перечислены ли конкретные основания расторжения?
        2. Есть ли ограничение уступки (запрет / только с согласия)?
        3. Указан ли суд — по месту объекта или иной?
        4. Есть ли оговорка про НДС или кадастровую стоимость?
        5. Кто несёт риск до регистрации — прямо написано?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<основания или 'Данные не определены'>",
          "termination_consequences_status": "<defined / not_defined>",
          "assignment_restriction_status": "<defined / not_defined>",
          "assignment_restriction": "<prohibited / allowed_with_consent / allowed / not_defined>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<суд или 'Данные не определены'>",
          "jurisdiction_correct": "<yes / no / not_defined>",
          "pretrial_status": "<defined / not_defined>",
          "vat_clause_status": "<defined / not_defined>",
          "cadastral_value_status": "<defined / not_defined>",
          "risk_of_loss_status": "<defined / not_defined>",
          "risk_of_loss_details": "<кто несёт или 'Данные не определены'>",
          "insurance_status": "<defined / not_defined>",
          "confidentiality_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "расторжение"
        - "возврат денежных средств"
        - "задаток"
        - "уступка"
        - "подсудность"
        - "по месту нахождения объекта"
        - "НДС"
        - "кадастровая стоимость"
        - "риск гибели"
        - "страхование"
        - "конфиденциальность"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "remedies"
        - "boilerplate"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.06
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "termination_grounds_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если основания расторжения прямо определены. Иначе 'not_defined'."
        - name: "assignment_restriction_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ограничения уступки прямо определены. Иначе 'not_defined'."
        - name: "assignment_restriction"
          type: "string"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "not_defined"]
          description: "Режим уступки прав."
        - name: "jurisdiction_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если подсудность прямо определена. Иначе 'not_defined'."
        - name: "jurisdiction_correct"
          type: "string"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Верни 'yes' если по месту объекта (правильно по ст. 30 ГПК). 'no' если иной суд."
        - name: "risk_of_loss_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если риск гибели прямо определён. Иначе 'not_defined'."
        - name: "vat_clause_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если налоговая оговорка прямо определена. Иначе 'not_defined'."
        - name: "confidentiality_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если конфиденциальность прямо предусмотрена. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Земельный участок — параметры предмета
  # ──────────────────────────────────────────────────────────────────────────
  - id: land_subject_extraction
    name: "Земля: параметры земельного участка"
    description: >
      Фактографическая проверка наличия всех параметров земельного участка
      как предмета договора.
    triggers:
      any: ["land_plot_sale"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "земельный участок"
        - "кадастровый номер"
        - "категория земель"
        - "разрешенное использование"
        - "вид разрешенного использования"
        - "ВРИ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи земельного участка (§ 7 Главы 30 ГК РФ,
        ст. 554 ГК РФ; ЗК РФ, ст. 7-8).
        Проверяется только один вопрос: параметры земельного участка.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кадастровый номер (формат NN:NN:NNNNNNN:N).
        2. Адрес/местоположение участка.
        3. Площадь участка с единицей.
        4. Категорию земель.
        5. Вид разрешённого использования (ВРИ).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Не выводи кадастровый номер — только если прямо написан в формате NN:NN:...
        3. Если параметр не указан прямо — "not_defined".
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Кадастровый номер — только если прямо цифрами в формате XX:XX:XXXXXXX:X.
        2. Категория — только прямое название (земли населённых пунктов и т.п.).
        3. ВРИ — только прямая формулировка.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number": "<номер или 'Данные не определены'>",
          "address_status": "<defined / not_defined>",
          "address_details": "<адрес или 'Данные не определены'>",
          "area_status": "<defined / not_defined>",
          "area_details": "<площадь или 'Данные не определены'>",
          "land_category_status": "<defined / not_defined>",
          "land_category": "<категория или 'Данные не определены'>",
          "vri_status": "<defined / not_defined>",
          "vri_details": "<ВРИ или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "земельный участок"
        - "кадастровый номер"
        - "категория земель"
        - "разрешённое использование"
        - "вид разрешённого использования"
        - "ВРИ"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cadastral_number_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если кадастровый номер прямо указан. Иначе 'not_defined'."
        - name: "cadastral_number"
          type: "string"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: "Кадастровый номер. Если нет — строго 'Данные не определены'."
        - name: "area_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если площадь прямо указана. Иначе 'not_defined'."
        - name: "land_category_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если категория земель прямо указана. Иначе 'not_defined'."
        - name: "land_category"
          type: "string"
          description: "Категория земель. Если нет — строго 'Данные не определены'."
        - name: "vri_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если ВРИ прямо указан. Иначе 'not_defined'."
        - name: "vri_details"
          type: "string"
          description: "ВРИ. Если нет — строго 'Данные не определены'."
      store_payload: true

