type: contract_1.6_real_estate
name: "Договор купли-продажи недвижимости"

description: |
  Специализированный вид купли-продажи недвижимого имущества, регулируемый § 7 Главы 30 ГК РФ.
  Характеризуется обязательной письменной формой, государственной регистрацией перехода права
  собственности, специальными гарантиями для покупателя и множеством практических ограничений
  и рисков.

version: 5.0
parent: class_1_transfer_of_ownership

metadata:
