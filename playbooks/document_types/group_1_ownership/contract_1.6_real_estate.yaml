        Не анализируй семейные вопросы, маткапитал, цену или расчёты.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. inheritance_basis_status — "defined" или "not_defined".
        2. inheritance_basis — will / by_law / not_defined.
        3. inheritance_basis_details — основание наследования, как оно описано в договоре.
        4. other_heirs_warranty_status — "defined" или "not_defined".
        5. other_heirs_warranty_details — заверение об отсутствии иных наследников.
        6. mandatory_share_status — "defined" или "not_defined".
        7. mandatory_share_details — сведения об обязательных наследниках или обязательной доле.
        8. inheritance_disputes_status — "defined" или "not_defined".
