      retrieval_query: "согласие залогодержателя согласие банка погашение кредита снятие ипотеки снятие обременения закладная досрочное погашение до подачи на регистрацию депозит нотариуса одновременная регистрация перехода права и снятия обременения сумма ипотечного долга аккредитив эскроу для погашения ипотеки"
