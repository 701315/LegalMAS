  - id: seller_bankruptcy_check
    name: "Банкротный риск продавца (ФЗ-127, ст. 61.2)"
    description: >
      Фактографическая проверка наличия заверений об отсутствии банкротных
      процедур и признаков несостоятельности продавца, а также упоминания
      риска оспаривания сделки как подозрительной по ст. 61.2 ФЗ-127.
      В DD Grid показывает только user-facing summary по каждому блоку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не находится в процедуре банкротства"
        - "отсутствие признаков банкротства"
        - "несостоятельность"
        - "процедура наблюдения"
        - "конкурсное производство"
        - "внешнее управление"
        - "финансовое оздоровление"
        - "ст. 61.2"
        - "подозрительная сделка"
        - "сделка в ущерб кредиторам"
        - "реструктуризация долгов"
        - "реализация имущества гражданина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+находится\\s+в\\s+процедур(е|ы)\\s+банкротств"
        - "(?i)банкротств|несостоятельност"
        - "(?i)ст\\s*\\.?\\s*61\\.2"
        - "(?i)реструктуризаци(я|и)\\s+долг"
        - "(?i)реализаци(я|и)\\s+имущества\\s+гражданин"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.
        Проверяется только один вопрос: банкротный риск продавца и риск
        оспаривания сделки как подозрительной по ст. 61.2 ФЗ-127.
        Не анализируй обременения, ЗОУИТ, аренду, перепланировки,
        цену или порядок расчётов.

        Нормативный ориентир:
        - ФЗ-127 «О несостоятельности (банкротстве)», ст. 61.2, 61.3
        - Для физических лиц и ИП: § 1.1 главы X ФЗ-127

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое заверение продавца об отсутствии банкротных процедур.
        2. Есть ли прямое заверение об отсутствии признаков несостоятельности.
        3. Есть ли прямое упоминание / исключение риска оспаривания сделки
           по ст. 61.2 ФЗ-127 или как подозрительной сделки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для status-полей используй:
           - "defined" — если в тексте прямо есть заверение, раскрытие или
             исключение по соответствующему блоку;
           - "not_defined" — если по блоку нет прямого указания
             или его нельзя надёжно определить.
        4. Для текстовых полей используй:
           - "Не установлено" — если по блоку нет прямого указания;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Учитывай специфику продавца:
           - для юридического лица: процедуры наблюдения, конкурсного производства,
             внешнего управления, финансового оздоровления;
           - для физического лица / ИП: процедуры реструктуризации долгов
             и реализации имущества гражданина.
        6. Если в договоре раскрыта существующая банкротная процедура или признаки
           несостоятельности, это всё равно "defined"; в user-facing поле кратко
           отрази суть раскрытия.
        7. Общие фразы вроде "продавец вправе совершать сделку",
           "сделка совершается добровольно", "отсутствуют препятствия к исполнению"
           без конкретизации банкротной темы не являются основанием для "defined".
        8. Не выводи заверения из молчания договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Продавец заверяет, что не находится в процедуре банкротства,
        признаки несостоятельности отсутствуют, производство по делу
        о банкротстве в отношении продавца не возбуждено.
        Настоящая сделка не является подозрительной сделкой в смысле
        статьи 61.2 Федерального закона «О несостоятельности (банкротстве)»."

        Ответ:
        {
          "bankruptcy_status": "defined",
          "bankruptcy_details": "Банкротные процедуры отсутствуют; производство по делу о банкротстве не возбуждено",
          "insolvency_signs_status": "defined",
          "insolvency_signs_details": "Признаки несостоятельности отсутствуют",
          "voidability_reference_status": "defined",
          "voidability_reference_details": "Сделка не является подозрительной в смысле ст. 61.2 ФЗ «О несостоятельности»",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Продавец заверяет, что не находится в процедуре банкротства, признаки несостоятельности отсутствуют, производство по делу о банкротстве в отношении продавца не возбуждено. Настоящая сделка не является подозрительной сделкой в смысле статьи 61.2 Федерального закона «О несостоятельности (банкротстве)»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Продавец — гражданин Иванов И.И. — подтверждает, что процедуры
        реструктуризации долгов и реализации имущества в отношении него
        не возбуждены, признаки несостоятельности отсутствуют."

        Ответ:
        {
          "bankruptcy_status": "defined",
          "bankruptcy_details": "Процедуры реструктуризации долгов и реализации имущества гражданина не возбуждены",
          "insolvency_signs_status": "defined",
          "insolvency_signs_details": "Признаки несостоятельности отсутствуют",
          "voidability_reference_status": "not_defined",
          "voidability_reference_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Продавец — гражданин Иванов И.И. — подтверждает, что процедуры реструктуризации долгов и реализации имущества в отношении него не возбуждены, признаки несостоятельности отсутствуют."
            }
          ]
        }

        Пример 3:
        Фрагмент:
        "Продавец гарантирует, что объект свободен от прав третьих лиц."

        Ответ:
        {
          "bankruptcy_status": "not_defined",
          "bankruptcy_details": "Не установлено",
          "insolvency_signs_status": "not_defined",
          "insolvency_signs_details": "Не установлено",
          "voidability_reference_status": "not_defined",
          "voidability_reference_details": "Не установлено",
          "evidence": []
        }

        Пример 4:
        Фрагмент:
        "Продавец уведомляет, что в отношении него введена процедура
        реализации имущества гражданина. Продажа объекта осуществляется
        с согласия финансового управляющего."

        Ответ:
        {
          "bankruptcy_status": "defined",
          "bankruptcy_details": "В отношении продавца введена процедура реализации имущества гражданина; продажа осуществляется с согласия финансового управляющего",
          "insolvency_signs_status": "not_defined",
          "insolvency_signs_details": "Не установлено",
          "voidability_reference_status": "not_defined",
          "voidability_reference_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Продавец уведомляет, что в отношении него введена процедура реализации имущества гражданина. Продажа объекта осуществляется с согласия финансового управляющего."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание об отсутствии / наличии банкротных процедур?
        2. Есть ли прямое указание об отсутствии признаков несостоятельности?
        3. Есть ли прямая ссылка на ст. 61.2 ФЗ-127 или "подозрительная сделка"?
        4. Если продавец — физлицо или ИП, учитывай процедуры реструктуризации
           долгов и реализации имущества гражданина, а не только корпоративные.
        5. Не выводи заверения из молчания договора.
        6. Если в тексте раскрыта существующая банкротная процедура —
           это "defined", кратко отрази суть.
        7. Если в разных фрагментах есть несовместимые данные и конфликт нельзя снять
           по тексту — верни "Не удалось определить", а в status используй "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "bankruptcy_status": "<defined / not_defined>",
          "bankruptcy_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "insolvency_signs_status": "<defined / not_defined>",
          "insolvency_signs_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "voidability_reference_status": "<defined / not_defined>",
          "voidability_reference_details": "<текст или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "event_of_default_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не находится в процедуре банкротства отсутствие признаков банкротства несостоятельность процедура наблюдения конкурсное производство внешнее управление финансовое оздоровление реструктуризация долгов реализация имущества гражданина финансовый управляющий ст. 61.2 подозрительная сделка сделка в ущерб кредиторам"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "не обременен"
        - "залог"
        - "арест"
        - "аренда"
        - "задолженность по ЖКУ"
        - "ЗОУИТ"
        - "перепланировка"
        - "цена"
        - "задаток"
        - "аккредитив"
        - "ипотека в силу закона"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора сведения
        только о банкротном риске продавца: наличие или отсутствие банкротных
        процедур, признаков несостоятельности и упоминание риска оспаривания
        сделки как подозрительной по ст. 61.2 ФЗ-127.
        Не анализируй обременения, ЗОУИТ, аренду, перепланировки,
        публично-правовые ограничения, цену, расчёты, передачу объекта и иные темы.
        Не оценивай риски.
        Не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. bankruptcy_status:
           - "defined" — если в тексте прямо есть заверение, раскрытие или исключение
             по банкротным процедурам продавца;
           - "not_defined" — если по теме банкротства нет прямого указания
             или его нельзя надёжно определить.

        2. bankruptcy_details:
           Краткое user-facing описание по банкротным процедурам на русском языке.
           Правила:
           - если прямо указано отсутствие банкротных процедур, верни краткое summary,
             например:
             "Банкротные процедуры отсутствуют",
             "Процедуры реструктуризации долгов и реализации имущества гражданина
             не возбуждены";
           - если прямо раскрыта существующая банкротная процедура, кратко отрази
             суть, например:
             "В отношении продавца введена процедура реализации имущества гражданина;
             продажа осуществляется с согласия финансового управляющего";
           - учитывай специфику:
             * для юридического лица: наблюдение, конкурсное производство,
               внешнее управление, финансовое оздоровление;
             * для физического лица / ИП: реструктуризация долгов,
               реализация имущества гражданина;
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        3. insolvency_signs_status:
           - "defined" — если в тексте прямо есть заверение или раскрытие
             по признакам несостоятельности продавца;
           - "not_defined" — если по теме признаков несостоятельности нет прямого
             указания или его нельзя надёжно определить.

        4. insolvency_signs_details:
           Краткое user-facing описание по признакам несостоятельности
           на русском языке.
           Правила:
           - если прямо указано отсутствие признаков несостоятельности, верни краткое
             summary, например:
             "Признаки несостоятельности отсутствуют";
           - если прямо раскрыты признаки несостоятельности, кратко отрази суть;
           - не копируй длинные абзацы;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".

        5. voidability_reference_status:
           - "defined" — если в тексте прямо есть упоминание ст. 61.2 ФЗ-127,
             понятия "подозрительная сделка", "сделка в ущерб кредиторам"
             или прямое указание на то, что сделка не является таковой;
           - "not_defined" — если такого прямого указания нет
             или его нельзя надёжно определить.

        6. voidability_reference_details:
           Краткое user-facing описание по риску оспаривания сделки
           на русском языке.
           Правила:
           - если прямо указано, что сделка не является подозрительной / не может
             быть оспорена по ст. 61.2, верни краткое summary, например:
             "Сделка не является подозрительной в смысле ст. 61.2 ФЗ
             «О несостоятельности»";
           - если прямо упомянут риск оспаривания сделки, кратко отрази суть;
           - если данных нет — "Не установлено";
           - если данные противоречивы или их нельзя надёжно определить —
             "Не удалось определить".
        </task>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы ФЗ-127, судебную практику, обычную практику
          или предположения вместо текста договора.
        - Не смешивай банкротный риск с обременениями, арестами, арендой,
          ЗОУИТ, перепланировками, ценой, расчётами, передачей объекта
          и иными нерелевантными темами.
        - Учитывай специфику типа продавца:
          * для юридического лица: наблюдение, конкурсное производство,
            внешнее управление, финансовое оздоровление;
          * для физического лица / ИП: реструктуризация долгов,
            реализация имущества гражданина.
        - Если в тексте раскрыта существующая банкротная процедура или
          признаки несостоятельности, это всё равно "defined";
          кратко отрази раскрытый факт.
        - Общие фразы вроде "продавец вправе совершать сделку",
          "сделка совершается добровольно", "отсутствуют препятствия к исполнению"
          без конкретизации банкротной темы не являются основанием для "defined".
        - Если в разных фрагментах указаны несовместимые сведения и конфликт
          нельзя разрешить по тексту:
          * соответствующие status-поля → "not_defined";
          * соответствующие текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        - Даже для полей, помеченных в схеме как required: false,
          всегда возвращай ключ с корректным fallback-значением.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни ровно 6 ключей, перечисленных в task.
        - Не добавляй поле evidence.
        - Не используй null, None или пустые строки.
        - Для status-полей используй только: "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй только:
          bankruptcy_details → "Не установлено"
          insolvency_signs_details → "Не установлено"
          voidability_reference_details → "Не установлено"
        - Для текстовых полей при неоднозначности или конфликте используй только:
          "Не удалось определить".
        </output_expectations>
      fields:
        - name: "bankruptcy_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения или раскрытия по банкротным процедурам продавца."
          required: true
          display_in_grid: false

        - name: "bankruptcy_details"
          type: "string"
          presentation: "fact"
          label: "Банкротство продавца"
          description: >
            Краткое user-facing summary по банкротным процедурам продавца:
            отсутствие, наличие с деталями либо раскрытие существующей процедуры.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "insolvency_signs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения или раскрытия по признакам несостоятельности."
          required: true
          display_in_grid: false

        - name: "insolvency_signs_details"
          type: "string"
          presentation: "fact"
          label: "Признаки несостоятельности"
          description: >
            Краткое user-facing summary по признакам несостоятельности продавца:
            отсутствие либо раскрытие выявленных признаков.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "voidability_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания риска оспаривания сделки по ст. 61.2 ФЗ-127."
          required: true
          display_in_grid: false

        - name: "voidability_reference_details"
          type: "string"
          presentation: "fact"
          label: "Оспаривание сделки (ст. 61.2)"
          description: >
            Краткое user-facing summary по риску оспаривания сделки как подозрительной:
            прямое исключение риска, упоминание ст. 61.2 ФЗ-127 или раскрытие риска.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: commercial_payment_terms_check
    name: "Цена, расчёты и обеспечительный платёж"
    description: >
      Фактографическая проверка цены объекта, налоговой оговорки, способа
      расчётов, типа и суммы обеспечительного платежа, а также условий его
      возврата или удержания. Ипотека в силу закона проверяется отдельным check.
      Расходы на регистрацию проверяются отдельным check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена объекта"
        - "покупная цена"
        - "стоимость объекта"
        - "цена составляет"
        - "включая НДС"
        - "НДС в сумме"
        - "НДС не облагается"
        - "евро"
        - "рублей"
        - "аванс"
        - "задаток"
        - "обеспечительный платеж"
        - "возврат"
        - "удержание"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "депозит нотариуса"
        - "безналичный расчет"
        - "рассрочка"
        - "график платежей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(покупн[а-я]*\\s+цен[а-я]*|цен[а-я]*\\s+объект[а-я]*|стоимост[ьи])\\b"
        - "(?i)\\b\\d[\\d\\s]*(?:руб(?:лей)?|₽|евро|EUR|€|доллар(?:ов)?|USD|\\$)\\b"
        - "(?i)\\b(аванс|задаток|обеспечительн(?:ый|ого)\\s+плат[её]ж)\\b"
        - "(?i)\\b(аккредитив|эскроу|ячейк[а-я]*|депозит\\s+нотариуса)\\b"
        - "(?i)\\b(рассрочк[а-я]*|график\\s+платеж[а-я]*)\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.

        Проверяется только один вопрос: цена объекта, налоговая оговорка,
        способ расчётов, тип и сумма обеспечительного платежа, а также условия
        возврата или удержания обеспечительного платежа.

        Не анализируй ипотеку в силу закона, расходы на регистрацию,
        обременения, публично-правовые ограничения, передачу объекта,
        семейные риски или иные темы.

        Нормативный ориентир:
        - ст. 555 ГК РФ (цена в договоре продажи недвижимости)
        - ст. 380–381 ГК РФ (задаток)

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Цену объекта.
        2. Налоговую оговорку.
        3. Способ расчётов.
        4. Тип и сумму обеспечительного платежа.
        5. Условия возврата / удержания обеспечительного платежа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона, обычную практику или предположения
           вместо текста договора.
        3. Для status-полей используй:
           - "defined" — если параметр прямо указан в тексте или прямо
             определяется по названному внешнему документу;
           - "not_defined" — если параметр прямо не указан или его нельзя
             надёжно определить.
        4. Для текстовых полей используй:
           - "Не установлена" — для price_details, deposit_amount;
           - "Не установлен" — для payment_method_details, deposit_type_details,
             vat_details;
           - "Не установлены" — для deposit_return_details;
           - "Не применимо" — если обеспечительный платёж прямо отсутствует;
           - "Не удалось определить" — если данные противоречивы или неоднозначны.
        5. Для price_details:
           - сначала найди формулировку, которая прямо называет "цену",
             "покупную цену", "стоимость объекта", "сумму сделки" либо
             иной эквивалент полной договорной цены;
           - если цена прямо указана суммой, верни именно полную цену с валютой;
           - число, указанное после слов "НДС", "включая НДС", "НДС в размере",
             "сумма НДС" или "налог", является суммой налога, а не полной
             ценой объекта;
           - если в одной клаузе указаны два числа, например:
             "Покупная цена составляет 12 536 000 евро, включая НДС
             в размере 1 836 000 евро", полной ценой является первое число,
             прямо связанное со словами "Покупная цена составляет":
             "12 536 000 евро";
           - второе число, указанное как НДС, можно отразить только
             дополнением после полной цены:
             "12 536 000 евро, включая НДС в сумме 1 836 000 евро";
           - НИКОГДА не используй сумму НДС, аванса, задатка, госпошлины,
             банковской комиссии или любого другого отдельного платежа
             в качестве основной цены объекта;
           - если цена определяется по названному внешнему документу, верни
             понятную ссылку, например: "Согласно Приложению №1";
           - не вычисляй и не придумывай ставку НДС, если она не названа явно
             в процентах;
           - не путай сумму НДС с полной ценой объекта;
           - если цена прямо не установлена — "Не установлена";
           - если в договоре есть несколько несовместимых полных цен и конфликт
             нельзя снять по тексту — "Не удалось определить".
        6. Для payment_method_code используй:
           - "accreditive" — аккредитив;
           - "escrow" — эскроу;
           - "bank_cell" — банковская ячейка;
           - "notary_deposit" — депозит нотариуса;
           - "cashless" — безналичный расчёт без специального инструмента;
           - "cash" — наличный расчёт;
           - "installment" — рассрочка с графиком платежей;
           - "mixed" — несколько способов;
           - "not_defined" — если способ прямо не указан.
        7. Для deposit_type_code используй:
           - "advance" — аванс;
           - "zadatok" — задаток;
           - "security_payment" — обеспечительный платёж;
           - "not_defined" — если тип не определён или платёж отсутствует.
        8. Если платёж прямо отсутствует:
           - deposit_type_status = "not_defined";
           - deposit_type_code = "not_defined";
           - deposit_type_details = "Не применимо";
           - deposit_amount = "Не применимо";
           - deposit_return_status = "not_defined";
           - deposit_return_details = "Не применимо".
        9. Общие фразы вроде "оплата по договорённости сторон" или "в разумный
           срок" без суммы, срока и способа расчётов не являются основанием
           для "defined".
        10. Если данные по одному параметру несовместимы и конфликт нельзя снять
            по тексту:
            - status → "not_defined";
            - user-facing text → "Не удалось определить".
        11. В evidence включай только точный текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без markdown.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Цена объекта составляет 15 000 000 (пятнадцать миллионов) рублей,
        включая НДС по ставке 20%. Расчёты производятся через аккредитив.
        Покупатель уплачивает задаток в размере 500 000 рублей. При отказе
        Покупателя от сделки задаток не возвращается. При отказе Продавца
        задаток возвращается в двойном размере."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "15 000 000 рублей, включая НДС 20%",
          "payment_method_status": "defined",
          "payment_method_code": "accreditive",
          "payment_method_details": "Аккредитив",
          "deposit_type_status": "defined",
          "deposit_type_code": "zadatok",
          "deposit_type_details": "Задаток",
          "deposit_amount": "500 000 рублей",
          "deposit_return_status": "defined",
          "deposit_return_details": "При отказе Покупателя — не возвращается; при отказе Продавца — возвращается в двойном размере",
          "vat_status": "defined",
          "vat_details": "НДС 20% включён в цену",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена объекта составляет 15 000 000 рублей, включая НДС по ставке 20%. Расчёты производятся через аккредитив. Покупатель уплачивает задаток в размере 500 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "ПОКУПНАЯ ЦЕНА
        3.1 Покупная цена, уплачиваемая Покупателем по настоящему Договору,
        составляет 12 536 000 (двенадцать миллионов пятьсот тридцать шесть
        тысяч) евро, включая применимый НДС в размере 1 836 000 (один миллион
        восемьсот тридцать шесть тысяч) евро. Расчёты производятся безналичным
        переводом на счёт Продавца."

        Правильная интерпретация:
        - 12 536 000 евро — полная покупная цена объекта.
        - 1 836 000 евро — отдельная сумма НДС.
        - 1 836 000 евро не является ценой объекта.

        Правильный ответ:
        {
          "price_status": "defined",
          "price_details": "12 536 000 евро, включая НДС в сумме 1 836 000 евро",
          "payment_method_status": "defined",
          "payment_method_code": "cashless",
          "payment_method_details": "Безналичный расчёт",
          "deposit_type_status": "not_defined",
          "deposit_type_code": "not_defined",
          "deposit_type_details": "Не установлен",
          "deposit_amount": "Не установлена",
          "deposit_return_status": "not_defined",
          "deposit_return_details": "Не установлены",
          "vat_status": "defined",
          "vat_details": "НДС включён в цену в сумме 1 836 000 евро",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Покупная цена составляет 12 536 000 евро, включая применимый НДС в размере 1 836 000 евро. Расчёты производятся безналичным переводом на счёт Продавца."
            }
          ]
        }

        Запрещённый ответ:
        {
          "price_details": "1 836 000 евро, включая НДС в сумме 1 836 000 евро"
        }

        Причина запрета: 1 836 000 евро — это только сумма НДС, а не цена объекта.

        Пример 3:
        Фрагмент:
        "Цена объекта определяется согласно Приложению №1. Расчёты через
        банковскую ячейку. Обеспечительный платёж не предусмотрен.
        НДС не облагается."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "Согласно Приложению №1",
          "payment_method_status": "defined",
          "payment_method_code": "bank_cell",
          "payment_method_details": "Банковская ячейка",
          "deposit_type_status": "not_defined",
          "deposit_type_code": "not_defined",
          "deposit_type_details": "Не применимо",
          "deposit_amount": "Не применимо",
          "deposit_return_status": "not_defined",
          "deposit_return_details": "Не применимо",
          "vat_status": "defined",
          "vat_details": "НДС не облагается",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена объекта определяется согласно Приложению №1. Расчёты через банковскую ячейку. Обеспечительный платёж не предусмотрен. НДС не облагается."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цена числом или прямая ссылка на внешний документ?
        2. Какое число грамматически связано со словами "цена", "покупная цена",
           "стоимость" или "составляет"?
        3. Если в клаузе есть отдельная сумма НДС, убедись, что price_details
           не начинается с суммы НДС.
        4. Полная цена и сумма НДС не перепутаны?
        5. Указана ли ставка НДС именно в тексте как процент?
        6. Есть ли прямой способ расчётов?
        7. Есть ли прямое указание аванса, задатка или обеспечительного платежа?
        8. Есть ли условия возврата или удержания?
        9. Не анализируй ипотеку в силу закона или расходы на регистрацию.
        10. При неустранимом конфликте используй "not_defined" и
            "Не удалось определить".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Не установлена' / 'Не удалось определить'>",
          "payment_method_status": "<defined / not_defined>",
          "payment_method_code": "<accreditive / escrow / bank_cell / notary_deposit / cashless / cash / installment / mixed / not_defined>",
          "payment_method_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "deposit_type_status": "<defined / not_defined>",
          "deposit_type_code": "<advance / zadatok / security_payment / not_defined>",
          "deposit_type_details": "<текст или 'Не установлен' / 'Не применимо' / 'Не удалось определить'>",
          "deposit_amount": "<текст или 'Не установлена' / 'Не применимо' / 'Не удалось определить'>",
          "deposit_return_status": "<defined / not_defined>",
          "deposit_return_details": "<текст или 'Не установлены' / 'Не применимо' / 'Не удалось определить'>",
          "vat_status": "<defined / not_defined>",
          "vat_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }

      context_k: 10
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"

      retrieval_query: >
        Цена объекта недвижимости, покупная цена, стоимость объекта, сумма сделки,
        валюта, евро, рубли, НДС включён в цену, НДС в сумме, НДС не облагается;
        порядок и способ расчётов, безналичный перевод, аккредитив, эскроу,
        банковская ячейка, депозит нотариуса, наличный расчёт, рассрочка,
        график платежей; аванс, задаток, обеспечительный платёж, сумма,
        возврат, удержание, последствия отказа от сделки.

      boost_keywords:
        - "цена объекта"
        - "покупная цена"
        - "стоимость объекта"
        - "сумма сделки"
        - "включая НДС"
        - "НДС в сумме"
        - "НДС не облагается"
        - "евро"
        - "рублей"
        - "расчёты производятся"
        - "безналичный перевод"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "депозит нотариуса"
        - "рассрочка"
        - "график платежей"
        - "аванс"
        - "задаток"
        - "обеспечительный платёж"
        - "возврат"
        - "удержание"

      preferred_unit_types:
        - "payment_term"
        - "obligation"
        - "general_provision"
      excluded_unit_types:
        - "definition"
        - "structural_anchor"
        - "technical_fragment"
      preferred_clause_functions:
        - "obligations"

      negative_keywords:
        - "ипотека в силу закона"
        - "в залоге у продавца до полной оплаты"
        - "ст. 488 ГК РФ"
        - "снятие ипотеки"
        - "передаточный акт"
        - "срок закрытия"
        - "подать на регистрацию"
        - "условие закрытия"
        - "не обременен"
        - "залог третьих лиц"
        - "арест"
        - "банкротство"
        - "означает"
        - "в целях настоящего"

      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.18
        scope: "segment"

      context_k: 12
      max_chunks: 16
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора сведения только
        о цене объекта, налоговой оговорке, способе расчётов, типе и сумме
        обеспечительного платежа, условиях его возврата или удержания.

        Не анализируй ипотеку в силу закона, расходы на регистрацию,
        обременения, передачу объекта, семейные риски и иные темы.
        Не оценивай риски и не подставляй нормы закона вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. price_status:
           - "defined" — цена прямо указана суммой или определяется по
             названному внешнему документу;
           - "not_defined" — иначе.

        2. price_details:
           Краткое user-facing значение полной цены объекта на русском языке.

           Порядок выбора числа:
           - Сначала найди формулировку, которая прямо называет "цену",
             "покупную цену", "стоимость объекта", "сумму сделки" либо
             иной эквивалент полной договорной цены.
           - Число, указанное после слов "НДС", "включая НДС", "НДС в размере",
             "сумма НДС", "налог" или "налоговая сумма", является суммой налога,
             а НЕ полной ценой объекта.
           - Если в одной клаузе указаны два числа, например:
             "Покупная цена составляет 12 536 000 евро, включая НДС
             в размере 1 836 000 евро", полной ценой является первое число,
             прямо связанное со словами "Покупная цена составляет":
             "12 536 000 евро".
           - Второе число, указанное как НДС, можно отразить только как
             дополнительную часть формулировки:
             "12 536 000 евро, включая НДС в сумме 1 836 000 евро".
           - НИКОГДА не используй сумму НДС, аванса, задатка, госпошлины,
             банковской комиссии или любого другого отдельного платежа
             в качестве основной цены объекта.
           - Если цена прямо определяется по названному внешнему документу,
             верни понятную ссылку, например: "Согласно Приложению №1".
           - Если цена прямо не установлена — "Не установлена".
           - Если в договоре есть несколько несовместимых полных цен
             и конфликт нельзя снять по тексту — "Не удалось определить".

        3. payment_method_status:
           - "defined" — способ расчётов прямо указан или определяется
             по названному документу;
           - "not_defined" — иначе.

        4. payment_method_code:
           Только: "accreditive", "escrow", "bank_cell", "notary_deposit",
           "cashless", "cash", "installment", "mixed", "not_defined".

        5. payment_method_details:
           Краткое описание способа расчётов.
           Fallback: "Не установлен" / "Не удалось определить".

        6. deposit_type_status:
           - "defined" — платёж прямо квалифицирован как аванс, задаток
             или обеспечительный платёж;
           - "not_defined" — иначе.

        7. deposit_type_code:
           Только: "advance", "zadatok", "security_payment", "not_defined".

        8. deposit_type_details:
           "Аванс", "Задаток" или "Обеспечительный платёж";
           "Не применимо", если платёж прямо отсутствует;
           "Не установлен" при отсутствии данных;
           "Не удалось определить" при конфликте.

        9. deposit_amount:
           Сумма платежа с валютой;
           "Не применимо", если платёж прямо отсутствует;
           "Не установлена" при отсутствии данных;
           "Не удалось определить" при конфликте.

        10. deposit_return_status:
            - "defined" — есть прямые условия возврата или удержания;
            - "not_defined" — иначе.

        11. deposit_return_details:
            Краткое описание условий возврата / удержания;
            "Не применимо", если платёж прямо отсутствует;
            "Не установлены", если платёж есть, но условий нет;
            "Не удалось определить" при конфликте.

        12. vat_status:
            - "defined" — есть прямая налоговая оговорка;
            - "not_defined" — иначе.

        13. vat_details:
            Краткое описание НДС.
            - Если НДС прямо включён в цену и указана процентная ставка:
              например, "НДС 20% включён в цену".
            - Если НДС прямо включён в цену, но дана только сумма НДС:
              например, "НДС включён в цену в сумме 1 836 000 евро".
            - Не вычисляй и не указывай ставку НДС, если в договоре прямо
              не указан процент или слово "ставка".
            - Не путай сумму НДС с полной ценой объекта.
            - Fallback: "Не установлен" / "Не удалось определить".
        </task>

        <few_shot_price_and_vat_amount_case>
        Пример. В одной клаузе есть ПОЛНАЯ ЦЕНА и отдельная СУММА НДС.

        Фрагмент договора:
        "Покупная цена, уплачиваемая Покупателем по настоящему Договору,
        составляет 12 536 000 (двенадцать миллионов пятьсот тридцать шесть
        тысяч) евро, включая применимый НДС в размере 1 836 000
        (один миллион восемьсот тридцать шесть тысяч) евро."

        Анализ:
        - Полная цена объекта: 12 536 000 евро.
        - Сумма НДС: 1 836 000 евро.
        - 1 836 000 евро НЕ является ценой объекта.

        Правильный JSON-фрагмент:
        {
          "price_status": "defined",
          "price_details": "12 536 000 евро, включая НДС в сумме 1 836 000 евро",
          "vat_status": "defined",
          "vat_details": "НДС включён в цену в сумме 1 836 000 евро"
        }

        Запрещённый JSON-фрагмент:
        {
          "price_details": "1 836 000 евро, включая НДС в сумме 1 836 000 евро"
        }

        Причина запрета: 1 836 000 евро — это только сумма НДС, а не цена объекта.
        </few_shot_price_and_vat_amount_case>

        <context_rules>
        - Используй только релевантные фрагменты контекста.
        - Не используй нормы закона, практику или предположения вместо текста.
        - Перед заполнением price_details проверь, какое число в клаузе
          грамматически связано со словами "цена", "покупная цена",
          "стоимость" или "составляет".
        - Если есть несколько сумм, классифицируй каждую по роли:
          полная цена / НДС / аванс / задаток / отдельные расходы.
        - В price_details разрешено ставить основным значением ТОЛЬКО
          полную цену. Сумма НДС никогда не может быть основной ценой.
        - Если price_details начинается с той же суммы, что и сумма НДС,
          при наличии в тексте отдельной полной цены объекта, это ошибка:
          исправь значение до ответа.
        - Не смешивай цену и НДС: price_details всегда содержит полную цену.
        - Не вычисляй процент НДС, если он не указан прямо.
        - Если параметр определяется по приложению или графику, считай его
          определённым и укажи названный документ.
        - Если платёж прямо отсутствует, используй "Не применимо" для
          deposit_type_details, deposit_amount и deposit_return_details.
        - При неустранимом конфликте status = "not_defined", текстовое поле =
          "Не удалось определить".
        - Не используй null, None и пустые строки.
        - Все текстовые значения — на русском языке.
        - Всегда возвращай все 13 ключей.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не добавляй поле evidence.
        - Не добавляй другие ключи.
        - Верни ровно 13 ключей, перечисленных в task.
        - status: только "defined" или "not_defined".
        - payment_method_code: только допустимые enum-значения.
        - deposit_type_code: только допустимые enum-значения.
        - Перед отправкой проверь: если в контексте указаны полная цена и
          отдельная сумма НДС, price_details должен начинаться с полной цены,
          а не с суммы НДС.
        </output_expectations>

      fields:
        - name: "price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения цены объекта."
          required: true
          display_in_grid: false

        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена"
          description: >
            Цена объекта либо понятная ссылка на названный внешний документ,
            по которому она определяется. Сумма НДС без ставки указывается
            в составе полной цены словами "включая НДС в сумме X".
            Fallback: "Не установлена" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "payment_method_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения способа расчётов."
          required: true
          display_in_grid: false

        - name: "payment_method_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["accreditive", "escrow", "bank_cell", "notary_deposit", "cashless", "cash", "installment", "mixed", "not_defined"]
          description: "Код способа расчётов."
          required: true
          display_in_grid: false

        - name: "payment_method_details"
          type: "string"
          presentation: "fact"
          label: "Способ расчётов"
          description: >
            Краткое user-facing описание способа расчётов.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "deposit_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения типа обеспечительного платежа."
          required: true
          display_in_grid: false

        - name: "deposit_type_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["advance", "zadatok", "security_payment", "not_defined"]
          description: "Код типа обеспечительного платежа."
          required: true
          display_in_grid: false

        - name: "deposit_type_details"
          type: "string"
          presentation: "fact"
          label: "Тип обеспечительного платежа"
          description: >
            Аванс, задаток или обеспечительный платёж.
            Fallback: "Не установлен" / "Не применимо" /
            "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "deposit_amount"
          type: "string"
          presentation: "fact"
          label: "Сумма обеспечительного платежа"
          description: >
            Сумма аванса, задатка или обеспечительного платежа.
            Fallback: "Не установлена" / "Не применимо" /
            "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "deposit_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий возврата или удержания платежа."
          required: true
          display_in_grid: false

        - name: "deposit_return_details"
          type: "string"
          presentation: "fact"
          label: "Возврат / удержание платежа"
          description: >
            Краткое описание условий возврата или удержания обеспечительного
            платежа. Fallback: "Не установлены" / "Не применимо" /
            "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5

        - name: "vat_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус налоговой оговорки."
          required: true
          display_in_grid: false

        - name: "vat_details"
          type: "string"
          presentation: "fact"
          label: "Налоговая оговорка"
          description: >
            НДС в цене, НДС не облагается либо НДС не предусмотрен.
            Ставку нельзя вычислять, если она прямо не указана.
            Fallback: "Не установлен" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 6

      store_payload: true

  - id: registration_expenses_allocation_check
    name: "Расходы на регистрацию"
    description: >
      Фактографическая проверка распределения расходов по государственной
      регистрации перехода права собственности, госпошлине и нотариальному
      оформлению между Покупателем и Продавцом. Не проверяет цену, способ
      расчётов, ипотеку в силу закона или иные коммерческие условия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "регистрация перехода права"
        - "расходы по регистрации"
        - "расходы на регистрацию"
        - "госпошлина"
        - "государственная пошлина"
        - "нотариальные расходы"
        - "расходы нотариуса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расход[а-я]*\\s+(?:по|на)\\s+(?:государственн[а-я]*\\s+)?регистрац[а-я]*"
        - "(?i)государственн[а-я]*\\s+пошлин[а-я]*|госпошлин[а-я]*"
        - "(?i)нотариальн[а-я]*\\s+расход[а-я]*|расход[а-я]*\\s+нотариус[а-я]*"
        - "(?i)(?:нес[её]т|оплачивает|уплачивает)\\s+(?:покупатель|продавец)"
        - "(?i)сторон[а-я]*\\s+поровну"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости.

        Проверяется только один вопрос: кто несёт расходы по государственной
        регистрации перехода права собственности, госпошлине и нотариальному
        оформлению.

        Не анализируй цену объекта, НДС, способ расчётов, аванс, задаток,
        ипотеку в силу закона, обременения, передачу объекта или семейные риски.

        [ЗАДАЧА]
        Найди прямые положения договора о распределении:
        1. Расходов по государственной регистрации перехода права.
        2. Государственной пошлины.
        3. Нотариальных расходов, если они прямо упомянуты.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не предполагай обычный порядок распределения расходов, если договор
           его прямо не устанавливает.
        3. Если расходы распределены по-разному, отрази это кратко:
           "Госпошлина — Покупатель; нотариальные расходы — Продавец".
        4. Если прямо указано, что расходы несут стороны поровну, так и верни.
