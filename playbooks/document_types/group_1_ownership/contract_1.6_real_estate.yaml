# ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Чистота титула — обременения, аресты, аренда, долги
  # ──────────────────────────────────────────────────────────────────────────
  - id: title_cleanliness_check
    name: "Чистота титула: обременения, аресты, аренда и задолженность"
    description: >
      Фактографическая проверка заверений об отсутствии залогов, ипотек, арестов,
      запретов регистрационных действий, действующих договоров аренды и задолженности
      по ЖКУ. Это частноправовые притязания третьих лиц на объект.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не обременен"
        - "отсутствие обременений"
        - "не заложен"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "не сдан в аренду"
        - "никаких прав третьих лиц"
        - "запрет регистрационных действий"
        - "ограничение регистрационных действий"
        - "арест"
        - "отсутствуют ограничения"
        - "в ЕГРН отсутствуют записи"
        - "аренда"
        - "найм"
        - "отсутствие задолженности"
        - "коммунальные"
        - "капремонт"
      keyword_mode: "any"
      negative_keywords:
        - "наложен арест"
        - "введен запрет"
      regex_patterns:
        - "(?i)продавец.*гарантирует.*отсутствие.*обременений"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"
        - "(?i)запрет\\s+регистрационн"
        - "(?i)в\\s+ЕГРН\\s+отсутств(уют|ует)"
        - "(?i)договор\\s+аренд"
        - "(?i)отсутств(ует|уют).*задолженн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор купли-продажи недвижимости (ст. 460 ГК РФ; ФЗ-218).
        Проверяется только один вопрос: наличие заверений о частноправовой чистоте
        титула — обременения, аресты, аренда, задолженность.
        Не анализируй ЗОУИТ, экологию, перепланировки или банкротство продавца.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение об отсутствии обременений (залог, ипотека, сервитут).
        2. Заверение об отсутствии арестов и запретов регистрационных действий.
        3. Раскрытие аренды/найма или заверение об их отсутствии.
        4. Заверение об отсутствии задолженности по ЖКУ, налогам, капремонту.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если заверение не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Объект не обременён залогами, не под арестом, не сдан в аренду.
        Задолженность по ЖКУ отсутствует."
        Ответ:
        {
          "encumbrances_status": "defined",
          "encumbrances_details": "не обременён залогами",
          "arrest_ban_status": "defined",
          "arrest_ban_details": "не под арестом",
          "lease_status": "defined",
          "lease_details": "не сдан в аренду",
          "utility_debts_status": "defined",
          "utility_debts_details": "задолженность по ЖКУ отсутствует",
          "evidence": [{"clause_ref": "п. 4.1", "quote": "..."}]
        }

        Пример 2:
        "Продавец передаёт объект покупателю."
        Ответ:
        {
          "encumbrances_status": "not_defined",
          "encumbrances_details": "Данные не определены",
          "arrest_ban_status": "not_defined",
          "arrest_ban_details": "Данные не определены",
          "lease_status": "not_defined",
          "lease_details": "Данные не определены",
          "utility_debts_status": "not_defined",
          "utility_debts_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Заверение по каждому блоку — прямо в тексте?
        2. Не выводи заверения, которых нет.

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "encumbrances_status": "<defined / not_defined>",
          "encumbrances_details": "<текст или 'Данные не определены'>",
          "arrest_ban_status": "<defined / not_defined>",
          "arrest_ban_details": "<текст или 'Данные не определены'>",
          "lease_status": "<defined / not_defined>",
          "lease_details": "<текст или 'Данные не определены'>",
          "utility_debts_status": "<defined / not_defined>",
          "utility_debts_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_query: "не обременен отсутствие обременений не заложен не находится под арестом свободен от прав третьих лиц не сдан в аренду никаких прав третьих лиц запрет регистрационных действий арест отсутствуют ограничения в ЕГРН отсутствуют записи аренда найм отсутствие задолженности коммунальные капремонт"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "ЗОУИТ"
        - "санитарно-защитная зона"
        - "охранная зона"
        - "культурное наследие"
        - "экологическое состояние"
        - "перепланировка"
        - "сервитут инженерный"
        - "ипотека в силу закона"
        - "до полной оплаты в залоге у продавца"
        - "ст. 488 ГК РФ"
        - "банкротство"
        - "несостоятельность"
        - "цена"
        - "задаток"
        - "аккредитив"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 460
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора купли-продажи недвижимости заверения
        о частноправовой чистоте титула: обременения, аресты, аренда, задолженность.
        Не анализируй ЗОУИТ, экологию, перепланировки, банкротство продавца,
        цену, расчёты или передачу объекта.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. encumbrances_status — "defined" или "not_defined".
        2. encumbrances_details — заверение об обременениях.
        3. arrest_ban_status — "defined" или "not_defined".
        4. arrest_ban_details — заверение об арестах и запретах.
        5. lease_status — "defined" или "not_defined".
        6. lease_details — сведения об аренде или её отсутствии.
        7. utility_debts_status — "defined" или "not_defined".
        8. utility_debts_details — сведения о задолженности.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - Не додумывай заверения.
        - Верни только JSON.
        </rules>
      fields:
        - name: "encumbrances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об обременениях."
        - name: "encumbrances_details"
          type: "string"
          presentation: "fact"
          label: "Обременения"
          description: "Заверение об отсутствии обременений."
        - name: "arrest_ban_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об арестах."
        - name: "arrest_ban_details"
          type: "string"
          presentation: "fact"
          label: "Аресты и запреты"
          description: "Заверение об отсутствии арестов и запретов."
        - name: "lease_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия аренды."
        - name: "lease_details"
          type: "string"
          presentation: "fact"
          label: "Аренда"
          description: "Сведения об аренде или её отсутствии."
        - name: "utility_debts_status"
          type: "string"
          presentation: "signal"
