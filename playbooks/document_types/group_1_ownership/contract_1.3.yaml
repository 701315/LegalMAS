      keywords:
        - "индексация цены"
        - "изменение цены"
        - "пересмотр цены"
        - "корректировка стоимости"
        - "в зависимости от рыночных цен"
      keyword_mode: "any"

  - id: "certification_requirements"
    name: "Требования сертификации/декларирования (ТР ТС)"
    description: "Проверяет условия о необходимости сертификатов/деклараций соответствия"
    legal_base: "Технические регламенты ТР ТС/ЕАЭС"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "сертификат соответствия"
        - "декларация о соответствии"
        - "ТР ТС"
        - "маркировка ЕАС"
        - "подтверждение соответствия"
      keyword_mode: "any"

  - id: "sanctions_clause"
    name: "Оговорка о санкциях и ограничительных мерах"
    description: "Проверяет наличие условий о действиях при санкциях"
    legal_base: "ФЗ-281, EU Regulations, OFAC"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["international_trade"]
    rules:
      keywords:
        - "санкции"
        - "ограничительные меры"
        - "подсанкционные лица"
        - "прекращение поставок"
        - "освобождение от ответственности"
      keyword_mode: "any"

  - id: "termination_and_consequences"
    name: "Расторжение: основания и последствия (ст. 453 ГК РФ)"
    description: "Проверяет наличие оснований расторжения, порядка возврата товара/денег"
    legal_base: "ст. 453 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат товара"
        - "возврат денежных средств"
        - "неустойка"
        - "существенное нарушение"
        - "односторонний отказ"
        - "существенная недопоставка"
        - "покупка у другого поставщика"
        - "разумная цена"
        - "текущая цена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)существенн(ое|ого)\\s+нарушен"

  - id: "confidentiality"
    name: "Конфиденциальность коммерческой информации"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "коммерческая тайна"
        - "неразглашение"
        - "сведения о сделке"
      keyword_mode: "any"

  - id: "assignment_restriction"
    name: "Уступка прав/перевод долга: запрет или требование согласия"
    description: "Проверяет ограничения на уступку прав и перевод долга"
    legal_base: "ст. 382-391 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "assignment_restriction"
          type: "string"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "unclear", "not_found"]
          keyword_hints: ["запрещается уступка", "без согласия", "с согласия"]
          description: "Ограничения на уступку прав"
      store_payload: true

  - id: "responsible_storage_by_buyer"
    name: "Ответственное хранение товара при отказе от приёмки (ст. 514 ГК РФ)"
    description: "При отказе от принятия товара покупатель обязан обеспечить его сохранность (ответственное хранение) и уведомить поставщика. Проверяет наличие условий об ответственном хранении, распределении расходов и сроках распоряжения товаром."
    legal_base: "ст. 514 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственное хранение"
        - "принятие на хранение"
        - "отказ от приёмки"
        - "уведомить поставщика"
        - "обеспечить сохранность"
        - "расходы на хранение"
        - "распоряжение товаром"
        - "вывоз товара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственн(ое|ого)\\s+хранен"
        - "(?i)обеспечить\\s+сохранность.*товар"
        - "(?i)расходы\\s+на\\s+хранен"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "responsible_storage_clause"
          type: "string"
          allowed_values: ["present", "not_found"]
          keyword_hints: ["ответственное хранение", "обеспечить сохранность"]
          description: "Наличие условия об ответственном хранении"
        - name: "storage_cost_allocation"
          type: "string"
          allowed_values: ["supplier", "buyer", "at_fault_party", "not_found"]
          keyword_hints: ["за счёт поставщика", "за счёт покупателя", "за счёт виновной стороны"]
          description: "Распределение расходов на хранение"
      store_payload: true

  - id: "cover_purchase_right"
    name: "Право покупателя приобрести товар у третьих лиц за счёт поставщика (ст. 520 ГК РФ)"
    description: "При недопоставке или поставке некачественного товара покупатель вправе приобрести непоставленные товары у других лиц с отнесением разницы в цене на поставщика. Важнейшее средство защиты покупателя."
    legal_base: "ст. 520 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "приобрести у третьих лиц"
        - "покупка у другого поставщика"
        - "за счёт поставщика"
        - "разница в цене"
        - "замещающая сделка"
        - "альтернативный поставщик"
        - "право приобрести у других"
      keyword_mode: "any"
      negative_keywords:
        - "не вправе приобретать у третьих лиц"
        - "запрещается приобретение у третьих лиц"
      regex_patterns:
        - "(?i)приобрест.*у\\s+третьих\\s+лиц"
        - "(?i)за\\s+счёт\\s+поставщик"
        - "(?i)замещающ(ая|ей)\\s+сделк"

  - id: "assortment_on_replenishment"
    name: "Ассортимент при восполнении недопоставки (ст. 512 ГК РФ)"
    description: "Восполнение недопоставки по одному наименованию не засчитывается в счёт другого без согласия покупателя. Проверяет наличие явного условия о порядке восполнения при ассортиментной поставке."
    legal_base: "ст. 512 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["periodic_delivery"]
    rules:
      keywords:
        - "ассортимент"
        - "восполнение в ассортименте"
        - "замена наименования"
        - "допоставка другого товара"
        - "без согласия покупателя"
        - "засчитывается в счёт"
        - "номенклатура"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)восполнен.*ассортимент"
        - "(?i)замен(а|у).*наименован"
        - "(?i)без\\s+соглас(ия|ия\\s+покупател)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: 
      наименование/ФИО, ИНН, ОГРН/ОГРНИП, адрес, документы уполномоченных лиц, 
      подтверждение статуса предпринимателя (выписка ЕГРЮЛ/ЕГРИП).
    addressee: "Обе стороны"

  subject_identification:
    text: >
      Просим предоставить по {doc_names}: (а) полное наименование товара; 
      (б) спецификацию с количеством и ассортиментом; (в) единицы измерения; 
      (г) ссылки на стандарты/ТУ, если применимо.
    addressee: "Поставщик"

  price_required:
    text: >
      Просим подтвердить цену товара по {doc_names}: (а) цена за единицу/партию цифрами и прописью; 
      (б) включает ли цена НДС; (в) валюта и порядок пересчёта; (г) условия изменения цены.
    addressee: "Обе стороны"

  delivery_term_required:
    text: >
      Просим уточнить в {doc_names}: конкретные сроки поставки или график поставок, 
      размеры партий, периодичность, процедуру согласования изменений графика.
    addressee: "Поставщик"

  acceptance_procedure_extraction:
    text: >
      В {doc_names} критически важно уточнить процедуру приемки товара (ст. 513 ГК РФ): 
      (а) сроки проверки качества и количества; (б) порядок оформления претензий; 
      (в) документы, подтверждающие приемку; (г) последствия пропуска сроков.
    addressee: "Обе стороны"

  shortfall_replenishment:
    text: >
      Просим включить в {doc_names} условие о восполнении недопоставки товара (ст. 511 ГК РФ): 
      обязанность поставщика допоставить недостающее количество в следующем периоде 
      или иной порядок компенсации недопоставки.
    addressee: "Юридический советник покупателя"

  quality_warranty:
    text: >
      Просим предоставить по {doc_names}: (а) гарантийные условия и сроки; 
      (б) порядок устранения недостатков; (в) ответственность за некачественный товар; 
      (г) сертификаты/декларации соответствия (если товар подлежит обязательной сертификации).
    addressee: "Поставщик"

  documentation_transfer:
    text: >
      Просим уточнить в {doc_names} перечень документов, передаваемых с товаром: 
      сертификаты качества, паспорта изделий, инструкции по эксплуатации, 
      декларации/сертификаты соответствия ТР ТС.
    addressee: "Поставщик"

  penalty_delivery_delay:
    text: >
      Просим включить в {doc_names} неустойку за просрочку поставки (ст. 330, 521 ГК РФ): 
      размер (процент/фиксированная сумма), период начисления, 
      порядок предъявления и доказывания нарушения.
    addressee: "Юридический советник покупателя"

  penalty_payment_delay:
    text: >
      Просим включить в {doc_names} неустойку за просрочку оплаты (ст. 330 ГК РФ): 
      размер, период начисления, возможность взыскания процентов по ст. 395 ГК РФ 
      совместно с неустойкой.
    addressee: "Юридический советник поставщика"

  incoterms_extraction:
    text: >
      Для международной поставки по {doc_names} просим согласовать: 
      (а) базис поставки по Incoterms (FCA, FOB, CIF и др.); 
      (б) версию Incoterms (2010/2020); (в) указанное место; 
      (г) распределение расходов и рисков между сторонами.
    addressee: "Обе стороны"

  incoterms_clause:
    text: >
      Внимание: для международной поставки по {doc_names} критически важно 
      указать базис поставки по правилам Incoterms. Просим согласовать условия 
      поставки и распределение транспортных расходов, страхования, таможенных платежей.
    addressee: "Внешнеторговый консультант"

  sanctions_clause:
    text: >
      Просим включить в {doc_names} оговорку о санкциях: 
      (а) определение санкций и ограничительных мер; 
      (б) процедуру проверки отсутствия санкций; 
      (в) последствия попадания сторон под санкции; 
      (г) освобождение от ответственности при невозможности исполнения из-за санкций.
    addressee: "Юридический советник"

  custom_order_protection_check:
    text: >
      Для товаров, изготовленных под заказ по {doc_names}, просим предоставить: 
      (а) спецификацию/чертежи покупателя; (б) условия об отказе от товара 
      и возмещении затрат поставщика; (в) размер компенсации при отказе; 
      (г) порядок передачи прав на нестандартный товар.
    addressee: "Поставщик / Юридический советник"

  custom_order_protection:
    text: >
      Просим включить в {doc_names} защитные условия для поставщика при отказе 
      покупателя от товара, изготовленного по спецификации (ст. 475, 717 ГК РФ): 
      обязанность покупателя возместить затраты, размер компенсации, 
      порядок реализации товара третьим лицам.
    addressee: "Юридический советник поставщика"

  price_adjustment_mechanism:
    text: >
      Для долгосрочного договора по {doc_names} просим согласовать механизм 
      изменения цены: (а) периодичность пересмотра; (б) индексы/критерии изменения; 
      (в) порядок согласования новой цены; (г) ограничения (caps/floors).
    addressee: "Обе стороны / Финансовый консультант"

  certification_requirements:
    text: >
      Просим предоставить по {doc_names}: (а) сертификаты/декларации соответствия ТР ТС; 
      (б) подтверждение маркировки ЕАС; (в) отказные письма (если сертификация не требуется); 
      (г) сроки действия документов соответствия.
    addressee: "Поставщик"

  force_majeure_extraction:
    text: >
      Просим уточнить в {doc_names} условия о форс-мажоре: 
      (а) перечень конкретных событий (санкции, эпидемии, действия властей); 
      (б) процедуру уведомления; (в) требование о свидетельстве ТПП; 
      (г) последствия длительного форс-мажора.
    addressee: "Юридический советник"

  payment_schedule_and_conditions:
    text: >
      Просим уточнить в {doc_names}: (а) способ оплаты (предоплата/постоплата/аккредитив); 
      (б) сроки и этапы оплаты; (в) банковские реквизиты; 
      (г) условия отсрочки/рассрочки платежа.
    addressee: "Обе стороны"

  obligation_to_collect:
    text: >
      Просим включить в {doc_names} условие о самовывозе товара покупателем (ст. 510, 515 ГК РФ): 
      сроки выборки, место передачи, ответственность за хранение до выборки, 
      последствия невыборки в срок.
    addressee: "Юридический советник поставщика"

  retention_of_title:
    text: >
      Просим включить в {doc_names} условие о сохранении права собственности 
      поставщика до полной оплаты товара (ст. 491 ГК РФ): 
      момент перехода права собственности, порядок регистрации в ЕГРН (если требуется), 
      обязанности покупателя до перехода права.
    addressee: "Юридический советник поставщика"

  transfer_of_risk:
    text: >
      Просим уточнить в {doc_names} момент перехода риска случайной гибели товара 
      (ст. 459 ГК РФ): конкретное событие (отгрузка, передача перевозчику, доставка), 
      распределение рисков при транспортировке.
    addressee: "Обе стороны"

  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания расторжения (существенное нарушение, 
      неисполнение в срок); (б) порядок возврата товара/денег; (в) неустойки при расторжении; 
      (г) форс-мажор как основание расторжения.
    addressee: "Юридический советник"

  packaging_requirements:
    text: >
      Просим уточнить в {doc_names}: (а) требования к упаковке и маркировке; 
      (б) ответственность за неправильную упаковку; (в) возврат тары; 
      (г) требования к транспортировке (температурный режим и др.).
    addressee: "Поставщик"

  assignment_restriction:
    text: >
      Просим включить в {doc_names} запрет уступки прав/перевода долга 
      без согласия другой стороны либо описать допустимые случаи уступки.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности: 
      перечень конфиденциальных сведений, срок неразглашения, 
      исключения (раскрытие по требованию суда), ответственность.
    addressee: "Юридический советник"

  quality_claims_and_rejection_check:
    text: >
      Просим детализировать в {doc_names} процедуру рекламации (ст. 518-519 ГК РФ):
      (а) сроки уведомления о недостатках (отдельно — явные и скрытые);
      (б) порядок составления акта о недостатках и привлечения независимого эксперта;
      (в) право покупателя на замену товара / односторонний отказ;
      (г) ссылку на Инструкцию П-7 (если применимо).
    addressee: "Юридический советник покупателя"

  responsible_storage_by_buyer:
    text: >
      Просим включить в {doc_names} условие об ответственном хранении товара
      при отказе от приёмки (ст. 514 ГК РФ): обязанность покупателя уведомить
      поставщика, распределение расходов на хранение, срок для распоряжения
      товаром поставщиком, последствия неисполнения обязанности по вывозу.
    addressee: "Юридический советник"

  cover_purchase_right:
    text: >
      Просим уточнить в {doc_names} условие о праве покупателя на замещающую
      покупку (ст. 520 ГК РФ): порядок уведомления поставщика, расчёт разницы
      в цене, сроки предъявления требования о возмещении, ограничения
      (не дороже разумной цены / текущей рыночной цены).
    addressee: "Юридический советник покупателя"

  assortment_on_replenishment:
    text: >
      Просим уточнить в {doc_names}: при ассортиментной поставке — порядок
      восполнения недопоставки (ст. 512 ГК РФ): допускается ли замена
      наименования, требуется ли согласие покупателя, последствия
      несогласованной замены.
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"