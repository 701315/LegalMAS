type: contract_1.3_supply
name: "Договор поставки"

description: |
  Специализированный вид купли-продажи для предпринимательских отношений (B2B), 
  регулируемый § 3 Главы 30 ГК РФ (ст. 506-524).
  Характеризуется особым субъектным составом (обе стороны — предприниматели), 
  целью использования товара (для предпринимательской деятельности) и длящимся 
  характером отношений с поставками партиями.
  Ключевые риски: нарушение сроков приемки товара (ст. 513 ГК РФ), 
  недопоставка и восполнение (ст. 511 ГК РФ), международные санкции, 
  требования сертификации/декларирования по ТР ТС.

version: 4.0
parent: class_1_transfer_of_ownership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  jurisdiction: RU
  language: ru
  legal_base: "§ 3 Главы 30 ГК РФ (ст. 506-524)"
  doc_types_supported:
    - "договор поставки"
    - "договор поставки товара"
    - "рамочный договор поставки"
    - "договор поставки с графиком"
    - "договор международной поставки"
    - "договор поставки под заказ"
    - "договор поставки с отсрочкой платежа"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)поставк"
      - "(?i)поставщик"
      - "(?i)supply"
      - "(?i)поставка.*товар"

    folder_patterns:
      - "(?i)поставк"
      - "(?i)supply"
      - "(?i)logistics"

    keywords:

      high:
        - "поставк"
        - "поставщик"
        - "покупател"
        - "предпринимательская деятельность"
        - "партия"
        - "отгрузка"        
        - "недопоставка"
        - "восполнение"

      medium:
        - "получатель"
        - "график поставок"
        - "спецификация"
        - "накладная"
        - "УПД"
        - "универсальный передаточный документ"
        - "приемка"
        - "претензия"
        - "недопоставка"
        - "восполнение"

      low:
        - "самовывоз"
        - "выборка"
        - "доставка"
        - "транспортные расходы"
        - "упаковка"
        - "маркировка"

    exclusions:
      - "для личных нужд"
      - "розница"
      - "гражданин-потребитель"
      - "физлицо"
      - "розничная купля-продажа"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  b2b_supply:
    any_keywords:
      - "поставщик"
      - "покупатель"
      - "предпринимательская деятельность"
      - "ИНН"
      - "ОГРН"

  periodic_delivery:
    any_keywords:
      - "партиями"
      - "по графику"
      - "ежемесячно"
      - "ежеквартально"
      - "периодически"
      - "регулярные поставки"

  single_delivery:
    any_keywords:
      - "одноразовая поставка"
      - "единовременно"
      - "одной партией"

  international_trade:
    any_keywords:
      - "международная"
      - "импорт"
      - "экспорт"
      - "иностранный"
      - "валютный"
      - "таможня"
      - "таможенное оформление"
      - "Incoterms"

  custom_order_goods:
    any_keywords:
      - "под заказ"
      - "по спецификации"
      - "по чертежам"
      - "нестандартный"
      - "индивидуальный"
      - "изготовлено по заказу"
      - "уникальные характеристики"

  long_term_contract:
    any_keywords:
      - "на год"
      - "на два года"
      - "на три года"
      - "длительный"
      - "долгосрочный"
      - "бессрочный"
      - "сроком на"

  perishable_goods:
    any_keywords:
      - "скоропортящийся"
      - "срок годности"
      - "хранение при температуре"
      - "рефрижератор"
      - "охлаждение"

  hazardous_goods:
    any_keywords:
      - "опасный груз"
      - "ADR"
      - "IMDG"
      - "взрывчатый"
      - "ядовитый"
      - "радиоактивный"
      - "химически опасный"

  licensed_goods:
    any_keywords:
      - "лицензия"
      - "разрешение"
      - "экспортный контроль"
      - "двойного назначения"
      - "военное назначение"
      - "криптография"

  state_procurement:
    any_keywords:
      - "государственный заказ"
      - "гособоронзаказ"
      - "ГОЗ"
      - "контракт"
      - "44-ФЗ"
      - "223-ФЗ"
      - "поставка для нужд"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|доллар|евро)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b|\\d{4}[-]\\d{2}[-]\\d{2}"
  percentage: "(?i)\\d{1,3}(?:[.,]\\d+)?\\s*%"
  incoterms: "(?i)\\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\\b"
  quantity_unit: "(?i)\\b\\d+\\s*(шт|кг|т|м|м2|м3|л|упак|паллет|контейнер)\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "sanctions_compliance_check"
    name: "Соблюдение санкционных ограничений (РФ/ЕС/США)"
    description: |
      Проверка на наличие оговорок о санкционных ограничениях. 
      При международных поставках критически важно предусмотреть 
      механизм действий при попадании сторон под санкции.
    legal_base: "ФЗ-281, EU Regulations, OFAC Sanctions"
    required_triggers: ["international_trade"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "санкции"
        - "sanctions"
        - "ограничительные меры"
        - "SDN list"
        - "OFAC"
        - "противоправные ограничения"
        - "подсанкционный"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "санкции"
        - "ограничительные меры"
        - "прекращение поставок"
      rerank: true

  - id: "export_control_licensed_goods"
    name: "Лицензирование товаров военного назначения и двойного применения"
    description: |
      Товары военного назначения и двойного применения требуют 
      обязательного лицензирования. Отсутствие условий о лицензиях 
      и разрешениях — критический риск.
    legal_base: "ФЗ-150 «Об экспортном контроле», Постановление Правительства РФ № 1021"
    required_triggers: ["licensed_goods"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия"
        - "разрешение"
        - "экспортный контроль"
        - "двойного назначения"
        - "военное назначение"
        - "криптографические средства"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия"
        - "разрешение"
        - "экспортный контроль"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: acceptance_procedure_extraction
    name: "Процедура и сроки приемки товара (ст. 513 ГК РФ)"
    description: |
      Извлекает процедуру приемки товара, сроки проверки качества и количества, 
      порядок заявления претензий. Критически важно для покупателя — 
      пропуск сроков лишает права на претензии.
    triggers:
      any: ["b2b_supply"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приемка товара"
        - "проверка качества"
        - "проверка количества"
        - "претензия"
        - "в течение рабочих дней"
        - "срок для заявления"
        - "акт приемки"
        - "акт осмотра"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приемк.*товар.*в\\s+течение\\s+\\d+"
        - "(?i)проверк.*качеств.*\\d+\\s+рабоч"
        - "(?i)претенз.*в\\s+течение\\s+\\d+"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поставки.
        Найди в тексте условия о приемке товара по ст. 513 ГК РФ.

        Ответь строго в JSON-формате:
        {
          "acceptance_period_days": "<количество дней или not_found>",
          "quality_check_period": "<срок проверки качества или not_found>",
          "quantity_check_period": "<срок проверки количества или not_found>",
          "claim_period": "<срок для заявления претензий или not_found>",
          "acceptance_document": "<тип документа приемки или not_found>",
          "procedure_snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "приемка товара"
        - "проверка качества"
        - "претензия"
        - "ст. 513"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "acceptance_period_days"
          type: "string"
          regex_patterns:
            - "(?i)в\\s+течение\\s+(\\d+)\\s*рабочих?\\s*дней?"
          description: "Срок приемки товара в днях"
        - name: "quality_check_period"
          type: "string"
          description: "Срок проверки качества"
        - name: "quantity_check_period"
          type: "string"
          description: "Срок проверки количества"
        - name: "claim_period"
          type: "string"
          description: "Срок для заявления претензий"
        - name: "acceptance_document"
          type: "string"
          allowed_values: ["акт приемки", "акт осмотра", "УПД", "накладная", "not_found"]
          description: "Документ, фиксирующий приемку"
      store_payload: true

  - id: delivery_schedule_extraction
    name: "График поставок и партии (ст. 508 ГК РФ)"
    description: |
      Извлекает график поставок, размеры партий, периодичность. 
      Для периодических поставок — существенное условие.
    triggers:
      any: ["periodic_delivery"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "график поставок"
        - "партия"
        - "ежемесячно"
        - "ежеквартально"
        - "период поставки"
        - "срок поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)график.*поставок"
        - "(?i)партия.*\\d+"
        - "(?i)ежемесячно|ежеквартально"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поставки с периодическими поставками.
        Найди в тексте график поставок и условия о партиях.

        Ответь строго в JSON:
        {
          "delivery_schedule_type": "<fixed_dates / periodic / upon_request / not_found>",
          "periodicity": "<ежемесячно / ежеквартально / еженедельно / not_found>",
          "batch_size_defined": "<yes / no / not_found>",
          "schedule_reference": "<ссылка на приложение/спецификацию или not_found>",
          "snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "график поставок"
        - "партия"
        - "срок поставки"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "delivery_schedule_type"
          type: "string"
          allowed_values: ["fixed_dates", "periodic", "upon_request", "not_found"]
          description: "Тип графика поставок"
        - name: "periodicity"
          type: "string"
          allowed_values: ["ежемесячно", "ежеквартально", "еженедельно", "ежедневно", "not_found"]
          description: "Периодичность поставок"
        - name: "batch_size_defined"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Определен ли размер партии"
      store_payload: true

  - id: incoterms_extraction
    name: "Условия поставки по Инкотермс (международные контракты)"
    description: |
      Извлекает базис поставки по правилам Инкотермс (FCA, FOB, CIF и др.) 
      и распределение расходов/рисков.
    triggers:
      any: ["international_trade"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Incoterms"
        - "Инкотермс"
        - "FCA"
        - "FOB"
        - "CIF"
        - "EXW"
        - "DAP"
        - "DDP"
        - "базис поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\\b"
        - "(?i)условиях\\s+Incoterms"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий международный договор поставки.
        Найди в тексте условия поставки по правилам Инкотермс.

        Ответь строго в JSON:
        {
          "incoterms_rule": "<правило Incoterms или not_found>",
          "incoterms_version": "<версия, например 2020 / not_found>",
          "named_place": "<указанное место или not_found>",
          "transfer_of_risk_point": "<момент перехода рисков или not_found>",
          "cost_allocation_clear": "<yes / no / not_found>",
          "snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "Incoterms"
        - "FCA"
        - "FOB"
        - "CIF"
        - "базис поставки"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "incoterms_rule"
          type: "string"
          allowed_values: ["EXW", "FCA", "FAS", "FOB", "CFR", "CIF", "CPT", "CIP", "DAP", "DPU", "DDP", "not_found"]
          regex_patterns:
            - "(?i)\\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\\b"
          description: "Правило Инкотермс"
        - name: "incoterms_version"
          type: "string"
          description: "Версия Инкотермс (2010, 2020)"
        - name: "named_place"
          type: "string"
          description: "Указанное место поставки"
        - name: "cost_allocation_clear"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Ясно ли распределение расходов"
      store_payload: true

  - id: custom_order_protection_check
    name: "Защита при поставке товаров, изготовленных под заказ (ст. 523-524 ГК РФ)"
    description: |
      Проверяет наличие условий о защите поставщика при отказе покупателя
      от товара, изготовленного по спецификации покупателя (ст. 523-524 ГК РФ,
      общие нормы о возмещении убытков ст. 393 ГК РФ).
    triggers:
      any: ["custom_order_goods"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "под заказ"
        - "по спецификации"
        - "по чертежам"
        - "нестандартный"
        - "индивидуальный заказ"
        - "отказ от товара"
        - "возмещение затрат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изготовлен.*по.*спецификации"
        - "(?i)товар.*под.*заказ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поставки товаров под заказ.
        Проверь наличие защитных условий для поставщика при отказе покупателя.

        Ответь строго в JSON:
        {
          "custom_order_confirmed": "<yes / no / not_found>",
          "cancellation_terms": "<есть условия отказа / нет условий / not_found>",
          "compensation_for_costs": "<yes / no / not_found>",
          "compensation_amount": "<процент или сумма или not_found>",
          "snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "под заказ"
        - "спецификация"
        - "отказ от товара"
        - "возмещение"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "custom_order_confirmed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Подтверждено ли изготовление под заказ"
        - name: "cancellation_terms"
          type: "string"
          allowed_values: ["есть условия отказа", "нет условий", "not_found"]
          description: "Наличие условий отказа"
        - name: "compensation_for_costs"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Предусмотрено ли возмещение затрат"
      store_payload: true

  - id: force_majeure_extraction
    name: "Оговорка о форс-мажорных обстоятельствах (ст. 401, 416 ГК РФ)"
    description: |
      Извлекает условия о форс-мажоре, перечень обстоятельств, 
      процедуру уведомления и освобождения от ответственности.
    triggers:
      any: ["b2b_supply"]
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
