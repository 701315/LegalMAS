          required: true
          allowed_values: ["supplier", "buyer", "at_fault_party", "not_defined"]
      store_payload: true

  - id: quality_claims_and_rejection_check
    name: "Качество, гарантия, рекламация и замещающая покупка"
    description: >
      Фактографическая проверка наличия гарантийного срока, условий качества,
      процедуры рекламации, права на замену/отказ и замещающую покупку.
    triggers:
      any: ["b2b_supply"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантия"
        - "гарантийный срок"
        - "качество товара"
        - "свободен от недостатков"
        - "рекламация"
        - "претензия по качеству"
        - "акт о недостатках"
        - "замена товара"
        - "отказ от товара"
        - "некачественный товар"
        - "скрытые недостатки"
        - "Инструкция П-7"
        - "уведомление о недостатках"
        - "срок обнаружения"
        - "приобрести у третьих лиц"
        - "покупка у другого поставщика"
        - "за счёт поставщика"
        - "замещающая сделка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз.*по.*качеств"
        - "(?i)акт.*о.*недостатк"
        - "(?i)замен(а|у|ы)\\s+товар"
        - "(?i)отказ.*от.*товар.*ненадлежащ"
        - "(?i)гарантийн.*срок"
        - "(?i)приобрест.*у\\s+третьих\\s+лиц"
        - "(?i)за\\s+счёт\\s+поставщик"
        - "(?i)замещающ(ая|ей)\\s+сделк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: гарантийный срок, условия качества,
        процедура рекламации, право замены/отказа и замещающей покупки.

        Нормативный ориентир:
        - ст. 469, 470, 477, 518, 519, 520 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантийный срок (числовое значение и момент начала).
        2. Требования к качеству товара (ГОСТ/ТУ/иной стандарт).
        3. Срок уведомления о явных недостатках.
        4. Срок для предъявления требований по скрытым недостаткам.
        5. Форма акта о недостатках.
        6. Право покупателя на замену товара (ст. 518 ГК РФ).
        7. Право покупателя на односторонний отказ.
        8. Право замещающей покупки у третьих лиц за счёт поставщика (ст. 520 ГК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", пустые строки.
        5. В evidence — только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Гарантийный срок составляет 24 месяца с даты поставки. Товар должен
        соответствовать ГОСТ 8731-74. При обнаружении явных недостатков Покупатель
        уведомляет Поставщика в течение 5 рабочих дней. Покупатель вправе
        потребовать замены товара или вернуть его с возвратом уплаченной суммы."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "24 месяца с даты поставки",
          "quality_standard_status": "defined",
          "quality_standard_details": "ГОСТ 8731-74",
          "apparent_defects_claim_period_status": "defined",
          "apparent_defects_claim_period_details": "5 рабочих дней",
          "hidden_defects_claim_period_status": "not_defined",
          "hidden_defects_claim_period_details": "Данные не определены",
          "defect_act_status": "not_defined",
          "replacement_right_status": "defined",
          "replacement_right_details": "покупатель вправе потребовать замены или вернуть товар",
          "rejection_right_status": "defined",
          "cover_purchase_right_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийный срок составляет 24 месяца с даты поставки. Товар должен соответствовать ГОСТ 8731-74."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Качество товара определяется по соглашению сторон."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Данные не определены",
          "quality_standard_status": "not_defined",
          "quality_standard_details": "Данные не определены",
          "apparent_defects_claim_period_status": "not_defined",
          "apparent_defects_claim_period_details": "Данные не определены",
          "hidden_defects_claim_period_status": "not_defined",
          "hidden_defects_claim_period_details": "Данные не определены",
          "defect_act_status": "not_defined",
          "replacement_right_status": "not_defined",
          "replacement_right_details": "Данные не определены",
          "rejection_right_status": "not_defined",
          "cover_purchase_right_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок гарантии числом месяцев/лет и момент начала?
        2. Указан ли ГОСТ, ТУ или иной стандарт качества?
        3. Есть ли конкретный срок уведомления о явных недостатках?
        4. Есть ли условие о скрытых недостатках?
        5. Указана ли форма акта о недостатках?
        6. Указано ли прямо право замены товара?
        7. Указано ли право замещающей покупки?
        8. "В соответствии с законодательством" — это NOT defined.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<срок или 'Данные не определены'>",
          "quality_standard_status": "<defined / not_defined>",
          "quality_standard_details": "<стандарт или 'Данные не определены'>",
          "apparent_defects_claim_period_status": "<defined / not_defined>",
          "apparent_defects_claim_period_details": "<срок или 'Данные не определены'>",
          "hidden_defects_claim_period_status": "<defined / not_defined>",
          "hidden_defects_claim_period_details": "<срок или 'Данные не определены'>",
          "defect_act_status": "<defined / not_defined>",
          "replacement_right_status": "<defined / not_defined>",
          "replacement_right_details": "<текст или 'Данные не определены'>",
          "rejection_right_status": "<defined / not_defined>",
          "cover_purchase_right_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантия гарантийный срок качество товара свободен от недостатков рекламация претензия по качеству акт о недостатках замена товара отказ от товара некачественный товар скрытые недостатки Инструкция П-7 уведомление о недостатках срок обнаружения приобрести у третьих лиц покупка у другого поставщика за счёт поставщика замещающая сделка ГОСТ ТУ стандарт качества"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
        - procedures
      negative_keywords:
        - "приемка товара"
        - "проверка количества при приемке"
        - "акт приемки при поставке"
        - "ответственное хранение"
        - "отказ от приёмки при поставке"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "срок поставки"
        - "оплата"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "quality_claims_and_rejection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора сведения о гарантии, качестве
        и правах при недостатках товара.
        Анализируй только эти темы. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. quality_claims_and_rejection_check_presence:
           Агрегатное signal-поле — наличие регулирования по гарантии,
           качеству и правам при недостатках.
           - "present" — если хотя бы одно из содержательных полей
             (warranty_status, quality_standard_status,
              apparent_defects_claim_period_status,
              hidden_defects_claim_period_status,
              defect_act_status, replacement_right_status,
              rejection_right_status, cover_purchase_right_status)
             ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - warranty_details, quality_standard_details,
             apparent_defects_claim_period_details,
             hidden_defects_claim_period_details,
             replacement_right_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. warranty_status:
           - "defined" — если гарантийный срок прямо указан;
           - "not_defined" — если не указан.

        2. warranty_details:
           Срок и момент начала гарантии.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. quality_standard_status:
           - "defined" — если стандарт качества (ГОСТ/ТУ) указан;
           - "not_defined" — если не указан.

        4. quality_standard_details:
           Наименование стандарта.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. apparent_defects_claim_period_status:
           - "defined" — если срок по явным недостаткам указан;
           - "not_defined" — если не указан.

        6. apparent_defects_claim_period_details:
           Конкретный срок.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. hidden_defects_claim_period_status:
           - "defined" — если срок по скрытым недостаткам указан;
           - "not_defined" — если не указан.

        8. hidden_defects_claim_period_details:
           Конкретный срок.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. defect_act_status:
           - "defined" — если прямо указана форма или требование составления
             акта о недостатках при обнаружении брака;
           - "not_defined" — если не указана.

        10. replacement_right_status:
            - "defined" — если право покупателя требовать замены товара
              прямо предусмотрено;
            - "not_defined" — если не предусмотрено.

        11. replacement_right_details:
            Формулировка о праве замены.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        12. rejection_right_status:
            - "defined" — если право отказа от товара прямо предусмотрено;
            - "not_defined" — если не предусмотрено.

        13. cover_purchase_right_status:
            - "defined" — если право замещающей покупки у третьих лиц
              прямо предусмотрено;
            - "not_defined" — если не предусмотрено.
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_claims_and_rejection_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - "В соответствии с законодательством" без конкретики — это "not_defined".
        - Не смешивай приёмку товара с гарантийными претензиями.
        - Срок гарантии должен быть числовым (месяцы, годы) с прямым указанием начала.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантии, ни стандарта качества,
           ни сроков по недостаткам, ни прав на замену/отказ/замещающую покупку.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Качество товара определяется по соглашению сторон."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.6 — гарантия 12 месяцев, в приложении — 24 месяца.
           → presence = "unclear";
             warranty_status = "not_defined";
             warranty_details = "Не удалось определить".

        4. Полное раскрытие.
           "Гарантия 24 месяца с даты поставки. Соответствие ГОСТ 8731-74.
           Явные недостатки — уведомление в течение 5 рабочих дней.
           Право требовать замены или возврата суммы."
           → presence = "present";
             warranty_status = "defined";
             quality_standard_status = "defined";
             apparent_defects_claim_period_status = "defined";
             replacement_right_status = "defined";
             rejection_right_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_claims_and_rejection_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * warranty_details, quality_standard_details,
            apparent_defects_claim_period_details,
            hidden_defects_claim_period_details,
            replacement_right_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_claims_and_rejection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантии, качеству и правам при недостатках. Внутреннее агрегатное signal-поле."
          required: true
        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия гарантийного срока в договоре. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          description: >
            Гарантийный срок (число месяцев/лет) и момент начала его исчисления. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "quality_standard_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия требований к качеству товара (ГОСТ/ТУ). Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "quality_standard_details"
          type: "string"
          presentation: "fact"
          label: "Стандарт качества"
          description: >
            Наименование применимого стандарта качества (ГОСТ, ТУ, иное). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "apparent_defects_claim_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус определённости срока предъявления требований по явным недостаткам. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "apparent_defects_claim_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок по явным недостаткам"
          description: >
            Конкретный срок уведомления/предъявления требований по явным недостаткам. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "hidden_defects_claim_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус определённости срока предъявления требований по скрытым недостаткам. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "hidden_defects_claim_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок по скрытым недостаткам"
          description: >
            Конкретный срок предъявления требований по скрытым недостаткам товара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "defect_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия требования о форме акта о недостатках. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "replacement_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия права покупателя требовать замены товара. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "replacement_right_details"
          type: "string"
          presentation: "fact"
          label: "Право замены товара"
          description: >
            Формулировка договора о праве покупателя на замену некачественного товара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "rejection_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия права одностороннего отказа от некачественного товара. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "cover_purchase_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия права замещающей покупки у третьих лиц за счёт поставщика. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
      store_payload: true

  - id: incoterms_extraction
    name: "Условия поставки по Инкотермс (международные контракты)"
    description: >
      Фактографическая проверка наличия термина Инкотермс, версии, именованного
      места и ясности распределения расходов.
    triggers:
      any: ["international_trade"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Incoterms"
        - "Инкотермс"
        - "FCA"
        - "FOB"
        - "CIF"
        - "EXW"
        - "DAP"
        - "DDP"
        - "базис поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\\b"
        - "(?i)условиях\\s+Incoterms"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется международный договор поставки.
        Проверяется наличие условий поставки по правилам Инкотермс.

        Нормативный ориентир:
        - Инкотермс 2020 (ICC Publication No. 723E), ст. 459 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Термин Инкотермс (EXW, FCA, FOB, CIF и т.д.).
        2. Версию Инкотермс (2010 или 2020).
        3. Именованное место поставки.
        4. Распределение расходов (явно определено или нет).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если термина нет — "not_defined".
        3. Не используй "None", "null", "not_defined", пустые строки.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставка осуществляется на условиях FCA Москва (Инкотермс 2020)."

        Ответ:
        {
          "incoterms_status": "defined",
          "incoterms_rule": "FCA",
          "incoterms_version": "2020",
          "named_place_status": "defined",
          "named_place_value": "Москва",
          "cost_allocation_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Поставка осуществляется на условиях FCA Москва (Инкотермс 2020)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Поставщик осуществляет доставку товара на склад Покупателя."

        Ответ:
        {
          "incoterms_status": "not_defined",
          "incoterms_rule": "not_defined",
          "incoterms_version": "not_defined",
          "named_place_status": "not_defined",
          "named_place_value": "Данные не определены",
          "cost_allocation_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание термина Инкотермс (аббревиатура)?
        2. Указана ли версия (2020/2010)?
        3. Указано ли конкретное место?
        4. Если термина нет — не выводи его из описания доставки.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "incoterms_status": "<defined / not_defined>",
          "incoterms_rule": "<EXW / FCA / FAS / FOB / CFR / CIF / CPT / CIP / DAP / DPU / DDP / not_defined>",
          "incoterms_version": "<2020 / 2010 / not_defined>",
          "named_place_status": "<defined / not_defined>",
          "named_place_value": "<место или 'Данные не определены'>",
          "cost_allocation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Incoterms Инкотермс FCA FOB CIF EXW DAP DDP базис поставки переход риска именованное место поставки версия 2020 2010 распределение расходов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "качество"
        - "гарантия"
        - "приемка"
        - "оплата"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.05
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "incoterms_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора условия поставки по Инкотермс.
        Анализируй только Инкотермс.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. incoterms_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по условиям Инкотермс.
           - "present" — если хотя бы одно из содержательных полей
             (incoterms_status, incoterms_version,
              named_place_status, cost_allocation_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - incoterms_status = "not_defined";
           - incoterms_version = "not_defined";
           - named_place_status = "not_defined";
           - cost_allocation_status = "not_defined";
           - incoterms_rule = "not_defined";
           - named_place_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. incoterms_status:
           - "defined" — если термин Инкотермс прямо указан;
           - "not_defined" — если не указан.

        2. incoterms_rule:
           - "EXW" / "FCA" / "FAS" / "FOB" / "CFR" / "CIF" / "CPT"
             / "CIP" / "DAP" / "DPU" / "DDP";
           - "not_defined" — если термин не указан.

        3. incoterms_version:
           - "2020" / "2010" / "not_defined".

        4. named_place_status:
           - "defined" — если именованное место указано;
           - "not_defined" — если не указано.

        5. named_place_value:
           Конкретное место.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. cost_allocation_status:
           - "defined" — если распределение расходов ясно определено;
           - "not_defined" — если не определено.
        </task>

        <context_rules>
        - Перед остальными полями заполни incoterms_extraction_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          incoterms_rule = "not_defined",
          named_place_value = "Данные не определены".
        - Используй только текст договора.
        - Термин Инкотермс принимай только если в тексте есть прямая аббревиатура
          (EXW, FCA, FAS, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP).
        - Не выводи термин из описания доставки без аббревиатуры.
        - Для incoterms_version принимай только "2020" или "2010" как явно указанные.
        - Если версия не указана явно — ставь "not_defined".
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни термина Инкотермс, ни версии,
           ни именованного места.
           → presence = "missing";
             все *_status = "not_defined";
             incoterms_rule = "not_defined".

        2. Только описание доставки без аббревиатуры.
           "Поставщик осуществляет доставку товара на склад Покупателя."
           → presence = "missing";
             incoterms_status = "not_defined";
             incoterms_rule = "not_defined".

        3. Противоречие между фрагментами.
           В п.2 — FCA Москва, в п.8 — FOB Санкт-Петербург.
           → presence = "unclear";
             incoterms_status = "not_defined";
             incoterms_rule = "not_defined";
             named_place_value = "Не удалось определить".

        4. Всё раскрыто.
           "Поставка на условиях FCA Москва (Инкотермс 2020)."
           → presence = "present";
             incoterms_status = "defined";
             incoterms_rule = "FCA";
             incoterms_version = "2020";
             named_place_status = "defined";
             named_place_value = "Москва";
             cost_allocation_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для incoterms_extraction_presence используй только:
          "present", "missing", "unclear".
        - Для incoterms_status / named_place_status / cost_allocation_status
          используй только: "defined" или "not_defined".
        - Для incoterms_rule используй только:
          "EXW", "FCA", "FAS", "FOB", "CFR", "CIF", "CPT", "CIP", "DAP", "DPU", "DDP",
          "not_defined".
        - Для incoterms_version используй только: "2020", "2010", "not_defined".
        - Fallback при отсутствии данных:
          * named_place_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * named_place_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

