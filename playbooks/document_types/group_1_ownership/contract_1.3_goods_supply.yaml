          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия перечня конкретных форс-мажорных событий. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "specific_events_details"
          type: "string"
          presentation: "fact"
          label: "События форс-мажора"
          description: >
            Перечень конкретных событий, признаваемых форс-мажором по договору. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notification_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус определённости процедуры уведомления о форс-мажоре. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "notification_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Процедура уведомления"
          description: >
            Срок и способ уведомления о наступлении форс-мажорных обстоятельств. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "tpp_certificate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус требования подтверждения форс-мажора свидетельством ТПП. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "max_duration_status"
