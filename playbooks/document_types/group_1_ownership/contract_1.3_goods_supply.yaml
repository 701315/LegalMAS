        - "(?i)право.*собственности.*сохраняется.*до.*оплат"
        - "(?i)собственность.*переходит.*после.*оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: оплата, переход права собственности и риска.

        Нормативный ориентир:
        - ст. 459, 486, 491, 516 ГК РФ

        Важно:
        - Твоя задача — не оценивать риски, а только фиксировать факты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Форма оплаты (предоплата / постоплата / аккредитив / рассрочка).
        2. Конкретный срок оплаты.
        3. Момент перехода риска случайной гибели/повреждения товара.
        4. Момент перехода права собственности на товар.
        5. Наличие условия о сохранении права собственности за поставщиком до оплаты
           (retention of title).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель оплачивает товар в течение 30 дней с момента поставки
        путём перечисления на расчётный счёт Поставщика. Право собственности
        и риск случайной гибели переходят к Покупателю с момента передачи
        товара перевозчику."

        Ответ:
        {
          "payment_method_status": "defined",
          "payment_method_code": "postpayment",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 30 дней с момента поставки",
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_carrier",
          "risk_transfer_details": "с момента передачи товара перевозчику",
          "title_transfer_status": "defined",
          "title_transfer_moment": "upon_carrier",
          "title_transfer_details": "с момента передачи товара перевозчику",
          "retention_of_title_status": "not_defined",
          "title_risk_alignment": "same",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Покупатель оплачивает товар в течение 30 дней с момента поставки путём перечисления на расчётный счёт Поставщика."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "Право собственности и риск случайной гибели переходят к Покупателю с момента передачи товара перевозчику."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Оплата производится в соответствии с выставленным счётом."

        Ответ:
        {
          "payment_method_status": "not_defined",
          "payment_method_code": "not_defined",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "title_transfer_status": "not_defined",
          "title_transfer_moment": "not_defined",
          "title_transfer_details": "Данные не определены",
          "retention_of_title_status": "not_defined",
          "title_risk_alignment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок оплаты (число дней, дата)?
        2. Указан ли способ оплаты явно (предоплата/постоплата/аккредитив)?
        3. Есть ли прямая фраза о переходе риска гибели?
        4. Есть ли прямая фраза о переходе права собственности?
        5. Если моменты одинаковые — "same"; если разные — "different"; если нет ни одного — "not_defined".
        6. Есть ли фраза "право собственности сохраняется до полной оплаты"?
        7. Не подменяй отсутствие условия диспозитивом ГК.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_method_status": "<defined / not_defined>",
          "payment_method_code": "<prepayment / postpayment / installments / letter_of_credit / not_defined>",
          "payment_deadline_status": "<defined / not_defined>",
