        0. counterparty_insolvency_check_presence:
           Агрегатное signal-поле — наличие регулирования по защите
           от банкротства контрагента.
           - "present" — если хотя бы одно из содержательных полей
             (insolvency_representations_status, suspension_right_status,
              termination_right_status, efrsb_notification_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. insolvency_representations_status:
           - "defined" — если есть заверения об отсутствии процедур банкротства
             или о платёжеспособности;
           - "not_defined" — если не указаны.

        2. insolvency_representations_details:
           Содержание заверений.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. suspension_right_status:
           - "defined" — если есть право приостановить исполнение
             при появлении признаков банкротства контрагента;
           - "not_defined" — если не указано.

        4. suspension_right_details:
           Условия приостановки.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. termination_right_status:
           - "defined" — если есть право расторгнуть договор
             при возбуждении дела о банкротстве;
           - "not_defined" — если не указано.

        6. termination_right_details:
           Условия расторжения.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. efrsb_notification_status:
           - "defined" — если есть обязанность уведомлять о публикациях
             в ЕФРСБ;
           - "not_defined" — если не указана.

        8. efrsb_notification_details:
           Условия уведомления.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни counterparty_insolvency_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Общая фраза "добросовестно исполнять обязательства" без банкротной
          конкретики — это not_defined.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений о банкротстве, ни права на приостановку,
           ни расторжения при банкротстве, ни обязанности уведомлять ЕФРСБ.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны обязуются исполнять обязательства добросовестно."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.13.1 — заверение об отсутствии банкротства,
           в п.15.3 — сторона вправе инициировать банкротство.
           → presence = "unclear";
             insolvency_representations_status = "not_defined";
             insolvency_representations_details = "Не удалось определить".

        4. Полное раскрытие.
           "Каждая сторона заверяет отсутствие процедур банкротства.
           При признаках — приостановка исполнения. При возбуждении дела —
           расторжение. Уведомление о ЕФРСБ в течение 3 рабочих дней."
           → presence = "present";
             insolvency_representations_status = "defined";
             suspension_right_status = "defined";
             termination_right_status = "defined";
             efrsb_notification_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для counterparty_insolvency_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "counterparty_insolvency_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по защите от банкротства контрагента. Внутреннее агрегатное signal-поле."
          required: true
        - name: "insolvency_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия заверений об отсутствии процедур банкротства. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "insolvency_representations_details"
          type: "string"
          presentation: "fact"
          label: "Заверения о банкротстве"
          description: >
            Содержание заверений об отсутствии процедур банкротства или о платёжеспособности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "suspension_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия права на приостановку исполнения при риске банкротства. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "suspension_right_details"
          type: "string"
          presentation: "fact"
          label: "Приостановка исполнения"
          description: >
            Условия приостановки исполнения при появлении признаков банкротства контрагента. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "termination_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия права на расторжение при возбуждении дела о банкротстве. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "termination_right_details"
          type: "string"
          presentation: "fact"
          label: "Расторжение при банкротстве"
          description: >
            Условия расторжения договора при возбуждении дела о банкротстве контрагента. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "efrsb_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          description: "Статус наличия обязанности уведомлять о публикациях в ЕФРСБ. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "efrsb_notification_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление ЕФРСБ"
          description: >
            Условия уведомления контрагента о публикациях в ЕФРСБ. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

