          "notification_procedure_status": "<defined / not_defined>",
          "notification_procedure_details": "<текст или 'Данные не определены'>",
          "tpp_certificate_status": "<defined / not_defined>",
          "max_duration_status": "<defined / not_defined>",
          "max_duration_details": "<срок или 'Данные не определены'>",
          "sanctions_mentioned_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
