          "suspension_right_status": "defined",
          "suspension_right_details": "при появлении признаков банкротства контрагента",
          "termination_right_status": "defined",
          "termination_right_details": "потребовать расторжения договора при появлении признаков банкротства",
          "efrsb_notification_status": "defined",
          "efrsb_notification_details": "уведомление о публикациях в ЕФРСБ в течение 3 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Каждая сторона заверяет, что не находится в процедуре банкротства, в отношении неё не возбуждено дело о банкротстве, отсутствуют признаки неплатёжеспособности."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются исполнять обязательства добросовестно."

        Ответ:
        {
          "insolvency_representations_status": "not_defined",
          "insolvency_representations_details": "Данные не определены",
          "suspension_right_status": "not_defined",
          "suspension_right_details": "Данные не определены",
          "termination_right_status": "not_defined",
