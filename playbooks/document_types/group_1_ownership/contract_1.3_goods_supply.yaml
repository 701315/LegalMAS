        4. Указаны только основания расторжения без ссылок на неустойки, или наоборот —
           только неустойки без порядка расторжения.
           → presence = "present"; заполняются только те *_status, по которым тема раскрыта;
             остальные *_status = "not_defined", *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_termination_cluster_presence используй только: "present", "missing", "unclear".
