  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Процедура приёмки и ответственное хранение
  # ──────────────────────────────────────────────────────────────────────────
  - id: acceptance_procedure_extraction
    name: "Процедура приёмки товара и ответственное хранение"
    description: >
      Фактографическая проверка наличия в договоре условий о сроках проверки качества
      и количества, передаточных документах, порядке уведомления о недостатках,
      а также об ответственном хранении при отказе от приёмки.
    triggers:
      any: ["b2b_supply"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приемка товара"
        - "проверка качества"
        - "проверка количества"
        - "претензия"
        - "в течение рабочих дней"
        - "срок для заявления"
        - "акт приемки"
        - "акт осмотра"
        - "ответственное хранение"
        - "принятие на хранение"
        - "отказ от приёмки"
        - "уведомить поставщика"
        - "обеспечить сохранность"
        - "расходы на хранение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приемк.*товар.*в\\s+течение\\s+\\d+"
        - "(?i)проверк.*качеств.*\\d+\\s+рабоч"
        - "(?i)претенз.*в\\s+течение\\s+\\d+"
        - "(?i)ответственн(ое|ого)\\s+хранен"
        - "(?i)обеспечить\\s+сохранность.*товар"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: процедура приёмки товара и ответственное хранение.

        Нормативный ориентир:
        - ст. 513, 514 ГК РФ

        Важно:
        - Только факты. Не оцениваем, хорошо или плохо.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок проверки количества при приёмке.
        2. Срок проверки качества при приёмке.
        3. Документ, оформляемый при приёмке (акт, накладная, УПД).
        4. Срок уведомления поставщика о недостатках.
        5. Условие об ответственном хранении при отказе от приёмки.
        6. Распределение расходов на ответственное хранение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель обязан проверить количество товара в течение 2 рабочих дней,
        качество — в течение 5 рабочих дней с момента получения. Приёмка оформляется
        товарной накладной. При обнаружении недостатков Покупатель уведомляет
        Поставщика в течение 3 рабочих дней. При отказе от приёмки Покупатель
        обеспечивает ответственное хранение товара за счёт Поставщика."

        Ответ:
        {
          "quantity_check_period_status": "defined",
          "quantity_check_period_details": "2 рабочих дня с момента получения",
          "quality_check_period_status": "defined",
          "quality_check_period_details": "5 рабочих дней с момента получения",
          "acceptance_document_status": "defined",
          "acceptance_document_details": "товарная накладная",
          "claim_notification_period_status": "defined",
          "claim_notification_period_details": "3 рабочих дня",
          "responsible_storage_status": "defined",
          "storage_cost_allocation": "supplier",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Покупатель обязан проверить количество товара в течение 2 рабочих дней, качество — в течение 5 рабочих дней с момента получения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Товар принимается Покупателем."

        Ответ:
        {
          "quantity_check_period_status": "not_defined",
          "quantity_check_period_details": "Данные не определены",
          "quality_check_period_status": "not_defined",
          "quality_check_period_details": "Данные не определены",
          "acceptance_document_status": "not_defined",
          "acceptance_document_details": "Данные не определены",
          "claim_notification_period_status": "not_defined",
          "claim_notification_period_details": "Данные не определены",
          "responsible_storage_status": "not_defined",
          "storage_cost_allocation": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок проверки количества (числом дней)?
        2. Есть ли конкретный срок проверки качества?
        3. Указан ли документ для фиксации приёмки?
        4. Указан ли срок уведомления о недостатках?
        5. Есть ли условие об ответственном хранении при отказе от приёмки?
        6. Кто несёт расходы на хранение — поставщик или покупатель?
        7. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "quantity_check_period_status": "<defined / not_defined>",
          "quantity_check_period_details": "<срок или 'Данные не определены'>",
          "quality_check_period_status": "<defined / not_defined>",
          "quality_check_period_details": "<срок или 'Данные не определены'>",
          "acceptance_document_status": "<defined / not_defined>",
          "acceptance_document_details": "<документ или 'Данные не определены'>",
          "claim_notification_period_status": "<defined / not_defined>",
          "claim_notification_period_details": "<срок или 'Данные не определены'>",
          "responsible_storage_status": "<defined / not_defined>",
          "storage_cost_allocation": "<supplier / buyer / at_fault_party / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
