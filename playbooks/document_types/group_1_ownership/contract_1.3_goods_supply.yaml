        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "delivery_schedule_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора сведения о сроках и графике поставок.
        Анализируй только поставку, график, недопоставку и замену ассортимента.
        Не анализируй цену или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. delivery_schedule_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по срокам и графику поставок.
           - "present" — если хотя бы одно из содержательных полей
             (delivery_term_status, delivery_schedule_type, periodicity,
              batch_size_status, shortfall_replenishment_status,
              assortment_substitution_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - delivery_term_status = "not_defined";
           - delivery_schedule_type = "not_defined";
           - periodicity = "not_defined";
           - batch_size_status = "not_defined";
           - shortfall_replenishment_status = "not_defined";
           - assortment_substitution_status = "not_defined";
           - delivery_term_details, batch_size_details,
             shortfall_replenishment_details,
             assortment_substitution_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. delivery_term_status:
           - "defined" — если срок поставки прямо определён;
           - "not_defined" — если не определён.

        2. delivery_term_details:
           Конкретный срок (дата или период).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. delivery_schedule_type:
           - "fixed_dates" — указаны конкретные даты поставок;
           - "periodic" — указана периодичность;
           - "upon_request" — поставка по заявкам покупателя;
           - "not_defined" — тип графика прямо не определён.

        4. periodicity:
           - "monthly" / "quarterly" / "weekly" / "daily" / "not_defined".

        5. batch_size_status:
           - "defined" — если размер партии указан;
           - "not_defined" — если не указан.

        6. batch_size_details:
           Размер партии.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. shortfall_replenishment_status:
           - "defined" — если прямо предусмотрено восполнение недопоставки;
           - "not_defined" — если не предусмотрено.

        8. shortfall_replenishment_details:
           Формулировка о восполнении.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. assortment_substitution_status:
           - "defined" — если предусмотрена замена ассортимента;
           - "not_defined" — если не предусмотрена.

        10. assortment_substitution_details:
            Условия замены.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_schedule_extraction_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Срок должен быть конкретным (дата, количество дней, период).
        - Не подменяй отсутствие условия диспозитивными нормами ГК.
        - Для delivery_schedule_type используй только:
          "fixed_dates", "periodic", "upon_request", "not_defined".
        - Для periodicity используй только:
          "monthly", "quarterly", "weekly", "daily", "not_defined".
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Нет ни срока, ни графика, ни периодичности, ни партии,
           ни восполнения, ни замены ассортимента.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Срок поставки согласовывается сторонами дополнительно."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.2 — ежемесячно, в п.9 — ежеквартально.
           → presence = "unclear";
             periodicity = "not_defined";
             delivery_term_details = "Не удалось определить".

        4. Полное раскрытие графика.
           "Поставка ежемесячно, не позднее 10-го числа, партиями по 50 тонн.
           Недопоставка восполняется в следующем периоде."
           → presence = "present";
             delivery_term_status = "defined";
             delivery_schedule_type = "periodic";
             periodicity = "monthly";
             batch_size_status = "defined";
             shortfall_replenishment_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_schedule_extraction_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для delivery_schedule_type используй только:
          "fixed_dates", "periodic", "upon_request", "not_defined".
        - Для periodicity используй только:
          "monthly", "quarterly", "weekly", "daily", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_schedule_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по срокам и графику поставок. Внутреннее агрегатное signal-поле."
          required: true
        - name: "delivery_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости срока поставки. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "delivery_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок поставки"
          description: >
            Конкретный срок поставки — дата, количество дней или иной период. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "delivery_schedule_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Тип графика поставок: фиксированные даты, периодический или по заявкам. Внутреннее enum-поле."
          required: true
          allowed_values: ["fixed_dates", "periodic", "upon_request", "not_defined"]
        - name: "periodicity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Периодичность поставок, если задана в договоре. Внутреннее enum-поле."
          required: true
          allowed_values: ["monthly", "quarterly", "weekly", "daily", "not_defined"]
        - name: "batch_size_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус определённости размера партии поставки. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "batch_size_details"
          type: "string"
          presentation: "fact"
          label: "Размер партии"
          description: >
            Размер партии поставки с единицей измерения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "shortfall_replenishment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия условия о восполнении недопоставки. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "shortfall_replenishment_details"
          type: "string"
          presentation: "fact"
          label: "Восполнение недопоставки"
          description: >
            Условия и порядок восполнения недопоставленного товара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "assortment_substitution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия условия о замене ассортимента при восполнении. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "assortment_substitution_details"
          type: "string"
          presentation: "fact"
          label: "Замена ассортимента"
          description: >
            Условия допустимости замены ассортимента при восполнении недопоставки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: payment_transfer_of_risk_cluster
    name: "Оплата, переход права собственности и риска случайной гибели"
    description: >
      Фактографическая проверка наличия условий об оплате (форма, срок), моменте
      перехода права собственности и риска, наличии retention of title.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата"
        - "предоплата"
        - "постоплата"
        - "отсрочка платежа"
        - "аккредитив"
        - "банковские реквизиты"
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "переходит с момента"
        - "несет риск"
        - "право собственности сохраняется"
        - "до полной оплаты"
        - "переходит после оплаты"
        - "собственность поставщика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат.*в\\s+течение.*\\d+.*дн"
        - "(?i)риск.*случайн.*гибел.*переходит"
        - "(?i)право.*собственности.*сохраняется.*до.*оплат"
        - "(?i)собственность.*переходит.*после.*оплат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: оплата, переход права собственности и риска.

        Нормативный ориентир:
        - ст. 459, 486, 491, 516 ГК РФ

        Важно:
        - Твоя задача — не оценивать риски, а только фиксировать факты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Форма оплаты (предоплата / постоплата / аккредитив / рассрочка).
        2. Конкретный срок оплаты.
        3. Момент перехода риска случайной гибели/повреждения товара.
        4. Момент перехода права собственности на товар.
        5. Наличие условия о сохранении права собственности за поставщиком до оплаты
           (retention of title).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель оплачивает товар в течение 30 дней с момента поставки
        путём перечисления на расчётный счёт Поставщика. Право собственности
        и риск случайной гибели переходят к Покупателю с момента передачи
        товара перевозчику."

        Ответ:
        {
          "payment_method_status": "defined",
          "payment_method_code": "postpayment",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 30 дней с момента поставки",
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_carrier",
          "risk_transfer_details": "с момента передачи товара перевозчику",
          "title_transfer_status": "defined",
          "title_transfer_moment": "upon_carrier",
          "title_transfer_details": "с момента передачи товара перевозчику",
          "retention_of_title_status": "not_defined",
          "title_risk_alignment": "same",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Покупатель оплачивает товар в течение 30 дней с момента поставки путём перечисления на расчётный счёт Поставщика."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "Право собственности и риск случайной гибели переходят к Покупателю с момента передачи товара перевозчику."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Оплата производится в соответствии с выставленным счётом."

        Ответ:
        {
          "payment_method_status": "not_defined",
          "payment_method_code": "not_defined",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "title_transfer_status": "not_defined",
          "title_transfer_moment": "not_defined",
          "title_transfer_details": "Данные не определены",
          "retention_of_title_status": "not_defined",
          "title_risk_alignment": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок оплаты (число дней, дата)?
        2. Указан ли способ оплаты явно (предоплата/постоплата/аккредитив)?
        3. Есть ли прямая фраза о переходе риска гибели?
        4. Есть ли прямая фраза о переходе права собственности?
        5. Если моменты одинаковые — "same"; если разные — "different"; если нет ни одного — "not_defined".
        6. Есть ли фраза "право собственности сохраняется до полной оплаты"?
        7. Не подменяй отсутствие условия диспозитивом ГК.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "payment_method_status": "<defined / not_defined>",
          "payment_method_code": "<prepayment / postpayment / installments / letter_of_credit / not_defined>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_delivery / upon_carrier / upon_payment / upon_act / custom / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "title_transfer_status": "<defined / not_defined>",
          "title_transfer_moment": "<upon_delivery / upon_carrier / upon_payment / upon_act / custom / not_defined>",
          "title_transfer_details": "<текст или 'Данные не определены'>",
          "retention_of_title_status": "<yes / no / not_defined>",
          "title_risk_alignment": "<same / different / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата предоплата постоплата отсрочка платежа аккредитив банковские реквизиты риск случайной гибели риск случайного повреждения переходит с момента несет риск право собственности сохраняется до полной оплаты переходит после оплаты собственность поставщика"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "за каждый день просрочки"
        - "расторжение"
        - "форс-мажор"
        - "приемка"
        - "качество"
        - "гарантия"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1250

      compact_output: false

      presence_signal:
        field: "payment_transfer_of_risk_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора поставки
        сведения об оплате, переходе риска случайной гибели и переходе права собственности.
        Анализируй только эти темы.
        Не анализируй качество, поставку, ответственность или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. payment_transfer_of_risk_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по оплате,
           переходу риска и права собственности.
           - "present" — если хотя бы одно из содержательных полей
             (payment_method_status, payment_deadline_status,
              risk_transfer_status, title_transfer_status,
              retention_of_title_status, title_risk_alignment)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_method_status = "not_defined";
           - payment_method_code = "not_defined";
           - payment_deadline_status = "not_defined";
           - risk_transfer_status = "not_defined";
           - risk_transfer_moment = "not_defined";
           - title_transfer_status = "not_defined";
           - title_transfer_moment = "not_defined";
           - retention_of_title_status = "not_defined";
           - title_risk_alignment = "not_defined";
           - payment_deadline_details, risk_transfer_details,
             title_transfer_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. payment_method_status:
           - "defined" — если форма оплаты прямо определена;
           - "not_defined" — если не определена.

        2. payment_method_code:
           - "prepayment" — оплата до поставки;
           - "postpayment" — оплата после поставки;
           - "installments" — оплата частями/рассрочка;
           - "letter_of_credit" — аккредитив;
           - "not_defined" — форма не определена.

        3. payment_deadline_status:
           - "defined" — если срок оплаты прямо определён;
           - "not_defined" — если не определён.

        4. payment_deadline_details:
           Конкретный срок оплаты.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. risk_transfer_status:
           - "defined" — если момент перехода риска прямо указан;
           - "not_defined" — если не указан.

        6. risk_transfer_moment:
           - "upon_delivery" / "upon_carrier" / "upon_payment" / "upon_act"
             / "custom" / "not_defined".

        7. risk_transfer_details:
           Точная формулировка о переходе риска.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. title_transfer_status:
           - "defined" — если момент перехода права собственности прямо указан;
           - "not_defined" — если не указан.

        9. title_transfer_moment:
           - "upon_delivery" / "upon_carrier" / "upon_payment" / "upon_act"
             / "custom" / "not_defined".

        10. title_transfer_details:
            Точная формулировка о переходе права собственности.
            Правила:
            - если не установлено — "Данные не определены";
            - если данные противоречивы — "Не удалось определить".

        11. retention_of_title_status:
            - "yes" — если право собственности переходит только после полной
              оплаты или сохраняется за поставщиком до оплаты;
            - "no" — если право собственности переходит до оплаты;
            - "not_defined" — если не указано.

        12. title_risk_alignment:
            - "same" — оба момента определены и совпадают;
            - "different" — оба определены и различаются;
            - "not_defined" — хотя бы один не определён.
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_transfer_of_risk_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_moment = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй диспозитивные нормы ГК вместо отсутствующих условий.
        - Не путай момент перехода риска с моментом перехода права собственности.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Нет ни формы оплаты, ни срока, ни момента перехода риска/права.
           → presence = "missing";
             все *_status = "not_defined";
             все *_moment = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Оплата производится в соответствии с выставленным счётом."
           → presence = "missing";
             payment_method_status = "not_defined";
             остальные = "not_defined".

        3. Противоречие между фрагментами.
           В п.4.1 — постоплата 30 дней, в п.9 — предоплата 100%.
           → presence = "unclear";
             payment_method_status = "not_defined";
             payment_method_code = "not_defined";
             payment_deadline_details = "Не удалось определить".

        4. Всё раскрыто.
           "Покупатель оплачивает товар в течение 30 дней с момента поставки.
           Право собственности и риск случайной гибели переходят
           с момента передачи товара перевозчику."
           → presence = "present";
             payment_method_status = "defined";
             payment_method_code = "postpayment";
             payment_deadline_status = "defined";
             risk_transfer_status = "defined";
             risk_transfer_moment = "upon_carrier";
             title_transfer_status = "defined";
             title_transfer_moment = "upon_carrier";
             title_risk_alignment = "same".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_transfer_of_risk_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для payment_method_code используй только:
          "prepayment", "postpayment", "installments", "letter_of_credit", "not_defined".
        - Для *_moment используй только:
          "upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined".
        - Для retention_of_title_status используй только:
          "yes", "no", "not_defined".
        - Для title_risk_alignment используй только:
          "same", "different", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_transfer_of_risk_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по оплате и переходу риска/права. Внутреннее агрегатное signal-поле."
          required: true
        - name: "payment_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости формы оплаты. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "payment_method_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Форма оплаты: предоплата, постоплата, рассрочка, аккредитив. Внутреннее enum-поле."
          required: true
          allowed_values: ["prepayment", "postpayment", "installments", "letter_of_credit", "not_defined"]
        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости срока оплаты. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: >
            Конкретный срок оплаты (дней, дата, период). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости момента перехода риска случайной гибели. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Момент перехода риска случайной гибели товара. Внутреннее enum-поле."
          required: true
          allowed_values: ["upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined"]
        - name: "risk_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход риска"
          description: >
            Формулировка договора о моменте перехода риска случайной гибели. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "title_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости момента перехода права собственности. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "title_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Момент перехода права собственности на товар. Внутреннее enum-поле."
          required: true
          allowed_values: ["upon_delivery", "upon_carrier", "upon_payment", "upon_act", "custom", "not_defined"]
        - name: "title_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права собственности"
          description: >
            Формулировка договора о моменте перехода права собственности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "retention_of_title_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Наличие retention of title — сохранение собственности за поставщиком до оплаты. Внутреннее enum-поле."
          required: true
          allowed_values: ["yes", "no", "not_defined"]
        - name: "title_risk_alignment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Совпадают ли моменты перехода риска и права собственности. Внутреннее enum-поле."
          required: true
          allowed_values: ["same", "different", "not_defined"]
      store_payload: true

  - id: acceptance_procedure_extraction
    name: "Процедура приёмки товара и ответственное хранение"
    description: >
      Фактографическая проверка наличия в договоре условий о сроках проверки качества
      и количества, передаточных документах, порядке уведомления о недостатках,
      а также об ответственном хранении при отказе от приёмки.
    triggers:
      any: ["b2b_supply"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приемка товара"
        - "проверка качества"
        - "проверка количества"
        - "претензия"
        - "в течение рабочих дней"
        - "срок для заявления"
        - "акт приемки"
        - "акт осмотра"
        - "ответственное хранение"
        - "принятие на хранение"
        - "отказ от приёмки"
        - "уведомить поставщика"
        - "обеспечить сохранность"
        - "расходы на хранение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приемк.*товар.*в\\s+течение\\s+\\d+"
        - "(?i)проверк.*качеств.*\\d+\\s+рабоч"
        - "(?i)претенз.*в\\s+течение\\s+\\d+"
        - "(?i)ответственн(ое|ого)\\s+хранен"
        - "(?i)обеспечить\\s+сохранность.*товар"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: процедура приёмки товара и ответственное хранение.

        Нормативный ориентир:
        - ст. 513, 514 ГК РФ

        Важно:
        - Только факты. Не оцениваем, хорошо или плохо.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок проверки количества при приёмке.
        2. Срок проверки качества при приёмке.
        3. Документ, оформляемый при приёмке (акт, накладная, УПД).
        4. Срок уведомления поставщика о недостатках.
        5. Условие об ответственном хранении при отказе от приёмки.
        6. Распределение расходов на ответственное хранение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Покупатель обязан проверить количество товара в течение 2 рабочих дней,
        качество — в течение 5 рабочих дней с момента получения. Приёмка оформляется
        товарной накладной. При обнаружении недостатков Покупатель уведомляет
        Поставщика в течение 3 рабочих дней. При отказе от приёмки Покупатель
        обеспечивает ответственное хранение товара за счёт Поставщика."

        Ответ:
        {
          "quantity_check_period_status": "defined",
          "quantity_check_period_details": "2 рабочих дня с момента получения",
          "quality_check_period_status": "defined",
          "quality_check_period_details": "5 рабочих дней с момента получения",
          "acceptance_document_status": "defined",
          "acceptance_document_details": "товарная накладная",
          "claim_notification_period_status": "defined",
          "claim_notification_period_details": "3 рабочих дня",
          "responsible_storage_status": "defined",
          "storage_cost_allocation": "supplier",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Покупатель обязан проверить количество товара в течение 2 рабочих дней, качество — в течение 5 рабочих дней с момента получения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Товар принимается Покупателем."

        Ответ:
        {
          "quantity_check_period_status": "not_defined",
          "quantity_check_period_details": "Данные не определены",
          "quality_check_period_status": "not_defined",
          "quality_check_period_details": "Данные не определены",
          "acceptance_document_status": "not_defined",
          "acceptance_document_details": "Данные не определены",
          "claim_notification_period_status": "not_defined",
          "claim_notification_period_details": "Данные не определены",
          "responsible_storage_status": "not_defined",
          "storage_cost_allocation": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок проверки количества (числом дней)?
        2. Есть ли конкретный срок проверки качества?
        3. Указан ли документ для фиксации приёмки?
        4. Указан ли срок уведомления о недостатках?
        5. Есть ли условие об ответственном хранении при отказе от приёмки?
        6. Кто несёт расходы на хранение — поставщик или покупатель?
        7. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "quantity_check_period_status": "<defined / not_defined>",
          "quantity_check_period_details": "<срок или 'Данные не определены'>",
          "quality_check_period_status": "<defined / not_defined>",
          "quality_check_period_details": "<срок или 'Данные не определены'>",
          "acceptance_document_status": "<defined / not_defined>",
          "acceptance_document_details": "<документ или 'Данные не определены'>",
          "claim_notification_period_status": "<defined / not_defined>",
          "claim_notification_period_details": "<срок или 'Данные не определены'>",
          "responsible_storage_status": "<defined / not_defined>",
          "storage_cost_allocation": "<supplier / buyer / at_fault_party / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "приемка товара проверка качества проверка количества претензия при приемке в течение рабочих дней срок для заявления акт приемки акт осмотра ответственное хранение принятие на хранение отказ от приёмки уведомить поставщика обеспечить сохранность расходы на хранение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "гарантийный срок"
        - "рекламация"
        - "претензия по качеству после приемки"
        - "замена товара"
        - "замещающая покупка"
        - "Инструкция П-7"
        - "скрытые недостатки"
        - "неустойка"
        - "расторжение"
        - "срок поставки"
        - "оплата"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "acceptance_procedure_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора поставки
        сведения о процедуре приёмки товара и ответственном хранении при отказе от приёмки.
        Анализируй только эти темы.
        Не анализируй цену, качество товара (гарантию), срок поставки или ответственность.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. acceptance_procedure_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по приёмке
           и ответственному хранению.
           - "present" — если хотя бы одно из содержательных полей
             (quantity_check_period_status, quality_check_period_status,
              acceptance_document_status, claim_notification_period_status,
              responsible_storage_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - storage_cost_allocation = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. quantity_check_period_status:
           - "defined" — если срок проверки количества при приёмке прямо указан;
           - "not_defined" — если не указан.

        2. quantity_check_period_details:
           Конкретный срок проверки количества.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. quality_check_period_status:
           - "defined" — если срок проверки качества при приёмке прямо указан;
           - "not_defined" — если не указан.

        4. quality_check_period_details:
           Конкретный срок проверки качества.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. acceptance_document_status:
           - "defined" — если прямо указан документ, оформляемый при приёмке;
           - "not_defined" — если не указан.

        6. acceptance_document_details:
           Наименование документа (акт, накладная, УПД и т.п.).
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. claim_notification_period_status:
           - "defined" — если срок уведомления поставщика о недостатках
             при приёмке прямо указан;
           - "not_defined" — если не указан.

        8. claim_notification_period_details:
           Конкретный срок уведомления.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. responsible_storage_status:
           - "defined" — если прямо предусмотрено ответственное хранение
             товара при отказе от приёмки;
           - "not_defined" — если не предусмотрено.

        10. storage_cost_allocation:
            - "supplier" — если расходы несёт поставщик;
            - "buyer" — если расходы несёт покупатель;
            - "at_fault_party" — если расходы зависят от вины стороны;
            - "not_defined" — если распределение расходов прямо не указано.
        </task>

        <context_rules>
        - Перед остальными полями заполни acceptance_procedure_extraction_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Срок проверки должен быть числовым (дни, рабочие дни).
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - Не смешивай приёмку при поставке с гарантийными претензиями.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сроков проверки, ни документа приёмки,
           ни уведомления о недостатках, ни ответственного хранения.
           → presence = "missing";
             все *_status = "not_defined";
             storage_cost_allocation = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Товар принимается Покупателем."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.3.2 — 5 рабочих дней на проверку качества, в п.8.1 — 10 рабочих дней.
           → presence = "unclear";
             quality_check_period_status = "not_defined";
             quality_check_period_details = "Не удалось определить".

        4. Полное раскрытие процедуры.
           "Покупатель проверяет количество в течение 2 рабочих дней,
           качество — 5 рабочих дней. Приёмка оформляется товарной накладной.
           При обнаружении недостатков уведомляет Поставщика в течение 3 рабочих дней.
           При отказе от приёмки — ответственное хранение за счёт Поставщика."
           → presence = "present";
             все *_status = "defined";
             storage_cost_allocation = "supplier".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceptance_procedure_extraction_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для storage_cost_allocation используй только:
          "supplier", "buyer", "at_fault_party", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "acceptance_procedure_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по приёмке и ответственному хранению. Внутреннее агрегатное signal-поле."
          required: true
        - name: "quantity_check_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости срока проверки количества при приёмке. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "quantity_check_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок проверки количества"
          description: >
            Конкретный срок (дни, рабочие дни) для проверки количества при приёмке. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "quality_check_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус определённости срока проверки качества при приёмке. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "quality_check_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок проверки качества"
          description: >
            Конкретный срок (дни, рабочие дни) для проверки качества при приёмке. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "acceptance_document_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
