        1. Перечислены ли конкретные документы (не просто "документация на товар")?
        2. Указаны ли конкретные требования к упаковке?
        3. Есть ли прямое требование сертификата или декларации ТР ТС?
        4. Есть ли условие о возврате тары с конкретным сроком?
        5. Есть ли условие о самовывозе и последствиях невыборки?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "documents_list_status": "<defined / not_defined>",
          "documents_list_details": "<перечень или 'Данные не определены'>",
          "packaging_requirements_status": "<defined / not_defined>",
          "packaging_requirements_details": "<требования или 'Данные не определены'>",
          "certification_status": "<defined / not_defined>",
          "certification_details": "<тип сертификата или 'Данные не определены'>",
          "returnable_packaging_status": "<defined / not_defined>",
          "returnable_packaging_details": "<условия возврата или 'Данные не определены'>",
          "pickup_condition_status": "<defined / not_defined>",
          "pickup_condition_details": "<условия самовывоза или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "документы на товар сертификат качества паспорт изделия инструкция по эксплуатации техническая документация упаковка маркировка тара этикетка сохранность товара многооборотная тара возврат тары возвратная тара сертификат соответствия декларация о соответствии ТР ТС маркировка ЕАС выборка товара самовывоз со склада поставщика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "акт приемки при поставке"
        - "проверка количества при приемке"
        - "ответственное хранение"
        - "гарантийный срок"
        - "рекламация"
        - "претензия по качеству"
        - "замена товара"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1300

      presence_signal:
        field: "documentation_packaging_cluster_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора сведения о документации на товар,
        упаковке, маркировке, сертификации, возврате многооборотной тары и условиях самовывоза.
        Не анализируй цену, неустойки, качество по гарантии или ответственность.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. documentation_packaging_cluster_presence:
           Агрегатное signal-поле — наличие регулирования документации, упаковки,
           сертификации, возврата тары и самовывоза.
           - "present" — если хотя бы одно из содержательных полей
             (documents_list_status, packaging_requirements_status, certification_status,
             returnable_packaging_status, pickup_condition_status) = "defined";
           - "missing" — если все пять содержательных полей = "not_defined"
             и в переданных фрагментах нет упоминания темы;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод о наличии регулирования сделать невозможно.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. documents_list_status — "defined" если перечень передаваемых с товаром документов
           прямо указан, иначе "not_defined".
        2. documents_list_details — конкретный перечень документов.
        3. packaging_requirements_status — "defined" если требования к упаковке
           и/или маркировке прямо указаны, иначе "not_defined".
        4. packaging_requirements_details — требования к упаковке, маркировке, этикетированию.
        5. certification_status — "defined" если прямо указано требование сертификата,
           декларации соответствия, ТР ТС / ТР ЕАЭС, иначе "not_defined".
        6. certification_details — тип и реквизиты требуемой сертификации.
        7. returnable_packaging_status — "defined" если условие о возврате многооборотной
           или возвратной тары прямо указано, иначе "not_defined".
        8. returnable_packaging_details — срок и условия возврата тары.
        9. pickup_condition_status — "defined" если условия самовывоза (выборки)
           товара со склада поставщика прямо определены, иначе "not_defined".
        10. pickup_condition_details — условия самовывоза и последствия невыборки в срок.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни documentation_packaging_cluster_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не делай предположений.
        - Не смешивай документацию на товар с передаточными документами при приёмке.
        - Сертификат качества и сертификат/декларация соответствия ТР ТС — разные сущности:
          documents_list_details — для документов на товар;
          certification_details — для сертификации соответствия.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы документов, упаковки, сертификации, тары и самовывоза
           в переданных фрагментах.
           → presence = "missing"; все *_status = "not_defined"; все *_details = "Данные не определены".

        2. Общая фраза без конкретики ("товар поставляется в стандартной упаковке",
           "с товаром передаётся необходимая документация").
           → presence = "present" (если тема упомянута), но соответствующие *_status = "not_defined";
             *_details = "Данные не определены".

        3. Противоречие между фрагментами (в одном пункте требуется декларация ТР ТС,
           в другом — прямо указано, что сертификация не требуется).
           → presence = "unclear"; certification_status = "not_defined";
             certification_details = "Не удалось определить".

        4. Отсылка на внешний документ ("документы согласно спецификации", "упаковка согласно
           приложению") без раскрытия в теле договора.
           → presence = "present"; соответствующий *_status = "not_defined";
             *_details = "Данные не определены" (сведения вынесены во внешний документ).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для documentation_packaging_cluster_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: *_status = "not_defined", *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: presence = "unclear", соответствующий *_status = "not_defined", *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "documentation_packaging_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования документации, упаковки, сертификации, возврата тары и самовывоза. Внутреннее агрегатное signal-поле."
          required: true
        - name: "documents_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия перечня передаваемых с товаром документов. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "documents_list_details"
          type: "string"
          presentation: "fact"
          label: "Перечень документов"
          description: >
            Конкретный перечень документов, передаваемых с товаром. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "packaging_requirements_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия требований к упаковке и маркировке товара. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "packaging_requirements_details"
          type: "string"
          presentation: "fact"
          label: "Требования к упаковке"
          description: >
            Конкретные требования к упаковке, маркировке и этикетированию товара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "certification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус требования сертификата/декларации соответствия ТР ТС. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "certification_details"
          type: "string"
          presentation: "fact"
          label: "Сертификация"
          description: >
            Тип и реквизиты требуемой сертификации (ТР ТС, ЕАС и т.п.). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "returnable_packaging_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          description: "Статус наличия условия о возврате многооборотной тары. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "returnable_packaging_details"
          type: "string"
          presentation: "fact"
          label: "Возврат тары"
          description: >
            Срок и условия возврата многооборотной тары поставщику. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "pickup_condition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия условий самовывоза товара со склада поставщика. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "pickup_condition_details"
          type: "string"
          presentation: "fact"
          label: "Условия самовывоза"
          description: >
            Условия самовывоза товара и последствия невыборки в срок. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: liability_termination_cluster
    name: "Неустойки, ответственность и расторжение договора"
    description: >
      Фактографическая проверка наличия неустоек за просрочку поставки и оплаты,
      оснований расторжения, возврата товара и денег при расторжении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неустойка за просрочку поставки"
        - "пеня за несвоевременную поставку"
        - "штраф за нарушение сроков"
        - "за каждый день просрочки"
        - "неустойка за просрочку оплаты"
        - "пеня за несвоевременную оплату"
        - "штраф за просрочку платежа"
        - "проценты за просрочку"
        - "проценты по ст. 395"
        - "ключевая ставка ЦБ"
        - "расторжение"
        - "отказ от договора"
        - "возврат товара"
        - "возврат денежных средств"
        - "существенное нарушение"
        - "односторонний отказ"
        - "существенная недопоставка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*просрочк.*поставк"
        - "(?i)пен.*за.*просрочк"
        - "(?i)\\d+[.,]?\\d*\\s*%.*за.*день"
        - "(?i)неустойк.*просрочк.*оплат"
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)существенн(ое|ого)\\s+нарушен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров.
        Проверяется наличие неустоек, оснований расторжения и последствий при расторжении.

        Нормативный ориентир:
        - ст. 330, 395, 450-453, 521, 523, 524 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Неустойку за просрочку поставки (ставка, период).
        2. Неустойку за просрочку оплаты (ставка, период).
        3. Ограничение максимальной суммы неустойки (cap).
        4. Основания для одностороннего отказа / расторжения для Покупателя.
        5. Основания для одностороннего отказа / расторжения для Поставщика.
        6. Предусмотрен ли прямо возврат товара при расторжении.
        7. Предусмотрен ли прямо возврат денег при расторжении.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "За просрочку поставки Поставщик уплачивает пеню в размере 0,1% от стоимости
        непоставленного товара за каждый день просрочки, но не более 10% от суммы договора.
        За просрочку оплаты Покупатель уплачивает проценты по ключевой ставке ЦБ РФ.
        При неоднократной просрочке поставки Покупатель вправе расторгнуть договор
        в одностороннем порядке."

        Ответ:
        {
          "delivery_penalty_status": "defined",
          "delivery_penalty_details": "0,1% от стоимости непоставленного товара за каждый день",
          "payment_penalty_status": "defined",
          "payment_penalty_details": "проценты по ключевой ставке ЦБ РФ",
          "penalty_cap_status": "defined",
          "penalty_cap_details": "не более 10% от суммы договора",
          "buyer_termination_grounds_status": "defined",
          "buyer_termination_grounds_details": "неоднократная просрочка поставки",
          "supplier_termination_grounds_status": "not_defined",
          "supplier_termination_grounds_details": "Данные не определены",
          "goods_return_on_termination_status": "not_defined",
          "money_return_on_termination_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку поставки Поставщик уплачивает пеню в размере 0,1% от стоимости непоставленного товара за каждый день просрочки, но не более 10% от суммы договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "delivery_penalty_status": "not_defined",
          "delivery_penalty_details": "Данные не определены",
          "payment_penalty_status": "not_defined",
          "payment_penalty_details": "Данные не определены",
          "penalty_cap_status": "not_defined",
          "penalty_cap_details": "Данные не определены",
          "buyer_termination_grounds_status": "not_defined",
          "buyer_termination_grounds_details": "Данные не определены",
          "supplier_termination_grounds_status": "not_defined",
          "supplier_termination_grounds_details": "Данные не определены",
          "goods_return_on_termination_status": "not_defined",
          "money_return_on_termination_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли конкретная ставка неустойки (%) за просрочку поставки?
        2. Указана ли конкретная ставка за просрочку оплаты или ссылка на ст. 395?
        3. Есть ли ограничение максимального размера неустойки?
        4. Перечислены ли конкретные основания расторжения для каждой стороны?
        5. Описан ли порядок возврата товара/денег при расторжении?
        6. "В соответствии с законодательством" — это NOT defined.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "delivery_penalty_status": "<defined / not_defined>",
          "delivery_penalty_details": "<ставка и база или 'Данные не определены'>",
          "payment_penalty_status": "<defined / not_defined>",
          "payment_penalty_details": "<ставка или 'Данные не определены'>",
          "penalty_cap_status": "<defined / not_defined>",
          "penalty_cap_details": "<ограничение или 'Данные не определены'>",
          "buyer_termination_grounds_status": "<defined / not_defined>",
          "buyer_termination_grounds_details": "<основания или 'Данные не определены'>",
          "supplier_termination_grounds_status": "<defined / not_defined>",
