# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_subject_price_cluster:
    text: >
      В {doc_names} не определены один или несколько из следующих элементов.
      Просим предоставить: (а) полные реквизиты Поставщика и Покупателя —
      наименование, ИНН, ОГРН/ОГРНИП, адрес, документы уполномоченных лиц;
      (б) детальное описание предмета (товара), состав и количество;
      (в) цену за единицу/партию с указанием НДС;
      (г) для долгосрочных договоров — механизм изменения цены.
    addressee: "Обе стороны"

  delivery_schedule_extraction:
    text: >
      В {doc_names} не определены условия о сроке и/или графике поставок.
      Просим предоставить: (а) срок первой поставки и периодичность;
      (б) размер партий и процедуру подачи заявок;
      (в) обязанность восполнить недопоставку в следующем периоде (ст. 511 ГК РФ);
      (г) условия ассортимента при восполнении — допускается ли замена без согласия
      покупателя (ст. 512 ГК РФ).
    addressee: "Поставщик"

  payment_transfer_of_risk_cluster:
    text: >
      В {doc_names} не определены условия оплаты и/или перехода права/риска.
      Просим предоставить: (а) форму оплаты и конкретный срок;
      (б) момент перехода риска случайной гибели товара (ст. 459 ГК РФ);
      (в) момент перехода права собственности и его соотношение с переходом риска;
      (г) условие о сохранении права собственности поставщика до полной оплаты
      (retention of title, ст. 491 ГК РФ).
    addressee: "Обе стороны"

  acceptance_procedure_extraction:
    text: >
      В {doc_names} не определена процедура приёмки товара (ст. 513 ГК РФ).
      Просим предоставить: (а) сроки проверки количества и качества;
      (б) документ для фиксации приёмки; (в) срок уведомления о недостатках;
      (г) условия ответственного хранения при отказе от приёмки (ст. 514 ГК РФ),
      включая распределение расходов на хранение.
    addressee: "Обе стороны"

  quality_claims_and_rejection_check:
    text: >
      В {doc_names} не определены условия гарантии и/или рекламации.
      Просим предоставить: (а) гарантийный срок и момент его начала;
      (б) стандарт качества (ГОСТ/ТУ); (в) сроки уведомления по явным и скрытым
      недостаткам; (г) форму акта о недостатках;
      (д) право на замену, отказ от товара (ст. 518 ГК РФ);
      (е) право замещающей покупки у третьих лиц за счёт поставщика (ст. 520 ГК РФ).
    addressee: "Юридический советник покупателя"

  incoterms_extraction:
    text: >
      В {doc_names} не определены условия поставки по Инкотермс (международный контракт).
      Просим предоставить: (а) термин Инкотермс (EXW, FCA, FOB, CIF и т.д.);
      (б) версию (2020/2010); (в) именованное место поставки;
      (г) распределение расходов по доставке, страхованию и таможенному оформлению.
    addressee: "Обе стороны"

  custom_order_protection_check:
    text: >
      В {doc_names} не определены защитные условия для поставщика при товарах под заказ.
      Просим предоставить: (а) подтверждение индивидуальной спецификации покупателем;
      (б) момент, с которого отмена заказа влечёт компенсацию;
      (в) размер компенсации затрат поставщика при отказе покупателя.
    addressee: "Поставщик / Юридический советник поставщика"

  force_majeure_extraction:
    text: >
      В {doc_names} не определены условия форс-мажора.
      Просим предоставить: (а) конкретный перечень форс-мажорных событий
      (включая санкции, военные действия, запреты на вывоз);
      (б) процедуру уведомления и требование свидетельства ТПП;
      (в) максимальный срок форс-мажора до права расторжения без санкций.
    addressee: "Юридический советник"

  documentation_packaging_cluster:
    text: >
      В {doc_names} не определены условия о документации, упаковке или сертификации.
      Просим предоставить: (а) перечень документов, передаваемых с товаром
      (сертификаты, паспорта, инструкции); (б) требования к упаковке и маркировке;
      (в) декларацию/сертификат соответствия ТР ТС (при применимости);
      (г) условия возврата многооборотной тары; (д) условия самовывоза и последствия
      невыборки (ст. 515 ГК РФ).
    addressee: "Поставщик"

  liability_termination_cluster:
    text: >
      В {doc_names} не определены условия неустоек и/или расторжения.
      Просим предоставить: (а) ставку неустойки за просрочку поставки с периодом
      начисления и максимальным ограничением (cap); (б) ставку за просрочку оплаты;
      (в) конкретные основания одностороннего отказа для каждой стороны;
      (г) порядок возврата товара и денег при расторжении.
    addressee: "Обе стороны"

  confidentiality_assignment_cluster:
    text: >
      В {doc_names} не определены условия конфиденциальности и/или уступки прав.
      Просим предоставить: (а) перечень конфиденциальных сведений и срок обязательства;
      (б) ограничения на уступку прав требования (запрет / только с согласия /
      исключения для аффилированных лиц и факторинга);
      (в) требование письменного согласия при переводе долга (ст. 391 ГК РФ).
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

    
