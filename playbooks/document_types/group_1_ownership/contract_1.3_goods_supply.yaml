        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Каждая сторона заверяет, что не находится в процедуре банкротства,
        в отношении неё не возбуждено дело о банкротстве, отсутствуют признаки
        неплатёжеспособности. При появлении признаков банкротства контрагента
        сторона вправе приостановить исполнение своих обязательств
        и потребовать расторжения договора. Сторона обязуется уведомлять
        о публикациях в ЕФРСБ в течение 3 рабочих дней."

