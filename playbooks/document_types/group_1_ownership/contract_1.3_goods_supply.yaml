          "assortment_substitution_status": "<defined / not_defined>",
          "assortment_substitution_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "completion_deadline_check"
