        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_cluster_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — assignment_restriction_status = "not_defined", details = "Данные не определены".
        - Используй только текст договора.
        - "defined" ставь не только при запрете, но и при любом прямом порядке уступки/перевода долга.
        - Не выводи ограничения из общих фраз о конфиденциальности, добросовестности или личном исполнении,
          если уступка/перевод долга прямо не урегулированы.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы уступки прав и перевода долга в переданных фрагментах.
           → presence = "missing"; assignment_restriction_status = "not_defined";
             assignment_restriction_details = "Данные не определены".

        2. Общая фраза о личном исполнении, добросовестности или конфиденциальности
           без прямого регулирования уступки или перевода долга.
           → presence = "missing"; assignment_restriction_status = "not_defined";
             assignment_restriction_details = "Данные не определены".

        3. Противоречие между фрагментами (в одном пункте уступка запрещена без согласия,
           в другом — допускается свободно; либо разные правила для уступки и перевода долга).
           → presence = "unclear"; assignment_restriction_status = "not_defined";
             assignment_restriction_details = "Не удалось определить".

        4. Уступка прав прямо разрешена без ограничений ("Сторона вправе уступать права
           по договору без согласия другой стороны").
           → presence = "present"; assignment_restriction_status = "defined";
             assignment_restriction_details = "уступка прав допускается свободно, без согласия другой стороны".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_cluster_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: assignment_restriction_status = "not_defined", details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: presence = "unclear", assignment_restriction_status = "not_defined", details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "assignment_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования уступки прав и/или перевода долга. Внутреннее агрегатное signal-поле."
          required: true
        - name: "assignment_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия условий об ограничении уступки прав/перевода долга. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "assignment_restriction_details"
          type: "string"
          presentation: "fact"
          label: "Уступка прав"
          description: >
            Условия уступки прав по договору: запрет, только с согласия или свободно. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: tax_warranties_check
    name: "Налоговые заверения и возмещение потерь (ст. 54.1 НК РФ)"
    description: >
      Фактографическая проверка наличия налоговой оговорки: заверений об
      обстоятельствах (ст. 431.2 ГК РФ), обязательства о возмещении потерь
      (ст. 406.1 ГК РФ), обязанности раскрывать информацию и предоставлять
      документы по запросу.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговая оговорка"
        - "заверения об обстоятельствах"
        - "возмещение потерь"
        - "возмещение имущественных потерь"
        - "54.1 НК"
        - "налоговая выгода"
        - "доначисление налогов"
        - "необоснованная налоговая выгода"
        - "бенефициарный владелец"
        - "цепочка собственников"
        - "налоговая добросовестность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов[а-я]+\\s+оговорк"
        - "(?i)заверени[яе].*об\\s+обстоятельств"
        - "(?i)возмещени[ея].*потерь"
        - "(?i)54\\.?1\\s*НК"
        - "(?i)необоснованн[а-я]+\\s+налогов[а-я]+\\s+выгод"
        - "(?i)бенефициарн[а-я]+\\s+владел"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки между предпринимателями.
        Проверяется наличие налоговой оговорки — заверений об обстоятельствах
        и обязательства о возмещении потерь.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ (заверения об обстоятельствах)
        - ст. 406.1 ГК РФ (возмещение имущественных потерь)
        - ст. 54.1 НК РФ (пределы осуществления прав по исчислению налогов)
        - Постановление Пленума ВАС РФ № 53 от 12.10.2006

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверения об обстоятельствах (налоговая добросовестность, дееспособность,
           отсутствие налоговых претензий, реальность деятельности).
        2. Обязательство о возмещении имущественных потерь при доначислении налогов.
        3. Обязанность контрагента предоставлять документы по запросу.
        4. Обязанность раскрывать информацию о цепочке собственников / бенефициарах.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставщик заверяет, что является добросовестным налогоплательщиком,
        не имеет признаков технической компании, не находится в реестре
        недобросовестных поставщиков. При доначислении Покупателю налогов
        по сделке Поставщик возмещает потери в полном объёме. Поставщик
        обязуется предоставлять документы по запросу в течение 5 рабочих дней
        и раскрывать информацию о цепочке собственников."

        Ответ:
        {
          "tax_representations_status": "defined",
          "tax_representations_details": "добросовестный налогоплательщик, отсутствие признаков технической компании, отсутствие в реестре недобросовестных поставщиков",
          "loss_indemnification_status": "defined",
          "loss_indemnification_details": "возмещение потерь при доначислении налогов в полном объёме",
          "documents_on_request_status": "defined",
          "documents_on_request_details": "по запросу в течение 5 рабочих дней",
          "beneficial_owners_disclosure_status": "defined",
          "beneficial_owners_disclosure_details": "обязательство раскрывать цепочку собственников",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Поставщик заверяет, что является добросовестным налогоплательщиком, не имеет признаков технической компании, не находится в реестре недобросовестных поставщиков."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство РФ."

        Ответ:
        {
          "tax_representations_status": "not_defined",
          "tax_representations_details": "Данные не определены",
          "loss_indemnification_status": "not_defined",
          "loss_indemnification_details": "Данные не определены",
          "documents_on_request_status": "not_defined",
          "documents_on_request_details": "Данные не определены",
          "beneficial_owners_disclosure_status": "not_defined",
          "beneficial_owners_disclosure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое заверение о налоговой добросовестности?
        2. Есть ли обязательство возместить потери при доначислении налогов?
        3. Есть ли обязанность предоставлять документы по запросу?
        4. Есть ли обязанность раскрывать бенефициаров?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "tax_representations_status": "<defined / not_defined>",
          "tax_representations_details": "<текст или 'Данные не определены'>",
          "loss_indemnification_status": "<defined / not_defined>",
          "loss_indemnification_details": "<текст или 'Данные не определены'>",
          "documents_on_request_status": "<defined / not_defined>",
          "documents_on_request_details": "<текст или 'Данные не определены'>",
          "beneficial_owners_disclosure_status": "<defined / not_defined>",
          "beneficial_owners_disclosure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "representations_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговая оговорка заверения об обстоятельствах возмещение потерь возмещение имущественных потерь 54.1 НК налоговая выгода доначисление налогов необоснованная налоговая выгода бенефициарный владелец цепочка собственников налоговая добросовестность предоставление документов по запросу"
      preferred_unit_types:
        - liability_provision
        - indemnification
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - limitations
        - indemnification
      negative_keywords:
        - "срок поставки"
        - "график поставок"
        - "приемка"
        - "качество"
        - "гарантийный срок"
        - "цена"
        - "оплата"
        - "предоплата"
        - "постоплата"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.95]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "limitations"
        - "indemnification"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "tax_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора сведения
        о налоговых заверениях и обязательстве о возмещении потерь.
        Анализируй только эти темы.
        Не анализируй поставку, оплату, приёмку, ответственность
        или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. tax_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по налоговым
           заверениям и возмещению потерь.
           - "present" — если хотя бы одно из содержательных полей
             (tax_representations_status, loss_indemnification_status,
              documents_on_request_status,
              beneficial_owners_disclosure_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. tax_representations_status:
           - "defined" — если есть прямое заверение о налоговой добросовестности
             контрагента (отсутствие признаков технической компании,
             реальность деятельности, отсутствие налоговых претензий);
           - "not_defined" — если такое заверение не указано.

        2. tax_representations_details:
           Содержание заверений.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. loss_indemnification_status:
           - "defined" — если есть обязательство возместить имущественные
             потери при доначислении налогов (ст. 406.1 ГК РФ);
           - "not_defined" — если не указано.

        4. loss_indemnification_details:
           Условия и порядок возмещения потерь.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. documents_on_request_status:
           - "defined" — если есть обязанность предоставлять документы
             по запросу (для подтверждения вычетов / расходов);
           - "not_defined" — если не указана.

        6. documents_on_request_details:
           Срок и порядок предоставления документов.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. beneficial_owners_disclosure_status:
           - "defined" — если есть обязанность раскрывать информацию
             о цепочке собственников / бенефициарах;
           - "not_defined" — если не указана.

        8. beneficial_owners_disclosure_details:
           Условия раскрытия.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_warranties_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Общая фраза "соблюдать законодательство РФ" без налоговой конкретики —
          это not_defined.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни налоговых заверений, ни возмещения потерь,
           ни обязанности предоставлять документы, ни раскрытия бенефициаров.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны обязуются соблюдать действующее законодательство РФ."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.9.1 — заверение об отсутствии налоговых претензий,
           в п.12.2 — право контрагента оспаривать доначисления.
           → presence = "unclear";
             tax_representations_status = "not_defined";
             tax_representations_details = "Не удалось определить".

        4. Полное раскрытие.
           "Поставщик заверяет добросовестность. При доначислении налогов —
           возмещение потерь. Документы по запросу в течение 5 рабочих дней.
           Раскрытие цепочки собственников."
           → presence = "present";
             tax_representations_status = "defined";
             loss_indemnification_status = "defined";
             documents_on_request_status = "defined";
             beneficial_owners_disclosure_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_warranties_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по налоговым заверениям и возмещению потерь. Внутреннее агрегатное signal-поле."
          required: true
        - name: "tax_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия заверений о налоговой добросовестности контрагента. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "tax_representations_details"
          type: "string"
          presentation: "fact"
          label: "Налоговые заверения"
          description: >
            Содержание заверений о налоговой добросовестности контрагента. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "loss_indemnification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия обязательства о возмещении имущественных потерь. Внутреннее enum-поле."
          required: true
