          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "claim_notification_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления о недостатках"
          description: >
            Конкретный срок уведомления поставщика об обнаруженных недостатках. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "responsible_storage_status"
          type: "string"
          presentation: "signal"
