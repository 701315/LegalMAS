          "judicial_termination_grounds_status": "defined",
          "judicial_termination_grounds_details": "Покупатель вправе требовать расторжения в судебном порядке",
          "unilateral_refusal_grounds_status": "not_defined",
          "unilateral_refusal_grounds_details": "Данные не определены",
          "material_change_of_circumstances_status": "defined",
          "material_change_of_circumstances_details": "по соглашению сторон",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Существенным нарушением признаётся: неоднократная (два и более раза) просрочка поставки, недопоставка более 30% от партии, просрочка оплаты более 60 дней."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны вправе расторгнуть договор в порядке, предусмотренном законодательством."

        Ответ:
        {
          "material_breach_definition_status": "not_defined",
          "material_breach_definition_details": "Данные не определены",
          "judicial_termination_grounds_status": "not_defined",
          "judicial_termination_grounds_details": "Данные не определены",
          "unilateral_refusal_grounds_status": "not_defined",
          "unilateral_refusal_grounds_details": "Данные не определены",
          "material_change_of_circumstances_status": "not_defined",
          "material_change_of_circumstances_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли определение существенного нарушения с конкретными критериями?
        2. Указаны ли основания расторжения в судебном порядке?
        3. Указаны ли основания одностороннего отказа для каждой стороны?
        4. Есть ли условие о существенном изменении обстоятельств?
        5. Если ничего нет — "not_defined" и "Данные не определены".

