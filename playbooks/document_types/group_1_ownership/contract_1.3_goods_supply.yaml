  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Документация, упаковка, маркировка, сертификация
  # ──────────────────────────────────────────────────────────────────────────
  - id: documentation_packaging_cluster
    name: "Документация, упаковка, маркировка и сертификация"
    description: >
      Фактографическая проверка наличия условий о перечне передаваемых документов,
      требованиях к упаковке/маркировке, сертификации по ТР ТС,
      возврате многооборотной тары и условиях самовывоза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "документы на товар"
        - "сертификат качества"
        - "паспорт изделия"
        - "инструкция по эксплуатации"
        - "техническая документация"
        - "упаковка"
        - "маркировка"
        - "тара"
        - "этикетка"
        - "сохранность товара"
        - "многооборотная тара"
        - "возврат тары"
        - "возвратная тара"
        - "сертификат соответствия"
        - "декларация о соответствии"
        - "ТР ТС"
        - "маркировка ЕАС"
        - "выборка товара"
        - "самовывоз"
        - "со склада поставщика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*тар"
        - "(?i)многооборотн.*тар"
        - "(?i)выборк.*товар"
        - "(?i)самовывоз"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров.
        Проверяется наличие условий о документах, упаковке, сертификации и самовывозе.

        Нормативный ориентир:
        - ст. 456, 481, 510, 515 ГК РФ; ТР ТС/ТР ЕАЭС

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень документов, передаваемых с товаром.
        2. Требования к упаковке и маркировке.
        3. Наличие требования сертификата/декларации ТР ТС.
        4. Условия возврата многооборотной тары.
        5. Условия самовывоза (выборки) и последствия невыборки.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Вместе с товаром Поставщик передаёт сертификат качества и паспорт изделия.
        Товар поставляется в фирменной упаковке с маркировкой ЕАС. Требуется
        декларация соответствия ТР ТС 010/2011. Многооборотная тара возвращается
        Поставщику в течение 30 дней."

        Ответ:
        {
          "documents_list_status": "defined",
          "documents_list_details": "сертификат качества и паспорт изделия",
          "packaging_requirements_status": "defined",
          "packaging_requirements_details": "фирменная упаковка с маркировкой ЕАС",
          "certification_status": "defined",
          "certification_details": "декларация соответствия ТР ТС 010/2011",
          "returnable_packaging_status": "defined",
          "returnable_packaging_details": "в течение 30 дней",
          "pickup_condition_status": "not_defined",
          "pickup_condition_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Вместе с товаром Поставщик передаёт сертификат качества и паспорт изделия."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Товар поставляется в стандартной упаковке."

        Ответ:
        {
          "documents_list_status": "not_defined",
          "documents_list_details": "Данные не определены",
          "packaging_requirements_status": "not_defined",
          "packaging_requirements_details": "Данные не определены",
          "certification_status": "not_defined",
          "certification_details": "Данные не определены",
          "returnable_packaging_status": "not_defined",
          "returnable_packaging_details": "Данные не определены",
          "pickup_condition_status": "not_defined",
          "pickup_condition_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Перечислены ли конкретные документы (не просто "документация на товар")?
        2. Указаны ли конкретные требования к упаковке?
        3. Есть ли прямое требование сертификата или декларации ТР ТС?
        4. Есть ли условие о возврате тары с конкретным сроком?
        5. Есть ли условие о самовывозе и последствиях невыборки?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "documents_list_status": "<defined / not_defined>",
          "documents_list_details": "<перечень или 'Данные не определены'>",
          "packaging_requirements_status": "<defined / not_defined>",
          "packaging_requirements_details": "<требования или 'Данные не определены'>",
          "certification_status": "<defined / not_defined>",
          "certification_details": "<тип сертификата или 'Данные не определены'>",
          "returnable_packaging_status": "<defined / not_defined>",
          "returnable_packaging_details": "<условия возврата или 'Данные не определены'>",
          "pickup_condition_status": "<defined / not_defined>",
          "pickup_condition_details": "<условия самовывоза или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "документы на товар сертификат качества паспорт изделия инструкция по эксплуатации техническая документация упаковка маркировка тара этикетка сохранность товара многооборотная тара возврат тары возвратная тара сертификат соответствия декларация о соответствии ТР ТС маркировка ЕАС выборка товара самовывоз со склада поставщика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "акт приемки при поставке"
        - "проверка количества при приемке"
        - "ответственное хранение"
        - "гарантийный срок"
        - "рекламация"
        - "претензия по качеству"
        - "замена товара"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1100


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора сведения о документации на товар,
        упаковке, маркировке, сертификации, возврате многооборотной тары и условиях самовывоза.
        Не анализируй цену, неустойки, качество по гарантии или ответственность.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. documents_list_status — "defined" если перечень передаваемых с товаром документов
           прямо указан, иначе "not_defined".
        2. documents_list_details — конкретный перечень документов.
        3. packaging_requirements_status — "defined" если требования к упаковке
           и/или маркировке прямо указаны, иначе "not_defined".
        4. packaging_requirements_details — требования к упаковке, маркировке, этикетированию.
        5. certification_status — "defined" если прямо указано требование сертификата,
           декларации соответствия, ТР ТС / ТР ЕАЭС, иначе "not_defined".
        6. certification_details — тип и реквизиты требуемой сертификации.
        7. returnable_packaging_status — "defined" если условие о возврате многооборотной
           или возвратной тары прямо указано, иначе "not_defined".
        8. returnable_packaging_details — срок и условия возврата тары.
        9. pickup_condition_status — "defined" если условия самовывоза (выборки)
           товара со склада поставщика прямо определены, иначе "not_defined".
        10. pickup_condition_details — условия самовывоза и последствия невыборки в срок.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Не смешивай документацию на товар с передаточными документами при приёмке.
        - Сертификат качества и сертификат/декларация соответствия ТР ТС — разные сущности:
          documents_list_details — для документов на товар;
          certification_details — для сертификации соответствия.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "documents_list_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия перечня передаваемых с товаром документов."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "documents_list_details"
          type: "string"
          presentation: "fact"
          label: "Перечень документов"
          description: "Конкретный перечень документов, передаваемых с товаром."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "packaging_requirements_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия требований к упаковке и маркировке товара."
