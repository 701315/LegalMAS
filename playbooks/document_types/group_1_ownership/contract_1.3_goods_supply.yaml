      store_payload: true

  - id: notices_and_edo_check
    name: "Порядок уведомлений и электронный документооборот"
    description: >
      Фактографическая проверка наличия условий о юридически значимых
      сообщениях, реквизитах для направления уведомлений, признании
      электронных документов и соглашения об ЭДО.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "юридически значимое сообщение"
        - "адрес для уведомлений"
        - "адрес электронной почты"
        - "электронный документооборот"
        - "ЭДО"
        - "электронная подпись"
        - "электронная цифровая подпись"
        - "ЭЦП"
        - "квалифицированная электронная подпись"
        - "оператор ЭДО"
        - "Диадок"
        - "СБИС"
        - "признание юридической силы"
        - "момент получения сообщения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)юридическ[а-я]+\\s+значим[а-я]+\\s+сообщен"
        - "(?i)адрес[а-я]*\\s+для\\s+уведомлен"
        - "(?i)электронн[а-я]+\\s+документооборот"
        - "(?i)оператор[а-я]*\\s+ЭДО"
        - "(?i)электронн[а-я]+\\s+подпис"
        - "(?i)ЭЦП|КЭП"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями.
        Проверяется порядок уведомлений и условия об электронном документообороте.

        Нормативный ориентир:
        - ст. 160, 165.1, 434 ГК РФ
        - ФЗ № 63-ФЗ «Об электронной подписи»
        - ст. 9 ФЗ № 402-ФЗ «О бухгалтерском учёте»

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Реквизиты для юридически значимых сообщений (адреса, email).
        2. Порядок направления уведомлений (стороны, форма, момент получения).
        3. Условие о признании документов, подписанных ЭЦП / КЭП, равнозначными
           бумажным.
        4. Соглашение об ЭДО с указанием оператора или типа подписи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Юридически значимые сообщения направляются по адресам, указанным
        в реквизитах сторон. Уведомления по email: supplier@example.com
        и buyer@example.com — считаются полученными на следующий рабочий день.
        Документы, подписанные КЭП, признаются равнозначными бумажным.
        ЭДО осуществляется через оператора Диадок."

        Ответ:
        {
          "notice_addresses_status": "defined",
          "notice_addresses_details": "адреса из реквизитов сторон; email: supplier@example.com, buyer@example.com",
          "notice_procedure_status": "defined",
          "notice_procedure_details": "по email считаются полученными на следующий рабочий день",
          "e_signature_recognition_status": "defined",
          "e_signature_recognition_details": "документы с КЭП равнозначны бумажным",
          "edo_agreement_status": "defined",
          "edo_agreement_details": "через оператора Диадок",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Юридически значимые сообщения направляются по адресам, указанным в реквизитах сторон."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются своевременно уведомлять друг друга."

        Ответ:
        {
          "notice_addresses_status": "not_defined",
          "notice_addresses_details": "Данные не определены",
          "notice_procedure_status": "not_defined",
          "notice_procedure_details": "Данные не определены",
          "e_signature_recognition_status": "not_defined",
          "e_signature_recognition_details": "Данные не определены",
          "edo_agreement_status": "not_defined",
          "edo_agreement_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли адреса для юридически значимых сообщений?
        2. Указан ли порядок направления уведомлений и момент получения?
        3. Есть ли признание юридической силы документов, подписанных ЭЦП/КЭП?
        4. Указан ли оператор ЭДО или тип электронной подписи?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "notice_addresses_status": "<defined / not_defined>",
          "notice_addresses_details": "<текст или 'Данные не определены'>",
          "notice_procedure_status": "<defined / not_defined>",
          "notice_procedure_details": "<текст или 'Данные не определены'>",
          "e_signature_recognition_status": "<defined / not_defined>",
          "e_signature_recognition_details": "<текст или 'Данные не определены'>",
          "edo_agreement_status": "<defined / not_defined>",
          "edo_agreement_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "notices_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "юридически значимое сообщение адрес для уведомлений адрес электронной почты электронный документооборот ЭДО электронная подпись электронная цифровая подпись ЭЦП квалифицированная электронная подпись оператор ЭДО Диадок СБИС признание юридической силы момент получения сообщения уведомления претензии"
      preferred_unit_types:
        - general_provision
        - obligation
        - boilerplate
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
        - representations
      negative_keywords:
        - "срок поставки"
        - "график поставок"
        - "приемка"
        - "качество"
        - "гарантийный срок"
        - "цена"
        - "оплата"
        - "форс-мажор"
        - "неустойка"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "notices_and_edo_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора сведения
        о порядке уведомлений и условиях электронного документооборота.
        Анализируй только эти темы.
        Не анализируй поставку, оплату, приёмку или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. notices_and_edo_check_presence:
           Агрегатное signal-поле — наличие регулирования по уведомлениям
           и ЭДО.
           - "present" — если хотя бы одно из содержательных полей
             (notice_addresses_status, notice_procedure_status,
              e_signature_recognition_status, edo_agreement_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. notice_addresses_status:
           - "defined" — если указаны реквизиты для юридически значимых
             сообщений (адреса, email);
           - "not_defined" — если не указаны.

        2. notice_addresses_details:
           Адреса и реквизиты для уведомлений.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. notice_procedure_status:
           - "defined" — если указан порядок направления уведомлений
             (сторона, форма, момент получения);
           - "not_defined" — если не указан.

        4. notice_procedure_details:
           Порядок направления уведомлений.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. e_signature_recognition_status:
           - "defined" — если есть признание юридической силы документов,
             подписанных ЭЦП / КЭП / УКЭП;
           - "not_defined" — если нет.

        6. e_signature_recognition_details:
           Формулировка о признании электронных подписей.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. edo_agreement_status:
           - "defined" — если указан оператор ЭДО или тип подписи
             для обмена документами;
           - "not_defined" — если не указан.

        8. edo_agreement_details:
           Условия ЭДО.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notices_and_edo_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Общая фраза "своевременно уведомлять друг друга" без адресов
          и порядка — это not_defined.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни адресов для уведомлений, ни порядка,
           ни признания ЭЦП, ни ЭДО.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны обязуются своевременно уведомлять друг друга."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.11.1 — уведомления по email, в п.13.2 — только почтой России.
           → presence = "unclear";
             notice_procedure_status = "not_defined";
             notice_procedure_details = "Не удалось определить".

        4. Полное раскрытие.
           "Юридически значимые сообщения — по адресам в реквизитах,
           email: supplier@example.com, buyer@example.com.
           Документы с КЭП равнозначны бумажным. ЭДО через Диадок."
           → presence = "present";
             notice_addresses_status = "defined";
             notice_procedure_status = "defined";
             e_signature_recognition_status = "defined";
             edo_agreement_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notices_and_edo_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notices_and_edo_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по уведомлениям и ЭДО. Внутреннее агрегатное signal-поле."
          required: true
        - name: "notice_addresses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия адресов для юридически значимых сообщений. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "notice_addresses_details"
          type: "string"
          presentation: "fact"
          label: "Адреса для уведомлений"
          description: >
            Адреса и реквизиты сторон для направления юридически значимых сообщений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "notice_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус наличия порядка направления уведомлений. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "notice_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок уведомлений"
          description: >
            Порядок направления и момент получения юридически значимых сообщений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "e_signature_recognition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус признания юридической силы документов, подписанных ЭЦП. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "e_signature_recognition_details"
          type: "string"
          presentation: "fact"
          label: "Признание ЭЦП"
          description: >
            Формулировка о признании юридической силы электронных подписей. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "edo_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Статус наличия соглашения об ЭДО. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "edo_agreement_details"
          type: "string"
          presentation: "fact"
          label: "ЭДО"
          description: >
            Оператор ЭДО и тип электронной подписи, применяемые сторонами. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: material_breach_termination_check
    name: "Существенное нарушение и расторжение по требованию стороны"
    description: >
      Фактографическая проверка наличия условий о существенном нарушении
      как основании расторжения, а также о существенном изменении обстоятельств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "существенное нарушение"
        - "существенное изменение обстоятельств"
        - "расторжение по требованию"
        - "расторжение в судебном порядке"
        - "односторонний отказ"
        - "существенная недопоставка"
        - "неоднократное нарушение"
        - "нарушение сроков оплаты"
        - "существенное нарушение договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)существенн[а-я]+\\s+нарушен"
