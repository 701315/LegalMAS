    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: срок и график поставок, периодичность, заявки,
        недопоставка и её восполнение.

        Нормативный ориентир:
        - ст. 506, 508, 509, 511, 512 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист сравнивает несколько договоров — нужна чёткая таблица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок поставки — конкретная дата или период.
        2. Тип графика (фиксированные даты / периодический / по заявкам).
        3. Периодичность поставок (ежемесячно, ежеквартально и т.д.).
        4. Определён ли размер партии.
        5. Есть ли условие о восполнении недопоставки.
        6. Допускается ли замена ассортимента при восполнении без согласия покупателя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставщик обязуется поставлять товар ежемесячно, не позднее 10-го числа
        каждого месяца, партиями по 50 тонн. Недопоставленное количество восполняется
        в следующем периоде. Замена ассортимента при восполнении допускается только
        с письменного согласия Покупателя."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "не позднее 10-го числа каждого месяца",
          "delivery_schedule_type": "periodic",
          "periodicity": "monthly",
          "batch_size_status": "defined",
          "batch_size_details": "50 тонн",
          "shortfall_replenishment_status": "defined",
          "shortfall_replenishment_details": "восполняется в следующем периоде",
          "assortment_substitution_status": "defined",
          "assortment_substitution_details": "только с письменного согласия Покупателя",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Поставщик обязуется поставлять товар ежемесячно, не позднее 10-го числа каждого месяца, партиями по 50 тонн."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Срок поставки товара согласовывается сторонами дополнительно."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Данные не определены",
          "delivery_schedule_type": "not_defined",
          "periodicity": "not_defined",
          "batch_size_status": "not_defined",
          "batch_size_details": "Данные не определены",
          "shortfall_replenishment_status": "not_defined",
          "shortfall_replenishment_details": "Данные не определены",
          "assortment_substitution_status": "not_defined",
          "assortment_substitution_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок первой или очередной поставки?
        2. Указана ли периодичность явно (не просто "регулярно")?
        3. Указан ли размер партии числом с единицей?
        4. Прямо ли написано о восполнении недопоставки?
        5. Что написано о замене ассортимента при восполнении — с согласием или без?
        6. Если ничего нет — "not_defined" и "Данные не определены".
        7. Не подменяй отсутствие условия диспозитивом ГК.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
