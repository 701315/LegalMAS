          required: false
          display_in_grid: false
        - name: "buyer_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Документ-основание полномочий подписанта покупателя. Внутреннее enum-поле."
          required: true
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
      store_payload: true

  - id: subject_quantity_price_cluster
    name: "Предмет договора, количество и цена"
    description: >
      Фактографическая проверка наличия предмета поставки, количества,
      цены, НДС и механизма изменения цены.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      regex_patterns: []
      keywords:
        - "предмет договора"
        - "наименование товара"
        - "ассортимент"
        - "номенклатура"
        - "количество"
        - "спецификация"
