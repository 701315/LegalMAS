      store_payload: true

  - id: commercial_credit_interest_check
    name: "Коммерческий кредит и проценты по отсрочке/предоплате"
    description: >
      Фактографическая проверка наличия условий о безвозмездности или
      возмездности коммерческого кредита при предоплате или отсрочке,
      а также о процентах на сумму аванса или отсрочки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "коммерческий кредит"
        - "проценты на сумму аванса"
        - "проценты на сумму предоплаты"
        - "проценты за отсрочку"
        - "проценты за рассрочку"
        - "безвозмездный"
        - "возмездный"
        - "ст. 823"
        - "ставка процентов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)коммерческ[а-я]+\\s+кредит"
        - "(?i)процент[а-я]+\\s+на\\s+сумму\\s+(аванс|предоплат)"
        - "(?i)процент[а-я]+\\s+за\\s+(отсрочк|рассрочк)"
        - "(?i)безвозмездн[а-я]+"
        - "(?i)ст\\.?\\s*823"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями.
        Проверяется наличие условий о коммерческом кредите и процентах
        на аванс или отсрочку.

        Нормативный ориентир:
        - ст. 823 ГК РФ (коммерческий кредит)
        - ст. 809 ГК РФ (проценты по займу)

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие прямого условия о безвозмездности коммерческого кредита.
        2. Наличие условия о начислении процентов на сумму предоплаты (аванса).
        3. Наличие условия о начислении процентов на сумму отсрочки/рассрочки.
        4. Конкретную ставку процентов, если она установлена.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Авансовые платежи по договору являются беспроцентными и не считаются
        коммерческим кредитом. При отсрочке платежа проценты не начисляются."

        Ответ:
        {
          "interest_free_status": "defined",
          "interest_free_details": "авансовые платежи беспроцентные, не считаются коммерческим кредитом",
          "prepayment_interest_status": "not_defined",
          "prepayment_interest_details": "Данные не определены",
          "deferred_payment_interest_status": "defined",
          "deferred_payment_interest_details": "при отсрочке платежа проценты не начисляются",
          "interest_rate_status": "not_defined",
          "interest_rate_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Авансовые платежи по договору являются беспроцентными и не считаются коммерческим кредитом."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Оплата производится в течение 30 дней с момента поставки."

        Ответ:
        {
          "interest_free_status": "not_defined",
          "interest_free_details": "Данные не определены",
          "prepayment_interest_status": "not_defined",
          "prepayment_interest_details": "Данные не определены",
          "deferred_payment_interest_status": "not_defined",
          "deferred_payment_interest_details": "Данные не определены",
          "interest_rate_status": "not_defined",
          "interest_rate_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о безвозмездности коммерческого кредита?
        2. Есть ли условие о процентах на аванс?
        3. Есть ли условие о процентах на отсрочку?
        4. Есть ли конкретная ставка процентов?
        5. Если ничего нет — "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "interest_free_status": "<defined / not_defined>",
          "interest_free_details": "<текст или 'Данные не определены'>",
