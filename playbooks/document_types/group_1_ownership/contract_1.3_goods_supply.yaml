          presentation: "signal"
          risk_weight: "medium"
          description: "Статус определённости максимального срока форс-мажора до права расторжения. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "max_duration_details"
          type: "string"
          presentation: "fact"
          label: "Максимальный срок форс-мажора"
          description: >
            Предельный срок действия форс-мажора, по истечении которого сторона вправе расторгнуть договор. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "sanctions_mentioned_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          description: "Статус прямого упоминания санкций как форс-мажорного обстоятельства. Внутреннее enum-поле."
          required: true
          allowed_values: ["defined", "not_defined"]
      store_payload: true

