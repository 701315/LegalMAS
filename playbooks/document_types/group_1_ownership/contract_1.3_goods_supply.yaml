            ФИО и должность подписанта со стороны поставщика. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
        - name: "supplier_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          description: "Документ-основание полномочий подписанта поставщика. Внутреннее enum-поле."
