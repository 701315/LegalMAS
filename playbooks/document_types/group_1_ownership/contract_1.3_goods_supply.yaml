    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями.
        Проверяется наличие оснований для расторжения по требованию стороны
        и условий о существенном изменении обстоятельств.

        Нормативный ориентир:
