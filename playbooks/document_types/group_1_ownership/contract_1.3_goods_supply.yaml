          description: "Статус наличия указания на НДС в цене товара."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "price_change_mechanism_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия механизма изменения/индексации цены."
          required: false
          allowed_values: ["defined", "not_defined"]
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Срок и график поставок, недопоставка
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_schedule_extraction
    name: "Срок, график поставок, недопоставка и восполнение"
    description: >
      Фактографическая проверка наличия срока поставки (существенное условие),
      графика и периодичности, процедуры заявок, обязанности восполнить недопоставку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок поставки"
        - "дата поставки"
        - "график поставок"
        - "не позднее"
        - "в течение"
        - "партиями"
        - "ежемесячно"
        - "ежеквартально"
        - "период поставки"
        - "спецификация"
        - "заявка"
        - "восполнение недопоставки"
        - "допоставка товара"
        - "недопоставленный товар"
        - "в следующем периоде"
        - "ассортимент"
        - "замена наименования"
        - "без согласия покупателя"
        - "номенклатура"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок.*поставки"
        - "(?i)график.*поставок"
        - "(?i)партия.*\\d+"
        - "(?i)ежемесячно|ежеквартально"
        - "(?i)восполн.*недопоставк"
        - "(?i)допоставк.*товар"
        - "(?i)восполнен.*ассортимент"
        - "(?i)замен(а|у).*наименован"
        - "(?i)без\\s+соглас(ия|ия\\s+покупател)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: срок и график поставок, периодичность, заявки,
        недопоставка и её восполнение.

        Нормативный ориентир:
        - ст. 506, 508, 509, 511, 512 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист сравнивает несколько договоров — нужна чёткая таблица.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок поставки — конкретная дата или период.
        2. Тип графика (фиксированные даты / периодический / по заявкам).
        3. Периодичность поставок (ежемесячно, ежеквартально и т.д.).
        4. Определён ли размер партии.
        5. Есть ли условие о восполнении недопоставки.
        6. Допускается ли замена ассортимента при восполнении без согласия покупателя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence — только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставщик обязуется поставлять товар ежемесячно, не позднее 10-го числа
        каждого месяца, партиями по 50 тонн. Недопоставленное количество восполняется
        в следующем периоде. Замена ассортимента при восполнении допускается только
        с письменного согласия Покупателя."

        Ответ:
        {
          "delivery_term_status": "defined",
          "delivery_term_details": "не позднее 10-го числа каждого месяца",
          "delivery_schedule_type": "periodic",
          "periodicity": "ежемесячно",
          "batch_size_status": "defined",
          "batch_size_details": "50 тонн",
          "shortfall_replenishment_status": "defined",
          "shortfall_replenishment_details": "восполняется в следующем периоде",
          "assortment_substitution_status": "defined",
          "assortment_substitution_details": "только с письменного согласия Покупателя",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Поставщик обязуется поставлять товар ежемесячно, не позднее 10-го числа каждого месяца, партиями по 50 тонн."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Срок поставки товара согласовывается сторонами дополнительно."

        Ответ:
        {
          "delivery_term_status": "not_defined",
          "delivery_term_details": "Данные не определены",
          "delivery_schedule_type": "not_defined",
          "periodicity": "not_defined",
          "batch_size_status": "not_defined",
          "batch_size_details": "Данные не определены",
          "shortfall_replenishment_status": "not_defined",
          "shortfall_replenishment_details": "Данные не определены",
          "assortment_substitution_status": "not_defined",
          "assortment_substitution_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок первой или очередной поставки?
        2. Указана ли периодичность явно (не просто "регулярно")?
           Допустимые значения: monthly / quarterly / weekly / daily / not_defined.
        3. Указан ли размер партии числом с единицей?
        4. Прямо ли написано о восполнении недопоставки?
        5. Что написано о замене ассортимента при восполнении — с согласием или без?
        6. Если ничего нет — "not_defined" и "Данные не определены".
        7. Не подменяй отсутствие условия диспозитивом ГК.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delivery_term_status": "<defined / not_defined>",
          "delivery_term_details": "<срок или 'Данные не определены'>",
          "delivery_schedule_type": "<fixed_dates / periodic / upon_request / not_defined>",
          "periodicity": "<ежемесячно / ежеквартально / еженедельно / ежедневно / not_defined>",
          "batch_size_status": "<defined / not_defined>",
          "batch_size_details": "<размер партии или 'Данные не определены'>",
          "shortfall_replenishment_status": "<defined / not_defined>",
          "shortfall_replenishment_details": "<текст или 'Данные не определены'>",
          "assortment_substitution_status": "<defined / not_defined>",
          "assortment_substitution_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "completion_deadline_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок поставки дата поставки график поставок не позднее в течение партиями ежемесячно ежеквартально период поставки спецификация заявка восполнение недопоставки допоставка недопоставленный товар в следующем периоде замена наименования без согласия покупателя номенклатура ассортимент"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "оплата"
        - "предоплата"
        - "срок оплаты"
        - "приемка товара"
        - "проверка качества"
        - "акт приемки"
