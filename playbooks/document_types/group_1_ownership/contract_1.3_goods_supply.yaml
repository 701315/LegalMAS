        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1100


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора сведения о сроках и графике поставок.
        Анализируй только поставку, график, недопоставку и замену ассортимента.
        Не анализируй цену или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:

        1. delivery_term_status — "defined" если срок поставки прямо определён.
        2. delivery_term_details — конкретный срок (дата или период).
        3. delivery_schedule_type — fixed_dates / periodic / upon_request / not_defined.
        4. periodicity — ежемесячно / ежеквартально / еженедельно / ежедневно / not_defined.
        5. batch_size_status — "defined" если размер партии указан.
        6. batch_size_details — размер партии.
        7. shortfall_replenishment_status — "defined" если прямо предусмотрено восполнение недопоставки.
        8. shortfall_replenishment_details — формулировка о восполнении.
        9. assortment_substitution_status — "defined" если предусмотрена замена ассортимента.
        10. assortment_substitution_details — условия замены.

        Если условие отсутствует:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Срок должен быть конкретным (дата, количество дней, период).
        - Не подменяй отсутствие условия диспозитивными нормами ГК.
        - Для delivery_schedule_type используй только:
          - "fixed_dates" — если указаны конкретные даты поставок
          - "periodic" — если указана периодичность (ежемесячно, ежеквартально и т.п.)
          - "upon_request" — если поставка осуществляется по заявкам покупателя
          - "not_defined" — если тип графика прямо не определён
        - Для periodicity используй только:
          - "monthly" — если прямо указано ежемесячно
          - "quarterly" — если прямо указано ежеквартально
          - "weekly" — если прямо указано еженедельно
          - "daily" — если прямо указано ежедневно
          - "not_defined" — если периодичность прямо не определена
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "delivery_term_status"
          type: "string"
          presentation: "signal"
          description: "Статус определённости срока поставки."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "delivery_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок поставки"
          description: "Конкретный срок поставки — дата, количество дней или иной период."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "delivery_schedule_type"
          type: "string"
          presentation: "signal"
          description: "Тип графика поставок: фиксированные даты, периодический или по заявкам."
          required: false
          allowed_values: ["fixed_dates", "periodic", "upon_request", "not_defined"]
        - name: "periodicity"
          type: "string"
          presentation: "signal"
          description: "Периодичность поставок, если задана в договоре."
          required: false
          allowed_values: ["monthly", "quarterly", "weekly", "daily", "not_defined"]
        - name: "batch_size_status"
          type: "string"
          presentation: "signal"
          description: "Статус определённости размера партии поставки."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "batch_size_details"
          type: "string"
          presentation: "fact"
          label: "Размер партии"
          description: "Размер партии поставки с единицей измерения."
          required: false
          display_in_grid: false
        - name: "shortfall_replenishment_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия условия о восполнении недопоставки."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "shortfall_replenishment_details"
          type: "string"
          presentation: "fact"
          label: "Восполнение недопоставки"
          description: "Условия и порядок восполнения недопоставленного товара."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "assortment_substitution_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия условия о замене ассортимента при восполнении."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "assortment_substitution_details"
          type: "string"
          presentation: "fact"
          label: "Замена ассортимента"
          description: "Условия допустимости замены ассортимента при восполнении недопоставки."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
