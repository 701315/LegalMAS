        - "стоимость"
        - "НДС"
        - "индексация"
        - "изменение цены"
      keyword_mode: "any"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: предмет, количество и цена.

        Нормативный ориентир:
        - ст. 432, 455, 485, 506 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли предмет договора (наименование товара).
        2. Определено ли количество товара или порядок его определения.
        3. Определена ли цена товара или механизм её определения.
        4. Указан ли НДС (включён или нет).
        5. Предусмотрен ли механизм изменения цены.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "not_defined" или строго
           "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет: металлические трубы ГОСТ 8731-74 в количестве 500 тонн.
        Цена: 85 000 рублей за тонну, в том числе НДС 20%."

        Ответ:
        {
          "subject_status": "defined",
          "subject_details": "металлические трубы ГОСТ 8731-74",
          "quantity_status": "defined",
          "quantity_details": "500 тонн",
          "price_status": "defined",
          "price_details": "85 000 рублей за тонну",
          "vat_status": "defined",
          "price_change_mechanism_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет: металлические трубы ГОСТ 8731-74 в количестве 500 тонн. Цена: 85 000 рублей за тонну, в том числе НДС 20%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о поставке товара на условиях, которые будут
        согласованы дополнительно."

        Ответ:
        {
          "subject_status": "not_defined",
          "subject_details": "Данные не определены",
          "quantity_status": "not_defined",
          "quantity_details": "Данные не определены",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "vat_status": "not_defined",
          "price_change_mechanism_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли наименование конкретного товара (не просто "товар")?
        2. Указано ли количество числом с единицей измерения?
        3. Указана ли цена конкретной суммой или формулой?
        4. Указано ли, включает ли цена НДС или нет?
        5. Если чего-то нет — "not_defined" и "Данные не определены".
        6. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
