          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли заверения об отсутствии процедур банкротства?
        2. Есть ли право на приостановку исполнения при признаках банкротства?
