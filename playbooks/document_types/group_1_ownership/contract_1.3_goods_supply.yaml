        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора сведения о форс-мажоре и санкционной оговорке.
        Анализируй только эту тему. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. force_majeure_extraction_presence:
           Агрегатное signal-поле — наличие регулирования форс-мажора и санкционной оговорки.
           - "present" — если хотя бы одно из содержательных полей
             (force_majeure_status, specific_events_status, notification_procedure_status,
             tpp_certificate_status, max_duration_status, sanctions_mentioned_status) = "defined";
           - "missing" — если все шесть содержательных полей = "not_defined"
             и в переданных фрагментах нет упоминания темы форс-мажора / санкций;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод о наличии регулирования сделать невозможно.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. force_majeure_status — "defined" если форс-мажорная оговорка есть.
        2. specific_events_status — "defined" если конкретные события перечислены.
        3. specific_events_details — список событий.
        4. notification_procedure_status — "defined" если процедура уведомления указана.
        5. notification_procedure_details — срок и способ уведомления.
        6. tpp_certificate_status — "defined" если требование свидетельства ТПП указано.
        7. max_duration_status — "defined" если максимальный срок форс-мажора указан.
        8. max_duration_details — конкретный срок.
        9. sanctions_mentioned_status — "defined" если санкции прямо упомянуты как форс-мажор
           либо прямо исключены из форс-мажора (тема прямо урегулирована).

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни force_majeure_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - Не подставляй нормы ГК.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы форс-мажора и санкций в переданных фрагментах.
           → presence = "missing"; все *_status = "not_defined"; все *_details = "Данные не определены".

        2. В договоре есть только общая фраза "стороны освобождаются от ответственности
           при форс-мажоре" без перечня событий, срока уведомления, ТПП и предельного срока.
           → presence = "present"; force_majeure_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами (в одном пункте санкции указаны как форс-мажор,
           в другом — прямо исключены из форс-мажора).
           → presence = "unclear"; sanctions_mentioned_status = "not_defined";
             остальные поля заполнять по тексту непротиворечивых фрагментов.

        4. Санкции прямо исключены из форс-мажора ("введение санкций не является форс-мажором").
           → presence = "present"; sanctions_mentioned_status = "defined" (тема прямо урегулирована);
             остальные поля — по тексту.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для force_majeure_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: *_status = "not_defined", *_details = "Данные не определены".
        - Fallback при противоречии или неоднозначности: presence = "unclear", соответствующий *_status = "not_defined", details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "force_majeure_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования форс-мажора и санкционной оговорки. Внутреннее агрегатное signal-поле."
          required: true
        - name: "force_majeure_status"
