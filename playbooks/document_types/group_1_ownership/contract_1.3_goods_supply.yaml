        - Fallback при противоречии или неоднозначности: presence = "unclear", соответствующий *_status = "not_defined", *_details = "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
