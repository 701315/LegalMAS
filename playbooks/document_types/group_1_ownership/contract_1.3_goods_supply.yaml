          description: >
            Название документа, оформляемого при приёмке (акт, накладная, УПД). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "claim_notification_period_status"
          type: "string"
