  - id: custom_order_protection_check
    name: "Защита при поставке товаров, изготовленных под заказ"
    description: >
      Фактографическая проверка наличия условий, защищающих поставщика при отказе
      покупателя от товара, изготовленного под заказ.
    triggers:
      any: ["custom_order_goods"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "под заказ"
        - "по спецификации"
        - "по чертежам"
        - "нестандартный"
        - "индивидуальный заказ"
        - "отказ от товара"
        - "возмещение затрат"
        - "изготовлено по заказу"
        - "спецификация покупателя"
        - "нестандартные характеристики"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изготовлен.*по.*спецификации"
        - "(?i)товар.*под.*заказ"
        - "(?i)возмещен.*затрат.*при.*отказе"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки с изготовлением товара под индивидуальный заказ.
        Проверяется наличие защитных условий для поставщика при отказе покупателя.

        Нормативный ориентир:
        - ст. 393, 523, 524, 15 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Подтверждён ли факт изготовления под заказ.
        2. Есть ли момент, с которого отмена недопустима или влечёт компенсацию.
        3. Предусмотрено ли возмещение затрат поставщика при отказе.
        4. Указан ли размер компенсации.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Товар изготавливается по индивидуальной спецификации Покупателя.
        При отказе Покупателя от принятия товара после начала производства
        Покупатель возмещает Поставщику фактически понесённые затраты
        в размере не менее 50% от стоимости договора."

        Ответ:
        {
          "custom_order_confirmed_status": "defined",
          "custom_order_confirmed_details": "изготавливается по индивидуальной спецификации Покупателя",
          "cancellation_point_status": "defined",
          "cancellation_point_details": "после начала производства",
          "compensation_for_costs_status": "defined",
          "compensation_for_costs_details": "фактически понесённые затраты не менее 50% от стоимости договора",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "При отказе Покупателя от принятия товара после начала производства Покупатель возмещает Поставщику фактически понесённые затраты в размере не менее 50% от стоимости договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Товар поставляется по согласованным характеристикам."

        Ответ:
        {
          "custom_order_confirmed_status": "not_defined",
          "custom_order_confirmed_details": "Данные не определены",
          "cancellation_point_status": "not_defined",
          "cancellation_point_details": "Данные не определены",
          "compensation_for_costs_status": "not_defined",
          "compensation_for_costs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая фраза об индивидуальном заказе / спецификации покупателя?
        2. Есть ли момент, после которого отмена платная?
        3. Указано ли прямо возмещение затрат при отказе?
        4. Есть ли конкретный % или сумма компенсации?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "custom_order_confirmed_status": "<defined / not_defined>",
          "custom_order_confirmed_details": "<текст или 'Данные не определены'>",
          "cancellation_point_status": "<defined / not_defined>",
          "cancellation_point_details": "<текст или 'Данные не определены'>",
          "compensation_for_costs_status": "<defined / not_defined>",
          "compensation_for_costs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "под заказ по спецификации по чертежам нестандартный индивидуальный заказ отказ от товара возмещение затрат изготовлено по заказу спецификация покупателя нестандартные характеристики момент платной отмены начало производства фактически понесённые затраты"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "предмет договора стандартный"
        - "срок поставки"
        - "график поставок"
        - "неустойка за просрочку поставки"
        - "расторжение"
        - "форс-мажор"
        - "приемка"
        - "качество"
        - "гарантийный срок"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.08
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "custom_order_protection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора условия защиты поставщика
        при отказе покупателя от товара под заказ.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. custom_order_protection_check_presence:
           Агрегатное signal-поле — наличие регулирования по защите поставщика
           при отказе покупателя от товара под заказ.
           - "present" — если хотя бы одно из содержательных полей
             (custom_order_confirmed_status, cancellation_point_status,
              compensation_for_costs_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. custom_order_confirmed_status:
           - "defined" — если факт изготовления под заказ прямо подтверждён;
           - "not_defined" — если не подтверждён.

        2. custom_order_confirmed_details:
           Описание индивидуального заказа.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. cancellation_point_status:
           - "defined" — если момент платной отмены прямо определён;
           - "not_defined" — если не определён.

        4. cancellation_point_details:
           С какого момента отмена платная.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. compensation_for_costs_status:
           - "defined" — если возмещение затрат поставщика прямо предусмотрено;
           - "not_defined" — если не предусмотрено.

        6. compensation_for_costs_details:
           Условия возмещения затрат.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни custom_order_protection_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Только текст договора.
        - Не делай предположений.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни подтверждения индивидуального заказа,
           ни момента платной отмены, ни возмещения затрат.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Товар поставляется по согласованным характеристикам."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.2 — отмена до начала производства, в п.6 — после начала производства.
           → presence = "unclear";
             cancellation_point_status = "not_defined";
             cancellation_point_details = "Не удалось определить".

        4. Полное раскрытие.
           "Товар изготавливается по индивидуальной спецификации Покупателя.
           При отказе после начала производства Покупатель возмещает
           фактически понесённые затраты в размере не менее 50%."
           → presence = "present";
             custom_order_confirmed_status = "defined";
             cancellation_point_status = "defined";
             compensation_for_costs_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для custom_order_protection_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "custom_order_protection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по защите поставщика при отказе от товара под заказ. Внутреннее агрегатное signal-поле."
