      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора условия
        о существенном нарушении, расторжении по требованию стороны
        и существенном изменении обстоятельств.
        Анализируй только эти темы.
        Не анализируй неустойки, форс-мажор, качество или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. material_breach_termination_check_presence:
           Агрегатное signal-поле — наличие регулирования по существенному
           нарушению и расторжению.
           - "present" — если хотя бы одно из содержательных полей
             (material_breach_definition_status,
              judicial_termination_grounds_status,
              unilateral_refusal_grounds_status,
              material_change_of_circumstances_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. material_breach_definition_status:
           - "defined" — если стороны прямо определили, что признаётся
             существенным нарушением;
           - "not_defined" — если не определено.

        2. material_breach_definition_details:
           Конкретные критерии существенного нарушения.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. judicial_termination_grounds_status:
           - "defined" — если указаны основания расторжения по требованию
             стороны в судебном порядке;
           - "not_defined" — если не указаны.

        4. judicial_termination_grounds_details:
           Основания для расторжения в судебном порядке.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. unilateral_refusal_grounds_status:
           - "defined" — если указаны основания одностороннего отказа
             от договора (для одной или обеих сторон);
           - "not_defined" — если не указаны.

        6. unilateral_refusal_grounds_details:
           Основания одностороннего отказа.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. material_change_of_circumstances_status:
           - "defined" — если прямо указано условие о существенном изменении
             обстоятельств;
           - "not_defined" — если не указано.

        8. material_change_of_circumstances_details:
           Условия существенного изменения обстоятельств.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни material_breach_termination_check_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы ГК.
        - Общая фраза "расторгнуть в порядке, предусмотренном законодательством" —
          это not_defined.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни определения существенного нарушения,
           ни оснований расторжения, ни условий о существенном изменении
           обстоятельств.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны вправе расторгнуть договор в порядке, предусмотренном
           законодательством."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.12.1 — существенное нарушение неоднократное, в п.14.2 — однократное.
           → presence = "unclear";
             material_breach_definition_status = "not_defined";
             material_breach_definition_details = "Не удалось определить".

        4. Полное раскрытие.
           "Существенным нарушением признаётся неоднократная просрочка поставки
           или просрочка оплаты более 60 дней. Покупатель вправе требовать
           расторжения в судебном порядке. Существенное изменение обстоятельств —
           основание расторжения по соглашению сторон."
           → presence = "present";
             material_breach_definition_status = "defined";
             judicial_termination_grounds_status = "defined";
             material_change_of_circumstances_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для material_breach_termination_check_presence используй только:
          "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
