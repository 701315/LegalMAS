        За просрочку оплаты Покупатель уплачивает проценты по ключевой ставке ЦБ РФ.
        При неоднократной просрочке поставки Покупатель вправе расторгнуть договор
        в одностороннем порядке."

        Ответ:
        {
          "delivery_penalty_status": "defined",
          "delivery_penalty_details": "0,1% от стоимости непоставленного товара за каждый день",
          "payment_penalty_status": "defined",
          "payment_penalty_details": "проценты по ключевой ставке ЦБ РФ",
          "penalty_cap_status": "defined",
          "penalty_cap_details": "не более 10% от суммы договора",
          "buyer_termination_grounds_status": "defined",
          "buyer_termination_grounds_details": "неоднократная просрочка поставки",
          "supplier_termination_grounds_status": "not_defined",
          "supplier_termination_grounds_details": "Данные не определены",
          "goods_return_on_termination_status": "not_defined",
          "money_return_on_termination_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку поставки Поставщик уплачивает пеню в размере 0,1% от стоимости непоставленного товара за каждый день просрочки, но не более 10% от суммы договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "delivery_penalty_status": "not_defined",
          "delivery_penalty_details": "Данные не определены",
          "payment_penalty_status": "not_defined",
          "payment_penalty_details": "Данные не определены",
          "penalty_cap_status": "not_defined",
          "penalty_cap_details": "Данные не определены",
          "buyer_termination_grounds_status": "not_defined",
          "buyer_termination_grounds_details": "Данные не определены",
          "supplier_termination_grounds_status": "not_defined",
          "supplier_termination_grounds_details": "Данные не определены",
          "goods_return_on_termination_status": "not_defined",
          "money_return_on_termination_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указана ли конкретная ставка неустойки (%) за просрочку поставки?
        2. Указана ли конкретная ставка за просрочку оплаты или ссылка на ст. 395?
        3. Есть ли ограничение максимального размера неустойки?
        4. Перечислены ли конкретные основания расторжения для каждой стороны?
        5. Описан ли порядок возврата товара/денег при расторжении?
        6. "В соответствии с законодательством" — это NOT defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delivery_penalty_status": "<defined / not_defined>",
          "delivery_penalty_details": "<ставка и база или 'Данные не определены'>",
          "payment_penalty_status": "<defined / not_defined>",
          "payment_penalty_details": "<ставка или 'Данные не определены'>",
          "penalty_cap_status": "<defined / not_defined>",
          "penalty_cap_details": "<ограничение или 'Данные не определены'>",
