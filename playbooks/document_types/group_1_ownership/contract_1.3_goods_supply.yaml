          description: "Статус наличия указания на передаточный документ при приёмке."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "acceptance_document_details"
          type: "string"
          presentation: "fact"
          label: "Документ приёмки"
          description: "Название документа, оформляемого при приёмке (акт, накладная, УПД)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "claim_notification_period_status"
          type: "string"
          presentation: "signal"
          description: "Статус определённости срока уведомления поставщика о недостатках."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "claim_notification_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления о недостатках"
          description: "Конкретный срок уведомления поставщика об обнаруженных недостатках."
          required: false
          display_in_grid: false
        - name: "responsible_storage_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия условия об ответственном хранении при отказе от приёмки."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "storage_cost_allocation"
          type: "string"
          presentation: "signal"
          description: "Сторона, несущая расходы на ответственное хранение при отказе от приёмки."
          required: false
          allowed_values: ["supplier", "buyer", "at_fault_party", "not_defined"]
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Качество, гарантия и процедура рекламации
  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_claims_and_rejection_check
    name: "Качество, гарантия, рекламация и замещающая покупка"
    description: >
      Фактографическая проверка наличия гарантийного срока, условий качества,
      процедуры рекламации, права на замену/отказ и замещающую покупку.
    triggers:
      any: ["b2b_supply"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантия"
        - "гарантийный срок"
        - "качество товара"
        - "свободен от недостатков"
        - "рекламация"
        - "претензия по качеству"
        - "акт о недостатках"
        - "замена товара"
        - "отказ от товара"
        - "некачественный товар"
        - "скрытые недостатки"
        - "Инструкция П-7"
        - "уведомление о недостатках"
        - "срок обнаружения"
        - "приобрести у третьих лиц"
        - "покупка у другого поставщика"
        - "за счёт поставщика"
        - "замещающая сделка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз.*по.*качеств"
        - "(?i)акт.*о.*недостатк"
        - "(?i)замен(а|у|ы)\\s+товар"
        - "(?i)отказ.*от.*товар.*ненадлежащ"
        - "(?i)гарантийн.*срок"
        - "(?i)приобрест.*у\\s+третьих\\s+лиц"
        - "(?i)за\\s+счёт\\s+поставщик"
        - "(?i)замещающ(ая|ей)\\s+сделк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: гарантийный срок, условия качества,
        процедура рекламации, право замены/отказа и замещающей покупки.

        Нормативный ориентир:
        - ст. 469, 470, 477, 518, 519, 520 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантийный срок (числовое значение и момент начала).
        2. Требования к качеству товара (ГОСТ/ТУ/иной стандарт).
        3. Срок уведомления о явных недостатках.
        4. Срок для предъявления требований по скрытым недостаткам.
        5. Форма акта о недостатках.
        6. Право покупателя на замену товара (ст. 518 ГК РФ).
        7. Право покупателя на односторонний отказ.
        8. Право замещающей покупки у третьих лиц за счёт поставщика (ст. 520 ГК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. При отсутствии текстового значения — строго "Данные не определены".
        4. Не используй "None", "null", "not_specified", пустые строки.
        5. В evidence — только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Гарантийный срок составляет 24 месяца с даты поставки. Товар должен
        соответствовать ГОСТ 8731-74. При обнаружении явных недостатков Покупатель
        уведомляет Поставщика в течение 5 рабочих дней. Покупатель вправе
        потребовать замены товара или вернуть его с возвратом уплаченной суммы."

        Ответ:
        {
          "warranty_status": "defined",
          "warranty_details": "24 месяца с даты поставки",
          "quality_standard_status": "defined",
          "quality_standard_details": "ГОСТ 8731-74",
          "apparent_defects_claim_period_status": "defined",
          "apparent_defects_claim_period_details": "5 рабочих дней",
          "hidden_defects_claim_period_status": "not_defined",
          "hidden_defects_claim_period_details": "Данные не определены",
          "defect_act_status": "not_defined",
          "replacement_right_status": "defined",
          "replacement_right_details": "покупатель вправе потребовать замены или вернуть товар",
          "rejection_right_status": "defined",
          "cover_purchase_right_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Гарантийный срок составляет 24 месяца с даты поставки. Товар должен соответствовать ГОСТ 8731-74."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Качество товара определяется по соглашению сторон."

        Ответ:
        {
          "warranty_status": "not_defined",
          "warranty_details": "Данные не определены",
          "quality_standard_status": "not_defined",
          "quality_standard_details": "Данные не определены",
          "apparent_defects_claim_period_status": "not_defined",
          "apparent_defects_claim_period_details": "Данные не определены",
          "hidden_defects_claim_period_status": "not_defined",
          "hidden_defects_claim_period_details": "Данные не определены",
          "defect_act_status": "not_defined",
          "replacement_right_status": "not_defined",
          "replacement_right_details": "Данные не определены",
          "rejection_right_status": "not_defined",
          "cover_purchase_right_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный срок гарантии числом месяцев/лет и момент начала?
        2. Указан ли ГОСТ, ТУ или иной стандарт качества?
        3. Есть ли конкретный срок уведомления о явных недостатках?
        4. Есть ли условие о скрытых недостатках?
        5. Указана ли форма акта о недостатках?
        6. Указано ли прямо право замены товара?
        7. Указано ли право замещающей покупки?
        8. "В соответствии с законодательством" — это NOT defined.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "warranty_status": "<defined / not_defined>",
          "warranty_details": "<срок или 'Данные не определены'>",
          "quality_standard_status": "<defined / not_defined>",
          "quality_standard_details": "<стандарт или 'Данные не определены'>",
          "apparent_defects_claim_period_status": "<defined / not_defined>",
          "apparent_defects_claim_period_details": "<срок или 'Данные не определены'>",
          "hidden_defects_claim_period_status": "<defined / not_defined>",
          "hidden_defects_claim_period_details": "<срок или 'Данные не определены'>",
          "defect_act_status": "<defined / not_defined>",
          "replacement_right_status": "<defined / not_defined>",
          "replacement_right_details": "<текст или 'Данные не определены'>",
          "rejection_right_status": "<defined / not_defined>",
          "cover_purchase_right_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантия гарантийный срок качество товара свободен от недостатков рекламация претензия по качеству акт о недостатках замена товара отказ от товара некачественный товар скрытые недостатки Инструкция П-7 уведомление о недостатках срок обнаружения приобрести у третьих лиц покупка у другого поставщика за счёт поставщика замещающая сделка ГОСТ ТУ стандарт качества"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
        - procedures
      negative_keywords:
        - "приемка товара"
        - "проверка количества при приемке"
        - "акт приемки при поставке"
        - "ответственное хранение"
        - "отказ от приёмки при поставке"
        - "неустойка"
        - "расторжение"
        - "форс-мажор"
        - "срок поставки"
        - "оплата"
        - "ИНН"
        - "ОГРН"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false


      llm_max_tokens: 1400


      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора сведения о гарантии, качестве и правах при недостатках товара.
        Анализируй только эти темы. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        1. warranty_status — "defined" если гарантийный срок прямо указан.
        2. warranty_details — срок и момент начала гарантии.
        3. quality_standard_status — "defined" если стандарт качества (ГОСТ/ТУ) указан.
        4. quality_standard_details — наименование стандарта.
        5. apparent_defects_claim_period_status — "defined" если срок по явным недостаткам указан.
        6. apparent_defects_claim_period_details — конкретный срок.
        7. hidden_defects_claim_period_status — "defined" если срок по скрытым недостаткам указан.
        8. hidden_defects_claim_period_details — конкретный срок.
        9. defect_act_status — "defined" если прямо указана форма или требование составления
           акта о недостатках при обнаружении брака, иначе "not_defined".
        10. replacement_right_status — "defined" если право покупателя требовать замены
            товара прямо предусмотрено, иначе "not_defined".
        11. replacement_right_details — формулировка о праве замены.
        12. rejection_right_status — "defined" если право отказа от товара прямо предусмотрено.
        13. cover_purchase_right_status — "defined" если право замещающей покупки у третьих лиц прямо предусмотрено.

        Если данных нет:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй нормы ГК вместо отсутствующих условий.
        - "В соответствии с законодательством" без конкретики — это "not_defined".
        - Не смешивай приёмку товара (Check 5) с гарантийными претензиями (этот check).
        - Срок гарантии должен быть числовым (месяцы, годы) с прямым указанием начала.
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "warranty_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия гарантийного срока в договоре."
          required: true
          allowed_values: ["defined", "not_defined"]
        - name: "warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          description: "Гарантийный срок (число месяцев/лет) и момент начала его исчисления."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "quality_standard_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия требований к качеству товара (ГОСТ/ТУ)."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "quality_standard_details"
          type: "string"
          presentation: "fact"
          label: "Стандарт качества"
          description: "Наименование применимого стандарта качества (ГОСТ, ТУ, иное)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "apparent_defects_claim_period_status"
          type: "string"
          presentation: "signal"
          description: "Статус определённости срока предъявления требований по явным недостаткам."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "apparent_defects_claim_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок по явным недостаткам"
          description: "Конкретный срок уведомления/предъявления требований по явным недостаткам."
          required: false
          display_in_grid: false
        - name: "hidden_defects_claim_period_status"
          type: "string"
          presentation: "signal"
          description: "Статус определённости срока предъявления требований по скрытым недостаткам."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "hidden_defects_claim_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок по скрытым недостаткам"
          description: "Конкретный срок предъявления требований по скрытым недостаткам товара."
          required: false
          display_in_grid: false
        - name: "defect_act_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия требования о форме акта о недостатках."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "replacement_right_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия права покупателя требовать замены товара."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "replacement_right_details"
          type: "string"
          presentation: "fact"
          label: "Право замены товара"
          description: "Формулировка договора о праве покупателя на замену некачественного товара."
          required: false
          display_in_grid: false
        - name: "rejection_right_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия права одностороннего отказа от некачественного товара."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "cover_purchase_right_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия права замещающей покупки у третьих лиц за счёт поставщика."
          required: false
          allowed_values: ["defined", "not_defined"]
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Условия Инкотермс (международные контракты)
  # ──────────────────────────────────────────────────────────────────────────
  - id: incoterms_extraction
    name: "Условия поставки по Инкотермс (международные контракты)"
    description: >
      Фактографическая проверка наличия термина Инкотермс, версии, именованного
      места и ясности распределения расходов.
    triggers:
      any: ["international_trade"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Incoterms"
        - "Инкотермс"
        - "FCA"
        - "FOB"
        - "CIF"
        - "EXW"
        - "DAP"
        - "DDP"
        - "базис поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\\b"
        - "(?i)условиях\\s+Incoterms"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется международный договор поставки.
        Проверяется наличие условий поставки по правилам Инкотермс.

        Нормативный ориентир:
        - Инкотермс 2020 (ICC Publication No. 723E), ст. 459 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Термин Инкотермс (EXW, FCA, FOB, CIF и т.д.).
        2. Версию Инкотермс (2010 или 2020).
        3. Именованное место поставки.
        4. Распределение расходов (явно определено или нет).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если термина нет — "not_defined".
        3. Не используй "None", "null", "not_specified", пустые строки.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставка осуществляется на условиях FCA Москва (Инкотермс 2020)."

        Ответ:
        {
          "incoterms_status": "defined",
          "incoterms_rule": "FCA",
          "incoterms_version": "2020",
          "named_place_status": "defined",
          "named_place_value": "Москва",
          "cost_allocation_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Поставка осуществляется на условиях FCA Москва (Инкотермс 2020)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Поставщик осуществляет доставку товара на склад Покупателя."

        Ответ:
        {
          "incoterms_status": "not_defined",
          "incoterms_rule": "not_defined",
          "incoterms_version": "not_defined",
          "named_place_status": "not_defined",
          "named_place_value": "Данные не определены",
          "cost_allocation_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание термина Инкотермс (аббревиатура)?
        2. Указана ли версия (2020/2010)?
        3. Указано ли конкретное место?
        4. Если термина нет — не выводи его из описания доставки.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "incoterms_status": "<defined / not_defined>",
          "incoterms_rule": "<EXW / FCA / FAS / FOB / CFR / CIF / CPT / CIP / DAP / DPU / DDP / not_defined>",
          "incoterms_version": "<2020 / 2010 / not_defined>",
          "named_place_status": "<defined / not_defined>",
