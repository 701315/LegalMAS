        Не анализируй приёмку, качество, форс-мажор или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. delivery_penalty_status — "defined" если специальная неустойка/пеня/штраф
           за просрочку поставки прямо указаны, иначе "not_defined".
        2. delivery_penalty_details — ставка, база расчёта и период начисления
           неустойки за просрочку поставки.
        3. payment_penalty_status — "defined" если специальная неустойка/пеня/штраф
           за просрочку оплаты прямо указаны, иначе "not_defined".
        4. payment_penalty_details — ставка, база расчёта и период начисления
           неустойки за просрочку оплаты либо ссылка на проценты по ст. 395 ГК РФ,
           если это прямо указано в договоре.
        5. penalty_cap_status — "defined" если ограничение максимального размера
           неустойки прямо указано, иначе "not_defined".
        6. penalty_cap_details — максимальный размер неустойки.
        7. buyer_termination_grounds_status — "defined" если прямо указаны основания
           одностороннего отказа / расторжения для Покупателя, иначе "not_defined".
        8. buyer_termination_grounds_details — конкретные основания.
        9. supplier_termination_grounds_status — "defined" если прямо указаны основания
           одностороннего отказа / расторжения для Поставщика, иначе "not_defined".
        10. supplier_termination_grounds_details — конкретные основания.
        11. goods_return_on_termination_status — "defined" если в тексте прямо предусмотрен
           возврат товара при расторжении, иначе "not_defined".
        12. money_return_on_termination_status — "defined" если в тексте прямо предусмотрен
           возврат денежных средств при расторжении, иначе "not_defined".

        Важно:
        - Неустойка Поставщика и Покупателя — разные поля. Не смешивай.
