      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора поставки
        сведения о предмете поставки, количестве товара, цене и НДС.
        Не анализируй стороны, сроки поставки, оплату, ответственность или иные темы.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. subject_quantity_price_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по предмету,
           количеству и цене.
           - "present" — если хотя бы одно из содержательных полей
             (subject_status, quantity_status, price_status,
              vat_status, price_change_mechanism_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - subject_details, quantity_details, price_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subject_status:
           - "defined" — если наименование товара прямо указано;
           - "not_defined" — если не указано или указано абстрактно.

        2. subject_details:
           Наименование товара, ГОСТ/ТУ или иное описание предмета поставки.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. quantity_status:
           - "defined" — если количество или порядок его определения прямо указаны;
           - "not_defined" — если не указано.

        4. quantity_details:
           Количество товара с единицей измерения или механизм определения.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. price_status:
           - "defined" — если цена или механизм её определения прямо указаны;
           - "not_defined" — если не указано.

        6. price_details:
           Цена товара (сумма, единица, валюта) или формула.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. vat_status:
           - "defined" — если прямо указано, включает ли цена НДС или нет;
           - "not_defined" — если не указано.

        8. price_change_mechanism_status:
           - "defined" — если предусмотрен механизм изменения или индексации цены;
           - "not_defined" — если не предусмотрен или не указан.
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_quantity_price_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_details = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона.
        - Общая фраза "цена согласовывается дополнительно" не является определённой ценой.
        - Не делай предположений.
        - Пиши кратко.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни предмета, ни количества, ни цены, ни НДС.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без конкретики.
           "Стороны договорились о поставке товара на условиях, которые будут
           согласованы дополнительно."
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В п.1 — 500 тонн, в приложении — 400 тонн.
           → presence = "unclear";
             quantity_status = "not_defined";
             quantity_details = "Не удалось определить".

        4. Всё раскрыто.
           "Предмет: трубы ГОСТ 8731-74 в количестве 500 тонн.
           Цена: 85 000 руб./т, включая НДС 20%."
           → presence = "present";
             subject_status = quantity_status = price_status = "defined";
             vat_status = "defined";
             price_change_mechanism_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_quantity_price_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * subject_details, quantity_details, price_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
