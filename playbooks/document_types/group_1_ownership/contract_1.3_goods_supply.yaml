# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_authority_cluster
    name: "Стороны договора и полномочия подписантов"
    description: >
      Фактографическая проверка наличия реквизитов поставщика и покупателя,
      а также полномочий подписантов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "поставщик"
        - "покупатель"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(поставщик|покупатель).*в\\s+лице"
        - "(?i)ИНН\\s*\\d{10,12}"
        - "(?i)ОГРН\\s*\\d{13,15}"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поставки товаров между предпринимателями по § 3 Главы 30 ГК РФ.
        Проверяется только один вопрос: идентификация сторон, их реквизиты
        и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432, 506 ГК РФ

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Поставщик (наименование и реквизиты).
        2. Кто указан как Покупатель (наименование и реквизиты).
        3. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "not_defined" или строго
           "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поставщик: ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице
        Генерального директора Иванова И.И., действующего на основании Устава.
        Покупатель: АО «Бета», ИНН 7700000001, ОГРН 1027700000001, в лице
        Коммерческого директора Петрова А.А., действующего на основании
        Доверенности № 5 от 01.01.2026.

        Ответ:
        {
          "supplier_details_status": "defined",
          "supplier_details_value": "ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000",
          "supplier_signatory": "Генеральный директор Иванов И.И.",
          "supplier_signatory_basis": "charter",
          "buyer_details_status": "defined",
          "buyer_details_value": "АО «Бета», ИНН 7700000001, ОГРН 1027700000001",
          "buyer_signatory": "Коммерческий директор Петров А.А.",
          "buyer_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Поставщик: ООО «Альфа», ИНН 7700000000, ОГРН 1027700000000, в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о поставке товара на условиях, которые будут
        согласованы дополнительно."

        Ответ:
        {
          "supplier_details_status": "not_defined",
          "supplier_details_value": "Данные не определены",
          "supplier_signatory": "Данные не определены",
          "supplier_signatory_basis": "not_defined",
          "buyer_details_status": "not_defined",
          "buyer_details_value": "Данные не определены",
          "buyer_signatory": "Данные не определены",
          "buyer_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата с наименованием и ИНН/ОГРН поставщика?
        2. Есть ли прямая цитата с наименованием и ИНН/ОГРН покупателя?
        3. Указан ли конкретный подписант и документ, на основании которого он действует?
        4. Убедись, что evidence содержит только текст договора.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "supplier_details_status": "<defined / not_defined>",
          "supplier_details_value": "<реквизиты или 'Данные не определены'>",
          "supplier_signatory": "<ФИО и должность или 'Данные не определены'>",
          "supplier_signatory_basis": "<charter / poa / order / other / not_defined>",
          "buyer_details_status": "<defined / not_defined>",
