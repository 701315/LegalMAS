  - id: delivery_schedule_extraction
    name: "Срок, график поставок, недопоставка и восполнение"
    description: >
      Фактографическая проверка наличия срока поставки (существенное условие),
      графика и периодичности, процедуры заявок, обязанности восполнить недопоставку.
    triggers: {}
    ui_mode: "field_extraction"
