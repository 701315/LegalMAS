        - name: "packaging_requirements_details"
          type: "string"
          presentation: "fact"
          label: "Требования к упаковке"
          description: "Конкретные требования к упаковке, маркировке и этикетированию товара."
          required: false
          display_in_grid: false
        - name: "certification_status"
          type: "string"
          presentation: "signal"
          description: "Статус требования сертификата/декларации соответствия ТР ТС."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "certification_details"
          type: "string"
          presentation: "fact"
          label: "Сертификация"
          description: "Тип и реквизиты требуемой сертификации (ТР ТС, ЕАС и т.п.)."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "returnable_packaging_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия условия о возврате многооборотной тары."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "returnable_packaging_details"
          type: "string"
          presentation: "fact"
          label: "Возврат тары"
          description: "Срок и условия возврата многооборотной тары поставщику."
          required: false
          display_in_grid: false
        - name: "pickup_condition_status"
          type: "string"
          presentation: "signal"
          description: "Статус наличия условий самовывоза товара со склада поставщика."
          required: false
          allowed_values: ["defined", "not_defined"]
        - name: "pickup_condition_details"
          type: "string"
          presentation: "fact"
          label: "Условия самовывоза"
          description: "Условия самовывоза товара и последствия невыборки в срок."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Неустойки, ответственность и расторжение
  # ──────────────────────────────────────────────────────────────────────────
  - id: liability_termination_cluster
    name: "Неустойки, ответственность и расторжение договора"
    description: >
      Фактографическая проверка наличия неустоек за просрочку поставки и оплаты,
      оснований расторжения, возврата товара и денег при расторжении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неустойка за просрочку поставки"
        - "пеня за несвоевременную поставку"
        - "штраф за нарушение сроков"
        - "за каждый день просрочки"
        - "неустойка за просрочку оплаты"
        - "пеня за несвоевременную оплату"
        - "штраф за просрочку платежа"
        - "проценты за просрочку"
        - "проценты по ст. 395"
        - "ключевая ставка ЦБ"
        - "расторжение"
        - "отказ от договора"
        - "возврат товара"
        - "возврат денежных средств"
        - "существенное нарушение"
        - "односторонний отказ"
        - "существенная недопоставка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.*просрочк.*поставк"
        - "(?i)пен.*за.*просрочк"
        - "(?i)\\d+[.,]?\\d*\\s*%.*за.*день"
        - "(?i)неустойк.*просрочк.*оплат"
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"
        - "(?i)существенн(ое|ого)\\s+нарушен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
