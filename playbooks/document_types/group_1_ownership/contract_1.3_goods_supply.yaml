        3. Процедура уведомления и требование свидетельства ТПП.
        4. Максимальный срок форс-мажора до права расторжения.
        5. Упомянуты ли санкции как форс-мажорное обстоятельство.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Стороны освобождаются от ответственности при наступлении форс-мажорных
        обстоятельств: пожар, наводнение, землетрясение, военные действия,
        введение санкций, запрет на экспорт/импорт. Сторона, ссылающаяся на
        форс-мажор, уведомляет другую сторону в течение 5 дней с приложением
        свидетельства ТПП. Если форс-мажор продолжается более 90 дней,
        каждая сторона вправе расторгнуть договор."

        Ответ:
        {
          "force_majeure_status": "defined",
          "specific_events_status": "defined",
          "specific_events_details": "пожар, наводнение, землетрясение, военные действия, санкции, запрет на экспорт/импорт",
          "notification_procedure_status": "defined",
          "notification_procedure_details": "в течение 5 дней с приложением свидетельства ТПП",
          "tpp_certificate_status": "defined",
          "max_duration_status": "defined",
          "max_duration_details": "90 дней",
          "sanctions_mentioned_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Стороны освобождаются от ответственности при наступлении форс-мажорных обстоятельств: пожар, наводнение, землетрясение, военные действия, введение санкций, запрет на экспорт/импорт."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны не несут ответственности за форс-мажор."

        Ответ:
        {
          "force_majeure_status": "defined",
          "specific_events_status": "not_defined",
          "specific_events_details": "Данные не определены",
          "notification_procedure_status": "not_defined",
          "notification_procedure_details": "Данные не определены",
          "tpp_certificate_status": "not_defined",
          "max_duration_status": "not_defined",
          "max_duration_details": "Данные не определены",
          "sanctions_mentioned_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны не несут ответственности за форс-мажор."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое слово "форс-мажор" или "непреодолимая сила"?
        2. Если есть — перечислены ли конкретные события?
        3. Указан ли срок уведомления конкретным числом?
        4. Упомянут ли ТПП или иной орган для подтверждения?
        5. Указан ли предельный срок форс-мажора до расторжения?
        6. Упомянуты ли санкции прямо?

        Не выводи шаги проверки. Верни только JSON.

