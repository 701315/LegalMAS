        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определение существенного нарушения (что стороны признают таковым).
        2. Основания расторжения по требованию одной стороны в судебном порядке.
        3. Основания одностороннего отказа от договора (для каждой стороны).
        4. Условие о существенном изменении обстоятельств (ст. 451 ГК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — "not_defined".
        4. При отсутствии текстового значения — строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence — только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Существенным нарушением признаётся: неоднократная (два и более раза)
        просрочка поставки, недопоставка более 30% от партии, просрочка оплаты
        более 60 дней. Покупатель вправе требовать расторжения в судебном порядке.
        Существенное изменение обстоятельств — основание для расторжения
        по соглашению сторон."

        Ответ:
