      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора поставки
        сведения о сторонах договора и полномочиях их подписантов.
        Анализируй только стороны, реквизиты и полномочия.
        Не анализируй предмет, количество, цену или поставку.
        Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. parties_and_authority_cluster_presence:
           Агрегатное signal-поле — наличие регулирования по теме сторон
           и полномочий подписантов.
           - "present" — если хотя бы одно из содержательных полей
             (supplier_details_status, supplier_signatory_basis,
              buyer_details_status, buyer_signatory_basis) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - supplier_details_status = "not_defined";
           - supplier_signatory_basis = "not_defined";
           - buyer_details_status = "not_defined";
           - buyer_signatory_basis = "not_defined";
           - supplier_details_value, buyer_details_value = "Данные не определены";
           - supplier_signatory, buyer_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. supplier_details_status:
           - "defined" — если прямо указаны наименование и реквизиты
             Поставщика (ИНН и/или ОГРН);
           - "not_defined" — если данные не указаны или недостаточны.

        2. supplier_details_value:
           Полное наименование и реквизиты Поставщика.
           Правила:
           - пиши кратко, как в документе;
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        3. supplier_signatory:
           ФИО и должность подписанта со стороны Поставщика.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        4. supplier_signatory_basis:
           - "charter" — если прямо указано "на основании устава";
           - "poa" — если прямо указано "по доверенности" или "на основании доверенности";
           - "order" — если прямо указано "на основании приказа";
           - "other" — если указано иное прямое основание;
           - "not_defined" — если основание не указано.

        5. buyer_details_status:
           - "defined" — если прямо указаны наименование и реквизиты
             Покупателя (ИНН и/или ОГРН);
           - "not_defined" — если данные не указаны или недостаточны.

        6. buyer_details_value:
           Полное наименование и реквизиты Покупателя.
           Правила:
           - пиши кратко, как в документе;
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. buyer_signatory:
           ФИО и должность подписанта со стороны Покупателя.
           Правила:
           - если не установлено — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        8. buyer_signatory_basis:
           - "charter" / "poa" / "order" / "other" / "not_defined"
             по тем же правилам, что для Поставщика.
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_and_authority_cluster_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear"
          при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined",
          все *_value / *_signatory = "Данные не определены".
        - Используй только текст договора.
        - Не делай предположений.
        - Не смешивай сведения о Поставщике и Покупателе.
        - Пиши кратко и официально.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сторон, ни реквизитов, ни подписантов.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Только общая фраза без конкретики.
           "Стороны договорились о поставке товара."
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле — одно наименование Поставщика, в реквизитах — другое.
           → presence = "unclear";
             supplier_details_status = "not_defined";
             supplier_details_value = "Не удалось определить".

        4. Стороны указаны, но без полномочий.
           "Поставщик: ООО «Альфа», ИНН..., ОГРН...; Покупатель: АО «Бета», ИНН..., ОГРН..."
           → presence = "present";
             supplier_details_status = "defined";
             buyer_details_status = "defined";
             supplier_signatory_basis = buyer_signatory_basis = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_and_authority_cluster_presence используй только:
          "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для *_signatory_basis используй только:
          "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value / *_signatory → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_signatory → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_and_authority_cluster_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
