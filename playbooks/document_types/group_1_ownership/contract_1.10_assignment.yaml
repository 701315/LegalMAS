# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\d{1,3}(?:[.,]\\d{1,2})?\\s*%"
  contract_number: "(?i)(?:договор|соглашение|расписка).*?№?\\s*\\d+[\\w\\-/]*\\s*от\\s*\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
  debt_amount: "(?i)(?:сумма|размер).*?долга.*?\\d[\\d\\s]*(?:руб|₽)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_authority
    name: "Стороны договора цессии: идентификация Цедента, Цессионария и Должника, полномочия подписантов"
    description: >
      Фактографическая проверка наличия в договоре данных о Цеденте,
      Цессионарии, их реквизитах, подписантах, документах-основаниях полномочий,
      а также идентификации Должника как третьего лица по обязательству.
      Результат предназначен для табличного вывода по нескольким договорам
      без оценки серьёзности риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цедент"
        - "цессионарий"
        - "новый кредитор"
        - "первоначальный кредитор"
        - "должник"
        - "ИНН"
        - "ОГРН"
        - "именуемый"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*именуем"
        - "(?i)цессионарий.*именуем"
        - "(?i)должник.*[А-Я][а-я]+"
        - "{{ inn_ogrn }}"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: идентификация сторон (Цедент, Цессионарий, Должник)
        и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 382 ГК РФ — Цедент и Цессионарий
        - ст. 182–185 ГК РФ — полномочия представителя

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Цедент (наименование/ФИО, ИНН, ОГРН, адрес).
        2. Кто указан как Цессионарий (наименование/ФИО, ИНН, ОГРН, адрес).
        3. Кто указан как Должник (наименование/ФИО, ИНН).
        4. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined" строго по схеме.
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные есть:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Цедент»,
        в лице Генерального директора Иванова И.И., действующего на основании Устава,
        и ООО «Бета» (ИНН 7700000002), именуемое «Цессионарий», в лице директора
        Петрова П.П., действующего на основании доверенности № 12 от 01.01.2024.
        Должник: ИП Сидоров С.С., ИНН 770000003."

        Ответ:
        {
          "cedent_details_status": "defined",
          "cedent_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "cedent_signatory_value": "Генеральный директор Иванов И.И.",
          "cedent_signatory_status": "defined",
          "cedent_signatory_basis": "charter",
          "assignee_details_status": "defined",
          "assignee_details_value": "ООО «Бета», ИНН 7700000002",
          "assignee_signatory_value": "Директор Петров П.П.",
          "assignee_signatory_status": "defined",
          "assignee_signatory_basis": "poa",
          "debtor_details_status": "defined",
          "debtor_details_value": "ИП Сидоров С.С., ИНН 770000003",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Цедент», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Стороны договорились об уступке права требования."

        Ответ:
        {
          "cedent_details_status": "not_defined",
          "cedent_details_value": "Данные не определены",
          "cedent_signatory_value": "Данные не определены",
          "cedent_signatory_status": "not_defined",
          "cedent_signatory_basis": "not_defined",
          "assignee_details_status": "not_defined",
          "assignee_details_value": "Данные не определены",
          "assignee_signatory_value": "Данные не определены",
          "assignee_signatory_status": "not_defined",
          "assignee_signatory_basis": "not_defined",
          "debtor_details_status": "not_defined",
          "debtor_details_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в документе прямая цитата с наименованием/ФИО Цедента.
        2. Есть ли в документе прямая цитата с наименованием/ФИО Цессионария.
        3. Есть ли в документе прямая цитата с идентификацией Должника.
        4. Есть ли прямое указание на подписанта и основание полномочий от каждой стороны.
        5. Если прямой цитаты нет — не додумывай, а верни "Данные не определены" / "not_defined".
        6. Убедись, что evidence содержит только текст договора.
        7. Убедись, что все значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cedent_details_status": "<defined / not_defined>",
          "cedent_details_value": "<текст или 'Данные не определены'>",
          "cedent_signatory_value": "<текст или 'Данные не определены'>",
          "cedent_signatory_status": "<defined / not_defined>",
          "cedent_signatory_basis": "<charter / poa / order / other / not_defined>",
          "assignee_details_status": "<defined / not_defined>",
          "assignee_details_value": "<текст или 'Данные не определены'>",
          "assignee_signatory_value": "<текст или 'Данные не определены'>",
          "assignee_signatory_status": "<defined / not_defined>",
          "assignee_signatory_basis": "<charter / poa / order / other / not_defined>",
          "debtor_details_status": "<defined / not_defined>",
          "debtor_details_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "цедент цессионарий новый кредитор первоначальный кредитор должник ИНН ОГРН именуемый в лице действующего на основании устава доверенности реквизиты подписант"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "право требования к"
        - "основание возникновения"
        - "сумма долга"
        - "уведомление должника"
        - "гарантирует действительность"
        - "не уступалось"
        - "делькредере"
        - "обеспечительные права"
        - "залог"
        - "поручительство"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "parties_and_authority_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        о Цеденте, Цессионарии и Должнике, а также о подписантах Цедента
        и Цессионария и основаниях их полномочий.
        Не анализируй предмет уступки, уведомление должника, цену уступки,
        обеспечительные права или расторжение.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_and_authority_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cedent_details_status, assignee_details_status,
              debtor_details_status, cedent_signatory_basis,
              assignee_signatory_basis) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cedent_details_status = "not_defined";
           - assignee_details_status = "not_defined";
           - debtor_details_status = "not_defined";
           - cedent_signatory_status = "not_defined";
           - assignee_signatory_status = "not_defined";
           - cedent_signatory_basis = "not_defined";
           - assignee_signatory_basis = "not_defined";
           - cedent_details_value, assignee_details_value, debtor_details_value = "Данные не определены";
           - cedent_signatory_value, assignee_signatory_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. cedent_details_status:
           - "defined" — если Цедент прямо идентифицируется хотя бы по наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если Цедент прямо не идентифицируется или нельзя надёжно определить.

        2. cedent_details_value:
           Краткая идентификация Цедента: наименование + ИНН + ОГРН; для ИП — ИП + ФИО + ИНН + ОГРНИП;
           для физлица — ФИО + паспортные данные, если прямо указаны.
           Fallback при отсутствии — "Данные не определены".
           Fallback при противоречии — "Не удалось определить".

        3. cedent_signatory_value:
           ФИО и должность лица, подписывающего договор от Цедента.
           Если Цедент — физлицо/ИП и подписывает лично, укажи его ФИО.
           Fallback при отсутствии — "Данные не определены".

        4. cedent_signatory_status:
           - "defined" — если подписант Цедента прямо указан;
           - "not_defined" — если подписант прямо не указан.

        5. cedent_signatory_basis:
           Только одно из значений:
           - "charter" — "на основании Устава";
           - "poa" — "на основании доверенности";
           - "order" — "на основании приказа";
           - "other" — иное основание прямо названо в тексте (включая случай личного подписания);
           - "not_defined" — основание прямо не указано.

        6. assignee_details_status:
           - "defined" — если Цессионарий прямо идентифицируется;
           - "not_defined" — если нет.

        7. assignee_details_value:
           Краткая идентификация Цессионария по тем же правилам, что для Цедента.
           Fallback: "Данные не определены" / "Не удалось определить".

        8. assignee_signatory_value:
           ФИО и должность подписанта от Цессионария.
           Fallback: "Данные не определены".

        9. assignee_signatory_status:
           - "defined" — если подписант Цессионария прямо указан;
           - "not_defined" — иначе.

        10. assignee_signatory_basis:
            Правила те же, что для cedent_signatory_basis.

        11. debtor_details_status:
            - "defined" — если Должник по уступаемому требованию прямо идентифицирован
              (наименование/ФИО, по возможности ИНН);
            - "not_defined" — если нет.

        12. debtor_details_value:
            Краткая идентификация Должника: наименование + ИНН; для ИП — ИП + ФИО + ИНН;
            для физлица — ФИО, если прямо указано.
            Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_and_authority_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не делай предположений по типовой структуре договора.
        - Не смешивай сведения о Цеденте, Цессионарии и Должнике.
        - Для Должника извлекай только то, что прямо написано в договоре цессии; не додумывай из основного договора.
        - Если прямо указано только наименование юрлица, только ФИО физлица или только статус ИП + ФИО, этого достаточно для статуса "defined".
        - Если основание полномочий прямо не указано — не выводи его из должности или из закона.
        - Если физлицо/ИП подписывает лично и это прямо следует из текста — basis = "other".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон цессии, ни реквизитов, ни подписантов, ни Должника.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Прямое исключение или явное отсутствие.
           В договоре прямо указано, что сведения о Должнике передаются отдельным актом
           либо раскрытие данных одной из сторон прямо отложено.
           → presence = "present";
             соответствующий *_status = "not_defined";
             *_value содержит дословную цитату об отложенном раскрытии.

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные ИНН/наименования для одной из сторон
           или два разных Должника.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Только роли без идентификации.
           В тексте упомянуты "Цедент", "Цессионарий", "Должник" без реквизитов и ФИО.
           → presence = "present";
             *_status = "not_defined";
             *_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_and_authority_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для enum-полей *_basis используй только: "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных:
          * cedent_details_value, assignee_details_value, debtor_details_value → "Данные не определены";
          * cedent_signatory_value, assignee_signatory_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_and_authority_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон цессии и полномочий подписантов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cedent_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации Цедента. Внутреннее enum-поле."
          required: true

        - name: "cedent_details_value"
