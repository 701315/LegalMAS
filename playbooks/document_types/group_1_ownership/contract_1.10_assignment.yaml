        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания согласия Должника, ограничений на уступку
           или основного договора в контексте согласия.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Согласие не требуется.
           «Основной договор не содержит запрета или ограничения на уступку
           права требования третьим лицам».
           → presence = "present";
             consent_requirement_status = "defined";
             consent_requirement_details = "основной договор не содержит ограничений на уступку";
             consent_obtained_status = "not_defined";
             consent_obtained_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «уступка допускается без согласия Должника»,
           в другом — «уступка только с письменного согласия Должника».
           → presence = "unclear";
             consent_requirement_status = "not_defined";
             consent_requirement_details = "Не удалось определить".

        4. Согласие требуется, но не получено.
           «Основной договор предусматривает необходимость согласия Должника
           на уступку» без подтверждения его получения.
           → presence = "present";
             consent_requirement_status = "defined";
             consent_obtained_status = "not_defined";
             consent_obtained_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debtor_consent_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debtor_consent_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования согласия Должника на уступку. Внутреннее агрегатное signal-поле."
          required: true

