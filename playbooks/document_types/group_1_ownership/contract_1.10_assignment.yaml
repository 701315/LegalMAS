        - "(?i)не\\s+разглаш"

  - id: "assignment_scope_volume"
    name: "Объём уступаемого права: полная или частичная уступка (ст. 384 ГК РФ)"
    description: "Проверяет явное указание на объём уступки — полная передача или часть требования"
    legal_base: "ст. 384 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "в полном объеме"
        - "полностью"
        - "частично"
        - "в части"
        - "часть требования"
        - "объем передаваемых прав"
        - "все права"
        - "включая проценты"
        - "включая неустойку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+полном\\s+объем"
        - "(?i)частичн(ая|о|ой)\\s+уступк"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "assignment_scope"
          type: "string"
          allowed_values: ["full", "partial", "unclear", "not_found"]
          keyword_hints: ["в полном объёме", "частично", "в части"]
          description: "Объём уступки"
      store_payload: true

  - id: "payment_terms_for_assignment"
    name: "Порядок и сроки оплаты цены уступки"
    description: "Проверяет наличие конкретных сроков, способа и последствий неоплаты цены уступки"
    legal_base: "ст. 424, 454 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок оплаты"
        - "в течение"
        - "не позднее"
        - "банковский перевод"
        - "безналичный расчет"
        - "реквизиты"
        - "после подписания"
        - "аванс"
        - "рассрочка"
        - "последствия неоплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(в\\s+течение|не\\s+позднее)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)оплат(а|ы|ить).*цен(у|ы)\\s+уступки"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "payment_deadline"
          type: "string"
          keyword_hints: ["в течение", "не позднее", "срок оплаты"]
          description: "Срок оплаты цены уступки"
        - name: "payment_method"
          type: "string"
          allowed_values: ["bank_transfer", "cash", "setoff", "other", "not_found"]
          keyword_hints: ["банковский перевод", "безналичный", "наличными", "путём зачёта"]
          description: "Способ оплаты"
      store_payload: true

  - id: "debtor_setoff_warning"
    name: "Риск зачёта и возражений должника (ст. 386, 412 ГК РФ)"
    description: "Проверяет наличие заверений цедента об отсутствии встречных требований должника"
    legal_base: "ст. 386, 412 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возражения должника"
        - "зачет"
        - "встречное требование"
        - "отсутствие встречных требований"
        - "должник не имеет возражений"
        - "контртребование"
        - "право должника на зачёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возражени(я|й).*должник"
        - "(?i)зачет.*встречн"
        - "(?i)отсутств(ие|уют).*встречн"

  - id: "termination_rights"
    name: "Расторжение договора цессии: основания и последствия"
    description: "Проверяет наличие оснований для расторжения и последствий (возврат права, возврат денег)"
    legal_base: "ст. 450, 450.1, 453 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат права требования"
        - "обратная уступка"
        - "возврат цены уступки"
        - "возврат денежных средств"
        - "неустойка за расторжение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении|ить)"
        - "(?i)возврат.*прав(а|о)\\s+требован"
        - "(?i)обратн(ая|ой)\\s+уступк"

  - id: "penalty_and_liability"
    name: "Неустойка и ответственность сторон за нарушение"
    description: "Проверяет наличие штрафных санкций за нарушение обязательств по договору цессии"
    legal_base: "ст. 330, 393 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пеня"
        - "ответственность"
        - "убытки"
        - "возмещение ущерба"
        - "компенсация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|у|и)\\s+в\\s+размере"
        - "(?i)штраф.*\\d+.*%"
        - "(?i)пен(я|и|ю).*\\d"

  - id: "governing_law"
    name: "Применимое право"
    description: "Проверяет указание применимого права"
    legal_base: "ст. 1210, 1211 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "законодательство Российской Федерации"
        - "регулируется правом"
        - "governing law"
        - "право Российской Федерации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав"
        - "(?i)регулируется.*прав(ом|о)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО, ИНН, ОГРН/ОГРНИП,
      адрес, документы уполномоченных лиц. Убедиться в полномочиях на заключение договора цессии.
    addressee: "Обе стороны"

  debtor_identification:
    text: >
      Просим предоставить по {doc_names}: полные реквизиты Должника (наименование/ФИО, ИНН, адрес),
      подтверждение существования Должника (выписка ЕГРН/ЕГРЮЛ), актуальность данных.
    addressee: "Цедент"

  claim_identification_check:
    text: >
      В {doc_names} требуется точная идентификация уступаемого права. Просим предоставить:
      (а) реквизиты договора-основания (№, дата, предмет); (б) акт сверки с Должником; 
      (в) подтверждение суммы и срока задолженности; (г) историю возникновения долга.
    addressee: "Цедент"

  assignment_price:
    text: >
      Просим подтвердить по {doc_names}: цену уступки, соотношение с номиналом долга (дисконт/премия),
      порядок и сроки оплаты, налоговые последствия (НДС, налог на прибыль).
    addressee: "Финансовый директор / Цедент"

  cedent_warranties_check:
    text: >
      В {doc_names} недостаточны гарантии Цедента. Просим согласовать: (а) гарантию действительности 
      и существования требования; (б) гарантию отсутствия предыдущих уступок; (в) гарантию отсутствия 
      обременений; (г) ответственность Цедента за пороки права (регресс).
    addressee: "Юридический советник цессионария"

  documents_transfer:
    text: >
      Просим предоставить по {doc_names}: (а) оригиналы договора-основания; (б) акты сверки с Должником; 
      (в) первичные документы (накладные, акты, счета); (г) исполнительные документы (если есть); 
      (д) переписку с Должником; (е) акт приема-передачи документов.
    addressee: "Цедент"

  accessory_rights_transfer_check:
    text: >
      Просим согласовать в {doc_names}: (а) переход прав из договоров залога/поручительства; 
      (б) переход права на неустойку и проценты; (в) передачу документов по обеспечению; 
      (г) порядок уведомления залогодержателей/поручителей.
    addressee: "Юридический советник"

  debtor_notification_check:
    text: >
      В {doc_names} не раскрыт порядок уведомления Должника. Просим согласовать: (а) срок уведомления 
      (рекомендуется до 10 дней); (б) способ уведомления (заказное письмо с уведомлением + курьер); 
      (в) ответственность за уведомление; (г) форму уведомления (приложение к договору).
    addressee: "Юридический советник"

  prohibition_of_assignment_verification:
    text: >
      Просим предоставить по {doc_names}: (а) основной договор с Должником для проверки запрета уступки; 
      (б) согласие Должника на уступку (если требуется); (в) правовое заключение о допустимости уступки.
    addressee: "Цедент / Юридический советник"

  protection_against_double_assignment:
    text: >
      Просим предоставить по {doc_names}: (а) заверение Цедента об отсутствии предыдущих уступок; 
      (б) выписку ЕГРН/ЕГРЮЛ Должника для проверки судебных споров; (в) информацию о банкротстве Должника; 
      (г) обязательство Цедента не уступать требование третьим лицам.
    addressee: "Цедент"

  limitation_of_liability_for_solvency:
    text: >
      Просим добавить в {doc_names}: (а) оговорку об отсутствии ответственности за платежеспособность Должника; 
      (б) разграничение ответственности (действительность vs исполнимость); (в) отказ от гарантий исполнимости; 
      (г) принятие цессионарием кредитного риска.
    addressee: "Юридический советник цедента"

  final_settlement_no_recourse:
    text: >
      Просим добавить в {doc_names}: (а) окончательность расчетов; (б) отказ цессионария от регресса к цеденту; 
      (в) неприменимость ст. 406 ГК РФ (освобождение должника); (г) сохранение ответственности цедента только за пороки права.
    addressee: "Юридический советник цедента"

  del_credere_check:
    text: >
      Просим согласовать в {doc_names} условие делькредере: (а) полная/частичная ответственность цедента 
      за исполнение должником; (б) размер ответственности (до суммы уступки или номинала долга); 
      (в) условия возникновения ответственности; (г) срок предъявления требований.
    addressee: "Юридический советник"

  future_claims_check:
    text: >
      Для {doc_names} (будущие требования) просим согласовать: (а) критерии определения будущих требований 
      (контрагенты, суммы, период); (б) механизм фиксации возникших требований; (в) порядок уведомления 
      будущих должников; (г) ограничения по срокам/суммам.
    addressee: "Юридический советник"

  enforcement_assignment_compliance:
    text: >
      Для {doc_names} (уступка в исполнительном производстве) просим предоставить: (а) исполнительный документ; 
      (б) постановление о возбуждении ИП; (в) сведения о статусе взыскания; (д) согласование с приставом-исполнителем.
    addressee: "Цедент / Судебный пристав"

  taxation_assignment_risk:
    text: >
      Просим предоставить по {doc_names}: (а) налоговое заключение об НДС при уступке; (б) расчет налоговой базы 
      по налогу на прибыль (ст. 279 НК РФ); (в) порядок выставления счета-фактуры (если применимо).
    addressee: "Налоговый консультант"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: (а) подведомственность (арбитражные суды); (б) подсудность (место нахождения цессионария); 
      (в) досудебный претензионный порядок (срок 30 дней); (г) применимое право.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности: (а) неразглашение суммы уступки; 
      (б) неразглашение условий сделки; (в) исключения (по требованию суда/пристава); (г) ответственность.
    addressee: "Юридический советник"

  debtor_setoff_counterclaim_check:
    text: >
      Просим предоставить по {doc_names}: (а) информацию о наличии встречных требований
      Должника к Цеденту (акт сверки, переписка, претензии); (б) заверение Цедента
      об отсутствии оснований для зачёта; (в) информацию об обязательствах Цедента
      перед Должником по смежным договорам.
    addressee: "Цедент / Юридический советник цессионария"

  debtor_setoff_warning:
    text: >
      Просим включить в {doc_names}: гарантию Цедента об отсутствии встречных
      требований Должника, обязанность раскрытия любых известных возражений
      и компенсацию потерь при наличии скрытых встречных требований.
    addressee: "Юридический советник цессионария"

  partial_assignment_scope_check:
    text: >
      Просим уточнить в {doc_names}: (а) точный объём передаваемой части требования
      (сумма, компоненты: основной долг/проценты/неустойка); (б) судьбу остатка
      требования у Цедента; (в) порядок распределения поступлений от Должника
      между двумя кредиторами; (г) подтверждение делимости требования.
    addressee: "Юридический советник"

  assignment_scope_volume:
    text: >
      Просим явно указать в {doc_names}: уступается ли право требования
      в полном объёме или частично, включая перечень компонентов (основной долг,
      проценты, неустойка, судебные расходы).
    addressee: "Юридический советник"

  assignment_form_compliance_check:
    text: >
      Просим подтвердить по {doc_names}: (а) в какой форме заключён основной договор
      с Должником (простая письменная / нотариальная / зарегистрированная);
      (б) соблюдена ли аналогичная форма для договора уступки (ст. 389 ГК РФ);
      (в) при необходимости — порядок нотариального удостоверения или регистрации уступки.
    addressee: "Юридический советник / Нотариус"

  payment_terms_for_assignment:
    text: >
      Просим уточнить в {doc_names}: конкретный срок оплаты цены уступки,
      способ расчёта (банковский перевод / иной), реквизиты, последствия
      просрочки оплаты (неустойка, право на расторжение, удержание документов).
    addressee: "Финансовый директор / Юридический советник"

  termination_rights:
    text: >
      Просим согласовать в {doc_names}: основания расторжения для каждой стороны,
      последствия расторжения (обратная уступка, возврат цены, компенсация),
      порядок уведомления, применимость ст. 450.1 ГК РФ (отказ от договора).
    addressee: "Юридический советник"

  penalty_and_liability:
    text: >
      Просим включить в {doc_names}: неустойку за просрочку оплаты,
      штраф за непередачу документов, ответственность за предоставление
      недостоверных гарантий и общий лимит ответственности сторон.
    addressee: "Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право,
      особенно если стороны или должник находятся в разных юрисдикциях.
    addressee: "Юридический советник"

  non_monetary_claim_consent_required:
    text: >
      Внимание: {doc_names} содержит уступку неденежного требования.
      По ст. 388 п. 4 ГК РФ необходимо убедиться, что уступка не делает
      исполнение значительно более обременительным для Должника.
      Просим предоставить: (а) согласие Должника (если требуется);
      (б) правовое заключение о допустимости уступки без согласия.
    addressee: "Юридический советник цессионария"

  bankruptcy_avoidance_risk:
    text: >
      Внимание: по {doc_names} выявлен банкротный контекст.
      Просим предоставить: (а) информацию о финансовом состоянии Цедента;
      (б) данные о наличии/отсутствии дел о банкротстве (Картотека арбитражных дел);
      (в) правовое заключение о рисках оспаривания уступки по ст. 61.2–61.3 ФЗ-127;
      (г) обоснование рыночности цены уступки.
    addressee: "Юридический советник цессионария"

  assignment_form_legal_requirement:
    text: >
      Внимание: основной договор по {doc_names} может требовать нотариальной
      формы или государственной регистрации. Просим подтвердить: (а) форму
      основного договора; (б) соблюдение аналогичной формы для уступки (ст. 389 ГК РФ);
      (в) порядок регистрации (если применимо).
    addressee: "Юридический советник / Нотариус"

  assignment_prohibition_check:
    text: >
      КРИТИЧНО: по {doc_names} выявлен возможный запрет уступки в основном договоре.
      Просим немедленно предоставить: (а) полный текст основного договора для проверки
      раздела об уступке; (б) при наличии запрета — согласие Должника на уступку;
      (в) правовое заключение о последствиях нарушения запрета.
    addressee: "Цедент / Юридический советник"

  double_assignment_risk:
    text: >
      Просим предоставить по {doc_names}: (а) письменное заверение Цедента
      об отсутствии предыдущих уступок данного требования; (б) проверку судебных
      дел в отношении Должника (Картотека); (в) подтверждение отсутствия
      обременений на требование; (г) обязательство не уступать требование повторно.
    addressee: "Цедент / Юридический советник цессионария"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    