      text: >
        Просим предоставить по {doc_names} полные реквизиты Цессионария:
        наименование / ФИО, ИНН, ОГРН / ОГРНИП, юридический адрес.
      addressee: "Цессионарий"
    missing_cedent_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Цедента: устав / доверенность / приказ о назначении.
      addressee: "Цедент"
    missing_assignee_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Цессионария: устав / доверенность / приказ о назначении.
      addressee: "Цессионарий"
    missing_debtor_details:
      text: >
        Просим предоставить по {doc_names} данные о Должнике:
        наименование / ФИО, ИНН, адрес, актуальная выписка из ЕГРЮЛ / ЕГРИП
        или паспортные данные.
      addressee: "Цедент"

  claim_identification_check:
    missing_debtor_identification:
      text: >
        Просим предоставить по {doc_names} точную идентификацию Должника
        по уступаемому требованию: наименование / ФИО, ИНН, адрес.
      addressee: "Цедент"
    missing_claim_basis:
      text: >
        Просим предоставить по {doc_names} реквизиты основания требования:
        номер, дата и предмет договора / расписки / судебного акта, из которого
        возникло уступаемое право.
      addressee: "Цедент"
    missing_claim_amount:
      text: >
        Просим предоставить по {doc_names} подтверждение суммы задолженности
        с разбивкой: основной долг / проценты / неустойка. Приложить акт сверки.
      addressee: "Цедент"
    missing_assignment_scope:
      text: >
        Просим уточнить по {doc_names}: в каком объёме уступается требование —
        полностью или частично; при частичной уступке — точный размер передаваемой части.
      addressee: "Цедент"
    missing_prohibition_check:
      text: >
        Просим предоставить по {doc_names} подтверждение отсутствия запрета уступки
        в основном договоре с Должником: соответствующий пункт или извлечение из договора.
      addressee: "Цедент"

  cedent_warranties_check:
    missing_validity_warranty:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о действительности
        уступаемого права требования.
      addressee: "Юридический советник цессионария"
    missing_existence_warranty:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о существовании
        требования (долг не погашен и не прекращён).
      addressee: "Юридический советник цессионария"
    missing_no_prior_assignment:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о том, что уступаемое
        требование ранее не уступалось третьим лицам.
      addressee: "Юридический советник цессионария"
    missing_no_encumbrances:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента об отсутствии
        обременений и прав третьих лиц на уступаемое требование.
      addressee: "Юридический советник цессионария"
    missing_solvency_exclusion:
      text: >
        Просим включить в {doc_names} явное ограничение ответственности Цедента:
        Цедент не несёт ответственности за исполнение требования Должником
        (за платёжеспособность Должника).
      addressee: "Юридический советник цессионария"
    missing_final_settlement:
      text: >
        Просим включить в {doc_names} условие об окончательности расчётов по договору
        уступки без права регресса Цессионария к Цеденту.
      addressee: "Юридический советник цессионария"

  debtor_notification_check:
    missing_notification_procedure:
      text: >
        Просим предоставить по {doc_names}: на кого возложена обязанность уведомления
        Должника об уступке — Цедента или Цессионария.
      addressee: "Юридический советник"
    missing_notification_deadline:
      text: >
        Просим уточнить по {doc_names} срок уведомления Должника об уступке
        (рекомендуется не позднее 10 рабочих дней с даты подписания договора).
      addressee: "Юридический советник"
    missing_notification_method:
      text: >
        Просим уточнить по {doc_names} способ уведомления Должника об уступке
        (рекомендуется: заказное письмо с уведомлением о вручении + курьерская доставка).
      addressee: "Юридический советник"
    missing_notification_form:
      text: >
        Просим предоставить по {doc_names} форму уведомления Должника об уступке
        (как приложение к договору) для включения в документацию.
      addressee: "Юридический советник"
    missing_receipt_confirmation:
      text: >
        Просим уточнить по {doc_names} порядок подтверждения получения Должником
        уведомления об уступке (например: уведомление о вручении, подпись на копии).
      addressee: "Юридический советник"

  accessory_rights_transfer_check:
    missing_pledge_transfer:
      text: >
        Просим уточнить по {doc_names}: переходят ли к Цессионарию права из
        договора залога, обеспечивающего уступаемое требование. Предоставить
        реквизиты договора залога.
      addressee: "Цедент"
    missing_surety_transfer:
      text: >
        Просим уточнить по {doc_names}: переходят ли к Цессионарию права по
        договору поручительства. Предоставить реквизиты договора поручительства.
      addressee: "Цедент"
    missing_penalty_transfer:
      text: >
        Просим уточнить по {doc_names}: переходит ли к Цессионарию право на
        уже начисленную неустойку по уступаемому требованию.
      addressee: "Цедент"
    missing_interest_transfer:
      text: >
        Просим уточнить по {doc_names}: переходит ли к Цессионарию право на
        начисленные проценты по уступаемому требованию.
      addressee: "Цедент"
    missing_documents_transfer:
      text: >
        Просим предоставить по {doc_names} перечень документов по обеспечению
        (договоры залога, поручительства, акты), подлежащих передаче Цессионарию.
      addressee: "Цедент"
    missing_surety_notification:
      text: >
        Просим уточнить по {doc_names} порядок уведомления поручителей и
        залогодателей о смене кредитора.
      addressee: "Юридический советник"

  debtor_setoff_counterclaim_check:
    missing_warranty_no_counterclaims:
      text: >
        Просим предоставить по {doc_names} прямое заверение Цедента об отсутствии
        у Должника встречных требований к Цеденту на дату уступки.
      addressee: "Цедент"
    missing_known_objections:
      text: >
        Просим предоставить по {doc_names} сведения о наличии / отсутствии известных
        Цеденту возражений Должника (претензии, переписка, споры).
      addressee: "Цедент"
    missing_reconciliation_act:
      text: >
        Просим предоставить по {doc_names} актуальный акт сверки взаимных расчётов
        между Цедентом и Должником, подтверждающий сумму задолженности.
      addressee: "Цедент"
    missing_compensation_clause:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли обязанность Цедента
        компенсировать потери Цессионария при обнаружении скрытых встречных требований
        Должника, не раскрытых Цедентом.
      addressee: "Юридический советник цессионария"

  del_credere_check:
    clarify_del_credere:
      text: >
        Просим уточнить по {doc_names}: принимает ли Цедент ответственность за
        исполнение уступленного требования Должником (делькредере)? Если да —
        предоставить условия: объём, размер, основания возникновения, срок
        предъявления требований к Цеденту.
      addressee: "Юридический советник"

  future_claims_check:
    missing_identification_criteria:
      text: >
        Просим предоставить по {doc_names} точные критерии определения будущих
        требований, подлежащих уступке: контрагенты, основания, суммы, категории.
      addressee: "Цедент"
    missing_future_debtor:
      text: >
        Просим уточнить по {doc_names}: кто является будущим Должником или по каким
        критериям он будет определяться.
      addressee: "Цедент"
    missing_time_period:
      text: >
        Просим уточнить по {doc_names}: в какой период должны возникнуть уступаемые
        будущие требования (дата начала — дата окончания).
      addressee: "Цедент"
    missing_fixation_mechanism:
      text: >
        Просим предоставить по {doc_names} механизм фиксации факта возникновения
        будущих требований: реестр, акт, уведомление — с указанием сроков и формы.
      addressee: "Юридический советник"

  partial_assignment_scope_check:
    missing_transferred_amount:
      text: >
        Просим уточнить по {doc_names}: какой именно размер (сумма / компоненты)
        требования передаётся Цессионарию в рамках частичной уступки.
      addressee: "Цедент"
    missing_retained_amount:
      text: >
        Просим уточнить по {doc_names}: какая часть требования сохраняется за Цедентом
        после частичной уступки.
      addressee: "Цедент"
    missing_proceeds_distribution:
      text: >
        Просим уточнить по {doc_names}: как будут распределяться поступления от Должника
        между Цедентом и Цессионарием при частичной уступке (пропорционально / по очерёдности).
      addressee: "Юридический советник"
    missing_priority_on_shortfall:
      text: >
        Просим уточнить по {doc_names}: кто из кредиторов имеет приоритет при
        недостаточности исполнения Должником — Цедент или Цессионарий.
      addressee: "Юридический советник"

  documents_and_form_compliance:
    missing_main_contract_form:
      text: >
        Просим предоставить по {doc_names} форму основного договора с Должником
        (простая письменная / нотариальная / требующая государственной регистрации)
        для проверки соответствия формы уступки (ст. 389 ГК РФ).
      addressee: "Цедент"
    missing_documents_list:
      text: >
        Просим предоставить по {doc_names} полный перечень документов, подлежащих
        передаче Цессионарию: оригинал договора-основания, акты, накладные,
        расписки, исполнительные документы (если имеются).
      addressee: "Цедент"
    missing_transfer_act:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли акт приёма-передачи
        документов от Цедента к Цессионарию и в какой срок он должен быть подписан.
      addressee: "Юридический советник"
    gratuitous_assignment_risk:
      text: >
        Внимание: по {doc_names} уступка может быть безвозмездной. Просим предоставить
        правовое обоснование допустимости безвозмездной уступки между коммерческими
        организациями (ст. 575 ГК РФ).
      addressee: "Юридический советник цессионария"

  assignment_price_and_payment:
    missing_price:
      text: >
        Просим предоставить по {doc_names} цену уступки в рублях и её соотношение
        с номиналом уступаемого долга (дисконт / паритет / премия).
      addressee: "Цедент / Цессионарий"
    missing_payment_deadline:
      text: >
        Просим уточнить по {doc_names} конкретный срок оплаты цены уступки
        (в календарных или рабочих днях с момента подписания договора).
      addressee: "Цессионарий"
    missing_payment_method:
      text: >
        Просим уточнить по {doc_names} способ оплаты цены уступки: банковский
        перевод, зачёт встречных требований или иное. Предоставить платёжные реквизиты.
      addressee: "Цедент"
    missing_late_payment_consequences:
      text: >
        Просим уточнить по {doc_names}: какие последствия предусмотрены за просрочку
        оплаты цены уступки (неустойка, право расторгнуть договор, удержание документов).
      addressee: "Юридический советник"

  termination_liability_and_disputes:
    missing_termination_grounds:
      text: >
        Просим уточнить по {doc_names} основания расторжения договора цессии
        для каждой из сторон.
      addressee: "Юридический советник"
    missing_back_assignment:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли обратная уступка права
        требования Цеденту при расторжении договора и в какой срок она должна
        быть оформлена.
      addressee: "Юридический советник"
    missing_price_return:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли возврат цены уступки
        Цессионарию при расторжении договора, в какой срок и в каком порядке.
      addressee: "Юридический советник"
    missing_penalty:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли неустойка за нарушение
        договора цессии (за просрочку оплаты, непередачу документов, недостоверные
        гарантии) — ставка и основание.
      addressee: "Юридический советник"
    missing_pretrial_procedure:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли претензионный (досудебный)
        порядок урегулирования споров и каков срок ответа на претензию.
      addressee: "Юридический советник"
    missing_dispute_forum:
      text: >
        Просим уточнить по {doc_names}: в каком суде (форуме) подлежат разрешению
        споры из договора цессии — арбитражный суд, суд общей юрисдикции, третейский суд.
      addressee: "Юридический советник"
    missing_confidentiality:
      text: >
        Просим уточнить по {doc_names}: предусмотрено ли условие о конфиденциальности
        условий договора цессии, перечень исключений и срок действия обязательства.
      addressee: "Юридический советник"
    missing_governing_law:
      text: >
        Просим уточнить по {doc_names}: какое право применяется к договору цессии
        (рекомендуется: законодательство Российской Федерации).
      addressee: "Юридический советник"

  assignment_prohibition_check:
    text: >
      КРИТИЧНО: по {doc_names} выявлен возможный запрет уступки в основном договоре.
      Просим немедленно предоставить полный текст основного договора для проверки
      раздела об уступке. При наличии запрета — письменное согласие Должника на уступку.
    addressee: "Цедент / Юридический советник"

  double_assignment_risk:
    text: >
      Просим предоставить по {doc_names} письменное заверение Цедента об отсутствии
      предыдущих уступок данного требования. Рекомендуем проверить Картотеку
      арбитражных дел на наличие споров с участием Должника.
    addressee: "Цедент / Юридический советник цессионария"

  enforcement_assignment_compliance:
    text: >
      Для {doc_names} (уступка в рамках исполнительного производства) просим
      предоставить: исполнительный документ, постановление о возбуждении ИП,
      сведения об остатке долга, порядок уведомления судебного пристава-исполнителя
      и порядок процессуальной замены взыскателя (ст. 52 ФЗ-229).
    addressee: "Цедент / Судебный пристав"

  taxation_assignment_risk:
    text: >
      Просим предоставить по {doc_names} налоговое заключение:
      (а) НДС при уступке (ст. 146, 154 НК РФ);
      (б) налог на прибыль при дисконтной уступке (ст. 279 НК РФ);
      (в) риски ТЦО при взаимозависимости сторон.
    addressee: "Налоговый консультант"

  non_monetary_claim_consent_required:
    text: >
      Внимание: {doc_names} содержит уступку неденежного требования. По ст. 388 п. 4
      ГК РФ необходимо убедиться в допустимости уступки без согласия Должника.
      Просим предоставить согласие Должника или правовое заключение о допустимости.
    addressee: "Юридический советник цессионария"

  bankruptcy_avoidance_risk:
    text: >
      Внимание: по {doc_names} выявлен банкротный контекст. Просим предоставить:
      сведения о финансовом состоянии Цедента, данные о наличии / отсутствии дел
      о банкротстве (Картотека арбитражных дел), правовое заключение о рисках
      оспаривания уступки по ст. 61.2–61.3 ФЗ-127 и обоснование рыночности цены.
    addressee: "Юридический советник цессионария"

  assignment_form_legal_requirement:
    text: >
      Внимание: основной договор по {doc_names} может требовать нотариальной формы
      или государственной регистрации. Просим подтвердить форму основного договора
      и соблюдение аналогичной формы для уступки (ст. 389 ГК РФ).
    addressee: "Юридический советник / Нотариус"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

