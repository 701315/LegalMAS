          description: >
            Наименование/ФИО и реквизиты Цессионария (ИНН, ОГРН, ОГРНИП или паспортные данные).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "assignee_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Цессионарий: подписант"
          description: >
            Подписант от Цессионария: ФИО и должность.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "assignee_signatory_status"
          type: "string"
          presentation: "signal"
