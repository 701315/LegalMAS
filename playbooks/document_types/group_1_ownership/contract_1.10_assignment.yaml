  - id: accessory_rights_transfer_check
    name: "Переход обеспечительных и дополнительных прав вместе с требованием (ст. 384 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о переходе залога,
      поручительства, неустойки, процентов и о передаче документов по обеспечению.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "переход обеспечительных прав"
        - "права из договора залога"
        - "поручительство"
        - "право на неустойку"
        - "проценты"
        - "дополнительные права"
        - "документы по залогу"
        - "права из обеспечительных сделок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вместе.*с.*правом.*требования.*переходят"
        - "(?i)права.*обеспечивающие.*исполнение"
        - "(?i)залог.*поручительств"
        - "(?i)право.*на.*начисленн.*неустойк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: переход обеспечительных и дополнительных прав
        вместе с уступаемым требованием.

        Нормативный ориентир:
        - ст. 384 ГК РФ — объём переходящих прав

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о переходе прав из договора залога.
        2. Есть ли прямое условие о переходе прав по поручительству.
        3. Есть ли прямое условие о переходе права на неустойку.
        4. Есть ли прямое условие о переходе права на проценты.
        5. Есть ли условие о передаче документов по обеспечению.
        6. Есть ли условие об уведомлении поручителей / залогодателей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — права перечислены:
        Фрагмент:
        "Вместе с правом требования к Цессионарию переходят все обеспечительные права,
        включая права из договора залога № 3 от 01.03.2024, права из договора
        поручительства, право на неустойку и начисленные проценты. Цедент передаёт
        Цессионарию оригиналы документов по залогу."

        Ответ:
        {
          "accessory_rights_status": "defined",
          "pledge_transfer_status": "defined",
          "pledge_transfer_details": "права из договора залога № 3 от 01.03.2024",
          "surety_transfer_status": "defined",
          "surety_transfer_details": "права из договора поручительства",
          "penalty_transfer_status": "defined",
          "penalty_transfer_details": "право на неустойку",
          "interest_transfer_status": "defined",
          "interest_transfer_details": "начисленные проценты",
          "documents_transfer_status": "defined",
          "documents_transfer_details": "оригиналы документов по залогу",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Вместе с правом требования к Цессионарию переходят все обеспечительные права, включая права из договора залога № 3 от 01.03.2024."
            }
          ]
        }

        Пример 2 — обеспечительные права не упомянуты:
        Фрагмент:
        "Цедент передаёт Цессионарию право требования в полном объёме."

        Ответ:
        {
          "accessory_rights_status": "not_defined",
          "pledge_transfer_status": "not_defined",
          "pledge_transfer_details": "Данные не определены",
          "surety_transfer_status": "not_defined",
          "surety_transfer_details": "Данные не определены",
          "penalty_transfer_status": "not_defined",
          "penalty_transfer_details": "Данные не определены",
          "interest_transfer_status": "not_defined",
          "interest_transfer_details": "Данные не определены",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о залоге.
        2. Найди прямую цитату о поручительстве.
        3. Найди прямую цитату о неустойке.
        4. Найди прямую цитату о процентах.
        5. Найди прямую цитату о документах по обеспечению.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай состав обеспечения.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "accessory_rights_status": "<defined / not_defined>",
          "pledge_transfer_status": "<defined / not_defined>",
          "pledge_transfer_details": "<текст или 'Данные не определены'>",
          "surety_transfer_status": "<defined / not_defined>",
          "surety_transfer_details": "<текст или 'Данные не определены'>",
          "penalty_transfer_status": "<defined / not_defined>",
          "penalty_transfer_details": "<текст или 'Данные не определены'>",
          "interest_transfer_status": "<defined / not_defined>",
          "interest_transfer_details": "<текст или 'Данные не определены'>",
          "documents_transfer_status": "<defined / not_defined>",
          "documents_transfer_details": "<текст или 'Данные не определены'>",
          "surety_notification_status": "<defined / not_defined>",
          "surety_notification_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переход обеспечительных прав права из договора залога поручительство право на неустойку проценты дополнительные права документы по залогу права из обеспечительных сделок вместе с правом требования переходят уведомление поручителя залогодателя"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "гарантирует действительность"
        - "не обременено правами третьих лиц"
        - "делькредере"
        - "акт сверки"
        - "встречные требования"
        - "уведомление должника"
        - "будущие требования"
        - "частичная уступка"
        - "передача документов подтверждающих требование"
        - "акт приема-передачи документов подтверждающих"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о переходе обеспечительных и дополнительных прав: залог, поручительство,
        неустойка, проценты, документы по обеспечению и уведомление поручителей/залогодателей.
        Не анализируй цену уступки, общие гарантии Цедента или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. accessory_rights_status — "defined" если в целом прямо урегулирован переход обеспечительных/дополнительных прав, иначе "not_defined".
        2. pledge_transfer_status — "defined" если прямо указан переход прав из залога, иначе "not_defined".
        3. pledge_transfer_details — формулировка о правах из залога.
        4. surety_transfer_status — "defined" если прямо указан переход прав из поручительства, иначе "not_defined".
        5. surety_transfer_details — формулировка о правах из поручительства.
        6. penalty_transfer_status — "defined" если прямо указан переход права на неустойку, иначе "not_defined".
        7. penalty_transfer_details — формулировка о праве на неустойку.
        8. interest_transfer_status — "defined" если прямо указан переход права на проценты, иначе "not_defined".
        9. interest_transfer_details — формулировка о праве на проценты.
        10. documents_transfer_status — "defined" если предусмотрена передача документов по обеспечению, иначе "not_defined".
        11. documents_transfer_details — формулировка о передаче документов.
        12. surety_notification_status — "defined" если предусмотрено уведомление поручителей/залогодателей, иначе "not_defined".
        13. surety_notification_details — текст условия об уведомлении.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - Не выводи переход accessory rights по умолчанию из ст. 384 ГК РФ.
        </context_rules>

        <output_expectations>
