          description: "Статус указания критериев определения будущих требований. Внутреннее enum-поле."
          required: true

        - name: "identification_criteria_details"
          type: "string"
          presentation: "fact"
          label: "Критерии определения будущих требований"
          description: >
            Критерии определения будущих требований.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "future_debtor_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания будущего Должника. Внутреннее enum-поле."
          required: true

        - name: "future_debtor_details"
          type: "string"
          presentation: "fact"
