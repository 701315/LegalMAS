    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о частичной уступке: какая часть передаётся, что остаётся у Цедента,
        делимость требования, распределение поступлений и приоритет при нехватке исполнения.
        Не анализируй цену уступки, будущие требования, уведомление Должника или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. partial_assignment_type — "amount_based" / "component_based" / "mixed" / "not_defined".
        2. transferred_amount_status — "defined" если размер или состав передаваемой части указан, иначе "not_defined".
        3. transferred_amount_details — размер или состав передаваемой части.
        4. retained_by_cedent_status — "defined" если прямо указано, что остаётся у Цедента, иначе "not_defined".
        5. retained_by_cedent_details — остаток у Цедента.
        6. divisibility_status — "defined" если делимость требования прямо подтверждена, иначе "not_defined".
        7. divisibility_details — формулировка о делимости.
        8. proceeds_distribution_status — "defined" если порядок распределения поступлений от Должника определён, иначе "not_defined".
        9. proceeds_distribution_details — такой порядок.
        10. priority_on_shortfall_status — "defined" если указан приоритет при недостаточности исполнения Должником, иначе "not_defined".
        11. priority_on_shortfall_details — условие о приоритете.

        Если данных нет:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - amount_based = частичная уступка определена через сумму (например, 200 000 руб. из 500 000 руб.).
        - component_based = частичная уступка определена через компоненты требования (например, только основной долг без неустойки).
        - mixed = уступка определена и по сумме, и по компонентам одновременно.
        - Не выводи делимость из природы обязательства, если это прямо не написано.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "partial_assignment_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["amount_based", "component_based", "mixed", "not_defined"]
          description: "Тип частичной уступки."
          required: true
        - name: "transferred_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения передаваемой части требования."
          required: true
        - name: "transferred_amount_details"
          type: "string"
          presentation: "fact"
          label: "Передаваемая часть требования"
          description: "Размер или состав передаваемой части требования."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "retained_by_cedent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания остатка, сохраняемого за Цедентом."
          required: true
        - name: "retained_by_cedent_details"
          type: "string"
          presentation: "fact"
          label: "Остаток у Цедента"
          description: "Какая часть требования сохраняется за Цедентом."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "divisibility_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения делимости требования."
          required: true
        - name: "divisibility_details"
          type: "string"
          presentation: "fact"
          label: "Делимость требования"
          description: "Формулировка о делимости требования."
          required: false
          display_in_grid: false
        - name: "proceeds_distribution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка распределения поступлений от Должника."
          required: true
        - name: "proceeds_distribution_details"
          type: "string"
          presentation: "fact"
          label: "Распределение поступлений"
          description: "Порядок распределения поступлений от Должника."
          required: false
          display_in_grid: false
        - name: "priority_on_shortfall_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения приоритета при недостаточности исполнения."
          required: true
        - name: "priority_on_shortfall_details"
          type: "string"
          presentation: "fact"
          label: "Приоритет при недостаточности исполнения"
          description: "Условие о приоритете при недостаточности исполнения Должником."
          required: false
          display_in_grid: false
      store_payload: true

