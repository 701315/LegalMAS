  - id: debtor_notification_check
    name: "Порядок уведомления Должника об уступке (ст. 385 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре детальной процедуры уведомления
      Должника: кто уведомляет, в какой срок, каким способом, в какой форме,
      как подтверждается получение. Без уведомления Должника исполнение Цеденту
      считается надлежащим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление должника"
        - "письменное уведомление"
        - "уведомить должника"
        - "в течение"
        - "заказное письмо"
        - "цедент обязуется уведомить"
        - "цессионарий уведомляет"
        - "момент уведомления"
        - "подтверждение получения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени[ея].*должника.*в.*течение.*\\d+.*дн"
        - "(?i)должник.*должен.*быть.*уведомлен"
        - "(?i)(цедент|цессионарий).*обязан.*уведомить"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: порядок уведомления Должника об уступке.

        Нормативный ориентир:
        - ст. 385 ГК РФ — уведомление Должника

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие об уведомлении Должника.
        2. На ком лежит обязанность уведомления (Цедент / Цессионарий / совместно).
        3. Какой срок уведомления.
        4. Какой способ уведомления.
        5. Требуется ли форма уведомления (приложение к договору).
        6. Есть ли условие о подтверждении получения уведомления Должником.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процедура определена:
        Фрагмент:
        "Цедент обязуется уведомить Должника о состоявшейся уступке в течение 5 рабочих
        дней с даты подписания настоящего договора путём направления заказного письма
        с уведомлением о вручении. Форма уведомления — Приложение № 2 к настоящему договору."

        Ответ:
        {
          "notification_status": "defined",
          "notification_responsibility": "cedent",
          "notification_deadline_status": "defined",
          "notification_deadline_details": "в течение 5 рабочих дней с даты подписания",
          "notification_method_status": "defined",
          "notification_method_details": "заказное письмо с уведомлением о вручении",
          "notification_form_status": "defined",
          "notification_form_details": "Приложение № 2 к договору",
          "receipt_confirmation_status": "not_defined",
          "receipt_confirmation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цедент обязуется уведомить Должника о состоявшейся уступке в течение 5 рабочих дней с даты подписания настоящего договора путём направления заказного письма с уведомлением о вручении."
            }
          ]
        }

        Пример 2 — процедуры нет:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство."

        Ответ:
        {
          "notification_status": "not_defined",
          "notification_responsibility": "not_defined",
          "notification_deadline_status": "not_defined",
          "notification_deadline_details": "Данные не определены",
          "notification_method_status": "not_defined",
          "notification_method_details": "Данные не определены",
          "notification_form_status": "not_defined",
          "notification_form_details": "Данные не определены",
          "receipt_confirmation_status": "not_defined",
          "receipt_confirmation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности уведомления.
        2. Найди прямую цитату о сроке уведомления.
        3. Найди прямую цитату о способе уведомления.
        4. Найди прямую цитату о форме уведомления.
        5. Найди прямую цитату о подтверждении получения.
        6. Если прямой цитаты нет — верни "not_defined". Не подменяй закон текстом договора.
        7. Проверь, что все значения соответствуют допустимому словарю.

