  - id: future_claims_check
    name: "Условия уступки будущих требований (ст. 388.2 ГК РФ)"
    description: >
      Фактографическая проверка наличия специальных условий для уступки будущих
      требований: критерии определения, идентификация будущего Должника и основания,
      период возникновения, механизм фиксации возникших требований.
      Check активируется только при наличии триггера future_claim.
    triggers:
      any: ["future_claim"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "будущие требования"
        - "права, которые возникнут"
        - "критерии определения будущих требований"
        - "период возникновения"
        - "определение будущего должника"
        - "основание будущих требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступаются.*права.*требования.*которые.*возникнут"
        - "(?i)будущие.*требования.*определяются.*по.*следующим.*критериям"
        - "(?i)права.*котор[ые]+.*возникнут.*из.*договоров"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: наличие и полнота условий для уступки
        будущих требований.

        Нормативный ориентир:
        - ст. 388.2 ГК РФ — уступка будущего требования

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на уступку будущих требований.
        2. Есть ли критерии определения будущих требований.
        3. Определён ли будущий Должник или критерии его определения.
        4. Определено ли основание будущих требований.
        5. Определён ли период возникновения требований.
        6. Есть ли механизм фиксации возникших требований (реестр, акт, уведомление).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — будущие требования определены:
        Фрагмент:
        "Настоящим договором уступаются права требования, которые возникнут у Цедента
        из договоров поставки, заключённых с ООО «Омега» в период с 01.01.2025
        по 31.12.2025. Факт возникновения требований фиксируется реестром,
        составляемым сторонами ежемесячно."

        Ответ:
        {
          "future_claims_status": "defined",
          "future_claims_details": "права требования из договоров поставки с ООО «Омега» в период 01.01.2025–31.12.2025",
          "identification_criteria_status": "defined",
          "identification_criteria_details": "договоры поставки, заключённые с ООО «Омега»",
          "future_debtor_status": "defined",
          "future_debtor_details": "ООО «Омега»",
          "future_basis_status": "defined",
          "future_basis_details": "договоры поставки",
          "time_period_status": "defined",
          "time_period_details": "01.01.2025 по 31.12.2025",
          "fixation_mechanism_status": "defined",
          "fixation_mechanism_details": "реестр, составляемый сторонами ежемесячно",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящим договором уступаются права требования, которые возникнут у Цедента из договоров поставки, заключённых с ООО «Омега» в период с 01.01.2025 по 31.12.2025."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Цедент также уступает будущие требования."

        Ответ:
        {
          "future_claims_status": "defined",
          "future_claims_details": "упомянуты будущие требования без детализации",
          "identification_criteria_status": "not_defined",
          "identification_criteria_details": "Данные не определены",
          "future_debtor_status": "not_defined",
          "future_debtor_details": "Данные не определены",
          "future_basis_status": "not_defined",
          "future_basis_details": "Данные не определены",
          "time_period_status": "not_defined",
          "time_period_details": "Данные не определены",
          "fixation_mechanism_status": "not_defined",
          "fixation_mechanism_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Цедент также уступает будущие требования."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о будущих требованиях.
        2. Найди прямую цитату о критериях их определения.
        3. Найди прямую цитату о будущем Должнике.
        4. Найди прямую цитату о периоде возникновения.
        5. Найди прямую цитату о механизме фиксации.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "future_claims_status": "<defined / not_defined>",
          "future_claims_details": "<текст или 'Данные не определены'>",
          "identification_criteria_status": "<defined / not_defined>",
          "identification_criteria_details": "<текст или 'Данные не определены'>",
          "future_debtor_status": "<defined / not_defined>",
          "future_debtor_details": "<текст или 'Данные не определены'>",
          "future_basis_status": "<defined / not_defined>",
          "future_basis_details": "<текст или 'Данные не определены'>",
          "time_period_status": "<defined / not_defined>",
          "time_period_details": "<текст или 'Данные не определены'>",
          "fixation_mechanism_status": "<defined / not_defined>",
          "fixation_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "будущие требования права которые возникнут критерии определения будущих требований период возникновения определение будущего должника основание будущих требований механизм фиксации реестр требований ст. 388.2 ГК РФ"
