          required: false
          display_in_grid: false

        - name: "future_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания основания будущих требований. Внутреннее enum-поле."
          required: true

        - name: "future_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание будущих требований"
          description: >
            Основание будущих требований.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "time_period_status"
          type: "string"
