  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Цена уступки и порядок оплаты
  # ──────────────────────────────────────────────────────────────────────────
  - id: assignment_price_and_payment
    name: "Цена уступки, порядок и сроки оплаты (ст. 424 ГК РФ, ст. 575 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре цены уступки, её соотношения
      с номиналом долга (дисконт / паритет / премия), сроков и способов оплаты,
      последствий просрочки оплаты.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена уступки"
        - "стоимость уступки"
        - "уплачивает цеденту"
        - "срок оплаты"
        - "в течение"
        - "не позднее"
        - "банковский перевод"
        - "после подписания"
        - "рассрочка"
        - "последствия неоплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цена.*уступки.*составляет.*\\d"
        - "(?i)возмездно.*за.*{{ money_amount }}"
        - "(?i)(в\\s+течение|не\\s+позднее)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)оплат[аыить].*цен[уы]\\s+уступки"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: цена уступки, порядок и сроки оплаты,
        последствия просрочки.

        Нормативный ориентир:
        - ст. 424 ГК РФ — цена
        - ст. 575 ГК РФ — ограничение безвозмездной передачи

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли цена уступки.
        2. Каков размер цены уступки.
        3. Каково соотношение цены с номиналом долга (равна / ниже / выше).
        4. Каков срок оплаты.
        5. Каков способ оплаты (банковский перевод / иное).
        6. Есть ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и оплата определены:
        Фрагмент:
        "Цена уступки составляет 400 000 рублей (80% от суммы долга 500 000 рублей).
        Цессионарий обязуется оплатить цену уступки в течение 10 рабочих дней с даты
        подписания настоящего договора путём безналичного перечисления на расчётный счёт
        Цедента. В случае просрочки оплаты Цессионарий уплачивает пени в размере 0,1%
        от суммы долга за каждый день просрочки."

        Ответ:
        {
          "price_status": "defined",
          "price_details": "400 000 рублей",
          "price_vs_nominal": "below",
          "price_vs_nominal_details": "80% от суммы долга 500 000 рублей",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 10 рабочих дней с даты подписания",
          "payment_method_status": "defined",
          "payment_method_details": "безналичное перечисление на расчётный счёт Цедента",
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_details": "пени 0,1% за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена уступки составляет 400 000 рублей. Цессионарий обязуется оплатить в течение 10 рабочих дней с даты подписания договора."
            }
          ]
        }

        Пример 2 — цена не определена:
        Фрагмент:
        "Цедент уступает требование безвозмездно."

        Ответ:
        {
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "price_vs_nominal": "not_defined",
          "price_vs_nominal_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "payment_method_status": "not_defined",
          "payment_method_details": "Данные не определены",
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цедент уступает требование безвозмездно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о размере цены уступки.
        2. Найди прямую цитату о соотношении с номиналом долга.
        3. Найди прямую цитату о сроке оплаты.
        4. Найди прямую цитату о способе оплаты.
        5. Найди прямую цитату о последствиях просрочки.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай цену и сроки.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "price_vs_nominal": "<equal / below / above / not_defined>",
          "price_vs_nominal_details": "<текст или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<текст или 'Данные не определены'>",
          "payment_method_status": "<defined / not_defined>",
          "payment_method_details": "<текст или 'Данные не определены'>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "late_payment_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цена уступки"
        - "стоимость уступки"
        - "срок оплаты"
        - "банковский перевод"
        - "последствия просрочки"
        - "пени"
        - "дисконт"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "price_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если цена уступки прямо указана. Иначе 'not_defined'."
        - name: "price_details"
          type: "string"
          description: "Укажи цену уступки. Если данных нет, верни строго: 'Данные не определены'."
        - name: "price_vs_nominal"
          type: "string"
          allowed_values: ["equal", "below", "above", "not_defined"]
          description: "Соотношение цены с номиналом долга. Если не указано — 'not_defined'."
        - name: "price_vs_nominal_details"
          type: "string"
          description: "Укажи соотношение. Если данных нет, верни строго: 'Данные не определены'."
        - name: "payment_deadline_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если срок оплаты прямо указан. Иначе 'not_defined'."
        - name: "payment_deadline_details"
          type: "string"
          description: "Укажи срок оплаты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "payment_method_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если способ оплаты прямо указан. Иначе 'not_defined'."
        - name: "payment_method_details"
          type: "string"
          description: "Укажи способ оплаты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "late_payment_consequences_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если последствия просрочки оплаты прямо указаны. Иначе 'not_defined'."
        - name: "late_payment_consequences_details"
          type: "string"
          description: "Укажи последствия. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Расторжение, ответственность, споры, конфиденциальность, право
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_liability_and_disputes
    name: "Расторжение, ответственность, споры, конфиденциальность и применимое право (ст. 450–453 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о расторжении
      (основания, обратная уступка, возврат цены), ответственности (неустойка),
      претензионном порядке, подсудности, конфиденциальности и применимом праве.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "возврат права требования"
        - "обратная уступка"
        - "возврат цены уступки"
        - "неустойка"
        - "штраф"
        - "пеня"
        - "досудебный порядок"
        - "претензионный порядок"
        - "арбитражный суд"
        - "подсудность"
        - "конфиденциальность"
        - "применимое право"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж[а-я]+"
        - "(?i)возврат.*прав[аo]\\s+требован"
        - "(?i)обратн[а-я]+\\s+уступк"
        - "(?i)неустойк[аи]\\s+в\\s+размере"
        - "(?i)арбитражн.*суд"
        - "(?i)претензионн.*порядок"
        - "(?i)конфиденциал"
        - "(?i)применим[а-я]+\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: расторжение, ответственность, споры,
        конфиденциальность и применимое право.

        Нормативный ориентир:
        - ст. 450–453 ГК РФ — расторжение
        - ст. 330, 393 ГК РФ — неустойка и убытки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли основания расторжения.
        2. Есть ли условие об обратной уступке при расторжении.
        3. Есть ли условие о возврате цены уступки при расторжении.
        4. Есть ли неустойка (ставка, основание).
        5. Есть ли претензионный / досудебный порядок и срок ответа.
        6. Указан ли суд / форум разрешения споров.
        7. Есть ли условие о конфиденциальности.
        8. Указано ли применимое право.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — блок определён:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон или по требованию одной из
        сторон в судебном порядке при существенном нарушении. При расторжении Цессионарий
        обязан вернуть право требования Цеденту посредством обратной уступки, а Цедент
        обязан вернуть цену уступки. Споры разрешаются в Арбитражном суде г. Москвы.
        Обязательный претензионный порядок: срок ответа 30 дней.
        Применимое право — законодательство Российской Федерации."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "по соглашению или в судебном порядке при существенном нарушении",
          "back_assignment_status": "defined",
          "back_assignment_details": "Цессионарий обязан вернуть право требования посредством обратной уступки",
          "price_return_status": "defined",
          "price_return_details": "Цедент обязан вернуть цену уступки",
          "penalty_status": "not_defined",
          "penalty_details": "Данные не определены",
          "pretrial_status": "defined",
          "pretrial_details": "обязательный претензионный порядок, срок ответа 30 дней",
          "dispute_forum_status": "defined",
          "dispute_forum_details": "Арбитражный суд г. Москвы",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "governing_law_status": "defined",
          "governing_law_details": "законодательство Российской Федерации",
          "evidence": [
            {
              "clause_ref": "п. 8.1–8.4",
              "quote": "Споры разрешаются в Арбитражном суде г. Москвы. Обязательный претензионный порядок: срок ответа 30 дней."
            }
          ]
        }

        Пример 2 — блок не определён:
        Фрагмент:
        "Все споры регулируются действующим законодательством."

        Ответ:
