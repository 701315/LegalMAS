        Должника и условие об окончательности расчётов.
        Не анализируй цену уступки, уведомление Должника, будущие требования или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. validity_warranty_status — "defined" если есть гарантия действительности требования, иначе "not_defined".
        2. validity_warranty_details — формулировка гарантии действительности.
        3. existence_warranty_status — "defined" если есть гарантия существования/непогашенности требования, иначе "not_defined".
        4. existence_warranty_details — формулировка гарантии существования требования.
        5. no_prior_assignment_status — "defined" если указано, что требование ранее не уступалось, иначе "not_defined".
        6. no_prior_assignment_details — формулировка об отсутствии предыдущих уступок.
        7. no_encumbrances_status — "defined" если указано отсутствие обременений на требование, иначе "not_defined".
        8. no_encumbrances_details — формулировка об отсутствии обременений.
        9. solvency_liability_excluded_status — "defined" если прямо ограничена ответственность Цедента за платёжеспособность или исполнение Должником, иначе "not_defined".
        10. solvency_liability_excluded_details — формулировка об исключении ответственности за платёжеспособность.
        11. final_settlement_status — "defined" если есть условие об окончательности расчётов / без права регресса, иначе "not_defined".
        12. final_settlement_details — текст такого условия.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - Не выводи гарантию из закона, если её нет в тексте.
        - solvency_liability_excluded_status = defined только если Цедент прямо написал, что не отвечает за исполнение или платёжеспособность Должника.
        - final_settlement_status = defined только если прямо написано об окончательности расчётов, отсутствии права регресса или обратного требования.
        - Не считай умолчание об ответственности за исполнение эквивалентом явного ограничения.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "validity_warranty_status"
          type: "string"
          presentation: "signal"
