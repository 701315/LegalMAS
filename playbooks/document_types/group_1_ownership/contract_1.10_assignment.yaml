# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\d{1,3}(?:[.,]\\d{1,2})?\\s*%"
  contract_number: "(?i)(?:договор|соглашение|расписка).*?№?\\s*\\d+[\\w\\-/]*\\s*от\\s*\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
  debt_amount: "(?i)(?:сумма|размер).*?долга.*?\\d[\\d\\s]*(?:руб|₽)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны и полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны договора цессии: идентификация Цедента, Цессионария и Должника, полномочия подписантов"
    description: >
      Фактографическая проверка наличия в договоре данных о Цеденте,
      Цессионарии, их реквизитах, подписантах, документах-основаниях полномочий,
      а также идентификации Должника как третьего лица по обязательству.
      Результат предназначен для табличного вывода по нескольким договорам
      без оценки серьёзности риска.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цедент"
        - "цессионарий"
        - "новый кредитор"
        - "первоначальный кредитор"
        - "должник"
        - "ИНН"
        - "ОГРН"
        - "именуемый"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*именуем"
        - "(?i)цессионарий.*именуем"
        - "(?i)должник.*[А-Я][а-я]+"
        - "{{ inn_ogrn }}"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: идентификация сторон (Цедент, Цессионарий, Должник)
        и полномочия подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ — идентификация сторон
        - ст. 382 ГК РФ — Цедент и Цессионарий
        - ст. 182–185 ГК РФ — полномочия представителя

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице по нескольким договорам.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Цедент (наименование/ФИО, ИНН, ОГРН, адрес).
        2. Кто указан как Цессионарий (наименование/ФИО, ИНН, ОГРН, адрес).
        3. Кто указан как Должник (наименование/ФИО, ИНН).
        4. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай, хороший договор или плохой.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined" строго по схеме.
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только цитаты из договора.
        7. Не цитируй закон в evidence.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные есть:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Цедент»,
        в лице Генерального директора Иванова И.И., действующего на основании Устава,
        и ООО «Бета» (ИНН 7700000002), именуемое «Цессионарий», в лице директора
        Петрова П.П., действующего на основании доверенности № 12 от 01.01.2024.
        Должник: ИП Сидоров С.С., ИНН 770000003."

        Ответ:
        {
          "cedent_details_status": "defined",
          "cedent_details": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "cedent_signatory": "Генеральный директор Иванов И.И.",
          "cedent_signatory_status": "defined",
          "cedent_signatory_basis": "charter",
          "assignee_details_status": "defined",
          "assignee_details": "ООО «Бета», ИНН 7700000002",
          "assignee_signatory": "Директор Петров П.П.",
          "assignee_signatory_status": "defined",
          "assignee_signatory_basis": "poa",
          "debtor_details_status": "defined",
          "debtor_details": "ИП Сидоров С.С., ИНН 770000003",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Цедент», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Стороны договорились об уступке права требования."

        Ответ:
        {
          "cedent_details_status": "not_defined",
          "cedent_details": "Данные не определены",
          "cedent_signatory": "Данные не определены",
          "cedent_signatory_status": "not_defined",
          "cedent_signatory_basis": "not_defined",
          "assignee_details_status": "not_defined",
          "assignee_details": "Данные не определены",
          "assignee_signatory": "Данные не определены",
          "assignee_signatory_status": "not_defined",
          "assignee_signatory_basis": "not_defined",
          "debtor_details_status": "not_defined",
          "debtor_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в документе прямая цитата с наименованием/ФИО Цедента.
        2. Есть ли в документе прямая цитата с наименованием/ФИО Цессионария.
        3. Есть ли в документе прямая цитата с идентификацией Должника.
        4. Есть ли прямое указание на подписанта и основание полномочий от каждой стороны.
        5. Если прямой цитаты нет — не додумывай, а верни "Данные не определены" / "not_defined".
        6. Убедись, что evidence содержит только текст договора.
        7. Убедись, что все значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "cedent_details_status": "<defined / not_defined>",
          "cedent_details": "<текст или 'Данные не определены'>",
          "cedent_signatory": "<текст или 'Данные не определены'>",
          "cedent_signatory_status": "<defined / not_defined>",
          "cedent_signatory_basis": "<charter / poa / order / other / not_defined>",
          "assignee_details_status": "<defined / not_defined>",
          "assignee_details": "<текст или 'Данные не определены'>",
          "assignee_signatory": "<текст или 'Данные не определены'>",
          "assignee_signatory_status": "<defined / not_defined>",
          "assignee_signatory_basis": "<charter / poa / order / other / not_defined>",
          "debtor_details_status": "<defined / not_defined>",
          "debtor_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цедент"
        - "цессионарий"
        - "должник"
        - "именуемый"
        - "ИНН"
        - "ОГРН"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cedent_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определён Цедент с реквизитами. Иначе 'not_defined'."
        - name: "cedent_details"
          type: "string"
          description: "Укажи Цедента и его реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "cedent_signatory"
          type: "string"
          description: "Укажи подписанта от Цедента. Если данных нет, верни строго: 'Данные не определены'."
        - name: "cedent_signatory_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если подписант от Цедента прямо указан. Иначе 'not_defined'."
        - name: "cedent_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Цедента. Если не указано — 'not_defined'."
        - name: "assignee_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо определён Цессионарий с реквизитами. Иначе 'not_defined'."
        - name: "assignee_details"
          type: "string"
          description: "Укажи Цессионария и его реквизиты. Если данных нет, верни строго: 'Данные не определены'."
        - name: "assignee_signatory"
          type: "string"
          description: "Укажи подписанта от Цессионария. Если данных нет, верни строго: 'Данные не определены'."
        - name: "assignee_signatory_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если подписант от Цессионария прямо указан. Иначе 'not_defined'."
        - name: "assignee_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Цессионария. Если не указано — 'not_defined'."
        - name: "debtor_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо указан Должник с реквизитами. Иначе 'not_defined'."
        - name: "debtor_details"
          type: "string"
          description: "Укажи Должника и его реквизиты. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Идентификация требования, объём уступки, проверка запрета
  # ──────────────────────────────────────────────────────────────────────────
  - id: claim_identification_check
    name: "Идентификация уступаемого права требования, объём уступки и проверка запрета (ст. 382, 384, 388, 432 ГК РФ)"
    description: >
      Фактографическая проверка точной индивидуализации требования
      (Должник + Основание + Сумма + Срок), объёма уступки (полная / частичная),
      подтверждения отсутствия запрета уступки в основном договоре.
      Без точной идентификации договор незаключён (ст. 432 ГК РФ).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право требования к"
        - "должник"
        - "основание возникновения"
        - "договор №"
        - "расписка от"
        - "сумма долга"
        - "размер требования"
        - "непогашенная задолженность"
        - "в полном объеме"
        - "частично"
        - "в части"
        - "объем передаваемых прав"
        - "запрет уступки"
        - "уступка не ограничена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право.*требования.*к.*[А-Я][а-я]+"
        - "{{ contract_number }}"
        - "{{ debt_amount }}"
        - "(?i)в\\s+полном\\s+объем"
        - "(?i)частичн[а-я]+\\s+уступк"
        - "(?i)запрет.*уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: идентификация уступаемого требования, объём уступки
        и подтверждение допустимости (отсутствие запрета).

        Нормативный ориентир:
        - ст. 432 ГК РФ — без точного предмета договор незаключён
        - ст. 384 ГК РФ — объём передаваемых прав
        - ст. 388 ГК РФ — допустимость уступки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Должник по уступаемому требованию.
        2. Что является основанием требования (договор, расписка, судебный акт — с реквизитами).
        3. Какова сумма уступаемого требования.
        4. Какой объём уступки (полный / частичный).
        5. Есть ли в договоре подтверждение отсутствия запрета уступки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

