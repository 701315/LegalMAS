          description: "Формулировка о переходе прав из договора залога."
          required: false
          display_in_grid: false
        - name: "surety_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания перехода прав из поручительства."
          required: true
        - name: "surety_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход прав из поручительства"
          description: "Формулировка о переходе прав из поручительства."
          required: false
          display_in_grid: false
        - name: "penalty_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания перехода права на неустойку."
          required: true
        - name: "penalty_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права на неустойку"
          description: "Формулировка о переходе права на неустойку."
          required: false
          display_in_grid: false
        - name: "interest_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания перехода права на проценты."
          required: true
        - name: "interest_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права на проценты"
