        <task>
        Заполни строго следующие поля:

        1. del_credere_status — "defined" если Цедент прямо принял ответственность за исполнение Должником, иначе "not_defined".
        2. del_credere_details — текст условия о делькредере.
        3. del_credere_type — "full" / "partial" / "conditional" / "not_defined".
        4. del_credere_amount_status — "defined" если размер ответственности указан, иначе "not_defined".
        5. del_credere_amount_details — размер ответственности.
        6. del_credere_conditions_status — "defined" если условия возникновения ответственности указаны, иначе "not_defined".
        7. del_credere_conditions_details — условия возникновения ответственности.
        8. del_credere_period_status — "defined" если срок предъявления требований или исполнения указан, иначе "not_defined".
        9. del_credere_period_details — такой срок.

        Если данных нет:
