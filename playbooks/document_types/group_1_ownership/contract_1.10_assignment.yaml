          label: "Будущие требования"
          description: >
            Формулировка о будущих требованиях.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "identification_criteria_status"
          type: "string"
