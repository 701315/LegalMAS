        - "требование не прекращено"
        - "цедент отвечает за недействительность"
        - "право требования принадлежит цеденту"
        - "отсутствуют основания для оспаривания"
        - "цедент подтверждает существование долга"
        - "требование не было уступлено ранее"
        - "цедент несет ответственность за пороки права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*гарантирует.*что.*передаваемое.*право.*требования.*является.*действительным.*и.*существующим"
        - "(?i)цедент.*несет.*ответственность.*за.*недействительность.*или.*отсутствие.*переданного.*требования"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор цессии.
        Проверь наличие гарантий Цедента о действительности требования (ст. 390 ГК РФ).

        Ответь строго в JSON:
        {
          "warranties_exist": "<yes / no / not_found>",
          "validity_warranty": "<yes / no / not_found>",
          "existence_warranty": "<yes / no / not_found>",
          "no_prior_assignment_warranty": "<yes / no / not_found>",
          "no_encumbrances_warranty": "<yes / no / not_found>",
          "warranty_scope": "<full / limited / not_found>",
          "warranty_snippet": "<цитата из договора или not_found>"
        }

        - "validity_warranty" — гарантия действительности требования
        - "existence_warranty" — гарантия существования долга
        - "no_prior_assignment_warranty" — гарантия отсутствия предыдущих уступок
        - "no_encumbrances_warranty" — гарантия отсутствия обременений
        - "warranty_scope": "full" — полная ответственность, "limited" — ограниченная

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цедент гарантирует"
        - "действительность требования"
        - "существование долга"
        - "ст. 390 ГК РФ"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "warranties_exist"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие гарантий цедента"
        - name: "validity_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Гарантия действительности"
        - name: "existence_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Гарантия существования"
        - name: "no_prior_assignment_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Гарантия отсутствия предыдущих уступок"
        - name: "no_encumbrances_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Гарантия отсутствия обременений"
        - name: "warranty_scope"
          type: "string"
          allowed_values: ["full", "limited", "not_found"]
          description: "Объем гарантий"
      store_payload: true

