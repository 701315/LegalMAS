        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: гарантии Цедента о требовании, защита от двойной
        уступки, ограничение ответственности за платёжеспособность Должника.

        Нормативный ориентир:
        - ст. 390 ГК РФ — ответственность Цедента

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли гарантия действительности требования.
        2. Есть ли гарантия существования требования (долг не погашен).
        3. Есть ли гарантия отсутствия предыдущих уступок.
        4. Есть ли гарантия отсутствия обременений на требование.
        5. Есть ли прямое ограничение ответственности Цедента за платёжеспособность Должника.
        6. Есть ли условие об окончательности расчётов (без права регресса).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — гарантии есть:
        Фрагмент:
        "Цедент гарантирует, что уступаемое право требования является действительным,
        существующим, ранее не уступалось и не обременено правами третьих лиц.
        Цедент не несёт ответственности за неисполнение требования Должником.
        Расчёты по настоящему договору являются окончательными."

        Ответ:
        {
          "validity_warranty_status": "defined",
          "validity_warranty_details": "уступаемое право требования является действительным",
          "existence_warranty_status": "defined",
          "existence_warranty_details": "существующим",
          "no_prior_assignment_status": "defined",
          "no_prior_assignment_details": "ранее не уступалось",
          "no_encumbrances_status": "defined",
          "no_encumbrances_details": "не обременено правами третьих лиц",
          "solvency_liability_excluded_status": "defined",
          "solvency_liability_excluded_details": "Цедент не несёт ответственности за неисполнение требования Должником",
          "final_settlement_status": "defined",
          "final_settlement_details": "расчёты являются окончательными",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Цедент гарантирует, что уступаемое право требования является действительным, существующим, ранее не уступалось и не обременено правами третьих лиц."
            }
          ]
        }

        Пример 2 — гарантий нет:
        Фрагмент:
        "Цедент уступает право требования Цессионарию."

        Ответ:
        {
          "validity_warranty_status": "not_defined",
          "validity_warranty_details": "Данные не определены",
          "existence_warranty_status": "not_defined",
          "existence_warranty_details": "Данные не определены",
          "no_prior_assignment_status": "not_defined",
          "no_prior_assignment_details": "Данные не определены",
          "no_encumbrances_status": "not_defined",
          "no_encumbrances_details": "Данные не определены",
          "solvency_liability_excluded_status": "not_defined",
          "solvency_liability_excluded_details": "Данные не определены",
          "final_settlement_status": "not_defined",
          "final_settlement_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о действительности требования.
        2. Найди прямую цитату о существовании / непогашенности долга.
        3. Найди прямую цитату об отсутствии предыдущих уступок.
        4. Найди прямую цитату об отсутствии обременений.
        5. Найди прямую цитату об ограничении ответственности за платёжеспособность.
        6. Найди прямую цитату об окончательности расчётов.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай гарантии.
        8. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "validity_warranty_status": "<defined / not_defined>",
          "validity_warranty_details": "<текст или 'Данные не определены'>",
          "existence_warranty_status": "<defined / not_defined>",
          "existence_warranty_details": "<текст или 'Данные не определены'>",
          "no_prior_assignment_status": "<defined / not_defined>",
          "no_prior_assignment_details": "<текст или 'Данные не определены'>",
          "no_encumbrances_status": "<defined / not_defined>",
          "no_encumbrances_details": "<текст или 'Данные не определены'>",
          "solvency_liability_excluded_status": "<defined / not_defined>",
          "solvency_liability_excluded_details": "<текст или 'Данные не определены'>",
          "final_settlement_status": "<defined / not_defined>",
          "final_settlement_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      context_k: 7
      max_chunks: 9
      boost_keywords:
        - "цедент гарантирует"
        - "действительность требования"
        - "не уступалось"
        - "не обременено"
        - "не отвечает за платежеспособность"
        - "окончательные расчёты"
        - "без права регресса"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "validity_warranty_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо есть гарантия действительности требования. Иначе 'not_defined'."
        - name: "validity_warranty_details"
          type: "string"
          description: "Укажи формулировку гарантии. Если данных нет, верни строго: 'Данные не определены'."
        - name: "existence_warranty_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо есть гарантия существования требования. Иначе 'not_defined'."
        - name: "existence_warranty_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "no_prior_assignment_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо указано, что требование ранее не уступалось. Иначе 'not_defined'."
        - name: "no_prior_assignment_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "no_encumbrances_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо указано отсутствие обременений на требование. Иначе 'not_defined'."
        - name: "no_encumbrances_details"
          type: "string"
