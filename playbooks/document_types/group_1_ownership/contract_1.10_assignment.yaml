      presence_signal:
        field: "debtor_consent_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        о согласии Должника на уступку: требуется ли такое согласие по основному
        договору, получено ли оно и в какой форме.
        Не анализируй уведомление Должника (это отдельная тема), цену уступки,
        обеспечительные права или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. debtor_consent_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (consent_requirement_status, consent_obtained_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - consent_requirement_status = "not_defined";
           - consent_obtained_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. consent_requirement_status:
           - "defined" — если в договоре прямо указано, что основной договор
             требует (или не требует) согласия Должника на уступку;
           - "not_defined" — если вопрос согласия Должника прямо не затронут.

        2. consent_requirement_details:
           Формулировка о необходимости/отсутствии необходимости согласия Должника.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. consent_obtained_status:
           - "defined" — если согласие Должника прямо получено и зафиксировано
             в договоре (ссылка на письмо, приложение, подписание Должником);
           - "not_defined" — если факт получения согласия прямо не подтверждён
             или согласие не требуется.

        4. consent_obtained_details:
           Реквизиты полученного согласия (номер, дата, форма).
           Fallback: "Данные не определены".

        5. consent_form_details:
           Форма согласия Должника (письменное письмо, подписание договора,
           приложение, нотариальное удостоверение и т.п.).
           Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни debtor_consent_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не путай согласие Должника на уступку с уведомлением Должника об уступке — это разные правовые институты.
        - Если в тексте прямо сказано «основной договор не содержит ограничений на уступку» —
          consent_requirement_status = "defined", consent_obtained_status = "not_defined"
          (согласие не требуется, поэтому не получается).
        - Если основной договор требует согласия, но в договоре цессии нет подтверждения
