        [ФОРМАТ ОТВЕТА]
        {
          "transfer_moment_status": "<defined / not_defined>",
          "transfer_moment_details": "<текст или 'Данные не определены'>",
          "transfer_conditions_status": "<defined / not_defined>",
          "transfer_conditions_details": "<текст или 'Данные не определены'>",
