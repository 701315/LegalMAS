      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        о форме основного договора и форме договора уступки.
        Не анализируй передачу документов, цену уступки или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. main_contract_form_status — "defined" если форма основного договора указана, иначе "not_defined".
        2. main_contract_form_details — "simple_written" / "notarized" / "registered" / "Данные не определены".
        3. assignment_form_status — "defined" если форма договора уступки указана, иначе "not_defined".
        4. assignment_form_details — "simple_written" / "notarized" / "registered" / "Данные не определены".
        5. form_match_status — "matched" / "mismatched" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - simple_written = прямо указана простая письменная форма.
        - notarized = прямо указано нотариальное удостоверение или нотариальная форма.
        - registered = прямо указано, что договор подлежит государственной регистрации или зарегистрирован.
        - form_match_status = "matched" только если обе формы прямо определены и совпадают.
        - form_match_status = "mismatched" только если обе формы прямо определены и различаются.
        - form_match_status = "not_defined" если хотя бы одна из форм не определена прямо.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "main_contract_form_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания формы основного договора."
          required: true
        - name: "main_contract_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма основного договора"
          description: "Форма основного договора."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "assignment_form_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания формы договора уступки."
          required: true
        - name: "assignment_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма договора уступки"
          description: "Форма договора уступки."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "form_match_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["matched", "mismatched", "not_defined"]
          description: "Соответствие формы уступки форме основного договора."
          required: true
      store_payload: true

  - id: claim_documents_transfer_check
    name: "Передача документов, подтверждающих уступаемое требование (ст. 385 ГК РФ)"
    description: >
