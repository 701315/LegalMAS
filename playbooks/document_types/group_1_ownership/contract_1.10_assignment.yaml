            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: partial_assignment_scope_check
    name: "Объём и границы частичной уступки (ст. 384 ГК РФ)"
    description: >
      Фактографическая проверка чёткости разграничения при частичной уступке:
      какая часть требования передаётся, какая остаётся у Цедента,
      делимость требования, порядок распределения поступлений от Должника.
      Check активируется только при наличии триггера partial_assignment.
    triggers:
      any: ["partial_assignment"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "частичная уступка"
        - "часть требования"
        - "в части"
        - "частично"
        - "из общей суммы"
        - "остаток требования"
        - "делимость"
        - "распределение поступлений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступа[ет|ется]+\\s+част[ь|ично]"
        - "(?i)в\\s+части\\s+(?:основного\\s+долга|процентов|неустойки)"
        - "(?i)из\\s+общей\\s+суммы\\s+\\d"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: объём и границы частичной уступки требования.

        Нормативный ориентир:
        - ст. 384 ГК РФ — объём переходящих прав при частичной уступке

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая часть требования уступается (по сумме / по компонентам).
        2. Что остаётся у Цедента.
        3. Есть ли подтверждение делимости требования.
        4. Есть ли порядок распределения поступлений от Должника между двумя кредиторами.
        5. Есть ли условие о приоритете при недостаточности исполнения Должником.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — объём определён:
        Фрагмент:
        "Цедент уступает Цессионарию часть права требования к ООО «Дельта» в размере
        200 000 рублей (основной долг) из общей суммы задолженности 500 000 рублей.
        Оставшаяся часть в размере 300 000 рублей сохраняется за Цедентом.
        Поступления от Должника распределяются пропорционально долям кредиторов."

        Ответ:
        {
          "partial_assignment_type": "amount_based",
          "transferred_amount_status": "defined",
          "transferred_amount_details": "200 000 рублей (основной долг)",
          "retained_by_cedent_status": "defined",
          "retained_by_cedent_details": "300 000 рублей",
          "divisibility_status": "not_defined",
          "divisibility_details": "Данные не определены",
          "proceeds_distribution_status": "defined",
          "proceeds_distribution_details": "пропорционально долям кредиторов",
          "priority_on_shortfall_status": "not_defined",
          "priority_on_shortfall_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Цедент уступает Цессионарию часть права требования к ООО «Дельта» в размере 200 000 рублей из общей суммы задолженности 500 000 рублей."
            }
          ]
        }

        Пример 2 — границы не определены:
        Фрагмент:
        "Цедент уступает часть требования Цессионарию."

        Ответ:
        {
          "partial_assignment_type": "not_defined",
          "transferred_amount_status": "not_defined",
          "transferred_amount_details": "Данные не определены",
          "retained_by_cedent_status": "not_defined",
          "retained_by_cedent_details": "Данные не определены",
          "divisibility_status": "not_defined",
          "divisibility_details": "Данные не определены",
          "proceeds_distribution_status": "not_defined",
          "proceeds_distribution_details": "Данные не определены",
          "priority_on_shortfall_status": "not_defined",
          "priority_on_shortfall_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Цедент уступает часть требования Цессионарию."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о размере / составе передаваемой части.
        2. Найди прямую цитату об остатке у Цедента.
        3. Найди прямую цитату о распределении поступлений.
        4. Найди прямую цитату о приоритете при нехватке.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "partial_assignment_type": "<amount_based / component_based / mixed / not_defined>",
          "transferred_amount_status": "<defined / not_defined>",
          "transferred_amount_details": "<текст или 'Данные не определены'>",
          "retained_by_cedent_status": "<defined / not_defined>",
          "retained_by_cedent_details": "<текст или 'Данные не определены'>",
          "divisibility_status": "<defined / not_defined>",
          "divisibility_details": "<текст или 'Данные не определены'>",
          "proceeds_distribution_status": "<defined / not_defined>",
          "proceeds_distribution_details": "<текст или 'Данные не определены'>",
          "priority_on_shortfall_status": "<defined / not_defined>",
          "priority_on_shortfall_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "частичная уступка часть требования в части из общей суммы остаток требования делимость распределение поступлений приоритет при нехватке из общей суммы задолженности остаток сохраняется за цедентом пропорционально долям"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "будущие требования"
        - "права которые возникнут"
        - "критерии определения будущих"
        - "период возникновения"
        - "механизм фиксации"
        - "делькредере"
        - "уведомление должника"
        - "обеспечительные права"
        - "акт сверки"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.65]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "partial_assignment_scope_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о частичной уступке: какая часть передаётся, что остаётся у Цедента,
        делимость требования, распределение поступлений и приоритет при нехватке исполнения.
        Не анализируй цену уступки, будущие требования, уведомление Должника или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. partial_assignment_scope_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (transferred_amount_status, retained_by_cedent_status,
              partial_assignment_type, divisibility_status,
              proceeds_distribution_status, priority_on_shortfall_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - partial_assignment_type = "not_defined";
           - transferred_amount_status = "not_defined";
           - retained_by_cedent_status = "not_defined";
           - divisibility_status = "not_defined";
           - proceeds_distribution_status = "not_defined";
           - priority_on_shortfall_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. partial_assignment_type:
           Используй только одно из значений:
           - "amount_based" — частичная уступка определена через фиксированную сумму
             (например, «200 000 рублей из общей суммы 500 000 рублей»);
           - "component_based" — частичная уступка определена через компоненты
             требования (например, «только основной долг», «только неустойка»);
           - "mixed" — уступка определена одновременно и по сумме, и по компонентам;
           - "not_defined" — тип уступки прямо не следует из текста.

        2. transferred_amount_status:
           - "defined" — если размер или состав передаваемой части требования
             прямо указан;
           - "not_defined" — если передаваемая часть прямо не определена.

        3. transferred_amount_details:
           Размер или состав передаваемой части требования.
           Fallback: "Данные не определены" / "Не удалось определить".

        4. retained_by_cedent_status:
           - "defined" — если прямо указано, какая часть требования сохраняется
             за Цедентом (размер, остаток, компоненты);
           - "not_defined" — если остаток у Цедента прямо не указан.

        5. retained_by_cedent_details:
           Какая часть сохраняется за Цедентом. Fallback: "Данные не определены".

        6. divisibility_status:
           - "defined" — если в договоре прямо подтверждена делимость требования
             (например, «требование является делимым», «уступка части не нарушает
             прав Должника»);
           - "not_defined" — если прямого подтверждения делимости нет.

        7. divisibility_details:
           Формулировка о делимости. Fallback: "Данные не определены".

        8. proceeds_distribution_status:
           - "defined" — если порядок распределения поступающих от Должника средств
             между Цедентом и Цессионарием прямо определён (пропорционально,
             в первоочередном порядке Цессионарию и т.п.);
           - "not_defined" — если порядок распределения не определён.

        9. proceeds_distribution_details:
           Порядок распределения поступлений. Fallback: "Данные не определены".

        10. priority_on_shortfall_status:
            - "defined" — если прямо определено, кто из кредиторов имеет приоритет
              при недостаточности исполнения обязательства Должником;
            - "not_defined" — если условие о приоритете отсутствует.

        11. priority_on_shortfall_details:
            Условие о приоритете при недостаточности. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни partial_assignment_scope_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", partial_assignment_type = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи делимость обязательства из его природы — только прямые формулировки текста.
        - Не выводи пропорциональность распределения из диспозитивных норм, если её нет в тексте.
        - Если в тексте есть только фраза «уступается часть требования» без указания суммы/состава —
          partial_assignment_type = "not_defined", transferred_amount_status = "not_defined",
          но presence = "present" (тема упомянута).
        - Если в разных фрагментах указаны разные размеры передаваемой части:
          transferred_amount_status → "not_defined", transferred_amount_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания частичной уступки, ни выделения долей,
           ни остатка у Цедента.
           → presence = "missing";
             все *_status = "not_defined";
             partial_assignment_type = "not_defined";
             все *_details = "Данные не определены".

        2. Частичная уступка без разграничения остатка.
           «Цедент уступает Цессионарию право требования в размере 200 000 рублей»
           из общей суммы долга, но остаток у Цедента и порядок распределения
           поступлений не урегулированы.
           → presence = "present";
             partial_assignment_type = "amount_based";
             transferred_amount_status = "defined";
             transferred_amount_details = "200 000 рублей";
             retained_by_cedent_status = proceeds_distribution_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «уступается 200 000 рублей», в другом — «уступается
           половина требования (250 000 рублей)».
           → presence = "unclear";
             transferred_amount_status = "not_defined";
             transferred_amount_details = "Не удалось определить".

        4. Отсылка на внешний график или спецификацию.
           «Размер уступаемой части определяется согласно Графику погашения
           (Приложение №1 к настоящему договору)».
           → presence = "present";
             transferred_amount_status = "defined";
             transferred_amount_details = "Определяется согласно Графику погашения (Приложение №1)";
             остальные поля — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для partial_assignment_scope_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для partial_assignment_type используй только: "amount_based", "component_based", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "partial_assignment_scope_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования частичной уступки требования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "partial_assignment_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["amount_based", "component_based", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип частичной уступки: по сумме, по компонентам или смешанный. Внутреннее enum-поле."
          required: true

        - name: "transferred_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения передаваемой части требования. Внутреннее enum-поле."
          required: true

        - name: "transferred_amount_details"
          type: "string"
          presentation: "fact"
          label: "Передаваемая часть требования"
          description: >
            Размер или состав передаваемой части требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "retained_by_cedent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания остатка, сохраняемого за Цедентом. Внутреннее enum-поле."
          required: true

        - name: "retained_by_cedent_details"
          type: "string"
          presentation: "fact"
          label: "Остаток у Цедента"
          description: >
            Какая часть требования сохраняется за Цедентом.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "divisibility_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения делимости требования. Внутреннее enum-поле."
          required: true

        - name: "divisibility_details"
          type: "string"
          presentation: "fact"
          label: "Делимость требования"
          description: >
            Формулировка о делимости требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "proceeds_distribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка распределения поступлений от Должника. Внутреннее enum-поле."
          required: true

        - name: "proceeds_distribution_details"
          type: "string"
          presentation: "fact"
          label: "Распределение поступлений"
          description: >
            Порядок распределения поступлений от Должника.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "priority_on_shortfall_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения приоритета при недостаточности исполнения. Внутреннее enum-поле."
          required: true

        - name: "priority_on_shortfall_details"
          type: "string"
          presentation: "fact"
          label: "Приоритет при недостаточности исполнения"
          description: >
            Условие о приоритете при недостаточности исполнения Должником.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: assignment_form_compliance_check
    name: "Форма основного договора и соответствие формы договора уступки (ст. 389 ГК РФ)"
    description: >
      Фактографическая проверка формы основного договора и формы договора уступки,
      а также их соответствия друг другу.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "форма основного договора"
        - "простая письменная форма"
        - "нотариальная форма"
        - "нотариальное удостоверение"
        - "государственная регистрация"
        - "подлежит регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прост(ая|ой)\\s+письменн(ая|ой)\\s+форм"
        - "(?i)нотариальн(ая|ой|ое)\\s+(форм|удостоверен)"
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)подлежит\\s+регистрац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор уступки права требования.
        Проверяется только один вопрос: форма основного договора и форма договора уступки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая форма основного договора указана.
        2. Какая форма договора уступки указана.
        3. Можно ли по тексту установить, совпадают ли эти формы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй закон вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Основной договор займа заключён в простой письменной форме.
        Настоящий договор уступки также заключён в простой письменной форме."

        Ответ:
        {
          "main_contract_form_status": "defined",
          "main_contract_form_details": "simple_written",
          "assignment_form_status": "defined",
          "assignment_form_details": "simple_written",
          "form_match_status": "matched",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Основной договор займа заключён в простой письменной форме."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Основной договор подлежал нотариальному удостоверению.
        Настоящий договор уступки составлен в простой письменной форме."

        Ответ:
        {
          "main_contract_form_status": "defined",
          "main_contract_form_details": "notarized",
          "assignment_form_status": "defined",
          "assignment_form_details": "simple_written",
          "form_match_status": "mismatched",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Основной договор подлежал нотариальному удостоверению."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли указана форма основного договора?
        2. Прямо ли указана форма договора уступки?
        3. Если обе формы определены — совпадают ли они?
        4. Если одна из форм не определена — form_match_status = "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "main_contract_form_status": "<defined / not_defined>",
          "main_contract_form_details": "<simple_written / notarized / registered / Данные не определены>",
          "assignment_form_status": "<defined / not_defined>",
          "assignment_form_details": "<simple_written / notarized / registered / Данные не определены>",
          "form_match_status": "<matched / mismatched / not_defined>",
          "evidence": [{"clause_ref":"<пункт>", "quote":"<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 450
    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "форма основного договора простая письменная форма нотариальная форма нотариальное удостоверение государственная регистрация подлежит регистрации форма договора уступки ст. 389 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "передача документов"
        - "перечень документов"
        - "акт приема-передачи"
        - "оригиналы"
        - "делькредере"
        - "уведомление должника"
        - "гарантирует действительность"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "assignment_form_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        о форме основного договора и форме договора уступки, а также
        установи их соответствие друг другу (ст. 389 ГК РФ).
        Не анализируй передачу документов, цену уступки или расторжение.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. assignment_form_compliance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (main_contract_form_status, assignment_form_status,
              form_match_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - main_contract_form_status = "not_defined";
           - assignment_form_status = "not_defined";
           - form_match_status = "not_defined";
           - main_contract_form_details, assignment_form_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. main_contract_form_status:
           - "defined" — если форма основного договора прямо указана в тексте
             (простая письменная, нотариальная, зарегистрированная);
           - "not_defined" — если форма основного договора прямо не указана.

        2. main_contract_form_details:
           User-facing значение на русском языке или код:
           - "simple_written" — если прямо указана простая письменная форма;
           - "notarized" — если прямо указано нотариальное удостоверение;
           - "registered" — если прямо указана государственная регистрация;
           - "Данные не определены" — если форма не указана;
           - "Не удалось определить" — при противоречии.

        3. assignment_form_status:
           - "defined" — если форма договора уступки прямо указана в тексте;
           - "not_defined" — если форма уступки прямо не названа.

        4. assignment_form_details:
           User-facing значение:
           - "simple_written" — простая письменная форма;
           - "notarized" — нотариальное удостоверение;
           - "registered" — государственная регистрация;
           - "Данные не определены" — если не указано;
           - "Не удалось определить" — при противоречии.

        5. form_match_status:
           Только одно из значений:
           - "matched" — если обе формы прямо определены и совпадают;
           - "mismatched" — если обе формы прямо определены и различаются
             (например, основной — нотариальный, а уступка — простая письменная);
           - "not_defined" — если хотя бы одна из форм прямо не определена в тексте.
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_form_compliance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - simple_written = прямо указана простая письменная форма.
        - notarized = прямо указано нотариальное удостоверение или нотариальная форма.
        - registered = прямо указано, что договор подлежит государственной регистрации или зарегистрирован.
        - form_match_status = "matched" только если обе формы прямо определены и совпадают.
        - form_match_status = "mismatched" только если обе формы прямо определены и различаются.
        - form_match_status = "not_defined" если хотя бы одна из форм не определена прямо.
        - Не додумывай форму договора по умолчанию из типа сделки.
        - Если в разных фрагментах указаны разные формы: статус → "not_defined",
          *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания формы основного договора, нотариального
           удостоверения, государственной регистрации или формы цессии.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Форма основного договора не упомянута.
           В тексте сказано, что «договор цессии составлен в простой письменной
           форме», но форма основного договора не названа.
           → presence = "present";
             assignment_form_status = "defined";
             assignment_form_details = "simple_written";
             main_contract_form_status = "not_defined";
             main_contract_form_details = "Данные не определены";
             form_match_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном разделе основной договор назван нотариальным, в другом —
           простым письменным.
           → presence = "unclear";
             main_contract_form_status = "not_defined";
             main_contract_form_details = "Не удалось определить";
             form_match_status = "not_defined".

        4. Прямое несовпадение форм.
           Основной договор удостоверен нотариально, а договор уступки
           заключён в простой письменной форме без нотариуса.
           → presence = "present";
             main_contract_form_status = "defined";
             main_contract_form_details = "notarized";
             assignment_form_status = "defined";
             assignment_form_details = "simple_written";
             form_match_status = "mismatched".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_form_compliance_check_presence используй только: "present", "missing", "unclear".
        - Для main_contract_form_status и assignment_form_status используй только: "defined" или "not_defined".
        - Для form_match_status используй только: "matched", "mismatched", "not_defined".
        - Fallback при отсутствии данных:
          * main_contract_form_details, assignment_form_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_form_compliance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования формы сделок в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "main_contract_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания формы основного договора. Внутреннее enum-поле."
          required: true

        - name: "main_contract_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма основного договора"
          description: >
            Форма основного договора (simple_written, notarized, registered).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "assignment_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания формы договора уступки. Внутреннее enum-поле."
          required: true

        - name: "assignment_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма договора уступки"
          description: >
            Форма договора уступки (simple_written, notarized, registered).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "form_match_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["matched", "mismatched", "not_defined"]
          display_in_grid: false
          description: "Соответствие формы уступки форме основного договора (matched / mismatched / not_defined). Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: claim_documents_transfer_check
    name: "Передача документов, подтверждающих уступаемое требование (ст. 385 ГК РФ)"
    description: >
      Фактографическая проверка наличия условий о передаче Цедентом документов,
      подтверждающих уступаемое требование: перечень документов и акт передачи.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "передать документы"
        - "оригиналы документов"
        - "подлинники"
        - "перечень документов"
        - "акт приема-передачи"
        - "акт приёма-передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*обязуется.*передать.*документ"
        - "(?i)оригинал(ы)?\\s+документ"
        - "(?i)акт\\s+(приема|приёма)-?передачи"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор уступки права требования.
        Проверяется только один вопрос: передача документов, подтверждающих требование.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о передаче документов.
        2. Есть ли перечень передаваемых документов.
        3. Есть ли акт приема-передачи документов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй закон вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Цедент обязуется передать Цессионарию оригиналы договора займа,
        расписки, акта сверки и иных документов, подтверждающих требование.
        Передача документов оформляется актом приема-передачи."

        Ответ:
        {
          "documents_transfer_status": "defined",
          "documents_transfer_details": "Цедент обязуется передать оригиналы документов, подтверждающих требование",
          "documents_list_status": "defined",
          "documents_list_details": "договор займа, расписка, акт сверки",
          "transfer_act_status": "defined",
          "transfer_act_details": "передача оформляется актом приема-передачи",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Цедент обязуется передать Цессионарию оригиналы договора займа, расписки, акта сверки и иных документов, подтверждающих требование."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Цедент уступает Цессионарию право требования."

        Ответ:
        {
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "documents_list_status": "not_defined",
          "documents_list_details": "Данные не определены",
          "transfer_act_status": "not_defined",
          "transfer_act_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли предусмотрена передача документов?
        2. Есть ли конкретный перечень документов?
        3. Есть ли условие об акте приема-передачи?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "documents_transfer_status": "<defined / not_defined>",
          "documents_transfer_details": "<текст или 'Данные не определены'>",
          "documents_list_status": "<defined / not_defined>",
          "documents_list_details": "<текст или 'Данные не определены'>",
          "transfer_act_status": "<defined / not_defined>",
          "transfer_act_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref":"<пункт>", "quote":"<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 450
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передать документы оригиналы документов подлинники перечень документов акт приема-передачи передача документов подтверждающих требование ст. 385 ГК РФ цедент обязуется передать"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "документы по залогу"
        - "документы по обеспечению"
        - "переход обеспечительных прав"
        - "форма основного договора"
        - "нотариальная форма"
        - "государственная регистрация"
        - "делькредере"
        - "уведомление должника"
        - "гарантирует действительность"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "claim_documents_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о передаче документов, подтверждающих уступаемое требование:
        само обязательство передачи, перечень документов и порядок оформления актом.
        Не анализируй форму договора, цену уступки или расторжение.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claim_documents_transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (documents_transfer_status, documents_list_status,
              transfer_act_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - documents_transfer_status = "not_defined";
           - documents_list_status = "not_defined";
           - transfer_act_status = "not_defined";
           - documents_transfer_details = "Данные не определены";
           - documents_list_details = "Данные не определены";
           - transfer_act_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. documents_transfer_status:
           - "defined" — если передача документов, подтверждающих требование,
             прямо предусмотрена договором;
           - "not_defined" — если передача прямо не предусмотрена.

        2. documents_transfer_details:
           Общее условие о передаче документов (сроки, способ, обязанное лицо).
           Fallback: "Данные не определены" / "Не удалось определить".

        3. documents_list_status:
           - "defined" — если в договоре прямо указан перечень передаваемых
             документов (например, «оригиналы договора, накладных, актов сверки»);
           - "not_defined" — если конкретного перечня документов нет.

        4. documents_list_details:
           Перечень документов, подлежащих передаче. Fallback: "Данные не определены".

        5. transfer_act_status:
           - "defined" — если передача документов прямо оформляется актом
             приёма-передачи;
           - "not_defined" — если оформление актом прямо не названо.

        6. transfer_act_details:
           Формулировка об акте приёма-передачи документов. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни claim_documents_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не объединяй список документов по требованию с документами по обеспечительным сделкам (залог, поручительство), если это разделено в тексте.
        - Если в тексте есть общая фраза «Цедент передаёт документы по требованию» без конкретизации перечня и акта:
          documents_transfer_status = "defined", но documents_list_status = transfer_act_status = "not_defined".
        - Если в разных фрагментах указаны разные перечни документов или противоречивые сроки передачи:
          documents_transfer_status → "not_defined", documents_transfer_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни слова о передаче документов, подтверждающих требование,
           перечне документов или акте передачи.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая фраза без перечня документов.
           «Цедент обязуется передать Цессионарию все имеющиеся документы,
           удостоверяющие право требования» без перечисления конкретных бумаг.
           → presence = "present";
             documents_transfer_status = "defined";
             documents_transfer_details = "Цедент обязуется передать все имеющиеся документы";
             documents_list_status = transfer_act_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «документы передаются в течение 3 дней»,
           в другом — «документы переданы до подписания настоящего договора».
           → presence = "unclear";
             documents_transfer_status = "not_defined";
             documents_transfer_details = "Не удалось определить".

        4. Отсылка к приложению.
           «Перечень передаваемых документов определён в Приложении №1 к настоящему договору».
           → presence = "present";
             documents_transfer_status = documents_list_status = "defined";
             documents_list_details = "Определён в Приложении №1 к договору";
             transfer_act_status — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claim_documents_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "claim_documents_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о передаче подтверждающих документов в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "documents_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о передаче документов. Внутреннее enum-поле."
          required: true

        - name: "documents_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Передача документов по требованию"
          description: >
            Общее условие о передаче документов, подтверждающих уступаемое требование.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "documents_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия перечня передаваемых документов. Внутреннее enum-поле."
          required: true

        - name: "documents_list_details"
          type: "string"
          presentation: "fact"
          label: "Перечень передаваемых документов"
          description: >
            Перечень документов, передаваемых Цессионарию.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия акта приема-передачи документов. Внутреннее enum-поле."
          required: true

        - name: "transfer_act_details"
          type: "string"
          presentation: "fact"
          label: "Акт приема-передачи документов"
          description: >
            Формулировка об акте приема-передачи документов.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: assignment_price_and_payment
    name: "Цена уступки, порядок и сроки оплаты (ст. 424 ГК РФ, ст. 575 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре цены уступки, её соотношения
      с номиналом долга (дисконт / паритет / премия), сроков и способов оплаты,
      последствий просрочки оплаты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цена уступки"
        - "стоимость уступки"
        - "уплачивает цеденту"
        - "срок оплаты"
        - "в течение"
        - "не позднее"
        - "банковский перевод"
        - "после подписания"
        - "рассрочка"
        - "последствия неоплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цена.*уступки.*составляет.*\\d"
        - "(?i)возмездно.*за.*{{ money_amount }}"
        - "(?i)(в\\s+течение|не\\s+позднее)\\s+\\d+\\s*(календарн|рабоч|банковск)"
        - "(?i)оплат[аыить].*цен[уы]\\s+уступки"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: цена уступки, порядок и сроки оплаты,
        последствия просрочки.

        Нормативный ориентир:
        - ст. 424 ГК РФ — цена
        - ст. 575 ГК РФ — ограничение безвозмездной передачи

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Явно ли указано, что уступка возмездная или безвозмездная.
        2. Есть ли цена уступки.
        3. Каков размер цены уступки.
        4. Каково соотношение цены с номиналом долга (равна / ниже / выше).
        5. Каков срок оплаты.
        6. Каков способ оплаты (банковский перевод / иное).
        7. Есть ли последствия просрочки оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и оплата определены:
        Фрагмент:
        "Цена уступки составляет 400 000 рублей (80% от суммы долга 500 000 рублей).
        Цессионарий обязуется оплатить цену уступки в течение 10 рабочих дней с даты
        подписания настоящего договора путём безналичного перечисления на расчётный счёт
        Цедента. В случае просрочки оплаты Цессионарий уплачивает пени в размере 0,1%
        от суммы долга за каждый день просрочки."

        Ответ:
        {
          "consideration_status": "defined",
          "consideration_type": "paid",
          "price_status": "defined",
          "price_details": "400 000 рублей",
          "price_vs_nominal_code": "below",
          "price_vs_nominal_details": "80% от суммы долга 500 000 рублей",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 10 рабочих дней с даты подписания",
          "payment_method_status": "defined",
          "payment_method_details": "безналичное перечисление на расчётный счёт Цедента",
          "late_payment_consequences_status": "defined",
          "late_payment_consequences_details": "пени 0,1% за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цена уступки составляет 400 000 рублей. Цессионарий обязуется оплатить в течение 10 рабочих дней с даты подписания договора."
            }
          ]
        }

        Пример 2 — цена не определена:
        Фрагмент:
        "Цедент уступает требование безвозмездно."

        Ответ:
        {
          "consideration_status": "defined",
          "consideration_type": "gratuitous",
          "price_status": "not_defined",
          "price_details": "Данные не определены",
          "price_vs_nominal_code": "not_defined",
          "price_vs_nominal_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "payment_method_status": "not_defined",
          "payment_method_details": "Данные не определены",
          "late_payment_consequences_status": "not_defined",
          "late_payment_consequences_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Цедент уступает требование безвозмездно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о возмездности или безвозмездности уступки.
        2. Найди прямую цитату о размере цены уступки.
        3. Найди прямую цитату о соотношении с номиналом долга.
        4. Найди прямую цитату о сроке оплаты.
        5. Найди прямую цитату о способе оплаты.
        6. Найди прямую цитату о последствиях просрочки.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай цену и сроки.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "consideration_status": "<defined / not_defined>",
          "consideration_type": "<paid / gratuitous / not_defined>",
          "price_status": "<defined / not_defined>",
          "price_details": "<текст или 'Данные не определены'>",
          "price_vs_nominal_code": "<equal / below / above / not_defined>",
          "price_vs_nominal_details": "<текст или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<текст или 'Данные не определены'>",
          "payment_method_status": "<defined / not_defined>",
          "payment_method_details": "<текст или 'Данные не определены'>",
          "late_payment_consequences_status": "<defined / not_defined>",
          "late_payment_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "цена уступки стоимость уступки уплачивает цеденту срок оплаты не позднее в течение банковский перевод после подписания рассрочка цена договора уступки возмездно безвозмездно дисконт премия номинал долга последствия неоплаты"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "сумма требования"
        - "основной долг"
        - "непогашенная задолженность"
        - "право требования к должнику"
        - "обратная уступка"
        - "возврат права требования"
        - "делькредере"
        - "гарантия платежеспособности должника"
        - "обеспечительные права"
        - "залог"
        - "поручительство"
        - "будущие требования"
        - "частичная уступка"
        - "уведомление должника"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "assignment_price_and_payment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии цену уступки,
        соотношение цены с номиналом долга, срок и способ оплаты, последствия просрочки,
        а также прямое указание на возмездность или безвозмездность уступки.
        Не анализируй форму договора, передачу документов, уведомление Должника или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. assignment_price_and_payment_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (consideration_status, consideration_type, price_status,
              price_vs_nominal_code, payment_deadline_status,
              payment_method_status, late_payment_consequences_status)
             ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - consideration_status = "not_defined";
           - consideration_type = "not_defined";
           - price_status = "not_defined";
           - price_vs_nominal_code = "not_defined";
           - payment_deadline_status = "not_defined";
           - payment_method_status = "not_defined";
           - late_payment_consequences_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. consideration_status:
           - "defined" — если в договоре прямо указано, что уступка является
             возмездной (или содержит цену) либо безвозмездной;
           - "not_defined" — если характер возмездности прямо не выражен.

        2. consideration_type:
           Используй только одно из значений:
           - "paid" — уступка прямо обозначена как возмездная или в договоре установлена цена;
           - "gratuitous" — уступка прямо обозначена как безвозмездная (в дар, без оплаты);
           - "not_defined" — характер возмездности прямо не следует из текста.

        3. price_status:
           - "defined" — если цена уступки прямо указана суммой или порядком определения;
           - "not_defined" — если цена уступки не указана или уступка безвозмездная.

        4. price_details:
           Цена уступки на русском языке (например, «400 000 рублей», «10% от фактически взысканной суммы»).
           Fallback: "Данные не определены" / "Не удалось определить".

        5. price_vs_nominal_code:
           Используй только одно из значений:
           - "equal" — цена уступки равна номинальной сумме требования;
           - "below" — цена уступки ниже номинала требования (дисконт);
           - "above" — цена уступки выше номинала требования (премия);
           - "not_defined" — соотношение прямо не следует из текста или цена не указана.

        6. price_vs_nominal_details:
           Краткое описание соотношения с номиналом (например, «дисконт 20% от суммы долга 500 000 руб.»).
           Fallback: "Данные не определены".

        7. payment_deadline_status:
           - "defined" — если срок оплаты цены уступки прямо указан;
           - "not_defined" — если срок оплаты не указан.

        8. payment_deadline_details:
           Срок оплаты. Fallback: "Данные не определены".

        9. payment_method_status:
           - "defined" — если способ оплаты прямо указан (безналичный расчёт, перевод на счёт, наличные, зачёт и т.п.);
           - "not_defined" — если способ оплаты не указан.

        10. payment_method_details:
            Способ оплаты. Fallback: "Данные не определены".

        11. late_payment_consequences_status:
            - "defined" — если в договоре прямо установлены последствия просрочки
              оплаты цены уступки (пени, проценты, право на расторжение или обратный переход);
            - "not_defined" — если прямых последствий просрочки оплаты нет.
            Важно: общая фраза об ответственности по закону — это "not_defined".

        12. late_payment_consequences_details:
            Формулировка последствий просрочки. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_price_and_payment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", consideration_type = "not_defined", price_vs_nominal_code = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Если уступка прямо названа безвозмездной — consideration_status = "defined", consideration_type = "gratuitous", price_status = "not_defined", но presence = "present".
        - price_vs_nominal_code = "equal" / "below" / "above" определяй только при наличии надёжных данных о сумме требования и цене уступки в тексте.
        - late_payment_consequences_status = "defined" только при прямом указании санкций за просрочку оплаты цены уступки Цессионарием (не путать с просрочкой исполнения Должником).
        - Если в разных фрагментах указаны разные цены уступки: price_status → "not_defined", price_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни цены уступки, ни порядка оплаты, ни упоминания возмездности/безвозмездности.
           → presence = "missing";
             все *_status = "not_defined";
             consideration_type = price_vs_nominal_code = "not_defined";
             все *_details = "Данные не определены".

        2. Безвозмездная уступка.
           «Цедент передаёт Цессионарию право требования на безвозмездной основе»
           без установления цены.
           → presence = "present";
             consideration_status = "defined";
             consideration_type = "gratuitous";
             price_status = "not_defined";
             price_details = "Данные не определены";
             price_vs_nominal_code = "not_defined";
             payment_deadline_status = payment_method_status =
             late_payment_consequences_status = "not_defined";
             все остальные *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе цена указана «400 000 рублей», в другом — «500 000 рублей».
           → presence = "unclear";
             price_status = "not_defined";
             price_details = "Не удалось определить".

        4. Отсылка на внешний график расчётов.
           «Цена уступки и график платежей определяются согласно Приложению №2».
           → presence = "present";
             price_status = "defined";
             price_details = "Определяется согласно Приложению №2 к договору";
             payment_deadline_status = "defined";
             payment_deadline_details = "Согласно Графику платежей (Приложение №2)";
             остальные поля — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_price_and_payment_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для consideration_type используй только: "paid", "gratuitous", "not_defined".
        - Для price_vs_nominal_code используй только: "equal", "below", "above", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_price_and_payment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о цене уступки и расчётах в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "consideration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус прямого указания на возмездность или безвозмездность уступки. Внутреннее enum-поле."
          required: true

        - name: "consideration_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["paid", "gratuitous", "not_defined"]
          display_in_grid: false
          description: "Тип уступки: возмездная или безвозмездная. Внутреннее enum-поле."
          required: true

        - name: "price_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания цены уступки. Внутреннее enum-поле."
          required: true

        - name: "price_details"
          type: "string"
          presentation: "fact"
          label: "Цена уступки"
          description: >
            Цена уступки.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "price_vs_nominal_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["equal", "below", "above", "not_defined"]
          display_in_grid: false
          description: "Соотношение цены уступки с номиналом долга (equal / below / above / not_defined). Внутреннее enum-поле."
          required: true

        - name: "price_vs_nominal_details"
          type: "string"
          presentation: "fact"
          label: "Соотношение цены с номиналом долга"
          description: >
            Соотношение цены уступки с номиналом долга.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока оплаты цены уступки. Внутреннее enum-поле."
          required: true

        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: >
            Срок оплаты цены уступки.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "payment_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания способа оплаты. Внутреннее enum-поле."
          required: true

        - name: "payment_method_details"
          type: "string"
          presentation: "fact"
          label: "Способ оплаты"
          description: >
            Способ оплаты цены уступки.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "late_payment_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания последствий просрочки оплаты. Внутреннее enum-поле."
          required: true

        - name: "late_payment_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия просрочки оплаты"
          description: >
            Последствия просрочки оплаты цены уступки.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: termination_and_reversal_mechanics_check
    name: "Расторжение уступки, обратная уступка и возврат цены"
    description: >
      Фактографическая проверка специальных для цессии условий расторжения:
      основания расторжения, обратная уступка права требования, возврат цены уступки
      и неустойка. Общие споры, претензионный порядок, конфиденциальность и применимое право
      покрываются global checks.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "обратная уступка"
        - "возврат права требования"
        - "возврат цены уступки"
        - "неустойка"
        - "штраф"
        - "пеня"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж[а-я]+"
        - "(?i)обратн[а-я]+\\s+уступк"
        - "(?i)возврат.*прав[ао]\\s+требован"
        - "(?i)возврат.*цен[ыа]\\s+уступки"
        - "(?i)неустойк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор уступки права требования.
        Проверяется только один вопрос: условия расторжения договора уступки,
        обратной уступки, возврата цены и неустойки.

        Важно:
        - Не анализируй претензионный порядок, подсудность, конфиденциальность
          и применимое право.
        - Они проверяются другими checks.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения.
        2. Есть ли условие об обратной уступке при расторжении.
        3. Есть ли условие о возврате цены уступки.
        4. Есть ли условие о неустойке / штрафе / пене в связи с расторжением
           или нарушением обязанностей по договору уступки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор может быть расторгнут при нарушении сроков оплаты цены уступки.
        В случае расторжения Цессионарий обязуется совершить обратную уступку
        права требования Цеденту. Цена уступки подлежит возврату в течение 5 рабочих дней.
        За нарушение этого обязательства уплачивается штраф 50 000 рублей."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "нарушение сроков оплаты цены уступки",
          "back_assignment_status": "defined",
          "back_assignment_details": "Цессионарий обязуется совершить обратную уступку права требования Цеденту",
          "price_return_status": "defined",
          "price_return_details": "цена уступки подлежит возврату в течение 5 рабочих дней",
          "penalty_status": "defined",
          "penalty_details": "штраф 50 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "В случае расторжения Цессионарий обязуется совершить обратную уступку права требования Цеденту."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны вправе прекратить договор по соглашению сторон."

        Ответ:
        {
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "back_assignment_status": "not_defined",
          "back_assignment_details": "Данные не определены",
          "price_return_status": "not_defined",
          "price_return_details": "Данные не определены",
          "penalty_status": "not_defined",
          "penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретные основания расторжения?
        2. Есть ли условие об обратной уступке?
        3. Есть ли условие о возврате цены?
        4. Есть ли неустойка, штраф или пеня?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "back_assignment_status": "<defined / not_defined>",
          "back_assignment_details": "<текст или 'Данные не определены'>",
          "price_return_status": "<defined / not_defined>",
          "price_return_details": "<текст или 'Данные не определены'>",
          "penalty_status": "<defined / not_defined>",
          "penalty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref":"<пункт>", "quote":"<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение отказ от договора обратная уступка возврат права требования возврат цены уступки неустойка штраф пеня расторжение договора уступки последствия расторжения"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "срок оплаты"
        - "банковский перевод"
        - "цена уступки как коммерческое условие"
        - "делькредере"
        - "гарантия платежеспособности"
        - "неисполнение должником"
        - "уведомление должника"
        - "обеспечительные права"
        - "залог"
        - "поручительство"
        - "будущие требования"
        - "частичная уступка"
        - "форма договора"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "termination_and_reversal_mechanics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о расторжении, обратной уступке права требования, возврате цены уступки
        и неустойке/штрафах.
        Не анализируй подсудность, претензионный порядок, конфиденциальность
        или применимое право.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_reversal_mechanics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_status, back_assignment_status,
              price_return_status, penalty_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_grounds_status = "not_defined";
           - back_assignment_status = "not_defined";
           - price_return_status = "not_defined";
           - penalty_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_grounds_status:
           - "defined" — если конкретные основания расторжения договора уступки прямо перечислены
             (например, неоплата цены уступки, непередача документов, недействительность требования);
           - "not_defined" — если конкретных оснований нет или приведена только общая фраза
             «по соглашению сторон» / «в соответствии с законодательством РФ».

        2. termination_grounds_details:
           Конкретные основания расторжения договора уступки.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. back_assignment_status:
           - "defined" — если обязанность или право совершения обратной уступки
             права требования Цеденту при расторжении/нарушении прямо предусмотрена;
           - "not_defined" — если обратная уступка прямо не названа.

        4. back_assignment_details:
           Конкретное условие об обратной уступке права требования.
           Fallback: "Данные не определены".

        5. price_return_status:
           - "defined" — если обязанность, порядок или срок возврата цены уступки
             при расторжении прямо предусмотрены договором;
           - "not_defined" — если возврат цены прямо не урегулирован.

        6. price_return_details:
           Конкретное условие о возврате цены уступки.
           Fallback: "Данные не определены".

        7. penalty_status:
           - "defined" — если прямо предусмотрена неустойка, штраф или пеня
             в связи с нарушением обязательств по договору уступки или его расторжением;
           - "not_defined" — если неустойка прямо не предусмотрена.
           Важно: общая фраза об ответственности по закону — это "not_defined".

        8. penalty_details:
           Конкретная формулировка о неустойке, штрафе или пене.
           Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_reversal_mechanics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подменяй конкретные условия расторжения общими нормами закона.
        - Общие фразы «расторжение по соглашению сторон» или «ответственность по закону» без конкретизации
          являются основанием для termination_grounds_status = "not_defined" и penalty_status = "not_defined".
        - Не извлекай претензионный порядок, подсудность, применимое право, уведомление Должника или делькредере.
        - Если в разных фрагментах указаны противоречивые условия (например, «обратная уступка обязательна»
          и «обратная уступка исключена»): статус → "not_defined", *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания расторжения, обратной уступки, возврата цены
           или неустойки по договору уступки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общие основания без специфики цессии.
           «Договор может быть расторгнут по соглашению сторон или в судебном
           порядке в соответствии с законодательством РФ».
           → presence = "present";
             все *_status = "not_defined" (нет специфических условий цессии);
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «при расторжении уплаченная цена возвращается в течение 5 дней»,
           в другом — «уплаченная цена уступки возврату не подлежит».
           → presence = "unclear";
             price_return_status = "not_defined";
             price_return_details = "Не удалось определить".

        4. Прямое исключение или отсылка к приложению.
           «Обратная уступка права требования сторонами не допускается» или
           «Порядок расторжения и реституции определён в Соглашении №1».
           → presence = "present";
             back_assignment_status = "not_defined" (при прямом запрете)
             или "defined" (при отсылке к Соглашению №1 с фиксацией формулировки в details);
             остальные поля — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_reversal_mechanics_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_reversal_mechanics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования расторжения и обратной уступки в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания оснований расторжения договора уступки. Внутреннее enum-поле."
          required: true

        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: >
            Основания расторжения договора уступки.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "back_assignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об обратной уступке. Внутреннее enum-поле."
          required: true

        - name: "back_assignment_details"
          type: "string"
          presentation: "fact"
          label: "Обратная уступка"
          description: >
            Условие об обратной уступке права требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "price_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о возврате цены уступки. Внутреннее enum-поле."
          required: true

        - name: "price_return_details"
          type: "string"
          presentation: "fact"
          label: "Возврат цены уступки"
          description: >
            Условие о возврате цены уступки при расторжении.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия неустойки / штрафа / пени. Внутреннее enum-поле."
          required: true

        - name: "penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка / штраф / пеня"
          description: >
            Условие о неустойке, штрафе или пене.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: personal_nature_prohibition_check
    name: "Запрет уступки требований, неразрывно связанных с личностью кредитора (ст. 383 ГК РФ)"
    description: >
      Фактографическая проверка отсутствия в договоре уступки требований,
      неразрывно связанных с личностью кредитора (алименты, возмещение вреда
      жизни/здоровью, требования из трудовых отношений и иные, прямо
      запрещённые ст. 383 ГК РФ). Уступка таких требований ничтожна (ст. 168 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "алименты"
        - "возмещение вреда"
        - "вред жизни"
        - "вред здоровью"
        - "трудовые отношения"
        - "заработная плата"
        - "неразрывно связано с личностью"
        - "личные требования"
        - "не подлежит уступке"
        - "запрет уступки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)алимент"
        - "(?i)возмещени[ея].*вред[ау]"
        - "(?i)вред.*жизн"
        - "(?i)трудов[а-я]+.*отношени"
        - "(?i)неразрывн.*связан.*с.*личност"
        - "(?i)не.*подлежит.*уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ.
        Проверяется только один вопрос: не содержит ли договор уступки требований,
        неразрывно связанных с личностью кредитора, уступка которых запрещена ст. 383 ГК РФ.

        Нормативный ориентир:
        - ст. 383 ГК РФ — требования, неразрывно связанные с личностью кредитора
        - ст. 168 ГК РФ — ничтожность сделки, нарушающей императивный запрет

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание, что уступаемые требования НЕ связаны с личностью кредитора.
        2. Есть ли маркеры личных требований (алименты, вред жизни/здоровью, трудовые).
        3. Каков характер уступаемого требования по описанию в договоре.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — явное исключение:
        Фрагмент:
        "Цедент подтверждает, что уступаемое право требования не связано с личностью
        кредитора и не относится к требованиям, указанным в ст. 383 ГК РФ."

        Ответ:
        {
          "explicit_exclusion_status": "defined",
          "explicit_exclusion_details": "уступаемое право требования не связано с личностью кредитора",
          "personal_nature_markers_status": "not_defined",
          "personal_nature_markers_details": "Данные не определены",
          "claim_nature_status": "defined",
          "claim_nature_details": "коммерческое требование, не связанное с личностью",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Цедент подтверждает, что уступаемое право требования не связано с личностью кредитора и не относится к требованиям, указанным в ст. 383 ГК РФ."
            }
          ]
        }

        Пример 2 — маркеры личных требований:
        Фрагмент:
        "Цедент уступает право требования к ООО «Работодатель» о взыскании
        задолженности по заработной плате за период с января по март 2024 года."

        Ответ:
        {
          "explicit_exclusion_status": "not_defined",
          "explicit_exclusion_details": "Данные не определены",
          "personal_nature_markers_status": "defined",
          "personal_nature_markers_details": "требование о взыскании задолженности по заработной плате",
          "claim_nature_status": "defined",
          "claim_nature_details": "требование из трудовых отношений (заработная плата)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Цедент уступает право требования к ООО «Работодатель» о взыскании задолженности по заработной плате за период с января по март 2024 года."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отсутствии связи с личностью кредитора.
        2. Найди маркеры личных требований (алименты, вред, трудовые).
        3. Определи характер требования по описанию.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "explicit_exclusion_status": "<defined / not_defined>",
          "explicit_exclusion_details": "<текст или 'Данные не определены'>",
          "personal_nature_markers_status": "<defined / not_defined>",
          "personal_nature_markers_details": "<текст или 'Данные не определены'>",
          "claim_nature_status": "<defined / not_defined>",
          "claim_nature_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "алименты возмещение вреда жизни здоровью трудовые отношения заработная плата неразрывно связано с личностью личные требования не подлежит уступке ст. 383 ГК РФ характер требования"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "уведомление должника"
        - "делькредере"
        - "обеспечительные права"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.50]
        boost: 0.10
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "personal_nature_prohibition_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения,
        касающиеся запрета уступки требований, неразрывно связанных с личностью
        кредитора (ст. 383 ГК РФ): прямое исключение таких требований, наличие
        маркеров личных требований и характер уступаемого требования.
        Не анализируй цену уступки, уведомление Должника, обеспечительные права или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. personal_nature_prohibition_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (explicit_exclusion_status, personal_nature_markers_status,
              claim_nature_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все три *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. explicit_exclusion_status:
           - "defined" — если в договоре прямо указано, что уступаемые требования
             не связаны с личностью кредитора и/или не относятся к требованиям,
             запрещённым ст. 383 ГК РФ (например, «Цедент подтверждает, что
             требование не носит личного характера»);
           - "not_defined" — если прямого исключения нет.

        2. explicit_exclusion_details:
           Формулировка об исключении личных требований.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. personal_nature_markers_status:
           - "defined" — если в описании уступаемого требования прямо присутствуют
             маркеры личных требований: алименты, возмещение вреда жизни/здоровью,
             требования из трудовых отношений (заработная плата, компенсация
             морального вреда и т.п.);
           - "not_defined" — если таких маркеров нет.

        4. personal_nature_markers_details:
           Описание выявленных маркеров личных требований.
           Fallback: "Данные не определены".

        5. claim_nature_status:
           - "defined" — если характер уступаемого требования прямо описан
             в договоре (коммерческое, из договора поставки, из займа и т.п.);
           - "not_defined" — если характер требования прямо не описан.

        6. claim_nature_details:
           Краткое описание характера требования.
           Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни personal_nature_prohibition_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не квалифицируй требование как «личное» по умолчанию — только при наличии прямых маркеров в тексте.
        - Маркеры личных требований: алименты, возмещение вреда жизни/здоровью,
          заработная плата, компенсация морального вреда, требования из авторских
          договоров о выплате вознаграждения автору.
        - Если в тексте есть прямое исключение личных требований и одновременно
          маркеры таких требований (противоречие): explicit_exclusion_status = "defined",
          personal_nature_markers_status = "defined", presence = "unclear".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания ст. 383, ни маркеров личных требований,
           ни описания характера требования.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Прямое исключение без маркеров.
           «Цедент гарантирует, что уступаемое требование не относится к
           требованиям, неразрывно связанным с личностью кредитора».
           → presence = "present";
             explicit_exclusion_status = "defined";
             personal_nature_markers_status = "not_defined";
             claim_nature_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «требование не носит личного характера»,
           в описании основания — «задолженность по заработной плате».
           → presence = "unclear";
             explicit_exclusion_status = "defined";
             personal_nature_markers_status = "defined";
             claim_nature_details = "Не удалось определить".

        4. Коммерческое требование с явным описанием.
           «Уступается право требования из Договора поставки №15 от 10.01.2024».
           → presence = "present";
             explicit_exclusion_status = "not_defined";
             personal_nature_markers_status = "not_defined";
             claim_nature_status = "defined";
             claim_nature_details = "коммерческое требование из договора поставки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для personal_nature_prohibition_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "personal_nature_prohibition_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования запрета личных требований в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "explicit_exclusion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус прямого исключения требований, связанных с личностью кредитора. Внутреннее enum-поле."
          required: true

        - name: "explicit_exclusion_details"
          type: "string"
          presentation: "fact"
          label: "Исключение личных требований"
          description: >
            Формулировка об исключении требований, неразрывно связанных
            с личностью кредитора.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "personal_nature_markers_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия маркеров личных требований в описании уступки. Внутреннее enum-поле."
          required: true

        - name: "personal_nature_markers_details"
          type: "string"
          presentation: "fact"
          label: "Маркеры личных требований"
          description: >
            Описание выявленных маркеров личных требований (алименты, вред, трудовые).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "claim_nature_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус описания характера уступаемого требования. Внутреннее enum-поле."
          required: true

        - name: "claim_nature_details"
          type: "string"
          presentation: "fact"
          label: "Характер требования"
          description: >
            Краткое описание характера уступаемого требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: debtor_consent_check
    name: "Согласие Должника на уступку требования (ст. 388 ч. 2 ГК РФ)"
    description: >
      Фактографическая проверка наличия в основном договоре условия о необходимости
      согласия Должника на уступку, а также факта получения такого согласия.
      Без согласия уступка оспорима (п. 11 Постановления Пленума ВС РФ № 54).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие должника"
        - "с согласия должника"
        - "должник согласен"
        - "должник не возражает"
        - "письменное согласие"
        - "уступка допускается с согласия"
        - "без согласия должника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи[ея].*должник"
        - "(?i)должник.*соглас[еи]"
        - "(?i)уступк.*допускается.*с.*согласи"
        - "(?i)без.*согласи.*должник"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ.
        Проверяется только один вопрос: требуется ли по основному договору согласие
        Должника на уступку и получено ли такое согласие.

        Нормативный ориентир:
        - ст. 388 ч. 2 ГК РФ — уступка с согласия Должника
        - п. 11 Постановления Пленума ВС РФ № 54 от 21.12.2017

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на то, что основной договор требует согласия Должника на уступку.
        2. Получено ли такое согласие и как оно оформлено.
        3. Есть ли прямое указание, что согласие Должника не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — согласие получено:
        Фрагмент:
        "Основной договор содержит условие о необходимости согласия Должника на уступку.
        Должник ООО «Гамма» выразил согласие на настоящую уступку письмом № 45
        от 15.02.2024, копия которого прилагается к настоящему договору."

        Ответ:
        {
          "consent_requirement_status": "defined",
          "consent_requirement_details": "основной договор требует согласия Должника на уступку",
          "consent_obtained_status": "defined",
          "consent_obtained_details": "письмо № 45 от 15.02.2024",
          "consent_form_details": "письменное согласие, копия прилагается к договору",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Должник ООО «Гамма» выразил согласие на настоящую уступку письмом № 45 от 15.02.2024."
            }
          ]
        }

        Пример 2 — согласие не требуется:
        Фрагмент:
        "Основной договор не содержит ограничений на уступку права требования."

        Ответ:
        {
          "consent_requirement_status": "defined",
          "consent_requirement_details": "основной договор не содержит ограничений на уступку",
          "consent_obtained_status": "not_defined",
          "consent_obtained_details": "Данные не определены",
          "consent_form_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Основной договор не содержит ограничений на уступку права требования."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о необходимости согласия Должника.
        2. Найди прямую цитату о получении согласия.
        3. Найди прямую цитату об отсутствии требования о согласии.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "consent_requirement_status": "<defined / not_defined>",
          "consent_requirement_details": "<текст или 'Данные не определены'>",
          "consent_obtained_status": "<defined / not_defined>",
          "consent_obtained_details": "<текст или 'Данные не определены'>",
          "consent_form_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
