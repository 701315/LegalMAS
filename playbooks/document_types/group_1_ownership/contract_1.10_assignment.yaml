  - id: claim_identification_check
    name: "Идентификация уступаемого права требования, объём уступки и проверка запрета (ст. 382, 384, 388, 432 ГК РФ)"
    description: >
      Фактографическая проверка точной индивидуализации требования
      (Должник + Основание + Сумма + Срок), объёма уступки (полная / частичная),
      подтверждения отсутствия запрета уступки в основном договоре.
      Без точной идентификации договор незаключён (ст. 432 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право требования к"
        - "должник"
        - "основание возникновения"
        - "договор №"
        - "расписка от"
        - "сумма долга"
        - "размер требования"
        - "непогашенная задолженность"
        - "в полном объеме"
        - "частично"
        - "в части"
        - "объем передаваемых прав"
        - "запрет уступки"
        - "уступка не ограничена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право.*требования.*к.*[А-Я][а-я]+"
        - "{{ contract_number }}"
        - "{{ debt_amount }}"
        - "(?i)в\\s+полном\\s+объем"
        - "(?i)частичн[а-я]+\\s+уступк"
        - "(?i)запрет.*уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: идентификация уступаемого требования, объём уступки
        и подтверждение допустимости (отсутствие запрета).

        Нормативный ориентир:
        - ст. 432 ГК РФ — без точного предмета договор незаключён
        - ст. 384 ГК РФ — объём передаваемых прав
        - ст. 388 ГК РФ — допустимость уступки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Должник по уступаемому требованию.
        2. Что является основанием требования (договор, расписка, судебный акт — с реквизитами).
        3. Какова сумма уступаемого требования.
        4. Какой объём уступки (полный / частичный).
        5. Есть ли в договоре подтверждение отсутствия запрета уступки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_defined", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — требование идентифицировано:
        Фрагмент:
        "Цедент уступает Цессионарию право требования к ООО «Гамма» (ИНН 7700000005),
        возникшее из Договора поставки № 15 от 10.01.2024, в размере 500 000 рублей
        (основной долг). Уступка осуществляется в полном объёме. Основной договор
        не содержит запрета на уступку."

        Ответ:
        {
          "debtor_identification_status": "defined",
          "debtor_identification_details": "ООО «Гамма», ИНН 7700000005",
          "claim_basis_status": "defined",
          "claim_basis_type": "contract",
          "claim_basis_details": "Договор поставки № 15 от 10.01.2024",
          "claim_amount_status": "defined",
          "claim_amount_details": "500 000 рублей (основной долг)",
          "assignment_scope": "full",
          "prohibition_check_status": "defined",
          "prohibition_check_details": "Основной договор не содержит запрета на уступку",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Цедент уступает Цессионарию право требования к ООО «Гамма» (ИНН 7700000005), возникшее из Договора поставки № 15 от 10.01.2024, в размере 500 000 рублей."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Цедент передаёт Цессионарию право требования к Должнику."

        Ответ:
        {
          "debtor_identification_status": "not_defined",
          "debtor_identification_details": "Данные не определены",
          "claim_basis_status": "not_defined",
          "claim_basis_type": "not_defined",
          "claim_basis_details": "Данные не определены",
          "claim_amount_status": "not_defined",
          "claim_amount_details": "Данные не определены",
          "assignment_scope": "not_defined",
          "prohibition_check_status": "not_defined",
          "prohibition_check_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Должника.
        2. Найди прямую цитату с реквизитами основания требования.
        3. Найди прямую цитату с суммой долга.
        4. Найди прямую цитату об объёме уступки.
        5. Найди прямую цитату о запрете или его отсутствии.
        6. Если прямой цитаты нет — верни "not_defined" и "Данные не определены".
        7. Не используй закон вместо текста договора.
        8. Убедись, что все значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "debtor_identification_status": "<defined / not_defined>",
          "debtor_identification_details": "<текст или 'Данные не определены'>",
          "claim_basis_status": "<defined / not_defined>",
          "claim_basis_type": "<contract / receipt / court_act / other / not_defined>",
          "claim_basis_details": "<текст или 'Данные не определены'>",
          "claim_amount_status": "<defined / not_defined>",
          "claim_amount_details": "<текст или 'Данные не определены'>",
          "assignment_scope": "<full / partial / not_defined>",
          "prohibition_check_status": "<defined / not_defined>",
          "prohibition_check_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право требования к должнику основание возникновения договор-основание расписка судебный акт сумма долга размер требования непогашенная задолженность в полном объёме частично в части объём передаваемых прав запрет уступки уступка не ограничена"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цедент цессионарий именуемый"
        - "ИНН ОГРН реквизиты"
        - "уведомление должника"
        - "гарантирует действительность"
        - "делькредере"
        - "обеспечительные права"
        - "залог"
        - "поручительство"
        - "акт сверки"
        - "встречные требования"
        - "будущие требования"
        - "передача документов подтверждающих"
        - "акт приема-передачи документов"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        об уступаемом праве требования: Должник, основание возникновения,
        сумма требования, объём уступки и проверка запрета уступки.
        Не анализируй реквизиты сторон договора цессии, цену уступки,
        уведомление Должника или обеспечительные права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. debtor_identification_status — "defined" если Должник по уступаемому требованию прямо идентифицирован, иначе "not_defined".
        2. debtor_identification_details — Должник по уступаемому требованию.
        3. claim_basis_status — "defined" если основание требования указано, иначе "not_defined".
        4. claim_basis_type — "contract" / "receipt" / "court_act" / "other" / "not_defined".
        5. claim_basis_details — реквизиты основания требования.
        6. claim_amount_status — "defined" если сумма требования прямо указана, иначе "not_defined".
        7. claim_amount_details — сумма уступаемого требования.
        8. assignment_scope — "full" / "partial" / "not_defined".
        9. prohibition_check_status — "defined" если в договоре прямо есть формулировка о запрете уступки или его отсутствии, иначе "not_defined".
        10. prohibition_check_details — текст о запрете уступки или его отсутствии.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - Основание требования — только то, из чего возникло уступаемое требование.
        - contract = договор (поставки, займа, аренды и т.п.).
        - receipt = расписка или иной документ о получении денежных средств.
        - court_act = судебный акт (решение, определение, судебный приказ).
        - other = иное прямо названное основание, не подпадающее под перечисленные.
        - full = требование уступается в полном объёме.
        - partial = требование уступается в части.
        - Не подменяй текст договора общими нормами закона.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "debtor_identification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Должника по уступаемому требованию."
          required: true
        - name: "debtor_identification_details"
          type: "string"
          presentation: "fact"
          label: "Должник по требованию"
          description: "Идентификация Должника по уступаемому требованию."
          required: false
          display_in_grid: false
        - name: "claim_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения основания возникновения требования."
          required: true
        - name: "claim_basis_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["contract", "receipt", "court_act", "other", "not_defined"]
          description: "Тип основания возникновения уступаемого требования."
          required: true
        - name: "claim_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание требования"
          description: "Реквизиты основания возникновения уступаемого требования."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "claim_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания суммы уступаемого требования."
          required: true
        - name: "claim_amount_details"
          type: "string"
          presentation: "fact"
          label: "Сумма требования"
          description: "Сумма уступаемого требования."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "assignment_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "partial", "not_defined"]
          description: "Объём уступки."
          required: true
        - name: "prohibition_check_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия в договоре условия о запрете уступки или его отсутствии."
          required: true
        - name: "prohibition_check_details"
          type: "string"
          presentation: "fact"
          label: "Запрет уступки"
          description: "Формулировка о запрете уступки или его отсутствии."
          required: false
          display_in_grid: false
      store_payload: true

  - id: cedent_warranties_check
    name: "Гарантии Цедента о действительности требования, отсутствии двойной уступки и ограничение ответственности (ст. 390 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре четырёх типов гарантий Цедента:
      (1) действительность требования, (2) его существование, (3) отсутствие предыдущих
      уступок, (4) отсутствие обременений. Также: явное ограничение ответственности
      за платежеспособность Должника и условие об окончательности расчётов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цедент гарантирует"
        - "действительность требования"
        - "право требования существует"
        - "долг не погашен"
        - "не уступалось ранее"
        - "не обременено"
        - "цедент не отвечает за платежеспособность"
        - "не несет ответственности за неисполнение"
        - "расчеты являются окончательными"
        - "без права обратного требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*гарантирует.*(?:действительн|существован)"
        - "(?i)право.*требования.*не.*уступал"
        - "(?i)цедент.*не.*несет.*ответственност.*за.*(?:неисполнение|платежеспособност)"
        - "(?i)расчеты.*(?:окончательн|без.*права.*регресс)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: гарантии Цедента о требовании, защита от двойной
        уступки, ограничение ответственности за платёжеспособность Должника.

        Нормативный ориентир:
        - ст. 390 ГК РФ — ответственность Цедента

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли гарантия действительности требования.
        2. Есть ли гарантия существования требования (долг не погашен).
        3. Есть ли гарантия отсутствия предыдущих уступок.
        4. Есть ли гарантия отсутствия обременений на требование.
        5. Есть ли прямое ограничение ответственности Цедента за платёжеспособность Должника.
        6. Есть ли условие об окончательности расчётов (без права регресса).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — гарантии есть:
        Фрагмент:
        "Цедент гарантирует, что уступаемое право требования является действительным,
        существующим, ранее не уступалось и не обременено правами третьих лиц.
        Цедент не несёт ответственности за неисполнение требования Должником.
        Расчёты по настоящему договору являются окончательными."

        Ответ:
        {
          "validity_warranty_status": "defined",
