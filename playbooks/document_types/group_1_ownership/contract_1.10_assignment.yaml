      temperature: 0.0
      max_tokens: 700

    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "уведомление должника"
        - "письменное уведомление"
        - "заказное письмо"
        - "срок уведомления"
        - "цедент обязан уведомить"
