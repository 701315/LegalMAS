      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии процедуру уведомления Должника:
        кто уведомляет, в какой срок, каким способом, в какой форме и как подтверждается получение.
        Не анализируй цену уступки, гарантии Цедента, обеспечительные права или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. notification_status — "defined" если уведомление Должника прямо предусмотрено, иначе "not_defined".
        2. notification_responsibility — "cedent" / "assignee" / "joint" / "not_defined".
        3. notification_deadline_status — "defined" если срок уведомления указан, иначе "not_defined".
        4. notification_deadline_details — срок уведомления.
        5. notification_method_status — "defined" если способ уведомления указан, иначе "not_defined".
        6. notification_method_details — способ уведомления.
        7. notification_form_status — "defined" если форма уведомления или ссылка на приложение указаны, иначе "not_defined".
        8. notification_form_details — форма уведомления.
        9. receipt_confirmation_status — "defined" если предусмотрено подтверждение получения, иначе "not_defined".
        10. receipt_confirmation_details — способ подтверждения получения уведомления.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - Не заменяй текст договора диспозитивными правилами закона.
        - cedent = обязанность уведомления лежит на Цеденте.
        - assignee = обязанность уведомления лежит на Цессионарии.
        - joint = обязанность уведомления лежит на обоих совместно.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>
      fields:
