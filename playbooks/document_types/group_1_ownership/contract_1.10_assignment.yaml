  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Делькредере
  # ──────────────────────────────────────────────────────────────────────────
  - id: del_credere_check
    name: "Ответственность Цедента за исполнение Должником — делькредере (ст. 390 ГК РФ)"
    description: >
      Фактографическая проверка: принял ли Цедент явно на себя ответственность
      за неисполнение обязательства Должником (делькредере). По умолчанию Цедент
      не отвечает за исполнение — эта ответственность возникает только при явном
      соглашении. Если делькредере есть — зафиксировать тип, объём и условия.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "делькредере"
        - "цедент отвечает за исполнение должником"
        - "гарантия платежеспособности должника"
        - "цедент принимает на себя риск неплатежа"
        - "ответственность за неисполнение требования"
        - "цедент выступает поручителем"
        - "гарантия возврата уплаченного"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*несет.*ответственность.*за.*исполнение.*должником"
        - "(?i)в.*случае.*неисполнения.*должником.*цедент.*обязан.*возместить"
        - "(?i)делькредере"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: наличие или явное отсутствие делькредере —
        ответственности Цедента за исполнение требования Должником.

        Нормативный ориентир:
        - ст. 390 ч. 1 ГК РФ — по умолчанию Цедент не отвечает за исполнение
        - ст. 390 ч. 3 ГК РФ — если принял поручительство — делькредере

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о том, что Цедент несёт ответственность за
           исполнение Должником уступленного требования.
        2. Если есть — какой тип ответственности (полная / частичная / условная).
        3. Если есть — каков размер ответственности.
        4. Если есть — при каких условиях возникает.
        5. Если есть — каков срок предъявления требований к Цеденту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не считай, что делькредере есть "по умолчанию" — только если прямо указано.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — делькредере есть:
        Фрагмент:
        "В случае неисполнения Должником уступленного требования в срок до 31.12.2024
        Цедент обязуется возместить Цессионарию уплаченную цену уступки в течение
        10 рабочих дней с момента предъявления требования."

        Ответ:
        {
          "del_credere_status": "defined",
          "del_credere_details": "Цедент обязуется возместить уплаченную цену уступки при неисполнении Должником",
          "del_credere_type": "conditional",
          "del_credere_amount_status": "defined",
          "del_credere_amount_details": "уплаченная цена уступки",
          "del_credere_conditions_status": "defined",
          "del_credere_conditions_details": "неисполнение Должником требования в срок до 31.12.2024",
          "del_credere_period_status": "defined",
          "del_credere_period_details": "10 рабочих дней с момента предъявления требования",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "В случае неисполнения Должником уступленного требования в срок до 31.12.2024 Цедент обязуется возместить Цессионарию уплаченную цену уступки в течение 10 рабочих дней."
            }
          ]
        }

        Пример 2 — делькредере нет:
        Фрагмент:
        "Цедент не несёт ответственности за исполнение уступленного требования Должником."

        Ответ:
        {
          "del_credere_status": "not_defined",
          "del_credere_details": "Цедент не несёт ответственности за исполнение требования Должником",
          "del_credere_type": "not_defined",
          "del_credere_amount_status": "not_defined",
          "del_credere_amount_details": "Данные не определены",
          "del_credere_conditions_status": "not_defined",
          "del_credere_conditions_details": "Данные не определены",
          "del_credere_period_status": "not_defined",
          "del_credere_period_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Цедент не несёт ответственности за исполнение уступленного требования Должником."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принятии Цедентом ответственности за Должника.
        2. Если такой цитаты нет — статус "not_defined". Не выводи делькредере из закона.
        3. Если есть — зафиксируй тип, размер, условие, срок строго из текста.
        4. Не используй закон вместо текста договора.
        5. Проверь соответствие всех значений допустимому словарю.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "del_credere_status": "<defined / not_defined>",
          "del_credere_details": "<текст или 'Данные не определены'>",
          "del_credere_type": "<full / partial / conditional / not_defined>",
          "del_credere_amount_status": "<defined / not_defined>",
          "del_credere_amount_details": "<текст или 'Данные не определены'>",
          "del_credere_conditions_status": "<defined / not_defined>",
          "del_credere_conditions_details": "<текст или 'Данные не определены'>",
          "del_credere_period_status": "<defined / not_defined>",
          "del_credere_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "делькредере"
        - "ответственность за исполнение"
        - "гарантия платежеспособности"
        - "неисполнение должником"
        - "возместить цессионарию"
      rerank: true

    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "del_credere_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если в договоре прямо принято делькредере. Иначе 'not_defined'."
        - name: "del_credere_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "del_credere_type"
          type: "string"
          allowed_values: ["full", "partial", "conditional", "not_defined"]
          description: "Тип делькредере. Если не определён — 'not_defined'."
        - name: "del_credere_amount_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо указан размер ответственности. Иначе 'not_defined'."
        - name: "del_credere_amount_details"
          type: "string"
          description: "Укажи размер. Если данных нет, верни строго: 'Данные не определены'."
        - name: "del_credere_conditions_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо указаны условия возникновения ответственности. Иначе 'not_defined'."
        - name: "del_credere_conditions_details"
          type: "string"
          description: "Укажи условия. Если данных нет, верни строго: 'Данные не определены'."
        - name: "del_credere_period_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо указан срок предъявления требований. Иначе 'not_defined'."
        - name: "del_credere_period_details"
          type: "string"
          description: "Укажи срок. Если данных нет, верни строго: 'Данные не определены'."
      store_payload: true

