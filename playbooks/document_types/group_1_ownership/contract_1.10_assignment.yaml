          display_in_grid: false
          description: "Статус указания подписанта Цессионария. Внутреннее enum-поле."
          required: true

        - name: "assignee_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          display_in_grid: false
          description: "Основание полномочий подписанта Цессионария. Внутреннее enum-поле."
          required: true

        - name: "debtor_details_status"
          type: "string"
