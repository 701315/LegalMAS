            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: transfer_moment_check
    name: "Момент перехода права требования к Цессионарию (ст. 382 ч. 2, ст. 389.1 ГК РФ)"
