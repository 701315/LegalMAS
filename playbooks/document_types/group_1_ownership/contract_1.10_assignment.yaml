        Фрагмент:
        "Цедент уступает Цессионарию право требования."

        Ответ:
        {
          "transfer_moment_status": "not_defined",
          "transfer_moment_details": "Данные не определены",
          "transfer_conditions_status": "not_defined",
          "transfer_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте перехода.
        2. Найди прямую цитату об условиях перехода.
        3. Если прямой цитаты нет — верни "not_defined".

