# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: claim_identification_check
    name: "Идентификация уступаемого права требования (ст. 382, 432 ГК РФ)"
    description: "Проверяет точную индивидуализацию требования. Без нее договор незаключен."
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право требования к"
        - "должник"
        - "основание возникновения"
        - "договор №"
        - "расписка от"
        - "сумма долга"
        - "размер требования"
        - "период"
        - "непогашенная задолженность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право.*требования.*к.*[А-Я][а-я]+"
        - "(?i)договор.*№.*\\d+.*от.*\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)расписка.*от.*\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)сумма.*\\d[\\d\\s]*(?:руб|₽)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор цессии.
        Проверь наличие точной идентификации уступаемого права требования (ст. 382, 432 ГК РФ).

        Ответь строго в JSON:
        {
          "identification_level": "<complete / partial / insufficient / not_found>",
          "debtor_identified": "<yes / no / not_found>",
          "debtor_name": "<ФИО/наименование или not_found>",
          "claim_basis": "<договор/расписка/судебный акт или not_found>",
          "claim_basis_details": "<реквизиты основания или not_found>",
          "claim_amount": "<сумма или not_found>",
          "claim_currency": "<валюта или not_found>",
          "identification_snippet": "<цитата из договора или not_found>"
        }

        - "complete" — полная формула: Должник + Основание + Сумма + Срок
        - "partial" — указаны не все элементы, но требование определено
        - "insufficient" — неопределенность ("долг Иванова")
        - "not_found" — требование не идентифицировано

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "право требования"
        - "должник"
        - "основание возникновения"
        - "сумма долга"
      rerank: true
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "identification_level"
          type: "string"
          allowed_values: ["complete", "partial", "insufficient", "not_found"]
          description: "Уровень идентификации требования"
        - name: "debtor_identified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Идентифицирован ли должник"
        - name: "debtor_name"
          type: "string"
          description: "Наименование/ФИО должника"
        - name: "claim_basis"
          type: "string"
          allowed_values: ["договор", "расписка", "судебный акт", "иное", "not_found"]
          description: "Основание требования"
        - name: "claim_basis_details"
          type: "string"
          description: "Реквизиты основания"
        - name: "claim_amount"
          type: "string"
          description: "Сумма требования"
        - name: "claim_currency"
          type: "string"
          description: "Валюта требования"
      store_payload: true

  - id: cedent_warranties_check
    name: "Гарантии Цедента о действительности и существовании требования (ст. 390 ГК РФ)"
    description: "Проверяет наличие гарантий отсутствия пороков права. Без них — риск покупки 'воздуха'."
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цедент гарантирует действительность"
        - "право требования существует"
