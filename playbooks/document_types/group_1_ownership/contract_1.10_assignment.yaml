        - "безвозмездно"
        - "дарение права"
        - "коммерческая организация"
      keyword_mode: "any"
      negative_keywords:
        - "возмездная уступка"
        - "цена уступки"

  - id: "documents_transfer"
    name: "Передача документов, подтверждающих право требования (ст. 385 ГК РФ)"
    description: "Проверяет наличие условий о передаче оригиналов документов"
    legal_base: "ст. 385 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "передать документы"
        - "оригиналы договоров"
        - "акты приема-передачи"
        - "расписки"
        - "решения суда"
        - "исполнительные листы"
        - "перечень передаваемых документов"
        - "в течение ___ рабочих дней"
        - "подлинники документов"
        - "акт сверки с должником"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*обязуется.*передать.*цессионарию.*следующие.*документы"
        - "(?i)передача.*документов.*оформляется.*актом.*приема.*передачи"

  - id: "limitation_of_liability_for_solvency"
    name: "Ограничение ответственности за платежеспособность Должника (ст. 390 ГК РФ)"
    description: "Проверяет наличие ограничения ответственности Цедента за исполнимость требования"
    legal_base: "ст. 390 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
