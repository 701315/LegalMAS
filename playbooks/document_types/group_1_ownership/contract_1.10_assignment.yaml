           - не выполняй остальные шаги.

        1. transfer_moment_status:
           - "defined" — если момент перехода права требования прямо определён
             в договоре (с момента подписания, с момента оплаты, с момента
             уведомления Должника, с момента регистрации и т.п.);
           - "not_defined" — если момент перехода прямо не определён
             (применяется диспозитивное правило ст. 382 ч. 2 ГК РФ).

        2. transfer_moment_details:
           Описание момента перехода. Fallback: "Данные не определены".

        3. transfer_conditions_status:
           - "defined" — если переход права обусловлен отлагательным или
             отменительным условием (оплата, одобрение, наступление события);
           - "not_defined" — если условий перехода нет.

        4. transfer_conditions_details:
           Описание условий перехода. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни transfer_moment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи момент перехода из диспозитивной нормы ст. 382 ч. 2 ГК РФ — только из текста договора.
        - Если в тексте сказано «право переходит в момент заключения настоящего договора» —
          transfer_moment_status = "defined" (это прямое указание, даже если совпадает с законом).
        - Если в разных фрагментах указаны разные моменты перехода:
          transfer_moment_status → "not_defined", transfer_moment_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания момента перехода, условий перехода
           или вступления в силу уступки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Стандартная формулировка.
           «Право требования переходит к Цессионарию с момента подписания
           настоящего договора».
           → presence = "present";
             transfer_moment_status = "defined";
             transfer_moment_details = "с момента подписания договора";
             transfer_conditions_status = "not_defined";
             transfer_conditions_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «право переходит с момента подписания»,
           в другом — «право переходит после полной оплаты цены уступки».
           → presence = "unclear";
             transfer_moment_status = "not_defined";
             transfer_moment_details = "Не удалось определить".

        4. Отлагательное условие.
           «Уступка вступает в силу после одобрения сделки советом директоров
           Цедента, но не позднее 30 дней с даты подписания».
           → presence = "present";
             transfer_moment_status = "defined";
             transfer_moment_details = "после одобрения советом директоров, не позднее 30 дней";
             transfer_conditions_status = "defined";
             transfer_conditions_details = "отлагательное условие — одобрение совета директоров".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transfer_moment_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transfer_moment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования момента перехода права. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transfer_moment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения момента перехода права требования. Внутреннее enum-поле."
          required: true

        - name: "transfer_moment_details"
          type: "string"
          presentation: "fact"
          label: "Момент перехода права"
          description: >
            Описание момента перехода права требования к Цессионарию.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "transfer_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия отлагательных/отменительных условий перехода. Внутреннее enum-поле."
          required: true

        - name: "transfer_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Условия перехода права"
          description: >
            Описание отлагательных или отменительных условий перехода права.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: misdirected_payment_risk_check
    name: "Распределение рисков исполнения Должником обязательства Цеденту после уступки (ст. 382 ч. 3, 385 ч. 2 ГК РФ)"
    description: >
      Фактографическая проверка распределения рисков на случай исполнения
      Должником обязательства Цеденту после уступки: кто несёт риск, обязан ли
      Цедент перенаправить полученные средства Цессионарию и в какой срок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исполнение цеденту"
        - "надлежащее исполнение"
        - "перечислить цессионарию"
        - "перенаправить"
        - "полученные от должника"
        - "риски исполнения"
        - "случайное исполнение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнени[ея].*цеденту"
        - "(?i)перечисл[итьяет].*цессионари"
        - "(?i)полученн[а-я]+.*от.*должник"
        - "(?i)надлежащ[ее]+.*исполнени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ.
        Проверяется только один вопрос: распределение рисков на случай исполнения
        Должником обязательства Цеденту после уступки.

        Нормативный ориентир:
        - ст. 382 ч. 3 ГК РФ — риск исполнения Цеденту до уведомления
        - ст. 385 ч. 2 ГК РФ — исполнение Цеденту до уведомления надлежащее

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт риск исполнения Должником Цеденту после уступки.
        2. Обязан ли Цедент перенаправить полученные от Должника средства Цессионарию.
        3. В какой срок Цедент обязан перенаправить средства.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — риск распределён:
        Фрагмент:
        "В случае получения Цедентом платежей от Должника после заключения настоящего
        договора Цедент обязуется перечислить полученные суммы Цессионарию в течение
        3 банковских дней с момента поступления."

        Ответ:
        {
          "risk_allocation_status": "defined",
          "risk_allocation_details": "Цедент несёт риск и обязан перенаправить платежи",
          "forwarding_obligation_status": "defined",
          "forwarding_obligation_details": "Цедент обязуется перечислить полученные суммы Цессионарию",
          "forwarding_deadline_status": "defined",
          "forwarding_deadline_details": "в течение 3 банковских дней с момента поступления",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Цедент обязуется перечислить полученные суммы Цессионарию в течение 3 банковских дней с момента поступления."
            }
          ]
        }

        Пример 2 — риск не распределён:
        Фрагмент:
        "Цедент уступает Цессионарию право требования."

        Ответ:
        {
          "risk_allocation_status": "not_defined",
          "risk_allocation_details": "Данные не определены",
          "forwarding_obligation_status": "not_defined",
          "forwarding_obligation_details": "Данные не определены",
          "forwarding_deadline_status": "not_defined",
          "forwarding_deadline_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении рисков.
        2. Найди прямую цитату об обязанности перенаправления.
        3. Найди прямую цитату о сроке перенаправления.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_allocation_status": "<defined / not_defined>",
          "risk_allocation_details": "<текст или 'Данные не определены'>",
          "forwarding_obligation_status": "<defined / not_defined>",
          "forwarding_obligation_details": "<текст или 'Данные не определены'>",
          "forwarding_deadline_status": "<defined / not_defined>",
          "forwarding_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исполнение цеденту надлежащее исполнение перечислить цессионарию перенаправить полученные от должника риски исполнения случайное исполнение после уступки"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "делькредере"
        - "обеспечительные права"
        - "будущие требования"
        - "частичная уступка"
        - "форма договора"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.10
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "misdirected_payment_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о распределении рисков исполнения Должником обязательства Цеденту
        после уступки: кто несёт риск, обязанность перенаправления и срок.
        Не анализируй уведомление Должника (это отдельная тема), цену уступки
        или обеспечительные права.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. misdirected_payment_risk_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (risk_allocation_status, forwarding_obligation_status,
              forwarding_deadline_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все три *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. risk_allocation_status:
           - "defined" — если в договоре прямо распределён риск исполнения
             Должником обязательства Цеденту после уступки (указано, кто несёт
             убытки, или Цедент обязуется не принимать исполнение);
           - "not_defined" — если распределение рисков прямо не урегулировано.

        2. risk_allocation_details:
           Формулировка о распределении рисков. Fallback: "Данные не определены".

        3. forwarding_obligation_status:
           - "defined" — если Цедент прямо обязан перечислить/перенаправить
             Цессионарию суммы, полученные от Должника после уступки;
           - "not_defined" — если такой обязанности прямо нет.

        4. forwarding_obligation_details:
           Формулировка об обязанности перенаправления. Fallback: "Данные не определены".

        5. forwarding_deadline_status:
           - "defined" — если срок перенаправления полученных средств прямо указан;
           - "not_defined" — если срок не указан или обязанность отсутствует.

        6. forwarding_deadline_details:
           Срок перенаправления. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни misdirected_payment_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи распределение рисков из диспозитивных норм ст. 382 ч. 3, 385 ч. 2 ГК РФ — только из текста договора.
        - Если в тексте есть только общая фраза «Цедент обязуется не принимать исполнение от Должника»
          без механизма перенаправления: risk_allocation_status = "defined",
          forwarding_obligation_status = "not_defined".
        - Если в разных фрагментах указаны разные сроки перенаправления:
          forwarding_deadline_status → "not_defined",
          forwarding_deadline_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания рисков исполнения Цеденту, перенаправления
           платежей или получения средств от Должника после уступки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Запрет приёма без механизма перенаправления.
           «Цедент обязуется не принимать исполнение от Должника после
           заключения настоящего договора».
           → presence = "present";
             risk_allocation_status = "defined";
             risk_allocation_details = "Цедент обязуется не принимать исполнение";
             forwarding_obligation_status = forwarding_deadline_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «Цедент перечисляет в течение 3 дней»,
           в другом — «Цедент перечисляет в течение 10 дней».
           → presence = "unclear";
             forwarding_deadline_status = "not_defined";
             forwarding_deadline_details = "Не удалось определить".

        4. Полное регулирование.
           «Все суммы, полученные Цедентом от Должника после даты уступки,
           подлежат перечислению Цессионарию в течение 1 банковского дня».
           → presence = "present";
             все *_status = "defined";
             forwarding_deadline_details = "в течение 1 банковского дня".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для misdirected_payment_risk_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "misdirected_payment_risk_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования рисков исполнения «не тому» кредитору. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения рисков исполнения Должником Цеденту. Внутреннее enum-поле."
          required: true

        - name: "risk_allocation_details"
          type: "string"
          presentation: "fact"
          label: "Распределение рисков"
          description: >
            Формулировка о распределении рисков исполнения Должником Цеденту.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "forwarding_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности Цедента перенаправить полученные средства. Внутреннее enum-поле."
          required: true

        - name: "forwarding_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Обязанность перенаправления"
          description: >
            Формулировка об обязанности Цедента перенаправить платежи Цессионарию.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "forwarding_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока перенаправления средств. Внутреннее enum-поле."
          required: true

        - name: "forwarding_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок перенаправления"
          description: >
            Срок перенаправления полученных от Должника средств Цессионарию.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: conditional_assignment_check
    name: "Условность уступки: отлагательные и отменительные условия (ст. 157 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре отлагательных или отменительных
      условий, от которых зависит возникновение или прекращение уступки.
      Условная уступка создаёт неопределённость в правовом статусе Цессионария.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отлагательное условие"
        - "отменительное условие"
        - "вступает в силу при условии"
        - "уступка прекращается если"
        - "сделка под условием"
        - "наступление обстоятельства"
        - "ст. 157 ГК РФ"
        - "безусловная уступка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отлагательн[а-я]+\\s+услови"
        - "(?i)отменительн[а-я]+\\s+услови"
        - "(?i)вступает.*в.*силу.*при.*услови"
        - "(?i)уступк[аи].*прекращается.*если"
        - "(?i)ст(?:\\.|ать[яеи])?\\s*157\\s*ГК"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ.
        Проверяется только один вопрос: наличие отлагательных или отменительных условий
        совершения уступки по ст. 157 ГК РФ.

        Нормативный ориентир:
        - ст. 157 ГК РФ — сделки, совершенные под условием

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Содержит ли договор условия, относительно которых неизвестно, наступят они или нет.
        2. Является ли условие отлагательным (права возникают при наступлении)
           или отменительным (уступка прекращается при наступлении).
        3. Определён ли срок или порядок фиксации наступления условия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отлагательное условие:
        Фрагмент:
        "Настоящая уступка вступает в силу при условии, что Должник не погасит
        задолженность перед Цедентом до 01.12.2024."

        Ответ:
        {
          "condition_presence_status": "defined",
          "condition_type": "suspensive",
          "condition_details": "уступка вступает в силу при условии непогашения Должником долга до 01.12.2024",
          "condition_term_status": "defined",
          "condition_term_details": "до 01.12.2024",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Настоящая уступка вступает в силу при условии, что Должник не погасит задолженность перед Цедентом до 01.12.2024."
            }
          ]
        }

        Пример 2 — условий нет:
        Фрагмент:
        "Настоящий договор вступает в силу с момента его подписания сторонами."

        Ответ:
        {
          "condition_presence_status": "not_defined",
          "condition_type": "not_defined",
          "condition_details": "Данные не определены",
          "condition_term_status": "not_defined",
          "condition_term_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на отлагательное или отменительное условие?
        2. Относится ли условие к обстоятельствам с неизвестным наступлением (ст. 157 ГК РФ)?
        3. Если уступка безусловна — верни "not_defined" и "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "condition_presence_status": "<defined / not_defined>",
          "condition_type": "<suspensive / resolutive / mixed / not_defined>",
          "condition_details": "<текст или 'Данные не определены'>",
          "condition_term_status": "<defined / not_defined>",
          "condition_term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отлагательное условие отменительное условие вступает в силу при условии уступка прекращается если сделка под условием наступление обстоятельства ст. 157 ГК РФ"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "цена уступки"
        - "порядок оплаты"
        - "уведомление должника"
        - "делькредере"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.10
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "conditional_assignment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        о наличии отлагательных или отменительных условий совершения уступки (ст. 157 ГК РФ).
        Не анализируй стандартный срок оплаты цены уступки или порядок уведомления Должника.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. conditional_assignment_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (condition_presence_status, condition_type, condition_term_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - condition_presence_status = "not_defined";
           - condition_type = "not_defined";
           - condition_term_status = "not_defined";
           - condition_details = "Данные не определены";
           - condition_term_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. condition_presence_status:
           - "defined" — если уступка права прямо поставлена в зависимость
             от отлагательного или отменительного условия по ст. 157 ГК РФ;
           - "not_defined" — если условность отсутствует или не определена.

        2. condition_type:
           Используй только одно из значений:
           - "suspensive" — отлагательное условие (права возникают при наступлении события);
           - "resolutive" — отменительное условие (уступка прекращается при наступлении события);
           - "mixed" — комбинация отлагательных и отменительных условий;
           - "not_defined" — условия отсутствуют или их тип не определён.

        3. condition_details:
           Конкретное описание условия по договору.
           Fallback: "Данные не определены" / "Не удалось определить".

        4. condition_term_status:
           - "defined" — если предельный срок наступления условия прямо указан;
           - "not_defined" — если срок не указан или условия отсутствуют.

        5. condition_term_details:
           Срок наступления условия. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни conditional_assignment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", condition_type = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не считай стандартную привязку вступления договора в силу к дате подписания отлагательным условием.
        - Не считай стандартное условие об оплате отлагательным условием по ст. 157 ГК РФ, если стороны прямо не сформулировали это как сделку под условием.
        - Если в тексте прямо указано «уступка является безусловной» — presence = "present", condition_presence_status = "not_defined", condition_type = "not_defined", condition_details = дословная цитата о безусловности.
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни отлагательных, ни отменительных условий, ни указания на безусловность.
           → presence = "missing";
             все *_status = "not_defined";
             condition_type = "not_defined";
             все *_details = "Данные не определены".

        2. Прямое указание на безусловность.
           «Уступка права требования по настоящему договору является безусловной
           и не зависит от наступления каких-либо событий».
           → presence = "present";
             condition_presence_status = "not_defined";
             condition_type = "not_defined";
             condition_details = "уступка является безусловной";
             condition_term_status = "not_defined";
             condition_term_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «уступка безусловна», в другом — «уступка прекращается,
           если Цедент заключит соглашение с Должником».
           → presence = "unclear";
             condition_presence_status = "not_defined";
             condition_details = "Не удалось определить".

        4. Отлагательное условие без срока.
           «Уступка вступает в силу при условии получения Цедентом банковской гарантии»
           без указания срока, в течение которого гарантия должна быть получена.
           → presence = "present";
             condition_presence_status = "defined";
             condition_type = "suspensive";
             condition_details = "при условии получения банковской гарантии";
             condition_term_status = "not_defined";
             condition_term_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для conditional_assignment_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для condition_type используй только: "suspensive", "resolutive", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "conditional_assignment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования условности уступки в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "condition_presence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия отлагательного или отменительного условия по ст. 157 ГК РФ. Внутреннее enum-поле."
          required: true

        - name: "condition_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["suspensive", "resolutive", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип условия: отлагательное (suspensive), отменительное (resolutive) или смешанное. Внутреннее enum-поле."
          required: true

        - name: "condition_details"
          type: "string"
          presentation: "fact"
          label: "Условие уступки"
          description: >
            Формулировка отлагательного или отменительного условия уступки
            (или указание на безусловный характер сделки).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "condition_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания предельного срока наступления условия. Внутреннее enum-поле."
          required: true

        - name: "condition_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок наступления условия"
          description: >
            Срок наступления отлагательного или отменительного условия.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    missing_cedent_details:
      text: >
        Просим предоставить по {doc_names} полные реквизиты Цедента:
        наименование / ФИО, ИНН, ОГРН / ОГРНИП, юридический адрес.
      addressee: "Цедент"
    missing_assignee_details:
      text: >
        Просим предоставить по {doc_names} полные реквизиты Цессионария:
        наименование / ФИО, ИНН, ОГРН / ОГРНИП, юридический адрес.
      addressee: "Цессионарий"
    missing_cedent_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Цедента: устав / доверенность / приказ о назначении.
      addressee: "Цедент"
    missing_assignee_authority:
      text: >
        Просим предоставить по {doc_names} документы, подтверждающие полномочия
        подписанта от Цессионария: устав / доверенность / приказ о назначении.
      addressee: "Цессионарий"
    missing_debtor_details:
      text: >
        Просим предоставить по {doc_names} данные о Должнике:
        наименование / ФИО, ИНН, адрес, актуальная выписка из ЕГРЮЛ / ЕГРИП
        или паспортные данные.
      addressee: "Цедент"

  claim_identification_check:
    missing_debtor_identification:
      text: >
        Просим предоставить по {doc_names} точную идентификацию Должника
        по уступаемому требованию: наименование / ФИО, ИНН, адрес.
      addressee: "Цедент"
    missing_claim_basis:
      text: >
        Просим предоставить по {doc_names} реквизиты основания требования:
        номер, дата и предмет договора / расписки / судебного акта, из которого
        возникло уступаемое право.
      addressee: "Цедент"
    missing_claim_amount:
      text: >
        Просим предоставить по {doc_names} подтверждение суммы задолженности
        с разбивкой: основной долг / проценты / неустойка. Приложить акт сверки.
      addressee: "Цедент"
    missing_assignment_scope:
      text: >
        Просим уточнить по {doc_names}: в каком объёме уступается требование —
        полностью или частично; при частичной уступке — точный размер передаваемой части.
      addressee: "Цедент"
    missing_prohibition_check:
      text: >
        Просим предоставить по {doc_names} подтверждение отсутствия запрета уступки
        в основном договоре с Должником: соответствующий пункт или извлечение из договора.
      addressee: "Цедент"

  cedent_warranties_check:
    missing_validity_warranty:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о действительности
        уступаемого права требования.
      addressee: "Юридический советник цессионария"
    missing_existence_warranty:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о существовании
        требования (долг не погашен и не прекращён).
      addressee: "Юридический советник цессионария"
    missing_no_prior_assignment:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента о том, что уступаемое
        требование ранее не уступалось третьим лицам.
      addressee: "Юридический советник цессионария"
    missing_no_encumbrances:
      text: >
        Просим включить в {doc_names} прямую гарантию Цедента об отсутствии
        обременений и прав третьих лиц на уступаемое требование.
      addressee: "Юридический советник цессионария"
    missing_solvency_exclusion:
      text: >
        Просим включить в {doc_names} явное ограничение ответственности Цедента:
        Цедент не несёт ответственности за исполнение требования Должником
        (за платёжеспособность Должника).
      addressee: "Юридический советник цессионария"
    missing_final_settlement:
      text: >
        Просим включить в {doc_names} условие об окончательности расчётов по договору
        уступки без права регресса Цессионария к Цеденту.
      addressee: "Юридический советник цессионария"

  debtor_notification_check:
    missing_notification_procedure:
      text: >
        Просим предоставить по {doc_names}: на кого возложена обязанность уведомления
        Должника об уступке — Цедента или Цессионария.
      addressee: "Юридический советник"
    missing_notification_deadline:
      text: >
        Просим уточнить по {doc_names} срок уведомления Должника об уступке
        (рекомендуется не позднее 10 рабочих дней с даты подписания договора).
      addressee: "Юридический советник"
    missing_notification_method:
      text: >
        Просим уточнить по {doc_names} способ уведомления Должника об уступке
        (рекомендуется: заказное письмо с уведомлением о вручении + курьерская доставка).
      addressee: "Юридический советник"
    missing_notification_form:
      text: >
        Просим предоставить по {doc_names} форму уведомления Должника об уступке
        (как приложение к договору) для включения в документацию.
      addressee: "Юридический советник"
    missing_receipt_confirmation:
      text: >
        Просим уточнить по {doc_names} порядок подтверждения получения Должником
        уведомления об уступке (например: уведомление о вручении, подпись на копии).
      addressee: "Юридический советник"

  accessory_rights_transfer_check:
    missing_pledge_transfer:
      text: >
        Просим уточнить по {doc_names}: переходят ли к Цессионарию права из
        договора залога, обеспечивающего уступаемое требование. Предоставить
        реквизиты договора залога.
      addressee: "Цедент"
    missing_surety_transfer:
      text: >
        Просим уточнить по {doc_names}: переходят ли к Цессионарию права по
        договору поручительства. Предоставить реквизиты договора поручительства.
      addressee: "Цедент"
    missing_penalty_transfer:
      text: >
        Просим уточнить по {doc_names}: переходит ли к Цессионарию право на
        уже начисленную неустойку по уступаемому требованию.
      addressee: "Цедент"
    missing_interest_transfer:
      text: >
        Просим уточнить по {doc_names}: переходит ли к Цессионарию право на
        начисленные проценты по уступаемому требованию.
      addressee: "Цедент"
    missing_documents_transfer:
      text: >
        Просим предоставить по {doc_names} перечень документов по обеспечению
        (договоры залога, поручительства, акты), подлежащих передаче Цессионарию.
      addressee: "Цедент"
    missing_surety_notification:
      text: >
        Просим уточнить по {doc_names} порядок уведомления поручителей и
        залогодателей о смене кредитора.
      addressee: "Юридический советник"

  debtor_setoff_counterclaim_check:
    missing_warranty_no_counterclaims:
      text: >
        Просим предоставить по {doc_names} прямое заверение Цедента об отсутствии
        у Должника встречных требований к Цеденту на дату уступки.
      addressee: "Цедент"
    missing_known_objections:
      text: >
        Просим предоставить по {doc_names} сведения о наличии / отсутствии известных
        Цеденту возражений Должника (претензии, переписка, споры).
      addressee: "Цедент"
    missing_reconciliation_act:
      text: >
        Просим предоставить по {doc_names} актуальный акт сверки взаимных расчётов
        между Цедентом и Должником, подтверждающий сумму задолженности.
      addressee: "Цедент"
    missing_compensation_clause:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли обязанность Цедента
        компенсировать потери Цессионария при обнаружении скрытых встречных требований
        Должника, не раскрытых Цедентом.
      addressee: "Юридический советник цессионария"

  del_credere_check:
    clarify_del_credere:
      text: >
        Просим уточнить по {doc_names}: принимает ли Цедент ответственность за
        исполнение уступленного требования Должником (делькредере)? Если да —
        предоставить условия: объём, размер, основания возникновения, срок
        предъявления требований к Цеденту.
      addressee: "Юридический советник"

  future_claims_check:
    missing_identification_criteria:
      text: >
        Просим предоставить по {doc_names} точные критерии определения будущих
        требований, подлежащих уступке: контрагенты, основания, суммы, категории.
      addressee: "Цедент"
    missing_future_debtor:
      text: >
        Просим уточнить по {doc_names}: кто является будущим Должником или по каким
        критериям он будет определяться.
      addressee: "Цедент"
    missing_time_period:
      text: >
        Просим уточнить по {doc_names}: в какой период должны возникнуть уступаемые
        будущие требования (дата начала — дата окончания).
      addressee: "Цедент"
    missing_fixation_mechanism:
      text: >
        Просим предоставить по {doc_names} механизм фиксации факта возникновения
        будущих требований: реестр, акт, уведомление — с указанием сроков и формы.
      addressee: "Юридический советник"

  partial_assignment_scope_check:
    missing_transferred_amount:
      text: >
        Просим уточнить по {doc_names}: какой именно размер (сумма / компоненты)
        требования передаётся Цессионарию в рамках частичной уступки.
      addressee: "Цедент"
    missing_retained_amount:
      text: >
        Просим уточнить по {doc_names}: какая часть требования сохраняется за Цедентом
        после частичной уступки.
      addressee: "Цедент"
    missing_proceeds_distribution:
      text: >
        Просим уточнить по {doc_names}: как будут распределяться поступления от Должника
        между Цедентом и Цессионарием при частичной уступке (пропорционально / по очерёдности).
      addressee: "Юридический советник"
    missing_priority_on_shortfall:
      text: >
        Просим уточнить по {doc_names}: кто из кредиторов имеет приоритет при
        недостаточности исполнения Должником — Цедент или Цессионарий.
      addressee: "Юридический советник"

  documents_and_form_compliance:
    missing_main_contract_form:
      text: >
        Просим предоставить по {doc_names} форму основного договора с Должником
        (простая письменная / нотариальная / требующая государственной регистрации)
        для проверки соответствия формы уступки (ст. 389 ГК РФ).
      addressee: "Цедент"
    missing_documents_list:
      text: >
        Просим предоставить по {doc_names} полный перечень документов, подлежащих
        передаче Цессионарию: оригинал договора-основания, акты, накладные,
        расписки, исполнительные документы (если имеются).
      addressee: "Цедент"
    missing_transfer_act:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли акт приёма-передачи
        документов от Цедента к Цессионарию и в какой срок он должен быть подписан.
      addressee: "Юридический советник"
    gratuitous_assignment_risk:
      text: >
        Внимание: по {doc_names} уступка может быть безвозмездной. Просим предоставить
        правовое обоснование допустимости безвозмездной уступки между коммерческими
        организациями (ст. 575 ГК РФ).
      addressee: "Юридический советник цессионария"

  assignment_price_and_payment:
    missing_price:
      text: >
        Просим предоставить по {doc_names} цену уступки в рублях и её соотношение
        с номиналом уступаемого долга (дисконт / паритет / премия).
      addressee: "Цедент / Цессионарий"
    missing_payment_deadline:
      text: >
        Просим уточнить по {doc_names} конкретный срок оплаты цены уступки
        (в календарных или рабочих днях с момента подписания договора).
      addressee: "Цессионарий"
    missing_payment_method:
      text: >
        Просим уточнить по {doc_names} способ оплаты цены уступки: банковский
        перевод, зачёт встречных требований или иное. Предоставить платёжные реквизиты.
      addressee: "Цедент"
    missing_late_payment_consequences:
      text: >
        Просим уточнить по {doc_names}: какие последствия предусмотрены за просрочку
        оплаты цены уступки (неустойка, право расторгнуть договор, удержание документов).
      addressee: "Юридический советник"

  termination_liability_and_disputes:
    missing_termination_grounds:
      text: >
        Просим уточнить по {doc_names} основания расторжения договора цессии
        для каждой из сторон.
      addressee: "Юридический советник"
    missing_back_assignment:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли обратная уступка права
        требования Цеденту при расторжении договора и в какой срок она должна
        быть оформлена.
      addressee: "Юридический советник"
    missing_price_return:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли возврат цены уступки
        Цессионарию при расторжении договора, в какой срок и в каком порядке.
      addressee: "Юридический советник"
    missing_penalty:
      text: >
        Просим уточнить по {doc_names}: предусмотрена ли неустойка за нарушение
        договора цессии (за просрочку оплаты, непередачу документов, недостоверные
        гарантии) — ставка и основание.
      addressee: "Юридический советник"
    missing_pretrial_procedure:
      text: >
        Просим уточнить по {doc_names}: предусмотрен ли претензионный (досудебный)
        порядок урегулирования споров и каков срок ответа на претензию.
      addressee: "Юридический советник"
    missing_dispute_forum:
      text: >
        Просим уточнить по {doc_names}: в каком суде (форуме) подлежат разрешению
        споры из договора цессии — арбитражный суд, суд общей юрисдикции, третейский суд.
      addressee: "Юридический советник"
    missing_confidentiality:
      text: >
        Просим уточнить по {doc_names}: предусмотрено ли условие о конфиденциальности
        условий договора цессии, перечень исключений и срок действия обязательства.
      addressee: "Юридический советник"
    missing_governing_law:
      text: >
        Просим уточнить по {doc_names}: какое право применяется к договору цессии
        (рекомендуется: законодательство Российской Федерации).
      addressee: "Юридический советник"

  assignment_prohibition_check:
    text: >
      КРИТИЧНО: по {doc_names} выявлен возможный запрет уступки в основном договоре.
      Просим немедленно предоставить полный текст основного договора для проверки
      раздела об уступке. При наличии запрета — письменное согласие Должника на уступку.
    addressee: "Цедент / Юридический советник"

  double_assignment_risk:
    text: >
      Просим предоставить по {doc_names} письменное заверение Цедента об отсутствии
      предыдущих уступок данного требования. Рекомендуем проверить Картотеку
      арбитражных дел на наличие споров с участием Должника.
    addressee: "Цедент / Юридический советник цессионария"

  enforcement_assignment_compliance:
    text: >
      Для {doc_names} (уступка в рамках исполнительного производства) просим
      предоставить: исполнительный документ, постановление о возбуждении ИП,
      сведения об остатке долга, порядок уведомления судебного пристава-исполнителя
      и порядок процессуальной замены взыскателя (ст. 52 ФЗ-229).
    addressee: "Цедент / Судебный пристав"

  taxation_assignment_risk:
    text: >
      Просим предоставить по {doc_names} налоговое заключение:
      (а) НДС при уступке (ст. 146, 154 НК РФ);
      (б) налог на прибыль при дисконтной уступке (ст. 279 НК РФ);
      (в) риски ТЦО при взаимозависимости сторон.
    addressee: "Налоговый консультант"

  non_monetary_claim_consent_required:
    text: >
      Внимание: {doc_names} содержит уступку неденежного требования. По ст. 388 п. 4
      ГК РФ необходимо убедиться в допустимости уступки без согласия Должника.
      Просим предоставить согласие Должника или правовое заключение о допустимости.
    addressee: "Юридический советник цессионария"

  bankruptcy_avoidance_risk:
    text: >
      Внимание: по {doc_names} выявлен банкротный контекст. Просим предоставить:
      сведения о финансовом состоянии Цедента, данные о наличии / отсутствии дел
      о банкротстве (Картотека арбитражных дел), правовое заключение о рисках
      оспаривания уступки по ст. 61.2–61.3 ФЗ-127 и обоснование рыночности цены.
    addressee: "Юридический советник цессионария"

  assignment_form_legal_requirement:
    text: >
      Внимание: основной договор по {doc_names} может требовать нотариальной формы
      или государственной регистрации. Просим подтвердить форму основного договора
      и соблюдение аналогичной формы для уступки (ст. 389 ГК РФ).
    addressee: "Юридический советник / Нотариус"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
