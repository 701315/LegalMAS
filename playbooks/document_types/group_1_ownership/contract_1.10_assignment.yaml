      keyword_mode: "any"
      regex_patterns:
        - "(?i)должник.*[А-Я][а-я]+"
        - "(?i)право.*требования.*к"

  - id: "assignment_price"
    name: "Цена уступки для возмездной цессии (ст. 424, 575 ГК РФ)"
    description: "Проверяет наличие цены уступки. Для коммерческих организаций безвозмездная уступка ограничена."
    legal_base: "ст. 424, 575 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цена уступки"
        - "стоимость уступки"
        - "сумма уступки"
        - "уплачивает цеденту"
        - "возмездная уступка"
        - "безвозмездная уступка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цена.*уступки.*составляет.*\\d"
        - "(?i)возмездно.*за.*\\d+.*рублей"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "assignment_price"
          type: "number"
          keyword_hints: ["цена уступки", "рублей"]
          unit: "RUB"
          description: "Цена уступки"
        - name: "price_vs_nominal"
          type: "string"
          allowed_values: ["equal", "below", "above", "not_specified"]
          keyword_hints: ["ниже номинала", "дисконт", "равна долгу"]
          description: "Соотношение цены и номинала"
      store_payload: true

  - id: "assignment_consideration_check"
    name: "Проверка компенсации для коммерческих организаций (ст. 575 ГК РФ)"
    description: "Безвозмездная уступка между коммерческими организациями ограничена 3000 рублями"
