type: contract_1.10_assignment
name: "Договор цессии (уступки права требования)"

description: |
  Договор, по которому первоначальный кредитор (Цедент) передает новому кредитору (Цессионарию) 
  право требовать исполнения обязательства от Должника. Один из самых "судебных" договоров 
  с колоссальными рисками: от продажи "воздуха" (несуществующего долга) до двойной продажи 
  одного и того же права. Ключевые особенности: необходимость точной индивидуализации требования, 
  обязательное уведомление должника, различие между действительностью и исполнимостью требования. 
  Регулируется Главой 24 ГК РФ.

version: 4.0
parent: class_2_modification_of_obligations

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: obligation_modification
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 24 ГК РФ (ст. 382-390)"
  doc_types_supported:
    - "договор цессии"
    - "договор уступки права требования"
    - "соглашение об уступке права требования"
    - "договор продажи долга"
    - "цессионный договор"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true


# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)договор[_\\s-]*цесс[ии]"
      - "(?i)договор[_\\s-]*уступк[иы][_\\s-]*прав[ао][_\\s-]*требован[ияи]"
      - "(?i)соглашен[иея][_\\s-]*об[_\\s-]*уступк[еи][_\\s-]*прав[ао][_\\s-]*требован[ияи]"
      - "(?i)договор[_\\s-]*продаж[ьи][_\\s-]*долг[ао]"
      - "(?i)цессионн[а-я][_\\s-]*договор"
      - "(?i)цесс[ияи]"
      - "(?i)assignment"
      - "(?i)debt[_\\s-]*sale"
      - "(?i)claim[_\\s-]*assignment"

    folder_patterns:
      - "(?i)цесс[ияи]"
      - "(?i)уступк[аи]"
      - "(?i)assignment"
      - "(?i)debt[_\\s-]*sale"
      - "(?i)claims?"

    keywords:

      high:
        - "(?i)договор[\\s\\n\\r]+цесс[ии]"
        - "(?i)цесс[иия]"
        - "(?i)цессионн[а-я\\s]+договор"
        - "(?i)договор[\\s\\n\\r]+уступк[иы]\\s+прав[ао]\\s+требован[ияи]"
        - "(?i)соглашен[иея]\\s+об\\s+уступк[еи]\\s+прав[ао]\\s+требован[ияи]"
        - "(?i)договор[\\s\\n\\r]+продаж[ьи]\\s+долг[ао]"
        - "(?i)уступк[аеи]\\s+прав[ао]\\s+требован[ияи]"
        - "(?i)передач[аи]\\s+прав[ао]\\s+требован[ияи]"
        - "(?i)прав[оа]\\s+требован[ияи]\\s+к\\s+должник[уеи]"
        - "(?i)переход\\s+прав\\s+кредитор[ауы]\\s+к\\s+нов[омуому]\\s+кредитор[уеи]"
        - "(?i)уведомлени[ея]\\s+должник[ауы]\\s+об\\s+уступк[еи]"
        - "(?i)цедент[а-я]*"
        - "(?i)цессионар[ияийю]"
        - "(?i)договор-основани[ея]\\s+(по|в\\s+силу)\\s+которого\\s+возникло\\s+право\\s+требован[ияи]"
        - "(?i)уступаемое\\s+право\\s+требован[ияи]"
        - "(?i)индивидуализаци[яи]\\s+уступаем[огоой]\\s+требован[ияи]"
        # ссылки на главу 24
        - "(?i)глава\\s*24\\s+Гражданского\\s+кодекс[аа]\\s+РФ"
        - "(?i)ст\\.?\\s*382\\s+ГК\\s*РФ"

      medium:
        - "(?i)договор-основани[ея]"
        - "(?i)дебиторск[аяое]\\s+задолженн[остьости]"
        - "(?i)объ[её]м\\s+передаваем[ыхые]\\s+прав"
        - "(?i)объ[её]м\\s+уступаем[ыхые]\\s+прав"
        - "(?i)гаранти[иия]\\s+цедент[ауы]"
        - "(?i)действительност[ьи]\\s+требован[ияи]"
        - "(?i)исполн[ениие]\\s+требован[ияи]"
        - "(?i)продаж[аы]\\s+долг[ао]"
        - "(?i)переуступк[аеи]"
        - "(?i)новый\\s+кредитор"
        - "(?i)первоначальн[ыйое]\\s+кредитор"
        - "(?i)частичн[аяое]\\s+уступк[аеи]"
        - "(?i)обеспечительн[аяое]\\s+уступк[аеи]\\s+прав\\s+требован[ияи]"
        - "(?i)ст\\.?\\s*382\\s+ГК"
        - "(?i)ст\\.?\\s*384\\s+ГК"
        - "(?i)ст\\.?\\s*385\\s+ГК"
        - "(?i)ст\\.?\\s*388\\s+ГК"
        - "(?i)ст\\.?\\s*389\\s+ГК"
        - "(?i)ст\\.?\\s*390\\s+ГК"
        - "(?i)объ[её]м\\s+уступаем[ыхые]\\s+прав"
        - "(?i)зач[её]т\\s+встречн[ыхые]\\s+требован[ийя]"
        - "(?i)оспариван[иея]\\s+договора\\s+цесс[ии]"

      low:
        - "(?i)должник"
        - "(?i)акт\\s+сверк[ии]"
        - "(?i)решен[иея]\\s+суд[аы]"
        - "(?i)исполнительн[ыйое]\\s+лист"
        - "(?i)регрессн[оеая]\\s+требован[иея]"
        - "(?i)обеспечительн[ыеые]\\s+прав[ао]"
        - "(?i)будущ[ееая]\\s+требован[иея]"
        - "(?i)залог"
        - "(?i)поручительств[оа]"

    exclusions:
      # Факторинг и финансирование под уступку (должно уходить в отдельный тип)
      - "(?i)факторинг"
      - "(?i)финансировани[ея]\\s+под\\s+уступк[уи]\\s+денежн[ыхые]\\s+требован[ийя]"
      - "(?i)договор[\\s\\n\\r]+финансировани[яи]\\s+под\\s+уступк[уи]\\s+денежн[ыхые]\\s+требован[ийя]"
      # Перевод долга / смена должника (а не кредитора)
      - "(?i)перевод\\s+долг[аа]"
      - "(?i)смен[аы]\\s+должник[аа]"
      - "(?i)новый\\s+должник"
      # Новация / прекращение обязательства
      - "(?i)новаци[яи]"
      - "(?i)прекращен[иие]\\s+обязательств[ао]"
      # Залог права требования
      - "(?i)договор[\\s\\n\\r]+залог[аа]\\s+прав[ао]\\s+требован[ияи]"
      - "(?i)залог\\s+дебиторск[ойой]\\s+задолженн[остиости]"
      # Суброгация, переход прав по закону, универсальное правопреемство
      - "(?i)суброгаци[яи]"
      - "(?i)переход\\s+прав\\s+в\\s+силу\\s+закона"
      - "(?i)универсальн[оеая]\\s+правопреемств[оа]"
      - "(?i)реорганизаци[яи]"
      - "(?i)наследовани[ея]"


# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  assignment_contract:
    any_keywords:
      - "цессия"
      - "уступка права требования"
      - "передача права требования"
      - "цедент"
      - "цессионарий"

  monetary_claim:
    any_keywords:
      - "денежное требование"
      - "сумма долга"
      - "рублей"
      - "основной долг"
      - "проценты"
      - "неустойка"

  non_monetary_claim:
    any_keywords:
      - "неденежное требование"
      - "передача имущества"
      - "выполнение работ"
      - "оказание услуг"

  future_claim:
    any_keywords:
      - "будущее требование"
      - "возникнет в будущем"
      - "права, которые возникнут"
      - "ожидаемые требования"
      - "будут заключены"

  existing_claim:
    any_keywords:
      - "существующее требование"
      - "возникло из договора"
      - "текущая задолженность"
      - "непогашенный долг"

  enforcement_proceeding:
    any_keywords:
      - "исполнительный лист"
      - "исполнительное производство"
      - "судебный пристав"
      - "взыскание"
      - "исполнительный документ"

  del_credere:
    any_keywords:
      - "делькредере"
      - "цедент отвечает за исполнение"
      - "гарантия платежеспособности"
      - "риск неплатежа"
      - "поручительство цедента"

  discounted_assignment:
    any_keywords:
      - "дисконт"
      - "уступка ниже номинала"
      - "цена ниже долга"
      - "продажа со скидкой"
      - "уцененный долг"

  multiple_debtors:
    any_keywords:
      - "несколько должников"
      - "множественность должников"
      - "солидарные должники"
      - "несколько дебиторов"

  partial_assignment:
    any_keywords:
      - "частичная уступка"
      - "часть требования"
      - "в части"
      - "частично передает"
      - "часть долга"
      - "из общей суммы"

  bankruptcy_context:
    any_keywords:
      - "банкротство"
      - "несостоятельность"
      - "конкурсное производство"
      - "конкурсный управляющий"
      - "наблюдение"
      - "внешнее управление"
      - "реестр кредиторов"
      - "арбитражный управляющий"
      - "ФЗ-127"

  legal_entity_parties:
    any_keywords:
      - "ООО"
      - "АО"
      - "ПАО"
      - "ИНН"
      - "ОГРН"
      - "юридическое лицо"
      - "общество"
      - "коммерческая организация"

  registered_main_contract:
    any_keywords:
      - "нотариально удостоверенный"
      - "нотариальная форма"
      - "государственная регистрация"
      - "зарегистрирован в Росреестре"
      - "подлежит регистрации"
      - "нотариальный договор"

  consumer_debtor:
    any_keywords:
      - "потребительский кредит"
      - "потребительский займ"
      - "физическое лицо-заемщик"
      - "кредитный договор с физическим лицом"
      - "потребитель"
      - "микрозайм"
      - "МФО"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\d{1,3}(?:[.,]\\d{1,2})?\\s*%"
  contract_number: "(?i)(?:договор|соглашение|расписка).*?№?\\s*\\d+[\\w\\-/]*\\s*от\\s*\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
  debt_amount: "(?i)(?:сумма|размер).*?долга.*?\\d[\\d\\s]*(?:руб|₽)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "assignment_prohibition_check"
    name: "Запрет уступки в основном договоре (ст. 388 ГК РФ)"
    description: "Если основной договор с Должником содержит запрет на уступку права требования, уступка является недействительной"
    legal_base: "ст. 388 ГК РФ"
    required_triggers: ["assignment_contract"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "запрещена уступка"
        - "уступка не допускается"
        - "требуется согласие должника"
        - "передача права требования запрещена"
        - "цессия не разрешена"
      keyword_mode: "any"
      negative_keywords:
        - "отсутствие запрета"
        - "уступка разрешена"
        - "запрет на уступку отсутствует"
        - "цедент гарантирует отсутствие ограничений"
        - "основной договор не содержит запрета"
        - "не содержит ограничений на уступку"
        - "допускается без согласия"
        - "уступка не ограничена"
    retrieval:
      context_k: 5
      boost_keywords:
        - "запрет уступки"
        - "согласие должника"
        - "ограничение уступки"
      rerank: true

  - id: "double_assignment_risk"
    name: "Риск двойной уступки одного требования (ст. 388.1 ГК РФ)"
    description: "Цедент может уступить одно и то же требование нескольким Цессионариям. Приоритет определяется моментом уведомления Должника"
    legal_base: "ст. 388.1 ГК РФ"
    required_triggers: ["assignment_contract"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "требование не уступалось ранее"
        - "отсутствие предыдущих уступок"
        - "первичность уступки"
        - "не обременено правами третьих лиц"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "двойная уступка"
        - "предыдущая уступка"
        - "конкурирующие права"
      rerank: true

  - id: "enforcement_assignment_compliance"
    name: "Особенности уступки в исполнительном производстве (ФЗ-229)"
    description: "Уступка взыскателем исполнительного документа требует уведомления судебного пристава и изменения взыскателя в производстве"
    legal_base: "ФЗ-229 «Об исполнительном производстве» ст. 52"
    required_triggers: ["enforcement_proceeding", "assignment_contract"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "исполнительный документ"
        - "исполнительное производство"
        - "судебный пристав"
        - "изменение взыскателя"
        - "уведомление пристава"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "исполнительный лист"
        - "пристав"
        - "взыскатель"
      rerank: true

  - id: "taxation_assignment_risk"
    name: "Налоговые риски при уступке права требования (НК РФ ст. 279)"
    description: "При уступке права требования по дисконтированной цене возникают налоговые последствия по НДС и налогу на прибыль"
    legal_base: "НК РФ ст. 279, ст. 146, ст. 154"
    required_triggers: ["assignment_contract", "discounted_assignment"]
    severity: "medium"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "налоговые последствия"
        - "НДС при уступке"
        - "обложение уступки"
        - "налоговый учет"
        - "доходы от уступки"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "НДС"
        - "налог на прибыль"
        - "ст. 279 НК РФ"
      rerank: true
        - "цедент гарантирует отсутствие ограничений"
        - "основной договор не содержит запрета"
        - "не содержит ограничений на уступку"
        - "допускается без согласия"
        - "уступка не ограничена"

  - id: "non_monetary_claim_consent_required"
    name: "Согласие должника при уступке неденежного требования (ст. 388 п. 4 ГК РФ)"
    description: >
      Уступка неденежного требования допускается только при условии, что она не делает
      исполнение значительно более обременительным для должника. Если уступка существенно
      затрагивает интересы должника, требуется его согласие. Нарушение может повлечь
      недействительность уступки.
    legal_base: "ст. 388 п. 2, п. 4 ГК РФ"
    required_triggers: ["non_monetary_claim"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "согласие должника"
        - "уведомление должника о неденежной уступке"
        - "неденежное требование"
        - "исполнение не становится обременительным"
        - "личность кредитора имеет значение"
      keyword_mode: "any"
      negative_keywords:
        - "денежное требование"
        - "денежный долг"
    retrieval:
      context_k: 5
      boost_keywords:
        - "согласие должника"
        - "неденежное требование"
        - "ст. 388 ГК"
        - "обременительность исполнения"
      rerank: true

  - id: "bankruptcy_avoidance_risk"
    name: "Риск оспаривания уступки в банкротстве цедента (ст. 61.2–61.3 ФЗ-127)"
    description: >
      Уступка, совершённая в период подозрительности (до 3 лет до принятия заявления
      о банкротстве цедента), может быть оспорена как подозрительная сделка или
      как сделка с предпочтением. Уступка ниже номинала — повышенный риск.
    legal_base: "ст. 61.2, 61.3 ФЗ-127 «О несостоятельности (банкротстве)»"
    required_triggers: ["bankruptcy_context"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "период подозрительности"
        - "конкурсный управляющий"
        - "оспаривание сделки"
        - "подозрительная сделка"
        - "предпочтение"
        - "арбитражный управляющий"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "банкротство цедента"
        - "оспаривание уступки"
        - "период подозрительности"
        - "ст. 61.2 ФЗ-127"
      rerank: true

  - id: "assignment_form_legal_requirement"
    name: "Форма уступки должна соответствовать форме основного договора (ст. 389 ГК РФ)"
    description: >
      Если основной договор совершён в нотариальной форме, уступка также подлежит
      нотариальному удостоверению. Если основной договор подлежал государственной
      регистрации, уступка также подлежит регистрации. Несоблюдение формы может
      повлечь недействительность или незаключённость уступки.
    legal_base: "ст. 389 ГК РФ"
    required_triggers: ["registered_main_contract"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "нотариальная форма"
        - "нотариальное удостоверение"
        - "государственная регистрация уступки"
        - "регистрация перехода права"
        - "удостоверено нотариусом"
        - "форма уступки"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
