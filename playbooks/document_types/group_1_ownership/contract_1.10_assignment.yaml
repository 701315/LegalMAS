    name: "Возражения и зачёт должника против нового кредитора (ст. 386, 412 ГК РФ)"
    description: >
      Проверяет, урегулирован ли риск того, что должник может заявить новому кредитору
      все возражения и встречные требования, которые он имел к первоначальному кредитору
      на момент получения уведомления об уступке, включая право на зачёт.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возражения должника"
        - "зачет встречных требований"
        - "зачет"
        - "встречное требование"
        - "возражение против требования"
        - "право должника на зачёт"
        - "ст. 386"
        - "ст. 412"
        - "контртребование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возражени(я|й).*должник"
        - "(?i)зачет.*встречн"
        - "(?i)должник.*вправе.*заяв(ить|лять)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор цессии.
        Проверь, урегулирован ли риск возражений и зачёта со стороны Должника
        против нового кредитора (ст. 386, 412 ГК РФ).

        Ответь строго в JSON:
        {
          "debtor_objections_addressed": "<yes / no / partial / not_found>",
          "setoff_risk_addressed": "<yes / no / not_found>",
          "cedent_warranty_no_counterclaims": "<yes / no / not_found>",
          "known_debtor_objections_disclosed": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "debtor_objections_addressed" — упомянуты ли возражения должника
        - "setoff_risk_addressed" — урегулирован ли риск зачёта
        - "cedent_warranty_no_counterclaims" — есть ли гарантия отсутствия встречных требований
        - "known_debtor_objections_disclosed" — раскрыты ли известные возражения

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "возражения должника"
        - "зачет"
        - "встречное требование"
        - "ст. 386 ГК"
        - "ст. 412 ГК"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "debtor_objections_addressed"
          type: "string"
          allowed_values: ["yes", "no", "partial", "not_found"]
          description: "Урегулированы ли возражения должника"
        - name: "setoff_risk_addressed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Урегулирован ли риск зачёта"
        - name: "cedent_warranty_no_counterclaims"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Гарантия отсутствия встречных требований"
      store_payload: true

  - id: partial_assignment_scope_check
    name: "Объём и границы частичной уступки (ст. 384 ГК РФ)"
    description: >
      При частичной уступке проверяет чёткость разграничения: какая часть требования
      передаётся, какая остаётся у цедента; взаимодействие двух кредиторов
      с одним должником; делимость требования; порядок распределения поступлений.
    triggers:
      any: ["partial_assignment"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "частичная уступка"
        - "часть требования"
        - "в части"
        - "частично"
        - "из общей суммы"
        - "в размере"
        - "остаток требования"
        - "делимость"
        - "разделение требования"
        - "распределение поступлений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступа(ет|ется)\\s+част(ь|ично)"
        - "(?i)в\\s+части\\s+(?:основного\\s+долга|процентов|неустойки)"
        - "(?i)из\\s+общей\\s+суммы\\s+\\d"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор частичной цессии.
        Проверь чёткость определения объёма частичной уступки (ст. 384 ГК РФ).

        Ответь строго в JSON:
        {
          "partial_assignment_type": "<amount_based / component_based / mixed / not_found>",
          "transferred_amount": "<сумма/описание или not_found>",
          "retained_by_cedent": "<сумма/описание или not_found>",
          "divisibility_confirmed": "<yes / no / unclear / not_found>",
          "proceeds_distribution": "<described / not_found>",
          "interaction_of_creditors": "<described / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "amount_based" — разделение по сумме
        - "component_based" — разделение по компонентам (основной долг / проценты / неустойка)
        - "mixed" — комбинированное

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "частичная уступка"
        - "часть требования"
        - "остаток требования"
        - "распределение"
        - "ст. 384 ГК"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "partial_assignment_type"
          type: "string"
          allowed_values: ["amount_based", "component_based", "mixed", "not_found"]
          description: "Тип частичной уступки"
        - name: "divisibility_confirmed"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Подтверждена ли делимость требования"
        - name: "proceeds_distribution"
          type: "string"
          allowed_values: ["described", "not_found"]
          description: "Описан ли порядок распределения поступлений"
      store_payload: true

  - id: assignment_form_compliance_check
    name: "Форма договора уступки: соответствие форме основного договора (ст. 389 ГК РФ)"
    description: >
      Проверяет, соответствует ли форма договора уступки форме основного договора.
      Нотариальный основной договор → нотариальная уступка.
      Регистрируемый основной договор → регистрация уступки.
    triggers:
      any: ["registered_main_contract"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "нотариальная форма"
        - "нотариальное удостоверение"
        - "государственная регистрация"
        - "регистрация уступки"
        - "Росреестр"
        - "форма основного договора"
        - "форма уступки"
        - "удостоверена нотариусом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нотариальн(ое|ой|ая)\\s+(удостоверен|форм)"
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)подлежит.*регистрац"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор цессии.
        Проверь соответствие формы уступки форме основного договора (ст. 389 ГК РФ).

        Ответь строго в JSON:
        {
          "main_contract_form": "<simple_written / notarized / registered / unclear / not_found>",
          "assignment_form": "<simple_written / notarized / registered / unclear / not_found>",
          "form_match_status": "<matched / mismatched / unclear / not_found>",
          "registration_required": "<yes / no / unclear / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        - "simple_written" — простая письменная форма
        - "notarized" — нотариальная форма
        - "registered" — подлежит государственной регистрации
        - "matched" — формы совпадают
        - "mismatched" — формы не совпадают (критический риск)

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "нотариальная форма"
        - "государственная регистрация"
        - "форма основного договора"
        - "ст. 389 ГК"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "main_contract_form"
          type: "string"
          allowed_values: ["simple_written", "notarized", "registered", "unclear", "not_found"]
          description: "Форма основного договора"
        - name: "assignment_form"
          type: "string"
          allowed_values: ["simple_written", "notarized", "registered", "unclear", "not_found"]
          description: "Форма договора уступки"
        - name: "form_match_status"
          type: "string"
          allowed_values: ["matched", "mismatched", "unclear", "not_found"]
          description: "Соответствие форм"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора: Цедент и Цессионарий"
    description: "Проверяет наличие и достаточность идентификации сторон"
    legal_base: "ст. 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цедент"
        - "цессионарий"
        - "новый кредитор"
        - "первоначальный кредитор"
        - "ООО"
        - "АО"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*именуем"
        - "(?i)цессионарий.*именуем"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "cedent_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин"]
          description: "Тип цедента"
