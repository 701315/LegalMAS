        - name: "documents_list_details"
          type: "string"
          description: "Укажи перечень. Если данных нет, верни строго: 'Данные не определены'."
        - name: "transfer_act_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если прямо предусмотрен акт приёма-передачи документов. Иначе 'not_defined'."
        - name: "transfer_act_details"
          type: "string"
          description: "Укажи формулировку. Если данных нет, верни строго: 'Данные не определены'."
        - name: "consideration_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если возмездность / безвозмездность прямо указана. Иначе 'not_defined'."
        - name: "consideration_type"
          type: "string"
          allowed_values: ["paid", "gratuitous", "not_defined"]
          description: "Тип уступки: paid / gratuitous. Если не указано — 'not_defined'."
