        <task>
        Заполни строго следующие поля:

        1. documents_transfer_status — "defined" если передача документов предусмотрена, иначе "not_defined".
        2. documents_transfer_details — общее условие о передаче документов.
        3. documents_list_status — "defined" если перечень документов указан, иначе "not_defined".
        4. documents_list_details — перечень документов.
