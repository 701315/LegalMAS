        - "делькредере"
        - "обеспечительные права"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.50]
        boost: 0.12
        scope: segment
