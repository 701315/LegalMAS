          description: "Статус наличия акта сверки с Должником. Внутреннее enum-поле."
          required: true

        - name: "reconciliation_act_details"
          type: "string"
          presentation: "fact"
          label: "Акт сверки с Должником"
          description: >
            Формулировка об акте сверки с Должником.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "compensation_on_hidden_claims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о компенсации при скрытых встречных требованиях. Внутреннее enum-поле."
          required: true

        - name: "compensation_on_hidden_claims_details"
          type: "string"
          presentation: "fact"
          label: "Компенсация при скрытых требованиях"
          description: >
            Формулировка о компенсации потерь Цессионария при обнаружении
            скрытых встречных требований.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: del_credere_check
    name: "Ответственность Цедента за исполнение Должником — делькредере (ст. 390 ГК РФ)"
    description: >
      Фактографическая проверка: принял ли Цедент явно на себя ответственность
      за неисполнение обязательства Должником (делькредере). По умолчанию Цедент
      не отвечает за исполнение — эта ответственность возникает только при явном
      соглашении. Если делькредере есть — зафиксировать тип, объём и условия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "делькредере"
        - "цедент отвечает за исполнение должником"
        - "гарантия платежеспособности должника"
        - "цедент принимает на себя риск неплатежа"
        - "ответственность за неисполнение требования"
        - "цедент выступает поручителем"
        - "гарантия возврата уплаченного"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*несет.*ответственность.*за.*исполнение.*должником"
        - "(?i)в.*случае.*неисполнения.*должником.*цедент.*обязан.*возместить"
        - "(?i)делькредере"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: наличие или явное отсутствие делькредере —
        ответственности Цедента за исполнение требования Должником.

        Нормативный ориентир:
        - ст. 390 ч. 1 ГК РФ — по умолчанию Цедент не отвечает за исполнение
        - ст. 390 ч. 3 ГК РФ — если принял поручительство — делькредере

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о том, что Цедент несёт ответственность за
           исполнение Должником уступленного требования.
        2. Если есть — какой тип ответственности (полная / частичная / условная).
        3. Если есть — каков размер ответственности.
        4. Если есть — при каких условиях возникает.
        5. Если есть — каков срок предъявления требований к Цеденту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не считай, что делькредере есть "по умолчанию" — только если прямо указано.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_defined", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — делькредере есть:
        Фрагмент:
        "В случае неисполнения Должником уступленного требования в срок до 31.12.2024
        Цедент обязуется возместить Цессионарию уплаченную цену уступки в течение
        10 рабочих дней с момента предъявления требования."

        Ответ:
        {
          "del_credere_status": "defined",
          "del_credere_details": "Цедент обязуется возместить уплаченную цену уступки при неисполнении Должником",
          "del_credere_type": "conditional",
          "del_credere_amount_status": "defined",
          "del_credere_amount_details": "уплаченная цена уступки",
          "del_credere_conditions_status": "defined",
          "del_credere_conditions_details": "неисполнение Должником требования в срок до 31.12.2024",
          "del_credere_period_status": "defined",
          "del_credere_period_details": "10 рабочих дней с момента предъявления требования",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "В случае неисполнения Должником уступленного требования в срок до 31.12.2024 Цедент обязуется возместить Цессионарию уплаченную цену уступки в течение 10 рабочих дней."
            }
          ]
        }

        Пример 2 — делькредере нет:
        Фрагмент:
        "Цедент не несёт ответственности за исполнение уступленного требования Должником."

        Ответ:
        {
          "del_credere_status": "not_defined",
          "del_credere_details": "Цедент не несёт ответственности за исполнение требования Должником",
          "del_credere_type": "not_defined",
          "del_credere_amount_status": "not_defined",
          "del_credere_amount_details": "Данные не определены",
          "del_credere_conditions_status": "not_defined",
          "del_credere_conditions_details": "Данные не определены",
          "del_credere_period_status": "not_defined",
          "del_credere_period_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Цедент не несёт ответственности за исполнение уступленного требования Должником."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принятии Цедентом ответственности за Должника.
        2. Если такой цитаты нет — статус "not_defined". Не выводи делькредере из закона.
        3. Если есть — зафиксируй тип, размер, условие, срок строго из текста.
        4. Не используй закон вместо текста договора.
        5. Проверь соответствие всех значений допустимому словарю.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "del_credere_status": "<defined / not_defined>",
          "del_credere_details": "<текст или 'Данные не определены'>",
          "del_credere_type": "<full / partial / conditional / not_defined>",
          "del_credere_amount_status": "<defined / not_defined>",
          "del_credere_amount_details": "<текст или 'Данные не определены'>",
          "del_credere_conditions_status": "<defined / not_defined>",
          "del_credere_conditions_details": "<текст или 'Данные не определены'>",
          "del_credere_period_status": "<defined / not_defined>",
          "del_credere_period_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "делькредере цедент отвечает за исполнение должником гарантия платежеспособности должника цедент принимает на себя риск неплатежа ответственность за неисполнение требования цедент выступает поручителем гарантия возврата уплаченного возместить цессионарию"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "цедент не отвечает за платежеспособность"
        - "цедент не несёт ответственности за неисполнение"
        - "расчёты являются окончательными"
        - "без права регресса"
        - "гарантирует действительность требования"
        - "не уступалось"
        - "возражения должника"
        - "акт сверки"
        - "уведомление должника"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "del_credere_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о делькредере: принял ли Цедент на себя ответственность за исполнение
        Должником, а также тип, объём, условия и срок такой ответственности.
        Не анализируй общие гарантии Цедента, цену уступки или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. del_credere_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (del_credere_status, del_credere_type,
              del_credere_amount_status, del_credere_conditions_status,
              del_credere_period_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - del_credere_status = "not_defined";
           - del_credere_type = "not_defined";
           - del_credere_amount_status = "not_defined";
           - del_credere_conditions_status = "not_defined";
           - del_credere_period_status = "not_defined";
           - del_credere_details = "Данные не определены";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. del_credere_status:
           - "defined" — если Цедент прямо принял на себя ответственность
             за исполнение обязательства Должником (делькредере);
           - "not_defined" — если делькредере прямо не предусмотрено.
           Важно: если в договоре написано «Цедент НЕ несёт ответственности
           за исполнение Должником» — это явное исключение делькредере,
           del_credere_status = "not_defined" (но presence может быть "present",
           если тема прямо урегулирована).

        2. del_credere_details:
           Формулировка о делькредере (или о его явном исключении).
           Fallback: "Данные не определены" / "Не удалось определить".

        3. del_credere_type:
           Только одно из значений:
           - "full" — Цедент принимает полную ответственность за исполнение Должником;
           - "partial" — ответственность только в части (по сумме или компонентам);
           - "conditional" — ответственность возникает только при наступлении
             прямо указанного условия;
           - "not_defined" — делькредере не предусмотрено или тип не указан.

        4. del_credere_amount_status:
           - "defined" — если размер ответственности Цедента прямо указан;
           - "not_defined" — если размер не указан или делькредере отсутствует.

        5. del_credere_amount_details:
           Размер ответственности. Fallback: "Данные не определены".

        6. del_credere_conditions_status:
           - "defined" — если условия возникновения ответственности прямо указаны;
           - "not_defined" — если условия не указаны или делькредере отсутствует.

        7. del_credere_conditions_details:
           Условия возникновения. Fallback: "Данные не определены".

        8. del_credere_period_status:
           - "defined" — если срок предъявления требований к Цеденту или
             срок исполнения прямо указан;
           - "not_defined" — если срок не указан или делькредере отсутствует.

        9. del_credere_period_details:
           Срок. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни del_credere_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не считай делькредере существующим по умолчанию (ст. 390 ч. 1 ГК РФ — презумпция отсутствия).
        - Если в договоре прямо написано, что Цедент НЕ отвечает за исполнение Должником —
          это явное исключение делькредере: del_credere_status = "not_defined",
          но del_credere_details должен содержать цитату об исключении.
          В этом случае presence = "present" (тема урегулирована).
        - full / partial / conditional — только из прямого текста договора, не из закона.
        - Если в разных фрагментах указаны противоречивые условия (например,
          «Цедент отвечает за исполнение» и «Цедент не несёт ответственности»):
          del_credere_status → "not_defined", del_credere_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания делькредере, ни ответственности Цедента
           за исполнение Должником, ни гарантии платёжеспособности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Явное исключение делькредере.
           «Цедент не несёт ответственности за исполнение уступленного
           требования Должником» или «Цедент не отвечает за платёжеспособность
           Должника».
           → presence = "present";
             del_credere_status = "not_defined";
             del_credere_details = дословная цитата об исключении;
             del_credere_type = "not_defined";
             все остальные *_status = "not_defined";
             все остальные *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «Цедент гарантирует платёжеспособность Должника»,
           в другом — «Цедент не несёт ответственности за исполнение».
           → presence = "unclear";
             del_credere_status = "not_defined";
             del_credere_details = "Не удалось определить".

        4. Частичное делькредере без полных деталей.
           «Цедент отвечает за исполнение Должником в части основного долга,
           но не в части процентов и неустойки» без указания срока.
           → presence = "present";
             del_credere_status = "defined";
             del_credere_type = "partial";
             del_credere_amount_status = "defined";
             del_credere_period_status = "not_defined";
             del_credere_period_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для del_credere_check_presence используй только: "present", "missing", "unclear".
        - Для del_credere_status и всех *_status используй только: "defined" или "not_defined".
        - Для del_credere_type используй только: "full", "partial", "conditional", "not_defined".
        - Fallback при отсутствии данных:
          * del_credere_details, все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "del_credere_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования делькредере в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "del_credere_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия делькредере. Внутреннее enum-поле."
          required: true

        - name: "del_credere_details"
          type: "string"
          presentation: "fact"
          label: "Условие о делькредере"
          description: >
            Формулировка о принятии Цедентом ответственности за исполнение Должником
            или о явном исключении такой ответственности.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "del_credere_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["full", "partial", "conditional", "not_defined"]
          display_in_grid: false
          description: "Тип делькредере. Внутреннее enum-поле."
          required: true

        - name: "del_credere_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания размера ответственности по делькредере. Внутреннее enum-поле."
          required: true

        - name: "del_credere_amount_details"
          type: "string"
          presentation: "fact"
          label: "Размер ответственности по делькредере"
          description: >
            Размер ответственности Цедента по делькредере.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "del_credere_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания условий возникновения делькредере. Внутреннее enum-поле."
          required: true

        - name: "del_credere_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Условия делькредере"
          description: >
            Условия возникновения ответственности Цедента по делькредере.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "del_credere_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока по делькредере. Внутреннее enum-поле."
          required: true

        - name: "del_credere_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок по делькредере"
          description: >
            Срок предъявления требований или исполнения по делькредере.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: future_claims_check
    name: "Условия уступки будущих требований (ст. 388.2 ГК РФ)"
    description: >
      Фактографическая проверка наличия специальных условий для уступки будущих
      требований: критерии определения, идентификация будущего Должника и основания,
      период возникновения, механизм фиксации возникших требований.
      Check активируется только при наличии триггера future_claim.
    triggers:
      any: ["future_claim"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "будущие требования"
        - "права, которые возникнут"
        - "критерии определения будущих требований"
        - "период возникновения"
        - "определение будущего должника"
        - "основание будущих требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступаются.*права.*требования.*которые.*возникнут"
        - "(?i)будущие.*требования.*определяются.*по.*следующим.*критериям"
        - "(?i)права.*котор[ые]+.*возникнут.*из.*договоров"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: наличие и полнота условий для уступки
        будущих требований.

        Нормативный ориентир:
        - ст. 388.2 ГК РФ — уступка будущего требования

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на уступку будущих требований.
        2. Есть ли критерии определения будущих требований.
        3. Определён ли будущий Должник или критерии его определения.
        4. Определено ли основание будущих требований.
        5. Определён ли период возникновения требований.
        6. Есть ли механизм фиксации возникших требований (реестр, акт, уведомление).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — будущие требования определены:
        Фрагмент:
        "Настоящим договором уступаются права требования, которые возникнут у Цедента
        из договоров поставки, заключённых с ООО «Омега» в период с 01.01.2025
        по 31.12.2025. Факт возникновения требований фиксируется реестром,
        составляемым сторонами ежемесячно."

        Ответ:
        {
          "future_claims_status": "defined",
          "future_claims_details": "права требования из договоров поставки с ООО «Омега» в период 01.01.2025–31.12.2025",
          "identification_criteria_status": "defined",
          "identification_criteria_details": "договоры поставки, заключённые с ООО «Омега»",
          "future_debtor_status": "defined",
          "future_debtor_details": "ООО «Омега»",
          "future_basis_status": "defined",
          "future_basis_details": "договоры поставки",
          "time_period_status": "defined",
          "time_period_details": "01.01.2025 по 31.12.2025",
          "fixation_mechanism_status": "defined",
          "fixation_mechanism_details": "реестр, составляемый сторонами ежемесячно",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящим договором уступаются права требования, которые возникнут у Цедента из договоров поставки, заключённых с ООО «Омега» в период с 01.01.2025 по 31.12.2025."
            }
          ]
        }

        Пример 2 — данных нет:
        Фрагмент:
        "Цедент также уступает будущие требования."

        Ответ:
        {
          "future_claims_status": "defined",
          "future_claims_details": "упомянуты будущие требования без детализации",
          "identification_criteria_status": "not_defined",
          "identification_criteria_details": "Данные не определены",
          "future_debtor_status": "not_defined",
          "future_debtor_details": "Данные не определены",
          "future_basis_status": "not_defined",
          "future_basis_details": "Данные не определены",
          "time_period_status": "not_defined",
          "time_period_details": "Данные не определены",
          "fixation_mechanism_status": "not_defined",
          "fixation_mechanism_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Цедент также уступает будущие требования."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о будущих требованиях.
        2. Найди прямую цитату о критериях их определения.
        3. Найди прямую цитату о будущем Должнике.
        4. Найди прямую цитату о периоде возникновения.
        5. Найди прямую цитату о механизме фиксации.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "future_claims_status": "<defined / not_defined>",
          "future_claims_details": "<текст или 'Данные не определены'>",
          "identification_criteria_status": "<defined / not_defined>",
          "identification_criteria_details": "<текст или 'Данные не определены'>",
          "future_debtor_status": "<defined / not_defined>",
          "future_debtor_details": "<текст или 'Данные не определены'>",
          "future_basis_status": "<defined / not_defined>",
          "future_basis_details": "<текст или 'Данные не определены'>",
          "time_period_status": "<defined / not_defined>",
          "time_period_details": "<текст или 'Данные не определены'>",
          "fixation_mechanism_status": "<defined / not_defined>",
          "fixation_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "будущие требования права которые возникнут критерии определения будущих требований период возникновения определение будущего должника основание будущих требований механизм фиксации реестр требований ст. 388.2 ГК РФ"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "частичная уступка"
        - "часть требования"
        - "остаток требования"
        - "распределение поступлений"
        - "делимость"
        - "действительность требования"
        - "делькредере"
        - "уведомление должника"
        - "обеспечительные права"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.70]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "future_claims_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        об уступке будущих требований: сами требования, критерии их определения,
        будущий Должник, основание возникновения, период возникновения и механизм фиксации.
        Не анализируй частичную уступку существующих требований, цену уступки,
        уведомление Должника или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. future_claims_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (future_claims_status, identification_criteria_status,
              future_debtor_status, future_basis_status,
              time_period_status, fixation_mechanism_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. future_claims_status:
           - "defined" — если в договоре прямо упомянуты будущие требования
             (права, которые возникнут, требования из будущих сделок и т.п.);
           - "not_defined" — если будущие требования прямо не упомянуты.

        2. future_claims_details:
           Краткая формулировка о будущих требованиях.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. identification_criteria_status:
           - "defined" — если прямо указаны критерии, по которым можно
             определить будущие требования (вид договора, контрагент,
             предмет, сумма и т.п.);
           - "not_defined" — если критерии не указаны.

        4. identification_criteria_details:
           Критерии определения. Fallback: "Данные не определены".

        5. future_debtor_status:
           - "defined" — если будущий Должник прямо определён по имени
             или описан критериями (например, «контрагенты Цедента
             по договорам поставки»);
           - "not_defined" — если Должник не определён.

        6. future_debtor_details:
           Идентификация будущего Должника. Fallback: "Данные не определены".

        7. future_basis_status:
           - "defined" — если основание будущих требований прямо указано
             (вид договора, тип сделки, судебный акт и т.п.);
           - "not_defined" — если основание не указано.

        8. future_basis_details:
           Основание. Fallback: "Данные не определены".

        9. time_period_status:
           - "defined" — если период возникновения будущих требований
             прямо определён (даты, срок, событие);
           - "not_defined" — если период не определён.

        10. time_period_details:
            Период. Fallback: "Данные не определены".

        11. fixation_mechanism_status:
            - "defined" — если прямо описан механизм фиксации возникших
              требований (реестр, акт, уведомление, приложение и т.п.);
            - "not_defined" — если механизм не описан.

        12. fixation_mechanism_details:
            Механизм фиксации. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни future_claims_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не достраивай критерии идентификации, если их нет в тексте договора.
        - Не подставляй нормы ст. 388.2 ГК РФ вместо текста договора.
        - Если в тексте есть только общая фраза «уступаются будущие требования»
          без критериев, Должника, основания, периода — future_claims_status = "defined",
          все остальные *_status = "not_defined".
        - Если параметры будущих требований определяются через внешний документ
          (приложение, реестр, рамочный договор) и это прямо видно из текста —
          считай такой параметр определённым и отрази это в user-facing поле.
        - Если в разных фрагментах указаны противоречивые данные (например,
          два разных периода возникновения): статус → "not_defined",
          *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания будущих требований, прав,
           которые возникнут, или аналогичных формулировок.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Упоминание без критериев.
           «Цедент также уступает будущие требования» без какой-либо
           детализации (нет критериев, Должника, основания, периода).
           → presence = "present";
             future_claims_status = "defined";
             future_claims_details = "упомянуты будущие требования без детализации";
             все остальные *_status = "not_defined";
             все остальные *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе период «01.01.2025–31.12.2025»,
           в другом — «с момента подписания до 30.06.2025».
           → presence = "unclear";
             time_period_status = "not_defined";
             time_period_details = "Не удалось определить".

        4. Отсылка на внешний документ.
           «Будущие требования определяются по критериям, указанным
           в Приложении №3 к настоящему договору» без раскрытия
           самих критериев в тексте.
           → presence = "present";
             identification_criteria_status = "defined";
             identification_criteria_details = "Согласно Приложению №3 к договору";
             остальные параметры — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для future_claims_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "future_claims_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования уступки будущих требований. Внутреннее агрегатное signal-поле."
          required: true

        - name: "future_claims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об уступке будущих требований. Внутреннее enum-поле."
          required: true

        - name: "future_claims_details"
          type: "string"
