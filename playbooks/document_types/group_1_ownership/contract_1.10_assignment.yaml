          type: "string"
          allowed_values: ["legal_entity", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин"]
          description: "Тип цессионария"
      store_payload: true

  - id: "debtor_identification"
    name: "Идентификация Должника"
    description: "Проверяет наличие идентификации Должника как третьего лица"
    legal_base: "ст. 382, 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
