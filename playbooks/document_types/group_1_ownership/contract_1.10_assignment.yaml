      store_payload: true

  - id: claim_identification_check
    name: "Идентификация уступаемого права требования, объём уступки и проверка запрета (ст. 382, 384, 388, 432 ГК РФ)"
    description: >
      Фактографическая проверка точной индивидуализации требования
      (Должник + Основание + Сумма + Срок), объёма уступки (полная / частичная),
      подтверждения отсутствия запрета уступки в основном договоре.
      Без точной идентификации договор незаключён (ст. 432 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право требования к"
        - "должник"
        - "основание возникновения"
        - "договор №"
        - "расписка от"
        - "сумма долга"
        - "размер требования"
        - "непогашенная задолженность"
        - "в полном объеме"
        - "частично"
        - "в части"
        - "объем передаваемых прав"
        - "запрет уступки"
        - "уступка не ограничена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право.*требования.*к.*[А-Я][а-я]+"
        - "{{ contract_number }}"
        - "{{ debt_amount }}"
        - "(?i)в\\s+полном\\s+объем"
        - "(?i)частичн[а-я]+\\s+уступк"
        - "(?i)запрет.*уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: идентификация уступаемого требования, объём уступки
        и подтверждение допустимости (отсутствие запрета).

        Нормативный ориентир:
        - ст. 432 ГК РФ — без точного предмета договор незаключён
        - ст. 384 ГК РФ — объём передаваемых прав
        - ст. 388 ГК РФ — допустимость уступки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Должник по уступаемому требованию.
        2. Что является основанием требования (договор, расписка, судебный акт — с реквизитами).
        3. Какова сумма уступаемого требования.
        4. Какой объём уступки (полный / частичный).
        5. Есть ли в договоре подтверждение отсутствия запрета уступки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не оценивай договор.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_defined", пустые строки.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — требование идентифицировано:
        Фрагмент:
        "Цедент уступает Цессионарию право требования к ООО «Гамма» (ИНН 7700000005),
        возникшее из Договора поставки № 15 от 10.01.2024, в размере 500 000 рублей
        (основной долг). Уступка осуществляется в полном объёме. Основной договор
        не содержит запрета на уступку."

        Ответ:
        {
          "debtor_identification_status": "defined",
          "debtor_identification_details": "ООО «Гамма», ИНН 7700000005",
          "claim_basis_status": "defined",
          "claim_basis_type": "contract",
          "claim_basis_details": "Договор поставки № 15 от 10.01.2024",
          "claim_amount_status": "defined",
          "claim_amount_details": "500 000 рублей (основной долг)",
          "assignment_scope": "full",
          "prohibition_check_status": "defined",
          "prohibition_check_details": "Основной договор не содержит запрета на уступку",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Цедент уступает Цессионарию право требования к ООО «Гамма» (ИНН 7700000005), возникшее из Договора поставки № 15 от 10.01.2024, в размере 500 000 рублей."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Цедент передаёт Цессионарию право требования к Должнику."

        Ответ:
        {
          "debtor_identification_status": "not_defined",
          "debtor_identification_details": "Данные не определены",
          "claim_basis_status": "not_defined",
          "claim_basis_type": "not_defined",
          "claim_basis_details": "Данные не определены",
          "claim_amount_status": "not_defined",
          "claim_amount_details": "Данные не определены",
          "assignment_scope": "not_defined",
          "prohibition_check_status": "not_defined",
          "prohibition_check_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Должника.
        2. Найди прямую цитату с реквизитами основания требования.
        3. Найди прямую цитату с суммой долга.
        4. Найди прямую цитату об объёме уступки.
        5. Найди прямую цитату о запрете или его отсутствии.
        6. Если прямой цитаты нет — верни "not_defined" и "Данные не определены".
        7. Не используй закон вместо текста договора.
        8. Убедись, что все значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "debtor_identification_status": "<defined / not_defined>",
          "debtor_identification_details": "<текст или 'Данные не определены'>",
          "claim_basis_status": "<defined / not_defined>",
          "claim_basis_type": "<contract / receipt / court_act / other / not_defined>",
          "claim_basis_details": "<текст или 'Данные не определены'>",
          "claim_amount_status": "<defined / not_defined>",
          "claim_amount_details": "<текст или 'Данные не определены'>",
          "assignment_scope": "<full / partial / not_defined>",
          "prohibition_check_status": "<defined / not_defined>",
          "prohibition_check_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право требования к должнику основание возникновения договор-основание расписка судебный акт сумма долга размер требования непогашенная задолженность в полном объёме частично в части объём передаваемых прав запрет уступки уступка не ограничена"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цедент цессионарий именуемый"
        - "ИНН ОГРН реквизиты"
        - "уведомление должника"
        - "гарантирует действительность"
        - "делькредере"
        - "обеспечительные права"
        - "залог"
        - "поручительство"
        - "акт сверки"
        - "встречные требования"
        - "будущие требования"
        - "передача документов подтверждающих"
        - "акт приема-передачи документов"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "claim_identification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии сведения
        об уступаемом праве требования: Должник, основание возникновения,
        сумма требования, объём уступки и проверка запрета уступки.
        Не анализируй реквизиты сторон договора цессии, цену уступки,
        уведомление Должника или обеспечительные права.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claim_identification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (debtor_identification_status, claim_basis_status,
              claim_amount_status, assignment_scope,
              prohibition_check_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - debtor_identification_status = "not_defined";
           - claim_basis_status = "not_defined";
           - claim_basis_type = "not_defined";
           - claim_amount_status = "not_defined";
           - assignment_scope = "not_defined";
           - prohibition_check_status = "not_defined";
           - debtor_identification_details, claim_basis_details,
             claim_amount_details, prohibition_check_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. debtor_identification_status:
           - "defined" — если Должник по уступаемому требованию прямо идентифицирован
             (наименование/ФИО, по возможности ИНН);
           - "not_defined" — если нет.

        2. debtor_identification_details:
           Краткая идентификация Должника. Fallback: "Данные не определены" / "Не удалось определить".

        3. claim_basis_status:
           - "defined" — если основание требования прямо указано, или прямо названо,
             что основание определяется по приложению/реестру требований;
           - "not_defined" — если нет.

        4. claim_basis_type:
           Только одно из значений:
           - "contract" — договор (поставки, займа, аренды и т.п.);
           - "receipt" — расписка или иной документ о получении денежных средств;
           - "court_act" — судебный акт (решение, определение, судебный приказ);
           - "other" — иное прямо названное основание;
           - "not_defined" — основание прямо не указано.

        5. claim_basis_details:
           Реквизиты основания: вид + номер + дата (например, "Договор поставки № 15 от 10.01.2024",
           "Решение Арбитражного суда г. Москвы по делу № А40-100/2024",
           "Согласно Реестру требований (Приложение №1)").
           Fallback: "Данные не определены" / "Не удалось определить".

        6. claim_amount_status:
           - "defined" — если сумма требования прямо указана или прямо названо,
             что сумма определяется по приложению/акту сверки;
           - "not_defined" — если нет.

        7. claim_amount_details:
           Сумма уступаемого требования (с указанием состава, если есть: основной долг,
           проценты, неустойка). Fallback: "Данные не определены" / "Не удалось определить".

        8. assignment_scope:
           Только одно из значений:
           - "full" — требование уступается в полном объёме;
           - "partial" — требование уступается в части (с указанием размера, если есть);
           - "not_defined" — объём прямо не указан.

        9. prohibition_check_status:
           - "defined" — если в договоре прямо есть формулировка о запрете уступки
             или о его отсутствии (например, "основной договор не содержит запрета",
             "уступка не ограничена", "основной договор содержит запрет");
           - "not_defined" — если прямой формулировки о запрете или его отсутствии нет.

        10. prohibition_check_details:
            Дословная или краткая формулировка о запрете уступки или его отсутствии.
            Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни claim_identification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай реквизиты Цедента/Цессионария, цену уступки, уведомление Должника,
          обеспечительные права, передачу документов — только параметры самого требования.
        - Если параметр прямо определяется через приложение, реестр требований, акт сверки
          или иной названный документ, и это прямо видно из текста, считай такой параметр
          определённым и отрази это в user-facing поле.
        - Если в разных фрагментах указаны разные данные (например, два разных размера долга)
          и конфликт нельзя разрешить по тексту: статус → "not_defined",
          *_details → "Не удалось определить".
        - Для assignment_scope: привязка только к текстовым маркерам
          ("в полном объёме", "в части", "частично уступается"). Не выводи объём из суммы.
        - Для prohibition_check_status: учитывай только прямые формулировки о запрете
          или его отсутствии; молчание договора — это "not_defined".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни Должника, ни основания, ни суммы, ни объёма, ни упоминания запрета.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Отсылка на внешний документ.
           Параметры требования (Должник, основание, сумма) определяются
           по Реестру требований (Приложение №1), акту сверки или иному названному документу.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "Согласно Реестру требований (Приложение №1)".

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные размеры долга или два разных Должника.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Частичная уступка без указания размера.
           В тексте прямо сказано "уступка в части", но размер уступаемой части не определён.
           → presence = "present";
             assignment_scope = "partial";
             claim_amount_status = "not_defined";
             claim_amount_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claim_identification_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined" или "not_defined".
        - Для claim_basis_type используй только: "contract", "receipt", "court_act", "other", "not_defined".
        - Для assignment_scope используй только: "full", "partial", "not_defined".
        - Fallback при отсутствии данных:
          * debtor_identification_details, claim_basis_details,
            claim_amount_details, prohibition_check_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "claim_identification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по идентификации уступаемого требования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "debtor_identification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации Должника по уступаемому требованию. Внутреннее enum-поле."
          required: true

        - name: "debtor_identification_details"
          type: "string"
          presentation: "fact"
          label: "Должник по требованию"
          description: >
            Идентификация Должника по уступаемому требованию.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "claim_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения основания возникновения требования. Внутреннее enum-поле."
          required: true

        - name: "claim_basis_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["contract", "receipt", "court_act", "other", "not_defined"]
          display_in_grid: false
          description: "Тип основания возникновения уступаемого требования. Внутреннее enum-поле."
          required: true

        - name: "claim_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание требования"
          description: >
            Реквизиты основания возникновения уступаемого требования или user-facing
            указание на способ его определения (например, "Согласно Реестру требований").
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "claim_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания суммы уступаемого требования. Внутреннее enum-поле."
          required: true

        - name: "claim_amount_details"
          type: "string"
          presentation: "fact"
          label: "Сумма требования"
          description: >
            Сумма уступаемого требования с указанием состава (основной долг, проценты,
            неустойка), если прямо указан.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "assignment_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full", "partial", "not_defined"]
          display_in_grid: false
          description: "Объём уступки: полный / частичный. Внутреннее enum-поле."
          required: true

        - name: "prohibition_check_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия в договоре прямой формулировки о запрете уступки или его отсутствии. Внутреннее enum-поле."
          required: true

        - name: "prohibition_check_details"
          type: "string"
          presentation: "fact"
          label: "Запрет уступки"
          description: >
            Формулировка о запрете уступки или его отсутствии.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: cedent_warranties_check
    name: "Гарантии Цедента о действительности требования, отсутствии двойной уступки и ограничение ответственности (ст. 390 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре четырёх типов гарантий Цедента:
      (1) действительность требования, (2) его существование, (3) отсутствие предыдущих
      уступок, (4) отсутствие обременений. Также: явное ограничение ответственности
      за платежеспособность Должника и условие об окончательности расчётов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цедент гарантирует"
        - "действительность требования"
        - "право требования существует"
        - "долг не погашен"
        - "не уступалось ранее"
        - "не обременено"
        - "цедент не отвечает за платежеспособность"
        - "не несет ответственности за неисполнение"
        - "расчеты являются окончательными"
        - "без права обратного требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цедент.*гарантирует.*(?:действительн|существован)"
        - "(?i)право.*требования.*не.*уступал"
        - "(?i)цедент.*не.*несет.*ответственност.*за.*(?:неисполнение|платежеспособност)"
        - "(?i)расчеты.*(?:окончательн|без.*права.*регресс)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: гарантии Цедента о требовании, защита от двойной
        уступки, ограничение ответственности за платёжеспособность Должника.

        Нормативный ориентир:
        - ст. 390 ГК РФ — ответственность Цедента

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли гарантия действительности требования.
        2. Есть ли гарантия существования требования (долг не погашен).
        3. Есть ли гарантия отсутствия предыдущих уступок.
        4. Есть ли гарантия отсутствия обременений на требование.
        5. Есть ли прямое ограничение ответственности Цедента за платёжеспособность Должника.
        6. Есть ли условие об окончательности расчётов (без права регресса).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — гарантии есть:
        Фрагмент:
        "Цедент гарантирует, что уступаемое право требования является действительным,
        существующим, ранее не уступалось и не обременено правами третьих лиц.
        Цедент не несёт ответственности за неисполнение требования Должником.
        Расчёты по настоящему договору являются окончательными."

        Ответ:
        {
          "validity_warranty_status": "defined",
          "validity_warranty_details": "уступаемое право требования является действительным",
          "existence_warranty_status": "defined",
          "existence_warranty_details": "существующим",
          "no_prior_assignment_status": "defined",
          "no_prior_assignment_details": "ранее не уступалось",
          "no_encumbrances_status": "defined",
          "no_encumbrances_details": "не обременено правами третьих лиц",
          "solvency_liability_excluded_status": "defined",
          "solvency_liability_excluded_details": "Цедент не несёт ответственности за неисполнение требования Должником",
          "final_settlement_status": "defined",
          "final_settlement_details": "расчёты являются окончательными",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Цедент гарантирует, что уступаемое право требования является действительным, существующим, ранее не уступалось и не обременено правами третьих лиц."
            }
          ]
        }

        Пример 2 — гарантий нет:
        Фрагмент:
        "Цедент уступает право требования Цессионарию."

        Ответ:
        {
          "validity_warranty_status": "not_defined",
          "validity_warranty_details": "Данные не определены",
          "existence_warranty_status": "not_defined",
          "existence_warranty_details": "Данные не определены",
          "no_prior_assignment_status": "not_defined",
          "no_prior_assignment_details": "Данные не определены",
          "no_encumbrances_status": "not_defined",
          "no_encumbrances_details": "Данные не определены",
          "solvency_liability_excluded_status": "not_defined",
          "solvency_liability_excluded_details": "Данные не определены",
          "final_settlement_status": "not_defined",
          "final_settlement_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о действительности требования.
        2. Найди прямую цитату о существовании / непогашенности долга.
        3. Найди прямую цитату об отсутствии предыдущих уступок.
        4. Найди прямую цитату об отсутствии обременений.
        5. Найди прямую цитату об ограничении ответственности за платёжеспособность.
        6. Найди прямую цитату об окончательности расчётов.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай гарантии.
        8. Не используй закон вместо текста договора.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "validity_warranty_status": "<defined / not_defined>",
          "validity_warranty_details": "<текст или 'Данные не определены'>",
          "existence_warranty_status": "<defined / not_defined>",
          "existence_warranty_details": "<текст или 'Данные не определены'>",
          "no_prior_assignment_status": "<defined / not_defined>",
          "no_prior_assignment_details": "<текст или 'Данные не определены'>",
          "no_encumbrances_status": "<defined / not_defined>",
          "no_encumbrances_details": "<текст или 'Данные не определены'>",
          "solvency_liability_excluded_status": "<defined / not_defined>",
          "solvency_liability_excluded_details": "<текст или 'Данные не определены'>",
          "final_settlement_status": "<defined / not_defined>",
          "final_settlement_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "цедент гарантирует действительность требования право требования существует долг не погашен не уступалось ранее не обременено цедент не отвечает за платежеспособность не несет ответственности за неисполнение расчёты являются окончательными без права обратного требования без права регресса"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "возражения должника"
        - "встречное требование"
        - "зачёт"
        - "акт сверки"
        - "скрытые требования"
        - "делькредере"
        - "цедент несёт ответственность за исполнение должником"
        - "гарантия платежеспособности"
        - "уведомление должника"
        - "обеспечительные права"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "cedent_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии гарантии Цедента
        о действительности требования, его существовании, отсутствии предыдущих уступок,
        отсутствии обременений, а также ограничение ответственности за платёжеспособность
        Должника и условие об окончательности расчётов.
        Не анализируй цену уступки, уведомление Должника, будущие требования или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cedent_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (validity_warranty_status, existence_warranty_status,
              no_prior_assignment_status, no_encumbrances_status,
              solvency_liability_excluded_status, final_settlement_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все шесть *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. validity_warranty_status:
           - "defined" — если в тексте прямо есть гарантия действительности
             уступаемого требования (например, «требование является действительным»,
             «Цедент гарантирует действительность»);
           - "not_defined" — если прямой гарантии нет.

        2. validity_warranty_details:
           Дословная или краткая формулировка гарантии действительности.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. existence_warranty_status:
           - "defined" — если прямо гарантируется существование / непогашенность
             требования (например, «долг не погашен», «требование существует»);
           - "not_defined" — если нет.

        4. existence_warranty_details:
           Формулировка гарантии существования. Fallback: "Данные не определены".

        5. no_prior_assignment_status:
           - "defined" — если прямо указано, что требование ранее не уступалось
             третьим лицам;
           - "not_defined" — если нет.

        6. no_prior_assignment_details:
           Формулировка об отсутствии предыдущих уступок. Fallback: "Данные не определены".

        7. no_encumbrances_status:
           - "defined" — если прямо указано отсутствие обременений, арестов,
             залогов или прав третьих лиц на требование;
           - "not_defined" — если нет.

        8. no_encumbrances_details:
           Формулировка об отсутствии обременений. Fallback: "Данные не определены".

        9. solvency_liability_excluded_status:
           - "defined" — только если Цедент прямо ограничил свою ответственность
             за платёжеспособность или исполнение Должником (например, «Цедент
             не несёт ответственности за неисполнение требования Должником»,
             «Цедент не отвечает за платёжеспособность Должника»);
           - "not_defined" — если прямого ограничения нет.
           Важно: молчание договора об ответственности за исполнение НЕ является
           основанием для "defined".

        10. solvency_liability_excluded_details:
            Формулировка об ограничении ответственности. Fallback: "Данные не определены".

        11. final_settlement_status:
            - "defined" — только если прямо указано, что расчёты являются
              окончательными, без права регресса или обратного требования;
            - "not_defined" — если нет.

        12. final_settlement_details:
            Формулировка об окончательности расчётов. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни cedent_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи гарантию из диспозитивных норм закона (ст. 390 ГК РФ), если её нет в тексте договора.
        - solvency_liability_excluded_status = "defined" только при явной формулировке об ограничении
          ответственности за платёжеспособность или исполнение Должником.
        - final_settlement_status = "defined" только при явной формулировке об окончательности
          расчётов, отсутствии права регресса или обратного требования.
        - Не считай молчание договора об ответственности эквивалентом явного ограничения.
        - Если в разных фрагментах указаны противоречивые гарантии (например, в одном месте
          «не отвечает», в другом — «несёт полную ответственность»):
          статус → "not_defined", *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одной формулировки о гарантиях Цедента, ответственности
           или окончательности расчётов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Частичные гарантии.
           В тексте есть гарантия действительности и существования, но нет упоминания
           об отсутствии предыдущих уступок, обременений, ограничении ответственности
           или окончательности расчётов.
           → presence = "present";
             validity_warranty_status = existence_warranty_status = "defined";
             no_prior_assignment_status = no_encumbrances_status =
             solvency_liability_excluded_status = final_settlement_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «Цедент не несёт ответственности за исполнение Должником»,
           в другом — «Цедент гарантирует платёжеспособность Должника».
           → presence = "unclear";
             solvency_liability_excluded_status = "not_defined";
             solvency_liability_excluded_details = "Не удалось определить".

        4. Общая ссылка на закон вместо конкретных гарантий.
           «Цедент несёт ответственность в соответствии со ст. 390 ГК РФ»
           без конкретизации объёма гарантий.
           → presence = "present";
             все *_status = "not_defined" (закон ≠ текст договора);
             все *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cedent_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cedent_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие гарантий Цедента в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "validity_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия гарантии действительности требования. Внутреннее enum-поле."
          required: true

        - name: "validity_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия действительности требования"
          description: >
            Формулировка гарантии действительности требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "existence_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия гарантии существования требования. Внутреннее enum-поле."
          required: true

        - name: "existence_warranty_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия существования требования"
          description: >
            Формулировка гарантии существования или непогашенности требования.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "no_prior_assignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии отсутствия предыдущих уступок. Внутреннее enum-поле."
          required: true

        - name: "no_prior_assignment_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие предыдущих уступок"
          description: >
            Формулировка об отсутствии предыдущих уступок.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "no_encumbrances_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии отсутствия обременений на требование. Внутреннее enum-поле."
          required: true

        - name: "no_encumbrances_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие обременений на требование"
          description: >
            Формулировка об отсутствии обременений на требование.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "solvency_liability_excluded_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничения ответственности Цедента за платёжеспособность Должника. Внутреннее enum-поле."
          required: true

        - name: "solvency_liability_excluded_details"
          type: "string"
          presentation: "fact"
          label: "Исключение ответственности за платёжеспособность"
          description: >
            Формулировка об ограничении ответственности Цедента за исполнение Должником.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "final_settlement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об окончательности расчётов. Внутреннее enum-поле."
          required: true

        - name: "final_settlement_details"
          type: "string"
          presentation: "fact"
          label: "Окончательность расчётов"
          description: >
            Условие об окончательности расчётов или отсутствии права регресса.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: debtor_notification_check
    name: "Порядок уведомления Должника об уступке (ст. 385 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре детальной процедуры уведомления
      Должника: кто уведомляет, в какой срок, каким способом, в какой форме,
      как подтверждается получение. Без уведомления Должника исполнение Цеденту
      считается надлежащим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление должника"
        - "письменное уведомление"
        - "уведомить должника"
        - "в течение"
        - "заказное письмо"
        - "цедент обязуется уведомить"
        - "цессионарий уведомляет"
        - "момент уведомления"
        - "подтверждение получения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени[ея].*должника.*в.*течение.*\\d+.*дн"
        - "(?i)должник.*должен.*быть.*уведомлен"
        - "(?i)(цедент|цессионарий).*обязан.*уведомить"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: порядок уведомления Должника об уступке.

        Нормативный ориентир:
        - ст. 385 ГК РФ — уведомление Должника

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие об уведомлении Должника.
        2. На ком лежит обязанность уведомления (Цедент / Цессионарий / совместно).
        3. Какой срок уведомления.
        4. Какой способ уведомления.
        5. Требуется ли форма уведомления (приложение к договору).
        6. Есть ли условие о подтверждении получения уведомления Должником.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процедура определена:
        Фрагмент:
        "Цедент обязуется уведомить Должника о состоявшейся уступке в течение 5 рабочих
        дней с даты подписания настоящего договора путём направления заказного письма
        с уведомлением о вручении. Форма уведомления — Приложение № 2 к настоящему договору."

        Ответ:
        {
          "notification_status": "defined",
          "notification_responsibility": "cedent",
          "notification_deadline_status": "defined",
          "notification_deadline_details": "в течение 5 рабочих дней с даты подписания",
          "notification_method_status": "defined",
          "notification_method_details": "заказное письмо с уведомлением о вручении",
          "notification_form_status": "defined",
          "notification_form_details": "Приложение № 2 к договору",
          "receipt_confirmation_status": "not_defined",
          "receipt_confirmation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цедент обязуется уведомить Должника о состоявшейся уступке в течение 5 рабочих дней с даты подписания настоящего договора путём направления заказного письма с уведомлением о вручении."
            }
          ]
        }

        Пример 2 — процедуры нет:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство."

        Ответ:
        {
          "notification_status": "not_defined",
          "notification_responsibility": "not_defined",
          "notification_deadline_status": "not_defined",
          "notification_deadline_details": "Данные не определены",
          "notification_method_status": "not_defined",
          "notification_method_details": "Данные не определены",
          "notification_form_status": "not_defined",
          "notification_form_details": "Данные не определены",
          "receipt_confirmation_status": "not_defined",
          "receipt_confirmation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности уведомления.
        2. Найди прямую цитату о сроке уведомления.
        3. Найди прямую цитату о способе уведомления.
        4. Найди прямую цитату о форме уведомления.
        5. Найди прямую цитату о подтверждении получения.
        6. Если прямой цитаты нет — верни "not_defined". Не подменяй закон текстом договора.
        7. Проверь, что все значения соответствуют допустимому словарю.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "notification_status": "<defined / not_defined>",
          "notification_responsibility": "<cedent / assignee / joint / not_defined>",
          "notification_deadline_status": "<defined / not_defined>",
          "notification_deadline_details": "<текст или 'Данные не определены'>",
          "notification_method_status": "<defined / not_defined>",
          "notification_method_details": "<текст или 'Данные не определены'>",
          "notification_form_status": "<defined / not_defined>",
          "notification_form_details": "<текст или 'Данные не определены'>",
          "receipt_confirmation_status": "<defined / not_defined>",
          "receipt_confirmation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление должника письменное уведомление уведомить должника в течение заказное письмо цедент обязуется уведомить цессионарий уведомляет момент уведомления подтверждение получения форма уведомления приложение"
      retrieval_profile: "notice_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "цедент цессионарий именуемый"
        - "ИНН ОГРН реквизиты"
        - "право требования к"
        - "гарантирует действительность"
        - "делькредере"
        - "обеспечительные права"
        - "акт сверки"
        - "встречные требования"
        - "будущие требования"
        - "частичная уступка"
        - "передача документов"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "debtor_notification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии процедуру уведомления Должника:
        кто уведомляет, в какой срок, каким способом, в какой форме и как подтверждается получение.
        Не анализируй цену уступки, гарантии Цедента, обеспечительные права или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. debtor_notification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (notification_status, notification_responsibility,
              notification_deadline_status, notification_method_status,
              notification_form_status, receipt_confirmation_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - notification_responsibility = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. notification_status:
           - "defined" — если в тексте прямо предусмотрено уведомление Должника
             об уступке (обязанность уведомить, порядок уведомления);
           - "not_defined" — если уведомление прямо не предусмотрено.

        2. notification_responsibility:
           Только одно из значений:
           - "cedent" — обязанность уведомления лежит на Цеденте;
           - "assignee" — обязанность лежит на Цессионарии;
           - "joint" — обязанность лежит на обоих совместно;
           - "not_defined" — сторона, обязанная уведомить, прямо не указана
             или уведомление не предусмотрено.

        3. notification_deadline_status:
           - "defined" — если срок уведомления прямо указан (например,
             «в течение 5 рабочих дней», «не позднее 10 дней с даты подписания»);
           - "not_defined" — если срок прямо не указан.

        4. notification_deadline_details:
           Краткое описание срока уведомления. Fallback: "Данные не определены".

        5. notification_method_status:
           - "defined" — если способ уведомления прямо указан (заказное письмо,
             курьер, электронная почта, нарочно и т.п.);
           - "not_defined" — если способ прямо не указан.

        6. notification_method_details:
           Краткое описание способа. Fallback: "Данные не определены".

        7. notification_form_status:
           - "defined" — если форма уведомления прямо указана или есть ссылка
             на приложение с формой уведомления;
           - "not_defined" — если форма прямо не указана.

        8. notification_form_details:
           Краткое описание формы или ссылка на приложение. Fallback: "Данные не определены".

        9. receipt_confirmation_status:
           - "defined" — если прямо предусмотрено подтверждение получения
             уведомления Должником (уведомление о вручении, расписка,
             отметка о получении и т.п.);
           - "not_defined" — если подтверждение прямо не предусмотрено.

        10. receipt_confirmation_details:
            Краткое описание способа подтверждения. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни debtor_notification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", notification_responsibility = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не заменяй текст договора диспозитивными правилами ст. 385 ГК РФ.
        - Если в тексте есть только общая фраза «Должник уведомляется в соответствии с законом»
          без конкретизации — все *_status = "not_defined" (закон ≠ текст договора).
        - Если уведомление прямо предусмотрено, но детали (срок, способ, форма) не раскрыты —
          notification_status = "defined", остальные *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые данные (например, разные сроки
          или разные ответственные стороны): статус → "not_defined",
          *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания уведомления Должника.
           → presence = "missing";
             все *_status = "not_defined";
             notification_responsibility = "not_defined";
             все *_details = "Данные не определены".

        2. Общая ссылка на закон без конкретизации.
           «Должник уведомляется в порядке, предусмотренном ст. 385 ГК РФ»
           или «Стороны соблюдают требования законодательства об уведомлении».
           → presence = "present";
             notification_status = "defined" (тема упомянута);
             notification_responsibility = "not_defined";
             все остальные *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «Цедент уведомляет в течение 5 дней»,
           в другом — «Цессионарий обязан уведомить в течение 10 дней».
           → presence = "unclear";
             notification_responsibility = "not_defined";
             notification_deadline_status = "not_defined";
             соответствующие *_details = "Не удалось определить".

        4. Делегирование внешнему механизму.
           «Уведомление Должника осуществляется через нотариуса» или
           «Уведомление направляется в порядке, предусмотренном основным договором».
           → presence = "present";
             notification_status = "defined";
             notification_method_status = "defined";
             notification_method_details = "Через нотариуса" / "В порядке основного договора";
             остальные параметры — по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debtor_notification_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для notification_responsibility используй только: "cedent", "assignee", "joint", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debtor_notification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие процедуры уведомления Должника в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия процедуры уведомления Должника. Внутреннее enum-поле."
          required: true

        - name: "notification_responsibility"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["cedent", "assignee", "joint", "not_defined"]
          display_in_grid: false
          description: "Сторона, обязанная уведомить Должника. Внутреннее enum-поле."
          required: true

        - name: "notification_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока уведомления Должника. Внутреннее enum-поле."
          required: true

        - name: "notification_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления Должника"
          description: >
            Срок уведомления Должника об уступке.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "notification_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания способа уведомления Должника. Внутреннее enum-поле."
          required: true

        - name: "notification_method_details"
          type: "string"
          presentation: "fact"
          label: "Способ уведомления Должника"
          description: >
            Способ уведомления Должника.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "notification_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания формы уведомления Должника. Внутреннее enum-поле."
          required: true

        - name: "notification_form_details"
          type: "string"
          presentation: "fact"
          label: "Форма уведомления Должника"
          description: >
            Форма уведомления Должника или ссылка на приложение.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "receipt_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о подтверждении получения уведомления. Внутреннее enum-поле."
          required: true

        - name: "receipt_confirmation_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение получения уведомления"
          description: >
            Способ подтверждения получения уведомления Должником.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: accessory_rights_transfer_check
    name: "Переход обеспечительных и дополнительных прав вместе с требованием (ст. 384 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о переходе залога,
      поручительства, неустойки, процентов и о передаче документов по обеспечению.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "переход обеспечительных прав"
        - "права из договора залога"
        - "поручительство"
        - "право на неустойку"
        - "проценты"
        - "дополнительные права"
        - "документы по залогу"
        - "права из обеспечительных сделок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вместе.*с.*правом.*требования.*переходят"
        - "(?i)права.*обеспечивающие.*исполнение"
        - "(?i)залог.*поручительств"
        - "(?i)право.*на.*начисленн.*неустойк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: переход обеспечительных и дополнительных прав
        вместе с уступаемым требованием.

        Нормативный ориентир:
        - ст. 384 ГК РФ — объём переходящих прав

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое условие о переходе прав из договора залога.
        2. Есть ли прямое условие о переходе прав по поручительству.
        3. Есть ли прямое условие о переходе права на неустойку.
        4. Есть ли прямое условие о переходе права на проценты.
        5. Есть ли условие о передаче документов по обеспечению.
        6. Есть ли условие об уведомлении поручителей / залогодателей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — права перечислены:
        Фрагмент:
        "Вместе с правом требования к Цессионарию переходят все обеспечительные права,
        включая права из договора залога № 3 от 01.03.2024, права из договора
        поручительства, право на неустойку и начисленные проценты. Цедент передаёт
        Цессионарию оригиналы документов по залогу."

        Ответ:
        {
          "accessory_rights_status": "defined",
          "pledge_transfer_status": "defined",
          "pledge_transfer_details": "права из договора залога № 3 от 01.03.2024",
          "surety_transfer_status": "defined",
          "surety_transfer_details": "права из договора поручительства",
          "penalty_transfer_status": "defined",
          "penalty_transfer_details": "право на неустойку",
          "interest_transfer_status": "defined",
          "interest_transfer_details": "начисленные проценты",
          "documents_transfer_status": "defined",
          "documents_transfer_details": "оригиналы документов по залогу",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Вместе с правом требования к Цессионарию переходят все обеспечительные права, включая права из договора залога № 3 от 01.03.2024."
            }
          ]
        }

        Пример 2 — обеспечительные права не упомянуты:
        Фрагмент:
        "Цедент передаёт Цессионарию право требования в полном объёме."

        Ответ:
        {
          "accessory_rights_status": "not_defined",
          "pledge_transfer_status": "not_defined",
          "pledge_transfer_details": "Данные не определены",
          "surety_transfer_status": "not_defined",
          "surety_transfer_details": "Данные не определены",
          "penalty_transfer_status": "not_defined",
          "penalty_transfer_details": "Данные не определены",
          "interest_transfer_status": "not_defined",
          "interest_transfer_details": "Данные не определены",
          "documents_transfer_status": "not_defined",
          "documents_transfer_details": "Данные не определены",
          "surety_notification_status": "not_defined",
          "surety_notification_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о залоге.
        2. Найди прямую цитату о поручительстве.
        3. Найди прямую цитату о неустойке.
        4. Найди прямую цитату о процентах.
        5. Найди прямую цитату о документах по обеспечению.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай состав обеспечения.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "accessory_rights_status": "<defined / not_defined>",
          "pledge_transfer_status": "<defined / not_defined>",
          "pledge_transfer_details": "<текст или 'Данные не определены'>",
          "surety_transfer_status": "<defined / not_defined>",
          "surety_transfer_details": "<текст или 'Данные не определены'>",
          "penalty_transfer_status": "<defined / not_defined>",
          "penalty_transfer_details": "<текст или 'Данные не определены'>",
          "interest_transfer_status": "<defined / not_defined>",
          "interest_transfer_details": "<текст или 'Данные не определены'>",
          "documents_transfer_status": "<defined / not_defined>",
          "documents_transfer_details": "<текст или 'Данные не определены'>",
          "surety_notification_status": "<defined / not_defined>",
          "surety_notification_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переход обеспечительных прав права из договора залога поручительство право на неустойку проценты дополнительные права документы по залогу права из обеспечительных сделок вместе с правом требования переходят уведомление поручителя залогодателя"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "гарантирует действительность"
        - "не обременено правами третьих лиц"
        - "делькредере"
        - "акт сверки"
        - "встречные требования"
        - "уведомление должника"
        - "будущие требования"
        - "частичная уступка"
        - "передача документов подтверждающих требование"
        - "акт приема-передачи документов подтверждающих"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1700

      compact_output: false

      presence_signal:
        field: "accessory_rights_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия
        о переходе обеспечительных и дополнительных прав: залог, поручительство,
        неустойка, проценты, документы по обеспечению и уведомление поручителей/залогодателей.
        Не анализируй цену уступки, общие гарантии Цедента или расторжение.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. accessory_rights_transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (accessory_rights_status, pledge_transfer_status,
              surety_transfer_status, penalty_transfer_status,
              interest_transfer_status, documents_transfer_status,
              surety_notification_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все семь *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. accessory_rights_status:
           - "defined" — если в тексте прямо урегулирован переход обеспечительных
             и/или дополнительных прав в целом (например, «вместе с требованием
             переходят все обеспечительные права», «права, обеспечивающие исполнение
             обязательства, переходят к Цессионарию»);
           - "not_defined" — если общего условия о переходе обеспечительных прав нет.
           Важно: не выводи переход из ст. 384 ГК РФ по умолчанию — только из текста договора.

        2. pledge_transfer_status:
           - "defined" — если прямо указан переход прав из договора залога;
           - "not_defined" — если нет.

        3. pledge_transfer_details:
           Формулировка о переходе прав из залога (с реквизитами договора залога, если есть).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. surety_transfer_status:
           - "defined" — если прямо указан переход прав из договора поручительства;
           - "not_defined" — если нет.

        5. surety_transfer_details:
           Формулировка о переходе прав из поручительства. Fallback: "Данные не определены".

        6. penalty_transfer_status:
           - "defined" — если прямо указан переход права на неустойку
             (начисленную и/или будущую);
           - "not_defined" — если нет.

        7. penalty_transfer_details:
           Формулировка о переходе права на неустойку. Fallback: "Данные не определены".

        8. interest_transfer_status:
           - "defined" — если прямо указан переход права на проценты
             (начисленные и/или будущие);
           - "not_defined" — если нет.

        9. interest_transfer_details:
           Формулировка о переходе права на проценты. Fallback: "Данные не определены".

        10. documents_transfer_status:
            - "defined" — если предусмотрена передача документов по обеспечительным
              сделкам (оригиналы договоров залога, поручительства и т.п.);
            - "not_defined" — если нет.

        11. documents_transfer_details:
            Формулировка о передаче документов. Fallback: "Данные не определены".

        12. surety_notification_status:
            - "defined" — если прямо предусмотрено уведомление поручителей
              и/или залогодателей о состоявшейся уступке;
            - "not_defined" — если нет.

        13. surety_notification_details:
            Формулировка об уведомлении поручителей/залогодателей.
            Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни accessory_rights_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи переход обеспечительных прав из ст. 384 ГК РФ по умолчанию.
          Только прямые формулировки из текста договора.
        - Если в тексте есть общая фраза «вместе с требованием переходят все права,
          обеспечивающие его исполнение» без перечисления конкретных видов обеспечения —
          accessory_rights_status = "defined", но pledge/surety/penalty/interest = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия (например, «залог
          переходит» и «залог не переходит»): статус → "not_defined",
          *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания обеспечительных прав, залога,
           поручительства, неустойки, процентов или документов по обеспечению.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая ссылка на закон без конкретизации.
           «К Цессионарию переходят все права, обеспечивающие исполнение
           обязательства, в соответствии со ст. 384 ГК РФ» без перечисления
           конкретных видов обеспечения.
           → presence = "present";
             accessory_rights_status = "defined";
             pledge/surety/penalty/interest/documents/surety_notification = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «все обеспечительные права переходят к Цессионарию»,
           в другом — «права из договора залога не переходят».
           → presence = "unclear";
             pledge_transfer_status = "not_defined";
             pledge_transfer_details = "Не удалось определить".

        4. Частичный переход.
           Прямо указаны только некоторые виды обеспечения (например, залог
           и неустойка), остальные не упомянуты.
           → presence = "present";
             pledge_transfer_status = penalty_transfer_status = "defined";
             surety_transfer_status = interest_transfer_status = "not_defined";
             соответствующие *_details по наличию в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для accessory_rights_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "accessory_rights_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования перехода обеспечительных прав. Внутреннее агрегатное signal-поле."
          required: true

        - name: "accessory_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус общего урегулирования перехода обеспечительных и дополнительных прав. Внутреннее enum-поле."
          required: true

        - name: "pledge_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания перехода прав из залога. Внутреннее enum-поле."
          required: true

        - name: "pledge_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход прав из залога"
          description: >
            Формулировка о переходе прав из договора залога.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "surety_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания перехода прав из поручительства. Внутреннее enum-поле."
          required: true

        - name: "surety_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход прав из поручительства"
          description: >
            Формулировка о переходе прав из поручительства.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "penalty_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания перехода права на неустойку. Внутреннее enum-поле."
          required: true

        - name: "penalty_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права на неустойку"
          description: >
            Формулировка о переходе права на неустойку.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "interest_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания перехода права на проценты. Внутреннее enum-поле."
          required: true

        - name: "interest_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права на проценты"
          description: >
            Формулировка о переходе права на проценты.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "documents_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о передаче документов по обеспечению. Внутреннее enum-поле."
          required: true

        - name: "documents_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Передача документов по обеспечению"
          description: >
            Формулировка о передаче документов по обеспечительным сделкам.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "surety_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об уведомлении поручителей/залогодателей. Внутреннее enum-поле."
          required: true

        - name: "surety_notification_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление поручителей/залогодателей"
          description: >
            Формулировка об уведомлении поручителей или залогодателей.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

      store_payload: true

  - id: debtor_setoff_counterclaim_check
    name: "Возражения, зачёт и встречные требования Должника против Цессионария (ст. 386, 412 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий об урегулировании риска
      возражений и встречных требований Должника против нового кредитора:
      гарантия Цедента об отсутствии таких требований, раскрытие известных возражений,
      акт сверки, компенсация потерь Цессионария.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возражения должника"
        - "зачет встречных требований"
        - "встречное требование"
        - "право должника на зачёт"
        - "отсутствие встречных требований"
        - "должник не имеет возражений"
        - "акт сверки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возражени[яй].*должник"
        - "(?i)зачет.*встречн"
        - "(?i)должник.*вправе.*заяв[ить|лять]"
        - "(?i)отсутств[ие|уют].*встречн"
        - "(?i)акт.*сверк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор цессии (уступки права требования) по Главе 24 ГК РФ (ст. 382–390).
        Проверяется только один вопрос: урегулирование в договоре риска возражений
        и встречных требований Должника против нового кредитора.

        Нормативный ориентир:
        - ст. 386 ГК РФ — возражения должника
        - ст. 412 ГК РФ — зачёт встречных требований

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли гарантия Цедента об отсутствии у Должника встречных требований.
        2. Есть ли раскрытие Цедентом известных возражений Должника.
        3. Упомянут ли акт сверки взаимных расчётов с Должником.
        4. Есть ли условие о компенсации потерь Цессионария при обнаружении
           скрытых встречных требований.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — риск урегулирован:
        Фрагмент:
        "Цедент гарантирует отсутствие у Должника встречных требований к Цеденту.
        Стороны подтверждают, что акт сверки взаимных расчётов с Должником получен.
        В случае обнаружения скрытых встречных требований Должника Цедент обязуется
        возместить Цессионарию понесённые убытки."

        Ответ:
        {
          "cedent_warranty_no_counterclaims_status": "defined",
          "cedent_warranty_no_counterclaims_details": "Цедент гарантирует отсутствие у Должника встречных требований",
          "known_objections_disclosed_status": "not_defined",
          "known_objections_disclosed_details": "Данные не определены",
          "reconciliation_act_status": "defined",
          "reconciliation_act_details": "акт сверки взаимных расчётов с Должником получен",
          "compensation_on_hidden_claims_status": "defined",
          "compensation_on_hidden_claims_details": "Цедент обязуется возместить Цессионарию понесённые убытки",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Цедент гарантирует отсутствие у Должника встречных требований к Цеденту."
            }
          ]
        }

        Пример 2 — ничего не урегулировано:
        Фрагмент:
        "Цедент передаёт Цессионарию право требования."

        Ответ:
        {
          "cedent_warranty_no_counterclaims_status": "not_defined",
          "cedent_warranty_no_counterclaims_details": "Данные не определены",
          "known_objections_disclosed_status": "not_defined",
          "known_objections_disclosed_details": "Данные не определены",
          "reconciliation_act_status": "not_defined",
          "reconciliation_act_details": "Данные не определены",
          "compensation_on_hidden_claims_status": "not_defined",
          "compensation_on_hidden_claims_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантии отсутствия встречных требований.
        2. Найди прямую цитату о раскрытии известных возражений.
        3. Найди прямую цитату об акте сверки.
        4. Найди прямую цитату о компенсации при скрытых требованиях.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cedent_warranty_no_counterclaims_status": "<defined / not_defined>",
          "cedent_warranty_no_counterclaims_details": "<текст или 'Данные не определены'>",
          "known_objections_disclosed_status": "<defined / not_defined>",
          "known_objections_disclosed_details": "<текст или 'Данные не определены'>",
          "reconciliation_act_status": "<defined / not_defined>",
          "reconciliation_act_details": "<текст или 'Данные не определены'>",
          "compensation_on_hidden_claims_status": "<defined / not_defined>",
          "compensation_on_hidden_claims_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возражения должника зачёт встречных требований встречное требование право должника на зачёт отсутствие встречных требований должник не имеет возражений акт сверки компенсация потерь цессионария скрытые встречные требования"
      retrieval_profile: "assignment_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "действительность требования"
        - "существование требования"
        - "не уступалось ранее"
        - "не обременено"
        - "делькредере"
        - "уведомление должника"
        - "обеспечительные права"
        - "будущие требования"
        - "частичная уступка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "debtor_setoff_counterclaim_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цессии условия,
        связанные с риском возражений, зачёта и встречных требований Должника:
        гарантии Цедента, раскрытие известных возражений, акт сверки, компенсация потерь.
        Не анализируй уведомление Должника, цену уступки или обеспечительные права.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. debtor_setoff_counterclaim_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cedent_warranty_no_counterclaims_status,
              known_objections_disclosed_status,
              reconciliation_act_status,
              compensation_on_hidden_claims_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все четыре *_status = "not_defined";
           - все четыре *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. cedent_warranty_no_counterclaims_status:
           - "defined" — если Цедент прямо гарантирует отсутствие у Должника
             встречных требований, возражений или прав на зачёт
             (например, «Цедент гарантирует отсутствие у Должника встречных
             требований», «Должник не имеет возражений против Цедента»);
           - "not_defined" — если прямой гарантии нет.

        2. cedent_warranty_no_counterclaims_details:
           Дословная или краткая формулировка гарантии.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. known_objections_disclosed_status:
           - "defined" — если Цедент прямо раскрывает известные ему возражения
             или встречные требования Должника (например, «Цедент доводит до
             сведения Цессионария, что Должник заявил возражение по качеству»);
           - "not_defined" — если раскрытия нет.

        4. known_objections_disclosed_details:
           Что именно раскрыто. Fallback: "Данные не определены".

        5. reconciliation_act_status:
           - "defined" — если прямо упомянут акт сверки взаимных расчётов
             с Должником (получен, приложен, будет подписан);
           - "not_defined" — если акт сверки не упомянут.

        6. reconciliation_act_details:
           Формулировка об акте сверки. Fallback: "Данные не определены".

        7. compensation_on_hidden_claims_status:
           - "defined" — если прямо предусмотрена компенсация/возмещение
             потерь Цессионария при обнаружении скрытых встречных требований
             или возражений Должника (например, «Цедент обязуется возместить
             убытки», «Цедент компенсирует потери»);
           - "not_defined" — если компенсации не предусмотрено.

        8. compensation_on_hidden_claims_details:
           Формулировка о компенсации. Fallback: "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни debtor_setoff_counterclaim_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подменяй текст договора анализом риска или диспозитивными нормами ст. 386, 412 ГК РФ.
        - Общая фраза «Цедент гарантирует отсутствие претензий» без конкретизации
          встречных требований/возражений — cedent_warranty_no_counterclaims_status = "not_defined"
          (слишком абстрактно для "defined").
        - Если в разных фрагментах указаны противоречивые данные (например, «встречных
          требований нет» и «Должник заявил зачёт»): статус → "not_defined",
          *_details → "Не удалось определить".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения — на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий об отсутствии встречных требований,
           ни раскрытия возражений, ни акта сверки, ни компенсации.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общая гарантия без конкретизации.
           «Цедент гарантирует отсутствие претензий со стороны третьих лиц»
           без прямого упоминания встречных требований или возражений Должника.
           → presence = "present";
             cedent_warranty_no_counterclaims_status = "not_defined"
             (формулировка слишком общая);
             все остальные *_status = "not_defined";
             все *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном разделе «Должник не имеет встречных требований»,
           в другом — «Должник заявил зачёт в размере 200 000 руб.».
           → presence = "unclear";
             cedent_warranty_no_counterclaims_status = "not_defined";
             cedent_warranty_no_counterclaims_details = "Не удалось определить".

        4. Акт сверки без гарантии.
           В тексте упомянут акт сверки с Должником, но нет прямой гарантии
           об отсутствии встречных требований и нет условия о компенсации.
           → presence = "present";
             reconciliation_act_status = "defined";
             cedent_warranty_no_counterclaims_status =
             known_objections_disclosed_status =
             compensation_on_hidden_claims_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debtor_setoff_counterclaim_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debtor_setoff_counterclaim_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования возражений и встречных требований Должника. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cedent_warranty_no_counterclaims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантии об отсутствии встречных требований Должника. Внутреннее enum-поле."
          required: true

        - name: "cedent_warranty_no_counterclaims_details"
          type: "string"
          presentation: "fact"
          label: "Гарантия отсутствия встречных требований"
          description: >
            Формулировка гарантии об отсутствии встречных требований Должника.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "known_objections_disclosed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус раскрытия известных возражений Должника. Внутреннее enum-поле."
          required: true

        - name: "known_objections_disclosed_details"
          type: "string"
          presentation: "fact"
          label: "Раскрытие возражений Должника"
          description: >
            Что именно раскрыто Цедентом о возражениях Должника.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "reconciliation_act_status"
          type: "string"
