          "governing_law_status": "not_defined",
          "governing_law_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату об обратной уступке.
        3. Найди прямую цитату о возврате цены.
        4. Найди прямую цитату о неустойке.
        5. Найди прямую цитату о претензионном порядке и сроке ответа.
        6. Найди прямую цитату о суде / форуме.
        7. Найди прямую цитату о конфиденциальности.
        8. Найди прямую цитату о применимом праве.
        9. Если прямой цитаты нет — верни "not_defined". Не додумывай.

        Не выводи шаги проверки. Верни только JSON.

