          description: >
            Наименование/ФИО и реквизиты Цедента (ИНН, ОГРН, ОГРНИП или паспортные данные).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "cedent_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Цедент: подписант"
          description: >
            Подписант от Цедента: ФИО и должность.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "cedent_signatory_status"
          type: "string"
