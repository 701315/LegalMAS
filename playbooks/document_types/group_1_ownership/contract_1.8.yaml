type: contract_1.8
name: "Договор дарения"

description: |
  Договор, по которому одна сторона (даритель) безвозмездно передает или обязуется передать
  другой стороне (одаряемому) вещь в собственность, имущественное право либо освобождает от обязанности.
  Основан на animus donandi — намерении одарить. Главный квалифицирующий признак:
  полная безвозмездность. Любое встречное предоставление или скрытая компенсация
  создают риск переквалификации сделки в куплю-продажу, мену, ренту либо признания
  её притворной сделкой. Для отдельных случаев действуют специальные запреты и ограничения,
  включая ст. 575, 576, 578, 582 ГК РФ, а также банкротные и налоговые риски.

version: 4.0
parent: class_1_transfer_of_ownership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 32 ГК РФ (ст. 572-582)"
  doc_types_supported:
    - "договор дарения"
    - "дарственная"
    - "договор пожертвования"
    - "обещание дарения"
    - "договор дарения недвижимости"
    - "договор дарения доли"
    - "договор дарения денежных средств"
    - "договор дарения имущественного права"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)дарени"
      - "(?i)дарствен"
      - "(?i)пожертвован"
      - "(?i)gift"
      - "(?i)donation"

    folder_patterns:
      - "(?i)дарени"
      - "(?i)gift"
      - "(?i)donation"

    keywords:

      high:
        - "дарение"
        - "безвозмездно"
        - "в дар"
        - "даритель"
        - "одаряемый"
        - "дарственная"
        - "обещание дарения"
        - "пожертвование"
        - "безвозмездная передача"
        - "не предусматривает встречного предоставления"

      medium:
        - "освобождение от обязанности"
        - "отмена дарения"
        - "право дарителя"
        - "общеполезные цели"
        - "целевое использование"
        - "обещает подарить"
        - "переход права собственности"
        - "не является притворной сделкой"
        - "близкие родственники"
        - "ст. 572 ГК"
        - "ст. 574 ГК"
        - "ст. 575 ГК"
        - "ст. 576 ГК"
        - "ст. 577 ГК"
        - "ст. 578 ГК"
        - "ст. 582 ГК"
        - "дарение доли"
        - "НДФЛ"
        - "налог на доходы"

      low:
        - "подарок"
        - "благотворительность"
        - "презент"
        - "дарственная сделка"
        - "безвозмездное отчуждение"

    exclusions:
      - "цена договора"
      - "оплата"
      - "компенсация"
      - "встречное обязательство"
      - "в обмен на"
      - "содержание до смерти"
      - "рента"
      - "купля-продажа"
      - "мена"
      - "факторинг"
      - "финансирование под уступку"
      - "вклад в уставный капитал"
      - "взнос в имущество"
      - "прощение долга"
      - "зачёт требований"
      - "отступное"
      - "спонсорский договор"
      - "безвозмездное пользование"
      - "ссуда"

# ════════════════════════════════════════════════════════════════════════════
