type: contract_1.7_barter
name: "Договор мены (Бартер)"

description: |
  Двусторонняя сделка, при которой каждая из сторон обязуется передать в собственность другой стороны
  один товар в обмен на другой. Характеризуется отсутствием денежного встречного предоставления
  в чистом виде, возможной доплатой при неравноценности товаров и особым моментом перехода
  права собственности (после исполнения обязательств обеими сторонами, ст. 570 ГК РФ).
  К договору мены субсидиарно применяются правила о купле-продаже (ст. 567 ГК РФ), при этом
  каждая сторона признаётся продавцом передаваемого и покупателем получаемого товара.
  Для целей налогообложения бартер приравнивается к двум встречным реализациям.

version: 5.0
parent: class_1_transfer_of_ownership

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 31 ГК РФ (ст. 567-571)"
  doc_types_supported:
