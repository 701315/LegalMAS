           - "not_defined" — если очерёдность явно не описана.

        5. suspension_right_status:
           - "defined" — если в тексте прямо предусмотрено право приостановить исполнение при неисполнении контрагентом;
           - "not_defined" — если такое право в тексте отсутствует.

        6. retention_right_status:
           - "defined" — если в тексте прямо предусмотрено право удержания переданного товара;
           - "not_defined" — если такое право в тексте отсутствует.
        </task>

        <context_rules>
        - Перед остальными полями заполни simultaneous_transfer_mechanism_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
