        2. Возврат переданного товара — прямо?
        3. Размер неустойки — числом?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "non_performance_clause_status": "<defined / not_defined>",
          "right_to_terminate_status": "<defined / not_defined>",
          "damages_recovery_status": "<defined / not_defined>",
          "return_of_transferred_goods_status": "<defined / not_defined>",
          "penalty_clause_status": "<defined / not_defined>",
          "penalty_details": "<размер или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
