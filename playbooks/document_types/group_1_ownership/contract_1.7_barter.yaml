  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Сроки передачи и акты приёма-передачи
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_timing_and_acts
    name: "Сроки, место передачи и акты приёма-передачи"
    description: >
      Фактографическая проверка сроков и мест передачи каждого товара,
      одновременности/последовательности и формы передаточных актов.
      Страхование и доставка проверяются отдельным check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "порядок передачи"
        - "срок передачи"
        - "одновременно"
        - "последовательно"
        - "не позднее"
        - "в течение"
        - "дата передачи"
        - "передаточный акт"
        - "акт приёма-передачи"
        - "подписывают акт"
        - "место передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)передач(а|и|у)\\s+товар"
        - "(?i)акт\\s+(приём|передач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ, ст. 556 ГК РФ — для недвижимости).
        Проверяется только один вопрос: сроки и место передачи товаров, форма актов.
        Не анализируй доставку, страхование или механизм обеспечения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок передачи — одновременно или последовательно.
        2. Срок/дата передачи товара A.
        3. Срок/дата передачи товара B.
        4. Место передачи каждого товара.
        5. Форма акта приёма-передачи (предусмотрен / не предусмотрен).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Передача обоих товаров — одновременно 15.04.2026 по адресу: г. Москва, ул. Ленина, д. 1.
        Оформляется двусторонним актом приёма-передачи."
        Ответ:
        {
          "transfer_sequence_status": "defined",
          "transfer_sequence": "simultaneous",
          "good_A_transfer_deadline_status": "defined",
          "good_A_transfer_deadline": "15.04.2026",
          "good_B_transfer_deadline_status": "defined",
          "good_B_transfer_deadline": "15.04.2026",
          "transfer_location_status": "defined",
          "transfer_location_details": "г. Москва, ул. Ленина, д. 1",
          "transfer_act_status": "defined",
          "transfer_act_details": "двусторонний акт приёма-передачи",
          "evidence": [{"clause_ref": "п. 3.1", "quote": "..."}]
        }

        Пример 2:
        "Стороны обязуются передать товары."
        Ответ:
        {
          "transfer_sequence_status": "not_defined",
          "transfer_sequence": "not_defined",
          "good_A_transfer_deadline_status": "not_defined",
          "good_A_transfer_deadline": "Данные не определены",
          "good_B_transfer_deadline_status": "not_defined",
          "good_B_transfer_deadline": "Данные не определены",
          "transfer_location_status": "not_defined",
          "transfer_location_details": "Данные не определены",
          "transfer_act_status": "not_defined",
          "transfer_act_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Одновременно или последовательно — прямо?
        2. Дата или срок для каждого товара?
        3. Место — прямо указано?
        4. Акт — упомянут?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_sequence_status": "<defined / not_defined>",
          "transfer_sequence": "<simultaneous / sequential / not_defined>",
          "good_A_transfer_deadline_status": "<defined / not_defined>",
          "good_A_transfer_deadline": "<срок/дата или 'Данные не определены'>",
          "good_B_transfer_deadline_status": "<defined / not_defined>",
          "good_B_transfer_deadline": "<срок/дата или 'Данные не определены'>",
          "transfer_location_status": "<defined / not_defined>",
          "transfer_location_details": "<место или 'Данные не определены'>",
          "transfer_act_status": "<defined / not_defined>",
          "transfer_act_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "порядок передачи срок передачи одновременно последовательно не позднее в течение дата передачи передаточный акт акт приёма-передачи подписывают акт место передачи передача товара"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "оценщик"
        - "доставка"
        - "расходы на доставку"
        - "страхование"
        - "эскроу"
        - "аккредитив"
        - "встречное исполнение"
        - "право приостановления"
        - "обременения"
        - "залог"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 440
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены сроки и место передачи товаров,
        порядок (одновременно / последовательно) и условие о передаточном акте.
        Не анализируй доставку, страхование, механизм обеспечения или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. transfer_sequence_status — "defined" или "not_defined".
        2. transfer_sequence — simultaneous / sequential / not_defined.
        3. good_A_transfer_deadline_status — "defined" или "not_defined".
        4. good_A_transfer_deadline — срок или дата передачи товара A.
        5. good_B_transfer_deadline_status — "defined" или "not_defined".
        6. good_B_transfer_deadline — срок или дата передачи товара B.
        7. transfer_location_status — "defined" или "not_defined".
        8. transfer_location_details — место передачи.
        9. transfer_act_status — "defined" или "not_defined".
        10. transfer_act_details — условие о передаточном акте.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - simultaneous = обе передачи прямо указаны как одновременные.
        - sequential = передачи прямо указаны как последовательные (одна сторона первой).
        - Если порядок явно не описан — transfer_sequence = "not_defined".
        - Верни только JSON.
        </rules>
      fields:
        - name: "transfer_sequence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка передачи."
          required: true
        - name: "transfer_sequence"
          type: "string"
          presentation: "signal"
          allowed_values: ["simultaneous", "sequential", "not_defined"]
          description: "Одновременная или последовательная передача."
          required: true
        - name: "good_A_transfer_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока передачи товара A."
          required: false
        - name: "good_A_transfer_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок передачи товара A"
          description: "Срок или дата передачи товара A."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "good_B_transfer_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока передачи товара B."
          required: false
        - name: "good_B_transfer_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок передачи товара B"
          description: "Срок или дата передачи товара B."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "transfer_location_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус места передачи."
          required: false
        - name: "transfer_location_details"
          type: "string"
          presentation: "fact"
          label: "Место передачи"
          description: "Место передачи товаров."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус передаточного акта."
          required: false
        - name: "transfer_act_details"
          type: "string"
          presentation: "fact"
          label: "Передаточный акт"
          description: "Условие о передаточном акте."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Доставка и страхование при мене
  # ──────────────────────────────────────────────────────────────────────────
  - id: delivery_logistics_and_insurance
    name: "Доставка, расходы и страхование товаров при мене"
    description: >
      Фактографическая проверка условий доставки (кто несёт расходы),
      страхования товаров при перевозке или хранении.
    triggers: {}
