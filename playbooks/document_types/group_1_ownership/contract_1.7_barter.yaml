# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны и корпоративные полномочия
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_corporate_authority
    name: "Стороны договора мены: идентификация, полномочия и корпоративное одобрение"
    description: >
      Фактографическая проверка наличия реквизитов обеих сторон, полномочий
      подписантов и корпоративного одобрения для юридических лиц.
      Согласие супруга для физических лиц проверяется отдельным check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Сторона 1"
        - "Сторона 2"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "протокол одобрения"
        - "решение единственного участника"
        - "не является крупной сделкой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сторона\\s+[12]|первая\\s+сторона|вторая\\s+сторона).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а).*собрани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ФЗ-14 ст. 45-46; ФЗ-208 ст. 78-84).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов
        и корпоративное одобрение.
        Не анализируй согласие супруга — это отдельный check.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Стороны 1 (ИНН/ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Стороны 1 (юридическое лицо / ИП / физическое лицо).
        3. Кто подписывает от Стороны 1 и на каком основании.
        4. Наименование и реквизиты Стороны 2.
        5. Тип Стороны 2.
        6. Кто подписывает от Стороны 2 и на каком основании.
        7. Корпоративное одобрение или заверение о его ненужности.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "Данные не определены".
        3. В evidence — только цитаты из документа.
        4. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Сторона 1 — ООО «Техника», ИНН 7700000001, ОГРН 1027700000001,
        в лице Директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена решением единственного участника от 01.03.2026.
        Сторона 2 — гражданин Петров Б.Б., паспорт серия 45 00 № 123456."
        Ответ:
        {
          "party_A_details_status": "defined",
          "party_A_details": "ООО «Техника», ИНН 7700000001, ОГРН 1027700000001",
          "party_A_type": "legal_entity",
          "party_A_signatory": "Директор Иванов А.А.",
          "party_A_signatory_basis": "charter",
          "party_B_details_status": "defined",
          "party_B_details": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "party_B_type": "individual",
          "party_B_signatory": "Петров Б.Б.",
          "party_B_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "решение единственного участника от 01.03.2026",
          "evidence": [{"clause_ref": "преамбула", "quote": "..."}]
        }

        Пример 2:
        "Настоящий договор заключён между Стороной 1 и Стороной 2."
        Ответ:
        {
          "party_A_details_status": "not_defined",
          "party_A_details": "Данные не определены",
          "party_A_type": "not_defined",
          "party_A_signatory": "Данные не определены",
          "party_A_signatory_basis": "not_defined",
          "party_B_details_status": "not_defined",
          "party_B_details": "Данные не определены",
          "party_B_type": "not_defined",
          "party_B_signatory": "Данные не определены",
          "party_B_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. ИНН/ОГРН для ЮЛ или паспорт для физлица — прямо?
        2. Подписант и документ-основание — прямо?
        3. Одобрение — упомянуто?
        4. Не ищи согласие супруга.

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "party_A_details_status": "<defined / not_defined>",
          "party_A_details": "<реквизиты или 'Данные не определены'>",
          "party_A_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_A_signatory": "<ФИО или 'Данные не определены'>",
          "party_A_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "party_B_details_status": "<defined / not_defined>",
          "party_B_details": "<реквизиты или 'Данные не определены'>",
          "party_B_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_B_signatory": "<ФИО или 'Данные не определены'>",
          "party_B_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Сторона 1 Сторона 2 именуем в лице действующего на основании ИНН ОГРН ОГРНИП крупная сделка сделка с заинтересованностью одобрение общего собрания одобрение совета директоров протокол одобрения решение единственного участника не является крупной сделкой"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "согласие супруга"
        - "в браке не состоит"
        - "маткапитал"
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "передача товара"
        - "акт приёма-передачи"
        - "обременения"
        - "залог"
        - "эвикция"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 480
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены реквизиты обеих сторон,
        типы сторон, подписантов, основания полномочий и корпоративное одобрение.
        Не анализируй согласие супруга — оно проверяется отдельным check.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. party_A_details_status — "defined" или "not_defined".
        2. party_A_details — реквизиты Стороны 1.
        3. party_A_type — legal_entity / individual_entrepreneur / individual / not_defined.
        4. party_A_signatory — подписант Стороны 1.
        5. party_A_signatory_basis — charter / poa / order / personal / other / not_defined.
        6. party_B_details_status — "defined" или "not_defined".
        7. party_B_details — реквизиты Стороны 2.
        8. party_B_type — legal_entity / individual_entrepreneur / individual / not_defined.
        9. party_B_signatory — подписант Стороны 2.
        10. party_B_signatory_basis — charter / poa / order / personal / other / not_defined.
        11. corporate_approval_status — "defined" или "not_defined".
        12. corporate_approval_details — корпоративное одобрение или указание о его ненужности.

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - Не ищи согласие супруга.
        - charter = действует на основании устава.
        - poa = действует на основании доверенности.
        - order = действует на основании приказа.
        - personal = физлицо, подписывающее лично за себя.
        - Верни только JSON.
        </rules>
      fields:
        - name: "party_A_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус реквизитов Стороны 1."
          required: true
        - name: "party_A_details"
          type: "string"
          presentation: "fact"
          label: "Сторона 1"
          description: "Реквизиты Стороны 1."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "party_A_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          description: "Тип Стороны 1."
          required: false
        - name: "party_A_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант Стороны 1"
          description: "Подписант Стороны 1."
          required: false
          display_in_grid: false
        - name: "party_A_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий Стороны 1."
          required: false
        - name: "party_B_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус реквизитов Стороны 2."
          required: true
        - name: "party_B_details"
          type: "string"
          presentation: "fact"
          label: "Сторона 2"
          description: "Реквизиты Стороны 2."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "party_B_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          description: "Тип Стороны 2."
          required: false
        - name: "party_B_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант Стороны 2"
          description: "Подписант Стороны 2."
          required: false
          display_in_grid: false
        - name: "party_B_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий Стороны 2."
          required: false
        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус корпоративного одобрения."
          required: false
        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
          description: "Корпоративное одобрение или указание о его ненужности."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Согласие супруга
  # ──────────────────────────────────────────────────────────────────────────
  - id: spousal_consent_barter
    name: "Согласие супруга, семейное положение при мене"
    description: >
      Фактографическая проверка согласия супруга или заверения об отсутствии брака
      для физических лиц — сторон договора мены.
      Отдельный check, чтобы избежать смешения с реквизитами и корпоративными рисками.
    triggers:
      any: ["individual_party"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "личная собственность"
        - "приобретено до брака"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 35 СК РФ; ст. 10 ФЗ-256).
        Проверяется только один вопрос: согласие супруга
        для физических лиц — сторон договора мены.
        Не анализируй реквизиты сторон, корпоративное одобрение или предмет договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Нотариальное согласие супруга Стороны 1 или заверение об отсутствии брака.
        2. Нотариальное согласие супруга Стороны 2 или заверение об отсутствии брака.
        3. Ссылку на брачный договор (личный режим имущества).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Сторона 2 — гражданин Петров Б.Б., в зарегистрированном браке не состоит."
        Ответ:
        {
          "party_A_spousal_status": "not_defined",
          "party_A_spousal_details": "Данные не определены",
          "party_B_spousal_status": "defined",
          "party_B_spousal_regime": "not_married_confirmed",
          "party_B_spousal_details": "в зарегистрированном браке не состоит",
          "evidence": [{"clause_ref": "п. 1.3", "quote": "..."}]
        }

        Пример 2:
        "Стороны обмениваются товарами."
        Ответ:
        {
          "party_A_spousal_status": "not_defined",
          "party_A_spousal_details": "Данные не определены",
          "party_B_spousal_status": "not_defined",
          "party_B_spousal_regime": "not_defined",
          "party_B_spousal_details": "Данные не определены",
