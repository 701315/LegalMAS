#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, полномочия, корпоративное одобрение, согласие супруга
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_authority
    name: "Стороны договора мены: идентификация, полномочия, корпоративное одобрение, согласие супруга"
    description: >
      Фактографическая проверка наличия в договоре данных о Стороне 1 и Стороне 2,
      полномочий подписантов, корпоративного одобрения для юридических лиц,
      согласия супруга для физических лиц.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Сторона 1"
        - "Сторона 2"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "протокол одобрения"
        - "решение единственного участника"
        - "не является крупной сделкой"
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "личная собственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сторона\\s+[12]|первая\\s+сторона|вторая\\s+сторона).*именуем"
        - "{{ inn_ogrn }}"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а).*собрани"
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (бартера) (гл. 31 ГК РФ, ст. 567-571;
        ст. 432, 182-185 ГК РФ; ФЗ-14 ст. 45-46; ФЗ-208 ст. 78-84; ст. 35 СК РФ).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов,
        корпоративное одобрение и согласие супруга.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Стороны 1 (ИНН, ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Стороны 1 (юридическое лицо / ИП / физическое лицо).
        3. Кто подписывает от Стороны 1 и на каком основании.
        4. Наименование и реквизиты Стороны 2.
        5. Тип Стороны 2.
        6. Кто подписывает от Стороны 2 и на каком основании.
        7. Корпоративное одобрение (протокол / решение единственного участника)
           или заверение о том, что одобрение не требуется.
        8. Согласие супруга / заверение об отсутствии брака (для физических лиц).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_specified", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Сторона 1 — ООО «Техника», ИНН 7700000001, ОГРН 1027700000001,
        в лице Директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена решением единственного участника от 01.03.2026.
        Сторона 2 — гражданин Петров Б.Б., паспорт серия 45 00 № 123456,
        в браке не состоит."

        Ответ:
        {
          "party_A_details_status": "defined",
          "party_A_details": "ООО «Техника», ИНН 7700000001, ОГРН 1027700000001",
          "party_A_type": "legal_entity",
          "party_A_signatory": "Директор Иванов А.А.",
          "party_A_signatory_basis": "charter",
          "party_B_details_status": "defined",
          "party_B_details": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "party_B_type": "individual",
          "party_B_signatory": "Петров Б.Б.",
          "party_B_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "решение единственного участника от 01.03.2026",
          "spousal_consent_status": "defined",
          "spousal_consent_details": "в браке не состоит",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Сторона 1 — ООО «Техника», ИНН 7700000001, ОГРН 1027700000001, в лице Директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между Стороной 1 и Стороной 2."

        Ответ:
        {
          "party_A_details_status": "not_defined",
          "party_A_details": "Данные не определены",
          "party_A_type": "not_defined",
          "party_A_signatory": "Данные не определены",
          "party_A_signatory_basis": "not_defined",
          "party_B_details_status": "not_defined",
          "party_B_details": "Данные не определены",
          "party_B_type": "not_defined",
          "party_B_signatory": "Данные не определены",
          "party_B_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "spousal_consent_status": "not_defined",
          "spousal_consent_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с ИНН/ОГРН Стороны 1?
        2. Есть ли прямая цитата с ИНН/ОГРН или паспортом Стороны 2?
        3. Указан ли подписант и документ-основание для каждой стороны?
        4. Упомянуто ли корпоративное одобрение или заверение о его ненужности?
        5. Упомянуто ли согласие супруга или отсутствие брака (для физлиц)?

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "party_A_details_status": "<defined / not_defined>",
          "party_A_details": "<реквизиты или 'Данные не определены'>",
          "party_A_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_A_signatory": "<ФИО или 'Данные не определены'>",
          "party_A_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "party_B_details_status": "<defined / not_defined>",
          "party_B_details": "<реквизиты или 'Данные не определены'>",
          "party_B_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_B_signatory": "<ФИО или 'Данные не определены'>",
          "party_B_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "spousal_consent_status": "<defined / not_defined>",
          "spousal_consent_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "сторона"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "крупная сделка"
        - "одобрение"
        - "согласие супруга"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "party_A_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Сторона 1 прямо определена с реквизитами. Иначе 'not_defined'."
        - name: "party_A_details"
          type: "string"
          description: "Реквизиты Стороны 1. Если нет — строго 'Данные не определены'."
        - name: "party_A_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          description: "Тип Стороны 1."
        - name: "party_A_signatory"
          type: "string"
          description: "Подписант от Стороны 1. Если нет — строго 'Данные не определены'."
        - name: "party_A_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Стороны 1."
        - name: "party_B_details_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если Сторона 2 прямо определена с реквизитами. Иначе 'not_defined'."
        - name: "party_B_details"
          type: "string"
          description: "Реквизиты Стороны 2. Если нет — строго 'Данные не определены'."
        - name: "party_B_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          description: "Тип Стороны 2."
        - name: "party_B_signatory"
          type: "string"
          description: "Подписант от Стороны 2. Если нет — строго 'Данные не определены'."
        - name: "party_B_signatory_basis"
          type: "string"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Стороны 2."
        - name: "corporate_approval_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если корпоративное одобрение прямо определено. Иначе 'not_defined'."
        - name: "spousal_consent_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если согласие супруга или отсутствие брака прямо определено. Иначе 'not_defined'."
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет договора — оба товара
  # ──────────────────────────────────────────────────────────────────────────
  - id: barter_subject_extraction
    name: "Предмет договора мены: описание обоих товаров и равноценность"
    description: >
      Фактографическая проверка наличия чёткого описания обоих обмениваемых товаров
      (наименование, количество, стоимость, индивидуализирующие признаки)
      и определения равноценности/неравноценности.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товар"
        - "обмениваемый"
        - "передаёт в собственность"
        - "получает в собственность"
        - "наименование"
        - "количество"
        - "стоимость"
        - "равноценный"
        - "неравноценный"
        - "характеристики"
        - "описание товара"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)товар\\s+[«\"]?[А-Яа-яA-Za-z]"
        - "(?i)передаёт.*в.*собственность.*другой\\s+сторон"
        - "(?i)сторон(а|ы)\\s+[12].*передаёт"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (бартера) (гл. 31 ГК РФ, ст. 567, 568;
        ст. 432, 455 ГК РФ).
        Проверяется только один вопрос: описание обоих обмениваемых товаров
        и их равноценность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование, количество и стоимость товара A (передаваемого Стороной 1).
        2. Индивидуализирующие признаки товара A (серийный номер, VIN, кадастровый номер и т.п.).
        3. Наименование, количество и стоимость товара B (передаваемого Стороной 2).
        4. Индивидуализирующие признаки товара B.
        5. Заявленная равноценность или неравноценность обмена.
        6. Размер доплаты при неравноценности и кто платит.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Сторона 1 передаёт в собственность Стороне 2 автомобиль Toyota Camry,
        VIN XW7BF4FK30S123456, 2020 г.в., стоимостью 2 500 000 рублей.
        Сторона 2 передаёт в собственность Стороне 1 нежилое помещение,
        кадастровый номер 77:06:0001001:123, площадью 45 кв.м,
        стоимостью 3 000 000 рублей. Обмен неравноценный. Доплата 500 000 рублей
        осуществляется Стороной 1 в течение 5 рабочих дней."

        Ответ:
        {
          "good_A_name_status": "defined",
          "good_A_name": "автомобиль Toyota Camry",
          "good_A_quantity": "1 единица",
          "good_A_value_status": "defined",
          "good_A_value": "2 500 000 рублей",
          "good_A_identifying_features": "VIN XW7BF4FK30S123456, 2020 г.в.",
          "good_B_name_status": "defined",
          "good_B_name": "нежилое помещение",
          "good_B_quantity": "45 кв.м",
          "good_B_value_status": "defined",
          "good_B_value": "3 000 000 рублей",
          "good_B_identifying_features": "кадастровый номер 77:06:0001001:123",
          "equivalence_status": "defined",
          "equivalence": "unequal",
          "surcharge_status": "defined",
          "surcharge_amount": "500 000 рублей",
          "surcharge_payer": "Сторона 1",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Сторона 1 передаёт в собственность Стороне 2 автомобиль Toyota Camry, VIN XW7BF4FK30S123456, 2020 г.в., стоимостью 2 500 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обменивают товары на взаимовыгодных условиях."

        Ответ:
        {
          "good_A_name_status": "not_defined",
          "good_A_name": "Данные не определены",
