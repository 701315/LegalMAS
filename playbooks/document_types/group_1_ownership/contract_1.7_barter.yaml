      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены обоснование деловой цели, сведения об аффилированности и подтверждение рыночности оценки.
        Не анализируй налоги, обременения, сроки передачи или ответственность.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sham_transaction_and_business_purpose_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (business_purpose_status, affiliation_disclosure_status,
              affiliation_disclosure_code, market_valuation_status,
              independent_appraiser_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - business_purpose_status = "not_defined";
           - business_purpose_details = "Данные не определены";
           - affiliation_disclosure_status = "not_defined";
           - affiliation_disclosure_code = "not_defined";
           - market_valuation_status = "not_defined";
           - independent_appraiser_status = "not_defined";
           - не выполняй остальные шаги.

        1. business_purpose_status:
           - "defined" — если в тексте прямо указана деловая цель или экономическое обоснование мены;
           - "not_defined" — если не указана.

        2. business_purpose_details:
           Текст описания деловой цели на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. affiliation_disclosure_status:
           - "defined" — если вопрос аффилированности / взаимозависимости сторон прямо урегулирован в тексте;
           - "not_defined" — если не урегулирован.

        4. affiliation_disclosure_code:
           Используй строго только:
           - "yes_affiliated" — стороны прямо признаны аффилированными или взаимозависимыми;
           - "none_stated" — прямо написано, что стороны не являются аффилированными или взаимозависимыми;
           - "not_defined" — если вопрос прямо не урегулирован.

        5. market_valuation_status:
           - "defined" — если в тексте прямо указано подтверждение рыночности оценки;
           - "not_defined" — если не указано.

        6. independent_appraiser_status:
           - "defined" — если в тексте прямо упомянут независимый оценщик;
           - "not_defined" — если не упомянут.
        </task>

        <context_rules>
        - Перед остальными полями заполни sham_transaction_and_business_purpose_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/code = "not_defined", business_purpose_details = "Данные не определены".
        - Только текст договора.
        - yes_affiliated = стороны прямо признаны аффилированными или взаимозависимыми.
        - none_stated = прямо написано, что стороны не являются аффилированными или взаимозависимыми.
        - not_defined = вопрос аффилированности прямо не урегулирован.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующий *_code = "not_defined", business_purpose_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни деловой цели, ни упоминания аффилированности, ни оценки.
           → presence = "missing";
             все содержательные поля status/code = "not_defined";
             business_purpose_details = "Данные не определены".

        2. Общая фраза без конкретной цели.
           Указано, что "сделка совершается в рамках обычной хозяйственной деятельности",
           без конкретной формулировки деловой цели и без упоминания аффилированности.
           → presence = "present";
             business_purpose_status = "defined";
             affiliation_disclosure_status = "not_defined";
             market_valuation_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что стороны не являются аффилированными, в другом —
           содержится прямое указание на аффилированность.
           → presence = "unclear";
             affiliation_disclosure_status = "not_defined";
             affiliation_disclosure_code = "not_defined".

        4. Отсылка на отчёт оценщика как внешний документ.
           В договоре есть ссылка на отчёт об оценке как отдельный документ,
           но независимый оценщик прямо в тексте не назван.
           → presence = "present";
             market_valuation_status = "defined";
             independent_appraiser_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sham_transaction_and_business_purpose_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Для affiliation_disclosure_code используй только: "yes_affiliated", "none_stated", "not_defined".
        - Fallback при отсутствии данных: business_purpose_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: business_purpose_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sham_transaction_and_business_purpose_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования деловой цели / аффилированности в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "business_purpose_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия деловой цели. Внутреннее enum-поле."
          required: true

        - name: "business_purpose_details"
          type: "string"
          presentation: "fact"
          label: "Деловая цель"
          description: >
            Описание деловой цели мены. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "affiliation_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия аффилированности. Внутреннее enum-поле."
          required: true

        - name: "affiliation_disclosure_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Аффилированность сторон"
          allowed_values: ["yes_affiliated", "none_stated", "not_defined"]
          description: "Статус аффилированности сторон. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "market_valuation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          label: "Рыночная оценка подтверждена"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения рыночности оценки. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "independent_appraiser_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания независимого оценщика. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: non_performance_consequences_check
    name: "Последствия неисполнения одной из сторон (ст. 328, 450, 463 ГК РФ)"
    description: >
      Фактографическая проверка условий об ответственности при неисполнении:
      право расторжения, возврат переданного товара, убытки, неустойка.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за неисполнение"
        - "расторжение договора"
        - "возмещение убытков"
        - "отказ от исполнения"
        - "неустойка"
        - "право отказаться от договора"
        - "возврат переданного товара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в.*случае.*неисполнения.*вправе.*расторг"
        - "(?i)возврат.*переданн(ого|ый)\\s+товар"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 328, 450, 463 ГК РФ).
        Проверяется наличие условий о последствиях неисполнения.
        Не анализируй форс-мажор, уступку, конфиденциальность или подсудность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право расторгнуть договор при неисполнении.
        2. Условие о возврате уже переданного товара при расторжении.
        3. Условие о возмещении убытков.
        4. Неустойка (размер и основание).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В случае неисполнения обязательства по передаче товара другая сторона
        вправе отказаться от договора и потребовать возврата уже переданного товара.
        Виновная сторона возмещает убытки в полном объёме.
        Неустойка за каждый день просрочки — 0,1% от стоимости товара."

        Ответ:
        {
          "non_performance_clause_status": "defined",
          "right_to_terminate_status": "defined",
          "damages_recovery_status": "defined",
          "return_of_transferred_goods_status": "defined",
          "penalty_clause_status": "defined",
          "penalty_details": "0,1% от стоимости товара за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "В случае неисполнения обязательства по передаче товара другая сторона вправе отказаться от договора и потребовать возврата уже переданного товара."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "non_performance_clause_status": "not_defined",
          "right_to_terminate_status": "not_defined",
          "damages_recovery_status": "not_defined",
          "return_of_transferred_goods_status": "not_defined",
          "penalty_clause_status": "not_defined",
          "penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Право расторжения — прямо?
        2. Возврат переданного товара — прямо?
        3. Размер неустойки — числом?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "non_performance_clause_status": "<defined / not_defined>",
          "right_to_terminate_status": "<defined / not_defined>",
          "damages_recovery_status": "<defined / not_defined>",
          "return_of_transferred_goods_status": "<defined / not_defined>",
          "penalty_clause_status": "<defined / not_defined>",
          "penalty_details": "<размер или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за неисполнение расторжение договора возмещение убытков отказ от исполнения неустойка право отказаться от договора возврат переданного товара при неисполнении ст. 328 ГК РФ ст. 450 ГК РФ ст. 463 ГК РФ"
      preferred_unit_types:
        - liability_provision
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "освобождение от ответственности при форс-мажоре"
        - "уступка прав"
        - "перевод долга"
        - "НДС"
        - "налоговая база"
        - "обременения"
        - "эвикция"
        - "гарантия качества"
        - "претензия по качеству"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "non_performance_consequences_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены условия о последствиях неисполнения: право расторжения, возврат переданного товара, убытки и неустойка.
        Не анализируй форс-мажор, уступку, конфиденциальность или подсудность.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. non_performance_consequences_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_performance_clause_status, right_to_terminate_status,
              damages_recovery_status, return_of_transferred_goods_status,
              penalty_clause_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - non_performance_clause_status = "not_defined";
           - right_to_terminate_status = "not_defined";
           - damages_recovery_status = "not_defined";
           - return_of_transferred_goods_status = "not_defined";
           - penalty_clause_status = "not_defined";
           - penalty_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. non_performance_clause_status:
           - "defined" — если в тексте прямо есть хотя бы одно условие о последствиях неисполнения (расторжение, убытки, возврат товара, неустойка);
           - "not_defined" — если таких условий прямо нет.

        2. right_to_terminate_status:
           - "defined" — если в тексте прямо предусмотрено право расторгнуть договор при неисполнении;
           - "not_defined" — если такое право прямо не указано.

        3. damages_recovery_status:
           - "defined" — если в тексте прямо предусмотрено возмещение убытков при неисполнении;
           - "not_defined" — если возмещение убытков прямо не указано.

        4. return_of_transferred_goods_status:
           - "defined" — если в тексте прямо предусмотрен возврат уже переданного товара при неисполнении или расторжении;
           - "not_defined" — если такое условие прямо не указано.

        5. penalty_clause_status:
           - "defined" — если в тексте прямо предусмотрена неустойка (пеня, штраф) за неисполнение или просрочку;
           - "not_defined" — если неустойка прямо не предусмотрена.

        6. penalty_details:
           Размер и основание неустойки на русском языке (например: "0,1% от стоимости товара за каждый день просрочки").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни non_performance_consequences_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", penalty_details = "Данные не определены".
        - Только текст договора.
        - Общая фраза "стороны несут ответственность по закону" не является основанием для status = "defined".
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", penalty_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни права расторжения, ни убытков, ни возврата товара, ни неустойки.
           → presence = "missing";
             все *_status = "not_defined";
             penalty_details = "Данные не определены".

        2. Общая ссылка на закон.
           Указано, что "стороны несут ответственность в соответствии с законодательством РФ",
           без конкретных последствий и без размера неустойки.
           → presence = "present";
             non_performance_clause_status = "defined";
             right_to_terminate_status = "not_defined";
             damages_recovery_status = "not_defined";
             penalty_clause_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано право расторжения при неисполнении, в другом —
           запрет на односторонний отказ.
           → presence = "unclear";
             right_to_terminate_status = "not_defined".

        4. Неустойка без основания.
           Указан размер неустойки (например, "0,1% в день"), но не указано,
           за какое именно нарушение она начисляется.
           → presence = "present";
             penalty_clause_status = "defined";
             penalty_details содержит формулировку из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для non_performance_consequences_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: penalty_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: penalty_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "non_performance_consequences_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования последствий неисполнения в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_performance_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о последствиях неисполнения. Внутреннее enum-поле."
          required: true

        - name: "right_to_terminate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          label: "Право расторжения"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права расторжения. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "damages_recovery_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о возмещении убытков. Внутреннее enum-поле."
          required: true

        - name: "return_of_transferred_goods_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Возврат переданного товара"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о возврате переданного товара. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки. Внутреннее enum-поле."
          required: true

        - name: "penalty_details"
          type: "string"
          presentation: "fact"
          label: "Неустойка за неисполнение"
          description: >
            Размер и основание неустойки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: termination_and_force_majeure
    name: "Расторжение договора мены и форс-мажор"
    description: >
      Фактографическая проверка оснований расторжения, последствий расторжения
      с возвратом товаров и форс-мажорной оговорки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "возврат товаров"
        - "форс-мажор"
        - "непреодолимая сила"
        - "обстоятельства непреодолимой силы"
        - "освобождение от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)форс[\\s-]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 401, 450-453 ГК РФ).
        Проверяется только один вопрос: основания расторжения и форс-мажор.
        Не анализируй уступку, конфиденциальность, подсудность или применимое право.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения.
        2. Последствия расторжения (возврат товаров и возмещение убытков).
        3. Форс-мажорная оговорка (перечень событий, срок уведомления, последствия).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон или в одностороннем
        порядке при существенном нарушении условий договора. При расторжении стороны
        возвращают полученные товары. Форс-мажор: стихийные бедствия, военные
        действия. Уведомление — в течение 5 дней."

        Ответ:
        {
          "termination_grounds_status": "defined",
          "termination_grounds_details": "соглашение сторон или существенное нарушение",
          "termination_consequences_status": "defined",
          "termination_consequences_details": "стороны возвращают полученные товары",
          "force_majeure_status": "defined",
          "force_majeure_details": "стихийные бедствия, военные действия",
          "force_majeure_notice_period_status": "defined",
          "force_majeure_notice_period_value": "5 дней",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Договор может быть расторгнут по соглашению сторон или в одностороннем порядке при существенном нарушении условий договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны вправе расторгнуть договор."

        Ответ:
        {
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "termination_consequences_status": "not_defined",
          "termination_consequences_details": "Данные не определены",
          "force_majeure_status": "not_defined",
          "force_majeure_details": "Данные не определены",
          "force_majeure_notice_period_status": "not_defined",
          "force_majeure_notice_period_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Основания расторжения — перечислены конкретно?
        2. Возврат товаров при расторжении — прямо написан?
        3. Форс-мажор — есть перечень и срок уведомления?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<основания или 'Данные не определены'>",
          "termination_consequences_status": "<defined / not_defined>",
          "termination_consequences_details": "<последствия или 'Данные не определены'>",
          "force_majeure_status": "<defined / not_defined>",
          "force_majeure_details": "<текст или 'Данные не определены'>",
          "force_majeure_notice_period_status": "<defined / not_defined>",
          "force_majeure_notice_period_value": "<срок или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "force_majeure_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение отказ от договора односторонний отказ возврат товаров при расторжении форс-мажор непреодолимая сила обстоятельства непреодолимой силы освобождение от ответственности ст. 401 ГК РФ ст. 450 ГК РФ ст. 453 ГК РФ"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "неустойка за неисполнение"
        - "право удержания"
        - "приостановление исполнения при неисполнении"
        - "уступка прав"
        - "перевод долга"
        - "НДС"
        - "обременения"
        - "эвикция"
        - "гарантия качества"
        - "претензия по качеству"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 1.0]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "termination_and_force_majeure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены основания и последствия расторжения, а также форс-мажорную оговорку.
        Не анализируй уступку, конфиденциальность, подсудность или применимое право.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_force_majeure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_status, termination_consequences_status,
              force_majeure_status, force_majeure_notice_period_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - termination_grounds_status = "not_defined";
           - termination_consequences_status = "not_defined";
           - force_majeure_status = "not_defined";
           - force_majeure_notice_period_status = "not_defined";
           - termination_grounds_details, termination_consequences_details = "Данные не определены";
           - force_majeure_details, force_majeure_notice_period_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_grounds_status:
           - "defined" — если в тексте прямо указаны конкретные основания расторжения договора;
           - "not_defined" — если основания прямо не перечислены.

        2. termination_grounds_details:
           Основания расторжения на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. termination_consequences_status:
           - "defined" — если в тексте прямо указаны последствия расторжения (возврат товаров, убытки и т.п.);
           - "not_defined" — если последствия прямо не указаны.

        4. termination_consequences_details:
           Последствия расторжения на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. force_majeure_status:
           - "defined" — если в тексте прямо есть форс-мажорная оговорка с перечнем обстоятельств;
           - "not_defined" — если форс-мажорная оговорка прямо не указана.

        6. force_majeure_details:
           Текст форс-мажорной оговорки на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. force_majeure_notice_period_status:
           - "defined" — если в тексте прямо указан срок уведомления о наступлении форс-мажора;
           - "not_defined" — если срок прямо не указан.

        8. force_majeure_notice_period_value:
           Срок уведомления о форс-мажоре на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_force_majeure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_value = "Данные не определены".
        - Только текст договора.
        - Общая фраза "договор может быть расторгнут в соответствии с законом" не является основанием для termination_grounds_status = "defined".
        - Общая фраза "стороны освобождаются от ответственности при обстоятельствах непреодолимой силы" без перечня событий не является основанием для force_majeure_status = "defined".
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_details/*_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни оснований расторжения, ни последствий, ни форс-мажора.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details/*_value = "Данные не определены".

        2. Расторжение без последствий.
           Указано, что договор может быть расторгнут по соглашению сторон,
           но последствия расторжения (возврат товаров, убытки) не описаны.
           → presence = "present";
             termination_grounds_status = "defined";
             termination_consequences_status = "not_defined";
             termination_consequences_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что стороны возвращают полученные товары,
           в другом — что товары не подлежат возврату после расторжения.
           → presence = "unclear";
             termination_consequences_status = "not_defined";
             termination_consequences_details = "Не удалось определить".

        4. Форс-мажор без срока уведомления.
           Форс-мажорная оговорка с перечнем событий присутствует, но срок
           уведомления о наступлении форс-мажора не установлен.
           → presence = "present";
             force_majeure_status = "defined";
             force_majeure_notice_period_status = "not_defined";
             force_majeure_notice_period_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_force_majeure_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details/*_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_force_majeure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования расторжения / форс-мажора в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований расторжения. Внутреннее enum-поле."
          required: true

        - name: "termination_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: >
            Основания расторжения договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "termination_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий расторжения. Внутреннее enum-поле."
          required: true

        - name: "termination_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: >
            Последствия расторжения, включая возврат товаров. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "force_majeure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус форс-мажорной оговорки. Внутреннее enum-поле."
          required: true

        - name: "force_majeure_details"
          type: "string"
          presentation: "fact"
          label: "Форс-мажор"
          description: >
            Форс-мажорная оговорка. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "force_majeure_notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока уведомления о форс-мажоре. Внутреннее enum-поле."
          required: true

        - name: "force_majeure_notice_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления о форс-мажоре"
          description: >
            Срок уведомления о форс-мажоре. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: assignment
    name: "Уступка прав при мене"
    description: >
      Фактографическая проверка ограничений на уступку прав требования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)перевод\\s+долга"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Извлеки из договора мены ограничения уступки прав.
        Не анализируй расторжение, форс-мажор, подсудность, конфиденциальность
        или применимое право.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Ограничения на уступку прав (запрет / только с согласия / свободна).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
