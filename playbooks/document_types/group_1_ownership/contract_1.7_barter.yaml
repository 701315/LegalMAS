  - id: spousal_consent_barter
    name: "Согласие супруга, семейное положение при мене"
    description: >
      Фактографическая проверка согласия супруга или заверения об отсутствии брака
      для физических лиц — сторон договора мены.
      Отдельный check, чтобы избежать смешения с реквизитами и корпоративными рисками.
    triggers:
      any: ["individual_party"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "личная собственность"
        - "приобретено до брака"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 35 СК РФ; ст. 10 ФЗ-256).
        Проверяется только один вопрос: согласие супруга
        для физических лиц — сторон договора мены.
        Не анализируй реквизиты сторон, корпоративное одобрение или предмет договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Нотариальное согласие супруга Стороны 1 или заверение об отсутствии брака.
        2. Нотариальное согласие супруга Стороны 2 или заверение об отсутствии брака.
        3. Ссылку на брачный договор (личный режим имущества).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Сторона 2 — гражданин Петров Б.Б., в зарегистрированном браке не состоит."
        Ответ:
        {
          "party_A_spousal_status": "not_defined",
          "party_A_spousal_details": "Данные не определены",
          "party_B_spousal_status": "defined",
          "party_B_spousal_regime": "not_married_confirmed",
          "party_B_spousal_details": "в зарегистрированном браке не состоит",
          "evidence": [{"clause_ref": "п. 1.3", "quote": "..."}]
        }

        Пример 2:
        "Стороны обмениваются товарами."
        Ответ:
        {
          "party_A_spousal_status": "not_defined",
          "party_A_spousal_details": "Данные не определены",
          "party_B_spousal_status": "not_defined",
          "party_B_spousal_regime": "not_defined",
          "party_B_spousal_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Для каждой стороны-физлица — есть ли заявление о браке?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "party_A_spousal_status": "<defined / not_defined>",
          "party_A_spousal_regime": "<consent_present / not_married_confirmed / prenuptial_referenced / not_defined>",
          "party_A_spousal_details": "<текст или 'Данные не определены'>",
          "party_B_spousal_status": "<defined / not_defined>",
          "party_B_spousal_regime": "<consent_present / not_married_confirmed / prenuptial_referenced / not_defined>",
          "party_B_spousal_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие супруга нотариальное согласие не состоит в браке брачный договор личная собственность приобретено до брака материнский капитал маткапитал выделение долей ст. 35 СК РФ ФЗ-256"
      retrieval_profile: "consent_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "крупная сделка"
        - "одобрение совета директоров"
        - "корпоративное одобрение"
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "обременения"
        - "залог"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "spousal_consent_barter_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены сведения о семейном положении, согласии супруга на сделку или ссылки на брачный договор для физических лиц — сторон сделки.
        Не анализируй корпоративные одобрения, реквизиты сторон или их банковские счета.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. spousal_consent_barter_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных полей (party_A_spousal_status, party_B_spousal_status) ≠ "not_defined";
           - "missing" — если оба содержательных статусных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - party_A_spousal_status = "not_defined";
           - party_A_spousal_regime = "not_defined";
           - party_B_spousal_status = "not_defined";
           - party_B_spousal_regime = "not_defined";
           - party_A_spousal_details, party_B_spousal_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. party_A_spousal_status:
           - "defined" — если для Стороны 1 в тексте прямо упомянуто семейное положение, наличие согласия супруга или реквизиты брачного договора;
           - "not_defined" — если упомянутые факты полностью отсутствуют по тексту в отношении Стороны 1.

        2. party_A_spousal_regime:
           Правовой режим имущества Стороны 1. Используй строго только:
           - "consent_present" — если прямо упомянуто наличие нотариального согласия супруга на мену;
           - "not_married_confirmed" — если сторона прямо заявляет/заверяет, что не состоит в браке;
           - "prenuptial_referenced" — если содержится отсылка на брачный договор;
           - "not_defined" — если данные отсутствуют.

        3. party_A_spousal_details:
           Текстовые подробности о семейном положении Стороны 1.
           Если данных нет — "Данные не определены".

        4. party_B_spousal_status:
           - "defined" — если для Стороны 2 в тексте прямо упомянуто семейное положение/согласие;
           - "not_defined" — если данные отсутствуют.

        5. party_B_spousal_regime:
           Правовой режим имущества Стороны 2. Используй строго только те же enum-значения, что и для Стороны 1.

        6. party_B_spousal_details:
           Текстовые подробности о семейном положении Стороны 2.
           Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни spousal_consent_barter_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/regime = "not_defined", все details = "Данные не определены".
        - Не смешивай заявления Стороны 1 и Стороны 2.
        - Считай статус "defined" только при наличии конкретных заверений/документов в тексте. Упоминание абстрактной "необходимости соблюдать закон" не является надлежащим раскрытием режима.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           По тексту договора нет ни слова о браке, супругах, согласии или брачных договорах сторон.
           → presence = "missing"; все статусы = "not_defined"; все details = "Данные не определены".

        2. Сделка совершается юридическими лицами.
           Договор заключен между двумя ООО. Тема согласия супругов юридически неприменима и в тексте отсутствует.
           → presence = "missing"; все статус-поля = "not_defined"; все details = "Данные не определены".

        3. Противоречивые заявления стороны.
           В одном пункте договора гражданин указывает, что не состоит в браке, а в другом содержится обязательство предоставить нотариальное согласие супруга.
           → presence = "unclear"; соответствующий status = "not_defined"; regime = "not_defined"; details = "Не удалось определить".

        4. Ссылка на закон без конкретики.
           Написано: "Стороны обязуются соблюдать нормы семейного законодательства РФ". Конкретное семейное положение не раскрыто.
           → behavior: status = "not_defined"; regime = "not_defined"; details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для spousal_consent_barter_presence используй только: "present", "missing", "unclear".
        - Для полей *_status используй только: "defined", "not_defined".
        - Для полей *_regime используй только: "consent_present", "not_married_confirmed", "prenuptial_referenced", "not_defined".
        - Fallback при отсутствии данных: текстовые поля → "Данные не определены".
        - Fallback при противоречии или неоднозначности: текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "spousal_consent_barter_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие данных о согласии супруга / семейном положении сторон. Внутреннее агрегатное signal-поле."
          required: true

        - name: "party_A_spousal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласия супруга Стороны 1. Внутреннее enum-поле."
          required: true

        - name: "party_A_spousal_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["consent_present", "not_married_confirmed", "prenuptial_referenced", "not_defined"]
          display_in_grid: false
          description: "Режим согласия супруга Стороны 1. Внутреннее enum-поле."
          required: true

        - name: "party_A_spousal_details"
          type: "string"
          presentation: "fact"
          label: "Согласие супруга Стороны 1"
          description: >
            Сведения о согласии супруга или семейном положении Стороны 1. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "party_B_spousal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласия супруга Стороны 2. Внутреннее enum-поле."
          required: true

        - name: "party_B_spousal_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["consent_present", "not_married_confirmed", "prenuptial_referenced", "not_defined"]
          display_in_grid: false
          description: "Режим согласия супруга Стороны 2. Внутреннее enum-поле."
          required: true

        - name: "party_B_spousal_details"
          type: "string"
          presentation: "fact"
          label: "Согласие супруга Стороны 2"
          description: >
            Сведения о согласии супруга или семейном положении Стороны 2. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: barter_subject_and_valuation
    name: "Предмет договора мены: описание товаров, оценка равноценности и доплата"
    description: >
      Фактографическая проверка описания обоих обмениваемых товаров,
      их индивидуализирующих признаков, метода оценки, равноценности
      и порядка доплаты при неравноценном обмене.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товар"
        - "обмениваемый"
        - "передаёт в собственность"
        - "получает в собственность"
        - "наименование"
        - "количество"
        - "стоимость"
        - "равноценный"
        - "неравноценный"
        - "доплата"
