        Фрагмент:
        "Передача обоих товаров осуществляется одновременно 15.04.2026 по адресу:
        г. Москва, ул. Ленина, д. 1. Передача оформляется двусторонним актом
        приёма-передачи. Расходы на доставку каждый несёт самостоятельно.
        Страхование не предусмотрено."

