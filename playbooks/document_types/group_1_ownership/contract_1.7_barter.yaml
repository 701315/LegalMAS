        Не анализируй стороны, наименования товаров, качество или расторжение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. currency_control_status — "defined" если валютный контроль прямо урегулирован, иначе "not_defined".
        2. bank_registration_status — "defined" если постановка на учёт в уполномоченном банке прямо упомянута, иначе "not_defined".
        3. customs_procedure_status — "defined" если таможенное оформление прямо описано, иначе "not_defined".
        4. counter_delivery_deadline_status — "defined" если срок встречной поставки прямо указан, иначе "not_defined".
        5. counter_delivery_deadline — конкретный срок встречной поставки.
        6. incoterms_status — "defined" если термин Incoterms прямо указан, иначе "not_defined".
        7. incoterms_term — конкретный термин Incoterms (EXW, CIF, FOB и т.п.).
        8. sanctions_check_status — "defined" если санкционный скрининг прямо упомянут, иначе "not_defined".

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Не применяй нормы ФЗ-173 по умолчанию.
        - not_defined = применимое право прямо не указано.
        - Incoterms_term — пиши только конкретный термин из договора (EXW, CIF, FOB и т.п.).
        - Пиши кратко.
        - Верни только JSON.
        </rules>
      fields:
        - name: "currency_control_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования вопросов валютного контроля."
          required: true
        - name: "bank_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о постановке на учёт в уполномоченном банке."
          required: false
        - name: "customs_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения таможенной процедуры для обмениваемых товаров."
          required: false
        - name: "counter_delivery_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока встречной поставки по ВЭД-бартеру."
          required: false
        - name: "counter_delivery_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок встречной поставки"
          description: "Конкретный срок встречной поставки по внешнеторговому бартеру."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "incoterms_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия термина Incoterms в договоре."
          required: false
        - name: "incoterms_term"
          type: "string"
          presentation: "fact"
          label: "Базис поставки (Incoterms)"
          description: "Термин Incoterms, определяющий базис поставки при ВЭД-бартере."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "sanctions_check_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о санкционном скрининге контрагента."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты обеих сторон (наименование/ФИО, ИНН, ОГРН/ОГРНИП, адрес);
      (б) полномочия подписантов (устав, доверенность, решение о назначении);
      (в) документы о корпоративном одобрении — протокол общего собрания /
      решение единственного участника / одобрение совета директоров —
      либо заключение о том, что сделка не является крупной и не имеет заинтересованности;
      (г) нотариальное согласие супруга/супруги (для физических лиц) либо
      подтверждение отсутствия брака / личной собственности / брачного договора.
    addressee: "Обе стороны / Юридический советник каждой стороны"

  barter_subject_extraction:
    text: >
      Просим предоставить полные данные об обмениваемых товарах по {doc_names}:
      (а) наименование, количество, характеристики и индивидуализирующие признаки
      каждого товара (серийные номера, VIN, кадастровые номера и т.п.);
      (б) стоимость каждого товара для целей договора и для целей налогообложения;
      (в) заявление о равноценности / неравноценности;
      (г) при неравноценности — размер, срок и порядок уплаты доплаты.
    addressee: "Обе стороны"

  valuation_and_surcharge_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) метод оценки стоимости каждого товара (рыночная / договорная / независимый оценщик);
      (б) заявление о равноценности / неравноценности;
      (в) при неравноценности — конкретный размер, срок и реквизиты для уплаты доплаты,
      последствия просрочки доплаты;
      (г) порядок разрешения споров об оценке (независимая экспертиза / оценщик / суд).
    addressee: "Обе стороны / Юридический советник"

  delivery_transfer_and_documents:
    text: >
      Просим согласовать по {doc_names}:
      (а) порядок и сроки передачи каждого товара (одновременно / последовательно),
      конкретные даты или предельные сроки;
      (б) место передачи каждого товара;
      (в) форму и содержание акта приёма-передачи для каждого товара;
      (г) кто несёт расходы на доставку/транспортировку;
      (д) перечень сопроводительных документов (ТТН, CMR, счёт-фактура и т.п.);
      (е) условия страхования при перевозке или хранении до передачи.
    addressee: "Обе стороны"

  simultaneous_transfer_mechanism_check:
    text: >
      В {doc_names} недостаточно проработан механизм обеспечения одновременности
      или защиты при последовательной передаче товаров. Просим предложить:
      (а) одновременную передачу через нотариуса / агента;
      (б) эскроу / аккредитив;
      (в) задаток / банковскую гарантию;
      (г) право приостановления исполнения первой стороны (ст. 328 ГК РФ);
      (д) иной механизм защиты согласно практике сторон.
    addressee: "Юридический советник"

  ownership_transfer_timing_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) момент перехода права собственности на каждый из товаров
      (по умолчанию — после исполнения обеими сторонами по ст. 570 ГК РФ;
      стороны вправе изменить этот момент);
      (б) момент перехода риска случайной гибели / повреждения для каждого товара;
      (в) при последовательной передаче — урегулирование разрыва между
      моментами права и риска.
    addressee: "Юридический советник"

  quality_warranty_and_claims:
    text: >
      Просим уточнить по {doc_names}:
      (а) гарантии качества для каждого товара и гарантийные сроки;
      (б) порядок приёмки по качеству (внешний осмотр, экспертиза, протокол);
      (в) порядок, форму и сроки предъявления претензий по недостаткам (явным и скрытым);
      (г) обязанность сохранения рекламируемого товара до разрешения спора;
      (д) последствия выявления недостатков (замена / уменьшение стоимости / возврат и убытки).
    addressee: "Обе стороны / Юридический советник"

  encumbrances_and_eviction_warranty:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения обеих сторон об отсутствии обременений, залога, ареста,
      прав третьих лиц на каждый из обмениваемых товаров;
      (б) явную оговорку о гарантии от эвикции (ст. 571 ГК РФ) — последствия
      изъятия полученного товара третьим лицом: право требовать возврата своего
      товара и возмещения убытков.
    addressee: "Обе стороны"

  tax_consequences_disclosure_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) порядок исчисления НДС при мене (ст. 154 НК РФ — налоговая база
      по рыночной стоимости каждого товара);
      (б) стоимость товаров для целей налогообложения (рыночная / договорная);
      (в) обязанность выставления счетов-фактур и сроки;
      (г) НДФЛ для физических лиц — расчёт дохода как рыночной стоимости
      полученного товара;
      (д) подтверждение рыночности оценки для целей трансфертного контроля
      (при взаимозависимости сторон).
    addressee: "Налоговый консультант / Юридический советник"

  sham_transaction_and_business_purpose:
    text: >
      Рекомендуем в отношении {doc_names}:
      (а) включить описание деловой цели и экономического обоснования мены;
      (б) при взаимозависимости или аффилированности сторон — раскрыть это
      в тексте договора или сопроводительном письме;
      (в) подтвердить рыночность оценки обоих товаров заключением независимого оценщика;
      (г) задокументировать экономический смысл сделки для защиты по ст. 170 ГК РФ
      и ст. 54.1 НК РФ.
    addressee: "Юридический советник / Оценщик"

  non_performance_consequences_check:
    text: >
      Просим уточнить по {doc_names} последствия неисполнения обязательств
      одной из сторон:
      (а) право на расторжение договора;
      (б) возврат уже переданного товара при расторжении;
      (в) возмещение убытков (реальный ущерб и упущенная выгода);
      (г) неустойка — размер (фиксированный / процент от стоимости товара) и порядок начисления;
      (д) право удержания переданного товара до получения встречного исполнения.
    addressee: "Юридический советник"

  termination_liability_disputes:
    text: >
      Просим уточнить по {doc_names}:
      (а) основания и порядок расторжения, последствия (возврат товаров, компенсация);
      (б) форс-мажорная оговорка: перечень обстоятельств, срок и форма уведомления,
      документальное подтверждение, последствия для обязательств;
      (в) ограничения на уступку прав / перевод долга без согласия другой стороны;
      (г) условия конфиденциальности: перечень сведений, срок, исключения, санкции;
      (д) претензионный порядок: срок направления и рассмотрения претензии;
      (е) подсудность (арбитражный суд / суд общей юрисдикции / третейский суд);
      (ж) применимое право — подтверждение выбора права РФ или иного с обоснованием.
    addressee: "Юридический советник"

  real_estate_barter_specifics_check:
    text: >
      Для {doc_names} (мена недвижимости) просим предоставить:
      (а) кадастровые номера обоих объектов;
      (б) свежие выписки из ЕГРН (не старше 30 дней);
      (в) правоустанавливающие документы на каждый объект;
      (г) подтверждение отсутствия обременений, залогов, арестов;
      (д) перечень лиц, зарегистрированных в жилом помещении,
      или подтверждение их отсутствия;
      (е) порядок и сроки одновременной подачи документов в Росреестр;
      (ж) распределение расходов на государственную пошлину.
    addressee: "Обе стороны / Юридический советник"

  vehicle_barter_specifics_check:
    text: >
      Для {doc_names} (мена транспортных средств) просим предоставить:
      (а) VIN и основные характеристики каждого транспортного средства;
      (б) оригиналы ПТС / электронные ПТС;
      (в) справки из ГИБДД об отсутствии ограничений и розыска;
      (г) выписку из реестра уведомлений о залоге (нотариат);
      (д) порядок и сроки перерегистрации (10 дней по закону);
      (е) действующий полис ОСАГО или порядок его оформления;
      (ж) диагностическую карту / акт технического осмотра;
      (з) заверения о техническом состоянии и отсутствии скрытых дефектов.
    addressee: "Обе стороны"

  cross_border_barter_check:
    text: >
      Для {doc_names} (внешнеторговый бартер) просим предоставить:
      (а) подтверждение постановки контракта на учёт в уполномоченном банке
      (или план постановки с указанием банка и срока);
      (б) описание таможенной процедуры и таможенного режима для каждого товара;
      (в) согласованный срок встречной поставки с учётом требований ФЗ-173;
      (г) базис поставки по Incoterms (если применимо);
      (д) санкционный скрининг контрагента и товаров;
      (е) анализ применимого права и юрисдикции споров.
    addressee: "Юридический советник / Таможенный брокер / Банк"

  sham_transaction_risk:
    text: >
      Внимание: для {doc_names} выявлен риск квалификации как притворная сделка
      (ст. 170 ГК РФ). Рекомендуем:
      (а) включить обоснование деловой цели;
      (б) подтвердить рыночность оценки обоих товаров независимым оценщиком;
      (в) раскрыть аффилированность сторон (при наличии);
      (г) зафиксировать экономический смысл сделки в тексте договора.
    addressee: "Юридический советник"

  real_estate_barter_registration_required:
    text: >
      Внимание: для {doc_names} (мена недвижимости) переход права собственности
      подлежит обязательной государственной регистрации (ФЗ-218). Просим согласовать:
      (а) порядок и сроки подачи документов в Росреестр;
      (б) распределение расходов на государственную пошлину;
      (в) последствия отказа в регистрации для обязательств сторон.
    addressee: "Обе стороны / Юридический советник"

  interested_party_transaction_approval:
    text: >
      Внимание: для {doc_names} может потребоваться корпоративное одобрение
      (крупная сделка / сделка с заинтересованностью по ФЗ-14 / ФЗ-208). Просим:
      (а) предоставить протокол одобрения или решение единственного участника;
      (б) либо предоставить заключение о том, что сделка не является крупной
      и не имеет признаков заинтересованности.
    addressee: "Юридический советник каждой стороны"

  cross_border_barter_compliance:
    text: >
      Внимание: {doc_names} содержит признаки внешнеторгового бартера. Просим предоставить:
      (а) анализ соответствия ФЗ-173 (валютный контроль);
      (б) проект таможенных деклараций для каждого товара;
      (в) подтверждение постановки на учёт в уполномоченном банке;
      (г) расчёт допустимых сроков встречных поставок;
      (д) санкционный скрининг контрагента и номенклатуры товаров.
    addressee: "Юридический советник / Таможенный брокер"

  unequal_exchange_disguised_gift_risk:
    text: >
      Внимание: {doc_names} содержит признаки неравноценного обмена без доплаты
      между коммерческими организациями. Это создаёт риск квалификации как частичное
      дарение (запрещено ст. 575 ГК РФ). Просим:
      (а) обосновать равноценность или включить условие о доплате;
      (б) получить независимую оценку обоих товаров;
      (в) задокументировать деловую цель сделки.
    addressee: "Юридический советник / Оценщик"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

