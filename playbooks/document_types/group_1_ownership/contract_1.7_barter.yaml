      store_payload: true

  - id: encumbrances_and_eviction_warranty
    name: "Обременения, права третьих лиц и гарантия от эвикции (ст. 460-461, 571 ГК РФ)"
    description: >
      Фактографическая проверка заверений об отсутствии обременений на оба товара
      и гарантий от эвикции по ст. 571 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не обременён"
        - "отсутствие обременений"
        - "не заложен"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "гарантирует"
        - "эвикция"
        - "изъятие товара"
        - "ст. 571"
        - "ст. 461"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сторон(а|ы).*гарантиру(ет|ют).*отсутствие.*обременений"
        - "(?i)(не\\s+обременён|свободен\\s+от.*прав)"
        - "(?i)изъят(ие|ии)\\s+товар"
        - "(?i)эвикци"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 460-461, 571 ГК РФ).
        Проверяется только один вопрос: гарантии отсутствия обременений на оба
        товара и защита от эвикции.
        Не анализируй качество, сроки передачи, доставку или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение об отсутствии обременений/залога/ареста на товар A.
        2. Заверение об отсутствии обременений/залога/ареста на товар B.
        3. Гарантия от эвикции (ст. 571 ГК РФ) и её последствия.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. Общая фраза о свободе обоих товаров покрывает A и B.
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Оба товара свободны от прав третьих лиц, обременений и арестов.
        При изъятии товара третьим лицом передавшая сторона возмещает убытки
        и возвращает полученный товар."
        Ответ:
        {
          "good_A_encumbrance_status": "defined",
          "good_A_encumbrance_details": "свободен от прав третьих лиц и обременений",
          "good_A_pledge_status": "defined",
          "good_A_arrest_status": "defined",
          "good_B_encumbrance_status": "defined",
          "good_B_encumbrance_details": "свободен от прав третьих лиц и обременений",
          "good_B_pledge_status": "defined",
          "good_B_arrest_status": "defined",
          "eviction_warranty_status": "defined",
          "eviction_consequences_status": "defined",
          "eviction_consequences_details": "возмещение убытков и возврат товара",
          "evidence": [{"clause_ref": "п. 4.1", "quote": "..."}]
        }

        Пример 2:
        "Стороны передают товары."
        Ответ:
        {
          "good_A_encumbrance_status": "not_defined",
          "good_A_encumbrance_details": "Данные не определены",
          "good_A_pledge_status": "not_defined",
          "good_A_arrest_status": "not_defined",
          "good_B_encumbrance_status": "not_defined",
          "good_B_encumbrance_details": "Данные не определены",
          "good_B_pledge_status": "not_defined",
          "good_B_arrest_status": "not_defined",
          "eviction_warranty_status": "not_defined",
          "eviction_consequences_status": "not_defined",
          "eviction_consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Заверения для каждого товара отдельно или совместно?
        2. Эвикция — прямо упомянута?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "good_A_encumbrance_status": "<defined / not_defined>",
          "good_A_encumbrance_details": "<текст или 'Данные не определены'>",
          "good_A_pledge_status": "<defined / not_defined>",
          "good_A_arrest_status": "<defined / not_defined>",
          "good_B_encumbrance_status": "<defined / not_defined>",
          "good_B_encumbrance_details": "<текст или 'Данные не определены'>",
          "good_B_pledge_status": "<defined / not_defined>",
          "good_B_arrest_status": "<defined / not_defined>",
          "eviction_warranty_status": "<defined / not_defined>",
          "eviction_consequences_status": "<defined / not_defined>",
          "eviction_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 580
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не обременён отсутствие обременений не заложен не находится под арестом свободен от прав третьих лиц гарантирует отсутствие обременений эвикция изъятие товара ст. 571 ГК РФ ст. 461 ГК РФ ст. 460 ГК РФ"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "гарантия качества"
        - "гарантийный срок"
        - "технические характеристики"
        - "претензия по качеству"
        - "недостатки товара"
        - "неустойка за неисполнение"
        - "расторжение"
        - "НДС"
        - "налоговая база"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1150

      compact_output: false

      presence_signal:
        field: "encumbrances_and_eviction_warranty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены заверения об отсутствии обременений, залогов и арестов на оба товара, а также гарантию от эвикции.
        Не анализируй качество, сроки передачи, доставку или ответственность за неисполнение.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. encumbrances_and_eviction_warranty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (good_A_encumbrance_status, good_A_pledge_status, good_A_arrest_status,
              good_B_encumbrance_status, good_B_pledge_status, good_B_arrest_status,
              eviction_warranty_status, eviction_consequences_status) ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - good_A_encumbrance_status = "not_defined";
           - good_A_pledge_status = "not_defined";
           - good_A_arrest_status = "not_defined";
           - good_B_encumbrance_status = "not_defined";
           - good_B_pledge_status = "not_defined";
           - good_B_arrest_status = "not_defined";
           - eviction_warranty_status = "not_defined";
           - eviction_consequences_status = "not_defined";
           - good_A_encumbrance_details, good_B_encumbrance_details = "Данные не определены";
           - eviction_consequences_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. good_A_encumbrance_status:
           - "defined" — если заверение об отсутствии обременений на товар A прямо указано;
           - "not_defined" — если не указано.

        2. good_A_encumbrance_details:
           Текст заверения по товару A.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. good_A_pledge_status:
           - "defined" — если залог для товара A прямо упомянут или прямо исключён;
           - "not_defined" — если не указано.

        4. good_A_arrest_status:
           - "defined" — если арест для товара A прямо упомянут или прямо исключён;
           - "not_defined" — если не указано.

        5. good_B_encumbrance_status:
           - "defined" — если заверение об отсутствии обременений на товар B прямо указано;
           - "not_defined" — если не указано.

        6. good_B_encumbrance_details:
           Текст заверения по товару B.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. good_B_pledge_status:
           - "defined" — если залог для товара B прямо упомянут или прямо исключён;
           - "not_defined" — если не указано.

        8. good_B_arrest_status:
           - "defined" — если арест для товара B прямо упомянут или прямо исключён;
           - "not_defined" — если не указано.

        9. eviction_warranty_status:
           - "defined" — если гарантия от эвикции прямо указана;
           - "not_defined" — если не указана.

        10. eviction_consequences_status:
            - "defined" — если последствия эвикции прямо описаны;
            - "not_defined" — если не описаны.

        11. eviction_consequences_details:
            Текст последствий эвикции.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни encumbrances_and_eviction_warranty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Только текст договора.
        - Общая фраза "оба товара свободны от обременений" = defined для A и B.
        - good_A_pledge_status = defined только если залог для товара A прямо упомянут или прямо исключён.
        - good_A_arrest_status = defined только если арест для товара A прямо упомянут или прямо исключён.
        - Аналогично для товара B.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни заверений об отсутствии обременений, ни гарантии от эвикции.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Общее заверение без детализации.
           Указано, что "оба товара свободны от прав третьих лиц и обременений",
           без отдельного упоминания залога и ареста.
           → presence = "present";
             good_A_encumbrance_status = good_B_encumbrance_status = "defined";
             good_A_pledge_status = good_A_arrest_status = good_B_pledge_status = good_B_arrest_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указано, что товар не заложен, а в другом — что товар
           передаётся с обременением.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Гарантия от эвикции без последствий.
           Указано, что передавшая сторона гарантирует защиту от эвикции,
           но конкретные последствия изъятия товара третьим лицом не описаны.
           → presence = "present";
             eviction_warranty_status = "defined";
             eviction_consequences_status = "not_defined";
             eviction_consequences_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для encumbrances_and_eviction_warranty_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "encumbrances_and_eviction_warranty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обременениям / эвикции в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "good_A_encumbrance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об обременениях товара A. Внутреннее enum-поле."
          required: true

        - name: "good_A_encumbrance_details"
          type: "string"
          presentation: "fact"
          label: "Обременения товара A"
          description: >
            Заверение об отсутствии обременений на товар A. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "good_A_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога на товар A. Внутреннее enum-поле."
          required: true

        - name: "good_A_arrest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии ареста на товар A. Внутреннее enum-поле."
          required: true

        - name: "good_B_encumbrance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об обременениях товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_encumbrance_details"
          type: "string"
          presentation: "fact"
          label: "Обременения товара B"
          description: >
            Заверение об отсутствии обременений на товар B. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "good_B_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога на товар B. Внутреннее enum-поле."
          required: true

        - name: "good_B_arrest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии ареста на товар B. Внутреннее enum-поле."
          required: true

        - name: "eviction_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантии от эвикции. Внутреннее enum-поле."
          required: true

        - name: "eviction_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания последствий эвикции. Внутреннее enum-поле."
          required: true

        - name: "eviction_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия эвикции"
          description: >
            Последствия изъятия товара третьим лицом. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: tax_consequences_disclosure_check
    name: "Налоговые последствия мены: НДС, НДФЛ, налоговая база"
    description: >
      Фактографическая проверка наличия налоговых оговорок: НДС при мене,
      налоговая база, счета-фактуры, НДФЛ для физических лиц.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговые последствия"
        - "НДС при мене"
        - "налоговая база"
        - "стоимость для целей налогообложения"
        - "счёт-фактура"
        - "реализация при мене"
        - "НДФЛ"
        - "встречная реализация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых|ой)\\s+(последстви|баз|обязательств)"
        - "(?i)НДС.*при.*мен"
        - "(?i)реализаци.*для.*целей.*налогообложен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 39, 154, 168 НК РФ).
        Проверяется только один вопрос: налоговые оговорки в договоре.
        Не анализируй цену товаров, сроки передачи или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Налоговую оговорку (НДС: включён / не включён / освобождение).
        2. Стоимость для целей налогообложения.
        3. Обязанность выставления счетов-фактур.
        4. НДФЛ для физических лиц (упомянут / нет).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
