  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Налоговые последствия мены
  # ──────────────────────────────────────────────────────────────────────────
  - id: tax_consequences_disclosure_check
    name: "Налоговые последствия мены: НДС, НДФЛ, налоговая база"
    description: >
      Фактографическая проверка наличия налоговых оговорок: НДС при мене,
      налоговая база, счета-фактуры, НДФЛ для физических лиц.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговые последствия"
        - "НДС при мене"
        - "налоговая база"
        - "стоимость для целей налогообложения"
        - "счёт-фактура"
        - "реализация при мене"
        - "НДФЛ"
        - "встречная реализация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых|ой)\\s+(последстви|баз|обязательств)"
        - "(?i)НДС.*при.*мен"
        - "(?i)реализаци.*для.*целей.*налогообложен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 39, 154, 168 НК РФ).
        Проверяется только один вопрос: налоговые оговорки в договоре.
        Не анализируй цену товаров, сроки передачи или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Налоговую оговорку (НДС: включён / не включён / освобождение).
        2. Стоимость для целей налогообложения.
        3. Обязанность выставления счетов-фактур.
        4. НДФЛ для физических лиц (упомянут / нет).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Мена является встречной реализацией. Каждая из сторон начисляет НДС
        по ставке 20%. Налоговая база определяется исходя из рыночной стоимости
        каждого товара. Стороны обязуются выставить счета-фактуры в течение 5 дней."

        Ответ:
        {
          "tax_disclosure_status": "defined",
          "vat_treatment_status": "defined",
          "vat_treatment": "both_charge",
          "tax_base_method_status": "defined",
          "tax_base_method": "market",
          "invoice_obligation_status": "defined",
          "ndfl_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Мена является встречной реализацией. Каждая из сторон начисляет НДС по ставке 20%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны передают товары в согласованные сроки."

        Ответ:
        {
          "tax_disclosure_status": "not_defined",
          "vat_treatment_status": "not_defined",
          "vat_treatment": "not_defined",
          "tax_base_method_status": "not_defined",
          "tax_base_method": "not_defined",
          "invoice_obligation_status": "not_defined",
          "ndfl_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Написано ли прямо про НДС?
        2. Стоимость "для целей налогообложения" — прямо?
        3. Счета-фактуры — упомянуты?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "tax_disclosure_status": "<defined / not_defined>",
          "vat_treatment_status": "<defined / not_defined>",
          "vat_treatment": "<both_charge / exempt / not_specified / not_defined>",
          "tax_base_method_status": "<defined / not_defined>",
          "tax_base_method": "<market / contractual / not_defined>",
          "invoice_obligation_status": "<defined / not_defined>",
          "ndfl_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговые последствия НДС при мене налоговая база стоимость для целей налогообложения счёт-фактура реализация при мене НДФЛ встречная реализация ст. 154 НК РФ ст. 39 НК РФ ст. 54.1 НК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "стоимость товара для расчёта доплаты"
        - "рыночная стоимость для доплаты"
        - "оценщик для доплаты"
        - "обременения"
        - "залог"
        - "эвикция"
        - "гарантия качества"
        - "претензия по качеству"
        - "расторжение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 360
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены налоговые оговорки:
        НДС, налоговая база, счета-фактуры и НДФЛ для физических лиц.
        Не анализируй цену товаров, сроки передачи, ответственность или обременения.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. tax_disclosure_status — "defined" или "not_defined".
        2. vat_treatment_status — "defined" или "not_defined".
        3. vat_treatment — both_charge / exempt / not_specified / not_defined.
        4. tax_base_method_status — "defined" или "not_defined".
        5. tax_base_method — market / contractual / not_defined.
        6. invoice_obligation_status — "defined" или "not_defined".
        7. ndfl_status — "defined" или "not_defined".

        Если данных нет: статус = "not_defined".
        </task>

        <rules>
        - Только текст договора.
        - both_charge = обе стороны начисляют НДС как при встречной реализации.
        - exempt = мена прямо освобождена от НДС.
        - not_specified = вопрос НДС упомянут, но режим прямо не определён.
        - market = налоговая база определяется по рыночной стоимости.
        - contractual = налоговая база определяется по договорной стоимости.
        - Верни только JSON.
        </rules>
      fields:
        - name: "tax_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия налоговых оговорок."
          required: true
        - name: "vat_treatment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о НДС."
          required: false
        - name: "vat_treatment"
          type: "string"
          presentation: "signal"
          label: "Режим НДС"
          allowed_values: ["both_charge", "exempt", "not_specified", "not_defined"]
          description: "Порядок начисления НДС."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "tax_base_method_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус метода определения налоговой базы."
          required: false
        - name: "tax_base_method"
          type: "string"
          presentation: "signal"
          label: "Метод определения налоговой базы"
          allowed_values: ["market", "contractual", "not_defined"]
          description: "Метод определения налоговой базы."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "invoice_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности выставить счёт-фактуру."
          required: false
        - name: "ndfl_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания НДФЛ для физических лиц."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Деловая цель и аффилированность
  # ──────────────────────────────────────────────────────────────────────────
  - id: sham_transaction_and_business_purpose
    name: "Деловая цель, притворность и аффилированность (ст. 170 ГК РФ, ст. 54.1 НК РФ)"
    description: >
      Фактографическая проверка наличия обоснования деловой цели, раскрытия
      аффилированности и подтверждения рыночности оценки.
    triggers:
      any: ["legal_entity_party"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "деловая цель"
        - "экономическая обоснованность"
        - "хозяйственный смысл"
        - "не является притворной"
        - "аффилированные лица"
        - "взаимозависимые лица"
        - "рыночная стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)делов(ая|ой)\\s+цел"
        - "(?i)аффилированн"
        - "(?i)взаимозависим"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (ст. 170 ГК РФ; ст. 54.1 НК РФ).
        Проверяется наличие обоснования деловой цели и раскрытия аффилированности.
        Не анализируй налоговые оговорки, обременения или сроки передачи.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описание деловой цели или экономического обоснования мены.
        2. Информацию об аффилированности или взаимозависимости сторон.
        3. Подтверждение рыночности оценки (оценщик / экспертиза).

        [ПРАВИЛА]
