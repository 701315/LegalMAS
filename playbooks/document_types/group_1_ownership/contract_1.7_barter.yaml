          "transfer_sequence_status": "<defined / not_defined>",
          "transfer_sequence": "<simultaneous / sequential / not_defined>",
          "good_A_transfer_deadline_status": "<defined / not_defined>",
          "good_A_transfer_deadline": "<срок/дата или 'Данные не определены'>",
          "good_B_transfer_deadline_status": "<defined / not_defined>",
          "good_B_transfer_deadline": "<срок/дата или 'Данные не определены'>",
          "transfer_location_status": "<defined / not_defined>",
          "transfer_location_details": "<место или 'Данные не определены'>",
