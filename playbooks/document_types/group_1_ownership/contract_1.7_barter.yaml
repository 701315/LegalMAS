        - name: "good_A_warranty_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения гарантийного срока товара A. Внутреннее enum-поле."
