#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_corporate_authority
    name: "Стороны договора мены: идентификация, полномочия и корпоративное одобрение"
    description: >
      Фактографическая проверка наличия реквизитов обеих сторон, полномочий
      подписантов и корпоративного одобрения для юридических лиц.
      Согласие супруга для физических лиц проверяется отдельным check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "Сторона 1"
        - "Сторона 2"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "протокол одобрения"
        - "решение единственного участника"
        - "не является крупной сделкой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сторона\\s+[12]|первая\\s+сторона|вторая\\s+сторона).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а).*собрани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ФЗ-14 ст. 45-46; ФЗ-208 ст. 78-84).
        Проверяется только один вопрос: идентификация сторон, полномочия подписантов
        и корпоративное одобрение.
        Не анализируй согласие супруга — это отдельный check.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Стороны 1 (ИНН/ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Стороны 1 (юридическое лицо / ИП / физическое лицо).
        3. Кто подписывает от Стороны 1 и на каком основании.
        4. Наименование и реквизиты Стороны 2.
        5. Тип Стороны 2.
        6. Кто подписывает от Стороны 2 и на каком основании.
        7. Корпоративное одобрение или заверение о его ненужности.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "Данные не определены".
        3. В evidence — только цитаты из документа.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Сторона 1 — ООО «Техника», ИНН 7700000001, ОГРН 1027700000001,
        в лице Директора Иванова А.А., действующего на основании Устава.
        Сделка одобрена решением единственного участника от 01.03.2026.
        Сторона 2 — гражданин Петров Б.Б., паспорт серия 45 00 № 123456."
        Ответ:
        {
          "party_A_details_status": "defined",
          "party_A_details_value": "ООО «Техника», ИНН 7700000001, ОГРН 1027700000001",
          "party_A_type": "legal_entity",
          "party_A_signatory": "Директор Иванов А.А.",
          "party_A_signatory_basis": "charter",
          "party_B_details_status": "defined",
          "party_B_details_value": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "party_B_type": "individual",
          "party_B_signatory": "Петров Б.Б.",
          "party_B_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "решение единственного участника от 01.03.2026",
          "evidence": [{"clause_ref": "преамбула", "quote": "..."}]
        }

        Пример 2:
        "Настоящий договор заключён между Стороной 1 и Стороной 2."
        Ответ:
        {
          "party_A_details_status": "not_defined",
          "party_A_details_value": "Данные не определены",
          "party_A_type": "not_defined",
          "party_A_signatory": "Данные не определены",
          "party_A_signatory_basis": "not_defined",
          "party_B_details_status": "not_defined",
          "party_B_details_value": "Данные не определены",
          "party_B_type": "not_defined",
          "party_B_signatory": "Данные не определены",
          "party_B_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. ИНН/ОГРН для ЮЛ или паспорт для физлица — прямо?
        2. Подписант и документ-основание — прямо?
        3. Одобрение — упомянуто?
        4. Не ищи согласие супруга.

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "party_A_details_status": "<defined / not_defined>",
          "party_A_details_value": "<реквизиты или 'Данные не определены'>",
          "party_A_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_A_signatory": "<ФИО или 'Данные не определены'>",
          "party_A_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "party_B_details_status": "<defined / not_defined>",
          "party_B_details_value": "<реквизиты или 'Данные не определены'>",
          "party_B_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "party_B_signatory": "<ФИО или 'Данные не определены'>",
          "party_B_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Сторона 1 Сторона 2 именуем в лице действующего на основании ИНН ОГРН ОГРНИП крупная сделка сделка с заинтересованностью одобрение общего собрания одобрение совета директоров протокол одобрения решение единственного участника не является крупной сделкой"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "согласие супруга"
        - "в браке не состоит"
        - "маткапитал"
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "передача товара"
        - "акт приёма-передачи"
        - "обременения"
        - "залог"
        - "эвикция"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "parties_corporate_authority_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора мены реквизиты обеих сторон, их типы лиц, подписантов, основания полномочий и сведения о наличии/отсутствии корпоративного одобрения.
        Не анализируй согласие супруга — оно проверяется в рамках другого check-а.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_corporate_authority_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (party_A_details_status, party_B_details_status, corporate_approval_status) ≠ "not_defined";
           - "missing" — если все три содержательных статусных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - party_A_details_status = "not_defined";
           - party_A_type = "not_defined";
           - party_A_signatory_basis = "not_defined";
           - party_B_details_status = "not_defined";
           - party_B_type = "not_defined";
           - party_B_signatory_basis = "not_defined";
           - corporate_approval_status = "not_defined";
           - party_A_details_value, party_B_details_value = "Данные не определены";
           - party_A_signatory, party_B_signatory = "Данные не определены";
           - corporate_approval_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. party_A_details_status:
           - "defined" — если Сторона 1 прямо идентифицируется по тексту хотя бы по наименованию, ФИО или статусу ИП;
           - "not_defined" — если Сторона 1 не идентифицируется.

        2. party_A_details_value:
           Реквизиты Стороны 1 (наименование, ИНН, ОГРН для ЮЛ; ФИО, паспорт для физлица).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. party_A_type:
           Используй строго только одно из значений:
           - "legal_entity" (юридическое лицо);
           - "individual_entrepreneur" (ИП);
           - "individual" (физическое лицо);
           - "not_defined" (если тип невозможно определить).

        4. party_A_signatory:
           ФИО и должность лица, подписывающего договор со стороны Стороны 1.
           Если данных нет — "Данные не определены".

        5. party_A_signatory_basis:
           Основание полномочий подписанта Стороны 1. Используй только:
           - "charter" — устав;
           - "poa" — доверенность;
           - "order" — приказ;
           - "personal" — физлицо подписывает лично;
           - "other" — иное основание;
           - "not_defined" — если основание отсутствует или не указано.

        6. party_B_details_status:
           - "defined" — если Сторона 2 прямо идентифицируется по тексту;
           - "not_defined" — если Сторона 2 не идентифицируется.

        7. party_B_details_value:
           Реквизиты Стороны 2 по тем же правилам, что и для Стороны 1.
           Если данных нет — "Данные не определены".

        8. party_B_type:
           Тип Стороны 2. Используй строго те же enum-значения, что и для Стороны 1.

        9. party_B_signatory:
           ФИО и должность подписанта со стороны Стороны 2.

        10. party_B_signatory_basis:
            Основание полномочий подписанта Стороны 2. Используй строго те же enum-значения, что и для Стороны 1.

        11. corporate_approval_status:
            - "defined" — если в договоре прямо указано решение об одобрении сделки как крупной/заинтересованной, либо содержится прямое заверение сторон о том, что сделка не является крупной/не требует одобрения;
            - "not_defined" — если упоминаний о корпоративном одобрении или его ненадобности нет.

        12. corporate_approval_details:
            Текст о корпоративном одобрении или заверении о ненадобности одобрения.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_corporate_authority_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/type/basis = "not_defined", все текстовые поля = "Данные не определены".
        - Не смешивай реквизиты Стороны 1 (party_A) и Стороны 2 (party_B).
        - Игнорируй в рамках этого check-а любые условия о согласии супруга (это предмет другого анализа).
        - Для basis используй "personal", только если физлицо или ИП подписывает договор прямо от своего имени без доверенности.
        - Не используй законодательные презумпции для вывода оснований полномочий, если они не указаны в тексте.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни названий сторон, ни реквизитов, ни упоминания одобрения.
           → presence = "missing"; все статус-поля = "not_defined"; все текстовые поля = "Данные не определены".

        2. Упоминание ролей без идентификации.
           В тексте используются только слова "Сторона 1" и "Сторона 2" без ИНН, ФИО и реквизитов.
           → presence = "present"; party_A_details_status = party_B_details_status = "not_defined"; details_value = "Данные не определены".

        3. Противоречивые реквизиты или подписанты.
           В преамбуле указан один подписант, а в блоке подписей — другой без объяснения причин.
           → presence = "unclear"; соответствующий status = "not_defined"; текстовое поле = "Не удалось определить".

        4. Ограниченное заверение об одобрении.
           Указано лишь, что "стороны гарантируют соблюдение уставов" без прямой формулировки об отсутствии необходимости одобрения сделки мены.
           → behavior: corporate_approval_status = "not_defined"; corporate_approval_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
