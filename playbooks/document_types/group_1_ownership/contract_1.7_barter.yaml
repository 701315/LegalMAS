           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - object_A_cadastral_status = "not_defined";
           - object_B_cadastral_status = "not_defined";
           - egrn_extract_status = "not_defined";
           - encumbrances_warranty_status = "not_defined";
           - registration_procedure_status = "not_defined";
           - registration_cost_status = "not_defined";
           - residents_list_status = "not_defined";
           - residents_list_regime = "not_defined";
           - transfer_act_status = "not_defined";
           - simultaneous_registration_status = "not_defined";
           - object_A_cadastral_value, object_B_cadastral_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. object_A_cadastral_status:
           - "defined" — если в тексте прямо указан кадастровый номер объекта A в формате XX:XX:XXXXXXX:X;
           - "not_defined" — если номер прямо не указан.

        2. object_A_cadastral_value:
           Кадастровый номер объекта A.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. object_B_cadastral_status:
           - "defined" — если в тексте прямо указан кадастровый номер объекта B в формате XX:XX:XXXXXXX:X;
           - "not_defined" — если номер прямо не указан.

        4. object_B_cadastral_value:
           Кадастровый номер объекта B.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. egrn_extract_status:
           - "defined" — если в тексте прямо упомянута выписка из ЕГРН;
           - "not_defined" — если не упомянута.

        6. encumbrances_warranty_status:
           - "defined" — если в тексте прямо есть заверение об отсутствии обременений;
           - "not_defined" — если не указано.

        7. registration_procedure_status:
           - "defined" — если в тексте прямо описан порядок государственной регистрации перехода права;
           - "not_defined" — если не описан.

        8. registration_cost_status:
           - "defined" — если в тексте прямо распределены расходы на госпошлину;
           - "not_defined" — если не указано.

        9. residents_list_status:
           - "defined" — если в тексте прямо урегулирован вопрос зарегистрированных лиц (перечень или отсутствие);
           - "not_defined" — если не урегулирован.

        10. residents_list_regime:
            Используй строго только:
            - "listed" — перечень зарегистрированных лиц прямо приведён в договоре;
            - "explicitly_none" — прямо написано, что зарегистрированных лиц нет;
            - "not_defined" — вопрос зарегистрированных лиц прямо не урегулирован.

        11. transfer_act_status:
            - "defined" — если в тексте прямо упомянут передаточный акт;
            - "not_defined" — если не упомянут.

        12. simultaneous_registration_status:
            - "defined" — если в тексте прямо указано, что переход права регистрируется одновременно;
            - "not_defined" — если не указано.
        </task>

        <context_rules>
        - Перед остальными полями заполни real_estate_barter_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", object_A_cadastral_value и object_B_cadastral_value = "Данные не определены".
        - Только текст договора.
        - Кадастровый номер — только если прямо написан в формате XX:XX:XXXXXXX:X.
        - listed = перечень зарегистрированных лиц прямо приведён в договоре.
        - explicitly_none = прямо написано, что зарегистрированных лиц нет.
        - not_defined = вопрос зарегистрированных лиц прямо не урегулирован.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни кадастровых номеров, ни ЕГРН, ни условий о регистрации,
           ни жильцах, ни акта.
           → presence = "missing";
             все *_status = "not_defined";
             object_A_cadastral_value, object_B_cadastral_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указаны кадастровые номера объектов A и B, но не упомянуты выписка ЕГРН
           и порядок регистрации.
           → presence = "present";
             object_A_cadastral_status = object_B_cadastral_status = "defined";
             egrn_extract_status = "not_defined";
             registration_procedure_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных пунктах договора для одного и того же объекта указаны разные
           кадастровые номера.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Одновременная регистрация без порядка расходов.
           Указано, что переход права регистрируется одновременно, но распределение
           госпошлины между сторонами прямо не урегулировано.
           → presence = "present";
             registration_procedure_status = "defined";
             simultaneous_registration_status = "defined";
             registration_cost_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для real_estate_barter_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Для residents_list_regime используй только: "listed", "explicitly_none", "not_defined".
        - Fallback при отсутствии данных: object_A_cadastral_value, object_B_cadastral_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: object_A_cadastral_value, object_B_cadastral_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "real_estate_barter_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования специальных условий мены недвижимости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "object_A_cadastral_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус кадастрового номера объекта A. Внутреннее enum-поле."
          required: true

        - name: "object_A_cadastral_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер объекта A"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: >
            Кадастровый номер объекта A. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "object_B_cadastral_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус кадастрового номера объекта B. Внутреннее enum-поле."
          required: true

        - name: "object_B_cadastral_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер объекта B"
          regex_patterns: ["(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"]
          description: >
            Кадастровый номер объекта B. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "egrn_extract_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания выписки ЕГРН. Внутреннее enum-поле."
          required: true

        - name: "encumbrances_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об обременениях. Внутреннее enum-поле."
          required: true

        - name: "registration_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка госрегистрации. Внутреннее enum-поле."
          required: true

        - name: "registration_cost_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на госпошлину. Внутреннее enum-поле."
          required: true

        - name: "residents_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня зарегистрированных лиц. Внутреннее enum-поле."
          required: true

        - name: "residents_list_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Зарегистрированные лица"
          allowed_values: ["listed", "explicitly_none", "not_defined"]
          description: "Режим перечня зарегистрированных лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "transfer_act_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус передаточного акта. Внутреннее enum-поле."
          required: true

        - name: "simultaneous_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус одновременности регистрации. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: vehicle_barter_specifics_check
    name: "Мена транспортных средств: VIN, ПТС, ГИБДД, техсостояние, ОСАГО"
    description: >
      Фактографическая проверка специальных условий для мены транспортных средств.
    triggers:
      any: ["vehicle_barter"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "VIN"
        - "ПТС"
        - "СТС"
        - "регистрация в ГИБДД"
        - "перерегистрация"
        - "год выпуска"
        - "ОСАГО"
        - "диагностическая карта"
        - "техническое состояние"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bПТС\\b|\\bСТС\\b"
        - "(?i)регистрац.*ГИБДД|ГИБДД.*регистрац"
        - "(?i)\\bОСАГО\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены транспортных средств (ст. 567 ГК РФ).
        Проверяется только один вопрос: специальные условия для обмена ТС.
        Не анализируй общие условия передачи или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. VIN каждого транспортного средства.
        2. Условие о передаче ПТС/СТС.
        3. Порядок и срок перерегистрации в ГИБДД.
        4. Заверение о техническом состоянии.
        5. ОСАГО.
        6. Диагностическая карта.
        7. Заверение об отсутствии залога/ограничений.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. VIN — только если прямо написан.
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ТС A — Toyota Camry, VIN XW7BF4FK30S123456, 2021 г.в.
        ТС B — Hyundai Solaris, VIN Z94CB41ABDR000001, 2020 г.в.
        ПТС на каждый автомобиль передаётся при подписании акта.
        Перерегистрация в ГИБДД — в течение 10 дней.
        Оба автомобиля не находятся в залоге и без ограничений.
        ОСАГО оформляется каждой принимающей стороной самостоятельно."

        Ответ:
        {
          "vehicle_A_vin_status": "defined",
          "vehicle_A_vin_value": "XW7BF4FK30S123456",
          "vehicle_B_vin_status": "defined",
          "vehicle_B_vin_value": "Z94CB41ABDR000001",
          "pts_transfer_status": "defined",
          "gibdd_registration_status": "defined",
          "gibdd_registration_deadline_status": "defined",
          "gibdd_registration_deadline_value": "10 дней",
          "technical_condition_status": "not_defined",
          "osago_status": "defined",
          "diagnostic_card_status": "not_defined",
          "pledge_absence_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "ТС A — Toyota Camry, VIN XW7BF4FK30S123456, 2021 г.в."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обмениваются транспортными средствами."

        Ответ:
        {
          "vehicle_A_vin_status": "not_defined",
          "vehicle_A_vin_value": "Данные не определены",
          "vehicle_B_vin_status": "not_defined",
          "vehicle_B_vin_value": "Данные не определены",
          "pts_transfer_status": "not_defined",
          "gibdd_registration_status": "not_defined",
          "gibdd_registration_deadline_status": "not_defined",
          "gibdd_registration_deadline_value": "Данные не определены",
          "technical_condition_status": "not_defined",
          "osago_status": "not_defined",
          "diagnostic_card_status": "not_defined",
          "pledge_absence_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. VIN каждого ТС — прямо?
        2. ПТС — упомянут?
        3. Срок перерегистрации — конкретный?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "vehicle_A_vin_status": "<defined / not_defined>",
          "vehicle_A_vin_value": "<VIN или 'Данные не определены'>",
          "vehicle_B_vin_status": "<defined / not_defined>",
          "vehicle_B_vin_value": "<VIN или 'Данные не определены'>",
          "pts_transfer_status": "<defined / not_defined>",
          "gibdd_registration_status": "<defined / not_defined>",
          "gibdd_registration_deadline_status": "<defined / not_defined>",
          "gibdd_registration_deadline_value": "<срок или 'Данные не определены'>",
          "technical_condition_status": "<defined / not_defined>",
          "osago_status": "<defined / not_defined>",
          "diagnostic_card_status": "<defined / not_defined>",
          "pledge_absence_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "VIN ПТС СТС регистрация в ГИБДД перерегистрация транспортного средства год выпуска ОСАГО диагностическая карта техническое состояние автомобиля отсутствие залога на автомобиль ограничения регистрационных действий"
      preferred_unit_types:
        - obligation
        - warranty
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - representations
      negative_keywords:
        - "доплата"
        - "равноценный обмен"
        - "неравноценный обмен"
        - "рыночная стоимость"
        - "независимый оценщик"
        - "эвикция"
        - "изъятие товара"
        - "ст. 571 ГК РФ"
        - "налоговая база"
        - "НДС"
        - "деловая цель"
        - "аффилированность"
        - "форс-мажор"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1250

      compact_output: false

      presence_signal:
        field: "vehicle_barter_specifics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены транспортных средств специальные условия: VIN обоих ТС, ПТС/СТС, регистрация ГИБДД, техсостояние, ОСАГО, диагностическая карта, залог.
        Не анализируй общую ответственность, форс-мажор или подсудность.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_barter_specifics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (vehicle_A_vin_status, vehicle_B_vin_status,
              pts_transfer_status, gibdd_registration_status,
              gibdd_registration_deadline_status,
              technical_condition_status, osago_status,
              diagnostic_card_status, pledge_absence_status) ≠ "not_defined";
           - "missing" — если все девять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - vehicle_A_vin_status = "not_defined";
           - vehicle_B_vin_status = "not_defined";
           - pts_transfer_status = "not_defined";
           - gibdd_registration_status = "not_defined";
           - gibdd_registration_deadline_status = "not_defined";
           - technical_condition_status = "not_defined";
           - osago_status = "not_defined";
           - diagnostic_card_status = "not_defined";
           - pledge_absence_status = "not_defined";
           - vehicle_A_vin_value, vehicle_B_vin_value = "Данные не определены";
           - gibdd_registration_deadline_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. vehicle_A_vin_status:
           - "defined" — если в тексте прямо указан VIN ТС A;
           - "not_defined" — если не указан.

        2. vehicle_A_vin_value:
           VIN ТС A на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. vehicle_B_vin_status:
           - "defined" — если в тексте прямо указан VIN ТС B;
           - "not_defined" — если не указан.

        4. vehicle_B_vin_value:
           VIN ТС B на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. pts_transfer_status:
           - "defined" — если в тексте прямо указано условие о передаче ПТС или СТС;
           - "not_defined" — если не указано.

        6. gibdd_registration_status:
           - "defined" — если в тексте прямо описан порядок регистрации в ГИБДД;
           - "not_defined" — если не описан.

        7. gibdd_registration_deadline_status:
           - "defined" — если в тексте прямо указан срок регистрации в ГИБДД;
           - "not_defined" — если не указан.

        8. gibdd_registration_deadline_value:
           Срок регистрации в ГИБДД на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. technical_condition_status:
           - "defined" — если в тексте прямо есть заверение о техническом состоянии ТС;
           - "not_defined" — если не указано.

        10. osago_status:
            - "defined" — если в тексте прямо урегулирован вопрос ОСАГО;
            - "not_defined" — если не урегулирован.

        11. diagnostic_card_status:
            - "defined" — если в тексте прямо упомянута диагностическая карта;
            - "not_defined" — если не упомянута.

        12. pledge_absence_status:
            - "defined" — если в тексте прямо есть заверение об отсутствии залога или ограничений;
            - "not_defined" — если не указано.
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_barter_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", vehicle_A_vin_value, vehicle_B_vin_value, gibdd_registration_deadline_value = "Данные не определены".
        - Только текст договора.
        - VIN — только если прямо написан.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни VIN, ни ПТС/СТС, ни условий о регистрации в ГИБДД,
           ни техсостояния, ни ОСАГО, ни диагностической карты, ни залога.
           → presence = "missing";
             все *_status = "not_defined";
             vehicle_A_vin_value, vehicle_B_vin_value, gibdd_registration_deadline_value = "Данные не определены".

        2. VIN без ПТС.
           В договоре указаны VIN обоих ТС, но условие о передаче ПТС/СТС не установлено.
           → presence = "present";
             vehicle_A_vin_status = vehicle_B_vin_status = "defined";
             pts_transfer_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных пунктах договора для одного и того же ТС указаны разные VIN.
           → presence = "unclear";
             соответствующий *_vin_status = "not_defined";
             соответствующее *_vin_value = "Не удалось определить".

        4. Общее заверение без конкретики.
           Указано, что "ТС передаётся в технически исправном состоянии",
           без диагностической карты и без указания конкретных характеристик.
           → presence = "present";
             technical_condition_status = "defined";
             diagnostic_card_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_barter_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: vehicle_A_vin_value, vehicle_B_vin_value, gibdd_registration_deadline_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_barter_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования специальных условий мены ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vehicle_A_vin_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус VIN ТС A. Внутреннее enum-поле."
          required: true

        - name: "vehicle_A_vin_value"
          type: "string"
          presentation: "fact"
          label: "VIN транспортного средства A"
          description: >
            VIN ТС A. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "vehicle_B_vin_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус VIN ТС B. Внутреннее enum-поле."
          required: true

        - name: "vehicle_B_vin_value"
          type: "string"
          presentation: "fact"
          label: "VIN транспортного средства B"
          description: >
            VIN ТС B. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "pts_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус передачи ПТС/СТС. Внутреннее enum-поле."
          required: true

        - name: "gibdd_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка регистрации в ГИБДД. Внутреннее enum-поле."
          required: true

        - name: "gibdd_registration_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока регистрации в ГИБДД. Внутреннее enum-поле."
          required: true

        - name: "gibdd_registration_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок регистрации в ГИБДД"
          description: >
            Срок перерегистрации в ГИБДД. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "technical_condition_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения о техническом состоянии. Внутреннее enum-поле."
          required: true

        - name: "osago_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус вопроса ОСАГО. Внутреннее enum-поле."
          required: true

        - name: "diagnostic_card_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус диагностической карты. Внутреннее enum-поле."
          required: true

        - name: "pledge_absence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога или ограничений. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: cross_border_barter_check
    name: "Внешнеторговый бартер: валютный контроль, таможня, Incoterms, встречная поставка"
    description: >
      Фактографическая проверка условий о валютном контроле, таможенном оформлении,
      Incoterms и сроках встречных поставок при ВЭД-бартере.
    triggers:
      any: ["cross_border_barter"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "валютный контроль"
        - "таможенное оформление"
        - "уполномоченный банк"
        - "ВЭД"
        - "экспорт"
        - "импорт"
        - "срок встречной поставки"
        - "Incoterms"
        - "базис поставки"
        - "внешнеторговый бартер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)валютн(ый|ого)\\s+контрол"
        - "(?i)таможенн(ое|ого)\\s+оформлен"
        - "(?i)Incoterms|инкотермс"
        - "(?i)встречн(ая|ой)\\s+поставк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется внешнеторговый бартерный договор (ст. 567 ГК РФ; ФЗ-173;
        ТК ЕАЭС; КоАП РФ ст. 15.25).
        Проверяется наличие обязательных условий для ВЭД-бартера.
        Не анализируй общую ответственность, форс-мажор или подсудность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о валютном контроле (постановка на учёт в банке).
        2. Таможенная процедура для каждого товара.
        3. Срок встречной поставки.
        4. Базис поставки по Incoterms.
        5. Санкционный скрининг.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Договор подлежит постановке на учёт в ПАО «Банк ВТБ».
        Таможенное оформление товара A — ИМ40, товара B — ЭК10.
        Встречная поставка — не позднее 180 дней с момента экспорта.
        Базис поставки товара A — CIF Шанхай (Incoterms 2020)."

        Ответ:
        {
          "currency_control_status": "defined",
          "bank_registration_status": "defined",
          "customs_procedure_status": "defined",
          "counter_delivery_deadline_status": "defined",
          "counter_delivery_deadline_value": "не позднее 180 дней с момента экспорта",
          "incoterms_status": "defined",
          "incoterms_term": "CIF Шанхай (Incoterms 2020)",
          "sanctions_check_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Договор подлежит постановке на учёт в ПАО «Банк ВТБ»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны осуществляют взаимную поставку товаров."

        Ответ:
        {
          "currency_control_status": "not_defined",
          "bank_registration_status": "not_defined",
          "customs_procedure_status": "not_defined",
          "counter_delivery_deadline_status": "not_defined",
          "counter_delivery_deadline_value": "Данные не определены",
          "incoterms_status": "not_defined",
          "incoterms_term": "Данные не определены",
          "sanctions_check_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Уполномоченный банк / постановка на учёт — прямо?
        2. Таможенное оформление — описано?
        3. Срок встречной поставки — конкретный?
        4. Incoterms — прямо указан термин?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "currency_control_status": "<defined / not_defined>",
          "bank_registration_status": "<defined / not_defined>",
          "customs_procedure_status": "<defined / not_defined>",
          "counter_delivery_deadline_status": "<defined / not_defined>",
          "counter_delivery_deadline_value": "<срок или 'Данные не определены'>",
          "incoterms_status": "<defined / not_defined>",
          "incoterms_term": "<термин или 'Данные не определены'>",
          "sanctions_check_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 560
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "валютный контроль таможенное оформление уполномоченный банк ВЭД экспорт импорт срок встречной поставки Incoterms базис поставки внешнеторговый бартер постановка на учёт в банке санкционный скрининг применимое право"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - boilerplate
      negative_keywords:
        - "НДС"
        - "налоговая база"
        - "счёт-фактура"
        - "НДФЛ"
        - "деловая цель"
        - "аффилированность"
        - "равноценный обмен"
        - "доплата"
        - "гарантия качества"
        - "обременения"
        - "эвикция"
        - "расторжение"
        - "форс-мажор"
        - "уступка прав"
        - "конфиденциальность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 1.0]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "cross_border_barter_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста внешнеторгового бартерного договора условия валютного контроля, таможенного оформления, сроков встречной поставки, базиса Incoterms и санкционного скрининга.
        Не анализируй стороны, наименования товаров, качество или расторжение.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cross_border_barter_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (currency_control_status, bank_registration_status,
              customs_procedure_status, counter_delivery_deadline_status,
              incoterms_status, sanctions_check_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - currency_control_status = "not_defined";
           - bank_registration_status = "not_defined";
           - customs_procedure_status = "not_defined";
           - counter_delivery_deadline_status = "not_defined";
           - incoterms_status = "not_defined";
           - sanctions_check_status = "not_defined";
           - counter_delivery_deadline_value = "Данные не определены";
           - incoterms_term = "Данные не определены";
           - не выполняй остальные шаги.

        1. currency_control_status:
           - "defined" — если в тексте прямо урегулирован валютный контроль;
           - "not_defined" — если не урегулирован.

        2. bank_registration_status:
           - "defined" — если в тексте прямо упомянута постановка на учёт в уполномоченном банке;
           - "not_defined" — если не упомянута.

        3. customs_procedure_status:
           - "defined" — если в тексте прямо описано таможенное оформление;
           - "not_defined" — если не описано.

        4. counter_delivery_deadline_status:
           - "defined" — если в тексте прямо указан срок встречной поставки;
           - "not_defined" — если не указан.

        5. counter_delivery_deadline_value:
           Конкретный срок встречной поставки на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. incoterms_status:
           - "defined" — если в тексте прямо указан термин Incoterms;
           - "not_defined" — если не указан.

        7. incoterms_term:
           Конкретный термин Incoterms (EXW, CIF, FOB и т.п.) на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. sanctions_check_status:
           - "defined" — если в тексте прямо упомянут санкционный скрининг;
           - "not_defined" — если не упомянут.
        </task>

        <context_rules>
        - Перед остальными полями заполни cross_border_barter_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", counter_delivery_deadline_value и incoterms_term = "Данные не определены".
        - Только текст договора.
        - Не применяй нормы ФЗ-173 по умолчанию.
        - not_defined = применимое право прямо не указано.
        - Incoterms_term — пиши только конкретный термин из договора (EXW, CIF, FOB и т.п.).
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни валютного контроля, ни таможни, ни срока встречной
           поставки, ни Incoterms, ни санкционного скрининга.
           → presence = "missing";
             все *_status = "not_defined";
             counter_delivery_deadline_value, incoterms_term = "Данные не определены".

        2. Частичное раскрытие темы.
           Указан срок встречной поставки и Incoterms, но валютный контроль
           и таможенное оформление не раскрыты.
           → presence = "present";
             counter_delivery_deadline_status = "defined";
             incoterms_status = "defined";
             currency_control_status = "not_defined";
             customs_procedure_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные сроки встречной поставки.
           → presence = "unclear";
             counter_delivery_deadline_status = "not_defined";
             counter_delivery_deadline_value = "Не удалось определить".

        4. Базис поставки без срока встречной поставки.
           Указан термин Incoterms для одного из товаров, но срок встречной
           поставки не установлен.
           → presence = "present";
             incoterms_status = "defined";
             counter_delivery_deadline_status = "not_defined";
             counter_delivery_deadline_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cross_border_barter_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: counter_delivery_deadline_value, incoterms_term → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cross_border_barter_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования условий ВЭД-бартера. Внутреннее агрегатное signal-поле."
          required: true

        - name: "currency_control_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус урегулирования вопросов валютного контроля. Внутреннее enum-поле."
          required: true

        - name: "bank_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о постановке на учёт в уполномоченном банке. Внутреннее enum-поле."
          required: true

        - name: "customs_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения таможенной процедуры для обмениваемых товаров. Внутреннее enum-поле."
          required: true

        - name: "counter_delivery_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока встречной поставки по ВЭД-бартеру. Внутреннее enum-поле."
          required: true

        - name: "counter_delivery_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок встречной поставки"
          description: >
            Конкретный срок встречной поставки по внешнеторговому бартеру. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "incoterms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия термина Incoterms в договоре. Внутреннее enum-поле."
          required: true

        - name: "incoterms_term"
          type: "string"
          presentation: "fact"
          label: "Базис поставки (Incoterms)"
          description: >
            Термин Incoterms, определяющий базис поставки при ВЭД-бартере. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "sanctions_check_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о санкционном скрининге контрагента. Внутреннее enum-поле."
          required: true
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_authority:
    text: >
      Просим подтвердить по {doc_names}:
      (а) полные реквизиты обеих сторон (наименование/ФИО, ИНН, ОГРН/ОГРНИП, адрес);
      (б) полномочия подписантов (устав, доверенность, решение о назначении);
      (в) документы о корпоративном одобрении — протокол общего собрания /
      решение единственного участника / одобрение совета директоров —
      либо заключение о том, что сделка не является крупной и не имеет заинтересованности;
      (г) нотариальное согласие супруга/супруги (для физических лиц) либо
      подтверждение отсутствия брака / личной собственности / брачного договора.
    addressee: "Обе стороны / Юридический советник каждой стороны"

  barter_subject_extraction:
    text: >
      Просим предоставить полные данные об обмениваемых товарах по {doc_names}:
      (а) наименование, количество, характеристики и индивидуализирующие признаки
      каждого товара (серийные номера, VIN, кадастровые номера и т.п.);
      (б) стоимость каждого товара для целей договора и для целей налогообложения;
      (в) заявление о равноценности / неравноценности;
      (г) при неравноценности — размер, срок и порядок уплаты доплаты.
    addressee: "Обе стороны"

  valuation_and_surcharge_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) метод оценки стоимости каждого товара (рыночная / договорная / независимый оценщик);
      (б) заявление о равноценности / неравноценности;
      (в) при неравноценности — конкретный размер, срок и реквизиты для уплаты доплаты,
      последствия просрочки доплаты;
      (г) порядок разрешения споров об оценке (независимая экспертиза / оценщик / суд).
    addressee: "Обе стороны / Юридический советник"

  delivery_transfer_and_documents:
    text: >
      Просим согласовать по {doc_names}:
      (а) порядок и сроки передачи каждого товара (одновременно / последовательно),
      конкретные даты или предельные сроки;
      (б) место передачи каждого товара;
      (в) форму и содержание акта приёма-передачи для каждого товара;
      (г) кто несёт расходы на доставку/транспортировку;
      (д) перечень сопроводительных документов (ТТН, CMR, счёт-фактура и т.п.);
      (е) условия страхования при перевозке или хранении до передачи.
    addressee: "Обе стороны"

  simultaneous_transfer_mechanism_check:
    text: >
      В {doc_names} недостаточно проработан механизм обеспечения одновременности
      или защиты при последовательной передаче товаров. Просим предложить:
      (а) одновременную передачу через нотариуса / агента;
      (б) эскроу / аккредитив;
      (в) задаток / банковскую гарантию;
      (г) право приостановления исполнения первой стороны (ст. 328 ГК РФ);
      (д) иной механизм защиты согласно практике сторон.
    addressee: "Юридический советник"

  ownership_transfer_timing_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) момент перехода права собственности на каждый из товаров
      (по умолчанию — после исполнения обеими сторонами по ст. 570 ГК РФ;
      стороны вправе изменить этот момент);
      (б) момент перехода риска случайной гибели / повреждения для каждого товара;
      (в) при последовательной передаче — урегулирование разрыва между
      моментами права и риска.
    addressee: "Юридический советник"

  quality_warranty_and_claims:
    text: >
      Просим уточнить по {doc_names}:
      (а) гарантии качества для каждого товара и гарантийные сроки;
      (б) порядок приёмки по качеству (внешний осмотр, экспертиза, протокол);
      (в) порядок, форму и сроки предъявления претензий по недостаткам (явным и скрытым);
      (г) обязанность сохранения рекламируемого товара до разрешения спора;
      (д) последствия выявления недостатков (замена / уменьшение стоимости / возврат и убытки).
    addressee: "Обе стороны / Юридический советник"

  encumbrances_and_eviction_warranty:
    text: >
      Просим предоставить по {doc_names}:
      (а) заверения обеих сторон об отсутствии обременений, залога, ареста,
      прав третьих лиц на каждый из обмениваемых товаров;
      (б) явную оговорку о гарантии от эвикции (ст. 571 ГК РФ) — последствия
      изъятия полученного товара третьим лицом: право требовать возврата своего
      товара и возмещения убытков.
    addressee: "Обе стороны"

  tax_consequences_disclosure_check:
    text: >
      Просим уточнить по {doc_names}:
      (а) порядок исчисления НДС при мене (ст. 154 НК РФ — налоговая база
      по рыночной стоимости каждого товара);
      (б) стоимость товаров для целей налогообложения (рыночная / договорная);
      (в) обязанность выставления счетов-фактур и сроки;
      (г) НДФЛ для физических лиц — расчёт дохода как рыночной стоимости
      полученного товара;
      (д) подтверждение рыночности оценки для целей трансфертного контроля
      (при взаимозависимости сторон).
    addressee: "Налоговый консультант / Юридический советник"

  sham_transaction_and_business_purpose:
    text: >
      Рекомендуем в отношении {doc_names}:
      (а) включить описание деловой цели и экономического обоснования мены;
      (б) при взаимозависимости или аффилированности сторон — раскрыть это
      в тексте договора или сопроводительном письме;
      (в) подтвердить рыночность оценки обоих товаров заключением независимого оценщика;
      (г) задокументировать экономический смысл сделки для защиты по ст. 170 ГК РФ
      и ст. 54.1 НК РФ.
    addressee: "Юридический советник / Оценщик"

  non_performance_consequences_check:
    text: >
      Просим уточнить по {doc_names} последствия неисполнения обязательств
      одной из сторон:
      (а) право на расторжение договора;
      (б) возврат уже переданного товара при расторжении;
      (в) возмещение убытков (реальный ущерб и упущенная выгода);
      (г) неустойка — размер (фиксированный / процент от стоимости товара) и порядок начисления;
      (д) право удержания переданного товара до получения встречного исполнения.
    addressee: "Юридический советник"

  termination_liability_disputes:
    text: >
      Просим уточнить по {doc_names}:
      (а) основания и порядок расторжения, последствия (возврат товаров, компенсация);
      (б) форс-мажорная оговорка: перечень обстоятельств, срок и форма уведомления,
      документальное подтверждение, последствия для обязательств;
      (в) ограничения на уступку прав / перевод долга без согласия другой стороны;
      (г) условия конфиденциальности: перечень сведений, срок, исключения, санкции;
      (д) претензионный порядок: срок направления и рассмотрения претензии;
      (е) подсудность (арбитражный суд / суд общей юрисдикции / третейский суд);
      (ж) применимое право — подтверждение выбора права РФ или иного с обоснованием.
    addressee: "Юридический советник"

  real_estate_barter_specifics_check:
    text: >
      Для {doc_names} (мена недвижимости) просим предоставить:
      (а) кадастровые номера обоих объектов;
      (б) свежие выписки из ЕГРН (не старше 30 дней);
      (в) правоустанавливающие документы на каждый объект;
      (г) подтверждение отсутствия обременений, залогов, арестов;
      (д) перечень лиц, зарегистрированных в жилом помещении,
      или подтверждение их отсутствия;
      (е) порядок и сроки одновременной подачи документов в Росреестр;
      (ж) распределение расходов на государственную пошлину.
    addressee: "Обе стороны / Юридический советник"

  vehicle_barter_specifics_check:
    text: >
      Для {doc_names} (мена транспортных средств) просим предоставить:
      (а) VIN и основные характеристики каждого транспортного средства;
      (б) оригиналы ПТС / электронные ПТС;
      (в) справки из ГИБДД об отсутствии ограничений и розыска;
      (г) выписку из реестра уведомлений о залоге (нотариат);
      (д) порядок и сроки перерегистрации (10 дней по закону);
      (е) действующий полис ОСАГО или порядок его оформления;
      (ж) диагностическую карту / акт технического осмотра;
      (з) заверения о техническом состоянии и отсутствии скрытых дефектов.
    addressee: "Обе стороны"

  cross_border_barter_check:
    text: >
      Для {doc_names} (внешнеторговый бартер) просим предоставить:
      (а) подтверждение постановки контракта на учёт в уполномоченном банке
      (или план постановки с указанием банка и срока);
      (б) описание таможенной процедуры и таможенного режима для каждого товара;
      (в) согласованный срок встречной поставки с учётом требований ФЗ-173;
      (г) базис поставки по Incoterms (если применимо);
      (д) санкционный скрининг контрагента и товаров;
      (е) анализ применимого права и юрисдикции споров.
    addressee: "Юридический советник / Таможенный брокер / Банк"

  sham_transaction_risk:
    text: >
      Внимание: для {doc_names} выявлен риск квалификации как притворная сделка
      (ст. 170 ГК РФ). Рекомендуем:
      (а) включить обоснование деловой цели;
      (б) подтвердить рыночность оценки обоих товаров независимым оценщиком;
      (в) раскрыть аффилированность сторон (при наличии);
      (г) зафиксировать экономический смысл сделки в тексте договора.
    addressee: "Юридический советник"

  real_estate_barter_registration_required:
    text: >
      Внимание: для {doc_names} (мена недвижимости) переход права собственности
      подлежит обязательной государственной регистрации (ФЗ-218). Просим согласовать:
      (а) порядок и сроки подачи документов в Росреестр;
      (б) распределение расходов на государственную пошлину;
      (в) последствия отказа в регистрации для обязательств сторон.
    addressee: "Обе стороны / Юридический советник"

  interested_party_transaction_approval:
    text: >
      Внимание: для {doc_names} может потребоваться корпоративное одобрение
      (крупная сделка / сделка с заинтересованностью по ФЗ-14 / ФЗ-208). Просим:
      (а) предоставить протокол одобрения или решение единственного участника;
      (б) либо предоставить заключение о том, что сделка не является крупной
      и не имеет признаков заинтересованности.
    addressee: "Юридический советник каждой стороны"

  cross_border_barter_compliance:
    text: >
      Внимание: {doc_names} содержит признаки внешнеторгового бартера. Просим предоставить:
      (а) анализ соответствия ФЗ-173 (валютный контроль);
      (б) проект таможенных деклараций для каждого товара;
      (в) подтверждение постановки на учёт в уполномоченном банке;
      (г) расчёт допустимых сроков встречных поставок;
      (д) санкционный скрининг контрагента и номенклатуры товаров.
    addressee: "Юридический советник / Таможенный брокер"

  unequal_exchange_disguised_gift_risk:
    text: >
      Внимание: {doc_names} содержит признаки неравноценного обмена без доплаты
      между коммерческими организациями. Это создаёт риск квалификации как частичное
      дарение (запрещено ст. 575 ГК РФ). Просим:
      (а) обосновать равноценность или включить условие о доплате;
      (б) получить независимую оценку обоих товаров;
      (в) задокументировать деловую цель сделки.
    addressee: "Юридический советник / Оценщик"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
