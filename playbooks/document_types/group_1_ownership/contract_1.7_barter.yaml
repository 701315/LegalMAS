        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующий *_code = "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

