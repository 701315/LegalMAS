      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены ограничения уступки прав.
        Не анализируй расторжение, форс-мажор, подсудность или применимое право.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. assignment_presence:
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - assignment_restriction_status = "not_defined";
           - assignment_restriction_code = "not_defined";
           - assignment_restriction_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. assignment_restriction_status:
           - "defined" — если в тексте прямо урегулирован вопрос уступки прав
             (запрет, ограничение или прямое разрешение);
           - "not_defined" — если вопрос уступки прямо не урегулирован.

        2. assignment_restriction_code:
           - "prohibited" — уступка прямо запрещена;
           - "allowed_with_consent" — уступка допускается только с письменного
             согласия другой стороны;
           - "allowed" — уступка свободна без каких-либо ограничений;
           - "not_defined" — если вопрос уступки прямо не урегулирован.

        3. assignment_restriction_details:
           Условие об уступке прав на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — assignment_restriction_status = "not_defined", assignment_restriction_code = "not_defined", assignment_restriction_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - prohibited = уступка прямо запрещена.
        - allowed_with_consent = уступка допускается только с письменного согласия другой стороны.
        - allowed = уступка свободна без каких-либо ограничений.
        - not_defined = вопрос уступки прямо не урегулирован.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — assignment_restriction_status = "not_defined", assignment_restriction_code = "not_defined", assignment_restriction_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни слова об уступке, переуступке или переводе долга.
           → presence = "missing";
             assignment_restriction_status = "not_defined";
             assignment_restriction_code = "not_defined";
             assignment_restriction_details = "Данные не определены".

        2. Общая фраза без режима уступки.
           В договоре есть только общие фразы о правах и обязанностях,
           но ни слова о режиме уступки.
           → presence = "missing";
             assignment_restriction_status = "not_defined";
             assignment_restriction_code = "not_defined";
             assignment_restriction_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указано, что уступка допускается с согласия,
           в другом — что уступка запрещена без каких-либо исключений.
           → presence = "unclear";
             assignment_restriction_status = "not_defined";
             assignment_restriction_code = "not_defined";
             assignment_restriction_details = "Не удалось определить".

        4. Свободная уступка с уточнением порядка.
           Указано, что уступка допускается без согласия другой стороны,
           но требует письменного уведомления.
           → presence = "present";
             assignment_restriction_status = "defined";
             assignment_restriction_code = "allowed";
             assignment_restriction_details содержит формулировку из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_presence используй только: "present", "missing", "unclear".
        - Для assignment_restriction_status используй только: "defined", "not_defined".
        - Для assignment_restriction_code используй только: "prohibited", "allowed_with_consent", "allowed", "not_defined".
        - Fallback при отсутствии данных: assignment_restriction_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: assignment_restriction_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
