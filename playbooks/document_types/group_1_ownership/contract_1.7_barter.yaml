          presentation: "fact"
          label: "Страхование товаров"
          description: "Условие страхования товаров при перевозке или хранении."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "insurance_beneficiary_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус выгодоприобретателя по страховке."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Механизм обеспечения одновременности
  # ──────────────────────────────────────────────────────────────────────────
  - id: simultaneous_transfer_mechanism_check
    name: "Механизм обеспечения одновременности передачи (ст. 328, 570 ГК РФ)"
    description: >
      Фактографическая проверка наличия механизма защиты при обмене (эскроу,
      аккредитив, задаток, банковская гарантия) и права приостановления исполнения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "одновременная передача"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "обеспечительный платеж"
        - "задаток"
        - "встречное исполнение"
        - "депозит нотариуса"
        - "банковская гарантия"
        - "удержание"
        - "приостановление исполнения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передача.*осуществляется.*одновременно"
        - "(?i)встречно(е|го)\\s+исполнен"
        - "(?i)право.*удержан"
        - "(?i)приостановить.*исполнение"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 328, 570 ГК РФ).
        Проверяется только один вопрос: механизм обеспечения одновременности
        или защиты при последовательной передаче.
        Не анализируй сроки и место передачи, акты или доставку.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Механизм обеспечения (эскроу / аккредитив / задаток / гарантия / нотариус / ничего).
        2. Кто передаёт первым при последовательной передаче.
        3. Право приостановить исполнение (ст. 328 ГК РФ).
        4. Право удержания переданного товара.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined" / "none".
        2. В evidence — только текст договора.
        3. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Передача обоих товаров осуществляется через эскроу-агента. Сторона 1
        передаёт автомобиль первой. В случае если Сторона 2 не передаёт недвижимость
        в течение 5 дней, Сторона 1 вправе приостановить исполнение."

        Ответ:
        {
          "security_mechanism_status": "defined",
          "security_mechanism": "escrow",
          "who_transfers_first_status": "defined",
          "who_transfers_first": "party_A",
          "suspension_right_status": "defined",
          "retention_right_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Передача обоих товаров осуществляется через эскроу-агента. Сторона 1 передаёт автомобиль первой."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются одновременно передать товары друг другу."

        Ответ:
        {
          "security_mechanism_status": "defined",
          "security_mechanism": "none",
          "who_transfers_first_status": "defined",
          "who_transfers_first": "simultaneous",
          "suspension_right_status": "not_defined",
          "retention_right_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Стороны обязуются одновременно передать товары друг другу."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретный механизм?
        2. Если нет механизма — security_mechanism = "none".

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "security_mechanism_status": "<defined / not_defined>",
          "security_mechanism": "<escrow / accreditive / bank_cell / deposit / guarantee / notary_deposit / none / not_defined>",
          "who_transfers_first_status": "<defined / not_defined>",
          "who_transfers_first": "<party_A / party_B / simultaneous / not_defined>",
          "suspension_right_status": "<defined / not_defined>",
          "retention_right_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "одновременная передача аккредитив эскроу банковская ячейка обеспечительный платёж задаток встречное исполнение депозит нотариуса банковская гарантия удержание приостановление исполнения ст. 328 ГК РФ ст. 570 ГК РФ кто передаёт первым"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "доплата за неравноценный обмен"
        - "срок передачи"
        - "место передачи"
        - "акт приёма-передачи"
        - "доставка"
        - "страхование"
        - "обременения"
        - "залог"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 380
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены механизм обеспечения
        одновременности передачи, кто передаёт первым, право приостановления
        и право удержания.
        Не анализируй сроки передачи, акты, доставку или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. security_mechanism_status — "defined" или "not_defined".
        2. security_mechanism — escrow / accreditive / bank_cell / deposit / guarantee / notary_deposit / none / not_defined.
        3. who_transfers_first_status — "defined" или "not_defined".
        4. who_transfers_first — party_A / party_B / simultaneous / not_defined.
        5. suspension_right_status — "defined" или "not_defined".
        6. retention_right_status — "defined" или "not_defined".

        Если данных нет: статус = "not_defined".
        Если механизма нет: security_mechanism = "none".
        </task>

        <rules>
        - Только текст договора.
        - escrow = передача через эскроу-агента.
        - accreditive = расчёт или передача через аккредитив.
        - bank_cell = через банковскую ячейку.
        - deposit = обеспечительный депозит или задаток.
        - guarantee = банковская гарантия.
        - notary_deposit = депозит нотариуса.
        - none = механизм обеспечения не предусмотрен, передача напрямую.
        - Если механизм есть, но не подпадает ни под одно значение — используй "not_defined".
        - Верни только JSON.
        </rules>
      fields:
        - name: "security_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма обеспечения."
          required: true
        - name: "security_mechanism"
          type: "string"
          presentation: "signal"
          label: "Механизм обеспечения"
          allowed_values: ["escrow", "accreditive", "bank_cell", "deposit", "guarantee", "notary_deposit", "none", "not_defined"]
          description: "Механизм обеспечения одновременности."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "who_transfers_first_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения очерёдности передачи."
          required: false
        - name: "who_transfers_first"
          type: "string"
          presentation: "signal"
          label: "Кто передаёт первым"
          allowed_values: ["party_A", "party_B", "simultaneous", "not_defined"]
          description: "Кто передаёт первым."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "suspension_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права приостановить исполнение."
          required: false
        - name: "retention_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права удержания переданного товара."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Переход права собственности и риск гибели
  # ──────────────────────────────────────────────────────────────────────────
  - id: ownership_transfer_timing_check
    name: "Момент перехода права собственности и риска случайной гибели (ст. 459, 570 ГК РФ)"
    description: >
      Фактографическая проверка момента перехода права собственности
      и риска случайной гибели для каждого товара.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право собственности переходит"
        - "после исполнения обеими сторонами"
        - "момент перехода права"
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "несёт риск"
        - "с момента передачи"
        - "после подписания акта"
        - "после регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+собственности.*переходит"
        - "(?i)после\\s+исполнения.*обеими"
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ, ст. 459, 570 ГК РФ).
        Проверяется только один вопрос: момент перехода права собственности
        и риска случайной гибели.
        Не анализируй сроки передачи, акты, доставку или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент перехода права собственности.
        2. Момент перехода риска случайной гибели/повреждения.
        3. Есть ли разрыв между моментами права и риска.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. Если явного условия нет — применяется диспозитив ст. 570 ГК РФ.
           Пиши "default_applies", а не "not_defined".
        3. В evidence — только текст договора.
        4. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Право собственности на каждый из товаров переходит после исполнения
        обязательств обеими сторонами. Риск случайной гибели переходит с момента
        фактической передачи каждого товара."

        Ответ:
        {
          "ownership_transfer_status": "defined",
          "ownership_transfer_moment": "after_both_perform",
          "ownership_transfer_details": "переходит после исполнения обязательств обеими сторонами",
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_delivery",
          "gap_risk_identified": "yes",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Право собственности на каждый из товаров переходит после исполнения обязательств обеими сторонами."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны передают товары в обусловленные сроки."

        Ответ:
        {
          "ownership_transfer_status": "default_applies",
          "ownership_transfer_moment": "after_both_perform",
          "ownership_transfer_details": "Данные не определены",
          "risk_transfer_status": "default_applies",
          "risk_transfer_moment": "same_as_ownership",
          "gap_risk_identified": "no",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямая фраза о переходе права — есть?
        2. Прямая фраза о переходе риска — есть?
        3. Нет прямого условия → default_applies.

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "ownership_transfer_status": "<defined / default_applies / not_defined>",
          "ownership_transfer_moment": "<after_both_perform / upon_delivery / upon_act / upon_registration / custom / not_defined>",
          "ownership_transfer_details": "<текст или 'Данные не определены'>",
          "risk_transfer_status": "<defined / default_applies / not_defined>",
          "risk_transfer_moment": "<same_as_ownership / upon_delivery / custom / not_defined>",
          "gap_risk_identified": "<yes / no>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право собственности переходит после исполнения обеими сторонами момент перехода права риск случайной гибели риск случайного повреждения несёт риск с момента передачи после подписания акта после регистрации ст. 570 ГК РФ ст. 459 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "доплата"
        - "наименование товара"
        - "стоимость товара"
        - "доставка"
        - "страхование"
        - "эскроу"
        - "аккредитив"
        - "обременения"
        - "залог"
        - "неустойка"
        - "ответственность за неисполнение"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 380
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены момент перехода права
        собственности, момент перехода риска гибели и наличие разрыва между ними.
        Не анализируй сроки передачи, акты, доставку или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. ownership_transfer_status — "defined", "default_applies" или "not_defined".
        2. ownership_transfer_moment — after_both_perform / upon_delivery / upon_act / upon_registration / custom / not_defined.
        3. ownership_transfer_details — формулировка о переходе права.
        4. risk_transfer_status — "defined", "default_applies" или "not_defined".
        5. risk_transfer_moment — same_as_ownership / upon_delivery / custom / not_defined.
        6. gap_risk_identified — "yes" или "no".

        Если явного условия нет: status = "default_applies" (диспозитив ст. 570 ГК).
        </task>

        <rules>
        - Только текст договора.
        - default_applies = нет прямого условия, действует диспозитив ст. 570 ГК РФ.
        - after_both_perform = право переходит после исполнения обязательств обеими сторонами.
        - upon_delivery = право переходит в момент фактической передачи товара.
        - upon_act = право переходит в момент подписания передаточного акта.
        - upon_registration = право переходит в момент государственной регистрации.
        - custom = иной момент, прямо описанный в договоре.
        - gap_risk_identified = "yes" если момент перехода права и момент перехода риска не совпадают.
        - gap_risk_identified = "no" если они совпадают или оба определяются по диспозитиву.
        - Верни только JSON.
        </rules>
      fields:
        - name: "ownership_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "default_applies", "not_defined"]
          description: "Статус момента перехода права собственности."
          required: true
        - name: "ownership_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["after_both_perform", "upon_delivery", "upon_act", "upon_registration", "custom", "not_defined"]
          description: "Момент перехода права собственности."
          required: false
        - name: "ownership_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права собственности"
          description: "Формулировка о моменте перехода права."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "default_applies", "not_defined"]
          description: "Статус момента перехода риска."
          required: true
        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          label: "Момент перехода риска гибели"
          allowed_values: ["same_as_ownership", "upon_delivery", "custom", "not_defined"]
          description: "Момент перехода риска случайной гибели."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "gap_risk_identified"
          type: "string"
          presentation: "diagnostic"
          label: "Разрыв между правом и риском"
          allowed_values: ["yes", "no"]
          description: "Маркер разрыва между моментами права и риска."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Гарантии качества
  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_warranty_check
    name: "Гарантии качества обмениваемых товаров и гарантийные сроки"
    description: >
      Фактографическая проверка наличия гарантий качества для обоих товаров
      и гарантийных сроков. Претензии по недостаткам — в отдельном check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантия качества"
        - "соответствие товара"
        - "отсутствие недостатков"
        - "технические характеристики"
        - "гарантийный срок"
        - "надлежащее качество"
        - "гарантиру"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантиру(ет|ют).*качеств"
