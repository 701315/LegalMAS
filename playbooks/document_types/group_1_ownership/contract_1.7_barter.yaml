          "ownership_transfer_status": "<defined / default_applies / not_defined>",
          "ownership_transfer_moment": "<after_both_perform / upon_delivery / upon_act / upon_registration / custom / not_defined>",
          "ownership_transfer_details": "<текст или 'Данные не определены'>",
