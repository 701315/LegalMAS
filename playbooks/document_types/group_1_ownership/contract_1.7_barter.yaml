      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "delivery_logistics_and_insurance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены условия доставки товаров и страхования при перевозке или хранении.
        Не анализируй сроки передачи, акты, механизм обеспечения или ответственность.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. delivery_logistics_and_insurance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (delivery_responsibility_status, insurance_status,
              insurance_beneficiary_status) ≠ "not_defined";
           - "missing" — если все три содержательных статусных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - delivery_responsibility_status = "not_defined";
           - delivery_responsibility_code = "not_defined";
           - insurance_status = "not_defined";
           - insurance_beneficiary_status = "not_defined";
           - delivery_responsibility_details, insurance_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. delivery_responsibility_status:
           - "defined" — если в тексте прямо указано, кто несёт расходы на доставку хотя бы одного товара;
           - "not_defined" — если порядок расходов прямо не указан.

        2. delivery_responsibility_code:
           Используй строго только:
           - "party_A" — расходы на доставку несёт Сторона 1 (передающая товар A);
           - "party_B" — расходы на доставку несёт Сторона 2 (передающая товар B);
           - "each_own" — каждая сторона несёт расходы на доставку своего товара;
           - "third_party" — расходы несёт третья сторона (перевозчик, логист и т.п.);
           - "not_defined" — если не определено.

        3. delivery_responsibility_details:
           Кто и как несёт расходы на доставку на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. insurance_status:
           - "defined" — если в тексте прямо предусмотрено страхование товаров при перевозке или хранении;
           - "not_defined" — если условие страхования в тексте отсутствует.

        5. insurance_details:
           Условие страхования товаров на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. insurance_beneficiary_status:
           - "defined" — если в тексте прямо указан выгодоприобретатель по страховке;
           - "not_defined" — если выгодоприобретатель прямо не указан.
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_logistics_and_insurance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/code = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - party_A = расходы на доставку несёт Сторона 1 (передающая товар A).
        - party_B = расходы на доставку несёт Сторона 2 (передающая товар B).
        - each_own = каждая сторона несёт расходы на доставку своего товара.
        - third_party = расходы несёт третья сторона (перевозчик, логист и т.п.).
        - Если в разных фрагментах указаны разные ответственные за доставку и конфликт нельзя разрешить по тексту — delivery_responsibility_status = "not_defined", delivery_responsibility_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий доставки, ни расходов, ни страхования.
           → presence = "missing";
             все содержательные status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Неполное раскрытие темы.
           Указано, кто несёт расходы на доставку, но страхование не упомянуто.
           → presence = "present";
             delivery_responsibility_status = "defined";
             insurance_status = "not_defined";
             insurance_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные ответственные за доставку.
           → presence = "unclear";
             delivery_responsibility_status = "not_defined";
             delivery_responsibility_details = "Не удалось определить".

        4. Страхование предусмотрено, но выгодоприобретатель не указан.
           Обязанность застраховать товары есть, но конкретный выгодоприобретатель прямо не назван.
           → presence = "present";
             insurance_status = "defined";
             insurance_beneficiary_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_logistics_and_insurance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для delivery_responsibility_code используй только: "party_A", "party_B", "each_own", "third_party", "not_defined".
        - Fallback при отсутствии данных: все текстовые поля → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_logistics_and_insurance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по доставке / страхованию в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "delivery_responsibility_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за доставку. Внутреннее enum-поле."
          required: true

        - name: "delivery_responsibility_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["party_A", "party_B", "each_own", "third_party", "not_defined"]
          display_in_grid: false
          description: "Кто несёт расходы или обязанность по доставке. Внутреннее enum-поле."
          required: true

        - name: "delivery_responsibility_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность за доставку"
          description: >
            Условие о расходах на доставку каждого товара. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус страхования товаров. Внутреннее enum-поле."
          required: true

        - name: "insurance_details"
          type: "string"
          presentation: "fact"
          label: "Страхование товаров"
          description: >
            Условие страхования товаров при перевозке или хранении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "insurance_beneficiary_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус выгодоприобретателя по страховке. Внутреннее enum-поле."
          required: true
      store_payload: true

  - id: simultaneous_transfer_mechanism_check
