        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Передача обоих товаров осуществляется через эскроу-агента. Сторона 1
        передаёт автомобиль первой. В случае если Сторона 2 не передаёт недвижимость
