        - "(?i)доплат(а|у|ы|ить)\\s+.*?\\d"
        - "(?i)(равноценн|неравноценн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ, ст. 567, 568 ГК РФ).
        Проверяется только один вопрос: предмет договора — описание обоих товаров,
        оценка равноценности и порядок доплаты.
        Не анализируй сроки и порядок передачи, акты, доставку или страхование.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование, количество и стоимость товара A (передаваемого Стороной 1).
        2. Индивидуализирующие признаки товара A (VIN, кадастровый номер и т.п.).
        3. Наименование, количество и стоимость товара B (передаваемого Стороной 2).
        4. Индивидуализирующие признаки товара B.
        5. Метод оценки стоимости (рыночная / договорная / оценщик / формула).
        6. Равноценность или неравноценность обмена.
        7. Размер доплаты.
        8. Кто платит доплату и в какой срок.
        9. Последствия просрочки доплаты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если нет — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Сторона 1 передаёт автомобиль Toyota Camry, VIN XW7BF4FK30S123456, 2020 г.в.,
        стоимостью 2 500 000 рублей.
        Сторона 2 передаёт нежилое помещение, кадастровый номер 77:06:0001001:123, 45 кв.м,
        стоимостью 3 000 000 рублей по независимой оценке.
        Обмен неравноценный. Доплата 500 000 рублей — Сторона 1, в течение 5 р.дн.
        При просрочке — пеня 0,1% в день."
        Ответ:
        {
          "good_A_name_status": "defined",
          "good_A_name_value": "автомобиль Toyota Camry",
          "good_A_quantity": "1 единица",
          "good_A_value_status": "defined",
          "good_A_value_value": "2 500 000 рублей",
          "good_A_identifying_features": "VIN XW7BF4FK30S123456, 2020 г.в.",
          "good_B_name_status": "defined",
          "good_B_name_value": "нежилое помещение",
          "good_B_quantity": "45 кв.м",
          "good_B_value_status": "defined",
          "good_B_value_value": "3 000 000 рублей",
          "good_B_identifying_features": "кадастровый номер 77:06:0001001:123",
          "valuation_method_status": "defined",
          "valuation_method_code": "appraiser",
          "equivalence_status": "defined",
          "equivalence_code": "unequal",
          "surcharge_status": "defined",
          "surcharge_amount": "500 000 рублей",
          "surcharge_payer": "Сторона 1",
          "surcharge_deadline": "5 рабочих дней",
          "surcharge_late_consequences_status": "defined",
          "evidence": [{"clause_ref": "п. 1.1", "quote": "..."}]
        }

        Пример 2:
        "Стороны обменивают товары на взаимовыгодных условиях."
        Ответ:
        {
          "good_A_name_status": "not_defined",
          "good_A_name_value": "Данные не определены",
          "good_A_quantity": "Данные не определены",
          "good_A_value_status": "not_defined",
          "good_A_value_value": "Данные не определены",
          "good_A_identifying_features": "Данные не определены",
          "good_B_name_status": "not_defined",
          "good_B_name_value": "Данные не определены",
          "good_B_quantity": "Данные не определены",
          "good_B_value_status": "not_defined",
          "good_B_value_value": "Данные не определены",
          "good_B_identifying_features": "Данные не определены",
          "valuation_method_status": "not_defined",
          "valuation_method_code": "not_defined",
          "equivalence_status": "not_defined",
          "equivalence_code": "not_defined",
          "surcharge_status": "not_defined",
          "surcharge_amount": "Данные не определены",
          "surcharge_payer": "Данные не определены",
          "surcharge_deadline": "Данные не определены",
          "surcharge_late_consequences_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Наименования обоих товаров — прямо?
        2. Стоимости — числом?
        3. Индивидуализирующие признаки — VIN / кадастр / серийный №?
        4. Метод оценки — рыночная / договорная / оценщик?
        5. Если неравноценный — сумма, плательщик, срок доплаты?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "good_A_name_status": "<defined / not_defined>",
          "good_A_name_value": "<наименование или 'Данные не определены'>",
          "good_A_quantity": "<количество или 'Данные не определены'>",
          "good_A_value_status": "<defined / not_defined>",
          "good_A_value_value": "<стоимость или 'Данные не определены'>",
          "good_A_identifying_features": "<признаки или 'Данные не определены'>",
          "good_B_name_status": "<defined / not_defined>",
          "good_B_name_value": "<наименование или 'Данные не определены'>",
          "good_B_quantity": "<количество или 'Данные не определены'>",
          "good_B_value_status": "<defined / not_defined>",
          "good_B_value_value": "<стоимость или 'Данные не определены'>",
          "good_B_identifying_features": "<признаки или 'Данные не определены'>",
          "valuation_method_status": "<defined / not_defined>",
          "valuation_method_code": "<market / appraiser / agreement / formula / not_defined>",
          "equivalence_status": "<defined / not_defined>",
          "equivalence_code": "<equal / unequal / not_defined>",
          "surcharge_status": "<defined / not_defined>",
          "surcharge_amount": "<сумма или 'Данные не определены'>",
          "surcharge_payer": "<сторона или 'Данные не определены'>",
          "surcharge_deadline": "<срок или 'Данные не определены'>",
          "surcharge_late_consequences_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "товар обмениваемый передаёт в собственность получает в собственность наименование количество стоимость равноценный неравноценный доплата разница в стоимости рыночная стоимость независимый оценщик метод оценки VIN кадастровый номер серийный номер индивидуализирующие признаки"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "срок передачи"
        - "место передачи"
        - "акт приёма-передачи"
        - "доставка"
        - "транспортировка"
        - "страхование"
        - "эскроу"
        - "аккредитив"
        - "встречное исполнение"
        - "право приостановления"
        - "обременения"
        - "залог"
        - "арест"
        - "эвикция"
        - "НДС при мене"
        - "счёт-фактура"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 2250

      compact_output: false

      presence_signal:
        field: "barter_subject_and_valuation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены описание обоих обмениваемых товаров, их объёмы, индивидуализирующие признаки, стоимости, метод оценки, факт равноценности и порядок доплаты.
        Не анализируй сроки передачи, логистику, распределение расходов на транспортировку или страхование.
        Не делай правовых выводов по закону.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. barter_subject_and_valuation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из статусных полей (good_A_name_status, good_B_name_status, valuation_method_status, equivalence_status, surcharge_status) ≠ "not_defined";
           - "missing" — если все содержательные статус-поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - good_A_name_status = "not_defined";
           - good_A_value_status = "not_defined";
           - good_B_name_status = "not_defined";
           - good_B_value_status = "not_defined";
           - valuation_method_status = "not_defined";
           - valuation_method_code = "not_defined";
           - equivalence_status = "not_defined";
           - equivalence_code = "not_defined";
           - surcharge_status = "not_defined";
           - surcharge_late_consequences_status = "not_defined";
           - good_A_name_value, good_B_name_value = "Данные не определены";
           - good_A_quantity, good_B_quantity = "Данные не определены";
           - good_A_value_value, good_B_value_value = "Данные не определены";
           - good_A_identifying_features, good_B_identifying_features = "Данные не определены";
           - surcharge_amount, surcharge_payer, surcharge_deadline = "Данные не определены";
           - не выполняй остальные шаги.

        1. good_A_name_status:
           - "defined" — если Товар А (передаваемый первой стороной) прямо назван;
           - "not_defined" — если не назван.

        2. good_A_name_value:
           Наименование товара А. Если данных нет — "Данные не определены".

        3. good_A_quantity:
           Количество товара А. Если данных нет — "Данные не определены".

        4. good_A_value_status:
           - "defined" — если стоимость товара А прямо определена/указана;
           - "not_defined" — если отсутствует.

        5. good_A_value_value:
           Стоимость товара А. Если данных нет — "Данные не определены".

        6. good_A_identifying_features:
           Индивидуализирующие признаки товара А (VIN, кадастровый/серийный номер и др.).
           Если данных нет — "Данные не определены".

        7. good_B_name_status:
           - "defined" — если Товар Б (передаваемый второй стороной) прямо назван;
           - "not_defined" — если не назван.

        8. good_B_name_value:
           Наименование товара Б. Если данных нет — "Данные не определены".

        9. good_B_quantity:
           Количество товара Б. Если данных нет — "Данные не определены".

        10. good_B_value_status:
            - "defined" — если стоимость товара Б прямо указана;
            - "not_defined" — если отсутствует.

        11. good_B_value_value:
            Стоимость товара Б. Если данных нет — "Данные не определены".

        12. good_B_identifying_features:
            Индивидуализирующие признаки товара Б. Если данных нет — "Данные не определены".

        13. valuation_method_status:
            - "defined" — если указан конкретный метод или способ оценки стоимости;
            - "not_defined" — если метод оценки не раскрыт.

        14. valuation_method_code:
            Используй строго только:
            - "market" — рыночная оценка;
            - "appraiser" — привлечение оценщика;
            - "agreement" — соглашение сторон;
            - "formula" — расчет по формуле;
            - "not_defined" — если не определено.

        15. equivalence_status:
            - "defined" — если в договоре прямо сделан вывод о равноценности или неравноценности;
            - "not_defined" — если условие отсутствует.

        16. equivalence_code:
            Используй строго только:
            - "equal" — обмен прямо признан равноценным;
            - "unequal" — обмен прямо признан неравноценным;
            - "not_defined" — если не определено.

        17. surcharge_status:
            - "defined" — если при неравноценности прямо указан размер доплаты;
            - "not_defined" — если доплата не предусмотрена.

        18. surcharge_amount:
            Сумма доплаты. Если данных нет — "Данные не определены".

        19. surcharge_payer:
            Сторона-плательщик доплаты. Если данных нет — "Данные не определены".

        20. surcharge_deadline:
            Срок осуществления доплаты. Если данных нет — "Данные не определены".

        21. surcharge_late_consequences_status:
            - "defined" — если зафиксирована ответственность за просрочку доплаты (неустойка, проценты);
            - "not_defined" — если ответственность отсутствует.
        </task>

        <context_rules>
        - Перед остальными полями заполни barter_subject_and_valuation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/code = "not_defined", все остальные поля = "Данные не определены".
        - Не смешивай характеристики Товара А и Товара Б.
        - Если товар прямо описывается в приложении/спецификации, и на это есть ссылка — считай статус "defined" и укажи это в текстовом поле (например: "Определяется Спецификацией №1").
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре отсутствуют разделы о предмете, обмениваемых вещах и их стоимости.
           → presence = "missing"; все статус-поля = "not_defined"; все текстовые поля = "Данные не определены".

        2. Указание на согласование спецификации в будущем.
           Предмет договора мены подлежит согласованию в спецификациях, которые еще не подписаны и отсутствуют в материалах.
           → presence = "present"; соответствующий status = "defined"; текстовое поле = "Определяется Спецификацией №1".

        3. Противоречие между фрагментами.
           В тексте пункта 1.1 указана одна сумма доплаты (100 000 руб.), а в реквизитах или приложении — другая (120 000 руб.).
           → presence = "unclear"; соответствующий status = "not_defined"; текстовое поле = "Не удалось определить".

        4. Равноценность по умолчанию без упоминания в тексте.
           В договоре не упомянута стоимость товаров и не сказано, равноценны ли они, при этом доплаты нет. По закону обмен предполагается равноценным, но в тексте об этом прямо не написано.
           → behavior: equivalence_status = "not_defined"; equivalence_code = "not_defined"; surcharge_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для barter_subject_and_valuation_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Для valuation_method_code используй только: "market", "appraiser", "agreement", "formula", "not_defined".
        - Для equivalence_code используй только: "equal", "unequal", "not_defined".
        - Fallback при отсутствии данных: все текстовые поля → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "barter_subject_and_valuation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету / оценке / доплате в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "good_A_name_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наименования товара A. Внутреннее enum-поле."
          required: true

        - name: "good_A_name_value"
          type: "string"
          presentation: "fact"
          label: "Товар A"
          description: >
            Наименование товара A. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "good_A_quantity"
          type: "string"
          presentation: "fact"
          label: "Количество / объём товара A"
          description: >
            Количество товара A с единицей измерения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "good_A_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус стоимости товара A. Внутреннее enum-поле."
          required: true

        - name: "good_A_value_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость товара A"
          description: >
            Стоимость товара A. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "good_A_identifying_features"
          type: "string"
          presentation: "fact"
          label: "Признаки товара A"
          description: >
            Индивидуализирующие признаки товара A. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "good_B_name_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наименования товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_name_value"
          type: "string"
          presentation: "fact"
          label: "Товар B"
          description: >
            Наименование товара B. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "good_B_quantity"
          type: "string"
          presentation: "fact"
          label: "Количество / объём товара B"
          description: >
            Количество товара B с единицей измерения. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "good_B_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
