          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "В случае неисполнения обязательства по передаче товара другая сторона вправе отказаться от договора и потребовать возврата уже переданного товара."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."

        Ответ:
        {
          "non_performance_clause_status": "not_defined",
          "right_to_terminate_status": "not_defined",
          "damages_recovery_status": "not_defined",
          "return_of_transferred_goods_status": "not_defined",
          "penalty_clause_status": "not_defined",
