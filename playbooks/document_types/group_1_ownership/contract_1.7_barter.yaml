  - id: delivery_timing_and_acts
    name: "Сроки, место передачи и акты приёма-передачи"
    description: >
      Фактографическая проверка сроков и мест передачи каждого товара,
      одновременности/последовательности и формы передаточных актов.
      Страхование и доставка проверяются отдельным check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "порядок передачи"
        - "срок передачи"
        - "одновременно"
        - "последовательно"
        - "не позднее"
        - "в течение"
        - "дата передачи"
        - "передаточный акт"
        - "акт приёма-передачи"
        - "подписывают акт"
        - "место передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)передач(а|и|у)\\s+товар"
        - "(?i)акт\\s+(приём|передач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ, ст. 556 ГК РФ — для недвижимости).
        Проверяется только один вопрос: сроки и место передачи товаров, форма актов.
        Не анализируй доставку, страхование или механизм обеспечения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок передачи — одновременно или последовательно.
        2. Срок/дата передачи товара A.
        3. Срок/дата передачи товара B.
        4. Место передачи каждого товара.
        5. Форма акта приёма-передачи (предусмотрен / не предусмотрен).

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        "Передача обоих товаров — одновременно 15.04.2026 по адресу: г. Москва, ул. Ленина, д. 1.
        Оформляется двусторонним актом приёма-передачи."
        Ответ:
        {
          "transfer_sequence_status": "defined",
          "transfer_sequence_code": "simultaneous",
          "good_A_transfer_deadline_status": "defined",
          "good_A_transfer_deadline_value": "15.04.2026",
          "good_B_transfer_deadline_status": "defined",
          "good_B_transfer_deadline_value": "15.04.2026",
          "transfer_location_status": "defined",
          "transfer_location_details": "г. Москва, ул. Ленина, д. 1",
          "transfer_act_status": "defined",
          "transfer_act_details": "двусторонний акт приёма-передачи",
          "evidence": [{"clause_ref": "п. 3.1", "quote": "..."}]
        }

        Пример 2:
        "Стороны обязуются передать товары."
        Ответ:
        {
          "transfer_sequence_status": "not_defined",
          "transfer_sequence_code": "not_defined",
          "good_A_transfer_deadline_status": "not_defined",
          "good_A_transfer_deadline_value": "Данные не определены",
          "good_B_transfer_deadline_status": "not_defined",
          "good_B_transfer_deadline_value": "Данные не определены",
          "transfer_location_status": "not_defined",
          "transfer_location_details": "Данные не определены",
          "transfer_act_status": "not_defined",
          "transfer_act_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Одновременно или последовательно — прямо?
        2. Дата или срок для каждого товара?
        3. Место — прямо указано?
        4. Акт — упомянут?

        Не выводи шаги. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_sequence_status": "<defined / not_defined>",
          "transfer_sequence_code": "<simultaneous / sequential / not_defined>",
          "good_A_transfer_deadline_status": "<defined / not_defined>",
          "good_A_transfer_deadline_value": "<срок/дата или 'Данные не определены'>",
          "good_B_transfer_deadline_status": "<defined / not_defined>",
          "good_B_transfer_deadline_value": "<срок/дата или 'Данные не определены'>",
          "transfer_location_status": "<defined / not_defined>",
          "transfer_location_details": "<место или 'Данные не определены'>",
          "transfer_act_status": "<defined / not_defined>",
          "transfer_act_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "порядок передачи срок передачи одновременно последовательно не позднее в течение дата передачи передаточный акт акт приёма-передачи подписывают акт место передачи передача товара"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "оценщик"
        - "доставка"
        - "расходы на доставку"
        - "страхование"
        - "эскроу"
        - "аккредитив"
        - "встречное исполнение"
        - "право приостановления"
        - "обременения"
        - "залог"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "delivery_timing_and_acts_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены сроки и место передачи товаров, порядок передачи (одновременно / последовательно) и условие о передаточном акте.
        Не анализируй доставку, страхование, механизм обеспечения или ответственность.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. delivery_timing_and_acts_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (transfer_sequence_status, good_A_transfer_deadline_status,
              good_B_transfer_deadline_status, transfer_location_status,
              transfer_act_status) ≠ "not_defined";
           - "missing" — если все пять содержательных статусных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - transfer_sequence_status = "not_defined";
           - transfer_sequence_code = "not_defined";
           - good_A_transfer_deadline_status = "not_defined";
           - good_B_transfer_deadline_status = "not_defined";
           - transfer_location_status = "not_defined";
           - transfer_act_status = "not_defined";
           - good_A_transfer_deadline_value, good_B_transfer_deadline_value = "Данные не определены";
           - transfer_location_details, transfer_act_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. transfer_sequence_status:
           - "defined" — если в тексте прямо указано, что передачи осуществляются одновременно или последовательно;
           - "not_defined" — если порядок явно не описан.

        2. transfer_sequence_code:
           Используй строго только:
           - "simultaneous" — обе передачи прямо указаны как одновременные;
           - "sequential" — передачи прямо указаны как последовательные (одна сторона передаёт первой);
           - "not_defined" — если порядок явно не описан.

        3. good_A_transfer_deadline_status:
           - "defined" — если в тексте прямо указан срок или дата передачи товара A;
           - "not_defined" — если срок прямо не указан.

        4. good_A_transfer_deadline_value:
           Срок или дата передачи товара A на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. good_B_transfer_deadline_status:
           - "defined" — если в тексте прямо указан срок или дата передачи товара B;
           - "not_defined" — если срок прямо не указан.

        6. good_B_transfer_deadline_value:
           Срок или дата передачи товара B на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. transfer_location_status:
           - "defined" — если в тексте прямо указано место передачи товаров;
           - "not_defined" — если место прямо не указано.

        8. transfer_location_details:
           Место передачи товаров на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. transfer_act_status:
           - "defined" — если в тексте прямо упоминается акт приёма-передачи или иной передаточный документ;
           - "not_defined" — если условие о передаточном акте в тексте отсутствует.

        10. transfer_act_details:
            Условие о передаточном акте на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_timing_and_acts_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/code = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - simultaneous = обе передачи прямо указаны как одновременные.
        - sequential = передачи прямо указаны как последовательные (одна сторона первой).
        - Если порядок явно не описан — transfer_sequence_code = "not_defined".
        - Не смешивай сроки и места товара A и товара B.
        - Если в разных фрагментах указаны разные даты передачи или места и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", текстовое поле = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка передачи, ни сроков, ни места, ни упоминания акта.
           → presence = "missing";
             все содержательные status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Неполное раскрытие темы.
           Указан срок передачи, но не указано место или форма акта.
           → presence = "present";
             good_A_transfer_deadline_status / good_B_transfer_deadline_status = "defined";
             transfer_location_status = "not_defined";
             transfer_act_status = "not_defined";
             соответствующие текстовые поля = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте указана одна дата передачи товара A, в другом — другая.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Передача без акта.
           В договоре прямо указано, что передача осуществляется без составления акта (например: "передача производится путём фактического вручения").
           → presence = "present";
             transfer_act_status = "defined";
             transfer_act_details = дословное описание порядка без акта.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_timing_and_acts_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для transfer_sequence_code используй только: "simultaneous", "sequential", "not_defined".
        - Fallback при отсутствии данных: все текстовые поля → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_timing_and_acts_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по срокам / месту / актам передачи в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transfer_sequence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка передачи. Внутреннее enum-поле."
          required: true

        - name: "transfer_sequence_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["simultaneous", "sequential", "not_defined"]
          display_in_grid: false
          description: "Одновременная или последовательная передача. Внутреннее enum-поле."
          required: true

        - name: "good_A_transfer_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус срока передачи товара A. Внутреннее enum-поле."
          required: true

        - name: "good_A_transfer_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок передачи товара A"
          description: >
            Срок или дата передачи товара A. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "good_B_transfer_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус срока передачи товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_transfer_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок передачи товара B"
          description: >
            Срок или дата передачи товара B. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "transfer_location_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
