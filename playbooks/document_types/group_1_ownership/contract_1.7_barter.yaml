      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 380
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены условия о последствиях неисполнения:
        право расторжения, возврат переданного товара, убытки и неустойка.
        Не анализируй форс-мажор, уступку, конфиденциальность или подсудность.
