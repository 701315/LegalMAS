        - name: "good_A_warranty_period_value"
          type: "string"
          presentation: "fact"
          label: "Товар A: гарантийный срок"
          description: >
            Гарантийный срок для товара A. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "good_B_quality_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия гарантии качества товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_quality_warranty_level"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["detailed", "basic", "not_defined"]
          display_in_grid: false
          description: "Уровень детализации гарантии качества товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_warranty_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения гарантийного срока товара B. Внутреннее enum-поле."
          required: true

        - name: "good_B_warranty_period_value"
          type: "string"
          presentation: "fact"
          label: "Товар B: гарантийный срок"
          description: >
            Гарантийный срок для товара B. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: defect_claims_check
    name: "Приёмка товаров по качеству и претензии по недостаткам"
    description: >
      Фактографическая проверка наличия порядка приёмки по качеству, срока
      обнаружения и предъявления претензий по недостаткам, последствий выявления
      недостатков. Гарантии качества — в отдельном check quality_warranty_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приёмка по качеству"
        - "проверка качества"
        - "претензия по качеству"
        - "скрытые недостатки"
        - "рекламация"
        - "недостатки товара"
        - "обнаружение недостатков"
        - "срок предъявления претензий"
        - "акт о недостатках"
        - "замена товара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензи(я|и|ю).*по\\s+(качеств|недостатк)"
        - "(?i)обнаружен(ие|ии)\\s+недостатк"
        - "(?i)скрыт(ые|ых)\\s+недостатк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 474-477 ГК РФ).
        Проверяется только один вопрос: порядок приёмки по качеству,
        претензии по недостаткам и последствия их выявления.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок приёмки по качеству (предусмотрен / нет).
        2. Режим скрытых недостатков (отдельно оговорён / нет).
        3. Срок предъявления претензий по недостаткам.
        4. Форма претензии (письменная / иная).
        5. Последствия выявления недостатков (замена / уменьшение стоимости / возврат).

        [ПРАВИЛА]
        1. Используй только текст договора. Не подставляй нормы ГК РФ вместо текста.
        2. Для status/enum-полей при отсутствии условия — "not_defined".
        3. Для текстовых полей при отсутствии данных — "Данные не определены".
        4. Не додумывай гарантийные сроки, порядок приёмки или последствия,
           если они не зафиксированы в тексте прямо.
        5. В evidence включай только точные цитаты из договора.
        6. Не используй "None", "null", пустые строки ни в одном поле.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Приёмка товаров по качеству производится в момент передачи. Претензии
        по явным недостаткам предъявляются в течение 3 дней, по скрытым — в течение
        6 месяцев с момента обнаружения. При выявлении недостатков Сторона вправе
        требовать замены товара или соразмерного уменьшения стоимости."

        Ответ:
        {
          "acceptance_procedure_status": "defined",
          "hidden_defects_status": "defined",
          "claim_deadline_status": "defined",
          "claim_deadline_value": "3 дня — явные недостатки; 6 месяцев — скрытые",
          "defect_consequences_status": "defined",
          "defect_consequences_code": "replacement",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Претензии по явным недостаткам предъявляются в течение 3 дней, по скрытым — в течение 6 месяцев."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны принимают товары в момент передачи."

        Ответ:
        {
          "acceptance_procedure_status": "not_defined",
          "hidden_defects_status": "not_defined",
          "claim_deadline_status": "not_defined",
          "claim_deadline_value": "Данные не определены",
          "defect_consequences_status": "not_defined",
          "defect_consequences_code": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли конкретный срок предъявления претензий числом дней?
        2. Скрытые недостатки упомянуты отдельно?
        3. Последствия — конкретно (замена / снижение цены / расторжение)?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "acceptance_procedure_status": "<defined / not_defined>",
          "hidden_defects_status": "<defined / not_defined>",
          "claim_deadline_status": "<defined / not_defined>",
          "claim_deadline_value": "<срок или 'Данные не определены'>",
          "defect_consequences_status": "<defined / not_defined>",
          "defect_consequences_code": "<replacement / price_reduction / return / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 440
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "приёмка по качеству проверка качества претензия по качеству скрытые недостатки рекламация недостатки товара обнаружение недостатков срок предъявления претензий акт о недостатках замена товара при недостатках"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "гарантийный срок"
        - "гарантия качества"
        - "гарантирует надлежащее качество"
        - "технические характеристики"
        - "обременения"
        - "залог"
        - "эвикция"
        - "неустойка за неисполнение"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "defect_claims_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора мены данные о порядке приёмки по качеству, претензиях по недостаткам и последствиях их выявления.
        Не анализируй гарантийные сроки, стороны, передачу или расторжение.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. defect_claims_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (acceptance_procedure_status, hidden_defects_status,
              claim_deadline_status, defect_consequences_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - acceptance_procedure_status = "not_defined";
           - hidden_defects_status = "not_defined";
           - claim_deadline_status = "not_defined";
           - claim_deadline_value = "Данные не определены";
           - defect_consequences_status = "not_defined";
           - defect_consequences_code = "not_defined";
           - не выполняй остальные шаги.

        1. acceptance_procedure_status:
           - "defined" — если в тексте прямо указан порядок приёмки товаров по качеству;
           - "not_defined" — если порядок приёмки прямо не указан.

        2. hidden_defects_status:
           - "defined" — если в тексте отдельно урегулирован режим скрытых недостатков;
           - "not_defined" — если скрытые недостатки отдельно не упомянуты.

        3. claim_deadline_status:
           - "defined" — если в тексте прямо указан срок предъявления претензий по недостаткам;
           - "not_defined" — если такой срок прямо не указан.

        4. claim_deadline_value:
           Конкретный срок предъявления претензий на русском языке (например: "3 дня — явные недостатки; 6 месяцев — скрытые").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. defect_consequences_status:
           - "defined" — если в тексте прямо указаны последствия выявления недостатков;
           - "not_defined" — если последствия прямо не указаны.

        6. defect_consequences_code:
           Используй строго только:
           - "replacement" — право требовать замены товара при выявлении недостатков;
           - "price_reduction" — право требовать соразмерного уменьшения стоимости;
           - "return" — право вернуть товар и получить обратно свой (расторжение на этом основании);
           - "not_defined" — если последствия прямо не указаны.
           Если договор предусматривает несколько вариантов последствий, используй то, которое названо первым или основным.
        </task>

        <context_rules>
        - Перед остальными полями заполни defect_claims_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/code = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не подставляй нормы ГК о гарантийных сроках.
        - replacement = право требовать замены товара при выявлении недостатков.
        - price_reduction = право требовать соразмерного уменьшения стоимости.
        - return = право вернуть товар и получить обратно свой (расторжение на этом основании).
        - Если в разных фрагментах указаны разные сроки предъявления претензий и конфликт нельзя разрешить по тексту — claim_deadline_status = "not_defined", claim_deadline_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка приёмки, ни претензий, ни последствий.
           → presence = "missing";
             все содержательные status/code = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Приёмка упомянута, но без срока претензий.
           Указано, что товары принимаются по качеству, но конкретный срок предъявления претензий не установлен.
           → presence = "present";
             acceptance_procedure_status = "defined";
             claim_deadline_status = "not_defined";
             claim_deadline_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные сроки предъявления претензий по недостаткам.
           → presence = "unclear";
             claim_deadline_status = "not_defined";
             claim_deadline_value = "Не удалось определить".

        4. Общая ссылка на закон вместо конкретики.
           В тексте есть общая фраза об ответственности за недостатки со ссылкой на закон без указания конкретных последствий и срока претензий.
           → presence = "present";
             acceptance_procedure_status = "not_defined";
             claim_deadline_status = "not_defined";
             defect_consequences_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для defect_claims_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для defect_consequences_code используй только: "replacement", "price_reduction", "return", "not_defined".
        - Fallback при отсутствии данных: claim_deadline_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: claim_deadline_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "defect_claims_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по приёмке / претензиям в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "acceptance_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия порядка приёмки товаров по качеству. Внутреннее enum-поле."
          required: true

        - name: "hidden_defects_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отдельного урегулирования режима скрытых недостатков. Внутреннее enum-поле."
          required: true

        - name: "claim_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока предъявления претензий по недостаткам. Внутреннее enum-поле."
          required: true

        - name: "claim_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок претензий по недостаткам"
          description: >
            Конкретный срок предъявления претензий по качеству. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "defect_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения последствий выявления недостатков. Внутреннее enum-поле."
          required: true

        - name: "defect_consequences_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Последствия недостатков"
          allowed_values: ["replacement", "price_reduction", "return", "not_defined"]
          description: "Последствия выявления недостатков в обмениваемом товаре. Внутреннее enum-поле."
