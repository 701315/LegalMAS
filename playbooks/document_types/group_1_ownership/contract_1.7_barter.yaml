           → presence = "present";
             suspension_right_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для simultaneous_transfer_mechanism_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для security_mechanism_code используй только: "escrow", "accreditive", "bank_cell", "deposit", "guarantee", "notary_deposit", "none", "not_defined".
        - Для who_transfers_first_code используй только: "party_A", "party_B", "simultaneous", "not_defined".
        - Fallback при отсутствии данных: все *_code → "not_defined".
        - Fallback при противоречии или неоднозначности: все *_code → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "simultaneous_transfer_mechanism_check_presence"
