          "good_B_transfer_deadline_status": "defined",
          "good_B_transfer_deadline": "15.04.2026",
          "transfer_location_status": "defined",
          "transfer_location_details": "г. Москва, ул. Ленина, д. 1",
          "transfer_act_status": "defined",
          "transfer_act_details": "двусторонний акт приёма-передачи",
          "delivery_responsibility_status": "defined",
          "delivery_responsibility": "each_own",
          "insurance_status": "defined",
          "insurance_details": "страхование не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Передача обоих товаров осуществляется одновременно 15.04.2026 по адресу: г. Москва, ул. Ленина, д. 1."
            }
          ]
        }

