      retrieval_query: "ответственность за неисполнение расторжение договора возмещение убытков отказ от исполнения неустойка право отказаться от договора возврат переданного товара при неисполнении ст. 328 ГК РФ ст. 450 ГК РФ ст. 463 ГК РФ"
      preferred_unit_types:
        - liability_provision
