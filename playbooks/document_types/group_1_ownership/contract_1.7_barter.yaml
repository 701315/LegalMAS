           - не выполняй остальные шаги.

        1. ownership_transfer_status:
           - "defined" — если в тексте прямо указан момент перехода права собственности;
           - "default_applies" — если явного условия нет, действует диспозитив ст. 570 ГК РФ;
           - "not_defined" — если из-за противоречия или неоднозначности определить невозможно.

        2. ownership_transfer_moment:
           Используй строго только:
           - "after_both_perform" — право переходит после исполнения обязательств обеими сторонами;
           - "upon_delivery" — в момент фактической передачи товара;
           - "upon_act" — в момент подписания передаточного акта;
           - "upon_registration" — в момент государственной регистрации;
           - "custom" — иной момент, прямо описанный в договоре;
           - "not_defined" — если определить невозможно.

        3. ownership_transfer_details:
           Краткое user-facing описание момента перехода права на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. risk_transfer_status:
           - "defined" — если в тексте прямо указан момент перехода риска случайной гибели / повреждения;
           - "default_applies" — если явного условия нет, действует диспозитив;
           - "not_defined" — если определить невозможно.

        5. risk_transfer_moment:
           Используй строго только:
           - "same_as_ownership" — совпадает с моментом перехода права;
           - "upon_delivery" — в момент фактической передачи;
           - "custom" — иной момент, прямо описанный в договоре;
           - "not_defined" — если определить невозможно.

        6. gap_risk_identified:
           - "yes" — если момент перехода права и момент перехода риска не совпадают;
           - "no" — если они совпадают или оба определяются по диспозитиву.
        </task>

        <context_rules>
        - Перед остальными полями заполни ownership_transfer_timing_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — ownership_transfer_status = "not_defined", ownership_transfer_moment = "not_defined", ownership_transfer_details = "Данные не определены", risk_transfer_status = "not_defined", risk_transfer_moment = "not_defined", gap_risk_identified = "no".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - after_both_perform = право переходит после исполнения обязательств обеими сторонами.
        - upon_delivery = право переходит в момент фактической передачи товара.
        - upon_act = право переходит в момент подписания передаточного акта.
        - upon_registration = право переходит в момент государственной регистрации.
        - custom = иной момент, прямо описанный в договоре.
        - gap_risk_identified = "yes" если момент перехода права и момент перехода риска не совпадают.
        - gap_risk_identified = "no" если они совпадают или оба определяются по диспозитиву.
        - Если в разных фрагментах указаны разные моменты и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующий *_moment = "not_defined", ownership_transfer_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни момента перехода права, ни момента перехода риска.
           → presence = "missing";
             ownership_transfer_status = "not_defined";
             ownership_transfer_moment = "not_defined";
             ownership_transfer_details = "Данные не определены";
             risk_transfer_status = "not_defined";
             risk_transfer_moment = "not_defined";
             gap_risk_identified = "no".

        2. Неполное раскрытие темы.
           Указан момент перехода права, но момент перехода риска не раскрыт.
           → presence = "present";
             ownership_transfer_status = "defined";
             risk_transfer_status = "default_applies";
             risk_transfer_moment = "same_as_ownership".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные моменты перехода права.
           → presence = "unclear";
             ownership_transfer_status = "not_defined";
             ownership_transfer_moment = "not_defined";
             ownership_transfer_details = "Не удалось определить".

        4. Разрыв между правом и риском.
           Момент перехода права и момент перехода риска прямо указаны и не совпадают.
           → presence = "present";
             ownership_transfer_status = "defined";
             risk_transfer_status = "defined";
             gap_risk_identified = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ownership_transfer_timing_check_presence используй только: "present", "missing", "unclear".
        - Для ownership_transfer_status и risk_transfer_status используй только: "defined", "default_applies", "not_defined".
        - Для ownership_transfer_moment используй только: "after_both_perform", "upon_delivery", "upon_act", "upon_registration", "custom", "not_defined".
        - Для risk_transfer_moment используй только: "same_as_ownership", "upon_delivery", "custom", "not_defined".
        - Для gap_risk_identified используй только: "yes", "no".
        - Fallback при отсутствии данных: ownership_transfer_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: ownership_transfer_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ownership_transfer_timing_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования момента перехода права / риска в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ownership_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "default_applies", "not_defined"]
          display_in_grid: false
          description: "Статус момента перехода права собственности. Внутреннее enum-поле."
          required: true

        - name: "ownership_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["after_both_perform", "upon_delivery", "upon_act", "upon_registration", "custom", "not_defined"]
          display_in_grid: false
          description: "Момент перехода права собственности. Внутреннее enum-поле."
          required: true

        - name: "ownership_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Переход права собственности"
          description: >
            Формулировка о моменте перехода права. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "default_applies", "not_defined"]
          display_in_grid: false
          description: "Статус момента перехода риска. Внутреннее enum-поле."
          required: true

        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          label: "Момент перехода риска гибели"
          allowed_values: ["same_as_ownership", "upon_delivery", "custom", "not_defined"]
          description: "Момент перехода риска случайной гибели. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "gap_risk_identified"
          type: "string"
          presentation: "diagnostic"
          label: "Разрыв между правом и риском"
          allowed_values: ["yes", "no"]
          description: "Маркер разрыва между моментами права и риска."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: quality_warranty_check
    name: "Гарантии качества обмениваемых товаров и гарантийные сроки"
    description: >
      Фактографическая проверка наличия гарантий качества для обоих товаров
      и гарантийных сроков. Претензии по недостаткам — в отдельном check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантия качества"
        - "соответствие товара"
        - "отсутствие недостатков"
        - "технические характеристики"
        - "гарантийный срок"
        - "надлежащее качество"
        - "гарантиру"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантиру(ет|ют).*качеств"
        - "(?i)соответств(ует|ие).*требовани"
        - "(?i)гарантийн(ый|ого)\\s+срок"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (гл. 31 ГК РФ; ст. 469-477 ГК РФ).
        Проверяется только один вопрос: гарантии качества и гарантийные сроки
        для каждого из обмениваемых товаров.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантия качества товара A (есть явная / базовая / нет).
        2. Гарантийный срок для товара A.
        3. Гарантия качества товара B.
        4. Гарантийный срок для товара B.

        [ПРАВИЛА]
        1. Используй только текст договора. Не подставляй нормы ГК РФ вместо текста.
        2. Для status/enum-полей при отсутствии условия — "not_defined".
        3. Для текстовых полей при отсутствии данных — "Данные не определены".
        4. Не додумывай гарантийные сроки, порядок приёмки или последствия,
           если они не зафиксированы в тексте прямо.
        5. В evidence включай только точные цитаты из договора.
        6. Не используй "None", "null", пустые строки ни в одном поле.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Сторона 1 гарантирует, что автомобиль соответствует техническим
        характеристикам, указанным в паспорте транспортного средства.
        Гарантийный срок — 12 месяцев. Сторона 2 гарантирует надлежащее
        качество передаваемого помещения. Гарантийный срок не установлен."

        Ответ:
        {
          "good_A_quality_warranty_status": "defined",
          "good_A_quality_warranty_level": "detailed",
          "good_A_warranty_period_status": "defined",
          "good_A_warranty_period_value": "12 месяцев",
          "good_B_quality_warranty_status": "defined",
          "good_B_quality_warranty_level": "basic",
          "good_B_warranty_period_status": "not_defined",
          "good_B_warranty_period_value": "Данные не определены",
          "evidence": [{"clause_ref": "п. 5.1", "quote": "Сторона 1 гарантирует, что автомобиль соответствует техническим характеристикам, указанным в паспорте транспортного средства."}]
        }

        Пример 2:
        Фрагмент:
        "Стороны передают товары в согласованные сроки."

        Ответ:
        {
          "good_A_quality_warranty_status": "not_defined",
          "good_A_quality_warranty_level": "not_defined",
          "good_A_warranty_period_status": "not_defined",
          "good_A_warranty_period_value": "Данные не определены",
          "good_B_quality_warranty_status": "not_defined",
          "good_B_quality_warranty_level": "not_defined",
          "good_B_warranty_period_status": "not_defined",
          "good_B_warranty_period_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли явные заверения о качестве для каждого товара отдельно?
        2. Указан ли гарантийный срок числом месяцев или лет?

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "good_A_quality_warranty_status": "<defined / not_defined>",
          "good_A_quality_warranty_level": "<detailed / basic / not_defined>",
          "good_A_warranty_period_status": "<defined / not_defined>",
          "good_A_warranty_period_value": "<срок или 'Данные не определены'>",
          "good_B_quality_warranty_status": "<defined / not_defined>",
          "good_B_quality_warranty_level": "<detailed / basic / not_defined>",
          "good_B_warranty_period_status": "<defined / not_defined>",
          "good_B_warranty_period_value": "<срок или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантия качества соответствие товара отсутствие недостатков технические характеристики гарантийный срок надлежащее качество гарантирует качество соответствует требованиям"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "приёмка по качеству"
        - "претензия по качеству"
        - "скрытые недостатки"
        - "рекламация"
        - "срок предъявления претензий"
        - "акт о недостатках"
        - "замена товара при недостатках"
        - "доплата"
        - "стоимость товара"
        - "обременения"
        - "эвикция"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "quality_warranty_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора мены данные о гарантиях качества и гарантийных сроках для каждого из обмениваемых товаров.
        Не анализируй претензии по недостаткам, порядок приёмки, стороны или передачу.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. quality_warranty_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (good_A_quality_warranty_status, good_B_quality_warranty_status,
              good_A_warranty_period_status, good_B_warranty_period_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - good_A_quality_warranty_status = "not_defined";
           - good_A_quality_warranty_level = "not_defined";
           - good_A_warranty_period_status = "not_defined";
           - good_A_warranty_period_value = "Данные не определены";
           - good_B_quality_warranty_status = "not_defined";
           - good_B_quality_warranty_level = "not_defined";
           - good_B_warranty_period_status = "not_defined";
           - good_B_warranty_period_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. good_A_quality_warranty_status:
           - "defined" — если гарантия качества товара A прямо указана в тексте;
           - "not_defined" — если гарантия качества товара A прямо не указана.

        2. good_A_quality_warranty_level:
           Используй строго только:
           - "detailed" — указаны конкретные ТТХ, стандарты, ГОСТ и т.п.;
           - "basic" — общая фраза о надлежащем качестве без конкретных характеристик;
           - "not_defined" — если гарантия качества не указана.

        3. good_A_warranty_period_status:
           - "defined" — если гарантийный срок для товара A прямо указан;
           - "not_defined" — если гарантийный срок для товара A прямо не указан.

        4. good_A_warranty_period_value:
           Конкретный гарантийный срок для товара A на русском языке (например: "12 месяцев", "2 года").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. good_B_quality_warranty_status:
           Аналогично good_A_quality_warranty_status, для товара B.

        6. good_B_quality_warranty_level:
           Аналогично good_A_quality_warranty_level, для товара B.

        7. good_B_warranty_period_status:
           Аналогично good_A_warranty_period_status, для товара B.

        8. good_B_warranty_period_value:
           Аналогично good_A_warranty_period_value, для товара B.
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_warranty_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля status/level = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - "basic" = фраза типа "гарантирует надлежащее качество" без конкретных характеристик.
        - "detailed" = указаны конкретные ТТХ, стандарты, ГОСТ и т.п.
        - Не смешивай гарантии товара A и товара B.
        - Если в разных фрагментах указаны разные гарантийные сроки для одного товара и конфликт нельзя разрешить по тексту — соответствующий status = "not_defined", соответствующее *_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий качества, ни гарантийных сроков.
           → presence = "missing";
             все содержательные status/level = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Гарантия дана в общей форме без конкретики.
           Есть фраза "Сторона гарантирует надлежащее качество товара", но без конкретных характеристик и без гарантийного срока.
           → presence = "present";
             соответствующий quality_warranty_status = "defined";
             соответствующий quality_warranty_level = "basic";
             соответствующий warranty_period_status = "not_defined";
             соответствующий warranty_period_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные гарантийные сроки для одного и того же товара.
           → presence = "unclear";
             соответствующий warranty_period_status = "not_defined";
             соответствующий warranty_period_value = "Не удалось определить".

        4. Гарантия качества без гарантийного срока.
           Гарантия качества товара прямо указана, но гарантийный срок не установлен.
           → presence = "present";
             quality_warranty_status = "defined";
             warranty_period_status = "not_defined";
             warranty_period_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_warranty_check_presence используй только: "present", "missing", "unclear".
        - Для status/level-полей используй только: "defined", "not_defined".
        - Для quality_warranty_level используй только: "detailed", "basic", "not_defined".
        - Fallback при отсутствии данных: warranty_period_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: warranty_period_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_warranty_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантиям качества в мене. Внутреннее агрегатное signal-поле."
          required: true

        - name: "good_A_quality_warranty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия гарантии качества товара A. Внутреннее enum-поле."
          required: true

        - name: "good_A_quality_warranty_level"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["detailed", "basic", "not_defined"]
          display_in_grid: false
