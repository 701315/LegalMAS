        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. simultaneous_transfer_mechanism_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (security_mechanism_status, who_transfers_first_status,
              suspension_right_status, retention_right_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных статусных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - security_mechanism_status = "not_defined";
           - security_mechanism_code = "not_defined";
           - who_transfers_first_status = "not_defined";
           - who_transfers_first_code = "not_defined";
           - suspension_right_status = "not_defined";
           - retention_right_status = "not_defined";
           - не выполняй остальные шаги.

        1. security_mechanism_status:
           - "defined" — если в тексте прямо указан механизм обеспечения или прямо сказано, что передача осуществляется напрямую без механизма;
           - "not_defined" — если условие о механизме в тексте отсутствует.

        2. security_mechanism_code:
           Используй строго только:
           - "escrow" — передача через эскроу-агента;
           - "accreditive" — расчёт или передача через аккредитив;
           - "bank_cell" — через банковскую ячейку;
           - "deposit" — обеспечительный депозит или задаток;
           - "guarantee" — банковская гарантия;
           - "notary_deposit" — депозит нотариуса;
           - "none" — механизм обеспечения не предусмотрен, передача напрямую;
           - "not_defined" — если механизм есть, но не подпадает ни под одно значение.

        3. who_transfers_first_status:
           - "defined" — если в тексте прямо указано, кто передаёт первым, либо передачи одновременны;
           - "not_defined" — если очерёдность явно не описана.

        4. who_transfers_first_code:
