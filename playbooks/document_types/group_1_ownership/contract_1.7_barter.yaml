      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: true
      llm_max_tokens: 380
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора мены условия доставки товаров
        и страхования при перевозке или хранении.
        Не анализируй сроки передачи, акты, механизм обеспечения или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. delivery_responsibility_status — "defined" или "not_defined".
        2. delivery_responsibility — party_A / party_B / each_own / third_party / not_defined.
        3. delivery_responsibility_details — кто и как несёт расходы на доставку.
        4. insurance_status — "defined" или "not_defined".
        5. insurance_details — условие страхования товаров.
        6. insurance_beneficiary_status — "defined" или "not_defined".

        Если данных нет: статус = "not_defined", текст = "Данные не определены".
        </task>

        <rules>
        - Только текст договора.
        - party_A = расходы на доставку несёт Сторона 1 (передающая товар A).
        - party_B = расходы на доставку несёт Сторона 2 (передающая товар B).
        - each_own = каждая сторона несёт расходы на доставку своего товара.
        - third_party = расходы несёт третья сторона (перевозчик, логист и т.п.).
        - Верни только JSON.
        </rules>
      fields:
        - name: "delivery_responsibility_status"
          type: "string"
