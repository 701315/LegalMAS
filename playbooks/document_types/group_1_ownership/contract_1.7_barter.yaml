      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора мены налоговые оговорки: НДС, налоговая база, счета-фактуры и НДФЛ для физических лиц.
        Не анализируй цену товаров, сроки передачи, ответственность или обременения.
        Не оценивай риски и не делай выводов на основе норм права.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tax_consequences_disclosure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tax_disclosure_status, vat_treatment_status, vat_treatment_code,
              tax_base_method_status, tax_base_method_code,
              invoice_obligation_status, ndfl_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - tax_disclosure_status = "not_defined";
           - vat_treatment_status = "not_defined";
           - vat_treatment_code = "not_defined";
           - tax_base_method_status = "not_defined";
           - tax_base_method_code = "not_defined";
           - invoice_obligation_status = "not_defined";
           - ndfl_status = "not_defined";
           - не выполняй остальные шаги.

        1. tax_disclosure_status:
           - "defined" — если в тексте прямо есть хотя бы одна налоговая оговорка (НДС, налоговая база, счета-фактуры, НДФЛ);
           - "not_defined" — если налоговых оговорок нет.

        2. vat_treatment_status:
           - "defined" — если в тексте прямо указан режим НДС (начисление / освобождение);
           - "not_defined" — если режим НДС прямо не указан.

        3. vat_treatment_code:
           Используй строго только:
           - "both_charge" — обе стороны начисляют НДС как при встречной реализации;
           - "exempt" — мена прямо освобождена от НДС;
           - "not_specified" — вопрос НДС упомянут, но режим прямо не определён;
           - "not_defined" — если не определено.

        4. tax_base_method_status:
           - "defined" — если в тексте прямо указан способ определения налоговой базы;
           - "not_defined" — если способ прямо не указан.

        5. tax_base_method_code:
           Используй строго только:
           - "market" — налоговая база определяется по рыночной стоимости;
           - "contractual" — налоговая база определяется по договорной стоимости;
           - "not_defined" — если не определено.

        6. invoice_obligation_status:
           - "defined" — если в тексте прямо указана обязанность выставить счёт-фактуру;
           - "not_defined" — если такая обязанность прямо не указана.

        7. ndfl_status:
