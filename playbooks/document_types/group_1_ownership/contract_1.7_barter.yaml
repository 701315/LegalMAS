      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены (бартера) (гл. 31 ГК РФ, ст. 568 ГК РФ).
        Проверяется только один вопрос: метод оценки равноценности и порядок доплаты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Метод оценки стоимости каждого товара (рыночная / договорная / оценщик / формула).
        2. Заявленная равноценность или неравноценность.
        3. Конкретный размер доплаты при неравноценности.
        4. Срок уплаты доплаты.
        5. Последствия просрочки доплаты.
        6. Механизм разрешения споров об оценке.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Как определена стоимость — рыночная, договорная или оценщик?
        2. Указан ли конкретный размер доплаты числом?
        3. Указан ли срок уплаты доплаты?
        4. Что происходит при просрочке доплаты?
        5. Если обмен равноценный — surcharge_status = "not_defined" (не применимо).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "valuation_method_status": "<defined / not_defined>",
          "valuation_method": "<market / appraiser / agreement / formula / not_defined>",
          "equivalence_status": "<defined / not_defined>",
          "equivalence": "<equal / unequal / not_defined>",
          "surcharge_amount_status": "<defined / not_defined>",
          "surcharge_amount": "<сумма или 'Данные не определены'>",
          "surcharge_deadline_status": "<defined / not_defined>",
          "surcharge_deadline": "<срок или 'Данные не определены'>",
          "surcharge_late_consequences_status": "<defined / not_defined>",
          "dispute_resolution_valuation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "равноценность"
        - "доплата"
        - "рыночная стоимость"
        - "оценка"
        - "ст. 568 ГК РФ"
        - "стоимость товара"
        - "разница в стоимости"
      rerank: true
    enrichment_hints:
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
