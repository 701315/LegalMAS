        - "расходы на доставку"
        - "самовывоз"
        - "перевозка"
        - "страхование"
        - "страховой полис"
        - "застраховать"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "риск утраты при перевозке"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк(а|у|и)\\s+за\\s+счёт"
        - "(?i)страхов(ание|ой\\s+полис)"
        - "(?i)транспортировк(а|у)\\s+(за\\s+счёт|несёт)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор мены.
        Проверяется только один вопрос: кто несёт расходы на доставку
        и предусмотрено ли страхование товаров.
        Не анализируй сроки и место передачи, акты или механизм обеспечения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт расходы на доставку каждого товара.
        2. Условие страхования товаров при перевозке или хранении.
        3. Выгодоприобретатель по страховке.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. В evidence — только текст договора.
        3. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Доставка товара A осуществляется за счёт Стороны 1. Товар B передаётся
        самовывозом за счёт Стороны 2. Стороны обязуются застраховать товары
        на период перевозки, выгодоприобретателем является получающая сторона."

        Ответ:
        {
          "delivery_responsibility_status": "defined",
          "delivery_responsibility": "each_own",
          "delivery_responsibility_details": "доставка товара A за счёт Стороны 1; товар B — самовывоз за счёт Стороны 2",
          "insurance_status": "defined",
          "insurance_details": "обязуются застраховать товары на период перевозки",
          "insurance_beneficiary_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Доставка товара A осуществляется за счёт Стороны 1. Товар B передаётся самовывозом за счёт Стороны 2."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обмениваются товарами в согласованные сроки."

        Ответ:
        {
          "delivery_responsibility_status": "not_defined",
          "delivery_responsibility": "not_defined",
          "delivery_responsibility_details": "Данные не определены",
          "insurance_status": "not_defined",
          "insurance_details": "Данные не определены",
          "insurance_beneficiary_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Кто несёт расходы — прямо написано?
        2. Страхование — обязательно или не предусмотрено?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "delivery_responsibility_status": "<defined / not_defined>",
          "delivery_responsibility": "<party_A / party_B / each_own / third_party / not_defined>",
          "delivery_responsibility_details": "<текст или 'Данные не определены'>",
          "insurance_status": "<defined / not_defined>",
          "insurance_details": "<текст или 'Данные не определены'>",
          "insurance_beneficiary_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доставка транспортировка расходы на доставку самовывоз перевозка страхование страховой полис застраховать страховая сумма выгодоприобретатель риск утраты при перевозке кто несёт расходы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "срок передачи"
        - "акт приёма-передачи"
        - "одновременно"
        - "эскроу"
        - "аккредитив"
        - "встречное исполнение"
        - "наименование товара"
        - "стоимость товара"
        - "доплата"
        - "обременения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.10
        scope: segment
