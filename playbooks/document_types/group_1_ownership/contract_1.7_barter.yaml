      mode: "hybrid"
      fields:
        - name: "valuation_method_status"
          type: "string"
          allowed_values: ["defined", "not_defined"]
          description: "Верни 'defined', если метод оценки прямо определён. Иначе 'not_defined'."
        - name: "valuation_method"
          type: "string"
          allowed_values: ["market", "appraiser", "agreement", "formula", "not_defined"]
          description: "Метод оценки стоимости."
        - name: "surcharge_amount_status"
