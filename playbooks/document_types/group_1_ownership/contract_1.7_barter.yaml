  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Оценка равноценности и доплата
  # ──────────────────────────────────────────────────────────────────────────
  - id: valuation_and_surcharge_check
    name: "Оценка равноценности и порядок доплаты (ст. 568 ГК РФ)"
    description: >
      Фактографическая проверка наличия метода оценки, конкретного размера доплаты,
      срока, реквизитов и последствий просрочки при неравноценном обмене.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "равноценный"
        - "неравноценный"
        - "доплата"
        - "разница в стоимости"
        - "компенсация разницы"
        - "метод оценки"
        - "рыночная стоимость"
        - "независимый оценщик"
        - "стоимость"
        - "оценка"
        - "рублей"
        - "оценщик"
      keyword_mode: "any"
      regex_patterns:
        - "{{ money_amount }}"
        - "(?i)доплат(а|у|ы|ить)\\s+.*?\\d"
        - "(?i)(равноценн|неравноценн)"
        - "(?i)разниц(а|у|ы)\\s+в\\s+стоимости"
        - "(?i)оценива(ется|ются)\\s+в"
