        Не анализируй общие условия передачи или ответственность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. VIN каждого транспортного средства.
        2. Условие о передаче ПТС/СТС.
        3. Порядок и срок перерегистрации в ГИБДД.
        4. Заверение о техническом состоянии.
        5. ОСАГО.
        6. Диагностическая карта.
        7. Заверение об отсутствии залога/ограничений.

        [ПРАВИЛА]
        1. Только текст документа. Если нет — "not_defined".
        2. VIN — только если прямо написан.
        3. В evidence — только текст договора.
        4. Верни только JSON.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ТС A — Toyota Camry, VIN XW7BF4FK30S123456, 2021 г.в.
        ТС B — Hyundai Solaris, VIN Z94CB41ABDR000001, 2020 г.в.
        ПТС на каждый автомобиль передаётся при подписании акта.
        Перерегистрация в ГИБДД — в течение 10 дней.
        Оба автомобиля не находятся в залоге и без ограничений.
        ОСАГО оформляется каждой принимающей стороной самостоятельно."

        Ответ:
        {
          "vehicle_A_vin_status": "defined",
          "vehicle_A_vin": "XW7BF4FK30S123456",
          "vehicle_B_vin_status": "defined",
          "vehicle_B_vin": "Z94CB41ABDR000001",
          "pts_transfer_status": "defined",
          "gibdd_registration_status": "defined",
          "gibdd_registration_deadline_status": "defined",
          "gibdd_registration_deadline": "10 дней",
          "technical_condition_status": "not_defined",
          "osago_status": "defined",
          "diagnostic_card_status": "not_defined",
          "pledge_absence_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "ТС A — Toyota Camry, VIN XW7BF4FK30S123456, 2021 г.в."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обмениваются транспортными средствами."

        Ответ:
        {
          "vehicle_A_vin_status": "not_defined",
          "vehicle_A_vin": "Данные не определены",
          "vehicle_B_vin_status": "not_defined",
          "vehicle_B_vin": "Данные не определены",
          "pts_transfer_status": "not_defined",
          "gibdd_registration_status": "not_defined",
          "gibdd_registration_deadline_status": "not_defined",
          "gibdd_registration_deadline": "Данные не определены",
          "technical_condition_status": "not_defined",
          "osago_status": "not_defined",
          "diagnostic_card_status": "not_defined",
          "pledge_absence_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. VIN каждого ТС — прямо?
        2. ПТС — упомянут?
        3. Срок перерегистрации — конкретный?

        Не выводи шаги. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "vehicle_A_vin_status": "<defined / not_defined>",
          "vehicle_A_vin": "<VIN или 'Данные не определены'>",
          "vehicle_B_vin_status": "<defined / not_defined>",
          "vehicle_B_vin": "<VIN или 'Данные не определены'>",
          "pts_transfer_status": "<defined / not_defined>",
          "gibdd_registration_status": "<defined / not_defined>",
          "gibdd_registration_deadline_status": "<defined / not_defined>",
          "gibdd_registration_deadline": "<срок или 'Данные не определены'>",
          "technical_condition_status": "<defined / not_defined>",
          "osago_status": "<defined / not_defined>",
          "diagnostic_card_status": "<defined / not_defined>",
          "pledge_absence_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "VIN ПТС СТС регистрация в ГИБДД перерегистрация транспортного средства год выпуска ОСАГО диагностическая карта техническое состояние автомобиля отсутствие залога на автомобиль ограничения регистрационных действий"
