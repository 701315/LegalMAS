           но без прямого указания, кто начисляет и по какой ставке.
           → presence = "present";
             vat_treatment_status = "not_defined";
             vat_treatment_code = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_consequences_disclosure_check_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Для vat_treatment_code используй только: "both_charge", "exempt", "not_specified", "not_defined".
        - Для tax_base_method_code используй только: "market", "contractual", "not_defined".
        - Fallback при отсутствии данных: все *_code → "not_defined".
        - Fallback при противоречии или неоднозначности: все *_code → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
