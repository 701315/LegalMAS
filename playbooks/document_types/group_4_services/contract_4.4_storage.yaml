          display_priority: 4

      store_payload: true

  - id: lien_right_on_item
    name: "Право удержания вещи до оплаты (ст. 359 ГК РФ)"
    description: >
      Фактографическая проверка наличия условия о праве хранителя удерживать вещь
      до уплаты вознаграждения и возмещения расходов (общая норма — ст. 359 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право удержания"
        - "удержание вещи"
        - "до уплаты вознаграждения"
        - "до возмещения расходов"
        - "ст. 359"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержива(ть|ет).*вещь.*до.*оплат"
        - "(?i)право\\s+удержани(я|е)"
        - "(?i)ст\\.?\\s*359"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 359 ГК РФ).
        Проверяется только один вопрос: право хранителя удерживать вещь.
        Нормативный ориентир:
        - ст. 359 ГК РФ — общее право удержания: кредитор, у которого
          находится вещь, подлежащая передаче должнику, вправе удерживать
          её до исполнения должником обязательства по оплате этой вещи
          или возмещению связанных с ней издержек и убытков.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право удержания из ст. 359 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право удержания вещи.
        2. Условия реализации права удержания (до уплаты вознаграждения /
          до возмещения расходов / иные).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальное поле (lien_right_status) → "not_defined";
          - текстовое поле (lien_right_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. lien_right_status = "defined" — если прямо указано право удерживать
          вещь (любая формулировка: «вправе удерживать», «право удержания»,
          «не возвращает до оплаты»).
        5. Если прямо указан запрет удержания — lien_right_status = "defined",
          lien_right_details содержит формулировку запрета.
        6. В evidence — только цитаты из документа, каждая с clause_ref.
        7. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранитель вправе удерживать вещь до уплаты вознаграждения
        и возмещения расходов на хранение."
        Ответ:
        {
          "lien_right_status": "defined",
          "lien_right_details": "вправе удерживать вещь до уплаты вознаграждения и возмещения расходов",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе удерживать вещь до уплаты вознаграждения и возмещения расходов на хранение."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "lien_right_status": "not_defined",
          "lien_right_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 (частичные данные — только до вознаграждения):
        Фрагмент:
        "Хранитель не возвращает вещь до уплаты причитающегося ему
        вознаграждения."
        Ответ:
        {
          "lien_right_status": "defined",
          "lien_right_details": "не возвращает вещь до уплаты вознаграждения",
          "evidence": [
