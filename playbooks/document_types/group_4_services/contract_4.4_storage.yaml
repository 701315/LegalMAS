        - Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.
        </rules>
      fields:
        - name: "damages_recovery_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о возмещении убытков хранителю."
          label: "Возмещение убытков"
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "damage_bearer"
          type: "string"
          presentation: "signal"
          allowed_values: ["depositor", "custodian", "both", "not_defined"]
          description: "Кто несёт убытки."
          label: "Кто возмещает"
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "liability_exclusions"
          type: "string"
          presentation: "fact"
          label: "Освобождения"
          description: "Основания освобождения поклажедателя от возмещения."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "damages_recovery_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возмещения"
          description: "Порядок возмещения убытков хранителю."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: perishable_goods_sale
    name: "Продажа портящейся вещи (п. 2 ст. 899 ГК РФ)"
    description: >
      Фактографическая проверка условия о праве хранителя продать вещь,
      подверженную быстрой порче, по цене, сложившейся в месте хранения,
      с последующей передачей выручки поклажедателю. Правовой ориентир —
      п. 2 ст. 899 ГК РФ.
    triggers:
      any: ["perishable_goods_storage"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "портящаяся вещь"
        - "подверженная быстрой порче"
        - "реализация портящейся"
        - "продажа вещи"
        - "по цене, сложившейся в месте хранения"
        - "уведомление о продаже"
        - "ст. 899"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(портящ|быстр(ой|о)).*порч"
        - "(?i)(продаж|реализац).*(портящ|испорч)"
        - "(?i)по\\s+цене.*мест.*хранени"
        - "(?i)ст\\.?\\s*899"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (п. 2 ст. 899 ГК РФ).
        Проверяется один вопрос: продажа вещи, подверженной быстрой порче,
        с последующей передачей выручки поклажедателю.
        Нормативный ориентир:
        - п. 2 ст. 899 ГК РФ — если вещь, сданная на хранение, подвергается
          быстрой порче и возникает угроза её уничтожения, хранитель вправе
          самостоятельно продать её по цене, сложившейся в месте хранения,
          с передачей вырученной суммы поклажедателю (за вычетом сумм,
          причитающихся хранителю).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи механизм из п. 2 ст. 899 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право хранителя продать портящуюся вещь.
        2. Указан ли порядок определения цены (по цене, сложившейся
          в месте хранения / иной).
        3. Требуется ли уведомление поклажедателя перед продажей.
        4. Указано ли, что выручка передаётся поклажедателю.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (perishable_sale_status /
            price_determination_status / notification_before_sale_status /
            proceeds_transfer_status) → "not_defined";
          - текстовое поле (perishable_sale_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. perishable_sale_status = "defined" — если прямо предусмотрена
          продажа вещи, подверженной быстрой порче.
        5. price_determination_status = "defined" — если прямо указан порядок
          определения цены. Значение — текстом (например, «по цене,
          сложившейся в месте хранения»).
        6. notification_before_sale_status = "yes" — если прямо указана
          обязанность уведомить поклажедателя о продаже.
        7. proceeds_transfer_status = "yes" — если прямо указано,
          что выручка передаётся поклажедателю.
        8. perishable_sale_details — порядок продажи, порядок расчёта, срок
          передачи выручки.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Если вещь, сданная на хранение, подвергнется быстрой порче,
        Хранитель вправе самостоятельно продать её по цене, сложившейся
        в месте хранения, уведомив Поклажедателя в течение 24 часов.
        Вырученная сумма передаётся Поклажедателю за вычетом сумм,
        причитающихся Хранителю."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "defined",
          "price_determination_details": "по цене, сложившейся в месте хранения",
          "notification_before_sale_status": "yes",
          "proceeds_transfer_status": "yes",
          "perishable_sale_details": "уведомление в течение 24 часов; выручка передаётся Поклажедателю за вычетом сумм Хранителя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Если вещь, сданная на хранение, подвергнется быстрой порче, Хранитель вправе самостоятельно продать её по цене, сложившейся в месте хранения, уведомив Поклажедателя в течение 24 часов."
            }
          ]
        }

        Пример 2 (без уведомления):
        Фрагмент:
        "Хранитель вправе реализовать вещь, подверженную быстрой порче,
        по рыночной цене с зачислением выручки на счёт Поклажедателя."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "defined",
          "price_determination_details": "по рыночной цене",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "yes",
          "perishable_sale_details": "зачисление выручки на счёт Поклажедателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе реализовать вещь, подверженную быстрой порче, по рыночной цене с зачислением выручки на счёт Поклажедателя."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Портящиеся товары могут быть реализованы Хранителем."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "not_defined",
          "price_determination_details": "Данные не определены",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "not_defined",
          "perishable_sale_details": "реализация портящихся товаров хранителем (без деталей)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Портящиеся товары могут быть реализованы Хранителем."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "perishable_sale_status": "not_defined",
          "price_determination_status": "not_defined",
          "price_determination_details": "Данные не определены",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "not_defined",
          "perishable_sale_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли продажа портящейся вещи?
        2. Определён ли порядок цены?
        3. Указано ли уведомление поклажедателя?
        4. Указано ли, что выручка передаётся поклажедателю?
        5. Выведен ли механизм из текста договора, а не из п. 2 ст. 899 ГК РФ?
        6. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "perishable_sale_status": "<defined / not_defined>",
          "price_determination_status": "<defined / not_defined>",
          "price_determination_details": "<текст или 'Данные не определены'>",
          "notification_before_sale_status": "<yes / no / not_defined>",
          "proceeds_transfer_status": "<yes / no / not_defined>",
          "perishable_sale_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "портящаяся вещь подверженная быстрой порче реализация портящейся продажа вещи по цене сложившейся в месте хранения уведомление о продаже выручка поклажедателю ст. 899"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о продаже вещи, подверженной быстрой порче.
        Не анализируй иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. perishable_sale_status — "defined" или "not_defined".
        2. price_determination_status — "defined" или "not_defined".
        3. price_determination_details — порядок цены (текст).
        4. notification_before_sale_status — yes / no / not_defined.
        5. proceeds_transfer_status — yes / no / not_defined.
        6. perishable_sale_details — порядок продажи, расчёта, передачи выручки.
        7. evidence — массив цитат {"clause_ref", "quote"}.
        </task>
        <rules>
        - Используй только текст договора.
        - Не выводи механизм из п. 2 ст. 899 ГК РФ — только из текста.
        - perishable_sale_status = "defined" — если прямо предусмотрена
          продажа портящейся вещи.
        - price_determination_status = "defined" — если прямо указан
          порядок цены.
        - notification_before_sale_status = "yes" — если прямо указана
          обязанность уведомить поклажедателя перед продажей.
        - proceeds_transfer_status = "yes" — если прямо указано,
          что выручка передаётся поклажедателю.
        - Для отсутствующих данных:
          - сигнальные поля → "not_defined";
          - текстовые поля → "Данные не определены".
        - Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.
        </rules>
      fields:
        - name: "perishable_sale_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о продаже портящейся вещи."
          label: "Продажа портящейся вещи"
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "price_determination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о порядке цены."
          required: true
        - name: "price_determination_details"
          type: "string"
          presentation: "fact"
          label: "Порядок цены"
          description: "Порядок определения цены продажи."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "notification_before_sale_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность уведомить поклажедателя."
          label: "Уведомление о продаже"
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "proceeds_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Передача выручки поклажедателю."
          label: "Передача выручки"
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "perishable_sale_details"
          type: "string"
          presentation: "fact"
          label: "Порядок продажи"
          description: "Порядок продажи, расчёта и передачи выручки."
          required: true
          display_in_grid: true
          display_priority: 5

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты хранителя и поклажедателя
      (наименование, ИНН, ОГРН, адрес), полномочия подписантов,
      а также статус профессионального хранителя.
    addressee: "Обе стороны"
  storage_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание вещи; (б) количество/вес/объём;
      (в) заявленную стоимость; (г) тип вещи (индивидуальная/родовая);
      (д) тип хранения (обычное/иррегулярное); (е) идентификационные признаки.
    addressee: "Обе стороны"
  acceptance_documentation_check:
    text: >
      Просим уточнить в {doc_names}: (а) вид документа о приёме (акт МХ-1, расписка,
      складское свидетельство); (б) порядок и сроки выдачи; (в) ссылку на Постановление Росстата № 66.
    addressee: "Хранитель"
  professional_custodian_liability:
    text: >
      В {doc_names} хранитель осуществляет профессиональную деятельность.
      ОБЯЗАТЕЛЬНО: ответственность независимо от вины (ст. 901 ГК РФ),
      за исключением непреодолимой силы. Просим подтвердить/включить это условие.
    addressee: "Юридический советник"
  return_on_first_demand_check:
    text: >
      Просим подтвердить в {doc_names}: право поклажедателя забрать вещь
      в любой момент (ст. 904 ГК РФ), отсутствие штрафов за досрочный возврат.
    addressee: "Юридический советник"
  irregular_storage_terms:
    text: >
      В {doc_names} предусмотрено иррегулярное хранение. Просим уточнить:
      (а) условия смешения вещей; (б) требования к качеству (сорт, класс);
      (в) порядок возврата того же рода и качества; (г) долю в общей массе.
    addressee: "Обе стороны"
  uncollected_goods_disposal:
    text: >
      Просим включить в {doc_names}: процедуру реализации невостребованной вещи
      (ст. 899 ГК РФ): уведомление, срок, порядок продажи, распределение выручки.
    addressee: "Хранитель"
  dangerous_properties_disclosure:
    text: >
      В {doc_names} хранится потенциально опасная вещь. Просим включить:
      (а) обязанность поклажедателя раскрыть опасные свойства (ст. 893 ГК РФ);
      (б) право хранителя уничтожить опасную вещь за счёт поклажедателя (ст. 894 ГК РФ);
      (в) подтверждение наличия лицензии на хранение опасных веществ.
    addressee: "Юридический советник"
  warehouse_certificate_issuance:
    text: >
      Просим уточнить в {doc_names}: (а) вид складского свидетельства (простое / двойное);
      (б) порядок выдачи; (в) возможность передачи и залога по варранту.
    addressee: "Хранитель"
  lien_right_on_item:
    text: >
      Просим уточнить в {doc_names}: право хранителя удерживать вещь до оплаты
      вознаграждения и возмещения расходов (ст. 359, 920 ГК РФ).
    addressee: "Юридический советник"
  natural_loss_norms:
    text: >
      Просим включить в {doc_names}: ссылку на утверждённые нормы естественной убыли,
      освобождение от ответственности в пределах норм (ст. 903 ГК РФ).
    addressee: "Юридический советник"
  remuneration_and_expenses:
    text: >
      Просим подтвердить по {doc_names}: (а) размер вознаграждения;
      (б) является ли хранение безвозмездным; (в) порядок возмещения расходов.
    addressee: "Обе стороны"
  storage_term:
    text: >
      Просим уточнить в {doc_names}: срок хранения или условие «до востребования».
    addressee: "Обе стороны"
  storage_conditions:
    text: >
      Просим уточнить в {doc_names}: требования к условиям хранения
      (температура, влажность, освещённость, вентиляция).
    addressee: "Хранитель"
  return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок выдачи вещи, проверка правомочий
      получателя, форма акта выдачи (МХ-3).
    addressee: "Обе стороны"
  inspection_upon_return:
    text: >
      Просим включить в {doc_names}: обязательную проверку вещи при возврате,
      порядок фиксации недостачи/повреждений, срок предъявления претензий.
    addressee: "Поклажедатель"
  extraordinary_expenses:
    text: >
      Просим включить в {doc_names}: условия возмещения чрезвычайных расходов
