        Товар, находящийся на хранении, может быть предметом залога по варранту."
        Ответ:
        {
          "certificate_mentioned": "defined",
          "certificate_type": "double",
          "issuance_timing": "upon_acceptance",
          "transfer_allowed": "yes",
          "pledge_allowed": "yes",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
