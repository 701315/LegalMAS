        - norms_referenced = "yes" — при ссылке на конкретный акт
          либо на «нормы естественной убыли, утверждённые в установленном порядке».
        - Если в разных фрагментах указаны противоречивые данные — все содержательные
          поля = "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания естественной убыли, ни норм,
           ни освобождения от ответственности.
           → presence = "missing";
             все содержательные поля = "not_defined".

        2. Убыль упомянута без деталей.
           Например: "Стороны применяют нормы естественной убыли",
           без указания акта и без оговорки об освобождении.
           → presence = "present";
             natural_loss_status = "defined";
             norms_referenced = "no";
             loss_within_norms_exempt = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы: где-то есть
           освобождение в пределах норм, где-то прямо указано обратное.
           → presence = "unclear";
             соответствующие содержательные поля = "not_defined".

        4. Прямое указание на неприменение норм.
           В договоре прямо указано, что нормы естественной убыли не применяются
           и хранитель отвечает за любое отклонение количества / качества.
           → presence = "present";
             natural_loss_status = "defined" (прямое регулирование);
             norms_referenced = "no" (нормы прямо отвергаются);
             loss_within_norms_exempt = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для natural_loss_norms_presence используй только: "present", "missing", "unclear".
        - Для natural_loss_status используй только: "defined", "not_defined".
        - Для norms_referenced и loss_within_norms_exempt используй только: "yes", "no", "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "natural_loss_norms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о естественной убыли и нормах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "natural_loss_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания естественной убыли. Внутреннее enum-поле."
          label: "Естественная убыль"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "norms_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ссылка на утверждённые нормы естественной убыли. Внутреннее enum-поле."
          label: "Ссылка на нормы"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "loss_within_norms_exempt"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Освобождение от ответственности в пределах норм. Внутреннее enum-поле."
          label: "Освобождение в пределах норм"
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: remuneration_and_expenses
    name: "Вознаграждение хранителя и возмещение расходов (ст. 896, 897 ГК РФ)"
    description: >
      Проверка условий вознаграждения хранителя, безвозмездности хранения
      и порядка возмещения расходов на хранение. Правовые ориентиры:
      ст. 896 ГК РФ (вознаграждение), ст. 897 ГК РФ (возмещение расходов
      на хранение), ст. 898 ГК РФ (чрезвычайные расходы).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вознаграждение"
        - "вознаграждение хранителя"
        - "плата за хранение"
        - "стоимость хранения"
        - "тариф"
        - "ставка хранения"
        - "оплата хранения"
        - "возмездное"
        - "безвозмездное"
        - "возмещение расходов"
        - "расходы хранителя"
        - "чрезвычайные расходы"
        - "ст. 896"
        - "ст. 897"
        - "ст. 898"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознагражден(ие|ия)\\s+хранител"
        - "(?i)плат(а|ы)\\s+за\\s+хранени"
        - "(?i)стоимост(ь|и)\\s+хранени"
        - "(?i)возмездн(ое|ого)\\s+хранени"
        - "(?i)безвозмездн(ое|ого)\\s+хранени"
        - "(?i)возмещени(е|я)\\s+расходов"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 896, 897, 898 ГК РФ).
        Проверяется один вопрос: условия вознаграждения хранителя
        и порядок возмещения расходов на хранение.
        Нормативные ориентиры:
        - ст. 896 ГК РФ — вознаграждение хранителю; при возмездном
          хранении хранитель вправе требовать плату по истечении
          срока договора, а при досрочном прекращении — соразмерную часть;
        - ст. 897 ГК РФ — возмещение расходов на хранение, если иное
          не предусмотрено договором;
        - ст. 898 ГК РФ — чрезвычайные расходы, которые хранитель
          понёс для сохранения вещи (возмещаются, если поклажедатель
          дал согласие или последующее одобрение).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 896–898 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли вознаграждение хранителя.
        2. Размер вознаграждения (сумма, тариф, ставка).
        3. Порядок и сроки оплаты вознаграждения.
        4. Указано ли возмещение расходов на хранение.
        5. Формулировку о возмещении расходов (состав, порядок, пределы).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status) → "not_defined";
          - текстовые поля (remuneration_value / remuneration_payment_terms /
            reimbursement_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если хранение прямо названо безвозмездным — remuneration_status
          = "defined", remuneration_value = "Безвозмездное хранение".
        5. remuneration_value — фиксируй сумму / тариф / ставку с единицей
          измерения («10 000 руб. / месяц», «5% от стоимости»). Не голое число.
        6. remuneration_payment_terms — порядок и сроки («ежемесячно
          до 5-го числа», «в течение 10 дней после выставления счёта»).
        7. reimbursement_status = "defined" — если прямо указано возмещение
          расходов (любая формулировка: «расходы возмещаются», «хранитель
          вправе требовать возмещения»).
        8. reimbursement_details — состав / порядок / пределы возмещения
          («фактические расходы по документам», «в пределах согласованной сметы»).
        9. Если указано, что вознаграждение не взимается, — remuneration_status
          = "defined", remuneration_value = "Вознаграждение не взимается".
        10. В evidence — только цитаты из документа, каждая с clause_ref.
        11. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (возмездное с расходами):
        Фрагмент:
        "Вознаграждение Хранителя составляет 10 000 рублей в месяц.
        Оплата производится ежемесячно до 5-го числа текущего месяца.
        Расходы Хранителя на хранение возмещаются Поклажедателем
        в полном объёме по подтверждающим документам."
        Ответ:
        {
          "remuneration_status": "defined",
          "remuneration_value": "10 000 рублей в месяц",
          "remuneration_payment_terms": "ежемесячно до 5-го числа текущего месяца",
          "reimbursement_status": "defined",
          "reimbursement_details": "расходы возмещаются в полном объёме по подтверждающим документам",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Вознаграждение Хранителя составляет 10 000 рублей в месяц."
            }
          ]
        }

        Пример 2 (безвозмездное):
        Фрагмент:
        "Хранение вещи осуществляется безвозмездно. Расходы на хранение
        относятся на счёт Поклажедателя."
        Ответ:
        {
          "remuneration_status": "defined",
          "remuneration_value": "Безвозмездное хранение",
          "remuneration_payment_terms": "Данные не определены",
          "reimbursement_status": "defined",
          "reimbursement_details": "расходы относятся на счёт Поклажедателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранение вещи осуществляется безвозмездно."
            }
          ]
        }

        Пример 3 (частичные данные — только вознаграждение):
        Фрагмент:
        "За хранение Поклажедатель уплачивает Хранителю вознаграждение
        в размере 5% от стоимости хранимого товара."
        Ответ:
        {
          "remuneration_status": "defined",
          "remuneration_value": "5% от стоимости хранимого товара",
          "remuneration_payment_terms": "Данные не определены",
          "reimbursement_status": "not_defined",
          "reimbursement_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "За хранение Поклажедатель уплачивает Хранителю вознаграждение в размере 5% от стоимости хранимого товара."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "remuneration_status": "not_defined",
          "remuneration_value": "Данные не определены",
          "remuneration_payment_terms": "Данные не определены",
          "reimbursement_status": "not_defined",
          "reimbursement_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли вознаграждение хранителя?
        2. Указан ли размер вознаграждения?
        3. Определён ли порядок и сроки оплаты?
        4. Указано ли возмещение расходов на хранение?
        5. Приведена ли формулировка о возмещении расходов?
        6. Выведены ли условия из текста договора, а не из норм ст. 896–898 ГК РФ?
        7. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remuneration_status": "<defined / not_defined>",
          "remuneration_value": "<текст или 'Данные не определены'>",
          "remuneration_payment_terms": "<текст или 'Данные не определены'>",
          "reimbursement_status": "<defined / not_defined>",
          "reimbursement_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вознаграждение хранителя плата за хранение стоимость хранения тариф ставка хранения оплата хранения возмездное безвозмездное возмещение расходов расходы хранителя чрезвычайные расходы ст. 896 ст. 897 ст. 898"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "штраф"
        - "пеня"
        - "неустойка"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "remuneration_and_expenses_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о вознаграждении хранителя и возмещении расходов на хранение.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. remuneration_and_expenses_presence:
           Агрегатное signal-поле — наличие условий о вознаграждении
           и возмещении расходов.
           - "present" — если хотя бы одно из содержательных полей
             (remuneration_status, reimbursement_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - remuneration_status = "not_defined";
           - reimbursement_status = "not_defined";
           - remuneration_value = "Данные не определены";
           - remuneration_payment_terms = "Данные не определены";
           - reimbursement_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. remuneration_status:
           - "defined" — если в тексте прямо указано вознаграждение хранителя
             (сумма, тариф, ставка), либо прямо указано, что хранение
             безвозмездное, либо прямо указано, что вознаграждение не взимается;
           - "not_defined" — если прямого указания нет.

        2. remuneration_value:
           Краткая user-facing формулировка вознаграждения на русском языке.
           - если указана сумма / тариф / ставка — с единицей измерения
             («10 000 руб. / месяц», «5% от стоимости»);
           - если хранение безвозмездное — "Безвозмездное хранение";
           - если вознаграждение не взимается — "Вознаграждение не взимается".
           Fallback: "Данные не определены" / "Не удалось определить".

        3. remuneration_payment_terms:
           Краткая user-facing формулировка порядка и сроков оплаты
           («ежемесячно до 5-го числа», «в течение 10 дней после выставления счёта»).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. reimbursement_status:
           - "defined" — если в тексте прямо указано возмещение расходов
             на хранение (любая формулировка), либо прямо указано, что расходы
             не возмещаются;
           - "not_defined" — если прямого указания нет.

        5. reimbursement_details:
           Краткая user-facing формулировка состава / порядка / пределов
           возмещения расходов.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_and_expenses_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай штрафы, пени, неустойки, страхование и иные
          нерелевантные темы.
        - Не выводи условия из ст. 896–898 ГК РФ — только из текста.
        - remuneration_status = "defined" — при указании суммы / тарифа / ставки,
          безвозмездности или отказа от вознаграждения.
        - remuneration_value — всегда с единицей измерения (или "Безвозмездное
          хранение" / "Вознаграждение не взимается").
        - reimbursement_status = "defined" — при прямом указании возмещения
          расходов или прямом указании об отказе от возмещения.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вознаграждения, ни безвозмездности,
           ни возмещения расходов.
           → presence = "missing";
             remuneration_status = reimbursement_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Вознаграждение указано, но детали не раскрыты.
           Например: "Хранение является возмездным",
           без указания размера и порядка оплаты.
           → presence = "present";
             remuneration_status = "defined";
             remuneration_value = "Данные не определены";
             remuneration_payment_terms = "Данные не определены";
             reimbursement_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы вознаграждения
           либо разные режимы (возмездное / безвозмездное).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание безвозмездности или отказа от вознаграждения / расходов.
           В договоре прямо указано, что хранение безвозмездное, либо что
           вознаграждение не взимается, либо что расходы не возмещаются.
           → presence = "present";
             remuneration_status = "defined" (прямое регулирование);
             remuneration_value = "Безвозмездное хранение" /
               "Вознаграждение не взимается";
             reimbursement_status = "defined" при прямом указании
               об отказе от возмещения расходов.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_and_expenses_presence используй только: "present", "missing", "unclear".
        - Для remuneration_status и reimbursement_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * remuneration_value, remuneration_payment_terms,
            reimbursement_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_and_expenses_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о вознаграждении хранителя и возмещении расходов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о вознаграждении хранителя. Внутреннее enum-поле."
          label: "Вознаграждение хранителя"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "remuneration_value"
          type: "string"
          presentation: "fact"
          label: "Размер вознаграждения"
          description: >
            Сумма / тариф / ставка вознаграждения хранителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "remuneration_payment_terms"
          type: "string"
          presentation: "fact"
          label: "Порядок оплаты"
          description: >
            Порядок и сроки оплаты вознаграждения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "reimbursement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о возмещении расходов на хранение. Внутреннее enum-поле."
          label: "Возмещение расходов"
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "reimbursement_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возмещения расходов"
          description: >
            Состав, порядок и пределы возмещения расходов на хранение. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: storage_term
    name: "Срок хранения или 'до востребования' (ст. 889 ГК РФ)"
    description: >
      Фактографическая проверка условия о сроке хранения: тип срока
      (фиксированный / до востребования / максимальный), конкретное значение
      и упоминание обязанности хранителя вернуть вещь по первому требованию.
      Правовой ориентир — ст. 889 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок хранения"
        - "период хранения"
        - "до востребования"
        - "дата окончания"
        - "день окончания"
        - "момент востребования"
        - "срок истекает"
        - "ст. 889"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+хранени"
        - "(?i)до\\s+востребовани"
        - "(?i)(по)\\s+истечени(и|ю)\\s+срока\\s+хранени"
        - "(?i)срок\\s+хранени.*(составля|равен|лет|год|месяц|дн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 889 ГК РФ).
        Проверяется один вопрос: срок хранения — его тип, значение
        и обязанность возврата по востребованию.
        Нормативный ориентир:
        - ст. 889 ГК РФ — хранитель обязан хранить вещь в течение
          обусловленного договором срока; если срок не предусмотрен
          и не может быть определён моментом востребования, хранитель
          обязан хранить вещь до востребования.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 889 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок хранения.
        2. Тип срока: фиксированный / до востребования / максимальный.
        3. Значение срока (конкретная дата, период, событие).
        4. Упоминание обязанности хранителя вернуть вещь по востребованию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (storage_term_status / storage_term_type /
            storage_return_on_demand_mentioned) → "not_defined";
          - текстовое поле (storage_term_value) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. storage_term_type = "fixed_period" — если указан конкретный срок
          (дата окончания, количество дней / месяцев / лет).
          "until_demand" — если прямо указано «до востребования».
          "max_term" — если указан предельный / максимальный срок
          («не более N лет»). Если указаны и фиксированный, и «до востребования» —
          "fixed_period" (приоритет фиксированному).
        5. storage_term_value — фиксируй значение с единицей измерения
          или конкретной датой («до 31.12.2026», «12 месяцев», «не более 5 лет»,
          «до востребования»). Не голое число.
        6. storage_return_on_demand_mentioned = "yes" — если прямо упомянута
          обязанность хранителя вернуть вещь по требованию поклажедателя.
        7. В evidence — только цитаты из документа, каждая с clause_ref.
        8. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (фиксированный срок + востребование):
        Фрагмент:
        "Срок хранения — с 01.01.2026 по 31.12.2026. Поклажедатель вправе
        потребовать возврата вещи в любой момент до истечения срока."
        Ответ:
        {
          "storage_term_status": "defined",
          "storage_term_type": "fixed_period",
          "storage_term_value": "с 01.01.2026 по 31.12.2026",
          "storage_return_on_demand_mentioned": "yes",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Срок хранения — с 01.01.2026 по 31.12.2026."
            }
          ]
        }

        Пример 2 (до востребования):
        Фрагмент:
        "Хранитель хранит вещь до востребования."
        Ответ:
        {
          "storage_term_status": "defined",
          "storage_term_type": "until_demand",
          "storage_term_value": "до востребования",
          "storage_return_on_demand_mentioned": "yes",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель хранит вещь до востребования."
            }
          ]
        }

        Пример 3 (максимальный срок):
        Фрагмент:
        "Срок хранения не может превышать 5 лет с даты передачи вещи."
        Ответ:
        {
          "storage_term_status": "defined",
          "storage_term_type": "max_term",
          "storage_term_value": "не более 5 лет с даты передачи вещи",
          "storage_return_on_demand_mentioned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Срок хранения не может превышать 5 лет с даты передачи вещи."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "storage_term_status": "not_defined",
          "storage_term_type": "not_defined",
          "storage_term_value": "Данные не определены",
          "storage_return_on_demand_mentioned": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли срок хранения?
        2. Определён ли тип срока (фиксированный / до востребования / максимальный)?
        3. Указано ли значение срока?
        4. Упомянута ли обязанность возврата по востребованию?
        5. Выведены ли условия из текста договора, а не из нормы ст. 889 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "storage_term_status": "<defined / not_defined>",
          "storage_term_type": "<fixed_period / until_demand / max_term / not_defined>",
          "storage_term_value": "<текст или 'Данные не определены'>",
          "storage_return_on_demand_mentioned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "completion_deadline_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок хранения период хранения до востребования момент востребования дата окончания день окончания максимальный срок предельный срок не более ст. 889"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "storage_term_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о сроке хранения — тип, значение и упоминание возврата по востребованию.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. storage_term_presence:
           Агрегатное signal-поле — наличие условия о сроке хранения.
           - "present" — если хотя бы одно из содержательных полей
             (storage_term_status, storage_term_type,
              storage_return_on_demand_mentioned) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - storage_term_status = "not_defined";
           - storage_term_type = "not_defined";
           - storage_return_on_demand_mentioned = "not_defined";
           - storage_term_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. storage_term_status:
           - "defined" — если в тексте прямо указан срок хранения (дата, период,
             «до востребования», предельный срок) либо прямо указано, что срок
             не установлен / определяется моментом востребования;
           - "not_defined" — если прямого указания нет.

        2. storage_term_type:
           - "fixed_period" — прямо указан конкретный срок (дата окончания,
             количество дней / месяцев / лет), либо одновременно указаны
             фиксированный срок и «до востребования» (приоритет фиксированному);
           - "until_demand" — прямо указано «до востребования»;
           - "max_term" — прямо указан предельный / максимальный срок
             («не более N лет»);
           - "not_defined" — тип прямо не указан.

        3. storage_term_value:
           Краткая user-facing формулировка значения срока на русском языке
           с единицей измерения или конкретной датой
           («до 31.12.2026», «12 месяцев», «не более 5 лет», «до востребования»).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. storage_return_on_demand_mentioned:
           - "yes" — прямо упомянута обязанность хранителя вернуть вещь
             по требованию поклажедателя;
           - "no" — прямо указано, что возврат по востребованию не предусмотрен;
           - "not_defined" — прямо не указано.

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни storage_term_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type = "not_defined", storage_return_on_demand_mentioned = "not_defined", storage_term_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность, страхование, штрафы
          и иные нерелевантные темы.
        - Не выводи условия из ст. 889 ГК РФ — только из текста.
        - storage_term_type = "fixed_period" — при наличии конкретного срока,
          в том числе когда указаны и фиксированный срок, и «до востребования»
          (приоритет фиксированному).
        - storage_term_value — всегда с единицей измерения или конкретной датой.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока хранения, ни указания «до востребования»,
           ни упоминания возврата по востребованию.
           → presence = "missing";
             все *_status / *_type = "not_defined";
             storage_return_on_demand_mentioned = "not_defined";
             storage_term_value = "Данные не определены".

        2. Срок упомянут, но не раскрыт.
           Например: "Срок хранения определяется договором",
           без конкретного значения.
           → presence = "present";
             storage_term_status = "defined";
             storage_term_type = "not_defined";
             storage_term_value = "Данные не определены";
             storage_return_on_demand_mentioned = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки хранения
           либо разные типы срока.
           → presence = "unclear";
             storage_term_status = "not_defined";
             storage_term_type = "not_defined";
             storage_term_value = "Не удалось определить".

        4. Прямое указание «до востребования».
           В договоре прямо указано, что хранитель хранит вещь
           до востребования поклажедателем.
           → presence = "present";
             storage_term_status = "defined";
             storage_term_type = "until_demand";
             storage_term_value = "до востребования";
             storage_return_on_demand_mentioned = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для storage_term_presence используй только: "present", "missing", "unclear".
        - Для storage_term_status используй только: "defined", "not_defined".
        - Для storage_term_type используй только: "fixed_period", "until_demand", "max_term", "not_defined".
        - Для storage_return_on_demand_mentioned используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * storage_term_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * storage_term_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "storage_term_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о сроке хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "storage_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о сроке хранения. Внутреннее enum-поле."
          label: "Срок хранения"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "storage_term_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["fixed_period", "until_demand", "max_term", "not_defined"]
          description: "Тип срока хранения. Внутреннее enum-поле."
          label: "Тип срока"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "storage_term_value"
          type: "string"
          presentation: "fact"
          label: "Значение срока"
          description: >
            Конкретное значение срока хранения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "storage_return_on_demand_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание обязанности возврата по востребованию. Внутреннее enum-поле."
          label: "Возврат по востребованию"
          required: true
          display_in_grid: true
