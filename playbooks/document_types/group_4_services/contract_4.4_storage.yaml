        1. warehouse_public_status:
           - "yes" — прямо указано, что склад является складом общего
             пользования / договор является публичным;
           - "no" — прямо указано, что склад не является складом общего
             пользования;
           - "not_defined" — статус прямо не указан.

        2. public_contract_consequences_status:
           - "defined" — прямо закреплены последствия публичности
             (обязанность заключать договор с любым обратившимся,
             запрет отказа);
           - "not_defined" — прямо не указано.

        3. uniform_pricing_status:
           - "yes" — прямо указана единая цена / тариф для всех
             товаровладельцев;
           - "no" — прямо указано, что цена индивидуальна;
           - "not_defined" — прямо не указано.

        4. legal_basis_reference:
           Краткая user-facing формулировка ссылки на ст. 907 / 426 ГК РФ
           или иные нормы о публичности.
           Fallback: "Данные не определены" / "Не удалось определить".

        5. public_warehouse_details:
           Краткая user-facing формулировка статуса и последствий
           публичности из текста.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни public_warehouse_status_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", warehouse_public_status = "not_defined", uniform_pricing_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, естественную убыль
          и иные нерелевантные темы.
        - Не выводи публичность из ст. 907 ГК РФ — только из текста.
        - warehouse_public_status = "yes" / "no" — по прямому указанию.
        - public_contract_consequences_status = "defined" — при прямом
          указании последствий публичности.
        - uniform_pricing_status = "yes" / "no" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни статуса публичности, ни последствий, ни единой
           цены.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Публичность упомянута без последствий.
           Например: "Склад является складом общего пользования",
           без указания обязанности заключать договор и единой цены.
           → presence = "present";
             warehouse_public_status = "yes";
             public_contract_consequences_status = "not_defined";
             uniform_pricing_status = "not_defined";
             public_warehouse_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные статусы (публичный
           в одном пункте, непубличный — в другом).
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             текстовые поля = "Не удалось определить".

        4. Публичность с последствиями.
           В договоре прямо закреплены обязанность заключать договор
           с любым обратившимся и единая ценовая политика.
           → presence = "present";
             warehouse_public_status = "yes";
             public_contract_consequences_status = "defined";
             uniform_pricing_status = "yes";
             public_warehouse_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для public_warehouse_status_presence используй только: "present", "missing", "unclear".
        - Для warehouse_public_status и uniform_pricing_status используй только: "yes", "no", "not_defined".
        - Для public_contract_consequences_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * legal_basis_reference, public_warehouse_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * legal_basis_reference, public_warehouse_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "public_warehouse_status_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие признаков публичности договора складского хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "warehouse_public_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Является ли склад складом общего пользования. Внутреннее enum-поле."
          label: "Публичный склад"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "public_contract_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Закреплены ли последствия публичности. Внутреннее enum-поле."
          required: true

        - name: "uniform_pricing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Единая ценовая политика для всех товаровладельцев. Внутреннее enum-поле."
          label: "Единая цена"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "legal_basis_reference"
          type: "string"
          presentation: "fact"
          label: "Ссылка на нормы"
          description: >
            Ссылка на ст. 907 / 426 ГК РФ или иные нормы о публичности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "public_warehouse_details"
          type: "string"
          presentation: "fact"
          label: "Публичность: детали"
          description: >
            Формулировка статуса и последствий публичности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты хранителя и поклажедателя
      (наименование, ИНН, ОГРН, адрес), полномочия подписантов,
      а также статус профессионального хранителя.
    addressee: "Обе стороны"
  storage_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание вещи; (б) количество/вес/объём;
      (в) заявленную стоимость; (г) тип вещи (индивидуальная/родовая);
      (д) тип хранения (обычное/иррегулярное); (е) идентификационные признаки.
    addressee: "Обе стороны"
  acceptance_documentation_check:
    text: >
      Просим уточнить в {doc_names}: (а) вид документа о приёме (акт МХ-1, расписка,
      складское свидетельство); (б) порядок и сроки выдачи; (в) ссылку на Постановление Росстата № 66.
    addressee: "Хранитель"
  professional_custodian_liability:
    text: >
      В {doc_names} хранитель осуществляет профессиональную деятельность.
      ОБЯЗАТЕЛЬНО: ответственность независимо от вины (ст. 901 ГК РФ),
      за исключением непреодолимой силы. Просим подтвердить/включить это условие.
    addressee: "Юридический советник"
  return_on_first_demand_check:
    text: >
      Просим подтвердить в {doc_names}: право поклажедателя забрать вещь
      в любой момент (ст. 904 ГК РФ), отсутствие штрафов за досрочный возврат.
    addressee: "Юридический советник"
  irregular_storage_terms:
    text: >
      В {doc_names} предусмотрено иррегулярное хранение. Просим уточнить:
      (а) условия смешения вещей; (б) требования к качеству (сорт, класс);
      (в) порядок возврата того же рода и качества; (г) долю в общей массе.
    addressee: "Обе стороны"
  uncollected_goods_disposal:
    text: >
      Просим включить в {doc_names}: процедуру реализации невостребованной вещи
      (ст. 899 ГК РФ): уведомление, срок, порядок продажи, распределение выручки.
    addressee: "Хранитель"
  dangerous_properties_disclosure:
    text: >
      В {doc_names} хранится потенциально опасная вещь. Просим включить:
      (а) обязанность поклажедателя раскрыть опасные свойства (ст. 893 ГК РФ);
      (б) право хранителя уничтожить опасную вещь за счёт поклажедателя (ст. 894 ГК РФ);
      (в) подтверждение наличия лицензии на хранение опасных веществ.
    addressee: "Юридический советник"
  warehouse_certificate_issuance:
    text: >
      Просим уточнить в {doc_names}: (а) вид складского свидетельства (простое / двойное);
      (б) порядок выдачи; (в) возможность передачи и залога по варранту.
    addressee: "Хранитель"
  lien_right_on_item:
    text: >
      Просим уточнить в {doc_names}: право хранителя удерживать вещь до оплаты
      вознаграждения и возмещения расходов (ст. 359, 920 ГК РФ).
    addressee: "Юридический советник"
  natural_loss_norms:
    text: >
      Просим включить в {doc_names}: ссылку на утверждённые нормы естественной убыли,
      освобождение от ответственности в пределах норм (ст. 903 ГК РФ).
    addressee: "Юридический советник"
  remuneration_and_expenses:
    text: >
      Просим подтвердить по {doc_names}: (а) размер вознаграждения;
      (б) является ли хранение безвозмездным; (в) порядок возмещения расходов.
    addressee: "Обе стороны"
  storage_term:
    text: >
      Просим уточнить в {doc_names}: срок хранения или условие «до востребования».
    addressee: "Обе стороны"
  storage_conditions:
    text: >
      Просим уточнить в {doc_names}: требования к условиям хранения
      (температура, влажность, освещённость, вентиляция).
    addressee: "Хранитель"
  return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок выдачи вещи, проверка правомочий
      получателя, форма акта выдачи (МХ-3).
    addressee: "Обе стороны"
  inspection_upon_return:
    text: >
      Просим включить в {doc_names}: обязательную проверку вещи при возврате,
      порядок фиксации недостачи/повреждений, срок предъявления претензий.
    addressee: "Поклажедатель"
  extraordinary_expenses:
    text: >
      Просим включить в {doc_names}: условия возмещения чрезвычайных расходов
      на сохранность (ст. 898 ГК РФ), лимит расходов без согласования.
    addressee: "Юридический советник"
  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      от ответственности (непреодолимая сила, свойства вещи, вина поклажедателя).
    addressee: "Юридический советник"
  third_party_claims:
    text: >
      Просим включить в {doc_names}: процедуру при предъявлении требований третьими
      лицами (арест, залог): уведомление поклажедателя, приостановление выдачи.
    addressee: "Юридический советник"
  insurance:
    text: >
      Просим уточнить в {doc_names}: условия страхования вещи, кто страхует,
      минимальную страховую сумму.
    addressee: "Обе стороны"
  pretension_order:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок, сроки претензий.
    addressee: "Юридический советник"
  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок.
    addressee: "Юридический советник"
  confidentiality:
    text: >
      Просим включить в {doc_names}: условие о конфиденциальности сведений о вещи.
    addressee: "Юридический советник"
  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС, порядок документооборота.
    addressee: "Бухгалтерия"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
