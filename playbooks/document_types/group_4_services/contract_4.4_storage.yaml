type: contract_4.4_storage
name: "Договор хранения"

description: |
  Соглашение, по которому хранитель обязуется хранить вещь, переданную ему поклажедателем,
  и возвратить эту вещь в сохранности (ст. 886 ГК РФ). Ключевой признак: цель — обеспечение
  сохранности, а не пользование (как в аренде). Хранитель не вправе пользоваться вещью
  без согласия поклажедателя. Может быть возмездным (товарный склад) или безвозмездным
  (гардероб). Профессиональное хранение (осуществляемое как предпринимательская деятельность)
  предполагает повышенную ответственность хранителя — независимо от вины, кроме непреодолимой
  силы (ст. 901 ГК РФ). Особые виды: хранение в ломбарде, камерах хранения, банковских
  ячейках, гостиницах, секвестр.

version: 4.0
parent: class_4_service_provision

metadata:
  category: contract
  subcategory: custodial_services
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 47 ГК РФ (ст. 886-926)"
  doc_types_supported:
    - "договор хранения"
    - "договор складского хранения"
    - "договор ответственного хранения"
    - "договор хранения товаров"
    - "договор ответхранения"
    - "договор хранения с выдачей складского свидетельства"
    - "договор хранения в ломбарде"
    - "договор аренды банковской ячейки"
    - "договор секвестра"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

