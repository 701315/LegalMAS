    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "custodian_damages_recovery_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о возмещении убытков, причинённых хранителю свойствами вещи.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. custodian_damages_recovery_presence:
           Агрегатное signal-поле — наличие условий о возмещении убытков
           хранителю.
           - "present" — если хотя бы одно из содержательных полей
             (damages_recovery_status, damage_bearer) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - damages_recovery_status = "not_defined";
           - damage_bearer = "not_defined";
           - liability_exclusions = "Данные не определены";
           - damages_recovery_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. damages_recovery_status:
           - "defined" — если в тексте прямо предусмотрено возмещение
             убытков хранителю от свойств вещи, либо прямо указано,
             что такие убытки не возмещаются (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. damage_bearer:
           - "depositor" — прямо указано, что убытки возмещает поклажедатель;
           - "custodian" — прямо указано, что убытки несёт хранитель;
           - "both" — прямо указано распределение убытков между сторонами;
           - "not_defined" — прямо не указано.

        3. liability_exclusions:
           Краткая user-facing формулировка оснований освобождения
           поклажедателя от возмещения (например, «если хранитель знал
           о свойствах», «если убытки причинены вследствие непреодолимой
           силы»).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. damages_recovery_details:
           Краткая user-facing формулировка порядка возмещения
           (по документам, по оценке независимого эксперта, в срок N дней).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни custodian_damages_recovery_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", damage_bearer = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи условия из ст. 903 ГК РФ — только из текста.
        - damages_recovery_status = "defined" — при прямом указании возмещения
          убытков хранителю, либо при прямом указании, что такие убытки
          не возмещаются.
        - damage_bearer = "depositor" / "custodian" / "both" — по прямому
          указанию в тексте.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни возмещения убытков хранителю, ни указания
           на субъект, ни порядка.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Возмещение упомянуто без деталей.
           Например: "Хранитель вправе требовать возмещения убытков,
           причинённых хранимой вещью", без указания субъекта и порядка.
           → presence = "present";
             damages_recovery_status = "defined";
             damage_bearer = "not_defined";
             liability_exclusions = "Данные не определены";
             damages_recovery_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные субъекты возмещения
           или разные порядки.
           → presence = "unclear";
             damages_recovery_status = "not_defined";
             damage_bearer = "not_defined";
             все текстовые поля = "Не удалось определить".

        4. Прямое указание об отказе от возмещения.
           В договоре прямо указано, что убытки, причинённые хранителю
           свойствами вещи, хранителю не возмещаются.
           → presence = "present";
             damages_recovery_status = "defined" (прямое регулирование);
             damage_bearer = "custodian";
             damages_recovery_details содержит дословную цитату
             об отказе от возмещения.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для custodian_damages_recovery_presence используй только: "present", "missing", "unclear".
        - Для damages_recovery_status используй только: "defined", "not_defined".
        - Для damage_bearer используй только: "depositor", "custodian", "both", "not_defined".
        - Fallback при отсутствии данных:
          * liability_exclusions, damages_recovery_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * liability_exclusions, damages_recovery_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "custodian_damages_recovery_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
