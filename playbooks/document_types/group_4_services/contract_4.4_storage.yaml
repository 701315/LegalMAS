        7. pledge_allowed = "yes" — если прямо указано право залога товара
          по варранту / залоговому свидетельству. Для простого свидетельства
          или квитанции залог обычно не упоминается — оставляй "not_defined",
          если прямо не сказано.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
