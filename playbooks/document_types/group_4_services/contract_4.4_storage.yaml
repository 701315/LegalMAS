    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "НДС не облагается"
        - "освобождено от НДС"
        - "налог на добавленную стоимость"
        - "ставка НДС"
        - "счёт-фактура"
        - "ст. 149 НК РФ"
        - "ст. 164 НК РФ"
