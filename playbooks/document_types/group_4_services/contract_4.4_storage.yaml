  - id: return_on_first_demand_check
    name: "Право на возврат вещи по первому требованию (ст. 904 ГК РФ)"
    description: >
      Фактографическая проверка наличия условия о праве поклажедателя забрать вещь
      в любой момент, даже если договор срочный, и наличия штрафов за досрочный
      возврат. Условия о штрафе за досрочный возврат противоречат императивной
      норме ст. 904 ГК РФ и ничтожны (ст. 168, 422 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "по первому требованию"
        - "возвратить вещь немедленно"
        - "досрочное прекращение"
        - "право истребовать в любой момент"
        - "без уплаты штрафа"
        - "ст. 904"
        - "штраф за досрочный возврат"
        - "неустойка за расторжение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поклажедатель.*вправе.*истребовать.*вещь.*в.*любое.*время"
        - "(?i)ст\\.?\\s*904"
        - "(?i)штраф.*досрочн.*возврат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 904 ГК РФ).
        Проверяется только один вопрос: право поклажедателя забрать вещь
        по первому требованию и наличие штрафов за досрочный возврат.
        Нормативные ориентиры:
        - ст. 904 ГК РФ — императивное право поклажедателя на досрочный
          возврат вещи по первому требованию, независимо от срока договора;
        - ст. 168, 422 ГК РФ — ничтожность условия, противоречащего
          императивной норме.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право из нормы ст. 904 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли право поклажедателя забрать вещь в любой момент.
        2. Установлен ли срок уведомления о досрочном возврате.
        3. Есть ли штраф за досрочный возврат.
        4. Указание на ничтожность / невзимание штрафа (если есть).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status) → "not_defined";
          - текстовые поля (first_demand_right_details / notice_period_value /
            early_return_penalty_value) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если право на возврат прямо указано, но срок уведомления — нет,
          notice_period_status = "not_defined", notice_period_value =
          "Данные не определены".
        5. Если штраф прямо запрещён («не взимается», «не применяется») —
          early_return_penalty_status = "defined", early_return_penalty_value
          содержит соответствующую формулировку.
        6. Если штраф указан без размера — early_return_penalty_status = "defined",
          early_return_penalty_value — текст без числа.
        7. Если возврат предусмотрен только по истечении срока или по отдельному
          согласованию — фиксируй это как факт в first_demand_right_details;
          правовая оценка (ничтожность) — не задача этого check-а.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Поклажедатель вправе истребовать вещь в любое время по первому требованию.
        Хранитель обязан возвратить вещь немедленно. Штраф за досрочный возврат
        не взимается."
        Ответ:
        {
          "first_demand_right_status": "defined",
          "first_demand_right_details": "вправе истребовать вещь в любое время по первому требованию",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "early_return_penalty_status": "defined",
          "early_return_penalty_value": "не взимается",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Поклажедатель вправе истребовать вещь в любое время по первому требованию."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь до истечения срока договора."
        Ответ:
        {
          "first_demand_right_status": "not_defined",
          "first_demand_right_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "early_return_penalty_status": "not_defined",
          "early_return_penalty_value": "Данные не определены",
          "evidence": []
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "Поклажедатель вправе потребовать возврата вещи, письменно уведомив
        Хранителя не менее чем за 10 рабочих дней."
        Ответ:
        {
          "first_demand_right_status": "defined",
          "first_demand_right_details": "вправе потребовать возврата вещи с письменным уведомлением",
          "notice_period_status": "defined",
          "notice_period_value": "не менее чем за 10 рабочих дней",
          "early_return_penalty_status": "not_defined",
          "early_return_penalty_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Поклажедатель вправе потребовать возврата вещи, письменно уведомив Хранителя не менее чем за 10 рабочих дней."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на право забрать вещь по первому требованию?
        2. Установлен ли срок уведомления?
        3. Есть ли штраф за досрочный возврат?
        4. Указано ли, что штраф не взимается (если применимо)?
        5. Выведено ли право из текста договора, а не из нормы ст. 904 ГК РФ?
        6. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "first_demand_right_status": "<defined / not_defined>",
          "first_demand_right_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_value": "<текст или 'Данные не определены'>",
          "early_return_penalty_status": "<defined / not_defined>",
          "early_return_penalty_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "по первому требованию досрочный возврат право истребовать вещь в любой момент до истечения срока уведомление предупреждение за дней штраф за досрочный возврат неустойка за расторжение не взимается ст. 904 возврат вещи немедленно"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность за утрату"
        - "страхование"
        - "штраф за просрочку"
        - "пеня за просрочку оплаты"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "remedies"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "return_on_first_demand_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о праве поклажедателя забрать вещь по первому требованию и штрафах.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. return_on_first_demand_check_presence:
           Агрегатное signal-поле — наличие условия о праве возврата по первому требованию.
           - "present" — если хотя бы одно из содержательных полей
             (first_demand_right_status, notice_period_status,
              early_return_penalty_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - first_demand_right_status = "not_defined";
           - notice_period_status = "not_defined";
           - early_return_penalty_status = "not_defined";
           - first_demand_right_details = "Данные не определены";
           - notice_period_value = "Данные не определены";
           - early_return_penalty_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. first_demand_right_status:
           - "defined" — если в тексте прямо указано право поклажедателя забрать
             вещь по первому требованию / в любой момент, либо прямо указано,
             что возврат возможен только по истечении срока / по отдельному
             согласованию (это тоже регулирование, фиксируем как факт);
           - "not_defined" — если прямое указание отсутствует.

        2. first_demand_right_details:
           Краткая user-facing формулировка о праве на возврат.
           Если в договоре прямо указано ограничение («только по истечении срока»,
           «по отдельному согласованию») — фиксируй эту формулировку.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. notice_period_status:
           - "defined" — если прямо указан срок уведомления о досрочном возврате;
           - "not_defined" — если срок прямо не указан.

        4. notice_period_value:
           Краткая user-facing формулировка срока уведомления.
           Fallback: "Данные не определены" / "Не удалось определить".

        5. early_return_penalty_status:
           - "defined" — если прямо указан штраф / неустойка за досрочный возврат,
             включая случаи, когда штраф прямо запрещён («не взимается»);
           - "not_defined" — если про штраф прямо ничего не сказано.

        6. early_return_penalty_value:
           Краткая user-facing формулировка о штрафе за досрочный возврат
           (с размером или без; либо формулировка «не взимается» / «не применяется»).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни return_on_first_demand_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details / *_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность за утрату, страхование, штрафы
          за просрочку оплаты и иные нерелевантные темы.
        - Не выводи право на возврат по первому требованию из ст. 904 ГК РФ —
          только из текста.
        - Если право указано, а срок уведомления — нет: notice_period_status = "not_defined".
        - Если штраф прямо запрещён («не взимается») — early_return_penalty_status = "defined",
          early_return_penalty_value содержит соответствующую формулировку.
        - Если возврат только по истечении срока / по согласованию — фиксируй это
          как факт в first_demand_right_details, first_demand_right_status = "defined".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на возврат, ни срока уведомления,
           ни штрафа за досрочный возврат.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details / *_value = "Данные не определены".

        2. Право указано, но детали не раскрыты.
           Например: "Поклажедатель вправе истребовать вещь в любое время",
           без указания срока уведомления и без упоминания штрафа.
           → presence = "present";
             first_demand_right_status = "defined";
             notice_period_status = "not_defined";
             early_return_penalty_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления
           или разные условия досрочного возврата.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Прямое указание ограничения права.
           В договоре прямо сказано, что возврат возможен только по истечении
           срока или только по отдельному согласованию сторон.
           → presence = "present";
             first_demand_right_status = "defined";
             first_demand_right_details содержит дословную цитату ограничения.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для return_on_first_demand_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * first_demand_right_details, notice_period_value,
            early_return_penalty_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details / *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "return_on_first_demand_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о праве возврата вещи по первому требованию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "first_demand_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания права на возврат по первому требованию. Внутреннее enum-поле."
          required: true

        - name: "first_demand_right_details"
          type: "string"
          presentation: "fact"
          label: "Право на возврат"
          description: >
            Формулировка о праве забрать вещь по первому требованию. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока уведомления. Внутреннее enum-поле."
          required: true

        - name: "notice_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: >
            Срок уведомления о досрочном возврате. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "early_return_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания штрафа за досрочный возврат. Внутреннее enum-поле."
          required: true

        - name: "early_return_penalty_value"
          type: "string"
          presentation: "fact"
          label: "Штраф за досрочный возврат"
          description: >
            Наличие и размер штрафа за досрочный возврат. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: irregular_storage_terms
    name: "Иррегулярное хранение: условия смешения вещей (ст. 890 ГК РФ)"
    description: >
      Фактографическая проверка условий иррегулярного хранения: разрешение
      смешения родовых вещей, требования к качеству, порядок возврата того же
      рода и качества (равное или обусловленное количество — п. 2 ст. 890 ГК РФ),
      доля в общей массе. Типично для элеваторов, нефтебаз, товарных складов.
    triggers:
      any: ["irregular_storage"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "иррегулярное хранение"
        - "обезличенное хранение"
        - "смешение вещей"
        - "родовые вещи"
        - "того же рода и качества"
        - "доля в общей массе"
        - "элеватор"
        - "резервуар"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)иррегулярн(ое|ого)\\s+хранени"
        - "(?i)смешива(ются|ние).*вещ"
        - "(?i)того\\s+же\\s+рода\\s+и\\s+качеств"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 890 ГК РФ).
        Проверяется только один вопрос: условия иррегулярного хранения.
        Нормативные ориентиры:
        - п. 1 ст. 890 ГК РФ — иррегулярное хранение: хранение вещей
          с обезличением (смешением) по соглашению сторон;
        - п. 2 ст. 890 ГК РФ — возврат: поклажедателю возвращается равное
          или обусловленное сторонами количество вещей того же рода и качества.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 890 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли иррегулярное хранение.
        2. Разрешено ли смешение вещей.
        3. Указан ли сорт/класс/качество вещи.
        4. Указан ли порядок возврата того же рода и качества
          (и количество возврата — равное / обусловленное).
        5. Определена ли доля в общей массе.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / yes-no) → "not_defined";
          - текстовые поля (quality_grade_value / return_same_grade_details /
            share_basis_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если commingling_allowed = "yes" — это признак иррегулярного хранения;
          фиксируй irregular_storage_status = "defined" даже при отсутствии
          прямой формулировки «иррегулярное».
        5. Если указан сорт / класс / марка без явного «того же рода и качества» —
          это всё равно quality_grade_status = "defined".
        6. Если порядок возврата прямо не указан, но разрешено смешение —
          return_same_grade_status = "not_defined" (не выводи из нормы).
        7. Если доля определена формулой («пропорционально количеству сданного»)
          или конкретным числом («1/3») — share_basis_status = "defined",
          share_basis_details содержит соответствующую формулировку.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранение иррегулярное: зерно Поклажедателя смешивается с зерном
        других поклажедателей того же сорта и качества. Возврат осуществляется
        зерном того же рода и качества в количестве, равном сданному.
        Доля Поклажедателя в общей массе определяется пропорционально
        количеству сданного зерна."
        Ответ:
        {
          "irregular_storage_status": "defined",
          "commingling_allowed": "yes",
          "quality_grade_status": "defined",
          "quality_grade_value": "того же сорта и качества",
          "return_same_grade_status": "defined",
          "return_same_grade_details": "возврат зерном того же рода и качества в количестве, равном сданному",
          "share_basis_status": "defined",
          "share_basis_details": "доля определяется пропорционально количеству сданного зерна",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Хранение иррегулярное: зерно Поклажедателя смешивается с зерном других поклажедателей того же сорта и качества."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "irregular_storage_status": "not_defined",
          "commingling_allowed": "not_defined",
          "quality_grade_status": "not_defined",
          "quality_grade_value": "Данные не определены",
          "return_same_grade_status": "not_defined",
          "return_same_grade_details": "Данные не определены",
          "share_basis_status": "not_defined",
          "share_basis_details": "Данные не определены",
          "evidence": []
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "Допускается смешение дизельного топлива Поклажедателя с топливом
        других поклажедателей класса не ниже ЕВРО-5."
        Ответ:
        {
          "irregular_storage_status": "defined",
          "commingling_allowed": "yes",
          "quality_grade_status": "defined",
          "quality_grade_value": "класс не ниже ЕВРО-5",
          "return_same_grade_status": "not_defined",
          "return_same_grade_details": "Данные не определены",
          "share_basis_status": "not_defined",
          "share_basis_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Допускается смешение дизельного топлива Поклажедателя с топливом других поклажедателей класса не ниже ЕВРО-5."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание иррегулярного хранения?
        2. Разрешено ли смешение вещей?
        3. Указан ли сорт/класс/качество?
        4. Определён ли порядок возврата того же рода и качества?
        5. Определена ли доля в общей массе?
        6. Выведены ли условия из текста договора, а не из нормы ст. 890 ГК РФ?
        7. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "irregular_storage_status": "<defined / not_defined>",
          "commingling_allowed": "<yes / no / not_defined>",
          "quality_grade_status": "<defined / not_defined>",
          "quality_grade_value": "<текст или 'Данные не определены'>",
          "return_same_grade_status": "<defined / not_defined>",
          "return_same_grade_details": "<текст или 'Данные не определены'>",
          "share_basis_status": "<defined / not_defined>",
          "share_basis_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "иррегулярное хранение обезличенное хранение смешение вещей родовые вещи того же рода и качества равное количество обусловленное количество возврат зерна топлива доля в общей массе пропорционально вклад элеватор резервуар товарный склад"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "неустойка"
        - "штраф"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "definitions"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "irregular_storage_terms_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об условиях иррегулярного хранения.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. irregular_storage_terms_presence:
           Агрегатное signal-поле — наличие условий иррегулярного хранения.
           - "present" — если хотя бы одно из содержательных полей
             (irregular_storage_status, commingling_allowed, quality_grade_status,
              return_same_grade_status, share_basis_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - irregular_storage_status = "not_defined";
           - commingling_allowed = "not_defined";
           - quality_grade_status = "not_defined";
           - return_same_grade_status = "not_defined";
           - share_basis_status = "not_defined";
           - quality_grade_value = "Данные не определены";
           - return_same_grade_details = "Данные не определены";
           - share_basis_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. irregular_storage_status:
           - "defined" — если в тексте прямо указано, что хранение иррегулярное
             (обезличенное, со смешением), либо прямо разрешено смешение вещей
             (commingling_allowed = "yes"), либо прямо указано обратное —
             что смешение не допускается;
           - "not_defined" — если прямого указания на тип хранения нет.

        2. commingling_allowed:
           - "yes" — прямо разрешено смешение вещей Поклажедателя
             с вещами других поклажедателей;
           - "no" — прямо указано, что смешение не допускается;
           - "not_defined" — про смешение прямо не сказано.

        3. quality_grade_status:
           - "defined" — если прямо указан сорт / класс / марка / качество вещи;
           - "not_defined" — если таких указаний нет.

        4. quality_grade_value:
           Краткая user-facing формулировка о сорте / классе / качестве.
           Fallback: "Данные не определены" / "Не удалось определить".

        5. return_same_grade_status:
           - "defined" — если прямо указан порядок возврата того же рода и качества
             (включая указание количества возврата — равное / обусловленное);
           - "not_defined" — если порядок возврата прямо не указан.
           Не выводи порядок из нормы ст. 890 ГК РФ.

        6. return_same_grade_details:
           Краткая user-facing формулировка порядка возврата.
           Fallback: "Данные не определены" / "Не удалось определить".

        7. share_basis_status:
           - "defined" — если прямо определён порядок доли в общей массе
             (формулой, конкретным числом, отсылкой на документ);
           - "not_defined" — если порядок определения доли прямо не указан.

        8. share_basis_details:
           Краткая user-facing формулировка порядка определения доли.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни irregular_storage_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", commingling_allowed = "not_defined", все *_details / *_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, неустойку, штрафы и иные
          нерелевантные темы.
        - Не выводи условия иррегулярного хранения из ст. 890 ГК РФ — только из текста.
        - commingling_allowed = "yes" → irregular_storage_status = "defined"
          даже без прямой формулировки «иррегулярное».
        - Сорт / класс / марка без явного «того же рода и качества» —
          quality_grade_status = "defined".
        - Порядок возврата прямо не указан, но смешение разрешено —
          return_same_grade_status = "not_defined" (не выводи из нормы).
        - Доля в виде формулы или конкретного числа (1/3) — share_basis_status = "defined".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания иррегулярного хранения, ни смешения,
           ни качества, ни порядка возврата, ни доли.
           → presence = "missing";
             все *_status = "not_defined";
             commingling_allowed = "not_defined";
             все *_details / *_value = "Данные не определены".

        2. Иррегулярное хранение указано, но детали не раскрыты.
           Например: "Хранение иррегулярное" без указания сорта, порядка
           возврата и доли.
           → presence = "present";
             irregular_storage_status = "defined";
             commingling_allowed = "not_defined";
             quality_grade_status = "not_defined";
             return_same_grade_status = "not_defined";
             share_basis_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сорта/классы или разные
           порядки возврата.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Прямое указание на обычное хранение без смешения.
           В договоре прямо сказано, что смешение вещей не допускается
           и вещь хранится индивидуально-определённой.
           → presence = "present";
             irregular_storage_status = "defined" (прямое регулирование);
             commingling_allowed = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для irregular_storage_terms_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для commingling_allowed используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * quality_grade_value, return_same_grade_details,
            share_basis_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details / *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "irregular_storage_terms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий иррегулярного хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "irregular_storage_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания иррегулярного хранения. Внутреннее enum-поле."
          required: true

        - name: "commingling_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Разрешено ли смешение вещей. Внутреннее enum-поле."
          label: "Смешение вещей"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "quality_grade_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания сорта / класса / качества. Внутреннее enum-поле."
          required: true

        - name: "quality_grade_value"
          type: "string"
          presentation: "fact"
          label: "Сорт / качество"
          description: >
            Сорт, класс или качество вещи при иррегулярном хранении. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "return_same_grade_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка возврата того же рода и качества. Внутреннее enum-поле."
          required: true

        - name: "return_same_grade_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата"
          description: >
            Порядок возврата вещи того же рода и качества. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "share_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения доли в общей массе. Внутреннее enum-поле."
          required: true

        - name: "share_basis_details"
          type: "string"
          presentation: "fact"
          label: "Доля в общей массе"
          description: >
            Порядок определения доли поклажедателя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: uncollected_goods_disposal
    name: "Реализация невостребованной вещи (ст. 899 ГК РФ)"
    description: >
      Фактографическая проверка процедуры реализации невостребованной вещи:
      письменное предупреждение поклажедателя, срок, порядок продажи
      (по цене, сложившейся в месте хранения — п. 5 ст. 899 ГК РФ),
      удержание расходов и возврат остатка выручки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "невостребованная вещь"
        - "реализация"
        - "продажа"
        - "уведомление"
        - "письменное предупреждение"
        - "по цене, сложившейся в месте хранения"
        - "остаток возвращается"
        - "ст. 899"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)невостребованн(ая|ой)\\s+вещ"
        - "(?i)продат(ь|ся).*невостребованн"
        - "(?i)ст\\.?\\s*899"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 899 ГК РФ).
        Проверяется только один вопрос: процедура реализации невостребованной вещи.
        Нормативные ориентиры:
        - п. 1 ст. 899 ГК РФ — при уклонении поклажедателя от получения вещи
          хранитель после письменного предупреждения вправе продать вещь;
        - п. 5 ст. 899 ГК РФ — продажа по цене, сложившейся в месте хранения;
        - суммы, вырученные от продажи, передаются поклажедателю за вычетом
          причитающихся хранителю сумм.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи процедуру из ст. 899 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли процедура реализации невостребованной вещи.
        2. Установлен ли срок уведомления поклажедателя.
        3. Определён ли порядок продажи (рыночная цена в месте хранения / аукцион / иной).
        4. Удерживаются ли расходы из выручки.
        5. Возвращается ли остаток выручки поклажедателю.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / yes-no / sale_basis) → "not_defined";
          - текстовое поле (notice_period_value) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если процедура прямо не описана, но есть отсылка к «порядку,
          установленному законом» — disposal_procedure_status = "defined",
          notice_period_status = "not_defined".
        5. sale_basis = "market_price" — если прямо сказано «по цене, сложившейся
          в месте хранения» или эквивалент. sale_basis = "auction" — если прямо
          назван аукцион / торги. Иначе "other" или "not_defined".
        6. expenses_deducted = "yes" — если прямо сказано, что расходы / суммы,
          причитающиеся хранителю, удерживаются из выручки.
        7. remainder_returned = "yes" — если прямо сказано, что остаток
          передаётся / возвращается поклажедателю.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Если вещь не востребована в течение 30 дней после письменного
        предупреждения, Хранитель вправе реализовать её по цене, сложившейся
        в месте хранения. Из выручки удерживаются расходы на хранение.
        Остаток возвращается Поклажедателю."
        Ответ:
        {
          "disposal_procedure_status": "defined",
          "notice_period_status": "defined",
          "notice_period_value": "30 дней после письменного предупреждения",
          "sale_basis": "market_price",
          "expenses_deducted": "yes",
          "remainder_returned": "yes",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Если вещь не востребована в течение 30 дней после письменного предупреждения, Хранитель вправе реализовать её по цене, сложившейся в месте хранения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь до востребования."
        Ответ:
        {
          "disposal_procedure_status": "not_defined",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "sale_basis": "not_defined",
          "expenses_deducted": "not_defined",
          "remainder_returned": "not_defined",
          "evidence": []
        }

        Пример 3 (частичные данные — процедура есть, деталей нет):
        Фрагмент:
        "По истечении срока хранения Хранитель вправе распорядиться вещью
        в порядке, установленном законодательством Российской Федерации."
        Ответ:
        {
          "disposal_procedure_status": "defined",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "sale_basis": "not_defined",
          "expenses_deducted": "not_defined",
          "remainder_returned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "По истечении срока хранения Хранитель вправе распорядиться вещью в порядке, установленном законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли процедура реализации невостребованной вещи?
        2. Установлен ли срок уведомления?
        3. Определён ли порядок продажи (рыночная цена / аукцион / иной)?
        4. Удерживаются ли расходы из выручки?
        5. Возвращается ли остаток?
        6. Выведена ли процедура из текста договора, а не из нормы ст. 899 ГК РФ?
        7. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disposal_procedure_status": "<defined / not_defined>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_value": "<текст или 'Данные не определены'>",
          "sale_basis": "<market_price / auction / other / not_defined>",
          "expenses_deducted": "<yes / no / not_defined>",
          "remainder_returned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "невостребованная вещь реализация продажа уведомление письменное предупреждение по цене сложившейся в месте хранения аукцион торги остаток выручки возврат расходы удержание ст. 899"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "ответственность за утрату"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "uncollected_goods_disposal_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о процедуре реализации невостребованной вещи.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. uncollected_goods_disposal_presence:
           Агрегатное signal-поле — наличие процедуры реализации невостребованной вещи.
           - "present" — если хотя бы одно из содержательных полей
             (disposal_procedure_status, notice_period_status, sale_basis,
              expenses_deducted, remainder_returned) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disposal_procedure_status = "not_defined";
           - notice_period_status = "not_defined";
           - sale_basis = "not_defined";
           - expenses_deducted = "not_defined";
           - remainder_returned = "not_defined";
           - notice_period_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. disposal_procedure_status:
           - "defined" — если в тексте прямо описана процедура реализации
             невостребованной вещи, либо есть отсылка к порядку,
             установленному законом, либо прямо указано обратное — что
             реализация не допускается;
           - "not_defined" — если прямого указания нет.

        2. notice_period_status:
           - "defined" — если прямо указан срок уведомления поклажедателя;
           - "not_defined" — если срок прямо не указан.

        3. notice_period_value:
           Краткая user-facing формулировка срока уведомления.
           Fallback: "Данные не определены" / "Не удалось определить".

        4. sale_basis:
           - "market_price" — прямо указано «по цене, сложившейся в месте хранения»
             или эквивалент;
           - "auction" — прямо назван аукцион / торги;
           - "other" — прямо указан иной порядок;
           - "not_defined" — порядок прямо не указан.

        5. expenses_deducted:
           - "yes" — прямо указано, что расходы / суммы, причитающиеся хранителю,
             удерживаются из выручки;
           - "no" — прямо указано, что не удерживаются;
           - "not_defined" — прямо не указано.

        6. remainder_returned:
           - "yes" — прямо указано, что остаток возвращается / передаётся поклажедателю;
           - "no" — прямо указано обратное;
           - "not_defined" — прямо не указано.

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни uncollected_goods_disposal_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_basis / *_deducted / *_returned = "not_defined", notice_period_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность за утрату, страхование
          и иные нерелевантные темы.
        - Не выводи процедуру из ст. 899 ГК РФ — только из текста.
        - Если процедура прямо не описана, но есть отсылка к порядку,
          установленному законом — disposal_procedure_status = "defined",
          notice_period_status = "not_defined".
        - sale_basis = "market_price" — если прямо сказано «по цене, сложившейся в месте хранения».
          "auction" — если прямо назван аукцион / торги.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни процедуры реализации, ни срока уведомления,
           ни порядка продажи, ни упоминания расходов / остатка.
           → presence = "missing";
             все *_status / *_basis / *_deducted / *_returned = "not_defined";
             notice_period_value = "Данные не определены".

        2. Процедура есть, детали не раскрыты.
           Отсылка к «порядку, установленному законом» без конкретики.
           → presence = "present";
             disposal_procedure_status = "defined";
             notice_period_status = "not_defined";
             sale_basis = "not_defined";
             expenses_deducted = "not_defined";
             remainder_returned = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления или
           разные порядки продажи.
           → presence = "unclear";
             соответствующий *_status / *_basis = "not_defined";
             notice_period_value = "Не удалось определить".

        4. Прямое указание запрета реализации.
           В договоре прямо сказано, что реализация невостребованной вещи
           не допускается и хранитель обязуется хранить вещь до востребования.
           → presence = "present";
             disposal_procedure_status = "defined";
             notice_period_status = "not_defined";
             sale_basis = "not_defined";
             expenses_deducted = "not_defined";
             remainder_returned = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для uncollected_goods_disposal_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для sale_basis используй только: "market_price", "auction", "other", "not_defined".
        - Для expenses_deducted и remainder_returned используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * notice_period_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * notice_period_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "uncollected_goods_disposal_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие процедуры реализации невостребованной вещи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disposal_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия процедуры реализации. Внутреннее enum-поле."
          required: true

        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока уведомления. Внутреннее enum-поле."
          required: true

        - name: "notice_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: >
            Срок уведомления поклажедателя о реализации. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "sale_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["market_price", "auction", "other", "not_defined"]
          description: "Порядок продажи невостребованной вещи. Внутреннее enum-поле."
          label: "Порядок продажи"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "expenses_deducted"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Удерживаются ли расходы из выручки. Внутреннее enum-поле."
          label: "Удержание расходов"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "remainder_returned"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возвращается ли остаток выручки поклажедателю. Внутреннее enum-поле."
          label: "Возврат остатка"
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: dangerous_properties_disclosure
    name: "Раскрытие опасных свойств вещи (ст. 893 ГК РФ)"
    description: >
      Фактографическая проверка обязанности поклажедателя раскрыть опасные свойства
      вещи (ст. 893 ГК РФ), права хранителя уничтожить / обезвредить опасную вещь
      за счёт поклажедателя без возмещения её стоимости и ответственности
      поклажедателя за сокрытие опасных свойств.
    triggers:
      any: ["dangerous_goods_storage"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "опасные свойства"
        - "предупреждение об опасности"
        - "раскрытие свойств"
        - "легковоспламеняющийся"
        - "токсичный"
        - "взрывоопасный"
        - "право уничтожить"
        - "за счёт поклажедателя"
        - "ст. 893"
        - "лицензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)опасн(ые|ых)\\s+свойств"
        - "(?i)предупред(ить|ите).*об.*опасност"
        - "(?i)ст\\.?\\s*893"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 893 ГК РФ).
        Проверяется только один вопрос: раскрытие опасных свойств вещи,
        право хранителя уничтожить / обезвредить опасную вещь и ответственность
        за сокрытие опасных свойств.
        Нормативные ориентиры:
        - п. 1 ст. 893 ГК РФ — если поклажедатель не предупредил об опасных
          свойствах вещи, хранитель вправе потребовать немедленного изъятия;
          при невозможности изъятия — вещь может быть уничтожена / обезврежена
          без возмещения её стоимости;
        - п. 2 ст. 893 ГК РФ — если хранитель был предупреждён, но вещь опасна
          для окружающих / имущества третьих лиц, уничтожение возможно
          с возмещением убытков;
        - законодательство о промышленной безопасности (ФЗ-116) и лицензировании
          (ФЗ-99) — применимо к хранению отдельных видов опасных веществ.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанности / права из норм ст. 893 ГК РФ — фиксируй только
          то, что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность поклажедателя раскрыть опасные свойства.
        2. Перечислены ли конкретные опасные свойства.
        3. Право хранителя уничтожить / обезвредить опасную вещь.
        4. Ответственность поклажедателя за сокрытие.
        5. Указание на лицензию на хранение опасных веществ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / yes-no) → "not_defined".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если общая обязанность раскрытия есть, но конкретные свойства не перечислены —
          disclosure_obligation_status = "defined", dangerous_properties_listed = "no".
        5. Если право уничтожить / обезвредить прямо указано, но без оговорки
          «за счёт поклажедателя» — destruction_right = "yes".
        6. Если договор прямо запрещает уничтожение —
          destruction_right = "no" (не "not_defined").
        7. liability_for_non_disclosure = "yes" — если прямо указана ответственность
          поклажедателя за сокрытие опасных свойств (любая формулировка).
        8. license_mentioned = "yes" — только если в тексте прямо упомянута лицензия
          на хранение опасных веществ (или ссылка на такую лицензию).
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Поклажедатель обязан письменно предупредить Хранителя об опасных
        свойствах вещи до передачи на хранение. Хранитель вправе уничтожить
        или обезвредить опасную вещь за счёт Поклажедателя без возмещения
        её стоимости. Ответственность за сокрытие опасных свойств несёт Поклажедатель."
        Ответ:
        {
          "disclosure_obligation_status": "defined",
          "dangerous_properties_listed": "no",
          "destruction_right": "yes",
          "liability_for_non_disclosure": "yes",
          "license_mentioned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель обязан письменно предупредить Хранителя об опасных свойствах вещи до передачи на хранение."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает вещь на хранение."
        Ответ:
        {
          "disclosure_obligation_status": "not_defined",
          "dangerous_properties_listed": "not_defined",
          "destruction_right": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "license_mentioned": "not_defined",
          "evidence": []
        }

        Пример 3 (частичные данные — обязанность есть, свойств нет):
        Фрагмент:
        "Поклажедатель обязан сообщить Хранителю об опасных свойствах
        передаваемого имущества."
        Ответ:
        {
          "disclosure_obligation_status": "defined",
          "dangerous_properties_listed": "no",
          "destruction_right": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "license_mentioned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель обязан сообщить Хранителю об опасных свойствах передаваемого имущества."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязанность раскрыть опасные свойства?
        2. Перечислены ли конкретные свойства?
        3. Есть ли право хранителя уничтожить / обезвредить вещь?
        4. Есть ли ответственность за сокрытие?
        5. Упомянута ли лицензия на хранение опасных веществ?
        6. Выведены ли обязанности / права из текста договора,
          а не из нормы ст. 893 ГК РФ?
        7. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosure_obligation_status": "<defined / not_defined>",
          "dangerous_properties_listed": "<yes / no / not_defined>",
          "destruction_right": "<yes / no / not_defined>",
          "liability_for_non_disclosure": "<yes / no / not_defined>",
          "license_mentioned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "опасные свойства предупреждение об опасности раскрытие свойств легковоспламеняющийся токсичный взрывоопасный право уничтожить обезвредить за счёт поклажедателя без возмещения стоимости сокрытие ответственность поклажедателя ст. 893 лицензия на хранение опасных веществ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "вознаграждение"
        - "срок хранения"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "representations"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "dangerous_properties_disclosure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о раскрытии опасных свойств вещи, праве хранителя на уничтожение,
        ответственности за сокрытие и упоминании лицензии.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dangerous_properties_disclosure_presence:
           Агрегатное signal-поле — наличие условий о раскрытии опасных свойств.
           - "present" — если хотя бы одно из содержательных полей
             (disclosure_obligation_status, dangerous_properties_listed,
              destruction_right, liability_for_non_disclosure,
              license_mentioned) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disclosure_obligation_status = "not_defined";
           - dangerous_properties_listed = "not_defined";
           - destruction_right = "not_defined";
           - liability_for_non_disclosure = "not_defined";
           - license_mentioned = "not_defined";
           - не выполняй остальные шаги.

        1. disclosure_obligation_status:
           - "defined" — если в тексте прямо указана обязанность поклажедателя
             раскрыть / предупредить об опасных свойствах вещи, либо прямо указано
             обратное — что такая обязанность не применяется;
           - "not_defined" — если прямого указания нет.

        2. dangerous_properties_listed:
           - "yes" — если прямо перечислены конкретные опасные свойства
             (токсичность, взрывоопасность, легковоспламеняемость и т.п.);
           - "no" — если общая обязанность раскрытия есть, но конкретные
             свойства прямо не перечислены;
           - "not_defined" — если прямого указания нет.

        3. destruction_right:
           - "yes" — если прямо указано право хранителя уничтожить или
             обезвредить опасную вещь (в том числе без оговорки «за счёт
             поклажедателя»);
           - "no" — если прямо указано, что уничтожение не допускается;
           - "not_defined" — если прямого указания нет.

        4. liability_for_non_disclosure:
           - "yes" — если прямо указана ответственность поклажедателя
             за сокрытие / нераскрытие опасных свойств;
           - "no" — если прямо указано, что ответственность не наступает;
           - "not_defined" — если прямого указания нет.

        5. license_mentioned:
           - "yes" — если в тексте прямо упомянута лицензия на хранение
             опасных веществ или ссылка на такую лицензию;
           - "no" — если прямо указано, что лицензия не требуется;
           - "not_defined" — если прямого указания нет.

        Если данные отсутствуют в тексте:
        - все сигнальные поля → "not_defined".

        Если данные есть, но противоречивы:
        - все сигнальные поля → "not_defined".
        </task>

        <context_rules>
        - Перед остальными полями заполни dangerous_properties_disclosure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, срок хранения, страхование и иные
          нерелевантные темы.
        - Не выводи обязанности / права из ст. 893 ГК РФ — только из текста.
        - Общая обязанность есть, свойства не перечислены —
          disclosure_obligation_status = "defined", dangerous_properties_listed = "no".
        - Право уничтожить / обезвредить указано без оговорки «за счёт поклажедателя» —
          destruction_right = "yes".
        - Договор прямо запрещает уничтожение — destruction_right = "no".
        - liability_for_non_disclosure = "yes" — если прямо указана ответственность
          поклажедателя за сокрытие опасных свойств.
        - license_mentioned = "yes" — только если прямо упомянута лицензия
          на хранение опасных веществ.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — все содержательные поля = "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности раскрыть опасные свойства, ни права
           уничтожения, ни ответственности за сокрытие, ни упоминания лицензии.
           → presence = "missing";
             все содержательные поля = "not_defined".

        2. Общая обязанность раскрытия без конкретики.
           «Поклажедатель обязан сообщить об опасных свойствах вещи»,
           без перечисления свойств и без указания последствий.
           → presence = "present";
             disclosure_obligation_status = "defined";
             dangerous_properties_listed = "no";
             destruction_right = "not_defined";
             liability_for_non_disclosure = "not_defined";
             license_mentioned = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы для опасных свойств
           (например, где-то право уничтожения есть, где-то запрещено).
           → presence = "unclear";
             соответствующие содержательные поля = "not_defined".

        4. Прямое указание на отсутствие обязанности / отказ от регулирования.
           В договоре прямо указано, что поклажедатель не обязан раскрывать
           опасные свойства, либо прямо указано, что вещь не относится
           к категории опасных.
           → presence = "present";
             disclosure_obligation_status = "defined" (прямое регулирование);
             dangerous_properties_listed = "no";
             destruction_right = "not_defined";
             liability_for_non_disclosure = "not_defined";
             license_mentioned = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dangerous_properties_disclosure_presence используй только: "present", "missing", "unclear".
        - Для disclosure_obligation_status используй только: "defined", "not_defined".
        - Для dangerous_properties_listed, destruction_right,
          liability_for_non_disclosure, license_mentioned используй только:
          "yes", "no", "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dangerous_properties_disclosure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о раскрытии опасных свойств вещи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disclosure_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности раскрыть опасные свойства. Внутреннее enum-поле."
          label: "Раскрытие опасных свойств"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "dangerous_properties_listed"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Перечислены ли конкретные опасные свойства. Внутреннее enum-поле."
          label: "Свойства перечислены"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "destruction_right"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право хранителя уничтожить опасную вещь. Внутреннее enum-поле."
          label: "Право уничтожения"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "liability_for_non_disclosure"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность за сокрытие опасных свойств. Внутреннее enum-поле."
          label: "Ответственность за сокрытие"
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "license_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание лицензии на хранение опасных веществ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: warehouse_certificate_issuance
    name: "Складское свидетельство: порядок выдачи и обращения (ст. 912–917 ГК РФ)"
    description: >
      Фактографическая проверка условий выдачи складского свидетельства,
      его вида (двойное / простое / складская квитанция), порядка передачи
      прав (индоссамент / вручение) и залога по варранту (ст. 912–917 ГК РФ).
    triggers:
      any: ["warehouse_certificate"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "складское свидетельство"
        - "двойное складское свидетельство"
        - "варрант"
        - "залоговое свидетельство"
        - "именная складская расписка"
        - "складская квитанция"
        - "передача прав"
        - "залог товара"
        - "ст. 912"
        - "ст. 913"
        - "ст. 917"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)складск(ое|ого)\\s+свидетельств"
        - "(?i)двойн(ое|ого)\\s+складск"
        - "(?i)варрант"
        - "(?i)ст\\.?\\s*(912|913|917)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 912–917 ГК РФ).
        Проверяется только один вопрос: условия выдачи и обращения
        складского свидетельства.
        Нормативные ориентиры:
        - ст. 912 ГК РФ — виды складских документов: двойное складское
          свидетельство (ценная бумага), простое складское свидетельство
          (ценная бумага на предъявителя), складская квитанция
          (не является ценной бумагой);
        - ст. 913 ГК РФ — двойное складское свидетельство: состоит
          из складского свидетельства и залогового свидетельства (варранта);
        - ст. 914–916 ГК РФ — обращение двойного свидетельства, варрант,
          передача по индоссаменту;
        - ст. 917 ГК РФ — простое складское свидетельство (на предъявителя).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 912–917 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли складское свидетельство.
        2. Вид свидетельства (двойное / простое / складская квитанция).
        3. Когда выдаётся свидетельство.
        4. Разрешена ли передача прав по свидетельству (индоссамент / вручение).
        5. Разрешён ли залог товара по варранту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных — "not_defined".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если упомянуто только «простое складское свидетельство» или
          «складская квитанция» — certificate_type = "simple" или
          "warehouse_receipt" соответственно.
        5. Если упомянуто «двойное складское свидетельство» (или отдельно
          варрант / залоговое свидетельство) — certificate_type = "double".
        6. transfer_allowed = "yes" — если прямо указано право передачи
          (индоссамент, вручение); "no" — если прямо запрещена.
        7. pledge_allowed = "yes" — если прямо указано право залога товара
          по варранту / залоговому свидетельству. Для простого свидетельства
          или квитанции залог обычно не упоминается — оставляй "not_defined",
          если прямо не сказано.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранитель выдаёт Поклажедателю двойное складское свидетельство,
        состоящее из складского свидетельства и залогового свидетельства
        (варранта). Свидетельство может быть передано путём индоссамента.
        Товар, находящийся на хранении, может быть предметом залога по варранту."
        Ответ:
        {
          "certificate_mentioned": "defined",
          "certificate_type": "double",
          "issuance_timing": "upon_acceptance",
          "transfer_allowed": "yes",
          "pledge_allowed": "yes",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель выдаёт Поклажедателю двойное складское свидетельство, состоящее из складского свидетельства и залогового свидетельства (варранта)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает товар на хранение."
        Ответ:
        {
          "certificate_mentioned": "not_defined",
          "certificate_type": "not_defined",
          "issuance_timing": "not_defined",
          "transfer_allowed": "not_defined",
          "pledge_allowed": "not_defined",
          "evidence": []
        }

        Пример 3 (частичные данные — простое свидетельство, без залога):
        Фрагмент:
        "Хранитель выдаёт Поклажедателю простое складское свидетельство
        при приёме товара на хранение."
        Ответ:
        {
          "certificate_mentioned": "defined",
          "certificate_type": "simple",
          "issuance_timing": "upon_acceptance",
          "transfer_allowed": "not_defined",
          "pledge_allowed": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель выдаёт Поклажедателю простое складское свидетельство при приёме товара на хранение."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли упоминание складского свидетельства?
        2. Определён ли вид — двойное, простое, складская квитанция?
        3. Указан ли момент выдачи?
        4. Разрешена ли передача прав?
        5. Разрешён ли залог по варранту?
        6. Выведены ли условия из текста договора, а не из норм ст. 912–917 ГК РФ?
        7. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "certificate_mentioned": "<defined / not_defined>",
          "certificate_type": "<double / simple / warehouse_receipt / not_defined>",
          "issuance_timing": "<upon_acceptance / upon_request / not_defined>",
          "transfer_allowed": "<yes / no / not_defined>",
          "pledge_allowed": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "складское свидетельство двойное складское свидетельство простое складское свидетельство варрант залоговое свидетельство именная складская расписка складская квитанция передача прав индоссамент вручение залог товара ст. 912 ст. 913 ст. 917"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "возврат вещи"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
