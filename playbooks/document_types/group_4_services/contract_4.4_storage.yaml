shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm|литр)"
  temperature_pattern: "(?i)(?:от\\s+)?[\\+\\-]?\\d+\\s*(?:°C|градус|до\\s+[\\+\\-]?\\d+)"
  compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_identification
    name: "Стороны договора: идентификация хранителя и поклажедателя"
    description: >
      Фактографическая проверка идентификации сторон договора хранения —
      хранителя и поклажедателя, их реквизитов, подписантов и оснований полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "хранитель"
        - "поклажедатель"
        - "сдаёт на хранение"
        - "принимает на хранение"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(хранитель|поклажедатель).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (Глава 47 ГК РФ, ст. 886).
        Проверяется только один вопрос: идентификация сторон — хранителя
        и поклажедателя, их реквизиты, подписанты и основания полномочий.
        Нормативный ориентир:
        - ст. 886 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Хранителя (ИНН, ОГРН).
        2. Тип Хранителя (юрлицо / ИП / физлицо).
        3. Кто подписывает от Хранителя и на каком основании.
        4. Наименование и реквизиты Поклажедателя.
        5. Тип Поклажедателя.
        6. Кто подписывает от Поклажедателя и на каком основании.
        7. Указание на статус профессионального хранителя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / type / basis / yes-no) → "not_defined";
          - текстовые поля (details_value / signatory) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если подписантов несколько (совместное подписание) — перечисли их
          через "; " в одном поле signatory.
        5. Если подписант указан, а основание — нет (и наоборот), оставь
          заполненным то, что есть, остальное → "not_defined".
        6. В evidence — только цитаты из документа, каждая с clause_ref.
        7. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "ООО «СкладЛогистик» (ИНН 7712345678, ОГРН 1117712345678), именуемое
        «Хранитель», в лице генерального директора Иванова И.И., действующего
        на основании Устава, и АО «ТоргСервис» (ИНН 7798765432), именуемое
        «Поклажедатель», в лице директора Петрова П.П., действующего
        на основании доверенности № 7 от 12.03.2024. Хранитель осуществляет
        профессиональную деятельность по хранению."
        Ответ:
        {
          "custodian_details_status": "defined",
          "custodian_details_value": "ООО «СкладЛогистик», ИНН 7712345678, ОГРН 1117712345678",
          "custodian_type": "legal_entity",
          "custodian_signatory": "Иванов И.И., генеральный директор",
          "custodian_signatory_basis": "charter",
          "custodian_professional_status": "yes",
          "depositor_details_status": "defined",
          "depositor_details_value": "АО «ТоргСервис», ИНН 7798765432",
          "depositor_type": "legal_entity",
          "depositor_signatory": "Петров П.П., директор",
          "depositor_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «СкладЛогистик» (ИНН 7712345678, ОГРН 1117712345678), именуемое «Хранитель», в лице генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между Хранителем и Поклажедателем."
        Ответ:
        {
          "custodian_details_status": "not_defined",
          "custodian_details_value": "Данные не определены",
          "custodian_type": "not_defined",
          "custodian_signatory": "Данные не определены",
          "custodian_signatory_basis": "not_defined",
          "custodian_professional_status": "not_defined",
          "depositor_details_status": "not_defined",
          "depositor_details_value": "Данные не определены",
          "depositor_type": "not_defined",
          "depositor_signatory": "Данные не определены",
          "depositor_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли поля хранителя и поклажедателя без смешения?
        2. Есть ли ИНН/ОГРН для ЮЛ или паспортные данные для физлица?
        3. Указан ли подписант и документ-основание?
        4. Упомянут ли статус профессионального хранителя?
        5. Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON.
        6. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        7. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "custodian_details_status": "<defined / not_defined>",
          "custodian_details_value": "<реквизиты или 'Данные не определены'>",
          "custodian_type": "<legal_entity / ip / individual / not_defined>",
          "custodian_signatory": "<ФИО и должность или 'Данные не определены'>",
          "custodian_signatory_basis": "<charter / poa / order / law / personal / other / not_defined>",
          "custodian_professional_status": "<yes / no / not_defined>",
          "depositor_details_status": "<defined / not_defined>",
          "depositor_details_value": "<реквизиты или 'Данные не определены'>",
          "depositor_type": "<legal_entity / ip / individual / consumer / not_defined>",
          "depositor_signatory": "<ФИО и должность или 'Данные не определены'>",
          "depositor_signatory_basis": "<charter / poa / order / law / personal / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "хранитель поклажедатель именуем в лице действующего на основании устава доверенности приказа полномочия ИНН ОГРН паспортные данные реквизиты профессиональный хранитель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "предмет хранения"
        - "вознаграждение"
        - "срок хранения"
        - "ответственность за утрату"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.40
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "representations"
          - "boilerplate"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      presence_signal:
        field: "parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора хранения
        сведения о хранителе и поклажедателе: реквизиты, тип стороны,
        подписанта, основание полномочий и статус профессионального хранителя.
        Не анализируй предмет хранения, вознаграждение, сроки или иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_presence:
           Агрегатное signal-поле — наличие идентификации сторон / полномочий в договоре.
           - "present" — если хотя бы одно из содержательных полей
             (custodian_details_status, custodian_type,
              custodian_signatory_basis, custodian_professional_status,
              depositor_details_status, depositor_type,
              depositor_signatory_basis) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - custodian_details_status = depositor_details_status = "not_defined";
           - custodian_type = depositor_type = "not_defined";
           - custodian_signatory_basis = depositor_signatory_basis = "not_defined";
           - custodian_professional_status = "not_defined";
           - custodian_details_value = depositor_details_value = "Данные не определены";
           - custodian_signatory = depositor_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. custodian_details_status:
           - "defined" — если хранитель прямо идентифицируется хотя бы по наименованию,
             ФИО или статусу ИП + ФИО;
           - "not_defined" — если хранитель прямо не идентифицируется.

        2. custodian_details_value:
           Краткая идентификация хранителя на русском языке:
           - для юрлица: наименование + ИНН + ОГРН, если прямо указаны;
           - для ИП: ИП + ФИО + ИНН + ОГРНИП, если прямо указаны;
           - для физлица: ФИО + паспортные данные, если прямо указаны.
           Не включай банковские реквизиты.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. custodian_type:
           - "legal_entity" — прямо указано, что хранитель — юридическое лицо;
           - "ip" — прямо указано, что хранитель — ИП;
           - "individual" — прямо указано, что хранитель — физическое лицо;
           - "not_defined" — тип прямо не указан.

        4. custodian_signatory:
           ФИО и должность лица, которое подписывает от хранителя.
           При совместном подписании — перечисли через "; ".
           Fallback: "Данные не определены" / "Не удалось определить".

        5. custodian_signatory_basis:
           - "charter" — устав;
           - "poa" — доверенность;
           - "order" — приказ;
           - "law" — закон или иной нормативный акт;
           - "personal" — действует лично (для физлица);
           - "other" — иное;
           - "not_defined" — не указано.

        6. custodian_professional_status:
           - "yes" — прямо указано, что хранитель осуществляет профессиональную
             или предпринимательскую деятельность по хранению;
           - "no" — прямо указано иное;
           - "not_defined" — не упомянуто.

        7. depositor_details_status:
           - "defined" — если поклажедатель прямо идентифицируется хотя бы по
             наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если поклажедатель прямо не идентифицируется.

        8. depositor_details_value:
           Краткая идентификация поклажедателя на русском языке по тем же правилам,
           что и для хранителя.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. depositor_type:
           - "legal_entity" / "ip" / "individual" — см. правила для хранителя;
           - "consumer" — прямо указано, что поклажедатель — физическое лицо
             для личных нужд;
           - "not_defined" — тип прямо не указан.

        10. depositor_signatory:
            ФИО и должность лица, которое подписывает от поклажедателя.
            При совместном подписании — перечисли через "; ".
            Fallback: "Данные не определены" / "Не удалось определить".

        11. depositor_signatory_basis:
            Используй только одно из значений: "charter", "poa", "order", "law",
            "personal", "other", "not_defined" — по тем же правилам, что и для хранителя.

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы или их нельзя надёжно определить:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type / *_basis / *_professional_status = "not_defined", все *_value / signatory = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не смешивай сведения о хранителе и поклажедателе.
        - Если в тексте есть только обозначения "Хранитель" / "Поклажедатель" без идентифицирующих данных, это "not_defined" для *_details_status.
        - Если прямо указано только наименование юрлица, только ФИО физлица или только статус ИП + ФИО, этого достаточно для статуса "defined".
        - Если основание полномочий не указано прямо, не выводи его из должности или из закона.
        - Если подписантов несколько — перечисли через "; " в одном поле signatory.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту — верни "Не удалось определить", а для status/type/basis enum используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни наименований/реквизитов сторон, ни подписантов,
           ни оснований полномочий.
           → presence = "missing";
             все *_status / *_type / *_basis / *_professional_status = "not_defined";
             все *_value / signatory = "Данные не определены".

        2. Роли без идентификации.
           Упомянуты "Хранитель" и "Поклажедатель", но без реквизитов, ФИО и подписантов.
           → presence = "present";
             custodian_details_status = depositor_details_status = "not_defined";
             custodian_details_value = depositor_details_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные наименования/ИНН для одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Прямое исключение или явное отсутствие.
           В договоре прямо указано, что данные сторон не раскрываются.
           → presence = "present";
             соответствующий *_details_status = "not_defined";
             соответствующий *_details_value содержит дословную цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_presence используй только: "present", "missing", "unclear".
        - Для *_details_status используй только: "defined", "not_defined".
        - Для *_type хранителя используй только: "legal_entity", "ip", "individual", "not_defined".
        - Для *_type поклажедателя используй только: "legal_entity", "ip", "individual", "consumer", "not_defined".
        - Для *_signatory_basis используй только: "charter", "poa", "order", "law", "personal", "other", "not_defined".
        - Для custodian_professional_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены";
          * custodian_signatory, depositor_signatory → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / signatory → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / полномочий в договоре хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "custodian_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов хранителя. Внутреннее enum-поле."
          required: true

        - name: "custodian_details_value"
          type: "string"
          presentation: "fact"
          label: "Хранитель"
          description: >
            Реквизиты хранителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "custodian_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
          description: "Тип хранителя. Внутреннее enum-поле."
          required: true

        - name: "custodian_signatory"
          label: "Подписант хранителя"
          type: "string"
          presentation: "fact"
          description: >
            Подписант хранителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "custodian_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["charter", "poa", "order", "law", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта хранителя. Внутреннее enum-поле."
          required: true

        - name: "custodian_professional_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Статус профессионального хранителя. Внутреннее enum-поле."
          required: true

        - name: "depositor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов поклажедателя. Внутреннее enum-поле."
          required: true

        - name: "depositor_details_value"
          type: "string"
          presentation: "fact"
          label: "Поклажедатель"
          description: >
            Реквизиты поклажедателя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "depositor_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "ip", "individual", "consumer", "not_defined"]
          description: "Тип поклажедателя. Внутреннее enum-поле."
          required: true

        - name: "depositor_signatory"
          label: "Подписант поклажедателя"
          type: "string"
          presentation: "fact"
          description: >
            Подписант поклажедателя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "depositor_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["charter", "poa", "order", "law", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта поклажедателя. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: storage_subject_extraction
    name: "Предмет хранения: описание вещи, количество, стоимость"
    description: >
      Фактографическая проверка предмета договора хранения: описание вещи,
      её тип (индивидуально-определённая / родовая), количество, вес, объём,
      заявленная стоимость, тип хранения (обычное / иррегулярное с обезличиванием)
      и идентификационные признаки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет хранения"
        - "вещь"
        - "товар"
        - "имущество"
        - "количество"
        - "вес"
        - "объём"
        - "стоимость"
        - "заявленная стоимость"
        - "оценочная стоимость"
        - "родовые вещи"
        - "индивидуально-определённая"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(вещь|товар|имущество).*передаётся.*на.*хранение"
        - "(?i)количество.*\\d"
        - "(?i)стоимост(ь|и).*\\d"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (Глава 47 ГК РФ, ст. 886).
        Проверяется только один вопрос: предмет хранения — описание вещи,
        её характеристики, тип, количество и заявленная стоимость.
        Нормативный ориентир:
        - ст. 886 ГК РФ — предмет договора хранения
        - ст. 890 ГК РФ — иррегулярное хранение (хранение с обезличиванием)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описание хранимой вещи (наименование, характеристики).
        2. Тип вещи (индивидуально-определённая / родовая).
        3. Количество, вес или объём.
        4. Заявленную или оценочную стоимость.
        5. Тип хранения (обычное / иррегулярное).
        6. Идентификационные признаки (серийный номер, маркировка, пломба).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / type) → "not_defined";
          - текстовые поля (item_description_value / quantity_value /
            declared_value_value / identification_marks_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если в договоре указана и заявленная, и оценочная стоимость —
          зафиксируй обе через "; " в одном поле, заявленную первой.
        5. Если предмет — перечень разных вещей (в спецификации / приложении) —
          укажи обобщённое описание и добавь отсылку: «Согласно Спецификации №N».
          Это ВАЛИДНЫЙ факт, не "not_defined".
        6. quantity_value всегда указывай с единицей измерения
          («50 тонн», «100 шт.», «5 м³»), не как голое число.
        7. Если тип вещи (индивидуальная / родовая) прямо не назван,
          но из описания очевиден (зерно, песок — родовые; авто с VIN —
          индивидуальная) — укажи соответствующий тип. Иначе "not_defined".
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "На хранение передаётся зерно пшеницы 3 класса в количестве 100 тонн,
        влажностью не более 14%. Хранение иррегулярное: зерно хранится
        в общей массе. Заявленная стоимость — 1 000 000 рублей."
        Ответ:
        {
          "item_description_status": "defined",
          "item_description_value": "зерно пшеницы 3 класса, влажностью не более 14%",
          "item_type": "generic",
          "quantity_status": "defined",
          "quantity_value": "100 тонн",
          "declared_value_status": "defined",
          "declared_value_value": "1 000 000 рублей",
          "storage_type": "irregular",
          "identification_marks_status": "not_defined",
          "identification_marks_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "На хранение передаётся зерно пшеницы 3 класса в количестве 100 тонн, влажностью не более 14%."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает имущество Поклажедателя на хранение."
        Ответ:
        {
          "item_description_status": "not_defined",
          "item_description_value": "Данные не определены",
          "item_type": "not_defined",
          "quantity_status": "not_defined",
          "quantity_value": "Данные не определены",
          "declared_value_status": "not_defined",
          "declared_value_value": "Данные не определены",
          "storage_type": "not_defined",
          "identification_marks_status": "not_defined",
          "identification_marks_value": "Данные не определены",
          "evidence": []
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "На хранение передаётся сервер Dell PowerEdge R750 с серийным
        номером SN-0012345. Количество и стоимость в настоящем договоре
        не указаны."
        Ответ:
        {
          "item_description_status": "defined",
          "item_description_value": "сервер Dell PowerEdge R750",
          "item_type": "individual",
          "quantity_status": "not_defined",
          "quantity_value": "Данные не определены",
          "declared_value_status": "not_defined",
          "declared_value_value": "Данные не определены",
          "storage_type": "regular",
          "identification_marks_status": "defined",
          "identification_marks_value": "серийный номер SN-0012345",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "На хранение передаётся сервер Dell PowerEdge R750 с серийным номером SN-0012345."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Содержит ли item_description_value конкретные характеристики
          (наименование, сорт, марка), или только родовое слово?
        2. Определён ли тип вещи — индивидуальная или родовая?
        3. Указано ли количество/вес/объём с единицей измерения?
        4. Указана ли заявленная (и/или оценочная) стоимость?
        5. Определён ли тип хранения — обычное или иррегулярное?
        6. Есть ли идентификационные признаки?
        7. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "item_description_status": "<defined / not_defined>",
          "item_description_value": "<описание или 'Данные не определены'>",
          "item_type": "<individual / generic / not_defined>",
          "quantity_status": "<defined / not_defined>",
          "quantity_value": "<количество или 'Данные не определены'>",
          "declared_value_status": "<defined / not_defined>",
          "declared_value_value": "<стоимость или 'Данные не определены'>",
          "storage_type": "<regular / irregular / not_defined>",
          "identification_marks_status": "<defined / not_defined>",
          "identification_marks_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет хранения вещь товар имущество наименование характеристики описание сорт марка модель количество вес объём единица измерения заявленная стоимость оценочная стоимость родовые вещи индивидуально-определённая вещь иррегулярное хранение обезличивание идентификационные признаки серийный номер маркировка пломба спецификация приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "срок хранения"
        - "ответственность"
        - "возврат"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "definitions"
          - "obligations"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "storage_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения о предмете:
        описание вещи, тип, количество, стоимость, тип хранения, идентификационные признаки.
        Не анализируй вознаграждение, ответственность или иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. storage_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по предмету хранения.
           - "present" — если хотя бы одно из содержательных полей
             (item_description_status, item_type, quantity_status,
              declared_value_status, storage_type, identification_marks_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - item_description_status = "not_defined";
           - item_type = "not_defined";
           - quantity_status = "not_defined";
           - declared_value_status = "not_defined";
           - storage_type = "not_defined";
           - identification_marks_status = "not_defined";
           - item_description_value = "Данные не определены";
           - quantity_value = "Данные не определены";
           - declared_value_value = "Данные не определены";
           - identification_marks_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. item_description_status:
           - "defined" — если прямо указано наименование, сорт, марка, модель
             вещи, или прямо сказано, что предмет определяется по спецификации,
             приложению, описи или иному названному документу;
           - "not_defined" — если вещь прямо не описана или описана только родовым
             словом ("имущество", "товар") без конкретики и без ссылки на документ.

        2. item_description_value:
           Краткое user-facing описание предмета на русском языке.
           Правила:
           - если вещь прямо названа, укажи кратко: "зерно пшеницы 3 класса",
             "сервер Dell PowerEdge R750", "автомобиль Toyota Camry";
           - не копируй длинные абзацы, не более 1–2 коротких фраз;
           - если предмет определяется через другой документ — верни формулировку
             вида "Согласно Спецификации №1", "По описи (Приложение №2)";
           - если только родовое слово без конкретики — "Данные не определены";
           - если противоречиво — "Не удалось определить".

        3. item_type:
           - "individual" — индивидуально-определённая вещь с уникальными
             признаками (VIN, серийный номер, уникальные характеристики);
           - "generic" — родовые вещи (зерно, песок, топливо, иные,
             определяемые мерой/весом);
           - "not_defined" — тип прямо не указан и из описания не очевиден.

        4. quantity_status:
           - "defined" — количество прямо указано числом с единицей измерения
             либо прямо сказано, что определяется по спецификации/заявке/приложению;
           - "not_defined" — количество прямо не определено.

        5. quantity_value:
           Краткое user-facing описание количества с единицей измерения
           ("100 тонн", "5 м³", "100 шт.", "По заявкам Покупателя",
            "Определяется Спецификацией №1").
           Fallback: "Данные не определены" / "Не удалось определить".

        6. declared_value_status:
           - "defined" — если прямо указана заявленная и/или оценочная
             стоимость вещи;
           - "not_defined" — если стоимость прямо не указана.

        7. declared_value_value:
           Краткое user-facing описание стоимости ("1 000 000 рублей",
           "Оценочная стоимость: 500 000 руб.").
           Если указаны и заявленная, и оценочная — обе через "; ", заявленную первой.
           Fallback: "Данные не определены" / "Не удалось определить".

        8. storage_type:
           - "regular" — обычное хранение конкретной вещи;
           - "irregular" — иррегулярное хранение с обезличиванием
             (вещи одного рода хранятся в общей массе);
           - "not_defined" — тип прямо не указан и из описания не очевиден.

        9. identification_marks_status:
           - "defined" — если прямо указаны серийный номер, VIN, маркировка,
             пломба или иные уникальные идентификаторы вещи;
           - "not_defined" — если таких признаков нет.

        10. identification_marks_value:
            Краткое описание идентификационных признаков
            ("серийный номер SN-0012345", "VIN XTA21099...", "пломба №12345").
            Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы или их нельзя надёжно определить:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни storage_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type = "not_defined", все *_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, срок хранения, ответственность, возврат
          и иные нерелевантные темы.
        - Если предмет/количество/стоимость определяются через спецификацию,
          приложение, опись, заявку или иной названный документ, и это прямо
          видно из текста — считай параметр определённым.
        - quantity_value всегда указывай с единицей измерения, не голым числом.
        - Если в договоре указана и заявленная, и оценочная стоимость — обе через "; ", заявленную первой.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания вещи, ни количества, ни стоимости.
           → presence = "missing";
             все *_status / *_type = "not_defined";
             все *_value = "Данные не определены".

        2. Родовое упоминание без конкретики.
           "Хранитель принимает имущество Поклажедателя на хранение."
           → presence = "present";
             item_description_status = "not_defined";
             item_description_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные количества или стоимости.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Предмет/количество/стоимость определяются по спецификации,
           приложению, описи.
           → presence = "present";
             соответствующий *_status = "defined";
             *_value содержит формулировку вида "Согласно Спецификации №1".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для storage_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для item_type используй только: "individual", "generic", "not_defined".
        - Для storage_type используй только: "regular", "irregular", "not_defined".
        - Fallback при отсутствии данных:
          * item_description_value, quantity_value, declared_value_value,
            identification_marks_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "storage_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "item_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения предмета хранения. Внутреннее enum-поле."
          required: true

        - name: "item_description_value"
          type: "string"
          presentation: "fact"
          label: "Описание вещи"
          description: >
            Описание хранимой вещи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "item_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["individual", "generic", "not_defined"]
          description: "Тип вещи: индивидуально-определённая или родовая. Внутреннее enum-поле."
          required: true

        - name: "quantity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания количества. Внутреннее enum-поле."
          required: true

        - name: "quantity_value"
          type: "string"
          presentation: "fact"
          label: "Количество"
          description: >
            Количество, вес или объём вещи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "declared_value_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания заявленной стоимости. Внутреннее enum-поле."
          required: true

        - name: "declared_value_value"
          type: "string"
          presentation: "fact"
          label: "Заявленная стоимость"
          description: >
            Заявленная или оценочная стоимость вещи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "storage_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["regular", "irregular", "not_defined"]
          description: "Тип хранения: обычное или иррегулярное. Внутреннее enum-поле."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "identification_marks_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания идентификационных признаков. Внутреннее enum-поле."
          required: true

        - name: "identification_marks_value"
          type: "string"
          presentation: "fact"
          label: "Идентификация"
          description: >
            Серийный номер, маркировка, пломба и т.п. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: acceptance_documentation_check
    name: "Документальное подтверждение приёма вещи (ст. 887 ГК РФ, форма МХ-1)"
    description: >
      Фактографическая проверка наличия условия о документальном подтверждении
      приёма вещи на хранение: акт приёма-передачи (форма МХ-1), сохранная расписка,
      складское свидетельство (ст. 912–917 ГК РФ), порядок и сроки выдачи документа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "акт приёма-передачи"
        - "форма МХ-1"
        - "сохранная расписка"
        - "складское свидетельство"
        - "документальное подтверждение"
        - "передаточный акт"
        - "Постановление Госкомстата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*приёма.*передачи"
        - "(?i)форм(а|е)\\s+МХ[\\s-]*1"
        - "(?i)сохранн(ая|ой)\\s+расписк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 887, 912–917 ГК РФ).
        Проверяется только один вопрос: документальное подтверждение приёма вещи.
        Нормативный ориентир:
        - ст. 887 ГК РФ — форма договора хранения
        - ст. 912–917 ГК РФ — складские документы (складское свидетельство)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Ссылка на форму МХ-1 / Постановление Госкомстата № 66 — валидный факт,
          даже если форма с 2013 года необязательна (ФЗ № 402-ФЗ).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли документ о приёме вещи на хранение.
        2. Вид документа (акт МХ-1 / расписка / складское свидетельство / иной).
        3. Когда выдаётся документ (при приёме / в течение срока / при возврате).
        4. Указана ли форма документа или ссылка на Постановление Госкомстата № 66.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / type) → "not_defined";
          - текстовые поля (form_reference_value) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если в договоре указан срок выдачи в днях (например, «в течение 5 дней») —
          when_issued = "within_period"; точное число дней зафиксируй в evidence.
        5. Если документ выдаётся при возврате вещи — when_issued = "at_return".
        6. Если упоминается складское свидетельство — тип документа
          "warehouse_certificate" (двойное / простое — не разделяем в этом check-е).
        7. В evidence — только цитаты из документа, каждая с clause_ref.
        8. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Приём вещи на хранение оформляется актом приёма-передачи по форме
        МХ-1, утверждённой Постановлением Госкомстата России от 09.08.1999 № 66.
        Акт составляется в двух экземплярах при передаче вещи."
        Ответ:
        {
          "acceptance_doc_status": "defined",
          "acceptance_doc_type": "act_mh1",
          "when_issued": "upon_acceptance",
          "form_reference_status": "defined",
          "form_reference_value": "форма МХ-1, Постановление Госкомстата России от 09.08.1999 № 66",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Приём вещи на хранение оформляется актом приёма-передачи по форме МХ-1, утверждённой Постановлением Госкомстата России от 09.08.1999 № 66."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя."
        Ответ:
        {
          "acceptance_doc_status": "not_defined",
          "acceptance_doc_type": "not_defined",
          "when_issued": "not_defined",
          "form_reference_status": "not_defined",
          "form_reference_value": "Данные не определены",
          "evidence": []
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "Факт приёма вещи подтверждается сохранной распиской Хранителя.
        Форма расписки и срок её выдачи в договоре не установлены."
        Ответ:
        {
          "acceptance_doc_status": "defined",
          "acceptance_doc_type": "custody_receipt",
          "when_issued": "not_defined",
          "form_reference_status": "not_defined",
          "form_reference_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Факт приёма вещи подтверждается сохранной распиской Хранителя."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание документа о приёме?
        2. Определён ли вид документа?
        3. Указан ли момент выдачи документа?
        4. Есть ли ссылка на форму или Постановление Госкомстата?
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        6. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        7. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "acceptance_doc_status": "<defined / not_defined>",
          "acceptance_doc_type": "<act_mh1 / custody_receipt / warehouse_certificate / other / not_defined>",
          "when_issued": "<upon_acceptance / within_period / at_return / not_defined>",
          "form_reference_status": "<defined / not_defined>",
          "form_reference_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи форма МХ-1 МХ-2 МХ-3 сохранная расписка складское свидетельство двойное простое документальное подтверждение приём на хранение передаточный акт приложение спецификация"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "возврат вещи"
        - "срок хранения"
        - "продление"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "acceptance_documentation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о документальном подтверждении приёма вещи: вид документа, момент выдачи,
        ссылку на форму.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. acceptance_documentation_check_presence:
           Агрегатное signal-поле — наличие условия о документальном подтверждении приёма.
           - "present" — если хотя бы одно из содержательных полей
             (acceptance_doc_status, acceptance_doc_type, when_issued,
              form_reference_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - acceptance_doc_status = "not_defined";
           - acceptance_doc_type = "not_defined";
           - when_issued = "not_defined";
           - form_reference_status = "not_defined";
           - form_reference_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. acceptance_doc_status:
           - "defined" — если в тексте прямо упомянут документ о приёме вещи
             (акт, расписка, складское свидетельство, иной поименованный документ);
           - "not_defined" — если такое упоминание прямо отсутствует.

        2. acceptance_doc_type:
           - "act_mh1" — акт по форме МХ-1;
           - "custody_receipt" — сохранная расписка;
           - "warehouse_certificate" — складское свидетельство (ст. 912–917 ГК РФ,
             двойное / простое — не разделяем);
           - "other" — иной прямо названный документ (передаточный акт, опись и т.п.);
           - "not_defined" — вид документа прямо не указан.

        3. when_issued:
           - "upon_acceptance" — документ выдаётся при приёме вещи;
           - "within_period" — в течение указанного срока (число дней фиксируй в evidence);
           - "at_return" — при возврате вещи;
           - "not_defined" — момент прямо не указан.

        4. form_reference_status:
           - "defined" — если прямо указана форма документа или ссылка на нормативный акт
             (например, Постановление Госкомстата России от 09.08.1999 № 66);
           - "not_defined" — если такой ссылки нет.

        5. form_reference_value:
           Краткая user-facing формулировка о форме документа на русском языке,
           например: "форма МХ-1, Постановление Госкомстата России от 09.08.1999 № 66".
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни acceptance_documentation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type = "not_defined", when_issued = "not_defined", form_reference_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность, возврат вещи, срок хранения
          и иные нерелевантные темы.
        - Ссылка на форму МХ-1 или Постановление Госкомстата России от 09.08.1999 № 66 —
          валидный факт, даже если форма с 2013 года необязательна.
        - Если в договоре указан срок выдачи в днях — when_issued = "within_period";
          число дней фиксируй в evidence.
        - Если упоминается складское свидетельство — acceptance_doc_type = "warehouse_certificate".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания документа о приёме, ни формы, ни момента выдачи.
           → presence = "missing";
             все *_status / *_type = "not_defined";
             when_issued = "not_defined";
             form_reference_value = "Данные не определены".

        2. Документ назван, но детали не раскрыты.
           Например: "Факт приёма подтверждается сохранной распиской Хранителя",
           без указания формы и срока выдачи.
           → presence = "present";
             acceptance_doc_status = "defined";
             acceptance_doc_type = "custody_receipt";
             when_issued = "not_defined";
             form_reference_status = "not_defined";
             form_reference_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды документов о приёме
           или разные моменты выдачи.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Прямое исключение или отсылка на внешний документ.
           В договоре прямо указано, что форма документа определяется приложением,
           либо что документ о приёме не оформляется.
           → presence = "present";
             соответствующий *_status = "defined";
             form_reference_value содержит формулировку вида
             "Согласно Приложению №2" либо дословную цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceptance_documentation_check_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для acceptance_doc_type используй только: "act_mh1", "custody_receipt", "warehouse_certificate", "other", "not_defined".
        - Для when_issued используй только: "upon_acceptance", "within_period", "at_return", "not_defined".
        - Fallback при отсутствии данных:
          * form_reference_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * form_reference_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
