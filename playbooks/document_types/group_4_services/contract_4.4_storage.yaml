        Проверь наличие условия о праве удержания вещи (ст. 359, 920 ГК РФ).

        Ответь строго в JSON:
        {
          "lien_right_present": "<yes / no / not_found>",
          "lien_conditions": "<описание условий или not_found>",
          "lien_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "удержание вещи"
        - "право удержания"
        - "до оплаты"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lien_right_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие права удержания"
      store_payload: true

  - id: natural_loss_norms
    name: "Естественная убыль: применение норм"
    description: |
      Проверяет наличие условия о естественной убыли и ссылки на утверждённые нормы.
    triggers:
      any: ["perishable_goods_storage", "irregular_storage"]
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "естественная убыль"
        - "нормы естественной убыли"
        - "усушка"
        - "утруска"
        - "нормативные потери"
        - "в пределах норм"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)естественн(ая|ой)\\s+убыл"
        - "(?i)усушк(а|и)|утруск(а|и)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор хранения.
        Проверь наличие условия о естественной убыли.

        Ответь строго в JSON:
        {
          "natural_loss_mentioned": "<yes / no>",
          "norms_referenced": "<yes / no / not_found>",
          "loss_within_norms_exempt": "<yes / no / not_found>",
          "natural_loss_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "естественная убыль"
        - "нормы"
        - "усушка"
        - "утруска"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "natural_loss_mentioned"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Упоминание естественной убыли"
        - name: "norms_referenced"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Ссылка на утверждённые нормы"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "remuneration_and_expenses"
    name: "Вознаграждение хранителя и возмещение расходов"
    description: "Проверяет наличие условий вознаграждения и порядка возмещения расходов"
    legal_base: "ст. 896 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "вознаграждение"
        - "плата за хранение"
        - "стоимость хранения"
        - "безвозмездное"
        - "возмещение расходов"
        - "рублей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознагражден(ие|ия)\\s+хранител"
        - "(?i)плат(а|ы)\\s+за\\s+хранени"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "remuneration_amount"
          type: "number"
          keyword_hints: ["вознаграждение", "плата", "рублей"]
          unit: "RUB"
          description: "Размер вознаграждения"
        - name: "gratuitous"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["безвозмездное", "бесплатное"]
          description: "Является ли хранение безвозмездным"
      store_payload: true

  - id: "parties_identification"
    name: "Стороны: хранитель и поклажедатель"
    description: "Проверяет идентификацию сторон"
    legal_base: "ст. 886 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "хранитель"
        - "поклажедатель"
        - "сдаёт на хранение"
        - "принимает на хранение"
        - "именуем"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(хранитель|поклажедатель).*именуем"

  - id: "storage_object_description"
    name: "Предмет хранения: описание вещи (ст. 886 ГК РФ)"
    description: "Проверяет наличие описания хранимой вещи"
    legal_base: "ст. 886 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "предмет хранения"
        - "вещь"
        - "товар"
        - "имущество"
        - "количество"
        - "вес"
        - "объём"
        - "стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+хранени"
        - "(?i)(вещь|товар).*передаётся.*на.*хранени"

  - id: "storage_term"
    name: "Срок хранения или 'до востребования'"
    description: "Проверяет наличие срока хранения"
    legal_base: "ст. 889 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок хранения"
        - "период хранения"
        - "до востребования"
        - "дата окончания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+хранени"
        - "(?i)до\\s+востребовани"

  - id: "storage_conditions"
    name: "Условия хранения: температура, влажность, режим (ст. 891 ГК РФ)"
    description: "Проверяет наличие требований к условиям хранения"
    legal_base: "ст. 891 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "условия хранения"
        - "температурный режим"
        - "влажность"
        - "освещённость"
        - "вентиляция"
        - "специальные условия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)услови(я|ях)\\s+хранени"
        - "(?i)температур(а|ы|е).*режим"
        - "(?i)(?:от\\s+)?[\\+\\-]?\\d+\\s*°"

  - id: "acceptance_procedure"
    name: "Порядок приёма вещи на хранение"
    description: "Проверяет процедуру приёма, осмотра, документирования"
    legal_base: "ст. 887 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "приём на хранение"
        - "осмотр вещи"
        - "акт приёма"
        - "форма МХ-1"
        - "проверка при приёме"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приём.*на.*хранени"
        - "(?i)акт\\s+приёма"

  - id: "return_procedure"
    name: "Порядок выдачи вещи (ст. 900 ГК РФ)"
    description: "Проверяет процедуру выдачи вещи, проверку правомочий получателя"
    legal_base: "ст. 900 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "выдача вещи"
        - "возврат вещи"
        - "акт выдачи"
        - "форма МХ-3"
        - "проверка правомочий"
        - "предъявление документа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(выдач|возврат)(а|и)\\s+вещ"
        - "(?i)акт\\s+выдач"

  - id: "inspection_upon_return"
    name: "Проверка вещи при возврате (ст. 900 ГК РФ)"
    description: "Проверяет наличие условия о проверке вещи при возврате"
    legal_base: "ст. 900 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "проверка при возврате"
        - "осмотр при выдаче"
        - "претензии при выдаче"
        - "подписание акта возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)проверк(а|и).*при.*(возврат|выдач)"

  - id: "liability_for_loss_damage"
    name: "Ответственность за утрату, недостачу, повреждение (ст. 901, 902 ГК РФ)"
    description: "Проверяет условия ответственности хранителя"
    legal_base: "ст. 901, 902 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "независимо от вины"
        - "возмещение стоимости"
        - "полная материальная ответственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*за.*(утрат|поврежден|недостач)"

  - id: "extraordinary_expenses"
    name: "Чрезвычайные расходы на сохранность (ст. 898 ГК РФ)"
    description: "Проверяет условия возмещения чрезвычайных расходов"
    legal_base: "ст. 898 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "чрезвычайные расходы"
        - "неотложные меры"
        - "согласие поклажедателя"
        - "лимит расходов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)чрезвычайн(ые|ых)\\s+расход"

  - id: "exclusions_from_liability"
    name: "Обстоятельства, освобождающие от ответственности (ст. 901 ГК РФ)"
    description: "Проверяет перечень обстоятельств, освобождающих хранителя"
    legal_base: "ст. 901, 903 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "непреодолимая сила"
        - "форс-мажор"
        - "свойства вещи"
        - "вина поклажедателя"
        - "освобождается от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожда(ется|ться)\\s+от\\s+ответственност"

  - id: "pretension_order"
    name: "Претензионный порядок"
    description: "Проверяет наличие претензионного порядка"
    legal_base: "ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "претензионный порядок"
        - "претензия"
        - "досудебный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз(ия|ионн)"

  - id: "dispute_resolution"
    name: "Подсудность и разрешение споров"
    description: "Проверяет подсудность"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "подсудность"
        - "арбитражный суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"

  - id: "insurance"
    name: "Страхование хранимой вещи"
    description: "Проверяет условия страхования"
    legal_base: "ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "застраховать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "insurance_required"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          keyword_hints: ["обязан застраховать", "страхование обязательно"]
          description: "Обязательность страхования"
      store_payload: true

  - id: "confidentiality"
    name: "Конфиденциальность"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"

  - id: "vat_and_tax"
    name: "НДС и налоговые оговорки"
    description: "Проверяет налоговые аспекты"
    legal_base: "НК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"

  - id: "third_party_claims"
    name: "Требования третьих лиц к вещи (ст. 895, 896 ГК РФ)"
    description: "Проверяет процедуру при предъявлении требований третьими лицами"
    legal_base: "ст. 895, 896 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "требования третьих лиц"
        - "арест имущества"
        - "приостановление выдачи"
        - "уведомление поклажедателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)требовани(я|й)\\s+третьих\\s+лиц"
        - "(?i)арест\\s+имущества"

  - id: "natural_loss"
    name: "Естественная убыль (ст. 903 ГК РФ)"
    description: "Проверяет применение норм естественной убыли"
    legal_base: "ст. 903 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "естественная убыль"
        - "нормы естественной убыли"
        - "усушка"
        - "утруска"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)естественн(ая|ой)\\s+убыл"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  storage_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание вещи; (б) количество/вес/объём;
      (в) заявленную стоимость; (г) тип вещи (индивидуальная/родовая);
      (д) тип хранения (обычное/иррегулярное).
    addressee: "Обе стороны"

  storage_object_description:
    text: >
      Просим уточнить в {doc_names}: детальное описание вещи, количество,
      идентификационные признаки, заявленную стоимость.
    addressee: "Поклажедатель"

  professional_custodian_liability:
    text: >
      В {doc_names} хранитель осуществляет профессиональную деятельность.
      ОБЯЗАТЕЛЬНО: ответственность независимо от вины (ст. 901 ГК РФ),
      за исключением непреодолимой силы. Просим подтвердить/включить это условие.
    addressee: "Юридический советник"

  unlawful_liability_limitation_professional:
    text: >
      КРИТИЧЕСКОЕ НАРУШЕНИЕ: в {doc_names} профессиональный хранитель ограничивает
      ответственность формулировками «только при вине». Это противоречит ст. 901 ГК РФ
      и ничтожно. Просим немедленно исправить.
    addressee: "Юридический советник"

  liability_for_loss_damage:
    text: >
      Просим уточнить в {doc_names}: условия ответственности за утрату/повреждение,
      основание (независимо от вины / по вине), лимит, исключения.
    addressee: "Юридический советник"

  acceptance_documentation_check:
    text: >
      Просим уточнить в {doc_names}: (а) вид документа о приёме (акт МХ-1, расписка,
      складское свидетельство); (б) порядок и сроки выдачи; (в) ссылку на
      Постановление Росстата № 66.
    addressee: "Хранитель"

  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: процедуру приёма вещи, осмотр, фиксация состояния,
      форму акта.
    addressee: "Обе стороны"

  return_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок выдачи вещи, проверка правомочий
      получателя, форма акта выдачи (МХ-3).
    addressee: "Обе стороны"

  inspection_upon_return:
    text: >
      Просим включить в {doc_names}: обязательную проверку вещи при возврате,
      порядок фиксации недостачи/повреждений, срок предъявления претензий.
    addressee: "Поклажедатель"

  return_on_first_demand_check:
    text: >
      Просим подтвердить в {doc_names}: право поклажедателя забрать вещь в любой момент
      (ст. 904 ГК РФ), отсутствие штрафов за досрочный возврат.
    addressee: "Юридический советник"

  consumer_early_return_penalty:
    text: >
      ВНИМАНИЕ: в {doc_names} установлен штраф за досрочный возврат вещи потребителем.
      Это противоречит ст. 904 ГК РФ и ничтожно. Просим исключить.
    addressee: "Юридический советник"

  irregular_storage_terms:
    text: >
      В {doc_names} предусмотрено иррегулярное хранение. Просим уточнить:
      (а) условия смешения вещей; (б) требования к качеству (сорт, класс);
      (в) порядок возврата того же рода и качества; (г) долю в общей массе.
    addressee: "Обе стороны"

  uncollected_goods_disposal:
    text: >
      Просим включить в {doc_names}: процедуру реализации невостребованной вещи
      (ст. 899 ГК РФ): уведомление, срок, порядок продажи, распределение выручки.
    addressee: "Хранитель"

  dangerous_properties_disclosure:
    text: >
      В {doc_names} хранится потенциально опасная вещь. Просим включить:
      (а) обязанность поклажедателя раскрыть опасные свойства (ст. 893 ГК РФ);
      (б) право хранителя уничтожить опасную вещь за счёт поклажедателя (ст. 894 ГК РФ);
      (в) ответственность за сокрытие.
    addressee: "Юридический советник"

  dangerous_goods_storage_without_license:
    text: >
      ВНИМАНИЕ: в {doc_names} предусмотрено хранение опасных веществ.
      Просим предоставить подтверждение наличия лицензии на данный вид деятельности.
    addressee: "Хранитель"

  warehouse_certificate_issuance:
    text: >
      Просим уточнить в {doc_names}: (а) вид складского свидетельства (простое / двойное);
      (б) порядок выдачи; (в) возможность передачи и залога;
      (г) ссылку на ст. 912 ГК РФ.
    addressee: "Хранитель"

  lien_right_on_item:
    text: >
      Просим уточнить в {doc_names}: право хранителя удерживать вещь до оплаты
      вознаграждения и возмещения расходов (ст. 359, 920 ГК РФ).
    addressee: "Юридический советник"

  natural_loss_norms:
    text: >
      Просим включить в {doc_names}: ссылку на утверждённые нормы естественной убыли,
      освобождение от ответственности в пределах норм (ст. 903 ГК РФ).
    addressee: "Юридический советник"

  natural_loss:
    text: >
      Просим уточнить в {doc_names}: применение норм естественной убыли,
      ответственность за недостачу сверх норм.
    addressee: "Обе стороны"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование,
      ИНН, ОГРН, адрес.
    addressee: "Обе стороны"

  storage_term:
    text: >
      Просим уточнить в {doc_names}: срок хранения или условие «до востребования».
    addressee: "Обе стороны"

  remuneration_and_expenses:
    text: >
      Просим подтвердить по {doc_names}: (а) размер вознаграждения;
      (б) является ли хранение безвозмездным; (в) порядок возмещения расходов.
    addressee: "Обе стороны"

  storage_conditions:
    text: >
      Просим уточнить в {doc_names}: требования к условиям хранения
      (температура, влажность, освещённость).
    addressee: "Хранитель"

  extraordinary_expenses:
    text: >
      Просим включить в {doc_names}: условия возмещения чрезвычайных расходов
      на сохранность (ст. 898 ГК РФ), лимит расходов без согласования.
    addressee: "Юридический советник"

  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      от ответственности (непреодолимая сила, свойства вещи, вина поклажедателя).
    addressee: "Юридический советник"

  third_party_claims:
    text: >
      Просим включить в {doc_names}: процедуру при предъявлении требований
      третьими лицами (арест, залог): уведомление поклажедателя, приостановление выдачи.
    addressee: "Юридический советник"

  pretension_order:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок, сроки претензий.
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок.
    addressee: "Юридический советник"

  insurance:
    text: >
      Просим уточнить в {doc_names}: условия страхования вещи, кто страхует,
      минимальную страховую сумму.
    addressee: "Обе стороны"

  confidentiality:
    text: >
      Просим включить в {doc_names}: условие о конфиденциальности сведений о вещи.
    addressee: "Юридический советник"

  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС, порядок документооборота.
    addressee: "Бухгалтерия"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
