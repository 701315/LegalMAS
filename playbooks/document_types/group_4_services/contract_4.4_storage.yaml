# CHECK 7: Реализация невостребованной вещи (ст. 899 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: uncollected_goods_disposal
    name: "Реализация невостребованной вещи (ст. 899 ГК РФ)"
    description: >
      Фактографическая проверка процедуры реализации невостребованной вещи:
      уведомление поклажедателя, срок, порядок продажи, распределение выручки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "невостребованная вещь"
        - "реализация"
        - "продажа"
        - "уведомление"
        - "письменное предупреждение"
        - "по цене, сложившейся в месте хранения"
        - "остаток возвращается"
        - "ст. 899"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)невостребованн(ая|ой)\\s+вещ"
        - "(?i)продат(ь|ся).*невостребованн"
        - "(?i)ст\\.?\\s*899"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 899 ГК РФ).
        Проверяется только один вопрос: процедура реализации невостребованной вещи.
        Нормативный ориентир:
        - ст. 899 ГК РФ — реализация невостребованной вещи
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли процедура реализации невостребованной вещи.
        2. Установлен ли срок уведомления поклажедателя.
        3. Определён ли порядок продажи (рыночная цена / аукцион / иной).
        4. Удерживаются ли расходы из выручки.
        5. Возвращается ли остаток выручки поклажедателю.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Если вещь не востребована в течение 30 дней после письменного
        предупреждения, Хранитель вправе реализовать её по цене, сложившейся
        в месте хранения. Из выручки удерживаются расходы на хранение.
        Остаток возвращается Поклажедателю."
        Ответ:
        {
          "disposal_procedure_status": "defined",
          "notice_period_status": "defined",
          "notice_period_value": "30 дней после письменного предупреждения",
          "sale_basis": "market_price",
          "expenses_deducted": "yes",
          "remainder_returned": "yes",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Если вещь не востребована в течение 30 дней после письменного предупреждения, Хранитель вправе реализовать её по цене, сложившейся в месте хранения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь до востребования."
        Ответ:
        {
          "disposal_procedure_status": "not_defined",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "sale_basis": "not_defined",
          "expenses_deducted": "not_defined",
          "remainder_returned": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли процедура реализации невостребованной вещи?
        2. Установлен ли срок уведомления?
        3. Определён ли порядок продажи?
        4. Удерживаются ли расходы из выручки?
        5. Возвращается ли остаток?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disposal_procedure_status": "<defined / not_defined>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_value": "<текст или 'Данные не определены'>",
          "sale_basis": "<market_price / auction / other / not_defined>",
          "expenses_deducted": "<yes / no / not_defined>",
          "remainder_returned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
      retrieval:
        retrieval_profile: "termination_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "невостребованная вещь реализация продажа уведомление письменное предупреждение по цене сложившейся в месте хранения остаток возвращается ст. 899"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
          - remedies
        negative_keywords:
          - "вознаграждение"
          - "ответственность за утрату"
          - "возврат вещи"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.50, 0.90]
          boost: 0.12
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
            - "remedies"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 500
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора хранения сведения
          о процедуре реализации невостребованной вещи.
          Не анализируй иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. disposal_procedure_status — "defined" или "not_defined".
          2. notice_period_status — "defined" или "not_defined".
          3. notice_period_value — срок уведомления.
          4. sale_basis — market_price / auction / other / not_defined.
          5. expenses_deducted — yes / no / not_defined.
          6. remainder_returned — yes / no / not_defined.
          Если данные отсутствуют: указывай "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Не выводи процедуру из нормы ст. 899 ГК РФ.
          - Верни только JSON.
          </rules>
        fields:
          - name: "disposal_procedure_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус наличия процедуры реализации."
            required: true
          - name: "notice_period_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус указания срока уведомления."
            required: false
          - name: "notice_period_value"
            type: "string"
            presentation: "fact"
            label: "Срок уведомления"
            description: "Срок уведомления поклажедателя о реализации."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "sale_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["market_price", "auction", "other", "not_defined"]
            description: "Порядок продажи невостребованной вещи."
            required: false
          - name: "expenses_deducted"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Удерживаются ли расходы из выручки."
            required: false
          - name: "remainder_returned"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Возвращается ли остаток выручки поклажедателю."
            required: false
    store_payload: true
