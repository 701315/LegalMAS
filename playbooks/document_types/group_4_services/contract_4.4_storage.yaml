      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 887 ГК РФ).
        Проверяется только один вопрос: документальное подтверждение приёма вещи.
        Нормативный ориентир:
        - ст. 887 ГК РФ — форма договора хранения
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли документ о приёме вещи на хранение.
        2. Вид документа (акт МХ-1 / расписка / свидетельство / иной).
        3. Когда выдаётся документ (при приёме / в течение срока).
        4. Указана ли форма документа или ссылка на Постановление Росстата.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Приём вещи на хранение оформляется актом приёма-передачи по форме
        МХ-1, утверждённой Постановлением Росстата № 66. Акт составляется
        в двух экземплярах при передаче вещи."
        Ответ:
        {
          "acceptance_doc_status": "defined",
          "acceptance_doc_type": "act_mh1",
          "when_issued": "upon_acceptance",
          "form_reference_status": "defined",
          "form_reference_value": "форма МХ-1, Постановление Росстата № 66",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Приём вещи на хранение оформляется актом приёма-передачи по форме МХ-1, утверждённой Постановлением Росстата № 66."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя."
        Ответ:
        {
          "acceptance_doc_status": "not_defined",
          "acceptance_doc_type": "not_defined",
          "when_issued": "not_defined",
          "form_reference_status": "not_defined",
          "form_reference_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание документа о приёме?
        2. Определён ли вид документа?
        3. Указан ли момент выдачи документа?
        4. Есть ли ссылка на форму или Постановление Росстата?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "acceptance_doc_status": "<defined / not_defined>",
          "acceptance_doc_type": "<act_mh1 / custody_receipt / warehouse_certificate / other / not_defined>",
          "when_issued": "<upon_acceptance / within_days / not_defined>",
          "form_reference_status": "<defined / not_defined>",
          "form_reference_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450
      retrieval:
        retrieval_profile: "acceptance_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "акт приёма-передачи форма МХ-1 сохранная расписка складское свидетельство документальное подтверждение приём на хранение"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
          - obligations
        negative_keywords:
          - "вознаграждение"
          - "ответственность"
          - "возврат вещи"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.10, 0.50]
          boost: 0.18
          scope: segment
        context_k: 4
        max_chunks: 6
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
            - "obligations"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 500
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора хранения сведения
          о документальном подтверждении приёма вещи.
          Не анализируй иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. acceptance_doc_status — "defined" или "not_defined".
          2. acceptance_doc_type — act_mh1 / custody_receipt / warehouse_certificate / other / not_defined.
          3. when_issued — upon_acceptance / within_days / not_defined.
          4. form_reference_status — "defined" или "not_defined".
          5. form_reference_value — формулировка о форме документа.
          Если данные отсутствуют: указывай "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - acceptance_doc_type: "act_mh1" — акт по форме МХ-1;
            "custody_receipt" — сохранная расписка;
            "warehouse_certificate" — складское свидетельство;
            "other" — иной документ; "not_defined" — не указан.
          - Верни только JSON.
