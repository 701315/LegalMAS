# CHECK 3: Документальное подтверждение приёма вещи (ст. 887 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: acceptance_documentation_check
    name: "Документальное подтверждение приёма вещи (ст. 887 ГК РФ, форма МХ-1)"
    description: >
      Фактографическая проверка наличия условия о документальном подтверждении
      приёма вещи на хранение: акт приёма-передачи (форма МХ-1), сохранная расписка,
      складское свидетельство, порядок и сроки выдачи документа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "акт приёма-передачи"
        - "форма МХ-1"
        - "сохранная расписка"
        - "складское свидетельство"
        - "документальное подтверждение"
        - "передаточный акт"
        - "Постановление Росстата № 66"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*приёма.*передачи"
        - "(?i)форм(а|е)\\s+МХ[\\s-]*1"
        - "(?i)сохранн(ая|ой)\\s+расписк"
