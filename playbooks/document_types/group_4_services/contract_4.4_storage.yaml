  security_seal:
    any_keywords:
      - "(?i)\\bпломб[ааы]\\b"
      - "(?i)опломбировани[ея]"
      - "(?i)вскрыти[ея]\\s+пломб[ыы]"
      - "(?i)нарушени[ея]\\s+целостност[ии]"
      - "(?i)запечатывани[ея]"
  gratuitous_storage:
    any_keywords:
      - "(?i)безвозмездн[оа]е\\s+хранени[ея]"
      - "(?i)бесплатн[оа]е\\s+хранени[ея]"
      - "(?i)без\\s+вознаграждени[яя]"
      - "(?i)\\bгардероб\\b"
      - "(?i)не\\s+взимаетс[яьа]\\s+плат[аа]"
  third_party_transfer:
    any_keywords:
      - "(?i)передач[аа]\\s+третьему\\s+лиц[уу]"
      - "(?i)\\bсубхранени[ея]\\b"
      - "(?i)привлечени[ея]\\s+третьего\\s+лиц[аа]"
      - "(?i)передовери[ея]\\s+хранени[яя]"
      - "(?i)с\\s+согласием\\s+поклажедател[яя]"
  high_value_items:
    any_keywords:
      - "(?i)\\bценност[ии]\\b"
      - "(?i)драгоценност[ии]"
      - "(?i)ювелирн[ыо]е\\s+издели[яя]"
      - "(?i)\\bантиквариат\\b"
      - "(?i)произведени[яя]\\s+искусств[аа]"
  customs_warehouse:
    any_keywords:
      - "(?i)таможенн[ыо]й\\s+склад"
      - "(?i)временн[оа]е\\s+хранени[ея]"
      - "(?i)таможенн[а-яё]+\\s+оформлени[ея]"
      - "(?i)\\bСВХ\\b"
  cold_chain:
    any_keywords:
      - "(?i)холодов[а-яё]+\\s+цеп[ььи]"
      - "(?i)\\bcold\\s+chain\\b"
      - "(?i)\\bрефрижератор\\b"
      - "(?i)термоконтейнер"
      - "(?i)фармацевтическ[оа]е\\s+хранени[ея]"
      - "(?i)лекарственн[ыо]е\\s+средств[аа]"

# ════════════════════════════════════════════════════════════════════════════
