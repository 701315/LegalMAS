      store_payload: true

  - id: perishable_goods_sale
    name: "Продажа портящейся вещи (п. 2 ст. 899 ГК РФ)"
    description: >
      Фактографическая проверка условия о праве хранителя продать вещь,
      подверженную быстрой порче, по цене, сложившейся в месте хранения,
      с последующей передачей выручки поклажедателю. Правовой ориентир —
      п. 2 ст. 899 ГК РФ.
    triggers:
      any: ["perishable_goods_storage"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "портящаяся вещь"
        - "подверженная быстрой порче"
        - "реализация портящейся"
        - "продажа вещи"
        - "по цене, сложившейся в месте хранения"
        - "уведомление о продаже"
        - "ст. 899"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(портящ|быстр(ой|о)).*порч"
        - "(?i)(продаж|реализац).*(портящ|испорч)"
        - "(?i)по\\s+цене.*мест.*хранени"
        - "(?i)ст\\.?\\s*899"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (п. 2 ст. 899 ГК РФ).
        Проверяется один вопрос: продажа вещи, подверженной быстрой порче,
        с последующей передачей выручки поклажедателю.
        Нормативный ориентир:
        - п. 2 ст. 899 ГК РФ — если вещь, сданная на хранение, подвергается
          быстрой порче и возникает угроза её уничтожения, хранитель вправе
          самостоятельно продать её по цене, сложившейся в месте хранения,
          с передачей вырученной суммы поклажедателю (за вычетом сумм,
          причитающихся хранителю).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи механизм из п. 2 ст. 899 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право хранителя продать портящуюся вещь.
        2. Указан ли порядок определения цены (по цене, сложившейся
          в месте хранения / иной).
        3. Требуется ли уведомление поклажедателя перед продажей.
        4. Указано ли, что выручка передаётся поклажедателю.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (perishable_sale_status /
            price_determination_status / notification_before_sale_status /
            proceeds_transfer_status) → "not_defined";
          - текстовое поле (perishable_sale_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. perishable_sale_status = "defined" — если прямо предусмотрена
          продажа вещи, подверженной быстрой порче.
        5. price_determination_status = "defined" — если прямо указан порядок
          определения цены. Значение — текстом (например, «по цене,
          сложившейся в месте хранения»).
        6. notification_before_sale_status = "yes" — если прямо указана
          обязанность уведомить поклажедателя о продаже.
        7. proceeds_transfer_status = "yes" — если прямо указано,
          что выручка передаётся поклажедателю.
        8. perishable_sale_details — порядок продажи, порядок расчёта, срок
          передачи выручки.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Если вещь, сданная на хранение, подвергнется быстрой порче,
        Хранитель вправе самостоятельно продать её по цене, сложившейся
        в месте хранения, уведомив Поклажедателя в течение 24 часов.
        Вырученная сумма передаётся Поклажедателю за вычетом сумм,
        причитающихся Хранителю."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "defined",
          "price_determination_details": "по цене, сложившейся в месте хранения",
          "notification_before_sale_status": "yes",
          "proceeds_transfer_status": "yes",
          "perishable_sale_details": "уведомление в течение 24 часов; выручка передаётся Поклажедателю за вычетом сумм Хранителя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Если вещь, сданная на хранение, подвергнется быстрой порче, Хранитель вправе самостоятельно продать её по цене, сложившейся в месте хранения, уведомив Поклажедателя в течение 24 часов."
            }
          ]
        }

        Пример 2 (без уведомления):
        Фрагмент:
        "Хранитель вправе реализовать вещь, подверженную быстрой порче,
        по рыночной цене с зачислением выручки на счёт Поклажедателя."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "defined",
          "price_determination_details": "по рыночной цене",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "yes",
          "perishable_sale_details": "зачисление выручки на счёт Поклажедателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе реализовать вещь, подверженную быстрой порче, по рыночной цене с зачислением выручки на счёт Поклажедателя."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Портящиеся товары могут быть реализованы Хранителем."
        Ответ:
        {
          "perishable_sale_status": "defined",
          "price_determination_status": "not_defined",
          "price_determination_details": "Данные не определены",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "not_defined",
          "perishable_sale_details": "реализация портящихся товаров хранителем (без деталей)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Портящиеся товары могут быть реализованы Хранителем."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "perishable_sale_status": "not_defined",
          "price_determination_status": "not_defined",
          "price_determination_details": "Данные не определены",
          "notification_before_sale_status": "not_defined",
          "proceeds_transfer_status": "not_defined",
          "perishable_sale_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли продажа портящейся вещи?
        2. Определён ли порядок цены?
        3. Указано ли уведомление поклажедателя?
        4. Указано ли, что выручка передаётся поклажедателю?
        5. Выведен ли механизм из текста договора, а не из п. 2 ст. 899 ГК РФ?
        6. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "perishable_sale_status": "<defined / not_defined>",
          "price_determination_status": "<defined / not_defined>",
          "price_determination_details": "<текст или 'Данные не определены'>",
          "notification_before_sale_status": "<yes / no / not_defined>",
          "proceeds_transfer_status": "<yes / no / not_defined>",
          "perishable_sale_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "портящаяся вещь подверженная быстрой порче реализация портящейся продажа вещи по цене сложившейся в месте хранения уведомление о продаже выручка поклажедателю ст. 899"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
