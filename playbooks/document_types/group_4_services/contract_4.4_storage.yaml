        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный, закрытый перечень):
        Фрагмент:
        "Хранитель освобождается от ответственности, если утрата, недостача
        или повреждение вещи произошли вследствие непреодолимой силы,
        свойств вещи, о которых Хранитель не знал и не должен был знать,
        либо умысла или грубой неосторожности Поклажедателя."
        Ответ:
        {
          "exclusions_status": "defined",
          "exclusions_types": "force_majeure; item_properties; depositor_intent; depositor_gross_negligence",
          "exclusions_details": "непреодолимая сила; свойства вещи, о которых хранитель не знал и не должен был знать; умысел или грубая неосторожность поклажедателя",
          "open_list_status": "no",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель освобождается от ответственности, если утрата, недостача или повреждение вещи произошли вследствие непреодолимой силы, свойств вещи, о которых Хранитель не знал и не должен был знать, либо умысла или грубой неосторожности Поклажедателя."
            }
          ]
        }

        Пример 2 (открытый перечень):
        Фрагмент:
        "Хранитель не несёт ответственности за утрату или повреждение вещи
        вследствие непреодолимой силы, а также иных обстоятельств,
