        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "perishable_goods_sale_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о продаже вещи, подверженной быстрой порче.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. perishable_goods_sale_presence:
           Агрегатное signal-поле — наличие условий о продаже портящейся вещи.
           - "present" — если хотя бы одно из содержательных полей
             (perishable_sale_status, price_determination_status,
              notification_before_sale_status, proceeds_transfer_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - perishable_sale_status = "not_defined";
           - price_determination_status = "not_defined";
           - notification_before_sale_status = "not_defined";
           - proceeds_transfer_status = "not_defined";
           - price_determination_details = "Данные не определены";
           - perishable_sale_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. perishable_sale_status:
           - "defined" — если в тексте прямо предусмотрена продажа вещи,
             подверженной быстрой порче, либо прямо указано, что такая
             продажа не допускается (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. price_determination_status:
           - "defined" — если прямо указан порядок определения цены
             (по цене, сложившейся в месте хранения, по рыночной цене,
             по оценке);
           - "not_defined" — если порядок прямо не указан.

        3. price_determination_details:
           Краткая user-facing формулировка порядка определения цены.
           Fallback: "Данные не определены" / "Не удалось определить".

        4. notification_before_sale_status:
           - "yes" — прямо указана обязанность уведомить поклажедателя
             перед продажей;
           - "no" — прямо указано, что уведомление не требуется;
           - "not_defined" — прямо не указано.

        5. proceeds_transfer_status:
           - "yes" — прямо указано, что выручка передаётся поклажедателю;
           - "no" — прямо указано, что выручка поклажедателю не передаётся;
           - "not_defined" — прямо не указано.

        6. perishable_sale_details:
           Краткая user-facing формулировка порядка продажи, расчёта
           и передачи выручки.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни perishable_goods_sale_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи механизм из п. 2 ст. 899 ГК РФ — только из текста.
        - perishable_sale_status = "defined" — при прямом указании продажи
          портящейся вещи, либо при прямом указании, что такая продажа
          не допускается.
        - price_determination_status = "defined" — при прямом указании порядка цены.
        - notification_before_sale_status = "yes" / "no" — по прямому указанию.
        - proceeds_transfer_status = "yes" / "no" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни продажи портящейся вещи, ни порядка цены,
           ни уведомления, ни передачи выручки.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Продажа упомянута без деталей.
           Например: "Портящиеся товары могут быть реализованы Хранителем",
           без указания порядка цены и передачи выручки.
           → presence = "present";
             perishable_sale_status = "defined";
             price_determination_status = "not_defined";
             notification_before_sale_status = "not_defined";
             proceeds_transfer_status = "not_defined";
             perishable_sale_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные порядки продажи
           или разные условия передачи выручки.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             текстовые поля = "Не удалось определить".

        4. Прямой запрет продажи.
           В договоре прямо указано, что хранитель не вправе продавать
           вещь даже при быстрой порче.
           → presence = "present";
             perishable_sale_status = "defined" (прямое регулирование);
             perishable_sale_details содержит дословную цитату запрета;
             остальные содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для perishable_goods_sale_presence используй только: "present", "missing", "unclear".
        - Для perishable_sale_status и price_determination_status используй только: "defined", "not_defined".
        - Для notification_before_sale_status и proceeds_transfer_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * price_determination_details, perishable_sale_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * price_determination_details, perishable_sale_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "perishable_goods_sale_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о продаже портящейся вещи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "perishable_sale_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о продаже портящейся вещи. Внутреннее enum-поле."
          label: "Продажа портящейся вещи"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "price_determination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о порядке цены. Внутреннее enum-поле."
          required: true

        - name: "price_determination_details"
          type: "string"
          presentation: "fact"
          label: "Порядок цены"
          description: >
            Порядок определения цены продажи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "notification_before_sale_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность уведомить поклажедателя. Внутреннее enum-поле."
          label: "Уведомление о продаже"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "proceeds_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Передача выручки поклажедателю. Внутреннее enum-поле."
          label: "Передача выручки"
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "perishable_sale_details"
          type: "string"
          presentation: "fact"
          label: "Порядок продажи"
          description: >
            Порядок продажи, расчёта и передачи выручки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: late_return_liability
    name: "Ответственность хранителя за просрочку возврата вещи (ст. 904 ГК РФ)"
    description: >
      Фактографическая проверка условия об ответственности хранителя
      за несвоевременный возврат вещи по требованию поклажедателя:
      форма ответственности (пеня / проценты / убытки / иное), размер,
      база начисления, порядок расчёта и наличие лимита.
      Правовой ориентир — ст. 904 ГК РФ (обязанность возврата по первому
      требованию), ст. 395 ГК РФ (проценты за пользование чужими денежными
      средствами), ст. 330 ГК РФ (неустойка).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "просрочка возврата"
        - "несвоевременный возврат"
        - "ответственность за просрочку"
        - "пеня за просрочку возврата"
        - "неустойка за просрочку"
        - "проценты по ст. 395"
        - "за каждый день просрочки"
        - "срок возврата вещи"
        - "нарушение срока возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)просрочк(а|и|у).*(возврат|выдач)"
        - "(?i)(пен[яию]|неустойк[аиу]).*просрочк"
        - "(?i)за\\s+кажды[йе]\\s+день\\s+просрочк"
        - "(?i)ст\\.?\\s*(395|330)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 904, 395, 330 ГК РФ).
        Проверяется один вопрос: ответственность хранителя за просрочку
        возврата вещи по требованию поклажедателя.
        Нормативные ориентиры:
        - ст. 904 ГК РФ — поклажедатель вправе потребовать возврата вещи
          в любой момент; хранитель обязан возвратить вещь по первому
          требованию;
        - ст. 330 ГК РФ — неустойка (штраф, пеня) как способ обеспечения;
        - ст. 395 ГК РФ — проценты за пользование чужими денежными
          средствами при отсутствии договорной неустойки.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи форму ответственности из ст. 395 ГК РФ — фиксируй только
          то, что прямо написано в договоре.
        - Отсутствие условия — не "пеня", не "проценты", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли ответственность хранителя за просрочку возврата.
        2. Форма ответственности: пеня, неустойка, проценты, убытки, иное.
        3. База начисления и ставка (процент от стоимости вещи / от суммы
          вознаграждения / фиксированная сумма).
        4. Порядок расчёта (за каждый день, единовременно, иное).
        5. Наличие лимита (потолка) ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (late_return_liability_status /
            late_return_penalty_form / late_return_cap_status) →
            "not_defined";
          - текстовые поля (late_return_penalty_value /
            late_return_calculation_details / late_return_cap_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. late_return_liability_status = "defined" — если прямо указана
          ответственность за просрочку возврата вещи (в любой формулировке).
        5. late_return_penalty_form:
          - "penalty" — пеня за каждый день просрочки;
          - "interest" — проценты (по ставке рефинансирования / ключевой
            ставке / ст. 395 ГК РФ);
          - "damages" — возмещение убытков;
          - "other" — прямо названная иная форма;
          - "not_defined" — форма прямо не указана.
        6. late_return_penalty_value — размер ставки или сумма с единицей
          измерения («0,1% от стоимости вещи за каждый день просрочки»,
          «5 000 руб. в день»). Не голое число.
        7. late_return_cap_status = "defined" — если прямо указан лимит
          (потолок) ответственности. late_return_cap_value — значение лимита
          с единицей измерения.
        8. late_return_calculation_details — порядок расчёта: с какого момента
          начисляется, за какой период, на какую базу.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный — пеня с лимитом):
        Фрагмент:
        "За нарушение срока возврата вещи Хранитель уплачивает Поклажедателю
        пеню в размере 0,1% от заявленной стоимости вещи за каждый день
        просрочки, но не более 10% от заявленной стоимости вещи."
        Ответ:
        {
          "late_return_liability_status": "defined",
          "late_return_penalty_form": "penalty",
          "late_return_penalty_value": "0,1% от заявленной стоимости вещи за каждый день просрочки",
          "late_return_cap_status": "defined",
          "late_return_cap_value": "не более 10% от заявленной стоимости вещи",
          "late_return_calculation_details": "начисляется за каждый день просрочки возврата; база — заявленная стоимость вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "За нарушение срока возврата вещи Хранитель уплачивает Поклажедателю пеню в размере 0,1% от заявленной стоимости вещи за каждый день просрочки, но не более 10% от заявленной стоимости вещи."
            }
          ]
        }

        Пример 2 (проценты по ст. 395 ГК РФ):
        Фрагмент:
        "За просрочку возврата вещи Хранитель уплачивает проценты
        по ст. 395 ГК РФ."
        Ответ:
        {
          "late_return_liability_status": "defined",
          "late_return_penalty_form": "interest",
          "late_return_penalty_value": "проценты по ст. 395 ГК РФ",
          "late_return_cap_status": "not_defined",
          "late_return_cap_value": "Данные не определены",
          "late_return_calculation_details": "по ключевой ставке Банка России (ст. 395 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "За просрочку возврата вещи Хранитель уплачивает проценты по ст. 395 ГК РФ."
            }
          ]
        }

        Пример 3 (только упоминание ответственности без деталей):
        Фрагмент:
        "Хранитель несёт ответственность за несвоевременный возврат вещи."
        Ответ:
        {
          "late_return_liability_status": "defined",
          "late_return_penalty_form": "not_defined",
          "late_return_penalty_value": "Данные не определены",
          "late_return_cap_status": "not_defined",
          "late_return_cap_value": "Данные не определены",
          "late_return_calculation_details": "ответственность за несвоевременный возврат (форма и размер не указаны)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель несёт ответственность за несвоевременный возврат вещи."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "late_return_liability_status": "not_defined",
          "late_return_penalty_form": "not_defined",
          "late_return_penalty_value": "Данные не определены",
          "late_return_cap_status": "not_defined",
          "late_return_cap_value": "Данные не определены",
          "late_return_calculation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли ответственность хранителя за просрочку возврата?
        2. Определена ли форма (пеня / проценты / убытки / иное)?
        3. Указана ли ставка или сумма с единицей измерения?
        4. Приведён ли порядок расчёта?
        5. Указан ли лимит ответственности?
        6. Выведена ли форма ответственности из текста договора, а не из
          ст. 395 ГК РФ?
        7. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "late_return_liability_status": "<defined / not_defined>",
          "late_return_penalty_form": "<penalty / interest / damages / other / not_defined>",
          "late_return_penalty_value": "<текст или 'Данные не определены'>",
          "late_return_cap_status": "<defined / not_defined>",
          "late_return_cap_value": "<текст или 'Данные не определены'>",
          "late_return_calculation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "просрочка возврата несвоевременный возврат ответственность за просрочку пеня за просрочку возврата неустойка за просрочку проценты по ст. 395 ГК РФ за каждый день просрочки срок возврата вещи нарушение срока возврата лимит ответственности"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "remedies"
          - "limitations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "late_return_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об ответственности хранителя за просрочку возврата вещи:
        форму, размер, порядок расчёта, лимит.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. late_return_liability_presence:
           Агрегатное signal-поле — наличие условия об ответственности
           хранителя за просрочку возврата вещи.
           - "present" — если хотя бы одно из содержательных полей
             (late_return_liability_status, late_return_penalty_form,
              late_return_cap_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_return_liability_status = "not_defined";
           - late_return_penalty_form = "not_defined";
           - late_return_cap_status = "not_defined";
           - late_return_penalty_value = "Данные не определены";
           - late_return_calculation_details = "Данные не определены";
           - late_return_cap_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. late_return_liability_status:
           - "defined" — если в тексте прямо указана ответственность
             хранителя за просрочку возврата вещи (в любой формулировке),
             либо прямо указано, что такая ответственность не применяется
             (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. late_return_penalty_form:
           - "penalty" — пеня за каждый день просрочки;
           - "interest" — проценты (по ставке рефинансирования / ключевой
             ставке / ст. 395 ГК РФ);
           - "damages" — возмещение убытков;
           - "other" — прямо названная иная форма;
           - "not_defined" — форма прямо не указана.

        3. late_return_penalty_value:
           Краткая user-facing формулировка ставки или суммы с единицей
           измерения («0,1% от стоимости вещи за каждый день просрочки»,
            «5 000 руб. в день»).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. late_return_cap_status:
           - "defined" — если в тексте прямо указан лимит (потолок)
             ответственности;
           - "not_defined" — если прямого указания нет.

        5. late_return_cap_value:
           Краткая user-facing формулировка значения лимита с единицей
           измерения («не более 10% от стоимости вещи», «не более
            500 000 рублей»).
           Fallback: "Данные не определены" / "Не удалось определить".

        6. late_return_calculation_details:
           Краткая user-facing формулировка порядка расчёта: с какого
           момента начисляется, за какой период, на какую базу.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни late_return_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", late_return_penalty_form = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, естественную убыль
          и иные нерелевантные темы.
        - Не выводи форму ответственности из ст. 395 ГК РФ — только из текста.
        - late_return_penalty_value — всегда с единицей измерения.
        - late_return_cap_status = "defined" — при прямом указании лимита.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности за просрочку возврата,
           ни формы, ни лимита.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Ответственность упомянута без деталей.
           Например: "Хранитель несёт ответственность за несвоевременный
           возврат вещи", без указания формы и размера.
           → presence = "present";
             late_return_liability_status = "defined";
             late_return_penalty_form = "not_defined";
             late_return_penalty_value = "Данные не определены";
             late_return_cap_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные формы ответственности
           или разные ставки.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание об отсутствии ответственности.
           В договоре прямо указано, что хранитель не несёт ответственности
           за просрочку возврата, либо ответственность ограничена
           символической суммой.
           → presence = "present";
             late_return_liability_status = "defined" (прямое регулирование);
             late_return_calculation_details содержит дословную цитату;
             остальные содержательные поля = "not_defined" (если прямо не указаны).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для late_return_liability_presence используй только: "present", "missing", "unclear".
        - Для late_return_liability_status и late_return_cap_status используй только: "defined", "not_defined".
        - Для late_return_penalty_form используй только: "penalty", "interest", "damages", "other", "not_defined".
        - Fallback при отсутствии данных:
          * late_return_penalty_value, late_return_cap_value,
            late_return_calculation_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * late_return_penalty_value, late_return_cap_value,
            late_return_calculation_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "late_return_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия об ответственности за просрочку возврата. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_return_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие ответственности за просрочку возврата. Внутреннее enum-поле."
          label: "Ответственность за просрочку возврата"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "late_return_penalty_form"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["penalty", "interest", "damages", "other", "not_defined"]
          description: "Форма ответственности за просрочку возврата. Внутреннее enum-поле."
          label: "Форма ответственности"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "late_return_penalty_value"
          type: "string"
          presentation: "fact"
          label: "Размер ответственности"
          description: >
            Ставка или сумма ответственности за просрочку возврата. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "late_return_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие лимита ответственности за просрочку возврата. Внутреннее enum-поле."
          required: true

        - name: "late_return_cap_value"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности"
          description: >
            Значение лимита ответственности за просрочку возврата. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "late_return_calculation_details"
          type: "string"
          presentation: "fact"
          label: "Порядок расчёта"
          description: >
            Порядок расчёта ответственности за просрочку возврата. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: wrongful_return_risk
    name: "Возврат вещи ненадлежащему лицу: правила и ответственность"
    description: >
      Фактографическая проверка правил о возврате вещи: кому именно
      возвращается вещь (поклажедателю / указанному им лицу / предъявителю),
      какие документы подтверждают право на получение, и предусмотрена ли
      ответственность хранителя за выдачу вещи ненадлежащему лицу.
      Правовой ориентир — п. 1 ст. 900 ГК РФ (возврат поклажедателю или
      указанному им лицу), ст. 312 ГК РФ (исполнение надлежащему лицу),
      ст. 401, 402 ГК РФ (ответственность за действия работников).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "выдача вещи"
        - "возврат вещи надлежащему лицу"
        - "уполномоченный получатель"
        - "предъявитель документа"
        - "проверка полномочий получателя"
        - "доверенность на получение"
        - "ответственность за выдачу"
        - "ненадлежащее лицо"
        - "подпись получателя"
        - "сверка документов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выдач[аиу].*(надлежащ|уполномочен|не\\s+тому)"
        - "(?i)(предъяв|предоставлени).*(документ|доверенност|паспорт)"
        - "(?i)проверк[аиу].*(полномоч|правомоч|подпис)"
        - "(?i)ответственност.*выдач"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 900, 312, 401 ГК РФ).
        Проверяется один вопрос: кому возвращается вещь, какие документы
        подтверждают право на получение и предусмотрена ли ответственность
        хранителя за выдачу вещи ненадлежащему лицу.
        Нормативные ориентиры:
        - п. 1 ст. 900 ГК РФ — хранитель обязан возвратить вещь
          поклажедателю или лицу, указанному им в качестве получателя;
        - ст. 312 ГК РФ — исполнение надлежащему лицу; должник вправе
          требовать доказательств того, что исполнение принимается самим
          кредитором или управомоченным им лицом;
        - ст. 401, 402 ГК РФ — ответственность должника за действия
          своих работников.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи правила из ст. 312 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли, кому именно возвращается вещь (поклажедателю /
          указанному им лицу / предъявителю / иное).
        2. Указаны ли документы, подтверждающие право на получение вещи
          (паспорт, доверенность, документ о полномочиях).
        3. Предусмотрена ли обязанность хранителя проверять полномочия
          получателя.
        4. Предусмотрена ли ответственность хранителя за выдачу вещи
          ненадлежащему лицу.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (return_addressee_rules_status /
            authority_verification_status /
            wrongful_return_liability_status) → "not_defined";
          - текстовое поле (wrongful_return_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. return_addressee_rules_status = "defined" — если прямо указано,
          кому возвращается вещь и/или какие документы подтверждают право
          на получение.
        5. authority_verification_status:
          - "yes" — прямо указана обязанность проверять полномочия
            получателя (паспорт, доверенность, документ о полномочиях);
          - "no" — прямо указано, что проверка не требуется;
          - "not_defined" — прямо не указано.
        6. wrongful_return_liability_status = "defined" — если прямо
          предусмотрена ответственность хранителя за выдачу вещи
          ненадлежащему лицу.
        7. wrongful_return_details — конкретная формулировка из текста:
          правила о получателе, перечень документов, порядок проверки,
          формулировка об ответственности.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Вещь возвращается Поклажедателю либо лицу, указанному им
        в письменном распоряжении. При выдаче вещи иному лицу Хранитель
        обязан проверить паспорт получателя и доверенность с подтверждением
        полномочий на получение вещи. Хранитель несёт ответственность
        за выдачу вещи ненадлежащему лицу."
        Ответ:
        {
          "return_addressee_rules_status": "defined",
          "authority_verification_status": "yes",
          "wrongful_return_liability_status": "defined",
          "wrongful_return_details": "выдача Поклажедателю либо лицу по письменному распоряжению; проверка паспорта и доверенности при выдаче иному лицу; ответственность за выдачу ненадлежащему лицу",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Вещь возвращается Поклажедателю либо лицу, указанному им в письменном распоряжении."
            }
          ]
        }

        Пример 2 (только проверка правомочий):
        Фрагмент:
        "Перед выдачей вещи Хранитель обязан проверить документы,
        подтверждающие полномочия получателя."
        Ответ:
        {
          "return_addressee_rules_status": "defined",
          "authority_verification_status": "yes",
          "wrongful_return_liability_status": "not_defined",
          "wrongful_return_details": "проверка документов, подтверждающих полномочия получателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Перед выдачей вещи Хранитель обязан проверить документы, подтверждающие полномочия получателя."
            }
          ]
        }

        Пример 3 (только ответственность):
        Фрагмент:
        "Хранитель отвечает за убытки, причинённые Поклажедателю
        вследствие выдачи вещи ненадлежащему лицу."
        Ответ:
        {
          "return_addressee_rules_status": "not_defined",
          "authority_verification_status": "not_defined",
          "wrongful_return_liability_status": "defined",
          "wrongful_return_details": "ответственность за убытки вследствие выдачи вещи ненадлежащему лицу",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель отвечает за убытки, причинённые Поклажедателю вследствие выдачи вещи ненадлежащему лицу."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "return_addressee_rules_status": "not_defined",
          "authority_verification_status": "not_defined",
          "wrongful_return_liability_status": "not_defined",
          "wrongful_return_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли, кому возвращается вещь?
        2. Указаны ли документы, подтверждающие право на получение?
        3. Указана ли обязанность проверять полномочия получателя?
        4. Указана ли ответственность за выдачу ненадлежащему лицу?
        5. Выведены ли правила из текста договора, а не из ст. 312 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "return_addressee_rules_status": "<defined / not_defined>",
          "authority_verification_status": "<yes / no / not_defined>",
          "wrongful_return_liability_status": "<defined / not_defined>",
          "wrongful_return_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат вещи надлежащему лицу выдача вещи уполномоченный получатель проверка полномочий получателя паспорт доверенность документы подтверждающие полномочия ответственность за выдачу ненадлежащему лицу сверка документов подпись получателя"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
