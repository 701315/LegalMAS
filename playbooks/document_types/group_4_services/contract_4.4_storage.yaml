  - id: professional_custodian_liability
    name: "Ответственность хранителя: основание, объём, лимит (ст. 901, 902 ГК РФ)"
    description: >
      Фактографическая проверка условий ответственности хранителя за утрату,
      недостачу и повреждение вещи: основание ответственности (независимо от вины
      для профессионального хранителя), объём (полная стоимость / заявленная / лимит),
      исключение непреодолимой силы. Попытка ограничить ответственность
      профессионального хранителя «только при наличии вины» противоречит
      ст. 901 ГК РФ и ничтожна (ст. 168, 422 ГК РФ).
    triggers:
      any: ["professional_custodian"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "независимо от вины"
        - "полная материальная ответственность"
        - "профессиональный хранитель отвечает"
        - "возмещение полной стоимости"
        - "за исключением непреодолимой силы"
        - "ст. 901"
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "только при наличии вины"
        - "ограничение ответственности суммой вознаграждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)хранитель.*несёт.*ответственност.*независимо.*от.*вины"
        - "(?i)ст\\.?\\s*901"
        - "(?i)ответственност.*за.*(утрат|поврежден|недостач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 901, 902 ГК РФ).
        Проверяется только один вопрос: основание, объём и лимит ответственности
        хранителя за утрату, недостачу и повреждение вещи.
        Нормативные ориентиры:
        - ст. 901 ГК РФ — ответственность профессионального хранителя
          независимо от вины (императивная норма);
        - ст. 902 ГК РФ — размер ответственности;
        - ст. 168, 422 ГК РФ — ничтожность условия, противоречащего
          императивной норме.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Формулировки «отвечает только при наличии вины» для профессионального
          хранителя противоречат ст. 901 ГК РФ — фиксируй как факт, но не выводи
          сам, а только если это прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основание ответственности (независимо от вины / только при вине / смешанная).
        2. Объём ответственности (полная стоимость / заявленная / сумма понижения /
          лимитированная).
        3. Исключение для непреодолимой силы.
        4. Наличие лимита (cap) ответственности.
        5. Формулировку об ответственности за утрату, недостачу и повреждение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (basis / scope / yes-no) → "not_defined";
          - текстовое поле (loss_damage_liability_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. liability_basis = "fault_based" только если прямо сказано
          «отвечает только при наличии вины» или аналогично. Не выводи
          ответственность из ст. 901 ГК РФ — только из текста.
        5. liability_scope = "depreciation_amount" — если объём определён
          как сумма, на которую понизилась стоимость вещи (ст. 902 п. 1 ГК РФ).
        6. liability_scope = "limited" — если прямо указан потолок (cap) суммы
          возмещения (например, «не более суммы вознаграждения»).
        7. liability_cap_present = "yes" — если прямо указан потолок суммы.
          Конкретное значение потолка фиксируй в evidence.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранитель несёт ответственность за утрату, недостачу и повреждение
        вещи независимо от вины, за исключением случаев непреодолимой силы.
        Возмещение производится в размере полной стоимости вещи."
        Ответ:
        {
          "liability_basis": "strict",
          "liability_scope": "full_value",
          "force_majeure_exception": "yes",
          "liability_cap_present": "no",
          "loss_damage_liability_details": "ответственность за утрату, недостачу и повреждение независимо от вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель несёт ответственность за утрату, недостачу и повреждение вещи независимо от вины, за исключением случаев непреодолимой силы."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель отвечает только при наличии вины."
        Ответ:
        {
          "liability_basis": "fault_based",
          "liability_scope": "not_defined",
          "force_majeure_exception": "not_defined",
          "liability_cap_present": "not_defined",
          "loss_damage_liability_details": "отвечает только при наличии вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель отвечает только при наличии вины."
            }
          ]
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "Хранитель возмещает Поклажедателю убытки в размере, не превышающем
        сумму вознаграждения Хранителя за соответствующий период."
        Ответ:
        {
          "liability_basis": "not_defined",
          "liability_scope": "limited",
          "force_majeure_exception": "not_defined",
          "liability_cap_present": "yes",
          "loss_damage_liability_details": "возмещение убытков в размере, не превышающем сумму вознаграждения",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Хранитель возмещает Поклажедателю убытки в размере, не превышающем сумму вознаграждения Хранителя за соответствующий период."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определено ли основание ответственности — независимо от вины или по вине?
        2. Указана ли в тексте формулировка «только при наличии вины»
          или аналогичная?
        3. Определён ли объём ответственности — полная стоимость / заявленная /
          сумма понижения / лимит?
        4. Есть ли исключение для непреодолимой силы?
        5. Указан ли в тексте потолок (cap) суммы возмещения?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_basis": "<strict / fault_based / mixed / not_defined>",
          "liability_scope": "<full_value / declared_value / depreciation_amount / limited / not_defined>",
          "force_majeure_exception": "<yes / no / not_defined>",
          "liability_cap_present": "<yes / no / not_defined>",
          "loss_damage_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность хранителя независимо от вины профессиональный хранитель возмещение полной стоимости заявленная стоимость сумма понижения стоимости за исключением непреодолимой силы ст. 901 ст. 902 cap лимит ответственности предел возмещения не превышает не более максимальный размер ответственности за утрату повреждение недостачу"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "срок хранения"
        - "возврат вещи"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "limitations"
          - "remedies"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "professional_custodian_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об ответственности хранителя: основание, объём, лимит, исключения.
        Не анализируй вознаграждение, сроки или иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. professional_custodian_liability_presence:
           Агрегатное signal-поле — наличие условия об ответственности хранителя
           за утрату / недостачу / повреждение.
           - "present" — если хотя бы одно из содержательных полей
             (liability_basis, liability_scope, force_majeure_exception,
              liability_cap_present) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_basis = "not_defined";
           - liability_scope = "not_defined";
           - force_majeure_exception = "not_defined";
           - liability_cap_present = "not_defined";
           - loss_damage_liability_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. liability_basis:
           - "strict" — прямо указано «независимо от вины» или аналогично;
           - "fault_based" — прямо указано «только при наличии вины» или аналогично;
           - "mixed" — разные режимы для разных случаев прямо указаны;
           - "not_defined" — основание прямо не указано.
           Важно: не выводи основание из ст. 901 ГК РФ — только из текста договора.

        2. liability_scope:
           - "full_value" — прямо указана полная стоимость вещи;
           - "declared_value" — прямо указана заявленная стоимость как база;
           - "depreciation_amount" — прямо указана сумма, на которую понизилась
             стоимость вещи;
           - "limited" — прямо указан потолок (cap) суммы возмещения;
           - "not_defined" — объём прямо не определён.

        3. force_majeure_exception:
           - "yes" — прямо указано исключение для непреодолимой силы;
           - "no" — прямо указано, что исключения нет;
           - "not_defined" — не упомянуто.

        4. liability_cap_present:
           - "yes" — прямо указан потолок суммы возмещения (значение — в evidence);
           - "no" — прямо указано, что потолка нет;
           - "not_defined" — не упомянуто.

        5. loss_damage_liability_details:
           Краткая user-facing формулировка об ответственности за утрату,
           недостачу и повреждение на русском языке.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни professional_custodian_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_basis / *_scope / *_exception / *_present = "not_defined", loss_damage_liability_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, сроки, возврат вещи, страхование, штрафы
          и иные нерелевантные темы.
        - liability_basis = "fault_based" только если прямо сказано
          «отвечает только при наличии вины» или аналогично.
        - Не выводи основание ответственности из нормы ст. 901 ГК РФ — только из текста договора.
        - liability_scope = "limited" — если прямо указан потолок суммы возмещения.
        - liability_cap_present = "yes" — если прямо указан потолок. Конкретное
          значение потолка фиксируй в evidence.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — верни "Не удалось определить", а в статусе используй "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни основания ответственности, ни объёма,
           ни исключений, ни лимитов.
           → presence = "missing";
             все *_basis / *_scope / *_exception / *_present = "not_defined";
             loss_damage_liability_details = "Данные не определены".

        2. Ответственность раскрыта частично.
           Указано, что хранитель отвечает, но не указан объём или лимит.
           → presence = "present";
             liability_basis = "defined-режим из текста";
             liability_scope = "not_defined";
             loss_damage_liability_details содержит только то, что прямо указано.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные основания ответственности
           («независимо от вины» в одном пункте, «только при вине» в другом)
           либо разные объёмы возмещения.
           → presence = "unclear";
             соответствующий *_basis / *_scope = "not_defined";
             loss_damage_liability_details = "Не удалось определить".

        4. Прямое противоречие императивной норме.
           В договоре прямо указано, что ответственность профессионального хранителя
           ограничена «только при наличии вины», хотя для профессионального хранителя
           ст. 901 ГК РФ устанавливает ответственность независимо от вины.
           → presence = "present";
             liability_basis = "fault_based" (фиксация факта по тексту, без правовой оценки);
             loss_damage_liability_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для professional_custodian_liability_presence используй только: "present", "missing", "unclear".
        - Для liability_basis используй только: "strict", "fault_based", "mixed", "not_defined".
        - Для liability_scope используй только: "full_value", "declared_value", "depreciation_amount", "limited", "not_defined".
        - Для force_majeure_exception и liability_cap_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * loss_damage_liability_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * loss_damage_liability_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
