  - id: return_procedure
    name: "Порядок выдачи вещи (ст. 900 ГК РФ)"
    description: >
      Фактографическая проверка процедуры выдачи вещи поклажедателю
      или указанному им получателю: тип документа выдачи (форма МХ-3 /
      иной акт / расписка), проверка правомочий получателя, условия
      возврата. Правовой ориентир — ст. 900 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "выдача вещи"
        - "возврат вещи"
        - "акт выдачи"
        - "акт возврата"
        - "форма МХ-3"
        - "проверка правомочий"
        - "предъявление документа"
        - "уполномоченное лицо"
        - "получатель вещи"
