        - Сорт / класс / марка без явного «того же рода и качества» —
          quality_grade_status = "defined".
        - Порядок возврата прямо не указан, но смешение разрешено —
          return_same_grade_status = "not_defined" (не выводи из нормы).
        - Доля в виде формулы или конкретного числа (1/3) — share_basis_status
          = "defined", share_basis_details содержит формулировку.
        - Для отсутствующих данных:
          - сигнальные поля → "not_defined";
          - текстовые поля → "Данные не определены".
        - Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.
        </rules>
      fields:
        - name: "irregular_storage_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания иррегулярного хранения."
          required: true
        - name: "commingling_allowed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Разрешено ли смешение вещей."
          label: "Смешение вещей"
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "quality_grade_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания сорта / класса / качества."
          required: true
        - name: "quality_grade_value"
          type: "string"
          presentation: "fact"
          label: "Сорт / качество"
          description: "Сорт, класс или качество вещи при иррегулярном хранении."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "return_same_grade_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка возврата того же рода и качества."
          required: true
        - name: "return_same_grade_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата"
          description: "Порядок возврата вещи того же рода и качества."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "share_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения доли в общей массе."
          required: true
        - name: "share_basis_details"
          type: "string"
          presentation: "fact"
          label: "Доля в общей массе"
          description: "Порядок определения доли поклажедателя."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: uncollected_goods_disposal
    name: "Реализация невостребованной вещи (ст. 899 ГК РФ)"
    description: >
      Фактографическая проверка процедуры реализации невостребованной вещи:
      письменное предупреждение поклажедателя, срок, порядок продажи
      (по цене, сложившейся в месте хранения — п. 5 ст. 899 ГК РФ),
      удержание расходов и возврат остатка выручки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "невостребованная вещь"
        - "реализация"
        - "продажа"
        - "уведомление"
        - "письменное предупреждение"
        - "по цене, сложившейся в месте хранения"
        - "остаток возвращается"
        - "ст. 899"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)невостребованн(ая|ой)\\s+вещ"
        - "(?i)продат(ь|ся).*невостребованн"
        - "(?i)ст\\.?\\s*899"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 899 ГК РФ).
        Проверяется только один вопрос: процедура реализации невостребованной вещи.
        Нормативные ориентиры:
        - п. 1 ст. 899 ГК РФ — при уклонении поклажедателя от получения вещи
          хранитель после письменного предупреждения вправе продать вещь;
        - п. 5 ст. 899 ГК РФ — продажа по цене, сложившейся в месте хранения;
        - суммы, вырученные от продажи, передаются поклажедателю за вычетом
          причитающихся хранителю сумм.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи процедуру из ст. 899 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли процедура реализации невостребованной вещи.
        2. Установлен ли срок уведомления поклажедателя.
        3. Определён ли порядок продажи (рыночная цена в месте хранения / аукцион / иной).
        4. Удерживаются ли расходы из выручки.
        5. Возвращается ли остаток выручки поклажедателю.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / yes-no / sale_basis) → "not_defined";
          - текстовое поле (notice_period_value) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если процедура прямо не описана, но есть отсылка к «порядку,
          установленному законом» — disposal_procedure_status = "defined",
          notice_period_status = "not_defined".
        5. sale_basis = "market_price" — если прямо сказано «по цене, сложившейся
          в месте хранения» или эквивалент. sale_basis = "auction" — если прямо
          назван аукцион / торги. Иначе "other" или "not_defined".
        6. expenses_deducted = "yes" — если прямо сказано, что расходы / суммы,
          причитающиеся хранителю, удерживаются из выручки.
        7. remainder_returned = "yes" — если прямо сказано, что остаток
          передаётся / возвращается поклажедателю.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Если вещь не востребована в течение 30 дней после письменного
        предупреждения, Хранитель вправе реализовать её по цене, сложившейся
        в месте хранения. Из выручки удерживаются расходы на хранение.
        Остаток возвращается Поклажедателю."
        Ответ:
        {
          "disposal_procedure_status": "defined",
          "notice_period_status": "defined",
          "notice_period_value": "30 дней после письменного предупреждения",
          "sale_basis": "market_price",
          "expenses_deducted": "yes",
          "remainder_returned": "yes",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Если вещь не востребована в течение 30 дней после письменного предупреждения, Хранитель вправе реализовать её по цене, сложившейся в месте хранения."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель хранит вещь до востребования."
        Ответ:
        {
          "disposal_procedure_status": "not_defined",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "sale_basis": "not_defined",
          "expenses_deducted": "not_defined",
          "remainder_returned": "not_defined",
          "evidence": []
        }

        Пример 3 (частичные данные — процедура есть, деталей нет):
        Фрагмент:
        "По истечении срока хранения Хранитель вправе распорядиться вещью
        в порядке, установленном законодательством Российской Федерации."
        Ответ:
        {
          "disposal_procedure_status": "defined",
          "notice_period_status": "not_defined",
          "notice_period_value": "Данные не определены",
          "sale_basis": "not_defined",
          "expenses_deducted": "not_defined",
          "remainder_returned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "По истечении срока хранения Хранитель вправе распорядиться вещью в порядке, установленном законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли процедура реализации невостребованной вещи?
        2. Установлен ли срок уведомления?
        3. Определён ли порядок продажи (рыночная цена / аукцион / иной)?
        4. Удерживаются ли расходы из выручки?
        5. Возвращается ли остаток?
        6. Выведена ли процедура из текста договора, а не из нормы ст. 899 ГК РФ?
        7. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disposal_procedure_status": "<defined / not_defined>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_value": "<текст или 'Данные не определены'>",
          "sale_basis": "<market_price / auction / other / not_defined>",
          "expenses_deducted": "<yes / no / not_defined>",
          "remainder_returned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 550
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "невостребованная вещь реализация продажа уведомление письменное предупреждение по цене сложившейся в месте хранения аукцион торги остаток выручки возврат расходы удержание ст. 899"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "ответственность за утрату"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о процедуре реализации невостребованной вещи.
        Не анализируй иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. disposal_procedure_status — "defined" или "not_defined".
        2. notice_period_status — "defined" или "not_defined".
        3. notice_period_value — срок уведомления (текст).
        4. sale_basis — market_price / auction / other / not_defined.
        5. expenses_deducted — yes / no / not_defined.
        6. remainder_returned — yes / no / not_defined.
        7. evidence — массив цитат {"clause_ref", "quote"}.
        </task>
        <rules>
        - Используй только текст договора.
        - Не выводи процедуру из нормы ст. 899 ГК РФ — только из текста.
        - Процедура прямо не описана, но есть отсылка к «порядку, установленному
          законом» — disposal_procedure_status = "defined",
          notice_period_status = "not_defined".
        - sale_basis = "market_price" — если прямо сказано «по цене, сложившейся
          в месте хранения» или эквивалент. "auction" — если прямо назван
          аукцион / торги. Иначе "other" или "not_defined".
        - expenses_deducted = "yes" — если прямо сказано, что расходы / суммы,
          причитающиеся хранителю, удерживаются из выручки.
        - remainder_returned = "yes" — если прямо сказано, что остаток
          передаётся / возвращается поклажедателю.
        - Для отсутствующих данных:
          - сигнальные поля → "not_defined";
          - текстовое поле → "Данные не определены".
        - Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.
        </rules>
      fields:
        - name: "disposal_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия процедуры реализации."
          required: true
        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока уведомления."
          required: true
        - name: "notice_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: "Срок уведомления поклажедателя о реализации."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "sale_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["market_price", "auction", "other", "not_defined"]
          description: "Порядок продажи невостребованной вещи."
          label: "Порядок продажи"
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "expenses_deducted"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Удерживаются ли расходы из выручки."
          label: "Удержание расходов"
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "remainder_returned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возвращается ли остаток выручки поклажедателю."
          label: "Возврат остатка"
          required: true
          display_in_grid: true
          display_priority: 4

  - id: dangerous_properties_disclosure
    name: "Раскрытие опасных свойств вещи (ст. 893 ГК РФ)"
    description: >
      Фактографическая проверка обязанности поклажедателя раскрыть опасные свойства
      вещи (ст. 893 ГК РФ), права хранителя уничтожить / обезвредить опасную вещь
      за счёт поклажедателя без возмещения её стоимости и ответственности
      поклажедателя за сокрытие опасных свойств.
    triggers:
      any: ["dangerous_goods_storage"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "опасные свойства"
        - "предупреждение об опасности"
        - "раскрытие свойств"
        - "легковоспламеняющийся"
        - "токсичный"
        - "взрывоопасный"
        - "право уничтожить"
        - "за счёт поклажедателя"
        - "ст. 893"
        - "лицензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)опасн(ые|ых)\\s+свойств"
        - "(?i)предупред(ить|ите).*об.*опасност"
        - "(?i)ст\\.?\\s*893"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 893 ГК РФ).
        Проверяется только один вопрос: раскрытие опасных свойств вещи,
        право хранителя уничтожить / обезвредить опасную вещь и ответственность
        за сокрытие опасных свойств.
        Нормативные ориентиры:
        - п. 1 ст. 893 ГК РФ — если поклажедатель не предупредил об опасных
          свойствах вещи, хранитель вправе потребовать немедленного изъятия;
          при невозможности изъятия — вещь может быть уничтожена / обезврежена
          без возмещения её стоимости;
        - п. 2 ст. 893 ГК РФ — если хранитель был предупреждён, но вещь опасна
          для окружающих / имущества третьих лиц, уничтожение возможно
          с возмещением убытков;
        - законодательство о промышленной безопасности (ФЗ-116) и лицензировании
          (ФЗ-99) — применимо к хранению отдельных видов опасных веществ.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанности / права из норм ст. 893 ГК РФ — фиксируй только
          то, что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность поклажедателя раскрыть опасные свойства.
        2. Перечислены ли конкретные опасные свойства.
        3. Право хранителя уничтожить / обезвредить опасную вещь.
        4. Ответственность поклажедателя за сокрытие.
        5. Указание на лицензию на хранение опасных веществ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (status / yes-no) → "not_defined".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. Если общая обязанность раскрытия есть, но конкретные свойства не перечислены —
          disclosure_obligation_status = "defined", dangerous_properties_listed = "no".
        5. Если право уничтожить / обезвредить прямо указано, но без оговорки
          «за счёт поклажедателя» — destruction_right = "yes".
        6. Если договор прямо запрещает уничтожение —
          destruction_right = "no" (не "not_defined").
        7. liability_for_non_disclosure = "yes" — если прямо указана ответственность
          поклажедателя за сокрытие опасных свойств (любая формулировка).
        8. license_mentioned = "yes" — только если в тексте прямо упомянута лицензия
          на хранение опасных веществ (или ссылка на такую лицензию).
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Поклажедатель обязан письменно предупредить Хранителя об опасных
        свойствах вещи до передачи на хранение. Хранитель вправе уничтожить
