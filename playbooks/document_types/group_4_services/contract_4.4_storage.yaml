      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "wrongful_return_risk_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о правилах возврата вещи: кому возвращается, какие документы
        подтверждают право на получение, предусмотрена ли проверка
        полномочий и ответственность за выдачу ненадлежащему лицу.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. wrongful_return_risk_presence:
           Агрегатное signal-поле — наличие условий о правилах возврата
           вещи и ответственности за выдачу ненадлежащему лицу.
           - "present" — если хотя бы одно из содержательных полей
             (return_addressee_rules_status, authority_verification_status,
              wrongful_return_liability_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - return_addressee_rules_status = "not_defined";
           - authority_verification_status = "not_defined";
           - wrongful_return_liability_status = "not_defined";
           - wrongful_return_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. return_addressee_rules_status:
           - "defined" — если в тексте прямо указано, кому возвращается
             вещь (поклажедателю / указанному им лицу / предъявителю /
             иное лицо) и/или какие документы подтверждают право на получение;
           - "not_defined" — если прямого указания нет.

        2. authority_verification_status:
           - "yes" — прямо указана обязанность хранителя проверять
             полномочия получателя (паспорт, доверенность, документ
             о полномочиях);
           - "no" — прямо указано, что проверка не требуется;
           - "not_defined" — прямо не указано.

        3. wrongful_return_liability_status:
           - "defined" — если в тексте прямо предусмотрена ответственность
             хранителя за выдачу вещи ненадлежащему лицу (в любой
             формулировке), либо прямо указано, что такой ответственности
             нет (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        4. wrongful_return_details:
           Краткая user-facing формулировка правил о получателе, перечня
           документов, порядка проверки, формулировки об ответственности.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни wrongful_return_risk_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", authority_verification_status = "not_defined", wrongful_return_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, естественную убыль
          и иные нерелевантные темы.
        - Не выводи правила из ст. 312 ГК РФ — только из текста.
        - authority_verification_status = "yes" / "no" — по прямому указанию.
        - wrongful_return_liability_status = "defined" — при прямом указании
          ответственности либо при прямом указании об её отсутствии.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни правил о получателе, ни требований к документам,
           ни ответственности за выдачу ненадлежащему лицу.
           → presence = "missing";
             все *_status = "not_defined";
             wrongful_return_details = "Данные не определены".

        2. Указано только лицо-получатель без деталей.
           Например: "Вещь возвращается Поклажедателю",
           без указания документов и порядка проверки.
           → presence = "present";
             return_addressee_rules_status = "defined";
             authority_verification_status = "not_defined";
             wrongful_return_liability_status = "not_defined";
             wrongful_return_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные правила о получателе
           или разные перечни документов.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             wrongful_return_details = "Не удалось определить".

        4. Прямое указание об отсутствии проверки или ответственности.
           В договоре прямо указано, что вещь выдаётся предъявителю
           без проверки полномочий, либо что хранитель не несёт
           ответственности за выдачу ненадлежащему лицу.
           → presence = "present";
             authority_verification_status = "no" (прямое регулирование)
               либо wrongful_return_liability_status = "defined"
               с указанием об отсутствии ответственности;
             wrongful_return_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для wrongful_return_risk_presence используй только: "present", "missing", "unclear".
        - Для return_addressee_rules_status и wrongful_return_liability_status используй только: "defined", "not_defined".
        - Для authority_verification_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * wrongful_return_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * wrongful_return_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "wrongful_return_risk_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о правилах возврата вещи и ответственности за выдачу ненадлежащему лицу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_addressee_rules_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие правил о получателе вещи. Внутреннее enum-поле."
          label: "Правила о получателе"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "authority_verification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность проверки полномочий получателя. Внутреннее enum-поле."
          label: "Проверка полномочий получателя"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "wrongful_return_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Ответственность за выдачу вещи ненадлежащему лицу. Внутреннее enum-поле."
          label: "Ответственность за выдачу"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "wrongful_return_details"
          type: "string"
          presentation: "fact"
          label: "Правила возврата и проверки"
          description: >
            Формулировка правил о получателе, документах, проверке и ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: custodian_termination_right
    name: "Право хранителя на односторонний отказ от договора (ст. 896, 899 ГК РФ)"
    description: >
      Фактографическая проверка наличия и условий права хранителя
      на односторонний отказ от договора хранения: основания (просрочка
      оплаты вознаграждения, неисполнение обязанности забрать вещь
      по истечении срока), порядок уведомления поклажедателя и последствия
      отказа (продажа вещи, удержание, возмещение расходов). Правовые
      ориентиры — п. 2 ст. 896 ГК РФ, ст. 899 ГК РФ, ст. 310 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "односторонний отказ"
        - "расторжение договора хранителем"
        - "отказ от договора"
        - "прекращение договора"
        - "хранитель вправе отказаться"
        - "при просрочке оплаты"
        - "не забрал вещь"
        - "невостребованная вещь"
        - "уведомление о расторжении"
        - "продажа вещи хранителем"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)хранител.*(вправе|может)\\s+отказаться"
        - "(?i)односторонн(ий|его)\\s+отказ"
        - "(?i)расторжени(е|я).*хранител"
        - "(?i)продат[ьи].*невостребованн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 896, 899, 310 ГК РФ).
        Проверяется один вопрос: право хранителя на односторонний отказ
        от договора хранения и его последствия.
        Нормативные ориентиры:
        - п. 2 ст. 896 ГК РФ — если по истечении срока договора
          переданная на хранение вещь не взята обратно поклажедателем,
          он обязан уплатить хранителю соразмерное вознаграждение
          за дальнейшее хранение;
        - ст. 899 ГК РФ — при уклонении поклажедателя от получения вещи
          хранитель после письменного предупреждения вправе продать вещь
          самостоятельно;
        - ст. 310 ГК РФ — односторонний отказ от исполнения обязательства
          допускается только в случаях, предусмотренных законом или
          договором.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право отказа из ст. 899 ГК РФ — фиксируй только то,
          что прямо написано в договоре.
        - Отсутствие условия — не "есть право", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право хранителя на односторонний отказ
          от договора.
        2. Основания отказа (просрочка оплаты / невывоз вещи / оба / иное).
        3. Требуется ли уведомление поклажедателя (форма, срок).
        4. Последствия отказа (продажа вещи, удержание, возмещение расходов).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (termination_right_status / termination_grounds /
            termination_notice_required) → "not_defined";
          - текстовое поле (termination_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. termination_right_status = "defined" — если прямо указано право
          хранителя на односторонний отказ от договора (в любой формулировке).
        5. termination_grounds:
          - "payment_overdue" — просрочка оплаты вознаграждения;
          - "non_collection" — неисполнение обязанности забрать вещь;
          - "both" — оба основания прямо указаны;
          - "other" — иное прямо названное основание;
          - "not_defined" — основание прямо не указано.
        6. termination_notice_required:
          - "yes" — прямо указано уведомление поклажедателя;
          - "no" — прямо указано, что уведомление не требуется;
          - "not_defined" — прямо не указано.
        7. termination_details — конкретная формулировка из текста: основания,
          порядок уведомления, сроки, последствия отказа.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Хранитель вправе в одностороннем порядке отказаться от договора
        при просрочке оплаты вознаграждения более 30 календарных дней
        или при неисполнении Поклажедателем обязанности забрать вещь
        по истечении срока хранения. Об отказе Хранитель уведомляет
        Поклажедателя письменно не менее чем за 10 рабочих дней. При отказе
        Хранитель вправе удерживать вещь до полного расчёта."
        Ответ:
        {
          "termination_right_status": "defined",
          "termination_grounds": "both",
          "termination_notice_required": "yes",
          "termination_details": "односторонний отказ при просрочке оплаты более 30 дней или при невывозе вещи; уведомление письменно не менее чем за 10 рабочих дней; право удержания до полного расчёта",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе в одностороннем порядке отказаться от договора при просрочке оплаты вознаграждения более 30 календарных дней или при неисполнении Поклажедателем обязанности забрать вещь по истечении срока хранения."
            }
          ]
        }

        Пример 2 (только просрочка оплаты):
        Фрагмент:
        "При просрочке оплаты более 60 дней Хранитель вправе отказаться
        от договора, предупредив Поклажедателя письменно."
        Ответ:
        {
          "termination_right_status": "defined",
          "termination_grounds": "payment_overdue",
          "termination_notice_required": "yes",
          "termination_details": "отказ при просрочке оплаты более 60 дней с письменным предупреждением",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При просрочке оплаты более 60 дней Хранитель вправе отказаться от договора, предупредив Поклажедателя письменно."
            }
          ]
        }

        Пример 3 (только упоминание права):
        Фрагмент:
        "Хранитель вправе отказаться от настоящего договора."
        Ответ:
        {
          "termination_right_status": "defined",
          "termination_grounds": "not_defined",
          "termination_notice_required": "not_defined",
          "termination_details": "право хранителя на отказ от договора (основания и порядок не указаны)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе отказаться от настоящего договора."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "termination_right_status": "not_defined",
          "termination_grounds": "not_defined",
          "termination_notice_required": "not_defined",
          "termination_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрено ли право хранителя на односторонний отказ?
        2. Определены ли основания отказа?
        3. Указано ли уведомление поклажедателя?
        4. Приведены ли последствия отказа?
        5. Выведено ли право из текста договора, а не из ст. 899 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_right_status": "<defined / not_defined>",
          "termination_grounds": "<payment_overdue / non_collection / both / other / not_defined>",
          "termination_notice_required": "<yes / no / not_defined>",
          "termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "односторонний отказ хранителя расторжение договора хранителем отказ от договора прекращение договора просрочка оплаты невывоз вещи невостребованная вещь уведомление о расторжении продажа вещи удержание вещи ст. 896 ст. 899"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
        - procedures
      negative_keywords:
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "remedies"
          - "limitations"
          - "procedures"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "custodian_termination_right_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о праве хранителя на односторонний отказ от договора: основание,
        порядок уведомления, последствия.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. custodian_termination_right_presence:
           Агрегатное signal-поле — наличие условия о праве хранителя
           на односторонний отказ от договора.
           - "present" — если хотя бы одно из содержательных полей
             (termination_right_status, termination_grounds,
              termination_notice_required) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_right_status = "not_defined";
           - termination_grounds = "not_defined";
           - termination_notice_required = "not_defined";
           - termination_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_right_status:
           - "defined" — если в тексте прямо указано право хранителя
             на односторонний отказ от договора (в любой формулировке),
             либо прямо указано, что такого права у хранителя нет
             (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. termination_grounds:
           - "payment_overdue" — просрочка оплаты вознаграждения;
           - "non_collection" — неисполнение обязанности забрать вещь;
           - "both" — оба основания прямо указаны;
           - "other" — иное прямо названное основание;
           - "not_defined" — основание прямо не указано.

        3. termination_notice_required:
           - "yes" — прямо указано уведомление поклажедателя;
           - "no" — прямо указано, что уведомление не требуется;
           - "not_defined" — прямо не указано.

        4. termination_details:
           Краткая user-facing формулировка оснований, порядка уведомления,
           сроков и последствий отказа.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни custodian_termination_right_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", termination_grounds = "not_defined", termination_notice_required = "not_defined", termination_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай страхование, естественную убыль и иные нерелевантные темы.
        - Не выводи право отказа из ст. 899 ГК РФ — только из текста.
        - termination_grounds — по прямому указанию в тексте.
        - termination_notice_required — по прямому указанию в тексте.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права хранителя на отказ, ни оснований,
           ни порядка уведомления.
           → presence = "missing";
             все *_status = "not_defined";
             termination_details = "Данные не определены".

        2. Право упомянуто без деталей.
           Например: "Хранитель вправе отказаться от настоящего договора",
           без указания оснований и порядка.
           → presence = "present";
             termination_right_status = "defined";
             termination_grounds = "not_defined";
             termination_notice_required = "not_defined";
             termination_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные основания отказа
           или разные порядки уведомления.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             termination_details = "Не удалось определить".

        4. Прямое указание об отсутствии права отказа.
           В договоре прямо указано, что хранитель не вправе отказаться
           от договора в одностороннем порядке.
           → presence = "present";
             termination_right_status = "defined" (прямое регулирование);
             termination_details содержит дословную цитату;
             остальные содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для custodian_termination_right_presence используй только: "present", "missing", "unclear".
        - Для termination_right_status используй только: "defined", "not_defined".
        - Для termination_grounds используй только: "payment_overdue", "non_collection", "both", "other", "not_defined".
        - Для termination_notice_required используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * termination_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * termination_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "custodian_termination_right_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о праве хранителя на односторонний отказ от договора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие права хранителя на односторонний отказ. Внутреннее enum-поле."
          label: "Право на односторонний отказ"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "termination_grounds"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["payment_overdue", "non_collection", "both", "other", "not_defined"]
          description: "Основания одностороннего отказа хранителя. Внутреннее enum-поле."
          label: "Основания отказа"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "termination_notice_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли уведомление поклажедателя. Внутреннее enum-поле."
          label: "Уведомление о расторжении"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "termination_details"
          type: "string"
          presentation: "fact"
          label: "Порядок и последствия отказа"
          description: >
            Формулировка оснований, порядка уведомления и последствий отказа. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: late_payment_liability
    name: "Ответственность поклажедателя за просрочку оплаты (ст. 896 ГК РФ)"
    description: >
      Фактографическая проверка условия об ответственности поклажедателя
      за несвоевременную оплату вознаграждения хранителя и/или возмещения
      расходов: форма ответственности (пеня / проценты / убытки / иное),
      размер, база начисления, порядок расчёта и наличие лимита.
      Правовые ориентиры — ст. 896 ГК РФ (вознаграждение хранителю),
      ст. 330 ГК РФ (неустойка), ст. 395 ГК РФ (проценты за пользование
      чужими денежными средствами).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "просрочка оплаты"
        - "несвоевременная оплата"
        - "ответственность за просрочку"
        - "пеня за просрочку"
        - "неустойка за просрочку"
        - "проценты по ст. 395"
        - "за каждый день просрочки"
        - "просрочка вознаграждения"
        - "просрочка возмещения расходов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)просрочк(а|и|у).*(оплат|вознагражд|расход)"
        - "(?i)(пен[яию]|неустойк[аиу]).*просрочк"
        - "(?i)за\\s+кажды[йе]\\s+день\\s+просрочк"
        - "(?i)ст\\.?\\s*(395|330)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 896, 330, 395 ГК РФ).
        Проверяется один вопрос: ответственность поклажедателя
        за просрочку оплаты вознаграждения и возмещения расходов.
        Нормативные ориентиры:
        - ст. 896 ГК РФ — вознаграждение хранителю; при просрочке оплаты
          хранитель вправе требовать причитающуюся сумму;
        - ст. 330 ГК РФ — неустойка (штраф, пеня) как способ обеспечения;
        - ст. 395 ГК РФ — проценты за пользование чужими денежными
          средствами при отсутствии договорной неустойки.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи форму ответственности из ст. 395 ГК РФ — фиксируй только
          то, что прямо написано в договоре.
        - Отсутствие условия — не "пеня", не "проценты", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли ответственность поклажедателя за просрочку оплаты.
        2. На какую задолженность распространяется (вознаграждение /
          возмещение расходов / оба).
        3. Форма ответственности: пеня, неустойка, проценты, убытки, иное.
        4. База начисления и ставка (процент от суммы долга / фиксированная
          сумма).
        5. Наличие лимита (потолка) ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (late_payment_liability_status /
            late_payment_scope / late_payment_penalty_form /
            late_payment_cap_status) → "not_defined";
          - текстовые поля (late_payment_penalty_value /
            late_payment_calculation_details / late_payment_cap_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. late_payment_liability_status = "defined" — если прямо указана
          ответственность за просрочку оплаты (в любой формулировке).
        5. late_payment_scope:
          - "remuneration" — только вознаграждение;
          - "expenses" — только возмещение расходов;
          - "both" — оба вида задолженности;
          - "other" — иной прямо названный вид;
          - "not_defined" — вид задолженности прямо не указан.
        6. late_payment_penalty_form:
          - "penalty" — пеня за каждый день просрочки;
          - "interest" — проценты (по ст. 395 ГК РФ / ключевой ставке);
          - "damages" — возмещение убытков;
          - "other" — прямо названная иная форма;
          - "not_defined" — форма прямо не указана.
        7. late_payment_penalty_value — размер ставки или сумма с единицей
          измерения («0,1% от суммы долга за каждый день просрочки»,
            «1 000 руб. в день»). Не голое число.
        8. late_payment_cap_status = "defined" — если прямо указан лимит
          (потолок) ответственности.
        9. late_payment_calculation_details — порядок расчёта: с какого момента
          начисляется, за какой период, на какую базу.
        10. В evidence — только цитаты из документа, каждая с clause_ref.
        11. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "За просрочку оплаты вознаграждения и возмещения расходов
        Поклажедатель уплачивает Хранителю пеню в размере 0,1% от суммы
        задолженности за каждый день просрочки, но не более 10% от суммы
        задолженности."
        Ответ:
        {
          "late_payment_liability_status": "defined",
          "late_payment_scope": "both",
          "late_payment_penalty_form": "penalty",
          "late_payment_penalty_value": "0,1% от суммы задолженности за каждый день просрочки",
          "late_payment_cap_status": "defined",
          "late_payment_cap_value": "не более 10% от суммы задолженности",
          "late_payment_calculation_details": "начисляется за каждый день просрочки; база — сумма задолженности",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "За просрочку оплаты вознаграждения и возмещения расходов Поклажедатель уплачивает Хранителю пеню в размере 0,1% от суммы задолженности за каждый день просрочки, но не более 10% от суммы задолженности."
            }
          ]
        }

        Пример 2 (только проценты):
        Фрагмент:
        "При просрочке оплаты вознаграждения начисляются проценты
        по ст. 395 ГК РФ."
        Ответ:
        {
          "late_payment_liability_status": "defined",
          "late_payment_scope": "remuneration",
          "late_payment_penalty_form": "interest",
          "late_payment_penalty_value": "проценты по ст. 395 ГК РФ",
          "late_payment_cap_status": "not_defined",
          "late_payment_cap_value": "Данные не определены",
          "late_payment_calculation_details": "по ключевой ставке Банка России",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При просрочке оплаты вознаграждения начисляются проценты по ст. 395 ГК РФ."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Поклажедатель несёт ответственность за просрочку оплаты."
        Ответ:
        {
          "late_payment_liability_status": "defined",
          "late_payment_scope": "not_defined",
          "late_payment_penalty_form": "not_defined",
          "late_payment_penalty_value": "Данные не определены",
          "late_payment_cap_status": "not_defined",
          "late_payment_cap_value": "Данные не определены",
          "late_payment_calculation_details": "ответственность за просрочку оплаты (форма и размер не указаны)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель несёт ответственность за просрочку оплаты."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Поклажедатель уплачивает Хранителю вознаграждение 10 000 руб. в месяц."
        Ответ:
        {
          "late_payment_liability_status": "not_defined",
          "late_payment_scope": "not_defined",
          "late_payment_penalty_form": "not_defined",
          "late_payment_penalty_value": "Данные не определены",
          "late_payment_cap_status": "not_defined",
          "late_payment_cap_value": "Данные не определены",
          "late_payment_calculation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли ответственность за просрочку оплаты?
        2. Определён ли вид задолженности (вознаграждение / расходы / оба)?
        3. Определена ли форма (пеня / проценты / убытки / иное)?
        4. Указана ли ставка или сумма с единицей измерения?
        5. Приведён ли порядок расчёта и лимит ответственности?
        6. Выведена ли форма ответственности из текста договора, а не из
          ст. 395 ГК РФ?
        7. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "late_payment_liability_status": "<defined / not_defined>",
          "late_payment_scope": "<remuneration / expenses / both / other / not_defined>",
          "late_payment_penalty_form": "<penalty / interest / damages / other / not_defined>",
          "late_payment_penalty_value": "<текст или 'Данные не определены'>",
          "late_payment_cap_status": "<defined / not_defined>",
          "late_payment_cap_value": "<текст или 'Данные не определены'>",
          "late_payment_calculation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "просрочка оплаты несвоевременная оплата ответственность за просрочку оплаты пеня за просрочку неустойка за просрочку проценты по ст. 395 ГК РФ за каждый день просрочки просрочка вознаграждения просрочка возмещения расходов лимит ответственности"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "естественная убыль"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "remedies"
          - "limitations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "late_payment_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об ответственности поклажедателя за просрочку оплаты:
        вид задолженности, форму, размер, порядок расчёта, лимит.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. late_payment_liability_presence:
           Агрегатное signal-поле — наличие условия об ответственности
           поклажедателя за просрочку оплаты.
           - "present" — если хотя бы одно из содержательных полей
             (late_payment_liability_status, late_payment_scope,
              late_payment_penalty_form, late_payment_cap_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_payment_liability_status = "not_defined";
           - late_payment_scope = "not_defined";
           - late_payment_penalty_form = "not_defined";
           - late_payment_cap_status = "not_defined";
           - late_payment_penalty_value = "Данные не определены";
           - late_payment_calculation_details = "Данные не определены";
           - late_payment_cap_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. late_payment_liability_status:
           - "defined" — если в тексте прямо указана ответственность
             поклажедателя за просрочку оплаты (в любой формулировке),
             либо прямо указано, что такая ответственность не применяется
             (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. late_payment_scope:
           - "remuneration" — только вознаграждение хранителя;
           - "expenses" — только возмещение расходов;
           - "both" — оба вида задолженности;
           - "other" — иной прямо названный вид задолженности;
           - "not_defined" — вид задолженности прямо не указан.

        3. late_payment_penalty_form:
           - "penalty" — пеня за каждый день просрочки;
           - "interest" — проценты (по ст. 395 ГК РФ / ключевой ставке);
           - "damages" — возмещение убытков;
           - "other" — прямо названная иная форма;
           - "not_defined" — форма прямо не указана.

        4. late_payment_penalty_value:
           Краткая user-facing формулировка ставки или суммы с единицей
           измерения («0,1% от суммы долга за каждый день просрочки»,
            «1 000 руб. в день»).
           Fallback: "Данные не определены" / "Не удалось определить".

        5. late_payment_cap_status:
           - "defined" — если в тексте прямо указан лимит (потолок)
             ответственности;
           - "not_defined" — если прямого указания нет.

        6. late_payment_cap_value:
           Краткая user-facing формулировка значения лимита с единицей
           измерения («не более 10% от суммы долга», «не более
            100 000 рублей»).
           Fallback: "Данные не определены" / "Не удалось определить".

        7. late_payment_calculation_details:
           Краткая user-facing формулировка порядка расчёта: с какого
           момента начисляется, за какой период, на какую базу.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни late_payment_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", late_payment_scope = "not_defined", late_payment_penalty_form = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай естественную убыль, страхование и иные нерелевантные темы.
        - Не выводи форму ответственности из ст. 395 ГК РФ — только из текста.
        - late_payment_penalty_value — всегда с единицей измерения.
        - late_payment_cap_status = "defined" — при прямом указании лимита.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности за просрочку оплаты,
           ни формы, ни лимита.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Ответственность упомянута без деталей.
           Например: "Поклажедатель несёт ответственность за просрочку
           оплаты", без указания формы и размера.
           → presence = "present";
             late_payment_liability_status = "defined";
             late_payment_scope = "not_defined";
             late_payment_penalty_form = "not_defined";
             late_payment_penalty_value = "Данные не определены";
             late_payment_cap_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные формы ответственности
           или разные ставки.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание об отсутствии ответственности.
           В договоре прямо указано, что поклажедатель не несёт
           ответственности за просрочку оплаты.
           → presence = "present";
             late_payment_liability_status = "defined" (прямое регулирование);
             late_payment_calculation_details содержит дословную цитату;
             остальные содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для late_payment_liability_presence используй только: "present", "missing", "unclear".
        - Для late_payment_liability_status и late_payment_cap_status используй только: "defined", "not_defined".
        - Для late_payment_scope используй только: "remuneration", "expenses", "both", "other", "not_defined".
        - Для late_payment_penalty_form используй только: "penalty", "interest", "damages", "other", "not_defined".
        - Fallback при отсутствии данных:
          * late_payment_penalty_value, late_payment_cap_value,
            late_payment_calculation_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * late_payment_penalty_value, late_payment_cap_value,
            late_payment_calculation_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "late_payment_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия об ответственности поклажедателя за просрочку оплаты. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_payment_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие ответственности за просрочку оплаты. Внутреннее enum-поле."
          label: "Ответственность за просрочку оплаты"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "late_payment_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["remuneration", "expenses", "both", "other", "not_defined"]
          description: "Вид задолженности, к которой применяется ответственность. Внутреннее enum-поле."
          label: "Вид задолженности"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "late_payment_penalty_form"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["penalty", "interest", "damages", "other", "not_defined"]
          description: "Форма ответственности за просрочку оплаты. Внутреннее enum-поле."
          label: "Форма ответственности"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "late_payment_penalty_value"
          type: "string"
          presentation: "fact"
          label: "Размер ответственности"
          description: >
            Ставка или сумма ответственности за просрочку оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "late_payment_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие лимита ответственности за просрочку оплаты. Внутреннее enum-поле."
          required: true

        - name: "late_payment_cap_value"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности"
          description: >
            Значение лимита ответственности за просрочку оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

        - name: "late_payment_calculation_details"
          type: "string"
          presentation: "fact"
          label: "Порядок расчёта"
          description: >
            Порядок расчёта ответственности за просрочку оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 6

      store_payload: true

  - id: storage_change_notification
    name: "Уведомление поклажедателя об изменении условий хранения (п. 1 ст. 891 ГК РФ)"
    description: >
      Фактографическая проверка обязанности хранителя уведомить поклажедателя
      о необходимости изменения условий хранения вещи, а также о факте
      такого изменения. Правовой ориентир — п. 1 ст. 891 ГК РФ (хранитель
      обязан незамедлительно уведомить поклажедателя о необходимости
      изменения условий хранения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление об изменении условий"
        - "изменение условий хранения"
        - "уведомить поклажедателя"
        - "незамедлительное уведомление"
        - "согласование изменения условий"
        - "предварительное согласование"
        - "перемещение вещи"
        - "смена места хранения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомит[ьи].*(изменени|перемещени|смен)"
        - "(?i)изменени(е|я|ю)\\s+условий\\s+хранени"
        - "(?i)незамедлительн[оы].*(уведомит|сообщит)"
        - "(?i)(перемещени|смена).*(вещ|мест)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (п. 1 ст. 891 ГК РФ).
        Проверяется один вопрос: обязан ли хранитель уведомлять
        поклажедателя об изменении условий хранения, перемещении вещи
        или необходимости такого изменения.
        Нормативный ориентир:
        - п. 1 ст. 891 ГК РФ — хранитель обязан принять все
          предусмотренные договором меры для сохранности вещи; при
          необходимости изменения условий хранения хранитель обязан
          незамедлительно уведомить об этом поклажедателя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанность уведомления из ст. 891 ГК РФ — фиксируй
          только то, что прямо написано в договоре.
        - Отсутствие условия — не "yes", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли обязанность хранителя уведомлять поклажедателя
          об изменении условий хранения.
        2. О каких изменениях требуется уведомление (условия хранения /
          место / перемещение / иное).
        3. Требуется ли предварительное согласование изменений.
        4. Указаны ли форма, срок и порядок уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (notification_obligation_status /
            notification_subject / prior_approval_required) →
            "not_defined";
          - текстовое поле (notification_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. notification_obligation_status = "defined" — если прямо указана
          обязанность уведомить поклажедателя (в любой формулировке).
        5. notification_subject:
          - "conditions" — изменение условий хранения (температура,
            влажность, режим);
          - "place" — изменение места хранения / перемещение вещи;
          - "both" — оба предмета прямо указаны;
          - "other" — иной прямо названный предмет;
          - "not_defined" — предмет прямо не указан.
        6. prior_approval_required:
          - "yes" — прямо указано предварительное согласование изменений
            с поклажедателем;
          - "no" — прямо указано, что достаточно уведомления (без согласия);
          - "not_defined" — прямо не указано.
        7. notification_details — форма (письменно / электронно), срок
          (незамедлительно / за N дней), порядок уведомления.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "При необходимости изменения условий хранения либо перемещения
        вещи Хранитель обязан незамедлительно уведомить Поклажедателя
        письменно, а в случае изменения температурного режима — получить
        его предварительное письменное согласие."
        Ответ:
        {
          "notification_obligation_status": "defined",
          "notification_subject": "both",
          "prior_approval_required": "yes",
          "notification_details": "незамедлительное письменное уведомление; предварительное письменное согласие при изменении температурного режима",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При необходимости изменения условий хранения либо перемещения вещи Хранитель обязан незамедлительно уведомить Поклажедателя письменно, а в случае изменения температурного режима — получить его предварительное письменное согласие."
            }
          ]
        }

        Пример 2 (только уведомление, без согласования):
        Фрагмент:
        "О любом изменении места хранения вещи Хранитель уведомляет
        Поклажедателя в течение 1 рабочего дня."
        Ответ:
        {
          "notification_obligation_status": "defined",
          "notification_subject": "place",
          "prior_approval_required": "no",
          "notification_details": "уведомление в течение 1 рабочего дня об изменении места хранения",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "О любом изменении места хранения вещи Хранитель уведомляет Поклажедателя в течение 1 рабочего дня."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Хранитель обязан уведомлять Поклажедателя об изменении условий
        хранения."
        Ответ:
        {
          "notification_obligation_status": "defined",
          "notification_subject": "conditions",
          "prior_approval_required": "not_defined",
          "notification_details": "уведомление об изменении условий хранения (форма и срок не указаны)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель обязан уведомлять Поклажедателя об изменении условий хранения."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "notification_obligation_status": "not_defined",
          "notification_subject": "not_defined",
          "prior_approval_required": "not_defined",
          "notification_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли обязанность уведомления?
        2. Определён ли предмет уведомления?
        3. Требуется ли предварительное согласование?
        4. Приведены ли форма, срок и порядок уведомления?
        5. Выведена ли обязанность из текста договора, а не из п. 1
          ст. 891 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "notification_obligation_status": "<defined / not_defined>",
          "notification_subject": "<conditions / place / both / other / not_defined>",
          "prior_approval_required": "<yes / no / not_defined>",
          "notification_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление об изменении условий хранения изменение условий хранения уведомить поклажедателя незамедлительное уведомление согласование изменения условий предварительное согласование перемещение вещи смена места хранения ст. 891"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "storage_change_notification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об обязанности хранителя уведомлять поклажедателя об изменении
        условий хранения и/или перемещении вещи.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. storage_change_notification_presence:
           Агрегатное signal-поле — наличие условия об уведомлении
           об изменении условий хранения.
           - "present" — если хотя бы одно из содержательных полей
             (notification_obligation_status, notification_subject,
              prior_approval_required) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notification_obligation_status = "not_defined";
           - notification_subject = "not_defined";
           - prior_approval_required = "not_defined";
           - notification_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. notification_obligation_status:
           - "defined" — если в тексте прямо указана обязанность хранителя
             уведомлять поклажедателя об изменении условий хранения
             (в любой формулировке), либо прямо указано, что такое
             уведомление не производится (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. notification_subject:
           - "conditions" — изменение условий хранения (температура,
             влажность, режим);
           - "place" — изменение места хранения / перемещение вещи;
           - "both" — оба предмета прямо указаны;
           - "other" — иной прямо названный предмет;
           - "not_defined" — предмет прямо не указан.

        3. prior_approval_required:
           - "yes" — прямо указано предварительное согласование изменений
             с поклажедателем;
           - "no" — прямо указано, что достаточно уведомления без согласия;
           - "not_defined" — прямо не указано.

        4. notification_details:
           Краткая user-facing формулировка формы, срока и порядка
           уведомления.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни storage_change_notification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", notification_subject = "not_defined", prior_approval_required = "not_defined", notification_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, естественную убыль
          и иные нерелевантные темы.
        - Не выводи обязанность уведомления из п. 1 ст. 891 ГК РФ — только
          из текста.
        - notification_subject — по прямому указанию в тексте.
        - prior_approval_required = "yes" / "no" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности уведомления, ни предмета,
           ни порядка согласования.
           → presence = "missing";
             все *_status = "not_defined";
             notification_details = "Данные не определены".

        2. Обязанность упомянута без деталей.
           Например: "Хранитель обязан уведомлять Поклажедателя
           об изменении условий хранения", без указания формы и срока.
           → presence = "present";
             notification_obligation_status = "defined";
             notification_subject = "conditions";
             prior_approval_required = "not_defined";
             notification_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки или формы
           уведомления.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             notification_details = "Не удалось определить".

        4. Прямое указание об отсутствии уведомления.
           В договоре прямо указано, что хранитель вправе изменять
           условия хранения и место без уведомления поклажедателя.
           → presence = "present";
             notification_obligation_status = "defined" (прямое регулирование);
             notification_details содержит дословную цитату
             об отсутствии уведомления;
             остальные содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для storage_change_notification_presence используй только: "present", "missing", "unclear".
        - Для notification_obligation_status используй только: "defined", "not_defined".
        - Для notification_subject используй только: "conditions", "place", "both", "other", "not_defined".
        - Для prior_approval_required используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * notification_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * notification_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "storage_change_notification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия об уведомлении об изменении условий хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие обязанности уведомления об изменении условий хранения. Внутреннее enum-поле."
          label: "Обязанность уведомления"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notification_subject"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["conditions", "place", "both", "other", "not_defined"]
          description: "Предмет уведомления. Внутреннее enum-поле."
          label: "Предмет уведомления"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "prior_approval_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли предварительное согласование изменений. Внутреннее enum-поле."
          label: "Предварительное согласование"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "notification_details"
          type: "string"
          presentation: "fact"
          label: "Форма и срок уведомления"
          description: >
            Форма, срок и порядок уведомления поклажедателя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: gratuitous_storage_effects
    name: "Правовые последствия безвозмездного хранения (ст. 891, 897, 902 ГК РФ)"
    description: >
      Фактографическая проверка закреплённых в договоре последствий
      безвозмездного хранения: режим возмещения необходимых расходов
      хранителя, основания ответственности хранителя, стандарт заботы
      о вещи. Правовые ориентиры — п. 2 ст. 897 ГК РФ (возмещение
      необходимых расходов при безвозмездном хранении), п. 2 ст. 902 ГК РФ
      (ответственность за вину при безвозмездном хранении), п. 3 ст. 891 ГК РФ
      (забота о вещи не менее, чем о своей), ст. 924 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "безвозмездное хранение"
        - "безвозмездно"
        - "без оплаты"
        - "не взимается"
        - "обязан возместить расходы"
        - "необходимые расходы"
        - "ответственность при вине"
        - "забота о вещи"
        - "как о своей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безвозмездн(ое|ого|ым)\\s+хранени"
        - "(?i)хранени(е|я)\\s+безвозмездн"
        - "(?i)возмещени(е|я)\\s+необходим"
        - "(?i)как\\s+о\\s+сво(ей|ём)\\s+имуществ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 891, 897, 902, 924 ГК РФ).
        Проверяется один вопрос: какие правовые последствия безвозмездности
        закреплены в договоре — режим возмещения расходов, основания
        ответственности хранителя, стандарт заботы о вещи.
        Нормативные ориентиры:
        - п. 2 ст. 897 ГК РФ — при безвозмездном хранении поклажедатель
          обязан возместить хранителю необходимые расходы, понесённые
          для сохранения вещи, если иное не предусмотрено договором;
        - п. 2 ст. 902 ГК РФ — при безвозмездном хранении хранитель
          отвечает за утрату, недостачу или повреждение вещи только
          при наличии вины;
        - п. 3 ст. 891 ГК РФ — хранитель обязан заботиться о принятой
          на хранение вещи не менее, чем о своём имуществе;
        - ст. 924 ГК РФ — особенности хранения в гардеробах.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи последствия из ст. 897 / 902 ГК РФ — фиксируй только то,
          что прямо написано в договоре.
        - Отсутствие условия — не "yes", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплено ли, что хранение является безвозмездным.
        2. Указан ли режим возмещения необходимых расходов хранителя
          (возмещаются / не возмещаются / частично).
        3. Указан ли режим ответственности хранителя (за вину / независимо
          от вины).
        4. Указан ли стандарт заботы о вещи (как о своём имуществе / иной).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (gratuitous_status / expense_reimbursement_mode /
            liability_standard / care_standard) → "not_defined";
          - текстовое поле (gratuitous_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. gratuitous_status:
          - "yes" — прямо указано безвозмездное хранение;
          - "no" — прямо указано возмездное хранение;
          - "not_defined" — статус прямо не указан.
        5. expense_reimbursement_mode:
          - "reimbursable" — необходимые расходы возмещаются;
          - "not_reimbursable" — прямо указано, что расходы не возмещаются;
          - "partial" — прямо указано частичное возмещение;
          - "not_defined" — прямо не указано.
        6. liability_standard:
          - "fault_based" — прямо указано, что хранитель отвечает
            только при наличии вины;
          - "strict" — прямо указано, что хранитель отвечает независимо
            от вины;
          - "not_defined" — прямо не указано.
        7. care_standard:
          - "as_own" — прямо указано, что хранитель заботится о вещи
            не менее, чем о своём имуществе;
          - "other" — иной прямо названный стандарт;
          - "not_defined" — прямо не указано.
        8. gratuitous_details — конкретная формулировка из текста: режим
          расходов, стандарт ответственности, стандарт заботы.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Хранение вещи осуществляется безвозмездно. Поклажедатель возмещает
        Хранителю необходимые расходы, понесённые для сохранения вещи.
        Хранитель отвечает за утрату, недостачу или повреждение вещи
        только при наличии вины. Хранитель заботится о вещи не менее,
        чем о своём имуществе."
        Ответ:
        {
          "gratuitous_status": "yes",
          "expense_reimbursement_mode": "reimbursable",
          "liability_standard": "fault_based",
          "care_standard": "as_own",
          "gratuitous_details": "безвозмездное хранение; необходимые расходы возмещаются; ответственность только при вине; забота о вещи как о своём имуществе",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранение вещи осуществляется безвозмездно. Поклажедатель возмещает Хранителю необходимые расходы, понесённые для сохранения вещи."
            }
          ]
        }

        Пример 2 (только безвозмездность):
        Фрагмент:
        "Хранение вещи осуществляется безвозмездно."
        Ответ:
        {
          "gratuitous_status": "yes",
          "expense_reimbursement_mode": "not_defined",
          "liability_standard": "not_defined",
          "care_standard": "not_defined",
          "gratuitous_details": "безвозмездное хранение (последствия не раскрыты)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранение вещи осуществляется безвозмездно."
            }
          ]
        }

        Пример 3 (расходы не возмещаются):
        Фрагмент:
        "Хранение безвозмездно; расходы Хранителя на хранение
        не возмещаются и относятся на его счёт."
        Ответ:
        {
          "gratuitous_status": "yes",
          "expense_reimbursement_mode": "not_reimbursable",
          "liability_standard": "not_defined",
          "care_standard": "not_defined",
          "gratuitous_details": "безвозмездное хранение; расходы не возмещаются и относятся на счёт Хранителя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранение безвозмездно; расходы Хранителя на хранение не возмещаются и относятся на его счёт."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "gratuitous_status": "not_defined",
          "expense_reimbursement_mode": "not_defined",
          "liability_standard": "not_defined",
          "care_standard": "not_defined",
          "gratuitous_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Закреплена ли безвозмездность?
        2. Указан ли режим возмещения расходов?
        3. Указан ли стандарт ответственности?
        4. Указан ли стандарт заботы о вещи?
        5. Выведены ли последствия из текста договора, а не из ст. 897 / 902
          ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "gratuitous_status": "<yes / no / not_defined>",
          "expense_reimbursement_mode": "<reimbursable / not_reimbursable / partial / not_defined>",
          "liability_standard": "<fault_based / strict / not_defined>",
          "care_standard": "<as_own / other / not_defined>",
          "gratuitous_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "безвозмездное хранение безвозмездно без оплаты не взимается обязан возместить расходы необходимые расходы ответственность при вине забота о вещи как о своей ст. 897 ст. 902 ст. 891"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "limitations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "gratuitous_storage_effects_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о правовых последствиях безвозмездного хранения: режим возмещения
        расходов, основания ответственности хранителя, стандарт заботы
        о вещи.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. gratuitous_storage_effects_presence:
           Агрегатное signal-поле — наличие условия о безвозмездности
           и её правовых последствиях.
           - "present" — если хотя бы одно из содержательных полей
             (gratuitous_status, expense_reimbursement_mode,
              liability_standard, care_standard) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - gratuitous_status = "not_defined";
           - expense_reimbursement_mode = "not_defined";
           - liability_standard = "not_defined";
           - care_standard = "not_defined";
           - gratuitous_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. gratuitous_status:
           - "yes" — прямо указано безвозмездное хранение;
           - "no" — прямо указано возмездное хранение;
           - "not_defined" — статус прямо не указан.

        2. expense_reimbursement_mode:
           - "reimbursable" — прямо указано, что необходимые расходы
             хранителя возмещаются;
           - "not_reimbursable" — прямо указано, что расходы не возмещаются;
           - "partial" — прямо указано частичное возмещение;
           - "not_defined" — прямо не указано.

        3. liability_standard:
           - "fault_based" — прямо указано, что хранитель отвечает
             только при наличии вины;
           - "strict" — прямо указано, что хранитель отвечает независимо
             от вины;
           - "not_defined" — прямо не указано.

        4. care_standard:
           - "as_own" — прямо указано, что хранитель заботится о вещи
             не менее, чем о своём имуществе;
           - "other" — иной прямо названный стандарт;
           - "not_defined" — прямо не указано.

        5. gratuitous_details:
           Краткая user-facing формулировка режима расходов, стандарта
           ответственности и стандарта заботы.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни gratuitous_storage_effects_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", expense_reimbursement_mode = "not_defined", liability_standard = "not_defined", care_standard = "not_defined", gratuitous_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай страхование, естественную убыль и иные нерелевантные темы.
        - Не выводи последствия безвозмездности из ст. 897 / 902 ГК РФ —
          только из текста.
        - expense_reimbursement_mode = "reimbursable" / "not_reimbursable" /
          "partial" — по прямому указанию.
        - liability_standard = "fault_based" / "strict" — по прямому указанию.
        - care_standard = "as_own" / "other" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни безвозмездности, ни режима расходов,
           ни стандарта ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             gratuitous_details = "Данные не определены".

        2. Безвозмездность указана без последствий.
           Например: "Хранение вещи осуществляется безвозмездно",
           без указания режима расходов и ответственности.
           → presence = "present";
             gratuitous_status = "yes";
             expense_reimbursement_mode = "not_defined";
             liability_standard = "not_defined";
             care_standard = "not_defined";
             gratuitous_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы (безвозмездное
           в одном пункте, возмездное — в другом).
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             gratuitous_details = "Не удалось определить".

        4. Прямое указание последствий безвозмездности.
           В договоре прямо закреплены режим расходов, стандарт
           ответственности и/или стандарт заботы о вещи.
           → presence = "present";
             соответствующие *_status = "reimbursable" / "not_reimbursable" /
               "fault_based" / "as_own" и т.п.;
             gratuitous_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для gratuitous_storage_effects_presence используй только: "present", "missing", "unclear".
        - Для gratuitous_status используй только: "yes", "no", "not_defined".
        - Для expense_reimbursement_mode используй только: "reimbursable", "not_reimbursable", "partial", "not_defined".
        - Для liability_standard используй только: "fault_based", "strict", "not_defined".
        - Для care_standard используй только: "as_own", "other", "not_defined".
        - Fallback при отсутствии данных:
          * gratuitous_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * gratuitous_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "gratuitous_storage_effects_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о безвозмездности и её последствиях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "gratuitous_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возмездность / безвозмездность хранения. Внутреннее enum-поле."
          label: "Безвозмездность"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "expense_reimbursement_mode"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["reimbursable", "not_reimbursable", "partial", "not_defined"]
          description: "Режим возмещения необходимых расходов. Внутреннее enum-поле."
          label: "Возмещение расходов"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "liability_standard"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["fault_based", "strict", "not_defined"]
          description: "Стандарт ответственности хранителя. Внутреннее enum-поле."
          label: "Стандарт ответственности"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "care_standard"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["as_own", "other", "not_defined"]
          description: "Стандарт заботы о вещи. Внутреннее enum-поле."
          label: "Стандарт заботы"
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "gratuitous_details"
          type: "string"
          presentation: "fact"
          label: "Последствия безвозмездности"
          description: >
            Формулировка последствий безвозмездности из договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: special_storage_types
    name: "Специальные виды хранения: ломбард, секвестр, ячейки, камеры, гардероб"
    description: >
      Фактографическая проверка принадлежности договора к специальному
      виду хранения (ломбард, секвестр, банковская ячейка, камера хранения,
      гардероб) и наличия применимой специфики: ссылка на специальные
      нормы, оценка вещи, режим ответственности, порядок возврата.
      Правовые ориентиры — ст. 919–926 ГК РФ (специальные виды хранения),
      ФЗ от 19.07.2007 № 196-ФЗ (ломбарды).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ломбард"
        - "сохранная квитанция"
        - "секвестр"
        - "секвестр договорный"
        - "секвестр судебный"
        - "банковская ячейка"
        - "сейф"
        - "камера хранения"
        - "номерной жетон"
        - "гардероб"
        - "хранение в гостинице"
        - "ст. 919"
        - "ст. 922"
        - "ст. 923"
        - "ст. 924"
        - "ст. 926"
        - "ФЗ-196"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ломбард"
        - "(?i)секвестр"
        - "(?i)(банковск|индивидуальн).*(ячейк|сейф)"
        - "(?i)камер[аы]\\s+хранени"
        - "(?i)гардероб"
        - "(?i)ст\\.?\\s*(919|922|923|924|926)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения.
        Проверяется один вопрос: относится ли договор к специальному
        виду хранения (ломбард, секвестр, банковская ячейка, камера
        хранения, гардероб) и какие специфические условия закреплены
        в тексте.
        Нормативные ориентиры:
        - ст. 919 ГК РФ, ФЗ-196 — хранение в ломбарде (публичный договор,
          оценка вещи, именная сохранная квитанция);
        - ст. 922 ГК РФ — хранение в банке (с ответственностью банка
          за содержимое или без неё);
        - ст. 923 ГК РФ — хранение в камерах хранения (публичный договор,
          квитанция или номерной жетон);
        - ст. 924 ГК РФ — хранение в гардеробах;
        - ст. 926 ГК РФ — секвестр (договорный и судебный).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи специфику из специальных норм — фиксируй только то,
          что прямо написано в договоре.
        - Отсутствие условия — не "yes", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. К какому специальному виду относится договор.
        2. Указана ли ссылка на специальные нормы или закон (ФЗ-196,
          ст. 919–926 ГК РФ).
        3. Указана ли специфика вида (оценка вещи, режим ответственности,
          порядок возврата, квитанция).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (special_storage_status / storage_type_special /
            special_features_status) → "not_defined";
          - текстовые поля (legal_basis_reference / special_features_details)
            → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. special_storage_status = "defined" — если прямо указано, что
          договор относится к специальному виду хранения, либо прямо
          указаны особенности такого вида.
        5. storage_type_special:
          - "lombard" — ломбард;
          - "sequestration" — секвестр (договорный или судебный);
          - "bank_safe" — банковская ячейка / сейф;
          - "luggage_room" — камера хранения;
          - "wardrobe" — гардероб;
          - "other" — иной прямо названный специальный вид;
          - "not_defined" — вид прямо не указан.
        6. special_features_status = "defined" — если прямо указана
          специфика вида (оценка вещи, квитанция / жетон, режим
          ответственности, особый порядок возврата).
        7. legal_basis_reference — прямая ссылка на специальные нормы
          (ФЗ-196, ст. 919–926 ГК РФ, иные).
        8. special_features_details — конкретная формулировка специфики
          из текста.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (ломбард):
        Фрагмент:
        "Договор хранения в ломбарде удостоверяется именной сохранной
        квитанцией. Оценка вещи производится в соответствии
        с ФЗ от 19.07.2007 № 196-ФЗ."
        Ответ:
        {
          "special_storage_status": "defined",
          "storage_type_special": "lombard",
          "special_features_status": "defined",
          "legal_basis_reference": "ФЗ от 19.07.2007 № 196-ФЗ",
          "special_features_details": "именная сохранная квитанция; оценка вещи по ФЗ-196",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор хранения в ломбарде удостоверяется именной сохранной квитанцией."
            }
          ]
        }

        Пример 2 (банковская ячейка):
        Фрагмент:
        "Банк предоставляет клиенту индивидуальный банковский сейф
        для хранения ценностей без ответственности банка за содержимое."
        Ответ:
        {
          "special_storage_status": "defined",
          "storage_type_special": "bank_safe",
          "special_features_status": "defined",
          "legal_basis_reference": "Данные не определены",
          "special_features_details": "индивидуальный банковский сейф без ответственности банка за содержимое",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Банк предоставляет клиенту индивидуальный банковский сейф для хранения ценностей без ответственности банка за содержимое."
            }
          ]
        }

        Пример 3 (секвестр):
        Фрагмент:
        "Стороны заключают договор секвестра в отношении имущества,
        являющегося предметом судебного спора. Возврат вещи осуществляется
        лицу, которому она будет присуждена по решению суда."
        Ответ:
        {
          "special_storage_status": "defined",
          "storage_type_special": "sequestration",
          "special_features_status": "defined",
          "legal_basis_reference": "ст. 926 ГК РФ",
          "special_features_details": "секвестр имущества, являющегося предметом спора; возврат по решению суда",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны заключают договор секвестра в отношении имущества, являющегося предметом судебного спора."
            }
          ]
        }

        Пример 4 (ничего не указано — обычное хранение):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "special_storage_status": "not_defined",
          "storage_type_special": "not_defined",
          "special_features_status": "not_defined",
          "legal_basis_reference": "Данные не определены",
          "special_features_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли специальный вид хранения?
        2. Определён ли конкретный тип?
        3. Указана ли ссылка на специальные нормы?
        4. Приведена ли специфика вида?
        5. Выведена ли специфика из текста договора, а не из ст. 919–926
          ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "special_storage_status": "<defined / not_defined>",
          "storage_type_special": "<lombard / sequestration / bank_safe / luggage_room / wardrobe / other / not_defined>",
          "special_features_status": "<defined / not_defined>",
          "legal_basis_reference": "<текст или 'Данные не определены'>",
          "special_features_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ломбард сохранная квитанция секвестр договорный секвестр судебный банковская ячейка сейф камера хранения номерной жетон гардероб хранение в гостинице ст. 919 ст. 922 ст. 923 ст. 924 ст. 926 ФЗ-196 специальные виды хранения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "естественная убыль"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "boilerplate"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "special_storage_types_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о принадлежности к специальному виду хранения и применимой
        специфике.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. special_storage_types_presence:
           Агрегатное signal-поле — наличие признаков специального вида
           хранения.
           - "present" — если хотя бы одно из содержательных полей
             (special_storage_status, storage_type_special,
              special_features_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - special_storage_status = "not_defined";
           - storage_type_special = "not_defined";
           - special_features_status = "not_defined";
           - legal_basis_reference = "Данные не определены";
           - special_features_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. special_storage_status:
           - "defined" — если в тексте прямо указано, что договор
             относится к специальному виду хранения (ломбард, секвестр,
             банковская ячейка, камера хранения, гардероб) в любой
             формулировке;
           - "not_defined" — если прямого указания нет.

        2. storage_type_special:
           - "lombard" — ломбард;
           - "sequestration" — секвестр (договорный или судебный);
           - "bank_safe" — банковская ячейка / сейф;
           - "luggage_room" — камера хранения;
           - "wardrobe" — гардероб;
           - "other" — иной прямо названный специальный вид;
           - "not_defined" — вид прямо не указан.

        3. special_features_status:
           - "defined" — если прямо указана специфика вида (оценка вещи,
             квитанция / жетон, режим ответственности, особый порядок
             возврата);
           - "not_defined" — если специфика прямо не указана.

        4. legal_basis_reference:
           Краткая user-facing формулировка ссылки на специальные нормы
           (ФЗ-196, ст. 919–926 ГК РФ, иные).
           Fallback: "Данные не определены" / "Не удалось определить".

        5. special_features_details:
           Краткая user-facing формулировка специфики вида из текста.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни special_storage_types_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", storage_type_special = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, естественную убыль
          и иные нерелевантные темы.
        - Не выводи специфику из ст. 919–926 ГК РФ — только из текста.
        - storage_type_special — по прямому указанию в тексте.
        - special_features_status = "defined" — при прямом указании
          специфики вида.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни специального вида хранения, ни ссылок
           на специальные нормы.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Специальный вид указан без специфики.
           Например: "Хранение осуществляется в ломбарде", без указания
           квитанции, оценки вещи и режима ответственности.
           → presence = "present";
             special_storage_status = "defined";
             storage_type_special = "lombard";
             special_features_status = "not_defined";
             special_features_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные специальные виды.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             текстовые поля = "Не удалось определить".

        4. Специальный вид указан со спецификой.
           В договоре прямо закреплены особенности вида (квитанция,
           оценка, режим ответственности, порядок возврата).
           → presence = "present";
             special_storage_status = "defined";
             storage_type_special — по тексту;
             special_features_status = "defined";
             special_features_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для special_storage_types_presence используй только: "present", "missing", "unclear".
        - Для special_storage_status и special_features_status используй только: "defined", "not_defined".
        - Для storage_type_special используй только: "lombard", "sequestration", "bank_safe", "luggage_room", "wardrobe", "other", "not_defined".
        - Fallback при отсутствии данных:
          * legal_basis_reference, special_features_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * legal_basis_reference, special_features_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "special_storage_types_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
