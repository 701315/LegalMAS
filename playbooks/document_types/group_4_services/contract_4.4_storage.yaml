# CHECK 4: Ответственность профессионального хранителя (ст. 901 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: professional_custodian_liability
    name: "Ответственность хранителя: основание, объём, лимит (ст. 901, 902 ГК РФ)"
    description: >
      Фактографическая проверка условий ответственности хранителя за утрату,
      недостачу и повреждение вещи: основание ответственности (независимо от вины
      для профессионального хранителя), объём (полная стоимость / заявленная / лимит),
      исключение непреодолимой силы. Попытка ограничить ответственность
      профессионального хранителя «только при наличии вины» противоречит ст. 901 ГК РФ.
    triggers:
      any: ["professional_custodian"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "независимо от вины"
        - "полная материальная ответственность"
        - "профессиональный хранитель отвечает"
        - "возмещение полной стоимости"
        - "за исключением непреодолимой силы"
        - "ст. 901"
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "только при наличии вины"
        - "ограничение ответственности суммой вознаграждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)хранитель.*несёт.*ответственност.*независимо.*от.*вины"
        - "(?i)ст\\.?\\s*901"
        - "(?i)ответственност.*за.*(утрат|поврежден|недостач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 901, 902 ГК РФ).
        Проверяется только один вопрос: основание, объём и лимит ответственности
        хранителя за утрату, недостачу и повреждение вещи.
        Нормативный ориентир:
        - ст. 901 ГК РФ — ответственность профессионального хранителя независимо от вины
        - ст. 902 ГК РФ — размер ответственности
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Формулировки «отвечает только при наличии вины» для профессионального
          хранителя противоречат ст. 901 ГК РФ и ничтожны.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основание ответственности (независимо от вины / только при вине / смешанная).
        2. Объём ответственности (полная стоимость / заявленная / лимитированная).
        3. Исключение для непреодолимой силы.
        4. Наличие лимита (cap) ответственности.
        5. Указание на ответственность за утрату, недостачу и повреждение.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранитель несёт ответственность за утрату, недостачу и повреждение
        вещи независимо от вины, за исключением случаев непреодолимой силы.
        Возмещение производится в размере полной стоимости вещи."
        Ответ:
        {
          "liability_basis": "strict",
          "liability_scope": "full_value",
          "force_majeure_exception": "yes",
          "liability_cap_present": "no",
          "loss_damage_liability_status": "defined",
          "loss_damage_liability_details": "ответственность за утрату, недостачу и повреждение независимо от вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель несёт ответственность за утрату, недостачу и повреждение вещи независимо от вины, за исключением случаев непреодолимой силы."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель отвечает только при наличии вины."
        Ответ:
        {
          "liability_basis": "fault_based",
          "liability_scope": "not_defined",
          "force_majeure_exception": "not_defined",
          "liability_cap_present": "not_defined",
          "loss_damage_liability_status": "defined",
          "loss_damage_liability_details": "отвечает только при наличии вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель отвечает только при наличии вины."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определено ли основание ответственности — независимо от вины или по вине?
        2. Есть ли формулировка «только при наличии вины» (незаконно для профессионального)?
        3. Определён ли объём ответственности — полная стоимость или лимит?
        4. Есть ли исключение для непреодолимой силы?
        5. Есть ли cap на ответственность?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
