  - id: extraordinary_expenses
    name: "Чрезвычайные расходы на сохранность (ст. 898 ГК РФ)"
    description: >
      Фактографическая проверка условия возмещения чрезвычайных расходов
      на сохранность вещи (п. 1, 2 ст. 898 ГК РФ), порядка согласования /
      последующего одобрения и лимита расходов, которые хранитель вправе
      понести без согласования с поклажедателем.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "чрезвычайные расходы"
        - "неотложные меры"
        - "согласие поклажедателя"
        - "одобрение поклажедателя"
        - "в интересах поклажедателя"
        - "превышают обычные расходы"
        - "лимит расходов"
        - "ст. 898"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)чрезвычайн(ые|ых)\\s+расход"
        - "(?i)неотложн(ые|ых)\\s+мер"
        - "(?i)(согласи|одобрени).*поклажедател"
        - "(?i)в\\s+интересах\\s+поклажедател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 898 ГК РФ).
        Проверяется один вопрос: условия возмещения чрезвычайных расходов
        на сохранность вещи, порядок согласования и лимит расходов
        без согласования.
        Нормативные ориентиры:
        - п. 1 ст. 898 ГК РФ — расходы на хранение, превышающие обычные
          и произведённые в чрезвычайных обстоятельствах для сохранения
          вещи (чрезвычайные расходы), возмещаются хранителю, если
          поклажедатель дал согласие на эти расходы или одобрил их
          впоследствии;
        - п. 2 ст. 898 ГК РФ — при отсутствии согласия поклажедателя
          хранитель может требовать возмещения чрезвычайных расходов,
          если в силу закона или иного правового акта он не мог получить
          предварительное согласие и произвёл эти расходы в интересах
          поклажедателя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 898 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли возмещение чрезвычайных расходов.
        2. Условия возмещения (при согласии / при последующем одобрении /
          при невозможности получить согласие).
        3. Порядок согласования / одобрения (письменно, устно, электронно).
        4. Указан ли лимит расходов, которые хранитель вправе понести
          без согласования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (extraordinary_expenses_status /
            expense_limit_status) → "not_defined";
          - текстовые поля (extraordinary_expenses_conditions /
            approval_procedure_details / expense_limit_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. extraordinary_expenses_status = "defined" — если прямо указано
          возмещение чрезвычайных / неотложных расходов на сохранность вещи.
        5. extraordinary_expenses_conditions — формулировка условий возмещения
          («при согласии поклажедателя», «при последующем одобрении»,
          «если расходы произведены в интересах поклажедателя» и т. п.).
        6. approval_procedure_details — порядок согласования / одобрения:
          письменная форма, устное, электронная почта, заказным письмом и т. п.
        7. expense_limit_status = "defined" — если прямо указан лимит
          расходов, которые хранитель вправе понести без согласования.
        8. expense_limit_value — конкретное значение лимита с единицей
          измерения («не более 50 000 руб.», «до 10% от стоимости вещи»).
          Не голое число.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный — условия + порядок + лимит):
        Фрагмент:
        "Хранитель вправе произвести чрезвычайные расходы для сохранения
        вещи при предварительном письменном согласии Поклажедателя либо
        с последующим одобрением в течение 5 рабочих дней. Без согласования
        Хранитель вправе понести расходы не более 30 000 рублей."
        Ответ:
        {
          "extraordinary_expenses_status": "defined",
          "extraordinary_expenses_conditions": "при предварительном письменном согласии либо с последующим одобрением в течение 5 рабочих дней",
          "approval_procedure_details": "предварительное письменное согласие либо последующее одобрение",
          "expense_limit_status": "defined",
          "expense_limit_value": "не более 30 000 рублей без согласования",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе произвести чрезвычайные расходы для сохранения вещи при предварительном письменном согласии Поклажедателя либо с последующим одобрением в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2 (условия без лимита):
        Фрагмент:
        "Чрезвычайные расходы Хранителя возмещаются Поклажедателем,
        если Поклажедатель дал согласие на такие расходы или одобрил
        их впоследствии."
        Ответ:
        {
          "extraordinary_expenses_status": "defined",
          "extraordinary_expenses_conditions": "при согласии Поклажедателя или последующем одобрении",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "not_defined",
          "expense_limit_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Чрезвычайные расходы Хранителя возмещаются Поклажедателем, если Поклажедатель дал согласие на такие расходы или одобрил их впоследствии."
            }
          ]
        }

        Пример 3 (только лимит):
        Фрагмент:
        "Хранитель вправе без согласования Поклажедателя понести расходы
        на сохранность вещи в размере не более 5% от её стоимости."
        Ответ:
        {
          "extraordinary_expenses_status": "not_defined",
          "extraordinary_expenses_conditions": "Данные не определены",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "defined",
          "expense_limit_value": "не более 5% от стоимости вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе без согласования Поклажедателя понести расходы на сохранность вещи в размере не более 5% от её стоимости."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "extraordinary_expenses_status": "not_defined",
          "extraordinary_expenses_conditions": "Данные не определены",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "not_defined",
          "expense_limit_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрено ли возмещение чрезвычайных расходов?
        2. Определены ли условия возмещения (согласие / последующее одобрение)?
        3. Определён ли порядок согласования / одобрения?
        4. Указан ли лимит расходов без согласования?
        5. Выведены ли условия из текста договора, а не из ст. 898 ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "extraordinary_expenses_status": "<defined / not_defined>",
          "extraordinary_expenses_conditions": "<текст или 'Данные не определены'>",
          "approval_procedure_details": "<текст или 'Данные не определены'>",
          "expense_limit_status": "<defined / not_defined>",
          "expense_limit_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "чрезвычайные расходы неотложные меры согласие поклажедателя одобрение поклажедателя последующее одобрение в интересах поклажедателя превышают обычные расходы лимит расходов без согласования ст. 898"
