    name: "НДС и налоговые оговорки по вознаграждению хранителя"
    description: >
      Фактографическая проверка режима НДС и налоговых оговорок в отношении
      вознаграждения хранителя: включён ли НДС в цену, ставка, освобождение
      по ст. 149 НК РФ. Правовые ориентиры — ст. 146, 149, 164, 168 НК РФ.
      В гл. 47 ГК РФ норм о налогах нет — это договорное / налоговое условие.
