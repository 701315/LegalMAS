#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm|литр)"
  temperature_pattern: "(?i)(?:от\\s+)?[\\+\\-]?\\d+\\s*(?:°C|градус|до\\s+[\\+\\-]?\\d+)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "unlawful_liability_limitation_professional"
    name: "Незаконное ограничение ответственности профессионального хранителя (ст. 901 ГК РФ)"
    description: |
      Профессиональный хранитель отвечает за утрату, недостачу и повреждение вещи
      независимо от вины, кроме непреодолимой силы (ст. 901 ГК РФ). Попытка
      ограничить ответственность формулировками «только при наличии вины» — ничтожна.
    legal_base: "ст. 901 ГК РФ"
    required_triggers: ["professional_custodian"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "только при наличии вины"
        - "отвечает только за виновные действия"
        - "ограничение ответственности суммой вознаграждения"
      keyword_mode: "any"
      negative_keywords:
        - "независимо от вины"
        - "полная ответственность"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ответственность хранителя"
        - "независимо от вины"
        - "ст. 901"
      rerank: true

  - id: "dangerous_goods_storage_without_license"
    name: "Хранение опасных веществ без лицензии"
    description: |
      Хранение опасных веществ (взрывчатых, легковоспламеняющихся, токсичных,
      радиоактивных) требует специальной лицензии. Отсутствие лицензии —
      административная ответственность, риски для персонала и имущества.
    legal_base: "ФЗ № 116-ФЗ «О промышленной безопасности», ФЗ № 99-ФЗ «О лицензировании»"
    required_triggers: ["dangerous_goods_storage"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "опасные вещества"
        - "легковоспламеняющиеся"
        - "токсичные"
        - "взрывоопасные"
        - "лицензия"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "опасные вещества"
        - "лицензия"
        - "промышленная безопасность"
      rerank: true

  - id: "consumer_early_return_penalty"
    name: "Штраф за досрочный возврат вещи потребителем — ничтожен (ст. 904 ГК РФ)"
    description: |
      Поклажедатель-потребитель вправе забрать вещь в любой момент (ст. 904 ГК РФ).
      Любые штрафы за досрочный возврат ничтожны для потребителей.
    legal_base: "ст. 904 ГК РФ, Закон о защите прав потребителей"
    required_triggers: ["consumer_custodian"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "штраф за досрочный возврат"
        - "неустойка за расторжение"
        - "потребитель"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "досрочный возврат"
        - "штраф"
        - "потребитель"
        - "ст. 904"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: storage_subject_extraction
    name: "Хранение: извлечение предмета — описание вещи, количество, стоимость"
    description: "Извлекает характеристики хранимой вещи, количество, заявленную стоимость"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "предмет хранения"
        - "вещь"
        - "товар"
        - "имущество"
        - "количество"
        - "вес"
        - "объём"
        - "стоимость"
        - "заявленная стоимость"
        - "оценочная стоимость"
        - "родовые вещи"
        - "индивидуально-определённая"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(вещь|товар|имущество).*передаётся.*на.*хранение"
        - "(?i)количество.*\\d"
        - "(?i)стоимост(ь|и).*\\d"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор хранения.
        Найди в тексте сведения о предмете хранения.

        Ответь строго в JSON:
        {
          "item_description": "<описание вещи или not_found>",
          "item_type": "<individual / generic / not_specified / not_found>",
