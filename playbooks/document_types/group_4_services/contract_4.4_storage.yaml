    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "depositor_inspection_right_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о праве поклажедателя проверять состояние вещи и доступе к месту
        хранения.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. depositor_inspection_right_presence:
           Агрегатное signal-поле — наличие условий о праве проверки
           вещи поклажедателем.
           - "present" — если хотя бы одно из содержательных полей
             (inspection_right_status, access_right_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - inspection_right_status = "not_defined";
           - access_right_status = "not_defined";
           - inspection_conditions_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. inspection_right_status:
           - "yes" — прямо указано право проверки / осмотра вещи;
           - "no" — прямо указано, что проверка / осмотр не допускается;
           - "not_defined" — прямо не указано.

        2. access_right_status:
           - "yes" — прямо указан доступ к месту хранения;
           - "no" — прямо указано, что доступ не допускается;
           - "not_defined" — прямо не указано.

        3. inspection_conditions_details:
           Краткая user-facing формулировка порядка проверки
           (предварительное уведомление, периодичность, время,
            состав комиссии), ограничений.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни depositor_inspection_right_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", inspection_conditions_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи право проверки из ст. 891 ГК РФ — только из текста.
        - inspection_right_status = "yes" / "no" — по прямому указанию.
        - access_right_status = "yes" / "no" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права проверки, ни доступа к месту хранения.
           → presence = "missing";
             все *_status = "not_defined";
             inspection_conditions_details = "Данные не определены".

        2. Право проверки упомянуто без деталей.
           Например: "Поклажедатель вправе проверять состояние вещи",
           без указания порядка и периодичности.
           → presence = "present";
             inspection_right_status = "yes";
             access_right_status = "not_defined";
             inspection_conditions_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы проверки
           (где-то разрешено, где-то запрещено).
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             inspection_conditions_details = "Не удалось определить".

        4. Прямой запрет доступа.
           В договоре прямо указано, что доступ поклажедателя
           к месту хранения не допускается.
           → presence = "present";
             access_right_status = "no" (прямое регулирование);
             inspection_right_status = "not_defined"
               (если прямо не указано);
             inspection_conditions_details содержит дословную цитату запрета.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для depositor_inspection_right_presence используй только: "present", "missing", "unclear".
        - Для inspection_right_status и access_right_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * inspection_conditions_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * inspection_conditions_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "depositor_inspection_right_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о праве проверки вещи поклажедателем. Внутреннее агрегатное signal-поле."
          required: true

        - name: "inspection_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие права проверки / осмотра вещи. Внутреннее enum-поле."
          label: "Право проверки"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "access_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие доступа к месту хранения. Внутреннее enum-поле."
          label: "Доступ к месту хранения"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "inspection_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Условия проверки"
          description: >
            Порядок, периодичность и ограничения проверки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: custodian_damages_recovery
    name: "Возмещение убытков, причинённых хранителю вещью (ст. 903 ГК РФ)"
    description: >
      Фактографическая проверка условия о возмещении поклажедателем убытков,
      причинённых хранителю свойствами сданной на хранение вещи. Правовой
      ориентир — ст. 903 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "убытки хранителя"
        - "возмещение убытков"
        - "свойства вещи"
        - "вред имуществу хранителя"
        - "ущерб хранителю"
        - "повреждение имущества хранителя"
        - "ст. 903"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)убытк(и|ов).*хранител"
        - "(?i)(возмещ|компенсац).*убытк"
        - "(?i)(вред|ущерб).*(хранител|имуществ)"
        - "(?i)ст\\.?\\s*903"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 903 ГК РФ).
        Проверяется один вопрос: возмещение поклажедателем убытков,
        причинённых хранителю свойствами сданной на хранение вещи.
        Нормативный ориентир:
        - ст. 903 ГК РФ — убытки, причинённые хранителю свойствами
          сданной на хранение вещи, возмещаются поклажедателем, если
          последний не докажет, что эти свойства хранителю не были известны
          и не должны были быть известны при принятии вещи на хранение.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 903 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли возмещение убытков, причинённых хранителю вещью.
        2. Кто несёт такие убытки (поклажедатель / иное).
        3. Указаны ли основания освобождения поклажедателя от возмещения
          (незнание о свойствах вещи).
        4. Порядок возмещения (по документам / по оценке / иное).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (damages_recovery_status / damage_bearer) →
            "not_defined";
          - текстовые поля (damages_recovery_details /
            liability_exclusions) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. damages_recovery_status = "defined" — если прямо предусмотрено
          возмещение убытков хранителю от свойств вещи.
        5. damage_bearer = "depositor" — поклажедатель; "custodian" —
          хранитель; "both" — распределение; "not_defined".
        6. liability_exclusions — основания освобождения поклажедателя
          (например, «если хранитель знал о свойствах», «если убытки
          причинены вследствие непреодолимой силы»).
        7. damages_recovery_details — порядок возмещения (по документам,
          по оценке независимого эксперта, в срок N дней).
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Убытки, причинённые Хранителю свойствами сданной на хранение вещи,
        возмещаются Поклажедателем в полном объёме, если Поклажедатель
        не докажет, что о таких свойствах Хранитель знал или должен был знать
        при принятии вещи. Возмещение производится по подтверждающим
        документам в течение 10 рабочих дней с даты получения требования."
        Ответ:
        {
          "damages_recovery_status": "defined",
          "damage_bearer": "depositor",
          "liability_exclusions": "если хранитель знал или должен был знать о свойствах вещи при принятии",
          "damages_recovery_details": "по подтверждающим документам в течение 10 рабочих дней с даты получения требования",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Убытки, причинённые Хранителю свойствами сданной на хранение вещи, возмещаются Поклажедателем в полном объёме, если Поклажедатель не докажет, что о таких свойствах Хранитель знал или должен был знать при принятии вещи."
            }
          ]
        }

        Пример 2 (без освобождений):
        Фрагмент:
        "Поклажедатель возмещает Хранителю убытки, причинённые вещью,
        в полном объёме."
        Ответ:
        {
          "damages_recovery_status": "defined",
          "damage_bearer": "depositor",
          "liability_exclusions": "не указаны",
          "damages_recovery_details": "возмещение в полном объёме, порядок не указан",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель возмещает Хранителю убытки, причинённые вещью, в полном объёме."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Хранитель вправе требовать возмещения убытков, причинённых
        хранимой вещью."
        Ответ:
        {
          "damages_recovery_status": "defined",
          "damage_bearer": "not_defined",
          "liability_exclusions": "Данные не определены",
          "damages_recovery_details": "право требования возмещения убытков хранителем",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе требовать возмещения убытков, причинённых хранимой вещью."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "damages_recovery_status": "not_defined",
          "damage_bearer": "not_defined",
          "liability_exclusions": "Данные не определены",
          "damages_recovery_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрено ли возмещение убытков хранителю?
        2. Определён ли субъект возмещения?
        3. Указаны ли основания освобождения?
        4. Приведён ли порядок возмещения?
        5. Выведены ли условия из текста договора, а не из ст. 903 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "damages_recovery_status": "<defined / not_defined>",
          "damage_bearer": "<depositor / custodian / both / not_defined>",
          "liability_exclusions": "<текст или 'Данные не определены'>",
          "damages_recovery_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "indemnification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "убытки хранителя возмещение убытков свойства вещи вред имуществу хранителя ущерб хранителю повреждение имущества хранителя освобождение от возмещения ст. 903"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
