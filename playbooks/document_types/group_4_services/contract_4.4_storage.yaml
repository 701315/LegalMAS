        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Поклажедатель обязан письменно предупредить Хранителя об опасных
        свойствах вещи до передачи на хранение. Хранитель вправе уничтожить
        или обезвредить опасную вещь за счёт Поклажедателя без возмещения
        её стоимости. Ответственность за сокрытие опасных свойств несёт Поклажедатель."
        Ответ:
        {
          "disclosure_obligation_status": "defined",
          "dangerous_properties_listed": "no",
          "destruction_right": "yes",
          "liability_for_non_disclosure": "yes",
          "license_mentioned": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Поклажедатель обязан письменно предупредить Хранителя об опасных свойствах вещи до передачи на хранение."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель принимает вещь на хранение."
        Ответ:
        {
          "disclosure_obligation_status": "not_defined",
          "dangerous_properties_listed": "not_defined",
          "destruction_right": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "license_mentioned": "not_defined",
          "evidence": []
