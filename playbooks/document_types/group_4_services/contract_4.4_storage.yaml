          display_priority: 4

      store_payload: true

  - id: public_warehouse_status
    name: "Публичность договора складского хранения (ст. 907 ГК РФ)"
    description: >
      Фактографическая проверка публичности договора складского хранения:
      является ли товарный склад складом общего пользования, закреплены
      ли в договоре последствия публичности (обязанность заключать договор
      с любым обратившимся, единая ценовая политика, отсутствие дискриминации).
      Правовой ориентир — ст. 907 ГК РФ, ст. 426 ГК РФ (публичный договор).
    triggers:
      any: ["warehouse_storage"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "склад общего пользования"
        - "товарный склад"
        - "публичный договор"
        - "публичный склад"
        - "обязан заключить договор"
        - "единая цена"
        - "единый тариф"
        - "без дискриминации"
        - "ст. 907"
        - "ст. 426"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)склад(а)?\\s+общего\\s+пользовани"
        - "(?i)публичн(ый|ого)\\s+(договор|склад)"
        - "(?i)ст\\.?\\s*(907|426)"
        - "(?i)едины[йх]\\s+(цен|тариф)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 907, 426 ГК РФ).
        Проверяется один вопрос: является ли товарный склад складом
        общего пользования (публичный договор) и какие последствия
        публичности закреплены в тексте.
        Нормативные ориентиры:
        - ст. 907 ГК РФ — товарный склад признаётся складом общего
          пользования, если из закона, иных правовых актов или выданного
          разрешения (лицензии) вытекает, что склад обязан принимать
          товары на хранение от любого товаровладельца;
        - ст. 426 ГК РФ — публичный договор: коммерческая организация
          обязана заключить договор с каждым обратившимся; цена и иные
          условия одинаковы для всех потребителей, кроме льгот
          для отдельных категорий.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи публичность из ст. 907 ГК РФ — фиксируй только то,
          что прямо написано в договоре.
        - Отсутствие условия — не "yes", а "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли, что склад является складом общего пользования
          (публичный договор).
        2. Закреплены ли последствия публичности (обязанность заключить
          договор с любым обратившимся, единая ценовая политика).
        3. Указана ли ссылка на ст. 907 или ст. 426 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (warehouse_public_status /
            public_contract_consequences_status /
            uniform_pricing_status) → "not_defined";
          - текстовые поля (legal_basis_reference /
            public_warehouse_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. warehouse_public_status:
          - "yes" — прямо указано, что склад является складом общего
            пользования / договор является публичным;
          - "no" — прямо указано, что склад не является складом общего
            пользования;
          - "not_defined" — статус прямо не указан.
        5. public_contract_consequences_status = "defined" — если прямо
          закреплены последствия публичности (обязанность заключать
          договор с любым обратившимся, запрет отказа).
        6. uniform_pricing_status:
          - "yes" — прямо указана единая цена / тариф для всех
            товаровладельцев;
          - "no" — прямо указано, что цена индивидуальна;
          - "not_defined" — прямо не указано.
        7. legal_basis_reference — прямая ссылка на ст. 907 / 426 ГК РФ
          или иные нормы о публичности.
        8. public_warehouse_details — конкретная формулировка из текста.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Склад является складом общего пользования и обязан принимать
        товары на хранение от любого товаровладельца. Цены и тарифы
        на услуги едины для всех обратившихся и устанавливаются
        прейскурантом склада."
        Ответ:
        {
          "warehouse_public_status": "yes",
          "public_contract_consequences_status": "defined",
          "uniform_pricing_status": "yes",
          "legal_basis_reference": "ст. 907 ГК РФ",
          "public_warehouse_details": "склад общего пользования; обязан принимать товары от любого товаровладельца; единые цены и тарифы по прейскуранту",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Склад является складом общего пользования и обязан принимать товары на хранение от любого товаровладельца."
            }
          ]
        }

        Пример 2 (только публичность):
        Фрагмент:
        "Настоящий договор является публичным договором складского
        хранения в соответствии со ст. 426 ГК РФ."
        Ответ:
        {
          "warehouse_public_status": "yes",
          "public_contract_consequences_status": "not_defined",
          "uniform_pricing_status": "not_defined",
          "legal_basis_reference": "ст. 426 ГК РФ",
          "public_warehouse_details": "публичный договор складского хранения",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Настоящий договор является публичным договором складского хранения в соответствии со ст. 426 ГК РФ."
            }
          ]
        }

        Пример 3 (только единая цена):
        Фрагмент:
        "Услуги склада оказываются по единому прейскуранту,
        обязательному для всех товаровладельцев."
        Ответ:
        {
          "warehouse_public_status": "not_defined",
          "public_contract_consequences_status": "not_defined",
          "uniform_pricing_status": "yes",
          "legal_basis_reference": "Данные не определены",
          "public_warehouse_details": "единый прейскурант для всех товаровладельцев",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Услуги склада оказываются по единому прейскуранту, обязательному для всех товаровладельцев."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает товар Поклажедателя на хранение."
        Ответ:
        {
          "warehouse_public_status": "not_defined",
          "public_contract_consequences_status": "not_defined",
          "uniform_pricing_status": "not_defined",
          "legal_basis_reference": "Данные не определены",
          "public_warehouse_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли, что склад — общего пользования (публичный)?
        2. Закреплены ли последствия публичности?
        3. Указана ли единая ценовая политика?
        4. Есть ли ссылка на ст. 907 / 426 ГК РФ?
        5. Выведен ли статус из текста договора, а не из ст. 907 ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "warehouse_public_status": "<yes / no / not_defined>",
          "public_contract_consequences_status": "<defined / not_defined>",
          "uniform_pricing_status": "<yes / no / not_defined>",
          "legal_basis_reference": "<текст или 'Данные не определены'>",
          "public_warehouse_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "склад общего пользования товарный склад публичный договор публичный склад обязан заключить договор единая цена единый тариф без дискриминации ст. 907 ст. 426"
