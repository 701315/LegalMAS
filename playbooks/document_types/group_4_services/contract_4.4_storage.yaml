        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право проверки проверка состояния вещи осмотр вещи доступ к вещи доступ к месту хранения контроль хранения предварительное уведомление периодичность проверки ст. 891"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
