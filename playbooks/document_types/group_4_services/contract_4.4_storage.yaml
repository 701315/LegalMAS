        1. Обязанность поклажедателя раскрыть опасные свойства.
        2. Перечислены ли конкретные опасные свойства.
        3. Право хранителя уничтожить опасную вещь.
        4. Ответственность поклажедателя за сокрытие.
        5. Указание на лицензию на хранение опасных веществ.

        [ПРАВИЛА]
