        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "warehouse_certificate_issuance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о складском свидетельстве: вид, момент выдачи, передача прав, залог.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. warehouse_certificate_issuance_presence:
           Агрегатное signal-поле — наличие условий выдачи складского свидетельства.
           - "present" — если хотя бы одно из содержательных полей
             (certificate_mentioned, certificate_type, issuance_timing,
              transfer_allowed, pledge_allowed) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - certificate_mentioned = "not_defined";
           - certificate_type = "not_defined";
           - issuance_timing = "not_defined";
           - transfer_allowed = "not_defined";
           - pledge_allowed = "not_defined";
           - не выполняй остальные шаги.

        1. certificate_mentioned:
           - "defined" — если в тексте прямо упомянуто складское свидетельство
             (или его вид: двойное / простое / квитанция / варрант), либо прямо
             указано, что свидетельство не выдаётся (это тоже регулирование);
           - "not_defined" — если прямого упоминания нет.

        2. certificate_type:
           - "double" — прямо упомянуто двойное складское свидетельство
             (или отдельно варрант / залоговое свидетельство);
           - "simple" — прямо упомянуто простое складское свидетельство;
           - "warehouse_receipt" — прямо упомянута складская квитанция или
             именная складская расписка (не ценная бумага);
           - "not_defined" — вид прямо не указан.

        3. issuance_timing:
           - "upon_acceptance" — свидетельство выдаётся при приёме товара;
           - "upon_request" — по запросу / по требованию поклажедателя;
           - "not_defined" — момент прямо не указан.

        4. transfer_allowed:
           - "yes" — прямо указано право передачи свидетельства (индоссамент,
             вручение);
           - "no" — прямо запрещена передача;
           - "not_defined" — прямо не указано.

        5. pledge_allowed:
           - "yes" — прямо указано право залога товара по варранту /
             залоговому свидетельству;
           - "no" — прямо запрещён залог;
           - "not_defined" — прямо не указано.
           Для простого свидетельства / квитанции залог обычно не упоминается —
           оставляй "not_defined", если прямо не сказано.

        Если данные отсутствуют в тексте:
        - все сигнальные поля → "not_defined".

        Если данные есть, но противоречивы:
        - все сигнальные поля → "not_defined".
        </task>

        <context_rules>
        - Перед остальными полями заполни warehouse_certificate_issuance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность, возврат вещи, страхование
          и иные нерелевантные темы.
        - Не выводи условия из ст. 912–917 ГК РФ — только из текста.
        - certificate_type = "double" — при упоминании двойного свидетельства
          или отдельно варранта / залогового свидетельства.
        - certificate_type = "simple" — при упоминании простого складского свидетельства.
        - certificate_type = "warehouse_receipt" — при упоминании складской
          квитанции или именной расписки.
        - transfer_allowed = "yes" — при прямом указании права передачи
          (индоссамент, вручение); "no" — при прямом запрете.
        - pledge_allowed = "yes" — только при прямом указании залога по варранту.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить
          по тексту — все содержательные поля = "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания складского свидетельства, ни варранта,
           ни передачи прав, ни залога.
           → presence = "missing";
             все содержательные поля = "not_defined".

        2. Свидетельство упомянуто, детали не раскрыты.
           Например: "Хранитель выдаёт складское свидетельство",
           без указания вида, момента, передачи прав и залога.
           → presence = "present";
             certificate_mentioned = "defined";
             certificate_type = "not_defined";
             issuance_timing = "not_defined";
             transfer_allowed = "not_defined";
             pledge_allowed = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды свидетельства
           либо разные условия передачи / залога.
           → presence = "unclear";
             соответствующие содержательные поля = "not_defined".

        4. Прямое указание на отказ от выдачи свидетельства.
           В договоре прямо указано, что складское свидетельство не выдаётся
           (стороны ограничиваются актом приёма-передачи / распиской).
           → presence = "present";
             certificate_mentioned = "defined" (прямое регулирование);
             certificate_type = "not_defined";
             issuance_timing = "not_defined";
             transfer_allowed = "not_defined";
             pledge_allowed = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для warehouse_certificate_issuance_presence используй только: "present", "missing", "unclear".
        - Для certificate_mentioned используй только: "defined", "not_defined".
        - Для certificate_type используй только: "double", "simple", "warehouse_receipt", "not_defined".
        - Для issuance_timing используй только: "upon_acceptance", "upon_request", "not_defined".
        - Для transfer_allowed и pledge_allowed используй только: "yes", "no", "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "warehouse_certificate_issuance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий выдачи складского свидетельства. Внутреннее агрегатное signal-поле."
          required: true

        - name: "certificate_mentioned"
